/* ── math renderer ── */
function renderMath(el, text) {
  const parts = text.split(/(\$[^$]+\$)/g);
  el.innerHTML = "";
  parts.forEach(p => {
    if (p.startsWith("$")) {
      const s = document.createElement("span");
      katex.render(p.slice(1,-1), s, { throwOnError:false, displayMode:false });
      s.className = "mx-px text-emerald-900";
      el.appendChild(s);
    } else {
      el.appendChild(document.createTextNode(p));
    }
  });
}

      q: "19. Derive the condition for a planet of mass $M_P$ and radius $R_P$ to retain an atmosphere of molar mass $M_m$ at temperature $T_{\\mathrm{K}}$. Use the criterion $v_{\\mathrm{rms}} < v_{\\mathrm{esc}}/6$.",
      s: [
        "RMS thermal speed from kinetic theory: $v_{\\mathrm{rms}} = \\sqrt{\\dfrac{3R_g T_{\\mathrm{K}}}{M_m}}$, where $R_g = 8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}$.",
        "Escape speed: $v_{\\mathrm{esc}} = \\sqrt{\\dfrac{2GM_P}{R_P}}$.",
        "Retention condition $v_{\\mathrm{rms}} < v_{\\mathrm{esc}}/6$:",
        "$\\sqrt{\\dfrac{3R_g T_{\\mathrm{K}}}{M_m}} < \\dfrac{1}{6}\\sqrt{\\dfrac{2GM_P}{R_P}}$",
        "Square both sides: $\\dfrac{3R_g T_{\\mathrm{K}}}{M_m} < \\dfrac{GM_P}{18R_P}$",
        "$\\dfrac{T_{\\mathrm{K}}}{M_m} < \\dfrac{GM_P}{54\\,R_g\\,R_P}$",
        "Interpretation: heavy gas ($M_m$ large), cold temperature, massive/compact planet $\\Rightarrow$ easier to retain.",
        "Earth retains $\\mathrm{N_2}$ ($M_m = 0.028\\,\\mathrm{kg\\,mol^{-1}}$) and $\\mathrm{O_2}$ but loses $\\mathrm{H_2}$ ($M_m = 0.002\\,\\mathrm{kg\\,mol^{-1}}$) over geological timescales. The Moon retains nothing: $GM_M/R_M \\approx 1/22$ of Earth's value."
      ]
    },
    {
      q: "20. Show that the gravitational field of a uniform-density sphere of total mass $M$ is continuous at the surface $r = R$, and sketch $g(r)$ for $0 \\leq r < \\infty$ showing the behaviour inside and outside.",
      s: [
        "OUTSIDE ($r > R$): By the shell theorem, the entire mass $M$ acts as a point at the centre.",
        "$g_{\\mathrm{out}}(r) = \\dfrac{GM}{r^2}$ — decreases as $1/r^2$.",
        "INSIDE ($r < R$): Only enclosed mass $M(r) = M(r/R)^3$ contributes.",
        "$g_{\\mathrm{in}}(r) = \\dfrac{GM(r)}{r^2} = \\dfrac{GM}{R^3}r$ — increases linearly from 0 at centre to $GM/R^2$ at surface.",
        "AT THE SURFACE ($r = R$):",
        "$g_{\\mathrm{out}}(R) = \\dfrac{GM}{R^2}$, $\\quad g_{\\mathrm{in}}(R) = \\dfrac{GM}{R^3}\\cdot R = \\dfrac{GM}{R^2}$.",
        "Both match $\\Rightarrow$ $g(r)$ is continuous at $r = R$ ✓ (though its derivative $dg/dr$ is not — there is a kink).",
        "Sketch: $g$ rises linearly from 0 to $g_s = GM/R^2$ at $r = R$, then falls as $1/r^2$. Maximum is at the surface.",
        "Newton's Third Law: for any thin shell, the forces the shell exerts on interior mass and vice versa are equal and opposite — which is the physical basis of the shell theorem."
      ]
    }
  ]
};

/* ── state ── */
let formulasOpen = true;
let currentTab = "Easy";

/* ── formula box ── */
function buildFormulaBox() {
  const box = document.getElementById("formulaBox");
  box.innerHTML = "";
  formulas.forEach((f, fi) => {
    const card = document.createElement("div");
    card.className = "bg-white border border-emerald-100 rounded-xl p-3 shadow-sm";

    const title = document.createElement("div");
    title.className = "font-bold text-emerald-700 mb-1 text-sm";
    title.textContent = f.name;

    const fml = document.createElement("div");
    fml.className = "text-center my-2";
    renderMath(fml, f.formula);

    const when = document.createElement("div");
    when.className = "text-xs text-slate-500 mt-1";
    renderMath(when, "When: " + f.when);

    const sym = document.createElement("div");
    sym.className = "text-xs text-slate-400 mt-1";
    renderMath(sym, "Symbols: " + f.symbols);

    /* proof toggle */
    const proofBtn = document.createElement("button");
    proofBtn.className = "mt-2 text-xs font-semibold text-teal-600 hover:text-teal-800 flex items-center gap-1";
    proofBtn.innerHTML = `<span id="parrow-${fi}">▶</span> Show proof`;
    const proofBox = document.createElement("div");
    proofBox.style.display = "none";
    proofBox.className = "mt-2 bg-teal-50 border border-teal-200 rounded-lg p-2 space-y-1";
    f.proof.forEach(line => {
      const p = document.createElement("p");
      p.className = "text-xs text-slate-700 leading-relaxed";
      renderMath(p, line);
      proofBox.appendChild(p);
    });
    let pOpen = false;
    proofBtn.onclick = () => {
      pOpen = !pOpen;
      proofBox.style.display = pOpen ? "block" : "none";
      proofBox.className = pOpen ? "mt-2 bg-teal-50 border border-teal-200 rounded-lg p-2 space-y-1 animate-slide" : "mt-2 bg-teal-50 border border-teal-200 rounded-lg p-2 space-y-1";
      document.getElementById(`parrow-${fi}`).textContent = pOpen ? "▼" : "▶";
      proofBtn.innerHTML = `<span id="parrow-${fi}">${pOpen?"▼":"▶"}</span> ${pOpen?"Hide":"Show"} proof`;
    };

    card.appendChild(title);
    card.appendChild(fml);
    card.appendChild(when);
    card.appendChild(sym);
    card.appendChild(proofBtn);
    card.appendChild(proofBox);
    box.appendChild(card);
  });
}

function toggleFormulas() {
  formulasOpen = !formulasOpen;
  document.getElementById("formulaBox").style.display = formulasOpen ? "" : "none";
  document.getElementById("formulaArrow").textContent = formulasOpen ? "▲" : "▼";
}

/* ── question list ── */
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b, i) => {
    b.classList.toggle("active", ["Easy","Intermediate","Advanced"][i] === tab);
  });
  buildQuestions();
}

function buildQuestions() {
  const list = document.getElementById("questionList");
  list.innerHTML = "";
  questions[currentTab].forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden";

    const qRow = document.createElement("div");
    qRow.className = "p-4";

    const qText = document.createElement("p");
    qText.className = "text-slate-800 font-medium leading-relaxed";
    renderMath(qText, item.q);
    qRow.appendChild(qText);

    const btn = document.createElement("button");
    btn.className = "mt-3 text-sm font-semibold text-emerald-600 hover:text-emerald-800 flex items-center gap-1";
    btn.innerHTML = `<span id="sarrow-${idx}">▶</span> Show solution`;
    let open = false;

    const solBox = document.createElement("div");
    solBox.style.display = "none";

    btn.onclick = () => {
      open = !open;
      solBox.style.display = open ? "block" : "none";
      solBox.className = open ? "px-4 pb-4 animate-slide" : "px-4 pb-4";
      document.getElementById(`sarrow-${idx}`).textContent = open ? "▼" : "▶";
      btn.innerHTML = `<span id="sarrow-${idx}">${open?"▼":"▶"}</span> ${open?"Hide":"Show"} solution`;
    };
    qRow.appendChild(btn);

    const solCard = document.createElement("div");
    solCard.className = "bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-sm space-y-2";
    item.s.forEach(line => {
      const p = document.createElement("p");
      p.className = "text-slate-700 leading-relaxed";
      renderMath(p, line);
      solCard.appendChild(p);
    });
    solBox.appendChild(solCard);

    card.appendChild(qRow);
    card.appendChild(solBox);
    list.appendChild(card);
  });
}

/* ── footer ── */
function buildFooter() {
  const el = document.getElementById("footerLine");
  renderMath(el,
    "$G = 6.674\\times10^{-11}\\,\\mathrm{N\\,m^2\\,kg^{-2}}$, " +
    "$g_E = 9.8\\,\\mathrm{m\\,s^{-2}}$, " +
    "$M_E = 5.97\\times10^{24}\\,\\mathrm{kg}$, " +
    "$R_E = 6.37\\times10^6\\,\\mathrm{m}$, " +
    "$M_\\odot = 1.99\\times10^{30}\\,\\mathrm{kg}$, " +
    "$M_{\\mathrm{Moon}} = 7.35\\times10^{22}\\,\\mathrm{kg}$, " +
    "$r_{EM} = 3.84\\times10^8\\,\\mathrm{m}$."
  );
}

/* ── init ── */
document.addEventListener("DOMContentLoaded", () => {
  function waitForKatex() {
    if (typeof katex === "undefined") { setTimeout(waitForKatex, 50); return; }
    buildFormulaBox();
    buildQuestions();
    buildFooter();
  }
  waitForKatex();
});
</script>
</body>
</html>
