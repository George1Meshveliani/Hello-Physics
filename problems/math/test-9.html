KA: $\dfrac{1}{4} + 0{,}15 \cdot 5 - \dfrac{3}{8} \cdot 2 =$
EN: $\dfrac{1}{4} + 0.15 \cdot 5 - \dfrac{3}{8} \cdot 2 =$
OKA: $\dfrac{1}{4}$
$1$
$0{,}75$
$\dfrac{1}{2}$
OEN: $\dfrac{1}{4}$
$1$
$0.75$
$\dfrac{1}{2}$

$10$
$12$
$6$

$200$ მ

KA: იპოვეთ კუთხე საათის ისრებს შორის $3$ საათსა და $30$ წუთზე.
EN: Find the angle between the hands of a clock at $3{:}30$.
O: $105^\circ$
$60^\circ$
$75^\circ$
$90^\circ$
C: 3
SKA: წუთის ისარი: $30 \cdot 6^\circ = 180^\circ$; საათის ისარი: $3 \cdot 30^\circ + 30 \cdot 0{,}5^\circ = 105^\circ$

SEN: Minute hand: $30 \cdot 6^\circ = 180^\circ$; hour hand: $3 \cdot 30^\circ + 30 \cdot 0.5^\circ = 105^\circ$
$180^\circ - 105^\circ = 75^\circ$

$7$
C: 1

O: $\dfrac{5}{8}$

$\dfrac{1}{8}$
$\dfrac{3}{4}$

SEN: $x + y \ge 3$ is the corner triangle with vertices $(1; 2)$, $(2; 2)$, $(2; 1)$, area $\dfrac{1}{2}$
$P = 1 - \dfrac{1/2}{4} = \dfrac{7}{8}$

KA: $A$ და $B$ დამოუკიდებელი ხდომილობებია, $P(A) = 0{,}6$, $P(B) = 0{,}5$. იპოვეთ $P(A \cup B)$.
EN: $A$ and $B$ are independent events with $P(A) = 0.6$ and $P(B) = 0.5$. Find $P(A \cup B)$.
OKA: $0{,}8$
$0{,}9$
$1{,}1$
$0{,}3$
OEN: $0.8$
$0.9$
$1.1$
$0.3$
C: 1
SKA: დამოუკიდებლობა: $P(A \cap B) = 0{,}6 \cdot 0{,}5 = 0{,}3$
$P(A \cup B) = 0{,}6 + 0{,}5 - 0{,}3 = 0{,}8$
SEN: Independence: $P(A \cap B) = 0.6 \cdot 0.5 = 0.3$
$P(A \cup B) = 0.6 + 0.5 - 0.3 = 0.8$

KA: ამოხსენით განტოლება $|x - 1| + |x + 2| = 5$.
EN: Solve $|x - 1| + |x + 2| = 5$.
SKA: კრიტიკული წერტილები: $-2$ და $1$
$x < -2$: $-(x - 1) - (x + 2) = -2x - 1 = 5 \Rightarrow x = -3$ ✓
$-2 \le x \le 1$: $-(x - 1) + (x + 2) = 3 \ne 5$ — ამონახსნი არ არის
$x > 1$: $(x - 1) + (x + 2) = 2x + 1 = 5 \Rightarrow x = 2$ ✓
SEN: Critical points: $-2$ and $1$
$x < -2$: $-(x - 1) - (x + 2) = -2x - 1 = 5 \Rightarrow x = -3$ ✓
$-2 \le x \le 1$: $-(x - 1) + (x + 2) = 3 \ne 5$, no solution
$x > 1$: $(x - 1) + (x + 2) = 2x + 1 = 5 \Rightarrow x = 2$ ✓
AKA: $x = -3$ ან $x = 2$
AEN: $x = -3$ or $x = 2$

KA: ორი ბრიგადა ერთად მუშაობით სამუშაოს $12$ დღეში დაასრულებდა. $8$ დღის ერთობლივი მუშაობის შემდეგ პირველი ბრიგადა სხვა ობიექტზე გადაიყვანეს, ხოლო მეორემ დარჩენილი სამუშაო $7$ დღეში შეასრულა. რამდენ დღეში შეასრულებდა მთელ სამუშაოს თითოეული ბრიგადა ცალ-ცალკე?
EN: Two teams working together would finish a job in $12$ days. After $8$ days of joint work the first team was moved elsewhere, and the second finished the rest in $7$ days. How many days would each team need to do the whole job alone?
SKA: $8$ დღეში ერთად შესრულდა $\dfrac{8}{12} = \dfrac{2}{3}$ სამუშაო, დარჩა $\dfrac{1}{3}$
მეორე ბრიგადა $\dfrac{1}{3}$-ს $7$ დღეში ასრულებს: მთელს — $21$ დღეში
პირველის დღიური წარმადობა: $\dfrac{1}{12} - \dfrac{1}{21} = \dfrac{7 - 4}{84} = \dfrac{1}{28}$ — $28$ დღე
SEN: In $8$ days together they did $\dfrac{8}{12} = \dfrac{2}{3}$ of the job, leaving $\dfrac{1}{3}$
The second team does $\dfrac{1}{3}$ in $7$ days, so the whole job in $21$ days
The first team's daily rate: $\dfrac{1}{12} - \dfrac{1}{21} = \dfrac{7 - 4}{84} = \dfrac{1}{28}$, i.e. $28$ days
AKA: პირველი — $28$ დღეში, მეორე — $21$ დღეში
AEN: the first team in $28$ days, the second in $21$ days

KA: $a$ პარამეტრის რა მნიშვნელობებისთვის აქვს $x^2 - 4|x| + a = 0$ განტოლებას ა) ზუსტად სამი ამონახსნი; ბ) ზუსტად ოთხი ამონახსნი?
EN: For which $a$ does $x^2 - 4|x| + a = 0$ have (a) exactly three solutions; (b) exactly four solutions?
SKA: $t = |x| \ge 0$: $t^2 - 4t + a = 0$. ყოველი $t > 0$ ფესვი იძლევა ორ $x$-ს ($\pm t$), $t = 0$ — ერთს
ა) კენტი რაოდენობა $\Rightarrow t = 0$ ფესვია $\Rightarrow a = 0$: $t^2 - 4t = 0$, $t = 0$ ან $t = 4$ — ამონახსნები $0, \pm 4$ ✓
ბ) საჭიროა ორი განსხვავებული დადებითი $t$: $D = 16 - 4a > 0$ და $t_1t_2 = a > 0$ ($t_1 + t_2 = 4 > 0$)
$0 < a < 4$
SEN: Let $t = |x| \ge 0$: $t^2 - 4t + a = 0$. Each root $t > 0$ gives two values of $x$ ($\pm t$); $t = 0$ gives one
(a) An odd count needs $t = 0$ to be a root $\Rightarrow a = 0$: $t^2 - 4t = 0$, $t = 0$ or $t = 4$, giving $0, \pm 4$ ✓
(b) We need two distinct positive $t$: $D = 16 - 4a > 0$ and $t_1t_2 = a > 0$ (and $t_1 + t_2 = 4 > 0$)
$0 < a < 4$
AKA: ა) $a = 0$; ბ) $a \in (0; 4)$
AEN: (a) $a = 0$; (b) $a \in (0; 4)$
