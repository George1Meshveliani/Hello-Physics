KA: წრის რადიუსია $5$, ქორდა $AB = 8$. იპოვეთ $AB$-ზე დაყრდნობილი ცენტრალური კუთხის კოსინუსი და მცირე სეგმენტის ფართობი (დაახლოებით).
EN: A circle has radius $5$ and chord $AB = 8$. Find the cosine of the central angle on $AB$ and the minor segment's area (approx.).
HKA: კოსინუსების თეორემა $\triangle AOB$-ში.
HEN: The cosine rule in $\triangle AOB$.
SKA: $\cos\varphi = \dfrac{25 + 25 - 64}{50} = -0{,}28 \Rightarrow \varphi \approx 106{,}3^\circ$
$S \approx \dfrac{106{,}3}{360} \cdot 25\pi - 12 \approx 23{,}19 - 12 = 11{,}19$
SEN: $\cos\varphi = \dfrac{25 + 25 - 64}{50} = -0.28 \Rightarrow \varphi \approx 106.3^\circ$
$S \approx \dfrac{106.3}{360} \cdot 25\pi - 12 \approx 23.19 - 12 = 11.19$
AKA: $-0{,}28$; $\approx 11{,}2$
AEN: $-0.28$; $\approx 11.2$

--- hard geometry olympiad
KA: დაამტკიცეთ, რომ ნებისმიერ სამკუთხედში $a^2 + b^2 + c^2 = 2(b c \cos A + c a \cos B + a b \cos C)$.
EN: Prove that in any triangle $a^2 + b^2 + c^2 = 2(bc\cos A + ca\cos B + ab\cos C)$.
HKA: კოსინუსების თეორემა სამივე კუთხისთვის.
HEN: The cosine rule for all three angles.
SKA: $2bc\cos A = b^2 + c^2 - a^2$ და ა.შ.
შეკრიბეთ: $(b^2 + c^2 - a^2) + (c^2 + a^2 - b^2) + (a^2 + b^2 - c^2) = a^2 + b^2 + c^2$
SEN: $2bc\cos A = b^2 + c^2 - a^2$, and so on
Add: $(b^2 + c^2 - a^2) + (c^2 + a^2 - b^2) + (a^2 + b^2 - c^2) = a^2 + b^2 + c^2$
AKA: დამტკიცებულია
AEN: proved

--- hard geometry olympiad
KA: მართკუთხედის $ABCD$ შიგნით $P$ წერტილია. დაამტკიცეთ, რომ $PA^2 + PC^2 = PB^2 + PD^2$.
EN: $P$ is inside rectangle $ABCD$. Prove that $PA^2 + PC^2 = PB^2 + PD^2$.
HKA: კოორდინატები: $A(0;0)$, $B(a;0)$, $C(a;b)$, $D(0;b)$, $P(x;y)$.
HEN: Coordinates: $A(0;0)$, $B(a;0)$, $C(a;b)$, $D(0;b)$, $P(x;y)$.
SKA: $PA^2 + PC^2 = x^2 + y^2 + (a - x)^2 + (b - y)^2$
$PB^2 + PD^2 = (a - x)^2 + y^2 + x^2 + (b - y)^2$ — ტოლია
SEN: $PA^2 + PC^2 = x^2 + y^2 + (a - x)^2 + (b - y)^2$
$PB^2 + PD^2 = (a - x)^2 + y^2 + x^2 + (b - y)^2$ — equal
AKA: დამტკიცებულია
AEN: proved

--- hard geometry olympiad
KA: სამკუთხედის მედიანები $m_a = 9$, $m_b = 12$, $m_c = 15$. იპოვეთ სამკუთხედის ფართობი.
EN: A triangle's medians are $9$, $12$ and $15$. Find its area.
HKA: მედიანებისგან აგებული სამკუთხედის ფართობი $\dfrac{3}{4}$-ია თავდაპირველისა.
HEN: The triangle built from the medians has $\dfrac{3}{4}$ of the original area.
SKA: $9, 12, 15$ — მართკუთხა, ფართობი $54$
$S = \dfrac{4}{3} \cdot 54 = 72$
SEN: $9, 12, 15$ is right-angled with area $54$
$S = \dfrac{4}{3} \cdot 54 = 72$
AKA: $72$
AEN: $72$

--- hard geometry olympiad
KA: რომელ სამკუთხედს აქვს მოცემული პერიმეტრისას უდიდესი ფართობი? დაასაბუთეთ ჰერონის ფორმულით.
EN: Which triangle of given perimeter has the largest area? Justify with Heron's formula.
HKA: $S^2 = p(p - a)(p - b)(p - c)$; საშუალოების უტოლობა.
HEN: $S^2 = p(p - a)(p - b)(p - c)$; the AM–GM inequality.
SKA: $(p - a) + (p - b) + (p - c) = p$ — ჯამი მუდმივია
ნამრავლი მაქსიმალურია, როცა ისინი ტოლია: $a = b = c$
SEN: $(p - a) + (p - b) + (p - c) = p$ is fixed
The product is largest when they're equal: $a = b = c$
AKA: ტოლგვერდა
AEN: the equilateral one

--- easy transformations
KA: $A(-1;\ 4)$ გადაიტანეს $\vec{v}(5;\ -2)$-ით. იპოვეთ $A'$.
EN: $A(-1;\ 4)$ is translated by $\vec{v}(5;\ -2)$. Find $A'$.
HKA: დაუმატეთ ვექტორი.
HEN: Add the vector.
SKA: $(4;\ 2)$
SEN: $(4;\ 2)$
AKA: $(4;\ 2)$
AEN: $(4;\ 2)$

--- easy transformations
KA: იპოვეთ $B(3;\ -5)$-ის სიმეტრიული წერტილი სათავის მიმართ.
EN: Find the reflection of $B(3;\ -5)$ in the origin.
HKA: $(-x;\ -y)$.
HEN: $(-x;\ -y)$.
SKA: $(-3;\ 5)$
SEN: $(-3;\ 5)$
AKA: $(-3;\ 5)$
AEN: $(-3;\ 5)$

--- easy transformations
KA: $C(2;\ 6)$ ჰომოთეტიით, ცენტრი სათავე, $k = \dfrac{1}{2}$. იპოვეთ $C'$.
EN: Apply a homothety with centre the origin and $k = \dfrac{1}{2}$ to $C(2;\ 6)$.
HKA: გაამრავლეთ $k$-ზე.
HEN: Multiply by $k$.
SKA: $(1;\ 3)$
SEN: $(1;\ 3)$
AKA: $(1;\ 3)$
AEN: $(1;\ 3)$

--- easy transformations
KA: იპოვეთ $D(4;\ 1)$-ის სიმეტრიული $y = -x$ წრფის მიმართ.
EN: Reflect $D(4;\ 1)$ in the line $y = -x$.
HKA: $(x;\ y) \to (-y;\ -x)$.
HEN: $(x;\ y) \to (-y;\ -x)$.
SKA: $(-1;\ -4)$
SEN: $(-1;\ -4)$
AKA: $(-1;\ -4)$
AEN: $(-1;\ -4)$

--- easy transformations
KA: $E(5;\ 2)$ მოაბრუნეს სათავის ირგვლივ $90^\circ$-ით საათის ისრის მიმართულებით. იპოვეთ $E'$.
EN: $E(5;\ 2)$ is rotated $90^\circ$ clockwise about the origin. Find $E'$.
HKA: $(x;\ y) \to (y;\ -x)$.
HEN: $(x;\ y) \to (y;\ -x)$.
SKA: $(2;\ -5)$
SEN: $(2;\ -5)$
AKA: $(2;\ -5)$
AEN: $(2;\ -5)$

--- easy transformations
KA: რა გარდაქმნა გადაიყვანს $y = x^2$-ს $y = x^2 - 5$-ში?
EN: Which transformation takes $y = x^2$ to $y = x^2 - 5$?
HKA: ყოველი $y$ $5$-ით მცირდება.
HEN: Every $y$ drops by $5$.
SKA: გადატანა $\vec{v}(0;\ -5)$
SEN: Translation by $\vec{v}(0;\ -5)$
AKA: $5$-ით ქვემოთ
AEN: down $5$

--- easy transformations
KA: მონაკვეთი $AB = 6$-ს ჰომოთეტია $k = -3$-ით. რა სიგრძისაა სახე?
EN: A segment $AB = 6$ undergoes a homothety with $k = -3$. How long is the image?
HKA: $|k| \cdot AB$.
HEN: $|k| \cdot AB$.
SKA: $18$
SEN: $18$
AKA: $18$
AEN: $18$

--- easy transformations
KA: რომელი გარდაქმნები ინარჩუნებს მანძილებს: გადატანა, ბრუნვა, ღერძული სიმეტრია, ჰომოთეტია ($k = 2$)?
EN: Which preserve distances: translation, rotation, reflection, homothety ($k = 2$)?
HKA: მოძრაობები.
HEN: Isometries.
SKA: პირველი სამი — მოძრაობებია; ჰომოთეტია მანძილს $2$-ჯერ ზრდის
SEN: The first three are isometries; the homothety doubles distances
AKA: გადატანა, ბრუნვა, სიმეტრია
AEN: translation, rotation, reflection

--- medium transformations
KA: იპოვეთ $A(5;\ 1)$-ის სიმეტრიული $x = 2$ წრფის მიმართ.
EN: Reflect $A(5;\ 1)$ in the line $x = 2$.
HKA: $x' = 2 \cdot 2 - x$.
HEN: $x' = 2 \cdot 2 - x$.
SKA: $(-1;\ 1)$
SEN: $(-1;\ 1)$
AKA: $(-1;\ 1)$
AEN: $(-1;\ 1)$

--- medium transformations
KA: $B(3;\ 4)$ მოაბრუნეს $M(1;\ 2)$-ის ირგვლივ $90^\circ$-ით საათის ისრის საწინააღმდეგოდ. იპოვეთ $B'$.
EN: $B(3;\ 4)$ is rotated $90^\circ$ anticlockwise about $M(1;\ 2)$. Find $B'$.
HKA: $\overrightarrow{MB} = (2;\ 2) \to (-2;\ 2)$.
HEN: $\overrightarrow{MB} = (2;\ 2) \to (-2;\ 2)$.
SKA: $B' = M + (-2;\ 2) = (-1;\ 4)$
SEN: $B' = M + (-2;\ 2) = (-1;\ 4)$
AKA: $(-1;\ 4)$
AEN: $(-1;\ 4)$

--- medium transformations
KA: ჰომოთეტია ცენტრით $O(1;\ 1)$, $k = 3$. იპოვეთ $C(2;\ 3)$-ის სახე.
EN: A homothety has centre $O(1;\ 1)$ and $k = 3$. Find the image of $C(2;\ 3)$.
HKA: $C' = O + 3\overrightarrow{OC}$.
HEN: $C' = O + 3\overrightarrow{OC}$.
SKA: $\overrightarrow{OC} = (1;\ 2)$; $\ C' = (4;\ 7)$
SEN: $\overrightarrow{OC} = (1;\ 2)$; $\ C' = (4;\ 7)$
AKA: $(4;\ 7)$
AEN: $(4;\ 7)$

--- medium transformations
KA: სამკუთხედი $A(0;0)$, $B(2;0)$, $C(0;3)$ ჰომოთეტიით $k = 2$ (ცენტრი სათავე). როგორ შეიცვალა ფართობი?
EN: Triangle $A(0;0)$, $B(2;0)$, $C(0;3)$ undergoes a homothety with $k = 2$ about the origin. How does its area change?
HKA: ფართობი $k^2$-ჯერ.
HEN: Area scales by $k^2$.
SKA: $3 \to 12$ — $4$-ჯერ
SEN: $3 \to 12$ — $4$ times
AKA: $4$-ჯერ
AEN: $4$ times

--- medium transformations
KA: წრფე $y = 2x + 1$ გადაიტანეს $\vec{v}(3;\ 0)$-ით. ჩაწერეთ ახალი წრფე.
EN: The line $y = 2x + 1$ is translated by $\vec{v}(3;\ 0)$. Write the new line.
HKA: $x \to x - 3$.
HEN: Replace $x$ by $x - 3$.
SKA: $y = 2(x - 3) + 1 = 2x - 5$
SEN: $y = 2(x - 3) + 1 = 2x - 5$
AKA: $y = 2x - 5$
AEN: $y = 2x - 5$

--- medium transformations
KA: რა გარდაქმნაა $x$-ღერძის მიმართ სიმეტრია, შემდეგ $y = x$-ის მიმართ სიმეტრია?
EN: What single transformation is a reflection in the $x$-axis followed by a reflection in $y = x$?
HKA: მიჰყევით წერტილს $(x;\ y)$.
HEN: Follow a point $(x;\ y)$.
SKA: $(x;\ y) \to (x;\ -y) \to (-y;\ x)$ — ბრუნვა $90^\circ$-ით საათის ისრის საწინააღმდეგოდ
SEN: $(x;\ y) \to (x;\ -y) \to (-y;\ x)$ — a $90^\circ$ anticlockwise rotation
AKA: $90^\circ$ ბრუნვა
AEN: a $90^\circ$ rotation

--- hard transformations
KA: დაამტკიცეთ, რომ ორი ჰომოთეტიის ($k_1$, $k_2$, ერთი ცენტრი) შედგენა ჰომოთეტიაა $k_1 k_2$-ით.
EN: Prove that two homotheties with the same centre and factors $k_1$, $k_2$ compose to a homothety with factor $k_1 k_2$.
HKA: ცენტრი — სათავე: $P \to k_1 P \to k_2 k_1 P$.
HEN: With the centre at the origin: $P \to k_1 P \to k_2 k_1 P$.
SKA: $P \mapsto (k_1 k_2) P$ — ჰომოთეტია
SEN: $P \mapsto (k_1 k_2) P$ — a homothety
AKA: დამტკიცებულია
AEN: proved

--- hard transformations
KA: იპოვეთ $A(4;\ 0)$-ის სიმეტრიული $y = x + 2$ წრფის მიმართ.
EN: Reflect $A(4;\ 0)$ in the line $y = x + 2$.
HKA: შუაწერტილი წრფეზეა, $AA'$ მართობულია ($k = -1$).
HEN: The midpoint lies on the line and $AA'$ is perpendicular ($k = -1$).
SKA: $A'(a;\ b)$: $b = -(a - 4)$; $\ \dfrac{b}{2} = \dfrac{a + 4}{2} + 2$
$-a + 4 = a + 8 \Rightarrow a = -2$, $b = 6$
SEN: $A'(a;\ b)$: $b = -(a - 4)$; $\ \dfrac{b}{2} = \dfrac{a + 4}{2} + 2$
$-a + 4 = a + 8 \Rightarrow a = -2$, $b = 6$
AKA: $(-2;\ 6)$
AEN: $(-2;\ 6)$

--- hard transformations
KA: ორი ბრუნვის ($90^\circ$ სათავის ირგვლივ, შემდეგ $90^\circ$ $M(2;\ 0)$-ის ირგვლივ, ორივე საათის ისრის საწინააღმდეგოდ) შედგენა რა გარდაქმნაა?
EN: A $90^\circ$ anticlockwise rotation about the origin followed by a $90^\circ$ anticlockwise rotation about $M(2;\ 0)$ — what is the result?
HKA: მიჰყევით $(x;\ y)$-ს.
HEN: Follow $(x;\ y)$.
SKA: $(x;\ y) \to (-y;\ x)$; შემდეგ $M$-ის ირგვლივ: $(-y - 2;\ x) \to (-x;\ -y - 2) + (2;\ 0) = (2 - x;\ -y - 2)$
ეს $180^\circ$ ბრუნვაა $(1;\ -1)$-ის ირგვლივ
SEN: $(x;\ y) \to (-y;\ x)$; then about $M$: $(-y - 2;\ x) \to (-x;\ -y - 2) + (2;\ 0) = (2 - x;\ -y - 2)$
That is a $180^\circ$ rotation about $(1;\ -1)$
AKA: $180^\circ$ ბრუნვა $(1;\ -1)$-ის ირგვლივ
AEN: a $180^\circ$ rotation about $(1;\ -1)$

--- hard transformations
KA: პარაბოლა $y = x^2 - 4x + 7$ რა გადატანით მიიღება $y = x^2$-დან? იპოვეთ ვექტორი.
EN: Which translation takes $y = x^2$ to $y = x^2 - 4x + 7$? Find the vector.
HKA: $y = (x - 2)^2 + 3$.
HEN: $y = (x - 2)^2 + 3$.
SKA: $\vec{v}(2;\ 3)$
SEN: $\vec{v}(2;\ 3)$
AKA: $(2;\ 3)$
AEN: $(2;\ 3)$
