// ===================================================================== EASY

--- easy sets
KA: $A = \{1, 2, 3, 4, 5\}$, $B = \{4, 5, 6, 7\}$. იპოვეთ $A \cup B$, $A \cap B$ და $A \setminus B$.
EN: $A = \{1, 2, 3, 4, 5\}$, $B = \{4, 5, 6, 7\}$. Find $A \cup B$, $A \cap B$ and $A \setminus B$.
HKA: გაერთიანება — ყველა ელემენტი; თანაკვეთა — საერთო; სხვაობა $A \setminus B$ — $A$-ს ის ელემენტები, რომლებიც $B$-ში არ არის.
HEN: Union — all elements; intersection — common ones; difference $A \setminus B$ — elements of $A$ not in $B$.
SKA: $A \cup B = \{1, 2, 3, 4, 5, 6, 7\}$
$A \cap B = \{4, 5\}$
$A \setminus B = \{1, 2, 3\}$
SEN: $A \cup B = \{1, 2, 3, 4, 5, 6, 7\}$
$A \cap B = \{4, 5\}$
$A \setminus B = \{1, 2, 3\}$
AKA: $\{1,\dots,7\}$; $\{4, 5\}$; $\{1, 2, 3\}$
AEN: $\{1,\dots,7\}$; $\{4, 5\}$; $\{1, 2, 3\}$

--- easy sets
KA: ჩამოწერეთ $\{a, b, c\}$ სიმრავლის ყველა ქვესიმრავლე. რამდენია ისინი?
EN: List all subsets of $\{a, b, c\}$. How many are there?
HKA: არ დაგავიწყდეთ ცარიელი სიმრავლე და თავად სიმრავლე. $n$ ელემენტიან სიმრავლეს $2^n$ ქვესიმრავლე აქვს.
HEN: Don't forget the empty set and the set itself. A set with $n$ elements has $2^n$ subsets.
SKA: $\varnothing$; $\{a\}, \{b\}, \{c\}$; $\{a, b\}, \{a, c\}, \{b, c\}$; $\{a, b, c\}$
სულ $8 = 2^3$ — ყოველი ელემენტი ან შედის, ან არა.
SEN: $\varnothing$; $\{a\}, \{b\}, \{c\}$; $\{a, b\}, \{a, c\}, \{b, c\}$; $\{a, b, c\}$
$8 = 2^3$ in total — each element is either in or out.
AKA: $8$
AEN: $8$

--- easy logic
KA: დაადგინეთ, ჭეშმარიტია თუ მცდარი: ა) „$2$ მარტივი რიცხვია **და** $9$ მარტივი რიცხვია“; ბ) „$2$ მარტივი რიცხვია **ან** $9$ მარტივი რიცხვია“.
EN: Decide whether true or false: a) "$2$ is prime **and** $9$ is prime"; b) "$2$ is prime **or** $9$ is prime".
HKA: „და“ ჭეშმარიტია, როცა ორივე ნაწილი ჭეშმარიტია; „ან“ — როცა ერთი მაინც.
HEN: "And" is true when both parts are true; "or" when at least one is.
SKA: „$2$ მარტივია“ — ჭეშმარიტი; „$9$ მარტივია“ — მცდარი ($9 = 3 \cdot 3$).
ა) ჭ და მ $\Rightarrow$ **მცდარი**.
ბ) ჭ ან მ $\Rightarrow$ **ჭეშმარიტი**.
SEN: "$2$ is prime" — true; "$9$ is prime" — false ($9 = 3 \cdot 3$).
a) T and F $\Rightarrow$ **false**.
b) T or F $\Rightarrow$ **true**.
AKA: ა) მცდარი; ბ) ჭეშმარიტი
AEN: a) false; b) true

--- easy logic
KA: ჩამოაყალიბეთ გამონათქვამის უარყოფა: „კლასის ყველა მოსწავლემ ჩააბარა გამოცდა“.
EN: Write the negation of the statement: "All students in the class passed the exam".
HKA: „ყველა“-ს უარყოფა „არსებობს ერთი მაინც, რომელიც არა…“.
HEN: The negation of "all" is "there is at least one who does not…".
SKA: უარყოფა არ არის „არავინ ჩააბარა“ (ეს უფრო ძლიერი წინადადებაა).
სწორი უარყოფა: „კლასში არის ერთი მოსწავლე მაინც, რომელმაც ვერ ჩააბარა გამოცდა“.
SEN: The negation is not "nobody passed" (that is a stronger statement).
Correct negation: "There is at least one student in the class who did not pass the exam".
AKA: ერთმა მაინც ვერ ჩააბარა
AEN: at least one student did not pass

--- easy logic
KA: არის თუ არა „რიცხვი $4$-ზე იყოფა“ აუცილებელი პირობა იმისთვის, რომ „რიცხვი ლუწია“? საკმარისი პირობაა?
EN: Is "the number is divisible by $4$" a necessary condition for "the number is even"? Is it sufficient?
HKA: $A$ საკმარისია $B$-სთვის, თუ $A \Rightarrow B$; აუცილებელია, თუ $B \Rightarrow A$.
HEN: $A$ is sufficient for $B$ if $A \Rightarrow B$; necessary if $B \Rightarrow A$.
SKA: თუ რიცხვი $4$-ზე იყოფა, ის ლუწია — **საკმარისი** პირობაა.
$6$ ლუწია, მაგრამ $4$-ზე არ იყოფა (კონტრმაგალითი) — **არ არის აუცილებელი**.
SEN: If a number is divisible by $4$, it is even — a **sufficient** condition.
$6$ is even but not divisible by $4$ (counterexample) — **not necessary**.
AKA: საკმარისია, მაგრამ არ არის აუცილებელი
AEN: sufficient but not necessary

--- easy numbers
KA: ტელეფონის ფასი $1200$ ლარიდან $1500$ ლარამდე გაიზარდა. რამდენი პროცენტით გაიზარდა ფასი?
EN: A phone's price rose from $1200$ lari to $1500$ lari. By what percent did it rise?
HKA: პროცენტული ცვლილება = ცვლილება : საწყის მნიშვნელობაზე.
HEN: Percentage change = change ÷ original value.
SKA: $\dfrac{1500 - 1200}{1200} \cdot 100\% = \dfrac{300}{1200} \cdot 100\% = 25\%$
SEN: $\dfrac{1500 - 1200}{1200} \cdot 100\% = \dfrac{300}{1200} \cdot 100\% = 25\%$
AKA: $25\%$
AEN: $25\%$

--- easy numbers
KA: სიდიდის ზუსტი მნიშვნელობაა $10$, გაზომვამ მოგვცა $9{,}8$. იპოვეთ აბსოლუტური და ფარდობითი ცდომილება.
EN: The true value of a quantity is $10$ and a measurement gave $9.8$. Find the absolute and relative errors.
HKA: $\Delta = |x - x_0|$, $\ \delta = \dfrac{\Delta}{x_0}$.
HEN: $\Delta = |x - x_0|$, $\ \delta = \dfrac{\Delta}{x_0}$.
SKA: $\Delta = |9{,}8 - 10| = 0{,}2$
$\delta = \dfrac{0{,}2}{10} = 0{,}02 = 2\%$
SEN: $\Delta = |9.8 - 10| = 0.2$
$\delta = \dfrac{0.2}{10} = 0.02 = 2\%$
AKA: $0{,}2$; $2\%$
AEN: $0.2$; $2\%$

--- easy numbers
KA: სამომხმარებლო სესხი $1000$ ლარია, თვიური $2\%$-ით (მარტივი პროცენტი). რამდენი სარგებელი დაირიცხება $6$ თვეში?
EN: A consumer loan of $1000$ lari has simple interest of $2\%$ per month. How much interest is charged in $6$ months?
HKA: $I = S_0 \cdot \dfrac{p}{100} \cdot n$.
HEN: $I = S_0 \cdot \dfrac{p}{100} \cdot n$.
SKA: $I = 1000 \cdot 0{,}02 \cdot 6 = 120\ ₾$ — წლიურად ეს $24\%$-ია!
SEN: $I = 1000 \cdot 0.02 \cdot 6 = 120\ ₾$ — that is $24\%$ a year!
AKA: $120\ ₾$
AEN: $120\ ₾$

--- easy stats
KA: იპოვეთ მონაცემების $3, 5, 5, 6, 8, 9$ საშუალო, მედიანა და მოდა.
EN: Find the mean, median and mode of $3, 5, 5, 6, 8, 9$.
HKA: ლუწი რაოდენობის მონაცემებისთვის მედიანა ორი შუა რიცხვის საშუალოა.
HEN: For an even number of values the median is the mean of the two middle ones.
SKA: საშუალო: $\dfrac{3 + 5 + 5 + 6 + 8 + 9}{6} = \dfrac{36}{6} = 6$
მედიანა: $\dfrac{5 + 6}{2} = 5{,}5$
მოდა: $5$
SEN: Mean: $\dfrac{3 + 5 + 5 + 6 + 8 + 9}{6} = \dfrac{36}{6} = 6$
Median: $\dfrac{5 + 6}{2} = 5.5$
Mode: $5$
AKA: $6$; $5{,}5$; $5$
AEN: $6$; $5.5$; $5$

--- easy stats
KA: შემოწმებულ $1000$ ნათურიდან $23$ წუნდებული აღმოჩნდა. რას უდრის წუნდებული ნათურის სტატისტიკური ალბათობა? დაახლოებით რამდენი წუნდებული იქნება $5000$ ნათურაში?
EN: Of $1000$ bulbs tested, $23$ were faulty. What is the statistical probability of a faulty bulb? About how many faulty bulbs would you expect in $5000$?
HKA: სტატისტიკური ალბათობა = ფარდობითი სიხშირე.
HEN: Statistical probability = relative frequency.
SKA: $P \approx \dfrac{23}{1000} = 0{,}023$
$5000 \cdot 0{,}023 \approx 115$ ნათურა
SEN: $P \approx \dfrac{23}{1000} = 0.023$
$5000 \cdot 0.023 \approx 115$ bulbs
AKA: $0{,}023$; $\approx 115$
AEN: $0.023$; $\approx 115$

--- easy polynomials
KA: იპოვეთ $(2x^2 - 3x + 1) + (x^2 + 5x - 4)$ და $(x + 2)(x^2 - x + 1)$.
EN: Find $(2x^2 - 3x + 1) + (x^2 + 5x - 4)$ and $(x + 2)(x^2 - x + 1)$.
HKA: შეკრებისას შეაჯგუფეთ მსგავსი წევრები; გამრავლებისას ყოველი წევრი ყოველზე გაამრავლეთ.
HEN: When adding, collect like terms; when multiplying, multiply every term by every term.
SKA: $(2x^2 - 3x + 1) + (x^2 + 5x - 4) = 3x^2 + 2x - 3$
$(x + 2)(x^2 - x + 1) = x^3 - x^2 + x + 2x^2 - 2x + 2 = x^3 + x^2 - x + 2$
SEN: $(2x^2 - 3x + 1) + (x^2 + 5x - 4) = 3x^2 + 2x - 3$
$(x + 2)(x^2 - x + 1) = x^3 - x^2 + x + 2x^2 - 2x + 2 = x^3 + x^2 - x + 2$
AKA: $3x^2 + 2x - 3$; $x^3 + x^2 - x + 2$
AEN: $3x^2 + 2x - 3$; $x^3 + x^2 - x + 2$

--- easy polynomials
KA: იპოვეთ მრავალწევრის $P(x) = x^3 - 2x + 1$ მნიშვნელობა $x = -2$-ისთვის.
EN: Find the value of $P(x) = x^3 - 2x + 1$ at $x = -2$.
HKA: ჩასვით ფრჩხილებში: $(-2)^3$.
HEN: Substitute in brackets: $(-2)^3$.
SKA: $P(-2) = (-2)^3 - 2 \cdot (-2) + 1 = -8 + 4 + 1 = -3$
SEN: $P(-2) = (-2)^3 - 2 \cdot (-2) + 1 = -8 + 4 + 1 = -3$
AKA: $-3$
AEN: $-3$

--- easy equations
KA: ამოხსენით განტოლება: $3(x - 2) = 2x + 5$.
EN: Solve: $3(x - 2) = 2x + 5$.
HKA: გახსენით ფრჩხილები.
HEN: Expand the brackets.
SKA: $3x - 6 = 2x + 5 \Rightarrow x = 11$
SEN: $3x - 6 = 2x + 5 \Rightarrow x = 11$
AKA: $x = 11$
AEN: $x = 11$

--- easy equations
KA: ამოხსენით განტოლება: $x^2 - 2x - 15 = 0$.
EN: Solve: $x^2 - 2x - 15 = 0$.
HKA: ვიეტი: ფესვების ჯამი $2$, ნამრავლი $-15$.
HEN: Vieta: the roots sum to $2$ and multiply to $-15$.
SKA: $x^2 - 2x - 15 = (x - 5)(x + 3) = 0$
$x = 5$ ან $x = -3$
SEN: $x^2 - 2x - 15 = (x - 5)(x + 3) = 0$
$x = 5$ or $x = -3$
AKA: $5$; $-3$
AEN: $5$; $-3$

--- easy equations
KA: ამოხსენით უტოლობა: $\dfrac{x - 3}{x + 1} > 0$.
EN: Solve: $\dfrac{x - 3}{x + 1} > 0$.
HKA: წილადი დადებითია, როცა მრიცხველს და მნიშვნელს ერთნაირი ნიშანი აქვს.
HEN: A fraction is positive when numerator and denominator have the same sign.
SKA: კრიტიკული წერტილები: $-1$ და $3$.
ნიშნები: $(-\infty;\ -1)$: $+$; $(-1;\ 3)$: $-$; $(3;\ +\infty)$: $+$.
$x < -1$ ან $x > 3$
SEN: Critical points: $-1$ and $3$.
Signs: $(-\infty,\ -1)$: $+$; $(-1,\ 3)$: $-$; $(3,\ +\infty)$: $+$.
$x < -1$ or $x > 3$
AKA: $x \in (-\infty;\ -1) \cup (3;\ +\infty)$
AEN: $x \in (-\infty,\ -1) \cup (3,\ +\infty)$

--- easy functions
KA: იპოვეთ ფუნქციის განსაზღვრის არე: $f(x) = \sqrt{x - 2} + \dfrac{1}{x - 5}$.
EN: Find the domain of $f(x) = \sqrt{x - 2} + \dfrac{1}{x - 5}$.
HKA: ფესვქვეშა გამოსახულება $\ge 0$; მნიშვნელი $\ne 0$.
HEN: The expression under the root must be $\ge 0$; the denominator $\ne 0$.
SKA: $x - 2 \ge 0 \Rightarrow x \ge 2$
$x - 5 \ne 0 \Rightarrow x \ne 5$
$D(f) = [2;\ 5) \cup (5;\ +\infty)$
SEN: $x - 2 \ge 0 \Rightarrow x \ge 2$
$x - 5 \ne 0 \Rightarrow x \ne 5$
$D(f) = [2,\ 5) \cup (5,\ +\infty)$
AKA: $[2;\ 5) \cup (5;\ +\infty)$
AEN: $[2,\ 5) \cup (5,\ +\infty)$

--- easy functions
KA: წრფივი ფუნქციის გრაფიკი გადის $(1;\ 2)$ და $(4;\ 11)$ წერტილებზე. იპოვეთ კუთხური კოეფიციენტი და ფუნქციის ფორმულა. რას ნიშნავს კუთხური კოეფიციენტი, როგორც „ცვლილების სიჩქარე“?
EN: A linear function's graph passes through $(1,\ 2)$ and $(4,\ 11)$. Find the slope and the formula. What does the slope mean as a "rate of change"?
HKA: $k = \dfrac{y_2 - y_1}{x_2 - x_1}$.
HEN: $k = \dfrac{y_2 - y_1}{x_2 - x_1}$.
SKA: $k = \dfrac{11 - 2}{4 - 1} = 3$; $\ 2 = 3 \cdot 1 + b \Rightarrow b = -1$; $\ y = 3x - 1$
$x$-ის ყოველ ერთეულზე $y$ $3$-ით იზრდება.
SEN: $k = \dfrac{11 - 2}{4 - 1} = 3$; $\ 2 = 3 \cdot 1 + b \Rightarrow b = -1$; $\ y = 3x - 1$
For every unit increase in $x$, $y$ increases by $3$.
AKA: $k = 3$; $y = 3x - 1$
AEN: $k = 3$; $y = 3x - 1$

--- easy functions
KA: $y = (x - 1)^2 - 4$. იპოვეთ პარაბოლის წვერო, ნულები და უმცირესი მნიშვნელობა.
EN: $y = (x - 1)^2 - 4$. Find the vertex, the zeros and the minimum value.
HKA: $y = a(x - m)^2 + n$ ფორმაში წვეროა $(m;\ n)$.
HEN: In the form $y = a(x - m)^2 + n$ the vertex is $(m,\ n)$.
SKA: წვერო: $(1;\ -4)$; $a = 1 > 0$ — უმცირესი მნიშვნელობა $-4$.
ნულები: $(x - 1)^2 = 4 \Rightarrow x - 1 = \pm 2 \Rightarrow x = 3$ ან $x = -1$
SEN: Vertex: $(1,\ -4)$; $a = 1 > 0$ — the minimum value is $-4$.
Zeros: $(x - 1)^2 = 4 \Rightarrow x - 1 = \pm 2 \Rightarrow x = 3$ or $x = -1$
AKA: $(1;\ -4)$; $-1$ და $3$; $-4$
AEN: $(1,\ -4)$; $-1$ and $3$; $-4$

--- easy geometry
KA: იპოვეთ $4$ გვერდიანი წესიერი ექვსკუთხედის ფართობი.
EN: Find the area of a regular hexagon with side $4$.
HKA: წესიერი ექვსკუთხედი $6$ ტოლგვერდა სამკუთხედად იყოფა.
HEN: A regular hexagon splits into $6$ equilateral triangles.
SKA: ერთი ტოლგვერდა სამკუთხედი: $\dfrac{a^2\sqrt{3}}{4} = \dfrac{16\sqrt{3}}{4} = 4\sqrt{3}$
$S = 6 \cdot 4\sqrt{3} = 24\sqrt{3} \approx 41{,}6$
SEN: One equilateral triangle: $\dfrac{a^2\sqrt{3}}{4} = \dfrac{16\sqrt{3}}{4} = 4\sqrt{3}$
$S = 6 \cdot 4\sqrt{3} = 24\sqrt{3} \approx 41.6$
AKA: $24\sqrt{3}$
AEN: $24\sqrt{3}$

KA: იპოვეთ $A(1;\ 3)$ წერტილის სახე სათავეზე ცენტრიანი $k = 2$ კოეფიციენტიანი ჰომოთეტიისას. რა მოუვა $2$ სიგრძის მონაკვეთს?

--- medium logic
KA: გამონათქვამი: „თუ რიცხვი $6$-ზე იყოფა, მაშინ ის $3$-ზე იყოფა“. ჭეშმარიტია? ჩამოაყალიბეთ შებრუნებული გამონათქვამი და შეამოწმეთ მისი ჭეშმარიტობა.
EN: Statement: "If a number is divisible by $6$, then it is divisible by $3$." Is it true? State the converse and check whether it is true.
HKA: შებრუნებულში პირობა და დასკვნა ადგილებს ცვლის. მცდარობის საჩვენებლად ერთი კონტრმაგალითი საკმარისია.
HEN: In the converse the condition and conclusion swap. One counterexample is enough to show it false.
SKA: $6k = 3 \cdot (2k)$ — ჭეშმარიტია.
შებრუნებული: „თუ რიცხვი $3$-ზე იყოფა, მაშინ ის $6$-ზე იყოფა“.
კონტრმაგალითი: $9$ იყოფა $3$-ზე, მაგრამ არ იყოფა $6$-ზე — შებრუნებული **მცდარია**.
SEN: $6k = 3 \cdot (2k)$ — true.
Converse: "If a number is divisible by $3$, then it is divisible by $6$."
Counterexample: $9$ is divisible by $3$ but not by $6$ — the converse is **false**.
AKA: პირდაპირი ჭეშმარიტია; შებრუნებული მცდარია ($9$)
AEN: the statement is true; the converse is false ($9$)

--- medium logic
KA: ეილერმა შენიშნა, რომ $n^2 + n + 41$ მარტივი რიცხვია $n = 0, 1, 2, \dots, 39$-ისთვის. შეიძლება თუ არა ინდუქციით (მაგალითებით) დავასკვნათ, რომ ის ყოველთვის მარტივია? შეამოწმეთ $n = 40$.
EN: Euler noticed that $n^2 + n + 41$ is prime for $n = 0, 1, 2, \dots, 39$. Can we conclude by induction (from examples) that it is always prime? Check $n = 40$.
HKA: ინდუქციური მსჯელობა (მაგალითებიდან) ჰიპოთეზას იძლევა, დამტკიცებას — არა.
HEN: Inductive reasoning (from examples) gives a conjecture, not a proof.
SKA: $n = 40$: $40^2 + 40 + 41 = 1600 + 81 = 1681 = 41^2$ — შედგენილი რიცხვია!
$40$ წარმატებული მაგალითიც კი არ ამტკიცებს ზოგად დებულებას; ერთი კონტრმაგალითი კი მას აბათილებს.
SEN: $n = 40$: $40^2 + 40 + 41 = 1600 + 81 = 1681 = 41^2$ — composite!
Even $40$ successful examples do not prove a general statement; one counterexample disproves it.
AKA: არა; $1681 = 41^2$
AEN: no; $1681 = 41^2$

--- medium logic
KA: ევკლიდეს ალგორითმით იპოვეთ $\gcd(252,\ 198)$. აღწერეთ ალგორითმის ნაბიჯები.
EN: Use Euclid's algorithm to find $\gcd(252,\ 198)$. Describe the steps.
HKA: $\gcd(a, b) = \gcd(b, r)$, სადაც $r$ — $a$-ს $b$-ზე გაყოფის ნაშთია. გაიმეორეთ, სანამ ნაშთი $0$ არ გახდება.
HEN: $\gcd(a, b) = \gcd(b, r)$, where $r$ is the remainder of $a \div b$. Repeat until the remainder is $0$.
SKA: $252 = 1 \cdot 198 + 54$
$198 = 3 \cdot 54 + 36$
$54 = 1 \cdot 36 + 18$
$36 = 2 \cdot 18 + 0$ — ბოლო არანულოვანი ნაშთი $18$.
SEN: $252 = 1 \cdot 198 + 54$
$198 = 3 \cdot 54 + 36$
$54 = 1 \cdot 36 + 18$
$36 = 2 \cdot 18 + 0$ — the last non-zero remainder is $18$.
AKA: $18$
AEN: $18$

KA: შენადნობში სპილენძისა და თუთიის შეფარდებაა $3 : 2$. რამდენი თუთიაა საჭირო $15\ \text{კგ}$ სპილენძთან და რა მასის შენადნობი მიიღება?

SEN: One part: $15 \div 3 = 5\ \text{kg}$
Zinc: $2 \cdot 5 = 10\ \text{kg}$; alloy: $15 + 10 = 25\ \text{kg}$

KA: $3000$ ლარის სესხი აიღეს $2$ წლით, წლიური $18\%$-ით (მარტივი პროცენტი), ტოლი ყოველთვიური გადასახადებით. რამდენია ყოველთვიური შენატანი და სულ რამდენს გადაიხდიან?

KA: კვადრატის გვერდი გაზომეს: $10\ \text{სმ} \pm 0{,}1\ \text{სმ}$. რას უდრის გვერდის ფარდობითი ცდომილება? შეაფასეთ ფართობის ფარდობითი ცდომილება.
EN: The side of a square is measured as $10\ \text{cm} \pm 0.1\ \text{cm}$. What is the relative error of the side? Estimate the relative error of the area.
HKA: შეადარეთ $9{,}9^2$, $10^2$ და $10{,}1^2$.
HEN: Compare $9.9^2$, $10^2$ and $10.1^2$.
SKA: გვერდი: $\delta_a = \dfrac{0{,}1}{10} = 1\%$
ფართობი: $10{,}1^2 = 102{,}01$, $\ 9{,}9^2 = 98{,}01$ — გადახრა $\approx 2\ \text{სმ}^2$ $100$-დან, ე.ი. $\approx 2\%$.
ზოგადად: კვადრატში აყვანისას ფარდობითი ცდომილება ორმაგდება.
SEN: Side: $\delta_a = \dfrac{0.1}{10} = 1\%$
Area: $10.1^2 = 102.01$, $\ 9.9^2 = 98.01$ — a deviation of $\approx 2\ \text{cm}^2$ out of $100$, i.e. $\approx 2\%$.
In general, squaring doubles the relative error.
AKA: $1\%$; $\approx 2\%$
AEN: $1\%$; $\approx 2\%$

KA: მონაცემების საშუალოა $7$, მედიანა — $6$. თითოეული მონაცემი $2$-ზე გაამრავლეს და $3$ დაუმატეს. რას უდრის ახალი საშუალო და მედიანა?

$\text{Me}_y = 2 \cdot 6 + 3 = 15$

$\text{Me}_y = 2 \cdot 6 + 3 = 15$

--- medium stats
KA: ოჯახში ორი ბავშვია. ბიჭისა და გოგოს დაბადება თანაბრად სავარაუდოა. რას უდრის ალბათობა, რომ ერთი გოგო მაინც არის?
EN: A family has two children. A boy and a girl are equally likely. What is the probability that at least one is a girl?
HKA: შედეგები: ბბ, ბგ, გბ, გგ. გამოიყენეთ საწინააღმდეგო ხდომილობა.
HEN: Outcomes: BB, BG, GB, GG. Use the complement.

$P = 1 - \dfrac{1}{4} = \dfrac{3}{4}$
SEN: $4$ equally likely outcomes; "no girl" is only BB.
$P = 1 - \dfrac{1}{4} = \dfrac{3}{4}$
AKA: $\dfrac{3}{4}$
AEN: $\dfrac{3}{4}$

--- medium stats
KA: სინოპტიკოსის პროგნოზით, ყოველ დღეს წვიმის ალბათობაა $40\%$ (დღეები ერთმანეთზე არ არის დამოკიდებული). რას უდრის ალბათობა, რომ ორ დღეს ზედიზედ არ იწვიმებს? რომ ერთ დღეს მაინც იწვიმებს?
EN: The forecast gives a $40\%$ chance of rain each day (days independent). What is the probability of no rain on two days in a row? Of rain on at least one of them?
HKA: დამოუკიდებელი ხდომილობების ალბათობები მრავლდება.
HEN: Probabilities of independent events multiply.
SKA: $P(\text{არ წვიმს ერთ დღეს}) = 0{,}6$
$P(\text{ორივე დღე მშრალი}) = 0{,}6 \cdot 0{,}6 = 0{,}36$
$P(\text{ერთხელ მაინც წვიმს}) = 1 - 0{,}36 = 0{,}64$
SEN: $P(\text{no rain on one day}) = 0.6$
$P(\text{both days dry}) = 0.6 \cdot 0.6 = 0.36$
$P(\text{rain at least once}) = 1 - 0.36 = 0.64$
AKA: $0{,}36$; $0{,}64$
AEN: $0.36$; $0.64$

KA: ცნობილია, რომ $x = 1$ არის $x^3 - 6x^2 + 11x - 6$ მრავალწევრის ფესვი. გაყავით მრავალწევრი $(x - 1)$-ზე და იპოვეთ დანარჩენი ფესვები.
EN: $x = 1$ is a root of $x^3 - 6x^2 + 11x - 6$. Divide the polynomial by $(x - 1)$ and find the other roots.
HKA: ჰორნერის სქემა ან კუთხით გაყოფა.
HEN: Use Horner's scheme or long division.
SKA: $x^3 - 6x^2 + 11x - 6 = (x - 1)(x^2 - 5x + 6)$
$x^2 - 5x + 6 = (x - 2)(x - 3)$
ფესვები: $1, 2, 3$
SEN: $x^3 - 6x^2 + 11x - 6 = (x - 1)(x^2 - 5x + 6)$
$x^2 - 5x + 6 = (x - 2)(x - 3)$
Roots: $1, 2, 3$
AKA: $1;\ 2;\ 3$
AEN: $1,\ 2,\ 3$

KA: შეკვეცეთ: $\dfrac{x^3 - 8}{x^2 - 4}$.

KA: ამოხსენით განტოლება: $\dfrac{x}{x - 2} + \dfrac{3}{x + 2} = \dfrac{8}{x^2 - 4}$.
EN: Solve: $\dfrac{x}{x - 2} + \dfrac{3}{x + 2} = \dfrac{8}{x^2 - 4}$.
HKA: საერთო მნიშვნელი $x^2 - 4$; დასაშვები: $x \ne \pm 2$.
HEN: Common denominator $x^2 - 4$; allowed: $x \ne \pm 2$.
SKA: $x(x + 2) + 3(x - 2) = 8 \Rightarrow x^2 + 5x - 14 = 0$
$(x + 7)(x - 2) = 0 \Rightarrow x = -7$ ან $x = 2$
$x = 2$ დაუშვებელია $\Rightarrow x = -7$
SEN: $x(x + 2) + 3(x - 2) = 8 \Rightarrow x^2 + 5x - 14 = 0$
$(x + 7)(x - 2) = 0 \Rightarrow x = -7$ or $x = 2$
$x = 2$ is not allowed $\Rightarrow x = -7$
AKA: $x = -7$
AEN: $x = -7$

--- medium equations
KA: $2\ \text{კგ}$ ვაშლი და $3\ \text{კგ}$ მსხალი $13$ ლარი ღირს, $3\ \text{კგ}$ ვაშლი და $1\ \text{კგ}$ მსხალი — $9$ ლარი. რა ღირს $1\ \text{კგ}$ ვაშლი და $1\ \text{კგ}$ მსხალი?
EN: $2\ \text{kg}$ of apples and $3\ \text{kg}$ of pears cost $13$ lari; $3\ \text{kg}$ of apples and $1\ \text{kg}$ of pears cost $9$ lari. What does $1\ \text{kg}$ of each cost?
HKA: აღნიშნეთ ფასები $a$ და $p$; მეორედან ადვილად გამოისახება $p$.
HEN: Call the prices $a$ and $p$; $p$ is easy to express from the second equation.

--- hard logic
KA: დაამტკიცეთ, რომ $\sqrt{2}$ ირაციონალური რიცხვია.
EN: Prove that $\sqrt{2}$ is irrational.
HKA: საწინააღმდეგოს დაშვების მეთოდი: დაუშვით $\sqrt{2} = \dfrac{p}{q}$ შეუკვეცადი წილადია.
HEN: Proof by contradiction: assume $\sqrt{2} = \dfrac{p}{q}$ in lowest terms.
SKA: დავუშვათ $\sqrt{2} = \dfrac{p}{q}$, სადაც წილადი შეუკვეცადია.
$p^2 = 2q^2 \Rightarrow p^2$ ლუწია $\Rightarrow p$ ლუწია: $p = 2k$.
$4k^2 = 2q^2 \Rightarrow q^2 = 2k^2 \Rightarrow q$ ლუწია.
$p$ და $q$ ორივე ლუწია — წილადი შეკვეცადია. წინააღმდეგობა $\Rightarrow \sqrt{2}$ ირაციონალურია ∎
SEN: Assume $\sqrt{2} = \dfrac{p}{q}$ in lowest terms.
$p^2 = 2q^2 \Rightarrow p^2$ is even $\Rightarrow p$ is even: $p = 2k$.
$4k^2 = 2q^2 \Rightarrow q^2 = 2k^2 \Rightarrow q$ is even.
Both $p$ and $q$ are even — the fraction can be reduced. Contradiction $\Rightarrow \sqrt{2}$ is irrational ∎
AKA: დამტკიცებულია (საწინააღმდეგოს დაშვებით)
AEN: proved (by contradiction)

--- hard logic

EN: On an island live knights (always tell the truth) and knaves (always lie). $A$ says: "We are both knaves." What are $A$ and $B$?
HKA: შეამოწმეთ ორივე შესაძლებლობა $A$-სთვის.
HEN: Check both possibilities for $A$.
SKA: თუ $A$ რაინდია, მისი სიტყვები ჭეშმარიტია — მაშინ ის მატყუარაა. წინააღმდეგობა.
მაშასადამე $A$ მატყუარაა და მისი სიტყვები მცდარია: „ორივე მატყუარაა“ მცდარია.
$A$ მატყუარაა, ამიტომ $B$ უნდა იყოს **რაინდი**.
SEN: If $A$ were a knight, the statement would be true — making $A$ a knave. Contradiction.
So $A$ is a knave and the statement is false: "both are knaves" is false.
$A$ is a knave, so $B$ must be a **knight**.
AKA: $A$ — მატყუარა, $B$ — რაინდი
AEN: $A$ — knave, $B$ — knight

KA: $25$ მოსწავლის საშუალო ქულაა $72$. კლასს შეემატა ახალი მოსწავლე, რომლის ქულაა $98$. რას უდრის ახალი საშუალო? როგორ შეიძლება შეიცვალოს მედიანა?

SKA: ჯამი: $25 \cdot 72 = 1800$; ახალი ჯამი: $1898$
$\bar{x} = \dfrac{1898}{26} = 73$
მედიანა მაქსიმუმ ერთი „ადგილით“ გადაიწევს ზემოთ — ის ექსტრემალურ მნიშვნელობებზე მდგრადია, საშუალოსგან განსხვავებით.
SEN: Sum: $25 \cdot 72 = 1800$; new sum: $1898$
$\bar{x} = \dfrac{1898}{26} = 73$

HKA: უნაშთოდ გაყოფა $\iff P(2) = 0$.
HEN: Divisible $\iff P(2) = 0$.
SKA: $P(2) = 8 + 4a - 8 + 4 = 4a + 4 = 0 \Rightarrow a = -1$
$x^3 - x^2 - 4x + 4 = x^2(x - 1) - 4(x - 1) = (x - 1)(x - 2)(x + 2)$
ფესვები: $1, 2, -2$
SEN: $P(2) = 8 + 4a - 8 + 4 = 4a + 4 = 0 \Rightarrow a = -1$
$x^3 - x^2 - 4x + 4 = x^2(x - 1) - 4(x - 1) = (x - 1)(x - 2)(x + 2)$
Roots: $1, 2, -2$
AKA: $a = -1$; $1;\ 2;\ -2$
AEN: $a = -1$; $1,\ 2,\ -2$

--- hard equations
KA: $a$-ს რა მნიშვნელობისთვის აქვს განტოლებას $x^2 - (a + 1)x + a = 0$ ორი ტოლი ფესვი? ამოხსენით განტოლება ზოგადად.
EN: For which $a$ does $x^2 - (a + 1)x + a = 0$ have a double root? Solve the equation in general.
HKA: დაშალეთ: ფესვების ჯამი $a + 1$, ნამრავლი $a$.
HEN: Factorise: the roots sum to $a + 1$ and multiply to $a$.
SKA: $D = (a + 1)^2 - 4a = (a - 1)^2$
ფესვები: $x = \dfrac{(a + 1) \pm (a - 1)}{2} \Rightarrow x_1 = a$, $x_2 = 1$ (ანუ $(x - a)(x - 1) = 0$)
ტოლი ფესვები: $D = 0 \Rightarrow a = 1$, ფესვი $x = 1$.
SEN: $D = (a + 1)^2 - 4a = (a - 1)^2$
Roots: $x = \dfrac{(a + 1) \pm (a - 1)}{2} \Rightarrow x_1 = a$, $x_2 = 1$ (i.e. $(x - a)(x - 1) = 0$)
Double root: $D = 0 \Rightarrow a = 1$, root $x = 1$.
AKA: $a = 1$; ზოგადად $x = a$ ან $x = 1$
AEN: $a = 1$; in general $x = a$ or $x = 1$

--- hard equations
KA: ამოხსენით უტოლობა: $\dfrac{x^2 - 1}{x^2 - 4} \ge 0$.
EN: Solve: $\dfrac{x^2 - 1}{x^2 - 4} \ge 0$.
HKA: კრიტიკული წერტილები: $\pm 1$ (შედის), $\pm 2$ (არ შედის).
HEN: Critical points: $\pm 1$ (included), $\pm 2$ (excluded).
SKA: $\dfrac{(x - 1)(x + 1)}{(x - 2)(x + 2)} \ge 0$
ნიშნები: $(2;\ +\infty)$: $+$; $(1;\ 2)$: $-$; $(-1;\ 1)$: $+$; $(-2;\ -1)$: $-$; $(-\infty;\ -2)$: $+$.
$x < -2$, ან $-1 \le x \le 1$, ან $x > 2$
SEN: $\dfrac{(x - 1)(x + 1)}{(x - 2)(x + 2)} \ge 0$
Signs: $(2,\ +\infty)$: $+$; $(1,\ 2)$: $-$; $(-1,\ 1)$: $+$; $(-2,\ -1)$: $-$; $(-\infty,\ -2)$: $+$.
$x < -2$, or $-1 \le x \le 1$, or $x > 2$
AKA: $(-\infty;\ -2) \cup [-1;\ 1] \cup (2;\ +\infty)$
AEN: $(-\infty,\ -2) \cup [-1,\ 1] \cup (2,\ +\infty)$

--- hard functions
KA: დაამტკიცეთ, რომ $20$ პერიმეტრის მართკუთხედებიდან უდიდესი ფართობი კვადრატს აქვს. იპოვეთ ეს ფართობი.
EN: Prove that among rectangles with perimeter $20$ the square has the largest area. Find that area.
HKA: თუ ერთი გვერდია $x$, მეორე $10 - x$. ფართობი $x$-ის კვადრატული ფუნქციაა.
HEN: If one side is $x$, the other is $10 - x$. The area is a quadratic function of $x$.
SKA: $S(x) = x(10 - x) = -x^2 + 10x = 25 - (x - 5)^2$
$(x - 5)^2 \ge 0 \Rightarrow S \le 25$, ტოლობა $x = 5$-ზე: გვერდები $5$ და $5$ — კვადრატი ∎
SEN: $S(x) = x(10 - x) = -x^2 + 10x = 25 - (x - 5)^2$
$(x - 5)^2 \ge 0 \Rightarrow S \le 25$, with equality at $x = 5$: sides $5$ and $5$ — a square ∎
AKA: $25$
AEN: $25$

--- hard functions
KA: მცირე საწარმოს მუდმივი ხარჯია $2000$ ლარი თვეში, თითო ნაწარმის დამზადება $15$ ლარი ჯდება, გაყიდვის ფასი — $25$ ლარი. ჩაწერეთ მოგების ფუნქცია და იპოვეთ, მინიმუმ რამდენი ერთეული უნდა გაიყიდოს, რომ საწარმო ზარალში არ იყოს.
EN: A small business has fixed costs of $2000$ lari a month; each item costs $15$ lari to make and sells for $25$ lari. Write the profit function and find the minimum number of items to sell to avoid a loss.
HKA: მოგება = შემოსავალი − ხარჯი.
HEN: Profit = revenue − cost.
SKA: $P(x) = 25x - (2000 + 15x) = 10x - 2000$
$P(x) \ge 0 \Rightarrow x \ge 200$
SEN: $P(x) = 25x - (2000 + 15x) = 10x - 2000$
$P(x) \ge 0 \Rightarrow x \ge 200$
AKA: $P = 10x - 2000$; $200$ ერთეული
AEN: $P = 10x - 2000$; $200$ items

--- hard geometry
KA: წრის რადიუსია $6$, ცენტრალური კუთხე — $60^\circ$. იპოვეთ შესაბამისი სექტორისა და სეგმენტის ფართობები.
EN: A circle has radius $6$ and a central angle of $60^\circ$. Find the areas of the corresponding sector and segment.
HKA: სეგმენტი = სექტორი − სამკუთხედი (აქ ტოლგვერდა).
HEN: Segment = sector − triangle (here equilateral).
SKA: სექტორი: $S = \pi r^2 \cdot \dfrac{60^\circ}{360^\circ} = \dfrac{36\pi}{6} = 6\pi$
სამკუთხედი: $\dfrac{6^2\sqrt{3}}{4} = 9\sqrt{3}$
სეგმენტი: $6\pi - 9\sqrt{3} \approx 18{,}85 - 15{,}59 \approx 3{,}26$
SEN: Sector: $S = \pi r^2 \cdot \dfrac{60^\circ}{360^\circ} = \dfrac{36\pi}{6} = 6\pi$
Triangle: $\dfrac{6^2\sqrt{3}}{4} = 9\sqrt{3}$
Segment: $6\pi - 9\sqrt{3} \approx 18.85 - 15.59 \approx 3.26$
AKA: $6\pi$; $6\pi - 9\sqrt{3} \approx 3{,}26$
AEN: $6\pi$; $6\pi - 9\sqrt{3} \approx 3.26$

--- hard geometry
KA: $20\ \text{მ}$ სიმაღლის შენობის სახურავიდან ანძის წვერო ჩანს $30^\circ$-იანი კუთხით ზემოთ, ხოლო ანძის ძირი — $45^\circ$-იანი კუთხით ქვემოთ. იპოვეთ ანძის სიმაღლე.
EN: From the roof of a $20\ \text{m}$ building the top of a mast is seen at $30^\circ$ above the horizontal, and its base at $45^\circ$ below. Find the height of the mast.
HKA: $45^\circ$-იანი კუთხიდან იპოვეთ ჰორიზონტალური მანძილი.
HEN: Use the $45^\circ$ angle to find the horizontal distance.
SKA: ჰორიზონტალური მანძილი: $d = \dfrac{20}{\tan 45^\circ} = 20\ \text{მ}$
სახურავის ზემოთ: $20 \tan 30^\circ = \dfrac{20}{\sqrt{3}} \approx 11{,}5\ \text{მ}$
ანძა: $20 + 11{,}5 \approx 31{,}5\ \text{მ}$
SEN: Horizontal distance: $d = \dfrac{20}{\tan 45^\circ} = 20\ \text{m}$
Above the roof: $20 \tan 30^\circ = \dfrac{20}{\sqrt{3}} \approx 11.5\ \text{m}$
Mast: $20 + 11.5 \approx 31.5\ \text{m}$
AKA: $\approx 31{,}5\ \text{მ}$
AEN: $\approx 31.5\ \text{m}$

--- hard transformations
KA: დაამტკიცეთ, რომ ჯერ $Ox$ ღერძის, შემდეგ $Oy$ ღერძის მიმართ სიმეტრიების კომპოზიცია სათავის გარშემო $180^\circ$-ით მობრუნების ტოლფასია. დამოკიდებულია თუ არა შედეგი სიმეტრიების რიგზე?
EN: Prove that reflecting in the $x$-axis and then in the $y$-axis is the same as a $180^\circ$ rotation about the origin. Does the result depend on the order?
HKA: ჩაწერეთ თითოეული გარდაქმნა კოორდინატებით.
HEN: Write each transformation in coordinates.
SKA: $Ox$: $(x;\ y) \to (x;\ -y)$; შემდეგ $Oy$: $(x;\ -y) \to (-x;\ -y)$.
სათავის გარშემო $180^\circ$: $(x;\ y) \to (-x;\ -y)$ — იგივე ∎
შებრუნებული რიგით: $(x;\ y) \to (-x;\ y) \to (-x;\ -y)$ — იგივე შედეგი, რიგი აქ არ მოქმედებს.
SEN: $x$-axis: $(x,\ y) \to (x,\ -y)$; then $y$-axis: $(x,\ -y) \to (-x,\ -y)$.
$180^\circ$ about the origin: $(x,\ y) \to (-x,\ -y)$ — the same ∎
In the other order: $(x,\ y) \to (-x,\ y) \to (-x,\ -y)$ — the same result; order doesn't matter here.
AKA: დამტკიცებულია; არ არის დამოკიდებული
AEN: proved; no

--- hard logic olympiad
KA: სამ ყუთს აწერია „ვაშლი“, „ფორთოხალი“ და „შერეული“, მაგრამ **ყველა** წარწერა არასწორია. რამდენი ხილის ამოღება (ყუთში ჩაუხედავად) არის საკმარისი, რომ ყველა წარწერა სწორად გადაანაწილოთ?
EN: Three boxes are labelled "apples", "oranges" and "mixed", but **every** label is wrong. How many fruits must you take out (without looking inside) to relabel all the boxes correctly?
HKA: რომელი ყუთიდან ამოღებული ერთი ხილი იძლევა ცალსახა ინფორმაციას?
HEN: From which box does a single fruit tell you everything?
SKA: ამოვიღოთ ერთი ხილი ყუთიდან „შერეული“. წარწერა მცდარია — ეს ყუთი ერთგვაროვანია.
თუ ვაშლი ამოვიდა — ეს ვაშლის ყუთია. ყუთი „ფორთოხალი“ არ შეიძლება იყოს ფორთოხალი და არც ვაშლი (ის უკვე ნაპოვნია) — მაშასადამე შერეულია; დარჩენილი („ვაშლი“) — ფორთოხალი.
ფორთოხლის შემთხვევაში ანალოგიურად. პასუხი: **ერთი** ხილი საკმარისია.
SEN: Take one fruit from the box labelled "mixed". Its label is wrong, so the box holds only one kind.
If it's an apple, this is the apple box. The box labelled "oranges" can't be oranges, nor apples (already found) — so it's mixed; the last ("apples") is oranges.
Likewise if it's an orange. Answer: **one** fruit is enough.
AKA: ერთი ხილი (ყუთიდან „შერეული“)
AEN: one fruit (from the "mixed" box)

--- hard numbers olympiad
KA: იპოვეთ ყველა მარტივი $p$, რომლისთვისაც $p + 10$ და $p + 14$ ასევე მარტივი რიცხვებია.
EN: Find all primes $p$ such that $p + 10$ and $p + 14$ are also prime.
HKA: განიხილეთ $p$-ს $3$-ზე გაყოფის ნაშთი.
HEN: Consider the remainder of $p$ when divided by $3$.
SKA: თუ $p = 3$: $13$ და $17$ — მარტივია ✓
თუ $p \equiv 1 \pmod 3$: $p + 14 \equiv 15 \equiv 0$ — იყოფა $3$-ზე და $> 3$, შედგენილია.
თუ $p \equiv 2 \pmod 3$: $p + 10 \equiv 12 \equiv 0$ — შედგენილია.
ერთადერთი პასუხი: $p = 3$.
SEN: If $p = 3$: $13$ and $17$ — prime ✓
If $p \equiv 1 \pmod 3$: $p + 14 \equiv 15 \equiv 0$ — divisible by $3$ and $> 3$, composite.
If $p \equiv 2 \pmod 3$: $p + 10 \equiv 12 \equiv 0$ — composite.
The only answer: $p = 3$.
AKA: $p = 3$
AEN: $p = 3$

--- hard polynomials olympiad
KA: ცნობილია, რომ $x + \dfrac{1}{x} = 3$. იპოვეთ $x^2 + \dfrac{1}{x^2}$ და $x^3 + \dfrac{1}{x^3}$.
EN: Given $x + \dfrac{1}{x} = 3$, find $x^2 + \dfrac{1}{x^2}$ and $x^3 + \dfrac{1}{x^3}$.
HKA: აიყვანეთ მოცემული ტოლობა კვადრატში და კუბში.
HEN: Square and cube the given equation.
SKA: $\left(x + \dfrac{1}{x}\right)^2 = x^2 + 2 + \dfrac{1}{x^2} = 9 \Rightarrow x^2 + \dfrac{1}{x^2} = 7$
$\left(x + \dfrac{1}{x}\right)^3 = x^3 + \dfrac{1}{x^3} + 3\left(x + \dfrac{1}{x}\right) = 27 \Rightarrow x^3 + \dfrac{1}{x^3} = 27 - 9 = 18$
SEN: $\left(x + \dfrac{1}{x}\right)^2 = x^2 + 2 + \dfrac{1}{x^2} = 9 \Rightarrow x^2 + \dfrac{1}{x^2} = 7$
$\left(x + \dfrac{1}{x}\right)^3 = x^3 + \dfrac{1}{x^3} + 3\left(x + \dfrac{1}{x}\right) = 27 \Rightarrow x^3 + \dfrac{1}{x^3} = 27 - 9 = 18$
AKA: $7$; $18$
AEN: $7$; $18$

--- hard functions olympiad
KA: ფუნქცია $f$ ყოველი $x$-ისთვის აკმაყოფილებს ტოლობას $f(x) + 2f(1 - x) = x$. იპოვეთ $f(x)$.
EN: A function $f$ satisfies $f(x) + 2f(1 - x) = x$ for all $x$. Find $f(x)$.
HKA: ჩასვით $x$-ის ნაცვლად $1 - x$ — მიიღებთ მეორე განტოლებას იმავე ორი უცნობით $f(x)$ და $f(1 - x)$.
HEN: Replace $x$ by $1 - x$ — you get a second equation in the same two unknowns $f(x)$ and $f(1 - x)$.
SKA: $f(x) + 2f(1 - x) = x$ (1)
$x \to 1 - x$: $\ f(1 - x) + 2f(x) = 1 - x$ (2)
(2)$\cdot 2$ − (1): $4f(x) - f(x) = 2 - 2x - x \Rightarrow 3f(x) = 2 - 3x$
$f(x) = \dfrac{2 - 3x}{3} = \dfrac{2}{3} - x$
შემოწმება: $\dfrac{2}{3} - x + 2\left(\dfrac{2}{3} - 1 + x\right) = x$ ✓
SEN: $f(x) + 2f(1 - x) = x$ (1)
$x \to 1 - x$: $\ f(1 - x) + 2f(x) = 1 - x$ (2)
(2)$\times 2$ − (1): $4f(x) - f(x) = 2 - 2x - x \Rightarrow 3f(x) = 2 - 3x$
$f(x) = \dfrac{2 - 3x}{3} = \dfrac{2}{3} - x$
Check: $\dfrac{2}{3} - x + 2\left(\dfrac{2}{3} - 1 + x\right) = x$ ✓
AKA: $f(x) = \dfrac{2}{3} - x$
AEN: $f(x) = \dfrac{2}{3} - x$

--- hard geometry olympiad
KA: სამკუთხედის გვერდებია $13$, $14$ და $15$. იპოვეთ მისი ფართობი და $14$ სიგრძის გვერდზე დაშვებული სიმაღლე.
EN: A triangle has sides $13$, $14$ and $15$. Find its area and the height to the side of length $14$.
HKA: ჰერონის ფორმულა: $S = \sqrt{p(p - a)(p - b)(p - c)}$, $p$ — ნახევარპერიმეტრი. ან: დაუშვით სიმაღლე და ორჯერ გამოიყენეთ პითაგორა.
HEN: Heron's formula: $S = \sqrt{p(p - a)(p - b)(p - c)}$, $p$ = semi-perimeter. Or drop the height and use Pythagoras twice.
SKA: $p = \dfrac{13 + 14 + 15}{2} = 21$
$S = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = \sqrt{7056} = 84$
$h = \dfrac{2S}{14} = \dfrac{168}{14} = 12$ (სიმაღლე ფუძეს $5$ და $9$ ნაწილებად ყოფს: $5^2 + 12^2 = 13^2$, $9^2 + 12^2 = 15^2$ ✓)
SEN: $p = \dfrac{13 + 14 + 15}{2} = 21$
$S = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = \sqrt{7056} = 84$
$h = \dfrac{2S}{14} = \dfrac{168}{14} = 12$ (the height splits the base into $5$ and $9$: $5^2 + 12^2 = 13^2$, $9^2 + 12^2 = 15^2$ ✓)
AKA: $84$; $12$
AEN: $84$; $12$
