KA: $k$-ს რა მნიშვნელობისათვის არის $f(x) = 2x^2 - 8x + k$ ფუნქციის უმცირესი მნიშვნელობა $-3$-ის ტოლი?

O: $5$
$-5$
$3$
$13$
C: 1
SKA: წვერო: $x_0 = \dfrac{8}{2 \cdot 2} = 2$

EN: If $x \in (-\infty; -2)$, then $|x + 2| - |x - 3| =$

KA: $240$ მოსწავლის გამოკითხვის შედეგები წრიულ დიაგრამაზეა ასახული. მათემატიკის, როგორც საყვარელი საგნის, შესაბამისი სექტორის კუთხე $75^\circ$-ია. რამდენმა მოსწავლემ დაასახელა მათემატიკა?

KA: $(2; -5)$ წერტილი ჯერ ასახეს კოორდინატთა სათავის მიმართ სიმეტრიულად, შემდეგ კი გადაიტანეს $\vec{v} = (-3; 1)$ ვექტორით. იპოვეთ მიღებული წერტილის კოორდინატები.
EN: The point $(2; -5)$ is reflected in the origin and then translated by $\vec{v} = (-3; 1)$. Find the resulting point.

$(1; -4)$

C: 1
SKA: სიმეტრია სათავის მიმართ: $(x; y) \to (-x; -y)$: $(2; -5) \to (-2; 5)$

SEN: Reflection in the origin: $(x; y) \to (-x; -y)$: $(2; -5) \to (-2; 5)$

KA: ქვემოთ ჩამოთვლილი გამოსახულებებიდან რომელი იყოფა $6$-ზე ნებისმიერი $n$ ნატურალური რიცხვისთვის?
EN: Which expression is divisible by $6$ for every natural number $n$?
O: $n^2 + n$
$n^3 - n$
$n^2 + 1$
$2n + 6$
C: 2
SKA: $n^3 - n = (n - 1)n(n + 1)$ — სამი მომდევნო რიცხვის ნამრავლი: ერთ-ერთი ლუწია, ერთ-ერთი $3$-ის ჯერადი
დანარჩენები: $n = 1$-ზე $n^2 + n = 2$, $n^2 + 1 = 2$, $2n + 6 = 8$ — $6$-ზე არ იყოფა
SEN: $n^3 - n = (n - 1)n(n + 1)$ is a product of three consecutive integers: one is even and one is a multiple of $3$
The others fail at $n = 1$: $n^2 + n = 2$, $n^2 + 1 = 2$, $2n + 6 = 8$

$P = \dfrac{\pi \cdot 1^2}{\pi \cdot 3^2} = \dfrac{1}{9}$

KA: აგორებენ ორ კამათელს. რას უდრის ალბათობა, რომ მოსული რიცხვების ნამრავლი ლუწი იქნება?

O: $\dfrac{1}{2}$
$\dfrac{3}{4}$
$\dfrac{1}{4}$
$\dfrac{2}{3}$
C: 2
SKA: ნამრავლი კენტია მხოლოდ მაშინ, როცა ორივე კენტია: $\dfrac{1}{2} \cdot \dfrac{1}{2} = \dfrac{1}{4}$

$P(\text{even}) = 1 - \dfrac{1}{4} = \dfrac{3}{4}$

KA: იპოვეთ $\sin x = \dfrac{1}{2}$ განტოლების $[0; 2\pi]$ შუალედში მოთავსებული ამონახსნების ჯამი.
EN: Find the sum of the solutions of $\sin x = \dfrac{1}{2}$ in $[0; 2\pi]$.
O: $\pi$
$\dfrac{\pi}{3}$
$2\pi$
$\dfrac{5\pi}{6}$
C: 1
SKA: $[0; 2\pi]$-ში: $x = \dfrac{\pi}{6}$ და $x = \pi - \dfrac{\pi}{6} = \dfrac{5\pi}{6}$

SEN: In $[0; 2\pi]$: $x = \dfrac{\pi}{6}$ and $x = \pi - \dfrac{\pi}{6} = \dfrac{5\pi}{6}$
Sum: $\dfrac{\pi}{6} + \dfrac{5\pi}{6} = \pi$

ნებისმიერი პარალელეპიპედის დიაგონალები ტოლია
მართი პრიზმის გვერდითი წახნაგები მართკუთხედებია
დახრილი პრიზმის გვერდითი წახნაგები მართკუთხედებია

the diagonals of any parallelepiped are equal
the lateral faces of a right prism are rectangles
the lateral faces of an oblique prism are rectangles

A: every prism has equal lateral edges; B holds only for a rectangular box; D: an oblique prism's faces are parallelograms

KA: $ABC$ სამკუთხედში $AB = 5$, $AC = 8$, $\angle A = 60^\circ$. იპოვეთ $BC$ გვერდი და სამკუთხედზე შემოხაზული წრეწირის რადიუსი.
EN: In triangle $ABC$, $AB = 5$, $AC = 8$ and $\angle A = 60^\circ$. Find $BC$ and the radius of the circumscribed circle.
SKA: კოსინუსების თეორემა: $BC^2 = 25 + 64 - 2 \cdot 5 \cdot 8 \cdot \dfrac{1}{2} = 49 \Rightarrow BC = 7$

SEN: Law of cosines: $BC^2 = 25 + 64 - 2 \cdot 5 \cdot 8 \cdot \dfrac{1}{2} = 49 \Rightarrow BC = 7$
Law of sines: $2R = \dfrac{BC}{\sin A} = \dfrac{7}{\sqrt{3}/2} \Rightarrow R = \dfrac{7}{\sqrt{3}} = \dfrac{7\sqrt{3}}{3}$
AKA: $BC = 7$, $R = \dfrac{7\sqrt{3}}{3}$
AEN: $BC = 7$, $R = \dfrac{7\sqrt{3}}{3}$

KA: ნავმა დინების მიმართულებით გაცურა $48$ კმ და უკან დაბრუნდა; მთელ გზაზე დახარჯა $7$ საათი. იპოვეთ ნავის სიჩქარე მდგარ წყალში, თუ დინების სიჩქარე $2$ კმ/სთ-ია.
EN: A boat went $48$ km downstream and came back, spending $7$ hours in total. Find the boat's speed in still water if the current is $2$ km/h.
SKA: ნავის სიჩქარე $v$: დინებით $v + 2$, დინების საწინააღმდეგოდ $v - 2$
$\dfrac{48}{v + 2} + \dfrac{48}{v - 2} = 7 \Rightarrow 48 \cdot 2v = 7(v^2 - 4)$
$7v^2 - 96v - 28 = 0 \Rightarrow v = \dfrac{96 \pm \sqrt{9216 + 784}}{14} = \dfrac{96 \pm 100}{14}$
$v = 14$ (უარყოფითი ფესვი გამოირიცხება); შემოწმება: $\dfrac{48}{16} + \dfrac{48}{12} = 3 + 4 = 7$ ✓
SEN: Boat speed $v$: downstream $v + 2$, upstream $v - 2$
$\dfrac{48}{v + 2} + \dfrac{48}{v - 2} = 7 \Rightarrow 48 \cdot 2v = 7(v^2 - 4)$
$7v^2 - 96v - 28 = 0 \Rightarrow v = \dfrac{96 \pm \sqrt{9216 + 784}}{14} = \dfrac{96 \pm 100}{14}$
$v = 14$ (the negative root is rejected); check: $\dfrac{48}{16} + \dfrac{48}{12} = 3 + 4 = 7$ ✓
AKA: $14$ კმ/სთ
AEN: $14$ km/h

--- 4
KA: იპოვეთ $a$ პარამეტრის ყველა ის მნიშვნელობა, რომლისთვისაც $x^2 - 2ax + a^2 - 1 = 0$ განტოლების ორივე ფესვი ეკუთვნის $(-2; 4)$ შუალედს.
EN: Find all values of $a$ for which both roots of $x^2 - 2ax + a^2 - 1 = 0$ lie in the interval $(-2; 4)$.
SKA: $x^2 - 2ax + a^2 = 1 \Rightarrow (x - a)^2 = 1 \Rightarrow x_1 = a - 1,\ x_2 = a + 1$
ორივე $(-2; 4)$-შია $\iff a - 1 > -2$ და $a + 1 < 4$
$a > -1$ და $a < 3$
SEN: $x^2 - 2ax + a^2 = 1 \Rightarrow (x - a)^2 = 1 \Rightarrow x_1 = a - 1,\ x_2 = a + 1$
Both lie in $(-2; 4)$ $\iff a - 1 > -2$ and $a + 1 < 4$
$a > -1$ and $a < 3$
AKA: $a \in (-1; 3)$
AEN: $a \in (-1; 3)$
