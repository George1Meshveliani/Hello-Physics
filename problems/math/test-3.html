$k^2 \equiv (-1)^2 = 1 \pmod 8$

KA: ოთხკუთხედის ოთხივე წვერო წრეწირზე მდებარეობს. ამ ოთხკუთხედის ორი შიდა კუთხის გრადუსული ზომებია $70^\circ$ და $100^\circ$. იპოვეთ ამ ოთხკუთხედის დანარჩენი ორი კუთხის გრადუსული ზომები.
EN: A quadrilateral is inscribed in a circle. Two of its angles are $70^\circ$ and $100^\circ$. Find the other two angles.
OKA: $100^\circ$ და $70^\circ$
$90^\circ$ და $100^\circ$
$120^\circ$ და $70^\circ$
$110^\circ$ და $80^\circ$
OEN: $100^\circ$ and $70^\circ$
$90^\circ$ and $100^\circ$
$120^\circ$ and $70^\circ$
$110^\circ$ and $80^\circ$
C: 4
SKA: ჩახაზულ ოთხკუთხედში მოპირდაპირე კუთხეების ჯამი $180^\circ$-ია
$70^\circ + 100^\circ \ne 180^\circ$, ამიტომ ისინი მოპირდაპირე არ არის; მათი მოპირდაპირეები: $180^\circ - 70^\circ = 110^\circ$ და $180^\circ - 100^\circ = 80^\circ$
SEN: Opposite angles of a cyclic quadrilateral add up to $180^\circ$
$70^\circ + 100^\circ \ne 180^\circ$, so they are not opposite; their opposite angles are $180^\circ - 70^\circ = 110^\circ$ and $180^\circ - 100^\circ = 80^\circ$

KA: თუ $a$ და $b$ რიცხვები აკმაყოფილებს ტოლობას $a^2 - ab + b^2 = 5$, მაშინ ქვემოთ ჩამოთვლილი ტოლობებიდან რომელია ყოველთვის ჭეშმარიტი?
EN: If $a^2 - ab + b^2 = 5$, which equality is always true?
O: $a^3 - b^3 = 5a - 5b$
$a^3 + b^3 = 5a + 5b$
$b^3 + a^3 = 5b - 5a$
$a^3 - b^3 = 5b - 5a$
C: 2
SKA: $a^3 + b^3 = (a + b)(a^2 - ab + b^2) = 5(a + b) = 5a + 5b$
SEN: $a^3 + b^3 = (a + b)(a^2 - ab + b^2) = 5(a + b) = 5a + 5b$

KA: $m$ ნატურალური რიცხვის $n$ ნატურალურ რიცხვზე გაყოფის შედეგად მიიღება $5$-ის ტოლი ნაშთი. ქვემოთ ჩამოთვლილი რიცხვებიდან, რომლის ტოლი არ შეიძლება იყოს $m^2 - n^2$-ის $n$-ზე გაყოფისას მიღებული ნაშთი, თუ ცნობილია, რომ $n < 10$?
EN: When the natural number $m$ is divided by the natural number $n$ the remainder is $5$, and $n < 10$. Which of the following cannot be the remainder of $m^2 - n^2$ divided by $n$?
O: $1$
$2$
$4$
$7$
C: 2
SKA: ნაშთი $5$ ნიშნავს $n > 5$, ე.ი. $n \in \{6, 7, 8, 9\}$
$m^2 - n^2 \equiv 25 \pmod n$: $n = 6 \to 1$, $n = 7 \to 4$, $n = 8 \to 1$, $n = 9 \to 7$
შესაძლო ნაშთებია $1, 4, 7$; $2$ შეუძლებელია
SEN: A remainder of $5$ requires $n > 5$, so $n \in \{6, 7, 8, 9\}$
$m^2 - n^2 \equiv 25 \pmod n$: $n = 6 \to 1$, $n = 7 \to 4$, $n = 8 \to 1$, $n = 9 \to 7$
The possible remainders are $1, 4, 7$; $2$ is impossible

EN: A point is chosen at random inside square $ABCD$. What is the probability that its distance to vertex $A$ does not exceed its distance to the centre of the square?
O: $\dfrac{1}{8}$
$\dfrac{1}{4}$
$\dfrac{1}{16}$
$\dfrac{1}{15}$
C: 1
SKA: ვთქვათ, $A(0; 0)$, კვადრატის გვერდი $2$, ცენტრი $O(1; 1)$
$A$-სთან უფრო ახლოს მყოფი წერტილები — $AO$-ს შუამართობის ერთ მხარეს: $x + y \le 1$
ეს სამკუთხედია კათეტებით $1$: ფართობი $\dfrac{1}{2}$; $P = \dfrac{1/2}{4} = \dfrac{1}{8}$
SEN: Let $A(0; 0)$, side $2$, centre $O(1; 1)$
Points at least as close to $A$ lie on one side of the perpendicular bisector of $AO$: $x + y \le 1$
That is a triangle with legs $1$, area $\dfrac{1}{2}$; $P = \dfrac{1/2}{4} = \dfrac{1}{8}$

KA: ორი ხელოსანი ერთად მუშაობისას მთელ სამუშაოს ასრულებს $18$ დღეში. რამდენ დღეში შეასრულებს მთელ სამუშაოს პირველი ხელოსანი, თუ ის ორ დღეში ასრულებს სამუშაოს იმავე ნაწილს, რასაც მეორე ხელოსანი ასრულებს $3$ დღეში? (თითოეული ხელოსანი დროის ტოლ შუალედებში ტოლი მოცულობის სამუშაოს ასრულებს.)
EN: Two workers together finish a job in $18$ days. In how many days would the first finish it alone, if in $2$ days he does as much as the second does in $3$ days? (Each works at a constant rate.)
O: $35$
$32$
$30$
$28$
C: 3
SKA: $2v_1 = 3v_2 \Rightarrow v_2 = \dfrac{2}{3}v_1$
$v_1 + v_2 = \dfrac{5}{3}v_1 = \dfrac{1}{18} \Rightarrow v_1 = \dfrac{1}{30}$ — $30$ დღე
SEN: $2v_1 = 3v_2 \Rightarrow v_2 = \dfrac{2}{3}v_1$
$v_1 + v_2 = \dfrac{5}{3}v_1 = \dfrac{1}{18} \Rightarrow v_1 = \dfrac{1}{30}$, so $30$ days

EN: $P$ lies on side $AB$ and $Q$ on side $CD$ of rectangle $ABCD$. Find the ratio of the areas of $PBCQ$ and $APQD$ if $\dfrac{AP}{PB} = \dfrac{2}{5}$ and $\dfrac{CQ}{QD} = \dfrac{1}{3}$.

$\dfrac{\frac{5}{7} + \frac{1}{4}}{\frac{2}{7} + \frac{3}{4}} = \dfrac{20 + 7}{8 + 21} = \dfrac{27}{29}$

$P$ არის $\angle ABC$-ის ბისექტრისაზე: $BP = \dfrac{r}{\sin 30^\circ} = 2r$; $BD = BP + r = 3r = 24 \Rightarrow r = 8$
მხების სიგრძე: $BT = \sqrt{BP^2 - r^2} = \sqrt{256 - 64} = 8\sqrt{3}$
$BT_1PT_2$ ოთხკუთხედის ფართობი: $2 \cdot \dfrac{1}{2} \cdot 8\sqrt{3} \cdot 8 = 64\sqrt{3}$
$\angle T_1PT_2 = 180^\circ - 60^\circ = 120^\circ$, სექტორი: $\dfrac{120}{360}\pi \cdot 64 = \dfrac{64\pi}{3}$
გამუქებული ფართობი: $64\sqrt{3} - \dfrac{64\pi}{3}$
SEN: By symmetry the centre $P$ of the small circle lies on $BO$, and the circles touch at $D$, diametrically opposite $B$ ($BD = 24$)
$P$ lies on the bisector of $\angle ABC$: $BP = \dfrac{r}{\sin 30^\circ} = 2r$; $BD = BP + r = 3r = 24 \Rightarrow r = 8$
Tangent length: $BT = \sqrt{BP^2 - r^2} = \sqrt{256 - 64} = 8\sqrt{3}$
Area of kite $BT_1PT_2$: $2 \cdot \dfrac{1}{2} \cdot 8\sqrt{3} \cdot 8 = 64\sqrt{3}$
$\angle T_1PT_2 = 180^\circ - 60^\circ = 120^\circ$, sector: $\dfrac{120}{360}\pi \cdot 64 = \dfrac{64\pi}{3}$
Shaded area: $64\sqrt{3} - \dfrac{64\pi}{3}$
AKA: $64\sqrt{3} - \dfrac{64\pi}{3}$ სმ² $\approx 43{,}8$ სმ²
AEN: $64\sqrt{3} - \dfrac{64\pi}{3}$ cm² $\approx 43.8$ cm²

--- 4
KA: მანძილი $A$ და $B$ პუნქტებს შორის $22$ კილომეტრია. $A$ და $B$ პუნქტებიდან ერთდროულად გამოვიდა ორი ტურისტი და მუდმივი სიჩქარეებით დაიწყეს მოძრაობა ერთმანეთის შემხვედრი მიმართულებით, ვიდრე $A$ და $B$ პუნქტებს შორის მდებარე გარკვეულ წერტილში არ შეხვდნენ ერთმანეთს. $B$ პუნქტიდან გამოსულ ტურისტს $1$ კმ/სთ-ით უფრო სწრაფად რომ ემოძრავა, ხოლო $A$ პუნქტიდან გამოსულ ტურისტს იგივე სიჩქარით, რა სიჩქარითაც მოძრაობდა, მაშინ შეხვედრის ადგილი $A$ პუნქტთან $1$ კილომეტრით უფრო ახლოს იქნებოდა. იპოვეთ $B$ პუნქტიდან გამოსული ტურისტის სიჩქარე, თუ $A$ პუნქტიდან გამოსული ტურისტის სიჩქარეა $6$ კმ/სთ.
EN: Towns $A$ and $B$ are $22$ km apart. Two hikers leave $A$ and $B$ at the same time and walk towards each other at constant speeds until they meet. If the hiker from $B$ walked $1$ km/h faster (and the one from $A$ at the same speed), they would meet $1$ km closer to $A$. Find the speed of the hiker from $B$ if the hiker from $A$ walks at $6$ km/h.
SKA: $B$-დან გამოსულის სიჩქარე $v$; შეხვედრამდე დრო $\dfrac{22}{6 + v}$, შეხვედრის ადგილი $A$-დან: $\dfrac{132}{6 + v}$
მეორე შემთხვევაში: $\dfrac{132}{7 + v}$; პირობა: $\dfrac{132}{6 + v} - \dfrac{132}{7 + v} = 1$
$\dfrac{132}{(6 + v)(7 + v)} = 1 \Rightarrow v^2 + 13v - 90 = 0 \Rightarrow v = 5$ (დადებითი ფესვი)
შემოწმება: $\dfrac{132}{11} - \dfrac{132}{12} = 12 - 11 = 1$ ✓
SEN: Let the hiker from $B$ walk at $v$; they meet after $\dfrac{22}{6 + v}$ hours, $\dfrac{132}{6 + v}$ km from $A$
In the second case it is $\dfrac{132}{7 + v}$; the condition: $\dfrac{132}{6 + v} - \dfrac{132}{7 + v} = 1$
$\dfrac{132}{(6 + v)(7 + v)} = 1 \Rightarrow v^2 + 13v - 90 = 0 \Rightarrow v = 5$ (the positive root)
Check: $\dfrac{132}{11} - \dfrac{132}{12} = 12 - 11 = 1$ ✓
AKA: $5$ კმ/სთ
AEN: $5$ km/h

KA: $ABCD$ ტრაპეციაში $\angle A = 90^\circ$, $BC \parallel AD$, $AB = h$, $BC = a$, $AD = b$. ტრაპეციის $AB$ გვერდზე აღებულია $P$ წერტილი ისე, რომ $PAD$ და $PBC$ სამკუთხედებზე შემოხაზული წრეების ფართობების ჯამი იღებს უმცირეს შესაძლო მნიშვნელობას. იპოვეთ ეს უმცირესი მნიშვნელობა და $AP$ მონაკვეთის სიგრძე.
EN: In trapezoid $ABCD$, $\angle A = 90^\circ$, $BC \parallel AD$, $AB = h$, $BC = a$, $AD = b$. Point $P$ on side $AB$ is chosen so that the sum of the areas of the circumscribed discs of triangles $PAD$ and $PBC$ is as small as possible. Find this minimum and the length $AP$.
SKA: $\angle A = \angle B = 90^\circ$, ამიტომ $PAD$ და $PBC$ მართკუთხა სამკუთხედებია; შემოხაზული წრის დიამეტრი — ჰიპოტენუზა ($PD$ და $PC$)
$AP = x$: $S = \dfrac{\pi}{4}(PD^2 + PC^2) = \dfrac{\pi}{4}\left(x^2 + b^2 + (h - x)^2 + a^2\right)$
$x^2 + (h - x)^2 = 2\left(x - \dfrac{h}{2}\right)^2 + \dfrac{h^2}{2}$ — უმცირესია $x = \dfrac{h}{2}$-ზე
$S_{\min} = \dfrac{\pi}{4}\left(a^2 + b^2 + \dfrac{h^2}{2}\right) = \dfrac{\pi(2a^2 + 2b^2 + h^2)}{8}$
SEN: $\angle A = \angle B = 90^\circ$, so $PAD$ and $PBC$ are right triangles; the diameter of each circumcircle is the hypotenuse ($PD$, $PC$)
With $AP = x$: $S = \dfrac{\pi}{4}(PD^2 + PC^2) = \dfrac{\pi}{4}\left(x^2 + b^2 + (h - x)^2 + a^2\right)$
$x^2 + (h - x)^2 = 2\left(x - \dfrac{h}{2}\right)^2 + \dfrac{h^2}{2}$ is smallest at $x = \dfrac{h}{2}$
$S_{\min} = \dfrac{\pi}{4}\left(a^2 + b^2 + \dfrac{h^2}{2}\right) = \dfrac{\pi(2a^2 + 2b^2 + h^2)}{8}$
AKA: $S_{\min} = \dfrac{\pi(2a^2 + 2b^2 + h^2)}{8}$, $AP = \dfrac{h}{2}$
AEN: $S_{\min} = \dfrac{\pi(2a^2 + 2b^2 + h^2)}{8}$, $AP = \dfrac{h}{2}$
