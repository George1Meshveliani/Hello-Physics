KA: $\overline{52{*}4}$ ოთხნიშნა რიცხვი იყოფა $12$-ზე. რომელი ციფრი დგას ვარსკვლავის ადგილას?
EN: The four-digit number $\overline{52{*}4}$ is divisible by $12$. Which digit is the star?
O: $7$
$1$
$2$
$4$
C: 4
SKA: $12 = 3 \cdot 4$. $4$-ზე: ბოლო ორი ციფრი $\overline{{*}4}$ იყოფა $4$-ზე $\Rightarrow * \in \{0, 2, 4, 6, 8\}$
$3$-ზე: $5 + 2 + * + 4 = 11 + *$ იყოფა $3$-ზე $\Rightarrow * \in \{1, 4, 7\}$
საერთო: $* = 4$ ($5244 = 12 \cdot 437$)
SEN: $12 = 3 \cdot 4$. For $4$: the last two digits $\overline{{*}4}$ must be divisible by $4$ $\Rightarrow * \in \{0, 2, 4, 6, 8\}$
For $3$: $5 + 2 + * + 4 = 11 + *$ divisible by $3$ $\Rightarrow * \in \{1, 4, 7\}$
Common: $* = 4$ ($5244 = 12 \cdot 437$)

KA: $1, 2, 3, 4$ ციფრებისგან (გაუმეორებლად) შედგენილ ოთხნიშნა რიცხვებიდან შემთხვევით ირჩევენ ერთს. რას უდრის ალბათობა, რომ ის $4$-ზე იყოფა?
EN: A four-digit number made of the digits $1, 2, 3, 4$ (each used once) is chosen at random. What is the probability that it is divisible by $4$?
O: $\dfrac{1}{3}$
$\dfrac{1}{2}$
$\dfrac{1}{6}$
$\dfrac{1}{4}$
C: 4
SKA: სულ $4! = 24$ რიცხვი; $4$-ზე იყოფა, თუ ბოლო ორი ციფრი: $12$, $24$ ან $32$
თითოეულზე დანარჩენი ორი ციფრი $2$ გზით ლაგდება: $6$ რიცხვი; $P = \dfrac{6}{24} = \dfrac{1}{4}$
SEN: $4! = 24$ numbers; divisible by $4$ when the last two digits are $12$, $24$ or $32$

KA: წრეწირის $AB$ და $CD$ ქორდები ურთიერთმართობულია და იკვეთება $E$ წერტილში; $AE = 2$, $EB = 6$, $CE = 3$. იპოვეთ $ED$ და წრეწირის რადიუსი.
EN: Chords $AB$ and $CD$ of a circle are perpendicular and meet at $E$; $AE = 2$, $EB = 6$, $CE = 3$. Find $ED$ and the radius of the circle.
SKA: $AE \cdot EB = CE \cdot ED \Rightarrow 12 = 3 \cdot ED \Rightarrow ED = 4$
$E$ სათავეში, $AB$ — $x$ ღერძზე, $CD$ — $y$ ღერძზე: $A(-2; 0)$, $B(6; 0)$, $C(0; 3)$, $D(0; -4)$
ცენტრი $AB$-ისა და $CD$-ის შუამართობებზეა: $x = 2$, $y = -\dfrac{1}{2}$
$R^2 = (2 + 2)^2 + \left(\dfrac{1}{2}\right)^2 = 16 + \dfrac{1}{4} = \dfrac{65}{4} \Rightarrow R = \dfrac{\sqrt{65}}{2}$
SEN: $AE \cdot EB = CE \cdot ED \Rightarrow 12 = 3 \cdot ED \Rightarrow ED = 4$
Put $E$ at the origin, $AB$ on the $x$-axis and $CD$ on the $y$-axis: $A(-2; 0)$, $B(6; 0)$, $C(0; 3)$, $D(0; -4)$
The centre lies on the perpendicular bisectors of $AB$ and $CD$: $x = 2$, $y = -\dfrac{1}{2}$
$R^2 = (2 + 2)^2 + \left(\dfrac{1}{2}\right)^2 = 16 + \dfrac{1}{4} = \dfrac{65}{4} \Rightarrow R = \dfrac{\sqrt{65}}{2}$
AKA: $ED = 4$, $R = \dfrac{\sqrt{65}}{2}$
AEN: $ED = 4$, $R = \dfrac{\sqrt{65}}{2}$

KA: მატარებელი სადგურზე $12$ წუთით დაყოვნდა. დანიშნულების ადგილას დროულად რომ მისულიყო, დარჩენილ $60$ კმ-ზე მან სიჩქარე $15$ კმ/სთ-ით გაზარდა. იპოვეთ მატარებლის თავდაპირველი სიჩქარე.
EN: A train was held up at a station for $12$ minutes. To arrive on time, it increased its speed by $15$ km/h over the remaining $60$ km. Find its original speed.
SKA: $12$ წთ $= \dfrac{1}{5}$ სთ; სიჩქარე $v$
$\dfrac{60}{v} - \dfrac{60}{v + 15} = \dfrac{1}{5} \Rightarrow \dfrac{900}{v(v + 15)} = \dfrac{1}{5}$
$v^2 + 15v - 4500 = 0 \Rightarrow v = \dfrac{-15 + \sqrt{225 + 18000}}{2} = \dfrac{-15 + 135}{2} = 60$
შემოწმება: $\dfrac{60}{60} - \dfrac{60}{75} = 1 - 0{,}8 = 0{,}2$ სთ ✓
SEN: $12$ min $= \dfrac{1}{5}$ h; speed $v$
$\dfrac{60}{v} - \dfrac{60}{v + 15} = \dfrac{1}{5} \Rightarrow \dfrac{900}{v(v + 15)} = \dfrac{1}{5}$
$v^2 + 15v - 4500 = 0 \Rightarrow v = \dfrac{-15 + \sqrt{225 + 18000}}{2} = \dfrac{-15 + 135}{2} = 60$
Check: $\dfrac{60}{60} - \dfrac{60}{75} = 1 - 0.8 = 0.2$ h ✓
AKA: $60$ კმ/სთ
AEN: $60$ km/h

KA: იპოვეთ $a$ პარამეტრის ყველა ის მნიშვნელობა, რომლისთვისაც $x^2 - ax + a - 1 = 0$ განტოლებას აქვს ორი განსხვავებული დადებითი ფესვი, რომელთა კვადრატების ჯამი $10$-ის ტოლია.
EN: Find all values of $a$ for which $x^2 - ax + a - 1 = 0$ has two distinct positive roots whose squares add up to $10$.
SKA: $x = 1$ ყოველთვის ფესვია: $1 - a + a - 1 = 0$; ვიეტით მეორე ფესვი $a - 1$
ორი განსხვავებული დადებითი ფესვი: $a - 1 > 0$ და $a - 1 \ne 1$, ანუ $a > 1$, $a \ne 2$
$1^2 + (a - 1)^2 = 10 \Rightarrow (a - 1)^2 = 9 \Rightarrow a = 4$ ან $a = -2$
$a = -2$ არ ვარგა (ფესვი $-3 < 0$); $a = 4$: ფესვები $1$ და $3$ ✓
SEN: $x = 1$ is always a root: $1 - a + a - 1 = 0$; by Vieta the other root is $a - 1$
Two distinct positive roots: $a - 1 > 0$ and $a - 1 \ne 1$, i.e. $a > 1$, $a \ne 2$
$1^2 + (a - 1)^2 = 10 \Rightarrow (a - 1)^2 = 9 \Rightarrow a = 4$ or $a = -2$
$a = -2$ fails (root $-3 < 0$); $a = 4$ gives roots $1$ and $3$ ✓
AKA: $a = 4$
AEN: $a = 4$
