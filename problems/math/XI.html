--- easy powers
KA: გამოთვალეთ: $8^{\frac{2}{3}}$ და $16^{-\frac{1}{4}}$.
EN: Calculate: $8^{\frac{2}{3}}$ and $16^{-\frac{1}{4}}$.
HKA: $a^{\frac{m}{n}} = \sqrt[n]{a^m} = \left(\sqrt[n]{a}\right)^m$.
HEN: $a^{\frac{m}{n}} = \sqrt[n]{a^m} = \left(\sqrt[n]{a}\right)^m$.
SKA: $8^{\frac{2}{3}} = \left(\sqrt[3]{8}\right)^2 = 2^2 = 4$
$16^{-\frac{1}{4}} = \dfrac{1}{\sqrt[4]{16}} = \dfrac{1}{2}$
SEN: $8^{\frac{2}{3}} = \left(\sqrt[3]{8}\right)^2 = 2^2 = 4$
$16^{-\frac{1}{4}} = \dfrac{1}{\sqrt[4]{16}} = \dfrac{1}{2}$
AKA: $4$; $\dfrac{1}{2}$
AEN: $4$; $\dfrac{1}{2}$

--- easy powers
KA: გამოთვალეთ: $\sqrt[4]{81} + \sqrt[3]{-8}$.
EN: Calculate: $\sqrt[4]{81} + \sqrt[3]{-8}$.
HKA: კენტი ხარისხის ფესვი უარყოფითი რიცხვიდანაც არსებობს.
HEN: Odd roots of negative numbers exist.
SKA: $\sqrt[4]{81} = 3$ ($3^4 = 81$), $\ \sqrt[3]{-8} = -2$ ($(-2)^3 = -8$)
$3 + (-2) = 1$
SEN: $\sqrt[4]{81} = 3$ ($3^4 = 81$), $\ \sqrt[3]{-8} = -2$ ($(-2)^3 = -8$)
$3 + (-2) = 1$
AKA: $1$
AEN: $1$

--- easy logs
KA: გამოთვალეთ: $\log_2 32$, $\ \log_3 \dfrac{1}{9}$, $\ \lg 1000$.
EN: Calculate: $\log_2 32$, $\ \log_3 \dfrac{1}{9}$, $\ \lg 1000$.
HKA: $\log_a b = c \iff a^c = b$.
HEN: $\log_a b = c \iff a^c = b$.
SKA: $2^5 = 32 \Rightarrow \log_2 32 = 5$
$3^{-2} = \dfrac{1}{9} \Rightarrow \log_3 \dfrac{1}{9} = -2$
$10^3 = 1000 \Rightarrow \lg 1000 = 3$
SEN: $2^5 = 32 \Rightarrow \log_2 32 = 5$
$3^{-2} = \dfrac{1}{9} \Rightarrow \log_3 \dfrac{1}{9} = -2$
$10^3 = 1000 \Rightarrow \lg 1000 = 3$
AKA: $5$; $-2$; $3$
AEN: $5$; $-2$; $3$

--- easy logs
KA: გამოთვალეთ: $\log_6 4 + \log_6 9$.
EN: Calculate: $\log_6 4 + \log_6 9$.
HKA: $\log_a x + \log_a y = \log_a (xy)$.
HEN: $\log_a x + \log_a y = \log_a (xy)$.
SKA: $\log_6 4 + \log_6 9 = \log_6 36 = 2$
SEN: $\log_6 4 + \log_6 9 = \log_6 36 = 2$
AKA: $2$
AEN: $2$

--- easy logs
KA: ამოხსენით განტოლებები: ა) $2^{x + 1} = 16$; ბ) $\log_3 (x - 1) = 2$.
EN: Solve: a) $2^{x + 1} = 16$; b) $\log_3 (x - 1) = 2$.
HKA: ა) ორივე მხარე ჩაწერეთ $2$-ის ხარისხად. ბ) გადადით ხარისხზე და არ დაგავიწყდეთ $x - 1 > 0$.
HEN: a) Write both sides as powers of $2$. b) Convert to a power and remember $x - 1 > 0$.
SKA: ა) $2^{x + 1} = 2^4 \Rightarrow x + 1 = 4 \Rightarrow x = 3$
ბ) $x - 1 = 3^2 = 9 \Rightarrow x = 10$ ($10 - 1 > 0$ ✓)
SEN: a) $2^{x + 1} = 2^4 \Rightarrow x + 1 = 4 \Rightarrow x = 3$
b) $x - 1 = 3^2 = 9 \Rightarrow x = 10$ ($10 - 1 > 0$ ✓)
AKA: ა) $3$; ბ) $10$
AEN: a) $3$; b) $10$

--- easy binary
KA: გადაიყვანეთ $101101_2$ ათობით სისტემაში, ხოლო $19$ — ორობითში.
EN: Convert $101101_2$ to decimal and $19$ to binary.
HKA: ორობითი თანრიგები: $32, 16, 8, 4, 2, 1$. ათობითიდან ორობითში — თანმიმდევრული გაყოფა $2$-ზე, ნაშთები ქვემოდან ზემოთ.
HEN: Binary place values: $32, 16, 8, 4, 2, 1$. Decimal to binary — divide by $2$ repeatedly, read remainders bottom-up.
SKA: $101101_2 = 32 + 8 + 4 + 1 = 45$
$19 = 16 + 2 + 1 = 10011_2$
SEN: $101101_2 = 32 + 8 + 4 + 1 = 45$
$19 = 16 + 2 + 1 = 10011_2$
AKA: $45$; $10011_2$
AEN: $45$; $10011_2$

--- easy finance
KA: $2000$ ლარი შეიტანეს ანაბარზე წლიური $5\%$-ით (რთული პროცენტი). რამდენი იქნება ანაბარზე $2$ წლის შემდეგ?
EN: $2000$ lari is deposited at $5\%$ per year compound interest. How much is there after $2$ years?
HKA: $S = S_0 (1 + r)^n$.
HEN: $S = S_0 (1 + r)^n$.
SKA: $S = 2000 \cdot 1{,}05^2 = 2000 \cdot 1{,}1025 = 2205\ ₾$
SEN: $S = 2000 \cdot 1.05^2 = 2000 \cdot 1.1025 = 2205\ ₾$
AKA: $2205\ ₾$
AEN: $2205\ ₾$

--- easy trig
KA: გადაიყვანეთ $150^\circ$ რადიანებში, ხოლო $\dfrac{\pi}{12}$ — გრადუსებში.
EN: Convert $150^\circ$ to radians and $\dfrac{\pi}{12}$ to degrees.
HKA: $180^\circ = \pi$ რადიანი.
HEN: $180^\circ = \pi$ radians.
SKA: $150^\circ = 150 \cdot \dfrac{\pi}{180} = \dfrac{5\pi}{6}$
$\dfrac{\pi}{12} = \dfrac{180^\circ}{12} = 15^\circ$
SEN: $150^\circ = 150 \cdot \dfrac{\pi}{180} = \dfrac{5\pi}{6}$
$\dfrac{\pi}{12} = \dfrac{180^\circ}{12} = 15^\circ$
AKA: $\dfrac{5\pi}{6}$; $15^\circ$
AEN: $\dfrac{5\pi}{6}$; $15^\circ$

--- easy trig
KA: $\sin\alpha = \dfrac{3}{5}$, $\alpha$ — II მეოთხედის კუთხეა. იპოვეთ $\cos\alpha$ და $\tan\alpha$.
EN: $\sin\alpha = \dfrac{3}{5}$ and $\alpha$ is in quadrant II. Find $\cos\alpha$ and $\tan\alpha$.
HKA: $\sin^2\alpha + \cos^2\alpha = 1$; II მეოთხედში $\cos\alpha < 0$.
HEN: $\sin^2\alpha + \cos^2\alpha = 1$; in quadrant II $\cos\alpha < 0$.
SKA: $\cos\alpha = -\sqrt{1 - \dfrac{9}{25}} = -\dfrac{4}{5}$
$\tan\alpha = \dfrac{\sin\alpha}{\cos\alpha} = \dfrac{3/5}{-4/5} = -\dfrac{3}{4}$
SEN: $\cos\alpha = -\sqrt{1 - \dfrac{9}{25}} = -\dfrac{4}{5}$
$\tan\alpha = \dfrac{\sin\alpha}{\cos\alpha} = \dfrac{3/5}{-4/5} = -\dfrac{3}{4}$
AKA: $-\dfrac{4}{5}$; $-\dfrac{3}{4}$
AEN: $-\dfrac{4}{5}$; $-\dfrac{3}{4}$

--- easy trig
KA: გამოთვალეთ: $\sin\dfrac{\pi}{6} + \cos\dfrac{\pi}{3} + \tan\dfrac{\pi}{4}$.
EN: Calculate: $\sin\dfrac{\pi}{6} + \cos\dfrac{\pi}{3} + \tan\dfrac{\pi}{4}$.
HKA: $\dfrac{\pi}{6} = 30^\circ$, $\dfrac{\pi}{3} = 60^\circ$, $\dfrac{\pi}{4} = 45^\circ$.
HEN: $\dfrac{\pi}{6} = 30^\circ$, $\dfrac{\pi}{3} = 60^\circ$, $\dfrac{\pi}{4} = 45^\circ$.
SKA: $\dfrac{1}{2} + \dfrac{1}{2} + 1 = 2$
SEN: $\dfrac{1}{2} + \dfrac{1}{2} + 1 = 2$
AKA: $2$
AEN: $2$

--- easy trig
KA: იპოვეთ ფუნქციების პერიოდი და ამპლიტუდა: $y = \sin 3x$; $\ y = 2\cos\dfrac{x}{2}$.
EN: Find the period and amplitude of: $y = \sin 3x$; $\ y = 2\cos\dfrac{x}{2}$.
HKA: $y = A\sin(kx)$-ის პერიოდია $T = \dfrac{2\pi}{|k|}$, ამპლიტუდა $|A|$.
HEN: For $y = A\sin(kx)$ the period is $T = \dfrac{2\pi}{|k|}$ and the amplitude is $|A|$.
SKA: $y = \sin 3x$: $T = \dfrac{2\pi}{3}$, ამპლიტუდა $1$.
$y = 2\cos\dfrac{x}{2}$: $T = \dfrac{2\pi}{1/2} = 4\pi$, ამპლიტუდა $2$.
SEN: $y = \sin 3x$: $T = \dfrac{2\pi}{3}$, amplitude $1$.
$y = 2\cos\dfrac{x}{2}$: $T = \dfrac{2\pi}{1/2} = 4\pi$, amplitude $2$.
AKA: $\dfrac{2\pi}{3}$, $1$; $4\pi$, $2$
AEN: $\dfrac{2\pi}{3}$, $1$; $4\pi$, $2$

--- easy trig
KA: ამოხსენით განტოლება $\sin x = \dfrac{1}{2}$ შუალედზე $[0;\ 2\pi]$.
EN: Solve $\sin x = \dfrac{1}{2}$ on $[0,\ 2\pi]$.
HKA: ერთეულოვან წრეზე $y = \dfrac{1}{2}$ ორ წერტილს კვეთს: I და II მეოთხედებში.
HEN: On the unit circle $y = \dfrac{1}{2}$ meets two points: in quadrants I and II.
SKA: $x_1 = \dfrac{\pi}{6}$, $\ x_2 = \pi - \dfrac{\pi}{6} = \dfrac{5\pi}{6}$
SEN: $x_1 = \dfrac{\pi}{6}$, $\ x_2 = \pi - \dfrac{\pi}{6} = \dfrac{5\pi}{6}$
AKA: $\dfrac{\pi}{6}$; $\dfrac{5\pi}{6}$
AEN: $\dfrac{\pi}{6}$; $\dfrac{5\pi}{6}$

--- easy sequences
KA: იპოვეთ არითმეტიკული პროგრესიის $5, 9, 13, \dots$ პირველი $20$ წევრის ჯამი.
EN: Find the sum of the first $20$ terms of the arithmetic progression $5, 9, 13, \dots$
HKA: $S_n = \dfrac{2a_1 + (n - 1)d}{2} \cdot n$.
HEN: $S_n = \dfrac{2a_1 + (n - 1)d}{2} \cdot n$.
SKA: $a_1 = 5$, $d = 4$
$S_{20} = \dfrac{2 \cdot 5 + 19 \cdot 4}{2} \cdot 20 = 86 \cdot 10 = 860$
SEN: $a_1 = 5$, $d = 4$
$S_{20} = \dfrac{2 \cdot 5 + 19 \cdot 4}{2} \cdot 20 = 86 \cdot 10 = 860$
AKA: $860$
AEN: $860$

--- easy stereo
KA: სიბრტყის გარეთ მდებარე წერტილიდან სიბრტყისადმი გავლებულია $10$ სიგრძის დახრილი, რომლის გეგმილია $6$. რას უდრის მანძილი წერტილიდან სიბრტყემდე?
EN: From a point outside a plane, an oblique segment of length $10$ is drawn to the plane; its projection is $6$. How far is the point from the plane?
HKA: მართობი, დახრილი და გეგმილი მართკუთხა სამკუთხედს ქმნის; დახრილი — ჰიპოტენუზაა.
HEN: The perpendicular, the oblique and its projection form a right triangle; the oblique is the hypotenuse.
SKA: $d = \sqrt{10^2 - 6^2} = \sqrt{64} = 8$
SEN: $d = \sqrt{10^2 - 6^2} = \sqrt{64} = 8$
AKA: $8$
AEN: $8$

--- easy polyhedra
KA: კუბის წიბოა $3$. იპოვეთ მისი დიაგონალი, სრული ზედაპირის ფართობი და მოცულობა.
EN: A cube has edge $3$. Find its space diagonal, total surface area and volume.
HKA: $d = a\sqrt{3}$, $\ S = 6a^2$, $\ V = a^3$.
HEN: $d = a\sqrt{3}$, $\ S = 6a^2$, $\ V = a^3$.
SKA: $d = 3\sqrt{3} \approx 5{,}2$, $\ S = 6 \cdot 9 = 54$, $\ V = 27$
SEN: $d = 3\sqrt{3} \approx 5.2$, $\ S = 6 \cdot 9 = 54$, $\ V = 27$
AKA: $3\sqrt{3}$; $54$; $27$
AEN: $3\sqrt{3}$; $54$; $27$

--- easy polyhedra
KA: წესიერი ოთხკუთხა პირამიდის ფუძის გვერდია $6$, სიმაღლე — $4$. იპოვეთ აპოთემა, გვერდითი ზედაპირის ფართობი და მოცულობა.
EN: A regular square pyramid has base side $6$ and height $4$. Find the apothem (slant height), lateral surface area and volume.
HKA: აპოთემა — ჰიპოტენუზა სამკუთხედში, რომლის კათეტებია სიმაღლე და ფუძის გვერდის ნახევარი. $V = \dfrac{1}{3} S_{\text{ფ}} h$.
HEN: The apothem is the hypotenuse of a triangle with legs the height and half the base side. $V = \dfrac{1}{3} S_{\text{base}} h$.
SKA: აპოთემა: $\sqrt{4^2 + 3^2} = 5$
$S_{\text{გვ}} = 4 \cdot \dfrac{6 \cdot 5}{2} = 60$
$V = \dfrac{1}{3} \cdot 36 \cdot 4 = 48$
SEN: Apothem: $\sqrt{4^2 + 3^2} = 5$
$S_{\text{lat}} = 4 \cdot \dfrac{6 \cdot 5}{2} = 60$
$V = \dfrac{1}{3} \cdot 36 \cdot 4 = 48$
AKA: $5$; $60$; $48$
AEN: $5$; $60$; $48$

--- easy revolution
KA: იპოვეთ $3$ რადიუსიანი ბირთვის მოცულობა და სფეროს ზედაპირის ფართობი.
EN: Find the volume of a ball and the surface area of a sphere of radius $3$.
HKA: $V = \dfrac{4}{3}\pi R^3$, $\ S = 4\pi R^2$.
HEN: $V = \dfrac{4}{3}\pi R^3$, $\ S = 4\pi R^2$.
SKA: $V = \dfrac{4}{3}\pi \cdot 27 = 36\pi \approx 113$
$S = 4\pi \cdot 9 = 36\pi \approx 113$
SEN: $V = \dfrac{4}{3}\pi \cdot 27 = 36\pi \approx 113$
$S = 4\pi \cdot 9 = 36\pi \approx 113$
AKA: $36\pi$; $36\pi$
AEN: $36\pi$; $36\pi$

--- easy space
KA: იპოვეთ მანძილი $A(1;\ 2;\ 3)$ და $B(4;\ 6;\ 3)$ წერტილებს შორის.
EN: Find the distance between $A(1,\ 2,\ 3)$ and $B(4,\ 6,\ 3)$.
HKA: $AB = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2 + (z_2 - z_1)^2}$.
HEN: $AB = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2 + (z_2 - z_1)^2}$.
SKA: $AB = \sqrt{3^2 + 4^2 + 0^2} = 5$
SEN: $AB = \sqrt{3^2 + 4^2 + 0^2} = 5$
AKA: $5$
AEN: $5$

--- easy space
KA: მოცემულია $\vec{a}(1;\ 2;\ -2)$ და $\vec{b}(0;\ 1;\ 4)$. იპოვეთ $|\vec{a}|$ და $2\vec{a} + \vec{b}$.
EN: Given $\vec{a}(1,\ 2,\ -2)$ and $\vec{b}(0,\ 1,\ 4)$, find $|\vec{a}|$ and $2\vec{a} + \vec{b}$.
HKA: $|\vec{a}| = \sqrt{x^2 + y^2 + z^2}$; მოქმედებები — კოორდინატების მიხედვით.
HEN: $|\vec{a}| = \sqrt{x^2 + y^2 + z^2}$; operations go coordinate by coordinate.
SKA: $|\vec{a}| = \sqrt{1 + 4 + 4} = 3$
$2\vec{a} + \vec{b} = (2;\ 4;\ -4) + (0;\ 1;\ 4) = (2;\ 5;\ 0)$
SEN: $|\vec{a}| = \sqrt{1 + 4 + 4} = 3$
$2\vec{a} + \vec{b} = (2,\ 4,\ -4) + (0,\ 1,\ 4) = (2,\ 5,\ 0)$
AKA: $3$; $(2;\ 5;\ 0)$
AEN: $3$; $(2,\ 5,\ 0)$

--- easy stats
KA: იპოვეთ მონაცემების $2, 4, 4, 4, 5, 5, 7, 9$ საშუალო და სტანდარტული გადახრა.
EN: Find the mean and standard deviation of $2, 4, 4, 4, 5, 5, 7, 9$.
HKA: $\sigma = \sqrt{\dfrac{\sum (x_i - \bar{x})^2}{n}}$.
HEN: $\sigma = \sqrt{\dfrac{\sum (x_i - \bar{x})^2}{n}}$.
SKA: $\bar{x} = \dfrac{40}{8} = 5$
გადახრების კვადრატები: $9, 1, 1, 1, 0, 0, 4, 16$ — ჯამი $32$
$\sigma = \sqrt{\dfrac{32}{8}} = \sqrt{4} = 2$
SEN: $\bar{x} = \dfrac{40}{8} = 5$
Squared deviations: $9, 1, 1, 1, 0, 0, 4, 16$ — sum $32$
$\sigma = \sqrt{\dfrac{32}{8}} = \sqrt{4} = 2$
AKA: $5$; $2$
AEN: $5$; $2$

--- easy stats
KA: როგორი კორელაციაა (დადებითი, უარყოფითი თუ არ არის) ა) ადამიანის სიმაღლესა და ფეხსაცმლის ზომას შორის; ბ) მანქანის ასაკსა და მის ფასს შორის; გ) თვალის ფერსა და მათემატიკის ქულას შორის?
EN: What kind of correlation (positive, negative or none) is there between: a) a person's height and shoe size; b) a car's age and its price; c) eye colour and maths score?
HKA: დადებითი — ერთის ზრდისას მეორეც იზრდება; უარყოფითი — მეორე მცირდება.
HEN: Positive — as one grows, so does the other; negative — the other falls.
SKA: ა) მაღალ ადამიანებს, როგორც წესი, დიდი ფეხი აქვთ — **დადებითი**.
ბ) ძველი მანქანა იაფია — **უარყოფითი**.
გ) კავშირი არ არის — **კორელაცია არ არის**.
კორელაცია მიზეზ-შედეგობრივ კავშირს არ ნიშნავს!
SEN: a) Taller people usually have bigger feet — **positive**.
b) Older cars are cheaper — **negative**.
c) No connection — **no correlation**.
Correlation does not mean causation!

KA: ამოხსენით განტოლება: $4^x - 3 \cdot 2^x - 4 = 0$.

--- medium logs
KA: ამოხსენით განტოლება: $\log_2 x + \log_2 (x - 2) = 3$.
EN: Solve: $\log_2 x + \log_2 (x - 2) = 3$.

$x = 4$ or $x = -2$; with $x > 2$, $x = 4$.

AEN: $x = 4$

KA: შეადარეთ $\log_{0{,}5} 3$ და $\log_{0{,}5} 5$. შეადარეთ $2^{\sqrt{3}}$ და $2^{1{,}7}$. ახსენით ფუნქციის მონოტონურობით.

KA: წლიური $8\%$-ით (რთული პროცენტი) რამდენი სრული წლის შემდეგ გაორმაგდება ანაბარი? შეადარეთ „$72$-ის წესს“ ($72 : 8$).
EN: At $8\%$ compound interest per year, after how many whole years does a deposit double? Compare with the "rule of $72$" ($72 \div 8$).

HEN: $1.08^n \ge 2 \iff n \ge \dfrac{\lg 2}{\lg 1.08}$.

„$72$-ის წესი“: $72 : 8 = 9$ — კარგი მიახლოება.
SEN: $n \ge \dfrac{\lg 2}{\lg 1.08} \approx \dfrac{0.3010}{0.0334} \approx 9.01$
$1.08^9 \approx 1.999 < 2$, $\ 1.08^{10} \approx 2.159 > 2$ — $10$ whole years are needed.

AEN: $10$ years

HKA: სამი მართობის თეორემა: $AB \perp BC$, ამიტომ $SB \perp BC$-ც. ორწახნაგა კუთხის წრფივი კუთხეა $\angle SBA$.

AEN: $45^\circ$

KA: მონაცემების საშუალოა $10$, სტანდარტული გადახრა — $2$. თითოეული მონაცემი გარდაქმნეს ფორმულით $y = 3x + 1$. იპოვეთ ახალი საშუალო და სტანდარტული გადახრა.
EN: A data set has mean $10$ and standard deviation $2$. Each value is transformed by $y = 3x + 1$. Find the new mean and standard deviation.
HKA: მუდმივის დამატება საშუალოს ცვლის, მაგრამ გაფანტულობას — არა; გამრავლება ორივეს ამრავლებს.

$\sigma_y = |3| \cdot 2 = 6$

--- medium stats
KA: მოსწავლეების სიმაღლე ნორმალურად არის განაწილებული საშუალოთი $170\ \text{სმ}$ და სტანდარტული გადახრით $6\ \text{სმ}$. მოსწავლეთა დაახლოებით რა ნაწილს აქვს სიმაღლე $164$-სა და $176\ \text{სმ}$-ს შორის? $182\ \text{სმ}$-ზე მეტი?
EN: Students' heights are normally distributed with mean $170\ \text{cm}$ and standard deviation $6\ \text{cm}$. Roughly what fraction are between $164$ and $176\ \text{cm}$? Taller than $182\ \text{cm}$?
HKA: „$68$–$95$–$99{,}7$“ წესი: $\bar{x} \pm \sigma$-ში $\approx 68\%$, $\bar{x} \pm 2\sigma$-ში $\approx 95\%$.
HEN: The "$68$–$95$–$99.7$" rule: within $\bar{x} \pm \sigma$ about $68\%$, within $\bar{x} \pm 2\sigma$ about $95\%$.
SKA: $164$–$176 = 170 \pm 6 = \bar{x} \pm \sigma \Rightarrow \approx 68\%$
$182 = 170 + 2 \cdot 6 = \bar{x} + 2\sigma$; $\ \bar{x} \pm 2\sigma$-ს გარეთ $\approx 5\%$, სიმეტრიის გამო ზემოთ — $\approx 2{,}5\%$.
SEN: $164$–$176 = 170 \pm 6 = \bar{x} \pm \sigma \Rightarrow \approx 68\%$
$182 = 170 + 2 \cdot 6 = \bar{x} + 2\sigma$; outside $\bar{x} \pm 2\sigma$ is $\approx 5\%$, by symmetry $\approx 2.5\%$ above.
AKA: $\approx 68\%$; $\approx 2{,}5\%$
AEN: $\approx 68\%$; $\approx 2.5\%$

--- hard logs
KA: ამოხსენით განტოლება: $\lg(x + 1) + \lg(x - 1) = \lg 3$.
EN: Solve: $\lg(x + 1) + \lg(x - 1) = \lg 3$.
HKA: განსაზღვრის არე: $x > 1$. ფესვების შემოწმება აუცილებელია!
HEN: Domain: $x > 1$. Checking the roots is essential!
SKA: $\lg\big((x + 1)(x - 1)\big) = \lg 3 \Rightarrow x^2 - 1 = 3 \Rightarrow x = \pm 2$
$x = -2$ განსაზღვრის არეში არ შედის ($\lg(-1)$ არ არსებობს) $\Rightarrow x = 2$
SEN: $\lg\big((x + 1)(x - 1)\big) = \lg 3 \Rightarrow x^2 - 1 = 3 \Rightarrow x = \pm 2$
$x = -2$ is outside the domain ($\lg(-1)$ doesn't exist) $\Rightarrow x = 2$
AKA: $x = 2$
AEN: $x = 2$

--- hard logs
KA: ამოხსენით უტოლობა: $\log_2 (x - 3) < 2$.
EN: Solve: $\log_2 (x - 3) < 2$.
HKA: ფუძე $2 > 1$ — ფუნქცია ზრდადია, ნიშანი არ იცვლება. არ დაგავიწყდეთ $x - 3 > 0$.

--- hard logs
KA: ბაქტერიების რაოდენობა ყოველ $3$ საათში ორმაგდება; თავიდან $500$ ბაქტერიაა. რამდენი იქნება ისინი $1$ დღე-ღამის შემდეგ? როდის მიაღწევს მათი რიცხვი $10^6$-ს?
EN: A bacteria population doubles every $3$ hours, starting from $500$. How many are there after $1$ day? When does it reach $10^6$?
HKA: $N(t) = N_0 \cdot 2^{t/3}$; დროის საპოვნელად გამოიყენეთ ლოგარითმი.
HEN: $N(t) = N_0 \cdot 2^{t/3}$; use a logarithm to find the time.
SKA: $N(24) = 500 \cdot 2^{8} = 128\,000$
$500 \cdot 2^{t/3} = 10^6 \Rightarrow 2^{t/3} = 2000 \Rightarrow t = 3\log_2 2000 = 3 \cdot \dfrac{\lg 2000}{\lg 2} \approx 3 \cdot 10{,}97 \approx 32{,}9\ \text{სთ}$
SEN: $N(24) = 500 \cdot 2^{8} = 128\,000$
$500 \cdot 2^{t/3} = 10^6 \Rightarrow 2^{t/3} = 2000 \Rightarrow t = 3\log_2 2000 = 3 \cdot \dfrac{\lg 2000}{\lg 2} \approx 3 \cdot 10.97 \approx 32.9\ \text{h}$
AKA: $128\,000$; $\approx 33\ \text{სთ}$
AEN: $128\,000$; $\approx 33\ \text{h}$

--- hard finance
KA: $10\,000$ ლარის სესხი აიღეს $12$ თვით, თვიური $1\%$-ით (რთული პროცენტი), ტოლი ყოველთვიური გადასახადებით (ანუიტეტი). იპოვეთ თვიური გადასახადი. ($1{,}01^{12} \approx 1{,}1268$)
EN: A loan of $10\,000$ lari is taken for $12$ months at $1\%$ per month (compound), repaid in equal monthly instalments (an annuity). Find the monthly payment. ($1.01^{12} \approx 1.1268$)
HKA: ანუიტეტის ფორმულა: $P = \dfrac{S \cdot r}{1 - (1 + r)^{-n}}$.
HEN: Annuity formula: $P = \dfrac{S \cdot r}{1 - (1 + r)^{-n}}$.
SKA: **ფორმულა:** $P = \dfrac{S r}{1 - (1 + r)^{-n}}$ (გეომეტრიული პროგრესიის ჯამიდან)
$(1{,}01)^{-12} \approx \dfrac{1}{1{,}1268} \approx 0{,}8874$
$P = \dfrac{10\,000 \cdot 0{,}01}{1 - 0{,}8874} = \dfrac{100}{0{,}1126} \approx 888{,}5\ ₾$
სულ გადახდილი: $12 \cdot 888{,}5 \approx 10\,662\ ₾$
SEN: **Formula:** $P = \dfrac{S r}{1 - (1 + r)^{-n}}$ (from the sum of a geometric progression)
$(1.01)^{-12} \approx \dfrac{1}{1.1268} \approx 0.8874$
$P = \dfrac{10\,000 \cdot 0.01}{1 - 0.8874} = \dfrac{100}{0.1126} \approx 888.5\ ₾$
Total paid: $12 \cdot 888.5 \approx 10\,662\ ₾$
AKA: $\approx 888{,}5\ ₾$
AEN: $\approx 888.5\ ₾$

--- hard trig
KA: $\tan\alpha = \dfrac{1}{2}$, $\tan\beta = \dfrac{1}{3}$ ($\alpha, \beta$ — მახვილი კუთხეები). იპოვეთ $\alpha + \beta$.
EN: $\tan\alpha = \dfrac{1}{2}$ and $\tan\beta = \dfrac{1}{3}$ ($\alpha, \beta$ acute). Find $\alpha + \beta$.
HKA: $\tan(\alpha + \beta) = \dfrac{\tan\alpha + \tan\beta}{1 - \tan\alpha\tan\beta}$.
HEN: $\tan(\alpha + \beta) = \dfrac{\tan\alpha + \tan\beta}{1 - \tan\alpha\tan\beta}$.
SKA: $\tan(\alpha + \beta) = \dfrac{\frac{1}{2} + \frac{1}{3}}{1 - \frac{1}{6}} = \dfrac{5/6}{5/6} = 1$
$0 < \alpha + \beta < \pi$ და ტანგენსი $1 \Rightarrow \alpha + \beta = \dfrac{\pi}{4}$
SEN: $\tan(\alpha + \beta) = \dfrac{\frac{1}{2} + \frac{1}{3}}{1 - \frac{1}{6}} = \dfrac{5/6}{5/6} = 1$
$0 < \alpha + \beta < \pi$ with tangent $1 \Rightarrow \alpha + \beta = \dfrac{\pi}{4}$
AKA: $\dfrac{\pi}{4} = 45^\circ$
AEN: $\dfrac{\pi}{4} = 45^\circ$

--- hard trig
KA: (ჰარმონიული რხევის მოდელი) ნავსადგურში წყლის დონე (მეტრებში) აღიწერება ფორმულით $h(t) = 2\sin\dfrac{\pi t}{6} + 5$, სადაც $t$ — საათებია. იპოვეთ მაქსიმალური და მინიმალური დონე, პერიოდი და პირველ პერიოდში რამდენი საათი აღემატება დონე $6\ \text{მ}$-ს.
EN: (Harmonic model) The water level in a harbour (metres) is $h(t) = 2\sin\dfrac{\pi t}{6} + 5$, with $t$ in hours. Find the highest and lowest levels, the period, and how many hours in the first period the level is above $6\ \text{m}$.
HKA: $h > 6 \iff \sin\dfrac{\pi t}{6} > \dfrac{1}{2}$.
HEN: $h > 6 \iff \sin\dfrac{\pi t}{6} > \dfrac{1}{2}$.
SKA: $h_{\max} = 2 + 5 = 7\ \text{მ}$, $\ h_{\min} = -2 + 5 = 3\ \text{მ}$, $\ T = \dfrac{2\pi}{\pi/6} = 12\ \text{სთ}$
$\sin\dfrac{\pi t}{6} > \dfrac{1}{2} \Rightarrow \dfrac{\pi}{6} < \dfrac{\pi t}{6} < \dfrac{5\pi}{6} \Rightarrow 1 < t < 5$
$6\ \text{მ}$-ზე მაღლა: $4$ საათი.
SEN: $h_{\max} = 2 + 5 = 7\ \text{m}$, $\ h_{\min} = -2 + 5 = 3\ \text{m}$, $\ T = \dfrac{2\pi}{\pi/6} = 12\ \text{h}$
$\sin\dfrac{\pi t}{6} > \dfrac{1}{2} \Rightarrow \dfrac{\pi}{6} < \dfrac{\pi t}{6} < \dfrac{5\pi}{6} \Rightarrow 1 < t < 5$
Above $6\ \text{m}$: $4$ hours.
AKA: $7\ \text{მ}$; $3\ \text{მ}$; $12\ \text{სთ}$; $4$ სთ
AEN: $7\ \text{m}$; $3\ \text{m}$; $12\ \text{h}$; $4$ h

--- hard sequences
KA: სამი რიცხვი ქმნის გეომეტრიულ პროგრესიას; მათი ჯამია $21$, ნამრავლი — $216$. იპოვეთ ეს რიცხვები.
EN: Three numbers form a geometric progression; their sum is $21$ and their product is $216$. Find them.
HKA: აღნიშნეთ რიცხვები $\dfrac{b}{q}, b, bq$ — მაშინ ნამრავლი $b^3$-ია.
HEN: Write the numbers as $\dfrac{b}{q}, b, bq$ — then the product is $b^3$.
SKA: $b^3 = 216 \Rightarrow b = 6$
$\dfrac{6}{q} + 6 + 6q = 21 \Rightarrow 6q^2 - 15q + 6 = 0 \Rightarrow 2q^2 - 5q + 2 = 0 \Rightarrow q = 2$ ან $\dfrac{1}{2}$
რიცხვები: $3, 6, 12$ (ან $12, 6, 3$)
SEN: $b^3 = 216 \Rightarrow b = 6$
$\dfrac{6}{q} + 6 + 6q = 21 \Rightarrow 6q^2 - 15q + 6 = 0 \Rightarrow 2q^2 - 5q + 2 = 0 \Rightarrow q = 2$ or $\dfrac{1}{2}$
Numbers: $3, 6, 12$ (or $12, 6, 3$)
AKA: $3,\ 6,\ 12$
AEN: $3,\ 6,\ 12$

--- hard sequences
KA: (ოპტიმიზაცია) ორი დადებითი რიცხვის ჯამია $10$. როდის არის მათი კვადრატების ჯამი უმცირესი? რას უდრის ის? და როდის არის მათი ნამრავლი უდიდესი?
EN: (Optimisation) Two positive numbers add up to $10$. When is the sum of their squares smallest, and what is it? When is their product largest?
HKA: $y = 10 - x$; ორივე გამოსახულება $x$-ის კვადრატული ფუნქციაა.
HEN: $y = 10 - x$; both expressions are quadratic in $x$.
SKA: $x^2 + (10 - x)^2 = 2x^2 - 20x + 100 = 2(x - 5)^2 + 50 \ge 50$ — მინიმუმი $50$, როცა $x = y = 5$.
$x(10 - x) = 25 - (x - 5)^2 \le 25$ — მაქსიმუმი $25$, ისევ $x = y = 5$-ზე.
SEN: $x^2 + (10 - x)^2 = 2x^2 - 20x + 100 = 2(x - 5)^2 + 50 \ge 50$ — minimum $50$ when $x = y = 5$.
$x(10 - x) = 25 - (x - 5)^2 \le 25$ — maximum $25$, again at $x = y = 5$.
AKA: $5$ და $5$: მინიმუმი $50$, მაქსიმუმი $25$
AEN: $5$ and $5$: minimum $50$, maximum $25$

--- hard stereo
KA: კუბის წიბოა $6$. იპოვეთ მანძილი $A$ წვეროდან სიბრტყემდე, რომელიც გადის $A$-ს მეზობელ სამ წვეროზე.
EN: A cube has edge $6$. Find the distance from vertex $A$ to the plane through the three vertices adjacent to $A$.
HKA: განიხილეთ სამკუთხა პირამიდა: ფუძე — ეს სამკუთხედი, წვერო — $A$. მისი მოცულობა ორი გზით გამოთვალეთ.
HEN: Consider the triangular pyramid with this triangle as base and apex $A$. Compute its volume in two ways.
SKA: პირამიდის მოცულობა (ფუძე — მართკუთხა ტოლფერდა სამკუთხედი კათეტებით $a$): $V = \dfrac{1}{3} \cdot \dfrac{a^2}{2} \cdot a = \dfrac{a^3}{6}$
მეორე ფუძე — ტოლგვერდა სამკუთხედი გვერდით $a\sqrt{2}$: $S = \dfrac{(a\sqrt{2})^2\sqrt{3}}{4} = \dfrac{a^2\sqrt{3}}{2}$
$d = \dfrac{3V}{S} = \dfrac{a^3/2}{a^2\sqrt{3}/2} = \dfrac{a}{\sqrt{3}}$
**რიცხვები:** $d = \dfrac{6}{\sqrt{3}} = 2\sqrt{3} \approx 3{,}46$
SEN: Pyramid volume (base an isosceles right triangle with legs $a$): $V = \dfrac{1}{3} \cdot \dfrac{a^2}{2} \cdot a = \dfrac{a^3}{6}$
The other base is an equilateral triangle with side $a\sqrt{2}$: $S = \dfrac{(a\sqrt{2})^2\sqrt{3}}{4} = \dfrac{a^2\sqrt{3}}{2}$
$d = \dfrac{3V}{S} = \dfrac{a^3/2}{a^2\sqrt{3}/2} = \dfrac{a}{\sqrt{3}}$
**Numbers:** $d = \dfrac{6}{\sqrt{3}} = 2\sqrt{3} \approx 3.46$
AKA: $2\sqrt{3}$
AEN: $2\sqrt{3}$

--- hard polyhedra
KA: წესიერი ტეტრაედრის წიბოა $6$. იპოვეთ მისი სიმაღლე და მოცულობა.
EN: A regular tetrahedron has edge $6$. Find its height and volume.
HKA: სიმაღლის ფუძე ფუძის ცენტრია; ცენტრიდან წვერომდე მანძილი $R = \dfrac{a}{\sqrt{3}}$.
HEN: The foot of the height is the centre of the base; the distance from the centre to a vertex is $R = \dfrac{a}{\sqrt{3}}$.
SKA: $R = \dfrac{6}{\sqrt{3}} = 2\sqrt{3}$
$h = \sqrt{a^2 - R^2} = \sqrt{36 - 12} = \sqrt{24} = 2\sqrt{6} \approx 4{,}9$
$S_{\text{ფ}} = \dfrac{36\sqrt{3}}{4} = 9\sqrt{3}$, $\ V = \dfrac{1}{3} \cdot 9\sqrt{3} \cdot 2\sqrt{6} = 6\sqrt{18} = 18\sqrt{2} \approx 25{,}5$
SEN: $R = \dfrac{6}{\sqrt{3}} = 2\sqrt{3}$
$h = \sqrt{a^2 - R^2} = \sqrt{36 - 12} = \sqrt{24} = 2\sqrt{6} \approx 4.9$
$S_{\text{base}} = \dfrac{36\sqrt{3}}{4} = 9\sqrt{3}$, $\ V = \dfrac{1}{3} \cdot 9\sqrt{3} \cdot 2\sqrt{6} = 6\sqrt{18} = 18\sqrt{2} \approx 25.5$
AKA: $2\sqrt{6}$; $18\sqrt{2}$
AEN: $2\sqrt{6}$; $18\sqrt{2}$

--- hard revolution
KA: წვეროთი ქვემოთ დადგმულ კონუსურ ჭიქაში წყალი ჭიქის სიმაღლის ნახევრამდე ასხია. ჭიქის მოცულობის რა ნაწილს შეადგენს წყალი?
EN: A conical glass stands point-down and is filled with water to half its height. What fraction of the glass's volume is water?
HKA: წყალი პატარა კონუსია, რომელიც დიდის მსგავსია კოეფიციენტით $\dfrac{1}{2}$. მოცულობები შეეფარდება როგორც $k^3$.
HEN: The water is a small cone similar to the whole with factor $\dfrac{1}{2}$. Volumes scale as $k^3$.
SKA: $k = \dfrac{1}{2} \Rightarrow \dfrac{V_{\text{წყ}}}{V} = k^3 = \dfrac{1}{8}$
მხოლოდ $12{,}5\%$ — ჭიქა „ნახევრად სავსე“ მხოლოდ ეჩვენება!
SEN: $k = \dfrac{1}{2} \Rightarrow \dfrac{V_{\text{water}}}{V} = k^3 = \dfrac{1}{8}$
Only $12.5\%$ — the glass only looks "half full"!
AKA: $\dfrac{1}{8}$
AEN: $\dfrac{1}{8}$

--- hard space
KA: დაამტკიცეთ, რომ $A(1;\ 2;\ 3)$, $B(3;\ 6;\ 7)$ და $C(4;\ 8;\ 9)$ წერტილები ერთ წრფეზე მდებარეობს. რომელი წერტილია დანარჩენ ორს შორის?
EN: Prove that $A(1,\ 2,\ 3)$, $B(3,\ 6,\ 7)$ and $C(4,\ 8,\ 9)$ lie on one line. Which point is between the other two?
HKA: წერტილები კოლინეარულია, თუ $\overrightarrow{AC} = k\,\overrightarrow{AB}$.
HEN: The points are collinear if $\overrightarrow{AC} = k\,\overrightarrow{AB}$.
SKA: $\overrightarrow{AB} = (2;\ 4;\ 4)$, $\ \overrightarrow{AC} = (3;\ 6;\ 6) = 1{,}5\,\overrightarrow{AB}$ — ვექტორები კოლინეარულია, საერთო წერტილი $A$ $\Rightarrow$ ერთ წრფეზეა ∎
$k = 1{,}5 > 1 \Rightarrow C$ არის $B$-ს გაგრძელებაზე; შუაში მდებარეობს $B$.
SEN: $\overrightarrow{AB} = (2,\ 4,\ 4)$, $\ \overrightarrow{AC} = (3,\ 6,\ 6) = 1.5\,\overrightarrow{AB}$ — the vectors are collinear with common point $A$ $\Rightarrow$ one line ∎
$k = 1.5 > 1 \Rightarrow C$ lies beyond $B$; $B$ is in the middle.
AKA: ერთ წრფეზეა; შუაში $B$
AEN: collinear; $B$ is in the middle

--- hard stats
KA: იპოვეთ მონაცემების $6, 8, 10, 12, 14$ დისპერსია და სტანდარტული გადახრა. როგორ შეიცვლება სტანდარტული გადახრა, თუ ყველა მონაცემს $5$-ს დავუმატებთ?
EN: Find the variance and standard deviation of $6, 8, 10, 12, 14$. How does the standard deviation change if $5$ is added to every value?
HKA: $D = \dfrac{\sum (x_i - \bar{x})^2}{n}$, $\ \sigma = \sqrt{D}$.
HEN: $D = \dfrac{\sum (x_i - \bar{x})^2}{n}$, $\ \sigma = \sqrt{D}$.
SKA: $\bar{x} = 10$; გადახრების კვადრატები: $16, 4, 0, 4, 16$
$D = \dfrac{40}{5} = 8$, $\ \sigma = \sqrt{8} = 2\sqrt{2} \approx 2{,}83$
$5$-ის დამატება ყველა მონაცემს ერთნაირად გადაწევს — $\sigma$ **არ შეიცვლება**.
SEN: $\bar{x} = 10$; squared deviations: $16, 4, 0, 4, 16$
$D = \dfrac{40}{5} = 8$, $\ \sigma = \sqrt{8} = 2\sqrt{2} \approx 2.83$
Adding $5$ shifts every value equally — $\sigma$ **does not change**.
AKA: $8$; $2\sqrt{2}$; არ შეიცვლება
AEN: $8$; $2\sqrt{2}$; unchanged

--- hard stats
KA: ორ კლასში საკონტროლოს საშუალო ქულა $70$-ია, მაგრამ A კლასში $\sigma = 5$, B კლასში $\sigma = 15$. მოსწავლემ მიიღო $85$ ქულა. რომელ კლასში იქნებოდა ეს შედეგი უფრო გამორჩეული? (გამოიყენეთ $z$-ქულა $z = \dfrac{x - \bar{x}}{\sigma}$.)
EN: Two classes both have a mean test score of $70$, but class A has $\sigma = 5$ and class B has $\sigma = 15$. A student scores $85$. In which class would this result stand out more? (Use the $z$-score $z = \dfrac{x - \bar{x}}{\sigma}$.)
HKA: $z$ აჩვენებს, რამდენი სტანდარტული გადახრითაა შედეგი საშუალოზე მეტი.
HEN: $z$ shows how many standard deviations the result is above the mean.
SKA: A: $z = \dfrac{85 - 70}{5} = 3$ — უკიდურესად იშვიათი შედეგია (ნორმალური განაწილებისას $\approx 0{,}1\%$-ზე ნაკლები ჯობნის).
B: $z = \dfrac{85 - 70}{15} = 1$ — კარგი, მაგრამ ჩვეულებრივი შედეგი ($\approx 16\%$ ჯობნის).
A კლასში ეს შედეგი გაცილებით გამორჩეულია.
SEN: A: $z = \dfrac{85 - 70}{5} = 3$ — extremely rare (with a normal distribution fewer than $\approx 0.1\%$ do better).
B: $z = \dfrac{85 - 70}{15} = 1$ — good but ordinary ($\approx 16\%$ do better).
The result stands out far more in class A.
AKA: A კლასში ($z = 3$)
AEN: class A ($z = 3$)

--- hard logs olympiad
KA: კალკულატორის გარეშე შეადარეთ $\log_2 3$ და $\log_3 5$.
EN: Without a calculator, compare $\log_2 3$ and $\log_3 5$.
HKA: შეადარეთ ორივე $\dfrac{3}{2}$-ს.
HEN: Compare each with $\dfrac{3}{2}$.
SKA: $\log_2 3 > \dfrac{3}{2} \iff 3 > 2^{3/2} \iff 3^2 > 2^3 \iff 9 > 8$ ✓
$\log_3 5 < \dfrac{3}{2} \iff 5 < 3^{3/2} \iff 5^2 < 3^3 \iff 25 < 27$ ✓
$\log_3 5 < \dfrac{3}{2} < \log_2 3 \Rightarrow \log_2 3 > \log_3 5$
SEN: $\log_2 3 > \dfrac{3}{2} \iff 3 > 2^{3/2} \iff 3^2 > 2^3 \iff 9 > 8$ ✓
$\log_3 5 < \dfrac{3}{2} \iff 5 < 3^{3/2} \iff 5^2 < 3^3 \iff 25 < 27$ ✓
$\log_3 5 < \dfrac{3}{2} < \log_2 3 \Rightarrow \log_2 3 > \log_3 5$
AKA: $\log_2 3 > \log_3 5$
AEN: $\log_2 3 > \log_3 5$

--- hard binary olympiad
KA: გვაქვს საწონები $1, 2, 4, 8, \dots, 512$ გრამი (თითო ცალი). დაამტკიცეთ, რომ თეფშიან სასწორზე (საწონები მხოლოდ ერთ თეფშზე) შეიძლება აიწონოს ნებისმიერი მთელი მასა $1$-დან $1023$ გრამამდე. რომელი საწონებია საჭირო $700$ გრამისთვის?
EN: We have weights of $1, 2, 4, 8, \dots, 512$ grams (one of each). Prove that on a balance (weights on one pan only) any whole mass from $1$ to $1023$ grams can be weighed. Which weights are needed for $700$ grams?
HKA: ყოველ რიცხვს აქვს ერთადერთი ორობითი ჩანაწერი — „1“ ნიშნავს, რომ საწონი გამოიყენება.
HEN: Every number has a unique binary representation — a "1" means that weight is used.
SKA: $1 + 2 + \dots + 512 = 2^{10} - 1 = 1023$. ყოველი $n \le 1023$ იწერება მაქსიმუმ $10$ ორობითი ციფრით; ციფრი „1“ $2^k$ თანრიგში ნიშნავს $2^k$ გრამიან საწონს ∎
$700 = 512 + 128 + 32 + 16 + 8 + 4 = 1010111100_2$
საწონები: $512, 128, 32, 16, 8, 4$.
SEN: $1 + 2 + \dots + 512 = 2^{10} - 1 = 1023$. Every $n \le 1023$ has at most $10$ binary digits; a "1" in place $2^k$ means using the $2^k$-gram weight ∎
$700 = 512 + 128 + 32 + 16 + 8 + 4 = 1010111100_2$
Weights: $512, 128, 32, 16, 8, 4$.
AKA: $512, 128, 32, 16, 8, 4$
AEN: $512, 128, 32, 16, 8, 4$

--- hard trig olympiad
KA: იპოვეთ $3\sin x + 4\cos x$ გამოსახულების უდიდესი და უმცირესი მნიშვნელობა.
EN: Find the largest and smallest values of $3\sin x + 4\cos x$.
HKA: ჩაწერეთ როგორც $5\left(\dfrac{3}{5}\sin x + \dfrac{4}{5}\cos x\right)$ და შეამჩნიეთ, რომ $\left(\dfrac{3}{5}\right)^2 + \left(\dfrac{4}{5}\right)^2 = 1$.
HEN: Write it as $5\left(\dfrac{3}{5}\sin x + \dfrac{4}{5}\cos x\right)$ and note $\left(\dfrac{3}{5}\right)^2 + \left(\dfrac{4}{5}\right)^2 = 1$.
SKA: არსებობს $\varphi$, რომ $\cos\varphi = \dfrac{3}{5}$, $\sin\varphi = \dfrac{4}{5}$.
$3\sin x + 4\cos x = 5(\sin x\cos\varphi + \cos x\sin\varphi) = 5\sin(x + \varphi)$
$-1 \le \sin(x + \varphi) \le 1 \Rightarrow$ მნიშვნელობები $[-5;\ 5]$-შია.
SEN: There is a $\varphi$ with $\cos\varphi = \dfrac{3}{5}$, $\sin\varphi = \dfrac{4}{5}$.
$3\sin x + 4\cos x = 5(\sin x\cos\varphi + \cos x\sin\varphi) = 5\sin(x + \varphi)$
$-1 \le \sin(x + \varphi) \le 1 \Rightarrow$ the values fill $[-5,\ 5]$.
AKA: $5$ და $-5$
AEN: $5$ and $-5$

--- hard sequences olympiad
KA: გამოთვალეთ ჯამი $1 + 11 + 111 + \dots + \underbrace{11\ldots1}_{n}$ ზოგადად და შეამოწმეთ $n = 5$-ისთვის.
EN: Find the sum $1 + 11 + 111 + \dots + \underbrace{11\ldots1}_{n}$ in general and check it for $n = 5$.
HKA: $\underbrace{11\ldots1}_{k} = \dfrac{10^k - 1}{9}$. შემდეგ გამოიყენეთ გეომეტრიული პროგრესიის ჯამი.
HEN: $\underbrace{11\ldots1}_{k} = \dfrac{10^k - 1}{9}$. Then use the sum of a geometric progression.
SKA: $S = \sum_{k=1}^{n} \dfrac{10^k - 1}{9} = \dfrac{1}{9}\left(\dfrac{10(10^n - 1)}{9} - n\right) = \dfrac{10^{n+1} - 10 - 9n}{81}$
$n = 5$: $\dfrac{10^6 - 10 - 45}{81} = \dfrac{999\,945}{81} = 12\,345$
შემოწმება: $1 + 11 + 111 + 1111 + 11\,111 = 12\,345$ ✓
SEN: $S = \sum_{k=1}^{n} \dfrac{10^k - 1}{9} = \dfrac{1}{9}\left(\dfrac{10(10^n - 1)}{9} - n\right) = \dfrac{10^{n+1} - 10 - 9n}{81}$
$n = 5$: $\dfrac{10^6 - 10 - 45}{81} = \dfrac{999\,945}{81} = 12\,345$
Check: $1 + 11 + 111 + 1111 + 11\,111 = 12\,345$ ✓
AKA: $\dfrac{10^{n+1} - 10 - 9n}{81}$; $12\,345$
AEN: $\dfrac{10^{n+1} - 10 - 9n}{81}$; $12\,345$

--- hard polyhedra olympiad
KA: $2$ წიბოიანი კუბი გადაკვეთეს სიბრტყით, რომელიც გადის ექვსი წიბოს შუაწერტილზე (კუბის ცენტრზე, მის დიაგონალის მართობულად). დაამტკიცეთ, რომ კვეთა წესიერი ექვსკუთხედია და იპოვეთ მისი ფართობი.
EN: A cube with edge $2$ is cut by a plane through the midpoints of six edges (through the centre, perpendicular to a space diagonal). Prove that the section is a regular hexagon and find its area.
HKA: მეზობელი შუაწერტილები ერთ წახნაგზეა; მათ შორის მანძილი — მართკუთხა სამკუთხედის ჰიპოტენუზა, კათეტებით $1$ და $1$.
HEN: Neighbouring midpoints lie on one face; their distance is the hypotenuse of a right triangle with legs $1$ and $1$.
SKA: ყოველი ორი მეზობელი შუაწერტილი ერთ წახნაგზეა და ქმნის კათეტებით $1$, $1$ მართკუთხა სამკუთხედის ჰიპოტენუზას: გვერდი $\sqrt{2}$ — ექვსივე გვერდი ტოლია.
ყოველი შუაწერტილი კუბის ცენტრიდან ერთნაირად, $\sqrt{0^2 + 1^2 + 1^2} = \sqrt{2}$ მანძილითაა დაშორებული — ექვსკუთხედი წრეწირშია ჩახაზული. ტოლგვერდა ჩახაზული მრავალკუთხედი წესიერია ∎
$S = \dfrac{3\sqrt{3}}{2} a^2 = \dfrac{3\sqrt{3}}{2} \cdot 2 = 3\sqrt{3} \approx 5{,}2$
SEN: Each pair of neighbouring midpoints lies on one face and forms the hypotenuse of a right triangle with legs $1$ and $1$: side $\sqrt{2}$ — all six sides are equal.
Every midpoint is the same distance from the cube's centre, $\sqrt{0^2 + 1^2 + 1^2} = \sqrt{2}$ — the hexagon is inscribed in a circle. An equilateral polygon inscribed in a circle is regular ∎
$S = \dfrac{3\sqrt{3}}{2} a^2 = \dfrac{3\sqrt{3}}{2} \cdot 2 = 3\sqrt{3} \approx 5.2$
AKA: $3\sqrt{3}$
AEN: $3\sqrt{3}$

AEN: $2, 6, 18$

--- hard binary olympiad
KA: $15$ ქვიდან ორი მოთამაშე რიგრიგობით იღებს $1$, $2$ ან $3$ ქვას. ვინც ბოლო ქვას აიღებს, იგებს. ვის აქვს მომგებიანი სტრატეგია და როგორი?
EN: There are $15$ stones. Two players take turns removing $1$, $2$ or $3$ stones. Whoever takes the last stone wins. Who has a winning strategy, and what is it?
HKA: წამგებიანი პოზიციებია $4$-ის ჯერადები.
HEN: The losing positions are the multiples of $4$.
SKA: თუ მოწინააღმდეგის წინაშე $4k$ ქვაა, ის რამდენსაც არ უნდა აიღოს ($m$), თქვენ აიღებთ $4 - m$-ს და ისევ $4(k - 1)$ დარჩება — ბოლოს $0$, ე.ი. ბოლო ქვა თქვენია.
$15 = 4 \cdot 3 + 3$: პირველი მოთამაშე იღებს $3$-ს ($12$ რჩება) და შემდეგ ყოველთვის ავსებს $4$-მდე — **პირველი იგებს**.
SEN: If your opponent faces $4k$ stones, whatever they take ($m$), you take $4 - m$ and $4(k - 1)$ remain — eventually $0$, so the last stone is yours.
$15 = 4 \cdot 3 + 3$: the first player takes $3$ (leaving $12$) and then always completes to $4$ — **the first player wins**.
AKA: პირველი; აიღოს $3$, შემდეგ ავსოს $4$-მდე
AEN: the first player; take $3$, then complete each round to $4$

--- hard trig olympiad
KA: გამოთვალეთ: $\cos 20^\circ \cdot \cos 40^\circ \cdot \cos 80^\circ$.
EN: Evaluate: $\cos 20^\circ \cdot \cos 40^\circ \cdot \cos 80^\circ$.
HKA: გაამრავლეთ და გაყავით $\sin 20^\circ$-ზე და სამჯერ გამოიყენეთ $2\sin\alpha\cos\alpha = \sin 2\alpha$.
HEN: Multiply and divide by $\sin 20^\circ$ and use $2\sin\alpha\cos\alpha = \sin 2\alpha$ three times.
SKA: $8\sin 20^\circ \cos 20^\circ \cos 40^\circ \cos 80^\circ = 4\sin 40^\circ \cos 40^\circ \cos 80^\circ = 2\sin 80^\circ \cos 80^\circ = \sin 160^\circ$
$\sin 160^\circ = \sin 20^\circ$
$P = \dfrac{\sin 20^\circ}{8\sin 20^\circ} = \dfrac{1}{8}$
SEN: $8\sin 20^\circ \cos 20^\circ \cos 40^\circ \cos 80^\circ = 4\sin 40^\circ \cos 40^\circ \cos 80^\circ = 2\sin 80^\circ \cos 80^\circ = \sin 160^\circ$
$\sin 160^\circ = \sin 20^\circ$
$P = \dfrac{\sin 20^\circ}{8\sin 20^\circ} = \dfrac{1}{8}$
AKA: $\dfrac{1}{8}$
AEN: $\dfrac{1}{8}$

--- hard sequences olympiad
KA: გამოთვალეთ: $\dfrac{1}{1 \cdot 2} + \dfrac{1}{2 \cdot 3} + \dots + \dfrac{1}{99 \cdot 100}$.
EN: Evaluate: $\dfrac{1}{1 \cdot 2} + \dfrac{1}{2 \cdot 3} + \dots + \dfrac{1}{99 \cdot 100}$.
HKA: $\dfrac{1}{n(n + 1)} = \dfrac{1}{n} - \dfrac{1}{n + 1}$.
HEN: $\dfrac{1}{n(n + 1)} = \dfrac{1}{n} - \dfrac{1}{n + 1}$.
SKA: $\left(1 - \dfrac{1}{2}\right) + \left(\dfrac{1}{2} - \dfrac{1}{3}\right) + \dots + \left(\dfrac{1}{99} - \dfrac{1}{100}\right)$
შუა წევრები ბათილდება: $1 - \dfrac{1}{100} = \dfrac{99}{100}$
SEN: $\left(1 - \dfrac{1}{2}\right) + \left(\dfrac{1}{2} - \dfrac{1}{3}\right) + \dots + \left(\dfrac{1}{99} - \dfrac{1}{100}\right)$
The middle terms cancel: $1 - \dfrac{1}{100} = \dfrac{99}{100}$
AKA: $\dfrac{99}{100}$
AEN: $\dfrac{99}{100}$

--- hard polyhedra olympiad
KA: წესიერი ტეტრაედრის ყველა წიბოა $a$. დაამტკიცეთ, რომ მისი მოპირდაპირე (აცდენილი) წიბოები პერპენდიკულარულია და იპოვეთ მათ შორის მანძილი.
EN: All edges of a regular tetrahedron equal $a$. Prove that opposite (skew) edges are perpendicular and find the distance between them.
HKA: $ABCD$-ში $AB$ და $CD$: $CD$-ს შუაწერტილი $M$; $AM \perp CD$, $BM \perp CD$. მანძილი — $AB$ და $CD$ შუაწერტილების შემაერთებელი მონაკვეთი.
HEN: In $ABCD$ take $AB$ and $CD$, with $M$ the midpoint of $CD$; $AM \perp CD$, $BM \perp CD$. The distance is the segment joining the midpoints of $AB$ and $CD$.
SKA: $ACD$ და $BCD$ ტოლგვერდაა $\Rightarrow AM \perp CD$, $BM \perp CD \Rightarrow CD \perp (ABM) \Rightarrow CD \perp AB$ ∎
$AM = BM = \dfrac{a\sqrt{3}}{2}$; $N$ — $AB$-ს შუაწერტილი, $MN \perp AB$ და $MN \perp CD$.
$MN = \sqrt{\dfrac{3a^2}{4} - \dfrac{a^2}{4}} = \dfrac{a}{\sqrt{2}} = \dfrac{a\sqrt{2}}{2}$
SEN: $ACD$ and $BCD$ are equilateral $\Rightarrow AM \perp CD$, $BM \perp CD \Rightarrow CD \perp (ABM) \Rightarrow CD \perp AB$ ∎
$AM = BM = \dfrac{a\sqrt{3}}{2}$; with $N$ the midpoint of $AB$, $MN \perp AB$ and $MN \perp CD$.
$MN = \sqrt{\dfrac{3a^2}{4} - \dfrac{a^2}{4}} = \dfrac{a}{\sqrt{2}} = \dfrac{a\sqrt{2}}{2}$
AKA: $\dfrac{a\sqrt{2}}{2}$
AEN: $\dfrac{a\sqrt{2}}{2}$

HKA: ინდუქცია; უდიდესი $2^k \le n$.
HEN: Induction; take the largest $2^k \le n$.
SKA: არსებობა: $n - 2^k < 2^k$, ინდუქციით $n - 2^k$ იწერება ხარისხებით $< 2^k$
ერთადერთობა: $1 + 2 + \dots + 2^{k-1} = 2^k - 1 < 2^k$, ამიტომ $2^k$ აუცილებლად შედის
SEN: Existence: $n - 2^k < 2^k$, and by induction $n - 2^k$ uses powers below $2^k$

AKA: დამტკიცებულია
AEN: proved

--- hard sequences
KA: ოთხი რიცხვიდან პირველი სამი გეომეტრიული პროგრესიაა, ბოლო სამი — არითმეტიკული. პირველისა და მეოთხის ჯამია $14$, შუა ორისა — $12$. იპოვეთ რიცხვები.
EN: Of four numbers, the first three form a geometric progression and the last three an arithmetic one. The first and fourth add to $14$, the middle two to $12$. Find them.
HKA: $a, b, c, d$: $b^2 = ac$, $2c = b + d$.
HEN: $a, b, c, d$: $b^2 = ac$, $2c = b + d$.
SKA: $c = 12 - b$, $d = 2c - b = 24 - 3b$, $a = 14 - d = 3b - 10$
$b^2 = (3b - 10)(12 - b) \Rightarrow 4b^2 - 46b + 120 = 0 \Rightarrow b = 4$ ან $7{,}5$
$2, 4, 8, 12$ ან $12{,}5;\ 7{,}5;\ 4{,}5;\ 1{,}5$
SEN: $c = 12 - b$, $d = 2c - b = 24 - 3b$, $a = 14 - d = 3b - 10$
$b^2 = (3b - 10)(12 - b) \Rightarrow 4b^2 - 46b + 120 = 0 \Rightarrow b = 4$ or $7.5$
$2, 4, 8, 12$ or $12.5,\ 7.5,\ 4.5,\ 1.5$
AKA: $2, 4, 8, 12$ ან $12{,}5;\ 7{,}5;\ 4{,}5;\ 1{,}5$
AEN: $2, 4, 8, 12$ or $12.5, 7.5, 4.5, 1.5$

KA: რა უდიდესი მოცულობის ღია ყუთი მიიღება $12 \times 12$ კვადრატიდან, თუ კუთხეებში $x \times x$ კვადრატებს ამოვჭრით? (შეამოწმეთ $x = 1, 2, 3$)
EN: What's the largest volume of an open box made from a $12 \times 12$ square by cutting $x \times x$ corners? (Try $x = 1, 2, 3$.)

HEN: $V = x(12 - 2x)^2$.

მაქსიმუმი $x = 2$-ზე: $128$ (ზუსტად — წარმოებულით)
SEN: $V(1) = 100$, $V(2) = 128$, $V(3) = 108$
The maximum is at $x = 2$: $128$ (exactly, by calculus)

AEN: $128$ ($x = 2$)

KA: კვადრატში ჩახაზულია წრე, წრეში — კვადრატი და ა.შ. პირველი კვადრატის გვერდია $a$. იპოვეთ ყველა წრის ფართობების ჯამი.

SEN: The first circle has area $\dfrac{\pi a^2}{4}$; $\ S = \dfrac{\pi a^2 / 4}{1 - \frac{1}{2}} = \dfrac{\pi a^2}{2}$

AEN: $\dfrac{\pi a^2}{2}$

--- hard sequences
KA: არითმეტიკულ პროგრესიაში $a_1 + a_5 = 18$, $a_2 \cdot a_4 = 80$. იპოვეთ პროგრესია.

$7, 8, 9, \dots$ or $11, 10, 9, \dots$

--- hard sequences
KA: იპოვეთ ჯამი: $1 + 2x + 3x^2 + \dots + nx^{n-1}$ ($x \ne 1$).
EN: Find $1 + 2x + 3x^2 + \dots + nx^{n-1}$ ($x \ne 1$).
HKA: $S - xS$.
HEN: Compute $S - xS$.
SKA: $(1 - x)S = 1 + x + \dots + x^{n-1} - nx^n = \dfrac{1 - x^n}{1 - x} - nx^n$
$S = \dfrac{1 - x^n}{(1 - x)^2} - \dfrac{nx^n}{1 - x}$
SEN: $(1 - x)S = 1 + x + \dots + x^{n-1} - nx^n = \dfrac{1 - x^n}{1 - x} - nx^n$
$S = \dfrac{1 - x^n}{(1 - x)^2} - \dfrac{nx^n}{1 - x}$
AKA: $\dfrac{1 - x^n}{(1 - x)^2} - \dfrac{nx^n}{1 - x}$
AEN: $\dfrac{1 - x^n}{(1 - x)^2} - \dfrac{nx^n}{1 - x}$

KA: სატვირთო $100$ კმ-ს გადის; საწვავის ხარჯი საათში $\left(4 + \dfrac{v^2}{400}\right)$ ლ-ია. რა სიჩქარისას დაიხარჯება ყველაზე ნაკლები საწვავი?

HEN: Fuel $= \dfrac{100}{v}\left(4 + \dfrac{v^2}{400}\right) = \dfrac{400}{v} + \dfrac{v}{4}$.
SKA: ნამრავლი $100$ მუდმივია: მინიმუმი, როცა $\dfrac{400}{v} = \dfrac{v}{4} \Rightarrow v = 40$
საწვავი $20$ ლ
SEN: The product is fixed at $100$: the minimum is when $\dfrac{400}{v} = \dfrac{v}{4} \Rightarrow v = 40$

AEN: $40\ \text{km/h}$

KA: დაამტკიცეთ, რომ თუ $a, b, c$ გეომეტრიული პროგრესიაა, მაშინ $(a + b + c)(a - b + c) = a^2 + b^2 + c^2$.

$= a^2 + b^2 + c^2$

AEN: proved

--- hard sequences olympiad
KA: მიმდევრობა: $a_1 = 1$, $a_{n+1} = 2a_n + 1$. იპოვეთ $a_n$-ის ფორმულა.

AEN: $2^n - 1$

--- hard sequences olympiad
KA: დაამტკიცეთ, რომ $\dfrac{1}{1^2} + \dfrac{1}{2^2} + \dots + \dfrac{1}{n^2} < 2$.
EN: Prove that $\dfrac{1}{1^2} + \dfrac{1}{2^2} + \dots + \dfrac{1}{n^2} < 2$.
HKA: $\dfrac{1}{k^2} < \dfrac{1}{k(k - 1)} = \dfrac{1}{k - 1} - \dfrac{1}{k}$.
HEN: $\dfrac{1}{k^2} < \dfrac{1}{k(k - 1)} = \dfrac{1}{k - 1} - \dfrac{1}{k}$.
SKA: $1 + \sum_{k=2}^{n}\left(\dfrac{1}{k - 1} - \dfrac{1}{k}\right) = 1 + 1 - \dfrac{1}{n} < 2$
SEN: $1 + \sum_{k=2}^{n}\left(\dfrac{1}{k - 1} - \dfrac{1}{k}\right) = 1 + 1 - \dfrac{1}{n} < 2$
AKA: დამტკიცებულია
AEN: proved

--- hard polyhedra olympiad
KA: დაამტკიცეთ, რომ არსებობს მხოლოდ $5$ წესიერი მრავალწახნაგა.
EN: Prove that there are only $5$ regular polyhedra.
HKA: წვეროსთან $k \ge 3$ წესიერი $n$-კუთხედი; კუთხეების ჯამი $< 360^\circ$.
HEN: At each vertex $k \ge 3$ regular $n$-gons meet; their angles add to less than $360^\circ$.
SKA: $k \cdot \dfrac{180(n - 2)}{n} < 360 \Rightarrow (n - 2)(k - 2) < 4$
$(n, k) = (3,3), (3,4), (3,5), (4,3), (5,3)$ — ტეტრაედრი, ოქტაედრი, იკოსაედრი, კუბი, დოდეკაედრი
SEN: $k \cdot \dfrac{180(n - 2)}{n} < 360 \Rightarrow (n - 2)(k - 2) < 4$
$(n, k) = (3,3), (3,4), (3,5), (4,3), (5,3)$ — tetrahedron, octahedron, icosahedron, cube, dodecahedron
AKA: $5$
AEN: $5$

--- hard polyhedra olympiad
KA: ფეხბურთის ბურთი $12$ ხუთკუთხედით და გარკვეული რაოდენობის ექვსკუთხედით არის შეკერილი; ყოველ წვეროში $3$ წახნაგი ხვდება. რამდენი ექვსკუთხედია?
EN: A football is sewn from $12$ pentagons and some hexagons, with $3$ faces at each vertex. How many hexagons?
HKA: ეილერი: $V - E + F = 2$.
HEN: Euler: $V - E + F = 2$.
SKA: $h$ ექვსკუთხედი: $E = \dfrac{60 + 6h}{2}$, $V = \dfrac{60 + 6h}{3}$, $F = 12 + h$
$20 + 2h - 30 - 3h + 12 + h = 2$ — იგივეობაა; ექვსკუთხედის მეზობლობით: ყოველი ხუთკუთხედი $5$ ექვსკუთხედს ეხება, ყოველი ექვსკუთხედი $3$ ხუთკუთხედს: $12 \cdot 5 = 3h \Rightarrow h = 20$
SEN: With $h$ hexagons: $E = \dfrac{60 + 6h}{2}$, $V = \dfrac{60 + 6h}{3}$, $F = 12 + h$
$20 + 2h - 30 - 3h + 12 + h = 2$ is an identity; using adjacency, each pentagon touches $5$ hexagons and each hexagon $3$ pentagons: $12 \cdot 5 = 3h \Rightarrow h = 20$
AKA: $20$
AEN: $20$
