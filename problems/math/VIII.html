KA: მონაცემები: $5, 7, 7, 8, 10, 12$. იპოვეთ საშუალო და მედიანა.
EN: Data: $5, 7, 7, 8, 10, 12$. Find the mean and median.
HKA: ჯამი $49$; ლუწი რაოდენობა.
HEN: The sum is $49$; there's an even count.
SKA: $\dfrac{49}{6} \approx 8{,}17$; მედიანა $\dfrac{7 + 8}{2} = 7{,}5$
SEN: $\dfrac{49}{6} \approx 8.17$; median $\dfrac{7 + 8}{2} = 7.5$
AKA: $\approx 8{,}17$; $7{,}5$
AEN: $\approx 8.17$; $7.5$

--- easy data
KA: $40$ მოსწავლიდან $14$ ჩოგბურთს თამაშობს. რა არის ფარდობითი სიხშირე პროცენტებში?
EN: $14$ of $40$ pupils play tennis. What's the relative frequency as a percentage?
HKA: $\dfrac{14}{40}$.
HEN: $\dfrac{14}{40}$.
SKA: $0{,}35 = 35\%$
SEN: $0.35 = 35\%$
AKA: $35\%$
AEN: $35\%$

--- easy data
KA: სიხშირეების ცხრილი: $1$ — $4$, $2$ — $6$, $3$ — $10$. რამდენი მონაცემია? რა არის მოდა?
EN: Frequency table: $1$ — $4$, $2$ — $6$, $3$ — $10$. How many data values? What's the mode?
HKA: სიხშირეების ჯამი.
HEN: Add the frequencies.
SKA: $20$; მოდა $3$
SEN: $20$; mode $3$
AKA: $20$; $3$
AEN: $20$; $3$

--- easy data
KA: ფარდობითი სიხშირეებია $0{,}2$, $0{,}45$ და $x$. იპოვეთ $x$.
EN: Relative frequencies are $0.2$, $0.45$ and $x$. Find $x$.
HKA: ჯამი $1$.
HEN: They add to $1$.
SKA: $x = 0{,}35$
SEN: $x = 0.35$
AKA: $0{,}35$
AEN: $0.35$

--- medium data
KA: ჯგუფური მონაცემები: $0$–$10$ — $3$, $10$–$20$ — $7$, $20$–$30$ — $10$. შეაფასეთ საშუალო ინტერვალების შუაწერტილებით.
EN: Grouped data: $0$–$10$ — $3$, $10$–$20$ — $7$, $20$–$30$ — $10$. Estimate the mean using midpoints.
HKA: შუაწერტილები $5, 15, 25$.
HEN: Midpoints $5, 15, 25$.
SKA: $\dfrac{15 + 105 + 250}{20} = 18{,}5$
SEN: $\dfrac{15 + 105 + 250}{20} = 18.5$
AKA: $18{,}5$
AEN: $18.5$

--- medium data
KA: $10$ მოსწავლის საშუალო ქულაა $7$. ერთი მოსწავლის $2$ ქულა შეცდომით $9$-ად ჩაწერეს. რა არის სწორი საშუალო?
EN: The mean of $10$ scores is $7$, but one score of $2$ was recorded as $9$. What's the correct mean?
HKA: ჯამი $7$-ით ნაკლებია.
HEN: The sum is $7$ too big.
SKA: $\dfrac{70 - 7}{10} = 6{,}3$
SEN: $\dfrac{70 - 7}{10} = 6.3$
AKA: $6{,}3$
AEN: $6.3$

--- medium data
KA: რომელი უკეთ აღწერს ტიპურ ხელფასს: საშუალო თუ მედიანა? ხელფასები (ათას ლარში): $1, 1{,}2, 1{,}3, 1{,}5, 20$.
EN: Which describes a typical salary better, mean or median? Salaries (thousand lari): $1, 1.2, 1.3, 1.5, 20$.
HKA: ერთი ძალიან დიდი მნიშვნელობა.
HEN: One huge value.
SKA: საშუალო $5$, მედიანა $1{,}3$ — მედიანა უკეთესია
SEN: Mean $5$, median $1.3$ — the median is better
AKA: მედიანა ($1{,}3$)
AEN: the median ($1.3$)

--- medium data
KA: მონეტა $50$-ჯერ აგდეს, გერბის ფარდობითი სიხშირე $0{,}46$-ია. რამდენჯერ მოვიდა გერბი? საფირე?
EN: A coin was tossed $50$ times; the relative frequency of heads is $0.46$. How many heads? Tails?
HKA: $0{,}46 \cdot 50$.
HEN: $0.46 \cdot 50$.
SKA: $23$ გერბი, $27$ საფირე
SEN: $23$ heads, $27$ tails
AKA: $23$; $27$
AEN: $23$; $27$

--- easy probability
KA: კამათელი გააგორეს. რა არის $4$-ზე მეტის მოსვლის ალბათობა?
EN: A die is rolled. What's the probability of more than $4$?
HKA: $5, 6$.
HEN: $5, 6$.
SKA: $\dfrac{2}{6} = \dfrac{1}{3}$
SEN: $\dfrac{2}{6} = \dfrac{1}{3}$
AKA: $\dfrac{1}{3}$
AEN: $\dfrac{1}{3}$

--- easy probability
KA: ბანქოს $36$ კარტიდან ერთი ამოიღეს. რა არის ტუზის ალბათობა?
EN: One card is drawn from a $36$-card deck. What's the probability of an ace?
HKA: $4$ ტუზი.
HEN: $4$ aces.
SKA: $\dfrac{4}{36} = \dfrac{1}{9}$
SEN: $\dfrac{4}{36} = \dfrac{1}{9}$
AKA: $\dfrac{1}{9}$
AEN: $\dfrac{1}{9}$

--- easy probability
KA: ჩამოთვალეთ: სავსებით შესაძლო, შეუძლებელი თუ შემთხვევითი — ა) ხვალ მზე ამოვა; ბ) კამათელზე $0$; გ) მონეტაზე გერბი.
EN: Certain, impossible or random: a) the sun will rise tomorrow; b) rolling a $0$ on a die; c) heads on a coin.
HKA: ალბათობა $1$, $0$ თუ შუაში.
HEN: Probability $1$, $0$ or in between.
SKA: ა) აუცილებელი; ბ) შეუძლებელი; გ) შემთხვევითი
SEN: a) certain; b) impossible; c) random
AKA: აუცილებელი; შეუძლებელი; შემთხვევითი
AEN: certain; impossible; random

--- easy probability
KA: რიცხვის $3\,135\,553$ ციფრებიდან შემთხვევით აირჩიეს ერთი. რა არის $5$-ის ალბათობა?
EN: A digit of the number $3\,135\,553$ is chosen at random. What's the probability it's a $5$?
HKA: დაითვალეთ ციფრები.
HEN: Count the digits.
SKA: $7$ ციფრი, მათგან $5$ — სამი: $\dfrac{3}{7}$
SEN: $7$ digits, three of them are $5$: $\dfrac{3}{7}$
AKA: $\dfrac{3}{7}$
AEN: $\dfrac{3}{7}$

--- medium probability
KA: ორი კამათელი გააგორეს. რა არის ორივეზე ერთნაირი რიცხვის (დუბლის) ალბათობა?
EN: Two dice are rolled. What's the probability of a double?
HKA: $6$ დუბლი $36$-დან.
HEN: $6$ doubles out of $36$.
SKA: $\dfrac{6}{36} = \dfrac{1}{6}$
SEN: $\dfrac{6}{36} = \dfrac{1}{6}$
AKA: $\dfrac{1}{6}$
AEN: $\dfrac{1}{6}$

--- medium probability
KA: ჩანთაში $4$ წითელი, $5$ ლურჯი და $6$ მწვანე ბურთია. რა არის იმის ალბათობა, რომ ამოღებული ბურთი არ არის ლურჯი?
EN: A bag has $4$ red, $5$ blue and $6$ green balls. What's the probability a ball drawn is not blue?
HKA: $1 - P(\text{ლურჯი})$.
HEN: $1 - P(\text{blue})$.
SKA: $1 - \dfrac{5}{15} = \dfrac{2}{3}$
SEN: $1 - \dfrac{5}{15} = \dfrac{2}{3}$
AKA: $\dfrac{2}{3}$
AEN: $\dfrac{2}{3}$

--- hard probability
KA: ორი კამათელი გააგორეს. რა არის იმის ალბათობა, რომ ჯამი $10$-ზე მეტია?
EN: Two dice are rolled. What's the probability the total exceeds $10$?
HKA: ჯამი $11$ ან $12$.
HEN: Total $11$ or $12$.
SKA: $(5,6), (6,5), (6,6)$: $\ \dfrac{3}{36} = \dfrac{1}{12}$
SEN: $(5,6), (6,5), (6,6)$: $\ \dfrac{3}{36} = \dfrac{1}{12}$
AKA: $\dfrac{1}{12}$
AEN: $\dfrac{1}{12}$

--- hard probability
KA: $3$ ბიჭი და $2$ გოგო შემთხვევით რიგში დადგა. რა არის ალბათობა, რომ რიგის თავში გოგოა და ბოლოშიც გოგოა?
EN: $3$ boys and $2$ girls line up at random. What's the probability that both the first and last are girls?
HKA: $\dfrac{2}{5} \cdot \dfrac{1}{4}$.
HEN: $\dfrac{2}{5} \cdot \dfrac{1}{4}$.
SKA: $\dfrac{2}{20} = \dfrac{1}{10}$
SEN: $\dfrac{2}{20} = \dfrac{1}{10}$
AKA: $\dfrac{1}{10}$
AEN: $\dfrac{1}{10}$
