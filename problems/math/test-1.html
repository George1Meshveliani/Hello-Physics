SKA: $\triangle ABM$: $\operatorname{tg}\angle BAM = \dfrac{BM}{AB} = \dfrac{1}{\sqrt{3}} \Rightarrow \angle BAM = 30^\circ$; ანალოგიურად $\angle DAN = 30^\circ$
$\angle MAN = 90^\circ - 30^\circ - 30^\circ = 30^\circ$ — ეს ცენტრალური კუთხეა, ამიტომ რკალი $30^\circ$-ია
SEN: In $\triangle ABM$: $\operatorname{tg}\angle BAM = \dfrac{BM}{AB} = \dfrac{1}{\sqrt{3}} \Rightarrow \angle BAM = 30^\circ$; likewise $\angle DAN = 30^\circ$
$\angle MAN = 90^\circ - 30^\circ - 30^\circ = 30^\circ$ is a central angle, so the arc is $30^\circ$

KA: იპოვეთ $f(x) = 2^{x^2 - 2x}$ ფუნქციის მნიშვნელობათა სიმრავლე, თუ $x \in [0; 3]$.
EN: Find the range of $f(x) = 2^{x^2 - 2x}$ for $x \in [0; 3]$.
O: $[1; 8]$
$\left[\dfrac{1}{2}; 8\right]$
$(0; 8]$
$\{1; 8\}$
C: 2
SKA: $t = x^2 - 2x = (x - 1)^2 - 1$; $[0; 3]$-ზე $t_{\min} = t(1) = -1$, $t_{\max} = t(3) = 3$
$2^t$ ზრდადია: $f \in [2^{-1}; 2^3] = \left[\dfrac{1}{2}; 8\right]$
SEN: $t = x^2 - 2x = (x - 1)^2 - 1$; on $[0; 3]$, $t_{\min} = t(1) = -1$, $t_{\max} = t(3) = 3$
$2^t$ is increasing: $f \in [2^{-1}; 2^3] = \left[\dfrac{1}{2}; 8\right]$

KA: იპოვეთ კონუსის მსახველის სიგრძე, თუ მისი ფუძის ფართობია $3\pi$ სმ², ხოლო გვერდითი ზედაპირის ფართობია $6\pi$ სმ².
EN: Find the slant height of a cone whose base area is $3\pi$ cm² and lateral surface area is $6\pi$ cm².
OKA: $2$ სმ
$3$ სმ
$2\sqrt{3}$ სმ
$3\sqrt{2}$ სმ
OEN: $2$ cm
$3$ cm
$2\sqrt{3}$ cm
$3\sqrt{2}$ cm
C: 3
SKA: $\pi r^2 = 3\pi \Rightarrow r = \sqrt{3}$
$\pi r l = 6\pi \Rightarrow l = \dfrac{6}{\sqrt{3}} = 2\sqrt{3}$ სმ
SEN: $\pi r^2 = 3\pi \Rightarrow r = \sqrt{3}$
$\pi r l = 6\pi \Rightarrow l = \dfrac{6}{\sqrt{3}} = 2\sqrt{3}$ cm

KA: ამოხსენით განტოლებათა სისტემა: $$\begin{cases} x - 2y = 3 \\ 4x - 3y = 0 \end{cases}$$
EN: Solve the system: $$\begin{cases} x - 2y = 3 \\ 4x - 3y = 0 \end{cases}$$
SKA: პირველიდან $x = 3 + 2y$
ჩავსვათ: $4(3 + 2y) - 3y = 0 \Rightarrow 12 + 5y = 0 \Rightarrow y = -\dfrac{12}{5}$
$x = 3 - \dfrac{24}{5} = -\dfrac{9}{5}$
SEN: From the first equation $x = 3 + 2y$
Substitute: $4(3 + 2y) - 3y = 0 \Rightarrow 12 + 5y = 0 \Rightarrow y = -\dfrac{12}{5}$
$x = 3 - \dfrac{24}{5} = -\dfrac{9}{5}$
AKA: $(-1{,}8;\ -2{,}4)$
AEN: $(-1.8;\ -2.4)$

KA: საათი აჩვენებს $2$ საათსა და $20$ წუთს. იპოვეთ კუთხის სიდიდე წუთებისა და საათების ისრებს შორის.
EN: A clock shows $2{:}20$. Find the angle between the minute and hour hands.

SKA: წუთის ისარი წუთში $6^\circ$-ით ბრუნავს: $20 \cdot 6^\circ = 120^\circ$ (12-დან)
საათის ისარი საათში $30^\circ$-ით, წუთში $0{,}5^\circ$-ით: $2 \cdot 30^\circ + 20 \cdot 0{,}5^\circ = 70^\circ$
კუთხე: $120^\circ - 70^\circ = 50^\circ$

The hour hand turns $30^\circ$ per hour, $0.5^\circ$ per minute: $2 \cdot 30^\circ + 20 \cdot 0.5^\circ = 70^\circ$
Angle: $120^\circ - 70^\circ = 50^\circ$

AEN: $50^\circ$

KA: $ABCD$ კვადრატის $BC$ გვერდზე აღებულია $E$ წერტილი ისე, რომ $\angle ADE = 60^\circ$. იპოვეთ $ABCD$ კვადრატის ფართობი, თუ $ECD$ სამკუთხედის ფართობი $S$-ის ტოლია.
EN: Point $E$ on side $BC$ of square $ABCD$ is such that $\angle ADE = 60^\circ$. Find the area of the square if the area of triangle $ECD$ is $S$.
FIG: <svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="15" y="15" width="120" height="120"/><path d="M135 135L65.7 15"/><path d="M118 135A17 17 0 0 1 126.5 120.3" stroke-width="1"/><text x="3" y="14" stroke="none" font-size="13">B</text><text x="138" y="14" stroke="none" font-size="13">C</text><text x="3" y="147" stroke="none" font-size="13">A</text><text x="138" y="147" stroke="none" font-size="13">D</text><text x="60" y="11" stroke="none" font-size="13">E</text><text x="96" y="128" stroke="none" font-size="10" style="font-style:normal">60°</text></svg>
SKA: $AD \parallel BC \Rightarrow \angle DEC = \angle ADE = 60^\circ$ (შიდა ჯვარედინა კუთხეები)
$\triangle ECD$ მართკუთხაა ($\angle C = 90^\circ$); კვადრატის გვერდი $a = CD$, $EC = \dfrac{CD}{\operatorname{tg} 60^\circ} = \dfrac{a}{\sqrt{3}}$
$S = \dfrac{1}{2} \cdot a \cdot \dfrac{a}{\sqrt{3}} = \dfrac{a^2}{2\sqrt{3}}$
$a^2 = 2\sqrt{3}\,S$
SEN: $AD \parallel BC \Rightarrow \angle DEC = \angle ADE = 60^\circ$ (alternate angles)
$\triangle ECD$ is right-angled at $C$; with side $a = CD$, $EC = \dfrac{CD}{\operatorname{tg} 60^\circ} = \dfrac{a}{\sqrt{3}}$
$S = \dfrac{1}{2} \cdot a \cdot \dfrac{a}{\sqrt{3}} = \dfrac{a^2}{2\sqrt{3}}$
$a^2 = 2\sqrt{3}\,S$
AKA: $2\sqrt{3}\,S$
AEN: $2\sqrt{3}\,S$

KA: $b_n$ გეომეტრიული პროგრესიის წევრები განსაზღვრულია ფორმულით $b_n = -2 \cdot \left(\dfrac{2}{3}\right)^{n-1}$. იპოვეთ ამ პროგრესიის პირველი $10$ წევრის ჯამი.
EN: A geometric progression is given by $b_n = -2 \cdot \left(\dfrac{2}{3}\right)^{n-1}$. Find the sum of its first $10$ terms.
SKA: $b_1 = -2$, $q = \dfrac{2}{3}$
$S_{10} = \dfrac{b_1(1 - q^{10})}{1 - q} = \dfrac{-2\left(1 - \left(\frac{2}{3}\right)^{10}\right)}{\frac{1}{3}} = -6\left(1 - \dfrac{1024}{59049}\right)$
$= -6 + \dfrac{6144}{59049} = -6 + \dfrac{2048}{19683} = -\dfrac{116050}{19683}$
SEN: $b_1 = -2$, $q = \dfrac{2}{3}$
$S_{10} = \dfrac{b_1(1 - q^{10})}{1 - q} = \dfrac{-2\left(1 - \left(\frac{2}{3}\right)^{10}\right)}{\frac{1}{3}} = -6\left(1 - \dfrac{1024}{59049}\right)$
$= -6 + \dfrac{6144}{59049} = -6 + \dfrac{2048}{19683} = -\dfrac{116050}{19683}$
AKA: $-6\left(1 - \left(\dfrac{2}{3}\right)^{10}\right) = -\dfrac{116050}{19683} \approx -5{,}9$
AEN: $-6\left(1 - \left(\dfrac{2}{3}\right)^{10}\right) = -\dfrac{116050}{19683} \approx -5.9$

KA: იპოვეთ $x$-ის ყველა იმ მნიშვნელობათა სიმრავლე, რომელთათვისაც კუთხე $\vec{a}(x + 1;\ 2x)$ და $\vec{b}(3x;\ -x + 1)$ ვექტორებს შორის ეკუთვნის $[0^\circ; 90^\circ)$ შუალედს.
EN: Find all $x$ for which the angle between $\vec{a}(x + 1;\ 2x)$ and $\vec{b}(3x;\ -x + 1)$ lies in $[0^\circ; 90^\circ)$.
SKA: კუთხე $[0^\circ; 90^\circ)$-შია $\iff \cos\varphi > 0 \iff \vec{a} \cdot \vec{b} > 0$ (ამ დროს ორივე ვექტორი არანულოვანია)
$\vec{a} \cdot \vec{b} = 3x(x + 1) + 2x(1 - x) = x^2 + 5x$
$x^2 + 5x > 0 \iff x(x + 5) > 0 \iff x < -5$ ან $x > 0$
SEN: The angle is in $[0^\circ; 90^\circ)$ $\iff \cos\varphi > 0 \iff \vec{a} \cdot \vec{b} > 0$ (then both vectors are non-zero)
$\vec{a} \cdot \vec{b} = 3x(x + 1) + 2x(1 - x) = x^2 + 5x$
$x^2 + 5x > 0 \iff x(x + 5) > 0 \iff x < -5$ or $x > 0$
AKA: $(-\infty; -5) \cup (0; +\infty)$
AEN: $(-\infty; -5) \cup (0; +\infty)$

--- 3
KA: $DABC$ პირამიდაში $\angle ACD = \angle ACB = \angle BCD = 60^\circ$. იპოვეთ პირამიდის $DH$ სიმაღლე, თუ $CD = 6$ სმ.
EN: In pyramid $DABC$, $\angle ACD = \angle ACB = \angle BCD = 60^\circ$. Find the height $DH$ if $CD = 6$ cm.
SKA: $CD$ ტოლ კუთხეებს ადგენს $CA$-სა და $CB$-სთან, ამიტომ მისი გეგმილი $CH$ არის $\angle ACB$-ის ბისექტრისა: $\angle HCA = 30^\circ$
სამი კოსინუსის ფორმულა: $\cos\angle DCA = \cos\angle DCH \cdot \cos\angle HCA$
$\dfrac{1}{2} = \cos\angle DCH \cdot \dfrac{\sqrt{3}}{2} \Rightarrow \cos\angle DCH = \dfrac{1}{\sqrt{3}}$, $\sin\angle DCH = \sqrt{\dfrac{2}{3}}$
$DH = CD \cdot \sin\angle DCH = 6\sqrt{\dfrac{2}{3}} = 2\sqrt{6}$ სმ
(ან: $CA = CB = CD = 6$ აღებით მივიღებთ წესიერ ტეტრაედრს წიბოთი $6$; მისი სიმაღლე $6\sqrt{\frac{2}{3}}$)
SEN: $CD$ makes equal angles with $CA$ and $CB$, so its projection $CH$ bisects $\angle ACB$: $\angle HCA = 30^\circ$
Three-cosine formula: $\cos\angle DCA = \cos\angle DCH \cdot \cos\angle HCA$
$\dfrac{1}{2} = \cos\angle DCH \cdot \dfrac{\sqrt{3}}{2} \Rightarrow \cos\angle DCH = \dfrac{1}{\sqrt{3}}$, $\sin\angle DCH = \sqrt{\dfrac{2}{3}}$
$DH = CD \cdot \sin\angle DCH = 6\sqrt{\dfrac{2}{3}} = 2\sqrt{6}$ cm
(Or: taking $CA = CB = CD = 6$ gives a regular tetrahedron with edge $6$, whose height is $6\sqrt{\frac{2}{3}}$)
AKA: $2\sqrt{6}$ სმ
AEN: $2\sqrt{6}$ cm

KA: ორმა მორბენალმა წრიული ფორმის სარბენი ბილიკის ერთი და იმავე ადგილიდან ურთიერთსაწინააღმდეგო მიმართულებით მუდმივი სიჩქარეებით ერთდროულად დაიწყო სირბილი და პირველად ერთმანეთს $5$ წუთის შემდეგ შეხვდნენ. იმავე სიჩქარეებით სირბილისას პირველი მორბენალი $5$ წუთით უფრო ჩქარა შემოურბენს სარბენ ბილიკს, ვიდრე მეორე მორბენალი. რამდენ წუთში შემოურბენს სარბენ ბილიკს პირველი მორბენალი?
EN: Two runners start together from the same point of a circular track and run in opposite directions at constant speeds; they first meet after $5$ minutes. The first runner completes a lap $5$ minutes faster than the second. How many minutes does the first runner need for one lap?
SKA: ვთქვათ, პირველი წრეს $t$ წუთში შემოურბენს, მეორე — $t + 5$ წუთში
საპირისპირო მიმართულებით $5$ წუთში ერთად ერთ წრეს გადიან: $5\left(\dfrac{1}{t} + \dfrac{1}{t + 5}\right) = 1$
$5(2t + 5) = t(t + 5) \Rightarrow t^2 - 5t - 25 = 0$
$t = \dfrac{5 + \sqrt{25 + 100}}{2} = \dfrac{5 + 5\sqrt{5}}{2}$ (დადებითი ფესვი)
SEN: Let the first runner take $t$ minutes per lap and the second $t + 5$
Running towards each other they cover one lap together in $5$ minutes: $5\left(\dfrac{1}{t} + \dfrac{1}{t + 5}\right) = 1$
$5(2t + 5) = t(t + 5) \Rightarrow t^2 - 5t - 25 = 0$
$t = \dfrac{5 + \sqrt{25 + 100}}{2} = \dfrac{5 + 5\sqrt{5}}{2}$ (the positive root)
AKA: $\dfrac{5(1 + \sqrt{5})}{2} \approx 8{,}1$ წუთში
AEN: $\dfrac{5(1 + \sqrt{5})}{2} \approx 8.1$ minutes

KA: იპოვეთ $a$ პარამეტრის ყველა იმ მნიშვნელობათა სიმრავლე, რომელთათვისაც $x^2 \le a - 2$ და $x^2 + 4x \le 1 - a$ უტოლობების ამონახსნთა სიმრავლეებს აქვს ზუსტად ერთი საერთო ელემენტი.
EN: Find all values of $a$ for which the solution sets of $x^2 \le a - 2$ and $x^2 + 4x \le 1 - a$ have exactly one common element.
SKA: პირველი: $a \ge 2$, $x \in [-\sqrt{a - 2};\ \sqrt{a - 2}]$ — ცენტრი $0$
მეორე: $(x + 2)^2 \le 5 - a$, $a \le 5$, $x \in [-2 - \sqrt{5 - a};\ -2 + \sqrt{5 - a}]$ — ცენტრი $-2$
$a = 2$: $\{0\}$, მაგრამ $0 + 0 \le -1$ მცდარია; $a = 5$: $\{-2\}$, მაგრამ $4 \le 3$ მცდარია
ორი შუალედის თანაკვეთა ერთი წერტილია, თუ ისინი ბოლოებით ეხებიან: $-2 + \sqrt{5 - a} = -\sqrt{a - 2}$, ანუ $\sqrt{5 - a} + \sqrt{a - 2} = 2$
$u = \sqrt{5 - a}$, $v = \sqrt{a - 2}$: $u + v = 2$, $u^2 + v^2 = 3 \Rightarrow uv = \dfrac{1}{2}$
$v$ — $t^2 - 2t + \dfrac{1}{2} = 0$-ის ფესვი: $v = 1 \pm \dfrac{\sqrt{2}}{2}$ (ორივე დადებითია)
$a = 2 + v^2 = 2 + \dfrac{3}{2} \pm \sqrt{2} = \dfrac{7}{2} \pm \sqrt{2}$ — ორივე $[2; 5]$-შია
SEN: First: $a \ge 2$, $x \in [-\sqrt{a - 2};\ \sqrt{a - 2}]$, centred at $0$
Second: $(x + 2)^2 \le 5 - a$, $a \le 5$, $x \in [-2 - \sqrt{5 - a};\ -2 + \sqrt{5 - a}]$, centred at $-2$
$a = 2$ gives $\{0\}$, but $0 \le -1$ fails; $a = 5$ gives $\{-2\}$, but $4 \le 3$ fails
Two intervals meet in exactly one point when their ends touch: $-2 + \sqrt{5 - a} = -\sqrt{a - 2}$, i.e. $\sqrt{5 - a} + \sqrt{a - 2} = 2$
With $u = \sqrt{5 - a}$, $v = \sqrt{a - 2}$: $u + v = 2$, $u^2 + v^2 = 3 \Rightarrow uv = \dfrac{1}{2}$
$v$ is a root of $t^2 - 2t + \dfrac{1}{2} = 0$: $v = 1 \pm \dfrac{\sqrt{2}}{2}$ (both positive)
$a = 2 + v^2 = 2 + \dfrac{3}{2} \pm \sqrt{2} = \dfrac{7}{2} \pm \sqrt{2}$, both in $[2; 5]$
AKA: $a = \dfrac{7}{2} - \sqrt{2}$ ან $a = \dfrac{7}{2} + \sqrt{2}$
AEN: $a = \dfrac{7}{2} - \sqrt{2}$ or $a = \dfrac{7}{2} + \sqrt{2}$
