KA: $x, y, z$ დადებითი რიცხვები მოცემული თანმიმდევრობით ქმნის არითმეტიკულ პროგრესიას, რომლის სხვაობა განსხვავდება ნულისაგან. გამოთვალეთ $\dfrac{x^2 - z^2}{y^2 - xy}$ გამოსახულების მნიშვნელობა.
EN: Positive numbers $x, y, z$ (in this order) form an arithmetic progression with non-zero difference. Find $\dfrac{x^2 - z^2}{y^2 - xy}$.
OKA: $-4$
$-2$
$2$
მოცემული ინფორმაცია საკმარისი არ არის
OEN: $-4$
$-2$
$2$
there is not enough information
C: 1
SKA: $x = y - d$, $z = y + d$
$x^2 - z^2 = (x - z)(x + z) = (-2d)(2y) = -4dy$
$y^2 - xy = y(y - x) = yd$
$\dfrac{-4dy}{yd} = -4$
SEN: $x = y - d$, $z = y + d$
$x^2 - z^2 = (x - z)(x + z) = (-2d)(2y) = -4dy$
$y^2 - xy = y(y - x) = yd$
$\dfrac{-4dy}{yd} = -4$

KA: ორი ნატურალური რიცხვის ნამრავლი $600$-ის ტოლია. ქვემოთ მოყვანილი გამონათქვამებიდან რომელია **აუცილებლად მცდარი**?
EN: The product of two natural numbers is $600$. Which statement is **necessarily false**?
OKA: ამ რიცხვების ჯამი იყოფა $2$-ზე
ამ რიცხვების ჯამი იყოფა $5$-ზე
ამ რიცხვების ჯამი იყოფა $10$-ზე
ამ რიცხვების ჯამი იყოფა $3$-ზე
OEN: their sum is divisible by $2$
their sum is divisible by $5$
their sum is divisible by $10$
their sum is divisible by $3$
C: 4
SKA: $600 = 2^3 \cdot 3 \cdot 5^2$ — $3$ შედის ზუსტად პირველი ხარისხით, ამიტომ $3$-ზე იყოფა მხოლოდ ერთი რიცხვი
თუ ჯამი $3$-ზე იყოფა, მეორე რიცხვიც გაიყოფოდა $3$-ზე, მაშინ ნამრავლი $9$-ზე — შეუძლებელია
სხვები შესაძლებელია: $10 + 60 = 70$ იყოფა $2$-ზე, $5$-ზე და $10$-ზე
SEN: $600 = 2^3 \cdot 3 \cdot 5^2$ contains $3$ only to the first power, so exactly one factor is divisible by $3$
If the sum were divisible by $3$, the other factor would be too, making the product divisible by $9$ — impossible
The others can happen: $10 + 60 = 70$ is divisible by $2$, $5$ and $10$

KA: რიცხვით ღერძზე აღებულია $A$, $B$ და $C$ წერტილები ისე, რომ $C$ წერტილი მდებარეობს $A$ და $B$ წერტილებს შორის. რას უდრის იმის ალბათობა, რომ $AB$ მონაკვეთიდან შემთხვევით არჩეული წერტილი მოხვდება $AC$ და $CB$ მონაკვეთების შუაწერტილებს შორის?
EN: Points $A$, $B$, $C$ lie on a number line with $C$ between $A$ and $B$. A point is chosen at random on $AB$. What is the probability that it lies between the midpoints of $AC$ and $CB$?
O: $\dfrac{1}{4}$
$\dfrac{1}{2}$
$\dfrac{1}{3}$
$\dfrac{1}{8}$
C: 2
SKA: შუაწერტილებს შორის მანძილი: $\dfrac{AC}{2} + \dfrac{CB}{2} = \dfrac{AB}{2}$
$P = \dfrac{AB/2}{AB} = \dfrac{1}{2}$
SEN: The distance between the midpoints is $\dfrac{AC}{2} + \dfrac{CB}{2} = \dfrac{AB}{2}$
$P = \dfrac{AB/2}{AB} = \dfrac{1}{2}$

$\left(\dfrac{2}{3}; \infty\right)$
$\left(\dfrac{1}{3}; \infty\right)$
$\left(\dfrac{1}{3}; \dfrac{2}{3}\right)$

$0 < 3a - 1 < 1 \Rightarrow \dfrac{1}{3} < a < \dfrac{2}{3}$
SEN: A logarithm is decreasing when its base is between $0$ and $1$
$0 < 3a - 1 < 1 \Rightarrow \dfrac{1}{3} < a < \dfrac{2}{3}$

KA: მართკუთხედის სამი წვეროს კოორდინატებია $(-3; 2)$, $(5; -4)$ და $(1; 4)$. იპოვეთ ამ მართკუთხედის სიმეტრიის ცენტრის კოორდინატები.
EN: Three vertices of a rectangle are $(-3; 2)$, $(5; -4)$ and $(1; 4)$. Find the coordinates of its centre of symmetry.
O: $(-1; 3)$
$(1; -1)$
$(3; 0)$
$\left(\dfrac{\sqrt{3}}{2}; -\dfrac{\sqrt{3}}{2}\right)$
C: 2
SKA: $(1; 4)$-დან: $(-4; -2)$ და $(4; -8)$ ვექტორები, სკალარული ნამრავლი $-16 + 16 = 0$ — მართი კუთხე $(1; 4)$-თანაა
მაშინ $(-3; 2)$ და $(5; -4)$ დიაგონალის ბოლოებია; ცენტრი — მისი შუაწერტილი: $(1; -1)$
SEN: From $(1; 4)$: vectors $(-4; -2)$ and $(4; -8)$, dot product $-16 + 16 = 0$, so the right angle is at $(1; 4)$
Then $(-3; 2)$ and $(5; -4)$ are opposite ends of a diagonal; the centre is its midpoint $(1; -1)$

KA: სპირტის ხსნარი შეიცავდა $2$ გრამ სპირტს. ამ ხსნარში $0{,}5$ გრამი სპირტის დამატების შემდეგ სპირტის კონცენტრაცია გახდა $40\%$-ის ტოლი. იპოვეთ თავდაპირველი ხსნარის მასა.
EN: An alcohol solution contained $2$ g of alcohol. After adding $0.5$ g of alcohol the concentration became $40\%$. Find the mass of the original solution.
OKA: $6$ გ
$\dfrac{23}{4}$ გ
$\dfrac{11}{2}$ გ
$6{,}5$ გ
OEN: $6$ g
$\dfrac{23}{4}$ g
$\dfrac{11}{2}$ g
$6.5$ g

SKA: ახალი ხსნარი: $m + 0{,}5$, სპირტი: $2{,}5$
$\dfrac{2{,}5}{m + 0{,}5} = 0{,}4 \Rightarrow m + 0{,}5 = 6{,}25 \Rightarrow m = 5{,}75 = \dfrac{23}{4}$ გ
SEN: New solution $m + 0.5$, alcohol $2.5$
$\dfrac{2.5}{m + 0.5} = 0.4 \Rightarrow m + 0.5 = 6.25 \Rightarrow m = 5.75 = \dfrac{23}{4}$ g

EN: Points $E$ and $F$ on the bases $BC$ and $AD$ of trapezoid $ABCD$ are such that $EF \parallel CD$ and $EF$ divides the trapezoid into two parts of equal area. Find $EC$ if $BC = 3$ and $AD = 5$.
OKA: $2$
$2{,}5$
$4$
$4{,}5$
OEN: $2$
$2.5$
$4$
$4.5$
C: 1
SKA: $EFDC$ პარალელოგრამია: $FD = EC = x$, ფართობი $x \cdot h$

$11$

$13$
C: 3

KA: იპოვეთ $a$, $b$ და $c$ რიცხვების საშუალო, თუ $a$ და $b$ რიცხვების საშუალო $9$-ის ტოლია, $b$ და $c$ რიცხვების საშუალო არის $14$, ხოლო $a$ და $c$ რიცხვების საშუალო არის $13$.
EN: Find the mean of $a$, $b$, $c$ if the mean of $a$ and $b$ is $9$, of $b$ and $c$ is $14$, and of $a$ and $c$ is $13$.
O: $24$
$18$
$12$
$10$
C: 3
SKA: $a + b = 18$, $b + c = 28$, $a + c = 26$
შევკრიბოთ: $2(a + b + c) = 72 \Rightarrow a + b + c = 36$

SEN: $a + b = 18$, $b + c = 28$, $a + c = 26$
Add: $2(a + b + c) = 72 \Rightarrow a + b + c = 36$

EN: In the circular sector $OAB$, the perpendicular $AC$ from $A$ to $OB$ bisects $OB$ (see the figure). Find $OB$ if the arc $AB$ has length $1$.

KA: $SABC$ პირამიდის $ABC$ ფუძე წარმოადგენს მართკუთხა სამკუთხედს $C$ მართი კუთხით. პირამიდის $SH$ სიმაღლის ფუძე მდებარეობს $AB$ გვერდის შუა წერტილზე. იპოვეთ პირამიდის სიმაღლე, თუ $AC = 8$ სმ, $BC = 6$ სმ და $SC = 7$ სმ.
EN: The base $ABC$ of pyramid $SABC$ is a right triangle with the right angle at $C$. The foot of the height $SH$ is the midpoint of $AB$. Find the height if $AC = 8$ cm, $BC = 6$ cm and $SC = 7$ cm.

OKA: $4\sqrt{3}$ სმ

$SH = \sqrt{SC^2 - HC^2} = \sqrt{49 - 25} = \sqrt{24} = 2\sqrt{6}$ სმ

KA: იპოვეთ $f(x) = a \cdot x^2 + \sqrt{b} \cdot x + 5$ ფუნქციის მნიშვნელობათა სიმრავლე, თუ $ax + b > 0$ უტოლობის ამონახსნთა სიმრავლეა $(-\infty; 4)$ ინტერვალი.
EN: Find the range of $f(x) = a \cdot x^2 + \sqrt{b} \cdot x + 5$ if the solution set of $ax + b > 0$ is the interval $(-\infty; 4)$.
SKA: $ax > -b$-ის ამონახსნი $(-\infty; 4)$-ია, ამიტომ $a < 0$ და $x < -\dfrac{b}{a} = 4 \Rightarrow b = -4a > 0$
$f$ — პარაბოლა შტოებით ქვემოთ; უდიდესი მნიშვნელობა: $5 - \dfrac{(\sqrt{b})^2}{4a} = 5 - \dfrac{b}{4a} = 5 - \dfrac{-4a}{4a} = 6$
SEN: $ax > -b$ has solution set $(-\infty; 4)$, so $a < 0$ and $x < -\dfrac{b}{a} = 4 \Rightarrow b = -4a > 0$
$f$ is a downward parabola; its maximum is $5 - \dfrac{(\sqrt{b})^2}{4a} = 5 - \dfrac{b}{4a} = 5 - \dfrac{-4a}{4a} = 6$
AKA: $(-\infty; 6]$
AEN: $(-\infty; 6]$

--- 3
KA: $ABC$ სამკუთხედის $AB$ გვერდზე, როგორც დიამეტრზე შემოხაზულია წრეწირი, რომელიც $AC$ გვერდს კვეთს $M$ წერტილში, ხოლო $BC$ გვერდს — $N$ წერტილში (იხ. სურათი). იპოვეთ $AB$ დიამეტრის სიგრძე, თუ $\angle ACB = 60^\circ$, $MC = 3$ სმ და $CN = 4$ სმ.
EN: A circle with diameter $AB$ (a side of triangle $ABC$) meets $AC$ at $M$ and $BC$ at $N$ (see the figure). Find $AB$ if $\angle ACB = 60^\circ$, $MC = 3$ cm and $CN = 4$ cm.
FIG: <svg viewBox="0 45 150 175" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="72.7" cy="155" r="57.7"/><path d="M15 155L103.8 62.8L130.4 155Z"/><circle cx="72.7" cy="155" r="2" fill="currentColor"/><text x="3" y="160" stroke="none" font-size="13">A</text><text x="133.4" y="160" stroke="none" font-size="13">B</text><text x="99.8" y="57.8" stroke="none" font-size="13">C</text><text x="56.5" y="97.4" stroke="none" font-size="13">M</text><text x="125.5" y="124.3" stroke="none" font-size="13">N</text></svg>
SKA: $\angle AMB = 90^\circ$ (ეყრდნობა დიამეტრს), ამიტომ $BM \perp AC$; მართკუთხა $\triangle BMC$-ში $CB = \dfrac{MC}{\cos 60^\circ} = 6$
ანალოგიურად $\angle ANB = 90^\circ$, $\triangle ANC$-ში $CA = \dfrac{CN}{\cos 60^\circ} = 8$
კოსინუსების თეორემა: $AB^2 = 64 + 36 - 2 \cdot 8 \cdot 6 \cdot \dfrac{1}{2} = 52$
$AB = 2\sqrt{13}$ სმ
SEN: $\angle AMB = 90^\circ$ (it subtends the diameter), so $BM \perp AC$; in right $\triangle BMC$, $CB = \dfrac{MC}{\cos 60^\circ} = 6$
Likewise $\angle ANB = 90^\circ$, and in $\triangle ANC$, $CA = \dfrac{CN}{\cos 60^\circ} = 8$
Law of cosines: $AB^2 = 64 + 36 - 2 \cdot 8 \cdot 6 \cdot \dfrac{1}{2} = 52$
$AB = 2\sqrt{13}$ cm
AKA: $2\sqrt{13}$ სმ
AEN: $2\sqrt{13}$ cm

KA: კომპანიამ იყიდა აქციათა ორი პაკეტი, რომლებიც მოგვიანებით გაყიდა $15$ მილიონ ლარად, რაც ამ აქციათა პაკეტებში გადახდილ თანხას $25\%$-ით აღემატება. რა თანხა გადაიხადა კომპანიამ აქციათა თითოეულ პაკეტში, თუ ცნობილია, რომ პირველი პაკეტის გაყიდვით მიღებული თანხა ამ პაკეტის ყიდვისას გადახდილ თანხას $32\%$-ით აღემატება, ხოლო მეორე პაკეტის გაყიდვით მიღებული თანხა ამ პაკეტის ყიდვისას გადახდილ თანხას $22\%$-ით აღემატება.
EN: A company bought two blocks of shares and later sold them for $15$ million lari, $25\%$ more than it paid. The first block sold for $32\%$ more than its price and the second for $22\%$ more. How much did the company pay for each block?
SKA: სულ გადახდილი: $\dfrac{15}{1{,}25} = 12$ მლნ
$x + y = 12$, $1{,}32x + 1{,}22y = 15$
$1{,}32x + 1{,}22(12 - x) = 15 \Rightarrow 0{,}1x = 0{,}36 \Rightarrow x = 3{,}6$, $y = 8{,}4$
SEN: Total paid: $\dfrac{15}{1.25} = 12$ million
$x + y = 12$, $1.32x + 1.22y = 15$
$1.32x + 1.22(12 - x) = 15 \Rightarrow 0.1x = 0.36 \Rightarrow x = 3.6$, $y = 8.4$
AKA: პირველში — $3{,}6$ მლნ ლარი, მეორეში — $8{,}4$ მლნ ლარი
AEN: $3.6$ million lari for the first block and $8.4$ million lari for the second

KA: არითმეტიკული პროგრესიის პირველი წევრი მთელი რიცხვია, პროგრესიის სხვაობა $3$-ის ტოლია, ხოლო ყველა წევრის ჯამი არის $26$. იპოვეთ ამ პროგრესიის წევრთა რაოდენობისა და პირველი წევრის ყველა შესაძლო მნიშვნელობა.
EN: The first term of an arithmetic progression is an integer, its difference is $3$, and the sum of all its terms is $26$. Find all possible values of the number of terms and of the first term.
SKA: $S_n = \dfrac{n(2a_1 + 3(n - 1))}{2} = 26 \Rightarrow n(2a_1 + 3n - 3) = 52$
$n$ არის $52$-ის გამყოფი: $1, 2, 4, 13, 26, 52$; $2a_1 = \dfrac{52}{n} - 3n + 3$ უნდა იყოს ლუწი
$n = 2$: $2a_1 = 23$ ✗; $n = 26$: $2a_1 = -73$ ✗
$n = 4$: $a_1 = 2$; $n = 13$: $a_1 = -16$; $n = 52$: $a_1 = -76$ (და ტრივიალური $n = 1$, $a_1 = 26$)
SEN: $S_n = \dfrac{n(2a_1 + 3(n - 1))}{2} = 26 \Rightarrow n(2a_1 + 3n - 3) = 52$
$n$ divides $52$: $1, 2, 4, 13, 26, 52$; $2a_1 = \dfrac{52}{n} - 3n + 3$ must be even
$n = 2$: $2a_1 = 23$ ✗; $n = 26$: $2a_1 = -73$ ✗
$n = 4$: $a_1 = 2$; $n = 13$: $a_1 = -16$; $n = 52$: $a_1 = -76$ (plus the trivial $n = 1$, $a_1 = 26$)
AKA: $n = 4,\ a_1 = 2$; $n = 13,\ a_1 = -16$; $n = 52,\ a_1 = -76$ (ერთწევრიანი „პროგრესიის“ დაშვებისას ასევე $n = 1,\ a_1 = 26$)
AEN: $n = 4,\ a_1 = 2$; $n = 13,\ a_1 = -16$; $n = 52,\ a_1 = -76$ (if a one-term "progression" is allowed, also $n = 1,\ a_1 = 26$)
