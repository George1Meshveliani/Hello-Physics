KA: საპრეზიდენტო არჩევნებში ამომრჩევლების ყველა ხმა გადანაწილდა სამ კანდიდატზე: $A$, $B$ და $C$-ზე. ხმების განაწილების ამსახველ წრიულ დიაგრამაზე $A$-ს შესაბამისი სექტორის კუთხე $30^\circ$-ით ნაკლებია $B$-ს შესაბამისი სექტორის კუთხეზე, ხოლო $C$-ს შესაბამისი სექტორის კუთხე $60^\circ$-ით ნაკლებია $B$-ს შესაბამისი სექტორის კუთხეზე. რამდენი პროცენტით აღემატება $A$ კანდიდატის მიერ მიღებული ხმების რაოდენობა $C$ კანდიდატის მიერ მიღებული ხმების რაოდენობას?
EN: All the votes in a presidential election went to three candidates $A$, $B$ and $C$. In the pie chart, $A$'s sector angle is $30^\circ$ less than $B$'s, and $C$'s is $60^\circ$ less than $B$'s. By what percentage did $A$ get more votes than $C$?

$25\%$-ით
$33\dfrac{1}{3}\%$-ით
$40\%$-ით
OEN: by $20\%$
by $25\%$
by $33\dfrac{1}{3}\%$
by $40\%$

SKA: $B = x$, $A = x - 30^\circ$, $C = x - 60^\circ$; ჯამი $3x - 90^\circ = 360^\circ \Rightarrow x = 150^\circ$
$A = 120^\circ$, $C = 90^\circ$; $\dfrac{120 - 90}{90} = \dfrac{1}{3} = 33\dfrac{1}{3}\%$

KA: გამოთვალეთ ჯამი $\cos\left(\dfrac{\pi}{4} - x\right) = 0$ განტოლების ყველა იმ ამონახსნისა, რომლებიც მოთავსებულია $(0; 2\pi)$ შუალედში.

$\dfrac{3\pi}{4}$
$\dfrac{7\pi}{4}$
$\dfrac{3\pi}{2}$
C: 1
SKA: $\cos\left(x - \dfrac{\pi}{4}\right) = 0 \Rightarrow x - \dfrac{\pi}{4} = \dfrac{\pi}{2} + \pi k \Rightarrow x = \dfrac{3\pi}{4} + \pi k$
$(0; 2\pi)$-ში: $\dfrac{3\pi}{4}$ და $\dfrac{7\pi}{4}$; ჯამი $\dfrac{10\pi}{4} = \dfrac{5\pi}{2}$
SEN: $\cos\left(x - \dfrac{\pi}{4}\right) = 0 \Rightarrow x - \dfrac{\pi}{4} = \dfrac{\pi}{2} + \pi k \Rightarrow x = \dfrac{3\pi}{4} + \pi k$
In $(0; 2\pi)$: $\dfrac{3\pi}{4}$ and $\dfrac{7\pi}{4}$; sum $\dfrac{10\pi}{4} = \dfrac{5\pi}{2}$

KA: $40$ სტუდენტიდან თითოეული მონაწილეობას იღებს მათემატიკის, ფიზიკის ან ქიმიის წრეებიდან ერთში მაინც. ცნობილია, რომ მათემატიკის წრეში მონაწილეობს ზუსტად $25$ სტუდენტი, ფიზიკის წრეში — $20$, ქიმიის წრეში — $15$. ზუსტად $5$ სტუდენტი იღებს მონაწილეობას სამივე წრეში. რამდენი სტუდენტი იღებს მონაწილეობას ზუსტად ორ წრეში?
EN: Each of $40$ students attends at least one of the maths, physics and chemistry clubs. Exactly $25$ attend maths, $20$ physics and $15$ chemistry, and exactly $5$ attend all three. How many attend exactly two clubs?
O: $10$
$12$
$15$
$25$
C: 1
SKA: ზუსტად ერთში — $x$, ზუსტად ორში — $y$, სამივეში — $5$
სტუდენტები: $x + y + 5 = 40$; მონაწილეობები: $x + 2y + 15 = 25 + 20 + 15 = 60$
გამოკლებით: $y + 10 = 20 \Rightarrow y = 10$
SEN: Exactly one club: $x$, exactly two: $y$, all three: $5$
Students: $x + y + 5 = 40$; memberships: $x + 2y + 15 = 25 + 20 + 15 = 60$
Subtract: $y + 10 = 20 \Rightarrow y = 10$

KA: წრეწირის გარეთ მდებარე $P$ წერტილიდან წრეწირისადმი გავლებულია მკვეთი და $PT$ მხები, რომელიც წრეწირს ეხება $T$ წერტილში. მკვეთი წრეწირს კვეთს $A$ და $B$ წერტილებში ($A$ წერტილი მდებარეობს $P$ და $B$ წერტილებს შორის). იპოვეთ $AB$ მონაკვეთის სიგრძე, თუ ცნობილია, რომ $PA = 4$ სმ და $PT = 8$ სმ.
EN: From a point $P$ outside a circle a secant and a tangent $PT$ are drawn. The secant meets the circle at $A$ and $B$ ($A$ between $P$ and $B$). Find $AB$ if $PA = 4$ cm and $PT = 8$ cm.
OKA: $8$ სმ
$10$ სმ
$12$ სმ
$16$ სმ
OEN: $8$ cm
$10$ cm
$12$ cm
$16$ cm
C: 3
SKA: მხებისა და მკვეთის თეორემა: $PT^2 = PA \cdot PB \Rightarrow 64 = 4 \cdot PB \Rightarrow PB = 16$
$AB = 16 - 4 = 12$ სმ
SEN: Tangent–secant theorem: $PT^2 = PA \cdot PB \Rightarrow 64 = 4 \cdot PB \Rightarrow PB = 16$
$AB = 16 - 4 = 12$ cm

KA: კონუსის ფუძის რადიუსი $4$ სმ-ის ტოლია, ხოლო მსახველი $9$ სმ-ის. იპოვეთ ამ კონუსის გვერდითი ზედაპირის შლილის ცენტრალური კუთხე რადიანებში.
EN: A cone has base radius $4$ cm and slant height $9$ cm. Find the central angle of the net of its lateral surface, in radians.
O: $\dfrac{2\pi}{3}$
$\dfrac{3\pi}{2}$
$\dfrac{5\pi}{6}$
$\dfrac{8\pi}{9}$
C: 4
SKA: შლილი — სექტორი რადიუსით $l = 9$, რკალის სიგრძე $2\pi r = 8\pi$
$\alpha = \dfrac{8\pi}{9}$
SEN: The net is a sector of radius $l = 9$ with arc length $2\pi r = 8\pi$
$\alpha = \dfrac{8\pi}{9}$

--- 3
KA: იპოვეთ $f(x) = ax^2 - 12x + c$ ფუნქციის უმცირესი მნიშვნელობა, თუ ცნობილია, რომ ამ ფუნქციის გრაფიკი სიმეტრიულია $x = 2$ წრფის მიმართ და გადის $(1; 8)$ წერტილზე.
EN: Find the least value of $f(x) = ax^2 - 12x + c$ if its graph is symmetric about the line $x = 2$ and passes through $(1; 8)$.
SKA: სიმეტრიის ღერძი: $\dfrac{12}{2a} = 2 \Rightarrow a = 3$
$f(1) = 3 - 12 + c = 8 \Rightarrow c = 17$
$f(x) = 3x^2 - 12x + 17$, $a > 0$ — უმცირესი მნიშვნელობა წვეროში: $f(2) = 12 - 24 + 17 = 5$
SEN: Axis of symmetry: $\dfrac{12}{2a} = 2 \Rightarrow a = 3$
$f(1) = 3 - 12 + c = 8 \Rightarrow c = 17$
$f(x) = 3x^2 - 12x + 17$ with $a > 0$, so the minimum is at the vertex: $f(2) = 12 - 24 + 17 = 5$
AKA: $5$
AEN: $5$

--- 3
KA: $Oxy$ საკოორდინატო სიბრტყეზე მოცემულია $OAB$ ბლაგვკუთხა სამკუთხედი, სადაც $A$ წერტილი მდებარეობს პირველ საკოორდინატო მეოთხედში, ხოლო $B$ წერტილი მდებარეობს $Ox$ ღერძზე. ცნობილია, რომ $OA = 8$, $AB = 7$ და $\angle AOB = 60^\circ$. გამოთვალეთ $OAB$ სამკუთხედის ფართობი.
EN: Obtuse triangle $OAB$ has $A$ in the first quadrant and $B$ on the $x$-axis, with $OA = 8$, $AB = 7$ and $\angle AOB = 60^\circ$. Find its area.
SKA: $OB = x$: კოსინუსების თეორემა $49 = 64 + x^2 - 8x \Rightarrow x^2 - 8x + 15 = 0 \Rightarrow x = 3$ ან $x = 5$
$x = 5$: $8^2 = 64 < 49 + 25 = 74$ — მახვილკუთხაა; $x = 3$: $64 > 49 + 9 = 58$ — ბლაგვკუთხაა
$OB = 3$, $S = \dfrac{1}{2} \cdot 8 \cdot 3 \cdot \sin 60^\circ = 6\sqrt{3}$
SEN: $OB = x$: law of cosines $49 = 64 + x^2 - 8x \Rightarrow x^2 - 8x + 15 = 0 \Rightarrow x = 3$ or $x = 5$
$x = 5$: $8^2 = 64 < 49 + 25 = 74$, acute; $x = 3$: $64 > 49 + 9 = 58$, obtuse
$OB = 3$, $S = \dfrac{1}{2} \cdot 8 \cdot 3 \cdot \sin 60^\circ = 6\sqrt{3}$
AKA: $6\sqrt{3}$
AEN: $6\sqrt{3}$

KA: საწარმოში ორი სხვადასხვა სიმძლავრის დანადგარი ერთობლივი მუშაობით $400$ კილოგრამ ჩირს $10$ საათში ამზადებს. ტექნიკური გაუმჯობესების შემდეგ, პირველი დანადგარის პროდუქტიულობა (ერთ საათში დამზადებული ჩირის მასის რაოდენობა) გაიზარდა $25\%$-ით, ხოლო ტექნიკური წუნის გამო მეორე დანადგარის პროდუქტიულობა შემცირდა $10\%$-ით. ამ ცვლილებების შემდეგ, ორივე დანადგარმა ერთად $12$ საათში $552$ კილოგრამი ჩირი დაამზადა. რამდენი კილოგრამ ჩირს ამზადებდა თავდაპირველად თითოეული დანადგარი ერთ საათში?
EN: Working together, two machines make $400$ kg of dried fruit in $10$ hours. After an upgrade the first machine's output per hour rose by $25\%$, while a fault cut the second machine's output by $10\%$. After these changes the two machines together made $552$ kg in $12$ hours. How many kilograms per hour did each machine make originally?
SKA: თავდაპირველად $x$ და $y$ კგ/სთ: $x + y = \dfrac{400}{10} = 40$
ცვლილების შემდეგ: $1{,}25x + 0{,}9y = \dfrac{552}{12} = 46$
$1{,}25x + 0{,}9(40 - x) = 46 \Rightarrow 0{,}35x = 10 \Rightarrow x = \dfrac{200}{7} = 28\dfrac{4}{7}$
$y = 40 - \dfrac{200}{7} = \dfrac{80}{7} = 11\dfrac{3}{7}$
შემოწმება: $1{,}25 \cdot \dfrac{200}{7} + 0{,}9 \cdot \dfrac{80}{7} = \dfrac{250 + 72}{7} = 46$ ✓
SEN: Originally $x$ and $y$ kg/h: $x + y = \dfrac{400}{10} = 40$
After the changes: $1.25x + 0.9y = \dfrac{552}{12} = 46$
$1.25x + 0.9(40 - x) = 46 \Rightarrow 0.35x = 10 \Rightarrow x = \dfrac{200}{7} = 28\dfrac{4}{7}$
$y = 40 - \dfrac{200}{7} = \dfrac{80}{7} = 11\dfrac{3}{7}$
Check: $1.25 \cdot \dfrac{200}{7} + 0.9 \cdot \dfrac{80}{7} = \dfrac{250 + 72}{7} = 46$ ✓
AKA: პირველი — $28\dfrac{4}{7}$ კგ/სთ, მეორე — $11\dfrac{3}{7}$ კგ/სთ
AEN: first machine $28\dfrac{4}{7}$ kg/h, second $11\dfrac{3}{7}$ kg/h

KA: $m$ პარამეტრის ყველა იმ მნიშვნელობისთვის, რომლისთვისაც $x^2 - (m - 3)x + (m^2 + 3m + 2) = 0$ კვადრატულ განტოლებას აქვს ორი ნამდვილი, ერთმანეთისგან განსხვავებული ამონახსნი, გამოთვალეს ამ ამონახსნების კვადრატების ჯამი $x_1^2 + x_2^2$. იპოვეთ ამ ჯამის შესაძლო უდიდესი მნიშვნელობა.
EN: For every $m$ for which $x^2 - (m - 3)x + (m^2 + 3m + 2) = 0$ has two distinct real roots, the sum of squares of the roots $x_1^2 + x_2^2$ is computed. Find the largest possible value of this sum.
SKA: ორი განსხვავებული ფესვი: $D = (m - 3)^2 - 4(m^2 + 3m + 2) = -3m^2 - 18m + 1 > 0$
$3m^2 + 18m - 1 < 0 \Rightarrow m \in \left(-3 - \dfrac{2\sqrt{21}}{3};\ -3 + \dfrac{2\sqrt{21}}{3}\right) \approx (-6{,}06;\ 0{,}06)$
$x_1^2 + x_2^2 = (x_1 + x_2)^2 - 2x_1x_2 = (m - 3)^2 - 2(m^2 + 3m + 2) = -m^2 - 12m + 5$
პარაბოლის წვერო $m = -6$ ამ შუალედშია ($D(-6) = 1 > 0$): მნიშვნელობა $-36 + 72 + 5 = 41$
SEN: Two distinct roots: $D = (m - 3)^2 - 4(m^2 + 3m + 2) = -3m^2 - 18m + 1 > 0$
$3m^2 + 18m - 1 < 0 \Rightarrow m \in \left(-3 - \dfrac{2\sqrt{21}}{3};\ -3 + \dfrac{2\sqrt{21}}{3}\right) \approx (-6.06;\ 0.06)$
$x_1^2 + x_2^2 = (x_1 + x_2)^2 - 2x_1x_2 = (m - 3)^2 - 2(m^2 + 3m + 2) = -m^2 - 12m + 5$
The vertex $m = -6$ lies in this interval ($D(-6) = 1 > 0$): value $-36 + 72 + 5 = 41$
AKA: $41$
AEN: $41$
