EN: Solve $\log_3(x + 1) + \log_3(x - 1) = 1$.

$-2$ და $2$
$4$
ამონახსნი არ აქვს

$-2$ and $2$

C: 1
SKA: განსაზღვრის არე: $x > 1$

SEN: Domain: $x > 1$
$\log_3\big((x + 1)(x - 1)\big) = 1 \Rightarrow x^2 - 1 = 3 \Rightarrow x = \pm 2$
$x = -2$ is outside the domain; answer $x = 2$

KA: ამოხსენით უტოლობა $\dfrac{(x - 2)(x + 3)}{x - 5} \le 0$.
EN: Solve the inequality $\dfrac{(x - 2)(x + 3)}{x - 5} \le 0$.
SKA: კრიტიკული წერტილები: $-3$, $2$ (მრიცხველის ნულები, შედის) და $5$ (მნიშვნელის ნული, არ შედის)
ინტერვალთა მეთოდი: $x > 5$-ზე გამოსახულება დადებითია, შემდეგ ნიშნები მონაცვლეობს: $(2; 5)$ — უარყოფითი, $(-3; 2)$ — დადებითი, $(-\infty; -3)$ — უარყოფითი
$x \in (-\infty; -3] \cup [2; 5)$
SEN: Critical points: $-3$ and $2$ (zeros of the numerator, included) and $5$ (zero of the denominator, excluded)
Sign chart: positive for $x > 5$, then alternating: $(2; 5)$ negative, $(-3; 2)$ positive, $(-\infty; -3)$ negative
$x \in (-\infty; -3] \cup [2; 5)$
AKA: $(-\infty; -3] \cup [2; 5)$
AEN: $(-\infty; -3] \cup [2; 5)$

KA: $ABCD$ პარალელოგრამში $AB = 4$, $AD = 6$, $\angle A = 60^\circ$. იპოვეთ პარალელოგრამის დიაგონალები და ფართობი.
EN: In parallelogram $ABCD$, $AB = 4$, $AD = 6$ and $\angle A = 60^\circ$. Find its diagonals and its area.
SKA: $BD^2 = 16 + 36 - 2 \cdot 4 \cdot 6 \cdot \cos 60^\circ = 28 \Rightarrow BD = 2\sqrt{7}$
$\angle B = 120^\circ$: $AC^2 = 16 + 36 - 2 \cdot 4 \cdot 6 \cdot \cos 120^\circ = 76 \Rightarrow AC = 2\sqrt{19}$
$S = AB \cdot AD \cdot \sin 60^\circ = 24 \cdot \dfrac{\sqrt{3}}{2} = 12\sqrt{3}$
SEN: $BD^2 = 16 + 36 - 2 \cdot 4 \cdot 6 \cdot \cos 60^\circ = 28 \Rightarrow BD = 2\sqrt{7}$
$\angle B = 120^\circ$: $AC^2 = 16 + 36 - 2 \cdot 4 \cdot 6 \cdot \cos 120^\circ = 76 \Rightarrow AC = 2\sqrt{19}$
$S = AB \cdot AD \cdot \sin 60^\circ = 24 \cdot \dfrac{\sqrt{3}}{2} = 12\sqrt{3}$
AKA: $BD = 2\sqrt{7}$, $AC = 2\sqrt{19}$, $S = 12\sqrt{3}$
AEN: $BD = 2\sqrt{7}$, $AC = 2\sqrt{19}$, $S = 12\sqrt{3}$

KA: $A$ პუნქტიდან $60$ კმ-ით დაშორებულ $B$ პუნქტში ერთდროულად გაემგზავრა ორი ველოსიპედისტი. პირველის სიჩქარე $3$ კმ/სთ-ით მეტია მეორისაზე, ამიტომ ის $B$-ში $1$ საათით ადრე ჩავიდა. იპოვეთ ველოსიპედისტების სიჩქარეები.
EN: Two cyclists set off at the same time from $A$ to $B$, $60$ km away. The first rides $3$ km/h faster and arrives $1$ hour earlier. Find their speeds.
SKA: მეორის სიჩქარე $v$, პირველის — $v + 3$
$\dfrac{60}{v} - \dfrac{60}{v + 3} = 1 \Rightarrow \dfrac{180}{v(v + 3)} = 1$
$v^2 + 3v - 180 = 0 \Rightarrow v = 12$ ($v = -15$ გამოირიცხება)
შემოწმება: $\dfrac{60}{12} - \dfrac{60}{15} = 5 - 4 = 1$ ✓
SEN: Second cyclist $v$, first $v + 3$
$\dfrac{60}{v} - \dfrac{60}{v + 3} = 1 \Rightarrow \dfrac{180}{v(v + 3)} = 1$
$v^2 + 3v - 180 = 0 \Rightarrow v = 12$ ($v = -15$ is rejected)
Check: $\dfrac{60}{12} - \dfrac{60}{15} = 5 - 4 = 1$ ✓
AKA: $15$ კმ/სთ და $12$ კმ/სთ
AEN: $15$ km/h and $12$ km/h

KA: მოცემულია სისტემა $\begin{cases} x + y = a \\ xy = 4 \end{cases}$. ა) $a$-ს რა მნიშვნელობებისთვის აქვს სისტემას ზუსტად ერთი ამონახსნი? ბ) $a$-ს რა მნიშვნელობებისთვის აქვს სისტემას ამონახსნი, რომლისთვისაც $x^2 + y^2 = 17$?
EN: Consider the system $\begin{cases} x + y = a \\ xy = 4 \end{cases}$. (a) For which $a$ does it have exactly one solution? (b) For which $a$ does it have a solution with $x^2 + y^2 = 17$?
SKA: ვიეტის შებრუნებული თეორემით $x$ და $y$ არის $t^2 - at + 4 = 0$-ის ფესვები; ამონახსნი არსებობს, როცა $D = a^2 - 16 \ge 0$
ა) $D > 0$-ზე ფესვები $t_1 \ne t_2$ იძლევა ორ ამონახსნს $(t_1; t_2)$ და $(t_2; t_1)$; ერთი ამონახსნი მხოლოდ $D = 0$-ზე: $a = \pm 4$ (ამონახსნები $(2; 2)$ და $(-2; -2)$)
ბ) $x^2 + y^2 = (x + y)^2 - 2xy = a^2 - 8 = 17 \Rightarrow a = \pm 5$; $|a| = 5 \ge 4$ — ამონახსნი არსებობს
SEN: By Vieta, $x$ and $y$ are the roots of $t^2 - at + 4 = 0$; solutions exist when $D = a^2 - 16 \ge 0$
(a) For $D > 0$ the roots $t_1 \ne t_2$ give two solutions $(t_1; t_2)$ and $(t_2; t_1)$; exactly one solution only when $D = 0$: $a = \pm 4$ (solutions $(2; 2)$ and $(-2; -2)$)
(b) $x^2 + y^2 = (x + y)^2 - 2xy = a^2 - 8 = 17 \Rightarrow a = \pm 5$; since $|a| = 5 \ge 4$, solutions exist
AKA: ა) $a = \pm 4$; ბ) $a = \pm 5$
AEN: (a) $a = \pm 4$; (b) $a = \pm 5$
