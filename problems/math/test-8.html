KA: $4{,}5 : \dfrac{3}{4} - 2\dfrac{1}{3} =$
EN: $4.5 : \dfrac{3}{4} - 2\dfrac{1}{3} =$

$2\dfrac{1}{3}$

KA: რა ნაშთი მიიღება $2^{10}$-ის $7$-ზე გაყოფისას?
EN: What is the remainder when $2^{10}$ is divided by $7$?
O: $2$
$4$
$6$
$1$
C: 1
SKA: $2^3 = 8 \equiv 1 \pmod 7$
$2^{10} = (2^3)^3 \cdot 2 \equiv 1 \cdot 2 = 2$ (შემოწმება: $1024 = 7 \cdot 146 + 2$)
SEN: $2^3 = 8 \equiv 1 \pmod 7$
$2^{10} = (2^3)^3 \cdot 2 \equiv 1 \cdot 2 = 2$ (check: $1024 = 7 \cdot 146 + 2$)

KA: $A$ რიცხვი $25\%$-ით მეტია $B$-ზე. რამდენი პროცენტით ნაკლებია $B$ რიცხვი $A$-ზე?
EN: $A$ is $25\%$ greater than $B$. By what percentage is $B$ less than $A$?
O: $25\%$
$75\%$
$20\%$
$80\%$
C: 3
SKA: $A = 1{,}25B \Rightarrow B = \dfrac{A}{1{,}25} = 0{,}8A$
$B$ ნაკლებია $A$-ზე $20\%$-ით
SEN: $A = 1.25B \Rightarrow B = \dfrac{A}{1.25} = 0.8A$
$B$ is $20\%$ less than $A$

$6^{10}$

KA: სამკუთხედის ორი კუთხეა $45^\circ$ და $60^\circ$, $45^\circ$-იანი კუთხის მოპირდაპირე გვერდია $4\sqrt{2}$. იპოვეთ $60^\circ$-იანი კუთხის მოპირდაპირე გვერდი.
EN: Two angles of a triangle are $45^\circ$ and $60^\circ$; the side opposite the $45^\circ$ angle is $4\sqrt{2}$. Find the side opposite the $60^\circ$ angle.
O: $2\sqrt{6}$
$4\sqrt{3}$
$4\sqrt{6}$
$8$
C: 2
SKA: სინუსების თეორემა: $\dfrac{x}{\sin 60^\circ} = \dfrac{4\sqrt{2}}{\sin 45^\circ} = \dfrac{4\sqrt{2}}{\sqrt{2}/2} = 8$
$x = 8 \cdot \dfrac{\sqrt{3}}{2} = 4\sqrt{3}$
SEN: Law of sines: $\dfrac{x}{\sin 60^\circ} = \dfrac{4\sqrt{2}}{\sin 45^\circ} = \dfrac{4\sqrt{2}}{\sqrt{2}/2} = 8$
$x = 8 \cdot \dfrac{\sqrt{3}}{2} = 4\sqrt{3}$

KA: საქონლის ფასი ჯერ $p\%$-ით გაზარდეს, შემდეგ კი ახალი ფასი $2p\%$-ით შეამცირეს. საბოლოო ფასი თავდაპირველზე $28\%$-ით ნაკლები აღმოჩნდა. იპოვეთ $p$.

$1 - t - 2t^2 = 0{,}72 \Rightarrow 2t^2 + t - 0{,}28 = 0$
$t = \dfrac{-1 \pm \sqrt{1 + 2{,}24}}{4} = \dfrac{-1 \pm 1{,}8}{4} \Rightarrow t = 0{,}2$ ($t = -0{,}7$ გამოირიცხება)
$p = 20$; შემოწმება: $1{,}2 \cdot 0{,}6 = 0{,}72$ ✓
SEN: Let $t = \dfrac{p}{100}$: $(1 + t)(1 - 2t) = 0.72$
$1 - t - 2t^2 = 0.72 \Rightarrow 2t^2 + t - 0.28 = 0$
$t = \dfrac{-1 \pm \sqrt{1 + 2.24}}{4} = \dfrac{-1 \pm 1.8}{4} \Rightarrow t = 0.2$ ($t = -0.7$ is rejected)
$p = 20$; check: $1.2 \cdot 0.6 = 0.72$ ✓
AKA: $p = 20$
AEN: $p = 20$
