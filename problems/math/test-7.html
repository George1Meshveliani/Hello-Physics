KA: $n$ კენტი ნატურალური რიცხვია. რომელ რიცხვზე იყოფა აუცილებლად $n^2 - 1$?
EN: $n$ is an odd natural number. By which number is $n^2 - 1$ always divisible?
O: $8$
$3$
$5$
$16$
C: 1
SKA: $n = 2k + 1$: $n^2 - 1 = (n - 1)(n + 1) = 2k(2k + 2) = 4k(k + 1)$
$k(k + 1)$ ლუწია, ამიტომ $n^2 - 1$ იყოფა $8$-ზე; $n = 3$-ზე $n^2 - 1 = 8$ — $16$-ზე, $3$-ზე, $5$-ზე არ იყოფა
SEN: $n = 2k + 1$: $n^2 - 1 = (n - 1)(n + 1) = 2k(2k + 2) = 4k(k + 1)$
$k(k + 1)$ is even, so $n^2 - 1$ is divisible by $8$; for $n = 3$ we get $8$, not divisible by $16$, $3$ or $5$

O: $\dfrac{\pi}{4}$

$\dfrac{\pi - 2}{4}$
C: 3
SKA: თითოეული წვეროს გარშემო $1$ რადიუსიანი მეოთხედი წრე ($\dfrac{\pi}{4}$); ისინი არ ფარავენ ერთმანეთს
გამოსარიცხი ფართობი: $4 \cdot \dfrac{\pi}{4} = \pi$; $P = \dfrac{4 - \pi}{4}$
SEN: Around each vertex there is a quarter disc of radius $1$ (area $\dfrac{\pi}{4}$); they do not overlap
Excluded area: $4 \cdot \dfrac{\pi}{4} = \pi$; $P = \dfrac{4 - \pi}{4}$

KA: ამოხსენით განტოლება $\sqrt{x + 7} = x + 1$.
EN: Solve $\sqrt{x + 7} = x + 1$.
SKA: საჭიროა $x + 1 \ge 0$; ავიყვანოთ კვადრატში: $x + 7 = x^2 + 2x + 1$
$x^2 + x - 6 = 0 \Rightarrow x = 2$ ან $x = -3$
$x = -3$: $x + 1 = -2 < 0$ — ზედმეტი ფესვია; $x = 2$: $\sqrt{9} = 3 = 2 + 1$ ✓
SEN: We need $x + 1 \ge 0$; squaring: $x + 7 = x^2 + 2x + 1$
$x^2 + x - 6 = 0 \Rightarrow x = 2$ or $x = -3$
$x = -3$ gives $x + 1 = -2 < 0$, an extraneous root; $x = 2$: $\sqrt{9} = 3 = 2 + 1$ ✓
AKA: $x = 2$
AEN: $x = 2$

KA: მართკუთხა სამკუთხედის კათეტებია $6$ და $8$. იპოვეთ ჩახაზული და შემოხაზული წრეწირების რადიუსები და მათ ცენტრებს შორის მანძილი.
EN: A right triangle has legs $6$ and $8$. Find the radii of its inscribed and circumscribed circles and the distance between their centres.
SKA: ჰიპოტენუზა $10$; $R = \dfrac{10}{2} = 5$, $r = \dfrac{6 + 8 - 10}{2} = 2$
$C(0; 0)$, კათეტები ღერძებზე: $A(8; 0)$, $B(0; 6)$
ჩახაზულის ცენტრი $(2; 2)$, შემოხაზულისა — ჰიპოტენუზის შუაწერტილი $(4; 3)$
მანძილი: $\sqrt{2^2 + 1^2} = \sqrt{5}$ (ეილერის ფორმულით: $d^2 = R^2 - 2Rr = 25 - 20 = 5$)
SEN: Hypotenuse $10$; $R = \dfrac{10}{2} = 5$, $r = \dfrac{6 + 8 - 10}{2} = 2$
Put $C(0; 0)$ with the legs on the axes: $A(8; 0)$, $B(0; 6)$
Incentre $(2; 2)$, circumcentre at the midpoint of the hypotenuse $(4; 3)$
Distance: $\sqrt{2^2 + 1^2} = \sqrt{5}$ (Euler's formula agrees: $d^2 = R^2 - 2Rr = 25 - 20 = 5$)
AKA: $r = 2$, $R = 5$, $d = \sqrt{5}$
AEN: $r = 2$, $R = 5$, $d = \sqrt{5}$

KA: მჟავის $30\%$-იანი და $50\%$-იანი ხსნარები შეურიეს ერთმანეთს და დაამატეს $10$ კგ წყალი — მიიღეს $36\%$-იანი ხსნარი. წყლის ნაცვლად იმავე $50\%$-იანი ხსნარის $10$ კგ რომ დაემატებინათ, მიიღებდნენ $41\%$-იან ხსნარს. რამდენი კილოგრამი იყო თითოეული ხსნარი?
EN: A $30\%$ acid solution and a $50\%$ acid solution were mixed and $10$ kg of water was added, giving a $36\%$ solution. If $10$ kg of the $50\%$ solution had been added instead of water, the result would have been $41\%$. How many kilograms of each solution were there?
SKA: $x$ კგ $30\%$-იანი, $y$ კგ $50\%$-იანი; მჟავა $0{,}3x + 0{,}5y$
$0{,}3x + 0{,}5y = 0{,}36(x + y + 10)$, $0{,}3x + 0{,}5y + 5 = 0{,}41(x + y + 10)$
გამოკლებით: $5 = 0{,}05(x + y + 10) \Rightarrow x + y = 90$
$0{,}3x + 0{,}5y = 36 \Rightarrow 0{,}3x + 0{,}5(90 - x) = 36 \Rightarrow 0{,}2x = 9 \Rightarrow x = 45$, $y = 45$
SEN: $x$ kg of $30\%$, $y$ kg of $50\%$; acid $0.3x + 0.5y$
$0.3x + 0.5y = 0.36(x + y + 10)$ and $0.3x + 0.5y + 5 = 0.41(x + y + 10)$
Subtract: $5 = 0.05(x + y + 10) \Rightarrow x + y = 90$
$0.3x + 0.5y = 36 \Rightarrow 0.3x + 0.5(90 - x) = 36 \Rightarrow 0.2x = 9 \Rightarrow x = 45$, $y = 45$
AKA: $45$ კგ $30\%$-იანი და $45$ კგ $50\%$-იანი
AEN: $45$ kg of the $30\%$ solution and $45$ kg of the $50\%$ solution

KA: $a$ პარამეტრის რა მნიშვნელობებისთვის აქვს $(a - 1)x^2 - 2ax + a + 2 = 0$ განტოლებას ზუსტად ერთი ამონახსნი?
EN: For which $a$ does $(a - 1)x^2 - 2ax + a + 2 = 0$ have exactly one solution?
SKA: $a = 1$: განტოლება წრფივია: $-2x + 3 = 0 \Rightarrow x = 1{,}5$ — ერთი ამონახსნი ✓
$a \ne 1$: კვადრატულია, ერთი ამონახსნი როცა $\dfrac{D}{4} = a^2 - (a - 1)(a + 2) = 2 - a = 0 \Rightarrow a = 2$
$a = 2$: $x^2 - 4x + 4 = 0 \Rightarrow x = 2$ ✓
SEN: $a = 1$: the equation is linear, $-2x + 3 = 0 \Rightarrow x = 1.5$, one solution ✓
$a \ne 1$: quadratic, one solution when $\dfrac{D}{4} = a^2 - (a - 1)(a + 2) = 2 - a = 0 \Rightarrow a = 2$
$a = 2$: $x^2 - 4x + 4 = 0 \Rightarrow x = 2$ ✓
AKA: $a = 1$ ან $a = 2$
AEN: $a = 1$ or $a = 2$
