AEN: $162$

--- easy statistics
KA: იპოვეთ მონაცემების $12,\ 7,\ 19,\ 3,\ 10$ გაბნევის დიაპაზონი (უდიდესს გამოკლებული უმცირესი) და საშუალო.
EN: Find the range (largest minus smallest) and the mean of $12,\ 7,\ 19,\ 3,\ 10$.
HKA: დიაპაზონი $= \max - \min$.
HEN: Range $= \max - \min$.
SKA: დიაპაზონი: $19 - 3 = 16$
საშუალო: $\dfrac{12 + 7 + 19 + 3 + 10}{5} = \dfrac{51}{5} = 10{,}2$
SEN: Range: $19 - 3 = 16$
Mean: $\dfrac{12 + 7 + 19 + 3 + 10}{5} = \dfrac{51}{5} = 10.2$
AKA: $16$; $10{,}2$
AEN: $16$; $10.2$

--- easy probability
KA: ჩანთაში $4$ წითელი და $6$ თეთრი ბურთია. შემთხვევით იღებენ ერთს. რას უდრის წითელის ამოღების ალბათობა?
EN: A bag has $4$ red and $6$ white balls. One is drawn at random. What is the probability it is red?
HKA: $P = \dfrac{\text{ხელშემწყობი}}{\text{ყველა}}$.
HEN: $P = \dfrac{\text{favourable}}{\text{all}}$.
SKA: $P = \dfrac{4}{4 + 6} = \dfrac{4}{10} = 0{,}4$
SEN: $P = \dfrac{4}{4 + 6} = \dfrac{4}{10} = 0.4$
AKA: $0{,}4$
AEN: $0.4$

--- medium numbers
KA: გამოთვალეთ: $\left(\dfrac{2}{5} + 0{,}6\right) \cdot (-3)^2 - \dfrac{1}{2}$.
EN: Calculate: $\left(\dfrac{2}{5} + 0.6\right) \cdot (-3)^2 - \dfrac{1}{2}$.
HKA: $\dfrac{2}{5} = 0{,}4$.
HEN: $\dfrac{2}{5} = 0.4$.
SKA: $0{,}4 + 0{,}6 = 1$, $\ (-3)^2 = 9$
$1 \cdot 9 - 0{,}5 = 8{,}5$
SEN: $0.4 + 0.6 = 1$, $\ (-3)^2 = 9$
$1 \cdot 9 - 0.5 = 8.5$
AKA: $8{,}5$
AEN: $8.5$

--- medium numbers
KA: იპოვეთ $24$-ისა და $36$-ის უდიდესი საერთო გამყოფი და უმცირესი საერთო ჯერადი.
EN: Find the greatest common divisor and least common multiple of $24$ and $36$.
HKA: დაშალეთ მარტივ მამრავლებად.
HEN: Factorise into primes.
SKA: $24 = 2^3 \cdot 3$, $\ 36 = 2^2 \cdot 3^2$
უსგ $= 2^2 \cdot 3 = 12$; უსჯ $= 2^3 \cdot 3^2 = 72$
(შემოწმება: $12 \cdot 72 = 864 = 24 \cdot 36$ ✓)
SEN: $24 = 2^3 \cdot 3$, $\ 36 = 2^2 \cdot 3^2$
GCD $= 2^2 \cdot 3 = 12$; LCM $= 2^3 \cdot 3^2 = 72$
(Check: $12 \cdot 72 = 864 = 24 \cdot 36$ ✓)
AKA: $12$; $72$
AEN: $12$; $72$

--- medium sets
KA: რამდენი მთელი რიცხვი აკმაყოფილებს უტოლობას $|x| < 3$? ჩამოწერეთ ისინი.
EN: How many integers satisfy $|x| < 3$? List them.
HKA: $|x| < 3$ ნიშნავს: $x$ ნულიდან $3$-ზე ნაკლებითაა დაშორებული.
HEN: $|x| < 3$ means $x$ is less than $3$ away from zero.
SKA: $-3 < x < 3$
მთელები: $-2, -1, 0, 1, 2$ — სულ $5$.
SEN: $-3 < x < 3$
Integers: $-2, -1, 0, 1, 2$ — $5$ in total.
AKA: $5$
AEN: $5$

--- medium numeration
KA: ძველი ქართული ნუმერაციით (ა$=1$, …, ე$=5$, …, ო$=70$, …, ნ$=50$, …, ყ$=800$, ჳ$=400$, ჩ$=1000$) რომელი წელია „ჩყოე“? ჩაწერეთ $1453$ წელი (ჩ$=1000$, ჳ$=400$, ნ$=50$, გ$=3$).
EN: In old Georgian numerals (ა$=1$, …, ე$=5$, …, ო$=70$, …, ნ$=50$, …, ყ$=800$, ჳ$=400$, ჩ$=1000$) which year is "ჩყოე"? Write the year $1453$ (ჩ$=1000$, ჳ$=400$, ნ$=50$, გ$=3$).
HKA: რიცხვი ასოების მნიშვნელობათა ჯამია: ათასეული, ასეული, ათეული, ერთეული.
HEN: The number is the sum of the letter values: thousands, hundreds, tens, units.
SKA: ჩყოე $= 1000 + 800 + 70 + 5 = 1875$
$1453 = 1000 + 400 + 50 + 3 = $ ჩ $+$ ჳ $+$ ნ $+$ გ $\Rightarrow$ „ჩჳნგ“
SEN: ჩყოე $= 1000 + 800 + 70 + 5 = 1875$
$1453 = 1000 + 400 + 50 + 3 = $ ჩ $+$ ჳ $+$ ნ $+$ გ $\Rightarrow$ "ჩჳნგ"
AKA: $1875$; ჩჳნგ
AEN: $1875$; ჩჳნგ

--- medium units
KA: გადაიყვანეთ: $15\ \text{მ/წმ}$ — $\text{კმ/სთ}$-ში; $2{,}5\ \text{ლ}$ — $\text{სმ}^3$-ში.
EN: Convert $15\ \text{m/s}$ to $\text{km/h}$, and $2.5\ \text{L}$ to $\text{cm}^3$.
HKA: $1\ \text{მ/წმ} = 3{,}6\ \text{კმ/სთ}$; $1\ \text{ლ} = 1000\ \text{სმ}^3$.
HEN: $1\ \text{m/s} = 3.6\ \text{km/h}$; $1\ \text{L} = 1000\ \text{cm}^3$.
SKA: $15 \cdot 3{,}6 = 54\ \text{კმ/სთ}$
$2{,}5 \cdot 1000 = 2500\ \text{სმ}^3$
SEN: $15 \cdot 3.6 = 54\ \text{km/h}$
$2.5 \cdot 1000 = 2500\ \text{cm}^3$
AKA: $54\ \text{კმ/სთ}$; $2500\ \text{სმ}^3$
AEN: $54\ \text{km/h}$; $2500\ \text{cm}^3$

--- medium ratio
KA: $4$ კაცზე გათვლილი რეცეპტით საჭიროა $300\ \text{გ}$ ფქვილი. რამდენი ფქვილია საჭირო $10$ კაცისთვის?
EN: A recipe for $4$ people needs $300\ \text{g}$ of flour. How much flour is needed for $10$ people?
HKA: პირდაპირპროპორციული დამოკიდებულება.
HEN: Direct proportion.
SKA: ერთ კაცზე: $300 : 4 = 75\ \text{გ}$
$10$ კაცზე: $75 \cdot 10 = 750\ \text{გ}$
SEN: Per person: $300 \div 4 = 75\ \text{g}$
For $10$: $75 \cdot 10 = 750\ \text{g}$
AKA: $750\ \text{გ}$
AEN: $750\ \text{g}$

--- medium ratio
KA: $3$ ტუმბო ავზს $10$ საათში ცლის. რამდენ საათში დაცლის ავზს $5$ ასეთი ტუმბო?
EN: $3$ pumps empty a tank in $10$ hours. How long do $5$ such pumps take?
HKA: უკუპროპორციულობა: ტუმბოების რიცხვი × დრო = მუდმივი.
HEN: Inverse proportion: number of pumps × time = constant.
SKA: $3 \cdot 10 = 5 \cdot t \Rightarrow t = 6$ საათი
SEN: $3 \cdot 10 = 5 \cdot t \Rightarrow t = 6$ hours
AKA: $6$ საათში
AEN: $6$ hours

--- medium percent
KA: ფეხსაცმლის ფასი $250$ ლარი იყო. ფასდაკლებისას ის $20\%$-ით შემცირდა, შემდეგ ახალი ფასი $20\%$-ით გაიზარდა. რა ღირს ფეხსაცმელი ახლა?
EN: Shoes cost $250$ lari. In a sale the price dropped $20\%$, then the new price rose $20\%$. What do they cost now?
HKA: მეორე ცვლილება ახალი ფასიდან ითვლება.
HEN: The second change is taken on the new price.
SKA: $250 \cdot 0{,}8 = 200\ ₾$
$200 \cdot 1{,}2 = 240\ ₾$ — საწყისზე $10\ ₾$-ით ნაკლები.
SEN: $250 \cdot 0.8 = 200\ ₾$
$200 \cdot 1.2 = 240\ ₾$ — $10\ ₾$ less than at first.
AKA: $240\ ₾$
AEN: $240\ ₾$

--- medium percent
KA: ხელფასი $800$ ლარიდან $920$ ლარამდე გაიზარდა. რამდენი პროცენტით გაიზარდა ხელფასი?
EN: A salary rose from $800$ lari to $920$ lari. By what percent did it rise?
HKA: ცვლილება შეადარეთ საწყის მნიშვნელობას.
HEN: Compare the change with the original value.
SKA: $\dfrac{920 - 800}{800} \cdot 100\% = \dfrac{120}{800} \cdot 100\% = 15\%$
SEN: $\dfrac{920 - 800}{800} \cdot 100\% = \dfrac{120}{800} \cdot 100\% = 15\%$
AKA: $15\%$
AEN: $15\%$

--- medium algebra
KA: გაამრავლეთ ერთწევრები და ჩაწერეთ სტანდარტული სახით: $(-2a^2 b) \cdot (3ab^3)$ და $(-3x^2)^3$.
EN: Multiply the monomials and write them in standard form: $(-2a^2 b) \cdot (3ab^3)$ and $(-3x^2)^3$.
HKA: $a^m \cdot a^n = a^{m+n}$, $\ (a^m)^n = a^{mn}$.
HEN: $a^m \cdot a^n = a^{m+n}$, $\ (a^m)^n = a^{mn}$.
SKA: $(-2a^2 b) \cdot (3ab^3) = -6a^{3}b^{4}$
$(-3x^2)^3 = (-3)^3 x^{6} = -27x^6$
SEN: $(-2a^2 b) \cdot (3ab^3) = -6a^{3}b^{4}$
$(-3x^2)^3 = (-3)^3 x^{6} = -27x^6$
AKA: $-6a^3b^4$; $-27x^6$
AEN: $-6a^3b^4$; $-27x^6$

--- medium equations
KA: ამოხსენით განტოლება: $0{,}3(x + 4) - 0{,}2x = 1{,}6$.
EN: Solve: $0.3(x + 4) - 0.2x = 1.6$.
HKA: შეგიძლიათ ორივე მხარე $10$-ზე გაამრავლოთ.
HEN: You can multiply both sides by $10$.
SKA: $0{,}3x + 1{,}2 - 0{,}2x = 1{,}6$
$0{,}1x = 0{,}4 \Rightarrow x = 4$
SEN: $0.3x + 1.2 - 0.2x = 1.6$
$0.1x = 0.4 \Rightarrow x = 4$
AKA: $x = 4$
AEN: $x = 4$

--- medium equations
KA: სამი მომდევნო მთელი რიცხვის ჯამი $72$-ია. იპოვეთ ეს რიცხვები.
EN: The sum of three consecutive integers is $72$. Find them.
HKA: აღნიშნეთ რიცხვები $n$, $n + 1$, $n + 2$.
HEN: Call the numbers $n$, $n + 1$, $n + 2$.
SKA: $n + (n + 1) + (n + 2) = 72 \Rightarrow 3n + 3 = 72 \Rightarrow n = 23$
რიცხვები: $23, 24, 25$
SEN: $n + (n + 1) + (n + 2) = 72 \Rightarrow 3n + 3 = 72 \Rightarrow n = 23$
The numbers: $23, 24, 25$
AKA: $23;\ 24;\ 25$
AEN: $23,\ 24,\ 25$

--- medium equations
KA: რვეული და კალამი ერთად $5$ ლარი ღირს; რვეული კალამზე $1{,}2$ ლარით ძვირია. რა ღირს თითოეული?
EN: A notebook and a pen cost $5$ lari together; the notebook costs $1.2$ lari more than the pen. What does each cost?
HKA: კალამი $x$, რვეული $x + 1{,}2$.
HEN: Pen $x$, notebook $x + 1.2$.
SKA: $x + (x + 1{,}2) = 5 \Rightarrow 2x = 3{,}8 \Rightarrow x = 1{,}9$
კალამი $1{,}9\ ₾$, რვეული $3{,}1\ ₾$.
SEN: $x + (x + 1.2) = 5 \Rightarrow 2x = 3.8 \Rightarrow x = 1.9$
Pen $1.9\ ₾$, notebook $3.1\ ₾$.
AKA: კალამი $1{,}9\ ₾$, რვეული $3{,}1\ ₾$
AEN: pen $1.9\ ₾$, notebook $3.1\ ₾$

--- medium inequalities
KA: ამოხსენით უტოლობა: $5 - 2x \le 3x + 20$.
EN: Solve: $5 - 2x \le 3x + 20$.
HKA: უცნობიანი წევრები ერთ მხარეს გადაიტანეთ.
HEN: Move the $x$ terms to one side.
SKA: $5 - 20 \le 3x + 2x$
$-15 \le 5x \Rightarrow x \ge -3$
SEN: $5 - 20 \le 3x + 2x$
$-15 \le 5x \Rightarrow x \ge -3$
AKA: $x \ge -3$
AEN: $x \ge -3$

--- medium systems
KA: ამოხსენით სისტემა შეკრების ხერხით: $\begin{cases} 3x + 2y = 16 \\ x - 2y = 0 \end{cases}$
EN: Solve by elimination: $\begin{cases} 3x + 2y = 16 \\ x - 2y = 0 \end{cases}$
HKA: შეკრებისას $y$ გაქრება.
HEN: Adding eliminates $y$.
SKA: $4x = 16 \Rightarrow x = 4$
$4 - 2y = 0 \Rightarrow y = 2$
SEN: $4x = 16 \Rightarrow x = 4$
$4 - 2y = 0 \Rightarrow y = 2$
AKA: $x = 4,\ y = 2$
AEN: $x = 4,\ y = 2$

--- medium geometry
KA: ორი პარალელური წრფე მესამე წრფით გადაიკვეთა; ერთ-ერთი შესაბამისი კუთხე $72^\circ$-ია. იპოვეთ ყველა რვა კუთხე.
EN: Two parallel lines are cut by a transversal; one of the corresponding angles is $72^\circ$. Find all eight angles.
HKA: შესაბამისი და ვერტიკალური კუთხეები ტოლია, მოსაზღვრე კუთხეები ჯამში $180^\circ$-ს იძლევა.
HEN: Corresponding and vertical angles are equal; adjacent angles add to $180^\circ$.
SKA: ოთხი კუთხე $72^\circ$-ია (შესაბამისი და ვერტიკალური).
დანარჩენი ოთხი — მათი მოსაზღვრე: $180^\circ - 72^\circ = 108^\circ$.
SEN: Four angles are $72^\circ$ (corresponding and vertical).
The other four are adjacent to them: $180^\circ - 72^\circ = 108^\circ$.
AKA: ოთხი $72^\circ$, ოთხი $108^\circ$
AEN: four of $72^\circ$, four of $108^\circ$

--- medium triangles
KA: ტოლფერდა სამკუთხედის ფუძესთან მდებარე კუთხე $50^\circ$-ია. იპოვეთ წვეროსთან მდებარე კუთხე. იპოვეთ პერიმეტრი, თუ ფერდი $9\ \text{სმ}$-ია, ფუძე — $6\ \text{სმ}$.
EN: The base angle of an isosceles triangle is $50^\circ$. Find the apex angle. Find the perimeter if each leg is $9\ \text{cm}$ and the base $6\ \text{cm}$.
HKA: ფუძესთან კუთხეები ტოლია.
HEN: The base angles are equal.
SKA: $180^\circ - 2 \cdot 50^\circ = 80^\circ$
$P = 9 + 9 + 6 = 24\ \text{სმ}$
SEN: $180^\circ - 2 \cdot 50^\circ = 80^\circ$
$P = 9 + 9 + 6 = 24\ \text{cm}$
AKA: $80^\circ$; $24\ \text{სმ}$
AEN: $80^\circ$; $24\ \text{cm}$

--- medium triangles
KA: $ABC$ და $DEF$ სამკუთხედებში $AB = DE$, $AC = DF$ და $\angle A = \angle D$. ტოლია თუ არა სამკუთხედები? თუ $BC = 7\ \text{სმ}$, რას უდრის $EF$?
EN: In triangles $ABC$ and $DEF$, $AB = DE$, $AC = DF$ and $\angle A = \angle D$. Are the triangles congruent? If $BC = 7\ \text{cm}$, what is $EF$?
HKA: სამკუთხედების ტოლობის პირველი ნიშანი: ორი გვერდი და მათ შორის მდებარე კუთხე.
HEN: The first congruence test: two sides and the angle between them (SAS).
SKA: ორი გვერდი და მათ შორის კუთხე ტოლია $\Rightarrow \triangle ABC = \triangle DEF$ (გვერდი–კუთხე–გვერდი).
ტოლ სამკუთხედებში შესაბამისი გვერდები ტოლია: $EF = BC = 7\ \text{სმ}$.
SEN: Two sides and the included angle are equal $\Rightarrow \triangle ABC \cong \triangle DEF$ (SAS).
In congruent triangles corresponding sides are equal: $EF = BC = 7\ \text{cm}$.
AKA: დიახ; $7\ \text{სმ}$
AEN: yes; $7\ \text{cm}$

--- medium polygons
KA: წრის დიამეტრია $10\ \text{სმ}$. იპოვეთ წრეწირის სიგრძე და წრის ფართობი ($\pi \approx 3{,}14$).
EN: A circle has diameter $10\ \text{cm}$. Find the circumference and the area ($\pi \approx 3.14$).
HKA: $C = \pi d$, $S = \pi r^2$.
HEN: $C = \pi d$, $S = \pi r^2$.
SKA: $C = 3{,}14 \cdot 10 = 31{,}4\ \text{სმ}$
$S = 3{,}14 \cdot 5^2 = 78{,}5\ \text{სმ}^2$
SEN: $C = 3.14 \cdot 10 = 31.4\ \text{cm}$
$S = 3.14 \cdot 5^2 = 78.5\ \text{cm}^2$
AKA: $31{,}4\ \text{სმ}$; $78{,}5\ \text{სმ}^2$
AEN: $31.4\ \text{cm}$; $78.5\ \text{cm}^2$

--- medium sequences
KA: იპოვეთ მიმდევრობის $5,\ 8,\ 11,\ 14,\ \dots$ $n$-ური წევრის ფორმულა და $50$-ე წევრი.
EN: Find a formula for the $n$-th term of $5,\ 8,\ 11,\ 14,\ \dots$ and the $50$th term.
HKA: ყოველ ნაბიჯზე $3$ ემატება.
HEN: $3$ is added each step.
SKA: $a_n = 5 + 3(n - 1) = 3n + 2$
$a_{50} = 3 \cdot 50 + 2 = 152$
SEN: $a_n = 5 + 3(n - 1) = 3n + 2$
$a_{50} = 3 \cdot 50 + 2 = 152$
AKA: $a_n = 3n + 2$; $152$
AEN: $a_n = 3n + 2$; $152$

--- medium statistics
KA: იპოვეთ მონაცემების $4,\ 9,\ 2,\ 7,\ 11,\ 6$ მედიანა.
EN: Find the median of $4,\ 9,\ 2,\ 7,\ 11,\ 6$.
HKA: ჯერ დაალაგეთ; ლუწი რაოდენობისას მედიანა ორი შუა რიცხვის საშუალოა.
HEN: Sort first; with an even count the median is the mean of the two middle values.
SKA: დალაგებული: $2, 4, 6, 7, 9, 11$
მედიანა: $\dfrac{6 + 7}{2} = 6{,}5$
SEN: Sorted: $2, 4, 6, 7, 9, 11$
Median: $\dfrac{6 + 7}{2} = 6.5$
AKA: $6{,}5$
AEN: $6.5$

--- medium probability
KA: ორ მონეტას ერთდროულად აგდებენ. რას უდრის ალბათობა, რომ ზუსტად ერთზე მოვა გერბი?
EN: Two coins are tossed together. What is the probability of exactly one head?
HKA: ჩამოწერეთ ყველა შედეგი.
HEN: List all the outcomes.
SKA: შედეგები: გგ, გს, სგ, სს — $4$.
ზუსტად ერთი გერბი: გს, სგ — $2$.
$P = \dfrac{2}{4} = \dfrac{1}{2}$
SEN: Outcomes: HH, HT, TH, TT — $4$.
Exactly one head: HT, TH — $2$.
$P = \dfrac{2}{4} = \dfrac{1}{2}$
AKA: $\dfrac{1}{2}$
AEN: $\dfrac{1}{2}$

--- hard numbers
KA: გამოთვალეთ: $1 - 2 + 3 - 4 + 5 - 6 + \dots + 99 - 100$.
EN: Calculate: $1 - 2 + 3 - 4 + 5 - 6 + \dots + 99 - 100$.
HKA: დააწყვილეთ: $(1 - 2) + (3 - 4) + \dots$
HEN: Pair them: $(1 - 2) + (3 - 4) + \dots$
SKA: ყოველი წყვილი $-1$-ს იძლევა; წყვილი $50$-ია.
$S = 50 \cdot (-1) = -50$
SEN: Each pair gives $-1$; there are $50$ pairs.
$S = 50 \cdot (-1) = -50$
AKA: $-50$
AEN: $-50$

--- hard numbers
KA: რომელი წილადია მეტი: $\dfrac{7}{9}$ თუ $\dfrac{9}{11}$? შეადარეთ საერთო მნიშვნელის გარეშე.
EN: Which is larger: $\dfrac{7}{9}$ or $\dfrac{9}{11}$? Compare without a common denominator.
HKA: „ჯვარედინად“ გამრავლება: $\dfrac{a}{b} < \dfrac{c}{d} \iff ad < bc$ (დადებითი რიცხვებისთვის). ან შეადარეთ, რამდენით აკლია თითოეულს $1$-მდე.
HEN: Cross-multiply: $\dfrac{a}{b} < \dfrac{c}{d} \iff ad < bc$ (for positive numbers). Or compare how far each is from $1$.
SKA: $7 \cdot 11 = 77$, $\ 9 \cdot 9 = 81$; $77 < 81 \Rightarrow \dfrac{7}{9} < \dfrac{9}{11}$.
სხვა ხერხი: $1 - \dfrac{7}{9} = \dfrac{2}{9}$, $1 - \dfrac{9}{11} = \dfrac{2}{11}$; $\dfrac{2}{11} < \dfrac{2}{9}$, ამიტომ $\dfrac{9}{11}$ უფრო ახლოსაა $1$-თან.
SEN: $7 \cdot 11 = 77$, $\ 9 \cdot 9 = 81$; $77 < 81 \Rightarrow \dfrac{7}{9} < \dfrac{9}{11}$.
Another way: $1 - \dfrac{7}{9} = \dfrac{2}{9}$, $1 - \dfrac{9}{11} = \dfrac{2}{11}$; $\dfrac{2}{11} < \dfrac{2}{9}$, so $\dfrac{9}{11}$ is closer to $1$.
AKA: $\dfrac{9}{11}$
AEN: $\dfrac{9}{11}$

--- hard sets
KA: ამოხსენით განტოლება: $|x + 1| = 2x - 4$.
EN: Solve: $|x + 1| = 2x - 4$.
HKA: მოდული არაუარყოფითია, ამიტომ მარჯვენა მხარეც $\ge 0$ უნდა იყოს. შეამოწმეთ ფესვები!
HEN: An absolute value is non-negative, so the right side must be $\ge 0$ too. Check the roots!
SKA: $x + 1 = 2x - 4 \Rightarrow x = 5$; $\ 2 \cdot 5 - 4 = 6 \ge 0$ ✓
$x + 1 = -(2x - 4) \Rightarrow 3x = 3 \Rightarrow x = 1$; $\ 2 \cdot 1 - 4 = -2 < 0$ — არ გამოდგება.
ამონახსნი: $x = 5$ (შემოწმება: $|6| = 6$ ✓)
SEN: $x + 1 = 2x - 4 \Rightarrow x = 5$; $\ 2 \cdot 5 - 4 = 6 \ge 0$ ✓
$x + 1 = -(2x - 4) \Rightarrow 3x = 3 \Rightarrow x = 1$; $\ 2 \cdot 1 - 4 = -2 < 0$ — rejected.
Solution: $x = 5$ (check: $|6| = 6$ ✓)
AKA: $x = 5$
AEN: $x = 5$

--- hard numeration
KA: რომელ პოზიციურ სისტემაში წერია ათობითი $13$ როგორც $23$?
EN: In which place-value base is decimal $13$ written as $23$?
HKA: $b$-ფუძიან სისტემაში $23_b = 2b + 3$.
HEN: In base $b$, $23_b = 2b + 3$.
SKA: $2b + 3 = 13 \Rightarrow b = 5$
შემოწმება: $23_5 = 2 \cdot 5 + 3 = 13$ ✓ (ციფრი $3 < 5$ — დასაშვებია)
SEN: $2b + 3 = 13 \Rightarrow b = 5$
Check: $23_5 = 2 \cdot 5 + 3 = 13$ ✓ (the digit $3 < 5$ is allowed)
AKA: ხუთობითში
AEN: base $5$

--- hard ratio
KA: ავტომობილი მანძილს $80\ \text{კმ/სთ}$ სიჩქარით $3$ საათში გადის. რა სიჩქარით უნდა იმოძრაოს, რომ იგივე მანძილი $2{,}5$ საათში გაიაროს?
EN: A car covers a distance in $3$ hours at $80\ \text{km/h}$. How fast must it go to cover it in $2.5$ hours?
HKA: მუდმივი მანძილისას სიჩქარე და დრო უკუპროპორციულია.
HEN: For a fixed distance, speed and time are inversely proportional.
SKA: მანძილი: $80 \cdot 3 = 240\ \text{კმ}$
$v = \dfrac{240}{2{,}5} = 96\ \text{კმ/სთ}$
SEN: Distance: $80 \cdot 3 = 240\ \text{km}$
$v = \dfrac{240}{2.5} = 96\ \text{km/h}$
AKA: $96\ \text{კმ/სთ}$
AEN: $96\ \text{km/h}$

--- hard percent
KA: საქონელს ჯერ $10\%$-იანი, შემდეგ კიდევ $20\%$-იანი ფასდაკლება გაუკეთეს. რა ერთჯერადი ფასდაკლების ტოლფასია ეს? რატომ არა $30\%$-ის?
EN: An item is discounted $10\%$ and then a further $20\%$. What single discount is this equal to? Why not $30\%$?
HKA: ფასდაკლებები მრავლდება: $0{,}9 \cdot 0{,}8$.
HEN: The discounts multiply: $0.9 \cdot 0.8$.
SKA: $0{,}9 \cdot 0{,}8 = 0{,}72$ — ფასის $72\%$ დარჩა.
ერთჯერადი ფასდაკლება: $100\% - 72\% = 28\%$.
მეორე $20\%$ უკვე შემცირებულ ფასზე ითვლება, ამიტომ ჯამი $30\%$-ზე ნაკლებია.
SEN: $0.9 \cdot 0.8 = 0.72$ — $72\%$ of the price remains.
Single discount: $100\% - 72\% = 28\%$.
The second $20\%$ is taken off the already reduced price, so the total is less than $30\%$.
AKA: $28\%$
AEN: $28\%$

--- hard percent
KA: ქალაქის მოსახლეობა $50\,000$ კაცია და ყოველწლიურად $10\%$-ით იზრდება. რამდენი იქნება მოსახლეობა $2$ წლის შემდეგ?
EN: A town has $50\,000$ people and grows $10\%$ each year. What will the population be in $2$ years?
HKA: ყოველ წელს რიცხვი $1{,}1$-ზე მრავლდება.
HEN: Each year the number is multiplied by $1.1$.
SKA: $1$ წლის შემდეგ: $50\,000 \cdot 1{,}1 = 55\,000$
$2$ წლის შემდეგ: $55\,000 \cdot 1{,}1 = 60\,500$ (და არა $60\,000$!)
SEN: After $1$ year: $50\,000 \cdot 1.1 = 55\,000$
After $2$ years: $55\,000 \cdot 1.1 = 60\,500$ (not $60\,000$!)
AKA: $60\,500$
AEN: $60\,500$

--- hard equations
KA: დედა $31$ წლისაა, ქალიშვილი — $7$-ის. რამდენი წლის შემდეგ იქნება დედა ქალიშვილზე $3$-ჯერ უფროსი?
EN: A mother is $31$ and her daughter is $7$. In how many years will the mother be $3$ times as old as the daughter?
HKA: $x$ წლის შემდეგ ორივეს ასაკი $x$-ით გაიზრდება.
HEN: In $x$ years both ages grow by $x$.
SKA: $31 + x = 3(7 + x) \Rightarrow 31 + x = 21 + 3x \Rightarrow 2x = 10 \Rightarrow x = 5$
შემოწმება: $36 = 3 \cdot 12$ ✓
SEN: $31 + x = 3(7 + x) \Rightarrow 31 + x = 21 + 3x \Rightarrow 2x = 10 \Rightarrow x = 5$
Check: $36 = 3 \cdot 12$ ✓
AKA: $5$ წლის შემდეგ
AEN: in $5$ years

--- hard equations
KA: A სოფლიდან ველოსიპედისტი $12\ \text{კმ/სთ}$ სიჩქარით გავიდა. $2$ საათის შემდეგ იმავე გზით მოტოციკლისტი გაემართა $36\ \text{კმ/სთ}$ სიჩქარით. რა დროში და A-დან რა მანძილზე დაეწევა მოტოციკლისტი ველოსიპედისტს?
EN: A cyclist leaves village A at $12\ \text{km/h}$. $2$ hours later a motorcyclist follows on the same road at $36\ \text{km/h}$. How long until the motorcyclist catches up, and how far from A?
HKA: დაწევისას გავლილი მანძილები ტოლია; ველოსიპედისტი $2$ საათით მეტ ხანს მოძრაობს.
HEN: At catch-up the distances are equal; the cyclist has been riding $2$ hours longer.
SKA: $36x = 12(x + 2) \Rightarrow 24x = 24 \Rightarrow x = 1$ საათი
მანძილი: $36 \cdot 1 = 36\ \text{კმ}$
SEN: $36x = 12(x + 2) \Rightarrow 24x = 24 \Rightarrow x = 1$ hour
Distance: $36 \cdot 1 = 36\ \text{km}$
AKA: $1$ საათში; $36\ \text{კმ}$-ზე
AEN: after $1$ hour; $36\ \text{km}$ from A

--- hard inequalities
KA: მართკუთხედის ერთი გვერდი $x\ \text{სმ}$-ია, მეორე მასზე $3\ \text{სმ}$-ით გრძელია. პერიმეტრი $30\ \text{სმ}$-ზე ნაკლებია. რა მნიშვნელობები შეიძლება ჰქონდეს $x$-ს?
EN: One side of a rectangle is $x\ \text{cm}$ and the other is $3\ \text{cm}$ longer. The perimeter is less than $30\ \text{cm}$. What values can $x$ take?
HKA: გვერდი დადებითი უნდა იყოს.
HEN: A side must be positive.
SKA: $2(x + x + 3) < 30 \Rightarrow 4x + 6 < 30 \Rightarrow x < 6$
გვერდი დადებითია: $0 < x < 6$
SEN: $2(x + x + 3) < 30 \Rightarrow 4x + 6 < 30 \Rightarrow x < 6$
A side is positive: $0 < x < 6$
AKA: $0 < x < 6$
AEN: $0 < x < 6$

--- hard systems
KA: ორნიშნა რიცხვის ციფრების ჯამი $9$-ია. თუ ციფრებს ადგილებს შევუცვლით, მიიღება $27$-ით მეტი რიცხვი. იპოვეთ რიცხვი.
EN: The digits of a two-digit number add up to $9$. Swapping the digits gives a number $27$ larger. Find the number.
HKA: რიცხვი $10a + b$, შებრუნებული — $10b + a$.
HEN: The number is $10a + b$, reversed $10b + a$.
SKA: $\begin{cases} a + b = 9 \\ (10b + a) - (10a + b) = 27 \end{cases} \Rightarrow \begin{cases} a + b = 9 \\ b - a = 3 \end{cases}$
$2b = 12 \Rightarrow b = 6$, $a = 3$ — რიცხვია $36$ (შემოწმება: $63 - 36 = 27$ ✓)
SEN: $\begin{cases} a + b = 9 \\ (10b + a) - (10a + b) = 27 \end{cases} \Rightarrow \begin{cases} a + b = 9 \\ b - a = 3 \end{cases}$
$2b = 12 \Rightarrow b = 6$, $a = 3$ — the number is $36$ (check: $63 - 36 = 27$ ✓)
AKA: $36$
AEN: $36$

--- hard geometry
KA: სამი წრფე ერთ წერტილში იკვეთება და ექვს კუთხეს ქმნის. ორი მეზობელი კუთხეა $40^\circ$ და $70^\circ$. იპოვეთ ყველა ექვსი კუთხე.
EN: Three lines meet at a point, forming six angles. Two neighbouring angles are $40^\circ$ and $70^\circ$. Find all six angles.
HKA: სამი მეზობელი კუთხე ერთად გაშლილ კუთხეს ($180^\circ$) ქმნის; ვერტიკალური კუთხეები ტოლია.
HEN: Three neighbouring angles together form a straight angle ($180^\circ$); vertical angles are equal.
SKA: მესამე მეზობელი: $180^\circ - 40^\circ - 70^\circ = 70^\circ$.
დანარჩენი სამი — ვერტიკალურები: $40^\circ, 70^\circ, 70^\circ$.
ექვსივე: $40^\circ, 70^\circ, 70^\circ, 40^\circ, 70^\circ, 70^\circ$ (ჯამი $360^\circ$ ✓)
SEN: The third neighbour: $180^\circ - 40^\circ - 70^\circ = 70^\circ$.
The other three are vertical to these: $40^\circ, 70^\circ, 70^\circ$.
All six: $40^\circ, 70^\circ, 70^\circ, 40^\circ, 70^\circ, 70^\circ$ (sum $360^\circ$ ✓)
AKA: $40^\circ, 70^\circ, 70^\circ$ (ორჯერ)
AEN: $40^\circ, 70^\circ, 70^\circ$ (twice)

--- hard triangles
KA: დაამტკიცეთ, რომ სამკუთხედის გარე კუთხეების ჯამი (თითო თითოეულ წვეროსთან) $360^\circ$-ია.
EN: Prove that the exterior angles of a triangle (one at each vertex) add up to $360^\circ$.
HKA: თითოეული გარე კუთხე $180^\circ$ − შიგა კუთხეა.
HEN: Each exterior angle is $180^\circ$ − the interior angle.
SKA: გარე კუთხეები: $180^\circ - A$, $180^\circ - B$, $180^\circ - C$.
ჯამი: $540^\circ - (A + B + C) = 540^\circ - 180^\circ = 360^\circ$ ∎
SEN: The exterior angles are $180^\circ - A$, $180^\circ - B$, $180^\circ - C$.
Sum: $540^\circ - (A + B + C) = 540^\circ - 180^\circ = 360^\circ$ ∎
AKA: $360^\circ$ (დამტკიცებულია)
AEN: $360^\circ$ (proved)

--- hard triangles
KA: მართკუთხა სამკუთხედის ერთი მახვილი კუთხე $30^\circ$-ია, ჰიპოტენუზა — $12\ \text{სმ}$. იპოვეთ $30^\circ$-ის მოპირდაპირე კათეტი და ჰიპოტენუზაზე გავლებული მედიანა.
EN: A right triangle has a $30^\circ$ angle and a hypotenuse of $12\ \text{cm}$. Find the leg opposite the $30^\circ$ angle and the median to the hypotenuse.
HKA: $30^\circ$-ის მოპირდაპირე კათეტი ჰიპოტენუზის ნახევარია. ჰიპოტენუზაზე მედიანა ასევე ჰიპოტენუზის ნახევარია.
HEN: The leg opposite $30^\circ$ is half the hypotenuse. The median to the hypotenuse is also half the hypotenuse.
SKA: კათეტი: $\dfrac{12}{2} = 6\ \text{სმ}$
მედიანა: $\dfrac{12}{2} = 6\ \text{სმ}$ (ჰიპოტენუზის შუაწერტილი სამივე წვეროდან თანაბრადაა დაშორებული)
SEN: Leg: $\dfrac{12}{2} = 6\ \text{cm}$
Median: $\dfrac{12}{2} = 6\ \text{cm}$ (the midpoint of the hypotenuse is equally far from all three vertices)
AKA: $6\ \text{სმ}$; $6\ \text{სმ}$
AEN: $6\ \text{cm}$; $6\ \text{cm}$

--- hard graphs
KA: ტურისტის მოძრაობის გრაფიკის მიხედვით: პირველ $30$ წუთში მან $2\ \text{კმ}$ გაიარა, შემდეგ $15$ წუთი ისვენა, ბოლოს $45$ წუთში $3\ \text{კმ}$ გაიარა. რომელ მონაკვეთზე მოძრაობდა ის უფრო სწრაფად? იპოვეთ საშუალო სიჩქარე მთელ გზაზე.
EN: From a hiker's distance–time graph: in the first $30$ minutes they walked $2\ \text{km}$, then rested $15$ minutes, then walked $3\ \text{km}$ in $45$ minutes. On which part were they faster? Find the average speed for the whole trip.
HKA: სიჩქარე = მანძილი : დროზე (გრაფიკის დახრილობა). დასვენება საშუალოში შედის.
HEN: Speed = distance ÷ time (the slope of the graph). The rest counts in the average.
SKA: I მონაკვეთი: $\dfrac{2}{0{,}5} = 4\ \text{კმ/სთ}$; III მონაკვეთი: $\dfrac{3}{0{,}75} = 4\ \text{კმ/სთ}$ — ერთნაირი სიჩქარე!
საშუალო: $\dfrac{5\ \text{კმ}}{1{,}5\ \text{სთ}} \approx 3{,}3\ \text{კმ/სთ}$
SEN: Part I: $\dfrac{2}{0.5} = 4\ \text{km/h}$; part III: $\dfrac{3}{0.75} = 4\ \text{km/h}$ — the same speed!
Average: $\dfrac{5\ \text{km}}{1.5\ \text{h}} \approx 3.3\ \text{km/h}$
AKA: ერთნაირად ($4\ \text{კმ/სთ}$); $\approx 3{,}3\ \text{კმ/სთ}$
AEN: the same ($4\ \text{km/h}$); $\approx 3.3\ \text{km/h}$

--- hard probability
KA: ორ კამათელს აგდებენ. რას უდრის ალბათობა, რომ: ა) ორივეზე ლუწი რიცხვი მოვა; ბ) ქულათა ჯამი $10$-ზე ნაკლები არ იქნება?
EN: Two dice are rolled. What is the probability that: a) both show even numbers; b) the total is at least $10$?
HKA: სულ $36$ თანაბრად შესაძლო შედეგია.
HEN: There are $36$ equally likely outcomes.
SKA: ა) $3 \cdot 3 = 9$ შედეგი: $P = \dfrac{9}{36} = \dfrac{1}{4}$
ბ) ჯამი $10$: $(4;6),(5;5),(6;4)$; $11$: $(5;6),(6;5)$; $12$: $(6;6)$ — სულ $6$: $P = \dfrac{6}{36} = \dfrac{1}{6}$
SEN: a) $3 \cdot 3 = 9$ outcomes: $P = \dfrac{9}{36} = \dfrac{1}{4}$
b) Total $10$: $(4,6),(5,5),(6,4)$; $11$: $(5,6),(6,5)$; $12$: $(6,6)$ — $6$ in all: $P = \dfrac{6}{36} = \dfrac{1}{6}$
AKA: ა) $\dfrac{1}{4}$; ბ) $\dfrac{1}{6}$
AEN: a) $\dfrac{1}{4}$; b) $\dfrac{1}{6}$

--- hard numbers olympiad
KA: რამდენი ნულით ბოლოვდება რიცხვი $25! = 1 \cdot 2 \cdot 3 \cdot \ldots \cdot 25$?
EN: How many zeros does $25! = 1 \cdot 2 \cdot 3 \cdot \ldots \cdot 25$ end with?
HKA: ყოველი ბოლო ნული $10 = 2 \cdot 5$-ს შეესაბამება. ორიანი ბევრია — დაითვალეთ ხუთიანები.
HEN: Each trailing zero comes from $10 = 2 \cdot 5$. Twos are plentiful — count the fives.
SKA: $5$-ის ჯერადები $25$-მდე: $5, 10, 15, 20, 25$ — $5$ ცალი.
$25 = 5 \cdot 5$ — ერთი დამატებითი ხუთიანი.
სულ $6$ ხუთიანი $\Rightarrow$ $6$ ნული.
SEN: Multiples of $5$ up to $25$: $5, 10, 15, 20, 25$ — $5$ of them.
$25 = 5 \cdot 5$ gives one extra five.
$6$ fives in all $\Rightarrow$ $6$ zeros.
AKA: $6$
AEN: $6$

--- hard numbers olympiad
KA: იპოვეთ უმცირესი ნატურალური რიცხვი, რომლის ციფრთა ჯამი $25$-ია.
EN: Find the smallest natural number whose digits add up to $25$.
HKA: რაც ნაკლებია ციფრების რიცხვი, მით პატარაა რიცხვი. ციფრი მაქსიმუმ $9$-ია.
HEN: The fewer digits, the smaller the number. A digit is at most $9$.
SKA: ორი ციფრით მაქსიმუმ $9 + 9 = 18 < 25$ — საჭიროა $3$ ციფრი.
სამნიშნა რიცხვი უმცირესია, როცა პირველი ციფრი უმცირესია: დანარჩენი ორი მაქსიმუმ $18$-ს იძლევა, ამიტომ პირველი $\ge 25 - 18 = 7$.
პასუხი: $799$ ($7 + 9 + 9 = 25$).
SEN: Two digits give at most $9 + 9 = 18 < 25$ — we need $3$ digits.
A three-digit number is smallest when its first digit is smallest: the other two give at most $18$, so the first is $\ge 25 - 18 = 7$.
Answer: $799$ ($7 + 9 + 9 = 25$).
AKA: $799$
AEN: $799$

--- hard polygons olympiad
KA: ხუთქიმიანი ვარსკვლავი (წესიერი ან ნებისმიერი) ხუთი წრფის მონაკვეთით არის აგებული. იპოვეთ ვარსკვლავის ხუთი „წვეროს“ კუთხეების ჯამი.
EN: A five-pointed star (regular or not) is drawn with five line segments. Find the sum of the angles at its five points.
HKA: განიხილეთ ვარსკვლავის შიგნით მდებარე ხუთკუთხედი და მის გვერდებზე მიდგმული სამკუთხედები. ან გამოიყენეთ გარე კუთხის თვისება.
HEN: Look at the pentagon inside the star and the triangles on its sides. Or use the exterior angle property.
SKA: ვთქვათ, წვეროებია $A, B, C, D, E$. სამკუთხედის გარე კუთხე ორი არამოსაზღვრე შიგა კუთხის ჯამია — ამით ორი წვეროს კუთხე „გადაიტანება“ ერთ სამკუთხედში, რომელშიც მესამე წვეროს კუთხეცაა.
მაგალითად, $\angle A + \angle C$ ტოლია ერთ-ერთი გარე კუთხისა, $\angle B + \angle D$ — მეორისა; ეს ორი გარე კუთხე და $\angle E$ ერთ სამკუთხედს ქმნის.
ჯამი: $\angle A + \angle B + \angle C + \angle D + \angle E = 180^\circ$.
შემოწმება წესიერისთვის: თითოეული წვერო $36^\circ$-ია, $5 \cdot 36^\circ = 180^\circ$ ✓
SEN: Call the points $A, B, C, D, E$. An exterior angle of a triangle equals the sum of the two non-adjacent interior angles — this lets us "move" two point angles into one triangle that also contains a third point.
For example, $\angle A + \angle C$ equals one exterior angle and $\angle B + \angle D$ another; these two together with $\angle E$ form one triangle.
Sum: $\angle A + \angle B + \angle C + \angle D + \angle E = 180^\circ$.
Check for a regular star: each point is $36^\circ$, $5 \cdot 36^\circ = 180^\circ$ ✓
AKA: $180^\circ$
AEN: $180^\circ$

--- hard probability olympiad
KA: შეხვედრაზე $8$ ადამიანი მოვიდა და თითოეულმა დანარჩენებს ხელი ჩამოართვა. სულ რამდენი ხელის ჩამორთმევა მოხდა? რამდენი ადამიანი უნდა იყოს, რომ ხელის ჩამორთმევა $45$ იყოს?
EN: $8$ people meet and each shakes hands with all the others. How many handshakes are there in total? How many people give $45$ handshakes?
HKA: თითოეული $7$-ს ართმევს ხელს, მაგრამ ყოველი ჩამორთმევა ორჯერ ითვლება.
HEN: Each shakes $7$ hands, but every handshake is counted twice.
SKA: $\dfrac{8 \cdot 7}{2} = 28$
ზოგადად $\dfrac{n(n - 1)}{2} = 45 \Rightarrow n(n - 1) = 90 \Rightarrow n = 10$ (რადგან $10 \cdot 9 = 90$)
SEN: $\dfrac{8 \cdot 7}{2} = 28$
In general $\dfrac{n(n - 1)}{2} = 45 \Rightarrow n(n - 1) = 90 \Rightarrow n = 10$ (since $10 \cdot 9 = 90$)
AKA: $28$; $10$ ადამიანი
AEN: $28$; $10$ people

--- hard algebra olympiad
KA: „ჩაიფიქრე რიცხვი, დაუმატე $7$, გაამრავლე $2$-ზე, გამოაკელი $4$, გაყავი $2$-ზე და გამოაკელი ჩაფიქრებული რიცხვი.“ დაამტკიცეთ, რომ შედეგი ყოველთვის $5$-ია.
EN: "Think of a number, add $7$, multiply by $2$, subtract $4$, divide by $2$ and subtract the number you first thought of." Prove the result is always $5$.
HKA: აღნიშნეთ ჩაფიქრებული რიცხვი $x$-ით და შეასრულეთ ყველა მოქმედება ალგებრულად.
HEN: Call the number $x$ and do every step algebraically.
SKA: $x \to x + 7 \to 2(x + 7) = 2x + 14 \to 2x + 10 \to \dfrac{2x + 10}{2} = x + 5 \to (x + 5) - x = 5$ ∎
ალგებრა გვიჩვენებს, რომ „ხრიკი“ ნებისმიერი რიცხვისთვის მუშაობს.
SEN: $x \to x + 7 \to 2(x + 7) = 2x + 14 \to 2x + 10 \to \dfrac{2x + 10}{2} = x + 5 \to (x + 5) - x = 5$ ∎
Algebra shows the "trick" works for any number.
AKA: ყოველთვის $5$ (დამტკიცებულია)
AEN: always $5$ (proved)

KA: წილადი $\dfrac{a}{b}$-ს მრიცხველს და მნიშვნელს $3$ დაუმატეს და მიიღეს $\dfrac{1}{2}$; ორივეს $2$ რომ გამოეკლოთ, მიიღებდნენ $\dfrac{1}{7}$. იპოვეთ წილადი.

--- hard numbers
KA: დაამტკიცეთ, რომ სამი მიმდევრობითი ნატურალური რიცხვის ნამრავლი $6$-ზე იყოფა.
EN: Prove that the product of three consecutive natural numbers is divisible by $6$.
HKA: მათ შორის ერთი ლუწია და ერთი $3$-ის ჯერადი.
HEN: Among them one is even and one is a multiple of $3$.
SKA: სამ მიმდევრობით რიცხვში ერთი მაინც ლუწია ($2$-ზე იყოფა) და ზუსტად ერთი $3$-ის ჯერადია. $2$ და $3$ ურთიერთმარტივია, ამიტომ ნამრავლი $6$-ზე იყოფა.
SEN: Among three consecutive numbers at least one is even (divisible by $2$) and exactly one is a multiple of $3$. Since $2$ and $3$ are coprime, the product is divisible by $6$.
AKA: ერთი ლუწია, ერთი $3$-ის ჯერადი
AEN: one is even, one is a multiple of 3

--- hard numbers olympiad
KA: დაამტკიცეთ, რომ $n^3 - n$ ნებისმიერი ნატურალური $n$-ისთვის $6$-ზე იყოფა.
EN: Prove that $n^3 - n$ is divisible by $6$ for every natural $n$.
HKA: $n^3 - n = (n - 1)n(n + 1)$.
HEN: $n^3 - n = (n - 1)n(n + 1)$.
SKA: $n^3 - n = (n - 1) \cdot n \cdot (n + 1)$ — სამი მიმდევრობითი რიცხვის ნამრავლია, რომელიც $6$-ზე იყოფა (ერთი ლუწია, ერთი $3$-ის ჯერადი).
SEN: $n^3 - n = (n - 1) \cdot n \cdot (n + 1)$ — the product of three consecutive numbers, which is divisible by $6$ (one is even, one a multiple of $3$).
AKA: სამი მიმდევრობითი რიცხვის ნამრავლია
AEN: it's a product of three consecutive numbers

--- hard numbers olympiad
KA: რიცხვი $\overline{abc}$-ის ციფრები გადააწყვეს და მიიღეს $\overline{cba}$. დაამტკიცეთ, რომ სხვაობა $\overline{abc} - \overline{cba}$ $99$-ზე იყოფა.
EN: Reversing the digits of $\overline{abc}$ gives $\overline{cba}$. Prove that $\overline{abc} - \overline{cba}$ is divisible by $99$.
HKA: $\overline{abc} = 100a + 10b + c$.
HEN: $\overline{abc} = 100a + 10b + c$.
SKA: $(100a + 10b + c) - (100c + 10b + a) = 99a - 99c = 99(a - c)$
SEN: $(100a + 10b + c) - (100c + 10b + a) = 99a - 99c = 99(a - c)$
AKA: $99(a - c)$
AEN: $99(a - c)$

--- hard numbers olympiad
KA: დაფაზე წერია რიცხვები $1, 2, 3, \dots, 10$. ყოველ სვლაზე ორ რიცხვს შლიან და მათ სხვაობას წერენ. ბოლოს ერთი რიცხვი რჩება. შეიძლება თუ არა, რომ ის $0$ იყოს?
EN: The numbers $1, 2, 3, \dots, 10$ are on a board. Each move erases two numbers and writes their difference. In the end one number remains. Can it be $0$?
HKA: ჯამის ლუწობა არ იცვლება.
HEN: The parity of the sum never changes.
SKA: $a + b$ და $a - b$ ერთი ლუწობისაა, ამიტომ ყველა რიცხვის ჯამის ლუწობა არ იცვლება.
საწყისი ჯამი $55$ — კენტი. ბოლო რიცხვი კენტია, $0$ ვერ იქნება.
SEN: $a + b$ and $a - b$ have the same parity, so the parity of the total sum never changes.
It starts at $55$ — odd. The last number is odd, so it can't be $0$.
AKA: არა
AEN: no

--- hard numbers olympiad
KA: იპოვეთ ყველა ნატურალური $n$, რომლისთვისაც $\dfrac{n + 7}{n + 1}$ მთელი რიცხვია.
EN: Find all natural $n$ for which $\dfrac{n + 7}{n + 1}$ is an integer.
HKA: $\dfrac{n + 7}{n + 1} = 1 + \dfrac{6}{n + 1}$.
HEN: $\dfrac{n + 7}{n + 1} = 1 + \dfrac{6}{n + 1}$.
SKA: $n + 1$ უნდა იყოს $6$-ის გამყოფი $\ge 2$: $2, 3, 6$ $\Rightarrow n = 1, 2, 5$.
SEN: $n + 1$ must divide $6$ and be $\ge 2$: $2, 3, 6$ $\Rightarrow n = 1, 2, 5$.
AKA: $n = 1, 2, 5$
AEN: $n = 1, 2, 5$

--- hard numbers olympiad
KA: შეიძლება თუ არა ნატურალური რიცხვის ციფრთა ჯამი $2025$ იყოს, ხოლო თავად რიცხვი სრული კვადრატი?
EN: Can a perfect square have digit sum $2025$?
HKA: კვადრატის ნაშთი $9$-ზე გაყოფისას: $0, 1, 4, 7$.
HEN: Squares leave remainder $0, 1, 4$ or $7$ when divided by $9$.
SKA: ციფრთა ჯამი $2025$ $9$-ზე იყოფა, ე.ი. რიცხვი $9$-ის ჯერადია — ნაშთი $0$, რაც კვადრატისთვის დასაშვებია.
მაგალითი: $(10^{225} - 1)^2$-ის მაგვარი რიცხვების მოძებნა შეიძლება; მაგ. $\underbrace{99\dots9}_{225}{}^2 = \underbrace{99\dots9}_{224}8\underbrace{00\dots0}_{224}1$, ციფრთა ჯამი $9 \cdot 224 + 8 + 1 = 2025$ ✓. შეიძლება.
SEN: A digit sum of $2025$ is divisible by $9$, so the number is a multiple of $9$ — remainder $0$, which squares allow.
Example: $\underbrace{99\dots9}_{225}{}^2 = \underbrace{99\dots9}_{224}8\underbrace{00\dots0}_{224}1$, with digit sum $9 \cdot 224 + 8 + 1 = 2025$ ✓. Yes, it can.
AKA: კი
AEN: yes

EN: Convert to decimal: $110_2$; $1111_2$; $10000_2$.
HKA: ორის ხარისხები: $1, 2, 4, 8, 16$.
HEN: Powers of two: $1, 2, 4, 8, 16$.
SKA: $110_2 = 4 + 2 = 6$; $\ 1111_2 = 8 + 4 + 2 + 1 = 15$; $\ 10000_2 = 16$
SEN: $110_2 = 4 + 2 = 6$; $\ 1111_2 = 8 + 4 + 2 + 1 = 15$; $\ 10000_2 = 16$
AKA: $6$; $15$; $16$
AEN: $6$; $15$; $16$

--- easy numeration
KA: რა მნიშვნელობა აქვს ციფრ $7$-ს რიცხვში $47\,382$? ჩაწერეთ რიცხვი თანრიგების ჯამად.
EN: What is the value of the digit $7$ in $47\,382$? Write the number as a sum of place values.
HKA: ათასეულების თანრიგი.
HEN: The thousands place.
SKA: $7$ ნიშნავს $7000$-ს.
$47\,382 = 4 \cdot 10\,000 + 7 \cdot 1000 + 3 \cdot 100 + 8 \cdot 10 + 2$
SEN: The $7$ means $7000$.
$47\,382 = 4 \cdot 10\,000 + 7 \cdot 1000 + 3 \cdot 100 + 8 \cdot 10 + 2$
AKA: $7000$
AEN: $7000$

--- easy numeration
KA: ჩაწერეთ ორობით სისტემაში: $9$; $20$.
EN: Write in binary: $9$; $20$.
HKA: დაშალეთ ორის ხარისხებად.
HEN: Split into powers of two.
SKA: $9 = 8 + 1 = 1001_2$; $\ 20 = 16 + 4 = 10100_2$
SEN: $9 = 8 + 1 = 1001_2$; $\ 20 = 16 + 4 = 10100_2$
AKA: $1001_2$; $10100_2$
AEN: $1001_2$; $10100_2$

--- easy numeration
KA: რატომ ჰქვია ჩვენს სისტემას „პოზიციური“? რომაული სისტემა პოზიციურია?
EN: Why is our number system called "positional"? Is the Roman system positional?
HKA: ციფრის მნიშვნელობა ადგილზეა დამოკიდებული?
HEN: Does a digit's value depend on its place?
SKA: ჩვენს სისტემაში ციფრის მნიშვნელობა მის ადგილზეა დამოკიდებული ($5$ ერთეულებში $5$-ია, ათეულებში $50$).
რომაულში $\text{X}$ ყოველთვის $10$-ია — სისტემა არაპოზიციურია.
SEN: In our system a digit's value depends on its position ($5$ in the units place is $5$, in the tens place $50$).
In Roman numerals $\text{X}$ is always $10$ — the system isn't positional.
AKA: ციფრის მნიშვნელობა ადგილზეა დამოკიდებული; არა
AEN: a digit's value depends on its place; no

--- medium numeration
KA: გამოთვალეთ ორობით სისტემაში: $1011_2 + 110_2$. შეამოწმეთ ათობითში.
EN: Add in binary: $1011_2 + 110_2$. Check in decimal.
HKA: $1 + 1 = 10_2$.
HEN: $1 + 1 = 10_2$.
SKA: $1011_2 + 110_2 = 10001_2$

SEN: $1011_2 + 110_2 = 10001_2$
Check: $11 + 6 = 17 = 16 + 1 = 10001_2$ ✓
AKA: $10001_2 = 17$
AEN: $10001_2 = 17$

HKA: $5$-ის ხარისხები: $25, 5, 1$.

--- medium numeration
KA: ძველ ქართულ ნუმერაციაში ი $= 10$, კ $= 20$, ლ $= 30$, ა $= 1$, ბ $= 2$, ე $= 5$. რომელი რიცხვია „კე“? „ლბ“? ჩაწერეთ $15$.
EN: In old Georgian numerals ი $= 10$, კ $= 20$, ლ $= 30$, ა $= 1$, ბ $= 2$, ე $= 5$. Which numbers are „კე“ and „ლბ“? Write $15$.
HKA: ასოების მნიშვნელობები იკრიბება.
HEN: The letter values add.
SKA: კე $= 20 + 5 = 25$; $\ $ლბ $= 30 + 2 = 32$; $\ 15 = $ იე
SEN: კე $= 20 + 5 = 25$; $\ $ლბ $= 30 + 2 = 32$; $\ 15 = $ იე
AKA: $25$; $32$; იე
AEN: $25$; $32$; იე

--- medium numeration
KA: რამდენი ციფრია საჭირო $1$-დან $100$-მდე ყველა რიცხვის დასაწერად?
EN: How many digits are needed to write all the numbers from $1$ to $100$?
HKA: ერთნიშნა, ორნიშნა, სამნიშნა ცალ-ცალკე.
HEN: Count one-, two- and three-digit numbers separately.
SKA: $9 \cdot 1 + 90 \cdot 2 + 1 \cdot 3 = 9 + 180 + 3 = 192$
SEN: $9 \cdot 1 + 90 \cdot 2 + 1 \cdot 3 = 9 + 180 + 3 = 192$
AKA: $192$
AEN: $192$

--- hard numeration
KA: რომელ სისტემაშია $121_b = 49$?
EN: In which base $b$ is $121_b = 49$?
HKA: $b^2 + 2b + 1 = (b + 1)^2$.
HEN: $b^2 + 2b + 1 = (b + 1)^2$.
SKA: $(b + 1)^2 = 49 \Rightarrow b = 6$
SEN: $(b + 1)^2 = 49 \Rightarrow b = 6$
AKA: $b = 6$
AEN: $b = 6$

--- hard numeration
KA: ორობით სისტემაში რამდენი ციფრი აქვს $1000$-ს? იპოვეთ ჩანაწერი.
EN: How many binary digits does $1000$ have? Find the binary form.
HKA: $2^9 = 512 \le 1000 < 1024 = 2^{10}$.
HEN: $2^9 = 512 \le 1000 < 1024 = 2^{10}$.
SKA: $10$ ციფრი.
$1000 = 512 + 256 + 128 + 64 + 32 + 8 = 1111101000_2$
SEN: $10$ digits.
$1000 = 512 + 256 + 128 + 64 + 32 + 8 = 1111101000_2$
AKA: $10$; $1111101000_2$
AEN: $10$; $1111101000_2$

--- hard numeration
KA: რომაული ციფრებით ასანთის ღეროებით დაწერილია $\text{VI} - \text{IV} = \text{IX}$. გადაიტანეთ ერთი ღერო, რომ ტოლობა სწორი იყოს.
EN: Matchstick Roman numerals show $\text{VI} - \text{IV} = \text{IX}$. Move one match to make it true.
HKA: სცადეთ $\text{IX} \to \text{XI}$ ან ნიშნის შეცვლა.
HEN: Try changing a numeral or the sign.
SKA: $\text{IX}$-დან ავიღოთ $\text{I}$-ის ღერო და მინუსი პლიუსად ვაქციოთ: $\text{VI} + \text{IV} = \text{X}$ ✓ ($6 + 4 = 10$).
SEN: Take the stick that makes $\text{IX}$'s $\text{I}$ and use it to turn the minus into a plus: $\text{VI} + \text{IV} = \text{X}$ ✓ ($6 + 4 = 10$).
AKA: $\text{VI} + \text{IV} = \text{X}$
AEN: $\text{VI} + \text{IV} = \text{X}$

--- hard numeration
KA: როგორ გამოვიცნოთ $1$-დან $15$-მდე ჩაფიქრებული რიცხვი ოთხი კითხვით („ამ ბარათზეა?“), თუ ოთხ ბარათზე რიცხვები ორობითი ჩანაწერის მიხედვითაა განაწილებული?
EN: How can you guess a number from $1$ to $15$ with four yes/no questions ("Is it on this card?") using four cards built from binary digits?
HKA: $k$-ე ბარათზე ის რიცხვებია, რომელთა ორობით ჩანაწერში $k$-ე ციფრი $1$-ია.
HEN: Card $k$ holds the numbers whose $k$-th binary digit is $1$.
SKA: ბარათები: I — $1, 3, 5, \dots$ ($1$-ის თანრიგი); II — $2, 3, 6, 7, \dots$ ($2$); III — $4$–$7$, $12$–$15$ ($4$); IV — $8$–$15$ ($8$).
ჩაფიქრებული რიცხვი = იმ ბარათების პირველი რიცხვების ($1, 2, 4, 8$) ჯამი, რომლებზეც პასუხი „კი“-ა.
SEN: Cards: I — $1, 3, 5, \dots$ (the $1$s bit); II — $2, 3, 6, 7, \dots$ ($2$s); III — $4$–$7$, $12$–$15$ ($4$s); IV — $8$–$15$ ($8$s).
The number is the sum of the first numbers ($1, 2, 4, 8$) of the cards that got "yes".
AKA: „კი“ ბარათების $1, 2, 4, 8$-ის ჯამი
AEN: sum the $1, 2, 4, 8$ of the "yes" cards

--- easy ratio

EN: Find $x$: $\dfrac{3}{x} = \dfrac{12}{20}$.

--- easy ratio
KA: გაამარტივეთ ფარდობა: $36 : 48$; $1{,}5 : 4{,}5$.
EN: Simplify the ratios: $36 : 48$; $1.5 : 4.5$.
HKA: გაყავით უსგ-ზე.

--- easy ratio
KA: $3$ რვეული $4{,}5$ ლარი ღირს. რა ღირს $7$ რვეული?
EN: $3$ notebooks cost $4.5$ lari. What do $7$ notebooks cost?
HKA: ერთის ფასი.

SEN: $1.5 \cdot 7 = 10.5$ lari

AEN: $10.5$ lari

--- easy ratio
KA: რუკის მასშტაბია $1 : 200\,000$. რუკაზე $3\ \text{სმ}$ რამდენ კილომეტრს შეესაბამება?
EN: A map's scale is $1 : 200\,000$. What distance in km does $3\ \text{cm}$ on the map represent?

SEN: $600\,000\ \text{cm} = 6\ \text{km}$

AEN: $6\ \text{km}$

--- easy ratio
KA: კლასში ბიჭებისა და გოგოების ფარდობაა $2 : 3$, სულ $25$ მოსწავლეა. რამდენი ბიჭია?
EN: In a class the ratio of boys to girls is $2 : 3$, with $25$ pupils in all. How many boys are there?

--- easy ratio
KA: პირდაპირპროპორციულია თუ უკუპროპორციული: ა) პურის ფასი და რაოდენობა; ბ) სიჩქარე და მგზავრობის დრო (გზა მუდმივია)?
EN: Direct or inverse proportion: a) the cost and the number of loaves; b) speed and journey time (for a fixed distance)?

--- easy ratio
KA: $4$ მუშა თხრილს $6$ დღეში თხრის. რამდენ დღეში გათხრის $8$ მუშა?

--- easy ratio
KA: კომპოტისთვის ხილი და შაქარი $5 : 2$ ფარდობით აიღეს. $3\ \text{კგ}$ ხილისთვის რამდენი შაქარია საჭირო?

AEN: $3 : 4 = 6 : 8$

KA: ქვეითმა გზის $\dfrac{1}{3}$ $4\ \text{კმ/სთ}$-ით გაიარა, დანარჩენი $6\ \text{კმ/სთ}$-ით; სულ $3{,}5$ საათი მოუნდა. იპოვეთ მანძილი.
EN: A walker covers $\dfrac{1}{3}$ of a route at $4\ \text{km/h}$ and the rest at $6\ \text{km/h}$, taking $3.5$ hours in all. Find the distance.

HEN: $\dfrac{x/3}{4} + \dfrac{2x/3}{6} = 3.5$.
SKA: $\dfrac{x}{12} + \dfrac{x}{9} = 3{,}5 \Rightarrow \dfrac{7x}{36} = 3{,}5 \Rightarrow x = 18\ \text{კმ}$
SEN: $\dfrac{x}{12} + \dfrac{x}{9} = 3.5 \Rightarrow \dfrac{7x}{36} = 3.5 \Rightarrow x = 18\ \text{km}$
AKA: $18\ \text{კმ}$
AEN: $18\ \text{km}$

--- hard equations
KA: რა მნიშვნელობისას აქვს $a(x - 2) = 3x + 1$ განტოლებას ამონახსნი $x = 5$? როდის არ აქვს ამონახსნი?
EN: For which $a$ does $a(x - 2) = 3x + 1$ have the solution $x = 5$? When does it have no solution?
HKA: ჩასვით $x = 5$; $x$-ის კოეფიციენტი $a - 3$.
HEN: Put $x = 5$; the coefficient of $x$ is $a - 3$.
SKA: $3a = 16 \Rightarrow a = \dfrac{16}{3}$.
$(a - 3)x = 2a + 1$: $a = 3$-ისას $0 = 7$ — ამონახსნი არ აქვს.
SEN: $3a = 16 \Rightarrow a = \dfrac{16}{3}$.
$(a - 3)x = 2a + 1$: at $a = 3$ we get $0 = 7$ — no solution.
AKA: $a = \dfrac{16}{3}$; $a = 3$
AEN: $a = \dfrac{16}{3}$; $a = 3$

EN: A boat covers a distance downstream in $3$ h and the same distance upstream in $4$ h. The current is $2\ \text{km/h}$. Find the boat's own speed.
HKA: $3(v + 2) = 4(v - 2)$.
HEN: $3(v + 2) = 4(v - 2)$.
SKA: $3v + 6 = 4v - 8 \Rightarrow v = 14\ \text{კმ/სთ}$
SEN: $3v + 6 = 4v - 8 \Rightarrow v = 14\ \text{km/h}$
AKA: $14\ \text{კმ/სთ}$
AEN: $14\ \text{km/h}$

EN: A tank is filled by two pipes: the first alone takes $3$ h, the second $6$ h. The first runs alone for $1$ hour, then both run. How long in total to fill it?

HEN: $\dfrac{1}{3} + t\left(\dfrac{1}{3} + \dfrac{1}{6}\right) = 1$.

SEN: $\dfrac{t}{2} = \dfrac{2}{3} \Rightarrow t = \dfrac{4}{3}$ h; total $2\dfrac{1}{3}$ h $= 2$ h $20$ min
AKA: $2$ სთ $20$ წთ
AEN: $2$ h $20$ min

KA: შვილი ახლა $8$ წლისაა, დედა $32$-ის. რამდენი წლის წინ იყო დედა შვილზე $7$-ჯერ უფროსი?
EN: A child is $8$ now and the mother $32$. How many years ago was the mother $7$ times the child's age?
HKA: $32 - x = 7(8 - x)$.
HEN: $32 - x = 7(8 - x)$.
SKA: $32 - x = 56 - 7x \Rightarrow 6x = 24 \Rightarrow x = 4$

AKA: $4$ წლის წინ

KA: სიბრტყეზე $5$ წრფეა, არცერთი ორი არ არის პარალელური და არცერთი სამი არ გადის ერთ წერტილზე. რამდენი გადაკვეთის წერტილია?
EN: There are $5$ lines in a plane, no two parallel and no three through one point. How many intersection points are there?
HKA: ყოველი წყვილი ერთხელ იკვეთება.
HEN: Each pair meets once.
SKA: $\dfrac{5 \cdot 4}{2} = 10$
SEN: $\dfrac{5 \cdot 4}{2} = 10$
AKA: $10$
AEN: $10$

--- hard geometry
KA: ერთი წერტილიდან გამოსულია $4$ სხივი, რომლებიც ქმნიან $4$ კუთხეს (სრული ბრუნი): $x$, $2x$, $3x$, $4x$. იპოვეთ ისინი.
EN: Four rays from one point form four angles filling a full turn: $x$, $2x$, $3x$, $4x$. Find them.
HKA: ჯამი $360^\circ$.
HEN: They add to $360^\circ$.
SKA: $10x = 360 \Rightarrow x = 36^\circ$: $36^\circ$, $72^\circ$, $108^\circ$, $144^\circ$
SEN: $10x = 360 \Rightarrow x = 36^\circ$: $36^\circ$, $72^\circ$, $108^\circ$, $144^\circ$
AKA: $36^\circ$, $72^\circ$, $108^\circ$, $144^\circ$
AEN: $36^\circ$, $72^\circ$, $108^\circ$, $144^\circ$

--- hard geometry
KA: $a \parallel b$. $a$-ზე $A$ წერტილიდან, $b$-ზე $B$ წერტილიდან გავლებული სხივები $M$-ში იკვეთება (წრფეებს შორის). $a$-სთან კუთხე $35^\circ$-ია, $b$-სთან $50^\circ$. იპოვეთ $\angle AMB$.
EN: $a \parallel b$. Rays from $A$ on $a$ and $B$ on $b$ meet at $M$ between the lines, making $35^\circ$ with $a$ and $50^\circ$ with $b$. Find $\angle AMB$.
HKA: $M$-ზე გაავლეთ $a$-ს პარალელური წრფე.
HEN: Draw a line through $M$ parallel to $a$.
SKA: $\angle AMB = 35^\circ + 50^\circ = 85^\circ$ (ჯვარედინა კუთხეები)
SEN: $\angle AMB = 35^\circ + 50^\circ = 85^\circ$ (alternate angles)
AKA: $85^\circ$
AEN: $85^\circ$

--- hard geometry
KA: $12{:}00$-ის შემდეგ როდის დაემთხვევა საათის ისრები ერთმანეთს პირველად?
EN: After $12{:}00$, when do the clock hands next coincide?
HKA: წუთის ისარი $6^\circ$/წთ, საათის $0{,}5^\circ$/წთ.
HEN: The minute hand moves $6^\circ$/min, the hour hand $0.5^\circ$/min.
SKA: $5{,}5t = 360 \Rightarrow t = \dfrac{720}{11} = 65\dfrac{5}{11}$ წთ — $1{:}05\dfrac{5}{11}$-ზე
SEN: $5.5t = 360 \Rightarrow t = \dfrac{720}{11} = 65\dfrac{5}{11}$ min — at $1{:}05\dfrac{5}{11}$
AKA: $\approx 1{:}05{:}27$
AEN: $\approx 1{:}05{:}27$

--- hard geometry olympiad
KA: სიბრტყეზე $n$ წრფე, ზოგადი მდებარეობით (არცერთი პარალელური, არცერთი სამი — ერთ წერტილზე). რამდენ ნაწილად ყოფენ სიბრტყეს? იპოვეთ $n = 5$-ისთვის.
EN: $n$ lines in general position (none parallel, no three concurrent) cut the plane into how many regions? Find it for $n = 5$.
HKA: $k$-ური წრფე $k$ ახალ ნაწილს ამატებს.
HEN: The $k$-th line adds $k$ new regions.
SKA: $R(n) = 1 + (1 + 2 + \dots + n) = 1 + \dfrac{n(n + 1)}{2}$
$R(5) = 1 + 15 = 16$
SEN: $R(n) = 1 + (1 + 2 + \dots + n) = 1 + \dfrac{n(n + 1)}{2}$
$R(5) = 1 + 15 = 16$
AKA: $16$
AEN: $16$

--- hard geometry olympiad
KA: დღე-ღამეში რამდენჯერ ქმნიან საათის ისრები მართ კუთხეს?
EN: How many times in a day do a clock's hands form a right angle?
HKA: $12$ საათში ისრები $11$-ჯერ ემთხვევა.
HEN: In $12$ hours the hands coincide $11$ times.
SKA: ყოველ ორ დამთხვევას შორის $2$-ჯერ ქმნიან $90^\circ$-ს: $12$ საათში $22$-ჯერ
დღე-ღამეში $44$-ჯერ
SEN: Between consecutive coincidences they make $90^\circ$ twice: $22$ times in $12$ hours
$44$ times in a day
AKA: $44$
AEN: $44$

EN: Two angles of a triangle are $48^\circ$ and $67^\circ$. Find the third.
HKA: ჯამი $180^\circ$.

SEN: $180 - 48 - 67 = 65^\circ$

--- easy triangles
KA: ტოლფერდა სამკუთხედის ფუძესთან კუთხე $70^\circ$-ია. იპოვეთ წვეროსთან კუთხე.
EN: The base angle of an isosceles triangle is $70^\circ$. Find the apex angle.
HKA: ფუძესთან კუთხეები ტოლია.

--- easy triangles
KA: არსებობს თუ არა სამკუთხედი გვერდებით $3$, $4$, $8$?
EN: Is there a triangle with sides $3$, $4$, $8$?
HKA: ორი უმცირესის ჯამი მესამეზე მეტი უნდა იყოს.

SEN: $3 + 4 = 7 < 8$

--- easy triangles
KA: მართკუთხა სამკუთხედის ერთი მახვილი კუთხე $28^\circ$-ია. იპოვეთ მეორე.
EN: One acute angle of a right triangle is $28^\circ$. Find the other.
HKA: მახვილი კუთხეების ჯამი $90^\circ$.

SEN: $90 - 28 = 62^\circ$

--- medium triangles
KA: სამკუთხედის კუთხეები $2 : 3 : 4$ შეფარდებითაა. იპოვეთ ისინი.
EN: A triangle's angles are in the ratio $2 : 3 : 4$. Find them.
HKA: $9$ ნაწილი $= 180^\circ$.
HEN: $9$ parts $= 180^\circ$.
SKA: $40^\circ$, $60^\circ$, $80^\circ$

--- medium triangles
KA: სამკუთხედის გარე კუთხე $130^\circ$-ია, მისი არამოსაზღვრე ერთ-ერთი შიგა კუთხე $55^\circ$. იპოვეთ დანარჩენი კუთხეები.
EN: An exterior angle of a triangle is $130^\circ$ and one of the two remote interior angles is $55^\circ$. Find the other angles.
HKA: გარე კუთხე $=$ არამოსაზღვრე შიგა კუთხეების ჯამი.
HEN: Exterior angle $=$ sum of the remote interior angles.
SKA: $130 - 55 = 75^\circ$; მოსაზღვრე შიგა: $180 - 130 = 50^\circ$
SEN: $130 - 55 = 75^\circ$; the adjacent interior angle is $180 - 130 = 50^\circ$
AKA: $75^\circ$ და $50^\circ$
AEN: $75^\circ$ and $50^\circ$

--- medium triangles
KA: ტოლფერდა სამკუთხედის პერიმეტრი $32$ სმ-ია, ფერდი ფუძეზე $4$ სმ-ით მეტია. იპოვეთ გვერდები.
EN: An isosceles triangle has perimeter $32\ \text{cm}$; each leg is $4\ \text{cm}$ longer than the base. Find the sides.
HKA: $x + 2(x + 4) = 32$.
HEN: $x + 2(x + 4) = 32$.
SKA: $3x = 24 \Rightarrow x = 8$: ფუძე $8$, ფერდები $12$
SEN: $3x = 24 \Rightarrow x = 8$: base $8$, legs $12$
AKA: $8$, $12$, $12$ სმ
AEN: $8$, $12$, $12\ \text{cm}$

--- medium triangles
KA: მართკუთხა სამკუთხედის ერთი მახვილი კუთხე $30^\circ$-ია, ჰიპოტენუზა $14$ სმ. იპოვეთ $30^\circ$-ის მოპირდაპირე კათეტი.
EN: A right triangle has an acute angle of $30^\circ$ and hypotenuse $14\ \text{cm}$. Find the leg opposite the $30^\circ$ angle.

HEN: The leg opposite $30^\circ$ is half the hypotenuse.

SEN: $7\ \text{cm}$

--- medium triangles
KA: $\triangle ABC$-ში $\angle A = 50^\circ$, $\angle B = 70^\circ$. იპოვეთ $A$ და $B$ კუთხეების ბისექტრისებს შორის კუთხე (გადაკვეთის წერტილთან).
EN: In $\triangle ABC$, $\angle A = 50^\circ$ and $\angle B = 70^\circ$. Find the angle at which the bisectors of $A$ and $B$ meet.
HKA: $\triangle ABI$-ში კუთხეები $25^\circ$ და $35^\circ$.
HEN: In $\triangle ABI$ the angles are $25^\circ$ and $35^\circ$.
SKA: $180 - 25 - 35 = 120^\circ$
SEN: $180 - 25 - 35 = 120^\circ$
AKA: $120^\circ$
AEN: $120^\circ$

--- medium triangles
KA: ტოლფერდა სამკუთხედის ერთი კუთხე $100^\circ$-ია. იპოვეთ დანარჩენი ორი.
EN: One angle of an isosceles triangle is $100^\circ$. Find the other two.
HKA: $100^\circ$ ფუძესთან ვერ იქნება.
HEN: $100^\circ$ can't be a base angle.
SKA: $\dfrac{180 - 100}{2} = 40^\circ$
SEN: $\dfrac{180 - 100}{2} = 40^\circ$
AKA: $40^\circ$ და $40^\circ$
AEN: $40^\circ$ and $40^\circ$

KA: ტოლფერდა სამკუთხედის ორი გვერდია $4$ და $9$. იპოვეთ პერიმეტრი.
EN: Two sides of an isosceles triangle are $4$ and $9$. Find the perimeter.
HKA: სცადეთ ორივე ვარიანტი.
HEN: Try both options.
SKA: $4, 4, 9$: $4 + 4 < 9$ — არა. $\ 4, 9, 9$ — კი.
SEN: $4, 4, 9$: $4 + 4 < 9$ — impossible. $\ 4, 9, 9$ — fine.
AKA: $22$
AEN: $22$

KA: მართკუთხა სამკუთხედში მართი კუთხის წვეროდან გავლებულია მედიანა $6$ სმ. იპოვეთ ჰიპოტენუზა.
EN: In a right triangle the median from the right angle is $6\ \text{cm}$. Find the hypotenuse.
HKA: ეს მედიანა ჰიპოტენუზის ნახევარია.

--- hard triangles
KA: $\triangle ABC$-ში $AB = BC$, $\angle B = 36^\circ$. $AD$ — $A$ კუთხის ბისექტრისაა. აჩვენეთ, რომ $AD = DB$.
EN: In $\triangle ABC$, $AB = BC$ and $\angle B = 36^\circ$. $AD$ bisects angle $A$. Show that $AD = DB$.
HKA: $\angle A = \angle C = 72^\circ$.
HEN: $\angle A = \angle C = 72^\circ$.
SKA: $\angle DAB = 36^\circ = \angle B$ — $\triangle ABD$ ტოლფერდაა: $AD = DB$
SEN: $\angle DAB = 36^\circ = \angle B$ — so $\triangle ABD$ is isosceles: $AD = DB$
AKA: $AD = DB$
AEN: $AD = DB$

--- hard triangles
KA: სამკუთხედის ერთი კუთხე მეორეზე $2$-ჯერ მეტია, მესამეზე $20^\circ$-ით ნაკლები. იპოვეთ კუთხეები.
EN: One angle of a triangle is twice another and $20^\circ$ less than the third. Find the angles.
HKA: $x$, $2x$, $2x + 20$.
HEN: $x$, $2x$, $2x + 20$.
SKA: $5x + 20 = 180 \Rightarrow x = 32^\circ$: $32^\circ$, $64^\circ$, $84^\circ$
SEN: $5x + 20 = 180 \Rightarrow x = 32^\circ$: $32^\circ$, $64^\circ$, $84^\circ$
AKA: $32^\circ$, $64^\circ$, $84^\circ$
AEN: $32^\circ$, $64^\circ$, $84^\circ$

--- hard triangles
KA: ტოლგვერდა სამკუთხედის ერთ გვერდზე აგებულია კვადრატი (გარეთ). იპოვეთ კუთხე სამკუთხედის მოპირდაპირე წვეროსა და კვადრატის ორ შორეულ წვეროს შემაერთებელ მონაკვეთებს შორის.
EN: A square is built outward on one side of an equilateral triangle. Find the angle at the triangle's far vertex between the segments to the square's two far corners.
HKA: $\triangle$ (წვერო, სამკუთხედის წვერო, კვადრატის წვერო) ტოლფერდაა, წვეროსთან $150^\circ$.
HEN: The triangle (apex, triangle vertex, square corner) is isosceles with $150^\circ$ at the shared vertex.
SKA: ფუძესთან $15^\circ$; ძიებული: $60^\circ - 2 \cdot 15^\circ = 30^\circ$
SEN: Base angles are $15^\circ$; the required angle is $60^\circ - 2 \cdot 15^\circ = 30^\circ$
AKA: $30^\circ$
AEN: $30^\circ$

--- hard triangles
KA: მართკუთხა $\triangle ABC$-ში ($\angle C = 90^\circ$) $\angle A = 30^\circ$, $BC = 5$. $CH$ — სიმაღლეა. იპოვეთ $AH$.
EN: In right $\triangle ABC$ ($\angle C = 90^\circ$), $\angle A = 30^\circ$ and $BC = 5$. $CH$ is the altitude. Find $AH$.
HKA: $AB = 10$; $\triangle BCH$-ში $\angle BCH = 30^\circ$.
HEN: $AB = 10$; in $\triangle BCH$, $\angle BCH = 30^\circ$.
SKA: $BH = \dfrac{BC}{2} = 2{,}5$; $\ AH = 10 - 2{,}5 = 7{,}5$
SEN: $BH = \dfrac{BC}{2} = 2.5$; $\ AH = 10 - 2.5 = 7.5$
AKA: $7{,}5$
AEN: $7.5$

--- hard triangles
KA: სამკუთხედის პერიმეტრი $24$-ია, გვერდები მთელი რიცხვებია და ერთი მათგანი $10$. რამდენი ასეთი სამკუთხედია (გვერდების რიგის გაუთვალისწინებლად)?
EN: A triangle has integer sides, perimeter $24$ and one side $10$. How many such triangles are there (ignoring order)?
HKA: დანარჩენი $a + b = 14$, $|a - b| < 10$.
HEN: The others have $a + b = 14$ and $|a - b| < 10$.
SKA: $a \le b$: $(3, 11)$? $11 - 3 = 8 < 10$ ✓; $(2, 12)$: $10$ — არა.
$(3,11), (4,10), (5,9), (6,8), (7,7)$
SEN: With $a \le b$: $(3, 11)$ has $11 - 3 = 8 < 10$ ✓; $(2, 12)$ has $10$ — no.
$(3,11), (4,10), (5,9), (6,8), (7,7)$
AKA: $5$
AEN: $5$

--- hard triangles
KA: $\triangle ABC$-ში $\angle C = 90^\circ$, $CM$ — მედიანა, $\angle ACM = 25^\circ$. იპოვეთ $\triangle ABC$-ის მახვილი კუთხეები.
EN: In $\triangle ABC$, $\angle C = 90^\circ$ and the median $CM$ makes $\angle ACM = 25^\circ$. Find the acute angles of $\triangle ABC$.

--- hard triangles
KA: ტოლფერდა $\triangle ABC$-ის ($AB = BC$) ფუძის $AC$-ის შუაწერტილი $M$-ია, $\angle ABM = 35^\circ$. იპოვეთ $\triangle ABC$-ის კუთხეები.
EN: In isosceles $\triangle ABC$ ($AB = BC$), $M$ is the midpoint of base $AC$ and $\angle ABM = 35^\circ$. Find the angles of $\triangle ABC$.
HKA: $BM$ — მედიანაც, ბისექტრისაც და სიმაღლეც.
HEN: $BM$ is a median, bisector and altitude.
SKA: $\angle B = 70^\circ$; $\angle A = \angle C = 55^\circ$
SEN: $\angle B = 70^\circ$; $\angle A = \angle C = 55^\circ$
AKA: $55^\circ$, $70^\circ$, $55^\circ$
AEN: $55^\circ$, $70^\circ$, $55^\circ$

--- hard triangles
KA: დაამტკიცეთ, რომ სამკუთხედის ნებისმიერი გვერდი ნახევარპერიმეტრზე ნაკლებია.
EN: Prove that any side of a triangle is less than half the perimeter.
HKA: $a < b + c$.
HEN: $a < b + c$.
SKA: $a < b + c \Rightarrow 2a < a + b + c \Rightarrow a < \dfrac{P}{2}$
SEN: $a < b + c \Rightarrow 2a < a + b + c \Rightarrow a < \dfrac{P}{2}$
AKA: $a < \dfrac{P}{2}$
AEN: $a < \dfrac{P}{2}$

--- hard triangles olympiad
KA: $\triangle ABC$-ში $AB = AC$, $\angle A = 20^\circ$. $AB$-ზე აღებულია $D$ ისე, რომ $AD = BC$. იპოვეთ $\angle BCD$.
EN: In $\triangle ABC$, $AB = AC$ and $\angle A = 20^\circ$. Point $D$ on $AB$ has $AD = BC$. Find $\angle BCD$.
HKA: $AC$-ზე ააგეთ შიგნით ტოლგვერდა სამკუთხედი (ან გამოიყენეთ ცნობილი კონსტრუქცია).
HEN: Build an equilateral triangle on $AC$ (a classic construction).
SKA: ცნობილი შედეგი (ლენგლის ტიპის): $\angle ACD = 10^\circ$
$\angle BCD = 80^\circ - 10^\circ = 70^\circ$
SEN: A classic Langley-type result: $\angle ACD = 10^\circ$
$\angle BCD = 80^\circ - 10^\circ = 70^\circ$
AKA: $70^\circ$
AEN: $70^\circ$

--- hard triangles olympiad
KA: რამდენი არატოლი სამკუთხედია, რომლის გვერდები მთელი რიცხვებია და პერიმეტრი $12$?
EN: How many non-congruent triangles have integer sides and perimeter $12$?

HEN: $a \le b \le c$, $c < 6$.
SKA: $c = 5$: $(2,5,5), (3,4,5)$; $\ c = 4$: $(4,4,4)$

KA: წვიმის ალბათობა $0{,}35$-ია. რა არის იმის ალბათობა, რომ არ იწვიმებს?
EN: The probability of rain is $0.35$. What's the probability of no rain?
HKA: $1 - P$.
HEN: $1 - P$.
SKA: $0{,}65$
SEN: $0.65$
AKA: $0{,}65$
AEN: $0.65$

--- easy probability
KA: $1$-დან $20$-მდე რიცხვებიდან შემთხვევით აირჩიეს ერთი. რა არის $5$-ის ჯერადის ალბათობა?
EN: A number from $1$ to $20$ is chosen at random. What's the probability it's a multiple of $5$?
HKA: $5, 10, 15, 20$.
HEN: $5, 10, 15, 20$.
SKA: $\dfrac{4}{20} = \dfrac{1}{5}$
SEN: $\dfrac{4}{20} = \dfrac{1}{5}$
AKA: $\dfrac{1}{5}$
AEN: $\dfrac{1}{5}$

--- medium probability
KA: ორი მონეტა აგდეს. რა არის ზუსტად ერთი გერბის ალბათობა?
EN: Two coins are tossed. What's the probability of exactly one head?
HKA: შედეგები: GG, GS, SG, SS.
HEN: Outcomes: HH, HT, TH, TT.
SKA: $\dfrac{2}{4} = \dfrac{1}{2}$
SEN: $\dfrac{2}{4} = \dfrac{1}{2}$
AKA: $\dfrac{1}{2}$
AEN: $\dfrac{1}{2}$

--- medium probability
KA: ორი კამათელი გააგორეს. რა არის ჯამი $7$-ის ალბათობა?
EN: Two dice are rolled. What's the probability the total is $7$?
HKA: $36$ შედეგი.
HEN: $36$ outcomes.
SKA: $(1,6), (2,5), \dots, (6,1)$ — $6$: $\ \dfrac{6}{36} = \dfrac{1}{6}$
SEN: $(1,6), (2,5), \dots, (6,1)$ — $6$ of them: $\ \dfrac{6}{36} = \dfrac{1}{6}$
AKA: $\dfrac{1}{6}$
AEN: $\dfrac{1}{6}$

--- medium probability
KA: ყუთში $5$ თეთრი და რამდენიმე შავი ბურთია. თეთრის ამოღების ალბათობა $\dfrac{1}{4}$-ია. რამდენი შავი ბურთია?
EN: A box has $5$ white balls and some black ones. The probability of white is $\dfrac{1}{4}$. How many black balls are there?
HKA: სულ $20$.
HEN: $20$ in total.
SKA: $20 - 5 = 15$
SEN: $20 - 5 = 15$
AKA: $15$
AEN: $15$

--- medium probability
KA: მონეტა $200$-ჯერ ააგდეს, გერბი $112$-ჯერ მოვიდა. რა არის გერბის ფარდობითი სიხშირე? რამდენს ველოდით?
EN: A coin was tossed $200$ times and showed heads $112$ times. What's the relative frequency of heads? How many did we expect?
HKA: $\dfrac{112}{200}$.
HEN: $\dfrac{112}{200}$.
SKA: $0{,}56$; მოსალოდნელი $100$
SEN: $0.56$; expected $100$
AKA: $0{,}56$; $100$
AEN: $0.56$; $100$

--- hard probability
KA: სამი მონეტა ააგდეს. რა არის ერთი გერბის მაინც მოსვლის ალბათობა?
EN: Three coins are tossed. What's the probability of at least one head?
HKA: საწინააღმდეგო: სამივე საფირე.
HEN: The opposite is all tails.
SKA: $1 - \dfrac{1}{8} = \dfrac{7}{8}$
SEN: $1 - \dfrac{1}{8} = \dfrac{7}{8}$
AKA: $\dfrac{7}{8}$
AEN: $\dfrac{7}{8}$

--- hard probability
KA: ყუთში $3$ წითელი და $2$ მწვანე ბურთია. ზედიზედ ამოიღეს $2$ (დაბრუნების გარეშე). რა არის ორივე წითლის ალბათობა?
EN: A box has $3$ red and $2$ green balls. Two are drawn without replacement. What's the probability both are red?
HKA: $\dfrac{3}{5} \cdot \dfrac{2}{4}$.
HEN: $\dfrac{3}{5} \cdot \dfrac{2}{4}$.
SKA: $\dfrac{6}{20} = \dfrac{3}{10}$
SEN: $\dfrac{6}{20} = \dfrac{3}{10}$
AKA: $\dfrac{3}{10}$
AEN: $\dfrac{3}{10}$

--- hard probability
KA: ორი კამათელი გააგორეს. რა არის იმის ალბათობა, რომ ერთ-ერთზე მაინც $6$ მოვა?
EN: Two dice are rolled. What's the probability of at least one $6$?
HKA: $1 - \left(\dfrac{5}{6}\right)^2$.
HEN: $1 - \left(\dfrac{5}{6}\right)^2$.
SKA: $1 - \dfrac{25}{36} = \dfrac{11}{36}$
SEN: $1 - \dfrac{25}{36} = \dfrac{11}{36}$
AKA: $\dfrac{11}{36}$
AEN: $\dfrac{11}{36}$

--- hard probability
KA: ციფრებიდან $1, 2, 3$ შემთხვევით შეადგინეს სამნიშნა რიცხვი (ყოველი ციფრი ერთხელ). რა არის იმის ალბათობა, რომ რიცხვი ლუწია?
EN: The digits $1, 2, 3$ are arranged at random into a three-digit number (each used once). What's the probability it's even?
HKA: ბოლო ციფრი $2$ უნდა იყოს.
HEN: The last digit must be $2$.
SKA: $6$ რიცხვიდან $2$ მთავრდება $2$-ით: $\dfrac{1}{3}$
SEN: Of the $6$ numbers, $2$ end in $2$: $\dfrac{1}{3}$
AKA: $\dfrac{1}{3}$
AEN: $\dfrac{1}{3}$

--- hard probability olympiad
KA: ორი კამათელი გააგორეს. რომელი ჯამია ყველაზე სავარაუდო და რომელი ჯამებია ყველაზე ნაკლებად?
EN: Two dice are rolled. Which total is most likely, and which are least likely?
HKA: დაითვალეთ თითოეული ჯამის შედეგები.
HEN: Count the outcomes for each total.
SKA: $7$ — $6$ შედეგი ($\dfrac{1}{6}$); $\ 2$ და $12$ — თითო ($\dfrac{1}{36}$)
SEN: $7$ — $6$ outcomes ($\dfrac{1}{6}$); $\ 2$ and $12$ — one each ($\dfrac{1}{36}$)
AKA: $7$; $2$ და $12$
AEN: $7$; $2$ and $12$

--- hard probability olympiad
KA: ოთხი მონეტა ააგდეს. რა არის ზუსტად ორი გერბის ალბათობა?
EN: Four coins are tossed. What's the probability of exactly two heads?
HKA: $16$ შედეგი; რამდენი გზით ავირჩიოთ $2$ ადგილი $4$-დან?
HEN: $16$ outcomes; how many ways to choose $2$ places out of $4$?
SKA: $C_4^2 = 6$: $\ \dfrac{6}{16} = \dfrac{3}{8}$
SEN: $C_4^2 = 6$: $\ \dfrac{6}{16} = \dfrac{3}{8}$
AKA: $\dfrac{3}{8}$
AEN: $\dfrac{3}{8}$

--- hard probability olympiad
KA: სამი ბარათი: ერთი ორივე მხრიდან წითელი, ერთი ორივე მხრიდან თეთრი, ერთი — ერთი მხრიდან წითელი, მეორიდან თეთრი. შემთხვევით აიღეს ბარათი და დადეს მაგიდაზე; ზედა მხარე წითელია. რა არის ალბათობა, რომ ქვედაც წითელია?
EN: Three cards: one red on both sides, one white on both sides, one red on one side and white on the other. A random card is placed on the table and the top is red. What's the probability the bottom is red too?
HKA: დაითვალეთ წითელი მხარეები, არა ბარათები.
HEN: Count red faces, not cards.
SKA: სამი წითელი მხარიდან ორი ეკუთვნის წითელ-წითელ ბარათს
$P = \dfrac{2}{3}$ (და არა $\dfrac{1}{2}$!)
SEN: Of the three red faces, two belong to the red-red card
$P = \dfrac{2}{3}$ (not $\dfrac{1}{2}$!)
AKA: $\dfrac{2}{3}$
AEN: $\dfrac{2}{3}$

--- hard probability olympiad
KA: კლასში $23$ მოსწავლეა. რატომ არის თითქმის $50\%$ ალბათობა, რომ ორს ერთ დღეს აქვს დაბადების დღე? შეაფასეთ ალბათობა, რომ ყველას სხვადასხვა დღეს აქვს (წელი $365$ დღე).
EN: A class has $23$ pupils. Why is there almost a $50\%$ chance two share a birthday? Estimate the chance that all birthdays differ ($365$-day year).
HKA: $P = \dfrac{365}{365} \cdot \dfrac{364}{365} \cdots \dfrac{343}{365}$.
HEN: $P = \dfrac{365}{365} \cdot \dfrac{364}{365} \cdots \dfrac{343}{365}$.
SKA: ნამრავლი $\approx 0{,}49$ — წყვილების რაოდენობა დიდია: $\dfrac{23 \cdot 22}{2} = 253$
ერთი დამთხვევის მაინც ალბათობა $\approx 0{,}51$
SEN: The product is $\approx 0.49$ — there are many pairs: $\dfrac{23 \cdot 22}{2} = 253$
The chance of at least one match is $\approx 0.51$
AKA: $\approx 0{,}49$
AEN: $\approx 0.49$
