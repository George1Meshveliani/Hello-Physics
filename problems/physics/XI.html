KA: დაალაგეთ სიხშირის ზრდის მიხედვით: ხილული სინათლე, რადიოტალღები, რენტგენის სხივები, ინფრაწითელი, ულტრაიისფერი, გამა-სხივები, მიკროტალღები. გამოთვალეთ ხილული სინათლის სიხშირეთა შუალედი ($\lambda = 400$–$700\ \text{ნმ}$).
EN: Order by increasing frequency: visible light, radio waves, X-rays, infrared, ultraviolet, gamma rays, microwaves. Calculate the frequency range of visible light ($\lambda = 400$–$700\ \text{nm}$).
HKA: $\nu = \dfrac{c}{\lambda}$; რაც მოკლეა ტალღა, მით მაღალია სიხშირე.
HEN: $\nu = \dfrac{c}{\lambda}$; the shorter the wave, the higher the frequency.
SKA: რადიო $<$ მიკროტალღები $<$ ინფრაწითელი $<$ ხილული $<$ ულტრაიისფერი $<$ რენტგენი $<$ გამა.
**ფორმულა:** $\nu = \dfrac{c}{\lambda}$
**რიცხვები:** $\nu_{\min} = \dfrac{3 \cdot 10^8}{7 \cdot 10^{-7}} \approx 4{,}3 \cdot 10^{14}\ \text{ჰც}$ (წითელი), $\ \nu_{\max} = \dfrac{3 \cdot 10^8}{4 \cdot 10^{-7}} = 7{,}5 \cdot 10^{14}\ \text{ჰც}$ (იისფერი)
SEN: Radio $<$ microwaves $<$ infrared $<$ visible $<$ ultraviolet $<$ X-rays $<$ gamma.
**Formula:** $\nu = \dfrac{c}{\lambda}$
**Numbers:** $\nu_{\min} = \dfrac{3 \times 10^8}{7 \times 10^{-7}} \approx 4.3 \times 10^{14}\ \text{Hz}$ (red), $\ \nu_{\max} = \dfrac{3 \times 10^8}{4 \times 10^{-7}} = 7.5 \times 10^{14}\ \text{Hz}$ (violet)
AKA: $4{,}3 \cdot 10^{14}$–$7{,}5 \cdot 10^{14}\ \text{ჰც}$
AEN: $4.3 \times 10^{14}$–$7.5 \times 10^{14}\ \text{Hz}$

--- medium optics
KA: სხივი წყლიდან ($n = 1{,}33$) ჰაერში $30^\circ$-იანი დაცემის კუთხით გადადის. იპოვეთ გარდატეხის კუთხე.
EN: A ray passes from water ($n = 1.33$) into air at an angle of incidence of $30^\circ$. Find the angle of refraction.
HKA: $n_1\sin\alpha = n_2\sin\gamma$.
HEN: $n_1\sin\alpha = n_2\sin\gamma$.
SKA: **ფორმულა:** $\sin\gamma = n\sin\alpha$
**რიცხვები:** $\sin\gamma = 1{,}33 \cdot 0{,}5 = 0{,}665 \Rightarrow \gamma \approx 41{,}7^\circ$ — სხივი ნორმალს შორდება.
SEN: **Formula:** $\sin\gamma = n\sin\alpha$
**Numbers:** $\sin\gamma = 1.33 \cdot 0.5 = 0.665 \Rightarrow \gamma \approx 41.7^\circ$ — the ray bends away from the normal.
AKA: $\approx 41{,}7^\circ$
AEN: $\approx 41.7^\circ$

--- medium optics
KA: ორი ბრტყელი სარკე ერთმანეთთან $90^\circ$ კუთხეს ადგენს. მათ შორის სანთელია. რამდენ გამოსახულებას დავინახავთ? რამდენს — $60^\circ$ კუთხისას?
EN: Two flat mirrors are at $90^\circ$ to each other with a candle between them. How many images do we see? How many at $60^\circ$?
HKA: გამოსახულებათა რიცხვი $N = \dfrac{360^\circ}{\alpha} - 1$ (როცა ეს მთელი რიცხვია).
HEN: The number of images is $N = \dfrac{360^\circ}{\alpha} - 1$ (when that is a whole number).
SKA: **ფორმულა:** $N = \dfrac{360^\circ}{\alpha} - 1$
**რიცხვები:** $90^\circ$: $N = 4 - 1 = 3$; $\ 60^\circ$: $N = 6 - 1 = 5$ (ასე მუშაობს კალეიდოსკოპი)
SEN: **Formula:** $N = \dfrac{360^\circ}{\alpha} - 1$
**Numbers:** $90^\circ$: $N = 4 - 1 = 3$; $\ 60^\circ$: $N = 6 - 1 = 5$ (that's how a kaleidoscope works)
AKA: $3$; $5$
AEN: $3$; $5$

--- medium lenses
KA: საგანი $10\ \text{სმ}$ ფოკუსური მანძილის შემკრები ლინზიდან $40\ \text{სმ}$-ზეა. იპოვეთ გამოსახულების მანძილი და გადიდება.
EN: An object is $40\ \text{cm}$ from a converging lens of focal length $10\ \text{cm}$. Find the image distance and magnification.
HKA: $\dfrac{1}{f} = \dfrac{1}{F} - \dfrac{1}{d}$.
HEN: $\dfrac{1}{f} = \dfrac{1}{F} - \dfrac{1}{d}$.
SKA: **ფორმულა:** $f = \dfrac{F d}{d - F}$, $\ \Gamma = \dfrac{f}{d}$
**რიცხვები:** $f = \dfrac{10 \cdot 40}{30} \approx 13{,}3\ \text{სმ}$, $\ \Gamma = \dfrac{13{,}3}{40} = \dfrac{1}{3}$ — ნამდვილი, შებრუნებული, შემცირებული (ასე მუშაობს ფოტოაპარატი).
SEN: **Formula:** $f = \dfrac{F d}{d - F}$, $\ \Gamma = \dfrac{f}{d}$
**Numbers:** $f = \dfrac{10 \cdot 40}{30} \approx 13.3\ \text{cm}$, $\ \Gamma = \dfrac{13.3}{40} = \dfrac{1}{3}$ — real, inverted, diminished (how a camera works).
AKA: $\approx 13{,}3\ \text{სმ}$; $\dfrac{1}{3}$
AEN: $\approx 13.3\ \text{cm}$; $\dfrac{1}{3}$

--- medium lenses
KA: გამადიდებელი შუშის ფოკუსური მანძილია $5\ \text{სმ}$. რამდენჯერ ადიდებს ის, თუ გამოსახულება საუკეთესო ხედვის მანძილზე ($25\ \text{სმ}$) უნდა იყოს? სად უნდა მოვათავსოთ საგანი?
EN: A magnifying glass has focal length $5\ \text{cm}$. What magnification does it give if the image is to be at the near point ($25\ \text{cm}$)? Where should the object be?
HKA: გამოსახულება წარმოსახვითია: $f = -25\ \text{სმ}$.
HEN: The image is virtual: $f = -25\ \text{cm}$.
SKA: **ფორმულა:** $\dfrac{1}{d} = \dfrac{1}{F} - \dfrac{1}{f}$, $\ \Gamma = \dfrac{|f|}{d}$
**რიცხვები:** $\dfrac{1}{d} = \dfrac{1}{5} + \dfrac{1}{25} = \dfrac{6}{25} \Rightarrow d \approx 4{,}2\ \text{სმ}$
$\Gamma = \dfrac{25}{4{,}2} = 6$ (ხშირად მიახლოებით იყენებენ $\Gamma \approx \dfrac{25}{F} = 5$)
SEN: **Formula:** $\dfrac{1}{d} = \dfrac{1}{F} - \dfrac{1}{f}$, $\ \Gamma = \dfrac{|f|}{d}$
**Numbers:** $\dfrac{1}{d} = \dfrac{1}{5} + \dfrac{1}{25} = \dfrac{6}{25} \Rightarrow d \approx 4.2\ \text{cm}$
$\Gamma = \dfrac{25}{4.2} = 6$ (the approximation $\Gamma \approx \dfrac{25}{F} = 5$ is often used)
AKA: $\approx 6$-ჯერ; $\approx 4{,}2\ \text{სმ}$
AEN: $\approx 6$ times; $\approx 4.2\ \text{cm}$

--- hard ampere
KA: ორ გრძელ პარალელურ გამტარში, რომლებიც ერთმანეთისგან $4\ \text{სმ}$-ითაა დაშორებული, საწინააღმდეგო მიმართულებით გადის $20\ \text{ა}$ და $5\ \text{ა}$ დენი. იპოვეთ ძალა ერთეულ სიგრძეზე და მისი მიმართულება.
EN: Two long parallel wires $4\ \text{cm}$ apart carry $20\ \text{A}$ and $5\ \text{A}$ in opposite directions. Find the force per unit length and its direction.
HKA: $\dfrac{F}{l} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$; საწინააღმდეგო დენები განიზიდება.
HEN: $\dfrac{F}{l} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$; opposite currents repel.
SKA: **ფორმულა:** $\dfrac{F}{l} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$
**რიცხვები:** $\dfrac{F}{l} = \dfrac{2 \cdot 10^{-7} \cdot 20 \cdot 5}{0{,}04} = 5 \cdot 10^{-4}\ \text{ნ/მ}$ — განიზიდება (ორივეზე ერთნაირი, III კანონი).
SEN: **Formula:** $\dfrac{F}{l} = \dfrac{\mu_0 I_1 I_2}{2\pi d}$
**Numbers:** $\dfrac{F}{l} = \dfrac{2 \times 10^{-7} \cdot 20 \cdot 5}{0.04} = 5 \times 10^{-4}\ \text{N/m}$ — repulsive (the same on both, third law).
AKA: $5 \cdot 10^{-4}\ \text{ნ/მ}$; განიზიდება
AEN: $5 \times 10^{-4}\ \text{N/m}$; repulsive

--- hard lorentz
KA: პროტონი და ალფა-ნაწილაკი ($m_\alpha = 4m_p$, $q_\alpha = 2e$) ერთი და იმავე ძაბვით აჩქარდა და ერთსა და იმავე მაგნიტურ ველში შევიდა. იპოვეთ მათი ტრაექტორიების რადიუსების შეფარდება.
EN: A proton and an alpha particle ($m_\alpha = 4m_p$, $q_\alpha = 2e$) are accelerated through the same voltage and enter the same magnetic field. Find the ratio of their path radii.
HKA: $r = \dfrac{1}{B}\sqrt{\dfrac{2 m U}{q}}$.
HEN: $r = \dfrac{1}{B}\sqrt{\dfrac{2 m U}{q}}$.
SKA: **ფორმულა:** $q U = \dfrac{m v^2}{2}$, $\ r = \dfrac{m v}{q B} = \dfrac{1}{B}\sqrt{\dfrac{2 m U}{q}}$, $\ \dfrac{r_\alpha}{r_p} = \sqrt{\dfrac{m_\alpha q_p}{m_p q_\alpha}}$
**რიცხვები:** $\dfrac{r_\alpha}{r_p} = \sqrt{\dfrac{4 \cdot 1}{1 \cdot 2}} = \sqrt{2} \approx 1{,}41$
SEN: **Formula:** $q U = \dfrac{m v^2}{2}$, $\ r = \dfrac{m v}{q B} = \dfrac{1}{B}\sqrt{\dfrac{2 m U}{q}}$, $\ \dfrac{r_\alpha}{r_p} = \sqrt{\dfrac{m_\alpha q_p}{m_p q_\alpha}}$
**Numbers:** $\dfrac{r_\alpha}{r_p} = \sqrt{\dfrac{4 \cdot 1}{1 \cdot 2}} = \sqrt{2} \approx 1.41$
AKA: $\sqrt{2}$
AEN: $\sqrt{2}$

--- hard lorentz
KA: ელექტრონები გადიან სიჩქარის სელექტორში ($E = 3 \cdot 10^4\ \text{ვ/მ}$, $B = 0{,}01\ \text{ტლ}$), შემდეგ კი ხვდებიან მხოლოდ მაგნიტურ ველში ($B = 0{,}01\ \text{ტლ}$). იპოვეთ მათი სიჩქარე და წრეწირის რადიუსი.
EN: Electrons pass through a velocity selector ($E = 3 \times 10^4\ \text{V/m}$, $B = 0.01\ \text{T}$) and then enter a region with only the magnetic field ($B = 0.01\ \text{T}$). Find their speed and the radius of their circle.
HKA: სელექტორში $v = \dfrac{E}{B}$; შემდეგ $r = \dfrac{m v}{e B}$.
HEN: In the selector $v = \dfrac{E}{B}$; then $r = \dfrac{m v}{e B}$.
SKA: **ფორმულა:** $v = \dfrac{E}{B}$, $\ r = \dfrac{m v}{e B}$
**რიცხვები:** $v = \dfrac{3 \cdot 10^4}{0{,}01} = 3 \cdot 10^6\ \text{მ/წმ}$
$r = \dfrac{9{,}1 \cdot 10^{-31} \cdot 3 \cdot 10^6}{1{,}6 \cdot 10^{-19} \cdot 0{,}01} \approx 1{,}7 \cdot 10^{-3}\ \text{მ} = 1{,}7\ \text{მმ}$
SEN: **Formula:** $v = \dfrac{E}{B}$, $\ r = \dfrac{m v}{e B}$
**Numbers:** $v = \dfrac{3 \times 10^4}{0.01} = 3 \times 10^6\ \text{m/s}$
$r = \dfrac{9.1 \times 10^{-31} \cdot 3 \times 10^6}{1.6 \times 10^{-19} \cdot 0.01} \approx 1.7 \times 10^{-3}\ \text{m} = 1.7\ \text{mm}$
AKA: $3 \cdot 10^6\ \text{მ/წმ}$; $1{,}7\ \text{მმ}$
AEN: $3 \times 10^6\ \text{m/s}$; $1.7\ \text{mm}$

--- hard induction
KA: $50$ ხვიისგან შემდგარი $20 \times 10\ \text{სმ}$ ზომის ჩარჩო $0{,}2\ \text{ტლ}$ ველშია, მისი სიბრტყე ველის მართობულია. ჩარჩო $0{,}1\ \text{წმ}$-ში $90^\circ$-ით მოაბრუნეს (სიბრტყე ველის პარალელური გახდა). იპოვეთ საშუალო ემძალა.
EN: A $50$-turn coil measuring $20 \times 10\ \text{cm}$ is in a $0.2\ \text{T}$ field with its plane perpendicular to the field. It is turned $90^\circ$ in $0.1\ \text{s}$ (its plane becomes parallel to the field). Find the average EMF.
HKA: საწყისი ნაკადი $BS$, საბოლოო — $0$.
HEN: The initial flux is $BS$, the final is $0$.
SKA: **ფორმულა:** $\mathcal{E}_{\text{საშ}} = N\dfrac{B S}{\Delta t}$
**რიცხვები:** $S = 0{,}2 \cdot 0{,}1 = 0{,}02\ \text{მ}^2$, $\ \mathcal{E} = 50 \cdot \dfrac{0{,}2 \cdot 0{,}02}{0{,}1} = 2\ \text{ვ}$
SEN: **Formula:** $\mathcal{E}_{\text{avg}} = N\dfrac{B S}{\Delta t}$
**Numbers:** $S = 0.2 \cdot 0.1 = 0.02\ \text{m}^2$, $\ \mathcal{E} = 50 \cdot \dfrac{0.2 \cdot 0.02}{0.1} = 2\ \text{V}$
AKA: $2\ \text{ვ}$
AEN: $2\ \text{V}$

--- hard induction
KA: $0{,}5\ \text{მ}$ სიგრძის ღერო $1\ \text{ტლ}$ ველში რელსებზე $4\ \text{მ/წმ}$ მუდმივი სიჩქარით მოძრაობს, წრედის წინაღობაა $2\ \text{ომი}$. იპოვეთ საჭირო გარე ძალა და მისი სიმძლავრე. დაამტკიცეთ, რომ ეს სიმძლავრე წრედში გამოყოფილი სითბოს სიმძლავრის ტოლია.
EN: A $0.5\ \text{m}$ rod slides on rails at a constant $4\ \text{m/s}$ in a $1\ \text{T}$ field; the circuit resistance is $2\ \Omega$. Find the external force needed and its power. Show that this power equals the rate of heat release in the circuit.
HKA: $\mathcal{E} = B l v$, $I = \mathcal{E}/R$, $F = B I l$, $P = F v$.
HEN: $\mathcal{E} = B l v$, $I = \mathcal{E}/R$, $F = B I l$, $P = F v$.
SKA: **ფორმულა:** $F = B I l = \dfrac{B^2 l^2 v}{R}$, $\ P = F v = \dfrac{B^2 l^2 v^2}{R} = \dfrac{\mathcal{E}^2}{R} = I^2 R$ ∎
**რიცხვები:** $\mathcal{E} = 1 \cdot 0{,}5 \cdot 4 = 2\ \text{ვ}$, $\ I = 1\ \text{ა}$, $\ F = 1 \cdot 1 \cdot 0{,}5 = 0{,}5\ \text{ნ}$
$P = 0{,}5 \cdot 4 = 2\ \text{ვტ} = I^2 R = 1 \cdot 2$ ✓
SEN: **Formula:** $F = B I l = \dfrac{B^2 l^2 v}{R}$, $\ P = F v = \dfrac{B^2 l^2 v^2}{R} = \dfrac{\mathcal{E}^2}{R} = I^2 R$ ∎
**Numbers:** $\mathcal{E} = 1 \cdot 0.5 \cdot 4 = 2\ \text{V}$, $\ I = 1\ \text{A}$, $\ F = 1 \cdot 1 \cdot 0.5 = 0.5\ \text{N}$
$P = 0.5 \cdot 4 = 2\ \text{W} = I^2 R = 1 \cdot 2$ ✓
AKA: $0{,}5\ \text{ნ}$; $2\ \text{ვტ}$
AEN: $0.5\ \text{N}$; $2\ \text{W}$

--- hard induction
KA: $0{,}01\ \text{მ}^2$ ფართობის უძრავ კონტურში მაგნიტური ინდუქცია იცვლება კანონით $B = 0{,}2\sin(100\pi t)\ \text{ტლ}$ (ველი კონტურის მართობულია). იპოვეთ ინდუქციის ემძალის მაქსიმალური მნიშვნელობა.
EN: In a fixed loop of area $0.01\ \text{m}^2$ the field varies as $B = 0.2\sin(100\pi t)\ \text{T}$ (perpendicular to the loop). Find the peak induced EMF.
HKA: სინუსოიდური ცვლილების მაქსიმალური სიჩქარე $B_{\max}\omega$-ია.
HEN: The maximum rate of change of a sine is $B_{\max}\omega$.
SKA: **ფორმულა:** $\Phi = B_{\max} S \sin\omega t$, $\ \mathcal{E}_{\max} = B_{\max} S \omega$
**რიცხვები:** $\mathcal{E}_{\max} = 0{,}2 \cdot 0{,}01 \cdot 314 \approx 0{,}63\ \text{ვ}$
SEN: **Formula:** $\Phi = B_{\max} S \sin\omega t$, $\ \mathcal{E}_{\max} = B_{\max} S \omega$
**Numbers:** $\mathcal{E}_{\max} = 0.2 \cdot 0.01 \cdot 314 \approx 0.63\ \text{V}$
AKA: $\approx 0{,}63\ \text{ვ}$
AEN: $\approx 0.63\ \text{V}$

--- hard selfind
KA: შეადარეთ $0{,}2\ \text{ჰნ}$ კოჭის ენერგია $1\ \text{ა}$ დენისას და $10\ \text{მკფ}$ კონდენსატორის ენერგია $100\ \text{ვ}$ ძაბვისას. თუ ეს კონდენსატორი კოჭაზე განიმუხტება, რა მაქსიმალური დენი იქნება?
EN: Compare the energy of a $0.2\ \text{H}$ coil carrying $1\ \text{A}$ with that of a $10\ \mu\text{F}$ capacitor at $100\ \text{V}$. If this capacitor discharges through the coil, what is the maximum current?
HKA: $W_L = \dfrac{L I^2}{2}$, $W_C = \dfrac{C U^2}{2}$; რხევისას ენერგია ერთიდან მეორეში გადადის.
HEN: $W_L = \dfrac{L I^2}{2}$, $W_C = \dfrac{C U^2}{2}$; in oscillation the energy passes from one to the other.
SKA: **ფორმულა:** $W_L = \dfrac{L I^2}{2}$, $\ W_C = \dfrac{C U^2}{2}$, $\ I_{\max} = U\sqrt{\dfrac{C}{L}}$
**რიცხვები:** $W_L = 0{,}1\ \text{ჯ}$, $\ W_C = \dfrac{10^{-5} \cdot 10^4}{2} = 0{,}05\ \text{ჯ}$ — კოჭის ენერგია ორჯერ მეტია.
$I_{\max} = 100\sqrt{\dfrac{10^{-5}}{0{,}2}} \approx 0{,}71\ \text{ა}$
SEN: **Formula:** $W_L = \dfrac{L I^2}{2}$, $\ W_C = \dfrac{C U^2}{2}$, $\ I_{\max} = U\sqrt{\dfrac{C}{L}}$
**Numbers:** $W_L = 0.1\ \text{J}$, $\ W_C = \dfrac{10^{-5} \cdot 10^4}{2} = 0.05\ \text{J}$ — the coil holds twice as much.
$I_{\max} = 100\sqrt{\dfrac{10^{-5}}{0.2}} \approx 0.71\ \text{A}$
AKA: $0{,}1\ \text{ჯ}$ და $0{,}05\ \text{ჯ}$; $\approx 0{,}71\ \text{ა}$
AEN: $0.1\ \text{J}$ and $0.05\ \text{J}$; $\approx 0.71\ \text{A}$

--- hard oscill
KA: $1\ \text{კგ}$ ტვირთი ჩამოკიდეს ორ ერთნაირ ზამბარაზე ($k = 100\ \text{ნ/მ}$ თითოეული): ა) მიმდევრობით; ბ) პარალელურად. იპოვეთ რხევის პერიოდები.
EN: A $1\ \text{kg}$ mass hangs from two identical springs ($k = 100\ \text{N/m}$ each): a) in series; b) in parallel. Find the periods.
HKA: მიმდევრობით $k = 50\ \text{ნ/მ}$, პარალელურად $k = 200\ \text{ნ/მ}$.
HEN: In series $k = 50\ \text{N/m}$, in parallel $k = 200\ \text{N/m}$.
SKA: **ფორმულა:** $T = 2\pi\sqrt{\dfrac{m}{k_{\text{ეკვ}}}}$
**რიცხვები:** ა) $T = 6{,}28\sqrt{\dfrac{1}{50}} \approx 0{,}89\ \text{წმ}$; ბ) $T = 6{,}28\sqrt{\dfrac{1}{200}} \approx 0{,}44\ \text{წმ}$ — ორჯერ ნაკლები.
SEN: **Formula:** $T = 2\pi\sqrt{\dfrac{m}{k_{\text{eq}}}}$
**Numbers:** a) $T = 6.28\sqrt{\dfrac{1}{50}} \approx 0.89\ \text{s}$; b) $T = 6.28\sqrt{\dfrac{1}{200}} \approx 0.44\ \text{s}$ — half as long.
AKA: ა) $\approx 0{,}89\ \text{წმ}$; ბ) $\approx 0{,}44\ \text{წმ}$
AEN: a) $\approx 0.89\ \text{s}$; b) $\approx 0.44\ \text{s}$

--- hard oscill
KA: ჰარმონიულად მერხევი ზამბარიანი ქანქარის გადახრა ამპლიტუდის ნახევარია ($x = A/2$). სრული ენერგიის რა ნაწილია ამ მომენტში კინეტიკური?
EN: A spring oscillator is displaced by half its amplitude ($x = A/2$). What fraction of the total energy is kinetic at that moment?
HKA: სრული ენერგია $\dfrac{k A^2}{2}$, პოტენციური — $\dfrac{k x^2}{2}$.
HEN: Total energy $\dfrac{k A^2}{2}$, potential $\dfrac{k x^2}{2}$.
SKA: **ფორმულა:** $\dfrac{E_k}{E} = 1 - \dfrac{x^2}{A^2}$
**რიცხვები:** $\dfrac{E_k}{E} = 1 - \dfrac{1}{4} = \dfrac{3}{4}$ — ამპლიტუდის ნახევარზე ენერგიის $75\%$ ჯერ კიდევ კინეტიკურია.
SEN: **Formula:** $\dfrac{E_k}{E} = 1 - \dfrac{x^2}{A^2}$
**Numbers:** $\dfrac{E_k}{E} = 1 - \dfrac{1}{4} = \dfrac{3}{4}$ — at half the amplitude $75\%$ of the energy is still kinetic.
AKA: $\dfrac{3}{4}$
AEN: $\dfrac{3}{4}$

--- hard waves
KA: ღამურა $50\ \text{კჰც}$ ულტრაბგერას გამოსცემს და ექოს $0{,}02\ \text{წმ}$-ის შემდეგ იღებს. რა მანძილზეა მწერი? რა ზომის საგნების „დანახვა“ შეუძლია ღამურას (ზომა $\sim$ ტალღის სიგრძე)? ($v = 340\ \text{მ/წმ}$)
EN: A bat emits $50\ \text{kHz}$ ultrasound and hears the echo after $0.02\ \text{s}$. How far away is the insect? What size of objects can the bat "see" (size $\sim$ wavelength)? ($v = 340\ \text{m/s}$)
HKA: ექო ორმაგ მანძილს გადის; $\lambda = v/\nu$.
HEN: The echo travels twice the distance; $\lambda = v/\nu$.
SKA: **ფორმულა:** $L = \dfrac{v t}{2}$, $\ \lambda = \dfrac{v}{\nu}$
**რიცხვები:** $L = \dfrac{340 \cdot 0{,}02}{2} = 3{,}4\ \text{მ}$, $\ \lambda = \dfrac{340}{5 \cdot 10^4} \approx 6{,}8\ \text{მმ}$ — რამდენიმე მილიმეტრის მწერებიც კი.
SEN: **Formula:** $L = \dfrac{v t}{2}$, $\ \lambda = \dfrac{v}{\nu}$
**Numbers:** $L = \dfrac{340 \cdot 0.02}{2} = 3.4\ \text{m}$, $\ \lambda = \dfrac{340}{5 \times 10^4} \approx 6.8\ \text{mm}$ — even insects a few millimetres across.
AKA: $3{,}4\ \text{მ}$; $\sim 7\ \text{მმ}$
AEN: $3.4\ \text{m}$; $\sim 7\ \text{mm}$

--- hard lcac
KA: რხევით კონტურში იმ მომენტში, როცა კონდენსატორის მუხტი მაქსიმალურის ნახევარია, ენერგიის რა ნაწილია კოჭაში?
EN: In an LC circuit, at the moment when the capacitor's charge is half its maximum, what fraction of the energy is in the coil?
HKA: კონდენსატორის ენერგია $\dfrac{q^2}{2C}$ — მუხტის კვადრატის პროპორციულია.
HEN: The capacitor's energy $\dfrac{q^2}{2C}$ is proportional to the charge squared.
SKA: **ფორმულა:** $W_C = W\dfrac{q^2}{q_{\max}^2}$, $\ W_L = W - W_C$
**რიცხვები:** $W_C = \dfrac{W}{4}$, $\ W_L = \dfrac{3}{4}W$
SEN: **Formula:** $W_C = W\dfrac{q^2}{q_{\max}^2}$, $\ W_L = W - W_C$
**Numbers:** $W_C = \dfrac{W}{4}$, $\ W_L = \dfrac{3}{4}W$
AKA: $\dfrac{3}{4}$
AEN: $\dfrac{3}{4}$

--- hard lcac
KA: იდეალური ტრანსფორმატორის ტრანსფორმაციის კოეფიციენტია $10$, პირველადი ძაბვა — $220\ \text{ვ}$, მეორეულ წრედში $11\ \text{ომ}$ დატვირთვაა. იპოვეთ მეორეული ძაბვა, ორივე დენი და სიმძლავრე.
EN: An ideal transformer has turns ratio $10$, primary voltage $220\ \text{V}$ and an $11\ \Omega$ load on the secondary. Find the secondary voltage, both currents and the power.
HKA: $U_2 = \dfrac{U_1}{k}$, $I_1 = \dfrac{I_2}{k}$.
HEN: $U_2 = \dfrac{U_1}{k}$, $I_1 = \dfrac{I_2}{k}$.
SKA: **ფორმულა:** $U_2 = \dfrac{U_1}{k}$, $\ I_2 = \dfrac{U_2}{R}$, $\ I_1 = \dfrac{I_2}{k}$, $\ P = U_2 I_2$
**რიცხვები:** $U_2 = 22\ \text{ვ}$, $\ I_2 = 2\ \text{ა}$, $\ I_1 = 0{,}2\ \text{ა}$, $\ P = 44\ \text{ვტ}$ (შემოწმება: $220 \cdot 0{,}2 = 44$ ✓)
SEN: **Formula:** $U_2 = \dfrac{U_1}{k}$, $\ I_2 = \dfrac{U_2}{R}$, $\ I_1 = \dfrac{I_2}{k}$, $\ P = U_2 I_2$
**Numbers:** $U_2 = 22\ \text{V}$, $\ I_2 = 2\ \text{A}$, $\ I_1 = 0.2\ \text{A}$, $\ P = 44\ \text{W}$ (check: $220 \cdot 0.2 = 44$ ✓)
AKA: $22\ \text{ვ}$; $2\ \text{ა}$ და $0{,}2\ \text{ა}$; $44\ \text{ვტ}$
AEN: $22\ \text{V}$; $2\ \text{A}$ and $0.2\ \text{A}$; $44\ \text{W}$

--- hard emwaves
KA: GPS თანამგზავრი $20\,000\ \text{კმ}$ სიმაღლეზეა. რა დროში აღწევს მისი სიგნალი მიმღებამდე? რა შეცდომას გამოიწვევს მანძილის გაზომვაში საათების $1\ \text{მკწმ}$-ით ცდომილება?
EN: A GPS satellite is $20\,000\ \text{km}$ up. How long does its signal take to reach a receiver? What distance error does a $1\ \mu\text{s}$ clock error cause?
HKA: $t = \dfrac{L}{c}$, $\Delta L = c\,\Delta t$.
HEN: $t = \dfrac{L}{c}$, $\Delta L = c\,\Delta t$.
SKA: **ფორმულა:** $t = \dfrac{L}{c}$, $\ \Delta L = c\,\Delta t$
**რიცხვები:** $t = \dfrac{2 \cdot 10^7}{3 \cdot 10^8} \approx 0{,}067\ \text{წმ}$, $\ \Delta L = 3 \cdot 10^8 \cdot 10^{-6} = 300\ \text{მ}$
ამიტომ თანამგზავრებზე ზუსტ ატომურ საათებს იყენებენ.
SEN: **Formula:** $t = \dfrac{L}{c}$, $\ \Delta L = c\,\Delta t$
**Numbers:** $t = \dfrac{2 \times 10^7}{3 \times 10^8} \approx 0.067\ \text{s}$, $\ \Delta L = 3 \times 10^8 \cdot 10^{-6} = 300\ \text{m}$
That's why satellites carry precise atomic clocks.
AKA: $\approx 0{,}067\ \text{წმ}$; $300\ \text{მ}$
AEN: $\approx 0.067\ \text{s}$; $300\ \text{m}$

--- hard optics
KA: ალმასის გარდატეხის მაჩვენებელია $2{,}42$. იპოვეთ სრული შინაგანი არეკვლის ზღვრული კუთხე. რატომ ბრწყინავს სწორად დამუშავებული ალმასი ასე ძლიერად?
EN: Diamond has refractive index $2.42$. Find the critical angle for total internal reflection. Why does a well-cut diamond sparkle so much?
HKA: $\sin\alpha_0 = \dfrac{1}{n}$.
HEN: $\sin\alpha_0 = \dfrac{1}{n}$.
SKA: **ფორმულა:** $\sin\alpha_0 = \dfrac{1}{n}$
**რიცხვები:** $\sin\alpha_0 = \dfrac{1}{2{,}42} \approx 0{,}413 \Rightarrow \alpha_0 \approx 24{,}4^\circ$ (მინაში $\approx 42^\circ$)
მცირე ზღვრული კუთხის გამო ალმასში შესული სინათლე ბევრჯერ აირეკლება და მხოლოდ ზედა წახნაგებიდან გამოდის — ქვა „ანათებს“.
SEN: **Formula:** $\sin\alpha_0 = \dfrac{1}{n}$
**Numbers:** $\sin\alpha_0 = \dfrac{1}{2.42} \approx 0.413 \Rightarrow \alpha_0 \approx 24.4^\circ$ (in glass $\approx 42^\circ$)
Because the critical angle is small, light entering a diamond is reflected many times and leaves only through the top faces — the stone "sparkles".
AKA: $\approx 24{,}4^\circ$
AEN: $\approx 24.4^\circ$

--- hard optics
KA: $2\ \text{მ}$ სიღრმეზე მყოფი თევზი ზემოთ იყურება. წყლის ზედაპირის რა რადიუსის წრეში ხედავს ის გარე სამყაროს? ($n = 1{,}33$, ზღვრული კუთხე $\approx 48{,}6^\circ$, $\tan 48{,}6^\circ \approx 1{,}13$)
EN: A fish $2\ \text{m}$ deep looks up. Within what radius on the water surface can it see the outside world? ($n = 1.33$, critical angle $\approx 48.6^\circ$, $\tan 48.6^\circ \approx 1.13$)
HKA: ამ წრის გარეთ სინათლე წყლის ზედაპირიდან სრულად აირეკლება.
HEN: Outside this circle the surface totally reflects light.
SKA: **ფორმულა:** $r = h\tan\alpha_0$
**რიცხვები:** $r = 2 \cdot 1{,}13 \approx 2{,}3\ \text{მ}$ — თევზი მთელ ცას $\approx 97^\circ$-იან კონუსში ხედავს („სნელის ფანჯარა“), მის გარეთ კი ფსკერის არეკვლას.
SEN: **Formula:** $r = h\tan\alpha_0$
**Numbers:** $r = 2 \cdot 1.13 \approx 2.3\ \text{m}$ — the fish sees the whole sky inside a $\approx 97^\circ$ cone ("Snell's window"), and outside it a reflection of the bottom.
AKA: $\approx 2{,}3\ \text{მ}$
AEN: $\approx 2.3\ \text{m}$

--- hard lenses
KA: ერთმანეთთან მიდებულია $20\ \text{სმ}$ ფოკუსური მანძილის შემკრები და $40\ \text{სმ}$ ფოკუსური მანძილის გამბნევი ლინზები. იპოვეთ სისტემის ოპტიკური ძალა და ფოკუსური მანძილი.
EN: A converging lens of focal length $20\ \text{cm}$ and a diverging lens of focal length $40\ \text{cm}$ are placed in contact. Find the system's optical power and focal length.
HKA: მიდებული თხელი ლინზების ოპტიკური ძალები იკრიბება.
HEN: The optical powers of thin lenses in contact add.
SKA: **ფორმულა:** $D = D_1 + D_2$, $\ F = \dfrac{1}{D}$
**რიცხვები:** $D = \dfrac{1}{0{,}2} + \dfrac{1}{-0{,}4} = 5 - 2{,}5 = 2{,}5\ \text{დპტრ}$, $\ F = 0{,}4\ \text{მ} = 40\ \text{სმ}$ — შემკრები სისტემა.
SEN: **Formula:** $D = D_1 + D_2$, $\ F = \dfrac{1}{D}$
**Numbers:** $D = \dfrac{1}{0.2} + \dfrac{1}{-0.4} = 5 - 2.5 = 2.5\ \text{D}$, $\ F = 0.4\ \text{m} = 40\ \text{cm}$ — a converging system.
AKA: $2{,}5\ \text{დპტრ}$; $40\ \text{სმ}$
AEN: $2.5$ dioptres; $40\ \text{cm}$

--- hard lorentz olympiad
KA: $0{,}1\ \text{ტლ}$ ერთგვაროვანი მაგნიტური ველი $5\ \text{სმ}$ სიგანის ზოლს იკავებს. პროტონი ზოლს მისი საზღვრის მართობულად ეცემა (ველი ზოლის სიბრტყის მართობულია). რა მინიმალური სიჩქარე უნდა ჰქონდეს პროტონს, რომ ზოლი გაიაროს და უკან არ შემობრუნდეს?
EN: A uniform $0.1\ \text{T}$ magnetic field fills a strip $5\ \text{cm}$ wide. A proton enters perpendicular to the strip's edge (the field is perpendicular to the plane of motion). What minimum speed lets the proton cross the strip instead of turning back?
HKA: ველში პროტონი წრეწირის რკალზე მოძრაობს; ის ზოლს გაივლის, თუ რადიუსი ზოლის სიგანეზე მეტია.
HEN: In the field the proton follows a circular arc; it gets through if the radius exceeds the strip's width.
SKA: **ფორმულა:** $r = \dfrac{m v}{e B} > d \Rightarrow v_{\min} = \dfrac{e B d}{m}$
**რიცხვები:** $v_{\min} = \dfrac{1{,}6 \cdot 10^{-19} \cdot 0{,}1 \cdot 0{,}05}{1{,}67 \cdot 10^{-27}} \approx 4{,}8 \cdot 10^5\ \text{მ/წმ}$
(დედამიწის მაგნიტოსფერო ასე გვიცავს კოსმოსური ნაწილაკებისგან.)
SEN: **Formula:** $r = \dfrac{m v}{e B} > d \Rightarrow v_{\min} = \dfrac{e B d}{m}$
**Numbers:** $v_{\min} = \dfrac{1.6 \times 10^{-19} \cdot 0.1 \cdot 0.05}{1.67 \times 10^{-27}} \approx 4.8 \times 10^5\ \text{m/s}$
(This is how the Earth's magnetosphere shields us from cosmic particles.)
AKA: $\approx 4{,}8 \cdot 10^5\ \text{მ/წმ}$
AEN: $\approx 4.8 \times 10^5\ \text{m/s}$

--- hard induction olympiad
KA: (ფარადეის დისკო) $0{,}2\ \text{მ}$ რადიუსის სპილენძის დისკო $0{,}5\ \text{ტლ}$ ველში (ველი დისკოს სიბრტყის მართობულია) წამში $50$ ბრუნს აკეთებს. რა ემძალა წარმოიქმნება დისკოს ცენტრსა და კიდეს შორის?
EN: (Faraday's disc) A copper disc of radius $0.2\ \text{m}$ spins at $50$ revolutions per second in a $0.5\ \text{T}$ field perpendicular to the disc. What EMF appears between the centre and the rim?
HKA: დისკო — უამრავი მბრუნავი რადიუსი-ღეროა: $\mathcal{E} = \dfrac{B\omega r^2}{2}$.
HEN: The disc is many rotating radial rods: $\mathcal{E} = \dfrac{B\omega r^2}{2}$.
SKA: **ფორმულა:** $\mathcal{E} = \dfrac{B\,\omega\,r^2}{2}$, $\ \omega = 2\pi\nu$
**რიცხვები:** $\omega = 314\ \text{რად/წმ}$, $\ \mathcal{E} = \dfrac{0{,}5 \cdot 314 \cdot 0{,}04}{2} \approx 3{,}1\ \text{ვ}$ — მუდმივი (არა ცვლადი!) ძაბვა.
SEN: **Formula:** $\mathcal{E} = \dfrac{B\,\omega\,r^2}{2}$, $\ \omega = 2\pi\nu$
**Numbers:** $\omega = 314\ \text{rad/s}$, $\ \mathcal{E} = \dfrac{0.5 \cdot 314 \cdot 0.04}{2} \approx 3.1\ \text{V}$ — a steady (not alternating!) voltage.
AKA: $\approx 3{,}1\ \text{ვ}$
AEN: $\approx 3.1\ \text{V}$

--- hard oscill olympiad
KA: მათემატიკური ქანქარა ავტომობილშია, რომელიც ჰორიზონტალურად $a = g$ აჩქარებით აჩქარდება. რა კუთხით გადაიხრება ქანქარის წონასწორობის მდებარეობა და როგორ შეიცვლება რხევის პერიოდი?
EN: A simple pendulum hangs in a car accelerating horizontally at $a = g$. At what angle does its equilibrium position tilt, and how does the period change?
HKA: აჩქარებულ სისტემაში ეფექტური „სიმძიმე“ $\vec{g}_{\text{ეფ}} = \vec{g} - \vec{a}$.
HEN: In the accelerating frame the effective "gravity" is $\vec{g}_{\text{eff}} = \vec{g} - \vec{a}$.
SKA: **ფორმულა:** $g_{\text{ეფ}} = \sqrt{g^2 + a^2}$, $\ \tan\varphi = \dfrac{a}{g}$, $\ T' = 2\pi\sqrt{\dfrac{l}{g_{\text{ეფ}}}}$
**რიცხვები:** $\tan\varphi = 1 \Rightarrow \varphi = 45^\circ$ (უკან); $\ g_{\text{ეფ}} = g\sqrt{2}$
$\dfrac{T'}{T} = \dfrac{1}{\sqrt[4]{2}} \approx 0{,}84$ — პერიოდი $\approx 16\%$-ით შემცირდება.
SEN: **Formula:** $g_{\text{eff}} = \sqrt{g^2 + a^2}$, $\ \tan\varphi = \dfrac{a}{g}$, $\ T' = 2\pi\sqrt{\dfrac{l}{g_{\text{eff}}}}$
**Numbers:** $\tan\varphi = 1 \Rightarrow \varphi = 45^\circ$ (backwards); $\ g_{\text{eff}} = g\sqrt{2}$
$\dfrac{T'}{T} = \dfrac{1}{\sqrt[4]{2}} \approx 0.84$ — the period is $\approx 16\%$ shorter.
AKA: $45^\circ$; $\approx 0{,}84\,T$
AEN: $45^\circ$; $\approx 0.84\,T$

--- hard optics olympiad
KA: მინის კუბის ($n = 1{,}5$) ზედა წახნაგზე სინათლე ნებისმიერი კუთხით ეცემა. შეუძლია თუ არა ამ სინათლეს კუბიდან გვერდითი (მეზობელი) წახნაგით გამოსვლა? დაასაბუთეთ.
EN: Light falls on the top face of a glass cube ($n = 1.5$) at any angle. Can this light leave the cube through a side (neighbouring) face? Justify.
HKA: იპოვეთ გარდატეხის მაქსიმალური კუთხე ზედა წახნაგზე და შესაბამისი დაცემის კუთხე გვერდით წახნაგზე.
HEN: Find the largest refraction angle at the top face and the corresponding angle of incidence on the side face.
SKA: ზედა წახნაგზე: $\sin\gamma = \dfrac{\sin\alpha}{n} \le \dfrac{1}{1{,}5} \Rightarrow \gamma \le 41{,}8^\circ$.
გვერდით წახნაგზე დაცემის კუთხე $\beta = 90^\circ - \gamma \ge 48{,}2^\circ$.
ზღვრული კუთხე: $\sin\alpha_0 = \dfrac{1}{1{,}5} \Rightarrow \alpha_0 \approx 41{,}8^\circ$.
$\beta \ge 48{,}2^\circ > 41{,}8^\circ$ — ყოველთვის **სრული შინაგანი არეკვლაა**: სინათლე გვერდით წახნაგს ვერ გაივლის ∎
SEN: At the top face: $\sin\gamma = \dfrac{\sin\alpha}{n} \le \dfrac{1}{1.5} \Rightarrow \gamma \le 41.8^\circ$.
The angle of incidence on the side face is $\beta = 90^\circ - \gamma \ge 48.2^\circ$.
Critical angle: $\sin\alpha_0 = \dfrac{1}{1.5} \Rightarrow \alpha_0 \approx 41.8^\circ$.
$\beta \ge 48.2^\circ > 41.8^\circ$ — there is always **total internal reflection**: the light can't get out through a side face ∎
AKA: ვერ გამოვა
AEN: no, it can't

--- hard lenses olympiad
KA: დაამტკიცეთ, რომ შემკრები ლინზით მიღებულ ნამდვილ გამოსახულებასა და საგანს შორის მანძილი ყოველთვის $4F$-ზე მეტი ან ტოლია. როდის არის ის ზუსტად $4F$?
EN: Prove that the distance between an object and its real image formed by a converging lens is always at least $4F$. When is it exactly $4F$?
HKA: $L = d + f$, $\dfrac{1}{F} = \dfrac{1}{d} + \dfrac{1}{f} = \dfrac{d + f}{d f}$. გამოიყენეთ $(d + f)^2 \ge 4df$.
HEN: $L = d + f$, $\dfrac{1}{F} = \dfrac{1}{d} + \dfrac{1}{f} = \dfrac{d + f}{d f}$. Use $(d + f)^2 \ge 4df$.
SKA: **ფორმულა:** $F = \dfrac{d f}{d + f} \Rightarrow d f = F L$
$(d + f)^2 \ge 4 d f \Rightarrow L^2 \ge 4 F L \Rightarrow L \ge 4F$ ∎
ტოლობა, როცა $d = f = 2F$ — საგანი ორმაგ ფოკუსშია, გამოსახულება ტოლი ზომისაა.
**რიცხვები:** $F = 10\ \text{სმ}$-ისთვის ეკრანი საგნიდან მინიმუმ $40\ \text{სმ}$-ზე უნდა იყოს.
SEN: **Formula:** $F = \dfrac{d f}{d + f} \Rightarrow d f = F L$
$(d + f)^2 \ge 4 d f \Rightarrow L^2 \ge 4 F L \Rightarrow L \ge 4F$ ∎
Equality when $d = f = 2F$ — the object is at twice the focal length and the image is the same size.
**Numbers:** for $F = 10\ \text{cm}$ the screen must be at least $40\ \text{cm}$ from the object.
AKA: $L \ge 4F$; ტოლობა $d = f = 2F$
AEN: $L \ge 4F$; equality at $d = f = 2F$

KA: ორი პარალელური გამტარი ($l = 1\ \text{მ}$, $r = 1\ \text{მ}$) $1\ \text{ა}$-იანი დენებით რა ძალით ურთიერთქმედებს? ($F = \dfrac{\mu_0 I_1 I_2 l}{2\pi r}$)
EN: Two parallel wires $1\ \text{m}$ long and $1\ \text{m}$ apart each carry $1\ \text{A}$. What force acts between them? ($F = \dfrac{\mu_0 I_1 I_2 l}{2\pi r}$)
HKA: ეს ძველი ამპერის განმარტებაა.
HEN: This was the old definition of the ampere.
SKA: $F = \dfrac{4\pi \cdot 10^{-7}}{2\pi} = 2 \cdot 10^{-7}\ \text{ნ}$
SEN: $F = \dfrac{4\pi \times 10^{-7}}{2\pi} = 2 \times 10^{-7}\ \text{N}$
AKA: $2 \cdot 10^{-7}\ \text{ნ}$
AEN: $2 \times 10^{-7}\ \text{N}$

--- medium ampere
KA: ღერო ($m = 50\ \text{გ}$, $l = 0{,}5\ \text{მ}$) ჰორიზონტალურ რელსებზე დევს ($\mu = 0{,}2$) ვერტიკალურ $0{,}2\ \text{ტლ}$ ველში. რა მინიმალური დენი დაძრავს?
EN: A rod ($m = 50\ \text{g}$, $l = 0.5\ \text{m}$) lies on horizontal rails ($\mu = 0.2$) in a vertical $0.2\ \text{T}$ field. What minimum current makes it move?
HKA: $B I l = \mu m g$.
HEN: $B I l = \mu m g$.
SKA: $I = \dfrac{0{,}2 \cdot 0{,}5}{0{,}2 \cdot 0{,}5} = 1\ \text{ა}$
SEN: $I = \dfrac{0.2 \cdot 0.5}{0.2 \cdot 0.5} = 1\ \text{A}$
AKA: $1\ \text{ა}$
AEN: $1\ \text{A}$

--- medium ampere
KA: ძაფებზე ჩამოკიდებულ ჰორიზონტალურ ღეროს ($m = 20\ \text{გ}$, $l = 0{,}2\ \text{მ}$, $I = 5\ \text{ა}$) ვერტიკალურ ველში ($B = 0{,}2\ \text{ტლ}$) ძაფები რა კუთხით გადაიხრება?
EN: A horizontal rod ($m = 20\ \text{g}$, $l = 0.2\ \text{m}$, $I = 5\ \text{A}$) hangs on threads in a vertical field ($B = 0.2\ \text{T}$). At what angle do the threads hang?
HKA: $\tan\alpha = \dfrac{B I l}{m g}$.
HEN: $\tan\alpha = \dfrac{B I l}{m g}$.
SKA: $\tan\alpha = \dfrac{0{,}2 \cdot 5 \cdot 0{,}2}{0{,}2} = 1 \Rightarrow \alpha = 45°$
SEN: $\tan\alpha = \dfrac{0.2 \cdot 5 \cdot 0.2}{0.2} = 1 \Rightarrow \alpha = 45°$
AKA: $45°$
AEN: $45°$

--- medium ampere
KA: ბრტყელი ჩარჩო ($S = 0{,}01\ \text{მ}^2$, $I = 3\ \text{ა}$) ველში ($B = 0{,}5\ \text{ტლ}$) როგორ დაყენდება წონასწორობისას? რა მომენტი მოქმედებს, როცა მისი სიბრტყე ველთან $30°$-ს ქმნის?
EN: A flat coil ($S = 0.01\ \text{m}^2$, $I = 3\ \text{A}$) is in a field ($B = 0.5\ \text{T}$). How does it settle in equilibrium? What torque acts when its plane is at $30°$ to the field?
HKA: $M = B I S \sin\alpha$, $\alpha$ — ნორმალსა და ველს შორის.
HEN: $M = B I S \sin\alpha$, with $\alpha$ between the normal and the field.
SKA: წონასწორობისას ჩარჩოს სიბრტყე ველის პერპენდიკულარულია (ნორმალი ველის გასწვრივ).
სიბრტყე $30°$ — ნორმალი $60°$: $M = 0{,}5 \cdot 3 \cdot 0{,}01 \cdot 0{,}866 \approx 0{,}013\ \text{ნ·მ}$
SEN: In equilibrium the coil's plane is perpendicular to the field (normal along the field).
Plane at $30°$ — normal at $60°$: $M = 0.5 \cdot 3 \cdot 0.01 \cdot 0.866 \approx 0.013\ \text{N·m}$
AKA: ველის პერპენდიკულარულად; $\approx 0{,}013\ \text{ნ·მ}$
AEN: perpendicular to the field; $\approx 0.013\ \text{N·m}$

--- hard ampere
KA: ღერო ($m = 0{,}1\ \text{კგ}$, $l = 0{,}5\ \text{მ}$) $30°$-იან დახრილ რელსებზეა ვერტიკალურ ველში ($B = 0{,}4\ \text{ტლ}$). ხახუნი არ არის. რა დენი შეაჩერებს?
EN: A rod ($m = 0.1\ \text{kg}$, $l = 0.5\ \text{m}$) lies on rails inclined at $30°$ in a vertical field ($B = 0.4\ \text{T}$), no friction. What current holds it still?
HKA: ჰორიზონტალური ამპერის ძალის მდგენელი სიბრტყის გასწვრივ: $B I l \cos\alpha = m g \sin\alpha$.
HEN: The horizontal Ampère force's component along the incline: $B I l \cos\alpha = m g \sin\alpha$.
SKA: $I = \dfrac{m g \tan 30°}{B l} = \dfrac{1 \cdot 0{,}577}{0{,}2} \approx 2{,}9\ \text{ა}$
SEN: $I = \dfrac{m g \tan 30°}{B l} = \dfrac{1 \cdot 0.577}{0.2} \approx 2.9\ \text{A}$
AKA: $\approx 2{,}9\ \text{ა}$
AEN: $\approx 2.9\ \text{A}$

--- hard ampere
KA: რელსური ზარბაზანი: $l = 0{,}1\ \text{მ}$ ჭურვი ($50\ \text{გ}$) $10\ \text{კა}$ დენით $1\ \text{ტლ}$ ველში $2\ \text{მ}$-ის რელსებზე აჩქარდება. რა სიჩქარეს იძენს?
EN: Railgun: a projectile of $50\ \text{g}$ spanning $l = 0.1\ \text{m}$ carries $10\ \text{kA}$ in a $1\ \text{T}$ field along $2\ \text{m}$ of rails. What speed does it reach?
HKA: $F s = \dfrac{m v^2}{2}$.
HEN: $F s = \dfrac{m v^2}{2}$.
SKA: $F = 1 \cdot 10^4 \cdot 0{,}1 = 1000\ \text{ნ}$
$v = \sqrt{\dfrac{2 \cdot 1000 \cdot 2}{0{,}05}} \approx 283\ \text{მ/წმ}$
SEN: $F = 1 \cdot 10^4 \cdot 0.1 = 1000\ \text{N}$
$v = \sqrt{\dfrac{2 \cdot 1000 \cdot 2}{0.05}} \approx 283\ \text{m/s}$
AKA: $\approx 283\ \text{მ/წმ}$
AEN: $\approx 283\ \text{m/s}$

--- hard ampere
KA: ორი პარალელური გამტარი ($I_1 = 10\ \text{ა}$, $I_2 = 20\ \text{ა}$, ერთი მიმართულებით) $30\ \text{სმ}$-ზეა. სად არის მაგნიტური ინდუქცია ნული?
EN: Two parallel wires carry $10\ \text{A}$ and $20\ \text{A}$ in the same direction, $30\ \text{cm}$ apart. Where is the field zero?
HKA: მათ შორის, $\dfrac{I_1}{x} = \dfrac{I_2}{0{,}3 - x}$.
HEN: Between them, $\dfrac{I_1}{x} = \dfrac{I_2}{0.3 - x}$.
SKA: $10(0{,}3 - x) = 20x \Rightarrow x = 0{,}1\ \text{მ}$ ($10\ \text{ა}$-იანიდან)
SEN: $10(0.3 - x) = 20x \Rightarrow x = 0.1\ \text{m}$ (from the $10\ \text{A}$ wire)
AKA: $10\ \text{ა}$-იანიდან $10\ \text{სმ}$-ზე
AEN: $10\ \text{cm}$ from the $10\ \text{A}$ wire

--- hard ampere
KA: ამპერმეტრის ჩარჩო ($N = 100$, $S = 2\ \text{სმ}^2$) $0{,}2\ \text{ტლ}$ ველშია, ზამბარა $90°$-ზე $2 \cdot 10^{-5}\ \text{ნ·მ}$ მომენტს ქმნის. რა დენზე გადაიხრება ისარი $90°$-ით?
EN: A meter coil ($N = 100$, $S = 2\ \text{cm}^2$) sits in a $0.2\ \text{T}$ radial field; its spring gives $2 \times 10^{-5}\ \text{N·m}$ at $90°$. What current deflects the needle by $90°$?
HKA: $N B I S = M_{\text{ზ}}$.
HEN: $N B I S = M_{\text{spring}}$.
SKA: $I = \dfrac{2 \cdot 10^{-5}}{100 \cdot 0{,}2 \cdot 2 \cdot 10^{-4}} = 5 \cdot 10^{-3}\ \text{ა}$
SEN: $I = \dfrac{2 \times 10^{-5}}{100 \cdot 0.2 \cdot 2 \times 10^{-4}} = 5 \times 10^{-3}\ \text{A}$
AKA: $5\ \text{მა}$
AEN: $5\ \text{mA}$

--- easy lorentz
KA: ელექტრონი ($v = 2 \cdot 10^6\ \text{მ/წმ}$) $0{,}05\ \text{ტლ}$ ველის პერპენდიკულარულად მოძრაობს. იპოვეთ ლორენცის ძალა.
EN: An electron ($v = 2 \times 10^6\ \text{m/s}$) moves perpendicular to a $0.05\ \text{T}$ field. Find the Lorentz force.
HKA: $F = q v B$.
HEN: $F = q v B$.
SKA: $F = 1{,}6 \cdot 10^{-19} \cdot 2 \cdot 10^6 \cdot 0{,}05 = 1{,}6 \cdot 10^{-14}\ \text{ნ}$
SEN: $F = 1.6 \times 10^{-19} \cdot 2 \times 10^6 \cdot 0.05 = 1.6 \times 10^{-14}\ \text{N}$
AKA: $1{,}6 \cdot 10^{-14}\ \text{ნ}$
AEN: $1.6 \times 10^{-14}\ \text{N}$

--- easy lorentz
KA: ასრულებს თუ არა ლორენცის ძალა მუშაობას? რატომ?
EN: Does the Lorentz force do work? Why?
HKA: ძალა სიჩქარის პერპენდიკულარულია.
HEN: The force is perpendicular to the velocity.
SKA: არა — ძალა ყოველთვის სიჩქარის პერპენდიკულარულია, ამიტომ $A = 0$, კინეტიკური ენერგია და სიჩქარის მოდული არ იცვლება.
SEN: No — the force is always perpendicular to the velocity, so $W = 0$; the kinetic energy and speed don't change.
AKA: არა
AEN: no

--- easy lorentz
KA: ნაწილაკი ველის ხაზების გასწვრივ შედის მაგნიტურ ველში. როგორ იმოძრავებს?
EN: A particle enters a magnetic field moving along the field lines. How does it move?
HKA: $\alpha = 0$.
HEN: $\alpha = 0$.
SKA: $F = q v B \sin 0 = 0$ — თანაბრად და სწორხაზოვნად.
SEN: $F = q v B \sin 0 = 0$ — uniformly in a straight line.
AKA: სწორხაზოვნად, თანაბრად
AEN: in a straight line at constant speed

--- easy lorentz
KA: პროტონი ($v = 10^5\ \text{მ/წმ}$) $0{,}01\ \text{ტლ}$ ველში პერპენდიკულარულად შევიდა. იპოვეთ წრის რადიუსი.
EN: A proton ($v = 10^5\ \text{m/s}$) enters a $0.01\ \text{T}$ field perpendicularly. Find the radius of its circle.
HKA: $r = \dfrac{m v}{q B}$.
HEN: $r = \dfrac{m v}{q B}$.
SKA: $r = \dfrac{1{,}67 \cdot 10^{-27} \cdot 10^5}{1{,}6 \cdot 10^{-19} \cdot 0{,}01} \approx 0{,}104\ \text{მ}$
SEN: $r = \dfrac{1.67 \times 10^{-27} \cdot 10^5}{1.6 \times 10^{-19} \cdot 0.01} \approx 0.104\ \text{m}$
AKA: $\approx 10\ \text{სმ}$
AEN: $\approx 10\ \text{cm}$

--- easy lorentz
KA: ჩრდილოეთის ციალი (ავრორა) პოლუსების ახლოს ჩნდება. რატომ იქ?
EN: Auroras appear near the poles. Why there?
HKA: დამუხტული ნაწილაკები ველის ხაზების გარშემო „იხვევა“.
HEN: Charged particles spiral round the field lines.
SKA: მზის ქარის დამუხტული ნაწილაკები დედამიწის მაგნიტურ ველში ხაზების გარშემო სპირალურად მოძრაობენ და ხაზებს პოლუსებისკენ მიჰყვებიან, სადაც ატმოსფეროს უახლოვდებიან და მის ატომებს ანათებენ.
SEN: Charged particles from the solar wind spiral round the Earth's field lines and follow them towards the poles, where they reach the atmosphere and make its atoms glow.
AKA: ნაწილაკები ველის ხაზებს პოლუსებისკენ მიჰყვება
AEN: the particles follow the field lines to the poles

--- easy lorentz
KA: ელექტრონი და პროტონი ერთი სიჩქარით ერთ ველში პერპენდიკულარულად შედის. რომლის ტრაექტორიის რადიუსია მეტი?
EN: An electron and a proton enter the same field perpendicularly at the same speed. Which has the larger radius?
HKA: $r \sim m$.
HEN: $r \sim m$.
SKA: პროტონის — მისი მასა $\approx 1836$-ჯერ მეტია, ამდენჯერვე მეტია რადიუსიც. ისინი საპირისპირო მიმართულებით ბრუნავენ.
SEN: The proton's — its mass is $\approx 1836$ times larger, and so is its radius. They also circle in opposite directions.
AKA: პროტონის, $\approx 1836$-ჯერ
AEN: the proton's, $\approx 1836$ times

--- easy lorentz
KA: ალფა ნაწილაკი ($q = 3{,}2 \cdot 10^{-19}\ \text{კ}$) $10^6\ \text{მ/წმ}$-ით $0{,}5\ \text{ტლ}$ ველთან $30°$-ით მოძრაობს. იპოვეთ ძალა.
EN: An alpha particle ($q = 3.2 \times 10^{-19}\ \text{C}$) moves at $10^6\ \text{m/s}$ at $30°$ to a $0.5\ \text{T}$ field. Find the force.
HKA: $F = q v B \sin\alpha$.
HEN: $F = q v B \sin\alpha$.
SKA: $F = 3{,}2 \cdot 10^{-19} \cdot 10^6 \cdot 0{,}5 \cdot 0{,}5 = 8 \cdot 10^{-14}\ \text{ნ}$
SEN: $F = 3.2 \times 10^{-19} \cdot 10^6 \cdot 0.5 \cdot 0.5 = 8 \times 10^{-14}\ \text{N}$
AKA: $8 \cdot 10^{-14}\ \text{ნ}$
AEN: $8 \times 10^{-14}\ \text{N}$

--- easy lorentz
KA: რატომ არის ელექტრონულ-სხივური მილაკის (ძველი ტელევიზორის) ეკრანთან მაგნიტის მიტანა გამოსახულების დამახინჯების მიზეზი?
EN: Why does bringing a magnet near an old cathode-ray TV screen distort the picture?
HKA: ელექტრონულ სხივზე ლორენცის ძალა.
HEN: The Lorentz force on the electron beam.
SKA: სურათს ელექტრონების სხივი „ხატავს“. მაგნიტის ველი ელექტრონებზე ლორენცის ძალით მოქმედებს და სხივს გადახრის — გამოსახულება იღუნება და ფერები იცვლება.
SEN: The picture is "drawn" by an electron beam. The magnet's field pushes the electrons with the Lorentz force and bends the beam — the image warps and the colours shift.
AKA: სხივი ლორენცის ძალით გადაიხრება
AEN: the beam is deflected by the Lorentz force

--- medium lorentz
KA: ელექტრონი $1000\ \text{ვ}$-ით აჩქარებულია და $5\ \text{მტლ}$ ველში პერპენდიკულარულად შედის. იპოვეთ რადიუსი.
EN: An electron accelerated through $1000\ \text{V}$ enters a $5\ \text{mT}$ field perpendicularly. Find the radius.
HKA: $v = \sqrt{\dfrac{2eU}{m}}$, $r = \dfrac{m v}{e B}$.
HEN: $v = \sqrt{\dfrac{2eU}{m}}$, $r = \dfrac{m v}{e B}$.
SKA: $v = \sqrt{\dfrac{2 \cdot 1{,}6 \cdot 10^{-16}}{9{,}1 \cdot 10^{-31}}} \approx 1{,}88 \cdot 10^7\ \text{მ/წმ}$
$r = \dfrac{9{,}1 \cdot 10^{-31} \cdot 1{,}88 \cdot 10^7}{1{,}6 \cdot 10^{-19} \cdot 5 \cdot 10^{-3}} \approx 2{,}1 \cdot 10^{-2}\ \text{მ}$
SEN: $v = \sqrt{\dfrac{2 \cdot 1.6 \times 10^{-16}}{9.1 \times 10^{-31}}} \approx 1.88 \times 10^7\ \text{m/s}$
$r = \dfrac{9.1 \times 10^{-31} \cdot 1.88 \times 10^7}{1.6 \times 10^{-19} \cdot 5 \times 10^{-3}} \approx 2.1 \times 10^{-2}\ \text{m}$
AKA: $\approx 2{,}1\ \text{სმ}$
AEN: $\approx 2.1\ \text{cm}$

--- medium lorentz
KA: იპოვეთ ელექტრონის ბრუნვის პერიოდი და სიხშირე $0{,}01\ \text{ტლ}$ ველში.
EN: Find the period and frequency of an electron circling in a $0.01\ \text{T}$ field.
HKA: $T = \dfrac{2\pi m}{e B}$ — სიჩქარეზე არ არის დამოკიდებული.
HEN: $T = \dfrac{2\pi m}{e B}$ — independent of speed.
SKA: $T = \dfrac{2\pi \cdot 9{,}1 \cdot 10^{-31}}{1{,}6 \cdot 10^{-19} \cdot 0{,}01} \approx 3{,}6 \cdot 10^{-9}\ \text{წმ}$, $\ \nu \approx 2{,}8 \cdot 10^8\ \text{ჰც}$
SEN: $T = \dfrac{2\pi \cdot 9.1 \times 10^{-31}}{1.6 \times 10^{-19} \cdot 0.01} \approx 3.6 \times 10^{-9}\ \text{s}$, $\ f \approx 2.8 \times 10^8\ \text{Hz}$
AKA: $\approx 3{,}6\ \text{ნწმ}$; $\approx 280\ \text{მჰც}$
AEN: $\approx 3.6\ \text{ns}$; $\approx 280\ \text{MHz}$

--- medium lorentz
KA: პროტონი $5\ \text{სმ}$ რადიუსის წრეზე $0{,}2\ \text{ტლ}$ ველში მოძრაობს. იპოვეთ მისი სიჩქარე და კინეტიკური ენერგია ევ-ებში.
EN: A proton moves on a $5\ \text{cm}$ circle in a $0.2\ \text{T}$ field. Find its speed and kinetic energy in eV.
HKA: $v = \dfrac{q B r}{m}$.
HEN: $v = \dfrac{q B r}{m}$.
SKA: $v = \dfrac{1{,}6 \cdot 10^{-19} \cdot 0{,}2 \cdot 0{,}05}{1{,}67 \cdot 10^{-27}} \approx 9{,}6 \cdot 10^5\ \text{მ/წმ}$
$E = \dfrac{1{,}67 \cdot 10^{-27} \cdot 9{,}2 \cdot 10^{11}}{2} \approx 7{,}7 \cdot 10^{-16}\ \text{ჯ} \approx 4{,}8\ \text{კევ}$
SEN: $v = \dfrac{1.6 \times 10^{-19} \cdot 0.2 \cdot 0.05}{1.67 \times 10^{-27}} \approx 9.6 \times 10^5\ \text{m/s}$
$E = \dfrac{1.67 \times 10^{-27} \cdot 9.2 \times 10^{11}}{2} \approx 7.7 \times 10^{-16}\ \text{J} \approx 4.8\ \text{keV}$
AKA: $\approx 9{,}6 \cdot 10^5\ \text{მ/წმ}$; $\approx 4{,}8\ \text{კევ}$
AEN: $\approx 9.6 \times 10^5\ \text{m/s}$; $\approx 4.8\ \text{keV}$

--- medium lorentz
KA: სიჩქარის სელექტორში $E = 10^4\ \text{ვ/მ}$ და $B = 0{,}02\ \text{ტლ}$ (ურთიერთპერპენდიკულარული). რა სიჩქარის ნაწილაკები გაივლის გადაუხრელად?
EN: A velocity selector has $E = 10^4\ \text{V/m}$ and $B = 0.02\ \text{T}$ at right angles. What speed passes undeflected?
HKA: $q E = q v B$.
HEN: $q E = q v B$.

KA: რა მაგნიტური ველი „დაიჭერს“ $10\ \text{მევ}$ პროტონს $1\ \text{მ}$ რადიუსის წრეზე?

--- medium lorentz
KA: ჰოლის ეფექტი: დენიან ფირფიტაში მაგნიტური ველი ელექტრონებს ერთ კიდესკენ გადახრის. რა შედეგი აქვს ამას? სად გამოიყენება?
EN: The Hall effect: in a current-carrying strip a magnetic field pushes electrons to one edge. What is the result? Where is it used?
HKA: კიდეებს შორის ძაბვა ჩნდება.
HEN: A voltage appears across the edges.
SKA: ელექტრონები ერთ კიდეზე გროვდება, მეორეზე მათი ნაკლებობაა — კიდეებს შორის ჩნდება „ჰოლის ძაბვა“, რომელიც $B$-ს პროპორციულია.
გამოიყენება მაგნიტური ველის საზომებში (ტესლამეტრი), ტელეფონის კომპასში, მოძრაობის სენსორებში.
SEN: Electrons pile up on one edge and are depleted on the other — a "Hall voltage" proportional to $B$ appears across the strip.

AKA: კიდეებს შორის ძაბვა $\sim B$; სენსორები

--- medium lorentz
KA: ელექტრონის სიჩქარის მდგენელი ველის გასწვრივ $10^6\ \text{მ/წმ}$-ია, პერპენდიკულარული — $2 \cdot 10^6\ \text{მ/წმ}$. $B = 10^{-3}\ \text{ტლ}$. აღწერეთ ტრაექტორია, იპოვეთ რადიუსი.
EN: An electron's velocity component along the field is $10^6\ \text{m/s}$ and perpendicular to it $2 \times 10^6\ \text{m/s}$; $B = 10^{-3}\ \text{T}$. Describe the path and find its radius.

SKA: ტრაექტორია — სპირალი (ჰელიქსი).

AKA: სპირალი; $\approx 1{,}1\ \text{სმ}$
AEN: a helix; $\approx 1.1\ \text{cm}$

--- medium ampere
KA: ელექტროძრავის ჩარჩოს ($N = 200$, $S = 50\ \text{სმ}^2$) $0{,}5\ \text{ტლ}$ ველში $1\ \text{ნ·მ}$ მაქსიმალური მომენტი უნდა ჰქონდეს. რა დენია საჭირო?

--- hard lorentz
KA: ელექტრონი $10^7\ \text{მ/წმ}$-ით შედის $B = 2\ \text{მტლ}$ ველის ზოლში ($d = 2\ \text{სმ}$) კიდის პერპენდიკულარულად. რა კუთხით გადაიხრება გამოსვლისას?

KA: ელექტრონი $0{,}01\ \text{ტლ}$ ველში $10^7\ \text{მ/წმ}$-ით, ველთან $60°$-ით შევიდა. იპოვეთ სპირალის რადიუსი და ბიჯი.

KA: ციკლოტრონში ($B = 1{,}5\ \text{ტლ}$) დეიტრონები ($m = 3{,}34 \cdot 10^{-27}\ \text{კგ}$) აჩქარდება. რა სიხშირის ცვლადი ძაბვა სჭირდება?
EN: In a cyclotron ($B = 1.5\ \text{T}$) deuterons ($m = 3.34 \times 10^{-27}\ \text{kg}$) are accelerated. What frequency must the alternating voltage have?

KA: მასსპექტრომეტრში იონები ($q = e$) $1\ \text{კვ}$-ით აჩქარდება და $0{,}2\ \text{ტლ}$ ველში ნახევარწრეს შემოწერს. ფოტოფირზე ორი ხაზი $0{,}9\ \text{სმ}$-ითაა დაშორებული. ერთი ხაზი $^{24}\text{Mg}^+$-ია. რა მასის იონია მეორე (მეტი რადიუსით)?

$r_2 = 0.1116 + 0.0045 = 0.1161\ \text{m}$; $\ \dfrac{m_2}{24} = \left(\dfrac{0.1161}{0.1116}\right)^2 \approx 1.082 \Rightarrow m_2 \approx 26$ — $^{26}\text{Mg}$.

AEN: $26$ ($^{26}\text{Mg}$)

--- hard lorentz
KA: მაგნიტური ველი $B$ და ელექტრული ველი $E$ ერთი მიმართულებისაა. ნაწილაკი უძრაობიდან იწყებს მოძრაობას. როგორი იქნება ტრაექტორია? თუ საწყისი სიჩქარე ველების პერპენდიკულარულია?
EN: Magnetic field $B$ and electric field $E$ point the same way. A particle starts from rest. What is its path? And if its initial velocity is perpendicular to the fields?
HKA: ველის გასწვრივ მოძრაობაზე $B$ არ მოქმედებს.
HEN: $B$ doesn't act on motion along the field.
SKA: უძრაობიდან: მხოლოდ $E$ აჩქარებს ველის გასწვრივ — სწორი ხაზი.
პერპენდიკულარული სიჩქარით: $B$ წრეზე აბრუნებს, $E$ ველის გასწვრივ აჩქარებს — სპირალი, რომლის ბიჯი თანდათან იზრდება.
SEN: From rest: only $E$ acts, accelerating it along the field — a straight line.

KA: ორი იონი ($q_1 = e$, $m_1$ და $q_2 = 2e$, $m_2 = 2m_1$) ერთი სიჩქარით შედის ერთ ველში. რომლის რადიუსია მეტი?
EN: Two ions ($q_1 = e$, $m_1$ and $q_2 = 2e$, $m_2 = 2m_1$) enter the same field at the same speed. Which has the larger radius?

--- hard lorentz olympiad
KA: მაგნიტური ბოთლი: დამუხტული ნაწილაკი ველის ხაზების გარშემო სპირალურად მოძრაობს, ველი ბოლოებში ძლიერდება. რატომ „აირეკლება“ ნაწილაკი ძლიერი ველის არიდან? (თვისობრივად)
EN: Magnetic bottle: a charged particle spirals round the field lines, and the field gets stronger towards the ends. Why is the particle "reflected" from the strong-field region? (Qualitatively.)
HKA: იქ, სადაც ხაზები იკუმშება, ლორენცის ძალას აქვს ხაზების გასწვრივ (ძლიერი ველისგან მიმართული) მდგენელი.
HEN: Where the lines converge the Lorentz force gets a component along the lines, pointing away from the strong field.
SKA: ძლიერი ველისკენ ხაზები იკუმშება. ლორენცის ძალა ($\perp \vec B$) ამ დახრილ ველში ღერძის გასწვრივ მდგენელს იძენს, რომელიც ნაწილაკს აკავებს.
ამავდროულად კინეტიკური ენერგია მუდმივია: $v_{\perp}$ იზრდება, $v_{\parallel}$ მცირდება ნულამდე — ნაწილაკი უკან ბრუნდება. ასეა დაჭერილი ნაწილაკები დედამიწის რადიაციულ სარტყლებში.
SEN: Towards the strong field the lines converge. In this tilted field the Lorentz force ($\perp \vec B$) gains a component along the axis that holds the particle back.
The kinetic energy stays constant: $v_{\perp}$ grows and $v_{\parallel}$ falls to zero — the particle turns back. This is how particles are trapped in the Earth's radiation belts.
AKA: ღერძული მდგენელი აკავებს; $v_{\parallel} \to 0$
AEN: an axial force component holds it back; $v_{\parallel} \to 0$

--- hard lorentz olympiad
KA: დამუხტული ნაწილაკი ($m$, $q$) უძრაობიდან იწყებს მოძრაობას ურთიერთპერპენდიკულარულ ველებში $\vec E \perp \vec B$. აჩვენეთ, რომ მისი საშუალო („დრეიფის“) სიჩქარეა $\dfrac{E}{B}$ და ის $\vec E$-ისა და $\vec B$-ს პერპენდიკულარულადაა მიმართული.
EN: A charged particle ($m$, $q$) starts from rest in crossed fields $\vec E \perp \vec B$. Show that its average ("drift") velocity is $\dfrac{E}{B}$, perpendicular to both $\vec E$ and $\vec B$.
HKA: გადადით სისტემაში, რომელიც $u = \dfrac{E}{B}$ სიჩქარით მოძრაობს — იქ ელექტრული ველი ქრება.
HEN: Move to a frame travelling at $u = \dfrac{E}{B}$ — in it the electric field vanishes.
SKA: $u = \dfrac{E}{B}$ სიჩქარით მოძრავ სისტემაში ლორენცის ძალა $q u B = q E$ აბათილებს ელექტრულს — დარჩა მხოლოდ $B$.
ამ სისტემაში ნაწილაკს საწყისი სიჩქარე $u$ აქვს და თანაბრად ბრუნავს წრეზე. დედამიწის სისტემაში: წრე + თანაბარი მოძრაობა $u$-თი — ციკლოიდა; საშუალო სიჩქარე $\dfrac{E}{B}$.
SEN: In a frame moving at $u = \dfrac{E}{B}$ the Lorentz force $q u B = q E$ cancels the electric force — only $B$ remains.
There the particle starts with speed $u$ and circles uniformly. In the lab frame: a circle plus uniform motion at $u$ — a cycloid, with average velocity $\dfrac{E}{B}$.
AKA: ციკლოიდა, საშუალო სიჩქარე $\dfrac{E}{B}$
AEN: a cycloid, average velocity $\dfrac{E}{B}$

--- hard lorentz olympiad
KA: ელექტრონი $B$ ველში წრეზე ბრუნავს და ყოველ ბრუნზე ენერგიის მცირე ნაწილს გამოსხივებით კარგავს. როგორ იცვლება მისი წრის რადიუსი და ბრუნვის პერიოდი (არარელატივისტურად)?
EN: An electron circling in a field $B$ loses a little energy each turn by radiation. How do its radius and period change (non-relativistically)?
HKA: $r \sim v$, $T$ არ არის დამოკიდებული $v$-ზე.
HEN: $r \sim v$; $T$ doesn't depend on $v$.
SKA: სიჩქარე მცირდება — რადიუსი თანდათან მცირდება (სპირალი შიგნით).
პერიოდი $T = \dfrac{2\pi m}{e B}$ არ იცვლება.
SEN: The speed falls — so the radius slowly shrinks (an inward spiral).
The period $T = \dfrac{2\pi m}{e B}$ stays the same.
AKA: რადიუსი მცირდება; პერიოდი იგივე
AEN: the radius shrinks; the period is unchanged

--- hard lorentz olympiad
KA: ერთგვაროვანი მაგნიტური ველი ($B = 0{,}1\ \text{ტლ}$) $R = 5\ \text{სმ}$ რადიუსის წრიულ არეშია. პროტონი არის ცენტრისკენ შედის. რა სიჩქარისას გამოვა ის თავდაპირველი მიმართულების პერპენდიკულარულად?
EN: A uniform field ($B = 0.1\ \text{T}$) fills a circular region of radius $R = 5\ \text{cm}$. A proton enters aimed at the centre. At what speed does it leave at right angles to its original direction?
HKA: $90°$-ით გადახრისას ტრაექტორიის რადიუსი ველიანი წრის რადიუსის ტოლია: $r = R$.
HEN: For a $90°$ turn the orbit radius equals the region's radius: $r = R$.
SKA: გეომეტრიიდან ($90°$ გადახრა, ცენტრისკენ შესვლა): $r = R \tan 45° = R = 0{,}05\ \text{მ}$
$v = \dfrac{e B r}{m} = \dfrac{1{,}6 \cdot 10^{-19} \cdot 0{,}1 \cdot 0{,}05}{1{,}67 \cdot 10^{-27}} \approx 4{,}8 \cdot 10^5\ \text{მ/წმ}$
SEN: From the geometry ($90°$ turn, entering towards the centre): $r = R \tan 45° = R = 0.05\ \text{m}$
$v = \dfrac{e B r}{m} = \dfrac{1.6 \times 10^{-19} \cdot 0.1 \cdot 0.05}{1.67 \times 10^{-27}} \approx 4.8 \times 10^5\ \text{m/s}$
AKA: $\approx 4{,}8 \cdot 10^5\ \text{მ/წმ}$
AEN: $\approx 4.8 \times 10^5\ \text{m/s}$

--- easy induction
KA: ჩარჩოს ($S = 0{,}04\ \text{მ}^2$) გამჭოლი ველი $0{,}5\ \text{ტლ}$-ია, ზედაპირის პერპენდიკულარულად. იპოვეთ მაგნიტური ნაკადი.
EN: A field of $0.5\ \text{T}$ passes perpendicularly through a loop of area $0.04\ \text{m}^2$. Find the flux.
HKA: $\Phi = B S$.
HEN: $\Phi = B S$.
SKA: $\Phi = 0{,}5 \cdot 0{,}04 = 0{,}02\ \text{ვბ}$
SEN: $\Phi = 0.5 \cdot 0.04 = 0.02\ \text{Wb}$
AKA: $0{,}02\ \text{ვბ}$
AEN: $0.02\ \text{Wb}$

--- easy induction
KA: ხვიაში ნაკადი $0{,}1\ \text{წმ}$-ში $0{,}02$-დან $0{,}05\ \text{ვბ}$-მდე გაიზარდა. იპოვეთ ინდუქციის ემძ.
EN: The flux through a loop rises from $0.02$ to $0.05\ \text{Wb}$ in $0.1\ \text{s}$. Find the induced EMF.
HKA: $\mathcal{E} = \dfrac{\Delta\Phi}{\Delta t}$.
HEN: $\mathcal{E} = \dfrac{\Delta\Phi}{\Delta t}$.
SKA: $\mathcal{E} = \dfrac{0{,}03}{0{,}1} = 0{,}3\ \text{ვ}$
SEN: $\mathcal{E} = \dfrac{0.03}{0.1} = 0.3\ \text{V}$
AKA: $0{,}3\ \text{ვ}$
AEN: $0.3\ \text{V}$

--- easy induction
KA: რა არის ელექტრომაგნიტური ინდუქციის მოვლენა? ვინ აღმოაჩინა?
EN: What is electromagnetic induction? Who discovered it?
HKA: ცვლადი მაგნიტური ნაკადი.
HEN: A changing magnetic flux.
SKA: ჩაკეტილ გამტარში დენის წარმოქმნა მასში გამავალი მაგნიტური ნაკადის ცვლილებისას. აღმოაჩინა მაიკლ ფარადეიმ 1831 წელს.
SEN: The production of a current in a closed conductor when the magnetic flux through it changes. Discovered by Michael Faraday in 1831.
AKA: ნაკადის ცვლილებით დენის წარმოქმნა; ფარადეი
AEN: a current produced by a changing flux; Faraday

--- easy induction
KA: მაგნიტი ხვიაში უძრავად დევს. არის თუ არა ხვიაში დენი? რა უნდა გავაკეთოთ, რომ გაჩნდეს?
EN: A magnet sits still inside a coil. Is there a current in the coil? What must be done to make one?
HKA: საჭიროა ნაკადის ცვლილება.
HEN: The flux must change.
SKA: არა — ნაკადი არ იცვლება. დენი გაჩნდება, თუ მაგნიტს ან ხვიას ვამოძრავებთ, ან ველს შევცვლით.
SEN: No — the flux isn't changing. A current appears if the magnet or the coil moves, or the field changes.
AKA: არა; მაგნიტი უნდა ვამოძრაოთ
AEN: no; the magnet must be moved

--- easy induction
KA: ჩამოაყალიბეთ ლენცის წესი.
EN: State Lenz's law.
HKA: ინდუქციური დენი ცვლილებას ეწინააღმდეგება.
HEN: The induced current opposes the change.
SKA: ინდუქციური დენი ისეა მიმართული, რომ მისი მაგნიტური ველი ეწინააღმდეგება იმ ნაკადის ცვლილებას, რომელმაც ის გამოიწვია.
SEN: The induced current flows in such a direction that its magnetic field opposes the change in flux that produced it.
AKA: ინდუქციური დენი ეწინააღმდეგება ნაკადის ცვლილებას
AEN: the induced current opposes the change in flux

--- easy induction
KA: $200$-ხვიან კოჭაში ნაკადი $0{,}5\ \text{წმ}$-ში $0{,}01\ \text{ვბ}$-ით შეიცვალა. იპოვეთ ემძ.
EN: The flux through a $200$-turn coil changes by $0.01\ \text{Wb}$ in $0.5\ \text{s}$. Find the EMF.
HKA: $\mathcal{E} = N\dfrac{\Delta\Phi}{\Delta t}$.
HEN: $\mathcal{E} = N\dfrac{\Delta\Phi}{\Delta t}$.
SKA: $\mathcal{E} = 200 \cdot \dfrac{0{,}01}{0{,}5} = 4\ \text{ვ}$
SEN: $\mathcal{E} = 200 \cdot \dfrac{0.01}{0.5} = 4\ \text{V}$
AKA: $4\ \text{ვ}$
AEN: $4\ \text{V}$

--- easy induction
KA: $1\ \text{მ}$ ღერო $10\ \text{მ/წმ}$-ით მოძრაობს $0{,}2\ \text{ტლ}$ ველში (ყველაფერი ურთიერთპერპენდიკულარულია). იპოვეთ ემძ.
EN: A $1\ \text{m}$ rod moves at $10\ \text{m/s}$ in a $0.2\ \text{T}$ field (all mutually perpendicular). Find the EMF.
HKA: $\mathcal{E} = B l v$.
HEN: $\mathcal{E} = B l v$.
SKA: $\mathcal{E} = 0{,}2 \cdot 1 \cdot 10 = 2\ \text{ვ}$
SEN: $\mathcal{E} = 0.2 \cdot 1 \cdot 10 = 2\ \text{V}$
AKA: $2\ \text{ვ}$
AEN: $2\ \text{V}$

--- easy induction
KA: ჩარჩოს ($S = 0{,}1\ \text{მ}^2$) ნორმალი $0{,}4\ \text{ტლ}$ ველთან $60°$-ს ქმნის. იპოვეთ ნაკადი.
EN: The normal to a loop ($S = 0.1\ \text{m}^2$) is at $60°$ to a $0.4\ \text{T}$ field. Find the flux.
HKA: $\Phi = B S \cos\alpha$.
HEN: $\Phi = B S \cos\alpha$.
SKA: $\Phi = 0{,}4 \cdot 0{,}1 \cdot 0{,}5 = 0{,}02\ \text{ვბ}$
SEN: $\Phi = 0.4 \cdot 0.1 \cdot 0.5 = 0.02\ \text{Wb}$
AKA: $0{,}02\ \text{ვბ}$
AEN: $0.02\ \text{Wb}$

--- easy induction
KA: როგორ მუშაობს ელექტროგენერატორი?
EN: How does an electric generator work?
HKA: მბრუნავი ჩარჩო მაგნიტურ ველში.
HEN: A coil spinning in a magnetic field.
SKA: მაგნიტურ ველში მბრუნავ ჩარჩოში ნაკადი პერიოდულად იცვლება — წარმოიქმნება ცვლადი ინდუქციური ემძ. მექანიკური ენერგია ელექტრულად იქცევა.
SEN: In a coil spinning in a magnetic field the flux changes periodically, producing an alternating induced EMF. Mechanical energy becomes electrical.
AKA: ნაკადის ცვლილება მბრუნავ ჩარჩოში
AEN: the changing flux in a spinning coil

--- easy induction
KA: მაგნიტის ჩრდილოეთ პოლუსი რგოლს შორდება. როგორი იქნება რგოლის ახლო მხარე — ჩრდილოეთი თუ სამხრეთი? იზიდავს თუ განიზიდავს რგოლი მაგნიტს?
EN: A magnet's north pole moves away from a ring. Is the near face of the ring north or south? Does the ring attract or repel the magnet?
HKA: ლენცი: ცვლილებას ეწინააღმდეგება — „არ უშვებს“.
HEN: Lenz: it opposes the change — "holds it back".
SKA: ნაკადი მცირდება; რგოლი ცდილობს შეინარჩუნოს — ახლო მხარე სამხრეთი იქნება და მაგნიტს **მიიზიდავს**.
SEN: The flux decreases; the ring tries to keep it — its near face becomes a south pole and **attracts** the magnet.
AKA: სამხრეთი; მიიზიდავს
AEN: south; attracts

--- easy induction
KA: ინდუქციის ემძ $2$-ჯერ იზრდება, თუ: ა) ნაკადის ცვლილება $2$-ჯერ სწრაფია; ბ) ხვიების რიცხვი $2$-ჯერ მეტია. სწორია?
EN: Does the induced EMF double if: a) the flux changes twice as fast; b) the number of turns is doubled?
HKA: $\mathcal{E} = N\dfrac{\Delta\Phi}{\Delta t}$.
HEN: $\mathcal{E} = N\dfrac{\Delta\Phi}{\Delta t}$.
SKA: ორივე სწორია — ემძ $N$-ის და ნაკადის ცვლილების სიჩქარის პროპორციულია.
SEN: Both are right — the EMF is proportional to $N$ and to the rate of change of flux.
AKA: ორივე სწორია
AEN: both are true

--- easy induction
KA: ნაკადის ერთეულია ვებერი. გამოსახეთ ის ტესლით და მ²-ით; ვოლტით და წამით.
EN: The unit of flux is the weber. Express it in tesla and m²; in volts and seconds.
HKA: $\Phi = BS$; $\mathcal{E} = \dfrac{\Delta\Phi}{\Delta t}$.
HEN: $\Phi = BS$; $\mathcal{E} = \dfrac{\Delta\Phi}{\Delta t}$.
SKA: $1\ \text{ვბ} = 1\ \text{ტლ} \cdot \text{მ}^2 = 1\ \text{ვ} \cdot \text{წმ}$
SEN: $1\ \text{Wb} = 1\ \text{T} \cdot \text{m}^2 = 1\ \text{V} \cdot \text{s}$
AKA: $\text{ტლ·მ}^2 = \text{ვ·წმ}$
AEN: $\text{T·m}^2 = \text{V·s}$

--- easy induction
KA: გენერატორის ემძ $e = 100\sin(100\pi t)$ ვ. იპოვეთ ამპლიტუდა, სიხშირე და პერიოდი.
EN: A generator's EMF is $e = 100\sin(100\pi t)$ V. Find the amplitude, frequency and period.
HKA: $e = \mathcal{E}_0 \sin(2\pi\nu t)$.
HEN: $e = \mathcal{E}_0 \sin(2\pi f t)$.
SKA: $\mathcal{E}_0 = 100\ \text{ვ}$, $\ \nu = 50\ \text{ჰც}$, $\ T = 0{,}02\ \text{წმ}$
SEN: $\mathcal{E}_0 = 100\ \text{V}$, $\ f = 50\ \text{Hz}$, $\ T = 0.02\ \text{s}$
AKA: $100\ \text{ვ}$; $50\ \text{ჰც}$; $0{,}02\ \text{წმ}$
AEN: $100\ \text{V}$; $50\ \text{Hz}$; $0.02\ \text{s}$

--- easy induction
KA: რატომ ამზადებენ ტრანსფორმატორის გულს თხელი იზოლირებული ფირფიტებისგან და არა მთლიანი რკინისგან?
EN: Why are transformer cores made of thin insulated sheets rather than solid iron?
HKA: ფუკოს (გრიგალური) დენები.
HEN: Eddy currents.
SKA: ცვლადი ველი მთლიან რკინაში დიდ გრიგალურ დენებს აღძრავს, რომლებიც გულს ათბობენ (ენერგიის დანაკარგი). თხელი იზოლირებული ფირფიტები ამ დენებს ზღუდავს.
SEN: A changing field drives large eddy currents in solid iron, which heat the core (wasted energy). Thin insulated sheets restrict these currents.
AKA: გრიგალური დენების შესამცირებლად
AEN: to reduce eddy currents

--- medium induction
KA: კოჭა ($N = 100$, $S = 50\ \text{სმ}^2$, $R = 5\ \text{ომი}$) ველის პერპენდიკულარულია. ველი $0{,}1\ \text{წმ}$-ში $0$-დან $0{,}5\ \text{ტლ}$-მდე იზრდება. იპოვეთ ემძ, დენი და გამავალი მუხტი.
EN: A coil ($N = 100$, $S = 50\ \text{cm}^2$, $R = 5\ \Omega$) is perpendicular to a field that rises from $0$ to $0.5\ \text{T}$ in $0.1\ \text{s}$. Find the EMF, current and charge passed.
HKA: $q = \dfrac{N\Delta\Phi}{R}$.
HEN: $q = \dfrac{N\Delta\Phi}{R}$.
SKA: $\Delta\Phi = 0{,}5 \cdot 0{,}005 = 2{,}5 \cdot 10^{-3}\ \text{ვბ}$
$\mathcal{E} = \dfrac{100 \cdot 2{,}5 \cdot 10^{-3}}{0{,}1} = 2{,}5\ \text{ვ}$, $\ I = 0{,}5\ \text{ა}$, $\ q = 0{,}05\ \text{კ}$
SEN: $\Delta\Phi = 0.5 \cdot 0.005 = 2.5 \times 10^{-3}\ \text{Wb}$
$\mathcal{E} = \dfrac{100 \cdot 2.5 \times 10^{-3}}{0.1} = 2.5\ \text{V}$, $\ I = 0.5\ \text{A}$, $\ q = 0.05\ \text{C}$
AKA: $2{,}5\ \text{ვ}$; $0{,}5\ \text{ა}$; $0{,}05\ \text{კ}$

გაჭრილი რგოლი: ემძ არის, მაგრამ დენი არ გადის — ძალა არ არის, რგოლი უძრავია.

AEN: $\approx 25\ \text{A}$

--- hard induction
KA: ორი რელსი $30°$-ით დახრილია, მათ შორის $l = 0{,}4\ \text{მ}$, $R = 0{,}2\ \text{ომი}$; ვერტიკალური ველი $B = 0{,}5\ \text{ტლ}$. $m = 50\ \text{გ}$ ღერო უხახუნოდ სრიალებს. იპოვეთ დამყარებული სიჩქარე.
EN: Two rails are inclined at $30°$, $l = 0.4\ \text{m}$ apart, $R = 0.2\ \Omega$; the field $B = 0.5\ \text{T}$ is vertical. A $50\ \text{g}$ rod slides down without friction. Find its terminal speed.
HKA: ემძ $B l v\cos\alpha$; ჰორიზონტალური ამპერის ძალის მდგენელი სიბრტყის გასწვრივ $F\cos\alpha$.
HEN: The EMF is $B l v\cos\alpha$; the horizontal Ampère force has component $F\cos\alpha$ along the incline.
SKA: $\dfrac{B^2 l^2 v\cos^2\alpha}{R} = m g\sin\alpha$
$v = \dfrac{0{,}5 \cdot 0{,}5 \cdot 0{,}2}{0{,}25 \cdot 0{,}16 \cdot 0{,}75} = \dfrac{0{,}05}{0{,}03} \approx 1{,}67\ \text{მ/წმ}$
SEN: $\dfrac{B^2 l^2 v\cos^2\alpha}{R} = m g\sin\alpha$
$v = \dfrac{0.5 \cdot 0.5 \cdot 0.2}{0.25 \cdot 0.16 \cdot 0.75} = \dfrac{0.05}{0.03} \approx 1.67\ \text{m/s}$
AKA: $\approx 1{,}7\ \text{მ/წმ}$
AEN: $\approx 1.7\ \text{m/s}$

--- hard induction
KA: ჩარჩო ($N = 100$, $S = 0{,}01\ \text{მ}^2$) მიერთებულია ბალისტიკურ გალვანომეტრთან ($R_{\text{სრ}} = 50\ \text{ომი}$). როცა ჩარჩო ველიდან ამოიღეს, $2 \cdot 10^{-4}\ \text{კ}$ მუხტი გავიდა. იპოვეთ $B$.
EN: A coil ($N = 100$, $S = 0.01\ \text{m}^2$) is connected to a ballistic galvanometer (total $R = 50\ \Omega$). When it is pulled out of a field, $2 \times 10^{-4}\ \text{C}$ flows. Find $B$.
HKA: $q = \dfrac{N B S}{R}$.
HEN: $q = \dfrac{N B S}{R}$.
SKA: $B = \dfrac{q R}{N S} = \dfrac{2 \cdot 10^{-4} \cdot 50}{1} = 0{,}01\ \text{ტლ}$
SEN: $B = \dfrac{q R}{N S} = \dfrac{2 \times 10^{-4} \cdot 50}{1} = 0.01\ \text{T}$
AKA: $0{,}01\ \text{ტლ}$
AEN: $0.01\ \text{T}$

--- hard induction
KA: ჩარჩო ($S = 0{,}04\ \text{მ}^2$, $N = 20$, $R = 2\ \text{ომი}$) $0{,}5\ \text{ტლ}$ ველში $\omega = 50\ \text{რად/წმ}$-ით ბრუნავს და დახურულია. იპოვეთ საშუალო სიმძლავრე, რომელიც ბრუნვის შესანარჩუნებლად არის საჭირო.
EN: A closed coil ($S = 0.04\ \text{m}^2$, $N = 20$, $R = 2\ \Omega$) spins at $\omega = 50\ \text{rad/s}$ in a $0.5\ \text{T}$ field. Find the average power needed to keep it turning.
HKA: $P_{\text{საშ}} = \dfrac{\mathcal{E}_0^2}{2R}$.
HEN: $P_{\text{avg}} = \dfrac{\mathcal{E}_0^2}{2R}$.
SKA: $\mathcal{E}_0 = 20 \cdot 0{,}5 \cdot 0{,}04 \cdot 50 = 20\ \text{ვ}$
$P = \dfrac{400}{4} = 100\ \text{ვტ}$
SEN: $\mathcal{E}_0 = 20 \cdot 0.5 \cdot 0.04 \cdot 50 = 20\ \text{V}$
$P = \dfrac{400}{4} = 100\ \text{W}$
AKA: $100\ \text{ვტ}$
AEN: $100\ \text{W}$

--- hard induction
KA: გრძელი სოლენოიდის ($n = 1000\ \text{მ}^{-1}$, $S = 10\ \text{სმ}^2$) გარშემო $10$-ხვიანი კოჭაა. სოლენოიდში დენი $0{,}01\ \text{წმ}$-ში $0$-დან $5\ \text{ა}$-მდე იზრდება. რა ემძ აღიძვრება კოჭაში?
EN: A $10$-turn coil is wound round a long solenoid ($n = 1000\ \text{m}^{-1}$, $S = 10\ \text{cm}^2$). The solenoid current rises from $0$ to $5\ \text{A}$ in $0.01\ \text{s}$. What EMF appears in the coil?
HKA: $\Delta\Phi = \mu_0 n \Delta I S$.
HEN: $\Delta\Phi = \mu_0 n \Delta I S$.
SKA: $\Delta B = 4\pi \cdot 10^{-7} \cdot 1000 \cdot 5 \approx 6{,}28 \cdot 10^{-3}\ \text{ტლ}$
$\mathcal{E} = 10 \cdot \dfrac{6{,}28 \cdot 10^{-3} \cdot 10^{-3}}{0{,}01} \approx 6{,}3 \cdot 10^{-3}\ \text{ვ}$
SEN: $\Delta B = 4\pi \times 10^{-7} \cdot 1000 \cdot 5 \approx 6.28 \times 10^{-3}\ \text{T}$
$\mathcal{E} = 10 \cdot \dfrac{6.28 \times 10^{-3} \cdot 10^{-3}}{0.01} \approx 6.3 \times 10^{-3}\ \text{V}$
AKA: $\approx 6{,}3\ \text{მვ}$
AEN: $\approx 6.3\ \text{mV}$

--- hard induction
KA: ჩარჩო $v$-თი შედის ველის ზოლში, რომლის სიგანე ჩარჩოს სიგრძეზე მეტია. დახაზეთ (სიტყვიერად) დენის $I(t)$ გრაფიკი შესვლისას, ზოლში და გამოსვლისას.
EN: A loop moves at speed $v$ into a strip of field wider than the loop. Describe the current $I(t)$ as it enters, is inside, and leaves.
HKA: დენი მხოლოდ მაშინაა, როცა ნაკადი იცვლება.
HEN: There's current only while the flux is changing.
SKA: შესვლისას — ნაკადი თანაბრად იზრდება: მუდმივი დენი ($I = \dfrac{B l v}{R}$).
სრულად შიგნით — ნაკადი მუდმივია: $I = 0$.
გამოსვლისას — ნაკადი მცირდება: იგივე სიდიდის, საპირისპირო მიმართულების დენი.
SEN: Entering — the flux grows steadily: a constant current ($I = \dfrac{B l v}{R}$).
Fully inside — the flux is constant: $I = 0$.
Leaving — the flux falls: a current of the same size in the opposite direction.
AKA: $+I_0$, $0$, $-I_0$
AEN: $+I_0$, $0$, $-I_0$

--- hard induction olympiad
KA: ღერო ($m$, $l$) ჰორიზონტალურ რელსებზე დევს, რომლებიც $C$ კონდენსატორითაა შეერთებული; ვერტიკალური ველი $B$. ღეროს მუდმივი ძალით $F$ ეწევიან. აჩვენეთ, რომ ის თანაბარაჩქარებულად მოძრაობს და იპოვეთ აჩქარება.
EN: A rod ($m$, $l$) lies on horizontal rails joined by a capacitor $C$, in a vertical field $B$. It is pulled with a constant force $F$. Show that it moves with constant acceleration and find it.
HKA: $q = C B l v$, $I = C B l a$.
HEN: $q = C B l v$, $I = C B l a$.
SKA: კონდენსატორის ძაბვა $B l v$, მუხტი $q = C B l v$, დენი $I = \dfrac{\Delta q}{\Delta t} = C B l a$.
ამპერის ძალა $B I l = C B^2 l^2 a$.
$m a = F - C B^2 l^2 a \Rightarrow a = \dfrac{F}{m + C B^2 l^2}$ — მუდმივი („ეფექტური მასა“ იზრდება).
SEN: The capacitor's voltage is $B l v$, its charge $q = C B l v$ and the current $I = \dfrac{\Delta q}{\Delta t} = C B l a$.
The Ampère force is $B I l = C B^2 l^2 a$.
$m a = F - C B^2 l^2 a \Rightarrow a = \dfrac{F}{m + C B^2 l^2}$ — constant (the "effective mass" grows).
AKA: $a = \dfrac{F}{m + CB^2l^2}$
AEN: $a = \dfrac{F}{m + CB^2l^2}$

--- hard induction olympiad
KA: მაგნიტი სპილენძის ვერტიკალურ მილში ვარდება და სწრაფად აღწევს მუდმივ სიჩქარეს $v$. თუ მილის კედლის სისქეს $2$-ჯერ გავზრდით, როგორ შეიცვლება $v$? (თვისობრივად, $\sim$)
EN: A magnet falling down a vertical copper pipe quickly reaches a steady speed $v$. If the pipe wall thickness is doubled, how does $v$ change? (Qualitatively, by scaling.)
HKA: დამამუხრუჭებელი ძალა $\sim \dfrac{v}{R} \sim v \cdot (\text{სისქე})$.
HEN: The braking force $\sim \dfrac{v}{R} \sim v \cdot (\text{thickness})$.
SKA: ინდუქციური ემძ $\sim v$, კედლის წინაღობა $\sim \dfrac{1}{\text{სისქე}}$, ამიტომ დენი და ძალა $\sim v \cdot d$.
თანაბარი მოძრაობისას $F = mg$: $v d = \text{const}$ — სისქის გაორმაგებისას $v$ ორჯერ შემცირდება.
SEN: The induced EMF $\sim v$ and the wall's resistance $\sim \dfrac{1}{d}$, so the current and force $\sim v d$.
At steady speed $F = mg$: $v d = \text{const}$ — doubling the thickness halves $v$.
AKA: $2$-ჯერ შემცირდება
AEN: it halves

--- hard induction olympiad
KA: ფარადეის დისკი ($R = 0{,}1\ \text{მ}$) $B = 0{,}5\ \text{ტლ}$ ველში $\omega = 100\ \text{რად/წმ}$-ით ბრუნავს. ცენტრი და კიდე $R_{\text{გ}} = 0{,}05\ \text{ომი}$ წინაღობით არის შეერთებული. იპოვეთ დენი და მამუხრუჭებელი მომენტი.
EN: A Faraday disc ($R = 0.1\ \text{m}$) spins at $\omega = 100\ \text{rad/s}$ in $B = 0.5\ \text{T}$. Its centre and rim are joined through $0.05\ \Omega$. Find the current and the braking torque.
HKA: $\mathcal{E} = \dfrac{B\omega R^2}{2}$; მომენტი $M = \dfrac{P}{\omega}$.
HEN: $\mathcal{E} = \dfrac{B\omega R^2}{2}$; torque $M = \dfrac{P}{\omega}$.
SKA: $\mathcal{E} = \dfrac{0{,}5 \cdot 100 \cdot 0{,}01}{2} = 0{,}25\ \text{ვ}$, $\ I = 5\ \text{ა}$
$P = \mathcal{E} I = 1{,}25\ \text{ვტ}$, $\ M = \dfrac{1{,}25}{100} = 0{,}0125\ \text{ნ·მ}$
SEN: $\mathcal{E} = \dfrac{0.5 \cdot 100 \cdot 0.01}{2} = 0.25\ \text{V}$, $\ I = 5\ \text{A}$
$P = \mathcal{E} I = 1.25\ \text{W}$, $\ M = \dfrac{1.25}{100} = 0.0125\ \text{N·m}$
AKA: $5\ \text{ა}$; $0{,}0125\ \text{ნ·მ}$
AEN: $5\ \text{A}$; $0.0125\ \text{N·m}$

--- hard induction olympiad
KA: ზეგამტარ რგოლში ($R = 0$) მაგნიტი შეიყვანეს. რა ემართება რგოლში გამავალ ნაკადს? რატომ „ლივლივებს“ მაგნიტი ზეგამტარის თავზე?
EN: A magnet is brought into a superconducting ring ($R = 0$). What happens to the flux through the ring? Why does a magnet float above a superconductor?
HKA: $\mathcal{E} = I R = 0 \Rightarrow \dfrac{\Delta\Phi}{\Delta t} = 0$.
HEN: $\mathcal{E} = I R = 0 \Rightarrow \dfrac{\Delta\Phi}{\Delta t} = 0$.
SKA: $R = 0$-ისას რგოლში ემძ ნული უნდა იყოს — სრული ნაკადი არ იცვლება: ინდუქციური დენი მაგნიტის ნაკადს ზუსტად აკომპენსირებს.
ზეგამტარში ასეთი დენები არ ქრება და მაგნიტს განიზიდავს — ის ლივლივებს (მაისნერის ეფექტიც ველს ზეგამტარიდან განდევნის).
SEN: With $R = 0$ the EMF round the ring must be zero — the total flux can't change: the induced current exactly cancels the magnet's flux.
In a superconductor such currents never die away and repel the magnet — it floats (the Meissner effect also expels the field from the superconductor).
AKA: ნაკადი მუდმივია; ინდუქციური დენები განიზიდავს
AEN: the flux stays constant; the induced currents repel it

--- easy selfind
KA: კოჭაში ($L = 0{,}5\ \text{ჰნ}$) დენი $0{,}2\ \text{წმ}$-ში $4\ \text{ა}$-ით შეიცვალა. იპოვეთ თვითინდუქციის ემძ.
EN: The current in a $0.5\ \text{H}$ coil changes by $4\ \text{A}$ in $0.2\ \text{s}$. Find the self-induced EMF.
HKA: $\mathcal{E} = L\dfrac{\Delta I}{\Delta t}$.
HEN: $\mathcal{E} = L\dfrac{\Delta I}{\Delta t}$.
SKA: $\mathcal{E} = 0{,}5 \cdot \dfrac{4}{0{,}2} = 10\ \text{ვ}$
SEN: $\mathcal{E} = 0.5 \cdot \dfrac{4}{0.2} = 10\ \text{V}$
AKA: $10\ \text{ვ}$
AEN: $10\ \text{V}$

--- easy selfind
KA: $0{,}1\ \text{ჰნ}$ კოჭაში $5\ \text{ა}$ დენია. იპოვეთ მაგნიტური ველის ენერგია.
EN: A $0.1\ \text{H}$ coil carries $5\ \text{A}$. Find the field energy.
HKA: $W = \dfrac{L I^2}{2}$.
HEN: $W = \dfrac{L I^2}{2}$.
SKA: $W = \dfrac{0{,}1 \cdot 25}{2} = 1{,}25\ \text{ჯ}$
SEN: $W = \dfrac{0.1 \cdot 25}{2} = 1.25\ \text{J}$
AKA: $1{,}25\ \text{ჯ}$
AEN: $1.25\ \text{J}$

--- easy selfind
KA: რა არის თვითინდუქცია? რატომ ინთება ნათურა კოჭასთან მიმდევრობით ჩართვისას დაგვიანებით?
EN: What is self-induction? Why does a lamp in series with a coil light up with a delay?
HKA: საკუთარი დენის ცვლილება.
HEN: A change in the coil's own current.
SKA: თვითინდუქცია — ემძ-ის წარმოქმნა გამტარში მისივე დენის ცვლილებისას.
ჩართვისას დენის ზრდა კოჭაში თვითინდუქციის ემძ-ს იწვევს, რომელიც (ლენცის წესით) ამ ზრდას ეწინააღმდეგება — დენი და ნათება თანდათან იზრდება.
SEN: Self-induction is the EMF produced in a conductor when its own current changes.
At switch-on the rising current induces an EMF in the coil that (by Lenz's law) opposes the rise — the current and the glow build up gradually.
AKA: საკუთარი დენის ცვლილება ემძ-ს იწვევს, რომელიც ზრდას ამუხრუჭებს
AEN: the changing current induces an EMF that slows the rise

--- easy selfind
KA: კოჭის ინდუქციურობის ერთეულია ჰენრი. რას ნიშნავს $L = 1\ \text{ჰნ}$?
EN: Inductance is measured in henries. What does $L = 1\ \text{H}$ mean?
HKA: $\mathcal{E} = L\dfrac{\Delta I}{\Delta t}$.
HEN: $\mathcal{E} = L\dfrac{\Delta I}{\Delta t}$.
SKA: დენის $1\ \text{ა/წმ}$ სიჩქარით ცვლილებისას კოჭაში $1\ \text{ვ}$ თვითინდუქციის ემძ აღიძვრება ($1\ \text{ჰნ} = 1\ \text{ვ·წმ/ა}$).
SEN: When the current changes at $1\ \text{A/s}$ the coil produces $1\ \text{V}$ of self-induced EMF ($1\ \text{H} = 1\ \text{V·s/A}$).
AKA: $1\ \text{ა/წმ}$-ზე $1\ \text{ვ}$
AEN: $1\ \text{V}$ at $1\ \text{A/s}$

--- easy selfind
KA: კოჭაში ($N = 200$) $2\ \text{ა}$ დენი $0{,}01\ \text{ვბ}$ ნაკადს ქმნის თითო ხვიაში. იპოვეთ ინდუქციურობა.
EN: In a $200$-turn coil a current of $2\ \text{A}$ makes a flux of $0.01\ \text{Wb}$ through each turn. Find the inductance.
HKA: $L = \dfrac{N\Phi}{I}$.
HEN: $L = \dfrac{N\Phi}{I}$.
SKA: $L = \dfrac{200 \cdot 0{,}01}{2} = 1\ \text{ჰნ}$
SEN: $L = \dfrac{200 \cdot 0.01}{2} = 1\ \text{H}$

AEN: $1\ \text{H}$

--- easy selfind
KA: როგორ შეიცვლება კოჭის ველის ენერგია, თუ დენს $3$-ჯერ გავზრდით?
EN: How does a coil's field energy change if the current is tripled?
HKA: $W \sim I^2$.
HEN: $W \sim I^2$.
SKA: $9$-ჯერ გაიზრდება.
SEN: It increases $9$ times.

--- medium selfind
KA: $0{,}2\ \text{ჰნ}$ კოჭაში დენი $10\ \text{მწმ}$-ში $2\ \text{ა}$-დან ნულამდე შემცირდა. იპოვეთ ემძ. რატომ წარმოიქმნება გამორთვისას ნაპერწკალი?
EN: The current in a $0.2\ \text{H}$ coil drops from $2\ \text{A}$ to zero in $10\ \text{ms}$. Find the EMF. Why does a spark appear when the switch is opened?
HKA: სწრაფი ცვლილება — დიდი ემძ.
HEN: A rapid change — a large EMF.
SKA: $\mathcal{E} = 0{,}2 \cdot \dfrac{2}{0{,}01} = 40\ \text{ვ}$
წრედის გაწყვეტისას დენი ძალიან სწრაფად ქრება — ემძ დიდია და ჰაერს ჩამრთველის კონტაქტებს შორის არღვევს.
SEN: $\mathcal{E} = 0.2 \cdot \dfrac{2}{0.01} = 40\ \text{V}$
When the circuit breaks the current collapses very quickly — the EMF is large and breaks down the air between the switch contacts.
AKA: $40\ \text{ვ}$
AEN: $40\ \text{V}$

--- medium selfind
KA: სოლენოიდის ($N = 1000$, $l = 0{,}5\ \text{მ}$, $S = 10\ \text{სმ}^2$) ინდუქციურობა იპოვეთ. ($L = \dfrac{\mu_0 N^2 S}{l}$)
EN: Find the inductance of a solenoid ($N = 1000$, $l = 0.5\ \text{m}$, $S = 10\ \text{cm}^2$). ($L = \dfrac{\mu_0 N^2 S}{l}$)
HKA: ჩასვით ფორმულაში.
HEN: Substitute.
SKA: $L = \dfrac{4\pi \cdot 10^{-7} \cdot 10^6 \cdot 10^{-3}}{0{,}5} \approx 2{,}5 \cdot 10^{-3}\ \text{ჰნ}$
SEN: $L = \dfrac{4\pi \times 10^{-7} \cdot 10^6 \cdot 10^{-3}}{0.5} \approx 2.5 \times 10^{-3}\ \text{H}$
AKA: $\approx 2{,}5\ \text{მჰნ}$

--- medium oscill
KA: საქანელას სიგრძე $2{,}5\ \text{მ}$-ია. რა სიხშირით უნდა უბიძგოთ, რომ რეზონანსი მივიღოთ?

KA: ორი ზამბარა ($k_1 = 100$, $k_2 = 300\ \text{ნ/მ}$) პარალელურადაა, მათზე $1\ \text{კგ}$ ტვირთია. იპოვეთ პერიოდი. მიმდევრობით?
EN: Springs of $100$ and $300\ \text{N/m}$ in parallel hold a $1\ \text{kg}$ mass. Find the period. And in series?

SKA: პარალელური: $k = 400$, $T = 2\pi \cdot 0{,}05 \approx 0{,}31\ \text{წმ}$
მიმდევრობითი: $k = 75$, $T = 2\pi\sqrt{1/75} \approx 0{,}73\ \text{წმ}$
SEN: Parallel: $k = 400$, $T = 2\pi \cdot 0.05 \approx 0.31\ \text{s}$
Series: $k = 75$, $T = 2\pi\sqrt{1/75} \approx 0.73\ \text{s}$
AKA: $\approx 0{,}31\ \text{წმ}$; $\approx 0{,}73\ \text{წმ}$

--- medium oscill
KA: რხევის ამპლიტუდა ხახუნის გამო ყოველ პერიოდში $5\%$-ით მცირდება. ენერგიის რა ნაწილი იკარგება ყოველ პერიოდში?

--- hard oscill
KA: ქანქარიანი საათი, რომელიც დედამიწის ზედაპირზე ზუსტია, $h = 6{,}4\ \text{კმ}$ სიმაღლის მთაზე აიტანეს. რამდენით ჩამორჩება დღეში?
EN: A pendulum clock accurate at sea level is taken up a $6.4\ \text{km}$ mountain. How much does it lose per day?

SKA: $\dfrac{T'}{T} = 1 + \dfrac{6{,}4}{6400} = 1{,}001$
დღეში ჩამორჩება: $86\,400 \cdot \dfrac{0{,}001}{1{,}001} \approx 86\ \text{წმ}$
SEN: $\dfrac{T'}{T} = 1 + \dfrac{6.4}{6400} = 1.001$
Loss per day: $86\,400 \cdot \dfrac{0.001}{1.001} \approx 86\ \text{s}$
AKA: $\approx 86\ \text{წმ}$
AEN: $\approx 86\ \text{s}$

--- hard oscill
KA: ტვირთი ($m = 0{,}5\ \text{კგ}$) ზამბარაზე ($k = 200\ \text{ნ/მ}$) რხევს. როცა $x = 3\ \text{სმ}$, სიჩქარე $0{,}8\ \text{მ/წმ}$-ია. იპოვეთ ამპლიტუდა.
EN: A $0.5\ \text{kg}$ mass on a $200\ \text{N/m}$ spring is moving at $0.8\ \text{m/s}$ when $x = 3\ \text{cm}$. Find the amplitude.

$A = 5\ \text{სმ}$

$A = 5\ \text{cm}$
AKA: $5\ \text{სმ}$
AEN: $5\ \text{cm}$

--- hard oscill
KA: ქანქარა ($l = 1\ \text{მ}$) ლურსმანს ედება, რომელიც საკიდი წერტილის ქვემოთ $0{,}75\ \text{მ}$-ზეა (ერთ მხარეს რხევის ნახევარი სრულდება მოკლე ძაფზე). იპოვეთ პერიოდი.
EN: A $1\ \text{m}$ pendulum catches on a nail $0.75\ \text{m}$ below the pivot (so on one side the swing is on the shortened string). Find the period.
HKA: ნახევარი პერიოდი — $1\ \text{მ}$-იანი, ნახევარი — $0{,}25\ \text{მ}$-იანი ქანქარისა.
HEN: Half a period on the $1\ \text{m}$ pendulum, half on the $0.25\ \text{m}$ one.
SKA: $T_1 \approx 2\ \text{წმ}$, $\ T_2 \approx 1\ \text{წმ}$
$T = \dfrac{T_1 + T_2}{2} \approx 1{,}5\ \text{წმ}$
SEN: $T_1 \approx 2\ \text{s}$, $\ T_2 \approx 1\ \text{s}$
$T = \dfrac{T_1 + T_2}{2} \approx 1.5\ \text{s}$
AKA: $\approx 1{,}5\ \text{წმ}$
AEN: $\approx 1.5\ \text{s}$

--- hard oscill
KA: U-მილში სითხე (სვეტის სრული სიგრძე $L = 0{,}5\ \text{მ}$) რხევს. იპოვეთ პერიოდი.
EN: Liquid in a U-tube (total column length $L = 0.5\ \text{m}$) oscillates. Find the period.
HKA: $x$-ით გადაწევისას აღმდგენი ძალა $2\rho g S x$, მასა $\rho S L$.
HEN: Displaced by $x$ the restoring force is $2\rho g S x$, the mass $\rho S L$.
SKA: $k = 2\rho g S$, $m = \rho S L$ $\Rightarrow$ $T = 2\pi\sqrt{\dfrac{L}{2g}} = 2\pi\sqrt{0{,}025} \approx 1\ \text{წმ}$
SEN: $k = 2\rho g S$, $m = \rho S L$ $\Rightarrow$ $T = 2\pi\sqrt{\dfrac{L}{2g}} = 2\pi\sqrt{0.025} \approx 1\ \text{s}$
AKA: $\approx 1\ \text{წმ}$
AEN: $\approx 1\ \text{s}$

--- hard oscill
KA: ხის ძელაკი ($h = 10\ \text{სმ}$ სიმაღლე, $\rho = 600\ \text{კგ/მ}^3$) წყალში ვერტიკალურად ცურავს. ოდნავ ჩაძირეს და გაუშვეს. იპოვეთ რხევის პერიოდი.
EN: A wooden block ($10\ \text{cm}$ tall, $\rho = 600\ \text{kg/m}^3$) floats upright in water. It is pushed down slightly and released. Find the period.
HKA: აღმდგენი ძალა $\rho_{\text{წყ}} g S x$; წონასწორობისას ჩაძირვა $h_0 = h\dfrac{\rho}{\rho_{\text{წყ}}}$.
HEN: Restoring force $\rho_{\text{w}} g S x$; at equilibrium the depth is $h_0 = h\dfrac{\rho}{\rho_{\text{w}}}$.
SKA: $k = \rho_{\text{წყ}} g S$, $m = \rho S h$ $\Rightarrow$ $T = 2\pi\sqrt{\dfrac{\rho h}{\rho_{\text{წყ}} g}} = 2\pi\sqrt{\dfrac{h_0}{g}}$
$h_0 = 6\ \text{სმ}$: $T = 2\pi\sqrt{0{,}006} \approx 0{,}49\ \text{წმ}$
SEN: $k = \rho_{\text{w}} g S$, $m = \rho S h$ $\Rightarrow$ $T = 2\pi\sqrt{\dfrac{\rho h}{\rho_{\text{w}} g}} = 2\pi\sqrt{\dfrac{h_0}{g}}$
$h_0 = 6\ \text{cm}$: $T = 2\pi\sqrt{0.006} \approx 0.49\ \text{s}$
AKA: $\approx 0{,}49\ \text{წმ}$
AEN: $\approx 0.49\ \text{s}$

--- hard oscill
KA: ზამბარიანი ქანქარა ($T_0 = 1\ \text{წმ}$) ლიფტშია, რომელიც $2\ \text{მ/წმ}^2$-ით ზემოთ აჩქარდება. შეიცვლება თუ არა პერიოდი? მათემატიკური ქანქარისა?
EN: A spring pendulum ($T_0 = 1\ \text{s}$) is in a lift accelerating up at $2\ \text{m/s}^2$. Does its period change? What about a simple pendulum's?
HKA: ზამბარიანის პერიოდი $g$-ზე არ არის დამოკიდებული.
HEN: The spring pendulum's period doesn't depend on $g$.
SKA: ზამბარიანი — არ იცვლება ($T = 2\pi\sqrt{m/k}$), მხოლოდ წონასწორობის მდებარეობა იწევა.
მათემატიკური — მცირდება: $T = T_0\sqrt{\dfrac{10}{12}} \approx 0{,}91\, T_0$.
SEN: The spring pendulum — unchanged ($T = 2\pi\sqrt{m/k}$); only its equilibrium point shifts.
The simple pendulum — shorter: $T = T_0\sqrt{\dfrac{10}{12}} \approx 0.91\, T_0$.
AKA: ზამბარიანი — არა; მათემატიკური — $\approx 0{,}91T_0$
AEN: spring — no; simple — $\approx 0.91T_0$

--- hard oscill
KA: ორი ტვირთი ($m_1 = 1$ და $m_2 = 3\ \text{კგ}$) ზამბარითაა ($k = 300\ \text{ნ/მ}$) შეერთებული გლუვ მაგიდაზე. იპოვეთ რხევის პერიოდი.
EN: Masses of $1$ and $3\ \text{kg}$ are joined by a spring ($k = 300\ \text{N/m}$) on a smooth table. Find the period of oscillation.
HKA: დაყვანილი მასა $\mu = \dfrac{m_1 m_2}{m_1 + m_2}$.

SEN: $\mu = \dfrac{3}{4} = 0.75\ \text{kg}$
$T = 2\pi\sqrt{\dfrac{0.75}{300}} = 2\pi \cdot 0.05 \approx 0.31\ \text{s}$
AKA: $\approx 0{,}31\ \text{წმ}$
AEN: $\approx 0.31\ \text{s}$

--- hard oscill
KA: ტვირთი ზამბარაზე ($k = 100\ \text{ნ/მ}$, $m = 1\ \text{კგ}$) რხევს $A = 10\ \text{სმ}$-ით. რამდენი დრო სჭირდება წონასწორობიდან $x = 5\ \text{სმ}$-მდე გადასაადგილებლად?
EN: A mass on a spring ($k = 100\ \text{N/m}$, $m = 1\ \text{kg}$) oscillates with $A = 10\ \text{cm}$. How long does it take to go from equilibrium to $x = 5\ \text{cm}$?
