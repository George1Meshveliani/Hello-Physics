HEN: $x = A\sin\omega t$.
SKA: $\omega = 10\ \text{რად/წმ}$; $\ \sin\omega t = 0{,}5 \Rightarrow \omega t = \dfrac{\pi}{6}$
$t = \dfrac{\pi}{60} \approx 0{,}052\ \text{წმ}$ ($T/12$)
SEN: $\omega = 10\ \text{rad/s}$; $\ \sin\omega t = 0.5 \Rightarrow \omega t = \dfrac{\pi}{6}$
$t = \dfrac{\pi}{60} \approx 0.052\ \text{s}$ ($T/12$)
AKA: $\approx 0{,}05\ \text{წმ}$ ($T/12$)
AEN: $\approx 0.05\ \text{s}$ ($T/12$)

--- hard oscill olympiad
KA: დედამიწაში ცენტრზე გამავალი გვირაბი გათხარეს. მასში ჩაგდებული სხეული (ხახუნისა და ჰაერის გარეშე) ჰარმონიულად რხევს (ერთგვაროვანი დედამიწისთვის $F = -\dfrac{m g}{R} x$). იპოვეთ რა დროში მივა მეორე მხარეს.
EN: A tunnel is dug through the Earth's centre. A body dropped in (no friction or air) oscillates harmonically (for a uniform Earth $F = -\dfrac{m g}{R} x$). How long does it take to reach the other side?
HKA: $\omega = \sqrt{g/R}$, მეორე მხარე — ნახევარი პერიოდი.
HEN: $\omega = \sqrt{g/R}$; the other side is half a period away.
SKA: $T = 2\pi\sqrt{\dfrac{R}{g}} = 2\pi\sqrt{6{,}4 \cdot 10^5} \approx 5030\ \text{წმ}$
$\dfrac{T}{2} \approx 2510\ \text{წმ} \approx 42\ \text{წთ}$ (იგივეა, რაც დაბალი თანამგზავრის ნახევარი ბრუნი!)
SEN: $T = 2\pi\sqrt{\dfrac{R}{g}} = 2\pi\sqrt{6.4 \times 10^5} \approx 5030\ \text{s}$
$\dfrac{T}{2} \approx 2510\ \text{s} \approx 42\ \text{min}$ (the same as half an orbit of a low satellite!)
AKA: $\approx 42\ \text{წთ}$
AEN: $\approx 42\ \text{min}$

--- hard oscill olympiad
KA: ქანქარა ($l$) ჩამოკიდებულია ვაგონში, რომელიც ჰორიზონტალურად $a$ აჩქარებით მოძრაობს. იპოვეთ წონასწორობის კუთხე და მცირე რხევების პერიოდი.
EN: A pendulum ($l$) hangs in a carriage accelerating horizontally at $a$. Find its equilibrium angle and its period of small oscillations.
HKA: ეფექტური $g' = \sqrt{g^2 + a^2}$.
HEN: Effective $g' = \sqrt{g^2 + a^2}$.
SKA: $\tan\alpha = \dfrac{a}{g}$ (უკან გადახრილი)
$T = 2\pi\sqrt{\dfrac{l}{\sqrt{g^2 + a^2}}}$
SEN: $\tan\alpha = \dfrac{a}{g}$ (tilted backwards)
$T = 2\pi\sqrt{\dfrac{l}{\sqrt{g^2 + a^2}}}$
AKA: $\tan\alpha = \dfrac{a}{g}$; $T = 2\pi\sqrt{\dfrac{l}{\sqrt{g^2 + a^2}}}$
AEN: $\tan\alpha = \dfrac{a}{g}$; $T = 2\pi\sqrt{\dfrac{l}{\sqrt{g^2 + a^2}}}$

--- hard oscill olympiad
KA: ფიზიკური ქანქარა: ერთგვაროვანი ღერო ($l = 1\ \text{მ}$) ერთ ბოლოზე ჩამოკიდებული. მისი პერიოდი $T = 2\pi\sqrt{\dfrac{2l}{3g}}$-ია. რა სიგრძის მათემატიკური ქანქარა რხევს იმავე პერიოდით?
EN: A physical pendulum: a uniform rod ($l = 1\ \text{m}$) hung from one end has period $T = 2\pi\sqrt{\dfrac{2l}{3g}}$. What length of simple pendulum has the same period?
HKA: დაყვანილი სიგრძე.
HEN: The equivalent ("reduced") length.
SKA: $l_{\text{ეკვ}} = \dfrac{2l}{3} \approx 0{,}67\ \text{მ}$; $\ T = 2\pi\sqrt{0{,}0667} \approx 1{,}62\ \text{წმ}$
SEN: $l_{\text{eq}} = \dfrac{2l}{3} \approx 0.67\ \text{m}$; $\ T = 2\pi\sqrt{0.0667} \approx 1.62\ \text{s}$
AKA: $\approx 0{,}67\ \text{მ}$
AEN: $\approx 0.67\ \text{m}$

--- hard oscill olympiad
KA: ზამბარაზე ($k$) ჩამოკიდებულ $M$ ფირფიტაზე $h$ სიმაღლიდან $m$ თიხის ნაჭერი ვარდება და ეკვრება. იპოვეთ რხევის ამპლიტუდა.
EN: A lump of clay of mass $m$ falls from height $h$ onto a plate of mass $M$ on a spring ($k$) and sticks. Find the amplitude of the oscillation.
HKA: არადრეკადი დაჯახება; ახალი წონასწორობა $\dfrac{mg}{k}$-ით დაბლაა.
HEN: An inelastic collision; the new equilibrium is $\dfrac{mg}{k}$ lower.
SKA: დაჯახების შემდეგ სიჩქარე $u = \dfrac{m\sqrt{2gh}}{M + m}$; ახალი წონასწორობიდან გადახრა $x_0 = \dfrac{mg}{k}$.
$A = \sqrt{x_0^2 + \dfrac{(M + m) u^2}{k}} = \dfrac{mg}{k}\sqrt{1 + \dfrac{2 k h}{(M + m) g}}$
SEN: After the collision the speed is $u = \dfrac{m\sqrt{2gh}}{M + m}$; the offset from the new equilibrium is $x_0 = \dfrac{mg}{k}$.
$A = \sqrt{x_0^2 + \dfrac{(M + m) u^2}{k}} = \dfrac{mg}{k}\sqrt{1 + \dfrac{2 k h}{(M + m) g}}$
AKA: $A = \dfrac{mg}{k}\sqrt{1 + \dfrac{2kh}{(M + m)g}}$
AEN: $A = \dfrac{mg}{k}\sqrt{1 + \dfrac{2kh}{(M + m)g}}$

--- easy waves
KA: ტალღის სიგრძეა $4\ \text{მ}$, სიხშირე $5\ \text{ჰც}$. იპოვეთ სიჩქარე.
EN: A wave has wavelength $4\ \text{m}$ and frequency $5\ \text{Hz}$. Find its speed.
HKA: $v = \lambda\nu$.
HEN: $v = \lambda f$.
SKA: $v = 4 \cdot 5 = 20\ \text{მ/წმ}$
SEN: $v = 4 \cdot 5 = 20\ \text{m/s}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- easy waves
KA: ბგერის სიხშირე $440\ \text{ჰც}$-ია ($v = 340\ \text{მ/წმ}$). იპოვეთ ტალღის სიგრძე.
EN: A $440\ \text{Hz}$ note travels at $340\ \text{m/s}$. Find its wavelength.
HKA: $\lambda = \dfrac{v}{\nu}$.
HEN: $\lambda = \dfrac{v}{f}$.
SKA: $\lambda = \dfrac{340}{440} \approx 0{,}77\ \text{მ}$
SEN: $\lambda = \dfrac{340}{440} \approx 0.77\ \text{m}$
AKA: $\approx 0{,}77\ \text{მ}$
AEN: $\approx 0.77\ \text{m}$

--- easy waves
KA: რატომ არ ვრცელდება ბგერა ვაკუუმში? სინათლე კი ვრცელდება?
EN: Why doesn't sound travel through a vacuum? Light does — why?
HKA: ბგერა მექანიკური ტალღაა.
HEN: Sound is a mechanical wave.
SKA: ბგერას გარემოს ნაწილაკების რხევა სჭირდება — ვაკუუმში ნაწილაკები არ არის.
სინათლე ელექტრომაგნიტური ტალღაა, მას გარემო არ სჭირდება.
SEN: Sound needs the particles of a medium to vibrate — a vacuum has none.
Light is an electromagnetic wave and needs no medium.
AKA: ბგერას გარემო სჭირდება, სინათლეს — არა
AEN: sound needs a medium, light doesn't

--- easy waves
KA: რა განსაზღვრავს ბგერის სიმაღლეს და სიძლიერეს?
EN: What determines the pitch and the loudness of a sound?
HKA: სიხშირე და ამპლიტუდა.
HEN: Frequency and amplitude.
SKA: სიმაღლე — სიხშირე (მაღალი სიხშირე — მაღალი ტონი).
სიძლიერე — ამპლიტუდა (დიდი ამპლიტუდა — ხმამაღალი).
SEN: Pitch — frequency (higher frequency, higher note).
Loudness — amplitude (bigger amplitude, louder).
AKA: სიმაღლე — სიხშირე; სიძლიერე — ამპლიტუდა
AEN: pitch — frequency; loudness — amplitude

--- easy waves
KA: ზღვის ტალღა $3\ \text{მ/წმ}$-ით ვრცელდება, მეზობელ ქიმებს შორის $6\ \text{მ}$-ია. რამდენ ხანში ერთხელ ეჯახება ქიმი ნავს?
EN: Sea waves travel at $3\ \text{m/s}$ and the crests are $6\ \text{m}$ apart. How often does a crest hit a boat?
HKA: $T = \dfrac{\lambda}{v}$.
HEN: $T = \dfrac{\lambda}{v}$.
SKA: $T = \dfrac{6}{3} = 2\ \text{წმ}$
SEN: $T = \dfrac{6}{3} = 2\ \text{s}$
AKA: ყოველ $2\ \text{წმ}$-ში
AEN: every $2\ \text{s}$

--- easy waves
KA: ელვის გაელვებიდან $6\ \text{წმ}$-ის შემდეგ ქუხილი გაისმა. რა მანძილზეა ჭექა-ქუხილი?
EN: Thunder is heard $6\ \text{s}$ after a lightning flash. How far away is the storm?
HKA: სინათლე თითქმის მყისიერად აღწევს.
HEN: The light arrives almost instantly.
SKA: $s = 340 \cdot 6 = 2040\ \text{მ} \approx 2\ \text{კმ}$
SEN: $s = 340 \cdot 6 = 2040\ \text{m} \approx 2\ \text{km}$
AKA: $\approx 2\ \text{კმ}$
AEN: $\approx 2\ \text{km}$

--- easy waves
KA: რა არის ულტრაბგერა და ინფრაბგერა? სად გამოიყენება ულტრაბგერა?
EN: What are ultrasound and infrasound? Where is ultrasound used?
HKA: სმენის საზღვრები: $20\ \text{ჰც}$ – $20\ \text{კჰც}$.
HEN: Hearing limits: $20\ \text{Hz}$ – $20\ \text{kHz}$.
SKA: ინფრაბგერა — $20\ \text{ჰც}$-ზე დაბალი; ულტრაბგერა — $20\ \text{კჰც}$-ზე მაღალი.
ულტრაბგერა: სამედიცინო გამოკვლევა (ექოსკოპია), ექოლოტი, დეფექტოსკოპია; ღამურები და დელფინები მას ორიენტაციისთვის იყენებენ.
SEN: Infrasound — below $20\ \text{Hz}$; ultrasound — above $20\ \text{kHz}$.
Ultrasound: medical scans, echo sounders, flaw detection; bats and dolphins use it to navigate.
AKA: $< 20\ \text{ჰც}$ და $> 20\ \text{კჰც}$; ექოსკოპია, ექოლოტი
AEN: $< 20\ \text{Hz}$ and $> 20\ \text{kHz}$; medical scans, sonar

--- easy waves
KA: ტალღა $2$ წამში $12\ \text{მ}$-ს გადის, ტალღის სიგრძეა $1{,}5\ \text{მ}$. იპოვეთ სიხშირე.
EN: A wave travels $12\ \text{m}$ in $2\ \text{s}$ and its wavelength is $1.5\ \text{m}$. Find its frequency.
HKA: $v = \dfrac{s}{t}$, $\nu = \dfrac{v}{\lambda}$.
HEN: $v = \dfrac{s}{t}$, $f = \dfrac{v}{\lambda}$.
SKA: $v = 6\ \text{მ/წმ}$, $\ \nu = 4\ \text{ჰც}$
SEN: $v = 6\ \text{m/s}$, $\ f = 4\ \text{Hz}$
AKA: $4\ \text{ჰც}$
AEN: $4\ \text{Hz}$

--- easy waves
KA: რა არის ექო? რა მინიმალურ მანძილზე უნდა იყოს კედელი, რომ ექო ცალკე გავიგოთ (ყური ერთმანეთისგან $0{,}1\ \text{წმ}$-ით დაშორებულ ბგერებს არჩევს)?
EN: What is an echo? How far must a wall be for the echo to be heard separately (the ear separates sounds $0.1\ \text{s}$ apart)?
HKA: ბგერა ორმაგ მანძილს გადის.
HEN: The sound covers twice the distance.
SKA: ექო — დაბრკოლებიდან არეკლილი ბგერა.
$2d = 340 \cdot 0{,}1 \Rightarrow d = 17\ \text{მ}$
SEN: An echo is sound reflected from an obstacle.
$2d = 340 \cdot 0.1 \Rightarrow d = 17\ \text{m}$
AKA: $17\ \text{მ}$
AEN: $17\ \text{m}$

--- easy waves
KA: ბგერა ჰაერიდან წყალში გადავიდა. რომელი იცვლება — სიხშირე, სიჩქარე თუ ტალღის სიგრძე?
EN: Sound passes from air into water. Which change — frequency, speed or wavelength?
HKA: სიხშირეს წყარო განსაზღვრავს.
HEN: The source sets the frequency.
SKA: სიხშირე არ იცვლება; სიჩქარე იზრდება ($340 \to 1450\ \text{მ/წმ}$) და ტალღის სიგრძეც იზრდება ($\approx 4$-ჯერ).
SEN: The frequency stays the same; the speed rises ($340 \to 1450\ \text{m/s}$) and so does the wavelength ($\approx 4$ times).
AKA: სიჩქარე და ტალღის სიგრძე
AEN: the speed and the wavelength

--- medium waves
KA: სიმის ($l = 0{,}65\ \text{მ}$) ძირითადი ტონი $330\ \text{ჰც}$-ია. რა სიჩქარით ვრცელდება ტალღა სიმზე?
EN: A string $0.65\ \text{m}$ long has a fundamental of $330\ \text{Hz}$. How fast do waves travel along it?
HKA: ძირითად ტონზე $\lambda = 2l$.
HEN: For the fundamental $\lambda = 2l$.
SKA: $v = 2 \cdot 0{,}65 \cdot 330 \approx 429\ \text{მ/წმ}$
SEN: $v = 2 \cdot 0.65 \cdot 330 \approx 429\ \text{m/s}$
AKA: $\approx 429\ \text{მ/წმ}$
AEN: $\approx 429\ \text{m/s}$

--- medium waves
KA: ექოლოტმა სიგნალი ($v = 1500\ \text{მ/წმ}$) ფსკერიდან $0{,}6\ \text{წმ}$-ში მიიღო, $40\ \text{კჰც}$ სიხშირით. იპოვეთ სიღრმე და ტალღის სიგრძე.
EN: An echo sounder ($v = 1500\ \text{m/s}$, $40\ \text{kHz}$) receives the echo from the bottom after $0.6\ \text{s}$. Find the depth and the wavelength.
HKA: $h = \dfrac{v t}{2}$.
HEN: $h = \dfrac{v t}{2}$.
SKA: $h = \dfrac{1500 \cdot 0{,}6}{2} = 450\ \text{მ}$, $\ \lambda = \dfrac{1500}{40\,000} = 3{,}75\ \text{სმ}$
SEN: $h = \dfrac{1500 \cdot 0.6}{2} = 450\ \text{m}$, $\ \lambda = \dfrac{1500}{40\,000} = 3.75\ \text{cm}$
AKA: $450\ \text{მ}$; $3{,}75\ \text{სმ}$
AEN: $450\ \text{m}$; $3.75\ \text{cm}$

--- medium waves
KA: ტალღის ორი წერტილი, რომლებიც ერთმანეთისგან $1{,}5\ \text{მ}$-ითაა დაშორებული, საპირისპირო ფაზაში რხევს. სიხშირე $100\ \text{ჰც}$-ია. რა მაქსიმალური ტალღის სიგრძე შეიძლება იყოს და სიჩქარე?
EN: Two points on a wave $1.5\ \text{m}$ apart oscillate in antiphase. The frequency is $100\ \text{Hz}$. What is the largest possible wavelength, and the corresponding speed?
HKA: საპირისპირო ფაზა — $\dfrac{\lambda}{2}$ (ან კენტი ჯერადი).
HEN: Antiphase means $\dfrac{\lambda}{2}$ apart (or an odd multiple).
SKA: $\lambda_{\max} = 3\ \text{მ}$, $\ v = 300\ \text{მ/წმ}$
SEN: $\lambda_{\max} = 3\ \text{m}$, $\ v = 300\ \text{m/s}$
AKA: $3\ \text{მ}$; $300\ \text{მ/წმ}$
AEN: $3\ \text{m}$; $300\ \text{m/s}$

--- medium waves
KA: სადგურთან მოახლოებისას მატარებლის სასიგნალო სტვენის ტონი მაღალი ჩანს, დაშორებისას — დაბალი. რას ჰქვია ეს მოვლენა?
EN: A train's whistle sounds higher as it approaches and lower as it moves away. What is this effect called?
HKA: წყაროს მოძრაობა ტალღის სიგრძეს ცვლის.
HEN: The source's motion changes the wavelength.
SKA: დოპლერის ეფექტი: მოახლოებისას ტალღის ქიმები „იკუმშება“ (სიგრძე მცირდება, სიხშირე იზრდება), დაშორებისას — პირიქით.
SEN: The Doppler effect: approaching, the wave crests bunch up (shorter wavelength, higher frequency); receding, the opposite.
AKA: დოპლერის ეფექტი
AEN: the Doppler effect

--- medium waves
KA: მილი ($l = 0{,}85\ \text{მ}$) ერთ ბოლოში დახურულია. იპოვეთ ძირითადი ტონის სიხშირე ($v = 340\ \text{მ/წმ}$).
EN: A pipe $0.85\ \text{m}$ long is closed at one end. Find its fundamental frequency ($v = 340\ \text{m/s}$).
HKA: ცალმხრივ დახურულ მილში $l = \dfrac{\lambda}{4}$.
HEN: For a pipe closed at one end $l = \dfrac{\lambda}{4}$.
SKA: $\lambda = 3{,}4\ \text{მ}$, $\ \nu = \dfrac{340}{3{,}4} = 100\ \text{ჰც}$
SEN: $\lambda = 3.4\ \text{m}$, $\ f = \dfrac{340}{3.4} = 100\ \text{Hz}$
AKA: $100\ \text{ჰც}$
AEN: $100\ \text{Hz}$

--- medium waves
KA: ბგერის სიძლიერე დეციბელებში: $10\ \text{დბ}$-ით ზრდა ინტენსივობას $10$-ჯერ ზრდის. რამდენჯერ ინტენსიურია $90\ \text{დბ}$ $60\ \text{დბ}$-ზე?
EN: Loudness in decibels: each $10\ \text{dB}$ increase multiplies the intensity by $10$. How many times more intense is $90\ \text{dB}$ than $60\ \text{dB}$?
HKA: $30\ \text{დბ}$ = სამჯერ ×10.
HEN: $30\ \text{dB}$ = three steps of ×10.
SKA: $10^3 = 1000$-ჯერ
SEN: $10^3 = 1000$ times
AKA: $1000$-ჯერ
AEN: $1000$ times

--- medium waves
KA: დამკვირვებელი ტალღის ქიმების ($\lambda = 0{,}5\ \text{მ}$) გავლას ითვლის — $30$ ქიმი $10\ \text{წმ}$-ში. იპოვეთ სიხშირე და სიჩქარე.
EN: An observer counts $30$ wave crests ($\lambda = 0.5\ \text{m}$) passing in $10\ \text{s}$. Find the frequency and speed.
HKA: $\nu = \dfrac{N}{t}$.
HEN: $f = \dfrac{N}{t}$.
SKA: $\nu = 3\ \text{ჰც}$, $\ v = 1{,}5\ \text{მ/წმ}$
SEN: $f = 3\ \text{Hz}$, $\ v = 1.5\ \text{m/s}$
AKA: $3\ \text{ჰც}$; $1{,}5\ \text{მ/წმ}$
AEN: $3\ \text{Hz}$; $1.5\ \text{m/s}$

--- medium waves
KA: რა არის მდგარი ტალღა? როგორ წარმოიქმნება სიმზე?
EN: What is a standing wave? How does one form on a string?
HKA: ორი საპირისპიროდ მოძრავი ტალღის ინტერფერენცია.
HEN: Interference of two waves moving in opposite directions.
SKA: სიმის ბოლოებიდან არეკლილი ტალღები პირდაპირ ტალღებს ედება. ზოგ წერტილში (კვანძები) ისინი ყოველთვის აბათილებს ერთმანეთს, ზოგში (მუცლები) — ძლიერდება. ენერგია არ გადაიტანება.
SEN: Waves reflected from the string's ends overlap the incoming waves. At some points (nodes) they always cancel; at others (antinodes) they reinforce. No energy is carried along.
AKA: საპირისპირო ტალღების ინტერფერენცია; კვანძები და მუცლები
AEN: interference of opposite waves; nodes and antinodes

--- hard waves
KA: რკინიგზის ლიანდაგის ერთ ბოლოზე დაარტყეს. მეორე ბოლოსთან დამკვირვებელმა ორი ბგერა გაიგო $2\ \text{წმ}$-ის შუალედით. რა სიგრძისაა ლიანდაგი? ($v_{\text{ფ}} = 5000$, $v_{\text{ჰ}} = 340\ \text{მ/წმ}$)
EN: One end of a rail is struck. At the other end two sounds are heard $2\ \text{s}$ apart. How long is the rail? ($v_{\text{steel}} = 5000$, $v_{\text{air}} = 340\ \text{m/s}$)
HKA: $\dfrac{L}{340} - \dfrac{L}{5000} = 2$.
HEN: $\dfrac{L}{340} - \dfrac{L}{5000} = 2$.
SKA: $L\left(\dfrac{1}{340} - \dfrac{1}{5000}\right) = 2 \Rightarrow L \approx \dfrac{2}{0{,}002741} \approx 730\ \text{მ}$
SEN: $L\left(\dfrac{1}{340} - \dfrac{1}{5000}\right) = 2 \Rightarrow L \approx \dfrac{2}{0.002741} \approx 730\ \text{m}$
AKA: $\approx 730\ \text{მ}$
AEN: $\approx 730\ \text{m}$

--- hard waves
KA: მანქანა $30\ \text{მ/წმ}$-ით უახლოვდება დამკვირვებელს და $500\ \text{ჰც}$-იან საყვირს რეკავს. რა სიხშირეს გაიგებს დამკვირვებელი? დაშორებისას? ($v = 340\ \text{მ/წმ}$)
EN: A car approaches an observer at $30\ \text{m/s}$ sounding a $500\ \text{Hz}$ horn. What frequency does the observer hear? And as it moves away? ($v = 340\ \text{m/s}$)
HKA: $\nu' = \nu\dfrac{v}{v \mp u}$.
HEN: $f' = f\dfrac{v}{v \mp u}$.
SKA: მოახლოებისას: $500 \cdot \dfrac{340}{310} \approx 548\ \text{ჰც}$
დაშორებისას: $500 \cdot \dfrac{340}{370} \approx 459\ \text{ჰც}$
SEN: Approaching: $500 \cdot \dfrac{340}{310} \approx 548\ \text{Hz}$
Receding: $500 \cdot \dfrac{340}{370} \approx 459\ \text{Hz}$
AKA: $\approx 548\ \text{ჰც}$; $\approx 459\ \text{ჰც}$
AEN: $\approx 548\ \text{Hz}$; $\approx 459\ \text{Hz}$

--- hard waves
KA: ქვა ჭაში ჩააგდეს, ხმა $3\ \text{წმ}$-ის შემდეგ გაისმა. იპოვეთ ჭის სიღრმე ($v = 340\ \text{მ/წმ}$).
EN: A stone is dropped down a well and the splash is heard $3\ \text{s}$ later. Find the depth ($v = 340\ \text{m/s}$).
HKA: $\sqrt{\dfrac{2h}{g}} + \dfrac{h}{340} = 3$.
HEN: $\sqrt{\dfrac{2h}{g}} + \dfrac{h}{340} = 3$.
SKA: ვარდნის დრო $t_1$: $5t_1^2 = 340(3 - t_1) \Rightarrow t_1^2 + 68t_1 - 204 = 0$
$t_1 = \dfrac{-68 + \sqrt{4624 + 816}}{2} \approx 2{,}88\ \text{წმ}$, $\ h \approx 5 \cdot 8{,}29 \approx 41\ \text{მ}$
SEN: Fall time $t_1$: $5t_1^2 = 340(3 - t_1) \Rightarrow t_1^2 + 68t_1 - 204 = 0$
$t_1 = \dfrac{-68 + \sqrt{4624 + 816}}{2} \approx 2.88\ \text{s}$, $\ h \approx 5 \cdot 8.29 \approx 41\ \text{m}$
AKA: $\approx 41\ \text{მ}$
AEN: $\approx 41\ \text{m}$

--- hard waves
KA: ორი დინამიკი ერთ ფაზაში $680\ \text{ჰც}$-ს გამოსცემს. დამკვირვებელი ერთიდან $5\ \text{მ}$-ზეა, მეორედან $5{,}25\ \text{მ}$-ზე. გაიგებს ძლიერ თუ სუსტ ბგერას?
EN: Two speakers emit $680\ \text{Hz}$ in phase. A listener is $5\ \text{m}$ from one and $5.25\ \text{m}$ from the other. Do they hear a loud or a quiet sound?
HKA: $\lambda = 0{,}5\ \text{მ}$; შეადარეთ სვლათა სხვაობა.
HEN: $\lambda = 0.5\ \text{m}$; compare the path difference.
SKA: $\Delta = 0{,}25\ \text{მ} = \dfrac{\lambda}{2}$ — ტალღები საპირისპირო ფაზაშია: მინიმუმი (სუსტი ბგერა).
SEN: $\Delta = 0.25\ \text{m} = \dfrac{\lambda}{2}$ — the waves are in antiphase: a minimum (quiet).
AKA: სუსტი (მინიმუმი)
AEN: quiet (a minimum)

--- easy lcac
KA: რხევითი კონტურის $L = 0{,}4\ \text{ჰნ}$, $C = 10\ \text{მკფ}$. იპოვეთ პერიოდი.
EN: An LC circuit has $L = 0.4\ \text{H}$ and $C = 10\ \mu\text{F}$. Find the period.
HKA: $T = 2\pi\sqrt{LC}$.

გამოყენება: ოპტიკური ბოჭკო (ინტერნეტი, ენდოსკოპი), პრიზმები ბინოკლში, ალმასის ბრწყინვა.
SEN: Light going from an optically denser to a less dense medium at more than the critical angle is entirely reflected.
Uses: optical fibres (internet, endoscopes), prisms in binoculars, the sparkle of diamonds.
AKA: ოპტიკური ბოჭკო, პრიზმები
AEN: optical fibres, prisms

--- easy optics
KA: სინათლის სიჩქარე გარემოში $2 \cdot 10^8\ \text{მ/წმ}$-ია. იპოვეთ გარდატეხის მაჩვენებელი.
EN: Light travels at $2 \times 10^8\ \text{m/s}$ in a medium. Find its refractive index.
HKA: $n = \dfrac{c}{v}$.
HEN: $n = \dfrac{c}{v}$.
SKA: $n = 1{,}5$
SEN: $n = 1.5$
AKA: $1{,}5$
AEN: $1.5$

--- easy optics
KA: რატომ ვხედავთ საგნებს, რომლებიც თავად არ ანათებს? რას ჰქვია გაბნეული არეკვლა?
EN: Why can we see objects that don't give off light? What is diffuse reflection?
HKA: უსწორმასწორო ზედაპირი.
HEN: A rough surface.
SKA: საგნები მათზე დაცემულ სინათლეს ირეკლავს. უსწორმასწორო ზედაპირი სინათლეს ყველა მიმართულებით ფანტავს (გაბნეული არეკვლა), ამიტომ საგანს ნებისმიერი მხრიდან ვხედავთ.
SEN: Objects reflect the light falling on them. A rough surface scatters light in all directions (diffuse reflection), so we can see the object from any side.
AKA: დაცემულ სინათლეს ყველა მხარეს ირეკლავს
AEN: they scatter incident light in all directions

--- medium optics
KA: სხივი ჰაერიდან წყალში ($n = 1{,}33$) $45°$-ით ეცემა. იპოვეთ გარდატეხის კუთხე.
EN: A ray goes from air into water ($n = 1.33$) at $45°$. Find the angle of refraction.
HKA: $\sin\beta = \dfrac{\sin\alpha}{n}$.
HEN: $\sin\beta = \dfrac{\sin\alpha}{n}$.
SKA: $\sin\beta = \dfrac{0{,}707}{1{,}33} \approx 0{,}53 \Rightarrow \beta \approx 32°$
SEN: $\sin\beta = \dfrac{0.707}{1.33} \approx 0.53 \Rightarrow \beta \approx 32°$
AKA: $\approx 32°$
AEN: $\approx 32°$

--- medium optics
KA: მინის ($n = 1{,}5$) ზღვრული კუთხე იპოვეთ.
EN: Find the critical angle for glass ($n = 1.5$).
HKA: $\sin\alpha_0 = \dfrac{1}{n}$.
HEN: $\sin\alpha_0 = \dfrac{1}{n}$.
SKA: $\sin\alpha_0 = 0{,}667 \Rightarrow \alpha_0 \approx 42°$
SEN: $\sin\alpha_0 = 0.667 \Rightarrow \alpha_0 \approx 42°$
AKA: $\approx 42°$
AEN: $\approx 42°$

--- medium optics
KA: რა კუთხით უნდა დაეცეს სხივი მინაზე ($n = \sqrt 3$), რომ არეკლილი და გარდატეხილი სხივები ერთმანეთის პერპენდიკულარული იყოს?
EN: At what angle must a ray hit glass ($n = \sqrt 3$) so that the reflected and refracted rays are perpendicular?
HKA: $\alpha + \beta = 90° \Rightarrow \tan\alpha = n$.
HEN: $\alpha + \beta = 90° \Rightarrow \tan\alpha = n$.
SKA: $\tan\alpha = \sqrt 3 \Rightarrow \alpha = 60°$ (ბრიუსტერის კუთხე)
SEN: $\tan\alpha = \sqrt 3 \Rightarrow \alpha = 60°$ (Brewster's angle)
AKA: $60°$
AEN: $60°$

--- medium optics
KA: მინის ფირფიტა ($d = 3\ \text{სმ}$, $n = 1{,}5$) — სხივი $60°$-ით ეცემა. რამდენით გადაიწევს სხივი (პარალელურად)?
EN: A ray hits a glass slab ($d = 3\ \text{cm}$, $n = 1.5$) at $60°$. By how much is it shifted sideways?
HKA: $\delta = \dfrac{d\sin(\alpha - \beta)}{\cos\beta}$.
HEN: $\delta = \dfrac{d\sin(\alpha - \beta)}{\cos\beta}$.
SKA: $\sin\beta = \dfrac{0{,}866}{1{,}5} \approx 0{,}577 \Rightarrow \beta \approx 35{,}3°$
$\delta = \dfrac{3 \cdot \sin 24{,}7°}{\cos 35{,}3°} = \dfrac{3 \cdot 0{,}418}{0{,}816} \approx 1{,}54\ \text{სმ}$
SEN: $\sin\beta = \dfrac{0.866}{1.5} \approx 0.577 \Rightarrow \beta \approx 35.3°$
$\delta = \dfrac{3 \cdot \sin 24.7°}{\cos 35.3°} = \dfrac{3 \cdot 0.418}{0.816} \approx 1.54\ \text{cm}$
AKA: $\approx 1{,}5\ \text{სმ}$
AEN: $\approx 1.5\ \text{cm}$

--- medium optics
KA: მდინარის ფსკერი $1{,}2\ \text{მ}$ სიღრმედ ჩანს (ზემოდან ვერტიკალურად). რეალური სიღრმე? ($n = 1{,}33$)
EN: Looking straight down, a river bed seems $1.2\ \text{m}$ deep. What is the real depth? ($n = 1.33$)
HKA: $h_{\text{ნ}} = n h_{\text{ხ}}$.
HEN: $h_{\text{real}} = n h_{\text{apparent}}$.
SKA: $h = 1{,}33 \cdot 1{,}2 \approx 1{,}6\ \text{მ}$
SEN: $h = 1.33 \cdot 1.2 \approx 1.6\ \text{m}$
AKA: $\approx 1{,}6\ \text{მ}$
AEN: $\approx 1.6\ \text{m}$

--- medium optics
KA: სხივი მინიდან ($n = 1{,}5$) წყალში ($n = 1{,}33$) $50°$-ით ეცემა. გამოვა თუ სრულად აირეკლება?
EN: A ray goes from glass ($n = 1.5$) into water ($n = 1.33$) at $50°$. Does it pass through or reflect totally?
HKA: ზღვრული კუთხე: $\sin\alpha_0 = \dfrac{n_2}{n_1}$.
HEN: Critical angle: $\sin\alpha_0 = \dfrac{n_2}{n_1}$.
SKA: $\sin\alpha_0 = \dfrac{1{,}33}{1{,}5} \approx 0{,}887 \Rightarrow \alpha_0 \approx 62°$
$50° < 62°$ — გამოვა: $\sin\beta = \dfrac{1{,}5 \cdot 0{,}766}{1{,}33} \approx 0{,}864 \Rightarrow \beta \approx 60°$
SEN: $\sin\alpha_0 = \dfrac{1.33}{1.5} \approx 0.887 \Rightarrow \alpha_0 \approx 62°$
$50° < 62°$ — it passes: $\sin\beta = \dfrac{1.5 \cdot 0.766}{1.33} \approx 0.864 \Rightarrow \beta \approx 60°$
AKA: გამოვა, $\approx 60°$-ით
AEN: it passes through, at $\approx 60°$

--- medium optics
KA: ორი ბრტყელი სარკე $60°$ კუთხითაა. რამდენ გამოსახულებას ვხედავთ მათ შორის მოთავსებული სანთლისა?
EN: Two flat mirrors are at $60°$. How many images of a candle placed between them are seen?
HKA: $N = \dfrac{360°}{\alpha} - 1$.
HEN: $N = \dfrac{360°}{\alpha} - 1$.
SKA: $N = 6 - 1 = 5$
SEN: $N = 6 - 1 = 5$
AKA: $5$
AEN: $5$

--- medium optics
KA: რატომ არის ცა ლურჯი, მზის ჩასვლა კი წითელი?
EN: Why is the sky blue and the sunset red?
HKA: მოკლე ტალღები უფრო ძლიერად იფანტება.
HEN: Shorter wavelengths scatter more.
SKA: ჰაერის მოლეკულები ლურჯ სინათლეს (მოკლე $\lambda$) ბევრად ძლიერად ფანტავს, ვიდრე წითელს — ცა ლურჯად ჩანს.
ჩასვლისას სინათლე ატმოსფეროს დიდ სისქეს გადის, ლურჯი გაიფანტა და პირდაპირ სხივში წითელი რჩება.
SEN: Air molecules scatter blue light (short $\lambda$) much more than red — so the sky looks blue.
At sunset light crosses much more air; the blue has been scattered out and the direct beam is left red.
AKA: რელეის გაბნევა: ლურჯი ძლიერად იფანტება
AEN: Rayleigh scattering: blue scatters most

--- medium optics
KA: სარკე $10°$-ით მოაბრუნეს. რა კუთხით მობრუნდება არეკლილი სხივი?
EN: A mirror is turned through $10°$. Through what angle does the reflected ray turn?
HKA: ორმაგი კუთხით.
HEN: Through twice the angle.
SKA: $2 \cdot 10° = 20°$
SEN: $2 \cdot 10° = 20°$
AKA: $20°$
AEN: $20°$

--- hard optics
KA: წყლის ზედაპირზე ($n = 1{,}33$) $1\ \text{მ}$ სიღრმეზე მოთავსებული ნათურის თავზე რა რადიუსის გაუმჭვირვალე დისკი უნდა დავდოთ, რომ ზემოდან სინათლე არ ჩანდეს?
EN: A lamp is $1\ \text{m}$ under water ($n = 1.33$). What radius of opaque disc floating above it hides the light completely from above?
HKA: ზღვრულ კუთხეზე დიდი კუთხით სხივები არ გამოდის.
HEN: Rays beyond the critical angle don't get out.
SKA: $\sin\alpha_0 = \dfrac{1}{1{,}33} \approx 0{,}75 \Rightarrow \tan\alpha_0 \approx 1{,}13$
$r = h\tan\alpha_0 \approx 1{,}13\ \text{მ}$
SEN: $\sin\alpha_0 = \dfrac{1}{1.33} \approx 0.75 \Rightarrow \tan\alpha_0 \approx 1.13$
$r = h\tan\alpha_0 \approx 1.13\ \text{m}$
AKA: $\approx 1{,}13\ \text{მ}$
AEN: $\approx 1.13\ \text{m}$

--- hard optics
KA: სამკუთხა პრიზმა ($\varphi = 60°$, $n = 1{,}5$). სხივი წახნაგზე ისე ეცემა, რომ პრიზმაში ფუძის პარალელურად მიდის (სიმეტრიული სვლა). იპოვეთ დაცემის კუთხე და გადახრის კუთხე.
EN: A $60°$ prism ($n = 1.5$). A ray passes through symmetrically (parallel to the base inside). Find the angle of incidence and the deviation.
HKA: სიმეტრიისას $\beta = \dfrac{\varphi}{2} = 30°$; $\delta = 2\alpha - \varphi$.
HEN: For the symmetric path $\beta = \dfrac{\varphi}{2} = 30°$; $\delta = 2\alpha - \varphi$.
SKA: $\sin\alpha = 1{,}5 \cdot 0{,}5 = 0{,}75 \Rightarrow \alpha \approx 48{,}6°$
$\delta = 2 \cdot 48{,}6° - 60° \approx 37{,}2°$ (მინიმალური გადახრა)
SEN: $\sin\alpha = 1.5 \cdot 0.5 = 0.75 \Rightarrow \alpha \approx 48.6°$
$\delta = 2 \cdot 48.6° - 60° \approx 37.2°$ (the minimum deviation)
AKA: $\approx 48{,}6°$; $\approx 37{,}2°$
AEN: $\approx 48.6°$; $\approx 37.2°$

--- hard optics
KA: ოპტიკური ბოჭკოს ბირთვი $n_1 = 1{,}5$, გარსი $n_2 = 1{,}4$. რა მაქსიმალური კუთხით (ღერძიდან) შეიძლება შევიდეს სხივი ბოჭკოში ჰაერიდან, რომ ბოჭკოში დარჩეს?
EN: An optical fibre has core $n_1 = 1.5$ and cladding $n_2 = 1.4$. What is the largest angle (from the axis) at which light can enter from air and stay trapped?
HKA: $\sin\theta_{\max} = \sqrt{n_1^2 - n_2^2}$ (რიცხვითი აპერტურა).
HEN: $\sin\theta_{\max} = \sqrt{n_1^2 - n_2^2}$ (numerical aperture).
SKA: $\sin\theta = \sqrt{2{,}25 - 1{,}96} = \sqrt{0{,}29} \approx 0{,}54 \Rightarrow \theta \approx 33°$
SEN: $\sin\theta = \sqrt{2.25 - 1.96} = \sqrt{0.29} \approx 0.54 \Rightarrow \theta \approx 33°$
AKA: $\approx 33°$
AEN: $\approx 33°$

--- hard optics
KA: ადამიანი ($h = 1{,}7\ \text{მ}$, თვალები $1{,}6\ \text{მ}$-ზე) კედლის სარკეში მთლიანად უნდა დაინახოს თავი. რა მინიმალური სიმაღლის უნდა იყოს სარკე და რა სიმაღლეზე უნდა იყოს მისი ქვედა კიდე?
EN: A person ($1.7\ \text{m}$ tall, eyes at $1.6\ \text{m}$) wants to see themselves fully in a wall mirror. What is the minimum height of the mirror, and how high must its bottom edge be?
HKA: სარკე ადამიანის სიმაღლის ნახევარია; ქვედა კიდე — თვალის სიმაღლის ნახევარზე.
HEN: The mirror is half the person's height; its bottom edge at half the eye height.
SKA: სიმაღლე $\dfrac{1{,}7}{2} = 0{,}85\ \text{მ}$; ქვედა კიდე $\dfrac{1{,}6}{2} = 0{,}8\ \text{მ}$-ზე (მანძილი სარკემდე არ არის მნიშვნელოვანი).
SEN: Height $\dfrac{1.7}{2} = 0.85\ \text{m}$; bottom edge at $\dfrac{1.6}{2} = 0.8\ \text{m}$ (the distance from the mirror doesn't matter).
AKA: $0{,}85\ \text{მ}$; $0{,}8\ \text{მ}$
AEN: $0.85\ \text{m}$; $0.8\ \text{m}$

--- hard optics
KA: სხივი ჰაერიდან $n = 1{,}6$ მინის კუბის ზედა წახნაგზე ეცემა. შეიძლება თუ არა გვერდითი წახნაგიდან გამოსვლა?
EN: Light enters the top face of a glass cube ($n = 1.6$) from air. Can it come out through a side face?
HKA: გვერდითი წახნაგზე დაცემის კუთხე $90° - \beta$.
HEN: The angle at the side face is $90° - \beta$.
SKA: $\beta_{\max}$: $\sin\beta = \dfrac{1}{1{,}6} = 0{,}625 \Rightarrow \beta \approx 38{,}7°$
გვერდით წახნაგზე კუთხე $\ge 90° - 38{,}7° = 51{,}3°$; ზღვრული $\alpha_0 \approx 38{,}7°$ — ყოველთვის სრული არეკვლა: ვერ გამოვა.
SEN: $\beta_{\max}$: $\sin\beta = \dfrac{1}{1.6} = 0.625 \Rightarrow \beta \approx 38.7°$
At the side face the angle is $\ge 90° - 38.7° = 51.3°$; the critical angle is $\approx 38.7°$ — always total reflection: it can't get out.
AKA: ვერ გამოვა
AEN: no, it can't

--- hard optics
KA: ჭურჭლის ფსკერზე მონეტაა, თავზე $8\ \text{სმ}$ წყალი ($n = 1{,}33$) და მის ზემოთ $6\ \text{სმ}$ ზეთი ($n = 1{,}5$). რა სიღრმეზე ჩანს მონეტა ზემოდან?
EN: A coin lies under $8\ \text{cm}$ of water ($n = 1.33$) topped by $6\ \text{cm}$ of oil ($n = 1.5$). How deep does it look from above?
HKA: ფენების ხილული სისქეები იკრიბება: $\dfrac{h_i}{n_i}$.
HEN: The apparent thicknesses add: $\dfrac{h_i}{n_i}$.
SKA: $h' = \dfrac{8}{1{,}33} + \dfrac{6}{1{,}5} \approx 6 + 4 = 10\ \text{სმ}$
SEN: $h' = \dfrac{8}{1.33} + \dfrac{6}{1.5} \approx 6 + 4 = 10\ \text{cm}$
AKA: $\approx 10\ \text{სმ}$
AEN: $\approx 10\ \text{cm}$

--- hard optics
KA: წითელი ($n = 1{,}51$) და იისფერი ($n = 1{,}53$) სხივები $45°$-ით ეცემა მინაზე. რა კუთხით განსხვავდება მათი გარდატეხის კუთხეები (დისპერსია)?
EN: Red ($n = 1.51$) and violet ($n = 1.53$) rays hit glass at $45°$. By how much do their refraction angles differ (dispersion)?
HKA: გამოთვალეთ ორივე.
HEN: Work out both.
SKA: წითელი: $\sin\beta = \dfrac{0{,}707}{1{,}51} \approx 0{,}468 \Rightarrow 27{,}9°$
იისფერი: $\sin\beta = \dfrac{0{,}707}{1{,}53} \approx 0{,}462 \Rightarrow 27{,}5°$
$\Delta\beta \approx 0{,}4°$
SEN: Red: $\sin\beta = \dfrac{0.707}{1.51} \approx 0.468 \Rightarrow 27.9°$
Violet: $\sin\beta = \dfrac{0.707}{1.53} \approx 0.462 \Rightarrow 27.5°$
$\Delta\beta \approx 0.4°$
AKA: $\approx 0{,}4°$
AEN: $\approx 0.4°$

--- hard optics
KA: შუქი დედამიწის ატმოსფეროში გარდატყდება. რატომ ჩანს მზე ჯერ კიდევ ჰორიზონტზე, როცა გეომეტრიულად ის უკვე ჩასულია?
EN: Light refracts in the Earth's atmosphere. Why can we still see the Sun on the horizon after it has geometrically set?
HKA: ჰაერის სიმკვრივე ქვემოთ მეტია.
HEN: Air is denser lower down.
SKA: ჰაერის გარდატეხის მაჩვენებელი დედამიწასთან ოდნავ მეტია — სხივები დედამიწისკენ მოიღუნება. ჰორიზონტის ქვემოთ (დაახლ. $0{,}5°$-ით) მყოფი მზის სინათლე მაინც გვხვდება — მზის ჩასვლა $\sim 2$ წუთით „გვიანდება“.
SEN: Air's refractive index is slightly higher near the ground, so rays curve towards the Earth. Light from the Sun up to about $0.5°$ below the horizon still reaches us — sunset is "delayed" by $\sim 2$ minutes.
AKA: ატმოსფერული გარდატეხის გამო
AEN: because of atmospheric refraction

--- hard optics olympiad
KA: მოცურავე წყალში ($n = 1{,}33$) იყურება ზემოთ და ხედავს მთელ ცას $\alpha$ კუთხის კონუსში („სნელის ფანჯარა“). იპოვეთ კონუსის სრული კუთხე.
EN: A diver under water ($n = 1.33$) looks up and sees the whole sky inside a cone ("Snell's window"). Find the full angle of the cone.
HKA: ჰორიზონტიდან მოსული სხივები ზღვრული კუთხით გარდატყდება.
HEN: Rays from the horizon refract at the critical angle.
SKA: $\alpha_0 = \arcsin\dfrac{1}{1{,}33} \approx 48{,}8°$
სრული კუთხე: $2\alpha_0 \approx 97{,}5°$
SEN: $\alpha_0 = \arcsin\dfrac{1}{1.33} \approx 48.8°$
Full angle: $2\alpha_0 \approx 97.5°$
AKA: $\approx 97{,}5°$
AEN: $\approx 97.5°$

--- hard optics olympiad
KA: აჩვენეთ, რომ ორი ურთიერთპერპენდიკულარული სარკისგან (კუთხოვანი ამრეკლი) არეკლილი სხივი ყოველთვის დაცემულის პარალელურად, საპირისპიროდ ბრუნდება (სიბრტყეში).
EN: Show that a ray reflected from two perpendicular mirrors (a corner reflector) always comes back parallel to the incoming ray, in the opposite direction (in a plane).
HKA: ორი არეკვლა მიმართულებას $2 \cdot 90° = 180°$-ით აბრუნებს.
HEN: Two reflections turn the direction through $2 \cdot 90° = 180°$.
SKA: ვთქვათ, სარკეები $x$ და $y$ ღერძებზეა. პირველი არეკვლა სიჩქარის ერთ მდგენელს ცვლის ნიშნით, მეორე — მეორეს: $(v_x, v_y) \to (-v_x, -v_y)$.
ე.ი. სხივი ზუსტად საპირისპიროდ ბრუნდება — ასე მუშაობს ველოსიპედის „კატაფოტი“ და მთვარეზე დატოვებული რეფლექტორები.
SEN: Put the mirrors along the $x$ and $y$ axes. The first reflection flips the sign of one component, the second flips the other: $(v_x, v_y) \to (-v_x, -v_y)$.
So the ray returns exactly backwards — this is how bike reflectors and the retroreflectors left on the Moon work.
AKA: $(v_x, v_y) \to (-v_x, -v_y)$
AEN: $(v_x, v_y) \to (-v_x, -v_y)$

--- hard optics olympiad
KA: ფერმას პრინციპი: სინათლე ორ წერტილს შორის იმ გზას ირჩევს, რომელსაც უმცირესი დრო სჭირდება. მაშველი ($v_1 = 7\ \text{მ/წმ}$ სანაპიროზე, $v_2 = 1\ \text{მ/წმ}$ წყალში) მეხრჩობელისკენ მირბის. რა კავშირი უნდა არსებობდეს $\alpha$ (სანაპიროზე) და $\beta$ (წყალში) კუთხეებს შორის (ნაპირის ნორმალიდან), რომ დრო მინიმალური იყოს?
EN: Fermat's principle: light takes the path of least time. A lifeguard runs at $7\ \text{m/s}$ on sand and swims at $1\ \text{m/s}$. What relation between the angles $\alpha$ (on land) and $\beta$ (in water), measured from the normal to the shore, gives the quickest route?
HKA: სინათლის გარდატეხის კანონის ანალოგია.
HEN: It's the analogue of the law of refraction.
SKA: მინიმალური დროის პირობა: $\dfrac{\sin\alpha}{v_1} = \dfrac{\sin\beta}{v_2}$ — ზუსტად სნელის კანონი.
$\sin\beta = \dfrac{\sin\alpha}{7}$ — მაშველმა ნაპირზე უფრო მეტი უნდა გაირბინოს, რომ წყალში ნაკლები იცუროს.
SEN: The least-time condition is $\dfrac{\sin\alpha}{v_1} = \dfrac{\sin\beta}{v_2}$ — exactly Snell's law.
$\sin\beta = \dfrac{\sin\alpha}{7}$ — the lifeguard should run further along the sand to swim less.
AKA: $\dfrac{\sin\alpha}{v_1} = \dfrac{\sin\beta}{v_2}$
AEN: $\dfrac{\sin\alpha}{v_1} = \dfrac{\sin\beta}{v_2}$

--- hard optics olympiad
KA: ცისარტყელა: რატომ ჩანს ის ყოველთვის მზის საპირისპირო მხარეს და დაახლოებით $42°$ კუთხით?
EN: Why is a rainbow always opposite the Sun, at about $42°$?
HKA: წვეთში გარდატეხა, ერთი შინაგანი არეკვლა და ისევ გარდატეხა; გადახრის კუთხის მინიმუმი.
HEN: Refraction into a drop, one internal reflection, refraction out; the deviation has a minimum.
SKA: სინათლე წვეთში შედის, უკანა კედლიდან აირეკლება და გამოდის. გადახრის კუთხეს აქვს მინიმუმი ($\approx 138°$), რომლის მახლობლად ბევრი სხივი გროვდება — ანტისოლარული წერტილიდან $180° - 138° = 42°$ კუთხით.
დისპერსიის გამო სხვადასხვა ფერს სხვადასხვა კუთხე აქვს ($40°$–$42°$) — ჩნდება ფერადი რკალი.
SEN: Light enters a drop, reflects off the back and comes out. The deviation has a minimum ($\approx 138°$) near which many rays bunch up — at $180° - 138° = 42°$ from the antisolar point.
Dispersion gives each colour a slightly different angle ($40°$–$42°$) — a coloured arc.
AKA: გადახრის მინიმუმი $\approx 138°$, ე.ი. $42°$
AEN: minimum deviation $\approx 138°$, i.e. $42°$

--- easy lenses
KA: შემკრები ლინზის ($F = 10\ \text{სმ}$) ოპტიკური ძალა რას უდრის?
EN: What is the optical power of a converging lens with $F = 10\ \text{cm}$?
HKA: $D = \dfrac{1}{F}$ (მეტრებში).
HEN: $D = \dfrac{1}{F}$ (in metres).
SKA: $D = \dfrac{1}{0{,}1} = 10\ \text{დპტრ}$
SEN: $D = \dfrac{1}{0.1} = 10\ \text{D}$
AKA: $10\ \text{დპტრ}$
AEN: $10\ \text{D}$

--- easy lenses
KA: საგანი შემკრები ლინზიდან ($F = 15\ \text{სმ}$) $45\ \text{სმ}$-ზეა. იპოვეთ გამოსახულების მანძილი და გადიდება.
EN: An object is $45\ \text{cm}$ from a converging lens ($F = 15\ \text{cm}$). Find the image distance and magnification.
HKA: $\dfrac{1}{d} + \dfrac{1}{f} = \dfrac{1}{F}$, $\Gamma = \dfrac{f}{d}$.
HEN: $\dfrac{1}{d} + \dfrac{1}{f} = \dfrac{1}{F}$, $M = \dfrac{f}{d}$.
SKA: $\dfrac{1}{f} = \dfrac{1}{15} - \dfrac{1}{45} = \dfrac{2}{45} \Rightarrow f = 22{,}5\ \text{სმ}$
$\Gamma = 0{,}5$ — ნამდვილი, შებრუნებული, შემცირებული.
SEN: $\dfrac{1}{f} = \dfrac{1}{15} - \dfrac{1}{45} = \dfrac{2}{45} \Rightarrow f = 22.5\ \text{cm}$
$M = 0.5$ — real, inverted, diminished.
AKA: $22{,}5\ \text{სმ}$; $0{,}5$
AEN: $22.5\ \text{cm}$; $0.5$

--- easy lenses
KA: სად უნდა მოვათავსოთ საგანი შემკრები ლინზის წინ, რომ გადიდებული წარმოსახვითი გამოსახულება მივიღოთ (ლუპა)?
EN: Where must an object be placed in front of a converging lens to get a magnified virtual image (a magnifier)?
HKA: ფოკუსამდე.
HEN: Inside the focal length.
SKA: ლინზასა და ფოკუსს შორის ($d < F$) — გამოსახულება წარმოსახვითი, პირდაპირი, გადიდებულია.
SEN: Between the lens and the focus ($d < F$) — the image is virtual, upright and magnified.
AKA: $d < F$
AEN: $d < F$

--- easy lenses
KA: გამბნევი ლინზა ყოველთვის როგორ გამოსახულებას იძლევა ნამდვილი საგნისთვის?
EN: What kind of image does a diverging lens always give of a real object?
HKA: ის სხივებს შლის.
HEN: It spreads the rays apart.
SKA: წარმოსახვითს, პირდაპირს, შემცირებულს — საგნის მხარეს, ლინზასა და ფოკუსს შორის.
SEN: Virtual, upright and diminished — on the object's side, between the lens and the focus.
AKA: წარმოსახვითი, პირდაპირი, შემცირებული
AEN: virtual, upright, diminished

--- easy lenses
KA: ორი ლინზა ($D_1 = 2$ და $D_2 = 3\ \text{დპტრ}$) ერთმანეთთან მჭიდროდაა. იპოვეთ სისტემის ოპტიკური ძალა და ფოკუსური მანძილი.
EN: Two lenses ($2$ and $3\ \text{D}$) are placed together. Find the combined power and focal length.
HKA: მიჯრით მდგარი ლინზების ოპტიკური ძალები იკრიბება.
HEN: The powers of lenses in contact add.
SKA: $D = 5\ \text{დპტრ}$, $\ F = 0{,}2\ \text{მ} = 20\ \text{სმ}$
SEN: $D = 5\ \text{D}$, $\ F = 0.2\ \text{m} = 20\ \text{cm}$
AKA: $5\ \text{დპტრ}$; $20\ \text{სმ}$
AEN: $5\ \text{D}$; $20\ \text{cm}$

--- easy lenses
KA: როგორ ასწორებენ შორსმხედველობას (ჰიპერმეტროპიას)?
EN: How is long-sightedness corrected?
HKA: თვალი გამოსახულებას ბადურის უკან ქმნის.
HEN: The eye focuses behind the retina.
SKA: შორსმხედველ თვალში ახლო საგნის გამოსახულება ბადურის უკან იქმნება — საჭიროა შემკრები ლინზა (დადებითი დიოპტრია).
SEN: In a long-sighted eye the image of a near object forms behind the retina — a converging lens (positive dioptres) is needed.
AKA: შემკრები ლინზით
AEN: with a converging lens

--- medium lenses
KA: საგნის ნამდვილი გამოსახულება შემკრები ლინზიდან $60\ \text{სმ}$-ზე, $2$-ჯერ გადიდებული მიიღეს. იპოვეთ საგნის მანძილი და ფოკუსური მანძილი.
EN: A converging lens forms a real image $60\ \text{cm}$ away, magnified $2$ times. Find the object distance and the focal length.
HKA: $\Gamma = \dfrac{f}{d}$.
HEN: $M = \dfrac{f}{d}$.
SKA: $d = 30\ \text{სმ}$; $\ \dfrac{1}{F} = \dfrac{1}{30} + \dfrac{1}{60} = \dfrac{1}{20} \Rightarrow F = 20\ \text{სმ}$
SEN: $d = 30\ \text{cm}$; $\ \dfrac{1}{F} = \dfrac{1}{30} + \dfrac{1}{60} = \dfrac{1}{20} \Rightarrow F = 20\ \text{cm}$
AKA: $30\ \text{სმ}$; $20\ \text{სმ}$
AEN: $30\ \text{cm}$; $20\ \text{cm}$

--- medium lenses
KA: საგანი გამბნევი ლინზიდან ($F = -12\ \text{სმ}$) $12\ \text{სმ}$-ზეა. იპოვეთ გამოსახულება.
EN: An object is $12\ \text{cm}$ from a diverging lens ($F = -12\ \text{cm}$). Find the image.
HKA: $\dfrac{1}{f} = -\dfrac{1}{12} - \dfrac{1}{12}$.
HEN: $\dfrac{1}{f} = -\dfrac{1}{12} - \dfrac{1}{12}$.
SKA: $f = -6\ \text{სმ}$ — წარმოსახვითი, საგნის მხარეს; $\Gamma = 0{,}5$.
SEN: $f = -6\ \text{cm}$ — virtual, on the object's side; $M = 0.5$.
AKA: $-6\ \text{სმ}$; $0{,}5$
AEN: $-6\ \text{cm}$; $0.5$

--- medium lenses
KA: ლუპით ($F = 4\ \text{სმ}$) $25\ \text{სმ}$-ზე (საუკეთესო ხედვის მანძილი) წარმოსახვითი გამოსახულება მიიღეს. სად არის საგანი და რა არის გადიდება?
EN: A magnifier ($F = 4\ \text{cm}$) forms a virtual image at $25\ \text{cm}$ (the near point). Where is the object and what is the magnification?
HKA: $f = -25\ \text{სმ}$.
HEN: $f = -25\ \text{cm}$.
SKA: $\dfrac{1}{d} = \dfrac{1}{4} + \dfrac{1}{25} = \dfrac{29}{100} \Rightarrow d \approx 3{,}45\ \text{სმ}$
$\Gamma = \dfrac{25}{3{,}45} \approx 7{,}25$
SEN: $\dfrac{1}{d} = \dfrac{1}{4} + \dfrac{1}{25} = \dfrac{29}{100} \Rightarrow d \approx 3.45\ \text{cm}$
$M = \dfrac{25}{3.45} \approx 7.25$
AKA: $\approx 3{,}45\ \text{სმ}$; $\approx 7{,}25$
AEN: $\approx 3.45\ \text{cm}$; $\approx 7.25$

--- medium lenses
KA: ფოტოაპარატის ობიექტივი ($F = 5\ \text{სმ}$) $5\ \text{მ}$-ზე მდგარ $1{,}7\ \text{მ}$ ადამიანს იღებს. რა ზომისაა გამოსახულება სენსორზე?
EN: A camera lens ($F = 5\ \text{cm}$) photographs a $1.7\ \text{m}$ person $5\ \text{m}$ away. How tall is the image on the sensor?
HKA: $d \gg F \Rightarrow f \approx F$.
HEN: $d \gg F \Rightarrow f \approx F$.
SKA: $\dfrac{1}{f} = \dfrac{1}{5} - \dfrac{1}{500} \Rightarrow f \approx 5{,}05\ \text{სმ}$
$h' = 170 \cdot \dfrac{5{,}05}{500} \approx 1{,}7\ \text{სმ}$
SEN: $\dfrac{1}{f} = \dfrac{1}{5} - \dfrac{1}{500} \Rightarrow f \approx 5.05\ \text{cm}$
$h' = 170 \cdot \dfrac{5.05}{500} \approx 1.7\ \text{cm}$
AKA: $\approx 1{,}7\ \text{სმ}$
AEN: $\approx 1.7\ \text{cm}$

--- medium lenses
KA: შორსმჭვრეტ ადამიანს საუკეთესო ხედვის მანძილი $1\ \text{მ}$-ია. რა სათვალე სჭირდება, რომ $25\ \text{სმ}$-ზე წაიკითხოს?
EN: A long-sighted person's near point is $1\ \text{m}$. What glasses let them read at $25\ \text{cm}$?
HKA: სათვალემ $25\ \text{სმ}$-ზე მყოფი ტექსტის წარმოსახვითი გამოსახულება $1\ \text{მ}$-ზე უნდა შექმნას.
HEN: The glasses must form a virtual image at $1\ \text{m}$ of text at $25\ \text{cm}$.
SKA: $D = \dfrac{1}{0{,}25} - \dfrac{1}{1} = 3\ \text{დპტრ}$ (შემკრები)
SEN: $D = \dfrac{1}{0.25} - \dfrac{1}{1} = 3\ \text{D}$ (converging)
AKA: $+3\ \text{დპტრ}$
AEN: $+3\ \text{D}$

--- medium lenses
KA: პროექტორი სლაიდს ($3\ \text{სმ}$) $3\ \text{მ}$-ზე მდგარ ეკრანზე $1{,}5\ \text{მ}$-მდე ადიდებს. იპოვეთ ობიექტივის ფოკუსური მანძილი.
EN: A projector enlarges a $3\ \text{cm}$ slide to $1.5\ \text{m}$ on a screen $3\ \text{m}$ away. Find the lens's focal length.
HKA: $\Gamma = 50$, $d = \dfrac{f}{50}$.
HEN: $M = 50$, $d = \dfrac{f}{50}$.
SKA: $d = 6\ \text{სმ}$; $\ \dfrac{1}{F} = \dfrac{1}{6} + \dfrac{1}{300} \Rightarrow F \approx 5{,}9\ \text{სმ}$
SEN: $d = 6\ \text{cm}$; $\ \dfrac{1}{F} = \dfrac{1}{6} + \dfrac{1}{300} \Rightarrow F \approx 5.9\ \text{cm}$
AKA: $\approx 5{,}9\ \text{სმ}$
AEN: $\approx 5.9\ \text{cm}$

--- medium lenses
KA: საგანი შემკრები ლინზის ორმაგ ფოკუსზეა ($d = 2F$). როგორია გამოსახულება?
EN: An object is at twice the focal length ($d = 2F$) of a converging lens. What is the image like?
HKA: $f = 2F$.
HEN: $f = 2F$.
SKA: ნამდვილი, შებრუნებული, ტოლი ზომის — ლინზის მეორე მხარეს $2F$-ზე.
SEN: Real, inverted and the same size — at $2F$ on the other side.
AKA: ნამდვილი, შებრუნებული, ტოლი; $f = 2F$
AEN: real, inverted, same size; at $2F$

--- medium lenses
KA: საგნიდან ეკრანამდე $90\ \text{სმ}$-ია. ლინზის ($F = 20\ \text{სმ}$) რომელ მდებარეობებზე მიიღება ეკრანზე მკვეთრი გამოსახულება?
EN: An object and a screen are $90\ \text{cm}$ apart. At what positions of a lens ($F = 20\ \text{cm}$) is a sharp image formed?
HKA: $d + f = 90$, $\dfrac{1}{d} + \dfrac{1}{f} = \dfrac{1}{20}$.
HEN: $d + f = 90$, $\dfrac{1}{d} + \dfrac{1}{f} = \dfrac{1}{20}$.
SKA: $d f = 20 \cdot 90 = 1800$, $d + f = 90 \Rightarrow d^2 - 90d + 1800 = 0$
$d = 30\ \text{სმ}$ ან $60\ \text{სმ}$
SEN: $d f = 20 \cdot 90 = 1800$, $d + f = 90 \Rightarrow d^2 - 90d + 1800 = 0$
$d = 30\ \text{cm}$ or $60\ \text{cm}$
AKA: საგნიდან $30$ ან $60\ \text{სმ}$-ზე
AEN: $30$ or $60\ \text{cm}$ from the object

--- hard lenses
KA: შემკრები ($F_1 = 10\ \text{სმ}$) და გამბნევი ($F_2 = -15\ \text{სმ}$) ლინზები $5\ \text{სმ}$-ითაა დაშორებული. საგანი პირველიდან $30\ \text{სმ}$-ზეა. იპოვეთ საბოლოო გამოსახულება.
EN: A converging lens ($F_1 = 10\ \text{cm}$) and a diverging lens ($F_2 = -15\ \text{cm}$) are $5\ \text{cm}$ apart. An object is $30\ \text{cm}$ before the first. Find the final image.
HKA: პირველის გამოსახულება მეორისთვის საგანია (შეიძლება წარმოსახვითიც).
HEN: The first image is the object for the second (it may be virtual).
SKA: I: $\dfrac{1}{f_1} = \dfrac{1}{10} - \dfrac{1}{30} \Rightarrow f_1 = 15\ \text{სმ}$ — მეორე ლინზის უკან $10\ \text{სმ}$-ზე (წარმოსახვითი საგანი, $d_2 = -10$).
II: $\dfrac{1}{f_2} = -\dfrac{1}{15} + \dfrac{1}{10} = \dfrac{1}{30} \Rightarrow f_2 = 30\ \text{სმ}$ — ნამდვილი, მეორე ლინზიდან $30\ \text{სმ}$-ზე.
$\Gamma = \dfrac{15}{30} \cdot \dfrac{30}{10} = 1{,}5$
SEN: I: $\dfrac{1}{f_1} = \dfrac{1}{10} - \dfrac{1}{30} \Rightarrow f_1 = 15\ \text{cm}$ — $10\ \text{cm}$ beyond the second lens (a virtual object, $d_2 = -10$).
II: $\dfrac{1}{f_2} = -\dfrac{1}{15} + \dfrac{1}{10} = \dfrac{1}{30} \Rightarrow f_2 = 30\ \text{cm}$ — real, $30\ \text{cm}$ beyond the second lens.
$M = \dfrac{15}{30} \cdot \dfrac{30}{10} = 1.5$
AKA: მეორედან $30\ \text{სმ}$-ზე, ნამდვილი, $1{,}5$
AEN: $30\ \text{cm}$ beyond the second lens, real, $1.5$

--- hard lenses
KA: ტელესკოპის ობიექტივი $F_1 = 1\ \text{მ}$, ოკულარი $F_2 = 2\ \text{სმ}$. იპოვეთ კუთხური გადიდება და ტელესკოპის სიგრძე.
EN: A telescope has an objective of $F_1 = 1\ \text{m}$ and an eyepiece of $F_2 = 2\ \text{cm}$. Find its angular magnification and length.
HKA: $\Gamma = \dfrac{F_1}{F_2}$, $L = F_1 + F_2$.
HEN: $M = \dfrac{F_1}{F_2}$, $L = F_1 + F_2$.
SKA: $\Gamma = 50$, $\ L = 1{,}02\ \text{მ}$
SEN: $M = 50$, $\ L = 1.02\ \text{m}$
AKA: $50$; $1{,}02\ \text{მ}$
AEN: $50$; $1.02\ \text{m}$

--- hard lenses
KA: მიკროსკოპის ობიექტივი $F_1 = 4\ \text{მმ}$, ოკულარი $F_2 = 25\ \text{მმ}$, ტუბუსის სიგრძე (ფოკუსებს შორის) $\delta = 160\ \text{მმ}$. იპოვეთ გადიდება ($D = 250\ \text{მმ}$).
EN: A microscope has objective $F_1 = 4\ \text{mm}$, eyepiece $F_2 = 25\ \text{mm}$ and tube length (between foci) $160\ \text{mm}$. Find its magnification ($D = 250\ \text{mm}$).
HKA: $\Gamma = \dfrac{\delta D}{F_1 F_2}$.
HEN: $M = \dfrac{\delta D}{F_1 F_2}$.
SKA: $\Gamma = \dfrac{160 \cdot 250}{4 \cdot 25} = 400$
SEN: $M = \dfrac{160 \cdot 250}{4 \cdot 25} = 400$
AKA: $400$
AEN: $400$

--- hard lenses
KA: ლინზა ($n = 1{,}5$) ჰაერში შემკრებია, $F = 20\ \text{სმ}$. რა იქნება მისი ფოკუსური მანძილი წყალში ($n_{\text{წყ}} = 1{,}33$)?
EN: A lens ($n = 1.5$) is converging in air with $F = 20\ \text{cm}$. What is its focal length in water ($n = 1.33$)?
HKA: $\dfrac{1}{F} \sim \left(\dfrac{n}{n_0} - 1\right)$.
HEN: $\dfrac{1}{F} \sim \left(\dfrac{n}{n_0} - 1\right)$.
SKA: $\dfrac{F_{\text{წ}}}{F} = \dfrac{1{,}5 - 1}{1{,}5/1{,}33 - 1} = \dfrac{0{,}5}{0{,}128} \approx 3{,}9$
$F_{\text{წ}} \approx 78\ \text{სმ}$
SEN: $\dfrac{F_{\text{w}}}{F} = \dfrac{1.5 - 1}{1.5/1.33 - 1} = \dfrac{0.5}{0.128} \approx 3.9$
$F_{\text{w}} \approx 78\ \text{cm}$
AKA: $\approx 78\ \text{სმ}$
AEN: $\approx 78\ \text{cm}$

--- hard lenses olympiad
KA: შემკრები ლინზის ($F$) მთავარ ოპტიკურ ღერძზე წერტილოვანი წყარო $v$ სიჩქარით ლინზისკენ მოძრაობს, $d = 3F$-ზე. რა სიჩქარით მოძრაობს გამოსახულება?
EN: A point source on the axis of a converging lens ($F$) moves towards the lens at speed $v$, at $d = 3F$. How fast does the image move?
HKA: $\Delta f = -\dfrac{f^2}{d^2}\Delta d$ (ლინზის ფორმულის დიფერენცირება).
HEN: $\Delta f = -\dfrac{f^2}{d^2}\Delta d$ (differentiate the lens formula).
SKA: $d = 3F \Rightarrow f = 1{,}5F$
$v' = v\dfrac{f^2}{d^2} = v \cdot \dfrac{2{,}25}{9} = \dfrac{v}{4}$, ლინზისგან შორს.
SEN: $d = 3F \Rightarrow f = 1.5F$
$v' = v\dfrac{f^2}{d^2} = v \cdot \dfrac{2.25}{9} = \dfrac{v}{4}$, away from the lens.
AKA: $\dfrac{v}{4}$
AEN: $\dfrac{v}{4}$

--- hard lenses olympiad
KA: ლინზით ($F = 10\ \text{სმ}$) ეკრანზე საგნის გამოსახულება მიიღეს. ლინზის ნახევარი გაუმჭვირვალე ქაღალდით დაფარეს. რა მოუვა გამოსახულებას?
EN: A lens ($F = 10\ \text{cm}$) forms an image on a screen. Half of the lens is covered with opaque paper. What happens to the image?
HKA: ლინზის ყოველი ნაწილი მთლიან გამოსახულებას ქმნის.
HEN: Every part of the lens forms the whole image.
SKA: გამოსახულება მთლიანი რჩება (არ „გაიჭრება“), მხოლოდ სიკაშკაშე $2$-ჯერ მცირდება — სინათლის ნახევარი აღარ გადის.
SEN: The whole image remains (it isn't "cut in half"); it's just half as bright — half the light is blocked.
AKA: მთლიანია, $2$-ჯერ ნაკლებად კაშკაშა
AEN: still whole, half as bright

--- hard lenses olympiad
KA: ბრტყელ-ამოზნექილი ლინზა ($R = 20\ \text{სმ}$, $n = 1{,}5$) ბრტყელი მხრით სარკეზე დევს (ზემოდან ვიყურებით). სად უნდა იყოს საგანი, რომ გამოსახულება საგანს დაემთხვეს?
EN: A plano-convex lens ($R = 20\ \text{cm}$, $n = 1.5$) lies flat side down on a mirror (viewed from above). Where must an object be for its image to coincide with it?
HKA: სინათლე ლინზას ორჯერ გადის — სისტემა სფერული სარკეა ფოკუსით $\dfrac{F}{2}$.
HEN: Light passes the lens twice — the system acts as a mirror with focal length $\dfrac{F}{2}$.
SKA: $F = \dfrac{R}{n - 1} = 40\ \text{სმ}$.
საგანი უნდა იყოს ლინზის ფოკუსში ($40\ \text{სმ}$): სხივები ლინზის შემდეგ პარალელურია, სარკეზე ნორმალურად ეცემა და იმავე გზით ბრუნდება.
SEN: $F = \dfrac{R}{n - 1} = 40\ \text{cm}$.
The object must be at the lens's focus ($40\ \text{cm}$): after the lens the rays are parallel, hit the mirror normally and retrace their path.
AKA: $40\ \text{სმ}$-ზე (ფოკუსში)
AEN: at $40\ \text{cm}$ (the focus)

--- hard lenses olympiad
KA: ორი ერთნაირი შემკრები ლინზა ($F$) $F$ მანძილზეა ერთმანეთისგან. იპოვეთ სისტემის ოპტიკური ძალა. ($D = D_1 + D_2 - l D_1 D_2$)
EN: Two identical converging lenses ($F$) are a distance $F$ apart. Find the system's optical power. ($D = D_1 + D_2 - l D_1 D_2$)
HKA: ჩასვით $D_1 = D_2 = \dfrac{1}{F}$, $l = F$.
HEN: Substitute $D_1 = D_2 = \dfrac{1}{F}$, $l = F$.
SKA: $D = \dfrac{2}{F} - F \cdot \dfrac{1}{F^2} = \dfrac{1}{F}$
სისტემის ფოკუსური მანძილი $F$-ია — ისეთივე, როგორიც ერთი ლინზისა.
SEN: $D = \dfrac{2}{F} - F \cdot \dfrac{1}{F^2} = \dfrac{1}{F}$
The system's focal length is $F$ — the same as one lens.
AKA: $D = \dfrac{1}{F}$
AEN: $D = \dfrac{1}{F}$

--- easy light
KA: სინათლე მთვარიდან დედამიწამდე $1{,}28\ \text{წმ}$-ში აღწევს. იპოვეთ მანძილი.
EN: Light takes $1.28\ \text{s}$ to reach the Earth from the Moon. Find the distance.
HKA: $s = c t$.
HEN: $s = c t$.
SKA: $s = 3 \cdot 10^8 \cdot 1{,}28 \approx 3{,}84 \cdot 10^8\ \text{მ}$
SEN: $s = 3 \times 10^8 \cdot 1.28 \approx 3.84 \times 10^8\ \text{m}$
AKA: $\approx 384\,000\ \text{კმ}$
AEN: $\approx 384\,000\ \text{km}$

--- easy light
KA: რა არის სინათლის ბუნება — ტალღა თუ ნაწილაკი?
EN: What is the nature of light — a wave or a particle?
HKA: ინტერფერენცია და ფოტოეფექტი.
HEN: Interference and the photoelectric effect.
SKA: ორივე: ინტერფერენცია და დიფრაქცია ტალღურ ბუნებას აჩვენებს, ფოტოეფექტი — ნაწილაკურს (ფოტონები). ეს კორპუსკულურ-ტალღური დუალიზმია.
SEN: Both: interference and diffraction show its wave nature, the photoelectric effect its particle nature (photons). This is wave–particle duality.
AKA: ორივე (დუალიზმი)
AEN: both (wave–particle duality)

--- easy light
KA: მზიდან სინათლე $8{,}3$ წუთში მოდის. რა მანძილია მზემდე?
EN: Sunlight takes $8.3$ minutes to arrive. How far away is the Sun?
HKA: $s = c t$.
HEN: $s = c t$.
SKA: $s = 3 \cdot 10^8 \cdot 498 \approx 1{,}5 \cdot 10^{11}\ \text{მ}$
SEN: $s = 3 \times 10^8 \cdot 498 \approx 1.5 \times 10^{11}\ \text{m}$
AKA: $\approx 1{,}5 \cdot 10^{11}\ \text{მ}$
AEN: $\approx 1.5 \times 10^{11}\ \text{m}$

--- easy light
KA: ხილული სინათლის ტალღის სიგრძეები $400$–$700\ \text{ნმ}$-ია. იპოვეთ შესაბამისი სიხშირეები.
EN: Visible light spans $400$–$700\ \text{nm}$. Find the corresponding frequencies.
HKA: $\nu = \dfrac{c}{\lambda}$.
HEN: $f = \dfrac{c}{\lambda}$.
SKA: $400\ \text{ნმ}$: $7{,}5 \cdot 10^{14}\ \text{ჰც}$; $\ 700\ \text{ნმ}$: $\approx 4{,}3 \cdot 10^{14}\ \text{ჰც}$
SEN: $400\ \text{nm}$: $7.5 \times 10^{14}\ \text{Hz}$; $\ 700\ \text{nm}$: $\approx 4.3 \times 10^{14}\ \text{Hz}$
AKA: $\approx 4{,}3 \cdot 10^{14}$ – $7{,}5 \cdot 10^{14}\ \text{ჰც}$
AEN: $\approx 4.3 \times 10^{14}$ – $7.5 \times 10^{14}\ \text{Hz}$

--- hard light
KA: (ფიზოს მეთოდი) კბილანა ბორბალი ($N = 720$ კბილი) სინათლეს წყვეტს; სინათლე $8{,}6\ \text{კმ}$-ის მოშორებით სარკიდან ბრუნდება. ბორბლის $12{,}6\ \text{ბრ/წმ}$ სიხშირისას დაბრუნებული სინათლე პირველად დაიფარა (შემდეგ კბილმა დაფარა). იპოვეთ $c$.
EN: (Fizeau's method) A toothed wheel ($720$ teeth) chops a beam that returns from a mirror $8.6\ \text{km}$ away. At $12.6\ \text{rev/s}$ the returning light is first blocked by the next tooth. Find $c$.
HKA: სინათლის იქით-აქეთ დრო = ბორბლის მობრუნება ნახევარი კბილის ბიჯით: $t = \dfrac{1}{2N\nu}$.
HEN: The round-trip time = the time to turn half a tooth spacing: $t = \dfrac{1}{2N f}$.
SKA: $t = \dfrac{1}{2 \cdot 720 \cdot 12{,}6} \approx 5{,}51 \cdot 10^{-5}\ \text{წმ}$
$c = \dfrac{2 \cdot 8600}{5{,}51 \cdot 10^{-5}} \approx 3{,}1 \cdot 10^8\ \text{მ/წმ}$
SEN: $t = \dfrac{1}{2 \cdot 720 \cdot 12.6} \approx 5.51 \times 10^{-5}\ \text{s}$
$c = \dfrac{2 \cdot 8600}{5.51 \times 10^{-5}} \approx 3.1 \times 10^8\ \text{m/s}$
AKA: $\approx 3{,}1 \cdot 10^8\ \text{მ/წმ}$
AEN: $\approx 3.1 \times 10^8\ \text{m/s}$

--- hard light
KA: იუნგის ცდაში ჭრილებს შორის $d = 0{,}5\ \text{მმ}$-ია, ეკრანამდე $L = 1\ \text{მ}$. ნათელ ზოლებს შორის $1{,}2\ \text{მმ}$-ია. იპოვეთ სინათლის ტალღის სიგრძე.
EN: In Young's experiment the slits are $d = 0.5\ \text{mm}$ apart and the screen is $L = 1\ \text{m}$ away. The bright fringes are $1.2\ \text{mm}$ apart. Find the wavelength.
HKA: $\Delta x = \dfrac{\lambda L}{d}$.
HEN: $\Delta x = \dfrac{\lambda L}{d}$.
SKA: $\lambda = \dfrac{\Delta x \cdot d}{L} = \dfrac{1{,}2 \cdot 10^{-3} \cdot 5 \cdot 10^{-4}}{1} = 6 \cdot 10^{-7}\ \text{მ} = 600\ \text{ნმ}$
SEN: $\lambda = \dfrac{\Delta x \cdot d}{L} = \dfrac{1.2 \times 10^{-3} \cdot 5 \times 10^{-4}}{1} = 6 \times 10^{-7}\ \text{m} = 600\ \text{nm}$
AKA: $600\ \text{ნმ}$
AEN: $600\ \text{nm}$

--- medium optics
KA: სხივი ჰაერიდან უცნობ სითხეზე $60°$-ით ეცემა და $35°$-ით გარდატყდება. იპოვეთ სითხის გარდატეხის მაჩვენებელი და სინათლის სიჩქარე მასში.
EN: A ray goes from air into an unknown liquid at $60°$ and is refracted at $35°$. Find the liquid's refractive index and the speed of light in it.
HKA: $n = \dfrac{\sin\alpha}{\sin\beta}$, $v = \dfrac{c}{n}$.
HEN: $n = \dfrac{\sin\alpha}{\sin\beta}$, $v = \dfrac{c}{n}$.
SKA: $n = \dfrac{0{,}866}{0{,}574} \approx 1{,}51$
$v = \dfrac{3 \cdot 10^8}{1{,}51} \approx 2 \cdot 10^8\ \text{მ/წმ}$
SEN: $n = \dfrac{0.866}{0.574} \approx 1.51$
$v = \dfrac{3 \times 10^8}{1.51} \approx 2 \times 10^8\ \text{m/s}$
AKA: $\approx 1{,}5$; $\approx 2 \cdot 10^8\ \text{მ/წმ}$
AEN: $\approx 1.5$; $\approx 2 \times 10^8\ \text{m/s}$
