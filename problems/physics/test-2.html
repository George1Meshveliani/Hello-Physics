KA: სხეული უძრაობის მდგომარეობიდან იწყებს თანაბარაჩქარებულად მოძრაობას და პირველ წამში გადის $S$ მანძილს. რა მანძილს გაივლის სხეული მომდევნო ორ წამში?
EN: A body starts from rest with uniform acceleration and covers a distance $S$ in the first second. What distance does it cover in the next two seconds?
O: $2S$
$3S$
$4S$
$6S$
$8S$
C: 5
SKA: $s = \dfrac{at^2}{2} \sim t^2$: პირველ $1$ წმ-ში — $S$, პირველ $3$ წმ-ში — $9S$.
მომდევნო ორ წამში: $9S - S = 8S$
SEN: $s = \dfrac{at^2}{2} \sim t^2$: in the first $1$ s — $S$, in the first $3$ s — $9S$.
In the next two seconds: $9S - S = 8S$

KA: ორი **სხვადასხვა მასის** სხეული ერთსა და იმავე მომენტში აისროლეს ვერტიკალურად ტოლი სიჩქარეებით სხვადასხვა სიმაღლიდან. ჰაერის წინააღმდეგობა არ გაითვალისწინოთ. ჩამოთვლილთაგან რომელია მართებული?
I. მაქსიმალურ სიმაღლეზე სხეულების აჩქარებები ნულის ტოლია;
II. დროის ერთსა და იმავე მომენტში სხეულებს აქვთ ტოლი სიჩქარეები;
III. ერთსა და იმავე სიმაღლეზე სხეულებს აქვთ ტოლი სიჩქარეები.
EN: Two bodies of **different masses** are thrown vertically at the same moment with equal speeds from different heights. Ignore air resistance. Which statements are correct?
I. at the maximum height the accelerations of the bodies are zero;
II. at any given moment the bodies have equal velocities;
III. at the same height the bodies have equal speeds.
OKA: მხოლოდ I
მხოლოდ I და II
მხოლოდ II და III
მხოლოდ II
სამივე
OEN: only I
only I and II
only II and III
only II
all three
C: 4
SKA: I მცდარია: ფრენის მთელ დროს აჩქარება $g$-ს ტოლია, უმაღლეს წერტილშიც.
II სწორია: $v = v_0 - gt$ ორივესთვის ერთნაირია.
III მცდარია: სხეულები სხვადასხვა სიმაღლიდან ისროლეს, ამიტომ ერთსა და იმავე სიმაღლეზე ისინი სხვადასხვა მომენტში და სხვადასხვა სიჩქარით არიან.
SEN: I is false: the acceleration is $g$ throughout the flight, including the highest point.
II is true: $v = v_0 - gt$ is the same for both.
III is false: they start from different heights, so they pass a given height at different moments with different speeds.

SKA: $A = \dfrac{kx^2}{2}$. სიგრძის გაორმაგება ნიშნავს $L$-ით გაჭიმვას, ანუ დეფორმაცია 4-ჯერ მეტია.

SEN: $A = \dfrac{kx^2}{2}$. Doubling the length means stretching by $L$, i.e. 4 times the extension.

SKA: სხივი ზედაპირთან $35^\circ$-ს ადგენს, ამიტომ დაცემის კუთხე (მართობთან) $\alpha = 55^\circ$; არეკვლის კუთხეც $55^\circ$-ია.
არეკლილი და გარდატეხილი სხივები მართობულია: $55^\circ + 90^\circ + \gamma = 180^\circ \Rightarrow \gamma = 35^\circ$.
$n = \dfrac{\sin 55^\circ}{\sin 35^\circ} = \dfrac{\sin 55^\circ}{\cos 55^\circ} = \mathrm{tg}\,55^\circ$
SEN: The ray makes $35^\circ$ with the surface, so the angle of incidence (to the normal) is $\alpha = 55^\circ$; the angle of reflection is $55^\circ$ too.
The reflected and refracted rays are perpendicular: $55^\circ + 90^\circ + \gamma = 180^\circ \Rightarrow \gamma = 35^\circ$.
$n = \dfrac{\sin 55^\circ}{\sin 35^\circ} = \dfrac{\sin 55^\circ}{\cos 55^\circ} = \tan 55^\circ$

SEN: The positive (left) ball is attracted by both negatives: toward the top and to the right. The sum of these equal forces lies along their bisector — up and to the right (arrow 1).
The right negative ball is repelled by the top negative (down-right, away from it) and attracted by the positive (to the left). The sum of these equal forces points down and to the left (arrow 3).

KA: ორი ტოლი წინაღობის გამტარი მიმდევრობით შეაერთეს და ჩართეს $U$ ძაბვის ქსელში. თითოეულ მათგანზე გამოიყო $P$ სიმძლავრე. რა სიმძლავრე გამოიყოფა თითოეულ მათგანზე, თუ მათ პარალელურად შევაერთებთ და ჩავრთავთ იმავე ძაბვის ქსელში?
EN: Two equal resistors connected in series to a mains voltage $U$ each dissipate power $P$. What power does each dissipate if they are connected in parallel to the same voltage?
O: $P/4$
$P/2$
$P$
$2P$
$4P$
C: 5
SKA: მიმდევრობით: თითოეულზე ძაბვაა $\dfrac U2$, $P = \dfrac{(U/2)^2}{R} = \dfrac{U^2}{4R}$.
პარალელურად: თითოეულზე $U$, $P' = \dfrac{U^2}{R} = 4P$.
SEN: In series each gets $\dfrac U2$: $P = \dfrac{(U/2)^2}{R} = \dfrac{U^2}{4R}$.
In parallel each gets $U$: $P' = \dfrac{U^2}{R} = 4P$.

EN: Three point charges lie on a straight line (see the figure). Charges I and II attract each other with force $F$. What is charge III if the total electric force on it is $3F$, directed as shown?

O: $(-4q)$
$(-3q)$
$(-2q)$
$3q$
$4q$

SKA: $F = \dfrac{kq^2}{d^2}$. ავღნიშნოთ III მუხტი $Q$-თი, დადებითი მიმართულება — მარჯვნივ.
I-დან ($+q$, მანძილი $2d$): $\dfrac{kqQ}{4d^2} = \dfrac{F}{4}\cdot\dfrac Qq$; II-დან ($-q$, მანძილი $d$): $-\dfrac{kqQ}{d^2} = -F\dfrac Qq$.
ჯამი: $-\dfrac34F\dfrac Qq = 3F \Rightarrow Q = -4q$
SEN: $F = \dfrac{kq^2}{d^2}$. Call charge III $Q$ and take the positive direction to the right.
From I ($+q$, distance $2d$): $\dfrac{kqQ}{4d^2} = \dfrac{F}{4}\cdot\dfrac Qq$; from II ($-q$, distance $d$): $-\dfrac{kqQ}{d^2} = -F\dfrac Qq$.
Sum: $-\dfrac34F\dfrac Qq = 3F \Rightarrow Q = -4q$

KA: სივრცის ნახევარში გვაქვს ერთგვაროვანი მაგნიტური ველი, რომლის ინდუქციის მოდულია $B$, ხოლო მიმართულება ნახატის სიბრტყის მართობულია. ამ არეში შედის $q$ დადებითი მუხტის და $m$ მასის მქონე ნაწილაკი, რომლის სიჩქარე საზღვრის მართობულია (იხ. ნახ.). ამ ნაწილაკმა სიჩქარე შეიძინა $U$ ძაბვის გარბენისას. სიმძიმის ძალა არ გაითვალისწინოთ. უპასუხეთ შემდეგ კითხვებს:
1) რა სიჩქარე შეიძინა ნაწილაკმა ელექტრული ველის მოქმედებით?
2) რა რადიუსის წრეწირის რკალზე იმოძრავებს ეს ნაწილაკი მაგნიტურ ველში?
3) რა მუშაობას ასრულებს მაგნიტური ველიდან ნაწილაკზე მოქმედი ძალა?
4) რა დროის განმავლობაში იმყოფება ნაწილაკი მაგნიტურ ველში?
5) რისი ტოლია მაგნიტური ველის მოქმედებით ნაწილაკის იმპულსის ცვლილების მოდული?
EN: Half of space is filled with a uniform magnetic field of induction $B$ perpendicular to the plane of the figure. A particle of positive charge $q$ and mass $m$ enters this region with its velocity perpendicular to the boundary (see the figure). The particle gained its speed by being accelerated through a voltage $U$. Ignore gravity. Answer:
1) What speed did the particle gain in the electric field?
2) What is the radius of the arc it moves along in the magnetic field?
3) What work does the magnetic force do on the particle?
4) How long does the particle stay in the magnetic field?
5) What is the magnitude of the change in the particle's momentum caused by the magnetic field?

SKA: 1) $qU = \dfrac{mv^2}{2} \Rightarrow v = \sqrt{\dfrac{2qU}{m}}$.
2) $qvB = \dfrac{mv^2}{R} \Rightarrow R = \dfrac{mv}{qB} = \dfrac1B\sqrt{\dfrac{2mU}{q}}$.
3) ლორენცის ძალა სიჩქარის მართობულია, ამიტომ მისი მუშაობა $0$-ია.
4) ნაწილაკი შედის საზღვრის მართობულად და გამოდის ნახევარწრეწირის გავლის შემდეგ: $t = \dfrac T2 = \dfrac{\pi m}{qB}$.
5) სიჩქარე იგივე მოდულით, საპირისპირო მიმართულებით გამოდის: $\Delta p = 2mv = 2\sqrt{2mqU}$.
SEN: 1) $qU = \dfrac{mv^2}{2} \Rightarrow v = \sqrt{\dfrac{2qU}{m}}$.
2) $qvB = \dfrac{mv^2}{R} \Rightarrow R = \dfrac{mv}{qB} = \dfrac1B\sqrt{\dfrac{2mU}{q}}$.
3) The Lorentz force is perpendicular to the velocity, so its work is $0$.
4) Entering perpendicular to the boundary, the particle leaves after half a circle: $t = \dfrac T2 = \dfrac{\pi m}{qB}$.
5) It leaves with the same speed in the opposite direction: $\Delta p = 2mv = 2\sqrt{2mqU}$.
AKA: 1) $\sqrt{2qU/m}$; 2) $\dfrac1B\sqrt{\dfrac{2mU}{q}}$; 3) $0$; 4) $\dfrac{\pi m}{qB}$; 5) $2\sqrt{2mqU}$
