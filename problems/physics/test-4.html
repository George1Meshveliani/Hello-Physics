KA: სხეული წრეწირზე მოძრაობს მუდმივი მოდულის სიჩქარით. ჩამოთვლილთაგან რომელია მართებული?
I. სხეულის აჩქარება ნულის ტოლია;
II. სხეულის აჩქარება წრეწირის ცენტრისკენაა მიმართული;
III. სხეულის სიჩქარის ვექტორი მუდმივია.
EN: A body moves on a circle with a speed of constant magnitude. Which statements are correct?
I. the body's acceleration is zero;
II. the body's acceleration points to the centre of the circle;
III. the body's velocity vector is constant.
OKA: მხოლოდ I
მხოლოდ II
მხოლოდ III
I და III
II და III
OEN: only I
only II
only III
I and III
II and III
C: 2
SKA: სიჩქარის მიმართულება მუდმივად იცვლება, ამიტომ სიჩქარის ვექტორი მუდმივი არ არის (III მცდარია) და აჩქარება ნული არ არის (I მცდარია).
თანაბარი წრიული მოძრაობისას აჩქარება ცენტრისკენულია: $a = \dfrac{v^2}{R}$ (II სწორია).
SEN: The direction of the velocity keeps changing, so the velocity vector is not constant (III is false) and the acceleration is not zero (I is false).
In uniform circular motion the acceleration is centripetal: $a = \dfrac{v^2}{R}$ (II is true).

SEN: $E_k = \dfrac{mv^2}{2}$ (B); $p = mv$ (A); $P = UI = I^2R$ — both formulas are correct (C and F); $p = \dfrac FS$ (D); $A = p\Delta V$ (E).
The Coulomb force $F = \dfrac{kq_1q_2}{r^2}$ is not in the list, so row 6 stays empty.
AKA: 1 – ბ; 2 – ა; 3 – გ, ვ; 4 – დ; 5 – ე; 6 – არც ერთი
AEN: 1 – B; 2 – A; 3 – C, F; 4 – D; 5 – E; 6 – none

KA: შეუსაბამეთ საგნის მდებარეობას ლინზის მიმართ მისი გამოსახულების თვისებები ($d$ — მანძილი საგნიდან ლინზამდე, $F$ — ფოკუსური მანძილი).
EN: Match the position of an object relative to a lens with the properties of its image ($d$ is the object distance, $F$ the focal length).
LKA: შემკრები ლინზა, $d > 2F$
შემკრები ლინზა, $d = 2F$
შემკრები ლინზა, $F < d < 2F$
შემკრები ლინზა, $d = F$
შემკრები ლინზა, $d < F$
გამბნევი ლინზა, ნებისმიერი $d$
LEN: converging lens, $d > 2F$
converging lens, $d = 2F$
converging lens, $F < d < 2F$
converging lens, $d = F$
converging lens, $d < F$
diverging lens, any $d$
RKA: ნამდვილი, შემცირებული
ნამდვილი, საგნის ტოლი
ნამდვილი, გადიდებული
წარმოსახვითი, გადიდებული
წარმოსახვითი, შემცირებული
გამოსახულება არ მიიღება
REN: real, reduced
real, same size
real, magnified

virtual, reduced
no image is formed
M: 1 2 3 6 4 5
SKA: შემკრები ლინზა: $d > 2F$ — ნამდვილი, შემცირებული (ა); $d = 2F$ — ნამდვილი, ტოლი (ბ); $F < d < 2F$ — ნამდვილი, გადიდებული (გ).
$d = F$ — სხივები ლინზის შემდეგ პარალელურია, გამოსახულება არ მიიღება (ვ); $d < F$ — წარმოსახვითი, გადიდებული (დ).
გამბნევი ლინზა ყოველთვის იძლევა წარმოსახვით, შემცირებულ, პირდაპირ გამოსახულებას (ე).
SEN: Converging lens: $d > 2F$ — real, reduced (A); $d = 2F$ — real, same size (B); $F < d < 2F$ — real, magnified (C).
$d = F$ — the rays leave the lens parallel, no image (F); $d < F$ — virtual, magnified (D).
A diverging lens always gives a virtual, reduced, upright image (E).
AKA: 1 – ა; 2 – ბ; 3 – გ; 4 – ვ; 5 – დ; 6 – ე
AEN: 1 – A; 2 – B; 3 – C; 4 – F; 5 – D; 6 – E

--- 3
KA: 1000 კგ მასის ავტომობილი 20 მ/წმ სიჩქარით მოძრაობდა და მძღოლმა მკვეთრად დაამუხრუჭა (ბორბლები აღარ ბრუნავს). ბორბლებსა და გზას შორის ხახუნის კოეფიციენტია 0,5. განსაზღვრეთ დამუხრუჭების მანძილი და დრო.
EN: A 1000 kg car moving at 20 m/s brakes hard (the wheels lock). The coefficient of friction between the tyres and the road is 0.5. Find the braking distance and time.
SKA: ერთადერთი ჰორიზონტალური ძალა ხახუნია: $ma = \mu mg \Rightarrow a = \mu g = 5$ მ/წმ² (მასა არ მონაწილეობს).
$t = \dfrac{v_0}{a} = \dfrac{20}{5} = 4$ წმ.
$s = \dfrac{v_0^2}{2a} = \dfrac{400}{10} = 40$ მ.
SEN: The only horizontal force is friction: $ma = \mu mg \Rightarrow a = \mu g = 5$ m/s² (the mass cancels).
$t = \dfrac{v_0}{a} = \dfrac{20}{5} = 4$ s.
$s = \dfrac{v_0^2}{2a} = \dfrac{400}{10} = 40$ m.
AKA: $s = 40$ მ, $t = 4$ წმ
AEN: $s = 40$ m, $t = 4$ s

--- 5
KA: 0,5 კგ მასის ბურთულა მიბმულია 1 მ სიგრძის ძაფზე და ვერტიკალურ სიბრტყეში წრეწირზე ბრუნავს. ქვედა წერტილში ბურთულას სიჩქარეა 8 მ/წმ. ჰაერის წინააღმდეგობა უგულებელყავით. განსაზღვრეთ:
1) ბურთულას ცენტრისკენული აჩქარება ქვედა წერტილში;
2) ძაფის დაჭიმულობის ძალა ქვედა წერტილში;
3) ბურთულას სიჩქარის კვადრატი ზედა წერტილში;
4) ძაფის დაჭიმულობის ძალა ზედა წერტილში;
5) ქვედა წერტილში მინიმალური სიჩქარე, რომლის დროსაც ბურთულა ჯერ კიდევ გაივლის მთელ წრეწირს (ძაფი დაჭიმული დარჩება).
EN: A 0.5 kg ball tied to a 1 m thread moves on a circle in a vertical plane. At the lowest point its speed is 8 m/s. Ignore air resistance. Find:
1) the ball's centripetal acceleration at the lowest point;
2) the tension in the thread at the lowest point;
3) the square of the ball's speed at the top;
4) the tension in the thread at the top;
5) the minimum speed at the lowest point for which the ball still goes all the way round (the thread stays taut).
SKA: 1) $a = \dfrac{v^2}{R} = \dfrac{64}{1} = 64$ მ/წმ².
2) $T_1 - mg = ma \Rightarrow T_1 = 0{,}5(10 + 64) = 37$ ნ.
3) ენერგიის შენახვა (სიმაღლის სხვაობა $2R$): $v_2^2 = v_1^2 - 4gR = 64 - 40 = 24$ მ²/წმ².
4) $T_2 + mg = \dfrac{mv_2^2}{R} \Rightarrow T_2 = 0{,}5 \cdot 24 - 5 = 7$ ნ.
5) ზედა წერტილში ძაფი დაჭიმულია, თუ $\dfrac{mv_2^2}{R} \ge mg$, ანუ $v_2^2 \ge gR$. მაშინ $v_1^2 = v_2^2 + 4gR \ge 5gR \Rightarrow v_{1\,min} = \sqrt{5gR} = \sqrt{50} \approx 7{,}1$ მ/წმ.
SEN: 1) $a = \dfrac{v^2}{R} = \dfrac{64}{1} = 64$ m/s².
2) $T_1 - mg = ma \Rightarrow T_1 = 0.5(10 + 64) = 37$ N.
3) Energy conservation (height difference $2R$): $v_2^2 = v_1^2 - 4gR = 64 - 40 = 24$ m²/s².
4) $T_2 + mg = \dfrac{mv_2^2}{R} \Rightarrow T_2 = 0.5 \cdot 24 - 5 = 7$ N.
5) At the top the thread stays taut if $\dfrac{mv_2^2}{R} \ge mg$, i.e. $v_2^2 \ge gR$. Then $v_1^2 = v_2^2 + 4gR \ge 5gR \Rightarrow v_{1\,min} = \sqrt{5gR} = \sqrt{50} \approx 7.1$ m/s.
AKA: 1) $64$ მ/წმ²; 2) $37$ ნ; 3) $24$ მ²/წმ²; 4) $7$ ნ; 5) $\sqrt{50} \approx 7{,}1$ მ/წმ
AEN: 1) $64$ m/s²; 2) $37$ N; 3) $24$ m²/s²; 4) $7$ N; 5) $\sqrt{50} \approx 7.1$ m/s

--- 5
KA: ერთატომიანი იდეალური აირი მუდმივი $2 \cdot 10^5$ პა წნევისას გაფართოვდა 0,01 მ³-დან 0,03 მ³-მდე. აირის საწყისი ტემპერატურაა 300 კ. შინაგანი ენერგია $U = \dfrac32\nu RT$, $R = 8{,}3$ ჯ/(მოლი·კ). განსაზღვრეთ:
1) აირის მიერ შესრულებული მუშაობა;
2) აირის შინაგანი ენერგიის ცვლილება;
3) აირის მიერ მიღებული სითბოს რაოდენობა;
4) აირის საბოლოო ტემპერატურა;
5) აირის ნივთიერების რაოდენობა.
EN: A monatomic ideal gas expanded at a constant pressure of $2 \cdot 10^5$ Pa from 0.01 m³ to 0.03 m³. Its initial temperature is 300 K. The internal energy is $U = \dfrac32\nu RT$, $R = 8.3$ J/(mol·K). Find:
1) the work done by the gas;
2) the change in its internal energy;
3) the heat it received;
4) its final temperature;
5) the amount of substance.
SKA: 1) $A = p\Delta V = 2 \cdot 10^5 \cdot 0{,}02 = 4000$ ჯ.
2) $\Delta U = \dfrac32\nu R\Delta T = \dfrac32p\Delta V = 6000$ ჯ.
3) $Q = \Delta U + A = 10\,000$ ჯ.
4) იზობარა: $\dfrac{V}{T} = \mathrm{const} \Rightarrow T_2 = 300 \cdot \dfrac{0{,}03}{0{,}01} = 900$ კ.
5) $\nu = \dfrac{pV_1}{RT_1} = \dfrac{2 \cdot 10^5 \cdot 0{,}01}{8{,}3 \cdot 300} \approx 0{,}8$ მოლი.
SEN: 1) $A = p\Delta V = 2 \cdot 10^5 \cdot 0.02 = 4000$ J.
2) $\Delta U = \dfrac32\nu R\Delta T = \dfrac32p\Delta V = 6000$ J.
3) $Q = \Delta U + A = 10\,000$ J.
4) Isobaric: $\dfrac{V}{T} = \mathrm{const} \Rightarrow T_2 = 300 \cdot \dfrac{0.03}{0.01} = 900$ K.
5) $\nu = \dfrac{pV_1}{RT_1} = \dfrac{2 \cdot 10^5 \cdot 0.01}{8.3 \cdot 300} \approx 0.8$ mol.
AKA: 1) $4$ კჯ; 2) $6$ კჯ; 3) $10$ კჯ; 4) $900$ კ; 5) $\approx 0{,}8$ მოლი
AEN: 1) $4$ kJ; 2) $6$ kJ; 3) $10$ kJ; 4) $900$ K; 5) $\approx 0.8$ mol

KA: ჰორიზონტალურ ლითონის რელსებზე, რომლებიც ერთმანეთისგან 0,5 მ-ითაა დაშორებული, მუდმივი 4 მ/წმ სიჩქარით სრიალებს გამტარი ღერო. რელსები ერთ ბოლოში შეერთებულია 0,1 ომი წინაღობის რეზისტორით. სისტემა მოთავსებულია 0,2 ტლ ინდუქციის ვერტიკალურ ერთგვაროვან მაგნიტურ ველში (იხ. ნახ.). ღეროსა და რელსების წინაღობა და ხახუნი უგულებელყავით. განსაზღვრეთ:
1) ღეროში აღძრული ინდუქციის ემ ძალა;
2) წრედში დენის ძალა;
3) ღეროზე მოქმედი ამპერის ძალა;
4) სიმძლავრე, რომელიც საჭიროა ღეროს თანაბარი მოძრაობის შესანარჩუნებლად;
5) 10 წმ-ში რეზისტორში გამოყოფილი სითბოს რაოდენობა.
EN: A conducting rod slides at a constant 4 m/s along horizontal metal rails 0.5 m apart. At one end the rails are joined by a 0.1 Ω resistor. The system is in a vertical uniform magnetic field of 0.2 T (see the figure). Ignore the resistance of the rod and rails and friction. Find:
1) the EMF induced in the rod;
2) the current in the circuit;
3) the Ampère force on the rod;
4) the power needed to keep the rod moving at constant speed;
5) the heat released in the resistor in 10 s.

SKA: 1) $\mathcal E = Blv = 0{,}2 \cdot 0{,}5 \cdot 4 = 0{,}4$ ვ.
2) $I = \dfrac{\mathcal E}{R} = \dfrac{0{,}4}{0{,}1} = 4$ ა.
3) $F = BIl = 0{,}2 \cdot 4 \cdot 0{,}5 = 0{,}4$ ნ (ლენცის წესით ის მოძრაობას ეწინააღმდეგება).
4) გარე ძალა ამპერის ძალას აწონასწორებს: $P = Fv = 0{,}4 \cdot 4 = 1{,}6$ ვტ (იგივეა, რაც $I^2R$).
5) $Q = Pt = 1{,}6 \cdot 10 = 16$ ჯ.
SEN: 1) $\mathcal E = Blv = 0.2 \cdot 0.5 \cdot 4 = 0.4$ V.
2) $I = \dfrac{\mathcal E}{R} = \dfrac{0.4}{0.1} = 4$ A.
3) $F = BIl = 0.2 \cdot 4 \cdot 0.5 = 0.4$ N (by Lenz's rule it opposes the motion).
4) The external force balances the Ampère force: $P = Fv = 0.4 \cdot 4 = 1.6$ W (the same as $I^2R$).
5) $Q = Pt = 1.6 \cdot 10 = 16$ J.
AKA: 1) $0{,}4$ ვ; 2) $4$ ა; 3) $0{,}4$ ნ; 4) $1{,}6$ ვტ; 5) $16$ ჯ
AEN: 1) $0.4$ V; 2) $4$ A; 3) $0.4$ N; 4) $1.6$ W; 5) $16$ J
