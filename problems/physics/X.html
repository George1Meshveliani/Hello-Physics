KA: ორი ნაწილაკი ($m$ და $2m$, მუხტები $q$ და $q$) ერთმანეთისგან $r$ მანძილზე უძრავადაა და გაუშვეს. იპოვეთ მათი სიჩქარეები ძალიან შორს.
EN: Two particles ($m$ and $2m$, charges $q$ and $q$) are released from rest a distance $r$ apart. Find their speeds when they are very far apart.
HKA: იმპულსი $m v_1 = 2m v_2$; ენერგია $k\dfrac{q^2}{r} = \dfrac{m v_1^2}{2} + \dfrac{2m v_2^2}{2}$.
HEN: Momentum $m v_1 = 2m v_2$; energy $k\dfrac{q^2}{r} = \dfrac{m v_1^2}{2} + \dfrac{2m v_2^2}{2}$.
SKA: $v_1 = 2 v_2$: $k\dfrac{q^2}{r} = 2m v_2^2 + m v_2^2 = 3m v_2^2$
$v_2 = q\sqrt{\dfrac{k}{3 m r}}$, $\ v_1 = 2q\sqrt{\dfrac{k}{3 m r}}$
SEN: $v_1 = 2 v_2$: $k\dfrac{q^2}{r} = 2m v_2^2 + m v_2^2 = 3m v_2^2$
$v_2 = q\sqrt{\dfrac{k}{3 m r}}$, $\ v_1 = 2q\sqrt{\dfrac{k}{3 m r}}$
AKA: $v_1 = 2q\sqrt{\dfrac{k}{3mr}}$, $v_2 = q\sqrt{\dfrac{k}{3mr}}$
AEN: $v_1 = 2q\sqrt{\dfrac{k}{3mr}}$, $v_2 = q\sqrt{\dfrac{k}{3mr}}$

--- easy field
KA: $8\ \text{ნკ}$ მუხტიდან $0{,}3\ \text{მ}$-ზე იპოვეთ ველის დაძაბულობა.
EN: Find the field strength $0.3\ \text{m}$ from an $8\ \text{nC}$ charge.
HKA: $E = k\dfrac{q}{r^2}$.
HEN: $E = k\dfrac{q}{r^2}$.
SKA: $E = 9 \cdot 10^9 \cdot \dfrac{8 \cdot 10^{-9}}{0{,}09} = 800\ \text{ნ/კ}$
SEN: $E = 9 \times 10^9 \cdot \dfrac{8 \times 10^{-9}}{0.09} = 800\ \text{N/C}$
AKA: $800\ \text{ნ/კ}$
AEN: $800\ \text{N/C}$

--- easy field
KA: $2\ \text{ნკ}$ მუხტზე ველში $4 \cdot 10^{-5}\ \text{ნ}$ ძალა მოქმედებს. იპოვეთ დაძაბულობა.
EN: A $2\ \text{nC}$ charge feels $4 \times 10^{-5}\ \text{N}$ in a field. Find the field strength.
HKA: $E = \dfrac{F}{q}$.
HEN: $E = \dfrac{F}{q}$.
SKA: $E = \dfrac{4 \cdot 10^{-5}}{2 \cdot 10^{-9}} = 2 \cdot 10^4\ \text{ნ/კ}$
SEN: $E = \dfrac{4 \times 10^{-5}}{2 \times 10^{-9}} = 2 \times 10^4\ \text{N/C}$
AKA: $2 \cdot 10^4\ \text{ნ/კ}$
AEN: $2 \times 10^4\ \text{N/C}$

--- easy field
KA: საით არის მიმართული დადებითი მუხტის ველის დაძაბულობა? უარყოფითის?
EN: Which way does the field of a positive charge point? Of a negative charge?
HKA: დაძაბულობა — ძალა დადებით საცდელ მუხტზე.
HEN: The field is the force on a positive test charge.
SKA: დადებითის — მუხტიდან გარეთ (რადიალურად); უარყოფითის — მუხტისკენ.
SEN: Positive — outwards from the charge (radially); negative — towards the charge.
AKA: დადებითი — გარეთ; უარყოფითი — შიგნით
AEN: positive — outwards; negative — inwards

--- easy field
KA: როგორ შეიცვლება წერტილოვანი მუხტის ველის დაძაბულობა, თუ მანძილს $3$-ჯერ გავზრდით?
EN: How does a point charge's field change if the distance is tripled?
HKA: $E \sim \dfrac{1}{r^2}$.
HEN: $E \sim \dfrac{1}{r^2}$.
SKA: $9$-ჯერ შემცირდება.
SEN: It becomes $9$ times smaller.
AKA: $9$-ჯერ შემცირდება
AEN: $9$ times smaller

--- easy field
KA: პროტონი $2 \cdot 10^3\ \text{ნ/კ}$ დაძაბულობის ველშია. რა ძალა მოქმედებს მასზე?
EN: A proton is in a field of $2 \times 10^3\ \text{N/C}$. What force acts on it?
HKA: $F = e E$.
HEN: $F = e E$.
SKA: $F = 1{,}6 \cdot 10^{-19} \cdot 2 \cdot 10^3 = 3{,}2 \cdot 10^{-16}\ \text{ნ}$
SEN: $F = 1.6 \times 10^{-19} \cdot 2 \times 10^3 = 3.2 \times 10^{-16}\ \text{N}$
AKA: $3{,}2 \cdot 10^{-16}\ \text{ნ}$
AEN: $3.2 \times 10^{-16}\ \text{N}$

--- easy field
KA: რა არის ელექტრული ველის ძალწირები? შეიძლება თუ არა ორი ძალწირის გადაკვეთა?
EN: What are electric field lines? Can two field lines cross?
HKA: ყოველ წერტილში დაძაბულობას ერთი მიმართულება აქვს.
HEN: At each point the field has only one direction.
SKA: ძალწირები — წირები, რომელთა მხები თითოეულ წერტილში დაძაბულობის მიმართულებას ემთხვევა; სიხშირე დაძაბულობის სიდიდეს აჩვენებს.
ვერ გადაიკვეთება — გადაკვეთის წერტილში ველს ორი მიმართულება ექნებოდა.
SEN: Field lines are lines whose tangent at every point gives the field's direction; their density shows its strength.
They can't cross — at a crossing the field would have two directions.
AKA: ვერ გადაიკვეთება
AEN: they can't cross

--- easy field
KA: ელექტრონი $500\ \text{ნ/კ}$ ველშია. იპოვეთ მისი აჩქარება.
EN: An electron is in a $500\ \text{N/C}$ field. Find its acceleration.
HKA: $a = \dfrac{e E}{m}$.
HEN: $a = \dfrac{e E}{m}$.
SKA: $a = \dfrac{1{,}6 \cdot 10^{-19} \cdot 500}{9{,}1 \cdot 10^{-31}} \approx 8{,}8 \cdot 10^{13}\ \text{მ/წმ}^2$
SEN: $a = \dfrac{1.6 \times 10^{-19} \cdot 500}{9.1 \times 10^{-31}} \approx 8.8 \times 10^{13}\ \text{m/s}^2$
AKA: $\approx 8{,}8 \cdot 10^{13}\ \text{მ/წმ}^2$
AEN: $\approx 8.8 \times 10^{13}\ \text{m/s}^2$

--- easy field
KA: რატომ არის დამუხტული ლითონის სხეულის შიგნით ველის დაძაბულობა ნული?
EN: Why is the field inside a charged metal body zero?
HKA: გამტარში თავისუფალი ელექტრონებია.
HEN: A conductor contains free electrons.
SKA: ველი რომ ყოფილიყო, თავისუფალი ელექტრონები იმოძრავებდნენ. ისინი ისე გადანაწილდებიან (ზედაპირზე), რომ შიგნით ველი გაქრეს — მხოლოდ მაშინ დგება წონასწორობა.
SEN: If there were a field, the free electrons would move. They rearrange (onto the surface) until the field inside vanishes — only then is there equilibrium.
AKA: მუხტები ზედაპირზე ისე ნაწილდება, რომ შიგნით $E = 0$
AEN: the charges settle on the surface so that $E = 0$ inside

--- medium field
KA: $+2\ \text{ნკ}$ და $+8\ \text{ნკ}$ მუხტები $0{,}3\ \text{მ}$-ზეა. რომელ წერტილში არის ველი ნული?
EN: Charges $+2\ \text{nC}$ and $+8\ \text{nC}$ are $0.3\ \text{m}$ apart. Where is the field zero?
HKA: მუხტებს შორის: $\dfrac{2}{x^2} = \dfrac{8}{(0{,}3 - x)^2}$.
HEN: Between them: $\dfrac{2}{x^2} = \dfrac{8}{(0.3 - x)^2}$.
SKA: $0{,}3 - x = 2x \Rightarrow x = 0{,}1\ \text{მ}$ ($2\ \text{ნკ}$-დან)
SEN: $0.3 - x = 2x \Rightarrow x = 0.1\ \text{m}$ (from the $2\ \text{nC}$)
AKA: $2\ \text{ნკ}$-დან $0{,}1\ \text{მ}$-ზე
AEN: $0.1\ \text{m}$ from the $2\ \text{nC}$ charge

--- medium field
KA: $+3\ \text{ნკ}$ და $-3\ \text{ნკ}$ მუხტები $6\ \text{სმ}$-ზეა. იპოვეთ ველი მათ შუა წერტილში.
EN: Charges $+3\ \text{nC}$ and $-3\ \text{nC}$ are $6\ \text{cm}$ apart. Find the field at the midpoint.
HKA: ორივე ველი ერთი მიმართულებისაა — დადებითიდან უარყოფითისკენ.
HEN: Both fields point the same way — from positive towards negative.
SKA: $E_1 = 9 \cdot 10^9 \cdot \dfrac{3 \cdot 10^{-9}}{9 \cdot 10^{-4}} = 3 \cdot 10^4\ \text{ნ/კ}$
$E = 2E_1 = 6 \cdot 10^4\ \text{ნ/კ}$
SEN: $E_1 = 9 \times 10^9 \cdot \dfrac{3 \times 10^{-9}}{9 \times 10^{-4}} = 3 \times 10^4\ \text{N/C}$
$E = 2E_1 = 6 \times 10^4\ \text{N/C}$
AKA: $6 \cdot 10^4\ \text{ნ/კ}$
AEN: $6 \times 10^4\ \text{N/C}$

--- medium field
KA: მტვრის ნაწილაკი ($m = 10^{-11}\ \text{გ}$) ვერტიკალურ ველში ($E = 10^4\ \text{ნ/კ}$) ლივლივებს. რა მუხტი აქვს? რამდენი ელექტრონია ზედმეტი?
EN: A dust grain ($m = 10^{-11}\ \text{g}$) floats in a vertical field ($E = 10^4\ \text{N/C}$). What is its charge? How many extra electrons?
HKA: $q E = m g$.
HEN: $q E = m g$.
SKA: $q = \dfrac{10^{-14} \cdot 10}{10^4} = 10^{-17}\ \text{კ}$
$N = \dfrac{10^{-17}}{1{,}6 \cdot 10^{-19}} \approx 62$
SEN: $q = \dfrac{10^{-14} \cdot 10}{10^4} = 10^{-17}\ \text{C}$
$N = \dfrac{10^{-17}}{1.6 \times 10^{-19}} \approx 62$
AKA: $10^{-17}\ \text{კ}$; $\approx 62$
AEN: $10^{-17}\ \text{C}$; $\approx 62$

--- medium field
KA: ელექტრონი უძრაობიდან $2000\ \text{ნ/კ}$ ველში $1\ \text{სმ}$-ს გადის. რა სიჩქარეს იძენს?
EN: An electron starts from rest in a $2000\ \text{N/C}$ field and travels $1\ \text{cm}$. What speed does it reach?
HKA: $v = \sqrt{2 a s}$, $a = \dfrac{eE}{m}$.
HEN: $v = \sqrt{2 a s}$, $a = \dfrac{eE}{m}$.
SKA: $a = \dfrac{1{,}6 \cdot 10^{-19} \cdot 2000}{9{,}1 \cdot 10^{-31}} \approx 3{,}5 \cdot 10^{14}\ \text{მ/წმ}^2$
$v = \sqrt{2 \cdot 3{,}5 \cdot 10^{14} \cdot 0{,}01} \approx 2{,}65 \cdot 10^6\ \text{მ/წმ}$
SEN: $a = \dfrac{1.6 \times 10^{-19} \cdot 2000}{9.1 \times 10^{-31}} \approx 3.5 \times 10^{14}\ \text{m/s}^2$
$v = \sqrt{2 \cdot 3.5 \times 10^{14} \cdot 0.01} \approx 2.65 \times 10^6\ \text{m/s}$
AKA: $\approx 2{,}7 \cdot 10^6\ \text{მ/წმ}$
AEN: $\approx 2.7 \times 10^6\ \text{m/s}$

--- medium field
KA: ორი $+q$ მუხტი $2a$ მანძილზეა. იპოვეთ ველი მათ შუა პერპენდიკულარზე, შუა წერტილიდან $a$ მანძილზე.
EN: Two charges $+q$ are $2a$ apart. Find the field on their perpendicular bisector at distance $a$ from the midpoint.
HKA: თითოეულიდან მანძილი $a\sqrt 2$; პერპენდიკულარის გასწვრივ მდგენელები იკრიბება.
HEN: Each is $a\sqrt 2$ away; the components along the bisector add.
SKA: $E_1 = k\dfrac{q}{2a^2}$, მდგენელი $E_1\cos 45°$
$E = 2 \cdot k\dfrac{q}{2a^2} \cdot \dfrac{\sqrt 2}{2} = \dfrac{\sqrt 2}{2}\, k\dfrac{q}{a^2} \approx 0{,}71\, k\dfrac{q}{a^2}$
SEN: $E_1 = k\dfrac{q}{2a^2}$, component $E_1\cos 45°$
$E = 2 \cdot k\dfrac{q}{2a^2} \cdot \dfrac{\sqrt 2}{2} = \dfrac{\sqrt 2}{2}\, k\dfrac{q}{a^2} \approx 0.71\, k\dfrac{q}{a^2}$
AKA: $\approx 0{,}71\, k\dfrac{q}{a^2}$
AEN: $\approx 0.71\, k\dfrac{q}{a^2}$

--- medium field
KA: ლითონის სფეროს ($R = 10\ \text{სმ}$) $20\ \text{ნკ}$ მუხტი აქვს. იპოვეთ დაძაბულობა ცენტრიდან $5\ \text{სმ}$-ზე და $20\ \text{სმ}$-ზე.
EN: A metal sphere ($R = 10\ \text{cm}$) carries $20\ \text{nC}$. Find the field $5\ \text{cm}$ and $20\ \text{cm}$ from the centre.
HKA: შიგნით $E = 0$, გარეთ — როგორც წერტილოვანი მუხტის.
HEN: Inside $E = 0$; outside it's like a point charge.
SKA: $5\ \text{სმ}$: $E = 0$
$20\ \text{სმ}$: $E = 9 \cdot 10^9 \cdot \dfrac{2 \cdot 10^{-8}}{0{,}04} = 4500\ \text{ნ/კ}$
SEN: $5\ \text{cm}$: $E = 0$
$20\ \text{cm}$: $E = 9 \times 10^9 \cdot \dfrac{2 \times 10^{-8}}{0.04} = 4500\ \text{N/C}$
AKA: $0$; $4500\ \text{ნ/კ}$
AEN: $0$; $4500\ \text{N/C}$

--- medium field
KA: $0{,}1\ \text{გ}$ ბურთულა ($q = 1\ \text{მკკ}$) ძაფზე ჰკიდია ჰორიზონტალურ ველში ($E = 1000\ \text{ნ/კ}$). რა კუთხით გადაიხრება ძაფი?
EN: A $0.1\ \text{g}$ ball ($q = 1\ \mu\text{C}$) hangs on a thread in a horizontal field ($E = 1000\ \text{N/C}$). At what angle does the thread hang?
HKA: $\tan\alpha = \dfrac{q E}{m g}$.
HEN: $\tan\alpha = \dfrac{q E}{m g}$.
SKA: $\tan\alpha = \dfrac{10^{-6} \cdot 1000}{10^{-4} \cdot 10} = 1 \Rightarrow \alpha = 45°$
SEN: $\tan\alpha = \dfrac{10^{-6} \cdot 1000}{10^{-4} \cdot 10} = 1 \Rightarrow \alpha = 45°$
AKA: $45°$
AEN: $45°$

--- medium field
KA: ორი პარალელური ფირფიტა ტოლი და საპირისპირო მუხტებითაა დამუხტული. როგორია ველი მათ შორის და გარეთ?
EN: Two parallel plates carry equal and opposite charges. What is the field like between them and outside?
HKA: თითოეული ფირფიტის ველი $\dfrac{\sigma}{2\varepsilon_0}$-ია.
HEN: Each plate's field is $\dfrac{\sigma}{2\varepsilon_0}$.
SKA: მათ შორის ველები იკრიბება: ერთგვაროვანი ველი $E = \dfrac{\sigma}{\varepsilon_0}$, დადებითიდან უარყოფითისკენ.
გარეთ ველები ერთმანეთს აბათილებს: $E \approx 0$.
SEN: Between them the fields add: a uniform field $E = \dfrac{\sigma}{\varepsilon_0}$, from positive to negative.
Outside they cancel: $E \approx 0$.
AKA: შიგნით ერთგვაროვანი, გარეთ $\approx 0$
AEN: uniform inside, $\approx 0$ outside

--- hard field
KA: $+q$ ($x = 0$) და $-4q$ ($x = 0{,}3\ \text{მ}$). იპოვეთ წერტილი $x$ ღერძზე, სადაც ველი ნულია.
EN: Charges $+q$ at $x = 0$ and $-4q$ at $x = 0.3\ \text{m}$. Find the point on the $x$ axis where the field is zero.
HKA: სხვადასხვა ნიშნისას ნულოვანი წერტილი გარეთაა, პატარა მუხტის მხარეს.
HEN: For opposite signs the zero point is outside, beyond the smaller charge.
SKA: $x < 0$-ზე: $\dfrac{q}{x^2} = \dfrac{4q}{(|x| + 0{,}3)^2}$ $\Rightarrow |x| + 0{,}3 = 2|x| \Rightarrow |x| = 0{,}3$
$x = -0{,}3\ \text{მ}$
SEN: For $x < 0$: $\dfrac{q}{x^2} = \dfrac{4q}{(|x| + 0.3)^2}$ $\Rightarrow |x| + 0.3 = 2|x| \Rightarrow |x| = 0.3$
$x = -0.3\ \text{m}$
AKA: $x = -0{,}3\ \text{მ}$
AEN: $x = -0.3\ \text{m}$

--- hard field
KA: ელექტრონი $10^7\ \text{მ/წმ}$-ით შედის ბრტყელ კონდენსატორში ფირფიტების პარალელურად. ფირფიტების სიგრძეა $5\ \text{სმ}$, $E = 2 \cdot 10^4\ \text{ნ/კ}$. რამდენით გადაიხრება გამოსვლისას?
EN: An electron enters a parallel-plate capacitor at $10^7\ \text{m/s}$ parallel to the plates. The plates are $5\ \text{cm}$ long, $E = 2 \times 10^4\ \text{N/C}$. How far is it deflected on leaving?
HKA: ეს „ჰორიზონტალური სროლაა“: $t = \dfrac{l}{v}$, $y = \dfrac{a t^2}{2}$.
HEN: It's like a horizontal throw: $t = \dfrac{l}{v}$, $y = \dfrac{a t^2}{2}$.
SKA: $t = 5 \cdot 10^{-9}\ \text{წმ}$, $\ a = \dfrac{1{,}6 \cdot 10^{-19} \cdot 2 \cdot 10^4}{9{,}1 \cdot 10^{-31}} \approx 3{,}5 \cdot 10^{15}\ \text{მ/წმ}^2$
$y = \dfrac{3{,}5 \cdot 10^{15} \cdot 25 \cdot 10^{-18}}{2} \approx 0{,}044\ \text{მ} = 4{,}4\ \text{სმ}$
SEN: $t = 5 \times 10^{-9}\ \text{s}$, $\ a = \dfrac{1.6 \times 10^{-19} \cdot 2 \times 10^4}{9.1 \times 10^{-31}} \approx 3.5 \times 10^{15}\ \text{m/s}^2$
$y = \dfrac{3.5 \times 10^{15} \cdot 25 \times 10^{-18}}{2} \approx 0.044\ \text{m} = 4.4\ \text{cm}$
AKA: $\approx 4{,}4\ \text{სმ}$
AEN: $\approx 4.4\ \text{cm}$

--- hard field
KA: კვადრატის ($a = 10\ \text{სმ}$) სამ წვეროში $+1\ \text{ნკ}$ მუხტებია. იპოვეთ ველი მეოთხე წვეროში.
EN: Three corners of a square ($a = 10\ \text{cm}$) hold $+1\ \text{nC}$ charges. Find the field at the fourth corner.
HKA: ორი მეზობლის ველი მართი კუთხითაა, დიაგონალზე მყოფისა — მათი ჯამის მიმართულებით.
HEN: The neighbours' fields are at right angles; the diagonal one points along their sum.
SKA: $E_1 = 9 \cdot 10^9 \cdot \dfrac{10^{-9}}{0{,}01} = 900\ \text{ნ/კ}$; ორის ჯამი: $900\sqrt 2 \approx 1273\ \text{ნ/კ}$
დიაგონალი: $E_3 = \dfrac{900}{2} = 450\ \text{ნ/კ}$
$E \approx 1273 + 450 = 1723\ \text{ნ/კ}$, დიაგონალის გასწვრივ გარეთ
SEN: $E_1 = 9 \times 10^9 \cdot \dfrac{10^{-9}}{0.01} = 900\ \text{N/C}$; the two together: $900\sqrt 2 \approx 1273\ \text{N/C}$
Diagonal: $E_3 = \dfrac{900}{2} = 450\ \text{N/C}$
$E \approx 1273 + 450 = 1723\ \text{N/C}$, outwards along the diagonal
AKA: $\approx 1{,}7 \cdot 10^3\ \text{ნ/კ}$
AEN: $\approx 1.7 \times 10^3\ \text{N/C}$

--- hard field
KA: ბურთულა ($m = 2\ \text{გ}$, $q = 10\ \text{მკკ}$) $l = 1\ \text{მ}$ ძაფზე ჰკიდია ვერტიკალურ ველში ($E = 1000\ \text{ნ/კ}$, ქვემოთ). იპოვეთ რხევის პერიოდი. ($T_0 = 2\pi\sqrt{l/g}$)
EN: A ball ($m = 2\ \text{g}$, $q = 10\ \mu\text{C}$) hangs on a $1\ \text{m}$ thread in a downward field ($E = 1000\ \text{N/C}$). Find its period of small oscillations. ($T_0 = 2\pi\sqrt{l/g}$)
HKA: ეფექტური აჩქარება $g' = g + \dfrac{qE}{m}$.
HEN: Effective acceleration $g' = g + \dfrac{qE}{m}$.
SKA: $\dfrac{qE}{m} = \dfrac{10^{-5} \cdot 1000}{2 \cdot 10^{-3}} = 5\ \text{მ/წმ}^2$, $\ g' = 15\ \text{მ/წმ}^2$
$T = 2\pi\sqrt{\dfrac{1}{15}} \approx 1{,}62\ \text{წმ}$
SEN: $\dfrac{qE}{m} = \dfrac{10^{-5} \cdot 1000}{2 \times 10^{-3}} = 5\ \text{m/s}^2$, $\ g' = 15\ \text{m/s}^2$
$T = 2\pi\sqrt{\dfrac{1}{15}} \approx 1.62\ \text{s}$
AKA: $\approx 1{,}6\ \text{წმ}$
AEN: $\approx 1.6\ \text{s}$

--- hard field
KA: პროტონი უძრაობიდან ერთგვაროვან ველში ($E = 10^3\ \text{ნ/კ}$) იწყებს მოძრაობას. რა დრო დასჭირდება $1\ \text{სმ}$-ის გავლას? რა სიჩქარე ექნება? ($m_p = 1{,}67 \cdot 10^{-27}\ \text{კგ}$)
EN: A proton starts from rest in a uniform field ($E = 10^3\ \text{N/C}$). How long does it take to travel $1\ \text{cm}$? What speed does it reach? ($m_p = 1.67 \times 10^{-27}\ \text{kg}$)
HKA: $a = \dfrac{eE}{m_p}$.
HEN: $a = \dfrac{eE}{m_p}$.
SKA: $a = \dfrac{1{,}6 \cdot 10^{-16}}{1{,}67 \cdot 10^{-27}} \approx 9{,}6 \cdot 10^{10}\ \text{მ/წმ}^2$
$t = \sqrt{\dfrac{0{,}02}{9{,}6 \cdot 10^{10}}} \approx 4{,}6 \cdot 10^{-7}\ \text{წმ}$, $\ v = a t \approx 4{,}4 \cdot 10^4\ \text{მ/წმ}$
SEN: $a = \dfrac{1.6 \times 10^{-16}}{1.67 \times 10^{-27}} \approx 9.6 \times 10^{10}\ \text{m/s}^2$
$t = \sqrt{\dfrac{0.02}{9.6 \times 10^{10}}} \approx 4.6 \times 10^{-7}\ \text{s}$, $\ v = a t \approx 4.4 \times 10^4\ \text{m/s}$
AKA: $\approx 0{,}46\ \text{მკწმ}$; $\approx 44\ \text{კმ/წმ}$
AEN: $\approx 0.46\ \mu\text{s}$; $\approx 44\ \text{km/s}$

--- hard field
KA: დედამიწის ზედაპირთან ელექტრული ველია $\approx 130\ \text{ნ/კ}$ (ქვემოთ მიმართული). შეაფასეთ დედამიწის მუხტი. რა ნიშნისაა?
EN: Near the Earth's surface there's an electric field of $\approx 130\ \text{N/C}$ pointing down. Estimate the Earth's charge. What is its sign?
HKA: სფეროსთვის $E = k\dfrac{Q}{R^2}$; ველი ქვემოთ — მუხტი უარყოფითია.
HEN: For a sphere $E = k\dfrac{Q}{R^2}$; a downward field means a negative charge.
SKA: $|Q| = \dfrac{E R^2}{k} = \dfrac{130 \cdot (6{,}4 \cdot 10^6)^2}{9 \cdot 10^9} \approx 5{,}9 \cdot 10^5\ \text{კ}$, უარყოფითი.
SEN: $|Q| = \dfrac{E R^2}{k} = \dfrac{130 \cdot (6.4 \times 10^6)^2}{9 \times 10^9} \approx 5.9 \times 10^5\ \text{C}$, negative.
AKA: $\approx -6 \cdot 10^5\ \text{კ}$
AEN: $\approx -6 \times 10^5\ \text{C}$

--- easy potential
KA: ველმა $4\ \text{მკკ}$ მუხტის გადატანისას $8 \cdot 10^{-4}\ \text{ჯ}$ მუშაობა შეასრულა. იპოვეთ ძაბვა წერტილებს შორის.
EN: The field does $8 \times 10^{-4}\ \text{J}$ of work moving a $4\ \mu\text{C}$ charge. Find the voltage between the points.
HKA: $U = \dfrac{A}{q}$.
HEN: $U = \dfrac{W}{q}$.
SKA: $U = \dfrac{8 \cdot 10^{-4}}{4 \cdot 10^{-6}} = 200\ \text{ვ}$
SEN: $U = \dfrac{8 \times 10^{-4}}{4 \times 10^{-6}} = 200\ \text{V}$
AKA: $200\ \text{ვ}$
AEN: $200\ \text{V}$

--- easy potential
KA: $3\ \text{ნკ}$ მუხტის ველის პოტენციალი რას უდრის $0{,}9\ \text{მ}$-ზე?
EN: What is the potential $0.9\ \text{m}$ from a $3\ \text{nC}$ charge?
HKA: $\varphi = k\dfrac{q}{r}$.
HEN: $\varphi = k\dfrac{q}{r}$.
SKA: $\varphi = 9 \cdot 10^9 \cdot \dfrac{3 \cdot 10^{-9}}{0{,}9} = 30\ \text{ვ}$
SEN: $\varphi = 9 \times 10^9 \cdot \dfrac{3 \times 10^{-9}}{0.9} = 30\ \text{V}$
AKA: $30\ \text{ვ}$
AEN: $30\ \text{V}$

--- easy potential
KA: რა მუშაობას ასრულებს ველი ელექტრონის $1\ \text{ვ}$ პოტენციალთა სხვაობის გავლისას? (ეს არის $1$ ელექტრონვოლტი)
EN: How much work does the field do on an electron crossing $1\ \text{V}$? (This is $1$ electronvolt.)
HKA: $A = e U$.
HEN: $W = e U$.
SKA: $A = 1{,}6 \cdot 10^{-19} \cdot 1 = 1{,}6 \cdot 10^{-19}\ \text{ჯ} = 1\ \text{ევ}$
SEN: $W = 1.6 \times 10^{-19} \cdot 1 = 1.6 \times 10^{-19}\ \text{J} = 1\ \text{eV}$
AKA: $1{,}6 \cdot 10^{-19}\ \text{ჯ}$
AEN: $1.6 \times 10^{-19}\ \text{J}$

--- easy potential
KA: ერთგვაროვან ველში ($E = 200\ \text{ვ/მ}$) რა ძაბვაა ძალწირის გასწვრივ $5\ \text{სმ}$-ით დაშორებულ წერტილებს შორის?
EN: In a uniform field ($E = 200\ \text{V/m}$) what is the voltage between points $5\ \text{cm}$ apart along a field line?
HKA: $U = E d$.
HEN: $U = E d$.
SKA: $U = 200 \cdot 0{,}05 = 10\ \text{ვ}$
SEN: $U = 200 \cdot 0.05 = 10\ \text{V}$
AKA: $10\ \text{ვ}$
AEN: $10\ \text{V}$

--- easy potential
KA: რა არის ეკვიპოტენციური ზედაპირი? რა მუშაობას ასრულებს ველი მუხტის მის გასწვრივ გადატანისას?
EN: What is an equipotential surface? How much work does the field do moving a charge along it?
HKA: ყველა წერტილს ერთი პოტენციალი აქვს.
HEN: All its points have the same potential.
SKA: ზედაპირი, რომლის ყველა წერტილს ერთნაირი პოტენციალი აქვს; ის ძალწირების პერპენდიკულარულია.
მუშაობა $A = q(\varphi_1 - \varphi_2) = 0$.
SEN: A surface all of whose points have the same potential; it is perpendicular to the field lines.
Work $W = q(\varphi_1 - \varphi_2) = 0$.
AKA: $A = 0$
AEN: $W = 0$

--- easy potential
KA: $1\ \text{ნკ}$ მუხტი $\varphi_1 = 500\ \text{ვ}$ წერტილიდან $\varphi_2 = 200\ \text{ვ}$ წერტილში გადაიტანეს. რა მუშაობა შეასრულა ველმა?
EN: A $1\ \text{nC}$ charge is moved from a point at $500\ \text{V}$ to one at $200\ \text{V}$. How much work does the field do?
HKA: $A = q(\varphi_1 - \varphi_2)$.
HEN: $W = q(\varphi_1 - \varphi_2)$.
SKA: $A = 10^{-9} \cdot 300 = 3 \cdot 10^{-7}\ \text{ჯ}$
SEN: $W = 10^{-9} \cdot 300 = 3 \times 10^{-7}\ \text{J}$
AKA: $3 \cdot 10^{-7}\ \text{ჯ}$
AEN: $3 \times 10^{-7}\ \text{J}$

--- easy potential
KA: ორ ფირფიტას შორის $2\ \text{მმ}$-ია, ძაბვა $10\ \text{ვ}$. იპოვეთ ველის დაძაბულობა.
EN: Two plates are $2\ \text{mm}$ apart with $10\ \text{V}$ between them. Find the field.
HKA: $E = \dfrac{U}{d}$.
HEN: $E = \dfrac{U}{d}$.
SKA: $E = \dfrac{10}{0{,}002} = 5000\ \text{ვ/მ}$
SEN: $E = \dfrac{10}{0.002} = 5000\ \text{V/m}$
AKA: $5000\ \text{ვ/მ}$
AEN: $5000\ \text{V/m}$

--- easy potential
KA: რა კინეტიკურ ენერგიას იძენს $\alpha$-ნაწილაკი ($q = 2e$) $1000\ \text{ვ}$-იანი ძაბვის გავლისას? გამოსახეთ ევ-ებში და ჯოულებში.
EN: What kinetic energy does an alpha particle ($q = 2e$) gain crossing $1000\ \text{V}$? Give it in eV and joules.
HKA: $E = q U$.
HEN: $E = q U$.
SKA: $E = 2 \cdot 1000 = 2000\ \text{ევ} = 2000 \cdot 1{,}6 \cdot 10^{-19} = 3{,}2 \cdot 10^{-16}\ \text{ჯ}$
SEN: $E = 2 \cdot 1000 = 2000\ \text{eV} = 2000 \cdot 1.6 \times 10^{-19} = 3.2 \times 10^{-16}\ \text{J}$
AKA: $2\ \text{კევ} = 3{,}2 \cdot 10^{-16}\ \text{ჯ}$
AEN: $2\ \text{keV} = 3.2 \times 10^{-16}\ \text{J}$

--- medium potential
KA: ორი მუხტი, $+2\ \text{ნკ}$ და $-1\ \text{ნკ}$, $0{,}3\ \text{მ}$-ზეა. იპოვეთ პოტენციალი მათ შუა წერტილში.
EN: Charges $+2\ \text{nC}$ and $-1\ \text{nC}$ are $0.3\ \text{m}$ apart. Find the potential at the midpoint.
HKA: პოტენციალები ალგებრულად იკრიბება.
HEN: Potentials add algebraically.
SKA: $\varphi = 9 \cdot 10^9 \cdot \dfrac{2 \cdot 10^{-9} - 10^{-9}}{0{,}15} = 60\ \text{ვ}$
SEN: $\varphi = 9 \times 10^9 \cdot \dfrac{2 \times 10^{-9} - 10^{-9}}{0.15} = 60\ \text{V}$
AKA: $60\ \text{ვ}$
AEN: $60\ \text{V}$

--- medium potential
KA: ელექტრონი უძრაობიდან $500\ \text{ვ}$-ს გადის. იპოვეთ მისი სიჩქარე.
EN: An electron starts from rest and crosses $500\ \text{V}$. Find its speed.
HKA: $eU = \dfrac{m v^2}{2}$.
HEN: $eU = \dfrac{m v^2}{2}$.
SKA: $v = \sqrt{\dfrac{2 \cdot 1{,}6 \cdot 10^{-19} \cdot 500}{9{,}1 \cdot 10^{-31}}} \approx 1{,}33 \cdot 10^7\ \text{მ/წმ}$
SEN: $v = \sqrt{\dfrac{2 \cdot 1.6 \times 10^{-19} \cdot 500}{9.1 \times 10^{-31}}} \approx 1.33 \times 10^7\ \text{m/s}$
AKA: $\approx 1{,}3 \cdot 10^7\ \text{მ/წმ}$
AEN: $\approx 1.3 \times 10^7\ \text{m/s}$

--- medium potential
KA: ლითონის სფეროს ($R = 5\ \text{სმ}$) პოტენციალი $900\ \text{ვ}$-ია. იპოვეთ მისი მუხტი და ველი ზედაპირთან.
EN: A metal sphere ($R = 5\ \text{cm}$) is at $900\ \text{V}$. Find its charge and the field at its surface.
HKA: $\varphi = k\dfrac{Q}{R}$, $E = \dfrac{\varphi}{R}$.
HEN: $\varphi = k\dfrac{Q}{R}$, $E = \dfrac{\varphi}{R}$.
SKA: $Q = \dfrac{900 \cdot 0{,}05}{9 \cdot 10^9} = 5 \cdot 10^{-9}\ \text{კ}$
$E = \dfrac{900}{0{,}05} = 1{,}8 \cdot 10^4\ \text{ვ/მ}$
SEN: $Q = \dfrac{900 \cdot 0.05}{9 \times 10^9} = 5 \times 10^{-9}\ \text{C}$
$E = \dfrac{900}{0.05} = 1.8 \times 10^4\ \text{V/m}$
AKA: $5\ \text{ნკ}$; $1{,}8 \cdot 10^4\ \text{ვ/მ}$
AEN: $5\ \text{nC}$; $1.8 \times 10^4\ \text{V/m}$

--- medium potential
KA: რა მუშაობაა საჭირო ორი $1\ \text{მკკ}$ მუხტის $1\ \text{მ}$-დან $0{,}1\ \text{მ}$-მდე მისაახლოებლად?
EN: How much work is needed to bring two $1\ \mu\text{C}$ charges from $1\ \text{m}$ to $0.1\ \text{m}$ apart?
HKA: $A = k q^2\left(\dfrac{1}{r_2} - \dfrac{1}{r_1}\right)$.
HEN: $W = k q^2\left(\dfrac{1}{r_2} - \dfrac{1}{r_1}\right)$.
SKA: $A = 9 \cdot 10^9 \cdot 10^{-12}(10 - 1) = 0{,}081\ \text{ჯ}$
SEN: $W = 9 \times 10^9 \cdot 10^{-12}(10 - 1) = 0.081\ \text{J}$
AKA: $0{,}081\ \text{ჯ}$
AEN: $0.081\ \text{J}$

--- medium potential
KA: ელექტრონი $4 \cdot 10^6\ \text{მ/წმ}$-ით შედის დამამუხრუჭებელ ველში. რა ძაბვა შეაჩერებს მას?
EN: An electron at $4 \times 10^6\ \text{m/s}$ enters a retarding field. What voltage stops it?
HKA: $eU = \dfrac{m v^2}{2}$.
HEN: $eU = \dfrac{m v^2}{2}$.
SKA: $U = \dfrac{9{,}1 \cdot 10^{-31} \cdot 1{,}6 \cdot 10^{13}}{2 \cdot 1{,}6 \cdot 10^{-19}} \approx 45\ \text{ვ}$
SEN: $U = \dfrac{9.1 \times 10^{-31} \cdot 1.6 \times 10^{13}}{2 \cdot 1.6 \times 10^{-19}} \approx 45\ \text{V}$
AKA: $\approx 45\ \text{ვ}$
AEN: $\approx 45\ \text{V}$

--- medium potential
KA: ერთგვაროვან ველში ($E = 400\ \text{ვ/მ}$) A წერტილის პოტენციალი $100\ \text{ვ}$-ია. B წერტილი ძალწირის გასწვრივ $0{,}2\ \text{მ}$-ით შორსაა (ველის მიმართულებით). იპოვეთ $\varphi_B$.
EN: In a uniform field ($E = 400\ \text{V/m}$) point A is at $100\ \text{V}$. Point B is $0.2\ \text{m}$ further along a field line (in the field's direction). Find $\varphi_B$.
HKA: ველის მიმართულებით პოტენციალი მცირდება.
HEN: The potential falls in the direction of the field.
SKA: $\varphi_B = 100 - 400 \cdot 0{,}2 = 20\ \text{ვ}$
SEN: $\varphi_B = 100 - 400 \cdot 0.2 = 20\ \text{V}$
AKA: $20\ \text{ვ}$
AEN: $20\ \text{V}$

--- medium potential
KA: ორი ლითონის სფერო ($R_1 = 10\ \text{სმ}$, $R_2 = 5\ \text{სმ}$) გრძელი მავთულითაა შეერთებული და ჯამური მუხტი $30\ \text{ნკ}$-ია. როგორ განაწილდება მუხტი?
EN: Two metal spheres ($R_1 = 10\ \text{cm}$, $R_2 = 5\ \text{cm}$) are joined by a long wire and carry $30\ \text{nC}$ in total. How is the charge shared?
HKA: შეერთებისას პოტენციალები ტოლდება: $\dfrac{q_1}{R_1} = \dfrac{q_2}{R_2}$.
HEN: Once joined their potentials are equal: $\dfrac{q_1}{R_1} = \dfrac{q_2}{R_2}$.
SKA: $q_1 = 2 q_2$, $q_1 + q_2 = 30 \Rightarrow q_1 = 20\ \text{ნკ}$, $q_2 = 10\ \text{ნკ}$
SEN: $q_1 = 2 q_2$, $q_1 + q_2 = 30 \Rightarrow q_1 = 20\ \text{nC}$, $q_2 = 10\ \text{nC}$
AKA: $20\ \text{ნკ}$ და $10\ \text{ნკ}$
AEN: $20\ \text{nC}$ and $10\ \text{nC}$

--- medium potential
KA: მუხტის პოტენციალი $A$ წერტილში $100\ \text{ვ}$-ია, ცენტრიდან $0{,}3\ \text{მ}$-ზე. რა პოტენციალია $0{,}1\ \text{მ}$-ზე? რა მუშაობას ასრულებს ველი $2\ \text{ნკ}$ მუხტის $0{,}1$-დან $0{,}3\ \text{მ}$-მდე გადატანისას?
EN: The potential of a point charge is $100\ \text{V}$ at $0.3\ \text{m}$. What is it at $0.1\ \text{m}$? How much work does the field do moving $2\ \text{nC}$ from $0.1$ to $0.3\ \text{m}$?
HKA: $\varphi \sim \dfrac{1}{r}$.
HEN: $\varphi \sim \dfrac{1}{r}$.
SKA: $\varphi(0{,}1) = 300\ \text{ვ}$
$A = 2 \cdot 10^{-9} \cdot (300 - 100) = 4 \cdot 10^{-7}\ \text{ჯ}$
SEN: $\varphi(0.1) = 300\ \text{V}$
$W = 2 \times 10^{-9} \cdot (300 - 100) = 4 \times 10^{-7}\ \text{J}$
AKA: $300\ \text{ვ}$; $4 \cdot 10^{-7}\ \text{ჯ}$
AEN: $300\ \text{V}$; $4 \times 10^{-7}\ \text{J}$

--- hard potential
KA: ორი პროტონი ერთმანეთის მიმართულებით $10^6\ \text{მ/წმ}$-ით მოძრაობს (თითოეული). რა უმცირეს მანძილზე მიუახლოვდებიან? ($m_p = 1{,}67 \cdot 10^{-27}\ \text{კგ}$)
EN: Two protons approach each other at $10^6\ \text{m/s}$ each. What is their closest distance of approach? ($m_p = 1.67 \times 10^{-27}\ \text{kg}$)
HKA: უახლოეს მდგომარეობაში ორივე ჩერდება; მთელი კინეტიკური ენერგია პოტენციურად იქცევა.
HEN: At closest approach both stop; all kinetic energy becomes potential energy.
SKA: $2 \cdot \dfrac{m v^2}{2} = k\dfrac{e^2}{r} \Rightarrow r = \dfrac{k e^2}{m v^2}$
$r = \dfrac{9 \cdot 10^9 \cdot 2{,}56 \cdot 10^{-38}}{1{,}67 \cdot 10^{-27} \cdot 10^{12}} \approx 1{,}4 \cdot 10^{-13}\ \text{მ}$
SEN: $2 \cdot \dfrac{m v^2}{2} = k\dfrac{e^2}{r} \Rightarrow r = \dfrac{k e^2}{m v^2}$
$r = \dfrac{9 \times 10^9 \cdot 2.56 \times 10^{-38}}{1.67 \times 10^{-27} \cdot 10^{12}} \approx 1.4 \times 10^{-13}\ \text{m}$
AKA: $\approx 1{,}4 \cdot 10^{-13}\ \text{მ}$
AEN: $\approx 1.4 \times 10^{-13}\ \text{m}$

--- hard potential
KA: კვადრატის ($a = 0{,}1\ \text{მ}$) წვეროებში $+1$, $+1$, $-1$, $-1\ \text{ნკ}$ მუხტებია (ერთნაირი მეზობლად). იპოვეთ პოტენციალი და ველი ცენტრში.
EN: The corners of a square ($a = 0.1\ \text{m}$) hold $+1$, $+1$, $-1$, $-1\ \text{nC}$ (like charges adjacent). Find the potential and the field at the centre.
HKA: პოტენციალი — სკალარული ჯამი; ველი — ვექტორული.
HEN: Potential is a scalar sum; the field is a vector sum.
SKA: $\varphi = k\dfrac{1 + 1 - 1 - 1}{r} = 0$
ცენტრამდე $r = \dfrac{a}{\sqrt 2} \approx 0{,}0707\ \text{მ}$; თითო მუხტის ველი $E_1 = \dfrac{9}{0{,}005} = 1800\ \text{ნ/კ}$.
დიაგონალზე $+$ და $-$ საპირისპიროდ დგანან — მათი ველები იკრიბება: $2E_1$ თითო დიაგონალზე, $90°$-ით.
$E = 2E_1\sqrt 2 \approx 5090\ \text{ნ/კ}$, დადებითი მხრიდან უარყოფითისკენ.
SEN: $\varphi = k\dfrac{1 + 1 - 1 - 1}{r} = 0$
Centre distance $r = \dfrac{a}{\sqrt 2} \approx 0.0707\ \text{m}$; each charge gives $E_1 = \dfrac{9}{0.005} = 1800\ \text{N/C}$.
On each diagonal a $+$ faces a $-$, so their fields add: $2E_1$ along each diagonal, at $90°$.
$E = 2E_1\sqrt 2 \approx 5090\ \text{N/C}$, from the positive side towards the negative side.
AKA: $\varphi = 0$; $E \approx 5{,}1 \cdot 10^3\ \text{ნ/კ}$
AEN: $\varphi = 0$; $E \approx 5.1 \times 10^3\ \text{N/C}$

--- hard potential
KA: სამი ერთნაირი $+q$ მუხტი ($q = 1\ \text{მკკ}$) ტოლგვერდა სამკუთხედის ($a = 0{,}1\ \text{მ}$) წვეროებშია. რა მუშაობაა საჭირო ამ სისტემის შესაქმნელად (უსასრულოდან)?
EN: Three charges $+q$ ($q = 1\ \mu\text{C}$) sit at the corners of an equilateral triangle ($a = 0.1\ \text{m}$). How much work was needed to assemble them (from infinity)?
HKA: სამი წყვილი, თითოეული $k\dfrac{q^2}{a}$.
HEN: Three pairs, each $k\dfrac{q^2}{a}$.
SKA: $W = 3k\dfrac{q^2}{a} = 3 \cdot 9 \cdot 10^9 \cdot \dfrac{10^{-12}}{0{,}1} = 0{,}27\ \text{ჯ}$
SEN: $W = 3k\dfrac{q^2}{a} = 3 \cdot 9 \times 10^9 \cdot \dfrac{10^{-12}}{0.1} = 0.27\ \text{J}$
AKA: $0{,}27\ \text{ჯ}$
AEN: $0.27\ \text{J}$

--- hard potential
KA: ელექტრონი ბრტყელი კონდენსატორის ($U = 100\ \text{ვ}$) უარყოფითი ფირფიტიდან უძრაობიდან იწყებს მოძრაობას, ხოლო ამავე დროს დადებითიდან პროტონი. ფირფიტებს შორის $d = 1\ \text{სმ}$-ია. სად შეხვდებიან?
EN: An electron leaves the negative plate of a capacitor ($U = 100\ \text{V}$) from rest just as a proton leaves the positive plate. The plates are $d = 1\ \text{cm}$ apart. Where do they meet?
HKA: გზები აჩქარებების (ე.ი. მასების უკუ) პროპორციულია.
HEN: The distances are proportional to the accelerations (inversely to the masses).
SKA: $\dfrac{s_e}{s_p} = \dfrac{m_p}{m_e} \approx 1836$
$s_p = \dfrac{d}{1837} \approx 5{,}4 \cdot 10^{-6}\ \text{მ}$ — თითქმის დადებით ფირფიტასთან შეხვდებიან.
SEN: $\dfrac{s_e}{s_p} = \dfrac{m_p}{m_e} \approx 1836$
$s_p = \dfrac{d}{1837} \approx 5.4 \times 10^{-6}\ \text{m}$ — they meet almost at the positive plate.
AKA: დადებითი ფირფიტიდან $\approx 5\ \text{მკმ}$-ზე
AEN: $\approx 5\ \mu\text{m}$ from the positive plate

--- hard potential
KA: ნაწილაკი ($m = 1\ \text{გ}$, $q = 1\ \text{მკკ}$) უსასრულობიდან $v_0 = 30\ \text{მ/წმ}$-ით უახლოვდება ფიქსირებულ $Q = 10\ \text{მკკ}$ მუხტს პირდაპირ. რა უმცირეს მანძილზე მივა?
EN: A particle ($m = 1\ \text{g}$, $q = 1\ \mu\text{C}$) comes from far away at $30\ \text{m/s}$ straight towards a fixed $Q = 10\ \mu\text{C}$. How close does it get?
HKA: $\dfrac{m v_0^2}{2} = k\dfrac{qQ}{r}$.
HEN: $\dfrac{m v_0^2}{2} = k\dfrac{qQ}{r}$.
SKA: $r = \dfrac{2 k q Q}{m v_0^2} = \dfrac{2 \cdot 9 \cdot 10^9 \cdot 10^{-11}}{10^{-3} \cdot 900} = \dfrac{0{,}18}{0{,}9} = 0{,}2\ \text{მ}$
SEN: $r = \dfrac{2 k q Q}{m v_0^2} = \dfrac{2 \cdot 9 \times 10^9 \cdot 10^{-11}}{10^{-3} \cdot 900} = \dfrac{0.18}{0.9} = 0.2\ \text{m}$
AKA: $0{,}2\ \text{მ}$
AEN: $0.2\ \text{m}$

--- hard potential
KA: სფეროს ($R$) ზედაპირზე $Q$ მუხტია. დახაზეთ (სიტყვიერად აღწერეთ) $\varphi(r)$ და $E(r)$ გრაფიკები. რა არის პოტენციალი ცენტრში?
EN: A sphere of radius $R$ carries charge $Q$ on its surface. Describe the graphs of $\varphi(r)$ and $E(r)$. What is the potential at the centre?
HKA: შიგნით $E = 0$ — პოტენციალი მუდმივია.
HEN: Inside $E = 0$ — the potential is constant.
SKA: $E$: $r < R$-ზე $0$; $r = R$-ზე ნახტომით $k\dfrac{Q}{R^2}$; შემდეგ $\sim\dfrac{1}{r^2}$.
$\varphi$: $r \le R$-ზე მუდმივი $k\dfrac{Q}{R}$; შემდეგ $\sim\dfrac{1}{r}$.
ცენტრში $\varphi = k\dfrac{Q}{R}$ (არა ნული, თუმცა $E = 0$).
SEN: $E$: zero for $r < R$; jumps to $k\dfrac{Q}{R^2}$ at $r = R$; then falls as $\dfrac{1}{r^2}$.
$\varphi$: constant $k\dfrac{Q}{R}$ for $r \le R$; then falls as $\dfrac{1}{r}$.
At the centre $\varphi = k\dfrac{Q}{R}$ (not zero, even though $E = 0$).
AKA: ცენტრში $\varphi = k\dfrac{Q}{R}$
AEN: at the centre $\varphi = k\dfrac{Q}{R}$

--- easy capacitor
KA: კონდენსატორის ტევადობა $5\ \text{მკფ}$-ია, ძაბვა $200\ \text{ვ}$. იპოვეთ მუხტი.
EN: A $5\ \mu\text{F}$ capacitor is at $200\ \text{V}$. Find its charge.
HKA: $q = C U$.
HEN: $q = C U$.
SKA: $q = 5 \cdot 10^{-6} \cdot 200 = 10^{-3}\ \text{კ}$
SEN: $q = 5 \times 10^{-6} \cdot 200 = 10^{-3}\ \text{C}$
AKA: $1\ \text{მკ}$
AEN: $1\ \text{mC}$

--- easy capacitor
KA: ორი კონდენსატორი, $4\ \text{მკფ}$ და $6\ \text{მკფ}$, პარალელურადაა. იპოვეთ ჯამური ტევადობა.
EN: Capacitors of $4\ \mu\text{F}$ and $6\ \mu\text{F}$ are in parallel. Find the total capacitance.
HKA: პარალელურად ტევადობები იკრიბება.
HEN: In parallel capacitances add.
SKA: $C = 4 + 6 = 10\ \text{მკფ}$
SEN: $C = 4 + 6 = 10\ \mu\text{F}$
AKA: $10\ \text{მკფ}$
AEN: $10\ \mu\text{F}$

--- easy capacitor
KA: $6\ \text{მკფ}$ და $3\ \text{მკფ}$ კონდენსატორები მიმდევრობითაა. იპოვეთ ჯამური ტევადობა.
EN: Capacitors of $6\ \mu\text{F}$ and $3\ \mu\text{F}$ are in series. Find the total capacitance.
HKA: $\dfrac{1}{C} = \dfrac{1}{C_1} + \dfrac{1}{C_2}$.
HEN: $\dfrac{1}{C} = \dfrac{1}{C_1} + \dfrac{1}{C_2}$.
SKA: $C = \dfrac{6 \cdot 3}{9} = 2\ \text{მკფ}$
SEN: $C = \dfrac{6 \cdot 3}{9} = 2\ \mu\text{F}$
AKA: $2\ \text{მკფ}$
AEN: $2\ \mu\text{F}$

--- easy capacitor
KA: $2\ \text{მკფ}$ კონდენსატორს $10^{-4}\ \text{კ}$ მუხტი აქვს. იპოვეთ ძაბვა და ენერგია.
EN: A $2\ \mu\text{F}$ capacitor holds $10^{-4}\ \text{C}$. Find its voltage and energy.
HKA: $U = \dfrac{q}{C}$, $W = \dfrac{q^2}{2C}$.
HEN: $U = \dfrac{q}{C}$, $W = \dfrac{q^2}{2C}$.
SKA: $U = \dfrac{10^{-4}}{2 \cdot 10^{-6}} = 50\ \text{ვ}$
$W = \dfrac{10^{-8}}{4 \cdot 10^{-6}} = 2{,}5 \cdot 10^{-3}\ \text{ჯ}$
SEN: $U = \dfrac{10^{-4}}{2 \times 10^{-6}} = 50\ \text{V}$
$W = \dfrac{10^{-8}}{4 \times 10^{-6}} = 2.5 \times 10^{-3}\ \text{J}$
AKA: $50\ \text{ვ}$; $2{,}5\ \text{მჯ}$
AEN: $50\ \text{V}$; $2.5\ \text{mJ}$

--- easy capacitor
KA: როგორ შეიცვლება ბრტყელი კონდენსატორის ტევადობა, თუ ფირფიტებს შორის მანძილს $2$-ჯერ გავზრდით?
EN: How does a parallel-plate capacitor's capacitance change if the plate gap is doubled?
HKA: $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$.
HEN: $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$.
SKA: $C \sim \dfrac{1}{d}$ — $2$-ჯერ შემცირდება.
SEN: $C \sim \dfrac{1}{d}$ — it halves.
AKA: $2$-ჯერ შემცირდება
AEN: it halves

--- easy capacitor
KA: კონდენსატორს შორის დიელექტრიკი ($\varepsilon = 5$) შეიტანეს. როგორ შეიცვლება ტევადობა?
EN: A dielectric ($\varepsilon = 5$) is put between a capacitor's plates. How does the capacitance change?
HKA: $C \sim \varepsilon$.
HEN: $C \sim \varepsilon$.
SKA: $5$-ჯერ გაიზრდება.
SEN: It increases $5$ times.
AKA: $5$-ჯერ გაიზრდება
AEN: $5$ times larger

--- easy capacitor
KA: სამი ერთნაირი $9\ \text{მკფ}$ კონდენსატორი მიმდევრობითაა. იპოვეთ ტევადობა.
EN: Three identical $9\ \mu\text{F}$ capacitors are in series. Find the capacitance.
HKA: $n$ ერთნაირისთვის $C = \dfrac{C_1}{n}$.
HEN: For $n$ identical ones $C = \dfrac{C_1}{n}$.
SKA: $C = \dfrac{9}{3} = 3\ \text{მკფ}$
SEN: $C = \dfrac{9}{3} = 3\ \mu\text{F}$
AKA: $3\ \text{მკფ}$
AEN: $3\ \mu\text{F}$

--- easy capacitor
KA: რატომ ინახავს კონდენსატორი ენერგიას? სად არის ეს ენერგია „მოთავსებული“?
EN: Why does a capacitor store energy? Where is that energy "located"?
HKA: დამუხტვისას მუშაობა სრულდება.
HEN: Work is done to charge it.
SKA: დამუხტვისას მუხტების გადატანაზე მუშაობა სრულდება (ერთნაირი ნიშნის მუხტები ერთ ფირფიტაზე უნდა „ჩავტენოთ“). ეს მუშაობა ფირფიტებს შორის ელექტრული ველის ენერგიად ინახება.
SEN: Charging takes work (like charges must be crowded onto one plate). That work is stored as the energy of the electric field between the plates.
AKA: ფირფიტებს შორის ველში
AEN: in the field between the plates

--- medium capacitor
KA: ბრტყელი კონდენსატორის ფირფიტების ფართობია $200\ \text{სმ}^2$, მანძილი $0{,}5\ \text{მმ}$, დიელექტრიკი $\varepsilon = 6$. იპოვეთ ტევადობა.
EN: A parallel-plate capacitor has plates of $200\ \text{cm}^2$, a $0.5\ \text{mm}$ gap and a dielectric with $\varepsilon = 6$. Find the capacitance.
HKA: $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$.
HEN: $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$.
SKA: $C = \dfrac{6 \cdot 8{,}85 \cdot 10^{-12} \cdot 0{,}02}{5 \cdot 10^{-4}} \approx 2{,}1 \cdot 10^{-9}\ \text{ფ} = 2{,}1\ \text{ნფ}$
SEN: $C = \dfrac{6 \cdot 8.85 \times 10^{-12} \cdot 0.02}{5 \times 10^{-4}} \approx 2.1 \times 10^{-9}\ \text{F} = 2.1\ \text{nF}$
AKA: $\approx 2{,}1\ \text{ნფ}$
AEN: $\approx 2.1\ \text{nF}$

--- medium capacitor
KA: $3\ \text{მკფ}$ და $6\ \text{მკფ}$ კონდენსატორები მიმდევრობით $90\ \text{ვ}$-ზეა მიერთებული. იპოვეთ თითოეულის მუხტი და ძაბვა.
EN: $3\ \mu\text{F}$ and $6\ \mu\text{F}$ capacitors in series are connected to $90\ \text{V}$. Find each one's charge and voltage.
HKA: მიმდევრობით მუხტები ტოლია.
HEN: In series the charges are equal.
SKA: $C = 2\ \text{მკფ}$, $\ q = 2 \cdot 10^{-6} \cdot 90 = 1{,}8 \cdot 10^{-4}\ \text{კ}$
$U_1 = \dfrac{1{,}8 \cdot 10^{-4}}{3 \cdot 10^{-6}} = 60\ \text{ვ}$, $\ U_2 = 30\ \text{ვ}$
SEN: $C = 2\ \mu\text{F}$, $\ q = 2 \times 10^{-6} \cdot 90 = 1.8 \times 10^{-4}\ \text{C}$
$U_1 = \dfrac{1.8 \times 10^{-4}}{3 \times 10^{-6}} = 60\ \text{V}$, $\ U_2 = 30\ \text{V}$
AKA: $180\ \text{მკკ}$; $60\ \text{ვ}$ და $30\ \text{ვ}$
AEN: $180\ \mu\text{C}$; $60\ \text{V}$ and $30\ \text{V}$

--- medium capacitor
KA: კონდენსატორი წყაროსთან მიერთებული რჩება ($U = 100\ \text{ვ}$), $C = 10\ \text{მკფ}$. ფირფიტებს შორის $\varepsilon = 3$ დიელექტრიკი შეიტანეს. როგორ შეიცვლება მუხტი და ენერგია?
EN: A $10\ \mu\text{F}$ capacitor stays connected to $100\ \text{V}$. A dielectric with $\varepsilon = 3$ is slid in. How do the charge and energy change?
HKA: ძაბვა მუდმივია, ტევადობა $3$-ჯერ იზრდება.
HEN: The voltage is fixed; the capacitance triples.
SKA: $q$: $10^{-3} \to 3 \cdot 10^{-3}\ \text{კ}$ ($3$-ჯერ)
$W = \dfrac{C U^2}{2}$: $0{,}05 \to 0{,}15\ \text{ჯ}$ ($3$-ჯერ)
SEN: $q$: $10^{-3} \to 3 \times 10^{-3}\ \text{C}$ ($3$ times)
$W = \dfrac{C U^2}{2}$: $0.05 \to 0.15\ \text{J}$ ($3$ times)
AKA: ორივე $3$-ჯერ გაიზრდება
AEN: both triple

--- medium capacitor
KA: $4\ \text{მკფ}$ კონდენსატორი $200\ \text{ვ}$-მდე დამუხტეს, წყაროს მოაშორეს და დაუმუხტავ $4\ \text{მკფ}$-თან პარალელურად შეაერთეს. იპოვეთ ძაბვა და ენერგიის ცვლილება.
EN: A $4\ \mu\text{F}$ capacitor charged to $200\ \text{V}$ is disconnected and joined in parallel to an uncharged $4\ \mu\text{F}$ one. Find the voltage and the change in energy.
HKA: მუხტი ინახება.
HEN: Charge is conserved.
SKA: $q = 8 \cdot 10^{-4}\ \text{კ}$, $\ U = \dfrac{8 \cdot 10^{-4}}{8 \cdot 10^{-6}} = 100\ \text{ვ}$
$W_1 = \dfrac{4 \cdot 10^{-6} \cdot 4 \cdot 10^4}{2} = 0{,}08\ \text{ჯ}$, $\ W_2 = \dfrac{8 \cdot 10^{-6} \cdot 10^4}{2} = 0{,}04\ \text{ჯ}$ — ნახევარი დაიკარგა.
SEN: $q = 8 \times 10^{-4}\ \text{C}$, $\ U = \dfrac{8 \times 10^{-4}}{8 \times 10^{-6}} = 100\ \text{V}$
$W_1 = \dfrac{4 \times 10^{-6} \cdot 4 \times 10^4}{2} = 0.08\ \text{J}$, $\ W_2 = \dfrac{8 \times 10^{-6} \cdot 10^4}{2} = 0.04\ \text{J}$ — half was lost.
AKA: $100\ \text{ვ}$; $0{,}04\ \text{ჯ}$ დაიკარგა
AEN: $100\ \text{V}$; $0.04\ \text{J}$ lost

--- medium capacitor
KA: $2$, $2$ და $4\ \text{მკფ}$ კონდენსატორები: პირველი ორი პარალელურადაა, მათ მიმდევრობით მესამე. იპოვეთ ჯამური ტევადობა.
EN: Capacitors of $2$, $2$ and $4\ \mu\text{F}$: the first two in parallel, in series with the third. Find the total capacitance.
HKA: ჯერ პარალელური წყვილი.
HEN: The parallel pair first.
SKA: $C_{12} = 4\ \text{მკფ}$; $\ C = \dfrac{4 \cdot 4}{8} = 2\ \text{მკფ}$
SEN: $C_{12} = 4\ \mu\text{F}$; $\ C = \dfrac{4 \cdot 4}{8} = 2\ \mu\text{F}$
AKA: $2\ \text{მკფ}$
AEN: $2\ \mu\text{F}$

--- medium capacitor
KA: ბრტყელი კონდენსატორი დამუხტეს და წყაროს მოაშორეს. ფირფიტები $2$-ჯერ დააშორეს. როგორ შეიცვლება ძაბვა, ველი და ენერგია?
EN: A parallel-plate capacitor is charged and disconnected. The plate gap is doubled. How do the voltage, field and energy change?
HKA: მუხტი მუდმივია, $C$ $2$-ჯერ მცირდება.
HEN: The charge is fixed; $C$ halves.
SKA: $U = \dfrac{q}{C}$ — $2$-ჯერ იზრდება.
$E = \dfrac{U}{d}$ — არ იცვლება.
$W = \dfrac{q^2}{2C}$ — $2$-ჯერ იზრდება (ფირფიტების დაშორებაზე მუშაობა შესრულდა).
SEN: $U = \dfrac{q}{C}$ — doubles.
$E = \dfrac{U}{d}$ — unchanged.
$W = \dfrac{q^2}{2C}$ — doubles (work was done pulling the plates apart).
AKA: $U$ ×2; $E$ იგივე; $W$ ×2
AEN: $U$ ×2; $E$ unchanged; $W$ ×2

--- medium capacitor
KA: $1000\ \text{მკფ}$ კონდენსატორი $12\ \text{ვ}$-ზეა დამუხტული. რა სიმაღლეზე შეეძლება ამ ენერგიას $10\ \text{გ}$ სხეულის აწევა?
EN: A $1000\ \mu\text{F}$ capacitor is charged to $12\ \text{V}$. How high could its energy lift a $10\ \text{g}$ body?
HKA: $\dfrac{C U^2}{2} = m g h$.
HEN: $\dfrac{C U^2}{2} = m g h$.
SKA: $W = \dfrac{10^{-3} \cdot 144}{2} = 0{,}072\ \text{ჯ}$
$h = \dfrac{0{,}072}{0{,}1} = 0{,}72\ \text{მ}$
SEN: $W = \dfrac{10^{-3} \cdot 144}{2} = 0.072\ \text{J}$
$h = \dfrac{0.072}{0.1} = 0.72\ \text{m}$
AKA: $0{,}72\ \text{მ}$
AEN: $0.72\ \text{m}$

--- medium capacitor
KA: ჰაერის „გარღვევა“ $3 \cdot 10^6\ \text{ვ/მ}$-ზე ხდება. რა მაქსიმალურ ძაბვამდე შეიძლება დაიმუხტოს $1\ \text{მმ}$-იანი ჰაეროვანი კონდენსატორი?
EN: Air breaks down at $3 \times 10^6\ \text{V/m}$. What is the maximum voltage for an air capacitor with a $1\ \text{mm}$ gap?
HKA: $U = E d$.
HEN: $U = E d$.
SKA: $U = 3 \cdot 10^6 \cdot 10^{-3} = 3000\ \text{ვ}$
SEN: $U = 3 \times 10^6 \cdot 10^{-3} = 3000\ \text{V}$
AKA: $3\ \text{კვ}$
AEN: $3\ \text{kV}$

--- medium capacitor
KA: რა ტევადობის კონდენსატორი უნდა მივუერთოთ პარალელურად $2\ \text{მკფ}$-ს, რომ $100\ \text{ვ}$-ზე ჯამური ენერგია $0{,}05\ \text{ჯ}$ იყოს?
EN: What capacitor must be added in parallel to a $2\ \mu\text{F}$ one so that at $100\ \text{V}$ the total energy is $0.05\ \text{J}$?
HKA: $C = \dfrac{2W}{U^2}$.
HEN: $C = \dfrac{2W}{U^2}$.
SKA: $C = \dfrac{0{,}1}{10^4} = 10^{-5}\ \text{ფ} = 10\ \text{მკფ}$; დასამატებელია $8\ \text{მკფ}$.
SEN: $C = \dfrac{0.1}{10^4} = 10^{-5}\ \text{F} = 10\ \mu\text{F}$; add $8\ \mu\text{F}$.
AKA: $8\ \text{მკფ}$
AEN: $8\ \mu\text{F}$

--- medium capacitor
KA: დეფიბრილატორის კონდენსატორი ($32\ \text{მკფ}$) $5\ \text{კვ}$-მდე იმუხტება და $2\ \text{მწმ}$-ში იცლება. იპოვეთ ენერგია და საშუალო სიმძლავრე.
EN: A defibrillator's $32\ \mu\text{F}$ capacitor is charged to $5\ \text{kV}$ and discharges in $2\ \text{ms}$. Find the energy and the average power.
HKA: $W = \dfrac{C U^2}{2}$, $N = \dfrac{W}{t}$.
HEN: $W = \dfrac{C U^2}{2}$, $P = \dfrac{W}{t}$.
SKA: $W = \dfrac{32 \cdot 10^{-6} \cdot 25 \cdot 10^6}{2} = 400\ \text{ჯ}$
$N = \dfrac{400}{0{,}002} = 2 \cdot 10^5\ \text{ვტ}$
SEN: $W = \dfrac{32 \times 10^{-6} \cdot 25 \times 10^6}{2} = 400\ \text{J}$
$P = \dfrac{400}{0.002} = 2 \times 10^5\ \text{W}$
AKA: $400\ \text{ჯ}$; $200\ \text{კვტ}$
AEN: $400\ \text{J}$; $200\ \text{kW}$

--- medium capacitor
KA: $1\ \text{მკფ}$-იანი კონდენსატორების რამდენი ცალი გვჭირდება და როგორ უნდა შევაერთოთ, რომ მივიღოთ $2{,}5\ \text{მკფ}$?
EN: How many $1\ \mu\text{F}$ capacitors are needed, and how should they be connected, to get $2.5\ \mu\text{F}$?
HKA: $2{,}5 = 2 + 0{,}5$.
HEN: $2.5 = 2 + 0.5$.
SKA: მაგალითად $4$: ორი მიმდევრობით ($0{,}5\ \text{მკფ}$), მათ პარალელურად კიდევ ორი ცალი ($1 + 1$): $0{,}5 + 2 = 2{,}5\ \text{მკფ}$.
SEN: For example $4$: two in series ($0.5\ \mu\text{F}$), with two more connected in parallel ($1 + 1$): $0.5 + 2 = 2.5\ \mu\text{F}$.
AKA: $4$ ცალი
AEN: $4$ of them

--- medium capacitor
KA: სფერული კონდენსატორი — დედამიწა ($R = 6400\ \text{კმ}$). იპოვეთ მისი ტევადობა.
EN: Treat the Earth ($R = 6400\ \text{km}$) as an isolated spherical capacitor. Find its capacitance.
HKA: სფეროსთვის $C = \dfrac{R}{k} = 4\pi\varepsilon_0 R$.
HEN: For a sphere $C = \dfrac{R}{k} = 4\pi\varepsilon_0 R$.
SKA: $C = \dfrac{6{,}4 \cdot 10^6}{9 \cdot 10^9} \approx 7 \cdot 10^{-4}\ \text{ფ} = 710\ \text{მკფ}$ — მოულოდნელად მცირეა!
SEN: $C = \dfrac{6.4 \times 10^6}{9 \times 10^9} \approx 7 \times 10^{-4}\ \text{F} = 710\ \mu\text{F}$ — surprisingly small!
AKA: $\approx 710\ \text{მკფ}$
AEN: $\approx 710\ \mu\text{F}$

--- hard capacitor
KA: $2\ \text{მკფ}$ კონდენსატორი $300\ \text{ვ}$-მდეა დამუხტული, $4\ \text{მკფ}$ — $150\ \text{ვ}$-მდე. მათ საპირისპირო პოლუსებით შეაერთეს. იპოვეთ ძაბვა.
EN: A $2\ \mu\text{F}$ capacitor charged to $300\ \text{V}$ and a $4\ \mu\text{F}$ one charged to $150\ \text{V}$ are connected with opposite poles together. Find the voltage.
HKA: მუხტები ერთმანეთს აკლდება.
HEN: The charges subtract.
SKA: $q_1 = 600\ \text{მკკ}$, $q_2 = 600\ \text{მკკ}$ — საპირისპიროდ: $q = 0$
$U = 0$ — კონდენსატორები მთლიანად განიმუხტება.
SEN: $q_1 = 600\ \mu\text{C}$, $q_2 = 600\ \mu\text{C}$ — opposite: $q = 0$
$U = 0$ — both discharge completely.
AKA: $0$
AEN: $0$

--- hard capacitor
KA: ბრტყელი კონდენსატორის ფირფიტებს შორის ($d$) ფირფიტების პარალელურად $\dfrac{d}{2}$ სისქის ლითონის ფურცელი მოათავსეს. როგორ შეიცვლება ტევადობა?
EN: A metal sheet of thickness $\dfrac{d}{2}$ is placed parallel to the plates inside a parallel-plate capacitor of gap $d$. How does the capacitance change?
HKA: ლითონში ველი ნულია — ეფექტური მანძილი $\dfrac{d}{2}$-ია.
HEN: There's no field in the metal — the effective gap is $\dfrac{d}{2}$.
SKA: $C' = \dfrac{\varepsilon_0 S}{d/2} = 2C$
SEN: $C' = \dfrac{\varepsilon_0 S}{d/2} = 2C$
AKA: $2$-ჯერ გაიზრდება
AEN: it doubles

--- hard capacitor
KA: ბრტყელი კონდენსატორის ნახევარ მოცულობას ($\dfrac{d}{2}$ სისქე) $\varepsilon = 4$ დიელექტრიკი ავსებს (ფირფიტების პარალელურად). იპოვეთ ტევადობა $C_0$-ს საშუალებით.
EN: Half the gap ($\dfrac{d}{2}$ thick) of a parallel-plate capacitor is filled with a dielectric of $\varepsilon = 4$, parallel to the plates. Find the capacitance in terms of $C_0$.
HKA: ორი მიმდევრობითი კონდენსატორი: $2C_0$ და $8C_0$.
HEN: Two capacitors in series: $2C_0$ and $8C_0$.
SKA: $C = \dfrac{2C_0 \cdot 8C_0}{10C_0} = 1{,}6\,C_0$
SEN: $C = \dfrac{2C_0 \cdot 8C_0}{10C_0} = 1.6\,C_0$
AKA: $1{,}6\,C_0$
AEN: $1.6\,C_0$

--- hard capacitor
KA: დამუხტული და წყაროსგან მოშორებული ბრტყელი კონდენსატორის ($S = 100\ \text{სმ}^2$, $q = 10\ \text{ნკ}$) ფირფიტებს შორის მანძილი $1\ \text{მმ}$-დან $3\ \text{მმ}$-მდე გაზარდეს. რა მუშაობა შესრულდა?
EN: A charged, disconnected capacitor ($S = 100\ \text{cm}^2$, $q = 10\ \text{nC}$) has its gap increased from $1\ \text{mm}$ to $3\ \text{mm}$. How much work was done?
HKA: $A = \Delta W = \dfrac{q^2}{2}\left(\dfrac{1}{C_2} - \dfrac{1}{C_1}\right) = \dfrac{q^2 \Delta d}{2\varepsilon_0 S}$.
HEN: $W = \Delta E = \dfrac{q^2}{2}\left(\dfrac{1}{C_2} - \dfrac{1}{C_1}\right) = \dfrac{q^2 \Delta d}{2\varepsilon_0 S}$.
SKA: $A = \dfrac{10^{-16} \cdot 2 \cdot 10^{-3}}{2 \cdot 8{,}85 \cdot 10^{-12} \cdot 10^{-2}} \approx 1{,}13 \cdot 10^{-6}\ \text{ჯ}$
SEN: $W = \dfrac{10^{-16} \cdot 2 \times 10^{-3}}{2 \cdot 8.85 \times 10^{-12} \cdot 10^{-2}} \approx 1.13 \times 10^{-6}\ \text{J}$
AKA: $\approx 1{,}1\ \text{მკჯ}$
AEN: $\approx 1.1\ \mu\text{J}$

--- hard capacitor
KA: ოთხი $4\ \text{მკფ}$ კონდენსატორი კვადრატის გვერდებზეა, დიაგონალზე მეხუთე ($4\ \text{მკფ}$). იპოვეთ ტევადობა მეორე დიაგონალის ბოლოებს შორის.
EN: Four $4\ \mu\text{F}$ capacitors form the sides of a square and a fifth ($4\ \mu\text{F}$) is on one diagonal. Find the capacitance between the ends of the other diagonal.
HKA: სიმეტრიის გამო პირველი დიაგონალის ბოლოებს ტოლი პოტენციალი აქვს — მეხუთე არ იმუხტება.
HEN: By symmetry the ends of the first diagonal are at equal potential — the fifth one carries no charge.
SKA: მეხუთე კონდენსატორი უმოქმედოა. დარჩა ორი პარალელური შტო, თითოეული ორი მიმდევრობითით: $2\ \text{მკფ}$ თითო.
$C = 2 + 2 = 4\ \text{მკფ}$
SEN: The fifth capacitor does nothing. Two parallel branches remain, each two in series: $2\ \mu\text{F}$ each.
$C = 2 + 2 = 4\ \mu\text{F}$
AKA: $4\ \text{მკფ}$
AEN: $4\ \mu\text{F}$

--- hard capacitor
KA: $C$ კონდენსატორი $U$ ძაბვამდე იმუხტება $R$ რეზისტორის გავლით. დამუხტვის ბოლოს წყაროს რა სრული მუშაობა შესრულდა და რამდენი გამოიყო რეზისტორზე სითბოდ?
EN: A capacitor $C$ is charged to $U$ through a resistor $R$. When charging is complete, how much work has the source done and how much heat was released in the resistor?
HKA: წყარო $q = CU$ მუხტს $U$ ძაბვით გადაიტანს.
HEN: The source moves charge $q = CU$ through voltage $U$.
SKA: $A_{\text{წ}} = q U = C U^2$
კონდენსატორში: $\dfrac{C U^2}{2}$; სითბო: $Q = C U^2 - \dfrac{C U^2}{2} = \dfrac{C U^2}{2}$ — $R$-ზე არ არის დამოკიდებული!
SEN: $W_{\text{src}} = q U = C U^2$
In the capacitor: $\dfrac{C U^2}{2}$; heat: $Q = C U^2 - \dfrac{C U^2}{2} = \dfrac{C U^2}{2}$ — independent of $R$!
AKA: $CU^2$; $\dfrac{CU^2}{2}$
AEN: $CU^2$; $\dfrac{CU^2}{2}$

--- hard capacitor
KA: სამი კონდენსატორი ($1$, $2$, $3\ \text{მკფ}$) მიმდევრობით $110\ \text{ვ}$-ზეა მიერთებული. იპოვეთ თითოეულის ძაბვა.
EN: Three capacitors ($1$, $2$, $3\ \mu\text{F}$) in series are connected to $110\ \text{V}$. Find each one's voltage.
HKA: მუხტები ტოლია; ძაბვები ტევადობების უკუპროპორციულია.
HEN: The charges are equal; voltages are inversely proportional to capacitances.
SKA: $\dfrac{1}{C} = 1 + \dfrac{1}{2} + \dfrac{1}{3} = \dfrac{11}{6} \Rightarrow C = \dfrac{6}{11}\ \text{მკფ}$
$q = \dfrac{6}{11} \cdot 110 = 60\ \text{მკკ}$
$U_1 = 60\ \text{ვ}$, $U_2 = 30\ \text{ვ}$, $U_3 = 20\ \text{ვ}$
SEN: $\dfrac{1}{C} = 1 + \dfrac{1}{2} + \dfrac{1}{3} = \dfrac{11}{6} \Rightarrow C = \dfrac{6}{11}\ \mu\text{F}$
$q = \dfrac{6}{11} \cdot 110 = 60\ \mu\text{C}$
$U_1 = 60\ \text{V}$, $U_2 = 30\ \text{V}$, $U_3 = 20\ \text{V}$
AKA: $60$, $30$, $20\ \text{ვ}$
AEN: $60$, $30$, $20\ \text{V}$

--- hard capacitor
KA: ბრტყელი კონდენსატორის ფირფიტები ($S$, $q$) ერთმანეთს იზიდავს. იპოვეთ მიზიდვის ძალა.
EN: The plates ($S$, $q$) of a parallel-plate capacitor attract each other. Find the force of attraction.
HKA: ერთი ფირფიტა იმყოფება მეორის ველში $E_1 = \dfrac{q}{2\varepsilon_0 S}$.
HEN: One plate sits in the other's field $E_1 = \dfrac{q}{2\varepsilon_0 S}$.
SKA: $F = q E_1 = \dfrac{q^2}{2\varepsilon_0 S}$ (არა $qE$, სადაც $E = \dfrac{q}{\varepsilon_0 S}$ — საკუთარი ველი თავისთავზე არ მოქმედებს).
SEN: $F = q E_1 = \dfrac{q^2}{2\varepsilon_0 S}$ (not $qE$ with $E = \dfrac{q}{\varepsilon_0 S}$ — a plate's own field doesn't act on itself).
AKA: $F = \dfrac{q^2}{2\varepsilon_0 S}$
AEN: $F = \dfrac{q^2}{2\varepsilon_0 S}$

--- hard capacitor
KA: $10\ \text{მკფ}$ კონდენსატორი $100\ \text{ვ}$-მდე დამუხტეს და $20\ \text{ომ}$ რეზისტორით განმუხტეს. რა არის საწყისი დენი? რამდენი სითბო გამოიყოფა?
EN: A $10\ \mu\text{F}$ capacitor charged to $100\ \text{V}$ discharges through a $20\ \Omega$ resistor. What is the initial current? How much heat is released?
HKA: საწყისი დენი $\dfrac{U}{R}$; სითბო — მთელი ენერგია.
HEN: Initial current $\dfrac{U}{R}$; the heat is all the stored energy.
SKA: $I_0 = \dfrac{100}{20} = 5\ \text{ა}$
$Q = \dfrac{10^{-5} \cdot 10^4}{2} = 0{,}05\ \text{ჯ}$
SEN: $I_0 = \dfrac{100}{20} = 5\ \text{A}$
$Q = \dfrac{10^{-5} \cdot 10^4}{2} = 0.05\ \text{J}$
AKA: $5\ \text{ა}$; $0{,}05\ \text{ჯ}$
AEN: $5\ \text{A}$; $0.05\ \text{J}$

--- hard capacitor
KA: ორი ერთნაირი კონდენსატორი ($C$) პარალელურადაა $U$-მდე დამუხტული და წყაროს მოაშორეს. ერთ-ერთში $\varepsilon$ დიელექტრიკი შეიტანეს. იპოვეთ ახალი ძაბვა.
EN: Two identical capacitors $C$ in parallel are charged to $U$ and disconnected. A dielectric $\varepsilon$ is slid into one of them. Find the new voltage.
HKA: სრული მუხტი $2CU$ ინახება, ტევადობა $(1 + \varepsilon)C$ ხდება.
HEN: The total charge $2CU$ is conserved; the capacitance becomes $(1 + \varepsilon)C$.
SKA: $U' = \dfrac{2CU}{(1 + \varepsilon)C} = \dfrac{2U}{1 + \varepsilon}$
მაგ., $\varepsilon = 3$: $U' = \dfrac{U}{2}$.
SEN: $U' = \dfrac{2CU}{(1 + \varepsilon)C} = \dfrac{2U}{1 + \varepsilon}$
E.g. $\varepsilon = 3$: $U' = \dfrac{U}{2}$.
AKA: $U' = \dfrac{2U}{1 + \varepsilon}$
AEN: $U' = \dfrac{2U}{1 + \varepsilon}$

--- hard capacitor
KA: რა სისქის ($\varepsilon = 7$) მინის ფირფიტა უნდა ჩავდოთ $5\ \text{მმ}$-იან ჰაეროვან კონდენსატორში (ფირფიტების პარალელურად), რომ ტევადობა $2$-ჯერ გაიზარდოს?
EN: What thickness of glass ($\varepsilon = 7$) must be placed parallel to the plates of a $5\ \text{mm}$ air capacitor to double its capacitance?
HKA: ეფექტური მანძილი $d - x + \dfrac{x}{\varepsilon} = \dfrac{d}{2}$.
HEN: Effective gap $d - x + \dfrac{x}{\varepsilon} = \dfrac{d}{2}$.
SKA: $x\left(1 - \dfrac{1}{7}\right) = \dfrac{d}{2} \Rightarrow x = \dfrac{7 d}{12} = \dfrac{35}{12} \approx 2{,}9\ \text{მმ}$
SEN: $x\left(1 - \dfrac{1}{7}\right) = \dfrac{d}{2} \Rightarrow x = \dfrac{7 d}{12} = \dfrac{35}{12} \approx 2.9\ \text{mm}$
AKA: $\approx 2{,}9\ \text{მმ}$
AEN: $\approx 2.9\ \text{mm}$

--- hard capacitor olympiad
KA: ნახევრად ($S/2$) $\varepsilon$ დიელექტრიკით შევსებული (ფირფიტების პერპენდიკულარულად გაყოფილი) ბრტყელი კონდენსატორის ტევადობა იპოვეთ $C_0$-ის საშუალებით. შეადარეთ შემთხვევას, როცა სისქის ნახევარია შევსებული.
EN: A parallel-plate capacitor has half its plate area ($S/2$) filled with dielectric $\varepsilon$ (the boundary perpendicular to the plates). Find its capacitance in terms of $C_0$. Compare with the case where half the thickness is filled.
HKA: ფართობით გაყოფისას — პარალელური; სისქით — მიმდევრობითი.
HEN: Split by area — parallel; split by thickness — series.
SKA: ფართობით: $C = \dfrac{C_0}{2} + \dfrac{\varepsilon C_0}{2} = \dfrac{(1 + \varepsilon) C_0}{2}$
სისქით: $C = \dfrac{2C_0 \cdot 2\varepsilon C_0}{2C_0 + 2\varepsilon C_0} = \dfrac{2\varepsilon C_0}{1 + \varepsilon}$
$\varepsilon = 3$-ისას: $2C_0$ და $1{,}5C_0$ — ფართობით შევსება უკეთესია.
SEN: By area: $C = \dfrac{C_0}{2} + \dfrac{\varepsilon C_0}{2} = \dfrac{(1 + \varepsilon) C_0}{2}$
By thickness: $C = \dfrac{2C_0 \cdot 2\varepsilon C_0}{2C_0 + 2\varepsilon C_0} = \dfrac{2\varepsilon C_0}{1 + \varepsilon}$
For $\varepsilon = 3$: $2C_0$ and $1.5C_0$ — filling by area is better.
AKA: $\dfrac{(1 + \varepsilon)C_0}{2}$ და $\dfrac{2\varepsilon C_0}{1 + \varepsilon}$
AEN: $\dfrac{(1 + \varepsilon)C_0}{2}$ and $\dfrac{2\varepsilon C_0}{1 + \varepsilon}$

--- hard capacitor olympiad
KA: ბრტყელი კონდენსატორი ვერტიკალურად დგას და მისი ქვედა კიდე დიელექტრიკულ სითხეშია ($\varepsilon$, $\rho$). ფირფიტები $U$ ძაბვაზეა, მანძილი $d$. რა სიმაღლეზე აიწევს სითხე ფირფიტებს შორის?
EN: A vertical parallel-plate capacitor (gap $d$) has its lower edge dipped in a dielectric liquid ($\varepsilon$, $\rho$). The plates are held at voltage $U$. How high does the liquid rise between the plates?
HKA: ველი სითხეს „შეიწოვს“; ძალა $F = \dfrac{(\varepsilon - 1)\varepsilon_0 U^2 b}{2d}$ ($b$ — ფირფიტის სიგანე).
HEN: The field pulls the liquid in; the force is $F = \dfrac{(\varepsilon - 1)\varepsilon_0 U^2 b}{2d}$ ($b$ — plate width).
SKA: წონასწორობა: $\dfrac{(\varepsilon - 1)\varepsilon_0 U^2 b}{2d} = \rho g h\, b d$
$h = \dfrac{(\varepsilon - 1)\varepsilon_0 U^2}{2\rho g d^2}$
SEN: Equilibrium: $\dfrac{(\varepsilon - 1)\varepsilon_0 U^2 b}{2d} = \rho g h\, b d$
$h = \dfrac{(\varepsilon - 1)\varepsilon_0 U^2}{2\rho g d^2}$
AKA: $h = \dfrac{(\varepsilon - 1)\varepsilon_0 U^2}{2\rho g d^2}$
AEN: $h = \dfrac{(\varepsilon - 1)\varepsilon_0 U^2}{2\rho g d^2}$

--- hard capacitor olympiad
KA: $C_1 = 1\ \text{მკფ}$ $U_1 = 100\ \text{ვ}$-მდეა დამუხტული, $C_2 = 2\ \text{მკფ}$ — დაუმუხტავი. მათ $R$ წინაღობის მავთულით შეაერთეს. რამდენი სითბო გამოიყოფა? დამოკიდებულია თუ არა ეს $R$-ზე?
EN: $C_1 = 1\ \mu\text{F}$ is charged to $U_1 = 100\ \text{V}$; $C_2 = 2\ \mu\text{F}$ is uncharged. They are joined through a wire of resistance $R$. How much heat is released? Does it depend on $R$?
HKA: საბოლოო ძაბვა $\dfrac{C_1 U_1}{C_1 + C_2}$; სითბო = ენერგიის სხვაობა.
HEN: Final voltage $\dfrac{C_1 U_1}{C_1 + C_2}$; heat = the drop in energy.
SKA: $U = \dfrac{100}{3} \approx 33{,}3\ \text{ვ}$
$W_1 = \dfrac{10^{-6} \cdot 10^4}{2} = 5\ \text{მჯ}$, $\ W_2 = \dfrac{3 \cdot 10^{-6} \cdot 1111}{2} \approx 1{,}67\ \text{მჯ}$
$Q \approx 3{,}33\ \text{მჯ}$ — $R$-ზე არ არის დამოკიდებული (მხოლოდ პროცესის ხანგრძლივობაა).
SEN: $U = \dfrac{100}{3} \approx 33.3\ \text{V}$
$W_1 = \dfrac{10^{-6} \cdot 10^4}{2} = 5\ \text{mJ}$, $\ W_2 = \dfrac{3 \times 10^{-6} \cdot 1111}{2} \approx 1.67\ \text{mJ}$
$Q \approx 3.33\ \text{mJ}$ — independent of $R$ (only the duration depends on it).
AKA: $\approx 3{,}3\ \text{მჯ}$; არა
AEN: $\approx 3.3\ \text{mJ}$; no

--- hard capacitor olympiad
KA: უსასრულო ჯაჭვი: თითოეული რგოლი — მიმდევრობით $C$, შემდეგ პარალელურად $C$ (კიბისებრი). იპოვეთ ჯაჭვის ტევადობა.
EN: An infinite ladder: each rung has a capacitor $C$ in series followed by a capacitor $C$ in parallel. Find the ladder's capacitance.
HKA: ერთი რგოლის დამატება ჯაჭვს არ ცვლის: $C_x = \dfrac{C(C + C_x)}{2C + C_x}$.
HEN: Adding one more rung doesn't change it: $C_x = \dfrac{C(C + C_x)}{2C + C_x}$.
SKA: $C_x(2C + C_x) = C^2 + C C_x \Rightarrow C_x^2 + C C_x - C^2 = 0$
$C_x = \dfrac{\sqrt 5 - 1}{2} C \approx 0{,}62\, C$
SEN: $C_x(2C + C_x) = C^2 + C C_x \Rightarrow C_x^2 + C C_x - C^2 = 0$
$C_x = \dfrac{\sqrt 5 - 1}{2} C \approx 0.62\, C$
AKA: $\dfrac{\sqrt 5 - 1}{2} C \approx 0{,}62C$
AEN: $\dfrac{\sqrt 5 - 1}{2} C \approx 0.62C$

--- easy current
KA: გამტარის განივკვეთში $5\ \text{წმ}$-ში $10\ \text{კ}$ მუხტი გავიდა. იპოვეთ დენის ძალა.
EN: $10\ \text{C}$ passes through a wire's cross-section in $5\ \text{s}$. Find the current.
HKA: $I = \dfrac{q}{t}$.
HEN: $I = \dfrac{q}{t}$.
SKA: $I = \dfrac{10}{5} = 2\ \text{ა}$
SEN: $I = \dfrac{10}{5} = 2\ \text{A}$
AKA: $2\ \text{ა}$
AEN: $2\ \text{A}$

--- easy current
KA: $0{,}2\ \text{ა}$ დენი $1$ საათი გადის. რამდენი მუხტი გაივლის?
EN: A current of $0.2\ \text{A}$ flows for $1$ hour. How much charge passes?
HKA: $q = I t$.
HEN: $q = I t$.
SKA: $q = 0{,}2 \cdot 3600 = 720\ \text{კ}$
SEN: $q = 0.2 \cdot 3600 = 720\ \text{C}$
AKA: $720\ \text{კ}$
AEN: $720\ \text{C}$

--- easy current
KA: რა არის დენის მიმართულება? საით მოძრაობენ ელექტრონები ლითონში?
EN: What is the direction of current? Which way do electrons move in a metal?
HKA: შეთანხმება დადებითი მუხტებით არის დადებული.
HEN: The convention is set by positive charges.
SKA: დენის მიმართულებად მიღებულია დადებითი მუხტების მოძრაობის მიმართულება — წყაროს „+“-დან „−“-ისკენ გარე წრედში.
ლითონში ელექტრონები საპირისპიროდ მოძრაობენ — „−“-დან „+“-ისკენ.
SEN: The direction of current is taken as the direction positive charges would move — from "+" to "−" in the external circuit.
In a metal the electrons move the opposite way — from "−" to "+".
AKA: დენი „+“-დან „−“-ისკენ, ელექტრონები — პირიქით
AEN: current from "+" to "−", electrons the other way

--- easy current
KA: $1\ \text{ა}$ დენისას რამდენი ელექტრონი გადის წამში?
EN: How many electrons pass each second for a current of $1\ \text{A}$?
HKA: $N = \dfrac{I t}{e}$.
HEN: $N = \dfrac{I t}{e}$.
SKA: $N = \dfrac{1}{1{,}6 \cdot 10^{-19}} = 6{,}25 \cdot 10^{18}$
SEN: $N = \dfrac{1}{1.6 \times 10^{-19}} = 6.25 \times 10^{18}$
AKA: $6{,}25 \cdot 10^{18}$
AEN: $6.25 \times 10^{18}$

--- easy current
KA: ტელეფონის აკუმულატორის ტევადობაა $3000\ \text{მა·სთ}$. რამდენი კულონია ეს? რამდენ ხანს იმუშავებს $0{,}2\ \text{ა}$ დენით?
EN: A phone battery is rated $3000\ \text{mAh}$. How many coulombs is that? How long does it last at $0.2\ \text{A}$?
HKA: $1\ \text{ა·სთ} = 3600\ \text{კ}$.
HEN: $1\ \text{Ah} = 3600\ \text{C}$.
SKA: $q = 3 \cdot 3600 = 10\,800\ \text{კ}$
$t = \dfrac{3}{0{,}2} = 15\ \text{სთ}$
SEN: $q = 3 \cdot 3600 = 10\,800\ \text{C}$
$t = \dfrac{3}{0.2} = 15\ \text{h}$
AKA: $10\,800\ \text{კ}$; $15\ \text{სთ}$
AEN: $10\,800\ \text{C}$; $15\ \text{h}$

--- easy current
KA: რა პირობებია საჭირო ელექტრული დენის არსებობისთვის?
EN: What conditions are needed for an electric current to flow?
HKA: თავისუფალი მუხტები და ...
HEN: Free charges and ...
SKA: 1) თავისუფალი მუხტის მატარებლები (ელექტრონები, იონები);
2) ელექტრული ველი (ძაბვა) — დენის წყარო;
3) ჩაკეტილი წრედი.
SEN: 1) free charge carriers (electrons, ions);
2) an electric field (voltage) — a source;
3) a closed circuit.
AKA: თავისუფალი მუხტები, ველი, ჩაკეტილი წრედი
AEN: free charges, a field, a closed circuit

--- easy current
KA: ამპერმეტრი $250\ \text{მა}$-ს აჩვენებს. რამდენი მუხტი გაივლის $2$ წუთში?
EN: An ammeter reads $250\ \text{mA}$. How much charge passes in $2$ minutes?
HKA: $q = I t$.
HEN: $q = I t$.
SKA: $q = 0{,}25 \cdot 120 = 30\ \text{კ}$
SEN: $q = 0.25 \cdot 120 = 30\ \text{C}$
AKA: $30\ \text{კ}$
AEN: $30\ \text{C}$

--- easy current
KA: მეხის დარტყმისას $20\ \text{კ}$ მუხტი $10^{-3}\ \text{წმ}$-ში გადის. იპოვეთ დენის საშუალო ძალა.
EN: A lightning strike carries $20\ \text{C}$ in $10^{-3}\ \text{s}$. Find the average current.
HKA: $I = \dfrac{q}{t}$.
HEN: $I = \dfrac{q}{t}$.
SKA: $I = \dfrac{20}{10^{-3}} = 2 \cdot 10^4\ \text{ა}$
SEN: $I = \dfrac{20}{10^{-3}} = 2 \times 10^4\ \text{A}$
AKA: $20\ \text{კა}$
AEN: $20\ \text{kA}$

--- medium current
KA: სპილენძის მავთულში ($S = 2\ \text{მმ}^2$) $4\ \text{ა}$ დენია. თავისუფალი ელექტრონების კონცენტრაციაა $8{,}5 \cdot 10^{28}\ \text{მ}^{-3}$. იპოვეთ მათი მიმართული მოძრაობის სიჩქარე.
EN: A copper wire ($S = 2\ \text{mm}^2$) carries $4\ \text{A}$. The free-electron density is $8.5 \times 10^{28}\ \text{m}^{-3}$. Find the drift speed.
HKA: $I = n e v S$.
HEN: $I = n e v S$.
SKA: $v = \dfrac{4}{8{,}5 \cdot 10^{28} \cdot 1{,}6 \cdot 10^{-19} \cdot 2 \cdot 10^{-6}} \approx 1{,}5 \cdot 10^{-4}\ \text{მ/წმ}$
SEN: $v = \dfrac{4}{8.5 \times 10^{28} \cdot 1.6 \times 10^{-19} \cdot 2 \times 10^{-6}} \approx 1.5 \times 10^{-4}\ \text{m/s}$
AKA: $\approx 0{,}15\ \text{მმ/წმ}$
AEN: $\approx 0.15\ \text{mm/s}$

--- medium current
KA: თუ ელექტრონები ასე ნელა მოძრაობენ (მმ/წმ), რატომ ინთება ნათურა ჩამრთველის ჩართვისთანავე?
EN: If electrons drift so slowly (mm/s), why does a lamp light the instant the switch is closed?
HKA: რა ვრცელდება სწრაფად?
HEN: What spreads quickly?
SKA: ელექტრული ველი მავთულში თითქმის სინათლის სიჩქარით ვრცელდება და ყველგან ერთდროულად აამოძრავებს ელექტრონებს, რომლებიც უკვე მავთულში (და ნათურაში) არიან.
SEN: The electric field spreads along the wire at nearly the speed of light and sets the electrons already in the wire (and the lamp) moving everywhere at once.
AKA: ველი სწრაფად ვრცელდება
AEN: the field spreads almost instantly

--- hard current
KA: დენის ძალა $t$ დროში თანაბრად იზრდება $0$-დან $4\ \text{ა}$-მდე $10\ \text{წმ}$-ის განმავლობაში. რამდენი მუხტი გაივლის?
EN: A current rises uniformly from $0$ to $4\ \text{A}$ over $10\ \text{s}$. How much charge passes?
HKA: $q$ — $I(t)$ გრაფიკის ქვეშ ფართობი.
HEN: $q$ is the area under the $I(t)$ graph.
SKA: $q = \dfrac{1}{2} \cdot 10 \cdot 4 = 20\ \text{კ}$
SEN: $q = \dfrac{1}{2} \cdot 10 \cdot 4 = 20\ \text{C}$
AKA: $20\ \text{კ}$
AEN: $20\ \text{C}$

--- hard current
KA: ელექტრონული სხივი ($I = 1\ \text{მა}$) $10\ \text{კვ}$ ძაბვით აჩქარებულია. რამდენი ელექტრონი ეცემა ეკრანს წამში და რა სიმძლავრეს გადასცემს?
EN: An electron beam ($I = 1\ \text{mA}$) is accelerated through $10\ \text{kV}$. How many electrons hit the screen per second, and what power do they deliver?
HKA: $N = \dfrac{I}{e}$, $N_{\text{ს}} = I U$.
HEN: $N = \dfrac{I}{e}$, $P = I U$.
SKA: $N = \dfrac{10^{-3}}{1{,}6 \cdot 10^{-19}} = 6{,}25 \cdot 10^{15}\ \text{წმ}^{-1}$
სიმძლავრე: $10^{-3} \cdot 10^4 = 10\ \text{ვტ}$
SEN: $N = \dfrac{10^{-3}}{1.6 \times 10^{-19}} = 6.25 \times 10^{15}\ \text{s}^{-1}$
Power: $10^{-3} \cdot 10^4 = 10\ \text{W}$
AKA: $6{,}25 \cdot 10^{15}$; $10\ \text{ვტ}$
AEN: $6.25 \times 10^{15}$; $10\ \text{W}$

--- easy ohm
KA: $20\ \text{ომ}$ რეზისტორში $0{,}3\ \text{ა}$ გადის. იპოვეთ ძაბვა.
EN: $0.3\ \text{A}$ flows through a $20\ \Omega$ resistor. Find the voltage.
HKA: $U = I R$.
HEN: $U = I R$.
SKA: $U = 0{,}3 \cdot 20 = 6\ \text{ვ}$
SEN: $U = 0.3 \cdot 20 = 6\ \text{V}$
AKA: $6\ \text{ვ}$
AEN: $6\ \text{V}$

--- easy ohm
KA: ნათურა $220\ \text{ვ}$-ზე $0{,}5\ \text{ა}$-ს მოიხმარს. იპოვეთ წინაღობა.
EN: A lamp draws $0.5\ \text{A}$ at $220\ \text{V}$. Find its resistance.
HKA: $R = \dfrac{U}{I}$.
HEN: $R = \dfrac{U}{I}$.
SKA: $R = \dfrac{220}{0{,}5} = 440\ \text{ომი}$
SEN: $R = \dfrac{220}{0.5} = 440\ \Omega$
AKA: $440\ \text{ომი}$
AEN: $440\ \Omega$

--- easy ohm
KA: რეზისტორზე ძაბვა $3$-ჯერ გაზარდეს. როგორ შეიცვლება დენი?
EN: The voltage across a resistor is tripled. How does the current change?
HKA: $I \sim U$.
HEN: $I \sim U$.
SKA: $3$-ჯერ გაიზრდება.
SEN: It triples.
AKA: $3$-ჯერ გაიზრდება
AEN: it triples

--- easy ohm
KA: $2\ \text{მ}$ სიგრძისა და $0{,}2\ \text{მმ}^2$ განივკვეთის ალუმინის მავთულის წინაღობა რას უდრის? ($\rho = 0{,}028\ \text{ომი·მმ}^2/\text{მ}$)
EN: What is the resistance of an aluminium wire $2\ \text{m}$ long with cross-section $0.2\ \text{mm}^2$? ($\rho = 0.028\ \Omega\cdot\text{mm}^2/\text{m}$)
HKA: $R = \rho\dfrac{l}{S}$.
HEN: $R = \rho\dfrac{l}{S}$.
SKA: $R = 0{,}028 \cdot \dfrac{2}{0{,}2} = 0{,}28\ \text{ომი}$
SEN: $R = 0.028 \cdot \dfrac{2}{0.2} = 0.28\ \Omega$
AKA: $0{,}28\ \text{ომი}$
AEN: $0.28\ \Omega$

--- easy ohm
KA: როგორ შეიცვლება მავთულის წინაღობა, თუ მის სიგრძეს $2$-ჯერ გავზრდით? თუ განივკვეთს $2$-ჯერ?
EN: How does a wire's resistance change if its length is doubled? If its cross-section is doubled?
HKA: $R \sim \dfrac{l}{S}$.
HEN: $R \sim \dfrac{l}{S}$.
SKA: სიგრძე ×2 — წინაღობა ×2; განივკვეთი ×2 — წინაღობა $\div 2$.
SEN: Length ×2 — resistance ×2; cross-section ×2 — resistance $\div 2$.
AKA: $2$-ჯერ მეტი; $2$-ჯერ ნაკლები
AEN: twice as much; half as much

--- easy ohm
KA: $12\ \text{ვ}$ ძაბვაზე წრედში $2\ \text{ა}$ გადის. რა დენი იქნება $18\ \text{ვ}$-ზე?
EN: At $12\ \text{V}$ a circuit draws $2\ \text{A}$. What current will it draw at $18\ \text{V}$?
HKA: ჯერ $R$.
HEN: Find $R$ first.
SKA: $R = 6\ \text{ომი}$, $\ I = \dfrac{18}{6} = 3\ \text{ა}$
SEN: $R = 6\ \Omega$, $\ I = \dfrac{18}{6} = 3\ \text{A}$
AKA: $3\ \text{ა}$
AEN: $3\ \text{A}$

--- easy ohm
KA: რა არის ხვედრითი წინაღობა? რომელი ლითონია საუკეთესო გამტარი?
EN: What is resistivity? Which metal is the best conductor?
HKA: $1\ \text{მ}$ სიგრძისა და $1\ \text{მმ}^2$ კვეთის მავთულის წინაღობა.
HEN: The resistance of a wire $1\ \text{m}$ long and $1\ \text{mm}^2$ in cross-section.
SKA: ხვედრითი წინაღობა $\rho$ ნივთიერების თვისებაა — $1\ \text{მ}$ სიგრძისა და $1\ \text{მ}^2$ (ან $1\ \text{მმ}^2$) კვეთის გამტარის წინაღობა.
საუკეთესო გამტარია ვერცხლი ($0{,}016\ \text{ომი·მმ}^2/\text{მ}$), შემდეგ სპილენძი.
SEN: Resistivity $\rho$ is a property of the material — the resistance of a conductor $1\ \text{m}$ long with a $1\ \text{m}^2$ (or $1\ \text{mm}^2$) cross-section.
The best conductor is silver ($0.016\ \Omega\cdot\text{mm}^2/\text{m}$), then copper.
AKA: ვერცხლი
AEN: silver

--- easy ohm
KA: რეზისტორის ვოლტამპერული მახასიათებელი წრფეა $(0;\ 0)$-დან $(4\ \text{ვ};\ 0{,}2\ \text{ა})$-მდე. იპოვეთ წინაღობა.
EN: A resistor's I–V graph is a straight line from $(0;\ 0)$ to $(4\ \text{V};\ 0.2\ \text{A})$. Find its resistance.
HKA: $R = \dfrac{U}{I}$.
HEN: $R = \dfrac{U}{I}$.
SKA: $R = \dfrac{4}{0{,}2} = 20\ \text{ომი}$
SEN: $R = \dfrac{4}{0.2} = 20\ \Omega$
AKA: $20\ \text{ომი}$
AEN: $20\ \Omega$

--- medium ohm
KA: ნიქრომის მავთულიდან ($\rho = 1{,}1\ \text{ომი·მმ}^2/\text{მ}$, $S = 0{,}5\ \text{მმ}^2$) $44\ \text{ომი}$ წინაღობის სპირალი უნდა გააკეთონ. რა სიგრძის მავთულია საჭირო?
EN: A $44\ \Omega$ coil is to be made of nichrome wire ($\rho = 1.1\ \Omega\cdot\text{mm}^2/\text{m}$, $S = 0.5\ \text{mm}^2$). What length is needed?
HKA: $l = \dfrac{R S}{\rho}$.
HEN: $l = \dfrac{R S}{\rho}$.
SKA: $l = \dfrac{44 \cdot 0{,}5}{1{,}1} = 20\ \text{მ}$
SEN: $l = \dfrac{44 \cdot 0.5}{1.1} = 20\ \text{m}$
AKA: $20\ \text{მ}$
AEN: $20\ \text{m}$

--- medium ohm
KA: სპილენძისა ($\rho = 0{,}017$) და ალუმინის ($0{,}028\ \text{ომი·მმ}^2/\text{მ}$) მავთულებს ერთი სიგრძე და წინაღობა აქვთ. რომლის კვეთაა მეტი და რამდენჯერ?
EN: Copper ($\rho = 0.017$) and aluminium ($0.028\ \Omega\cdot\text{mm}^2/\text{m}$) wires have the same length and resistance. Which has the larger cross-section and by what factor?
HKA: $S \sim \rho$.
HEN: $S \sim \rho$.
SKA: $\dfrac{S_{\text{ალ}}}{S_{\text{სპ}}} = \dfrac{0{,}028}{0{,}017} \approx 1{,}65$
SEN: $\dfrac{S_{\text{Al}}}{S_{\text{Cu}}} = \dfrac{0.028}{0.017} \approx 1.65$
AKA: ალუმინისა, $\approx 1{,}65$-ჯერ
AEN: the aluminium one, $\approx 1.65$ times

--- medium ohm
KA: სპილენძის მავთულის ($l = 50\ \text{მ}$) წინაღობა $0{,}85\ \text{ომი}$-ია. იპოვეთ დიამეტრი. ($\rho = 0{,}017\ \text{ომი·მმ}^2/\text{მ}$)
EN: A copper wire $50\ \text{m}$ long has resistance $0.85\ \Omega$. Find its diameter. ($\rho = 0.017\ \Omega\cdot\text{mm}^2/\text{m}$)
HKA: $S = \dfrac{\rho l}{R}$, $d = \sqrt{\dfrac{4S}{\pi}}$.
HEN: $S = \dfrac{\rho l}{R}$, $d = \sqrt{\dfrac{4S}{\pi}}$.
SKA: $S = \dfrac{0{,}017 \cdot 50}{0{,}85} = 1\ \text{მმ}^2$, $\ d = \sqrt{\dfrac{4}{3{,}14}} \approx 1{,}13\ \text{მმ}$
SEN: $S = \dfrac{0.017 \cdot 50}{0.85} = 1\ \text{mm}^2$, $\ d = \sqrt{\dfrac{4}{3.14}} \approx 1.13\ \text{mm}$
AKA: $\approx 1{,}13\ \text{მმ}$
AEN: $\approx 1.13\ \text{mm}$

--- medium ohm
KA: სპილენძის მავთულის მასაა $89\ \text{გ}$, წინაღობა $1{,}7\ \text{ომი}$. იპოვეთ სიგრძე და კვეთა. ($\rho_{\text{ელ}} = 1{,}7 \cdot 10^{-8}\ \text{ომი·მ}$, სიმკვრივე $8900\ \text{კგ/მ}^3$)
EN: A copper wire has mass $89\ \text{g}$ and resistance $1.7\ \Omega$. Find its length and cross-section. ($\rho_{\text{el}} = 1.7 \times 10^{-8}\ \Omega\cdot\text{m}$, density $8900\ \text{kg/m}^3$)
HKA: $V = l S = \dfrac{m}{d}$, $R = \rho\dfrac{l}{S}$ — გადაამრავლეთ: $R V = \rho l^2$.
HEN: $V = l S = \dfrac{m}{d}$, $R = \rho\dfrac{l}{S}$ — multiply: $R V = \rho l^2$.
SKA: $V = \dfrac{0{,}089}{8900} = 10^{-5}\ \text{მ}^3$
$l^2 = \dfrac{1{,}7 \cdot 10^{-5}}{1{,}7 \cdot 10^{-8}} = 1000 \Rightarrow l \approx 31{,}6\ \text{მ}$
$S = \dfrac{V}{l} \approx 3{,}2 \cdot 10^{-7}\ \text{მ}^2 = 0{,}32\ \text{მმ}^2$
SEN: $V = \dfrac{0.089}{8900} = 10^{-5}\ \text{m}^3$
$l^2 = \dfrac{1.7 \times 10^{-5}}{1.7 \times 10^{-8}} = 1000 \Rightarrow l \approx 31.6\ \text{m}$
$S = \dfrac{V}{l} \approx 3.2 \times 10^{-7}\ \text{m}^2 = 0.32\ \text{mm}^2$
AKA: $\approx 31{,}6\ \text{მ}$; $\approx 0{,}32\ \text{მმ}^2$
AEN: $\approx 31.6\ \text{m}$; $\approx 0.32\ \text{mm}^2$

--- medium ohm
KA: ნათურის ძაფის წინაღობა ცივ მდგომარეობაში $40\ \text{ომი}$-ია, ანთებულში — $440\ \text{ომი}$. რამდენჯერ მეტია ჩართვის მომენტში დენი, ვიდრე მუშაობისას? ($U = 220\ \text{ვ}$)
EN: A lamp filament is $40\ \Omega$ cold and $440\ \Omega$ hot. How many times larger is the current at switch-on than in operation? ($U = 220\ \text{V}$)
HKA: $I \sim \dfrac{1}{R}$.
HEN: $I \sim \dfrac{1}{R}$.
SKA: $I_0 = \dfrac{220}{40} = 5{,}5\ \text{ა}$, $\ I = 0{,}5\ \text{ა}$ — $11$-ჯერ (ამიტომ ნათურები ჩართვისას იწვება).
SEN: $I_0 = \dfrac{220}{40} = 5.5\ \text{A}$, $\ I = 0.5\ \text{A}$ — $11$ times (which is why bulbs often fail at switch-on).
AKA: $11$-ჯერ
AEN: $11$ times

--- medium ohm
KA: მავთული ორად მოკეცეს (ნახევრები გვერდიგვერდ). როგორ შეიცვლება წინაღობა?
EN: A wire is folded in half (the halves side by side). How does its resistance change?
HKA: სიგრძე $2$-ჯერ მცირდება, კვეთა $2$-ჯერ იზრდება.
HEN: The length halves and the cross-section doubles.
SKA: $R' = \rho\dfrac{l/2}{2S} = \dfrac{R}{4}$
SEN: $R' = \rho\dfrac{l/2}{2S} = \dfrac{R}{4}$
AKA: $4$-ჯერ შემცირდება
AEN: it becomes $4$ times smaller

--- medium ohm
KA: ლითონის წინაღობა ტემპერატურასთან ერთად იზრდება: $R = R_0(1 + \alpha t)$. სპილენძის ($\alpha = 4{,}3 \cdot 10^{-3}\ \text{°C}^{-1}$) მავთულს $0\ \text{°C}$-ზე $10\ \text{ომი}$ აქვს. რა იქნება $100\ \text{°C}$-ზე?
EN: A metal's resistance grows with temperature: $R = R_0(1 + \alpha t)$. A copper wire ($\alpha = 4.3 \times 10^{-3}\ \text{°C}^{-1}$) is $10\ \Omega$ at $0\ \text{°C}$. What is it at $100\ \text{°C}$?
HKA: ჩასვით ფორმულაში.
HEN: Substitute into the formula.
SKA: $R = 10(1 + 0{,}43) = 14{,}3\ \text{ომი}$
SEN: $R = 10(1 + 0.43) = 14.3\ \Omega$
AKA: $14{,}3\ \text{ომი}$
AEN: $14.3\ \Omega$

--- medium ohm
KA: ზეგამტარობა: რა ემართება ზოგი მასალის წინაღობას ძალიან დაბალ ტემპერატურაზე? სად გამოიყენება?
EN: Superconductivity: what happens to the resistance of some materials at very low temperatures? Where is it used?
HKA: კრიტიკული ტემპერატურა.
HEN: The critical temperature.
SKA: კრიტიკულ ტემპერატურაზე დაბლა (მაგ., ვერცხლისწყალი $4{,}2\ \text{კ}$) წინაღობა ნახტომისებრ ნულდება — დენი დანაკარგის გარეშე გადის.
გამოყენება: ძლიერი ელექტრომაგნიტები (მაგნიტურ-რეზონანსული ტომოგრაფი, ნაწილაკთა ამაჩქარებლები), მაგლევ-მატარებლები.
SEN: Below a critical temperature (e.g. mercury at $4.2\ \text{K}$) the resistance drops abruptly to zero — current flows with no losses.
Uses: powerful electromagnets (MRI scanners, particle accelerators), maglev trains.
AKA: წინაღობა ნულდება; ელექტრომაგნიტები, MRI
AEN: resistance becomes zero; electromagnets, MRI

--- hard ohm
KA: მავთული გაჭიმეს ისე, რომ მისი დიამეტრი $2$-ჯერ შემცირდა (მოცულობა იგივეა). როგორ შეიცვლება წინაღობა?
EN: A wire is drawn out so that its diameter halves (the volume stays the same). How does its resistance change?
HKA: კვეთა $4$-ჯერ მცირდება, სიგრძე $4$-ჯერ იზრდება.
HEN: The cross-section shrinks $4$ times and the length grows $4$ times.
SKA: $R' = \rho\dfrac{4l}{S/4} = 16R$
SEN: $R' = \rho\dfrac{4l}{S/4} = 16R$
AKA: $16$-ჯერ გაიზრდება
AEN: it grows $16$ times

--- hard ohm
KA: ვოლფრამის ძაფის წინაღობა $20\ \text{°C}$-ზე $35\ \text{ომი}$-ია, მუშაობისას $220\ \text{ვ}$-ზე $0{,}45\ \text{ა}$ მოიხმარს. იპოვეთ ძაფის ტემპერატურა. ($\alpha = 4{,}8 \cdot 10^{-3}\ \text{°C}^{-1}$)
EN: A tungsten filament is $35\ \Omega$ at $20\ \text{°C}$; in use at $220\ \text{V}$ it draws $0.45\ \text{A}$. Find the filament temperature. ($\alpha = 4.8 \times 10^{-3}\ \text{°C}^{-1}$)
HKA: $R_0$ ($0\ \text{°C}$-ზე) ჯერ იპოვეთ.
HEN: Find $R_0$ (at $0\ \text{°C}$) first.
SKA: $R_{\text{ც}} = \dfrac{220}{0{,}45} \approx 489\ \text{ომი}$
$R_0 = \dfrac{35}{1 + 0{,}096} \approx 31{,}9\ \text{ომი}$
$t = \dfrac{489/31{,}9 - 1}{4{,}8 \cdot 10^{-3}} \approx \dfrac{14{,}3}{0{,}0048} \approx 3000\ \text{°C}$
SEN: $R_{\text{hot}} = \dfrac{220}{0.45} \approx 489\ \Omega$
$R_0 = \dfrac{35}{1 + 0.096} \approx 31.9\ \Omega$
$t = \dfrac{489/31.9 - 1}{4.8 \times 10^{-3}} \approx \dfrac{14.3}{0.0048} \approx 3000\ \text{°C}$
AKA: $\approx 3000\ \text{°C}$
AEN: $\approx 3000\ \text{°C}$

--- hard ohm
KA: სპილენძის და რკინის ($\rho_{\text{რკ}} = 0{,}1\ \text{ომი·მმ}^2/\text{მ}$) მავთულებს ერთნაირი მასა და სიგრძე აქვთ. რომლის წინაღობაა მეტი და რამდენჯერ? (სიმკვრივეები $8900$ და $7800\ \text{კგ/მ}^3$)
EN: Copper and iron ($\rho_{\text{Fe}} = 0.1\ \Omega\cdot\text{mm}^2/\text{m}$) wires have the same mass and length. Which has the larger resistance and by what factor? (Densities $8900$ and $7800\ \text{kg/m}^3$.)
HKA: ერთნაირი მასა და სიგრძე: $S \sim \dfrac{1}{d}$, ამიტომ $R \sim \rho d$.
HEN: Same mass and length: $S \sim \dfrac{1}{d}$, so $R \sim \rho d$.
SKA: $\dfrac{R_{\text{რკ}}}{R_{\text{სპ}}} = \dfrac{0{,}1 \cdot 7800}{0{,}017 \cdot 8900} \approx 5{,}2$
SEN: $\dfrac{R_{\text{Fe}}}{R_{\text{Cu}}} = \dfrac{0.1 \cdot 7800}{0.017 \cdot 8900} \approx 5.2$
AKA: რკინისა, $\approx 5{,}2$-ჯერ
AEN: the iron one, $\approx 5.2$ times

--- hard ohm
KA: სპილენძის ($\alpha_1 = 4{,}3 \cdot 10^{-3}$) და ნახშირის ($\alpha_2 = -5 \cdot 10^{-4}\ \text{°C}^{-1}$) რეზისტორები მიმდევრობითაა. როგორი უნდა იყოს მათი წინაღობების შეფარდება, რომ ჯამური წინაღობა ტემპერატურაზე არ იყოს დამოკიდებული?
EN: A copper resistor ($\alpha_1 = 4.3 \times 10^{-3}$) and a carbon one ($\alpha_2 = -5 \times 10^{-4}\ \text{°C}^{-1}$) are in series. What ratio of their resistances makes the total independent of temperature?
HKA: $R_1\alpha_1 + R_2\alpha_2 = 0$.
HEN: $R_1\alpha_1 + R_2\alpha_2 = 0$.
SKA: $\dfrac{R_2}{R_1} = -\dfrac{\alpha_1}{\alpha_2} = \dfrac{4{,}3 \cdot 10^{-3}}{5 \cdot 10^{-4}} = 8{,}6$
SEN: $\dfrac{R_2}{R_1} = -\dfrac{\alpha_1}{\alpha_2} = \dfrac{4.3 \times 10^{-3}}{5 \times 10^{-4}} = 8.6$
AKA: $R_{\text{ნახ}} : R_{\text{სპ}} = 8{,}6$
AEN: $R_{\text{C}} : R_{\text{Cu}} = 8.6$

--- easy circuits
KA: $10\ \text{ომი}$ და $15\ \text{ომი}$ რეზისტორები მიმდევრობითაა. იპოვეთ ჯამური წინაღობა.
EN: $10\ \Omega$ and $15\ \Omega$ resistors are in series. Find the total resistance.
HKA: $R = R_1 + R_2$.
HEN: $R = R_1 + R_2$.
SKA: $R = 25\ \text{ომი}$
SEN: $R = 25\ \Omega$
AKA: $25\ \text{ომი}$
AEN: $25\ \Omega$

--- easy circuits
KA: $12\ \text{ომი}$ და $4\ \text{ომი}$ რეზისტორები პარალელურადაა. იპოვეთ ჯამური წინაღობა.
EN: $12\ \Omega$ and $4\ \Omega$ resistors are in parallel. Find the total resistance.
HKA: $R = \dfrac{R_1 R_2}{R_1 + R_2}$.
HEN: $R = \dfrac{R_1 R_2}{R_1 + R_2}$.
SKA: $R = \dfrac{48}{16} = 3\ \text{ომი}$
SEN: $R = \dfrac{48}{16} = 3\ \Omega$
AKA: $3\ \text{ომი}$
AEN: $3\ \Omega$

--- easy circuits
KA: ხუთი ერთნაირი $20\ \text{ომი}$ რეზისტორი პარალელურადაა. იპოვეთ ჯამური წინაღობა.
EN: Five identical $20\ \Omega$ resistors are in parallel. Find the total resistance.
HKA: $R = \dfrac{R_1}{n}$.
HEN: $R = \dfrac{R_1}{n}$.
SKA: $R = \dfrac{20}{5} = 4\ \text{ომი}$
SEN: $R = \dfrac{20}{5} = 4\ \Omega$
AKA: $4\ \text{ომი}$
AEN: $4\ \Omega$

--- easy circuits
KA: მიმდევრობით შეერთებისას რომელი სიდიდეა ყველა გამტარზე ერთნაირი? პარალელურისას?
EN: Which quantity is the same for all conductors in series? In parallel?
HKA: დენი და ძაბვა.
HEN: Current and voltage.
SKA: მიმდევრობით — დენის ძალა.
პარალელურად — ძაბვა.
SEN: In series — the current.
In parallel — the voltage.
AKA: მიმდევრობით — $I$; პარალელურად — $U$
AEN: series — $I$; parallel — $U$

--- easy circuits
KA: $6\ \text{ომი}$ და $3\ \text{ომი}$ მიმდევრობითაა $18\ \text{ვ}$-ზე. იპოვეთ დენი და თითოეულის ძაბვა.
EN: $6\ \Omega$ and $3\ \Omega$ in series across $18\ \text{V}$. Find the current and each voltage.
HKA: $I = \dfrac{U}{R_1 + R_2}$.
HEN: $I = \dfrac{U}{R_1 + R_2}$.
SKA: $I = 2\ \text{ა}$; $\ U_1 = 12\ \text{ვ}$, $\ U_2 = 6\ \text{ვ}$
SEN: $I = 2\ \text{A}$; $\ U_1 = 12\ \text{V}$, $\ U_2 = 6\ \text{V}$
AKA: $2\ \text{ა}$; $12$ და $6\ \text{ვ}$
AEN: $2\ \text{A}$; $12$ and $6\ \text{V}$

--- easy circuits
KA: $10\ \text{ომი}$ და $40\ \text{ომი}$ პარალელურადაა $20\ \text{ვ}$-ზე. იპოვეთ თითოეულის დენი და ჯამური დენი.
EN: $10\ \Omega$ and $40\ \Omega$ in parallel across $20\ \text{V}$. Find each current and the total.
HKA: ძაბვა ორივეზე $20\ \text{ვ}$-ია.
HEN: Both have $20\ \text{V}$ across them.
SKA: $I_1 = 2\ \text{ა}$, $\ I_2 = 0{,}5\ \text{ა}$, $\ I = 2{,}5\ \text{ა}$
SEN: $I_1 = 2\ \text{A}$, $\ I_2 = 0.5\ \text{A}$, $\ I = 2.5\ \text{A}$
AKA: $2$; $0{,}5$; $2{,}5\ \text{ა}$
AEN: $2$; $0.5$; $2.5\ \text{A}$

--- easy circuits
KA: რატომ არის სახლის ელექტრომოწყობილობები პარალელურად შეერთებული?
EN: Why are household appliances connected in parallel?
HKA: ძაბვა და დამოუკიდებლობა.
HEN: Voltage and independence.
SKA: პარალელურად ყველა მოწყობილობა სრულ $220\ \text{ვ}$-ს იღებს და შეიძლება ცალ-ცალკე ჩაირთოს/გამოირთოს; ერთის დაზიანება სხვებს არ თიშავს.
SEN: In parallel every appliance gets the full $220\ \text{V}$ and can be switched on and off independently; one failing doesn't cut the others off.
AKA: სრული ძაბვა და დამოუკიდებელი ჩართვა
AEN: full voltage and independent switching

--- easy circuits
KA: $5\ \text{ომი}$ რეზისტორს პარალელურად რა რეზისტორი უნდა მივუერთოთ, რომ ჯამი $4\ \text{ომი}$ იყოს?
EN: What resistor must be added in parallel to $5\ \Omega$ to get $4\ \Omega$?
HKA: $\dfrac{1}{R_2} = \dfrac{1}{4} - \dfrac{1}{5}$.
HEN: $\dfrac{1}{R_2} = \dfrac{1}{4} - \dfrac{1}{5}$.
SKA: $\dfrac{1}{R_2} = \dfrac{1}{20} \Rightarrow R_2 = 20\ \text{ომი}$
SEN: $\dfrac{1}{R_2} = \dfrac{1}{20} \Rightarrow R_2 = 20\ \Omega$
AKA: $20\ \text{ომი}$
AEN: $20\ \Omega$

--- medium circuits
KA: $R_1 = 2\ \text{ომი}$ მიმდევრობითაა პარალელურ წყვილთან ($R_2 = R_3 = 8\ \text{ომი}$). წრედი $12\ \text{ვ}$-ზეა. იპოვეთ ყველა დენი.
EN: $R_1 = 2\ \Omega$ is in series with a parallel pair $R_2 = R_3 = 8\ \Omega$, across $12\ \text{V}$. Find all the currents.
HKA: წყვილი $4\ \text{ომი}$-ია.
HEN: The pair is $4\ \Omega$.
SKA: $R = 6\ \text{ომი}$, $\ I = 2\ \text{ა}$; $\ I_2 = I_3 = 1\ \text{ა}$
SEN: $R = 6\ \Omega$, $\ I = 2\ \text{A}$; $\ I_2 = I_3 = 1\ \text{A}$
AKA: $2\ \text{ა}$; $1\ \text{ა}$ და $1\ \text{ა}$
AEN: $2\ \text{A}$; $1\ \text{A}$ and $1\ \text{A}$

--- medium circuits
KA: სამი რეზისტორი ($3$, $6$ და $2\ \text{ომი}$): პირველი ორი პარალელურადაა, მესამე მიმდევრობით. ჯამურ წრედში $3\ \text{ა}$ გადის. იპოვეთ ძაბვა და $6\ \text{ომი}$-ზე დენი.
EN: Three resistors ($3$, $6$ and $2\ \Omega$): the first two in parallel, the third in series. The total current is $3\ \text{A}$. Find the voltage and the current in the $6\ \Omega$ resistor.
HKA: პარალელური წყვილი $2\ \text{ომი}$.
HEN: The parallel pair is $2\ \Omega$.
SKA: $R = 2 + 2 = 4\ \text{ომი}$, $\ U = 12\ \text{ვ}$
წყვილზე $6\ \text{ვ}$: $I_6 = 1\ \text{ა}$
SEN: $R = 2 + 2 = 4\ \Omega$, $\ U = 12\ \text{V}$
$6\ \text{V}$ across the pair: $I_6 = 1\ \text{A}$
AKA: $12\ \text{ვ}$; $1\ \text{ა}$
AEN: $12\ \text{V}$; $1\ \text{A}$

--- medium circuits
KA: ნათურა ($6\ \text{ვ}$, $0{,}5\ \text{ა}$) $12\ \text{ვ}$ ბატარეაზე უნდა ჩაირთოს. რა დამატებითი რეზისტორია საჭირო მიმდევრობით?
EN: A lamp rated $6\ \text{V}$, $0.5\ \text{A}$ must run from a $12\ \text{V}$ battery. What series resistor is needed?
HKA: რეზისტორზე ზედმეტი $6\ \text{ვ}$ უნდა „დავარდეს“.
HEN: The resistor must drop the extra $6\ \text{V}$.
