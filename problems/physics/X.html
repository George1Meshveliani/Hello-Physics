SKA: $R = \dfrac{6}{0{,}5} = 12\ \text{ომი}$
SEN: $R = \dfrac{6}{0.5} = 12\ \Omega$
AKA: $12\ \text{ომი}$
AEN: $12\ \Omega$

--- medium circuits
KA: ოთხი ერთნაირი რეზისტორიდან ($R$ თითო) როგორ მივიღოთ: ა) $R$; ბ) $\dfrac{R}{4}$; გ) $\dfrac{5R}{2}$?
EN: Using four identical resistors $R$, how do you get: a) $R$; b) $\dfrac{R}{4}$; c) $\dfrac{5R}{2}$?
HKA: სცადეთ მიმდევრობითი და პარალელური კომბინაციები.
HEN: Try series and parallel combinations.
SKA: ა) ორი მიმდევრობითი წყვილი პარალელურად: $\dfrac{2R \cdot 2R}{4R} = R$.
ბ) ოთხივე პარალელურად: $\dfrac{R}{4}$.
გ) ორი მიმდევრობით + ორი პარალელური წყვილი მიმდევრობით: $2R + \dfrac{R}{2} = \dfrac{5R}{2}$.
SEN: a) Two series pairs in parallel: $\dfrac{2R \cdot 2R}{4R} = R$.
b) All four in parallel: $\dfrac{R}{4}$.
c) Two in series plus a parallel pair in series: $2R + \dfrac{R}{2} = \dfrac{5R}{2}$.
AKA: ა) $(2R) \parallel (2R)$; ბ) $4$ პარალელურად; გ) $2R + R \parallel R$
AEN: a) $(2R) \parallel (2R)$; b) all four in parallel; c) $2R + R \parallel R$

--- medium circuits
KA: გალვანომეტრი ($R_g = 100\ \text{ომი}$) $1\ \text{მა}$-ზე მეტს ვერ ზომავს. როგორ ვაქციოთ $10\ \text{ვ}$-იან ვოლტმეტრად?
EN: A galvanometer ($R_g = 100\ \Omega$) reads at most $1\ \text{mA}$. How can it be made into a $10\ \text{V}$ voltmeter?
HKA: მიმდევრობით დამატებითი რეზისტორი.
HEN: A resistor in series.
SKA: $R_{\text{სრ}} = \dfrac{10}{10^{-3}} = 10\,000\ \text{ომი}$, $\ R_{\text{დ}} = 9900\ \text{ომი}$
SEN: $R_{\text{total}} = \dfrac{10}{10^{-3}} = 10\,000\ \Omega$, $\ R_{\text{add}} = 9900\ \Omega$
AKA: მიმდევრობით $9{,}9\ \text{კომ}$
AEN: $9.9\ \text{k}\Omega$ in series

--- medium circuits
KA: იგივე გალვანომეტრი ($100\ \text{ომი}$, $1\ \text{მა}$) $1\ \text{ა}$-იან ამპერმეტრად როგორ ვაქციოთ?
EN: How can the same galvanometer ($100\ \Omega$, $1\ \text{mA}$) be made into a $1\ \text{A}$ ammeter?
HKA: პარალელურად შუნტი.
HEN: A shunt in parallel.
SKA: შუნტში $0{,}999\ \text{ა}$; ძაბვა $0{,}1\ \text{ვ}$
$R_{\text{შ}} = \dfrac{0{,}1}{0{,}999} \approx 0{,}1\ \text{ომი}$
SEN: The shunt carries $0.999\ \text{A}$; the voltage is $0.1\ \text{V}$
$R_{\text{sh}} = \dfrac{0.1}{0.999} \approx 0.1\ \Omega$
AKA: პარალელურად $\approx 0{,}1\ \text{ომი}$
AEN: $\approx 0.1\ \Omega$ in parallel

--- medium circuits
KA: მიმდევრობით შეერთებისას ორი რეზისტორის წინაღობაა $25\ \text{ომი}$, პარალელურად — $4\ \text{ომი}$. იპოვეთ წინაღობები.
EN: Two resistors give $25\ \Omega$ in series and $4\ \Omega$ in parallel. Find them.
HKA: $R_1 + R_2 = 25$, $R_1 R_2 = 100$.
HEN: $R_1 + R_2 = 25$, $R_1 R_2 = 100$.
SKA: $x^2 - 25x + 100 = 0 \Rightarrow x = 20$ ან $5$
SEN: $x^2 - 25x + 100 = 0 \Rightarrow x = 20$ or $5$
AKA: $20\ \text{ომი}$ და $5\ \text{ომი}$
AEN: $20\ \Omega$ and $5\ \Omega$

--- medium circuits
KA: მიმდევრობით შეერთებული ორი ნათურიდან ერთი დაიწვა. რა მოუვა მეორეს? პარალელურისას?
EN: Two lamps are in series and one burns out. What happens to the other? And if they're in parallel?
HKA: წრედის გაწყვეტა.
HEN: A break in the circuit.
SKA: მიმდევრობით — წრედი გაწყდება, მეორეც ჩაქრება.
პარალელურად — მეორე იგივე ძაბვაზე რჩება და განაგრძობს ნათებას.
SEN: In series — the circuit breaks, so the other goes out too.
In parallel — the other still has the same voltage and keeps shining.
AKA: მიმდევრობით ჩაქრება; პარალელურად — ანათებს
AEN: series: it goes out; parallel: it stays on

--- hard circuits
KA: $R_1 = 4\ \text{ომი}$ და $R_2 = 12\ \text{ომი}$ პარალელურადაა, მათ მიმდევრობით $R_3$. ჯამური წინაღობა $8\ \text{ომი}$-ია. იპოვეთ $R_3$ და დენების განაწილება, თუ $U = 24\ \text{ვ}$.
EN: $R_1 = 4\ \Omega$ and $R_2 = 12\ \Omega$ are in parallel, in series with $R_3$. The total is $8\ \Omega$. Find $R_3$ and the currents if $U = 24\ \text{V}$.
HKA: $R_{12} = 3\ \text{ომი}$.
HEN: $R_{12} = 3\ \Omega$.
SKA: $R_3 = 8 - 3 = 5\ \text{ომი}$; $\ I = 3\ \text{ა}$
$U_{12} = 9\ \text{ვ}$: $I_1 = 2{,}25\ \text{ა}$, $I_2 = 0{,}75\ \text{ა}$
SEN: $R_3 = 8 - 3 = 5\ \Omega$; $\ I = 3\ \text{A}$
$U_{12} = 9\ \text{V}$: $I_1 = 2.25\ \text{A}$, $I_2 = 0.75\ \text{A}$
AKA: $5\ \text{ომი}$; $2{,}25$ და $0{,}75\ \text{ა}$
AEN: $5\ \Omega$; $2.25$ and $0.75\ \text{A}$

--- hard circuits
KA: ვოლტმეტრი ($R_V = 1\ \text{კომ}$) $1\ \text{კომ}$ რეზისტორზე მიაერთეს, რომელიც მეორე $1\ \text{კომ}$-თან მიმდევრობით $10\ \text{ვ}$-ზეა. რას აჩვენებს ვოლტმეტრი? რა იყო ნამდვილი ძაბვა მის გარეშე?
EN: A voltmeter ($R_V = 1\ \text{k}\Omega$) is put across one of two $1\ \text{k}\Omega$ resistors in series across $10\ \text{V}$. What does it read? What was the true voltage without it?
HKA: ვოლტმეტრი რეზისტორს პარალელურადაა — ის წრედს ცვლის.
HEN: The voltmeter is in parallel with the resistor — it changes the circuit.
SKA: გარეშე: $5\ \text{ვ}$.
ვოლტმეტრით: $R_{\parallel} = 500\ \text{ომი}$; $\ U = 10 \cdot \dfrac{500}{1500} \approx 3{,}3\ \text{ვ}$.
ვოლტმეტრის წინაღობა გაზომილზე ბევრად მეტი უნდა იყოს.
SEN: Without it: $5\ \text{V}$.
With it: $R_{\parallel} = 500\ \Omega$; $\ U = 10 \cdot \dfrac{500}{1500} \approx 3.3\ \text{V}$.
A voltmeter's resistance must be much greater than what it measures across.
AKA: $\approx 3{,}3\ \text{ვ}$; $5\ \text{ვ}$
AEN: $\approx 3.3\ \text{V}$; $5\ \text{V}$

--- hard circuits
KA: მავთულისგან ($R = 16\ \text{ომი}$) რგოლი გააკეთეს. რა წინაღობაა რგოლის ორ წერტილს შორის, რომლებიც მას $1 : 3$ ნაწილებად ყოფს?
EN: A wire of resistance $16\ \Omega$ is bent into a ring. What is the resistance between two points that divide the ring in the ratio $1 : 3$?
HKA: ორი რკალი პარალელურადაა: $4$ და $12\ \text{ომი}$.
HEN: The two arcs are in parallel: $4$ and $12\ \Omega$.
SKA: $R = \dfrac{4 \cdot 12}{16} = 3\ \text{ომი}$
SEN: $R = \dfrac{4 \cdot 12}{16} = 3\ \Omega$
AKA: $3\ \text{ომი}$
AEN: $3\ \Omega$

--- hard circuits
KA: სამი ერთნაირი ნათურა: ორი პარალელურად, მესამე მათთან მიმდევრობით, $U$-ზე. რომელი ანათებს ყველაზე კაშკაშად? რა მოხდება, თუ პარალელურებიდან ერთი დაიწვება?
EN: Three identical lamps: two in parallel, the third in series with them, across $U$. Which is brightest? What happens if one of the parallel ones burns out?
HKA: სიკაშკაშე სიმძლავრის პროპორციულია.
HEN: Brightness follows power.
SKA: $R_{\text{სრ}} = R + \dfrac{R}{2} = 1{,}5R$; $\ I = \dfrac{U}{1{,}5R}$. მესამე ნათურაში $I$, პარალელურებში $\dfrac{I}{2}$ — მესამე ყველაზე კაშკაშაა.
ერთი დაიწვა: $R_{\text{სრ}} = 2R$, დენი მცირდება — მესამე ჩამქრალდება, დარჩენილი პარალელური კი გაკაშკაშდება ($U/2$ ნაცვლად $U/3$-ისა).
SEN: $R_{\text{tot}} = R + \dfrac{R}{2} = 1.5R$; $\ I = \dfrac{U}{1.5R}$. The third lamp carries $I$, the parallel ones $\dfrac{I}{2}$ — the third is brightest.
If one burns out: $R_{\text{tot}} = 2R$, the current falls — the third dims, while the remaining parallel lamp brightens ($U/2$ instead of $U/3$).
AKA: მესამე; მესამე ჩამქრალდება, დარჩენილი გაკაშკაშდება
AEN: the third; the third dims, the remaining one brightens

--- hard circuits
KA: ამპერმეტრის ($r_A = 0{,}5\ \text{ომი}$) და ვოლტმეტრის ($R_V = 5\ \text{კომ}$) დახმარებით $R$ იზომება. ამპერმეტრი მიმდევრობითაა, ვოლტმეტრი — რეზისტორზე პარალელურად. ჩვენებები: $2\ \text{ა}$, $20\ \text{ვ}$. რას უდრის ნამდვილი $R$?
EN: An ammeter ($r_A = 0.5\ \Omega$) and voltmeter ($R_V = 5\ \text{k}\Omega$) measure $R$: the ammeter in series, the voltmeter across $R$. They read $2\ \text{A}$ and $20\ \text{V}$. What is the true $R$?
HKA: ამპერმეტრი ზომავს $R$-ისა და ვოლტმეტრის ჯამურ დენს.
HEN: The ammeter measures the current through $R$ and the voltmeter together.
SKA: ვოლტმეტრის დენი: $\dfrac{20}{5000} = 0{,}004\ \text{ა}$
$R = \dfrac{20}{2 - 0{,}004} \approx 10{,}02\ \text{ომი}$ (მიახლოებით $10\ \text{ომი}$)
SEN: The voltmeter current: $\dfrac{20}{5000} = 0.004\ \text{A}$
$R = \dfrac{20}{2 - 0.004} \approx 10.02\ \Omega$ (about $10\ \Omega$)
AKA: $\approx 10{,}02\ \text{ომი}$
AEN: $\approx 10.02\ \Omega$

--- hard circuits
KA: პოტენციომეტრი ($R = 100\ \text{ომი}$, $U = 10\ \text{ვ}$) — მცოცავი შუაშია. გამოსავალს მიაერთეს დატვირთვა $50\ \text{ომი}$. რა ძაბვა იქნება დატვირთვაზე?
EN: A potentiometer ($100\ \Omega$ across $10\ \text{V}$) has its slider at the middle. A $50\ \Omega$ load is connected to the output. What voltage is across the load?
HKA: ქვედა ნახევარი ($50\ \text{ომი}$) და დატვირთვა პარალელურადაა.
HEN: The lower half ($50\ \Omega$) and the load are in parallel.
SKA: $R_{\parallel} = 25\ \text{ომი}$; $\ U = 10 \cdot \dfrac{25}{50 + 25} \approx 3{,}3\ \text{ვ}$ (არა $5\ \text{ვ}$!)
SEN: $R_{\parallel} = 25\ \Omega$; $\ U = 10 \cdot \dfrac{25}{50 + 25} \approx 3.3\ \text{V}$ (not $5\ \text{V}$!)
AKA: $\approx 3{,}3\ \text{ვ}$
AEN: $\approx 3.3\ \text{V}$

--- hard circuits
KA: $n$ ერთნაირი რეზისტორი მიმდევრობით $R_s$-ს იძლევა, პარალელურად — $R_p$. იპოვეთ $\dfrac{R_s}{R_p}$. რამდენი რეზისტორია, თუ შეფარდება $25$-ია?
EN: $n$ identical resistors give $R_s$ in series and $R_p$ in parallel. Find $\dfrac{R_s}{R_p}$. How many resistors are there if the ratio is $25$?
HKA: $R_s = nR$, $R_p = \dfrac{R}{n}$.
HEN: $R_s = nR$, $R_p = \dfrac{R}{n}$.
SKA: $\dfrac{R_s}{R_p} = n^2 = 25 \Rightarrow n = 5$
SEN: $\dfrac{R_s}{R_p} = n^2 = 25 \Rightarrow n = 5$
AKA: $n^2$; $5$
AEN: $n^2$; $5$

--- hard circuits
KA: $R_1 = 3\ \text{ომი}$ და $R_2 = 6\ \text{ომი}$ პარალელურადაა, მათ მიმდევრობით $R_3 = 4\ \text{ომი}$ და $R_4$ — მას პარალელურად $R_5 = 12\ \text{ომი}$. ჯამური $R = 9\ \text{ომი}$. იპოვეთ $R_4$.
EN: $R_1 = 3\ \Omega \parallel R_2 = 6\ \Omega$, in series with $R_3 = 4\ \Omega$ and with $R_4 \parallel R_5$ ($R_5 = 12\ \Omega$). The total is $9\ \Omega$. Find $R_4$.
HKA: $R_{12} = 2$; $R_{45} = 9 - 2 - 4 = 3\ \text{ომი}$.
HEN: $R_{12} = 2$; $R_{45} = 9 - 2 - 4 = 3\ \Omega$.
SKA: $\dfrac{1}{R_4} = \dfrac{1}{3} - \dfrac{1}{12} = \dfrac{1}{4} \Rightarrow R_4 = 4\ \text{ომი}$
SEN: $\dfrac{1}{R_4} = \dfrac{1}{3} - \dfrac{1}{12} = \dfrac{1}{4} \Rightarrow R_4 = 4\ \Omega$
AKA: $4\ \text{ომი}$
AEN: $4\ \Omega$

--- hard circuits olympiad
KA: წესიერი ექვსკუთხედის ($ABCDEF$) ექვსი გვერდი $R$ წინაღობის მავთულებია. სამი დიდი დიაგონალიც $R$ წინაღობისაა და ცენტრში $O$ ერთმანეთთანაა შეერთებული (ე.ი. ცენტრი თითოეულს $\dfrac{R}{2}$-იან ნაწილებად ყოფს). იპოვეთ წინაღობა $A$ და $D$ წვეროებს შორის.
EN: The six sides of a regular hexagon $ABCDEF$ are wires of resistance $R$. The three long diagonals are also wires of resistance $R$, joined together at the centre $O$ (so $O$ splits each into two halves of $\dfrac{R}{2}$). Find the resistance between corners $A$ and $D$.
HKA: $A$-ს მიეცით პოტენციალი $1$, $D$-ს — $0$. სიმეტრიით $\varphi_B = \varphi_F = x$, $\varphi_C = \varphi_E = 1 - x$, $\varphi_O = \dfrac{1}{2}$.
HEN: Put $A$ at potential $1$ and $D$ at $0$. By symmetry $\varphi_B = \varphi_F = x$, $\varphi_C = \varphi_E = 1 - x$, $\varphi_O = \dfrac{1}{2}$.
SKA: $B$ კვანძისთვის (დენების ჯამი ნულია; $B$ უკავშირდება $A$-ს, $C$-ს — $R$-ით და $O$-ს — $\dfrac{R}{2}$-ით):
$(1 - x) + (1 - x - x) + 2\left(\dfrac{1}{2} - x\right) = 0 \Rightarrow 3 - 5x = 0 \Rightarrow x = 0{,}6$
$A$-დან გამავალი დენი: $\dfrac{1 - 0{,}6}{R} \cdot 2 + \dfrac{1 - 0{,}5}{R/2} = \dfrac{0{,}8 + 1}{R} = \dfrac{1{,}8}{R}$
$R_{AD} = \dfrac{1}{1{,}8/R} = \dfrac{5}{9} R$
SEN: At node $B$ (currents sum to zero; $B$ connects to $A$ and $C$ through $R$ and to $O$ through $\dfrac{R}{2}$):
$(1 - x) + (1 - x - x) + 2\left(\dfrac{1}{2} - x\right) = 0 \Rightarrow 3 - 5x = 0 \Rightarrow x = 0.6$
Current leaving $A$: $\dfrac{1 - 0.6}{R} \cdot 2 + \dfrac{1 - 0.5}{R/2} = \dfrac{0.8 + 1}{R} = \dfrac{1.8}{R}$
$R_{AD} = \dfrac{1}{1.8/R} = \dfrac{5}{9} R$
AKA: $\dfrac{5}{9}R$
AEN: $\dfrac{5}{9}R$

--- hard circuits olympiad
KA: რამდენი ერთნაირი $1\ \text{ომი}$ რეზისტორია საჭირო და როგორ შეაერთოთ, რომ მივიღოთ $0{,}6\ \text{ომი}$?
EN: What is the smallest number of identical $1\ \Omega$ resistors needed to make $0.6\ \Omega$, and how?
HKA: $0{,}6 = \dfrac{3}{5}$ — $\dfrac{1}{R} = \dfrac{5}{3} = 1 + \dfrac{2}{3}$.
HEN: $0.6 = \dfrac{3}{5}$ — $\dfrac{1}{R} = \dfrac{5}{3} = 1 + \dfrac{2}{3}$.
SKA: $1\ \text{ომი}$ პარალელურად $1{,}5\ \text{ომი}$-თან: $\dfrac{1 \cdot 1{,}5}{2{,}5} = 0{,}6$.
$1{,}5\ \text{ომი} = 1 + (1 \parallel 1)$ — სამი რეზისტორი. სულ $4$.
SEN: $1\ \Omega$ in parallel with $1.5\ \Omega$: $\dfrac{1 \cdot 1.5}{2.5} = 0.6$.
$1.5\ \Omega = 1 + (1 \parallel 1)$ — three resistors. Four in total.
AKA: $4$: $1 \parallel (1 + 1 \parallel 1)$
AEN: $4$: $1 \parallel (1 + 1 \parallel 1)$

--- hard circuits olympiad
KA: კვადრატის ($ABCD$) გვერდები და ერთი დიაგონალი ($AC$) $R$ წინაღობის მავთულებია. იპოვეთ წინაღობა $B$ და $D$-ს შორის; $A$ და $C$-ს შორის.
EN: The sides of square $ABCD$ and one diagonal $AC$ are wires of resistance $R$. Find the resistance between $B$ and $D$, and between $A$ and $C$.
HKA: $B$–$D$-სთვის $A$ და $C$ ტოლ პოტენციალზეა — $AC$-ში დენი არ გადის.
HEN: For $B$–$D$, $A$ and $C$ are at equal potential — no current flows in $AC$.
SKA: $B$–$D$: $AC$ უმოქმედოა; ორი პარალელური გზა ($2R$ თითო): $R_{BD} = R$.
$A$–$C$: სამი პარალელური გზა — $R$, $2R$, $2R$: $\dfrac{1}{R_{AC}} = \dfrac{1}{R} + \dfrac{1}{2R} + \dfrac{1}{2R} = \dfrac{2}{R} \Rightarrow R_{AC} = \dfrac{R}{2}$.
SEN: $B$–$D$: $AC$ carries nothing; two parallel paths ($2R$ each): $R_{BD} = R$.
$A$–$C$: three parallel paths — $R$, $2R$, $2R$: $\dfrac{1}{R_{AC}} = \dfrac{1}{R} + \dfrac{1}{2R} + \dfrac{1}{2R} = \dfrac{2}{R} \Rightarrow R_{AC} = \dfrac{R}{2}$.
AKA: $R_{BD} = R$; $R_{AC} = \dfrac{R}{2}$
AEN: $R_{BD} = R$; $R_{AC} = \dfrac{R}{2}$

--- hard circuits olympiad
KA: უსასრულო ბადე: ყოველი კვანძი ოთხ მეზობელს $R$ რეზისტორით უკავშირდება (კვადრატული ბადე). იპოვეთ წინაღობა ორ მეზობელ კვანძს შორის.
EN: An infinite square grid of resistors $R$ (each node joined to its four neighbours). Find the resistance between two adjacent nodes.
HKA: სუპერპოზიცია: შეიყვანეთ $I$ ერთ კვანძში (უსასრულობაში გადის), შემდეგ გამოიყვანეთ $I$ მეზობლიდან.
HEN: Superposition: inject $I$ at one node (out to infinity), then extract $I$ at the neighbour.
SKA: $I$-ის შეყვანისას სიმეტრიით მეზობელ რეზისტორში $\dfrac{I}{4}$ გადის. $I$-ის გამოყვანისასაც $\dfrac{I}{4}$ იმავე მიმართულებით.
ჯამი: $\dfrac{I}{2}$ $\Rightarrow$ $U = \dfrac{I R}{2}$, $\ R_{\text{ეკვ}} = \dfrac{R}{2}$.
SEN: Injecting $I$, by symmetry $\dfrac{I}{4}$ flows in the resistor to the neighbour. Extracting $I$ at the neighbour adds another $\dfrac{I}{4}$ in the same direction.
Total: $\dfrac{I}{2}$ $\Rightarrow$ $U = \dfrac{I R}{2}$, $\ R_{\text{eq}} = \dfrac{R}{2}$.
AKA: $\dfrac{R}{2}$
AEN: $\dfrac{R}{2}$

--- hard circuits olympiad
KA: ვოლტმეტრები $V_1$ ($R_1$) და $V_2$ ($R_2$) მიმდევრობითაა $U = 12\ \text{ვ}$-ზე და აჩვენებენ $8\ \text{ვ}$-ს და $4\ \text{ვ}$-ს. როცა $V_1$-ს პარალელურად $R = 6\ \text{კომ}$ მიუერთეს, ჩვენებები გათანაბრდა. იპოვეთ $R_1$ და $R_2$.
EN: Voltmeters $V_1$ ($R_1$) and $V_2$ ($R_2$) in series across $12\ \text{V}$ read $8\ \text{V}$ and $4\ \text{V}$. When $R = 6\ \text{k}\Omega$ is connected in parallel with $V_1$, both read the same. Find $R_1$ and $R_2$.
HKA: $R_1 = 2R_2$; შემდეგ $R_1 \parallel R = R_2$.
HEN: $R_1 = 2R_2$; then $R_1 \parallel R = R_2$.
SKA: $\dfrac{2R_2 \cdot 6}{2R_2 + 6} = R_2 \Rightarrow 12 = 2R_2 + 6 \Rightarrow R_2 = 3\ \text{კომ}$, $R_1 = 6\ \text{კომ}$
SEN: $\dfrac{2R_2 \cdot 6}{2R_2 + 6} = R_2 \Rightarrow 12 = 2R_2 + 6 \Rightarrow R_2 = 3\ \text{k}\Omega$, $R_1 = 6\ \text{k}\Omega$
AKA: $R_1 = 6\ \text{კომ}$, $R_2 = 3\ \text{კომ}$
AEN: $R_1 = 6\ \text{k}\Omega$, $R_2 = 3\ \text{k}\Omega$

--- hard circuits olympiad
KA: მავთულის კარკასი — კუბი, ყოველი წიბო $R$. იპოვეთ წინაღობა ერთი წახნაგის დიაგონალის ბოლოებს შორის.
EN: A wire cube has each edge of resistance $R$. Find the resistance between the ends of a face diagonal.
HKA: სიმეტრიით ერთ პოტენციალზე მყოფი კვანძები გააერთიანეთ.
HEN: Merge nodes that are at the same potential by symmetry.
SKA: ქვედა წახნაგი $ABCD$ ($A$–$C$ დიაგონალი), ზედა $A'B'C'D'$. $\varphi_A = 1$, $\varphi_C = 0$; სიმეტრიით $\varphi_B = \varphi_D = \varphi_{B'} = \varphi_{D'} = \dfrac{1}{2}$, $\varphi_{A'} = x$, $\varphi_{C'} = 1 - x$.
$A'$ კვანძი ($A$, $B'$, $D'$ მეზობლები): $(1 - x) + 2\left(\dfrac{1}{2} - x\right) = 0 \Rightarrow x = \dfrac{2}{3}$
$A$-დან დენი: $\dfrac{1}{R}\left(\dfrac{1}{2} + \dfrac{1}{2} + \dfrac{1}{3}\right) = \dfrac{4}{3R} \Rightarrow R_{AC} = \dfrac{3}{4} R$
SEN: Bottom face $ABCD$ ($A$–$C$ diagonal), top face $A'B'C'D'$. Set $\varphi_A = 1$, $\varphi_C = 0$; by symmetry $\varphi_B = \varphi_D = \varphi_{B'} = \varphi_{D'} = \dfrac{1}{2}$, $\varphi_{A'} = x$, $\varphi_{C'} = 1 - x$.
Node $A'$ (neighbours $A$, $B'$, $D'$): $(1 - x) + 2\left(\dfrac{1}{2} - x\right) = 0 \Rightarrow x = \dfrac{2}{3}$
Current out of $A$: $\dfrac{1}{R}\left(\dfrac{1}{2} + \dfrac{1}{2} + \dfrac{1}{3}\right) = \dfrac{4}{3R} \Rightarrow R_{AC} = \dfrac{3}{4} R$
AKA: $\dfrac{3}{4}R$
AEN: $\dfrac{3}{4}R$

--- easy emf
KA: ბატარეის ემძ $6\ \text{ვ}$-ია, შიგა წინაღობა $0{,}5\ \text{ომი}$, გარე — $2{,}5\ \text{ომი}$. იპოვეთ დენი.
EN: A battery has EMF $6\ \text{V}$ and internal resistance $0.5\ \Omega$; the external resistance is $2.5\ \Omega$. Find the current.
HKA: $I = \dfrac{\mathcal{E}}{R + r}$.
HEN: $I = \dfrac{\mathcal{E}}{R + r}$.
SKA: $I = \dfrac{6}{3} = 2\ \text{ა}$
SEN: $I = \dfrac{6}{3} = 2\ \text{A}$
AKA: $2\ \text{ა}$
AEN: $2\ \text{A}$

--- easy emf
KA: წინა ამოცანის წრედისთვის იპოვეთ ძაბვა ბატარეის მომჭერებზე.
EN: For a battery with $\mathcal{E} = 6\ \text{V}$, $r = 0.5\ \Omega$ supplying $2\ \text{A}$, find the terminal voltage.
HKA: $U = \mathcal{E} - I r$.
HEN: $U = \mathcal{E} - I r$.
SKA: $U = 6 - 2 \cdot 0{,}5 = 5\ \text{ვ}$
SEN: $U = 6 - 2 \cdot 0.5 = 5\ \text{V}$
AKA: $5\ \text{ვ}$
AEN: $5\ \text{V}$

--- easy emf
KA: რა არის ემძ? რატომ არის ძაბვა მომჭერებზე დენის დროს ემძ-ზე ნაკლები?
EN: What is EMF? Why is the terminal voltage less than the EMF when current flows?
HKA: გარეშე ძალების მუშაობა.
HEN: The work of the non-electric forces.
SKA: ემძ — გარეშე (არაელექტრული) ძალების მუშაობა ერთეულოვანი მუხტის წყაროში გადატანისას: $\mathcal{E} = \dfrac{A}{q}$.
დენისას ძაბვის ნაწილი ($I r$) თავად წყაროს შიგა წინაღობაზე „ვარდება“.
SEN: EMF is the work done by non-electric forces per unit charge moved through the source: $\mathcal{E} = \dfrac{W}{q}$.
With current flowing, part of it ($I r$) is dropped across the source's own internal resistance.
AKA: $U = \mathcal{E} - Ir$ — შიგა წინაღობის გამო
AEN: $U = \mathcal{E} - Ir$ — because of the internal resistance

--- easy emf
KA: ბატარეის ($\mathcal{E} = 9\ \text{ვ}$, $r = 1\ \text{ომი}$) მოკლე ჩართვის დენი რას უდრის?
EN: What is the short-circuit current of a battery with $\mathcal{E} = 9\ \text{V}$, $r = 1\ \Omega$?
HKA: $R = 0$.
HEN: $R = 0$.
SKA: $I = \dfrac{9}{1} = 9\ \text{ა}$
SEN: $I = \dfrac{9}{1} = 9\ \text{A}$
AKA: $9\ \text{ა}$
AEN: $9\ \text{A}$

--- medium emf
KA: $R_1 = 4\ \text{ომი}$-ზე დენი $1\ \text{ა}$-ია, $R_2 = 9\ \text{ომი}$-ზე — $0{,}5\ \text{ა}$. იპოვეთ $\mathcal{E}$ და $r$.
EN: With $R_1 = 4\ \Omega$ the current is $1\ \text{A}$; with $R_2 = 9\ \Omega$ it is $0.5\ \text{A}$. Find $\mathcal{E}$ and $r$.
HKA: $\mathcal{E} = I_1(R_1 + r) = I_2(R_2 + r)$.
HEN: $\mathcal{E} = I_1(R_1 + r) = I_2(R_2 + r)$.
SKA: $4 + r = 0{,}5(9 + r) \Rightarrow 0{,}5 r = 0{,}5 \Rightarrow r = 1\ \text{ომი}$
$\mathcal{E} = 5\ \text{ვ}$

--- medium emf
KA: ვოლტმეტრი ბატარეაზე დატვირთვის გარეშე $12\ \text{ვ}$-ს აჩვენებს, $5\ \text{ომი}$ დატვირთვით — $10\ \text{ვ}$-ს. იპოვეთ შიგა წინაღობა.

EN: $\mathcal{E} = 24\ \text{V}$, $r = 2\ \Omega$. What external resistance gives a current of $3\ \text{A}$? What is the terminal voltage?

KA: ბატარეის მომჭერებზე ძაბვა დენის მიხედვით ასე იცვლება: $I = 1\ \text{ა}$ — $U = 11\ \text{ვ}$; $I = 3\ \text{ა}$ — $U = 9\ \text{ვ}$. იპოვეთ $\mathcal{E}$, $r$ და მოკლე ჩართვის დენი.
EN: A battery's terminal voltage is $11\ \text{V}$ at $1\ \text{A}$ and $9\ \text{V}$ at $3\ \text{A}$. Find $\mathcal{E}$, $r$ and the short-circuit current.

KA: ბატარეა ($\mathcal{E} = 4{,}5\ \text{ვ}$, $r = 1{,}5\ \text{ომი}$) ორ პარალელურ $6\ \text{ომი}$ ნათურას კვებავს. იპოვეთ თითოეულის დენი.
EN: A battery ($\mathcal{E} = 4.5\ \text{V}$, $r = 1.5\ \Omega$) powers two $6\ \Omega$ lamps in parallel. Find the current in each.

--- hard emf
KA: ორი ბატარეა ($\mathcal{E}_1 = 12\ \text{ვ}$, $r_1 = 1\ \text{ომი}$ და $\mathcal{E}_2 = 6\ \text{ვ}$, $r_2 = 2\ \text{ომი}$) მიმდევრობითაა ერთმანეთის საწინააღმდეგოდ და $3\ \text{ომი}$ რეზისტორზე. იპოვეთ დენი.
EN: Two batteries ($\mathcal{E}_1 = 12\ \text{V}$, $r_1 = 1\ \Omega$ and $\mathcal{E}_2 = 6\ \text{V}$, $r_2 = 2\ \Omega$) are in series but opposing each other, with a $3\ \Omega$ resistor. Find the current.

--- hard emf
KA: აკუმულატორს ($\mathcal{E} = 12\ \text{ვ}$, $r = 0{,}1\ \text{ომი}$) $14\ \text{ვ}$ დამტენით ტენიან; წრედში $1{,}9\ \text{ომი}$ რეზისტორია. იპოვეთ დამუხტვის დენი.
EN: A battery ($\mathcal{E} = 12\ \text{V}$, $r = 0.1\ \Omega$) is charged from a $14\ \text{V}$ charger through a $1.9\ \Omega$ resistor. Find the charging current.

SEN: $I = \dfrac{14 - 12}{1.9 + 0.1} = 1\ \text{A}$

--- hard emf
KA: $n$ ერთნაირი ელემენტიდან ($\mathcal{E}$, $r$) ბატარეა უნდა შეიკრას $R$ დატვირთვისთვის. აჩვენეთ, რომ მიმდევრობითი შეერთება უკეთესია, თუ $R > r$, პარალელური — თუ $R < r$.
EN: A battery is built from $n$ identical cells ($\mathcal{E}$, $r$) for a load $R$. Show that series is better if $R > r$ and parallel if $R < r$.
HKA: შეადარეთ $I_s = \dfrac{n\mathcal{E}}{R + nr}$ და $I_p = \dfrac{\mathcal{E}}{R + r/n}$.
HEN: Compare $I_s = \dfrac{n\mathcal{E}}{R + nr}$ and $I_p = \dfrac{\mathcal{E}}{R + r/n}$.
SKA: $I_s = \dfrac{n\mathcal{E}}{R + nr}$, $\ I_p = \dfrac{n\mathcal{E}}{nR + r}$.
$I_s > I_p \Leftrightarrow R + nr < nR + r \Leftrightarrow (n - 1)r < (n - 1)R \Leftrightarrow R > r$.
SEN: $I_s = \dfrac{n\mathcal{E}}{R + nr}$, $\ I_p = \dfrac{n\mathcal{E}}{nR + r}$.
$I_s > I_p \Leftrightarrow R + nr < nR + r \Leftrightarrow (n - 1)r < (n - 1)R \Leftrightarrow R > r$.
AKA: მიმდევრობით, როცა $R > r$
AEN: series when $R > r$

--- hard emf
KA: ბატარეა $R_1 = 2\ \text{ომი}$-ზე და $R_2 = 8\ \text{ომი}$-ზე ერთნაირ სიმძლავრეს გასცემს. იპოვეთ შიგა წინაღობა.
EN: A battery delivers the same power to $R_1 = 2\ \Omega$ and to $R_2 = 8\ \Omega$. Find its internal resistance.
HKA: $\dfrac{R_1}{(R_1 + r)^2} = \dfrac{R_2}{(R_2 + r)^2} \Rightarrow r = \sqrt{R_1 R_2}$.
HEN: $\dfrac{R_1}{(R_1 + r)^2} = \dfrac{R_2}{(R_2 + r)^2} \Rightarrow r = \sqrt{R_1 R_2}$.
SKA: $r = \sqrt{16} = 4\ \text{ომი}$
SEN: $r = \sqrt{16} = 4\ \Omega$
AKA: $4\ \text{ომი}$
AEN: $4\ \Omega$

--- hard emf
KA: ბატარეა ($\mathcal{E} = 10\ \text{ვ}$, $r = 1\ \text{ომი}$) $R_1 = 4\ \text{ომი}$-ს და $R_2$ რეოსტატს კვებავს პარალელურად. რა $R_2$-ისას იქნება $R_1$-ზე ძაბვა $8\ \text{ვ}$?
EN: A battery ($\mathcal{E} = 10\ \text{V}$, $r = 1\ \Omega$) feeds $R_1 = 4\ \Omega$ and a rheostat $R_2$ in parallel. For what $R_2$ is the voltage across $R_1$ equal to $8\ \text{V}$?

HEN: $U = 8\ \text{V} \Rightarrow I = \dfrac{10 - 8}{1} = 2\ \text{A}$.
SKA: $R_1$-ში $2\ \text{ა}$ — მთელი დენი! $R_2$-ში $0$, ე.ი. $R_2 = \infty$ (გათიშული).
SEN: $R_1$ alone takes $2\ \text{A}$ — the whole current! So $R_2$ carries nothing: $R_2 = \infty$ (disconnected).
AKA: $R_2 = \infty$
AEN: $R_2 = \infty$

--- hard emf
KA: ორი ელემენტი ($\mathcal{E}_1 = 2\ \text{ვ}$, $r_1 = 1\ \text{ომი}$; $\mathcal{E}_2 = 1\ \text{ვ}$, $r_2 = 1\ \text{ომი}$) პარალელურადაა (ერთნაირი პოლუსებით). იპოვეთ ძაბვა მომჭერებზე დატვირთვის გარეშე.
EN: Two cells ($\mathcal{E}_1 = 2\ \text{V}$, $r_1 = 1\ \Omega$; $\mathcal{E}_2 = 1\ \text{V}$, $r_2 = 1\ \Omega$) are connected in parallel (like poles together). Find the terminal voltage with no load.
HKA: შიგ წრიული დენი $I = \dfrac{\mathcal{E}_1 - \mathcal{E}_2}{r_1 + r_2}$.
HEN: An internal loop current $I = \dfrac{\mathcal{E}_1 - \mathcal{E}_2}{r_1 + r_2}$ flows.
SKA: $I = \dfrac{1}{2} = 0{,}5\ \text{ა}$
$U = \mathcal{E}_1 - I r_1 = 2 - 0{,}5 = 1{,}5\ \text{ვ}$
SEN: $I = \dfrac{1}{2} = 0.5\ \text{A}$
$U = \mathcal{E}_1 - I r_1 = 2 - 0.5 = 1.5\ \text{V}$
AKA: $1{,}5\ \text{ვ}$
AEN: $1.5\ \text{V}$

--- hard emf
KA: ვოლტმეტრი ($R_V = 100\ \text{ომი}$) ბატარეაზე $4\ \text{ვ}$-ს აჩვენებს, ორი ასეთი პარალელურად — $3{,}2\ \text{ვ}$-ს. იპოვეთ $\mathcal{E}$ და $r$.
EN: A voltmeter ($R_V = 100\ \Omega$) across a battery reads $4\ \text{V}$; two such voltmeters in parallel read $3.2\ \text{V}$. Find $\mathcal{E}$ and $r$.

HEN: $\mathcal{E} = U_1 + \dfrac{U_1}{R_V} r = U_2 + \dfrac{U_2}{R_V/2} r$.
SKA: $4 + 0{,}04 r = 3{,}2 + 0{,}064 r \Rightarrow 0{,}024 r = 0{,}8 \Rightarrow r \approx 33{,}3\ \text{ომი}$
$\mathcal{E} = 4 + 1{,}33 \approx 5{,}33\ \text{ვ}$
SEN: $4 + 0.04 r = 3.2 + 0.064 r \Rightarrow 0.024 r = 0.8 \Rightarrow r \approx 33.3\ \Omega$
$\mathcal{E} = 4 + 1.33 \approx 5.33\ \text{V}$
AKA: $\approx 5{,}3\ \text{ვ}$; $\approx 33\ \text{ომი}$
AEN: $\approx 5.3\ \text{V}$; $\approx 33\ \Omega$

KA: $\mathcal{E}$ და $r$ წყაროს მიუერთეს $R$ რეოსტატი. როგორ იცვლება ძაბვა მომჭერებზე $R$-ის $0$-დან $\infty$-მდე ზრდისას? დახაზეთ სიტყვიერად.
EN: A rheostat $R$ is connected to a source ($\mathcal{E}$, $r$). How does the terminal voltage change as $R$ goes from $0$ to $\infty$? Describe the graph.
HKA: $U = \dfrac{\mathcal{E} R}{R + r}$.
HEN: $U = \dfrac{\mathcal{E} R}{R + r}$.
SKA: $R = 0$: $U = 0$ (მოკლე ჩართვა).
$R = r$: $U = \dfrac{\mathcal{E}}{2}$.
$R \to \infty$: $U \to \mathcal{E}$.
გრაფიკი $0$-დან იზრდება და ასიმპტოტურად უახლოვდება $\mathcal{E}$-ს.
SEN: $R = 0$: $U = 0$ (short circuit).
$R = r$: $U = \dfrac{\mathcal{E}}{2}$.
$R \to \infty$: $U \to \mathcal{E}$.
The graph rises from $0$ and approaches $\mathcal{E}$ asymptotically.
AKA: $0$-დან $\mathcal{E}$-მდე
AEN: from $0$ up to $\mathcal{E}$

--- hard emf olympiad
KA: $n$ ერთნაირი ელემენტი ($\mathcal{E}$, $r$) ჩაკეტილ რგოლადაა შეერთებული (ერთის „+“ მეორის „−“-თან). რას აჩვენებს იდეალური ვოლტმეტრი ნებისმიერ ორ კვანძს შორის?
EN: $n$ identical cells ($\mathcal{E}$, $r$) are joined in a closed ring ("+" of each to "−" of the next). What does an ideal voltmeter read between any two nodes?
HKA: რგოლში დენი $I = \dfrac{n\mathcal{E}}{nr} = \dfrac{\mathcal{E}}{r}$.
HEN: The ring current is $I = \dfrac{n\mathcal{E}}{nr} = \dfrac{\mathcal{E}}{r}$.
SKA: თითოეულ ელემენტზე ძაბვა: $U = \mathcal{E} - I r = \mathcal{E} - \mathcal{E} = 0$.
ნებისმიერ კვანძებს შორის ძაბვა $0$-ია.
SEN: Across each cell: $U = \mathcal{E} - I r = \mathcal{E} - \mathcal{E} = 0$.
Between any nodes the voltage is $0$.
AKA: $0$
AEN: $0$

--- hard emf olympiad
KA: ამოუცნობი „შავი ყუთი“ ორი მომჭერით: $R_1 = 10\ \text{ომი}$-ზე დენი $1\ \text{ა}$-ია, $R_2 = 20\ \text{ომი}$-ზე — $0{,}6\ \text{ა}$. რა დენი იქნება $R_3 = 40\ \text{ომი}$-ზე? (ყუთი წრფივი წყაროა)
EN: An unknown "black box" with two terminals gives $1\ \text{A}$ through $R_1 = 10\ \Omega$ and $0.6\ \text{A}$ through $R_2 = 20\ \Omega$. What current flows through $R_3 = 40\ \Omega$? (The box is a linear source.)
HKA: ნებისმიერი წრფივი ყუთი ეკვივალენტურია $\mathcal{E}$, $r$ წყაროსი (თევენინის თეორემა).
HEN: Any linear box is equivalent to a source $\mathcal{E}$, $r$ (Thévenin's theorem).
SKA: $10 + r = 0{,}6(20 + r) \Rightarrow 0{,}4 r = 2 \Rightarrow r = 5\ \text{ომი}$, $\ \mathcal{E} = 15\ \text{ვ}$
$I_3 = \dfrac{15}{45} \approx 0{,}33\ \text{ა}$
SEN: $10 + r = 0.6(20 + r) \Rightarrow 0.4 r = 2 \Rightarrow r = 5\ \Omega$, $\ \mathcal{E} = 15\ \text{V}$
$I_3 = \dfrac{15}{45} \approx 0.33\ \text{A}$
AKA: $\approx 0{,}33\ \text{ა}$
AEN: $\approx 0.33\ \text{A}$

KA: $220\ \text{ვ}$-ზე ჩართული $484\ \text{ომი}$ ნათურის სიმძლავრე რას უდრის?
EN: What is the power of a $484\ \Omega$ lamp on $220\ \text{V}$?
HKA: $P = \dfrac{U^2}{R}$.
HEN: $P = \dfrac{U^2}{R}$.
SKA: $P = \dfrac{48\,400}{484} = 100\ \text{ვტ}$
SEN: $P = \dfrac{48\,400}{484} = 100\ \text{W}$
AKA: $100\ \text{ვტ}$
AEN: $100\ \text{W}$

--- easy power
KA: რატომ თბება ელექტროქურის სპირალი, მასთან მიერთებული სადენები კი თითქმის არა?
EN: Why does a stove's heating coil get hot while the wires leading to it hardly do?
HKA: ერთი დენი, სხვადასხვა წინაღობა.
HEN: The same current, different resistances.
SKA: სპირალი და სადენები მიმდევრობითაა — დენი ერთია. $Q = I^2 R t$: სპირალის წინაღობა ბევრად მეტია, ამიტომ თითქმის მთელი სითბო იქ გამოიყოფა.
SEN: The coil and the leads are in series — the same current. $Q = I^2 R t$: the coil's resistance is far larger, so nearly all the heat is released there.
AKA: სპირალის წინაღობა ბევრად მეტია
AEN: the coil's resistance is much larger

--- easy power
KA: ელექტროენერგიის ფასი $0{,}3$ ლარია $1\ \text{კვტ·სთ}$-ზე. რა ღირს $60\ \text{ვტ}$ ნათურის $5$ საათიანი ნათება ყოველდღე $30$ დღე?
EN: Electricity costs $0.3$ GEL per kWh. What does it cost to run a $60\ \text{W}$ lamp $5$ hours a day for $30$ days?
HKA: ჯერ კვტ·სთ.
HEN: kWh first.
SKA: $A = 0{,}06 \cdot 5 \cdot 30 = 9\ \text{კვტ·სთ}$; ღირებულება $9 \cdot 0{,}3 = 2{,}7$ ლარი
SEN: $W = 0.06 \cdot 5 \cdot 30 = 9\ \text{kWh}$; cost $9 \cdot 0.3 = 2.7$ GEL
AKA: $2{,}7$ ლარი
AEN: $2.7$ GEL

--- easy power
KA: გამაცხელებელი $220\ \text{ვ}$-ზე $5\ \text{ა}$-ს მოიხმარს. რამდენი ენერგია დაიხარჯება $2$ საათში (კვტ·სთ-ში)?
EN: A heater draws $5\ \text{A}$ at $220\ \text{V}$. How much energy (in kWh) does it use in $2$ hours?
HKA: $P = UI$, $A = P t$.
HEN: $P = UI$, $W = P t$.
SKA: $P = 1100\ \text{ვტ}$, $\ A = 1{,}1 \cdot 2 = 2{,}2\ \text{კვტ·სთ}$
SEN: $P = 1100\ \text{W}$, $\ W = 1.1 \cdot 2 = 2.2\ \text{kWh}$
AKA: $2{,}2\ \text{კვტ·სთ}$
AEN: $2.2\ \text{kWh}$

--- easy power
KA: რა არის მცველის (დამცველის) დანიშნულება? რატომ არის ის ადვილად დნობადი მავთულისგან?
EN: What is a fuse for? Why is it made of wire that melts easily?
HKA: დიდი დენი — დიდი სითბო.
HEN: Large current — lots of heat.
SKA: მცველი წრედს მიმდევრობითაა. დიდი დენისას (მოკლე ჩართვა, გადატვირთვა) $I^2 R$ სითბოთი მისი მავთული დნება და წრედს წყვეტს — იცავს გაყვანილობას ხანძრისგან.
SEN: A fuse is in series with the circuit. At a large current (short circuit, overload) its wire melts from the $I^2 R$ heat and breaks the circuit — protecting the wiring from fire.
AKA: დიდი დენისას დნება და წრედს წყვეტს
AEN: it melts at a large current and breaks the circuit

--- medium power
KA: ორი რეზისტორი ($4$ და $6\ \text{ომი}$) მიმდევრობით $20\ \text{ვ}$-ზეა. რომელში გამოიყოფა მეტი სითბო და რამდენჯერ? პარალელურად?
EN: $4$ and $6\ \Omega$ resistors are in series across $20\ \text{V}$. Which releases more heat and by what factor? And in parallel?
HKA: მიმდევრობით $P \sim R$, პარალელურად $P \sim \dfrac{1}{R}$.
HEN: In series $P \sim R$; in parallel $P \sim \dfrac{1}{R}$.
SKA: მიმდევრობით: $6\ \text{ომი}$-ში $1{,}5$-ჯერ მეტი ($P = 16$ და $24\ \text{ვტ}$).
პარალელურად: $4\ \text{ომი}$-ში $1{,}5$-ჯერ მეტი ($100$ და $66{,}7\ \text{ვტ}$).
SEN: Series: the $6\ \Omega$ gives $1.5$ times more ($P = 16$ and $24\ \text{W}$).
Parallel: the $4\ \Omega$ gives $1.5$ times more ($100$ and $66.7\ \text{W}$).
AKA: მიმდ.: $6\ \text{ომი}$; პარ.: $4\ \text{ომი}$; $1{,}5$-ჯერ
AEN: series: $6\ \Omega$; parallel: $4\ \Omega$; $1.5$ times

--- medium power
KA: ჩაიდანი ($1{,}5\ \text{კვტ}$, სმკ $80\%$) $1{,}5\ \text{ლ}$ წყალს $20\ \text{°C}$-დან დუღილამდე რამდენ ხანში ათბობს? ($c = 4200$)
EN: A kettle ($1.5\ \text{kW}$, $80\%$ efficient) heats $1.5\ \text{L}$ of water from $20\ \text{°C}$ to the boil in how long? ($c = 4200$)
HKA: $\eta P t = c m \Delta t$.
HEN: $\eta P t = c m \Delta t$.
SKA: $Q = 4200 \cdot 1{,}5 \cdot 80 = 504\ \text{კჯ}$
$t = \dfrac{504\,000}{0{,}8 \cdot 1500} = 420\ \text{წმ} = 7\ \text{წთ}$
SEN: $Q = 4200 \cdot 1.5 \cdot 80 = 504\ \text{kJ}$
$t = \dfrac{504\,000}{0.8 \cdot 1500} = 420\ \text{s} = 7\ \text{min}$
AKA: $7\ \text{წთ}$
AEN: $7\ \text{min}$

--- medium power
KA: „$220\ \text{ვ}$, $100\ \text{ვტ}$“ ნათურა $110\ \text{ვ}$-ზე ჩართეს. რა სიმძლავრე ექნება (წინაღობა მუდმივად ჩათვალეთ)?
EN: A "$220\ \text{V}$, $100\ \text{W}$" lamp is run on $110\ \text{V}$. What is its power (take the resistance as constant)?
HKA: $P \sim U^2$.
HEN: $P \sim U^2$.
SKA: $P' = 100 \cdot \left(\dfrac{1}{2}\right)^2 = 25\ \text{ვტ}$
SEN: $P' = 100 \cdot \left(\dfrac{1}{2}\right)^2 = 25\ \text{W}$
AKA: $25\ \text{ვტ}$
AEN: $25\ \text{W}$

--- medium power
KA: ელექტროძრავა $220\ \text{ვ}$-ზე $5\ \text{ა}$-ს მოიხმარს, მისი გრაგნილის წინაღობაა $4\ \text{ომი}$. იპოვეთ სასარგებლო მექანიკური სიმძლავრე და სმკ.
EN: An electric motor draws $5\ \text{A}$ at $220\ \text{V}$; its winding resistance is $4\ \Omega$. Find its useful mechanical power and efficiency.
HKA: სითბური დანაკარგი $I^2 R$.
HEN: Heat loss $I^2 R$.
SKA: $P = 1100\ \text{ვტ}$, $\ P_{\text{ს}} = 25 \cdot 4 = 100\ \text{ვტ}$
$P_{\text{მ}} = 1000\ \text{ვტ}$, $\ \eta \approx 91\%$
SEN: $P = 1100\ \text{W}$, $\ P_{\text{heat}} = 25 \cdot 4 = 100\ \text{W}$
$P_{\text{mech}} = 1000\ \text{W}$, $\ \eta \approx 91\%$
AKA: $1\ \text{კვტ}$; $\approx 91\%$
AEN: $1\ \text{kW}$; $\approx 91\%$

--- medium power
KA: „$220\ \text{ვ}$, $40\ \text{ვტ}$“ და „$220\ \text{ვ}$, $60\ \text{ვტ}$“ ნათურები პარალელურად ჩართეს. რომელი ანათებს უფრო კაშკაშად? მიმდევრობით?
EN: "$220\ \text{V}$, $40\ \text{W}$" and "$220\ \text{V}$, $60\ \text{W}$" lamps are connected in parallel. Which is brighter? And in series?
HKA: $R = \dfrac{U^2}{P}$: $40\ \text{ვტ}$-იანს მეტი წინაღობა აქვს.
HEN: $R = \dfrac{U^2}{P}$: the $40\ \text{W}$ lamp has the higher resistance.
SKA: პარალელურად — $60\ \text{ვტ}$-იანი (ნომინალური სიმძლავრეები).
მიმდევრობით — დენი ერთია, $P = I^2 R$: კაშკაშაა $40\ \text{ვტ}$-იანი.
SEN: In parallel — the $60\ \text{W}$ one (they run at their rated powers).
In series — same current, $P = I^2 R$: the $40\ \text{W}$ lamp is brighter.
AKA: პარ.: $60\ \text{ვტ}$; მიმდ.: $40\ \text{ვტ}$
AEN: parallel: $60\ \text{W}$; series: $40\ \text{W}$

--- medium power
KA: ბატარეიდან ($\mathcal{E} = 12\ \text{ვ}$, $r = 2\ \text{ომი}$) რა მაქსიმალური სიმძლავრის მიღება შეიძლება გარე რეზისტორზე?
EN: What is the maximum power a battery ($\mathcal{E} = 12\ \text{V}$, $r = 2\ \Omega$) can deliver to an external resistor?
HKA: მაქსიმუმი $R = r$-ისას.
HEN: The maximum is at $R = r$.
SKA: $P_{\max} = \dfrac{\mathcal{E}^2}{4r} = \dfrac{144}{8} = 18\ \text{ვტ}$
SEN: $P_{\max} = \dfrac{\mathcal{E}^2}{4r} = \dfrac{144}{8} = 18\ \text{W}$
AKA: $18\ \text{ვტ}$ ($R = 2\ \text{ომი}$)
AEN: $18\ \text{W}$ (at $R = 2\ \Omega$)

--- medium power
KA: გამაცხელებლის სპირალი შეამოკლეს $20\%$-ით. როგორ შეიცვლება სიმძლავრე იმავე ძაბვაზე?
EN: A heater's coil is shortened by $20\%$. How does its power change at the same voltage?
HKA: $R \sim l$, $P \sim \dfrac{1}{R}$.
HEN: $R \sim l$, $P \sim \dfrac{1}{R}$.
SKA: $P' = \dfrac{P}{0{,}8} = 1{,}25 P$ — $25\%$-ით გაიზრდება.
SEN: $P' = \dfrac{P}{0.8} = 1.25 P$ — it rises by $25\%$.
AKA: $25\%$-ით გაიზრდება
AEN: it increases by $25\%$

--- medium power
KA: $10\ \text{ომი}$ და $R$ რეზისტორები პარალელურადაა; $10\ \text{ომი}$-ში $40\ \text{ვტ}$ გამოიყოფა, $R$-ში $10\ \text{ვტ}$. იპოვეთ $R$ და ძაბვა.
EN: $10\ \Omega$ and $R$ are in parallel; the $10\ \Omega$ dissipates $40\ \text{W}$ and $R$ dissipates $10\ \text{W}$. Find $R$ and the voltage.
HKA: პარალელურად $P \sim \dfrac{1}{R}$.
HEN: In parallel $P \sim \dfrac{1}{R}$.
SKA: $R = 10 \cdot 4 = 40\ \text{ომი}$
$U = \sqrt{40 \cdot 10} = 20\ \text{ვ}$
SEN: $R = 10 \cdot 4 = 40\ \Omega$
$U = \sqrt{40 \cdot 10} = 20\ \text{V}$
AKA: $40\ \text{ომი}$; $20\ \text{ვ}$
AEN: $40\ \Omega$; $20\ \text{V}$

--- medium power
KA: $500\ \text{კვტ}$ სიმძლავრე $10\ \text{კვ}$ ძაბვით $4\ \text{ომი}$ წინაღობის ხაზით გადაიცემა. იპოვეთ დანაკარგები. რა იქნებოდა $100\ \text{კვ}$-ზე?
EN: $500\ \text{kW}$ is sent at $10\ \text{kV}$ along a line of $4\ \Omega$. Find the losses. What would they be at $100\ \text{kV}$?
HKA: $I = \dfrac{P}{U}$, $P_{\text{დ}} = I^2 R$.
HEN: $I = \dfrac{P}{U}$, $P_{\text{loss}} = I^2 R$.
SKA: $10\ \text{კვ}$: $I = 50\ \text{ა}$, $\ P_{\text{დ}} = 2500 \cdot 4 = 10\ \text{კვტ}$ ($2\%$)
$100\ \text{კვ}$: $I = 5\ \text{ა}$, $\ P_{\text{დ}} = 100\ \text{ვტ}$ — $100$-ჯერ ნაკლები.
SEN: $10\ \text{kV}$: $I = 50\ \text{A}$, $\ P_{\text{loss}} = 2500 \cdot 4 = 10\ \text{kW}$ ($2\%$)
$100\ \text{kV}$: $I = 5\ \text{A}$, $\ P_{\text{loss}} = 100\ \text{W}$ — $100$ times less.
AKA: $10\ \text{კვტ}$; $100\ \text{ვტ}$
AEN: $10\ \text{kW}$; $100\ \text{W}$

--- medium power
KA: ორი სპირალი ($R_1 = 30$ და $R_2 = 60\ \text{ომი}$) $220\ \text{ვ}$-ზეა. როგორ უნდა ჩაირთოს, რომ წყალი ყველაზე სწრაფად ადუღდეს? ყველაზე ნელა?
EN: Two coils ($R_1 = 30$ and $R_2 = 60\ \Omega$) are used on $220\ \text{V}$. How should they be connected to boil water fastest? Slowest?
HKA: $P = \dfrac{U^2}{R}$ — ნაკლები $R$, მეტი სიმძლავრე.
HEN: $P = \dfrac{U^2}{R}$ — less $R$, more power.
SKA: სწრაფად — პარალელურად ($R = 20\ \text{ომი}$, $P \approx 2420\ \text{ვტ}$).
ნელა — მიმდევრობით ($R = 90\ \text{ომი}$, $P \approx 538\ \text{ვტ}$).
SEN: Fastest — in parallel ($R = 20\ \Omega$, $P \approx 2420\ \text{W}$).
Slowest — in series ($R = 90\ \Omega$, $P \approx 538\ \text{W}$).
AKA: პარ. — სწრაფად; მიმდ. — ნელა
AEN: parallel — fastest; series — slowest

--- hard power
KA: ჩაიდანს ორი სპირალი აქვს. პირველით წყალი $12$ წუთში დუღს, მეორით — $24$ წუთში. რამდენ ხანში ადუღდება მიმდევრობით? პარალელურად?
EN: A kettle has two coils. With the first the water boils in $12$ min, with the second in $24$ min. How long with both in series? In parallel?
HKA: $t \sim R$; მიმდევრობით $t = t_1 + t_2$, პარალელურად $t = \dfrac{t_1 t_2}{t_1 + t_2}$.
HEN: $t \sim R$; series $t = t_1 + t_2$, parallel $t = \dfrac{t_1 t_2}{t_1 + t_2}$.
SKA: მიმდევრობით: $36\ \text{წთ}$; პარალელურად: $\dfrac{12 \cdot 24}{36} = 8\ \text{წთ}$
SEN: Series: $36\ \text{min}$; parallel: $\dfrac{12 \cdot 24}{36} = 8\ \text{min}$
AKA: $36\ \text{წთ}$; $8\ \text{წთ}$
AEN: $36\ \text{min}$; $8\ \text{min}$

--- hard power
KA: წყარო ($\mathcal{E}$, $r$) $R$ დატვირთვას კვებავს. აჩვენეთ, რომ სმკ $\eta = \dfrac{R}{R + r}$, ხოლო მაქსიმალური სიმძლავრისას $\eta = 50\%$.
EN: A source ($\mathcal{E}$, $r$) feeds a load $R$. Show that the efficiency is $\eta = \dfrac{R}{R + r}$, and that at maximum power $\eta = 50\%$.
HKA: სასარგებლო $I^2 R$, სრული $I^2(R + r)$.
HEN: Useful $I^2 R$, total $I^2(R + r)$.
SKA: $\eta = \dfrac{I^2 R}{I^2 (R + r)} = \dfrac{R}{R + r}$
მაქსიმალური სიმძლავრე $R = r$-ისას: $\eta = \dfrac{1}{2} = 50\%$.
SEN: $\eta = \dfrac{I^2 R}{I^2 (R + r)} = \dfrac{R}{R + r}$
Maximum power is at $R = r$: $\eta = \dfrac{1}{2} = 50\%$.
AKA: $50\%$
AEN: $50\%$

--- hard power
KA: მავთულის მასა და მასალა მოცემულია. როგორ შეიცვლება $220\ \text{ვ}$-ზე ჩართული მავთულისგან გაკეთებული გამაცხელებლის სიმძლავრე, თუ მავთულს $2$-ჯერ გავჭიმავთ (სიგრძით)?
EN: A heater is made from a fixed mass of a given wire. If the wire is drawn to twice its length, how does the heater's power on $220\ \text{V}$ change?
HKA: მოცულობა მუდმივია: $R \sim l^2$.
HEN: The volume is fixed: $R \sim l^2$.
SKA: $R' = 4R$ $\Rightarrow$ $P' = \dfrac{P}{4}$
SEN: $R' = 4R$ $\Rightarrow$ $P' = \dfrac{P}{4}$
AKA: $4$-ჯერ შემცირდება
AEN: it becomes $4$ times smaller

--- hard power
KA: ელექტრომობილი ($1{,}5\ \text{ტ}$) $20\ \text{მ/წმ}$-ით მოძრაობს, წინაღობა $400\ \text{ნ}$-ია. ძრავა $400\ \text{ვ}$ ბატარეიდან იკვებება, სმკ $90\%$. რა დენი გადის?
EN: A $1.5\ \text{t}$ electric car moves at $20\ \text{m/s}$ against $400\ \text{N}$ of resistance. The motor runs from a $400\ \text{V}$ battery at $90\%$ efficiency. What current flows?
HKA: მექანიკური სიმძლავრე $F v$.
HEN: Mechanical power $F v$.
SKA: $P_{\text{მ}} = 400 \cdot 20 = 8000\ \text{ვტ}$, $\ P_{\text{ე}} = \dfrac{8000}{0{,}9} \approx 8890\ \text{ვტ}$
$I = \dfrac{8890}{400} \approx 22\ \text{ა}$
SEN: $P_{\text{mech}} = 400 \cdot 20 = 8000\ \text{W}$, $\ P_{\text{el}} = \dfrac{8000}{0.9} \approx 8890\ \text{W}$
$I = \dfrac{8890}{400} \approx 22\ \text{A}$
AKA: $\approx 22\ \text{ა}$
AEN: $\approx 22\ \text{A}$

--- hard power
KA: ლიფტის ძრავა ($380\ \text{ვ}$, სმკ $80\%$) $800\ \text{კგ}$ კაბინას $1\ \text{მ/წმ}$-ით სწევს. რა დენს მოიხმარს?
EN: A lift motor ($380\ \text{V}$, $80\%$ efficient) raises an $800\ \text{kg}$ car at $1\ \text{m/s}$. What current does it draw?
HKA: $\eta U I = m g v$.
HEN: $\eta U I = m g v$.
SKA: $I = \dfrac{8000 \cdot 1}{0{,}8 \cdot 380} \approx 26\ \text{ა}$
SEN: $I = \dfrac{8000 \cdot 1}{0.8 \cdot 380} \approx 26\ \text{A}$
AKA: $\approx 26\ \text{ა}$
AEN: $\approx 26\ \text{A}$

--- hard power
KA: $3$ ერთნაირი რეზისტორი: ორი პარალელურად, მესამე მიმდევრობით. მესამეში $12\ \text{ვტ}$ გამოიყოფა. რამდენი გამოიყოფა თითოეულ პარალელურში? სულ?
EN: Three identical resistors: two in parallel, the third in series with them. The third dissipates $12\ \text{W}$. How much does each parallel one dissipate? The total?
HKA: პარალელურებში დენი $\dfrac{I}{2}$.
HEN: Each parallel resistor carries $\dfrac{I}{2}$.
SKA: $P \sim I^2$: თითოეულ პარალელურში $\dfrac{12}{4} = 3\ \text{ვტ}$
სულ: $12 + 3 + 3 = 18\ \text{ვტ}$
SEN: $P \sim I^2$: each parallel one dissipates $\dfrac{12}{4} = 3\ \text{W}$
Total: $12 + 3 + 3 = 18\ \text{W}$
AKA: $3\ \text{ვტ}$; $18\ \text{ვტ}$
AEN: $3\ \text{W}$; $18\ \text{W}$

--- hard power
KA: ნიქრომის მავთული ($\rho = 1{,}1 \cdot 10^{-6}\ \text{ომი·მ}$, $S = 0{,}2\ \text{მმ}^2$) $220\ \text{ვ}$-ზე $1{,}1\ \text{კვტ}$-ს უნდა იძლეოდეს. რა სიგრძის მავთულია საჭირო?
EN: Nichrome wire ($\rho = 1.1 \times 10^{-6}\ \Omega\cdot\text{m}$, $S = 0.2\ \text{mm}^2$) must give $1.1\ \text{kW}$ on $220\ \text{V}$. What length is needed?
HKA: $R = \dfrac{U^2}{P}$, $l = \dfrac{R S}{\rho}$.
HEN: $R = \dfrac{U^2}{P}$, $l = \dfrac{R S}{\rho}$.
SKA: $R = \dfrac{48\,400}{1100} = 44\ \text{ომი}$
$l = \dfrac{44 \cdot 2 \cdot 10^{-7}}{1{,}1 \cdot 10^{-6}} = 8\ \text{მ}$
SEN: $R = \dfrac{48\,400}{1100} = 44\ \Omega$
$l = \dfrac{44 \cdot 2 \times 10^{-7}}{1.1 \times 10^{-6}} = 8\ \text{m}$
AKA: $8\ \text{მ}$
AEN: $8\ \text{m}$

--- hard power
KA: „$220\ \text{ვ}$, $100\ \text{ვტ}$“ და „$220\ \text{ვ}$, $25\ \text{ვტ}$“ ნათურები მიმდევრობით $220\ \text{ვ}$-ზე ჩართეს. იპოვეთ თითოეულის სიმძლავრე.
EN: "$220\ \text{V}$, $100\ \text{W}$" and "$220\ \text{V}$, $25\ \text{W}$" lamps are in series on $220\ \text{V}$. Find each one's power.
HKA: $R_1 = 484$, $R_2 = 1936\ \text{ომი}$.
HEN: $R_1 = 484$, $R_2 = 1936\ \Omega$.
SKA: $I = \dfrac{220}{2420} \approx 0{,}091\ \text{ა}$
$P_1 = I^2 R_1 \approx 4\ \text{ვტ}$, $\ P_2 \approx 16\ \text{ვტ}$
SEN: $I = \dfrac{220}{2420} \approx 0.091\ \text{A}$
$P_1 = I^2 R_1 \approx 4\ \text{W}$, $\ P_2 \approx 16\ \text{W}$
AKA: $4\ \text{ვტ}$ და $16\ \text{ვტ}$
AEN: $4\ \text{W}$ and $16\ \text{W}$

--- hard power olympiad
KA: ერთნაირი ელემენტები ($\mathcal{E} = 1{,}5\ \text{ვ}$, $r = 0{,}5\ \text{ომი}$), სულ $12$ ცალი. როგორ უნდა შეიკრას ბატარეა ($m$ ჯგუფი პარალელურად, თითოეულში $n$ მიმდევრობით, $mn = 12$), რომ $R = 1{,}5\ \text{ომი}$ დატვირთვაზე სიმძლავრე მაქსიმალური იყოს?
EN: There are $12$ identical cells ($\mathcal{E} = 1.5\ \text{V}$, $r = 0.5\ \Omega$). How should they be arranged ($m$ parallel groups of $n$ in series, $mn = 12$) to give maximum power to $R = 1.5\ \Omega$?
HKA: მაქსიმუმი, როცა ბატარეის შიგა წინაღობა $\dfrac{n r}{m}$ უდრის $R$-ს.
HEN: The maximum is when the battery's internal resistance $\dfrac{n r}{m}$ equals $R$.
SKA: $\dfrac{0{,}5 n}{m} = 1{,}5 \Rightarrow n = 3m$; $\ 3m^2 = 12 \Rightarrow m = 2$, $n = 6$.
$I = \dfrac{6 \cdot 1{,}5}{1{,}5 + 1{,}5} = 3\ \text{ა}$, $\ P = 9 \cdot 1{,}5 = 13{,}5\ \text{ვტ}$
SEN: $\dfrac{0.5 n}{m} = 1.5 \Rightarrow n = 3m$; $\ 3m^2 = 12 \Rightarrow m = 2$, $n = 6$.
$I = \dfrac{6 \cdot 1.5}{1.5 + 1.5} = 3\ \text{A}$, $\ P = 9 \cdot 1.5 = 13.5\ \text{W}$
AKA: $2$ ჯგუფი, $6$-$6$ მიმდევრობით; $13{,}5\ \text{ვტ}$
AEN: $2$ groups of $6$ in series; $13.5\ \text{W}$

--- hard power olympiad
KA: ელექტროძრავა ($r_{\text{გ}} = 2\ \text{ომი}$) $\mathcal{E} = 24\ \text{ვ}$, $r = 0$ წყაროზეა. რა დენისას იქნება მექანიკური სიმძლავრე მაქსიმალური? რას უდრის ის და სმკ?
EN: A motor with winding resistance $2\ \Omega$ runs from an ideal $24\ \text{V}$ source. At what current is its mechanical power greatest? What is that power and the efficiency?
HKA: $P_{\text{მ}} = \mathcal{E} I - I^2 r_{\text{გ}}$ — პარაბოლა $I$-ს მიმართ.
HEN: $P_{\text{mech}} = \mathcal{E} I - I^2 r_{\text{w}}$ — a parabola in $I$.
SKA: მაქსიმუმი $I = \dfrac{\mathcal{E}}{2r_{\text{გ}}} = 6\ \text{ა}$
$P_{\text{მ}} = 144 - 72 = 72\ \text{ვტ}$, $\ \eta = \dfrac{72}{144} = 50\%$
SEN: Maximum at $I = \dfrac{\mathcal{E}}{2r_{\text{w}}} = 6\ \text{A}$
$P_{\text{mech}} = 144 - 72 = 72\ \text{W}$, $\ \eta = \dfrac{72}{144} = 50\%$
AKA: $6\ \text{ა}$; $72\ \text{ვტ}$; $50\%$
AEN: $6\ \text{A}$; $72\ \text{W}$; $50\%$

--- hard power olympiad
KA: $220\ \text{ვ}$-ზე მომუშავე გამაცხელებლის მავთულმა ზედაპირის ერთეულ ფართობზე ერთი და იგივე სიმძლავრე უნდა გასცეს (რომ ტემპერატურა იგივე დარჩეს). როგორ უნდა შეიცვალოს მისი სიგრძე $l$ და დიამეტრი $d$, თუ სიმძლავრეს $2$-ჯერ ვზრდით?
EN: A $220\ \text{V}$ heater wire must shed the same power per unit surface area (to stay at the same temperature). How must its length $l$ and diameter $d$ change if the power is doubled?
HKA: $P = \dfrac{U^2 \pi d^2}{4\rho l}$; ზედაპირზე: $\dfrac{P}{\pi d l} = \text{const}$.
HEN: $P = \dfrac{U^2 \pi d^2}{4\rho l}$; per area: $\dfrac{P}{\pi d l} = \text{const}$.
SKA: $P \sim \dfrac{d^2}{l}$ და $P \sim d l$.
გაყოფით: $\dfrac{d}{l^2} = \text{const} \Rightarrow d \sim l^2$; შემდეგ $P \sim d l \sim l^3$.
$P \times 2$: $l \times 2^{1/3} \approx 1{,}26$, $\ d \times 2^{2/3} \approx 1{,}59$.
SEN: $P \sim \dfrac{d^2}{l}$ and $P \sim d l$.
Dividing: $\dfrac{d}{l^2} = \text{const} \Rightarrow d \sim l^2$; then $P \sim d l \sim l^3$.
For $P \times 2$: $l \times 2^{1/3} \approx 1.26$, $\ d \times 2^{2/3} \approx 1.59$.
AKA: $l \approx 1{,}26$-ჯერ, $d \approx 1{,}59$-ჯერ
AEN: $l \approx 1.26$ times, $d \approx 1.59$ times

--- hard power olympiad
KA: ორი ერთნაირი ნათურა ($R$) და რეოსტატი ($R_x$): ერთი ნათურა მიმდევრობითაა, მეორე ნათურა $R_x$-ის პარალელურადაა. $U$ მუდმივია. რა $R_x$-ისას იქნება მეორე ნათურაში სიმძლავრე მაქსიმალური?
EN: Two identical lamps ($R$) and a rheostat $R_x$: one lamp is in series, the other lamp is in parallel with $R_x$. $U$ is fixed. For what $R_x$ is the power in the second lamp greatest?
HKA: მეორე ნათურაზე ძაბვა $U_2 = U\dfrac{R_{\parallel}}{R + R_{\parallel}}$ — ის $R_x$-თან ერთად იზრდება.
HEN: The second lamp's voltage $U_2 = U\dfrac{R_{\parallel}}{R + R_{\parallel}}$ grows with $R_x$.
SKA: $R_{\parallel} = \dfrac{R R_x}{R + R_x}$ $R_x$-თან ერთად მონოტონურად იზრდება $R$-მდე.
$U_2$ მაქსიმალურია $R_x \to \infty$-ისას: $U_2 = \dfrac{U}{2}$, $P_2 = \dfrac{U^2}{4R}$ (რეოსტატი გათიშული).
SEN: $R_{\parallel} = \dfrac{R R_x}{R + R_x}$ increases steadily with $R_x$ up to $R$.
$U_2$ is greatest as $R_x \to \infty$: $U_2 = \dfrac{U}{2}$, $P_2 = \dfrac{U^2}{4R}$ (rheostat disconnected).
AKA: $R_x \to \infty$
AEN: $R_x \to \infty$

--- easy media
KA: რა არის ელექტროლიზი? მოიყვანეთ მისი გამოყენების ორი მაგალითი.
EN: What is electrolysis? Give two uses of it.
HKA: დენი ელექტროლიტში და ნივთიერების გამოყოფა ელექტროდებზე.
HEN: Current in an electrolyte and substances released at the electrodes.
SKA: ელექტროლიზი — ელექტროდებზე ნივთიერების გამოყოფა ელექტროლიტში დენის გავლისას (იონები ელექტროდებისკენ მოძრაობენ).
გამოყენება: ლითონის დაფარვა (გალვანოსტეგია — მოოქროვება, მოვერცხლვა), ალუმინისა და სუფთა სპილენძის მიღება.
SEN: Electrolysis — substances are released at the electrodes as current passes through an electrolyte (the ions move to the electrodes).
Uses: electroplating (gold, silver, chrome), producing aluminium and pure copper.
AKA: გალვანოსტეგია, ალუმინის მიღება
AEN: electroplating, producing aluminium

--- easy media
KA: $3\ \text{ა}$ დენი $20\ \text{წთ}$ გადის $\text{CuSO}_4$ ხსნარში. რამდენი სპილენძი გამოიყოფა? ($k = 3{,}3 \cdot 10^{-7}\ \text{კგ/კ}$)
EN: $3\ \text{A}$ passes through $\text{CuSO}_4$ solution for $20\ \text{min}$. How much copper is deposited? ($k = 3.3 \times 10^{-7}\ \text{kg/C}$)
HKA: ფარადეის კანონი: $m = k I t$.
HEN: Faraday's law: $m = k I t$.
SKA: $m = 3{,}3 \cdot 10^{-7} \cdot 3 \cdot 1200 \approx 1{,}19 \cdot 10^{-3}\ \text{კგ} \approx 1{,}2\ \text{გ}$
SEN: $m = 3.3 \times 10^{-7} \cdot 3 \cdot 1200 \approx 1.19 \times 10^{-3}\ \text{kg} \approx 1.2\ \text{g}$
AKA: $\approx 1{,}2\ \text{გ}$
AEN: $\approx 1.2\ \text{g}$

--- easy media
KA: რატომ არ ატარებს დენს სუფთა გამოხდილი წყალი, ონკანის წყალი კი ატარებს?
EN: Why doesn't pure distilled water conduct, while tap water does?
HKA: მუხტის მატარებლები — იონები.
HEN: The charge carriers are ions.
SKA: გამოხდილ წყალში თითქმის არ არის იონები. ონკანის წყალში გახსნილი მარილებია, რომლებიც იონებად იშლება — ისინი ატარებენ დენს.
SEN: Distilled water has almost no ions. Tap water has dissolved salts that split into ions — and they carry the current.
AKA: ონკანის წყალში იონებია
AEN: tap water contains ions

--- easy media
KA: რა არის ნახევარგამტარი? როგორ იცვლება მისი წინაღობა გათბობისას, ლითონისგან განსხვავებით?
EN: What is a semiconductor? How does its resistance change with heating, unlike a metal's?
HKA: გათბობისას მუხტის მატარებლების რიცხვი იზრდება.
HEN: Heating increases the number of charge carriers.
SKA: ნახევარგამტარი (სილიციუმი, გერმანიუმი) — ნივთიერება, რომლის გამტარობა გამტარებსა და იზოლატორებს შორისაა.
გათბობისას მისი წინაღობა **მცირდება** (მეტი თავისუფალი ელექტრონი და ხვრელი), ლითონისა კი იზრდება.
SEN: A semiconductor (silicon, germanium) has a conductivity between conductors and insulators.
When heated its resistance **falls** (more free electrons and holes), whereas a metal's rises.
AKA: გათბობისას წინაღობა მცირდება
AEN: its resistance falls when heated

--- medium media
KA: $50\ \text{სმ}^2$ ზედაპირის ნაკეთობა $0{,}01\ \text{მმ}$ სისქის ვერცხლით უნდა დაიფაროს. $2\ \text{ა}$ დენით რამდენ ხანს გაგრძელდება? ($k = 1{,}12 \cdot 10^{-6}\ \text{კგ/კ}$, $\rho = 10\,500\ \text{კგ/მ}^3$)
EN: A $50\ \text{cm}^2$ item is to be silver-plated $0.01\ \text{mm}$ thick. How long does it take at $2\ \text{A}$? ($k = 1.12 \times 10^{-6}\ \text{kg/C}$, $\rho = 10\,500\ \text{kg/m}^3$)
HKA: $m = \rho S d$, $t = \dfrac{m}{k I}$.
HEN: $m = \rho S d$, $t = \dfrac{m}{k I}$.
SKA: $m = 10\,500 \cdot 5 \cdot 10^{-3} \cdot 10^{-5} = 5{,}25 \cdot 10^{-4}\ \text{კგ}$
$t = \dfrac{5{,}25 \cdot 10^{-4}}{1{,}12 \cdot 10^{-6} \cdot 2} \approx 234\ \text{წმ} \approx 4\ \text{წთ}$
SEN: $m = 10\,500 \cdot 5 \times 10^{-3} \cdot 10^{-5} = 5.25 \times 10^{-4}\ \text{kg}$
$t = \dfrac{5.25 \times 10^{-4}}{1.12 \times 10^{-6} \cdot 2} \approx 234\ \text{s} \approx 4\ \text{min}$
AKA: $\approx 4\ \text{წთ}$
AEN: $\approx 4\ \text{min}$

--- medium media
KA: რა ხდება ნახევარგამტარულ დიოდში? რატომ ატარებს ის დენს მხოლოდ ერთი მიმართულებით?
EN: What happens in a semiconductor diode? Why does it conduct only one way?
HKA: $p$–$n$ გადასასვლელი.
HEN: The $p$–$n$ junction.
SKA: დიოდი $p$ და $n$ ტიპის ნახევარგამტარების შეხებაა. გადასასვლელში იქმნება ჩამკეტი ფენა.
„პირდაპირი“ ძაბვა ფენას ავიწროებს და დენი გადის; „უკუ“ ძაბვა მას აფართოებს — დენი თითქმის არ გადის.
SEN: A diode is a junction of $p$-type and $n$-type semiconductors, with a depletion layer at the boundary.
A forward voltage narrows the layer and current flows; a reverse voltage widens it — almost no current flows.
AKA: $p$–$n$ გადასასვლელის ჩამკეტი ფენის გამო
AEN: because of the $p$–$n$ junction's depletion layer

--- medium media
KA: რით განსხვავდება $n$-ტიპის და $p$-ტიპის ნახევარგამტარები? როგორ იღებენ მათ?
EN: How do $n$-type and $p$-type semiconductors differ? How are they made?
HKA: მინარევები.
HEN: Impurities (doping).
SKA: $n$-ტიპი: სილიციუმს ხუთვალენტიან მინარევს (ფოსფორს) ამატებენ — ზედმეტი ელექტრონები ძირითადი მატარებლებია.
$p$-ტიპი: სამვალენტიანს (ბორს) — ძირითადი მატარებლები „ხვრელებია“ (დადებითი).
SEN: $n$-type: silicon is doped with a five-valent impurity (phosphorus) — extra electrons are the main carriers.
$p$-type: with a three-valent one (boron) — the main carriers are positive "holes".
AKA: $n$ — ელექტრონები (P), $p$ — ხვრელები (B)
AEN: $n$ — electrons (P), $p$ — holes (B)

--- medium media
KA: ალუმინის მიღებისას $5\ \text{ვ}$-ზე $1\ \text{ტ}$ ალუმინისთვის რამდენი ელექტროენერგიაა საჭირო? ($k = 9{,}3 \cdot 10^{-8}\ \text{კგ/კ}$)
EN: How much electrical energy is needed to produce $1\ \text{t}$ of aluminium at $5\ \text{V}$? ($k = 9.3 \times 10^{-8}\ \text{kg/C}$)
HKA: $q = \dfrac{m}{k}$, $A = q U$.
HEN: $q = \dfrac{m}{k}$, $W = q U$.
SKA: $q = \dfrac{1000}{9{,}3 \cdot 10^{-8}} \approx 1{,}08 \cdot 10^{10}\ \text{კ}$
$A = 5{,}4 \cdot 10^{10}\ \text{ჯ} = 15\,000\ \text{კვტ·სთ}$
SEN: $q = \dfrac{1000}{9.3 \times 10^{-8}} \approx 1.08 \times 10^{10}\ \text{C}$
$W = 5.4 \times 10^{10}\ \text{J} = 15\,000\ \text{kWh}$
AKA: $\approx 15\,000\ \text{კვტ·სთ}$
AEN: $\approx 15\,000\ \text{kWh}$

--- medium media
KA: რა არის დამოუკიდებელი და დამოკიდებული აირის განმუხტვა? მოიყვანეთ მაგალითები.
EN: What are self-sustained and non-self-sustained gas discharges? Give examples.
HKA: გარე იონიზატორი საჭიროა თუ არა.
HEN: Whether an external ioniser is needed.
SKA: დამოკიდებული — მიმდინარეობს მხოლოდ გარე იონიზატორის (ალი, რენტგენი) მოქმედებისას.
დამოუკიდებელი — თავად ინარჩუნებს თავს დარტყმითი იონიზაციით: ნაპერწკალი, ელვა, მბჟუტავი განმუხტვა (ნეონის ნათურა), ელექტრული რკალი.
SEN: Non-self-sustained — runs only while an external ioniser (a flame, X-rays) acts.
Self-sustained — keeps itself going by impact ionisation: a spark, lightning, a glow discharge (neon lamp), an electric arc.
AKA: გარე იონიზატორით / მის გარეშე (ელვა, რკალი)
AEN: with / without an external ioniser (lightning, arc)

--- medium media
KA: ვაკუუმურ დიოდში კათოდიდან ელექტრონები გამოდის. როგორ ხდება ეს და რას ჰქვია?
EN: In a vacuum diode electrons leave the cathode. How, and what is it called?
HKA: გახურებული ლითონი.
HEN: A heated metal.
SKA: თერმოელექტრონული ემისია: გახურებულ კათოდში ზოგ ელექტრონს იმდენი ენერგია აქვს, რომ ლითონიდან გამოსვლის მუშაობას ძლევს და გამოდის. ანოდზე დადებითი ძაბვისას ისინი ანოდისკენ მიდიან — დენი გადის.
SEN: Thermionic emission: in a heated cathode some electrons have enough energy to overcome the work function and escape. With the anode positive they travel to it — a current flows.
AKA: თერმოელექტრონული ემისია
AEN: thermionic emission

--- hard media
KA: ერთი და იგივე დენი ორ მიმდევრობით ელექტროლიზერში — $\text{AgNO}_3$ და $\text{CuSO}_4$ — გადის. პირველში $10{,}8\ \text{გ}$ ვერცხლი გამოიყო. რამდენი სპილენძი გამოიყო მეორეში? ($k_{\text{Ag}} = 1{,}12 \cdot 10^{-6}$, $k_{\text{Cu}} = 3{,}3 \cdot 10^{-7}\ \text{კგ/კ}$)
EN: The same current passes through two electrolysers in series — $\text{AgNO}_3$ and $\text{CuSO}_4$. The first deposits $10.8\ \text{g}$ of silver. How much copper is deposited in the second? ($k_{\text{Ag}} = 1.12 \times 10^{-6}$, $k_{\text{Cu}} = 3.3 \times 10^{-7}\ \text{kg/C}$)
HKA: ერთი და იგივე მუხტი: $\dfrac{m_1}{k_1} = \dfrac{m_2}{k_2}$.
HEN: The same charge: $\dfrac{m_1}{k_1} = \dfrac{m_2}{k_2}$.
SKA: $m_{\text{Cu}} = 10{,}8 \cdot \dfrac{3{,}3 \cdot 10^{-7}}{1{,}12 \cdot 10^{-6}} \approx 3{,}2\ \text{გ}$
SEN: $m_{\text{Cu}} = 10.8 \cdot \dfrac{3.3 \times 10^{-7}}{1.12 \times 10^{-6}} \approx 3.2\ \text{g}$
AKA: $\approx 3{,}2\ \text{გ}$
AEN: $\approx 3.2\ \text{g}$

--- hard media
KA: ფარადეის რიცხვი $F = 96\,500\ \text{კ/მოლ}$. ამის გამოყენებით გამოთვალეთ ავოგადროს რიცხვი.
EN: The Faraday constant is $F = 96\,500\ \text{C/mol}$. Use it to calculate Avogadro's number.
HKA: $F = N_A e$ — ერთი მოლი ერთვალენტიანი იონი.
HEN: $F = N_A e$ — one mole of singly charged ions.
SKA: $N_A = \dfrac{96\,500}{1{,}6 \cdot 10^{-19}} \approx 6{,}03 \cdot 10^{23}\ \text{მოლ}^{-1}$
SEN: $N_A = \dfrac{96\,500}{1.6 \times 10^{-19}} \approx 6.03 \times 10^{23}\ \text{mol}^{-1}$
AKA: $\approx 6 \cdot 10^{23}\ \text{მოლ}^{-1}$
AEN: $\approx 6 \times 10^{23}\ \text{mol}^{-1}$

--- hard media
KA: ელექტრონი აირში $E = 3 \cdot 10^6\ \text{ვ/მ}$ ველში მოძრაობს. თავისუფალი განარბენის საშუალო სიგრძეა $5 \cdot 10^{-6}\ \text{მ}$. შეუძლია თუ არა მას ჟანგბადის მოლეკულის იონიზაცია ($W = 12\ \text{ევ}$)?
EN: An electron in a gas moves in a field of $E = 3 \times 10^6\ \text{V/m}$. Its mean free path is $5 \times 10^{-6}\ \text{m}$. Can it ionise an oxygen molecule ($W = 12\ \text{eV}$)?
HKA: განარბენზე შეძენილი ენერგია $e E \lambda$.
HEN: The energy gained over one free path is $e E \lambda$.
SKA: $W_{\text{ელ}} = e \cdot 3 \cdot 10^6 \cdot 5 \cdot 10^{-6} = 15\ \text{ევ} > 12\ \text{ევ}$ — შეუძლია (ამიტომ ჰაერი $\sim 3\ \text{მვ/მ}$-ზე „ირღვევა“).
SEN: $W_{\text{e}} = e \cdot 3 \times 10^6 \cdot 5 \times 10^{-6} = 15\ \text{eV} > 12\ \text{eV}$ — yes (which is why air breaks down at $\sim 3\ \text{MV/m}$).
AKA: კი ($15\ \text{ევ}$)
AEN: yes ($15\ \text{eV}$)

--- hard media
KA: თერმისტორის (ნახევარგამტარის) წინაღობა $20\ \text{°C}$-ზე $10\ \text{კომ}$-ია, $50\ \text{°C}$-ზე — $3{,}6\ \text{კომ}$. ის $5\ \text{ვ}$-ზე $10\ \text{კომ}$ რეზისტორთან მიმდევრობითაა. როგორ იცვლება თერმისტორზე ძაბვა ამ ტემპერატურებზე? როგორ შეიძლება ეს თერმომეტრად გამოვიყენოთ?
EN: A thermistor is $10\ \text{k}\Omega$ at $20\ \text{°C}$ and $3.6\ \text{k}\Omega$ at $50\ \text{°C}$. It is in series with a $10\ \text{k}\Omega$ resistor across $5\ \text{V}$. What is the thermistor voltage at each temperature? How can this be used as a thermometer?
HKA: ძაბვის გამყოფი.
HEN: A voltage divider.
SKA: $20\ \text{°C}$: $U = 5 \cdot \dfrac{10}{20} = 2{,}5\ \text{ვ}$
$50\ \text{°C}$: $U = 5 \cdot \dfrac{3{,}6}{13{,}6} \approx 1{,}32\ \text{ვ}$
ძაბვა ტემპერატურის ცალსახა ფუნქციაა — ვოლტმეტრის სკალა გრადუსებში დაკალიბრდება.
SEN: $20\ \text{°C}$: $U = 5 \cdot \dfrac{10}{20} = 2.5\ \text{V}$
$50\ \text{°C}$: $U = 5 \cdot \dfrac{3.6}{13.6} \approx 1.32\ \text{V}$
The voltage depends uniquely on temperature — a voltmeter scale can be calibrated in degrees.
AKA: $2{,}5\ \text{ვ}$; $\approx 1{,}3\ \text{ვ}$
AEN: $2.5\ \text{V}$; $\approx 1.3\ \text{V}$
