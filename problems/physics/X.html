AEN: $11\ \Omega$

--- easy circuits
KA: $6\ \text{ომ}$ და $12\ \text{ომ}$ ნათურები პარალელურად არის ჩართული $12\ \text{ვ}$ წყაროზე. იპოვეთ დენი თითოეულში და საერთო დენი.
EN: Lamps of $6\ \Omega$ and $12\ \Omega$ are connected in parallel to $12\ \text{V}$. Find the current in each and the total current.
HKA: პარალელურად ძაბვა ერთნაირია; დენები იკრიბება.
HEN: In parallel the voltage is the same; the currents add.
SKA: **ფორმულა:** $I_k = \dfrac{U}{R_k}$, $\ I = I_1 + I_2$
**რიცხვები:** $I_1 = \dfrac{12}{6} = 2\ \text{ა}$, $\ I_2 = \dfrac{12}{12} = 1\ \text{ა}$, $\ I = 3\ \text{ა}$
SEN: **Formula:** $I_k = \dfrac{U}{R_k}$, $\ I = I_1 + I_2$
**Numbers:** $I_1 = \dfrac{12}{6} = 2\ \text{A}$, $\ I_2 = \dfrac{12}{12} = 1\ \text{A}$, $\ I = 3\ \text{A}$
AKA: $2\ \text{ა}$; $1\ \text{ა}$; $3\ \text{ა}$
AEN: $2\ \text{A}$; $1\ \text{A}$; $3\ \text{A}$

--- easy circuits
KA: $4\ \text{ომ}$ და $6\ \text{ომ}$ რეზისტორები მიმდევრობით ჩართეს $20\ \text{ვ}$ ძაბვაზე. იპოვეთ დენი და ძაბვა თითოეულ რეზისტორზე.
EN: Resistors of $4\ \Omega$ and $6\ \Omega$ are connected in series to $20\ \text{V}$. Find the current and the voltage across each.
HKA: მიმდევრობით დენი ერთნაირია, ძაბვები იკრიბება.
HEN: In series the current is the same; the voltages add.
SKA: **ფორმულა:** $I = \dfrac{U}{R_1 + R_2}$, $\ U_k = I R_k$
**რიცხვები:** $I = \dfrac{20}{10} = 2\ \text{ა}$, $\ U_1 = 8\ \text{ვ}$, $\ U_2 = 12\ \text{ვ}$
SEN: **Formula:** $I = \dfrac{U}{R_1 + R_2}$, $\ U_k = I R_k$
**Numbers:** $I = \dfrac{20}{10} = 2\ \text{A}$, $\ U_1 = 8\ \text{V}$, $\ U_2 = 12\ \text{V}$
AKA: $2\ \text{ა}$; $8\ \text{ვ}$ და $12\ \text{ვ}$
AEN: $2\ \text{A}$; $8\ \text{V}$ and $12\ \text{V}$

--- easy emf
KA: $9\ \text{ვ}$ ემძალის ბატარეის შიგა წინაღობაა $0{,}5\ \text{ომი}$, გარე წინაღობა — $4\ \text{ომი}$. იპოვეთ დენი.
EN: A $9\ \text{V}$ battery has internal resistance $0.5\ \Omega$; the external resistance is $4\ \Omega$. Find the current.
HKA: $I = \dfrac{\mathcal{E}}{R + r}$.
HEN: $I = \dfrac{\mathcal{E}}{R + r}$.
SKA: **ფორმულა:** $I = \dfrac{\mathcal{E}}{R + r}$
**რიცხვები:** $I = \dfrac{9}{4{,}5} = 2\ \text{ა}$
SEN: **Formula:** $I = \dfrac{\mathcal{E}}{R + r}$
**Numbers:** $I = \dfrac{9}{4.5} = 2\ \text{A}$
AKA: $2\ \text{ა}$
AEN: $2\ \text{A}$

--- easy power
KA: $2{,}2\ \text{კვტ}$ სიმძლავრის ჩაიდანი $220\ \text{ვ}$ ქსელშია ჩართული. იპოვეთ დენი და სპირალის წინაღობა.
EN: A $2.2\ \text{kW}$ kettle runs on $220\ \text{V}$. Find the current and the element's resistance.
HKA: $P = U I$, $R = U/I$.
HEN: $P = U I$, $R = U/I$.
SKA: **ფორმულა:** $I = \dfrac{P}{U}$, $\ R = \dfrac{U}{I}$
**რიცხვები:** $I = \dfrac{2200}{220} = 10\ \text{ა}$, $\ R = \dfrac{220}{10} = 22\ \text{ომი}$
SEN: **Formula:** $I = \dfrac{P}{U}$, $\ R = \dfrac{U}{I}$
**Numbers:** $I = \dfrac{2200}{220} = 10\ \text{A}$, $\ R = \dfrac{220}{10} = 22\ \Omega$
AKA: $10\ \text{ა}$; $22\ \text{ომი}$
AEN: $10\ \text{A}$; $22\ \Omega$

--- easy power
KA: $10\ \text{ომ}$ რეზისტორში $2\ \text{ა}$ დენი $1$ წუთის განმავლობაში გადიოდა. რამდენი სითბო გამოიყო?
EN: A current of $2\ \text{A}$ flows through a $10\ \Omega$ resistor for $1$ minute. How much heat is released?
HKA: ჯოულ-ლენცის კანონი: $Q = I^2 R t$.
HEN: Joule's law: $Q = I^2 R t$.
SKA: **ფორმულა:** $Q = I^2 R\,t$
**რიცხვები:** $Q = 4 \cdot 10 \cdot 60 = 2400\ \text{ჯ}$
SEN: **Formula:** $Q = I^2 R\,t$
**Numbers:** $Q = 4 \cdot 10 \cdot 60 = 2400\ \text{J}$
AKA: $2400\ \text{ჯ}$
AEN: $2400\ \text{J}$

--- easy media
KA: რა ნაწილაკები ატარებს დენს: ა) ლითონებში; ბ) ელექტროლიტებში; გ) აირებში (განმუხტვისას)?
EN: Which particles carry the current: a) in metals; b) in electrolytes; c) in gases (during a discharge)?
HKA: მუხტმტარი — თავისუფლად მოძრავი დამუხტული ნაწილაკი.
HEN: A charge carrier is a freely moving charged particle.
SKA: ა) ლითონებში — თავისუფალი ელექტრონები.
ბ) ელექტროლიტებში — დადებითი და უარყოფითი იონები (ამიტომ ელექტროდებზე ნივთიერება გამოიყოფა).
გ) აირებში — ელექტრონები და იონები, რომლებიც იონიზაციით წარმოიქმნება.
SEN: a) In metals — free electrons.
b) In electrolytes — positive and negative ions (that's why substances are deposited on the electrodes).
c) In gases — electrons and ions produced by ionisation.
AKA: ა) ელექტრონები; ბ) იონები; გ) ელექტრონები და იონები
AEN: a) electrons; b) ions; c) electrons and ions

--- medium charge
KA: უარყოფითად დამუხტული ჩხირი მიუახლოვეს დაუმუხტავი ელექტროსკოპის თავს (არ შეახეს). თითით შეეხნენ ელექტროსკოპს, შემდეგ თითი მოაშორეს, ბოლოს კი ჩხირი. რა ნიშნის მუხტი დარჩება ელექტროსკოპზე? ახსენით.
EN: A negatively charged rod is brought near (not touching) the cap of an uncharged electroscope. The electroscope is touched with a finger, the finger is removed, then the rod is removed. What sign of charge remains on the electroscope? Explain.
HKA: ელექტროსტატიკური ინდუქცია: ჩხირი ელექტრონებს განიზიდავს.
HEN: Electrostatic induction: the rod repels electrons.
SKA: ჩხირი ელექტროსკოპის ელექტრონებს განიზიდავს — ისინი ფურცლებისკენ მიდის.
თითის შეხებისას ეს ელექტრონები სხეულით დედამიწაში გადადის.
თითის მოშორების შემდეგ ელექტრონები ვეღარ ბრუნდება — ელექტროსკოპს ელექტრონები აკლია, ე.ი. ის **დადებითადაა** დამუხტული (ჩხირის საწინააღმდეგო ნიშნით).
SEN: The rod repels the electroscope's electrons — they move to the leaves.
When touched with a finger these electrons escape through the body to the Earth.
After the finger is removed they can't come back — the electroscope is short of electrons, i.e. **positively** charged (opposite to the rod).
AKA: დადებითი
AEN: positive

--- medium coulomb
KA: $+2\ \text{მკკ}$ და $-2\ \text{მკკ}$ მუხტები ერთმანეთისგან $0{,}2\ \text{მ}$-ითაა დაშორებული. მათ შუაში $+1\ \text{მკკ}$ მუხტია. იპოვეთ მასზე მოქმედი ძალა.
EN: Charges $+2\ \mu\text{C}$ and $-2\ \mu\text{C}$ are $0.2\ \text{m}$ apart. A $+1\ \mu\text{C}$ charge is at the midpoint. Find the force on it.
HKA: დადებითი მუხტი მას განიზიდავს, უარყოფითი — მიიზიდავს: ორივე ძალა უარყოფითი მუხტისკენაა.
HEN: The positive charge repels it and the negative one attracts it: both forces point towards the negative charge.
SKA: **ფორმულა:** $F = 2k\dfrac{q Q}{(d/2)^2}$
**რიცხვები:** $F_1 = 9 \cdot 10^9 \cdot \dfrac{2 \cdot 10^{-6} \cdot 10^{-6}}{0{,}01} = 1{,}8\ \text{ნ}$, $\ F = 3{,}6\ \text{ნ}$ — უარყოფითი მუხტისკენ.
SEN: **Formula:** $F = 2k\dfrac{q Q}{(d/2)^2}$
**Numbers:** $F_1 = 9 \times 10^9 \cdot \dfrac{2 \times 10^{-6} \cdot 10^{-6}}{0.01} = 1.8\ \text{N}$, $\ F = 3.6\ \text{N}$ — towards the negative charge.
AKA: $3{,}6\ \text{ნ}$
AEN: $3.6\ \text{N}$

--- medium coulomb
KA: რა მანძილზე უნდა იყოს ერთმანეთისგან ორი $1\ \text{კ}$ მუხტი, რომ $1\ \text{ნ}$ ძალით ურთიერთქმედებდნენ? რას გვეუბნება ეს კულონის, როგორც ერთეულის, შესახებ?
EN: How far apart must two $1\ \text{C}$ charges be to interact with a force of $1\ \text{N}$? What does this tell us about the coulomb as a unit?
HKA: $r = \sqrt{\dfrac{k q^2}{F}}$.
HEN: $r = \sqrt{\dfrac{k q^2}{F}}$.
SKA: **ფორმულა:** $r = q\sqrt{\dfrac{k}{F}}$
**რიცხვები:** $r = \sqrt{9 \cdot 10^9} \approx 9{,}5 \cdot 10^4\ \text{მ} \approx 95\ \text{კმ}$
$1\ \text{კ}$ უზარმაზარი მუხტია — ელექტროსტატიკაში ჩვეულებრივ ნანო- და მიკროკულონებია.
SEN: **Formula:** $r = q\sqrt{\dfrac{k}{F}}$
**Numbers:** $r = \sqrt{9 \times 10^9} \approx 9.5 \times 10^4\ \text{m} \approx 95\ \text{km}$
$1\ \text{C}$ is a huge charge — electrostatics usually deals with nano- and microcoulombs.
AKA: $\approx 95\ \text{კმ}$
AEN: $\approx 95\ \text{km}$

--- medium coulomb
KA: ორი $1\ \text{ნკ}$ მუხტი ერთმანეთისგან $1\ \text{სმ}$-ითაა დაშორებული. იპოვეთ მათი ურთიერთქმედების ძალა ვაკუუმში და წყალში ($\varepsilon = 81$).
EN: Two $1\ \text{nC}$ charges are $1\ \text{cm}$ apart. Find the force between them in vacuum and in water ($\varepsilon = 81$).
HKA: გარემოში ძალა $\varepsilon$-ჯერ მცირდება: $F = k\dfrac{q_1 q_2}{\varepsilon r^2}$.
HEN: In a medium the force is $\varepsilon$ times smaller: $F = k\dfrac{q_1 q_2}{\varepsilon r^2}$.
SKA: **ფორმულა:** $F = k\dfrac{q_1 q_2}{\varepsilon r^2}$
**რიცხვები:** ვაკუუმში: $F = 9 \cdot 10^9 \cdot \dfrac{10^{-18}}{10^{-4}} = 9 \cdot 10^{-5}\ \text{ნ}$
წყალში: $F = \dfrac{9 \cdot 10^{-5}}{81} \approx 1{,}1 \cdot 10^{-6}\ \text{ნ}$ — ამიტომ იხსნება მარილი წყალში ადვილად.
SEN: **Formula:** $F = k\dfrac{q_1 q_2}{\varepsilon r^2}$
**Numbers:** in vacuum: $F = 9 \times 10^9 \cdot \dfrac{10^{-18}}{10^{-4}} = 9 \times 10^{-5}\ \text{N}$
in water: $F = \dfrac{9 \times 10^{-5}}{81} \approx 1.1 \times 10^{-6}\ \text{N}$ — that's why salt dissolves easily in water.
AKA: $9 \cdot 10^{-5}\ \text{ნ}$; $\approx 1{,}1 \cdot 10^{-6}\ \text{ნ}$
AEN: $9 \times 10^{-5}\ \text{N}$; $\approx 1.1 \times 10^{-6}\ \text{N}$

--- medium field
KA: ორი $+4\ \text{ნკ}$ მუხტი ერთმანეთისგან $0{,}2\ \text{მ}$-ითაა დაშორებული. იპოვეთ ველის დაძაბულობა მათი შემაერთებელი წრფის იმ წერტილში, რომელიც ერთ-ერთი მუხტიდან $0{,}1\ \text{მ}$-ითაა დაშორებული მეორის საწინააღმდეგო მხარეს. რას უდრის დაძაბულობა მუხტებს შუა?
EN: Two $+4\ \text{nC}$ charges are $0.2\ \text{m}$ apart. Find the field on the line through them at a point $0.1\ \text{m}$ beyond one charge (on the side away from the other). What is the field midway between them?
HKA: გარე წერტილში ორივე ველი ერთი მიმართულებისაა; შუაში — საწინააღმდეგო.
HEN: Outside, both fields point the same way; in the middle they oppose.
SKA: **ფორმულა:** $E = k\dfrac{q}{r_1^2} + k\dfrac{q}{r_2^2}$
**რიცხვები:** $E = 9 \cdot 10^9 \cdot 4 \cdot 10^{-9}\left(\dfrac{1}{0{,}01} + \dfrac{1}{0{,}09}\right) = 3600 + 400 = 4000\ \text{ნ/კ}$
შუაში ველები ტოლი და საწინააღმდეგოა: $E = 0$.
SEN: **Formula:** $E = k\dfrac{q}{r_1^2} + k\dfrac{q}{r_2^2}$
**Numbers:** $E = 9 \times 10^9 \cdot 4 \times 10^{-9}\left(\dfrac{1}{0.01} + \dfrac{1}{0.09}\right) = 3600 + 400 = 4000\ \text{N/C}$
In the middle the fields are equal and opposite: $E = 0$.
AKA: $4000\ \text{ნ/კ}$; $0$
AEN: $4000\ \text{N/C}$; $0$

--- medium field
KA: პროტონი $10^4\ \text{ნ/კ}$ დაძაბულობის ერთგვაროვან ველშია. იპოვეთ მისი აჩქარება. რამდენჯერ აღემატება ის $g$-ს?
EN: A proton is in a uniform field of $10^4\ \text{N/C}$. Find its acceleration. How many times larger than $g$ is it?
HKA: $a = \dfrac{eE}{m_p}$.
HEN: $a = \dfrac{eE}{m_p}$.
SKA: **ფორმულა:** $a = \dfrac{e E}{m_p}$
**რიცხვები:** $a = \dfrac{1{,}6 \cdot 10^{-19} \cdot 10^4}{1{,}67 \cdot 10^{-27}} \approx 9{,}6 \cdot 10^{11}\ \text{მ/წმ}^2$ — $\approx 10^{11}$-ჯერ მეტი $g$-ზე (სიმძიმე აქ სრულიად უმნიშვნელოა).
SEN: **Formula:** $a = \dfrac{e E}{m_p}$
**Numbers:** $a = \dfrac{1.6 \times 10^{-19} \cdot 10^4}{1.67 \times 10^{-27}} \approx 9.6 \times 10^{11}\ \text{m/s}^2$ — $\approx 10^{11}$ times $g$ (gravity is completely negligible here).
AKA: $\approx 9{,}6 \cdot 10^{11}\ \text{მ/წმ}^2$
AEN: $\approx 9.6 \times 10^{11}\ \text{m/s}^2$

--- medium potential
KA: ელექტრონი $100\ \text{ვ}$ პოტენციალის წერტილიდან $300\ \text{ვ}$ პოტენციალის წერტილში გადავიდა. რა მუშაობა შეასრულა ველმა? გაიზარდა თუ შემცირდა ელექტრონის კინეტიკური ენერგია?
EN: An electron moves from a point at $100\ \text{V}$ to a point at $300\ \text{V}$. How much work does the field do? Does the electron's kinetic energy increase or decrease?
HKA: $A = q(\varphi_1 - \varphi_2)$, $q = -e$.
HEN: $A = q(\varphi_1 - \varphi_2)$, $q = -e$.
SKA: **ფორმულა:** $A = q(\varphi_1 - \varphi_2)$
**რიცხვები:** $A = -1{,}6 \cdot 10^{-19} \cdot (100 - 300) = 3{,}2 \cdot 10^{-17}\ \text{ჯ}$ — დადებითია, კინეტიკური ენერგია **გაიზარდა** (ელექტრონი მაღალი პოტენციალისკენ თავისით მიდის).
SEN: **Formula:** $A = q(\varphi_1 - \varphi_2)$
**Numbers:** $A = -1.6 \times 10^{-19} \cdot (100 - 300) = 3.2 \times 10^{-17}\ \text{J}$ — positive, the kinetic energy **increases** (electrons move towards higher potential on their own).
AKA: $3{,}2 \cdot 10^{-17}\ \text{ჯ}$; გაიზარდა
AEN: $3.2 \times 10^{-17}\ \text{J}$; it increases

--- medium potential
KA: $0{,}1\ \text{მ}$ რადიუსის ლითონის სფეროს $10\ \text{ნკ}$ მუხტი აქვს. რას უდრის მისი ზედაპირის პოტენციალი? რას უდრის ველის დაძაბულობა სფეროს შიგნით?
EN: A metal sphere of radius $0.1\ \text{m}$ carries $10\ \text{nC}$. What is its surface potential? What is the field inside the sphere?
HKA: სფეროს გარეთ ველი წერტილოვანი მუხტის ველის მსგავსია; გამტარის შიგნით ველი ნულია.
HEN: Outside, the sphere's field is like a point charge's; inside a conductor the field is zero.
SKA: **ფორმულა:** $\varphi = k\dfrac{q}{R}$
**რიცხვები:** $\varphi = 9 \cdot 10^9 \cdot \dfrac{10^{-8}}{0{,}1} = 900\ \text{ვ}$
შიგნით $E = 0$ (მუხტი ზედაპირზეა განლაგებული), პოტენციალი კი ყველგან $900\ \text{ვ}$-ია.
SEN: **Formula:** $\varphi = k\dfrac{q}{R}$
**Numbers:** $\varphi = 9 \times 10^9 \cdot \dfrac{10^{-8}}{0.1} = 900\ \text{V}$
Inside $E = 0$ (the charge sits on the surface), while the potential is $900\ \text{V}$ everywhere inside.
AKA: $900\ \text{ვ}$; $0$
AEN: $900\ \text{V}$; $0$

--- medium capacitor
KA: $4\ \text{მკფ}$ და $12\ \text{მკფ}$ კონდენსატორები მიმდევრობით ჩართეს $12\ \text{ვ}$ წყაროზე. იპოვეთ თითოეულის მუხტი და ძაბვა.
EN: Capacitors of $4\ \mu\text{F}$ and $12\ \mu\text{F}$ are connected in series to $12\ \text{V}$. Find the charge and voltage on each.
HKA: მიმდევრობით ორივეს ერთნაირი მუხტი აქვს.
HEN: In series both carry the same charge.
SKA: **ფორმულა:** $C = \dfrac{C_1 C_2}{C_1 + C_2}$, $\ q = C U$, $\ U_k = \dfrac{q}{C_k}$
**რიცხვები:** $C = \dfrac{48}{16} = 3\ \text{მკფ}$, $\ q = 3 \cdot 12 = 36\ \text{მკკ}$
$U_1 = \dfrac{36}{4} = 9\ \text{ვ}$, $\ U_2 = \dfrac{36}{12} = 3\ \text{ვ}$ — პატარა ტევადობაზე მეტი ძაბვაა.
SEN: **Formula:** $C = \dfrac{C_1 C_2}{C_1 + C_2}$, $\ q = C U$, $\ U_k = \dfrac{q}{C_k}$
**Numbers:** $C = \dfrac{48}{16} = 3\ \mu\text{F}$, $\ q = 3 \cdot 12 = 36\ \mu\text{C}$
$U_1 = \dfrac{36}{4} = 9\ \text{V}$, $\ U_2 = \dfrac{36}{12} = 3\ \text{V}$ — the smaller capacitor takes the larger voltage.
AKA: $36\ \text{მკკ}$; $9\ \text{ვ}$ და $3\ \text{ვ}$
AEN: $36\ \mu\text{C}$; $9\ \text{V}$ and $3\ \text{V}$

--- medium capacitor
KA: $100\ \text{მკფ}$ კონდენსატორი $400\ \text{ვ}$-მდე დამუხტეს. რამდენი ენერგია აქვს მას? რა სიმაღლეზე ასწევდა ეს ენერგია $1\ \text{კგ}$ ტვირთს?
EN: A $100\ \mu\text{F}$ capacitor is charged to $400\ \text{V}$. How much energy does it store? To what height could this energy lift a $1\ \text{kg}$ load?
HKA: $W = \dfrac{C U^2}{2}$, $\ W = m g h$.
HEN: $W = \dfrac{C U^2}{2}$, $\ W = m g h$.
SKA: **ფორმულა:** $W = \dfrac{C U^2}{2}$, $\ h = \dfrac{W}{m g}$
**რიცხვები:** $W = \dfrac{10^{-4} \cdot 1{,}6 \cdot 10^5}{2} = 8\ \text{ჯ}$, $\ h = \dfrac{8}{10} = 0{,}8\ \text{მ}$
SEN: **Formula:** $W = \dfrac{C U^2}{2}$, $\ h = \dfrac{W}{m g}$
**Numbers:** $W = \dfrac{10^{-4} \cdot 1.6 \times 10^5}{2} = 8\ \text{J}$, $\ h = \dfrac{8}{10} = 0.8\ \text{m}$
AKA: $8\ \text{ჯ}$; $0{,}8\ \text{მ}$
AEN: $8\ \text{J}$; $0.8\ \text{m}$

--- medium capacitor
KA: ბრტყელი კონდენსატორის ფირფიტების ფართობი გააორმაგეს, მათ შორის მანძილი კი განახევრეს. როგორ შეიცვალა ტევადობა?
EN: The plate area of a parallel-plate capacitor is doubled and the separation is halved. How does its capacitance change?
HKA: $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$.
HEN: $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$.
SKA: **ფორმულა:** $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$
$C' = \dfrac{\varepsilon\varepsilon_0 \cdot 2S}{d/2} = 4C$
SEN: **Formula:** $C = \dfrac{\varepsilon\varepsilon_0 S}{d}$
$C' = \dfrac{\varepsilon\varepsilon_0 \cdot 2S}{d/2} = 4C$
AKA: $4$-ჯერ გაიზარდა
AEN: $4$ times larger

--- medium current
KA: ნათურაში $0{,}5\ \text{ა}$ დენი $1$ საათის განმავლობაში გადიოდა. რამდენმა ელექტრონმა გაიარა ძაფში?
EN: A current of $0.5\ \text{A}$ flows through a lamp for $1$ hour. How many electrons pass through the filament?
HKA: $N = \dfrac{I t}{e}$.
HEN: $N = \dfrac{I t}{e}$.
SKA: **ფორმულა:** $N = \dfrac{I t}{e}$
**რიცხვები:** $q = 0{,}5 \cdot 3600 = 1800\ \text{კ}$, $\ N = \dfrac{1800}{1{,}6 \cdot 10^{-19}} \approx 1{,}1 \cdot 10^{22}$
SEN: **Formula:** $N = \dfrac{I t}{e}$
**Numbers:** $q = 0.5 \cdot 3600 = 1800\ \text{C}$, $\ N = \dfrac{1800}{1.6 \times 10^{-19}} \approx 1.1 \times 10^{22}$
AKA: $\approx 1{,}1 \cdot 10^{22}$
AEN: $\approx 1.1 \times 10^{22}$

--- medium ohm
KA: ერთი და იმავე მასალის ორი მავთულიდან მეორე პირველზე $2$-ჯერ გრძელია და დიამეტრიც $2$-ჯერ მეტი აქვს. როგორ შეეფარდება მათი წინაღობები?
EN: Of two wires of the same material, the second is twice as long and has twice the diameter. How do their resistances compare?
HKA: განივკვეთი დიამეტრის კვადრატის პროპორციულია.
HEN: The cross-section is proportional to the diameter squared.
SKA: **ფორმულა:** $R = \rho\dfrac{l}{S}$, $\ S \sim d^2$
$\dfrac{R_2}{R_1} = \dfrac{l_2}{l_1} \cdot \dfrac{S_1}{S_2} = 2 \cdot \dfrac{1}{4} = \dfrac{1}{2}$ — მეორის წინაღობა ორჯერ ნაკლებია.
SEN: **Formula:** $R = \rho\dfrac{l}{S}$, $\ S \propto d^2$
$\dfrac{R_2}{R_1} = \dfrac{l_2}{l_1} \cdot \dfrac{S_1}{S_2} = 2 \cdot \dfrac{1}{4} = \dfrac{1}{2}$ — the second has half the resistance.
AKA: $R_2 = \dfrac{R_1}{2}$
AEN: $R_2 = \dfrac{R_1}{2}$

--- medium ohm
KA: $2\ \text{ომ}$ ნათურა და $0$-დან $10\ \text{ომ}$-მდე რეოსტატი მიმდევრობით ჩართეს $12\ \text{ვ}$ წყაროზე. რა შუალედში შეიძლება იცვლებოდეს დენი?
EN: A $2\ \Omega$ lamp and a rheostat adjustable from $0$ to $10\ \Omega$ are connected in series to $12\ \text{V}$. Over what range can the current be varied?
HKA: მაქსიმალური დენი — როცა რეოსტატის წინაღობა ნულია; მინიმალური — როცა მაქსიმალურია.
HEN: Maximum current when the rheostat is at zero; minimum when it is at maximum.
SKA: **ფორმულა:** $I = \dfrac{U}{R_{\text{ნ}} + R_{\text{რ}}}$
**რიცხვები:** $I_{\max} = \dfrac{12}{2} = 6\ \text{ა}$, $\ I_{\min} = \dfrac{12}{12} = 1\ \text{ა}$
SEN: **Formula:** $I = \dfrac{U}{R_{\text{lamp}} + R_{\text{rh}}}$
**Numbers:** $I_{\max} = \dfrac{12}{2} = 6\ \text{A}$, $\ I_{\min} = \dfrac{12}{12} = 1\ \text{A}$
AKA: $1$-დან $6\ \text{ა}$-მდე
AEN: from $1$ to $6\ \text{A}$

--- medium circuits
KA: სამი $6\ \text{ომ}$ რეზისტორიდან ორი პარალელურად შეაერთეს, მესამე კი მათ მიმდევრობით მიუერთეს. იპოვეთ საერთო წინაღობა. რომელი სხვა წინაღობების მიღება შეიძლება სამი ასეთი რეზისტორით?
EN: Of three $6\ \Omega$ resistors, two are connected in parallel and the third in series with them. Find the total resistance. What other values can three such resistors give?
HKA: ჩამოთვალეთ ყველა შესაძლო შეერთება.
HEN: List all possible connections.
SKA: **ფორმულა:** $R = \dfrac{R}{2} + R = 1{,}5R$
**რიცხვები:** $R = 3 + 6 = 9\ \text{ომი}$
სხვა ვარიანტები: სამივე მიმდევრობით — $18\ \text{ომი}$; სამივე პარალელურად — $2\ \text{ომი}$; ორი მიმდევრობით და მესამე მათ პარალელურად — $\dfrac{12 \cdot 6}{18} = 4\ \text{ომი}$.
SEN: **Formula:** $R = \dfrac{R}{2} + R = 1.5R$
**Numbers:** $R = 3 + 6 = 9\ \Omega$
Other options: all three in series — $18\ \Omega$; all in parallel — $2\ \Omega$; two in series with the third in parallel — $\dfrac{12 \cdot 6}{18} = 4\ \Omega$.
AKA: $9\ \text{ომი}$; ასევე $18$, $2$, $4\ \text{ომი}$
AEN: $9\ \Omega$; also $18$, $2$, $4\ \Omega$

--- medium circuits
KA: $220\ \text{ვ}$ ქსელში $16\ \text{ა}$ ავტომატია. რამდენი $60\ \text{ომ}$ გამათბობლის პარალელურად ჩართვა შეიძლება ისე, რომ ავტომატი არ ამოვარდეს?
EN: A $220\ \text{V}$ circuit has a $16\ \text{A}$ breaker. How many $60\ \Omega$ heaters can be connected in parallel without tripping it?
HKA: პარალელურად დენები იკრიბება.
HEN: In parallel the currents add.
SKA: **ფორმულა:** $I_1 = \dfrac{U}{R}$, $\ n \le \dfrac{I_{\max}}{I_1}$
**რიცხვები:** $I_1 = \dfrac{220}{60} \approx 3{,}67\ \text{ა}$
$n \le \dfrac{16}{3{,}67} \approx 4{,}4$ — მაქსიმუმ $4$ ($14{,}7\ \text{ა}$); მეხუთე ($18{,}3\ \text{ა}$) ავტომატს ამოაგდებს.
SEN: **Formula:** $I_1 = \dfrac{U}{R}$, $\ n \le \dfrac{I_{\max}}{I_1}$
**Numbers:** $I_1 = \dfrac{220}{60} \approx 3.67\ \text{A}$
$n \le \dfrac{16}{3.67} \approx 4.4$ — at most $4$ ($14.7\ \text{A}$); a fifth ($18.3\ \text{A}$) trips it.
AKA: $4$
AEN: $4$

--- medium emf
KA: ბატარეის მომჭერებზე მიერთებული ვოლტმეტრი ღია წრედისას $1{,}5\ \text{ვ}$-ს აჩვენებს, $2{,}5\ \text{ომ}$ დატვირთვისას კი — $1{,}25\ \text{ვ}$-ს. იპოვეთ დენი და ბატარეის შიგა წინაღობა.
EN: A voltmeter across a battery reads $1.5\ \text{V}$ with no load and $1.25\ \text{V}$ with a $2.5\ \Omega$ load. Find the current and the battery's internal resistance.
HKA: ღია წრედისას ვოლტმეტრი ემძალას აჩვენებს; $U = \mathcal{E} - I r$.
HEN: With no load the voltmeter shows the EMF; $U = \mathcal{E} - I r$.
SKA: **ფორმულა:** $I = \dfrac{U}{R}$, $\ r = \dfrac{\mathcal{E} - U}{I}$
**რიცხვები:** $I = \dfrac{1{,}25}{2{,}5} = 0{,}5\ \text{ა}$, $\ r = \dfrac{1{,}5 - 1{,}25}{0{,}5} = 0{,}5\ \text{ომი}$
SEN: **Formula:** $I = \dfrac{U}{R}$, $\ r = \dfrac{\mathcal{E} - U}{I}$
**Numbers:** $I = \dfrac{1.25}{2.5} = 0.5\ \text{A}$, $\ r = \dfrac{1.5 - 1.25}{0.5} = 0.5\ \Omega$
AKA: $0{,}5\ \text{ა}$; $0{,}5\ \text{ომი}$
AEN: $0.5\ \text{A}$; $0.5\ \Omega$

--- medium emf
KA: ავტომობილის აკუმულატორის ემძალაა $12\ \text{ვ}$, შიგა წინაღობა — $0{,}2\ \text{ომი}$. რა ძაბვაა მის მომჭერებზე, როცა სტარტერი $10\ \text{ა}$ დენს მოიხმარს? რატომ ბჟუტავს ფარები ძრავის დაქოქვისას?
EN: A car battery has EMF $12\ \text{V}$ and internal resistance $0.2\ \Omega$. What is the terminal voltage when the starter draws $10\ \text{A}$? Why do the headlights dim when starting the engine?
HKA: $U = \mathcal{E} - I r$.
HEN: $U = \mathcal{E} - I r$.
SKA: **ფორმულა:** $U = \mathcal{E} - I r$
**რიცხვები:** $U = 12 - 10 \cdot 0{,}2 = 10\ \text{ვ}$
დიდი დენისას შიგა წინაღობაზე ძაბვის ვარდნა იზრდება — მომჭერების ძაბვა მცირდება და ფარები ბჟუტავს.
SEN: **Formula:** $U = \mathcal{E} - I r$
**Numbers:** $U = 12 - 10 \cdot 0.2 = 10\ \text{V}$
With a large current the voltage drop across the internal resistance grows — the terminal voltage falls and the lights dim.
AKA: $10\ \text{ვ}$
AEN: $10\ \text{V}$

--- medium power
KA: „$220\ \text{ვ}$, $100\ \text{ვტ}$“ და „$220\ \text{ვ}$, $25\ \text{ვტ}$“ ნათურები მიმდევრობით ჩართეს $220\ \text{ვ}$ ქსელში. რომელი ანათებს უფრო კაშკაშა? იპოვეთ თითოეულის სიმძლავრე.
EN: Lamps rated "$220\ \text{V}$, $100\ \text{W}$" and "$220\ \text{V}$, $25\ \text{W}$" are connected in series to $220\ \text{V}$. Which glows brighter? Find each one's power.
HKA: მიმდევრობით დენი ერთნაირია, ამიტომ $P = I^2 R$ — მეტ სიმძლავრეს დიდი წინაღობის ნათურა იღებს.
HEN: In series the current is the same, so $P = I^2 R$ — the higher-resistance lamp gets more power.
SKA: **ფორმულა:** $R = \dfrac{U^2}{P_{\text{ნომ}}}$, $\ I = \dfrac{U}{R_1 + R_2}$, $\ P = I^2 R$
**რიცხვები:** $R_1 = 484\ \text{ომი}$, $\ R_2 = 1936\ \text{ომი}$, $\ I = \dfrac{220}{2420} \approx 0{,}091\ \text{ა}$
$P_1 \approx 0{,}0083 \cdot 484 \approx 4\ \text{ვტ}$, $\ P_2 \approx 0{,}0083 \cdot 1936 \approx 16\ \text{ვტ}$ — „სუსტი“ $25\ \text{ვტ}$ ნათურა უფრო კაშკაშაა!
SEN: **Formula:** $R = \dfrac{U^2}{P_{\text{rated}}}$, $\ I = \dfrac{U}{R_1 + R_2}$, $\ P = I^2 R$
**Numbers:** $R_1 = 484\ \Omega$, $\ R_2 = 1936\ \Omega$, $\ I = \dfrac{220}{2420} \approx 0.091\ \text{A}$
$P_1 \approx 0.0083 \cdot 484 \approx 4\ \text{W}$, $\ P_2 \approx 0.0083 \cdot 1936 \approx 16\ \text{W}$ — the "weaker" $25\ \text{W}$ lamp is brighter!
AKA: $25\ \text{ვტ}$-იანი; $\approx 4\ \text{ვტ}$ და $\approx 16\ \text{ვტ}$
AEN: the $25\ \text{W}$ one; $\approx 4\ \text{W}$ and $\approx 16\ \text{W}$

--- medium power
KA: $1{,}5\ \text{კვტ}$ კონდიციონერი დღეში $8$ საათი მუშაობს. რა ეღირება მისი მუშაობა $30$ დღეში, თუ $1\ \text{კვტ}\cdot\text{სთ}$ $0{,}3$ ლარია?
EN: A $1.5\ \text{kW}$ air conditioner runs $8$ hours a day. What does it cost for $30$ days at $0.3$ lari per kWh?
HKA: $W = P t$ კვტ·სთ-ში.
HEN: $W = P t$ in kWh.
SKA: **ფორმულა:** $W = P\,t$, ღირებულება $= W \cdot \text{ტარიფი}$
**რიცხვები:** $W = 1{,}5 \cdot 8 \cdot 30 = 360\ \text{კვტ}\cdot\text{სთ}$, ღირებულება $= 360 \cdot 0{,}3 = 108\ ₾$
SEN: **Formula:** $W = P\,t$, cost $= W \cdot \text{tariff}$
**Numbers:** $W = 1.5 \cdot 8 \cdot 30 = 360\ \text{kWh}$, cost $= 360 \cdot 0.3 = 108\ ₾$
AKA: $108\ ₾$
AEN: $108\ ₾$

--- medium media
KA: სპილენძით დასაფარავად დეტალზე $30$ წუთში $0{,}5\ \text{გ}$ სპილენძი უნდა დაილექოს. რა დენია საჭირო? ($k = 3{,}3 \cdot 10^{-7}\ \text{კგ/კ}$)
EN: To copper-plate a part, $0.5\ \text{g}$ of copper must be deposited in $30$ minutes. What current is needed? ($k = 3.3 \times 10^{-7}\ \text{kg/C}$)
HKA: $m = k I t \Rightarrow I = \dfrac{m}{k t}$.
HEN: $m = k I t \Rightarrow I = \dfrac{m}{k t}$.
SKA: **ფორმულა:** $I = \dfrac{m}{k\,t}$
**რიცხვები:** $I = \dfrac{5 \cdot 10^{-4}}{3{,}3 \cdot 10^{-7} \cdot 1800} \approx 0{,}84\ \text{ა}$
SEN: **Formula:** $I = \dfrac{m}{k\,t}$
**Numbers:** $I = \dfrac{5 \times 10^{-4}}{3.3 \times 10^{-7} \cdot 1800} \approx 0.84\ \text{A}$
AKA: $\approx 0{,}84\ \text{ა}$
AEN: $\approx 0.84\ \text{A}$

--- hard coulomb
KA: $q$ და $4q$ მუხტები ერთმანეთისგან $L$ მანძილზე ფიქსირებული არ არის. რა მუხტი (სიდიდე და ნიშანი) და სად უნდა მოვათავსოთ, რომ სამივე მუხტი წონასწორობაში იყოს?
EN: Charges $q$ and $4q$ are a distance $L$ apart and free to move. What charge (size and sign), placed where, puts all three in equilibrium?
HKA: მესამე მუხტი $q$-სა და $4q$-ს შორისაა (წინა ამოცანის მსგავსად $x = L/3$). შემდეგ დაწერეთ $q$-ს წონასწორობის პირობა.
HEN: The third charge lies between them (as before, $x = L/3$ from $q$). Then write the equilibrium condition for $q$.
SKA: მესამე მუხტის წონასწორობა: $x = \dfrac{L}{3}$ $q$-დან.
$q$-ს წონასწორობა: $k\dfrac{q |Q|}{(L/3)^2} = k\dfrac{q \cdot 4q}{L^2} \Rightarrow |Q| = \dfrac{4q}{9}$
$Q$ უნდა მიიზიდავდეს ორივეს (რომ $4q$-ის განზიდვას აწონასწორებდეს) — უარყოფითია.
**პასუხი:** $Q = -\dfrac{4}{9}q$, $q$-დან $\dfrac{L}{3}$ მანძილზე.
SEN: Equilibrium of the third charge: $x = \dfrac{L}{3}$ from $q$.
Equilibrium of $q$: $k\dfrac{q |Q|}{(L/3)^2} = k\dfrac{q \cdot 4q}{L^2} \Rightarrow |Q| = \dfrac{4q}{9}$
$Q$ must attract both (to balance the repulsion from $4q$) — it is negative.
**Answer:** $Q = -\dfrac{4}{9}q$, at $\dfrac{L}{3}$ from $q$.
AKA: $-\dfrac{4}{9}q$, $q$-დან $\dfrac{L}{3}$-ზე
AEN: $-\dfrac{4}{9}q$, $\dfrac{L}{3}$ from $q$

--- hard field
KA: ელექტრონი $10^6\ \text{მ/წმ}$ სიჩქარით შედის $100\ \text{ნ/კ}$ დაძაბულობის ერთგვაროვან ველში ველის ხაზების გასწვრივ (ველის მიმართულებით). რა მანძილის შემდეგ გაჩერდება ის?
EN: An electron moving at $10^6\ \text{m/s}$ enters a uniform field of $100\ \text{N/C}$ along the field lines (in the direction of the field). How far does it travel before stopping?
HKA: ელექტრონზე ძალა ველის საწინააღმდეგოა — ის ამუხრუჭებს. $e E s = \dfrac{m v^2}{2}$.
HEN: The force on the electron opposes the field — it slows the electron down. $e E s = \dfrac{m v^2}{2}$.
SKA: **ფორმულა:** $e E s = \dfrac{m v^2}{2} \Rightarrow s = \dfrac{m v^2}{2 e E}$
**რიცხვები:** $s = \dfrac{9{,}1 \cdot 10^{-31} \cdot 10^{12}}{2 \cdot 1{,}6 \cdot 10^{-19} \cdot 100} \approx 2{,}8 \cdot 10^{-2}\ \text{მ} = 2{,}8\ \text{სმ}$
SEN: **Formula:** $e E s = \dfrac{m v^2}{2} \Rightarrow s = \dfrac{m v^2}{2 e E}$
**Numbers:** $s = \dfrac{9.1 \times 10^{-31} \cdot 10^{12}}{2 \cdot 1.6 \times 10^{-19} \cdot 100} \approx 2.8 \times 10^{-2}\ \text{m} = 2.8\ \text{cm}$
AKA: $\approx 2{,}8\ \text{სმ}$
AEN: $\approx 2.8\ \text{cm}$

--- hard potential
KA: $+1\ \text{ნკ}$ და $-1\ \text{ნკ}$ მუხტები ერთმანეთისგან $0{,}2\ \text{მ}$-ითაა დაშორებული. იპოვეთ ველის პოტენციალი და დაძაბულობა მათ შუაში. აჩვენეთ, რომ ნულოვანი პოტენციალი ნულოვან ველს არ ნიშნავს.
EN: Charges of $+1\ \text{nC}$ and $-1\ \text{nC}$ are $0.2\ \text{m}$ apart. Find the potential and field strength at the midpoint. Show that zero potential does not mean zero field.
HKA: პოტენციალები ალგებრულად იკრიბება, დაძაბულობები — ვექტორულად.
HEN: Potentials add as numbers, fields as vectors.
SKA: **ფორმულა:** $\varphi = k\dfrac{q_1}{r} + k\dfrac{q_2}{r}$, $\ E = 2k\dfrac{q}{r^2}$
**რიცხვები:** $\varphi = k\dfrac{10^{-9} - 10^{-9}}{0{,}1} = 0$
$E = 2 \cdot 9 \cdot 10^9 \cdot \dfrac{10^{-9}}{0{,}01} = 1800\ \text{ნ/კ}$, უარყოფითი მუხტისკენ.
SEN: **Formula:** $\varphi = k\dfrac{q_1}{r} + k\dfrac{q_2}{r}$, $\ E = 2k\dfrac{q}{r^2}$
**Numbers:** $\varphi = k\dfrac{10^{-9} - 10^{-9}}{0.1} = 0$
$E = 2 \cdot 9 \times 10^9 \cdot \dfrac{10^{-9}}{0.01} = 1800\ \text{N/C}$, towards the negative charge.
AKA: $\varphi = 0$; $E = 1800\ \text{ნ/კ}$
AEN: $\varphi = 0$; $E = 1800\ \text{N/C}$

--- hard potential
KA: (რეზერფორდის ცდა) $5\ \text{მევ}$ ენერგიის ალფა-ნაწილაკი ($q = 2e$) პირდაპირ ოქროს ბირთვისკენ ($Z = 79$) მიფრინავს. რა მინიმალურ მანძილზე მიუახლოვდება ის ბირთვს? ($1\ \text{მევ} = 1{,}6 \cdot 10^{-13}\ \text{ჯ}$)
EN: (Rutherford's experiment) A $5\ \text{MeV}$ alpha particle ($q = 2e$) flies straight at a gold nucleus ($Z = 79$). What is its closest approach? ($1\ \text{MeV} = 1.6 \times 10^{-13}\ \text{J}$)
HKA: უახლოეს წერტილში კინეტიკური ენერგია მთლიანად ურთიერთქმედების პოტენციურ ენერგიად იქცევა: $E_k = k\dfrac{2e \cdot 79e}{r}$.
HEN: At closest approach all the kinetic energy becomes electric potential energy: $E_k = k\dfrac{2e \cdot 79e}{r}$.
SKA: **ფორმულა:** $r_{\min} = k\dfrac{2 \cdot 79\,e^2}{E_k}$
**რიცხვები:** $r_{\min} = \dfrac{9 \cdot 10^9 \cdot 158 \cdot 2{,}56 \cdot 10^{-38}}{8 \cdot 10^{-13}} \approx 4{,}6 \cdot 10^{-14}\ \text{მ}$
ეს ატომის ზომაზე ($10^{-10}\ \text{მ}$) $\sim 2000$-ჯერ ნაკლებია — ბირთვი ძალიან პატარაა!
SEN: **Formula:** $r_{\min} = k\dfrac{2 \cdot 79\,e^2}{E_k}$
**Numbers:** $r_{\min} = \dfrac{9 \times 10^9 \cdot 158 \cdot 2.56 \times 10^{-38}}{8 \times 10^{-13}} \approx 4.6 \times 10^{-14}\ \text{m}$
That's $\sim 2000$ times smaller than an atom ($10^{-10}\ \text{m}$) — the nucleus is tiny!
AKA: $\approx 4{,}6 \cdot 10^{-14}\ \text{მ}$
AEN: $\approx 4.6 \times 10^{-14}\ \text{m}$

--- hard capacitor
KA: კონდენსატორი წყაროსთან დარჩა მიერთებული და ფირფიტებს შორის მანძილი გააორმაგეს. როგორ შეიცვალა ტევადობა, ძაბვა, მუხტი და ენერგია? შეადარეთ შემთხვევას, როცა კონდენსატორი წყაროს მოწყვეტილია.
EN: A capacitor stays connected to the source while the plate separation is doubled. How do the capacitance, voltage, charge and energy change? Compare with the case where it is disconnected.
HKA: წყაროსთან მიერთებისას ძაბვა მუდმივია.
HEN: While connected, the voltage is constant.
SKA: **ფორმულა:** $C = \dfrac{\varepsilon_0 S}{d}$, $\ q = C U$, $\ W = \dfrac{C U^2}{2}$
მიერთებული: $C \to \dfrac{C}{2}$, $U$ — უცვლელი, $q \to \dfrac{q}{2}$ (მუხტის ნახევარი წყაროში ბრუნდება), $W \to \dfrac{W}{2}$.
მოწყვეტილი: $C \to \dfrac{C}{2}$, $q$ — უცვლელი, $U \to 2U$, $W \to 2W$.
SEN: **Formula:** $C = \dfrac{\varepsilon_0 S}{d}$, $\ q = C U$, $\ W = \dfrac{C U^2}{2}$
Connected: $C \to \dfrac{C}{2}$, $U$ unchanged, $q \to \dfrac{q}{2}$ (half the charge returns to the source), $W \to \dfrac{W}{2}$.
Disconnected: $C \to \dfrac{C}{2}$, $q$ unchanged, $U \to 2U$, $W \to 2W$.
AKA: $C$, $q$, $W$ ნახევრდება; $U$ უცვლელია
AEN: $C$, $q$, $W$ halve; $U$ unchanged

--- hard capacitor
KA: დამუხტულ და წყაროს მოწყვეტილ ჰაეროვან კონდენსატორში $\varepsilon = 2$ დიელექტრიკი ჩადეს (მთლიანად ავსებს). როგორ შეიცვალა ძაბვა და ენერგია? სად წავიდა ენერგია?
EN: A dielectric with $\varepsilon = 2$ is slid into a charged, disconnected air capacitor (filling it). How do the voltage and energy change? Where did the energy go?
HKA: მუხტი მუდმივია: $W = \dfrac{q^2}{2C}$.
HEN: The charge is constant: $W = \dfrac{q^2}{2C}$.
SKA: **ფორმულა:** $C \to \varepsilon C$, $\ U = \dfrac{q}{C} \to \dfrac{U}{\varepsilon}$, $\ W = \dfrac{q^2}{2C} \to \dfrac{W}{\varepsilon}$
**რიცხვები:** $\varepsilon = 2$: ძაბვა და ენერგია ორჯერ შემცირდა.
ველი დიელექტრიკს შიგნით „იზიდავს“ და მასზე დადებით მუშაობას ასრულებს — დაკარგული ენერგია ამ მუშაობაზე (და ბოლოს სითბოზე) იხარჯება.
SEN: **Formula:** $C \to \varepsilon C$, $\ U = \dfrac{q}{C} \to \dfrac{U}{\varepsilon}$, $\ W = \dfrac{q^2}{2C} \to \dfrac{W}{\varepsilon}$
**Numbers:** $\varepsilon = 2$: the voltage and energy halve.
The field "pulls" the dielectric in and does positive work on it — the lost energy goes into this work (and finally into heat).
AKA: ორჯერ შემცირდა; დიელექტრიკის შეწოვაზე
AEN: both halve; into pulling the dielectric in

--- hard capacitor
KA: $2$, $3$ და $6\ \text{მკფ}$ კონდენსატორები მიმდევრობით ჩართეს $60\ \text{ვ}$ ძაბვაზე. იპოვეთ საერთო ტევადობა, მუხტი და ძაბვა თითოეულზე.
EN: Capacitors of $2$, $3$ and $6\ \mu\text{F}$ are connected in series to $60\ \text{V}$. Find the total capacitance, the charge and the voltage on each.
HKA: $\dfrac{1}{C} = \dfrac{1}{C_1} + \dfrac{1}{C_2} + \dfrac{1}{C_3}$.
HEN: $\dfrac{1}{C} = \dfrac{1}{C_1} + \dfrac{1}{C_2} + \dfrac{1}{C_3}$.
SKA: **ფორმულა:** $\dfrac{1}{C} = \sum \dfrac{1}{C_k}$, $\ q = C U$, $\ U_k = \dfrac{q}{C_k}$
**რიცხვები:** $\dfrac{1}{C} = \dfrac{1}{2} + \dfrac{1}{3} + \dfrac{1}{6} = 1 \Rightarrow C = 1\ \text{მკფ}$, $\ q = 60\ \text{მკკ}$
$U_1 = 30\ \text{ვ}$, $\ U_2 = 20\ \text{ვ}$, $\ U_3 = 10\ \text{ვ}$ (ჯამი $60$ ✓)
SEN: **Formula:** $\dfrac{1}{C} = \sum \dfrac{1}{C_k}$, $\ q = C U$, $\ U_k = \dfrac{q}{C_k}$
**Numbers:** $\dfrac{1}{C} = \dfrac{1}{2} + \dfrac{1}{3} + \dfrac{1}{6} = 1 \Rightarrow C = 1\ \mu\text{F}$, $\ q = 60\ \mu\text{C}$
$U_1 = 30\ \text{V}$, $\ U_2 = 20\ \text{V}$, $\ U_3 = 10\ \text{V}$ (sum $60$ ✓)
AKA: $1\ \text{მკფ}$; $60\ \text{მკკ}$; $30$, $20$, $10\ \text{ვ}$
AEN: $1\ \mu\text{F}$; $60\ \mu\text{C}$; $30$, $20$, $10\ \text{V}$

--- hard ohm
KA: $R$ წინაღობის მავთული $4$ ტოლ ნაწილად დაჭრეს და ნაწილები პარალელურად შეაერთეს. რამდენჯერ შეიცვალა წინაღობა?
EN: A wire of resistance $R$ is cut into $4$ equal pieces, which are connected in parallel. By what factor does the resistance change?
HKA: თითოეული ნაწილის წინაღობა $R/4$-ია.
HEN: Each piece has resistance $R/4$.
SKA: **ფორმულა:** $R_{\text{ნ}} = \dfrac{R}{n}$, $\ R_{\text{პ}} = \dfrac{R_{\text{ნ}}}{n} = \dfrac{R}{n^2}$
**რიცხვები:** $R_{\text{პ}} = \dfrac{R}{16}$ — $16$-ჯერ შემცირდა.
SEN: **Formula:** $R_{\text{piece}} = \dfrac{R}{n}$, $\ R_{\text{p}} = \dfrac{R_{\text{piece}}}{n} = \dfrac{R}{n^2}$
**Numbers:** $R_{\text{p}} = \dfrac{R}{16}$ — $16$ times smaller.
AKA: $16$-ჯერ შემცირდა
AEN: $16$ times smaller

--- hard circuits
KA: (უიტსტონის ხიდი) ხიდის მხრებში $R_1 = 10\ \text{ომი}$, $R_2 = 20\ \text{ომი}$, $R_3 = 15\ \text{ომი}$ და უცნობი $R_4$ რეზისტორია. გალვანომეტრი ნულს აჩვენებს. იპოვეთ $R_4$.
EN: (Wheatstone bridge) The arms contain $R_1 = 10\ \Omega$, $R_2 = 20\ \Omega$, $R_3 = 15\ \Omega$ and an unknown $R_4$. The galvanometer reads zero. Find $R_4$.
HKA: ხიდი გაწონასწორებულია, როცა $\dfrac{R_1}{R_2} = \dfrac{R_3}{R_4}$ — გალვანომეტრის ბოლოები ერთ პოტენციალზეა.
HEN: The bridge is balanced when $\dfrac{R_1}{R_2} = \dfrac{R_3}{R_4}$ — the galvanometer's ends are at the same potential.
SKA: **ფორმულა:** $\dfrac{R_1}{R_2} = \dfrac{R_3}{R_4} \Rightarrow R_4 = \dfrac{R_2 R_3}{R_1}$
**რიცხვები:** $R_4 = \dfrac{20 \cdot 15}{10} = 30\ \text{ომი}$
SEN: **Formula:** $\dfrac{R_1}{R_2} = \dfrac{R_3}{R_4} \Rightarrow R_4 = \dfrac{R_2 R_3}{R_1}$
**Numbers:** $R_4 = \dfrac{20 \cdot 15}{10} = 30\ \Omega$
AKA: $30\ \text{ომი}$
AEN: $30\ \Omega$

--- hard circuits
KA: $12\ \text{ვ}$ წყაროზე მიმდევრობით არის $2\ \text{კომ}$ და $1\ \text{კომ}$ რეზისტორები. რა ძაბვაა $1\ \text{კომ}$-იანზე? რას აჩვენებს მასთან პარალელურად მიერთებული $2\ \text{კომ}$ წინაღობის ვოლტმეტრი? რა დასკვნა გამოდის?
EN: Resistors of $2\ \text{k}\Omega$ and $1\ \text{k}\Omega$ are in series across $12\ \text{V}$. What is the voltage across the $1\ \text{k}\Omega$? What does a voltmeter of resistance $2\ \text{k}\Omega$ connected across it read? What do you conclude?
HKA: ვოლტმეტრი რეზისტორთან პარალელურად ერთვება და წრედს ცვლის.
HEN: The voltmeter goes in parallel with the resistor and changes the circuit.
SKA: **ფორმულა:** $U_2 = U\dfrac{R_2}{R_1 + R_2}$; ვოლტმეტრით: $R_2' = \dfrac{R_2 R_V}{R_2 + R_V}$
**რიცხვები:** ვოლტმეტრის გარეშე: $U_2 = 12 \cdot \dfrac{1}{3} = 4\ \text{ვ}$
ვოლტმეტრით: $R_2' = \dfrac{1 \cdot 2}{3} \approx 0{,}667\ \text{კომ}$, $\ U_2' = 12 \cdot \dfrac{0{,}667}{2{,}667} = 3\ \text{ვ}$
ვოლტმეტრის წინაღობა გაზომილ წინაღობაზე ბევრად დიდი უნდა იყოს, თორემ ჩვენებები მცდარია.
SEN: **Formula:** $U_2 = U\dfrac{R_2}{R_1 + R_2}$; with the voltmeter: $R_2' = \dfrac{R_2 R_V}{R_2 + R_V}$
**Numbers:** without the voltmeter: $U_2 = 12 \cdot \dfrac{1}{3} = 4\ \text{V}$
with it: $R_2' = \dfrac{1 \cdot 2}{3} \approx 0.667\ \text{k}\Omega$, $\ U_2' = 12 \cdot \dfrac{0.667}{2.667} = 3\ \text{V}$
A voltmeter's resistance must be much larger than the resistance it measures, or its readings are wrong.
AKA: $4\ \text{ვ}$; $3\ \text{ვ}$
AEN: $4\ \text{V}$; $3\ \text{V}$

--- hard emf
KA: $6\ \text{ვ}$ ემძალისა და $1\ \text{ომ}$ შიგა წინაღობის წყაროს მიუერთეს რეზისტორი, რომელშიც $5\ \text{ვტ}$ სიმძლავრე გამოიყოფა. რას უდრის რეზისტორის წინაღობა? რატომ არის ორი პასუხი?
EN: A resistor connected to a source with EMF $6\ \text{V}$ and internal resistance $1\ \Omega$ dissipates $5\ \text{W}$. What is its resistance? Why are there two answers?
HKA: $P = \dfrac{\mathcal{E}^2 R}{(R + r)^2}$ — კვადრატული განტოლება $R$-ის მიმართ.
HEN: $P = \dfrac{\mathcal{E}^2 R}{(R + r)^2}$ — a quadratic in $R$.
SKA: **ფორმულა:** $P (R + r)^2 = \mathcal{E}^2 R$
**რიცხვები:** $5(R + 1)^2 = 36R \Rightarrow 5R^2 - 26R + 5 = 0 \Rightarrow R = 5\ \text{ომი}$ ან $R = 0{,}2\ \text{ომი}$
ერთი და იგივე სიმძლავრე მიიღება დიდი წინაღობისას (მცირე დენი) და მცირე წინაღობისას (დიდი დენი); ორივე პასუხის ნამრავლი $r^2 = 1$-ია.
SEN: **Formula:** $P (R + r)^2 = \mathcal{E}^2 R$
**Numbers:** $5(R + 1)^2 = 36R \Rightarrow 5R^2 - 26R + 5 = 0 \Rightarrow R = 5\ \Omega$ or $R = 0.2\ \Omega$
The same power comes from a large resistance (small current) or a small one (large current); the two answers multiply to $r^2 = 1$.
AKA: $5\ \text{ომი}$ ან $0{,}2\ \text{ომი}$
AEN: $5\ \Omega$ or $0.2\ \Omega$

--- hard emf
KA: იპოვეთ წყაროს სმკ (სასარგებლო სიმძლავრის შეფარდება სრულ სიმძლავრესთან), თუ $R = 9\ \text{ომი}$, $r = 1\ \text{ომი}$. რას უდრის სმკ მაქსიმალური სასარგებლო სიმძლავრისას?
EN: Find the efficiency of a source (useful power over total power) when $R = 9\ \Omega$ and $r = 1\ \Omega$. What is the efficiency at maximum useful power?
HKA: $\eta = \dfrac{I^2 R}{I^2 (R + r)} = \dfrac{R}{R + r}$.
HEN: $\eta = \dfrac{I^2 R}{I^2 (R + r)} = \dfrac{R}{R + r}$.
SKA: **ფორმულა:** $\eta = \dfrac{R}{R + r}$
**რიცხვები:** $\eta = \dfrac{9}{10} = 90\%$
მაქსიმალური სიმძლავრე $R = r$-ისას: $\eta = \dfrac{r}{2r} = 50\%$ — ნახევარი ენერგია წყაროს შიგნით იკარგება.
SEN: **Formula:** $\eta = \dfrac{R}{R + r}$
**Numbers:** $\eta = \dfrac{9}{10} = 90\%$
Maximum power is at $R = r$: $\eta = \dfrac{r}{2r} = 50\%$ — half the energy is lost inside the source.
AKA: $90\%$; $50\%$
AEN: $90\%$; $50\%$

--- hard power
KA: გამათბობლის სპირალი გადაიწვა და ბოლოები გადააბეს, რის გამოც სპირალი $10\%$-ით დამოკლდა. როგორ შეიცვლება გამათბობლის სიმძლავრე იმავე ქსელში?
EN: A heater's coil burns through and is rejoined, making it $10\%$ shorter. How does the heater's power change on the same mains?
HKA: $P = \dfrac{U^2}{R}$, $R \sim l$.
HEN: $P = \dfrac{U^2}{R}$, $R \propto l$.
SKA: **ფორმულა:** $\dfrac{P_2}{P_1} = \dfrac{R_1}{R_2} = \dfrac{l_1}{l_2}$
**რიცხვები:** $\dfrac{P_2}{P_1} = \dfrac{1}{0{,}9} \approx 1{,}11$ — სიმძლავრე $\approx 11\%$-ით გაიზრდება (და სპირალი უფრო მეტად გაცხელდება).
SEN: **Formula:** $\dfrac{P_2}{P_1} = \dfrac{R_1}{R_2} = \dfrac{l_1}{l_2}$
**Numbers:** $\dfrac{P_2}{P_1} = \dfrac{1}{0.9} \approx 1.11$ — the power rises by $\approx 11\%$ (and the coil runs hotter).
AKA: $\approx 11\%$-ით გაიზრდება
AEN: it rises by $\approx 11\%$

--- hard power
KA: ელექტრომობილის აკუმულატორის ტევადობაა $50\ \text{კვტ}\cdot\text{სთ}$, მოხმარება — $15\ \text{კვტ}\cdot\text{სთ}$ $100\ \text{კმ}$-ზე. რა მანძილს გაივლის ის ერთი დამუხტვით? რამდენ ხანს იმუხტება $7\ \text{კვტ}$ სადამუხტზე?
EN: An electric car has a $50\ \text{kWh}$ battery and uses $15\ \text{kWh}$ per $100\ \text{km}$. How far can it go on one charge? How long does it take to charge on a $7\ \text{kW}$ charger?
HKA: $t = \dfrac{W}{P}$.
HEN: $t = \dfrac{W}{P}$.
SKA: **ფორმულა:** $s = \dfrac{W}{w} \cdot 100\ \text{კმ}$, $\ t = \dfrac{W}{P}$
**რიცხვები:** $s = \dfrac{50}{15} \cdot 100 \approx 333\ \text{კმ}$, $\ t = \dfrac{50}{7} \approx 7{,}1\ \text{სთ}$
SEN: **Formula:** $s = \dfrac{W}{w} \cdot 100\ \text{km}$, $\ t = \dfrac{W}{P}$
**Numbers:** $s = \dfrac{50}{15} \cdot 100 \approx 333\ \text{km}$, $\ t = \dfrac{50}{7} \approx 7.1\ \text{h}$
AKA: $\approx 333\ \text{კმ}$; $\approx 7\ \text{სთ}$
AEN: $\approx 333\ \text{km}$; $\approx 7\ \text{h}$

--- hard media
KA: $100\ \text{სმ}^2$ ზედაპირის დეტალი $0{,}02\ \text{მმ}$ სისქის ნიკელის ფენით უნდა დაიფაროს $2\ \text{ა}$ დენით. რა დრო დასჭირდება? (ნიკელი: $\rho = 8900\ \text{კგ/მ}^3$, $k = 3 \cdot 10^{-7}\ \text{კგ/კ}$)
EN: A part with surface area $100\ \text{cm}^2$ is to be coated with nickel $0.02\ \text{mm}$ thick using $2\ \text{A}$. How long does it take? (Nickel: $\rho = 8900\ \text{kg/m}^3$, $k = 3 \times 10^{-7}\ \text{kg/C}$)
HKA: ჯერ ფენის მოცულობა და მასა: $m = \rho S d$.
HEN: First the layer's volume and mass: $m = \rho S d$.
SKA: **ფორმულა:** $m = \rho S d$, $\ t = \dfrac{m}{k I}$
**რიცხვები:** $V = 10^{-2} \cdot 2 \cdot 10^{-5} = 2 \cdot 10^{-7}\ \text{მ}^3$, $\ m = 8900 \cdot 2 \cdot 10^{-7} = 1{,}78 \cdot 10^{-3}\ \text{კგ}$
$t = \dfrac{1{,}78 \cdot 10^{-3}}{3 \cdot 10^{-7} \cdot 2} \approx 2970\ \text{წმ} \approx 50\ \text{წთ}$
SEN: **Formula:** $m = \rho S d$, $\ t = \dfrac{m}{k I}$
**Numbers:** $V = 10^{-2} \cdot 2 \times 10^{-5} = 2 \times 10^{-7}\ \text{m}^3$, $\ m = 8900 \cdot 2 \times 10^{-7} = 1.78 \times 10^{-3}\ \text{kg}$
$t = \dfrac{1.78 \times 10^{-3}}{3 \times 10^{-7} \cdot 2} \approx 2970\ \text{s} \approx 50\ \text{min}$
AKA: $\approx 50\ \text{წთ}$
AEN: $\approx 50\ \text{min}$

--- hard current
KA: სპილენძის მავთულში ($S = 1\ \text{მმ}^2$) $1\ \text{ა}$ დენი გადის. თავისუფალი ელექტრონების კონცენტრაციაა $n = 8{,}5 \cdot 10^{28}\ \text{მ}^{-3}$. იპოვეთ ელექტრონების მოწესრიგებული მოძრაობის (დრეიფის) სიჩქარე. რატომ ინთება ნათურა მყისიერად?
EN: A copper wire ($S = 1\ \text{mm}^2$) carries $1\ \text{A}$. The free-electron density is $n = 8.5 \times 10^{28}\ \text{m}^{-3}$. Find the electrons' drift speed. Why does a lamp light up instantly?
HKA: $I = n e v S$.
HEN: $I = n e v S$.
SKA: **ფორმულა:** $v = \dfrac{I}{n e S}$
**რიცხვები:** $v = \dfrac{1}{8{,}5 \cdot 10^{28} \cdot 1{,}6 \cdot 10^{-19} \cdot 10^{-6}} \approx 7{,}4 \cdot 10^{-5}\ \text{მ/წმ}$ — დაახლოებით $0{,}07\ \text{მმ/წმ}$, ლოკოკინაზე ნელა!
ნათურა მყისიერად ინთება, რადგან ელექტრული ველი სადენში თითქმის სინათლის სიჩქარით ვრცელდება და ყველა ელექტრონს ერთდროულად ამოძრავებს.
SEN: **Formula:** $v = \dfrac{I}{n e S}$
**Numbers:** $v = \dfrac{1}{8.5 \times 10^{28} \cdot 1.6 \times 10^{-19} \cdot 10^{-6}} \approx 7.4 \times 10^{-5}\ \text{m/s}$ — about $0.07\ \text{mm/s}$, slower than a snail!
The lamp lights instantly because the electric field travels along the wire at nearly the speed of light, setting all the electrons moving at once.
AKA: $\approx 7{,}4 \cdot 10^{-5}\ \text{მ/წმ}$
AEN: $\approx 7.4 \times 10^{-5}\ \text{m/s}$

--- hard circuits olympiad
KA: ტეტრაედრის $6$ წიბოდან თითოეული $R$ წინაღობის რეზისტორია. იპოვეთ წინაღობა ტეტრაედრის ორ წვეროს შორის.
EN: Each of the $6$ edges of a tetrahedron is a resistor $R$. Find the resistance between two of its vertices.
HKA: სიმეტრიის გამო დანარჩენი ორი წვერო ერთ პოტენციალზეა — მათ შორის წიბოში დენი არ გადის.
HEN: By symmetry the other two vertices are at the same potential — no current flows in the edge between them.
SKA: ვთქვათ, ვზომავთ $A$-სა და $B$-ს შორის; $C$ და $D$ სიმეტრიულია $\Rightarrow \varphi_C = \varphi_D$, $CD$ წიბო შეიძლება მოვაშოროთ.
დარჩა სამი პარალელური გზა: $AB$ ($R$), $A\!-\!C\!-\!B$ ($2R$), $A\!-\!D\!-\!B$ ($2R$).
**ფორმულა:** $\dfrac{1}{R_{AB}} = \dfrac{1}{R} + \dfrac{1}{2R} + \dfrac{1}{2R} = \dfrac{2}{R} \Rightarrow R_{AB} = \dfrac{R}{2}$
SEN: Say we measure between $A$ and $B$; $C$ and $D$ are symmetric $\Rightarrow \varphi_C = \varphi_D$, so edge $CD$ can be removed.
Three parallel paths remain: $AB$ ($R$), $A\!-\!C\!-\!B$ ($2R$), $A\!-\!D\!-\!B$ ($2R$).
**Formula:** $\dfrac{1}{R_{AB}} = \dfrac{1}{R} + \dfrac{1}{2R} + \dfrac{1}{2R} = \dfrac{2}{R} \Rightarrow R_{AB} = \dfrac{R}{2}$
AKA: $\dfrac{R}{2}$
AEN: $\dfrac{R}{2}$

--- hard capacitor olympiad
KA: $2\ \text{მკფ}$ კონდენსატორი $100\ \text{ვ}$-მდეა დამუხტული, $3\ \text{მკფ}$ კი — $50\ \text{ვ}$-მდე. ისინი ერთმანეთს **საწინააღმდეგო** პოლუსებით (პლუსი მინუსთან) შეაერთეს. იპოვეთ საბოლოო ძაბვა.
EN: A $2\ \mu\text{F}$ capacitor is charged to $100\ \text{V}$ and a $3\ \mu\text{F}$ one to $50\ \text{V}$. They are connected with **opposite** polarities (plus to minus). Find the final voltage.
HKA: შეერთებულ ფირფიტებზე მუხტები ალგებრულად იკრიბება — ნაწილობრივ ბათილდება.
HEN: On the joined plates the charges add algebraically — partly cancelling.
SKA: **ფორმულა:** $q = |q_1 - q_2|$, $\ U = \dfrac{q}{C_1 + C_2}$
**რიცხვები:** $q_1 = 200\ \text{მკკ}$, $\ q_2 = 150\ \text{მკკ}$, $\ q = 50\ \text{მკკ}$
$U = \dfrac{50}{5} = 10\ \text{ვ}$ (თითქმის მთელი ენერგია სითბოდ იქცა)
SEN: **Formula:** $q = |q_1 - q_2|$, $\ U = \dfrac{q}{C_1 + C_2}$
**Numbers:** $q_1 = 200\ \mu\text{C}$, $\ q_2 = 150\ \mu\text{C}$, $\ q = 50\ \mu\text{C}$
$U = \dfrac{50}{5} = 10\ \text{V}$ (almost all the energy became heat)
AKA: $10\ \text{ვ}$
AEN: $10\ \text{V}$

--- hard coulomb olympiad
KA: ორი ერთნაირი ლითონის ბურთულა ერთმანეთს იზიდავს. მათ შეახეს და იმავე მანძილზე დააბრუნეს — ახლა ისინი განიზიდება საწყისი ძალის $0{,}8$-ის ტოლი ძალით. რა შეფარდება ჰქონდა საწყის მუხტებს?
EN: Two identical metal balls attract each other. They are touched and returned to the same distance — now they repel with $0.8$ of the original force. What was the ratio of the original charges?
HKA: დაუშვით მუხტები $q$ და $-nq$. შეხების შემდეგ თითოეულზე $\dfrac{(1 - n)q}{2}$.
HEN: Let the charges be $q$ and $-nq$. After touching each has $\dfrac{(1 - n)q}{2}$.
SKA: **ფორმულა:** $F_1 \sim n q^2$, $\ F_2 \sim \dfrac{(1 - n)^2 q^2}{4}$, $\ \dfrac{F_2}{F_1} = \dfrac{(1 - n)^2}{4n} = 0{,}8$
**რიცხვები:** $(1 - n)^2 = 3{,}2n \Rightarrow n^2 - 5{,}2n + 1 = 0 \Rightarrow n = 5$ ან $n = 0{,}2$
ორივე ერთსა და იმავეს ნიშნავს: მუხტები მოდულით $5 : 1$ შეეფარდება (მაგ., $+5$ და $-1$).
SEN: **Formula:** $F_1 \propto n q^2$, $\ F_2 \propto \dfrac{(1 - n)^2 q^2}{4}$, $\ \dfrac{F_2}{F_1} = \dfrac{(1 - n)^2}{4n} = 0.8$
**Numbers:** $(1 - n)^2 = 3.2n \Rightarrow n^2 - 5.2n + 1 = 0 \Rightarrow n = 5$ or $n = 0.2$
Both mean the same thing: the charges are in the ratio $5 : 1$ in size (e.g. $+5$ and $-1$).
AKA: $5 : 1$
AEN: $5 : 1$

--- hard emf olympiad
KA: ორი ბატარეა — $\mathcal{E}_1 = 6\ \text{ვ}$, $r_1 = 1\ \text{ომი}$ და $\mathcal{E}_2 = 3\ \text{ვ}$, $r_2 = 2\ \text{ომი}$ — ერთნაირი პოლუსებით პარალელურად შეაერთეს (გარე დატვირთვის გარეშე). იპოვეთ ძაბვა მომჭერებზე და დენი. რომელი ბატარეა იმუხტება?
EN: Two batteries — $\mathcal{E}_1 = 6\ \text{V}$, $r_1 = 1\ \Omega$ and $\mathcal{E}_2 = 3\ \text{V}$, $r_2 = 2\ \Omega$ — are connected in parallel, like poles together (no external load). Find the terminal voltage and the current. Which battery is being charged?
HKA: შეკრულ წრედში დენი $I = \dfrac{\mathcal{E}_1 - \mathcal{E}_2}{r_1 + r_2}$.
HEN: In the closed loop the current is $I = \dfrac{\mathcal{E}_1 - \mathcal{E}_2}{r_1 + r_2}$.
SKA: **ფორმულა:** $I = \dfrac{\mathcal{E}_1 - \mathcal{E}_2}{r_1 + r_2}$, $\ U = \mathcal{E}_1 - I r_1$
**რიცხვები:** $I = \dfrac{6 - 3}{3} = 1\ \text{ა}$, $\ U = 6 - 1 = 5\ \text{ვ}$ (შემოწმება: $3 + 1 \cdot 2 = 5$ ✓)
პირველი ბატარეა მეორეს **მუხტავს** — დენი მეორეში ემძალის საწინააღმდეგოდ გადის.
SEN: **Formula:** $I = \dfrac{\mathcal{E}_1 - \mathcal{E}_2}{r_1 + r_2}$, $\ U = \mathcal{E}_1 - I r_1$
**Numbers:** $I = \dfrac{6 - 3}{3} = 1\ \text{A}$, $\ U = 6 - 1 = 5\ \text{V}$ (check: $3 + 1 \cdot 2 = 5$ ✓)
The first battery **charges** the second — current flows through the second against its EMF.
AKA: $5\ \text{ვ}$; $1\ \text{ა}$; მეორე იმუხტება
AEN: $5\ \text{V}$; $1\ \text{A}$; the second is charged

--- hard power olympiad
KA: ერთი და იმავე მასალის ორ მავთულში ერთი და იგივე დენი გადის; პირველის დიამეტრი მეორისაზე ორჯერ მეტია. რამდენჯერ მეტი სითბო გამოიყოფა თხელ მავთულში ერთეულ სიგრძეზე? ერთეულ მოცულობაზე? რატომ იწვება მცველი თხელი მავთულით?
EN: The same current flows through two wires of the same material; the first has twice the diameter of the second. How many times more heat is released in the thin wire per unit length? Per unit volume? Why is a fuse made of thin wire?
HKA: $P = I^2 R$, $R \sim \dfrac{l}{d^2}$; მოცულობა $\sim l d^2$.
HEN: $P = I^2 R$, $R \propto \dfrac{l}{d^2}$; volume $\propto l d^2$.
SKA: **ფორმულა:** სიგრძეზე: $\dfrac{P}{l} \sim \dfrac{I^2}{d^2}$; მოცულობაზე: $\dfrac{P}{V} \sim \dfrac{I^2}{d^4}$
**რიცხვები:** დიამეტრი $2$-ჯერ ნაკლები: სიგრძეზე $2^2 = 4$-ჯერ მეტი, მოცულობაზე $2^4 = 16$-ჯერ მეტი სითბო.
თხელი მავთული ბევრად სწრაფად ცხელდება და დნება, ამიტომ გადატვირთვისას მცველი პირველი იწვება და წრედს წყვეტს.
SEN: **Formula:** per length: $\dfrac{P}{l} \propto \dfrac{I^2}{d^2}$; per volume: $\dfrac{P}{V} \propto \dfrac{I^2}{d^4}$
**Numbers:** half the diameter: $2^2 = 4$ times more heat per length, $2^4 = 16$ times more per volume.
The thin wire heats and melts much faster, so on overload the fuse burns first and breaks the circuit.
AKA: $4$-ჯერ; $16$-ჯერ
AEN: $4$ times; $16$ times

AEN: $\approx 6.25 \times 10^{18}$

--- easy charge
KA: რომელი ნაწილაკები გადადის ერთი სხეულიდან მეორეზე ელექტრიზაციისას ხახუნით — პროტონები თუ ელექტრონები? რატომ?
EN: Which particles move from one body to another during charging by friction — protons or electrons? Why?
HKA: რომელი ნაწილაკია ატომში სუსტად შეკავებული?
HEN: Which particles are loosely held in atoms?
SKA: ელექტრონები — ისინი ატომის გარე ნაწილში არიან და ზოგი მათგანი სუსტადაა დაკავშირებული. პროტონები ბირთვშია, მყარად.
SEN: Electrons — they are in the outer part of the atom and some are loosely bound. Protons are held tightly in the nucleus.
AKA: ელექტრონები
AEN: electrons

--- easy charge
KA: ელექტროსკოპის ფურცლები გაიშალა. რას ნიშნავს ეს? შეიძლება თუ არა ელექტროსკოპით მუხტის ნიშნის გაგება?
EN: The leaves of an electroscope spread apart. What does this mean? Can an electroscope tell the sign of the charge?
HKA: ფურცლებს ერთნაირი ნიშნის მუხტი აქვთ.
HEN: The leaves have like charges.
SKA: ფურცლები ერთნაირად დამუხტულია და განიზიდება.
თავად ნიშანს ვერ აჩვენებს, მაგრამ ცნობილი ნიშნის მუხტის მიახლოებით შეიძლება: თუ გაშლა გაიზარდა, ნიშანი იგივეა.
SEN: The leaves carry like charges and repel.
It can't show the sign by itself, but bringing a known charge near can: if the spread increases, the sign is the same.
AKA: დამუხტულია; ნიშანი — მხოლოდ ცნობილი მუხტის დახმარებით
AEN: it's charged; the sign only with a known charge

--- easy charge
KA: სამი ერთნაირი ბურთულა: $+6\ \text{ნკ}$, $-2\ \text{ნკ}$ და $+5\ \text{ნკ}$. ისინი ერთად შეახეს და დააშორეს. რა მუხტი ექნება თითოეულს?
EN: Three identical balls carry $+6\ \text{nC}$, $-2\ \text{nC}$ and $+5\ \text{nC}$. They are touched together and separated. What is each one's charge?
HKA: ჯამი სამად იყოფა.
HEN: The total is split three ways.
SKA: $q = \dfrac{6 - 2 + 5}{3} = 3\ \text{ნკ}$
SEN: $q = \dfrac{6 - 2 + 5}{3} = 3\ \text{nC}$
AKA: $+3\ \text{ნკ}$
AEN: $+3\ \text{nC}$

--- easy charge
KA: გამტარი თუ იზოლატორია: სპილენძი, მინა, მარილიანი წყალი, რეზინი, ადამიანის სხეული, მშრალი ჰაერი?
EN: Conductor or insulator: copper, glass, salt water, rubber, the human body, dry air?
HKA: გამტარში თავისუფალი მუხტები არსებობს.
HEN: A conductor has free charges.
SKA: გამტარები: სპილენძი, მარილიანი წყალი, ადამიანის სხეული.
იზოლატორები: მინა, რეზინი, მშრალი ჰაერი.
SEN: Conductors: copper, salt water, the human body.
Insulators: glass, rubber, dry air.
AKA: გამტ.: სპილენძი, მარილიანი წყალი, სხეული; იზოლ.: მინა, რეზინი, ჰაერი
AEN: conductors: copper, salt water, body; insulators: glass, rubber, air

--- easy charge
KA: პროტონის მუხტია $+e$, ელექტრონის — $-e$. რა მუხტი აქვს ჰელიუმის ბირთვს (2 პროტონი, 2 ნეიტრონი)? ნეიტრალურ ატომს?
EN: A proton has charge $+e$, an electron $-e$. What is the charge of a helium nucleus (2 protons, 2 neutrons)? Of a neutral atom?
HKA: ნეიტრონი ნეიტრალურია.
HEN: A neutron is neutral.
SKA: ბირთვი: $+2e = 3{,}2 \cdot 10^{-19}\ \text{კ}$.
ნეიტრალური ატომი: $+2e - 2e = 0$.
SEN: Nucleus: $+2e = 3.2 \times 10^{-19}\ \text{C}$.
Neutral atom: $+2e - 2e = 0$.
AKA: $+2e$; $0$
AEN: $+2e$; $0$

--- easy charge
KA: სინთეტიკური სვიტრის გახდისას ზოგჯერ ტკაცუნი ისმის და ნაპერწკლები ჩანს. რატომ?
EN: Taking off a synthetic jumper sometimes makes crackling sounds and sparks. Why?
HKA: ხახუნით ელექტრიზაცია.
HEN: Charging by friction.
SKA: სინთეტიკური ქსოვილი თმასა და სხვა ტანსაცმელზე ხახუნისას იმუხტება. დიდი მუხტისას ჰაერი იონიზდება და ნაპერწკალი (მცირე განმუხტვა) წარმოიქმნება.
SEN: Synthetic fabric gets charged by rubbing on hair and other clothes. With enough charge the air ionises and a small spark (discharge) jumps.
AKA: ხახუნით ელექტრიზაცია და განმუხტვა
AEN: charging by friction and discharge

--- easy charge
KA: მუხტი $q = -4{,}8\ \text{ნკ}$. რამდენი ზედმეტი ელექტრონია?
EN: A charge is $q = -4.8\ \text{nC}$. How many excess electrons is that?
HKA: $N = \dfrac{|q|}{e}$.
HEN: $N = \dfrac{|q|}{e}$.
SKA: $N = \dfrac{4{,}8 \cdot 10^{-9}}{1{,}6 \cdot 10^{-19}} = 3 \cdot 10^{10}$
SEN: $N = \dfrac{4.8 \times 10^{-9}}{1.6 \times 10^{-19}} = 3 \times 10^{10}$
AKA: $3 \cdot 10^{10}$
AEN: $3 \times 10^{10}$

--- medium charge
KA: ორი ერთნაირი ბურთულა: $+8\ \text{ნკ}$ და $-4\ \text{ნკ}$. ისინი შეახეს და დააშორეს. რამდენი ელექტრონი გადავიდა და საით?
EN: Two identical balls carry $+8\ \text{nC}$ and $-4\ \text{nC}$. They touch and separate. How many electrons moved, and in which direction?
HKA: საბოლოოდ ორივეს $+2\ \text{ნკ}$ აქვს.
HEN: In the end each has $+2\ \text{nC}$.
SKA: უარყოფითი ბურთულის მუხტი $-4$-დან $+2$-მდე შეიცვალა: დაკარგა $6\ \text{ნკ}$ ელექტრონული მუხტი.
$N = \dfrac{6 \cdot 10^{-9}}{1{,}6 \cdot 10^{-19}} \approx 3{,}75 \cdot 10^{10}$ ელექტრონი, უარყოფითიდან დადებითზე.
SEN: The negative ball went from $-4$ to $+2$: it lost $6\ \text{nC}$ worth of electrons.
$N = \dfrac{6 \times 10^{-9}}{1.6 \times 10^{-19}} \approx 3.75 \times 10^{10}$ electrons, from the negative ball to the positive one.
AKA: $\approx 3{,}75 \cdot 10^{10}$, უარყოფითიდან დადებითზე
AEN: $\approx 3.75 \times 10^{10}$, from negative to positive

--- medium charge
KA: როგორ შეიძლება დავმუხტოთ ორი ლითონის ბურთულა ტოლი და საპირისპირო მუხტით, თუ მხოლოდ დამუხტული ჯოხი გვაქვს და ჯოხი ბურთულებს არ უნდა შეეხოს?
EN: How can two metal balls be given equal and opposite charges using only a charged rod that must not touch them?
HKA: ინდუქციით ელექტრიზაცია.
HEN: Charging by induction.
SKA: ბურთულები ერთმანეთს შეახეთ. დამუხტული ჯოხი ერთს მიუახლოვეთ — მუხტები გადანაწილდება (ახლო ბურთულაზე საპირისპირო, შორეულზე — ერთნაირი).
ჯოხის მოშორების გარეშე ბურთულები დააშორეთ, შემდეგ ჯოხი აიღეთ — ბურთულებს ტოლი და საპირისპირო მუხტი დარჩება.
SEN: Touch the balls together. Bring the rod near one — charges redistribute (opposite on the near ball, like on the far one).
With the rod still there, separate the balls, then remove the rod — they keep equal and opposite charges.
AKA: ინდუქციით: შეხება, ჯოხის მიახლოება, დაშორება
AEN: by induction: touch, bring the rod near, separate

--- medium charge
KA: ბურთულა (მასა $0{,}1\ \text{გ}$) $10^{10}$ ზედმეტ ელექტრონს ატარებს. რამდენჯერ იზრდება მისი მასა ამის გამო? ($m_e = 9{,}1 \cdot 10^{-31}\ \text{კგ}$)
EN: A $0.1\ \text{g}$ ball carries $10^{10}$ extra electrons. By what fraction does its mass increase?
HKA: $\Delta m = N m_e$.
HEN: $\Delta m = N m_e$.
SKA: $\Delta m = 10^{10} \cdot 9{,}1 \cdot 10^{-31} = 9{,}1 \cdot 10^{-21}\ \text{კგ}$
$\dfrac{\Delta m}{m} = \dfrac{9{,}1 \cdot 10^{-21}}{10^{-4}} \approx 10^{-16}$ — სრულიად უმნიშვნელოა.
SEN: $\Delta m = 10^{10} \cdot 9.1 \times 10^{-31} = 9.1 \times 10^{-21}\ \text{kg}$
$\dfrac{\Delta m}{m} = \dfrac{9.1 \times 10^{-21}}{10^{-4}} \approx 10^{-16}$ — utterly negligible.
AKA: $\approx 10^{-16}$ ნაწილით
AEN: by about $10^{-16}$

--- medium charge
KA: სამი ერთნაირი ბურთულიდან ერთს $q$ მუხტი აქვს, დანარჩენი ნეიტრალურია. დამუხტული ბურთულა ჯერ მეორეს შეახეს, შემდეგ მესამეს. რა მუხტი ექნება თითოეულს?
EN: Of three identical balls one has charge $q$ and the others are neutral. The charged ball touches the second, then the third. What is each ball's charge?
HKA: ყოველ შეხებაზე მუხტი ორ ტოლ ნაწილად იყოფა.
HEN: Each touch splits the charge equally between two balls.
SKA: I შეხება: $\dfrac{q}{2}$ და $\dfrac{q}{2}$.
II შეხება: $\dfrac{q}{4}$ და $\dfrac{q}{4}$.
საბოლოოდ: პირველი — $\dfrac{q}{4}$, მეორე — $\dfrac{q}{2}$, მესამე — $\dfrac{q}{4}$.
SEN: First touch: $\dfrac{q}{2}$ and $\dfrac{q}{2}$.
Second touch: $\dfrac{q}{4}$ and $\dfrac{q}{4}$.
Finally: first — $\dfrac{q}{4}$, second — $\dfrac{q}{2}$, third — $\dfrac{q}{4}$.
AKA: $\dfrac{q}{4}$, $\dfrac{q}{2}$, $\dfrac{q}{4}$
AEN: $\dfrac{q}{4}$, $\dfrac{q}{2}$, $\dfrac{q}{4}$

--- easy coulomb
KA: ორი $1\ \text{მკკ}$ მუხტი $0{,}1\ \text{მ}$ მანძილზეა. იპოვეთ ურთიერთქმედების ძალა.
EN: Two $1\ \mu\text{C}$ charges are $0.1\ \text{m}$ apart. Find the force between them.
HKA: $F = k \dfrac{q_1 q_2}{r^2}$.
HEN: $F = k \dfrac{q_1 q_2}{r^2}$.
SKA: $F = 9 \cdot 10^9 \cdot \dfrac{10^{-12}}{10^{-2}} = 0{,}9\ \text{ნ}$
SEN: $F = 9 \times 10^9 \cdot \dfrac{10^{-12}}{10^{-2}} = 0.9\ \text{N}$
AKA: $0{,}9\ \text{ნ}$
AEN: $0.9\ \text{N}$

--- easy coulomb
KA: როგორ შეიცვლება ორი მუხტის ურთიერთქმედების ძალა, თუ მანძილს $2$-ჯერ შევამცირებთ?
EN: How does the force between two charges change if the distance is halved?
HKA: $F \sim \dfrac{1}{r^2}$.
HEN: $F \sim \dfrac{1}{r^2}$.
SKA: $F' = F \cdot 2^2 = 4F$ — $4$-ჯერ გაიზრდება.
SEN: $F' = F \cdot 2^2 = 4F$ — it becomes $4$ times larger.
AKA: $4$-ჯერ გაიზრდება
AEN: it increases $4$ times

--- easy coulomb
KA: ერთი მუხტი $2$-ჯერ გაზარდეს, მეორე $3$-ჯერ. მანძილი არ შეცვლილა. როგორ შეიცვალა ძალა?
EN: One charge is doubled and the other tripled; the distance is unchanged. How does the force change?
HKA: $F \sim q_1 q_2$.
HEN: $F \sim q_1 q_2$.
SKA: $F' = 2 \cdot 3 \cdot F = 6F$
SEN: $F' = 2 \cdot 3 \cdot F = 6F$
AKA: $6$-ჯერ გაიზრდება
AEN: it increases $6$ times

--- easy coulomb
KA: $+3\ \text{ნკ}$ და $-3\ \text{ნკ}$ მუხტი $3\ \text{სმ}$-ზეა. იპოვეთ ძალა. მიზიდვაა თუ განზიდვა?
EN: Charges of $+3\ \text{nC}$ and $-3\ \text{nC}$ are $3\ \text{cm}$ apart. Find the force. Is it attraction or repulsion?
HKA: საპირისპირო ნიშნის მუხტები იზიდება.
HEN: Opposite charges attract.
SKA: $F = 9 \cdot 10^9 \cdot \dfrac{9 \cdot 10^{-18}}{9 \cdot 10^{-4}} = 9 \cdot 10^{-5}\ \text{ნ}$, მიზიდვა.
SEN: $F = 9 \times 10^9 \cdot \dfrac{9 \times 10^{-18}}{9 \times 10^{-4}} = 9 \times 10^{-5}\ \text{N}$, attraction.
AKA: $9 \cdot 10^{-5}\ \text{ნ}$, მიზიდვა
AEN: $9 \times 10^{-5}\ \text{N}$, attraction

--- easy coulomb
KA: ორ ტოლ მუხტს შორის $0{,}3\ \text{მ}$-ზე ძალა $0{,}1\ \text{ნ}$-ია. იპოვეთ მუხტები.
EN: Two equal charges $0.3\ \text{m}$ apart repel with $0.1\ \text{N}$. Find the charges.
HKA: $q = r\sqrt{\dfrac{F}{k}}$.
HEN: $q = r\sqrt{\dfrac{F}{k}}$.
SKA: $q = 0{,}3 \sqrt{\dfrac{0{,}1}{9 \cdot 10^9}} = 0{,}3 \cdot \dfrac{10^{-5}}{3} = 10^{-6}\ \text{კ} = 1\ \text{მკკ}$
SEN: $q = 0.3 \sqrt{\dfrac{0.1}{9 \times 10^9}} = 0.3 \cdot \dfrac{10^{-5}}{3} = 10^{-6}\ \text{C} = 1\ \mu\text{C}$
AKA: $1\ \text{მკკ}$
AEN: $1\ \mu\text{C}$

--- easy coulomb
KA: რა მანძილზე ურთიერთქმედებს $2\ \text{მკკ}$ და $5\ \text{მკკ}$ მუხტები $1\ \text{ნ}$ ძალით?
EN: At what distance do $2\ \mu\text{C}$ and $5\ \mu\text{C}$ charges interact with $1\ \text{N}$?
HKA: $r = \sqrt{\dfrac{k q_1 q_2}{F}}$.
HEN: $r = \sqrt{\dfrac{k q_1 q_2}{F}}$.
SKA: $r = \sqrt{9 \cdot 10^9 \cdot 10^{-11}} = \sqrt{0{,}09} = 0{,}3\ \text{მ}$
SEN: $r = \sqrt{9 \times 10^9 \cdot 10^{-11}} = \sqrt{0.09} = 0.3\ \text{m}$
AKA: $0{,}3\ \text{მ}$
AEN: $0.3\ \text{m}$

--- easy coulomb
KA: წყალში ($\varepsilon = 81$) მუხტების ურთიერთქმედება რამდენჯერ სუსტია, ვიდრე ვაკუუმში? რატომ იხსნება მარილი წყალში ადვილად?
EN: How many times weaker is the force between charges in water ($\varepsilon = 81$) than in a vacuum? Why does salt dissolve easily in water?
HKA: $F = \dfrac{k q_1 q_2}{\varepsilon r^2}$.
HEN: $F = \dfrac{k q_1 q_2}{\varepsilon r^2}$.
SKA: $81$-ჯერ სუსტია.
მარილის კრისტალში იონებს ($\text{Na}^+$, $\text{Cl}^-$) ერთმანეთთან ელექტრული ძალა აკავშირებს; წყალში ის $81$-ჯერ სუსტდება და იონები ადვილად სცილდება.
SEN: $81$ times weaker.
In a salt crystal the ions ($\text{Na}^+$, $\text{Cl}^-$) are held by electric forces; in water these are $81$ times weaker, so the ions separate easily.
AKA: $81$-ჯერ
AEN: $81$ times

--- easy coulomb
KA: ელექტრონი და პროტონი წყალბადის ატომში $5 \cdot 10^{-11}\ \text{მ}$ მანძილზეა. იპოვეთ მიზიდვის ძალა.
EN: In a hydrogen atom the electron and proton are $5 \times 10^{-11}\ \text{m}$ apart. Find the force of attraction.
HKA: $F = k \dfrac{e^2}{r^2}$.
HEN: $F = k \dfrac{e^2}{r^2}$.
SKA: $F = 9 \cdot 10^9 \cdot \dfrac{2{,}56 \cdot 10^{-38}}{25 \cdot 10^{-22}} \approx 9{,}2 \cdot 10^{-8}\ \text{ნ}$
SEN: $F = 9 \times 10^9 \cdot \dfrac{2.56 \times 10^{-38}}{25 \times 10^{-22}} \approx 9.2 \times 10^{-8}\ \text{N}$
AKA: $\approx 9{,}2 \cdot 10^{-8}\ \text{ნ}$
AEN: $\approx 9.2 \times 10^{-8}\ \text{N}$

--- medium coulomb
KA: ორი ერთნაირი ბურთულა $+2\ \text{მკკ}$ და $-6\ \text{მკკ}$ მუხტით $0{,}3\ \text{მ}$-ზეა. იპოვეთ ძალა. ისინი შეახეს და ისევ $0{,}3\ \text{მ}$-ზე დააბრუნეს — რა იქნება ძალა?
EN: Two identical balls with $+2\ \mu\text{C}$ and $-6\ \mu\text{C}$ are $0.3\ \text{m}$ apart. Find the force. They are touched and put back $0.3\ \text{m}$ apart — what is the force now?
HKA: შეხების შემდეგ ორივეს $-2\ \text{მკკ}$ აქვს.
HEN: After touching each has $-2\ \mu\text{C}$.
SKA: თავიდან: $F = 9 \cdot 10^9 \cdot \dfrac{12 \cdot 10^{-12}}{0{,}09} = 1{,}2\ \text{ნ}$ (მიზიდვა)
შემდეგ: $F = 9 \cdot 10^9 \cdot \dfrac{4 \cdot 10^{-12}}{0{,}09} = 0{,}4\ \text{ნ}$ (განზიდვა)
SEN: Before: $F = 9 \times 10^9 \cdot \dfrac{12 \times 10^{-12}}{0.09} = 1.2\ \text{N}$ (attraction)
After: $F = 9 \times 10^9 \cdot \dfrac{4 \times 10^{-12}}{0.09} = 0.4\ \text{N}$ (repulsion)

--- medium coulomb
KA: სამი მუხტი ერთ წრფეზეა: $q_1 = +1\ \text{მკკ}$ ($x = 0$), $q_2 = +2\ \text{მკკ}$ ($x = 0{,}1\ \text{მ}$), $q_3 = -1\ \text{მკკ}$ ($x = 0{,}2\ \text{მ}$). იპოვეთ ძალა $q_2$-ზე.
EN: Three charges lie on a line: $q_1 = +1\ \mu\text{C}$ at $x = 0$, $q_2 = +2\ \mu\text{C}$ at $x = 0.1\ \text{m}$, $q_3 = -1\ \mu\text{C}$ at $x = 0.2\ \text{m}$. Find the force on $q_2$.
HKA: ორივე ძალა ერთი მიმართულებისაა.
HEN: Both forces point the same way.
SKA: $q_1$ განიზიდავს $q_2$-ს მარჯვნივ: $F_1 = 9 \cdot 10^9 \cdot \dfrac{2 \cdot 10^{-12}}{0{,}01} = 1{,}8\ \text{ნ}$
$q_3$ მიიზიდავს მარჯვნივ: $F_3 = 1{,}8\ \text{ნ}$
$F = 3{,}6\ \text{ნ}$, მარჯვნივ.
SEN: $q_1$ repels $q_2$ to the right: $F_1 = 9 \times 10^9 \cdot \dfrac{2 \times 10^{-12}}{0.01} = 1.8\ \text{N}$
$q_3$ attracts it to the right: $F_3 = 1.8\ \text{N}$
$F = 3.6\ \text{N}$, to the right.

AEN: $3.6\ \text{N}$ to the right

--- medium coulomb
KA: ორი მუხტი ჰაერში $r$ მანძილზე $F$ ძალით ურთიერთქმედებს. ზეთში ($\varepsilon = 4$) რა მანძილზე უნდა მოვათავსოთ, რომ ძალა იგივე იყოს?
EN: Two charges in air at distance $r$ interact with force $F$. At what distance in oil ($\varepsilon = 4$) is the force the same?
HKA: $\dfrac{1}{r^2} = \dfrac{1}{\varepsilon r'^2}$.
HEN: $\dfrac{1}{r^2} = \dfrac{1}{\varepsilon r'^2}$.
SKA: $r' = \dfrac{r}{\sqrt{\varepsilon}} = \dfrac{r}{2}$
SEN: $r' = \dfrac{r}{\sqrt{\varepsilon}} = \dfrac{r}{2}$
AKA: $\dfrac{r}{2}$
AEN: $\dfrac{r}{2}$

--- medium coulomb
KA: კვადრატის ($a = 0{,}1\ \text{მ}$) A და B მეზობელ წვეროებში $+1\ \text{მკკ}$ მუხტებია. იპოვეთ ძალა $+1\ \text{მკკ}$ მუხტზე C წვეროში, რომელიც B-ს მეზობელია (A-სთან დიაგონალზეა).
EN: Two $+1\ \mu\text{C}$ charges sit at adjacent corners A and B of a square ($a = 0.1\ \text{m}$). Find the force on a $+1\ \mu\text{C}$ charge at corner C, adjacent to B (diagonal from A).
HKA: ერთი ძალა $a$ მანძილიდან, მეორე — $a\sqrt 2$-დან, $45°$ კუთხით.
HEN: One force from distance $a$, the other from $a\sqrt 2$, at $45°$.
SKA: $F_B = \dfrac{9 \cdot 10^9 \cdot 10^{-12}}{0{,}01} = 0{,}9\ \text{ნ}$, $\ F_A = \dfrac{0{,}9}{2} = 0{,}45\ \text{ნ}$
$F_A$-ს მდგენელები: $0{,}45 \cdot 0{,}707 \approx 0{,}32\ \text{ნ}$ ორივე მიმართულებით.
$F = \sqrt{(0{,}9 + 0{,}32)^2 + 0{,}32^2} \approx \sqrt{1{,}49 + 0{,}10} \approx 1{,}26\ \text{ნ}$
SEN: $F_B = \dfrac{9 \times 10^9 \cdot 10^{-12}}{0.01} = 0.9\ \text{N}$, $\ F_A = \dfrac{0.9}{2} = 0.45\ \text{N}$
Components of $F_A$: $0.45 \cdot 0.707 \approx 0.32\ \text{N}$ each.
$F = \sqrt{(0.9 + 0.32)^2 + 0.32^2} \approx \sqrt{1.49 + 0.10} \approx 1.26\ \text{N}$
AKA: $\approx 1{,}26\ \text{ნ}$
AEN: $\approx 1.26\ \text{N}$

--- medium coulomb
KA: ორი წერტილოვანი მუხტი — $+4q$ ($x = 0$) და $+q$ ($x = 0{,}3\ \text{მ}$). სად უნდა მოვათავსოთ მესამე მუხტი, რომ მასზე ძალა ნული იყოს?
EN: Point charges $+4q$ at $x = 0$ and $+q$ at $x = 0.3\ \text{m}$. Where must a third charge be placed so the force on it is zero?
HKA: მუხტებს შორის, უფრო ახლოს პატარასთან.
HEN: Between them, closer to the smaller one.
SKA: $\dfrac{4q}{x^2} = \dfrac{q}{(0{,}3 - x)^2} \Rightarrow 2(0{,}3 - x) = x \Rightarrow x = 0{,}2\ \text{მ}$
SEN: $\dfrac{4q}{x^2} = \dfrac{q}{(0.3 - x)^2} \Rightarrow 2(0.3 - x) = x \Rightarrow x = 0.2\ \text{m}$
AKA: $x = 0{,}2\ \text{მ}$
AEN: $x = 0.2\ \text{m}$

--- medium coulomb
KA: რამდენჯერ მეტია ელექტრონსა და პროტონს შორის ელექტრული მიზიდვა გრავიტაციულზე? ($G = 6{,}67 \cdot 10^{-11}$, $m_p = 1{,}67 \cdot 10^{-27}\ \text{კგ}$)
EN: How many times stronger is the electric attraction between an electron and a proton than their gravitational attraction? ($G = 6.67 \times 10^{-11}$, $m_p = 1.67 \times 10^{-27}\ \text{kg}$)
HKA: შეფარდება მანძილზე არ არის დამოკიდებული.
HEN: The ratio doesn't depend on distance.
SKA: $\dfrac{F_e}{F_g} = \dfrac{k e^2}{G m_e m_p} = \dfrac{9 \cdot 10^9 \cdot 2{,}56 \cdot 10^{-38}}{6{,}67 \cdot 10^{-11} \cdot 9{,}1 \cdot 10^{-31} \cdot 1{,}67 \cdot 10^{-27}} \approx 2{,}3 \cdot 10^{39}$
SEN: $\dfrac{F_e}{F_g} = \dfrac{k e^2}{G m_e m_p} = \dfrac{9 \times 10^9 \cdot 2.56 \times 10^{-38}}{6.67 \times 10^{-11} \cdot 9.1 \times 10^{-31} \cdot 1.67 \times 10^{-27}} \approx 2.3 \times 10^{39}$
AKA: $\approx 2 \cdot 10^{39}$-ჯერ
AEN: $\approx 2 \times 10^{39}$ times

--- medium coulomb
KA: ორი ერთნაირი ბურთულა $10\ \text{სმ}$-ზე $0{,}4\ \text{მნ}$ ძალით იზიდება. შეხების შემდეგ იმავე მანძილზე $0{,}05\ \text{მნ}$-ით განიზიდება. იპოვეთ საწყისი მუხტები.
EN: Two identical balls $10\ \text{cm}$ apart attract with $0.4\ \text{mN}$. After touching, at the same distance, they repel with $0.05\ \text{mN}$. Find the original charges.
HKA: $|q_1 q_2| = \dfrac{F_1 r^2}{k}$, $\left(\dfrac{q_1 + q_2}{2}\right)^2 = \dfrac{F_2 r^2}{k}$.
HEN: $|q_1 q_2| = \dfrac{F_1 r^2}{k}$, $\left(\dfrac{q_1 + q_2}{2}\right)^2 = \dfrac{F_2 r^2}{k}$.
SKA: $q_1 q_2 = -\dfrac{4 \cdot 10^{-4} \cdot 10^{-2}}{9 \cdot 10^9} = -\dfrac{4}{9} \cdot 10^{-15}$
$\dfrac{q_1 + q_2}{2} = \sqrt{\dfrac{5 \cdot 10^{-5} \cdot 10^{-2}}{9 \cdot 10^9}} = \dfrac{\sqrt{5}}{3} \cdot 10^{-8}$, ე.ი. $q_1 + q_2 \approx 1{,}49 \cdot 10^{-8}$
ნკ-ებში: $q_1 + q_2 \approx 14{,}9$, $q_1 q_2 \approx -444$ $\Rightarrow$ $q_1 \approx 30{,}0\ \text{ნკ}$, $q_2 \approx -14{,}8\ \text{ნკ}$
SEN: $q_1 q_2 = -\dfrac{4 \times 10^{-4} \cdot 10^{-2}}{9 \times 10^9} = -\dfrac{4}{9} \times 10^{-15}$
$\dfrac{q_1 + q_2}{2} = \sqrt{\dfrac{5 \times 10^{-5} \cdot 10^{-2}}{9 \times 10^9}} = \dfrac{\sqrt{5}}{3} \times 10^{-8}$, so $q_1 + q_2 \approx 1.49 \times 10^{-8}$
In nC: $q_1 + q_2 \approx 14.9$, $q_1 q_2 \approx -444$ $\Rightarrow$ $q_1 \approx 30.0\ \text{nC}$, $q_2 \approx -14.8\ \text{nC}$
AKA: $\approx +30\ \text{ნკ}$ და $\approx -15\ \text{ნკ}$
AEN: $\approx +30\ \text{nC}$ and $\approx -15\ \text{nC}$

--- medium coulomb
KA: კულონის კანონი და მსოფლიო მიზიდულობის კანონი ერთმანეთს ჰგავს. რით განსხვავდება ისინი?
EN: Coulomb's law looks like the law of universal gravitation. How do they differ?
HKA: ნიშნები და სიძლიერე.
HEN: Signs and strength.
SKA: ორივე $\dfrac{1}{r^2}$ კანონია.
გრავიტაცია ყოველთვის მიზიდვაა და მასას ეხება; ელექტრული ძალა შეიძლება იყოს მიზიდვაც და განზიდვაც და მუხტს ეხება.
ელექტრული ძალა უზარმაზრად ძლიერია; გარემო ($\varepsilon$) მას ასუსტებს, გრავიტაციას — არა.
SEN: Both are $\dfrac{1}{r^2}$ laws.
Gravity always attracts and involves mass; the electric force can attract or repel and involves charge.
The electric force is enormously stronger; a medium ($\varepsilon$) weakens it but not gravity.
AKA: მიზიდვა/განზიდვა, სიძლიერე, გარემოს გავლენა
AEN: attraction/repulsion, strength, effect of the medium

--- medium coulomb
KA: $3$ მუხტი ($+q$ თითო) ტოლგვერდა სამკუთხედის ($a$) წვეროებშია. იპოვეთ ძალა ერთ-ერთზე.
EN: Three charges $+q$ sit at the corners of an equilateral triangle of side $a$. Find the force on one of them.
HKA: ორი ტოლი ძალა $60°$ კუთხით.
HEN: Two equal forces at $60°$.
SKA: $F_1 = k\dfrac{q^2}{a^2}$; $\ F = 2 F_1 \cos 30° = \sqrt 3\, k\dfrac{q^2}{a^2}$, მიმართულია ცენტრიდან გარეთ.
SEN: $F_1 = k\dfrac{q^2}{a^2}$; $\ F = 2 F_1 \cos 30° = \sqrt 3\, k\dfrac{q^2}{a^2}$, pointing away from the centre.
AKA: $\sqrt 3\, k\dfrac{q^2}{a^2}$
AEN: $\sqrt 3\, k\dfrac{q^2}{a^2}$

--- medium coulomb
KA: ძაფზე $1\ \text{გ}$ ბურთულა ($q = 10\ \text{ნკ}$) ჰკიდია. მის ქვემოთ $3\ \text{სმ}$-ზე $-20\ \text{ნკ}$ მუხტი მოათავსეს. რამდენჯერ შეიცვალა ძაფის დაჭიმულობა?
EN: A $1\ \text{g}$ ball ($q = 10\ \text{nC}$) hangs on a thread. A $-20\ \text{nC}$ charge is placed $3\ \text{cm}$ below it. By what factor does the tension change?
HKA: მიზიდვა ქვემოთაა მიმართული — დაჭიმულობა იზრდება.
HEN: The attraction is downwards — the tension increases.
SKA: $F = 9 \cdot 10^9 \cdot \dfrac{2 \cdot 10^{-16}}{9 \cdot 10^{-4}} = 2 \cdot 10^{-3}\ \text{ნ}$
$T = 0{,}01 + 0{,}002 = 0{,}012\ \text{ნ}$ — $1{,}2$-ჯერ.
SEN: $F = 9 \times 10^9 \cdot \dfrac{2 \times 10^{-16}}{9 \times 10^{-4}} = 2 \times 10^{-3}\ \text{N}$
$T = 0.01 + 0.002 = 0.012\ \text{N}$ — $1.2$ times.
AKA: $1{,}2$-ჯერ გაიზარდა
AEN: it grew $1.2$ times

--- medium coulomb
KA: რა მუხტი უნდა ჰქონდეს დედამიწას და მთვარეს (ტოლი), რომ ელექტრული განზიდვა გრავიტაციულ მიზიდვას აწონასწორებდეს? ($M_{\text{დ}} = 6 \cdot 10^{24}$, $M_{\text{მ}} = 7{,}4 \cdot 10^{22}\ \text{კგ}$)
EN: What equal charges on the Earth and Moon would make their electric repulsion balance their gravitational attraction? ($M_{\text{E}} = 6 \times 10^{24}$, $M_{\text{M}} = 7.4 \times 10^{22}\ \text{kg}$)
HKA: $k q^2 = G M m$ — მანძილი იკვეცება.
HEN: $k q^2 = G M m$ — the distance cancels.
SKA: $q = \sqrt{\dfrac{G M m}{k}} = \sqrt{\dfrac{6{,}67 \cdot 10^{-11} \cdot 4{,}44 \cdot 10^{47}}{9 \cdot 10^9}} = \sqrt{3{,}3 \cdot 10^{27}} \approx 5{,}7 \cdot 10^{13}\ \text{კ}$
SEN: $q = \sqrt{\dfrac{G M m}{k}} = \sqrt{\dfrac{6.67 \times 10^{-11} \cdot 4.44 \times 10^{47}}{9 \times 10^9}} = \sqrt{3.3 \times 10^{27}} \approx 5.7 \times 10^{13}\ \text{C}$
AKA: $\approx 5{,}7 \cdot 10^{13}\ \text{კ}$
AEN: $\approx 5.7 \times 10^{13}\ \text{C}$

--- medium coulomb
KA: ორი მუხტის ურთიერთქმედების ძალა $0{,}5\ \text{მ}$-ზე $0{,}36\ \text{ნ}$-ია. რა იქნება ძალა $1{,}5\ \text{მ}$-ზე?
EN: Two charges interact with $0.36\ \text{N}$ at $0.5\ \text{m}$. What is the force at $1.5\ \text{m}$?
HKA: მანძილი $3$-ჯერ გაიზარდა.
HEN: The distance tripled.
SKA: $F' = \dfrac{0{,}36}{9} = 0{,}04\ \text{ნ}$
SEN: $F' = \dfrac{0.36}{9} = 0.04\ \text{N}$
AKA: $0{,}04\ \text{ნ}$
AEN: $0.04\ \text{N}$

--- hard coulomb
KA: ორი ერთნაირი ბურთულა ($m = 0{,}1\ \text{გ}$) $20\ \text{სმ}$ სიგრძის ძაფებით ერთ წერტილზეა ჩამოკიდებული. ტოლი მუხტების მიღების შემდეგ ძაფებმა $90°$ კუთხე შეადგინეს. იპოვეთ მუხტი.
EN: Two identical balls ($m = 0.1\ \text{g}$) hang from one point on $20\ \text{cm}$ threads. After being given equal charges the threads make a $90°$ angle. Find the charge.
HKA: თითოეული ძაფი ვერტიკალთან $45°$-ს ქმნის: $F = m g \tan 45°$. მანძილი $r = 2 l\sin 45°$.
HEN: Each thread is at $45°$ to the vertical: $F = m g \tan 45°$. The separation is $r = 2 l\sin 45°$.
SKA: $F = mg = 10^{-3}\ \text{ნ}$, $\ r = 2 \cdot 0{,}2 \cdot 0{,}707 \approx 0{,}283\ \text{მ}$
$q = r\sqrt{\dfrac{F}{k}} = 0{,}283 \cdot \sqrt{\dfrac{10^{-3}}{9 \cdot 10^9}} \approx 0{,}283 \cdot 3{,}33 \cdot 10^{-7} \approx 9{,}4 \cdot 10^{-8}\ \text{კ}$
SEN: $F = mg = 10^{-3}\ \text{N}$, $\ r = 2 \cdot 0.2 \cdot 0.707 \approx 0.283\ \text{m}$
$q = r\sqrt{\dfrac{F}{k}} = 0.283 \cdot \sqrt{\dfrac{10^{-3}}{9 \times 10^9}} \approx 0.283 \cdot 3.33 \times 10^{-7} \approx 9.4 \times 10^{-8}\ \text{C}$
AKA: $\approx 94\ \text{ნკ}$
AEN: $\approx 94\ \text{nC}$

--- hard coulomb
KA: $+q$ და $+9q$ მუხტები $L = 40\ \text{სმ}$-ზეა ფიქსირებული. სად უნდა მოთავსდეს მესამე მუხტი წონასწორობისთვის? მდგრადია ეს წონასწორობა, თუ მესამე მუხტი დადებითია და მხოლოდ ხაზის გასწვრივ გადაადგილდება?
EN: Charges $+q$ and $+9q$ are fixed $L = 40\ \text{cm}$ apart. Where must a third charge be placed for equilibrium? If the third charge is positive and can move only along the line, is the equilibrium stable?
HKA: $\dfrac{q}{x^2} = \dfrac{9q}{(L - x)^2}$.
HEN: $\dfrac{q}{x^2} = \dfrac{9q}{(L - x)^2}$.
SKA: $L - x = 3x \Rightarrow x = \dfrac{L}{4} = 10\ \text{სმ}$ ($+q$-დან)
დადებითი მუხტის გადაწევისას ახლო მუხტის განზიდვა იზრდება და უკან აბრუნებს — ხაზის გასწვრივ მდგრადია.
SEN: $L - x = 3x \Rightarrow x = \dfrac{L}{4} = 10\ \text{cm}$ (from $+q$)
If the positive charge shifts, the nearer charge's repulsion grows and pushes it back — stable along the line.
AKA: $+q$-დან $10\ \text{სმ}$-ზე; მდგრადია
AEN: $10\ \text{cm}$ from $+q$; stable

--- hard coulomb
KA: ორი ერთნაირი ბურთულა ძაფებით ერთ წერტილზე ჰკიდია და დამუხტვის შემდეგ ერთმანეთს $\alpha$ კუთხით გაშორდა. როგორ შეიცვლება კუთხე ნავთში ($\varepsilon = 2$, $\rho_{\text{ნ}} = 800\ \text{კგ/მ}^3$), თუ ბურთულების სიმკვრივეა $1600\ \text{კგ/მ}^3$?
EN: Two identical charged balls hang from one point and separate by angle $\alpha$. How does the angle change in kerosene ($\varepsilon = 2$, $\rho = 800\ \text{kg/m}^3$) if the balls' density is $1600\ \text{kg/m}^3$?
HKA: ნავთში ელექტრული ძალაც და „წონაც“ (არქიმედეს ძალის გამოკლებით) $2$-ჯერ მცირდება.
HEN: In kerosene both the electric force and the effective weight (minus buoyancy) are halved.
SKA: $F' = \dfrac{F}{2}$; $\ m g' = m g\left(1 - \dfrac{800}{1600}\right) = \dfrac{mg}{2}$
$\tan\dfrac{\alpha}{2} = \dfrac{F}{mg}$ — შეფარდება არ იცვლება, კუთხე **იგივე** რჩება.
SEN: $F' = \dfrac{F}{2}$; $\ m g' = m g\left(1 - \dfrac{800}{1600}\right) = \dfrac{mg}{2}$
$\tan\dfrac{\alpha}{2} = \dfrac{F}{mg}$ — the ratio is unchanged, so the angle **stays the same**.
AKA: არ შეიცვლება
AEN: it doesn't change

--- hard coulomb
KA: რამდენჯერ შეიცვლება ორი ერთნაირი ლითონის ბურთულის ურთიერთქმედების ძალა, თუ მათ $q$ და $5q$ მუხტები აქვთ, შეახებენ და იმავე მანძილზე დააბრუნებენ? რა იქნება, თუ მუხტები $q$ და $-5q$ იყო?
EN: Two identical metal balls carry $q$ and $5q$; they are touched and returned to the same distance. By what factor does the force change? What if the charges were $q$ and $-5q$?
HKA: შეხების შემდეგ: $\dfrac{q_1 + q_2}{2}$ თითოეულს.
HEN: After touching each has $\dfrac{q_1 + q_2}{2}$.
SKA: $q, 5q$: შემდეგ $3q$ და $3q$; $\dfrac{9}{5} = 1{,}8$-ჯერ გაიზრდება.
$q, -5q$: შემდეგ $-2q$ და $-2q$; $\dfrac{4}{5} = 0{,}8$ — შემცირდება და მიზიდვა განზიდვად იქცევა.
SEN: $q, 5q$: afterwards $3q$ and $3q$; it grows $\dfrac{9}{5} = 1.8$ times.
$q, -5q$: afterwards $-2q$ and $-2q$; $\dfrac{4}{5} = 0.8$ — it drops, and attraction turns into repulsion.
AKA: $1{,}8$-ჯერ გაიზრდება; $0{,}8$ (განზიდვა)
AEN: $1.8$ times larger; $0.8$ (now repulsion)

--- hard coulomb
KA: კვადრატის ($a$) ოთხ წვეროში $+q$, $-q$, $+q$, $-q$ მუხტებია (მონაცვლეობით). იპოვეთ ძალა ერთ-ერთ დადებით მუხტზე.
EN: Charges $+q$, $-q$, $+q$, $-q$ sit alternately at the corners of a square of side $a$. Find the force on one positive charge.
HKA: ორი მეზობელი იზიდავს, დიაგონალზე მყოფი განიზიდავს.
HEN: Two neighbours attract it; the one across the diagonal repels it.
SKA: მეზობლების ჯამი: $\sqrt 2\, k\dfrac{q^2}{a^2}$ (ცენტრისკენ).
დიაგონალი: $k\dfrac{q^2}{2a^2}$ (ცენტრიდან).
$F = k\dfrac{q^2}{a^2}\left(\sqrt 2 - \dfrac{1}{2}\right) \approx 0{,}91\, k\dfrac{q^2}{a^2}$, ცენტრისკენ.
SEN: The neighbours give $\sqrt 2\, k\dfrac{q^2}{a^2}$ (towards the centre).
The diagonal one gives $k\dfrac{q^2}{2a^2}$ (away from the centre).
$F = k\dfrac{q^2}{a^2}\left(\sqrt 2 - \dfrac{1}{2}\right) \approx 0.91\, k\dfrac{q^2}{a^2}$, towards the centre.
AKA: $\approx 0{,}91\, k\dfrac{q^2}{a^2}$, ცენტრისკენ
AEN: $\approx 0.91\, k\dfrac{q^2}{a^2}$, towards the centre

--- hard coulomb
KA: ელექტრონი პროტონის გარშემო $r = 5{,}3 \cdot 10^{-11}\ \text{მ}$ რადიუსის წრეზე მოძრაობს (ბორის მოდელი). იპოვეთ მისი სიჩქარე.
EN: In Bohr's model an electron orbits a proton on a circle of radius $r = 5.3 \times 10^{-11}\ \text{m}$. Find its speed.
HKA: კულონის ძალა ცენტრისკენული ძალაა.
HEN: The Coulomb force is the centripetal force.
SKA: $k\dfrac{e^2}{r^2} = \dfrac{m v^2}{r} \Rightarrow v = e\sqrt{\dfrac{k}{m r}}$
$v = 1{,}6 \cdot 10^{-19}\sqrt{\dfrac{9 \cdot 10^9}{9{,}1 \cdot 10^{-31} \cdot 5{,}3 \cdot 10^{-11}}} \approx 2{,}2 \cdot 10^6\ \text{მ/წმ}$
SEN: $k\dfrac{e^2}{r^2} = \dfrac{m v^2}{r} \Rightarrow v = e\sqrt{\dfrac{k}{m r}}$
$v = 1.6 \times 10^{-19}\sqrt{\dfrac{9 \times 10^9}{9.1 \times 10^{-31} \cdot 5.3 \times 10^{-11}}} \approx 2.2 \times 10^6\ \text{m/s}$
AKA: $\approx 2{,}2 \cdot 10^6\ \text{მ/წმ}$
AEN: $\approx 2.2 \times 10^6\ \text{m/s}$

--- hard coulomb olympiad
KA: ორი ერთნაირი ბურთულა ($m$, $q$) $l$ სიგრძის ძაფებით ერთ წერტილზე ჰკიდია და $x \ll l$ მანძილზეა. ერთ-ერთი განმუხტეს. რა მანძილზე დამყარდება ისინი შეხების და ხელახალი განშორების შემდეგ?
EN: Two identical balls ($m$, $q$) hang from one point on threads of length $l$, a distance $x \ll l$ apart. One is discharged. After they touch and separate again, at what distance do they settle?
HKA: მცირე კუთხეებისთვის $F = m g \dfrac{x}{2l} = k\dfrac{q^2}{x^2} \Rightarrow x^3 \sim q^2$.
HEN: For small angles $F = m g \dfrac{x}{2l} = k\dfrac{q^2}{x^2} \Rightarrow x^3 \sim q^2$.
SKA: განმუხტვის შემდეგ ისინი ეჯახებიან და თითოეულს $\dfrac{q}{2}$ ერგება.
$x'^3 = x^3 \cdot \left(\dfrac{1}{2}\right)^2 \Rightarrow x' = \dfrac{x}{\sqrt[3]{4}} \approx 0{,}63\, x$
SEN: After the discharge they swing together and each gets $\dfrac{q}{2}$.
$x'^3 = x^3 \cdot \left(\dfrac{1}{2}\right)^2 \Rightarrow x' = \dfrac{x}{\sqrt[3]{4}} \approx 0.63\, x$
AKA: $\dfrac{x}{\sqrt[3]{4}} \approx 0{,}63x$
AEN: $\dfrac{x}{\sqrt[3]{4}} \approx 0.63x$

--- hard coulomb olympiad
KA: თხელი რგოლი ($R$) თანაბრადაა დამუხტული $Q$ მუხტით. რა ძალა მოქმედებს $q$ მუხტზე რგოლის ღერძზე, ცენტრიდან $h$ მანძილზე?
EN: A thin ring of radius $R$ carries charge $Q$ uniformly. What force acts on a charge $q$ on the ring's axis at distance $h$ from the centre?
HKA: რგოლის ყოველი ელემენტის ძალის განივი მდგენელები ერთმანეთს აბათილებს; რჩება ღერძის გასწვრივ მდგენელები.
HEN: The sideways components from each bit of the ring cancel; only the components along the axis remain.
SKA: მანძილი ყველა ელემენტამდე $\sqrt{R^2 + h^2}$, ღერძის მდგენელი $\cos\theta = \dfrac{h}{\sqrt{R^2 + h^2}}$.
$F = k\dfrac{q Q h}{(R^2 + h^2)^{3/2}}$
შემოწმება: $h \gg R$-ისას $F \to k\dfrac{qQ}{h^2}$; $h = 0$-ისას $F = 0$.
SEN: Every element is at distance $\sqrt{R^2 + h^2}$; the axial component is $\cos\theta = \dfrac{h}{\sqrt{R^2 + h^2}}$.
$F = k\dfrac{q Q h}{(R^2 + h^2)^{3/2}}$
Check: for $h \gg R$, $F \to k\dfrac{qQ}{h^2}$; at $h = 0$, $F = 0$.
AKA: $F = k\dfrac{qQh}{(R^2 + h^2)^{3/2}}$
AEN: $F = k\dfrac{qQh}{(R^2 + h^2)^{3/2}}$

--- hard coulomb olympiad
KA: ტოლგვერდა სამკუთხედის ($a$) წვეროებში სამი ერთნაირი $+q$ მუხტია. რა მუხტი უნდა მოთავსდეს ცენტრში, რომ სისტემა წონასწორობაში იყოს?
EN: Three identical charges $+q$ sit at the corners of an equilateral triangle of side $a$. What charge at the centre puts the system in equilibrium?
HKA: ცენტრიდან წვერომდე $\dfrac{a}{\sqrt 3}$. წვეროზე ორი მუხტის ძალა $\sqrt 3\, kq^2/a^2$.
HEN: Centre-to-corner distance is $\dfrac{a}{\sqrt 3}$. The two other charges push a corner with $\sqrt 3\, kq^2/a^2$.
SKA: $k\dfrac{q |Q|}{a^2/3} = \sqrt 3\, k\dfrac{q^2}{a^2} \Rightarrow |Q| = \dfrac{q}{\sqrt 3}$
$Q = -\dfrac{q}{\sqrt 3} \approx -0{,}58\, q$
SEN: $k\dfrac{q |Q|}{a^2/3} = \sqrt 3\, k\dfrac{q^2}{a^2} \Rightarrow |Q| = \dfrac{q}{\sqrt 3}$
$Q = -\dfrac{q}{\sqrt 3} \approx -0.58\, q$
AKA: $-\dfrac{q}{\sqrt 3}$
AEN: $-\dfrac{q}{\sqrt 3}$

--- hard coulomb olympiad
