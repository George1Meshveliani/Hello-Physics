HEN: Irreversible processes.
SKA: რეალურ ძრავაში არის ხახუნი, სითბოს დანაკარგები გარემოში, არასრული წვა და სხვა შეუქცევადი პროცესები; კარნოს ციკლი იდეალური და შექცევადია.
SEN: A real engine has friction, heat lost to the surroundings, incomplete combustion and other irreversible processes; the Carnot cycle is ideal and reversible.
AKA: ხახუნი, დანაკარგები, შეუქცევადობა
AEN: friction, losses, irreversibility

--- easy engines
KA: ძრავის მქკ $35\%$-ია, ციკლში $700\ \text{ჯ}$ მუშაობას ასრულებს. რამდენ სითბოს იღებს გამაცხელებლიდან?
EN: An engine is $35\%$ efficient and does $700\ \text{J}$ of work per cycle. How much heat does it take from the hot reservoir?
HKA: $Q_1 = \dfrac{A}{\eta}$.
HEN: $Q_1 = \dfrac{W}{\eta}$.
SKA: $Q_1 = \dfrac{700}{0{,}35} = 2000\ \text{ჯ}$
SEN: $Q_1 = \dfrac{700}{0.35} = 2000\ \text{J}$
AKA: $2\ \text{კჯ}$
AEN: $2\ \text{kJ}$

--- medium engines
KA: კარნოს ძრავის მაცივარი $27\ \text{°C}$-ია, მქკ $60\%$. რა ტემპერატურისაა გამაცხელებელი?
EN: A Carnot engine's cold reservoir is at $27\ \text{°C}$ and its efficiency is $60\%$. What is the hot reservoir's temperature?
HKA: $T_1 = \dfrac{T_2}{1 - \eta}$.
HEN: $T_1 = \dfrac{T_2}{1 - \eta}$.
SKA: $T_1 = \dfrac{300}{0{,}4} = 750\ \text{K}$
SEN: $T_1 = \dfrac{300}{0.4} = 750\ \text{K}$
AKA: $750\ \text{K}$
AEN: $750\ \text{K}$

--- medium engines
KA: მაცივრის „მქკ“ (შესრულების კოეფიციენტი) $\varepsilon = \dfrac{Q_2}{A}$. იდეალური მაცივარი $-18\ \text{°C}$-ს ინარჩუნებს $27\ \text{°C}$ ოთახში. იპოვეთ $\varepsilon$.
EN: A fridge's coefficient of performance is $\varepsilon = \dfrac{Q_2}{W}$. An ideal freezer keeps $-18\ \text{°C}$ in a $27\ \text{°C}$ room. Find $\varepsilon$.
HKA: $\varepsilon = \dfrac{T_2}{T_1 - T_2}$.
HEN: $\varepsilon = \dfrac{T_2}{T_1 - T_2}$.
SKA: $\varepsilon = \dfrac{255}{45} \approx 5{,}7$
SEN: $\varepsilon = \dfrac{255}{45} \approx 5.7$
AKA: $\approx 5{,}7$
AEN: $\approx 5.7$

--- medium engines
KA: მანქანა $100\ \text{კმ}$-ზე $7\ \text{ლ}$ ბენზინს ($\rho = 0{,}7\ \text{კგ/ლ}$, $q = 46\ \text{მჯ/კგ}$) ხარჯავს, საშუალო წევის ძალა $700\ \text{ნ}$-ია. იპოვეთ მქკ.
EN: A car uses $7\ \text{L}$ of petrol ($0.7\ \text{kg/L}$, $q = 46\ \text{MJ/kg}$) per $100\ \text{km}$ with an average driving force of $700\ \text{N}$. Find the efficiency.
HKA: $\eta = \dfrac{F s}{q m}$.
HEN: $\eta = \dfrac{F s}{q m}$.
SKA: $A = 700 \cdot 10^5 = 7 \cdot 10^7\ \text{ჯ}$; $\ Q = 4{,}9 \cdot 46 \cdot 10^6 \approx 2{,}25 \cdot 10^8\ \text{ჯ}$
$\eta \approx 31\%$
SEN: $W = 700 \cdot 10^5 = 7 \times 10^7\ \text{J}$; $\ Q = 4.9 \cdot 46 \times 10^6 \approx 2.25 \times 10^8\ \text{J}$
$\eta \approx 31\%$
AKA: $\approx 31\%$
AEN: $\approx 31\%$

--- medium engines
KA: კარნოს ძრავის გამაცხელებლის ტემპერატურა $100\ \text{K}$-ით გაზარდეს ($T_1 = 400 \to 500\ \text{K}$, $T_2 = 300\ \text{K}$). როგორ შეიცვალა მქკ?
EN: A Carnot engine's hot reservoir is raised by $100\ \text{K}$ ($400 \to 500\ \text{K}$, $T_2 = 300\ \text{K}$). How does the efficiency change?
HKA: $\eta = 1 - \dfrac{T_2}{T_1}$.
HEN: $\eta = 1 - \dfrac{T_2}{T_1}$.
SKA: $25\% \to 40\%$
SEN: $25\% \to 40\%$
AKA: $25\%$-დან $40\%$-მდე
AEN: from $25\%$ to $40\%$

--- medium engines
KA: რა არის თერმოდინამიკის მეორე კანონი? მოიყვანეთ ერთ-ერთი ფორმულირება.
EN: What is the second law of thermodynamics? Give one formulation.
HKA: სითბო თავისით...
HEN: Heat by itself...
SKA: სითბო თავისით ვერ გადადის ცივი სხეულიდან ცხელზე (კლაუზიუსი). ან: შეუძლებელია ძრავა, რომელიც ერთი რეზერვუარის სითბოს მთლიანად მუშაობად აქცევს (კელვინი).
SEN: Heat cannot by itself flow from a colder to a hotter body (Clausius). Or: no engine can turn heat from a single reservoir entirely into work (Kelvin).
AKA: კლაუზიუსის ან კელვინის ფორმულირება
AEN: the Clausius or Kelvin statement

--- medium engines
KA: თბოსადგური $600\ \text{მვტ}$ ელექტროენერგიას აწარმოებს $40\%$-იანი მქკ-ით. რამდენ სითბოს გასცემს გარემოს (მდინარეს) წამში?
EN: A power plant makes $600\ \text{MW}$ of electricity at $40\%$ efficiency. How much heat per second does it dump into the river?
HKA: $Q_2 = Q_1 - A$.
HEN: $Q_2 = Q_1 - W$.
SKA: $Q_1 = 1500\ \text{მვტ}$, $\ Q_2 = 900\ \text{მვტ}$
SEN: $Q_1 = 1500\ \text{MW}$, $\ Q_2 = 900\ \text{MW}$
AKA: $900\ \text{მჯ/წმ}$
AEN: $900\ \text{MJ/s}$

--- hard engines
KA: ერთატომიანი აირის ციკლი მართკუთხედია: $p_1 = 10^5$, $p_2 = 2 \cdot 10^5\ \text{პა}$, $V_1 = 1$, $V_2 = 3\ \text{ლ}$. იპოვეთ მქკ.
EN: A monatomic gas cycle is a rectangle: $p_1 = 10^5$, $p_2 = 2 \times 10^5\ \text{Pa}$, $V_1 = 1$, $V_2 = 3\ \text{L}$. Find its efficiency.
HKA: სითბო შედის იზოქორულ გათბობაზე ($V_1$) და იზობარულ გაფართოებაზე ($p_2$).
HEN: Heat enters during the isochoric heating (at $V_1$) and the isobaric expansion (at $p_2$).
SKA: $A = 10^5 \cdot 0{,}002 = 200\ \text{ჯ}$
$Q_{\text{იზოქ}} = \dfrac{3}{2}V_1\Delta p = 1{,}5 \cdot 100 = 150\ \text{ჯ}$; $\ Q_{\text{იზობ}} = \dfrac{5}{2}p_2\Delta V = 2{,}5 \cdot 400 = 1000\ \text{ჯ}$
$\eta = \dfrac{200}{1150} \approx 17\%$
SEN: $W = 10^5 \cdot 0.002 = 200\ \text{J}$
$Q_{\text{isoch}} = \dfrac{3}{2}V_1\Delta p = 1.5 \cdot 100 = 150\ \text{J}$; $\ Q_{\text{isob}} = \dfrac{5}{2}p_2\Delta V = 2.5 \cdot 400 = 1000\ \text{J}$
$\eta = \dfrac{200}{1150} \approx 17\%$
AKA: $\approx 17\%$
AEN: $\approx 17\%$

--- hard engines
KA: სითბური ტუმბო სახლს $25\ \text{°C}$-ზე ათბობს, გარეთ $-5\ \text{°C}$-ია. იდეალურ შემთხვევაში $1\ \text{კვტ·სთ}$ ელექტროენერგიით რამდენ სითბოს მიიღებს სახლი?
EN: A heat pump keeps a house at $25\ \text{°C}$ with $-5\ \text{°C}$ outside. Ideally, how much heat does the house get per $1\ \text{kWh}$ of electricity?
HKA: $\dfrac{Q_1}{A} = \dfrac{T_1}{T_1 - T_2}$.
HEN: $\dfrac{Q_1}{W} = \dfrac{T_1}{T_1 - T_2}$.
SKA: $\dfrac{298}{30} \approx 9{,}9$ — $\approx 9{,}9\ \text{კვტ·სთ}$
SEN: $\dfrac{298}{30} \approx 9.9$ — $\approx 9.9\ \text{kWh}$
AKA: $\approx 9{,}9\ \text{კვტ·სთ}$
AEN: $\approx 9.9\ \text{kWh}$

--- hard engines
KA: ორი კარნოს ძრავა მიმდევრობითაა: I $800 \to 500\ \text{K}$, II $500 \to 300\ \text{K}$. შეადარეთ მათი ჯამური მქკ ერთი ძრავისას $800 \to 300\ \text{K}$.
EN: Two Carnot engines in series: I runs $800 \to 500\ \text{K}$, II $500 \to 300\ \text{K}$. Compare their combined efficiency with one engine running $800 \to 300\ \text{K}$.
HKA: $1 - \eta = (1 - \eta_1)(1 - \eta_2)$.
HEN: $1 - \eta = (1 - \eta_1)(1 - \eta_2)$.
SKA: $(1 - \eta) = \dfrac{500}{800} \cdot \dfrac{300}{500} = \dfrac{300}{800}$ — $\eta = 62{,}5\%$, ზუსტად იგივე.
SEN: $(1 - \eta) = \dfrac{500}{800} \cdot \dfrac{300}{500} = \dfrac{300}{800}$ — $\eta = 62.5\%$, exactly the same.
AKA: ტოლია, $62{,}5\%$
AEN: equal, $62.5\%$

--- hard engines
KA: კარნოს ძრავის $T_1$-ის $\Delta T$-ით გაზრდა ან $T_2$-ის $\Delta T$-ით შემცირება — რომელი უფრო ზრდის მქკ-ს?
EN: For a Carnot engine, is it better to raise $T_1$ by $\Delta T$ or to lower $T_2$ by $\Delta T$?
HKA: შეადარეთ $\dfrac{T_2}{T_1 + \Delta T}$ და $\dfrac{T_2 - \Delta T}{T_1}$.
HEN: Compare $\dfrac{T_2}{T_1 + \Delta T}$ and $\dfrac{T_2 - \Delta T}{T_1}$.
SKA: $\dfrac{T_2 - \Delta T}{T_1} < \dfrac{T_2}{T_1 + \Delta T}$ (რადგან $T_2 < T_1 + \Delta T$) — $T_2$-ის შემცირება უკეთესია.
მაგ. $400/300$, $\Delta T = 50$: $40\%$ vs $33\%$.
SEN: $\dfrac{T_2 - \Delta T}{T_1} < \dfrac{T_2}{T_1 + \Delta T}$ (because $T_2 < T_1 + \Delta T$) — lowering $T_2$ is better.
E.g. $400/300$, $\Delta T = 50$: $40\%$ vs $33\%$.
AKA: $T_2$-ის შემცირება
AEN: lowering $T_2$

--- hard engines
KA: იდეალური მაცივარი $0\ \text{°C}$-ზე $1$ კგ წყალს ყინულად აქცევს, ოთახი $27\ \text{°C}$-ია. რა მინიმალური მუშაობაა საჭირო? ($\lambda = 3{,}3 \cdot 10^5\ \text{ჯ/კგ}$)
EN: An ideal freezer turns $1\ \text{kg}$ of water at $0\ \text{°C}$ into ice, in a $27\ \text{°C}$ room. What minimum work is needed? ($\lambda = 3.3 \times 10^5\ \text{J/kg}$)
HKA: $A = Q_2\dfrac{T_1 - T_2}{T_2}$.
HEN: $W = Q_2\dfrac{T_1 - T_2}{T_2}$.
SKA: $A = 3{,}3 \cdot 10^5 \cdot \dfrac{27}{273} \approx 3{,}3 \cdot 10^4\ \text{ჯ}$
SEN: $W = 3.3 \times 10^5 \cdot \dfrac{27}{273} \approx 3.3 \times 10^4\ \text{J}$
AKA: $\approx 33\ \text{კჯ}$
AEN: $\approx 33\ \text{kJ}$

--- hard engines
KA: ოთხტაქტიან ძრავას $4$ ცილინდრი აქვს, თითოეულის სამუშაო სვლა ციკლში $500\ \text{ჯ}$-ს იძლევა. ლილვი $3000\ \text{ბრ/წთ}$-ით ბრუნავს (ციკლი $2$ ბრუნში). იპოვეთ სიმძლავრე.
EN: A four-stroke engine has $4$ cylinders, each giving $500\ \text{J}$ per power stroke. The crankshaft turns at $3000\ \text{rpm}$ (one cycle per $2$ turns). Find the power.
HKA: ციკლები წამში: $\dfrac{3000}{60 \cdot 2} = 25$.
HEN: Cycles per second: $\dfrac{3000}{60 \cdot 2} = 25$.
SKA: $P = 4 \cdot 500 \cdot 25 = 50\ \text{კვტ}$
SEN: $P = 4 \cdot 500 \cdot 25 = 50\ \text{kW}$
AKA: $50\ \text{კვტ}$
AEN: $50\ \text{kW}$

--- hard engines olympiad
KA: ერთატომიანი აირის ციკლი: $1 \to 2$ იზობარა ($V$ $2$-ჯერ), $2 \to 3$ იზოქორა ($p$ $2$-ჯერ მცირდება), $3 \to 1$ იზოთერმა. იპოვეთ მქკ.
EN: Monatomic gas cycle: $1 \to 2$ isobaric ($V$ doubles), $2 \to 3$ isochoric ($p$ halves), $3 \to 1$ isothermal. Find its efficiency.
HKA: სითბო შედის მხოლოდ $1 \to 2$-ზე; $3 \to 1$-ზე გაიცემა $p_0V_0\ln 2$.
HEN: Heat enters only on $1 \to 2$; on $3 \to 1$ it gives off $p_0V_0\ln 2$.
SKA: $Q_{12} = \dfrac{5}{2}p_0 V_0$; $\ A_{12} = p_0V_0$, $\ A_{23} = 0$, $\ A_{31} = -p_0V_0\ln 2$
$\eta = \dfrac{1 - \ln 2}{2{,}5} = \dfrac{0{,}307}{2{,}5} \approx 12\%$
SEN: $Q_{12} = \dfrac{5}{2}p_0 V_0$; $\ W_{12} = p_0V_0$, $\ W_{23} = 0$, $\ W_{31} = -p_0V_0\ln 2$
$\eta = \dfrac{1 - \ln 2}{2.5} = \dfrac{0.307}{2.5} \approx 12\%$
AKA: $\approx 12\%$
AEN: $\approx 12\%$

--- hard engines olympiad
KA: ოკეანის თბური ელექტროსადგური ზედაპირის წყალს ($25\ \text{°C}$) და ღრმა წყალს ($5\ \text{°C}$) იყენებს. რა არის მაქსიმალური მქკ? რამდენი წყალი უნდა „გაიაროს“ წამში $1\ \text{მვტ}$-ისთვის, თუ ზედაპირის წყალი $2\ \text{°C}$-ით ცივდება?
EN: An ocean thermal power plant uses surface water ($25\ \text{°C}$) and deep water ($5\ \text{°C}$). What is the maximum efficiency? How much surface water per second must pass to give $1\ \text{MW}$, if it cools by $2\ \text{°C}$?
HKA: $Q_1 = \dfrac{P}{\eta}$, $m = \dfrac{Q_1}{c\Delta t}$.
HEN: $Q_1 = \dfrac{P}{\eta}$, $m = \dfrac{Q_1}{c\Delta t}$.
SKA: $\eta_{\max} = 1 - \dfrac{278}{298} \approx 6{,}7\%$
$Q_1 \approx 15\ \text{მვტ}$, $\ m = \dfrac{1{,}5 \cdot 10^7}{4200 \cdot 2} \approx 1800\ \text{კგ/წმ}$ (იდეალურ შემთხვევაშიც!)
SEN: $\eta_{\max} = 1 - \dfrac{278}{298} \approx 6.7\%$
$Q_1 \approx 15\ \text{MW}$, $\ m = \dfrac{1.5 \times 10^7}{4200 \cdot 2} \approx 1800\ \text{kg/s}$ (even ideally!)
AKA: $\approx 6{,}7\%$; $\approx 1{,}8\ \text{ტ/წმ}$
AEN: $\approx 6.7\%$; $\approx 1.8\ \text{t/s}$

--- easy humidity
KA: ჰაერში წყლის ორთქლის სიმკვრივე $10\ \text{გ/მ}^3$-ია, ნაჯერისა ამ ტემპერატურაზე — $17\ \text{გ/მ}^3$. იპოვეთ ფარდობითი ტენიანობა.
EN: The water-vapour density is $10\ \text{g/m}^3$ and the saturated density at that temperature is $17\ \text{g/m}^3$. Find the relative humidity.
HKA: $\varphi = \dfrac{\rho}{\rho_{\text{ნ}}}$.
HEN: $\varphi = \dfrac{\rho}{\rho_{\text{sat}}}$.
SKA: $\varphi = \dfrac{10}{17} \approx 59\%$
SEN: $\varphi = \dfrac{10}{17} \approx 59\%$
AKA: $\approx 59\%$
AEN: $\approx 59\%$

--- easy humidity
KA: რა არის ნამის წერტილი?
EN: What is the dew point?
HKA: ორთქლი ნაჯერი ხდება.
HEN: The vapour becomes saturated.
SKA: ტემპერატურა, რომლამდეც ჰაერის გაციებისას მასში არსებული ორთქლი ნაჯერი ხდება და ნამი (წყალი) იწყებს კონდენსაციას.
SEN: The temperature to which air must be cooled for its vapour to become saturated, so dew (water) starts to condense.
AKA: ტემპერატურა, რომელზეც ორთქლი ნაჯერი ხდება
AEN: the temperature at which the vapour becomes saturated

--- easy humidity
KA: რატომ არის სიცხე ნესტიან ამინდში უფრო ძნელად ასატანი, ვიდრე მშრალში?
EN: Why is heat harder to bear in humid weather than in dry weather?
HKA: ოფლის აორთქლება.
HEN: Evaporation of sweat.
SKA: ნესტიან ჰაერში ოფლი ნელა ორთქლდება და სხეულს ნაკლებად აცივებს.
SEN: In humid air sweat evaporates slowly and cools the body less.
AKA: ოფლი ნელა ორთქლდება
AEN: sweat evaporates slowly

--- easy humidity
KA: $20\ \text{°C}$-ზე ნაჯერი ორთქლის სიმკვრივე $17{,}3\ \text{გ/მ}^3$-ია. რამდენი წყლის ორთქლია $10\ \text{მ}^3$ ოთახში $50\%$ ტენიანობისას?
EN: At $20\ \text{°C}$ the saturated vapour density is $17.3\ \text{g/m}^3$. How much water vapour is in a $10\ \text{m}^3$ room at $50\%$ humidity?
HKA: $m = \varphi\rho_{\text{ნ}} V$.
HEN: $m = \varphi\rho_{\text{sat}} V$.
SKA: $m = 0{,}5 \cdot 17{,}3 \cdot 10 \approx 87\ \text{გ}$
SEN: $m = 0.5 \cdot 17.3 \cdot 10 \approx 87\ \text{g}$
AKA: $\approx 87\ \text{გ}$
AEN: $\approx 87\ \text{g}$

--- medium humidity
KA: საღამოს $20\ \text{°C}$-ზე ტენიანობა $70\%$-ია ($\rho_{\text{ნ}} = 17{,}3$). ღამით $10\ \text{°C}$-მდე ($\rho_{\text{ნ}} = 9{,}4\ \text{გ/მ}^3$) აცივდა. მოვა თუ არა ნამი? რამდენი წყალი გამოიყოფა $1\ \text{მ}^3$-ზე?
EN: In the evening at $20\ \text{°C}$ the humidity is $70\%$ ($\rho_{\text{sat}} = 17.3$). At night it cools to $10\ \text{°C}$ ($\rho_{\text{sat}} = 9.4\ \text{g/m}^3$). Will dew form? How much water condenses per $1\ \text{m}^3$?
HKA: შეადარეთ ორთქლის სიმკვრივე ახალ ნაჯერთან.
HEN: Compare the vapour density with the new saturated value.
SKA: $\rho = 0{,}7 \cdot 17{,}3 \approx 12{,}1 > 9{,}4$ — ნამი მოვა.
გამოიყოფა $\approx 12{,}1 - 9{,}4 = 2{,}7\ \text{გ}$
SEN: $\rho = 0.7 \cdot 17.3 \approx 12.1 > 9.4$ — dew forms.
About $12.1 - 9.4 = 2.7\ \text{g}$ condenses.
AKA: კი; $\approx 2{,}7\ \text{გ}$
AEN: yes; $\approx 2.7\ \text{g}$

--- medium humidity
KA: ოთახში ($60\ \text{მ}^3$, $22\ \text{°C}$, $\rho_{\text{ნ}} = 19{,}4\ \text{გ/მ}^3$) ტენიანობა $30\%$-ია. რამდენი წყალი უნდა აორთქლდეს, რომ $60\%$ გახდეს?
EN: A $60\ \text{m}^3$ room at $22\ \text{°C}$ ($\rho_{\text{sat}} = 19.4\ \text{g/m}^3$) is at $30\%$ humidity. How much water must evaporate to make it $60\%$?
HKA: $\Delta m = \Delta\varphi\rho_{\text{ნ}} V$.
HEN: $\Delta m = \Delta\varphi\rho_{\text{sat}} V$.
SKA: $\Delta m = 0{,}3 \cdot 19{,}4 \cdot 60 \approx 349\ \text{გ}$
SEN: $\Delta m = 0.3 \cdot 19.4 \cdot 60 \approx 349\ \text{g}$
AKA: $\approx 350\ \text{გ}$
AEN: $\approx 350\ \text{g}$

--- medium humidity
KA: რატომ „ოფლიანდება“ ზამთარში ცივი სათვალე, თბილ ოთახში შესვლისას?
EN: Why do cold glasses fog up when you walk into a warm room in winter?
HKA: მინის ტემპერატურა ნამის წერტილზე დაბალია.
HEN: The lenses are colder than the dew point.
SKA: ცივი მინის მახლობლად ოთახის ჰაერი ნამის წერტილზე დაბლა ცივდება — ორთქლი მინაზე კონდენსირდება წვრილ წვეთებად.
SEN: Room air next to the cold lenses cools below the dew point — vapour condenses on them as tiny droplets.
AKA: მინაზე კონდენსაცია
AEN: condensation on the lenses

--- medium humidity
KA: ფსიქრომეტრი: მშრალი თერმომეტრი $20\ \text{°C}$, სველი $14\ \text{°C}$. ცხრილის მიხედვით ტენიანობა $\approx 51\%$-ია. რატომ აჩვენებს სველი თერმომეტრი ნაკლებს? როდის იქნებოდა ჩვენებები ტოლი?
EN: A psychrometer: dry bulb $20\ \text{°C}$, wet bulb $14\ \text{°C}$; the table gives $\approx 51\%$ humidity. Why does the wet bulb read lower? When would they read the same?
HKA: აორთქლება აცივებს.
HEN: Evaporation cools.
SKA: სველი ქსოვილიდან წყალი ორთქლდება და თერმომეტრს აცივებს; რაც მშრალია ჰაერი, მით მეტია სხვაობა.
$100\%$ ტენიანობისას აორთქლება არ ხდება — ჩვენებები ტოლია.
SEN: Water evaporates from the wet wick and cools the thermometer; the drier the air, the bigger the difference.
At $100\%$ humidity nothing evaporates — the readings are equal.
AKA: აორთქლების გამო; $100\%$-ზე
AEN: because of evaporation; at $100\%$

--- hard humidity
KA: დახურულ ჭურჭელში ($10\ \text{ლ}$) ჰაერი $30\ \text{°C}$-ზეა ($\rho_{\text{ნ}} = 30{,}3\ \text{გ/მ}^3$), $\varphi = 40\%$. ჭურჭელი $10\ \text{°C}$-მდე ($\rho_{\text{ნ}} = 9{,}4$) გააცივეს. რამდენი წყალი გამოიყოფა?
EN: A sealed $10\ \text{L}$ vessel holds air at $30\ \text{°C}$ ($\rho_{\text{sat}} = 30.3\ \text{g/m}^3$), $\varphi = 40\%$. It is cooled to $10\ \text{°C}$ ($\rho_{\text{sat}} = 9.4$). How much water condenses?
HKA: მოცულობა მუდმივია.
HEN: The volume is constant.
SKA: $\rho = 0{,}4 \cdot 30{,}3 \approx 12{,}1\ \text{გ/მ}^3 > 9{,}4$
$\Delta m = (12{,}1 - 9{,}4) \cdot 0{,}01 \approx 0{,}027\ \text{გ}$
SEN: $\rho = 0.4 \cdot 30.3 \approx 12.1\ \text{g/m}^3 > 9.4$
$\Delta m = (12.1 - 9.4) \cdot 0.01 \approx 0.027\ \text{g}$
AKA: $\approx 27\ \text{მგ}$
AEN: $\approx 27\ \text{mg}$

--- hard humidity
KA: ჰაერი ($\varphi = 50\%$) იზოთერმულად $3$-ჯერ შეკუმშეს. რა იქნება ტენიანობა? რა ნაწილი ორთქლისა კონდენსირდება?
EN: Air at $\varphi = 50\%$ is compressed isothermally to a third of its volume. What is the humidity? What fraction of the vapour condenses?
HKA: ორთქლის სიმკვრივე $3$-ჯერ გაიზრდებოდა, მაგრამ ნაჯერზე მეტი ვერ იქნება.
HEN: The vapour density would triple, but it can't exceed saturation.
SKA: $0{,}5 \cdot 3 = 1{,}5 > 1$ — $\varphi = 100\%$.
დარჩება ორთქლის $\dfrac{1}{1{,}5} = \dfrac{2}{3}$, კონდენსირდება $\dfrac{1}{3}$.
SEN: $0.5 \cdot 3 = 1.5 > 1$ — $\varphi = 100\%$.
$\dfrac{1}{1.5} = \dfrac{2}{3}$ of the vapour remains; $\dfrac{1}{3}$ condenses.
AKA: $100\%$; $\dfrac{1}{3}$
AEN: $100\%$; $\dfrac{1}{3}$

--- hard humidity
KA: ორთქლის პარციალური წნევაა $1{,}4\ \text{კპა}$, $T = 293\ \text{K}$. იპოვეთ ორთქლის სიმკვრივე ($M = 0{,}018$) და ტენიანობა ($p_{\text{ნ}} = 2{,}33\ \text{კპა}$).
EN: The vapour's partial pressure is $1.4\ \text{kPa}$ at $293\ \text{K}$. Find its density ($M = 0.018$) and the humidity ($p_{\text{sat}} = 2.33\ \text{kPa}$).
HKA: $\rho = \dfrac{pM}{RT}$, $\varphi = \dfrac{p}{p_{\text{ნ}}}$.
HEN: $\rho = \dfrac{pM}{RT}$, $\varphi = \dfrac{p}{p_{\text{sat}}}$.
SKA: $\rho = \dfrac{1400 \cdot 0{,}018}{8{,}31 \cdot 293} \approx 0{,}0103\ \text{კგ/მ}^3 = 10{,}3\ \text{გ/მ}^3$
$\varphi = \dfrac{1{,}4}{2{,}33} \approx 60\%$
SEN: $\rho = \dfrac{1400 \cdot 0.018}{8.31 \cdot 293} \approx 0.0103\ \text{kg/m}^3 = 10.3\ \text{g/m}^3$
$\varphi = \dfrac{1.4}{2.33} \approx 60\%$
AKA: $\approx 10{,}3\ \text{გ/მ}^3$; $\approx 60\%$
AEN: $\approx 10.3\ \text{g/m}^3$; $\approx 60\%$

--- hard humidity
KA: ცივ ბოთლზე ($8\ \text{°C}$) $25\ \text{°C}$ ოთახში ($\rho_{\text{ნ}} = 23\ \text{გ/მ}^3$) წვეთები ჩნდება, ხოლო $12\ \text{°C}$-იან ბოთლზე — არა. შეაფასეთ ოთახის ტენიანობის საზღვრები. ($\rho_{\text{ნ}}(8\ \text{°C}) = 8{,}3$, $\rho_{\text{ნ}}(12\ \text{°C}) = 10{,}7\ \text{გ/მ}^3$)
EN: Droplets form on a cold bottle at $8\ \text{°C}$ in a $25\ \text{°C}$ room ($\rho_{\text{sat}} = 23\ \text{g/m}^3$) but not on one at $12\ \text{°C}$. Estimate the range of the room's humidity. ($\rho_{\text{sat}}$: $8.3$ at $8\ \text{°C}$, $10.7\ \text{g/m}^3$ at $12\ \text{°C}$)
HKA: ნამის წერტილი $8$-სა და $12\ \text{°C}$-ს შორისაა.
HEN: The dew point lies between $8$ and $12\ \text{°C}$.
SKA: $8{,}3 < \rho < 10{,}7\ \text{გ/მ}^3$ $\Rightarrow$ $36\% < \varphi < 47\%$
SEN: $8.3 < \rho < 10.7\ \text{g/m}^3$ $\Rightarrow$ $36\% < \varphi < 47\%$
AKA: $36\%$–$47\%$
AEN: $36\%$–$47\%$

--- easy liquids
KA: რატომ არის წყლის წვეთი სფეროს ფორმის?
EN: Why is a water drop spherical?
HKA: ზედაპირული დაჭიმულობა ზედაპირის მინიმიზაციას ცდილობს.
HEN: Surface tension tries to minimise the surface.
SKA: ზედაპირული დაჭიმულობა სითხის ზედაპირს მინიმალური ფართობისკენ „ეწევა“; მოცემული მოცულობისთვის უმცირესი ზედაპირი სფეროს აქვს.
SEN: Surface tension pulls the liquid's surface towards the least area; for a given volume a sphere has the smallest surface.
AKA: სფეროს უმცირესი ზედაპირი აქვს
AEN: a sphere has the least surface area

--- easy liquids
KA: რატომ შეუძლია წყალმზომს წყლის ზედაპირზე სიარული?
EN: Why can a pond skater walk on water?
HKA: ზედაპირული აპკი.
HEN: The surface "skin".
SKA: ზედაპირული დაჭიმულობის ძალა წყლის ზედაპირს ელასტიკურ აპკად აქცევს, რომელიც მსუბუქ მწერს იჭერს (მისი ფეხები წყლით არ სველდება).
SEN: Surface tension makes the water surface act like an elastic film that supports the light insect (its legs don't get wet).
AKA: ზედაპირული დაჭიმულობის გამო
AEN: because of surface tension

--- easy liquids
KA: $10\ \text{სმ}$ სიგრძის საზღვარზე წყლის ($\sigma = 0{,}073\ \text{ნ/მ}$) ზედაპირული დაჭიმულობის ძალა რას უდრის?
EN: What surface-tension force acts on a $10\ \text{cm}$ boundary of water ($\sigma = 0.073\ \text{N/m}$)?
HKA: $F = \sigma l$.
HEN: $F = \sigma l$.
SKA: $F = 0{,}073 \cdot 0{,}1 = 7{,}3 \cdot 10^{-3}\ \text{ნ}$
SEN: $F = 0.073 \cdot 0.1 = 7.3 \times 10^{-3}\ \text{N}$
AKA: $7{,}3\ \text{მნ}$
AEN: $7.3\ \text{mN}$

--- easy liquids
KA: რატომ ეშვება ვერცხლისწყალი მინის კაპილარში, წყალი კი ადის?
EN: Why does mercury fall in a glass capillary while water rises?
HKA: დასველება.
HEN: Wetting.
SKA: წყალი მინას ასველებს (მოლეკულები მინას უფრო იზიდავს, ვიდრე ერთმანეთს) — ჩაზნექილი მენისკი, ადის.
ვერცხლისწყალი არ ასველებს — ამოზნექილი მენისკი, ეშვება.
SEN: Water wets glass (its molecules are attracted more to the glass than to each other) — a concave meniscus, so it rises.
Mercury doesn't wet glass — a convex meniscus, so it falls.
AKA: წყალი ასველებს, ვერცხლისწყალი — არა
AEN: water wets glass, mercury doesn't

--- medium liquids
KA: კაპილარში ($r = 0{,}2\ \text{მმ}$) სპირტი ($\sigma = 0{,}022\ \text{ნ/მ}$, $\rho = 800\ \text{კგ/მ}^3$) რა სიმაღლეზე ავა?
EN: How high does alcohol ($\sigma = 0.022\ \text{N/m}$, $\rho = 800\ \text{kg/m}^3$) rise in a capillary of radius $0.2\ \text{mm}$?
HKA: $h = \dfrac{2\sigma}{\rho g r}$.
HEN: $h = \dfrac{2\sigma}{\rho g r}$.
SKA: $h = \dfrac{0{,}044}{800 \cdot 10 \cdot 2 \cdot 10^{-4}} \approx 0{,}0275\ \text{მ}$
SEN: $h = \dfrac{0.044}{800 \cdot 10 \cdot 2 \times 10^{-4}} \approx 0.0275\ \text{m}$
AKA: $\approx 2{,}75\ \text{სმ}$
AEN: $\approx 2.75\ \text{cm}$

--- medium liquids
KA: წყალი კაპილარში $3\ \text{სმ}$-ზე ავიდა. იპოვეთ კაპილარის რადიუსი.
EN: Water rises $3\ \text{cm}$ in a capillary. Find its radius.
HKA: $r = \dfrac{2\sigma}{\rho g h}$.
HEN: $r = \dfrac{2\sigma}{\rho g h}$.
SKA: $r = \dfrac{0{,}146}{1000 \cdot 10 \cdot 0{,}03} \approx 4{,}9 \cdot 10^{-4}\ \text{მ}$
SEN: $r = \dfrac{0.146}{1000 \cdot 10 \cdot 0.03} \approx 4.9 \times 10^{-4}\ \text{m}$
AKA: $\approx 0{,}5\ \text{მმ}$
AEN: $\approx 0.5\ \text{mm}$

--- medium liquids
KA: პიპეტიდან ($d = 2\ \text{მმ}$) $20$ წვეთი $0{,}9\ \text{გ}$ იწონის. იპოვეთ სითხის ზედაპირული დაჭიმულობა.
EN: $20$ drops from a pipette ($d = 2\ \text{mm}$) weigh $0.9\ \text{g}$. Find the liquid's surface tension.
HKA: მოწყვეტისას $m g = \sigma \pi d$.
HEN: At break-off $m g = \sigma \pi d$.
SKA: $m = 0{,}045\ \text{გ}$; $\ \sigma = \dfrac{4{,}5 \cdot 10^{-5} \cdot 10}{3{,}14 \cdot 0{,}002} \approx 0{,}072\ \text{ნ/მ}$ (წყალი)
SEN: $m = 0.045\ \text{g}$; $\ \sigma = \dfrac{4.5 \times 10^{-5} \cdot 10}{3.14 \cdot 0.002} \approx 0.072\ \text{N/m}$ (water)
AKA: $\approx 0{,}072\ \text{ნ/მ}$
AEN: $\approx 0.072\ \text{N/m}$

--- medium liquids
KA: საპნის აპკის ($\sigma = 0{,}04\ \text{ნ/მ}$) ფართობის $10\ \text{სმ}^2$-ით გაზრდა რა მუშაობას მოითხოვს?
EN: How much work is needed to increase a soap film's area ($\sigma = 0.04\ \text{N/m}$) by $10\ \text{cm}^2$?
HKA: აპკს ორი ზედაპირი აქვს: $A = 2\sigma\Delta S$.
HEN: The film has two surfaces: $W = 2\sigma\Delta S$.
SKA: $A = 2 \cdot 0{,}04 \cdot 10^{-3} = 8 \cdot 10^{-5}\ \text{ჯ}$
SEN: $W = 2 \cdot 0.04 \cdot 10^{-3} = 8 \times 10^{-5}\ \text{J}$
AKA: $80\ \text{მკჯ}$
AEN: $80\ \mu\text{J}$

--- medium liquids
KA: რატომ ამცირებს საპონი წყლის ზედაპირულ დაჭიმულობას? რატომ რეცხავს უკეთ?
EN: Why does soap lower water's surface tension? Why does it wash better?
HKA: ზედაპირულად აქტიური ნივთიერება.
HEN: A surfactant.
SKA: საპნის მოლეკულები ზედაპირზე გროვდება და მოლეკულებს შორის მიზიდვას ასუსტებს. ნაკლები დაჭიმულობის წყალი უკეთ აღწევს ქსოვილის ფორებში და ცხიმს ასველებს.
SEN: Soap molecules gather at the surface and weaken the attraction between water molecules. Water with lower tension gets into the fabric's pores better and wets grease.
AKA: ზედაპირზე გროვდება, დაჭიმულობას ამცირებს
AEN: it collects at the surface and lowers the tension

--- medium liquids
KA: წყალში ორ $1\ \text{მმ}$-იან და $0{,}5\ \text{მმ}$-იან კაპილარს ერთად უშვებენ. რამდენჯერ ავა წყალი უფრო მაღლა ვიწროში?
EN: Capillaries of radius $1\ \text{mm}$ and $0.5\ \text{mm}$ are dipped in water. How many times higher does water rise in the narrow one?
HKA: $h \sim \dfrac{1}{r}$.
HEN: $h \sim \dfrac{1}{r}$.
SKA: $2$-ჯერ.
SEN: $2$ times.
AKA: $2$-ჯერ
AEN: $2$ times

--- hard liquids
KA: საპნის ბუშტის ($R = 3\ \text{სმ}$, $\sigma = 0{,}04\ \text{ნ/მ}$) შიგნით რამდენით მეტია წნევა? რა მუშაობაა საჭირო მის გასაბერად?
EN: By how much does the pressure inside a soap bubble ($R = 3\ \text{cm}$, $\sigma = 0.04\ \text{N/m}$) exceed the outside? How much work does it take to blow it up?
HKA: $\Delta p = \dfrac{4\sigma}{R}$; $A = \sigma \cdot 2 \cdot 4\pi R^2$.
HEN: $\Delta p = \dfrac{4\sigma}{R}$; $W = \sigma \cdot 2 \cdot 4\pi R^2$.
SKA: $\Delta p = \dfrac{0{,}16}{0{,}03} \approx 5{,}3\ \text{პა}$
$A = 0{,}04 \cdot 8 \cdot 3{,}14 \cdot 9 \cdot 10^{-4} \approx 9 \cdot 10^{-4}\ \text{ჯ}$
SEN: $\Delta p = \dfrac{0.16}{0.03} \approx 5.3\ \text{Pa}$
$W = 0.04 \cdot 8 \cdot 3.14 \cdot 9 \times 10^{-4} \approx 9 \times 10^{-4}\ \text{J}$
AKA: $\approx 5{,}3\ \text{პა}$; $\approx 0{,}9\ \text{მჯ}$
AEN: $\approx 5.3\ \text{Pa}$; $\approx 0.9\ \text{mJ}$

--- hard liquids
KA: ორ პარალელურ მინის ფირფიტას შორის $d = 0{,}1\ \text{მმ}$ ღრეჩოა. რა სიმაღლეზე ავა წყალი?
EN: Two parallel glass plates are $0.1\ \text{mm}$ apart. How high does water rise between them?
HKA: $\rho g h d = 2\sigma$ (ორი კონტაქტის ხაზი).
HEN: $\rho g h d = 2\sigma$ (two contact lines).
SKA: $h = \dfrac{2 \cdot 0{,}073}{1000 \cdot 10 \cdot 10^{-4}} = 0{,}146\ \text{მ}$
SEN: $h = \dfrac{2 \cdot 0.073}{1000 \cdot 10 \cdot 10^{-4}} = 0.146\ \text{m}$
AKA: $\approx 14{,}6\ \text{სმ}$
AEN: $\approx 14.6\ \text{cm}$

--- hard liquids
KA: $1000$ ერთნაირი წვეთი ($r = 0{,}1\ \text{მმ}$) ერთ დიდ წვეთად შეერთდა. რამდენი ენერგია გამოიყოფა? ($\sigma = 0{,}073$)
EN: $1000$ identical droplets ($r = 0.1\ \text{mm}$) merge into one big drop. How much energy is released? ($\sigma = 0.073$)
HKA: $R = 10r$; ზედაპირის ფართობი $10$-ჯერ მცირდება.
HEN: $R = 10r$; the surface area falls $10$ times.
SKA: $S_1 = 1000 \cdot 4\pi r^2 = 4\pi \cdot 10^{-5}$, $\ S_2 = 4\pi \cdot 10^{-6}\ \text{მ}^2$
$E = \sigma(S_1 - S_2) = 0{,}073 \cdot 4\pi \cdot 9 \cdot 10^{-6} \approx 8{,}3 \cdot 10^{-6}\ \text{ჯ}$
SEN: $S_1 = 1000 \cdot 4\pi r^2 = 4\pi \times 10^{-5}$, $\ S_2 = 4\pi \times 10^{-6}\ \text{m}^2$
$E = \sigma(S_1 - S_2) = 0.073 \cdot 4\pi \cdot 9 \times 10^{-6} \approx 8.3 \times 10^{-6}\ \text{J}$
AKA: $\approx 8{,}3\ \text{მკჯ}$
AEN: $\approx 8.3\ \mu\text{J}$

--- hard liquids
KA: ფოლადის ნემსი ($l = 3\ \text{სმ}$, $\rho = 7800$) წყლის ზედაპირზე „ცურავს“. რა მაქსიმალური დიამეტრი შეიძლება ჰქონდეს?
EN: A steel needle ($3\ \text{cm}$ long, $\rho = 7800$) "floats" on water. What is its maximum diameter?
HKA: $m g \le 2\sigma l$.
HEN: $m g \le 2\sigma l$.
SKA: $7800 \cdot \dfrac{\pi d^2}{4} \cdot l \cdot 10 = 2 \cdot 0{,}073 \cdot l$
$d^2 = \dfrac{0{,}146 \cdot 4}{7800 \cdot 3{,}14 \cdot 10} \approx 2{,}4 \cdot 10^{-6} \Rightarrow d \approx 1{,}5\ \text{მმ}$
SEN: $7800 \cdot \dfrac{\pi d^2}{4} \cdot l \cdot 10 = 2 \cdot 0.073 \cdot l$
$d^2 = \dfrac{0.146 \cdot 4}{7800 \cdot 3.14 \cdot 10} \approx 2.4 \times 10^{-6} \Rightarrow d \approx 1.5\ \text{mm}$

AEN: $\approx 1.5\ \text{mm}$

--- hard liquids olympiad
KA: ხე $100\ \text{მ}$ სიმაღლისაა. რა რადიუსის კაპილარები დასჭირდებოდა წყლის ამაღლებას მხოლოდ კაპილარობით? რეალურია ეს?
EN: A tree is $100\ \text{m}$ tall. What capillary radius would lift water that high by capillarity alone? Is that realistic?
HKA: $r = \dfrac{2\sigma}{\rho g h}$.
HEN: $r = \dfrac{2\sigma}{\rho g h}$.
SKA: $r = \dfrac{0{,}146}{10^6} \approx 1{,}5 \cdot 10^{-7}\ \text{მ}$ — ხის ჭურჭლები ბევრად განიერია ($\sim 10^{-5}\ \text{მ}$); წყალს ძირითადად ფოთლებიდან აორთქლება „ეწევა“ (დაჭიმული წყლის სვეტი), კაპილარობა მხოლოდ ნაწილობრივ ეხმარება.
SEN: $r = \dfrac{0.146}{10^6} \approx 1.5 \times 10^{-7}\ \text{m}$ — the tree's vessels are much wider ($\sim 10^{-5}\ \text{m}$); the water is mainly pulled up by evaporation from the leaves (a column under tension); capillarity only helps a little.
AKA: $\approx 0{,}15\ \text{მკმ}$; არარეალურია
AEN: $\approx 0.15\ \mu\text{m}$; unrealistic

KA: ორი საპნის ბუშტი ($r_1 = 1\ \text{სმ}$ და $r_2 = 2\ \text{სმ}$) მილითაა შეერთებული. რა მოხდება? როდის შეწყდება პროცესი?

KA: რატომ ვერ იწვევს წითელი სინათლე თუთიისგან ($A = 4{,}2\ \text{ევ}$) ფოტოეფექტს, რაც არ უნდა ინტენსიური იყოს?
EN: Why can't red light, however bright, cause the photoelectric effect in zinc ($W = 4.2\ \text{eV}$)?

$E_e = \dfrac{p^2}{2m} \approx 6 \cdot 10^{-6}\ \text{ევ}$, ფოტონი $2{,}5\ \text{ევ}$ — ფოტონის ენერგია ბევრად მეტია.
SEN: $v = \dfrac{h}{m\lambda} = \dfrac{6.63 \times 10^{-34}}{9.1 \times 10^{-31} \cdot 5 \times 10^{-7}} \approx 1460\ \text{m/s}$
$E_e = \dfrac{p^2}{2m} \approx 6 \times 10^{-6}\ \text{eV}$, the photon $2.5\ \text{eV}$ — the photon's energy is far larger.

EN: A photocell ($W = 2\ \text{eV}$) lit by $1\ \text{mW}$ of $300\ \text{nm}$ light gives a photocurrent of $1\ \mu\text{A}$. What fraction of photons ejects an electron (quantum efficiency)?
HKA: შეადარეთ ელექტრონების და ფოტონების რიცხვი წამში.

--- hard quantum

$R \approx 600\ \text{კმ}$ (იდეალური პირობებში)

--- hard quantum olympiad
KA: ფოტონი სრულად შთაინთქმება უძრავი თავისუფალი ელექტრონის მიერ. აჩვენეთ, რომ ეს შეუძლებელია (ენერგიის და იმპულსის მუდმივობიდან).
EN: Show that a free electron at rest cannot completely absorb a photon (using energy and momentum conservation).
HKA: შეამოწმეთ, შეიძლება თუ არა ერთდროულად $E = pc$ (ფოტონი) და ელექტრონის ენერგია-იმპულსის კავშირი.
HEN: Check whether $E = pc$ (photon) can match the electron's energy–momentum relation.
SKA: შთანთქმის შემდეგ ელექტრონს $p = \dfrac{E}{c}$ იმპულსი და $m c^2 + E$ ენერგია ექნებოდა.
მაგრამ ელექტრონისთვის $\mathcal{E}^2 = (mc^2)^2 + (pc)^2 = (mc^2)^2 + E^2 < (mc^2 + E)^2$ — წინააღმდეგობა. ამიტომ შთანთქმა მხოლოდ ატომში შეიძლება (სადაც ბირთვი იმპულსის ნაწილს იღებს).
SEN: After absorption the electron would have momentum $p = \dfrac{E}{c}$ and energy $mc^2 + E$.
But for an electron $\mathcal{E}^2 = (mc^2)^2 + (pc)^2 = (mc^2)^2 + E^2 < (mc^2 + E)^2$ — a contradiction. So absorption needs a bound electron (the nucleus takes some momentum).
AKA: ენერგია და იმპულსი ერთდროულად ვერ ინახება
AEN: energy and momentum can't both be conserved

KA: დამუხტული სფერული ლითონის ბურთი ($R = 1\ \text{სმ}$) ვაკუუმშია და $200\ \text{ნმ}$ სინათლით ნათდება ($A = 4{,}5\ \text{ევ}$). რა მაქსიმალურ პოტენციალამდე დაიმუხტება? რა მუხტი ექნება?

SEN: $hf = 6.2\ \text{eV}$, $E_k = 1.7\ \text{eV}$ $\Rightarrow$ $\varphi = 1.7\ \text{V}$
$q = \dfrac{\varphi R}{k} = \dfrac{1.7 \cdot 0.01}{9 \times 10^9} \approx 1.9 \times 10^{-12}\ \text{C}$
AKA: $1{,}7\ \text{ვ}$; $\approx 1{,}9\ \text{პკ}$
AEN: $1.7\ \text{V}$; $\approx 1.9\ \text{pC}$

SKA: სპონტანური — აღგზნებული ატომი თავისით, შემთხვევით მიმართულებით ასხივებს.

--- hard atom
KA: ელექტრონი ($E = 13\ \text{ევ}$) ეჯახება ძირითად მდგომარეობაში მყოფ წყალბადის ატომს. რომელ დონეებამდე შეიძლება აღგზნება? რა ხაზებს დავინახავთ ხილულ არეში?
EN: An electron ($13\ \text{eV}$) hits a ground-state hydrogen atom. Up to which level can it excite the atom? Which visible lines may appear?
HKA: $E_n - E_1 \le 13\ \text{ევ}$.
HEN: $E_n - E_1 \le 13\ \text{eV}$.
SKA: $E_4 - E_1 = 12{,}75 < 13$, $E_5 - E_1 = 13{,}06 > 13$ — $n = 4$-მდე.
ხილული (ბალმერის) ხაზები: $3 \to 2$ ($656\ \text{ნმ}$) და $4 \to 2$ ($486\ \text{ნმ}$).
SEN: $E_4 - E_1 = 12.75 < 13$, $E_5 - E_1 = 13.06 > 13$ — up to $n = 4$.
Visible (Balmer) lines: $3 \to 2$ ($656\ \text{nm}$) and $4 \to 2$ ($486\ \text{nm}$).
AKA: $n = 4$-მდე; $656$ და $486\ \text{ნმ}$
AEN: up to $n = 4$; $656$ and $486\ \text{nm}$

--- hard atom
KA: იპოვეთ წყალბადის ატომში ელექტრონის ბრუნვის სიხშირე პირველ ორბიტაზე ($v_1 = 2{,}2 \cdot 10^6\ \text{მ/წმ}$, $r_1 = 5{,}3 \cdot 10^{-11}\ \text{მ}$). რატომ ვერ ხსნის კლასიკური ფიზიკა ატომის სტაბილურობას?
EN: Find the orbital frequency of the electron on hydrogen's first orbit ($v_1 = 2.2 \times 10^6\ \text{m/s}$, $r_1 = 5.3 \times 10^{-11}\ \text{m}$). Why can't classical physics explain the atom's stability?
HKA: $\nu = \dfrac{v}{2\pi r}$.
HEN: $f = \dfrac{v}{2\pi r}$.
SKA: $\nu = \dfrac{2{,}2 \cdot 10^6}{2\pi \cdot 5{,}3 \cdot 10^{-11}} \approx 6{,}6 \cdot 10^{15}\ \text{ჰც}$
კლასიკურად აჩქარებულად მოძრავი მუხტი ასხივებს — ელექტრონი ენერგიას დაკარგავდა და ბირთვზე $\sim 10^{-11}\ \text{წმ}$-ში დაეცემოდა.
SEN: $f = \dfrac{2.2 \times 10^6}{2\pi \cdot 5.3 \times 10^{-11}} \approx 6.6 \times 10^{15}\ \text{Hz}$
Classically an accelerating charge radiates — the electron would lose energy and spiral into the nucleus in $\sim 10^{-11}\ \text{s}$.
AKA: $\approx 6{,}6 \cdot 10^{15}\ \text{ჰც}$
AEN: $\approx 6.6 \times 10^{15}\ \text{Hz}$

--- hard atom olympiad
KA: მიონური წყალბადი: ელექტრონის ნაცვლად მიონი ($m_\mu \approx 207 m_e$) პროტონის გარშემო ბრუნავს. როგორ შეიცვლება ორბიტის რადიუსი და იონიზაციის ენერგია? (ბირთვის მოძრაობა უგულებელყავით)
EN: Muonic hydrogen: a muon ($m_\mu \approx 207 m_e$) orbits a proton instead of an electron. How do the orbit radius and ionisation energy change? (Ignore the nucleus's motion.)
HKA: $r \sim \dfrac{1}{m}$, $E \sim m$.
HEN: $r \sim \dfrac{1}{m}$, $E \sim m$.
SKA: $r_1 = \dfrac{0{,}053}{207} \approx 2{,}6 \cdot 10^{-4}\ \text{ნმ}$
$E = 13{,}6 \cdot 207 \approx 2{,}8\ \text{კევ}$
SEN: $r_1 = \dfrac{0.053}{207} \approx 2.6 \times 10^{-4}\ \text{nm}$
$E = 13.6 \cdot 207 \approx 2.8\ \text{keV}$
AKA: $r$ $207$-ჯერ ნაკლები; $E \approx 2{,}8\ \text{კევ}$
AEN: $r$ $207$ times smaller; $E \approx 2.8\ \text{keV}$

--- hard atom olympiad
KA: წყალბადის ატომის ენერგიის დონეები ბორის ფორმულით მივიღოთ: $m v r = n\hbar$ და $\dfrac{m v^2}{r} = \dfrac{k e^2}{r^2}$. გამოიყვანეთ $E_1$.
EN: Derive hydrogen's energy levels from Bohr's conditions $m v r = n\hbar$ and $\dfrac{m v^2}{r} = \dfrac{k e^2}{r^2}$. Find $E_1$.
HKA: $E = \dfrac{m v^2}{2} - \dfrac{k e^2}{r} = -\dfrac{m v^2}{2}$.
HEN: $E = \dfrac{m v^2}{2} - \dfrac{k e^2}{r} = -\dfrac{m v^2}{2}$.
SKA: $v = \dfrac{k e^2}{n\hbar}$ $\Rightarrow$ $E_n = -\dfrac{m k^2 e^4}{2\hbar^2 n^2}$
$E_1 = -\dfrac{9{,}1 \cdot 10^{-31} \cdot 81 \cdot 10^{18} \cdot 6{,}55 \cdot 10^{-76}}{2 \cdot 1{,}11 \cdot 10^{-68}} \approx -2{,}18 \cdot 10^{-18}\ \text{ჯ} = -13{,}6\ \text{ევ}$
SEN: $v = \dfrac{k e^2}{n\hbar}$ $\Rightarrow$ $E_n = -\dfrac{m k^2 e^4}{2\hbar^2 n^2}$
$E_1 = -\dfrac{9.1 \times 10^{-31} \cdot 81 \times 10^{18} \cdot 6.55 \times 10^{-76}}{2 \cdot 1.11 \times 10^{-68}} \approx -2.18 \times 10^{-18}\ \text{J} = -13.6\ \text{eV}$
AKA: $E_1 = -13{,}6\ \text{ევ}$
AEN: $E_1 = -13.6\ \text{eV}$

--- easy nucleus
KA: რამდენი პროტონი და ნეიტრონია $^{56}_{26}\text{Fe}$ ბირთვში?
EN: How many protons and neutrons are in $^{56}_{26}\text{Fe}$?
HKA: $N = A - Z$.
HEN: $N = A - Z$.
SKA: $Z = 26$ პროტონი, $N = 30$ ნეიტრონი
SEN: $Z = 26$ protons, $N = 30$ neutrons
AKA: $26$ და $30$
AEN: $26$ and $30$

--- easy nucleus
KA: რა არის იზოტოპები? მოიყვანეთ მაგალითი.
EN: What are isotopes? Give an example.
HKA: ერთი $Z$, სხვადასხვა $A$.
HEN: Same $Z$, different $A$.
SKA: ერთი ელემენტის ატომები ერთნაირი პროტონებით, მაგრამ განსხვავებული ნეიტრონებით. მაგ.: $^{12}\text{C}$ და $^{14}\text{C}$; $^{235}\text{U}$ და $^{238}\text{U}$.
SEN: Atoms of one element with the same number of protons but different numbers of neutrons. E.g. $^{12}\text{C}$ and $^{14}\text{C}$; $^{235}\text{U}$ and $^{238}\text{U}$.
AKA: ერთი $Z$, სხვა $A$; $^{12}\text{C}$, $^{14}\text{C}$
AEN: same $Z$, different $A$; $^{12}\text{C}$, $^{14}\text{C}$

--- easy nucleus
KA: რა ძალა აკავებს ბირთვში პროტონებს, რომლებიც ერთმანეთს ელექტრულად განიზიდავს?
EN: What holds protons together in a nucleus, though they repel electrically?
HKA: ბირთვული ძალები.
HEN: The nuclear force.
SKA: ძლიერი ბირთვული ურთიერთქმედება — ძალიან ძლიერი, მაგრამ მოკლემოქმედი ($\sim 10^{-15}\ \text{მ}$) მიზიდვა ნუკლონებს შორის, მუხტზე დამოუკიდებელი.
SEN: The strong nuclear force — a very strong but short-range ($\sim 10^{-15}\ \text{m}$) attraction between nucleons, independent of charge.
AKA: ძლიერი ბირთვული ძალა
AEN: the strong nuclear force

--- easy nucleus
KA: $1\ \text{მ.ა.ე.}$ მასის დეფექტს რა ენერგია შეესაბამება? რამდენი ჯოულია?
EN: What energy corresponds to a mass defect of $1\ \text{u}$? How many joules?
HKA: $1\ \text{მ.ა.ე.} \to 931{,}5\ \text{მევ}$.
HEN: $1\ \text{u} \to 931.5\ \text{MeV}$.
SKA: $931{,}5\ \text{მევ} = 931{,}5 \cdot 10^6 \cdot 1{,}6 \cdot 10^{-19} \approx 1{,}49 \cdot 10^{-10}\ \text{ჯ}$
SEN: $931.5\ \text{MeV} = 931.5 \times 10^6 \cdot 1.6 \times 10^{-19} \approx 1.49 \times 10^{-10}\ \text{J}$
AKA: $931{,}5\ \text{მევ} \approx 1{,}5 \cdot 10^{-10}\ \text{ჯ}$
AEN: $931.5\ \text{MeV} \approx 1.5 \times 10^{-10}\ \text{J}$

--- medium nucleus
KA: დეიტერიუმის ($^2_1\text{H}$) მასის დეფექტი იპოვეთ და ბმის ენერგია. ($m_p = 1{,}00728$, $m_n = 1{,}00867$, $m_d = 2{,}01355\ \text{მ.ა.ე.}$)
EN: Find the mass defect and binding energy of the deuteron. ($m_p = 1.00728$, $m_n = 1.00867$, $m_d = 2.01355\ \text{u}$)
HKA: $\Delta m = m_p + m_n - m_d$.
HEN: $\Delta m = m_p + m_n - m_d$.
SKA: $\Delta m = 0{,}0024\ \text{მ.ა.ე.}$, $\ E = 0{,}0024 \cdot 931{,}5 \approx 2{,}2\ \text{მევ}$
SEN: $\Delta m = 0.0024\ \text{u}$, $\ E = 0.0024 \cdot 931.5 \approx 2.2\ \text{MeV}$
AKA: $\approx 2{,}2\ \text{მევ}$
AEN: $\approx 2.2\ \text{MeV}$

--- medium nucleus
KA: ბირთვული რეაქცია $^{14}_7\text{N} + {}^4_2\text{He} \to {}^{17}_8\text{O} + X$. იპოვეთ $X$.
EN: In the reaction $^{14}_7\text{N} + {}^4_2\text{He} \to {}^{17}_8\text{O} + X$, identify $X$.
HKA: $A$ და $Z$ ინახება.
HEN: $A$ and $Z$ are conserved.
SKA: $A = 18 - 17 = 1$, $Z = 9 - 8 = 1$ — პროტონი ($^1_1\text{H}$) (რეზერფორდი, 1919).
SEN: $A = 18 - 17 = 1$, $Z = 9 - 8 = 1$ — a proton ($^1_1\text{H}$) (Rutherford, 1919).
AKA: პროტონი
AEN: a proton

--- medium nucleus
KA: $^{235}\text{U}$-ის $1\ \text{კგ}$-ის სრული დაშლისას ($200\ \text{მევ}$ თითო) რამდენი ენერგია გამოიყოფა? რამდენი ქვანახშირის ($q = 3 \cdot 10^7\ \text{ჯ/კგ}$) ეკვივალენტურია?
EN: How much energy is released by fission of $1\ \text{kg}$ of $^{235}\text{U}$ ($200\ \text{MeV}$ each)? How much coal ($q = 3 \times 10^7\ \text{J/kg}$) is that equivalent to?
HKA: $N = \dfrac{1000}{235} N_A$.
HEN: $N = \dfrac{1000}{235} N_A$.
SKA: $N \approx 2{,}56 \cdot 10^{24}$, $\ E = 2{,}56 \cdot 10^{24} \cdot 3{,}2 \cdot 10^{-11} \approx 8{,}2 \cdot 10^{13}\ \text{ჯ}$
ქვანახშირი: $\dfrac{8{,}2 \cdot 10^{13}}{3 \cdot 10^7} \approx 2{,}7 \cdot 10^6\ \text{კგ} \approx 2700\ \text{ტ}$
SEN: $N \approx 2.56 \times 10^{24}$, $\ E = 2.56 \times 10^{24} \cdot 3.2 \times 10^{-11} \approx 8.2 \times 10^{13}\ \text{J}$
Coal: $\dfrac{8.2 \times 10^{13}}{3 \times 10^7} \approx 2.7 \times 10^6\ \text{kg} \approx 2700\ \text{t}$
AKA: $\approx 8 \cdot 10^{13}\ \text{ჯ}$; $\approx 2700\ \text{ტ}$
AEN: $\approx 8 \times 10^{13}\ \text{J}$; $\approx 2700\ \text{t}$

--- medium nucleus
KA: რატომ გამოყოფს ენერგიას როგორც მძიმე ბირთვების დაშლა, ისე მსუბუქების სინთეზი?
EN: Why do both fission of heavy nuclei and fusion of light ones release energy?
HKA: ბმის ხვედრითი ენერგიის გრაფიკი.
HEN: The binding energy per nucleon curve.
SKA: ბმის ხვედრითი ენერგია მაქსიმალურია რკინასთან ($A \approx 56$, $\approx 8{,}8\ \text{მევ}$). მძიმე ბირთვები იყოფა, მსუბუქები ერთდება — ორივე შემთხვევაში პროდუქტები „რკინისკენ“ მიდის, ბმა ძლიერდება და სხვაობა ენერგიად გამოიყოფა.
SEN: The binding energy per nucleon peaks near iron ($A \approx 56$, $\approx 8.8\ \text{MeV}$). Heavy nuclei split and light ones merge — either way the products move towards iron, become more tightly bound, and the difference is released.
AKA: ბმის ხვედრითი ენერგია რკინასთან მაქსიმალურია
AEN: binding per nucleon peaks near iron

--- medium nucleus
KA: ბირთვის რადიუსი $R \approx 1{,}2 \cdot 10^{-15} A^{1/3}$ მ. იპოვეთ ურანის-238 ბირთვის რადიუსი და შეაფასეთ ბირთვული ნივთიერების სიმკვრივე.
EN: The nuclear radius is $R \approx 1.2 \times 10^{-15} A^{1/3}$ m. Find the radius of $^{238}\text{U}$ and estimate the density of nuclear matter.
HKA: $\rho = \dfrac{A m_p}{\frac{4}{3}\pi R^3}$.
HEN: $\rho = \dfrac{A m_p}{\frac{4}{3}\pi R^3}$.
SKA: $R = 1{,}2 \cdot 10^{-15} \cdot 6{,}2 \approx 7{,}4 \cdot 10^{-15}\ \text{მ}$
$\rho = \dfrac{m_p}{\frac{4}{3}\pi (1{,}2 \cdot 10^{-15})^3} \approx \dfrac{1{,}67 \cdot 10^{-27}}{7{,}2 \cdot 10^{-45}} \approx 2{,}3 \cdot 10^{17}\ \text{კგ/მ}^3$
SEN: $R = 1.2 \times 10^{-15} \cdot 6.2 \approx 7.4 \times 10^{-15}\ \text{m}$
$\rho = \dfrac{m_p}{\frac{4}{3}\pi (1.2 \times 10^{-15})^3} \approx \dfrac{1.67 \times 10^{-27}}{7.2 \times 10^{-45}} \approx 2.3 \times 10^{17}\ \text{kg/m}^3$
AKA: $\approx 7{,}4\ \text{ფმ}$; $\approx 2 \cdot 10^{17}\ \text{კგ/მ}^3$
AEN: $\approx 7.4\ \text{fm}$; $\approx 2 \times 10^{17}\ \text{kg/m}^3$

--- medium nucleus
KA: რა არის ჯაჭვური რეაქცია? რა არის კრიტიკული მასა?
EN: What is a chain reaction? What is critical mass?
HKA: დაშლისას ნეიტრონები გამოიყოფა.
HEN: Fission releases neutrons.
SKA: $^{235}\text{U}$-ის თითო დაშლისას $2$–$3$ ნეიტრონი გამოიყოფა, რომლებიც ახალ დაშლებს იწვევს — პროცესი თავს ინარჩუნებს.
კრიტიკული მასა — მინიმალური მასა, რომელშიც ნეიტრონები საკმარისად ხშირად ხვდება ბირთვებს და ჯაჭვი არ წყდება.
SEN: Each $^{235}\text{U}$ fission releases $2$–$3$ neutrons that cause new fissions — the process sustains itself.
Critical mass is the least mass in which enough neutrons hit nuclei that the chain doesn't die out.
AKA: თვითშენარჩუნებადი დაშლა; მინიმალური მასა
AEN: self-sustaining fission; the minimum mass

--- hard nucleus
KA: იპოვეთ $^4_2\text{He}$-ის ბმის ხვედრითი ენერგია. ($m_p = 1{,}00728$, $m_n = 1{,}00867$, $m_{\text{He}} = 4{,}00151\ \text{მ.ა.ე.}$ — ბირთვი)
EN: Find the binding energy per nucleon of $^4_2\text{He}$. ($m_p = 1.00728$, $m_n = 1.00867$, nuclear $m_{\text{He}} = 4.00151\ \text{u}$)
HKA: $\Delta m = 2m_p + 2m_n - m_{\text{He}}$.
HEN: $\Delta m = 2m_p + 2m_n - m_{\text{He}}$.
SKA: $\Delta m = 2{,}0146 + 2{,}01734 - 4{,}00151 = 0{,}03039\ \text{მ.ა.ე.}$
$E = 0{,}03039 \cdot 931{,}5 \approx 28{,}3\ \text{მევ}$, ხვედრითი $\approx 7{,}1\ \text{მევ}$
SEN: $\Delta m = 2.0146 + 2.01734 - 4.00151 = 0.03039\ \text{u}$
$E = 0.03039 \cdot 931.5 \approx 28.3\ \text{MeV}$, per nucleon $\approx 7.1\ \text{MeV}$
AKA: $\approx 7{,}1\ \text{მევ}$
AEN: $\approx 7.1\ \text{MeV}$

--- hard nucleus
KA: სინთეზის რეაქცია $^2_1\text{H} + {}^2_1\text{H} \to {}^3_2\text{He} + {}^1_0\text{n}$. მასები: $2{,}01410$; $3{,}01603$; $1{,}00867\ \text{მ.ა.ე.}$ (ატომური). იპოვეთ გამოყოფილი ენერგია.
EN: The fusion reaction $^2_1\text{H} + {}^2_1\text{H} \to {}^3_2\text{He} + {}^1_0\text{n}$. Masses: $2.01410$; $3.01603$; $1.00867\ \text{u}$ (atomic). Find the energy released.
HKA: $Q = (\sum m_{\text{საწ}} - \sum m_{\text{საბ}}) \cdot 931{,}5$.
HEN: $Q = (\sum m_{\text{in}} - \sum m_{\text{out}}) \cdot 931.5$.
SKA: $\Delta m = 4{,}02820 - 4{,}02470 = 0{,}0035\ \text{მ.ა.ე.}$
$Q \approx 3{,}26\ \text{მევ}$
SEN: $\Delta m = 4.02820 - 4.02470 = 0.0035\ \text{u}$
$Q \approx 3.26\ \text{MeV}$
AKA: $\approx 3{,}3\ \text{მევ}$
AEN: $\approx 3.3\ \text{MeV}$

--- hard nucleus
KA: ატომური ელექტროსადგური ($P = 1\ \text{გვტ}$ ელექტრული, $\eta = 33\%$) რამდენ $^{235}\text{U}$-ს „წვავს“ დღეში? ($200\ \text{მევ}$ თითო დაშლაზე)
EN: A nuclear plant ($1\ \text{GW}$ electrical, $\eta = 33\%$) "burns" how much $^{235}\text{U}$ per day? ($200\ \text{MeV}$ per fission)
HKA: სითბური სიმძლავრე $3\ \text{გვტ}$.
HEN: Thermal power $3\ \text{GW}$.
SKA: $E = 3 \cdot 10^9 \cdot 86\,400 \approx 2{,}6 \cdot 10^{14}\ \text{ჯ}$
$N = \dfrac{2{,}6 \cdot 10^{14}}{3{,}2 \cdot 10^{-11}} \approx 8{,}1 \cdot 10^{24}$; $\ m = \dfrac{8{,}1 \cdot 10^{24}}{6 \cdot 10^{23}} \cdot 0{,}235 \approx 3{,}2\ \text{კგ}$
SEN: $E = 3 \times 10^9 \cdot 86\,400 \approx 2.6 \times 10^{14}\ \text{J}$
$N = \dfrac{2.6 \times 10^{14}}{3.2 \times 10^{-11}} \approx 8.1 \times 10^{24}$; $\ m = \dfrac{8.1 \times 10^{24}}{6 \times 10^{23}} \cdot 0.235 \approx 3.2\ \text{kg}$
AKA: $\approx 3{,}2\ \text{კგ}$
AEN: $\approx 3.2\ \text{kg}$

--- hard nucleus
KA: ბირთვული რეაქციისთვის $^7_3\text{Li} + p \to 2\,{}^4_2\text{He}$ ($Q = 17{,}3\ \text{მევ}$) იპოვეთ ალფა-ნაწილაკების კინეტიკური ენერგიები, თუ პროტონის ენერგია უმნიშვნელოა.
EN: In $^7_3\text{Li} + p \to 2\,{}^4_2\text{He}$ ($Q = 17.3\ \text{MeV}$), find the alpha particles' kinetic energies if the proton's energy is negligible.
HKA: იმპულსი ნულია — ისინი საპირისპიროდ ფრინავენ ტოლი ენერგიით.
HEN: Total momentum is zero — they fly apart with equal energies.
SKA: თითოეულს $\dfrac{17{,}3}{2} \approx 8{,}65\ \text{მევ}$
SEN: Each gets $\dfrac{17.3}{2} \approx 8.65\ \text{MeV}$
AKA: $\approx 8{,}65\ \text{მევ}$ თითოეულს
AEN: $\approx 8.65\ \text{MeV}$ each

--- hard nucleus
KA: მზეში ყოველ წამში $\sim 6 \cdot 10^{11}\ \text{კგ}$ წყალბადი ჰელიუმად იქცევა, ხოლო მასის $0{,}7\%$ ენერგიად. იპოვეთ მზის სიმძლავრე.
EN: In the Sun $\sim 6 \times 10^{11}\ \text{kg}$ of hydrogen turns into helium each second, with $0.7\%$ of the mass becoming energy. Find the Sun's power.
HKA: $P = 0{,}007\, m c^2$.
HEN: $P = 0.007\, m c^2$.
SKA: $P = 0{,}007 \cdot 6 \cdot 10^{11} \cdot 9 \cdot 10^{16} \approx 3{,}8 \cdot 10^{26}\ \text{ვტ}$
SEN: $P = 0.007 \cdot 6 \times 10^{11} \cdot 9 \times 10^{16} \approx 3.8 \times 10^{26}\ \text{W}$
AKA: $\approx 3{,}8 \cdot 10^{26}\ \text{ვტ}$
AEN: $\approx 3.8 \times 10^{26}\ \text{W}$

--- hard nucleus
KA: ორი დეიტრონის შეერთებისთვის კულონის ბარიერი უნდა დაიძლიოს ($r \approx 3 \cdot 10^{-15}\ \text{მ}$). შეაფასეთ ბარიერის სიმაღლე და აუცილებელი ტემპერატურა ($E \sim kT$).
EN: Two deuterons must overcome the Coulomb barrier ($r \approx 3 \times 10^{-15}\ \text{m}$) to fuse. Estimate the barrier height and the temperature needed ($E \sim kT$).
HKA: $E = k_C\dfrac{e^2}{r}$.
HEN: $E = k_C\dfrac{e^2}{r}$.
SKA: $E = \dfrac{9 \cdot 10^9 \cdot 2{,}56 \cdot 10^{-38}}{3 \cdot 10^{-15}} \approx 7{,}7 \cdot 10^{-14}\ \text{ჯ} \approx 0{,}48\ \text{მევ}$
$T \sim \dfrac{E}{k} \approx 5{,}6 \cdot 10^9\ \text{K}$ (რეალურად ტუნელირებისა და სიჩქარეთა განაწილების გამო $\sim 10^8\ \text{K}$ საკმარისია)
SEN: $E = \dfrac{9 \times 10^9 \cdot 2.56 \times 10^{-38}}{3 \times 10^{-15}} \approx 7.7 \times 10^{-14}\ \text{J} \approx 0.48\ \text{MeV}$
$T \sim \dfrac{E}{k} \approx 5.6 \times 10^9\ \text{K}$ (in practice tunnelling and the speed distribution make $\sim 10^8\ \text{K}$ enough)
AKA: $\approx 0{,}5\ \text{მევ}$; $\sim 10^9$–$10^{10}\ \text{K}$
AEN: $\approx 0.5\ \text{MeV}$; $\sim 10^9$–$10^{10}\ \text{K}$

--- easy radio
KA: დაწერეთ ურანის $^{238}_{92}\text{U}$ ალფა-დაშლის განტოლება.
EN: Write the alpha-decay equation of $^{238}_{92}\text{U}$.
HKA: ალფა: $A - 4$, $Z - 2$.
HEN: Alpha: $A - 4$, $Z - 2$.
SKA: $^{238}_{92}\text{U} \to {}^{234}_{90}\text{Th} + {}^4_2\text{He}$
SEN: $^{238}_{92}\text{U} \to {}^{234}_{90}\text{Th} + {}^4_2\text{He}$
AKA: $^{234}_{90}\text{Th} + \alpha$
AEN: $^{234}_{90}\text{Th} + \alpha$

--- easy radio
KA: დაწერეთ $^{60}_{27}\text{Co}$-ის ბეტა-მინუს დაშლის განტოლება.
EN: Write the beta-minus decay of $^{60}_{27}\text{Co}$.
HKA: $\beta^-$: $Z + 1$, $A$ იგივე.
HEN: $\beta^-$: $Z + 1$, same $A$.
SKA: $^{60}_{27}\text{Co} \to {}^{60}_{28}\text{Ni} + {}^{0}_{-1}e + \tilde\nu$
SEN: $^{60}_{27}\text{Co} \to {}^{60}_{28}\text{Ni} + {}^{0}_{-1}e + \tilde\nu$
AKA: $^{60}_{28}\text{Ni} + e^- + \tilde\nu$
AEN: $^{60}_{28}\text{Ni} + e^- + \tilde\nu$

--- easy radio
KA: ნახევარდაშლის პერიოდი $5$ დღეა. რამდენი დარჩება $64\ \text{გ}$-დან $20$ დღის შემდეგ?
EN: The half-life is $5$ days. How much of $64\ \text{g}$ remains after $20$ days?
HKA: $m = m_0 \cdot 2^{-t/T}$.
HEN: $m = m_0 \cdot 2^{-t/T}$.
SKA: $\dfrac{t}{T} = 4$: $m = \dfrac{64}{16} = 4\ \text{გ}$
SEN: $\dfrac{t}{T} = 4$: $m = \dfrac{64}{16} = 4\ \text{g}$
AKA: $4\ \text{გ}$
AEN: $4\ \text{g}$

--- easy radio
KA: შეადარეთ ალფა, ბეტა და გამა გამოსხივების შეღწევადობა. რით შეიძლება მათი შეჩერება?
EN: Compare the penetrating power of alpha, beta and gamma radiation. What stops each?
HKA: ალფა — ყველაზე სუსტი.
HEN: Alpha is the weakest.
SKA: ალფა — ქაღალდის ფურცელი ან რამდენიმე სმ ჰაერი.
ბეტა — რამდენიმე მმ ალუმინი.
გამა — სქელი ტყვია ან ბეტონი (მთლიანად ვერ ჩერდება, მხოლოდ სუსტდება).
SEN: Alpha — a sheet of paper or a few cm of air.
Beta — a few mm of aluminium.
Gamma — thick lead or concrete (it's only weakened, never fully stopped).
AKA: ალფა — ქაღალდი; ბეტა — ალუმინი; გამა — ტყვია
AEN: alpha — paper; beta — aluminium; gamma — lead

--- easy radio
KA: რამდენი ნახევარდაშლის პერიოდის შემდეგ დარჩება საწყისი ბირთვების $\dfrac{1}{32}$?
EN: After how many half-lives does $\dfrac{1}{32}$ of the nuclei remain?
HKA: $2^n = 32$.
HEN: $2^n = 32$.
SKA: $n = 5$
SEN: $n = 5$
AKA: $5$
AEN: $5$

--- easy radio
KA: დაწერეთ ნახშირბად-11-ის $\beta^+$ დაშლა.
EN: Write the $\beta^+$ decay of carbon-11.
HKA: $\beta^+$: $Z - 1$.
HEN: $\beta^+$: $Z - 1$.
SKA: $^{11}_{6}\text{C} \to {}^{11}_{5}\text{B} + {}^{0}_{+1}e + \nu$
SEN: $^{11}_{6}\text{C} \to {}^{11}_{5}\text{B} + {}^{0}_{+1}e + \nu$
AKA: $^{11}_{5}\text{B} + e^+ + \nu$
AEN: $^{11}_{5}\text{B} + e^+ + \nu$

--- easy radio
KA: იოდი-131 ($T = 8$ დღე) სამედიცინოდ გამოიყენება. რა ნაწილი დარჩება ორგანიზმში $24$ დღის შემდეგ (გამოყოფის გარეშე)?
EN: Iodine-131 ($T = 8$ days) is used in medicine. What fraction remains in the body after $24$ days (ignoring excretion)?
HKA: $\dfrac{t}{T} = 3$.
HEN: $\dfrac{t}{T} = 3$.
SKA: $\dfrac{1}{8} = 12{,}5\%$
SEN: $\dfrac{1}{8} = 12.5\%$
AKA: $\dfrac{1}{8}$
AEN: $\dfrac{1}{8}$

--- easy radio
KA: რა არის რადიოაქტივობის აქტიურობა? რა ერთეულით იზომება?
EN: What is the activity of a radioactive sample? What unit is it measured in?
HKA: დაშლები წამში.
HEN: Decays per second.
SKA: აქტიურობა — დროის ერთეულში დაშლილი ბირთვების რიცხვი. ერთეული — ბეკერელი ($1\ \text{ბკ} = 1$ დაშლა/წმ).
SEN: Activity is the number of nuclei decaying per unit time. Unit: the becquerel ($1\ \text{Bq} = 1$ decay/s).
AKA: დაშლები/წმ; ბეკერელი
AEN: decays per second; becquerel

--- medium radio
KA: $12$ საათში ნიმუშის აქტიურობა $16$-ჯერ შემცირდა. იპოვეთ ნახევარდაშლის პერიოდი.
EN: In $12$ hours a sample's activity falls $16$ times. Find the half-life.
HKA: $2^{t/T} = 16$.
HEN: $2^{t/T} = 16$.
SKA: $\dfrac{t}{T} = 4 \Rightarrow T = 3\ \text{სთ}$
SEN: $\dfrac{t}{T} = 4 \Rightarrow T = 3\ \text{h}$
AKA: $3\ \text{სთ}$
AEN: $3\ \text{h}$

--- medium radio
KA: $^{232}_{90}\text{Th}$ გადაიქცევა $^{208}_{82}\text{Pb}$-ად. რამდენი ალფა და ბეტა დაშლაა?
EN: $^{232}_{90}\text{Th}$ decays to $^{208}_{82}\text{Pb}$. How many alpha and beta decays occur?
HKA: $A$ მხოლოდ ალფით იცვლება.
HEN: Only alpha changes $A$.
SKA: $\alpha$: $\dfrac{232 - 208}{4} = 6$; $Z$ შემცირდება $12$-ით: $90 - 12 = 78$, ხოლო საჭიროა $82$ — $4$ ცალი $\beta^-$.
SEN: $\alpha$: $\dfrac{232 - 208}{4} = 6$; that lowers $Z$ by $12$: $90 - 12 = 78$, but we need $82$ — so $4$ $\beta^-$ decays.
AKA: $6\alpha$, $4\beta^-$
AEN: $6\alpha$, $4\beta^-$

--- medium radio
KA: ხის ნიმუშში $^{14}\text{C}$ ($T = 5730$ წ.) ცოცხალი ხისას $\dfrac{1}{8}$-ია. რამდენი წლისაა?
EN: A wood sample has $\dfrac{1}{8}$ of the $^{14}\text{C}$ ($T = 5730$ yr) of living wood. How old is it?
HKA: $3$ ნახევარდაშლა.
HEN: Three half-lives.
SKA: $t = 3 \cdot 5730 \approx 17\,200$ წელი
SEN: $t = 3 \cdot 5730 \approx 17\,200$ years
AKA: $\approx 17\,200$ წელი
AEN: $\approx 17\,200$ years

--- medium radio
KA: რადიოაქტიური ნიმუშის ($T = 10$ დღე) აქტიურობა $8 \cdot 10^6\ \text{ბკ}$-ია. რა იქნება $30$ დღის შემდეგ?
EN: A sample ($T = 10$ days) has activity $8 \times 10^6\ \text{Bq}$. What will it be after $30$ days?
HKA: $A = A_0 \cdot 2^{-t/T}$.
HEN: $A = A_0 \cdot 2^{-t/T}$.
SKA: $A = \dfrac{8 \cdot 10^6}{8} = 10^6\ \text{ბკ}$
SEN: $A = \dfrac{8 \times 10^6}{8} = 10^6\ \text{Bq}$
AKA: $10^6\ \text{ბკ}$
AEN: $10^6\ \text{Bq}$

--- medium radio
KA: ბირთვების რა ნაწილი დაიშლება ნახევარდაშლის პერიოდის ნახევარში?
EN: What fraction of the nuclei decays in half a half-life?
HKA: დარჩენილი $2^{-1/2}$.
HEN: Remaining: $2^{-1/2}$.
SKA: დარჩება $\dfrac{1}{\sqrt 2} \approx 0{,}707$, დაიშლება $\approx 29\%$ (არა $25\%$!).
SEN: $\dfrac{1}{\sqrt 2} \approx 0.707$ remains, so $\approx 29\%$ decays (not $25\%$!).
AKA: $\approx 29\%$
AEN: $\approx 29\%$

--- medium radio
KA: რას ნიშნავს, რომ რადიოაქტიური დაშლა შემთხვევითი პროცესია? შეიძლება თუ არა ვიწინასწარმეტყველოთ, როდის დაიშლება ერთი კონკრეტული ბირთვი?
EN: What does it mean that radioactive decay is random? Can we predict when a particular nucleus will decay?
HKA: სტატისტიკური კანონი.
HEN: A statistical law.
SKA: ერთი ბირთვის დაშლის მომენტი არ შეიძლება ვიწინასწარმეტყველოთ — ცნობილია მხოლოდ ალბათობა. ნახევარდაშლის კანონი დიდი რაოდენობის ბირთვებისთვის სრულდება.
SEN: When a single nucleus decays can't be predicted — only the probability is known. The half-life law holds for large numbers of nuclei.
AKA: არა, მხოლოდ ალბათობა
AEN: no, only the probability

--- hard radio
KA: $1\ \text{გ}$ რადიუმის ($^{226}\text{Ra}$, $T = 1600$ წ.) აქტიურობა იპოვეთ. ($\lambda = \dfrac{\ln 2}{T}$, $1$ წ. $= 3{,}15 \cdot 10^7\ \text{წმ}$)
EN: Find the activity of $1\ \text{g}$ of radium ($^{226}\text{Ra}$, $T = 1600$ yr). ($\lambda = \dfrac{\ln 2}{T}$, $1$ yr $= 3.15 \times 10^7\ \text{s}$)
HKA: $A = \lambda N$.
HEN: $A = \lambda N$.
SKA: $N = \dfrac{1}{226} \cdot 6{,}02 \cdot 10^{23} \approx 2{,}66 \cdot 10^{21}$
$\lambda = \dfrac{0{,}693}{5{,}04 \cdot 10^{10}} \approx 1{,}37 \cdot 10^{-11}\ \text{წმ}^{-1}$
$A \approx 3{,}7 \cdot 10^{10}\ \text{ბკ}$ (ეს არის $1$ კიური!)
SEN: $N = \dfrac{1}{226} \cdot 6.02 \times 10^{23} \approx 2.66 \times 10^{21}$
$\lambda = \dfrac{0.693}{5.04 \times 10^{10}} \approx 1.37 \times 10^{-11}\ \text{s}^{-1}$
$A \approx 3.7 \times 10^{10}\ \text{Bq}$ (that's $1$ curie!)
AKA: $\approx 3{,}7 \cdot 10^{10}\ \text{ბკ}$
AEN: $\approx 3.7 \times 10^{10}\ \text{Bq}$

--- hard radio
KA: ორი იზოტოპის თავდაპირველად ტოლი რაოდენობაა: $T_1 = 2$ სთ, $T_2 = 3$ სთ. რამდენ ხანში იქნება მეორე $2$-ჯერ მეტი პირველზე?
EN: Two isotopes start in equal amounts: $T_1 = 2\ \text{h}$, $T_2 = 3\ \text{h}$. When will the second be twice as plentiful as the first?
HKA: $\dfrac{N_2}{N_1} = 2^{t/T_1 - t/T_2}$.
HEN: $\dfrac{N_2}{N_1} = 2^{t/T_1 - t/T_2}$.
SKA: $t\left(\dfrac{1}{2} - \dfrac{1}{3}\right) = 1 \Rightarrow t = 6\ \text{სთ}$
SEN: $t\left(\dfrac{1}{2} - \dfrac{1}{3}\right) = 1 \Rightarrow t = 6\ \text{h}$
AKA: $6\ \text{სთ}$
AEN: $6\ \text{h}$

--- hard radio
KA: ალფა-ნაწილაკი ($E = 5\ \text{მევ}$) $^{226}\text{Ra}$-ის დაშლისას გამოდის. რა კინეტიკურ ენერგიას იღებს ბირთვი-ნამთი ($^{222}\text{Rn}$)?
EN: An alpha particle leaves a $^{226}\text{Ra}$ decay with $5\ \text{MeV}$. What kinetic energy does the recoiling $^{222}\text{Rn}$ nucleus get?
HKA: იმპულსები ტოლია: $E \sim \dfrac{1}{m}$.
HEN: Equal momenta: $E \sim \dfrac{1}{m}$.
SKA: $E_{\text{Rn}} = 5 \cdot \dfrac{4}{222} \approx 0{,}09\ \text{მევ} = 90\ \text{კევ}$
SEN: $E_{\text{Rn}} = 5 \cdot \dfrac{4}{222} \approx 0.09\ \text{MeV} = 90\ \text{keV}$
AKA: $\approx 90\ \text{კევ}$
AEN: $\approx 90\ \text{keV}$

--- hard radio
KA: ორგანიზმში შეყვანილი ტექნეციუმი-99m ($T = 6\ \text{სთ}$) ასევე ბიოლოგიურად გამოიყოფა ($T_{\text{ბ}} = 24\ \text{სთ}$). იპოვეთ ეფექტური ნახევარდაშლის პერიოდი.
EN: Technetium-99m ($T = 6\ \text{h}$) in the body is also excreted biologically ($T_{\text{b}} = 24\ \text{h}$). Find the effective half-life.
HKA: $\dfrac{1}{T_{\text{ეფ}}} = \dfrac{1}{T} + \dfrac{1}{T_{\text{ბ}}}$.
HEN: $\dfrac{1}{T_{\text{eff}}} = \dfrac{1}{T} + \dfrac{1}{T_{\text{b}}}$.
SKA: $\dfrac{1}{T_{\text{ეფ}}} = \dfrac{1}{6} + \dfrac{1}{24} = \dfrac{5}{24} \Rightarrow T_{\text{ეფ}} = 4{,}8\ \text{სთ}$
SEN: $\dfrac{1}{T_{\text{eff}}} = \dfrac{1}{6} + \dfrac{1}{24} = \dfrac{5}{24} \Rightarrow T_{\text{eff}} = 4.8\ \text{h}$
AKA: $4{,}8\ \text{სთ}$
AEN: $4.8\ \text{h}$

--- hard radio olympiad
KA: დედამიწის ქანებში $^{40}\text{K}$ ($T = 1{,}25$ მლრდ წ.) $^{40}\text{Ar}$-ად იშლება. ქანში $\text{Ar} : \text{K} = 1 : 1$ (ყველა არგონი კალიუმიდანაა; სიმარტივისთვის ყველა დაშლა არგონს იძლევა). რამდენი წლისაა ქანი?
EN: In rocks $^{40}\text{K}$ ($T = 1.25$ Gyr) decays to $^{40}\text{Ar}$. A rock has $\text{Ar} : \text{K} = 1 : 1$ (all the argon came from potassium; for simplicity assume every decay gives argon). How old is the rock?
HKA: დარჩა ნახევარი.
HEN: Half remains.
SKA: $N_{\text{K}} = N_{\text{Ar}}$ ⇒ თავდაპირველი კალიუმის ნახევარი დარჩა ⇒ $t = T = 1{,}25$ მლრდ წელი.
SEN: $N_{\text{K}} = N_{\text{Ar}}$ ⇒ half the original potassium remains ⇒ $t = T = 1.25$ billion years.
AKA: $1{,}25$ მლრდ წელი
AEN: $1.25$ billion years

--- hard radio olympiad
KA: რადიოაქტიური ჯაჭვი $A \to B \to C$: $T_A = 10$ დღე, $T_B = 1$ დღე. დიდი დროის შემდეგ ($t \gg T_B$) $\dfrac{N_B}{N_A}$ რას უდრის (მდგრადი წონასწორობა)?
EN: Decay chain $A \to B \to C$ with $T_A = 10$ days and $T_B = 1$ day. After a long time ($t \gg T_B$), what is $\dfrac{N_B}{N_A}$ (transient equilibrium)?
HKA: წონასწორობისას $B$-ს წარმოქმნა და დაშლა ტოლდება: $\lambda_A N_A \approx \lambda_B N_B$.
HEN: At equilibrium $B$ is produced as fast as it decays: $\lambda_A N_A \approx \lambda_B N_B$.
SKA: $\dfrac{N_B}{N_A} \approx \dfrac{\lambda_A}{\lambda_B} = \dfrac{T_B}{T_A} = 0{,}1$ (ზუსტად $\dfrac{\lambda_A}{\lambda_B - \lambda_A} = \dfrac{1}{9} \approx 0{,}11$)
SEN: $\dfrac{N_B}{N_A} \approx \dfrac{\lambda_A}{\lambda_B} = \dfrac{T_B}{T_A} = 0.1$ (exactly $\dfrac{\lambda_A}{\lambda_B - \lambda_A} = \dfrac{1}{9} \approx 0.11$)
AKA: $\approx 0{,}11$
AEN: $\approx 0.11$

--- easy particles
KA: რა არის ანტინაწილაკი? მოიყვანეთ მაგალითი.
EN: What is an antiparticle? Give an example.
HKA: იგივე მასა, საპირისპირო მუხტი.
HEN: Same mass, opposite charge.
SKA: ნაწილაკი იგივე მასით და საპირისპირო მუხტით (და სხვა კვანტური რიცხვებით). მაგ.: ელექტრონი და პოზიტრონი; პროტონი და ანტიპროტონი.
SEN: A particle with the same mass and opposite charge (and other quantum numbers). E.g. the electron and the positron; the proton and the antiproton.
AKA: პოზიტრონი

KA: სამყაროს ასაკი ჰაბლის მუდმივით: $t \approx \dfrac{1}{H_0}$, $H_0 = 70\ \text{კმ/(წმ·მპკ)}$ ($1\ \text{მპკ} = 3{,}1 \cdot 10^{22}\ \text{მ}$). შეაფასეთ.
EN: Estimate the age of the Universe as $t \approx \dfrac{1}{H_0}$ with $H_0 = 70\ \text{km/(s·Mpc)}$ ($1\ \text{Mpc} = 3.1 \times 10^{22}\ \text{m}$).
HKA: $H_0$ გადაიყვანეთ $\text{წმ}^{-1}$-ში.
HEN: Convert $H_0$ to $\text{s}^{-1}$.
SKA: $H_0 = \dfrac{7 \cdot 10^4}{3{,}1 \cdot 10^{22}} \approx 2{,}26 \cdot 10^{-18}\ \text{წმ}^{-1}$
$t \approx 4{,}4 \cdot 10^{17}\ \text{წმ} \approx 14$ მლრდ წელი
SEN: $H_0 = \dfrac{7 \times 10^4}{3.1 \times 10^{22}} \approx 2.26 \times 10^{-18}\ \text{s}^{-1}$
$t \approx 4.4 \times 10^{17}\ \text{s} \approx 14$ billion years
AKA: $\approx 14$ მლრდ წელი
AEN: $\approx 14$ billion years

--- medium astro
KA: ნეიტრონული ვარსკვლავი: მასა $1{,}4$ მზისა ($2{,}8 \cdot 10^{30}\ \text{კგ}$), რადიუსი $10\ \text{კმ}$. შეაფასეთ სიმკვრივე და $g$ ზედაპირზე.
EN: A neutron star has $1.4$ solar masses ($2.8 \times 10^{30}\ \text{kg}$) and a $10\ \text{km}$ radius. Estimate its density and surface $g$.
HKA: $\rho = \dfrac{M}{\frac{4}{3}\pi R^3}$, $g = \dfrac{GM}{R^2}$.
HEN: $\rho = \dfrac{M}{\frac{4}{3}\pi R^3}$, $g = \dfrac{GM}{R^2}$.
SKA: $\rho \approx \dfrac{2{,}8 \cdot 10^{30}}{4{,}2 \cdot 10^{12}} \approx 6{,}7 \cdot 10^{17}\ \text{კგ/მ}^3$ (ბირთვული სიმკვრივე)
$g = \dfrac{6{,}67 \cdot 10^{-11} \cdot 2{,}8 \cdot 10^{30}}{10^8} \approx 1{,}9 \cdot 10^{12}\ \text{მ/წმ}^2$
SEN: $\rho \approx \dfrac{2.8 \times 10^{30}}{4.2 \times 10^{12}} \approx 6.7 \times 10^{17}\ \text{kg/m}^3$ (nuclear density)
$g = \dfrac{6.67 \times 10^{-11} \cdot 2.8 \times 10^{30}}{10^8} \approx 1.9 \times 10^{12}\ \text{m/s}^2$
AKA: $\sim 10^{18}\ \text{კგ/მ}^3$; $\sim 2 \cdot 10^{12}\ \text{მ/წმ}^2$
AEN: $\sim 10^{18}\ \text{kg/m}^3$; $\sim 2 \times 10^{12}\ \text{m/s}^2$

--- medium astro
KA: მზის ზედაპირის ტემპერატურაა $5800\ \text{K}$. ვინის კანონით სად არის მისი გამოსხივების მაქსიმუმი? რატომ ვხედავთ თვალით სწორედ ამ არეს?
EN: The Sun's surface is at $5800\ \text{K}$. By Wien's law where does its radiation peak? Why do our eyes see this region?
HKA: $\lambda_{\max} = \dfrac{b}{T}$.
HEN: $\lambda_{\max} = \dfrac{b}{T}$.
SKA: $\lambda_{\max} = \dfrac{2{,}9 \cdot 10^{-3}}{5800} = 500\ \text{ნმ}$ — მწვანე-ყვითელი. ევოლუციით თვალი მზის სინათლის მაქსიმუმს „მოერგო“.
SEN: $\lambda_{\max} = \dfrac{2.9 \times 10^{-3}}{5800} = 500\ \text{nm}$ — green-yellow. Our eyes evolved to match the peak of sunlight.
AKA: $500\ \text{ნმ}$
AEN: $500\ \text{nm}$

--- hard astro
KA: სტეფან-ბოლცმანის კანონი: $P = \sigma T^4 \cdot 4\pi R^2$ ($\sigma = 5{,}67 \cdot 10^{-8}$). მზის ($R = 7 \cdot 10^8\ \text{მ}$, $T = 5800\ \text{K}$) სიმძლავრე გამოთვალეთ.
EN: Stefan–Boltzmann law: $P = \sigma T^4 \cdot 4\pi R^2$ ($\sigma = 5.67 \times 10^{-8}$). Compute the Sun's power ($R = 7 \times 10^8\ \text{m}$, $T = 5800\ \text{K}$).
HKA: $T^4 \approx 1{,}13 \cdot 10^{15}$.
HEN: $T^4 \approx 1.13 \times 10^{15}$.
SKA: $P = 5{,}67 \cdot 10^{-8} \cdot 1{,}13 \cdot 10^{15} \cdot 4\pi \cdot 4{,}9 \cdot 10^{17} \approx 3{,}9 \cdot 10^{26}\ \text{ვტ}$
SEN: $P = 5.67 \times 10^{-8} \cdot 1.13 \times 10^{15} \cdot 4\pi \cdot 4.9 \times 10^{17} \approx 3.9 \times 10^{26}\ \text{W}$
AKA: $\approx 3{,}9 \cdot 10^{26}\ \text{ვტ}$
AEN: $\approx 3.9 \times 10^{26}\ \text{W}$

--- hard astro
KA: ორი ვარსკვლავი ერთნაირი ტემპერატურისაა, მაგრამ ერთის ნათება $100$-ჯერ მეტია. რამდენჯერ მეტია მისი რადიუსი?
EN: Two stars have the same temperature, but one is $100$ times more luminous. How many times larger is its radius?
HKA: $L \sim R^2 T^4$.
HEN: $L \sim R^2 T^4$.
SKA: $\dfrac{R_1}{R_2} = \sqrt{100} = 10$
SEN: $\dfrac{R_1}{R_2} = \sqrt{100} = 10$
AKA: $10$-ჯერ
AEN: $10$ times

--- hard astro
KA: მზე თავისი სიცოცხლის განმავლობაში ($10$ მლრდ წელი) წყალბადის $\sim 10\%$-ს „წვავს“ ($0{,}7\%$ მასა ენერგიად). შეამოწმეთ, საკმარისია თუ არა ეს მისი სიმძლავრისთვის ($3{,}8 \cdot 10^{26}\ \text{ვტ}$, $M = 2 \cdot 10^{30}\ \text{კგ}$).
EN: Over its life ($10$ billion years) the Sun "burns" $\sim 10\%$ of its hydrogen ($0.7\%$ of that mass becomes energy). Check that this can supply its power ($3.8 \times 10^{26}\ \text{W}$, $M = 2 \times 10^{30}\ \text{kg}$).
HKA: $E = 0{,}1 \cdot 0{,}007 \cdot M c^2$.
HEN: $E = 0.1 \cdot 0.007 \cdot M c^2$.
SKA: $E = 7 \cdot 10^{-4} \cdot 2 \cdot 10^{30} \cdot 9 \cdot 10^{16} \approx 1{,}26 \cdot 10^{44}\ \text{ჯ}$
$t = \dfrac{1{,}26 \cdot 10^{44}}{3{,}8 \cdot 10^{26}} \approx 3{,}3 \cdot 10^{17}\ \text{წმ} \approx 10{,}5$ მლრდ წელი ✓
SEN: $E = 7 \times 10^{-4} \cdot 2 \times 10^{30} \cdot 9 \times 10^{16} \approx 1.26 \times 10^{44}\ \text{J}$
$t = \dfrac{1.26 \times 10^{44}}{3.8 \times 10^{26}} \approx 3.3 \times 10^{17}\ \text{s} \approx 10.5$ billion years ✓
AKA: კი, $\approx 10$ მლრდ წელი
AEN: yes, $\approx 10$ billion years

--- hard astro
KA: კეპლერის III კანონით ($T^2 = \dfrac{4\pi^2 a^3}{GM}$) იპოვეთ მზის მასა, თუ დედამიწის ორბიტაა $a = 1{,}5 \cdot 10^{11}\ \text{მ}$, $T = 3{,}15 \cdot 10^7\ \text{წმ}$.
EN: From Kepler's third law ($T^2 = \dfrac{4\pi^2 a^3}{GM}$) find the Sun's mass, given the Earth's orbit $a = 1.5 \times 10^{11}\ \text{m}$ and $T = 3.15 \times 10^7\ \text{s}$.
HKA: $M = \dfrac{4\pi^2 a^3}{G T^2}$.
HEN: $M = \dfrac{4\pi^2 a^3}{G T^2}$.
SKA: $M = \dfrac{39{,}5 \cdot 3{,}375 \cdot 10^{33}}{6{,}67 \cdot 10^{-11} \cdot 9{,}9 \cdot 10^{14}} \approx 2 \cdot 10^{30}\ \text{კგ}$
SEN: $M = \dfrac{39.5 \cdot 3.375 \times 10^{33}}{6.67 \times 10^{-11} \cdot 9.9 \times 10^{14}} \approx 2 \times 10^{30}\ \text{kg}$
AKA: $\approx 2 \cdot 10^{30}\ \text{კგ}$
AEN: $\approx 2 \times 10^{30}\ \text{kg}$

--- hard astro olympiad
KA: რელიქტური გამოსხივების ტემპერატურაა $2{,}7\ \text{K}$. სად არის მისი მაქსიმუმი (ვინის კანონი)? რომელ დიაპაზონშია? რას გვეუბნება ის სამყაროს ისტორიაზე?
EN: The cosmic microwave background is at $2.7\ \text{K}$. Where is its peak (Wien's law)? In which band? What does it tell us about the Universe's history?
HKA: $\lambda_{\max} = \dfrac{b}{T}$.
HEN: $\lambda_{\max} = \dfrac{b}{T}$.
SKA: $\lambda_{\max} = \dfrac{2{,}9 \cdot 10^{-3}}{2{,}7} \approx 1{,}1\ \text{მმ}$ — მიკროტალღები.
ეს „დიდი აფეთქების“ ნარჩენი სითბოა: ადრეული ცხელი სამყაროს სინათლე გაფართოებით გაცივდა (ტალღის სიგრძე გაიჭიმა $\sim 1100$-ჯერ).
SEN: $\lambda_{\max} = \dfrac{2.9 \times 10^{-3}}{2.7} \approx 1.1\ \text{mm}$ — microwaves.
It's the leftover heat of the Big Bang: light from the early hot Universe, cooled as space expanded (its wavelength stretched $\sim 1100$ times).
AKA: $\approx 1\ \text{მმ}$; დიდი აფეთქების ნარჩენი
AEN: $\approx 1\ \text{mm}$; the Big Bang's afterglow

--- hard astro olympiad
KA: შავი ხვრელის „ტემპერატურა“ (ჰოკინგი) $T = \dfrac{\hbar c^3}{8\pi G M k}$. რატომ არის დიდი შავი ხვრელები ძალიან ცივი? იპოვეთ $T$ მზის მასის შავი ხვრელისთვის.
EN: A black hole's Hawking temperature is $T = \dfrac{\hbar c^3}{8\pi G M k}$. Why are large black holes very cold? Find $T$ for a solar-mass black hole.
HKA: $T \sim \dfrac{1}{M}$.
HEN: $T \sim \dfrac{1}{M}$.
SKA: $T = \dfrac{1{,}05 \cdot 10^{-34} \cdot 2{,}7 \cdot 10^{25}}{8\pi \cdot 6{,}67 \cdot 10^{-11} \cdot 2 \cdot 10^{30} \cdot 1{,}38 \cdot 10^{-23}} \approx 6 \cdot 10^{-8}\ \text{K}$
მასის ზრდასთან ერთად ტემპერატურა ეცემა — ასეთი შავი ხვრელი რელიქტურ გამოსხივებაზე ($2{,}7\ \text{K}$) ბევრად ცივია.
SEN: $T = \dfrac{1.05 \times 10^{-34} \cdot 2.7 \times 10^{25}}{8\pi \cdot 6.67 \times 10^{-11} \cdot 2 \times 10^{30} \cdot 1.38 \times 10^{-23}} \approx 6 \times 10^{-8}\ \text{K}$
The temperature falls as the mass grows — such a black hole is far colder than the microwave background ($2.7\ \text{K}$).
AKA: $\approx 6 \cdot 10^{-8}\ \text{K}$
AEN: $\approx 6 \times 10^{-8}\ \text{K}$
