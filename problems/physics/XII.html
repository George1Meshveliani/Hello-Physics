--- easy mkt
KA: რამდენი მოლეკულაა $2$ მოლ ნივთიერებაში?
EN: How many molecules are there in $2$ mol of a substance?
HKA: $N = \nu N_A$.
HEN: $N = \nu N_A$.
SKA: $N = \nu N_A$
$N = 2 \cdot 6{,}02 \cdot 10^{23} = 1{,}204 \cdot 10^{24}$
SEN: $N = \nu N_A$
$N = 2 \times 6.02 \times 10^{23} = 1.204 \times 10^{24}$
AKA: $\approx 1{,}2 \cdot 10^{24}$
AEN: $\approx 1.2 \times 10^{24}$

--- easy mkt
KA: წყლის მოლური მასაა $M = 18\ \text{გ/მოლი}$. რამდენი მოლი და რამდენი მოლეკულაა $90\ \text{გ}$ წყალში?
EN: Water has molar mass $M = 18\ \text{g/mol}$. How many moles and how many molecules are in $90\ \text{g}$ of water?
HKA: $\nu = \dfrac{m}{M}$, $\ N = \nu N_A$.
HEN: $\nu = \dfrac{m}{M}$, $\ N = \nu N_A$.
SKA: $\nu = \dfrac{m}{M} = \dfrac{90}{18} = 5\ \text{მოლი}$
$N = \nu N_A = 5 \cdot 6{,}02 \cdot 10^{23} = 3{,}01 \cdot 10^{24}$
SEN: $\nu = \dfrac{m}{M} = \dfrac{90}{18} = 5\ \text{mol}$
$N = \nu N_A = 5 \times 6.02 \times 10^{23} = 3.01 \times 10^{24}$
AKA: $5\ \text{მოლი}$; $3{,}01 \cdot 10^{24}$
AEN: $5\ \text{mol}$; $3.01 \times 10^{24}$

--- easy mkt
KA: იპოვეთ წყლის ერთი მოლეკულის მასა ($M = 0{,}018\ \text{კგ/მოლი}$).
EN: Find the mass of one water molecule ($M = 0.018\ \text{kg/mol}$).
HKA: $m_0 = \dfrac{M}{N_A}$.
HEN: $m_0 = \dfrac{M}{N_A}$.
SKA: $m_0 = \dfrac{M}{N_A}$
$m_0 = \dfrac{0{,}018}{6{,}02 \cdot 10^{23}} \approx 3 \cdot 10^{-26}\ \text{კგ}$
SEN: $m_0 = \dfrac{M}{N_A}$
$m_0 = \dfrac{0.018}{6.02 \times 10^{23}} \approx 3 \times 10^{-26}\ \text{kg}$
AKA: $\approx 3 \cdot 10^{-26}\ \text{კგ}$
AEN: $\approx 3 \times 10^{-26}\ \text{kg}$

--- easy mkt
KA: გადაიყვანეთ: $27\ \text{°C}$ კელვინებში და $100\ \text{K}$ ცელსიუსის გრადუსებში.
EN: Convert $27\ \text{°C}$ to kelvin and $100\ \text{K}$ to degrees Celsius.
HKA: $T = t + 273$.
HEN: $T = t + 273$.
SKA: $T = t + 273 = 27 + 273 = 300\ \text{K}$
$t = T - 273 = 100 - 273 = -173\ \text{°C}$
SEN: $T = t + 273 = 27 + 273 = 300\ \text{K}$
$t = T - 273 = 100 - 273 = -173\ \text{°C}$
AKA: $300\ \text{K}$; $-173\ \text{°C}$
AEN: $300\ \text{K}$; $-173\ \text{°C}$

--- easy mkt
KA: იპოვეთ აირის მოლეკულის გადატანითი მოძრაობის საშუალო კინეტიკური ენერგია $300\ \text{K}$ ტემპერატურაზე.
EN: Find the mean translational kinetic energy of a gas molecule at $300\ \text{K}$.
HKA: $\bar{E} = \dfrac{3}{2}kT$.
HEN: $\bar{E} = \dfrac{3}{2}kT$.
SKA: $\bar{E} = \dfrac{3}{2}kT$
$\bar{E} = 1{,}5 \cdot 1{,}38 \cdot 10^{-23} \cdot 300 \approx 6{,}2 \cdot 10^{-21}\ \text{ჯ}$
SEN: $\bar{E} = \dfrac{3}{2}kT$
$\bar{E} = 1.5 \times 1.38 \times 10^{-23} \times 300 \approx 6.2 \times 10^{-21}\ \text{J}$
AKA: $\approx 6{,}2 \cdot 10^{-21}\ \text{ჯ}$
AEN: $\approx 6.2 \times 10^{-21}\ \text{J}$

--- easy gaslaw
KA: $2$ მოლი იდეალური აირი $300\ \text{K}$ ტემპერატურაზე იკავებს $0{,}05\ \text{მ}^3$-ს. იპოვეთ აირის წნევა.
EN: $2$ mol of an ideal gas at $300\ \text{K}$ occupies $0.05\ \text{m}^3$. Find its pressure.
HKA: მენდელეევ-კლაპეირონის განტოლება: $pV = \nu RT$.
HEN: The ideal gas equation: $pV = \nu RT$.
SKA: $pV = \nu RT \Rightarrow p = \dfrac{\nu RT}{V}$
$p = \dfrac{2 \cdot 8{,}31 \cdot 300}{0{,}05} \approx 1 \cdot 10^5\ \text{პა}$
SEN: $pV = \nu RT \Rightarrow p = \dfrac{\nu RT}{V}$
$p = \dfrac{2 \times 8.31 \times 300}{0.05} \approx 1 \times 10^5\ \text{Pa}$
AKA: $\approx 10^5\ \text{პა}$
AEN: $\approx 10^5\ \text{Pa}$

--- easy gaslaw
KA: რამდენი მოლი აირია $8{,}31\ \text{ლ}$ მოცულობის ჭურჭელში, თუ წნევაა $10^5\ \text{პა}$, ტემპერატურა კი $400\ \text{K}$?
EN: How many moles of gas are in an $8.31\ \text{L}$ vessel at $10^5\ \text{Pa}$ and $400\ \text{K}$?
HKA: $\nu = \dfrac{pV}{RT}$; $1\ \text{ლ} = 10^{-3}\ \text{მ}^3$.
HEN: $\nu = \dfrac{pV}{RT}$; $1\ \text{L} = 10^{-3}\ \text{m}^3$.
SKA: $\nu = \dfrac{pV}{RT}$
$\nu = \dfrac{10^5 \cdot 8{,}31 \cdot 10^{-3}}{8{,}31 \cdot 400} = 0{,}25\ \text{მოლი}$
SEN: $\nu = \dfrac{pV}{RT}$
$\nu = \dfrac{10^5 \times 8.31 \times 10^{-3}}{8.31 \times 400} = 0.25\ \text{mol}$
AKA: $0{,}25\ \text{მოლი}$
AEN: $0.25\ \text{mol}$

--- easy gaslaw
KA: აირის წნევაა $p = 1{,}38 \cdot 10^5\ \text{პა}$, ტემპერატურა $T = 250\ \text{K}$. იპოვეთ მოლეკულების კონცენტრაცია $n$.
EN: A gas has pressure $p = 1.38 \times 10^5\ \text{Pa}$ and temperature $T = 250\ \text{K}$. Find the number density $n$ of molecules.
HKA: $p = nkT$.
HEN: $p = nkT$.
SKA: $p = nkT \Rightarrow n = \dfrac{p}{kT}$
$n = \dfrac{1{,}38 \cdot 10^5}{1{,}38 \cdot 10^{-23} \cdot 250} = 4 \cdot 10^{25}\ \text{მ}^{-3}$
SEN: $p = nkT \Rightarrow n = \dfrac{p}{kT}$
$n = \dfrac{1.38 \times 10^5}{1.38 \times 10^{-23} \times 250} = 4 \times 10^{25}\ \text{m}^{-3}$
AKA: $4 \cdot 10^{25}\ \text{მ}^{-3}$
AEN: $4 \times 10^{25}\ \text{m}^{-3}$

--- easy isoproc
KA: აირს იზოთერმულად კუმშავენ $6\ \text{ლ}$-დან $2\ \text{ლ}$-მდე. საწყისი წნევაა $10^5\ \text{პა}$. იპოვეთ საბოლოო წნევა.
EN: A gas is compressed isothermally from $6\ \text{L}$ to $2\ \text{L}$. The initial pressure is $10^5\ \text{Pa}$. Find the final pressure.
HKA: ბოილ-მარიოტის კანონი: $p_1V_1 = p_2V_2$.
HEN: Boyle's law: $p_1V_1 = p_2V_2$.
SKA: $p_1V_1 = p_2V_2 \Rightarrow p_2 = \dfrac{p_1V_1}{V_2}$
$p_2 = \dfrac{10^5 \cdot 6}{2} = 3 \cdot 10^5\ \text{პა}$
SEN: $p_1V_1 = p_2V_2 \Rightarrow p_2 = \dfrac{p_1V_1}{V_2}$
$p_2 = \dfrac{10^5 \times 6}{2} = 3 \times 10^5\ \text{Pa}$
AKA: $3 \cdot 10^5\ \text{პა}$
AEN: $3 \times 10^5\ \text{Pa}$

--- easy isoproc
KA: დახურულ ჭურჭელში აირის წნევაა $2 \cdot 10^5\ \text{პა}$ $300\ \text{K}$-ზე. რა იქნება წნევა $450\ \text{K}$-ზე?
EN: In a closed vessel a gas is at $2 \times 10^5\ \text{Pa}$ at $300\ \text{K}$. What is the pressure at $450\ \text{K}$?
HKA: იზოქორული პროცესი (შარლის კანონი): $\dfrac{p_1}{T_1} = \dfrac{p_2}{T_2}$.
HEN: An isochoric process (Gay-Lussac's pressure law): $\dfrac{p_1}{T_1} = \dfrac{p_2}{T_2}$.
SKA: $\dfrac{p_1}{T_1} = \dfrac{p_2}{T_2} \Rightarrow p_2 = p_1 \dfrac{T_2}{T_1}$
$p_2 = 2 \cdot 10^5 \cdot \dfrac{450}{300} = 3 \cdot 10^5\ \text{პა}$
SEN: $\dfrac{p_1}{T_1} = \dfrac{p_2}{T_2} \Rightarrow p_2 = p_1 \dfrac{T_2}{T_1}$
$p_2 = 2 \times 10^5 \times \dfrac{450}{300} = 3 \times 10^5\ \text{Pa}$
AKA: $3 \cdot 10^5\ \text{პა}$
AEN: $3 \times 10^5\ \text{Pa}$

--- easy isoproc
KA: აირი მუდმივი წნევისას $300\ \text{K}$-ზე იკავებს $3\ \text{ლ}$-ს. რა მოცულობას დაიკავებს $400\ \text{K}$-ზე?
EN: At constant pressure a gas occupies $3\ \text{L}$ at $300\ \text{K}$. What volume does it occupy at $400\ \text{K}$?
HKA: იზობარული პროცესი: $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$.
HEN: An isobaric process: $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$.
SKA: $V_2 = V_1 \dfrac{T_2}{T_1}$
$V_2 = 3 \cdot \dfrac{400}{300} = 4\ \text{ლ}$
SEN: $V_2 = V_1 \dfrac{T_2}{T_1}$
$V_2 = 3 \times \dfrac{400}{300} = 4\ \text{L}$
AKA: $4\ \text{ლ}$
AEN: $4\ \text{L}$

--- easy internal
KA: იპოვეთ $2$ მოლი ერთატომიანი იდეალური აირის შინაგანი ენერგია $300\ \text{K}$-ზე.
EN: Find the internal energy of $2$ mol of a monatomic ideal gas at $300\ \text{K}$.
HKA: $U = \dfrac{3}{2}\nu RT$.
HEN: $U = \dfrac{3}{2}\nu RT$.
SKA: $U = \dfrac{3}{2}\nu RT$
$U = 1{,}5 \cdot 2 \cdot 8{,}31 \cdot 300 \approx 7479\ \text{ჯ} \approx 7{,}5\ \text{კჯ}$
SEN: $U = \dfrac{3}{2}\nu RT$
$U = 1.5 \times 2 \times 8.31 \times 300 \approx 7479\ \text{J} \approx 7.5\ \text{kJ}$
AKA: $\approx 7{,}5\ \text{კჯ}$
AEN: $\approx 7.5\ \text{kJ}$

--- easy internal
KA: $1$ მოლი ერთატომიანი აირი $100\ \text{K}$-ით გაათბეს. რამდენით შეიცვალა მისი შინაგანი ენერგია?
EN: $1$ mol of a monatomic gas is heated by $100\ \text{K}$. By how much does its internal energy change?
HKA: $\Delta U = \dfrac{3}{2}\nu R \Delta T$.
HEN: $\Delta U = \dfrac{3}{2}\nu R \Delta T$.
SKA: $\Delta U = \dfrac{3}{2}\nu R \Delta T$
$\Delta U = 1{,}5 \cdot 1 \cdot 8{,}31 \cdot 100 \approx 1246\ \text{ჯ}$
SEN: $\Delta U = \dfrac{3}{2}\nu R \Delta T$
$\Delta U = 1.5 \times 1 \times 8.31 \times 100 \approx 1246\ \text{J}$
AKA: $\approx 1{,}25\ \text{კჯ}$-ით გაიზარდა
AEN: increases by $\approx 1.25\ \text{kJ}$

--- easy gaswork
KA: აირი $2 \cdot 10^5\ \text{პა}$ მუდმივი წნევისას $3\ \text{ლ}$-ით გაფართოვდა. რა მუშაობა შეასრულა აირმა?
EN: A gas expands by $3\ \text{L}$ at a constant pressure of $2 \times 10^5\ \text{Pa}$. How much work does it do?
HKA: $A = p\Delta V$.
HEN: $A = p\Delta V$.
SKA: $A = p\Delta V$
$A = 2 \cdot 10^5 \cdot 3 \cdot 10^{-3} = 600\ \text{ჯ}$
SEN: $A = p\Delta V$
$A = 2 \times 10^5 \times 3 \times 10^{-3} = 600\ \text{J}$
AKA: $600\ \text{ჯ}$
AEN: $600\ \text{J}$

--- easy gaswork
KA: აირს ათბობენ ხისტ დახურულ ბალონში. რა მუშაობას ასრულებს აირი? სად მიდის მიღებული სითბო?
EN: A gas is heated in a rigid closed cylinder. How much work does the gas do? Where does the heat go?
HKA: მუშაობა მოითხოვს მოცულობის ცვლილებას.
HEN: Work requires a change of volume.
SKA: $V = \text{const} \Rightarrow \Delta V = 0 \Rightarrow A = p\Delta V = 0$
$Q = \Delta U$ — მთელი სითბო შინაგანი ენერგიის გაზრდაზე (ტემპერატურის აწევაზე) იხარჯება.
SEN: $V = \text{const} \Rightarrow \Delta V = 0 \Rightarrow A = p\Delta V = 0$
$Q = \Delta U$ — all the heat goes into internal energy (raising the temperature).
AKA: $A = 0$; შინაგან ენერგიაზე
AEN: $A = 0$; into internal energy

--- easy gaswork
KA: აირი $10^5\ \text{პა}$ წნევისას $0{,}01\ \text{მ}^3$-დან $0{,}004\ \text{მ}^3$-მდე შეკუმშეს. რა მუშაობა შეასრულეს გარე ძალებმა აირზე?
EN: A gas at $10^5\ \text{Pa}$ is compressed from $0.01\ \text{m}^3$ to $0.004\ \text{m}^3$. How much work do external forces do on the gas?
HKA: შეკუმშვისას აირის მუშაობა უარყოფითია, გარე ძალებისა — დადებითი.
HEN: During compression the gas does negative work; external forces do positive work.
SKA: $A_{\text{აირი}} = p(V_2 - V_1) = 10^5 \cdot (-0{,}006) = -600\ \text{ჯ}$
$A_{\text{გარე}} = -A_{\text{აირი}} = 600\ \text{ჯ}$
SEN: $A_{\text{gas}} = p(V_2 - V_1) = 10^5 \times (-0.006) = -600\ \text{J}$
$A_{\text{ext}} = -A_{\text{gas}} = 600\ \text{J}$
AKA: $600\ \text{ჯ}$
AEN: $600\ \text{J}$

--- easy thermo1
KA: აირმა მიიღო $500\ \text{ჯ}$ სითბო და შეასრულა $200\ \text{ჯ}$ მუშაობა. როგორ შეიცვალა მისი შინაგანი ენერგია?
EN: A gas receives $500\ \text{J}$ of heat and does $200\ \text{J}$ of work. How does its internal energy change?
HKA: თერმოდინამიკის I კანონი: $Q = \Delta U + A$.
HEN: The first law of thermodynamics: $Q = \Delta U + A$.
SKA: $Q = \Delta U + A \Rightarrow \Delta U = Q - A$
$\Delta U = 500 - 200 = 300\ \text{ჯ}$
SEN: $Q = \Delta U + A \Rightarrow \Delta U = Q - A$
$\Delta U = 500 - 200 = 300\ \text{J}$
AKA: $300\ \text{ჯ}$-ით გაიზარდა
AEN: increases by $300\ \text{J}$

--- easy thermo1
KA: აირი სწრაფად (თბოცვლის გარეშე) შეკუმშეს, გარე ძალებმა შეასრულეს $300\ \text{ჯ}$ მუშაობა. როგორ შეიცვალა შინაგანი ენერგია და ტემპერატურა?
EN: A gas is compressed quickly (without heat exchange); external forces do $300\ \text{J}$ of work. How do its internal energy and temperature change?
HKA: ადიაბატური პროცესი: $Q = 0$.
HEN: An adiabatic process: $Q = 0$.
SKA: $Q = 0 \Rightarrow \Delta U = A_{\text{გარე}} = 300\ \text{ჯ}$
შინაგანი ენერგია გაიზარდა $\Rightarrow$ ტემპერატურა მოიმატა (ასე თბება ტუმბო ბორბლის გაბერვისას).
SEN: $Q = 0 \Rightarrow \Delta U = A_{\text{ext}} = 300\ \text{J}$
Internal energy increases $\Rightarrow$ the temperature rises (this is why a bicycle pump warms up).
AKA: $+300\ \text{ჯ}$; ტემპერატურა იზრდება
AEN: $+300\ \text{J}$; the temperature rises

--- easy engines
KA: სითბურმა ძრავამ გამაცხელებლისგან მიიღო $1000\ \text{ჯ}$, მაცივარს გადასცა $700\ \text{ჯ}$. იპოვეთ შესრულებული მუშაობა და მქკ.
EN: A heat engine takes $1000\ \text{J}$ from the hot reservoir and gives $700\ \text{J}$ to the cold one. Find the work done and the efficiency.
HKA: $A = Q_1 - Q_2$, $\ \eta = \dfrac{A}{Q_1}$.
HEN: $A = Q_1 - Q_2$, $\ \eta = \dfrac{A}{Q_1}$.
SKA: $A = Q_1 - Q_2 = 1000 - 700 = 300\ \text{ჯ}$
$\eta = \dfrac{A}{Q_1} = \dfrac{300}{1000} = 30\%$
SEN: $A = Q_1 - Q_2 = 1000 - 700 = 300\ \text{J}$
$\eta = \dfrac{A}{Q_1} = \dfrac{300}{1000} = 30\%$
AKA: $300\ \text{ჯ}$; $30\%$
AEN: $300\ \text{J}$; $30\%$

--- easy engines
KA: კარნოს იდეალური ძრავის გამაცხელებლის ტემპერატურაა $500\ \text{K}$, მაცივრისა — $300\ \text{K}$. იპოვეთ მქკ.
EN: An ideal Carnot engine works between $500\ \text{K}$ and $300\ \text{K}$. Find its efficiency.
HKA: $\eta = \dfrac{T_1 - T_2}{T_1}$.
HEN: $\eta = \dfrac{T_1 - T_2}{T_1}$.
SKA: $\eta = \dfrac{T_1 - T_2}{T_1}$
$\eta = \dfrac{500 - 300}{500} = 0{,}4 = 40\%$
SEN: $\eta = \dfrac{T_1 - T_2}{T_1}$
$\eta = \dfrac{500 - 300}{500} = 0.4 = 40\%$
AKA: $40\%$
AEN: $40\%$

--- easy humidity
KA: ჰაერში წყლის ორთქლის სიმკვრივეა $8{,}65\ \text{გ/მ}^3$, ხოლო ნაჯერი ორთქლის სიმკვრივე ამ ტემპერატურაზე — $17{,}3\ \text{გ/მ}^3$. იპოვეთ ფარდობითი ტენიანობა.
EN: The water-vapour density in air is $8.65\ \text{g/m}^3$, and the saturated vapour density at this temperature is $17.3\ \text{g/m}^3$. Find the relative humidity.
HKA: $\varphi = \dfrac{\rho}{\rho_{\text{ნ}}} \cdot 100\%$.
HEN: $\varphi = \dfrac{\rho}{\rho_{\text{sat}}} \times 100\%$.
SKA: $\varphi = \dfrac{\rho}{\rho_{\text{ნ}}} \cdot 100\%$
$\varphi = \dfrac{8{,}65}{17{,}3} \cdot 100\% = 50\%$
SEN: $\varphi = \dfrac{\rho}{\rho_{\text{sat}}} \times 100\%$
$\varphi = \dfrac{8.65}{17.3} \times 100\% = 50\%$
AKA: $50\%$
AEN: $50\%$

--- easy humidity
KA: $50\ \text{მ}^3$ მოცულობის ოთახის ჰაერში $600\ \text{გ}$ წყლის ორთქლია. იპოვეთ აბსოლუტური ტენიანობა.
EN: The air in a $50\ \text{m}^3$ room contains $600\ \text{g}$ of water vapour. Find the absolute humidity.
HKA: აბსოლუტური ტენიანობა — ორთქლის სიმკვრივე: $\rho = \dfrac{m}{V}$.
HEN: Absolute humidity is the vapour density: $\rho = \dfrac{m}{V}$.
SKA: $\rho = \dfrac{m}{V} = \dfrac{600}{50} = 12\ \text{გ/მ}^3$
SEN: $\rho = \dfrac{m}{V} = \dfrac{600}{50} = 12\ \text{g/m}^3$
AKA: $12\ \text{გ/მ}^3$
AEN: $12\ \text{g/m}^3$

--- easy liquids
KA: რა ძალით მოქმედებს წყლის ზედაპირული დაჭიმულობა $5\ \text{სმ}$ სიგრძის საზღვარზე? ($\sigma = 0{,}073\ \text{ნ/მ}$)
EN: What surface-tension force acts along a $5\ \text{cm}$ boundary of water? ($\sigma = 0.073\ \text{N/m}$)
HKA: $F = \sigma l$.
HEN: $F = \sigma l$.
SKA: $F = \sigma l$
$F = 0{,}073 \cdot 0{,}05 \approx 3{,}7 \cdot 10^{-3}\ \text{ნ}$
SEN: $F = \sigma l$
$F = 0.073 \times 0.05 \approx 3.7 \times 10^{-3}\ \text{N}$
AKA: $\approx 3{,}7\ \text{მნ}$
AEN: $\approx 3.7\ \text{mN}$

--- easy liquids
KA: რა სიმაღლეზე ავა წყალი $0{,}5\ \text{მმ}$ რადიუსიან კაპილარში? ($\sigma = 0{,}073\ \text{ნ/მ}$, სრული დასველება)
EN: How high does water rise in a capillary of radius $0.5\ \text{mm}$? ($\sigma = 0.073\ \text{N/m}$, complete wetting)
HKA: $h = \dfrac{2\sigma}{\rho g r}$.
HEN: $h = \dfrac{2\sigma}{\rho g r}$.
SKA: $h = \dfrac{2\sigma}{\rho g r}$
$h = \dfrac{2 \cdot 0{,}073}{1000 \cdot 10 \cdot 5 \cdot 10^{-4}} \approx 0{,}029\ \text{მ} = 2{,}9\ \text{სმ}$
SEN: $h = \dfrac{2\sigma}{\rho g r}$
$h = \dfrac{2 \times 0.073}{1000 \times 10 \times 5 \times 10^{-4}} \approx 0.029\ \text{m} = 2.9\ \text{cm}$
AKA: $\approx 2{,}9\ \text{სმ}$
AEN: $\approx 2.9\ \text{cm}$

--- easy quantum
KA: იპოვეთ $500\ \text{ნმ}$ ტალღის სიგრძის (მწვანე) სინათლის ფოტონის ენერგია ჯოულებში და ელექტრონვოლტებში.
EN: Find the energy of a photon of $500\ \text{nm}$ (green) light in joules and electronvolts.
HKA: $E = h\nu = \dfrac{hc}{\lambda}$.
HEN: $E = h\nu = \dfrac{hc}{\lambda}$.
SKA: $E = \dfrac{hc}{\lambda}$
$E = \dfrac{6{,}63 \cdot 10^{-34} \cdot 3 \cdot 10^8}{5 \cdot 10^{-7}} \approx 4 \cdot 10^{-19}\ \text{ჯ}$
$E = \dfrac{3{,}98 \cdot 10^{-19}}{1{,}6 \cdot 10^{-19}} \approx 2{,}5\ \text{ევ}$
SEN: $E = \dfrac{hc}{\lambda}$
$E = \dfrac{6.63 \times 10^{-34} \times 3 \times 10^8}{5 \times 10^{-7}} \approx 4 \times 10^{-19}\ \text{J}$
$E = \dfrac{3.98 \times 10^{-19}}{1.6 \times 10^{-19}} \approx 2.5\ \text{eV}$
AKA: $\approx 4 \cdot 10^{-19}\ \text{ჯ} \approx 2{,}5\ \text{ევ}$
AEN: $\approx 4 \times 10^{-19}\ \text{J} \approx 2.5\ \text{eV}$

--- easy quantum
KA: ფოტონის სიხშირეა $10^{15}\ \text{ჰც}$. იპოვეთ მისი ენერგია.
EN: A photon has frequency $10^{15}\ \text{Hz}$. Find its energy.
HKA: $E = h\nu$.
HEN: $E = h\nu$.
SKA: $E = h\nu = 6{,}63 \cdot 10^{-34} \cdot 10^{15} = 6{,}63 \cdot 10^{-19}\ \text{ჯ} \approx 4{,}1\ \text{ევ}$
SEN: $E = h\nu = 6.63 \times 10^{-34} \times 10^{15} = 6.63 \times 10^{-19}\ \text{J} \approx 4.1\ \text{eV}$
AKA: $6{,}63 \cdot 10^{-19}\ \text{ჯ}$
AEN: $6.63 \times 10^{-19}\ \text{J}$

--- easy quantum
KA: ლითონზე ეცემა $5\ \text{ევ}$ ენერგიის ფოტონები. გამოსვლის მუშაობაა $2\ \text{ევ}$. იპოვეთ ამოტყორცნილი ელექტრონების მაქსიმალური კინეტიკური ენერგია.
EN: Photons of energy $5\ \text{eV}$ fall on a metal with work function $2\ \text{eV}$. Find the maximum kinetic energy of the emitted electrons.
HKA: აინშტაინის განტოლება: $h\nu = A + E_k$.
HEN: Einstein's equation: $h\nu = A + E_k$.
SKA: $h\nu = A + E_k \Rightarrow E_k = h\nu - A$
$E_k = 5 - 2 = 3\ \text{ევ} = 4{,}8 \cdot 10^{-19}\ \text{ჯ}$
SEN: $h\nu = A + E_k \Rightarrow E_k = h\nu - A$
$E_k = 5 - 2 = 3\ \text{eV} = 4.8 \times 10^{-19}\ \text{J}$
AKA: $3\ \text{ევ}$
AEN: $3\ \text{eV}$

--- easy quantum
KA: ლითონიდან ელექტრონის გამოსვლის მუშაობაა $2\ \text{ევ}$. იპოვეთ ფოტოეფექტის წითელი საზღვარი (მაქსიმალური ტალღის სიგრძე).
EN: The work function of a metal is $2\ \text{eV}$. Find the photoelectric threshold (the longest wavelength).
HKA: საზღვარზე $E_k = 0$: $\dfrac{hc}{\lambda_{\max}} = A$.
HEN: At the threshold $E_k = 0$: $\dfrac{hc}{\lambda_{\max}} = A$.
SKA: $\lambda_{\max} = \dfrac{hc}{A}$
$\lambda_{\max} = \dfrac{6{,}63 \cdot 10^{-34} \cdot 3 \cdot 10^8}{2 \cdot 1{,}6 \cdot 10^{-19}} \approx 6{,}2 \cdot 10^{-7}\ \text{მ} = 620\ \text{ნმ}$
SEN: $\lambda_{\max} = \dfrac{hc}{A}$
$\lambda_{\max} = \dfrac{6.63 \times 10^{-34} \times 3 \times 10^8}{2 \times 1.6 \times 10^{-19}} \approx 6.2 \times 10^{-7}\ \text{m} = 620\ \text{nm}$
AKA: $\approx 620\ \text{ნმ}$
AEN: $\approx 620\ \text{nm}$

--- easy atom
KA: ბორის თეორიით წყალბადის ატომის ენერგეტიკული დონეებია $E_n = -\dfrac{13{,}6}{n^2}\ \text{ევ}$. იპოვეთ $E_2$ და $2 \to 1$ გადასვლისას გამოსხივებული ფოტონის ენერგია.
EN: In Bohr's theory the hydrogen energy levels are $E_n = -\dfrac{13.6}{n^2}\ \text{eV}$. Find $E_2$ and the energy of the photon emitted in the $2 \to 1$ transition.
HKA: ბორის II პოსტულატი: $h\nu = E_m - E_n$.
HEN: Bohr's second postulate: $h\nu = E_m - E_n$.
SKA: $E_2 = -\dfrac{13{,}6}{4} = -3{,}4\ \text{ევ}$, $\ E_1 = -13{,}6\ \text{ევ}$
$h\nu = E_2 - E_1 = -3{,}4 + 13{,}6 = 10{,}2\ \text{ევ}$
SEN: $E_2 = -\dfrac{13.6}{4} = -3.4\ \text{eV}$, $\ E_1 = -13.6\ \text{eV}$
$h\nu = E_2 - E_1 = -3.4 + 13.6 = 10.2\ \text{eV}$
AKA: $-3{,}4\ \text{ევ}$; $10{,}2\ \text{ევ}$
AEN: $-3.4\ \text{eV}$; $10.2\ \text{eV}$

--- easy atom
KA: რეზერფორდის ცდაში ალფა-ნაწილაკების უმეტესობა ოქროს ფოლგაში თითქმის გადაუხრელად გადის, ძალიან მცირე ნაწილი კი უკან ბრუნდება. რა დასკვნა გამოიტანა რეზერფორდმა?
EN: In Rutherford's experiment most alpha particles pass through gold foil almost undeflected, but a very few bounce back. What did Rutherford conclude?
HKA: იფიქრეთ, რას ნიშნავს „თითქმის ყველა გადის“ და „ზოგი უკან ბრუნდება“.
HEN: Think about what "almost all pass" and "a few bounce back" each mean.
SKA: უმეტესობა გადის $\Rightarrow$ ატომი ძირითადად „ცარიელია“.
ზოგი უკან ბრუნდება $\Rightarrow$ დადებითი მუხტი და თითქმის მთელი მასა თავმოყრილია ძალიან პატარა ბირთვში ($\sim 10^{-15}\ \text{მ}$, ატომი კი $\sim 10^{-10}\ \text{მ}$).
შედეგი — ატომის პლანეტარული მოდელი.
SEN: Most pass through $\Rightarrow$ the atom is mostly "empty".
A few bounce back $\Rightarrow$ the positive charge and almost all the mass sit in a tiny nucleus ($\sim 10^{-15}\ \text{m}$, while the atom is $\sim 10^{-10}\ \text{m}$).
Result: the planetary model of the atom.
AKA: პატარა, მძიმე, დადებითი ბირთვი
AEN: a tiny, heavy, positive nucleus

--- easy nucleus
KA: რამდენი პროტონი და ნეიტრონია ბირთვში $^{235}_{92}\text{U}$? რამდენი ელექტრონია ნეიტრალურ ატომში?
EN: How many protons and neutrons are in the nucleus $^{235}_{92}\text{U}$? How many electrons does the neutral atom have?
HKA: $Z$ — პროტონები, $A$ — ნუკლონები, $N = A - Z$.
HEN: $Z$ is protons, $A$ nucleons, $N = A - Z$.
SKA: $Z = 92$ პროტონი, $\ N = A - Z = 235 - 92 = 143$ ნეიტრონი
ნეიტრალურ ატომში $92$ ელექტრონია.
SEN: $Z = 92$ protons, $\ N = A - Z = 235 - 92 = 143$ neutrons
The neutral atom has $92$ electrons.
AKA: $92$; $143$; $92$
AEN: $92$; $143$; $92$

--- easy nucleus
KA: რამდენი ენერგიის ექვივალენტურია $1\ \text{გ}$ მასა?
EN: How much energy is equivalent to $1\ \text{g}$ of mass?
HKA: $E = mc^2$.
HEN: $E = mc^2$.
SKA: $E = mc^2$
$E = 10^{-3} \cdot (3 \cdot 10^8)^2 = 9 \cdot 10^{13}\ \text{ჯ}$
SEN: $E = mc^2$
$E = 10^{-3} \times (3 \times 10^8)^2 = 9 \times 10^{13}\ \text{J}$
AKA: $9 \cdot 10^{13}\ \text{ჯ}$
AEN: $9 \times 10^{13}\ \text{J}$

--- easy radio
KA: დაწერეთ რადიუმის $^{226}_{88}\text{Ra}$ ალფა-დაშლის რეაქცია.
EN: Write the alpha-decay equation of radium $^{226}_{88}\text{Ra}$.
HKA: ალფა-ნაწილაკი — $^4_2\text{He}$; $A$ მცირდება $4$-ით, $Z$ — $2$-ით.
HEN: An alpha particle is $^4_2\text{He}$; $A$ drops by $4$, $Z$ by $2$.
SKA: $^{226}_{88}\text{Ra} \to {}^{222}_{86}\text{Rn} + {}^4_2\text{He}$
შემოწმება: $226 = 222 + 4$, $\ 88 = 86 + 2$ ✓
SEN: $^{226}_{88}\text{Ra} \to {}^{222}_{86}\text{Rn} + {}^4_2\text{He}$
Check: $226 = 222 + 4$, $\ 88 = 86 + 2$ ✓
AKA: $^{222}_{86}\text{Rn} + {}^4_2\text{He}$
AEN: $^{222}_{86}\text{Rn} + {}^4_2\text{He}$

--- easy radio
KA: დაწერეთ ნახშირბადის $^{14}_{6}\text{C}$ ბეტა-მინუს დაშლის რეაქცია.
EN: Write the beta-minus decay equation of carbon $^{14}_{6}\text{C}$.
HKA: ბეტა-დაშლისას ნეიტრონი პროტონად იქცევა: $A$ არ იცვლება, $Z$ იზრდება $1$-ით.
HEN: In beta decay a neutron turns into a proton: $A$ stays the same, $Z$ rises by $1$.
SKA: $^{14}_{6}\text{C} \to {}^{14}_{7}\text{N} + {}^{\ 0}_{-1}e + \bar{\nu}$
SEN: $^{14}_{6}\text{C} \to {}^{14}_{7}\text{N} + {}^{\ 0}_{-1}e + \bar{\nu}$
AKA: $^{14}_{7}\text{N} + {}^{\ 0}_{-1}e + \bar{\nu}$
AEN: $^{14}_{7}\text{N} + {}^{\ 0}_{-1}e + \bar{\nu}$

--- easy radio
KA: იოდი-$131$-ის ნახევარდაშლის პერიოდია $8$ დღე. რამდენი დარჩება $80\ \text{გ}$-დან $24$ დღის შემდეგ?
EN: Iodine-$131$ has a half-life of $8$ days. How much of $80\ \text{g}$ remains after $24$ days?
HKA: $m = m_0 \cdot 2^{-\frac{t}{T}}$.
HEN: $m = m_0 \cdot 2^{-\frac{t}{T}}$.
SKA: $\dfrac{t}{T} = \dfrac{24}{8} = 3$
$m = 80 \cdot 2^{-3} = 10\ \text{გ}$
SEN: $\dfrac{t}{T} = \dfrac{24}{8} = 3$
$m = 80 \times 2^{-3} = 10\ \text{g}$
AKA: $10\ \text{გ}$
AEN: $10\ \text{g}$

--- easy radio
KA: როგორ იცვლება ბირთვის მასური რიცხვი $A$ და მუხტური რიცხვი $Z$ გამა-გამოსხივებისას? რა არის გამა-სხივი?
EN: How do the mass number $A$ and atomic number $Z$ change in gamma emission? What is a gamma ray?
HKA: გამა-კვანტს არც მუხტი აქვს, არც უძრაობის მასა.
HEN: A gamma quantum has neither charge nor rest mass.
SKA: გამა-სხივი — მაღალი ენერგიის ფოტონი (ელექტრომაგნიტური ტალღა).
$A$ და $Z$ არ იცვლება — ბირთვი მხოლოდ აღგზნებული მდგომარეობიდან უფრო დაბალ ენერგეტიკულ დონეზე გადადის.
SEN: A gamma ray is a high-energy photon (an electromagnetic wave).
$A$ and $Z$ do not change — the nucleus just drops from an excited state to a lower energy level.
AKA: არ იცვლება; ფოტონი
AEN: unchanged; a photon

--- easy particles
KA: ელექტრონი ($m_ec^2 = 0{,}511\ \text{მევ}$) და პოზიტრონი ანიჰილირდება უძრაობის მდგომარეობაში. რამდენი ენერგია გამოიყოფა?
EN: An electron ($m_ec^2 = 0.511\ \text{MeV}$) and a positron annihilate at rest. How much energy is released?
HKA: პოზიტრონი — ელექტრონის ანტინაწილაკი, მასა იგივეა.
HEN: The positron is the electron's antiparticle and has the same mass.
SKA: $E = 2m_ec^2$
$E = 2 \cdot 0{,}511 = 1{,}022\ \text{მევ}$ (ორი გამა-კვანტი, თითო $0{,}511\ \text{მევ}$)
SEN: $E = 2m_ec^2$
$E = 2 \times 0.511 = 1.022\ \text{MeV}$ (two gamma quanta of $0.511\ \text{MeV}$ each)
AKA: $1{,}022\ \text{მევ}$
AEN: $1.022\ \text{MeV}$

--- easy particles

KA: აირის წნევა წრფივად იზრდება $10^5\ \text{პა}$-დან $3 \cdot 10^5\ \text{პა}$-მდე, ხოლო მოცულობა — $2\ \text{ლ}$-დან $6\ \text{ლ}$-მდე. იპოვეთ აირის მუშაობა.
EN: A gas's pressure rises linearly from $10^5\ \text{Pa}$ to $3 \times 10^5\ \text{Pa}$ while its volume goes from $2\ \text{L}$ to $6\ \text{L}$. Find the work done by the gas.
HKA: გრაფიკის ქვეშ ტრაპეციაა: $A = \dfrac{p_1 + p_2}{2}\Delta V$.
HEN: The area under the graph is a trapezoid: $A = \dfrac{p_1 + p_2}{2}\Delta V$.
SKA: $A = \dfrac{p_1 + p_2}{2}(V_2 - V_1)$
$A = \dfrac{10^5 + 3 \cdot 10^5}{2} \cdot 4 \cdot 10^{-3} = 800\ \text{ჯ}$
SEN: $A = \dfrac{p_1 + p_2}{2}(V_2 - V_1)$
$A = \dfrac{10^5 + 3 \times 10^5}{2} \times 4 \times 10^{-3} = 800\ \text{J}$
AKA: $800\ \text{ჯ}$
AEN: $800\ \text{J}$

--- medium thermo1
KA: იდეალური აირი იზოთერმულად ფართოვდება და იღებს $400\ \text{ჯ}$ სითბოს. იპოვეთ შინაგანი ენერგიის ცვლილება და აირის მუშაობა.
EN: An ideal gas expands isothermally and receives $400\ \text{J}$ of heat. Find the change in internal energy and the work done by the gas.
HKA: იდეალური აირის შინაგანი ენერგია მხოლოდ ტემპერატურაზეა დამოკიდებული.
HEN: An ideal gas's internal energy depends only on temperature.
SKA: $T = \text{const} \Rightarrow \Delta U = 0$
$Q = \Delta U + A \Rightarrow A = Q = 400\ \text{ჯ}$
SEN: $T = \text{const} \Rightarrow \Delta U = 0$
$Q = \Delta U + A \Rightarrow A = Q = 400\ \text{J}$
AKA: $\Delta U = 0$; $A = 400\ \text{ჯ}$
AEN: $\Delta U = 0$; $A = 400\ \text{J}$

--- medium thermo1
KA: $1$ მოლი ერთატომიანი აირი მუდმივი წნევისას $100\ \text{K}$-ით გაათბეს. იპოვეთ $\Delta U$, $A$ და $Q$.
EN: $1$ mol of a monatomic gas is heated by $100\ \text{K}$ at constant pressure. Find $\Delta U$, $A$ and $Q$.
HKA: $\Delta U = \dfrac{3}{2}\nu R\Delta T$, $\ A = \nu R \Delta T$, $\ Q = \Delta U + A = \dfrac{5}{2}\nu R\Delta T$.
HEN: $\Delta U = \dfrac{3}{2}\nu R\Delta T$, $\ A = \nu R \Delta T$, $\ Q = \Delta U + A = \dfrac{5}{2}\nu R\Delta T$.
SKA: $\Delta U = 1{,}5 \cdot 8{,}31 \cdot 100 \approx 1246\ \text{ჯ}$
$A = 8{,}31 \cdot 100 = 831\ \text{ჯ}$
$Q = 1246 + 831 \approx 2077\ \text{ჯ}$
SEN: $\Delta U = 1.5 \times 8.31 \times 100 \approx 1246\ \text{J}$
$A = 8.31 \times 100 = 831\ \text{J}$
$Q = 1246 + 831 \approx 2077\ \text{J}$
AKA: $1246\ \text{ჯ}$; $831\ \text{ჯ}$; $2077\ \text{ჯ}$
AEN: $1246\ \text{J}$; $831\ \text{J}$; $2077\ \text{J}$

--- medium thermo1
KA: $2$ მოლი ერთატომიანი აირი დახურულ ჭურჭელში $300\ \text{K}$-დან $400\ \text{K}$-მდე გაათბეს. რამდენი სითბო გადაეცა?
EN: $2$ mol of a monatomic gas in a closed vessel is heated from $300\ \text{K}$ to $400\ \text{K}$. How much heat is supplied?
HKA: იზოქორული პროცესი: $A = 0$, $Q = \Delta U$.
HEN: An isochoric process: $A = 0$, $Q = \Delta U$.
SKA: $Q = \Delta U = \dfrac{3}{2}\nu R\Delta T$
$Q = 1{,}5 \cdot 2 \cdot 8{,}31 \cdot 100 \approx 2493\ \text{ჯ}$
SEN: $Q = \Delta U = \dfrac{3}{2}\nu R\Delta T$
$Q = 1.5 \times 2 \times 8.31 \times 100 \approx 2493\ \text{J}$
AKA: $\approx 2{,}5\ \text{კჯ}$
AEN: $\approx 2.5\ \text{kJ}$

--- medium thermo1
KA: ერთატომიან აირს მუდმივი წნევისას გადასცეს სითბო. მიღებული სითბოს რა ნაწილი იხარჯება მუშაობაზე და რა ნაწილი — შინაგან ენერგიაზე?
EN: Heat is supplied to a monatomic gas at constant pressure. What fraction of the heat goes into work, and what fraction into internal energy?
HKA: $A = \nu R\Delta T$, $\ Q = \dfrac{5}{2}\nu R\Delta T$.
HEN: $A = \nu R\Delta T$, $\ Q = \dfrac{5}{2}\nu R\Delta T$.
SKA: $\dfrac{A}{Q} = \dfrac{\nu R\Delta T}{\frac{5}{2}\nu R\Delta T} = \dfrac{2}{5} = 40\%$
$\dfrac{\Delta U}{Q} = \dfrac{3}{5} = 60\%$
SEN: $\dfrac{A}{Q} = \dfrac{\nu R\Delta T}{\frac{5}{2}\nu R\Delta T} = \dfrac{2}{5} = 40\%$
$\dfrac{\Delta U}{Q} = \dfrac{3}{5} = 60\%$
AKA: $40\%$ მუშაობაზე, $60\%$ შინაგან ენერგიაზე
AEN: $40\%$ to work, $60\%$ to internal energy

--- medium engines
KA: ავტომობილის ძრავის სიმძლავრეა $50\ \text{კვტ}$, მქკ — $25\%$. რამდენი ბენზინი ($q = 4{,}6 \cdot 10^7\ \text{ჯ/კგ}$) იხარჯება ერთ საათში?
EN: A car engine has power $50\ \text{kW}$ and efficiency $25\%$. How much petrol ($q = 4.6 \times 10^7\ \text{J/kg}$) does it burn in one hour?
HKA: $\eta = \dfrac{Pt}{qm}$.
HEN: $\eta = \dfrac{Pt}{qm}$.
SKA: $\eta = \dfrac{Pt}{qm} \Rightarrow m = \dfrac{Pt}{\eta q}$
$m = \dfrac{5 \cdot 10^4 \cdot 3600}{0{,}25 \cdot 4{,}6 \cdot 10^7} \approx 15{,}7\ \text{კგ}$
SEN: $\eta = \dfrac{Pt}{qm} \Rightarrow m = \dfrac{Pt}{\eta q}$
$m = \dfrac{5 \times 10^4 \times 3600}{0.25 \times 4.6 \times 10^7} \approx 15.7\ \text{kg}$
AKA: $\approx 15{,}7\ \text{კგ}$
AEN: $\approx 15.7\ \text{kg}$

--- medium engines
KA: კარნოს ძრავის მაცივრის ტემპერატურაა $300\ \text{K}$, მქკ — $40\%$. რამდენით უნდა გაიზარდოს გამაცხელებლის ტემპერატურა, რომ მქკ $50\%$ გახდეს?
EN: A Carnot engine has a cold reservoir at $300\ \text{K}$ and efficiency $40\%$. By how much must the hot reservoir temperature rise for the efficiency to become $50\%$?
HKA: $T_1 = \dfrac{T_2}{1 - \eta}$.
HEN: $T_1 = \dfrac{T_2}{1 - \eta}$.
SKA: $\eta = 1 - \dfrac{T_2}{T_1} \Rightarrow T_1 = \dfrac{T_2}{1 - \eta}$
$T_1 = \dfrac{300}{0{,}6} = 500\ \text{K}$, $\ T_1' = \dfrac{300}{0{,}5} = 600\ \text{K}$
$\Delta T = 100\ \text{K}$
SEN: $\eta = 1 - \dfrac{T_2}{T_1} \Rightarrow T_1 = \dfrac{T_2}{1 - \eta}$
$T_1 = \dfrac{300}{0.6} = 500\ \text{K}$, $\ T_1' = \dfrac{300}{0.5} = 600\ \text{K}$
$\Delta T = 100\ \text{K}$
AKA: $100\ \text{K}$-ით
AEN: by $100\ \text{K}$

--- medium engines
KA: მაცივარი საკვებს ართმევს $600\ \text{ჯ}$ სითბოს, ქსელიდან კი მოიხმარს $200\ \text{ჯ}$ ენერგიას. რამდენ სითბოს გადასცემს ოთახს? იპოვეთ მაცივრის ეფექტურობის კოეფიციენტი $\varepsilon = \dfrac{Q_2}{A}$.
EN: A refrigerator removes $600\ \text{J}$ of heat from the food and uses $200\ \text{J}$ of electrical energy. How much heat does it give to the room? Find its coefficient of performance $\varepsilon = \dfrac{Q_2}{A}$.
HKA: ენერგიის შენახვა: $Q_1 = Q_2 + A$.
HEN: Energy conservation: $Q_1 = Q_2 + A$.
SKA: $Q_1 = Q_2 + A = 600 + 200 = 800\ \text{ჯ}$
$\varepsilon = \dfrac{Q_2}{A} = \dfrac{600}{200} = 3$
SEN: $Q_1 = Q_2 + A = 600 + 200 = 800\ \text{J}$
$\varepsilon = \dfrac{Q_2}{A} = \dfrac{600}{200} = 3$
AKA: $800\ \text{ჯ}$; $3$
AEN: $800\ \text{J}$; $3$

--- medium humidity
KA: ნაჯერი ორთქლის სიმკვრივე: $10\ \text{°C}$ — $9{,}4$, $13\ \text{°C}$ — $11{,}4$, $25\ \text{°C}$ — $23{,}0\ \text{გ/მ}^3$. $25\ \text{°C}$-ზე ჰაერში ორთქლის სიმკვრივეა $11{,}5\ \text{გ/მ}^3$. იპოვეთ ფარდობითი ტენიანობა და ნამის წერტილი.
EN: Saturated vapour density: $10\ \text{°C}$ — $9.4$, $13\ \text{°C}$ — $11.4$, $25\ \text{°C}$ — $23.0\ \text{g/m}^3$. At $25\ \text{°C}$ the air holds $11.5\ \text{g/m}^3$ of vapour. Find the relative humidity and the dew point.
HKA: ნამის წერტილი — ტემპერატურა, რომელზეც არსებული ორთქლი ნაჯერი ხდება.
HEN: The dew point is the temperature at which the existing vapour becomes saturated.
SKA: $\varphi = \dfrac{11{,}5}{23{,}0} \cdot 100\% = 50\%$
$\rho_{\text{ნ}} = 11{,}5\ \text{გ/მ}^3$ დაახლოებით $13\ \text{°C}$-ზეა $\Rightarrow$ ნამის წერტილი $\approx 13\ \text{°C}$
SEN: $\varphi = \dfrac{11.5}{23.0} \times 100\% = 50\%$
$\rho_{\text{sat}} = 11.5\ \text{g/m}^3$ at about $13\ \text{°C}$ $\Rightarrow$ the dew point is $\approx 13\ \text{°C}$
AKA: $50\%$; $\approx 13\ \text{°C}$
AEN: $50\%$; $\approx 13\ \text{°C}$

--- medium humidity
KA: $50\ \text{მ}^3$ ოთახში $20\ \text{°C}$-ზე ფარდობითი ტენიანობა $60\%$-ია ($\rho_{\text{ნ}}(20\ \text{°C}) = 17{,}3$, $\rho_{\text{ნ}}(10\ \text{°C}) = 9{,}4\ \text{გ/მ}^3$). ტემპერატურა $10\ \text{°C}$-მდე დაეცა. რამდენი წყალი კონდენსირდება?
EN: In a $50\ \text{m}^3$ room at $20\ \text{°C}$ the relative humidity is $60\%$ ($\rho_{\text{sat}}(20\ \text{°C}) = 17.3$, $\rho_{\text{sat}}(10\ \text{°C}) = 9.4\ \text{g/m}^3$). The temperature drops to $10\ \text{°C}$. How much water condenses?
HKA: $10\ \text{°C}$-ზე ჰაერი მაქსიმუმ $9{,}4\ \text{გ/მ}^3$-ს დაიჭერს.
HEN: At $10\ \text{°C}$ the air can hold at most $9.4\ \text{g/m}^3$.
SKA: $\rho = 0{,}6 \cdot 17{,}3 \approx 10{,}4\ \text{გ/მ}^3 > 9{,}4$
$\Delta m = (10{,}4 - 9{,}4) \cdot 50 \approx 49\ \text{გ}$
SEN: $\rho = 0.6 \times 17.3 \approx 10.4\ \text{g/m}^3 > 9.4$
$\Delta m = (10.4 - 9.4) \times 50 \approx 49\ \text{g}$
AKA: $\approx 49\ \text{გ}$
AEN: $\approx 49\ \text{g}$

--- medium liquids
KA: პიპეტის ბოლოს რადიუსია $1\ \text{მმ}$. იპოვეთ მოწყვეტისას წყლის წვეთის მასა ($\sigma = 0{,}073\ \text{ნ/მ}$).
EN: The tip of a pipette has radius $1\ \text{mm}$. Find the mass of a water drop as it breaks off ($\sigma = 0.073\ \text{N/m}$).
HKA: მოწყვეტის მომენტში $mg = \sigma \cdot 2\pi r$.
HEN: At the moment of detachment $mg = \sigma \cdot 2\pi r$.
SKA: $mg = 2\pi r\sigma \Rightarrow m = \dfrac{2\pi r\sigma}{g}$
$m = \dfrac{2 \cdot 3{,}14 \cdot 10^{-3} \cdot 0{,}073}{10} \approx 4{,}6 \cdot 10^{-5}\ \text{კგ} = 46\ \text{მგ}$
SEN: $mg = 2\pi r\sigma \Rightarrow m = \dfrac{2\pi r\sigma}{g}$
$m = \dfrac{2 \times 3.14 \times 10^{-3} \times 0.073}{10} \approx 4.6 \times 10^{-5}\ \text{kg} = 46\ \text{mg}$
AKA: $\approx 46\ \text{მგ}$
AEN: $\approx 46\ \text{mg}$

--- medium liquids
KA: ერთსა და იმავე კაპილარში წყალი ($\sigma = 0{,}073\ \text{ნ/მ}$, $\rho = 1000\ \text{კგ/მ}^3$) და ნავთი ($\sigma = 0{,}024\ \text{ნ/მ}$, $\rho = 800\ \text{კგ/მ}^3$) ადის. რამდენჯერ მაღლა ავა წყალი?
EN: Water ($\sigma = 0.073\ \text{N/m}$, $\rho = 1000\ \text{kg/m}^3$) and kerosene ($\sigma = 0.024\ \text{N/m}$, $\rho = 800\ \text{kg/m}^3$) rise in the same capillary. How many times higher does the water rise?
HKA: $h \sim \dfrac{\sigma}{\rho}$.
HEN: $h \sim \dfrac{\sigma}{\rho}$.
SKA: $\dfrac{h_{\text{წ}}}{h_{\text{ნ}}} = \dfrac{\sigma_{\text{წ}}\rho_{\text{ნ}}}{\sigma_{\text{ნ}}\rho_{\text{წ}}}$
$\dfrac{0{,}073 \cdot 800}{0{,}024 \cdot 1000} \approx 2{,}4$
SEN: $\dfrac{h_{\text{w}}}{h_{\text{k}}} = \dfrac{\sigma_{\text{w}}\rho_{\text{k}}}{\sigma_{\text{k}}\rho_{\text{w}}}$
$\dfrac{0.073 \times 800}{0.024 \times 1000} \approx 2.4$
AKA: $\approx 2{,}4$-ჯერ
AEN: $\approx 2.4$ times

--- medium liquids
KA: მავთულის ჩარჩოზე საპნის აპკია; მოძრავი გვერდის სიგრძეა $4\ \text{სმ}$, $\sigma = 0{,}04\ \text{ნ/მ}$. რა ძალა სჭირდება გვერდის შეკავებას და რა მუშაობა სრულდება მისი $3\ \text{სმ}$-ით გადაადგილებისას?
EN: A soap film is stretched on a wire frame; the movable side is $4\ \text{cm}$ long, $\sigma = 0.04\ \text{N/m}$. What force holds the side in place, and how much work is done moving it $3\ \text{cm}$?
HKA: აპკს ორი ზედაპირი აქვს: $F = 2\sigma l$.
HEN: The film has two surfaces: $F = 2\sigma l$.
SKA: $F = 2\sigma l = 2 \cdot 0{,}04 \cdot 0{,}04 = 3{,}2 \cdot 10^{-3}\ \text{ნ}$
$A = Fs = 3{,}2 \cdot 10^{-3} \cdot 0{,}03 = 9{,}6 \cdot 10^{-5}\ \text{ჯ}$
SEN: $F = 2\sigma l = 2 \times 0.04 \times 0.04 = 3.2 \times 10^{-3}\ \text{N}$
$A = Fs = 3.2 \times 10^{-3} \times 0.03 = 9.6 \times 10^{-5}\ \text{J}$
AKA: $3{,}2\ \text{მნ}$; $9{,}6 \cdot 10^{-5}\ \text{ჯ}$
AEN: $3.2\ \text{mN}$; $9.6 \times 10^{-5}\ \text{J}$

--- medium quantum
KA: ფოტონების ენერგიაა $4{,}5\ \text{ევ}$, გამოსვლის მუშაობა — $2{,}3\ \text{ევ}$. იპოვეთ შემაკავებელი ძაბვა.
EN: Photons have energy $4.5\ \text{eV}$ and the work function is $2.3\ \text{eV}$. Find the stopping voltage.
HKA: $eU_{\text{შ}} = E_k$.
HEN: $eU_{\text{s}} = E_k$.
SKA: $E_k = h\nu - A = 4{,}5 - 2{,}3 = 2{,}2\ \text{ევ}$
$eU_{\text{შ}} = E_k \Rightarrow U_{\text{შ}} = 2{,}2\ \text{ვ}$
SEN: $E_k = h\nu - A = 4.5 - 2.3 = 2.2\ \text{eV}$
$eU_{\text{s}} = E_k \Rightarrow U_{\text{s}} = 2.2\ \text{V}$
AKA: $2{,}2\ \text{ვ}$
AEN: $2.2\ \text{V}$

--- medium quantum
KA: ფოტოელექტრონების მაქსიმალური კინეტიკური ენერგიაა $2{,}2\ \text{ევ}$. იპოვეთ მათი მაქსიმალური სიჩქარე.
EN: The maximum kinetic energy of photoelectrons is $2.2\ \text{eV}$. Find their maximum speed.
HKA: $E_k = \dfrac{m_e v^2}{2}$.
HEN: $E_k = \dfrac{m_e v^2}{2}$.
SKA: $v = \sqrt{\dfrac{2E_k}{m_e}}$
$E_k = 2{,}2 \cdot 1{,}6 \cdot 10^{-19} = 3{,}52 \cdot 10^{-19}\ \text{ჯ}$
$v = \sqrt{\dfrac{2 \cdot 3{,}52 \cdot 10^{-19}}{9{,}1 \cdot 10^{-31}}} \approx 8{,}8 \cdot 10^5\ \text{მ/წმ}$
SEN: $v = \sqrt{\dfrac{2E_k}{m_e}}$
$E_k = 2.2 \times 1.6 \times 10^{-19} = 3.52 \times 10^{-19}\ \text{J}$
$v = \sqrt{\dfrac{2 \times 3.52 \times 10^{-19}}{9.1 \times 10^{-31}}} \approx 8.8 \times 10^5\ \text{m/s}$
AKA: $\approx 8{,}8 \cdot 10^5\ \text{მ/წმ}$
AEN: $\approx 8.8 \times 10^5\ \text{m/s}$

--- medium quantum
KA: $1\ \text{მვტ}$ სიმძლავრის ლაზერი ასხივებს $630\ \text{ნმ}$ ტალღის სიგრძის სინათლეს. რამდენ ფოტონს ასხივებს წამში?
EN: A $1\ \text{mW}$ laser emits light of wavelength $630\ \text{nm}$. How many photons does it emit per second?
HKA: $N = \dfrac{Pt}{E_{\text{ფ}}}$, $E_{\text{ფ}} = \dfrac{hc}{\lambda}$.
HEN: $N = \dfrac{Pt}{E_{\text{ph}}}$, $E_{\text{ph}} = \dfrac{hc}{\lambda}$.
SKA: $E_{\text{ფ}} = \dfrac{6{,}63 \cdot 10^{-34} \cdot 3 \cdot 10^8}{6{,}3 \cdot 10^{-7}} \approx 3{,}16 \cdot 10^{-19}\ \text{ჯ}$
$N = \dfrac{P}{E_{\text{ფ}}} = \dfrac{10^{-3}}{3{,}16 \cdot 10^{-19}} \approx 3{,}2 \cdot 10^{15}$ წამში
SEN: $E_{\text{ph}} = \dfrac{6.63 \times 10^{-34} \times 3 \times 10^8}{6.3 \times 10^{-7}} \approx 3.16 \times 10^{-19}\ \text{J}$
$N = \dfrac{P}{E_{\text{ph}}} = \dfrac{10^{-3}}{3.16 \times 10^{-19}} \approx 3.2 \times 10^{15}$ per second
AKA: $\approx 3{,}2 \cdot 10^{15}$
AEN: $\approx 3.2 \times 10^{15}$

--- medium quantum
KA: იპოვეთ $10^6\ \text{მ/წმ}$ სიჩქარით მოძრავი ელექტრონის დე ბროილის ტალღის სიგრძე.
EN: Find the de Broglie wavelength of an electron moving at $10^6\ \text{m/s}$.
HKA: $\lambda = \dfrac{h}{mv}$ — ნაწილაკსაც აქვს ტალღური თვისებები (დუალიზმი).
HEN: $\lambda = \dfrac{h}{mv}$ — particles have wave properties too (duality).
SKA: $\lambda = \dfrac{h}{mv}$
$\lambda = \dfrac{6{,}63 \cdot 10^{-34}}{9{,}1 \cdot 10^{-31} \cdot 10^6} \approx 7{,}3 \cdot 10^{-10}\ \text{მ}$ — ატომის ზომის რიგის.
SEN: $\lambda = \dfrac{h}{mv}$
$\lambda = \dfrac{6.63 \times 10^{-34}}{9.1 \times 10^{-31} \times 10^6} \approx 7.3 \times 10^{-10}\ \text{m}$ — about the size of an atom.
AKA: $\approx 0{,}73\ \text{ნმ}$
AEN: $\approx 0.73\ \text{nm}$

--- medium atom
KA: იპოვეთ წყალბადის ატომის $3 \to 2$ გადასვლისას გამოსხივებული ფოტონის ტალღის სიგრძე. რა ფერისაა ეს სინათლე?
EN: Find the wavelength of the photon emitted by hydrogen in the $3 \to 2$ transition. What colour is it?
HKA: $E = 13{,}6\left(\dfrac{1}{4} - \dfrac{1}{9}\right)\ \text{ევ}$, $\ \lambda = \dfrac{hc}{E}$.
HEN: $E = 13.6\left(\dfrac{1}{4} - \dfrac{1}{9}\right)\ \text{eV}$, $\ \lambda = \dfrac{hc}{E}$.
SKA: $E = 13{,}6 \cdot \dfrac{5}{36} \approx 1{,}89\ \text{ევ} \approx 3{,}02 \cdot 10^{-19}\ \text{ჯ}$
$\lambda = \dfrac{hc}{E} = \dfrac{1{,}99 \cdot 10^{-25}}{3{,}02 \cdot 10^{-19}} \approx 6{,}6 \cdot 10^{-7}\ \text{მ} = 660\ \text{ნმ}$ — წითელი ($H_\alpha$ ხაზი).
SEN: $E = 13.6 \times \dfrac{5}{36} \approx 1.89\ \text{eV} \approx 3.02 \times 10^{-19}\ \text{J}$
$\lambda = \dfrac{hc}{E} = \dfrac{1.99 \times 10^{-25}}{3.02 \times 10^{-19}} \approx 6.6 \times 10^{-7}\ \text{m} = 660\ \text{nm}$ — red (the $H_\alpha$ line).
AKA: $\approx 660\ \text{ნმ}$; წითელი
AEN: $\approx 660\ \text{nm}$; red

--- medium atom
KA: რა მინიმალური სიხშირის ფოტონი შეძლებს წყალბადის ატომის იონიზაციას, თუ ელექტრონი $n = 2$ დონეზეა?
EN: What is the minimum photon frequency that can ionise a hydrogen atom whose electron is at level $n = 2$?
HKA: იონიზაციისთვის საჭიროა $E_\infty - E_2 = 3{,}4\ \text{ევ}$.
HEN: Ionisation needs $E_\infty - E_2 = 3.4\ \text{eV}$.
SKA: $h\nu = 0 - E_2 = 3{,}4\ \text{ევ} = 5{,}44 \cdot 10^{-19}\ \text{ჯ}$
$\nu = \dfrac{5{,}44 \cdot 10^{-19}}{6{,}63 \cdot 10^{-34}} \approx 8{,}2 \cdot 10^{14}\ \text{ჰც}$
SEN: $h\nu = 0 - E_2 = 3.4\ \text{eV} = 5.44 \times 10^{-19}\ \text{J}$
$\nu = \dfrac{5.44 \times 10^{-19}}{6.63 \times 10^{-34}} \approx 8.2 \times 10^{14}\ \text{Hz}$
AKA: $\approx 8{,}2 \cdot 10^{14}\ \text{ჰც}$
AEN: $\approx 8.2 \times 10^{14}\ \text{Hz}$

--- medium atom
KA: წყალბადის ატომები აღგზნებულია $n = 4$ დონემდე. რამდენი სხვადასხვა სპექტრული ხაზი შეიძლება გამოჩნდეს ელექტრონების ძირითად მდგომარეობაში დაბრუნებისას?
EN: Hydrogen atoms are excited to level $n = 4$. How many different spectral lines can appear as the electrons return to the ground state?
HKA: ყოველი წყვილი დონე ერთ ხაზს იძლევა.
HEN: Each pair of levels gives one line.
SKA: ხაზები: $4 \to 3,\ 4 \to 2,\ 4 \to 1,\ 3 \to 2,\ 3 \to 1,\ 2 \to 1$
$C_4^2 = \dfrac{4 \cdot 3}{2} = 6$
SEN: Lines: $4 \to 3,\ 4 \to 2,\ 4 \to 1,\ 3 \to 2,\ 3 \to 1,\ 2 \to 1$
$C_4^2 = \dfrac{4 \cdot 3}{2} = 6$
AKA: $6$
AEN: $6$

--- medium nucleus
KA: იპოვეთ ჰელიუმ-$4$-ის ბირთვის მასის დეფექტი და ბმის ენერგია. $m_p = 1{,}00728$, $m_n = 1{,}00866$, $m_{\text{ბ}} = 4{,}00151$ მ.ა.ე.
EN: Find the mass defect and binding energy of the helium-$4$ nucleus. $m_p = 1.00728$, $m_n = 1.00866$, $m_{\text{nucl}} = 4.00151$ u.
HKA: $\Delta m = Zm_p + Nm_n - m_{\text{ბ}}$, $\ E = \Delta m \cdot 931{,}5\ \text{მევ}$.
HEN: $\Delta m = Zm_p + Nm_n - m_{\text{nucl}}$, $\ E = \Delta m \times 931.5\ \text{MeV}$.
SKA: $\Delta m = 2 \cdot 1{,}00728 + 2 \cdot 1{,}00866 - 4{,}00151 = 0{,}03037\ \text{მ.ა.ე.}$
$E = 0{,}03037 \cdot 931{,}5 \approx 28{,}3\ \text{მევ}$, $\ $ ერთ ნუკლონზე $\approx 7{,}1\ \text{მევ}$
SEN: $\Delta m = 2 \times 1.00728 + 2 \times 1.00866 - 4.00151 = 0.03037\ \text{u}$
$E = 0.03037 \times 931.5 \approx 28.3\ \text{MeV}$, $\ $ per nucleon $\approx 7.1\ \text{MeV}$
AKA: $0{,}0304\ \text{მ.ა.ე.}$; $\approx 28{,}3\ \text{მევ}$
AEN: $0.0304\ \text{u}$; $\approx 28.3\ \text{MeV}$

--- medium nucleus
KA: ურან-$235$-ის ერთი ბირთვის დაშლისას გამოიყოფა $\approx 200\ \text{მევ}$. რამდენი ენერგია გამოიყოფა $1\ \text{გ}$ ურანის სრული დაშლისას? ($1\ \text{მევ} = 1{,}6 \cdot 10^{-13}\ \text{ჯ}$)
EN: Each fission of a uranium-$235$ nucleus releases $\approx 200\ \text{MeV}$. How much energy is released by the complete fission of $1\ \text{g}$ of uranium? ($1\ \text{MeV} = 1.6 \times 10^{-13}\ \text{J}$)
HKA: ბირთვების რიცხვი $N = \dfrac{m}{M}N_A$.
HEN: Number of nuclei $N = \dfrac{m}{M}N_A$.
SKA: $N = \dfrac{1}{235} \cdot 6{,}02 \cdot 10^{23} \approx 2{,}56 \cdot 10^{21}$
$E = N \cdot 200 \cdot 1{,}6 \cdot 10^{-13} \approx 8{,}2 \cdot 10^{10}\ \text{ჯ}$ (≈ $2$ ტონა ნავთობის წვის სითბო)
SEN: $N = \dfrac{1}{235} \times 6.02 \times 10^{23} \approx 2.56 \times 10^{21}$
$E = N \times 200 \times 1.6 \times 10^{-13} \approx 8.2 \times 10^{10}\ \text{J}$ (≈ the heat from burning $2$ tonnes of oil)
AKA: $\approx 8{,}2 \cdot 10^{10}\ \text{ჯ}$
AEN: $\approx 8.2 \times 10^{10}\ \text{J}$

--- medium nucleus
KA: თერმობირთვული რეაქცია: $^2_1\text{H} + {}^3_1\text{H} \to {}^4_2\text{He} + X$. გაარკვიეთ $X$ და იპოვეთ გამოყოფილი ენერგია. მასები (მ.ა.ე.): $2{,}01410$; $3{,}01605$; $4{,}00260$; $n$: $1{,}00866$.
EN: Fusion reaction: $^2_1\text{H} + {}^3_1\text{H} \to {}^4_2\text{He} + X$. Identify $X$ and find the energy released. Masses (u): $2.01410$; $3.01605$; $4.00260$; $n$: $1.00866$.
HKA: შეინახება მასური და მუხტური რიცხვები.
HEN: Mass and charge numbers are conserved.
SKA: $A$: $2 + 3 = 4 + 1$; $\ Z$: $1 + 1 = 2 + 0$ $\Rightarrow X = {}^1_0n$ (ნეიტრონი)
$\Delta m = 5{,}03015 - 5{,}01126 = 0{,}01889\ \text{მ.ა.ე.}$
$E = 0{,}01889 \cdot 931{,}5 \approx 17{,}6\ \text{მევ}$
SEN: $A$: $2 + 3 = 4 + 1$; $\ Z$: $1 + 1 = 2 + 0$ $\Rightarrow X = {}^1_0n$ (a neutron)
$\Delta m = 5.03015 - 5.01126 = 0.01889\ \text{u}$
$E = 0.01889 \times 931.5 \approx 17.6\ \text{MeV}$
AKA: ნეიტრონი; $\approx 17{,}6\ \text{მევ}$
AEN: a neutron; $\approx 17.6\ \text{MeV}$

--- medium radio
KA: $30$ დღის შემდეგ რადიოაქტიური ნიმუშის $\dfrac{1}{8}$ დარჩა. იპოვეთ ნახევარდაშლის პერიოდი.
EN: After $30$ days, $\dfrac{1}{8}$ of a radioactive sample remains. Find the half-life.
HKA: $\dfrac{1}{8} = 2^{-3}$.
HEN: $\dfrac{1}{8} = 2^{-3}$.
SKA: $2^{-\frac{t}{T}} = 2^{-3} \Rightarrow \dfrac{t}{T} = 3$
$T = \dfrac{30}{3} = 10$ დღე
SEN: $2^{-\frac{t}{T}} = 2^{-3} \Rightarrow \dfrac{t}{T} = 3$
$T = \dfrac{30}{3} = 10$ days
AKA: $10$ დღე
AEN: $10$ days

--- medium radio
KA: ძველ ხის ნიმუშში ნახშირბად-$14$-ის შემცველობა ცოცხალი ხისას $25\%$-ს შეადგენს. რამდენი წლისაა ნიმუში? ($T = 5730$ წელი)
EN: An old wood sample contains $25\%$ of the carbon-$14$ found in living wood. How old is it? ($T = 5730$ years)
HKA: $25\% = \dfrac{1}{4} = 2^{-2}$.
HEN: $25\% = \dfrac{1}{4} = 2^{-2}$.
SKA: $\dfrac{N}{N_0} = 2^{-\frac{t}{T}} = 2^{-2} \Rightarrow t = 2T$
$t = 2 \cdot 5730 = 11\,460$ წელი
SEN: $\dfrac{N}{N_0} = 2^{-\frac{t}{T}} = 2^{-2} \Rightarrow t = 2T$
$t = 2 \times 5730 = 11\,460$ years
AKA: $11\,460$ წელი
AEN: $11\,460$ years

--- medium radio
KA: ურანი $^{238}_{92}\text{U}$ დაშლების ჯაჭვით ტყვიად $^{206}_{82}\text{Pb}$ იქცევა. რამდენი ალფა- და რამდენი ბეტა-დაშლა ხდება?
EN: Uranium $^{238}_{92}\text{U}$ turns into lead $^{206}_{82}\text{Pb}$ through a decay chain. How many alpha and how many beta decays occur?
HKA: $A$-ს მხოლოდ ალფა-დაშლა ცვლის ($-4$); შემდეგ დაითვალეთ $Z$.
HEN: Only alpha decay changes $A$ ($-4$); then count $Z$.
SKA: ალფა: $\dfrac{238 - 206}{4} = 8$ $\Rightarrow Z = 92 - 2 \cdot 8 = 76$
ბეტა ($Z$ იზრდება $1$-ით): $82 - 76 = 6$
SEN: Alpha: $\dfrac{238 - 206}{4} = 8$ $\Rightarrow Z = 92 - 2 \times 8 = 76$
Beta ($Z$ increases by $1$): $82 - 76 = 6$
AKA: $8$ ალფა, $6$ ბეტა
AEN: $8$ alpha, $6$ beta

--- medium particles
KA: ელექტრონი $1\ \text{კვ}$ ძაბვით აჩქარდა. იპოვეთ მისი ენერგია ევ-ებში და სიჩქარე.
EN: An electron is accelerated through $1\ \text{kV}$. Find its energy in eV and its speed.
HKA: $E_k = eU$.
HEN: $E_k = eU$.
SKA: $E_k = eU = 1000\ \text{ევ} = 1{,}6 \cdot 10^{-16}\ \text{ჯ}$
$v = \sqrt{\dfrac{2E_k}{m_e}} = \sqrt{\dfrac{3{,}2 \cdot 10^{-16}}{9{,}1 \cdot 10^{-31}}} \approx 1{,}9 \cdot 10^7\ \text{მ/წმ}$ ($\approx 6\%$ სინათლის სიჩქარის)
SEN: $E_k = eU = 1000\ \text{eV} = 1.6 \times 10^{-16}\ \text{J}$
$v = \sqrt{\dfrac{2E_k}{m_e}} = \sqrt{\dfrac{3.2 \times 10^{-16}}{9.1 \times 10^{-31}}} \approx 1.9 \times 10^7\ \text{m/s}$ ($\approx 6\%$ of the speed of light)
AKA: $1\ \text{კევ}$; $\approx 1{,}9 \cdot 10^7\ \text{მ/წმ}$
AEN: $1\ \text{keV}$; $\approx 1.9 \times 10^7\ \text{m/s}$

--- medium particles
KA: რა მინიმალური ენერგია და რა მაქსიმალური ტალღის სიგრძე უნდა ჰქონდეს გამა-კვანტს, რომ ელექტრონ-პოზიტრონის წყვილი შექმნას? ($m_ec^2 = 0{,}511\ \text{მევ}$)
EN: What minimum energy and maximum wavelength must a gamma quantum have to create an electron–positron pair? ($m_ec^2 = 0.511\ \text{MeV}$)
HKA: ფოტონის ენერგია უნდა დაიხარჯოს ორი ნაწილაკის უძრაობის ენერგიაზე.
HEN: The photon's energy must cover the rest energies of two particles.
SKA: $E_{\min} = 2m_ec^2 = 1{,}022\ \text{მევ} \approx 1{,}64 \cdot 10^{-13}\ \text{ჯ}$
$\lambda_{\max} = \dfrac{hc}{E_{\min}} = \dfrac{1{,}99 \cdot 10^{-25}}{1{,}64 \cdot 10^{-13}} \approx 1{,}2 \cdot 10^{-12}\ \text{მ}$
SEN: $E_{\min} = 2m_ec^2 = 1.022\ \text{MeV} \approx 1.64 \times 10^{-13}\ \text{J}$
$\lambda_{\max} = \dfrac{hc}{E_{\min}} = \dfrac{1.99 \times 10^{-25}}{1.64 \times 10^{-13}} \approx 1.2 \times 10^{-12}\ \text{m}$
AKA: $1{,}022\ \text{მევ}$; $\approx 1{,}2 \cdot 10^{-12}\ \text{მ}$
AEN: $1.022\ \text{MeV}$; $\approx 1.2 \times 10^{-12}\ \text{m}$

--- medium astro
KA: შეაფასეთ სამყაროს ასაკი ჰაბლის მუდმივით: $t \approx \dfrac{1}{H_0}$, $H_0 = 70\ \text{კმ/(წმ}\cdot\text{მპკ)}$, $1\ \text{მპკ} = 3{,}09 \cdot 10^{22}\ \text{მ}$.
EN: Estimate the age of the Universe from the Hubble constant: $t \approx \dfrac{1}{H_0}$, $H_0 = 70\ \text{km/(s}\cdot\text{Mpc)}$, $1\ \text{Mpc} = 3.09 \times 10^{22}\ \text{m}$.
HKA: გადაიყვანეთ $H_0$ წმ$^{-1}$-ში.
HEN: Convert $H_0$ to s$^{-1}$.
SKA: $H_0 = \dfrac{7 \cdot 10^4}{3{,}09 \cdot 10^{22}} \approx 2{,}27 \cdot 10^{-18}\ \text{წმ}^{-1}$
$t = \dfrac{1}{H_0} \approx 4{,}4 \cdot 10^{17}\ \text{წმ} \approx \dfrac{4{,}4 \cdot 10^{17}}{3{,}15 \cdot 10^7} \approx 1{,}4 \cdot 10^{10}$ წელი
SEN: $H_0 = \dfrac{7 \times 10^4}{3.09 \times 10^{22}} \approx 2.27 \times 10^{-18}\ \text{s}^{-1}$
$t = \dfrac{1}{H_0} \approx 4.4 \times 10^{17}\ \text{s} \approx \dfrac{4.4 \times 10^{17}}{3.15 \times 10^7} \approx 1.4 \times 10^{10}$ years
AKA: $\approx 14$ მლრდ წელი
AEN: $\approx 14$ billion years

--- medium astro
KA: გალაქტიკის სპექტრის ხაზები წითლად არის წანაცვლებული და მისი დაშორების სიჩქარე $6000\ \text{კმ/წმ}$-ია. იპოვეთ წითელი წანაცვლება $z \approx \dfrac{v}{c}$ და მანძილი ($H_0 = 70\ \text{კმ/(წმ}\cdot\text{მპკ)}$).
EN: A galaxy's spectral lines are redshifted and it recedes at $6000\ \text{km/s}$. Find the redshift $z \approx \dfrac{v}{c}$ and the distance ($H_0 = 70\ \text{km/(s}\cdot\text{Mpc)}$).
HKA: $d = \dfrac{v}{H_0}$.
HEN: $d = \dfrac{v}{H_0}$.
SKA: $z \approx \dfrac{6000}{300\,000} = 0{,}02$
$d = \dfrac{v}{H_0} = \dfrac{6000}{70} \approx 86\ \text{მპკ}$
SEN: $z \approx \dfrac{6000}{300\,000} = 0.02$
$d = \dfrac{v}{H_0} = \dfrac{6000}{70} \approx 86\ \text{Mpc}$
AKA: $0{,}02$; $\approx 86\ \text{მპკ}$
AEN: $0.02$; $\approx 86\ \text{Mpc}$

--- medium astro
KA: რა რადიუსამდე უნდა შეიკუმშოს დედამიწა ($M = 6 \cdot 10^{24}\ \text{კგ}$), რომ შავ ხვრელად იქცეს? შეადარეთ მის ახლანდელ რადიუსს ($6400\ \text{კმ}$).
EN: To what radius would the Earth ($M = 6 \times 10^{24}\ \text{kg}$) have to shrink to become a black hole? Compare with its present radius ($6400\ \text{km}$).
HKA: $R = \dfrac{2GM}{c^2}$.
HEN: $R = \dfrac{2GM}{c^2}$.
SKA: $R = \dfrac{2GM}{c^2} = \dfrac{2 \cdot 6{,}67 \cdot 10^{-11} \cdot 6 \cdot 10^{24}}{9 \cdot 10^{16}} \approx 8{,}9 \cdot 10^{-3}\ \text{მ}$
$\approx 9\ \text{მმ}$ — დაახლოებით $7 \cdot 10^8$-ჯერ ნაკლები ახლანდელ რადიუსზე.
SEN: $R = \dfrac{2GM}{c^2} = \dfrac{2 \times 6.67 \times 10^{-11} \times 6 \times 10^{24}}{9 \times 10^{16}} \approx 8.9 \times 10^{-3}\ \text{m}$
$\approx 9\ \text{mm}$ — about $7 \times 10^8$ times smaller than its present radius.
AKA: $\approx 9\ \text{მმ}$
AEN: $\approx 9\ \text{mm}$

--- hard mkt
KA: ერთსა და იმავე ტემპერატურაზე რამდენჯერ მეტია წყალბადის ($M = 2\ \text{გ/მოლი}$) მოლეკულების საშუალო კვადრატული სიჩქარე ჟანგბადისაზე ($M = 32\ \text{გ/მოლი}$)? რატომ არ შეიცავს დედამიწის ატმოსფერო თითქმის წყალბადს?
EN: At the same temperature, how many times greater is the rms speed of hydrogen ($M = 2\ \text{g/mol}$) than that of oxygen ($M = 32\ \text{g/mol}$)? Why does Earth's atmosphere contain almost no hydrogen?
HKA: $v = \sqrt{\dfrac{3RT}{M}}$; შეადარეთ მეორე კოსმოსურ სიჩქარეს ($11{,}2\ \text{კმ/წმ}$).
HEN: $v = \sqrt{\dfrac{3RT}{M}}$; compare with the escape speed ($11.2\ \text{km/s}$).
SKA: $\dfrac{v_{\text{H}_2}}{v_{\text{O}_2}} = \sqrt{\dfrac{M_{\text{O}_2}}{M_{\text{H}_2}}} = \sqrt{\dfrac{32}{2}} = 4$
წყალბადის მოლეკულები უფრო სწრაფია; სიჩქარეების განაწილების „კუდში“ მათი მნიშვნელოვანი ნაწილი აღწევს გაქცევის სიჩქარეს და მილიარდობით წლის განმავლობაში ატმოსფეროდან „გაიპარა“.
SEN: $\dfrac{v_{\text{H}_2}}{v_{\text{O}_2}} = \sqrt{\dfrac{M_{\text{O}_2}}{M_{\text{H}_2}}} = \sqrt{\dfrac{32}{2}} = 4$
Hydrogen molecules are faster; a significant share in the "tail" of the speed distribution reaches escape speed, and over billions of years hydrogen leaked away.
AKA: $4$-ჯერ
AEN: $4$ times

KA: მოლეკულურ-კინეტიკური თეორიის ძირითადი განტოლებაა $p = \dfrac{1}{3}\rho \overline{v^2}$. იპოვეთ ჰაერის მოლეკულების საშუალო კვადრატული სიჩქარე, თუ $p = 10^5\ \text{პა}$, $\rho = 1{,}29\ \text{კგ/მ}^3$.
EN: The basic equation of kinetic theory is $p = \dfrac{1}{3}\rho \overline{v^2}$. Find the rms speed of air molecules if $p = 10^5\ \text{Pa}$ and $\rho = 1.29\ \text{kg/m}^3$.
