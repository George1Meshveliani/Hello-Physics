HEN: $v = \sqrt{\dfrac{3p}{\rho}}$.
SKA: $p = \dfrac{1}{3}\rho \overline{v^2} \Rightarrow v = \sqrt{\dfrac{3p}{\rho}}$
$v = \sqrt{\dfrac{3 \cdot 10^5}{1{,}29}} \approx 482\ \text{მ/წმ}$ — ბგერის სიჩქარის რიგისაა.
SEN: $p = \dfrac{1}{3}\rho \overline{v^2} \Rightarrow v = \sqrt{\dfrac{3p}{\rho}}$
$v = \sqrt{\dfrac{3 \times 10^5}{1.29}} \approx 482\ \text{m/s}$ — of the order of the speed of sound.
AKA: $\approx 480\ \text{მ/წმ}$
AEN: $\approx 480\ \text{m/s}$

--- hard gaslaw
KA: $40\ \text{ლ}$ ბალონში ჟანგბადი იყო $1{,}5 \cdot 10^7\ \text{პა}$ წნევით $27\ \text{°C}$-ზე. ნაწილის გამოყენების შემდეგ წნევა $5 \cdot 10^6\ \text{პა}$-მდე დაეცა, ტემპერატურა — $17\ \text{°C}$-მდე. რამდენი ჟანგბადი გამოიყენეს? ($M = 0{,}032\ \text{კგ/მოლი}$)
EN: A $40\ \text{L}$ cylinder held oxygen at $1.5 \times 10^7\ \text{Pa}$ and $27\ \text{°C}$. After some was used, the pressure fell to $5 \times 10^6\ \text{Pa}$ and the temperature to $17\ \text{°C}$. How much oxygen was used? ($M = 0.032\ \text{kg/mol}$)
HKA: $m = \dfrac{pVM}{RT}$ — ორივე მდგომარეობისთვის.
HEN: $m = \dfrac{pVM}{RT}$ — for both states.
SKA: $\Delta m = \dfrac{VM}{R}\left(\dfrac{p_1}{T_1} - \dfrac{p_2}{T_2}\right)$
$\dfrac{p_1}{T_1} = \dfrac{1{,}5 \cdot 10^7}{300} = 5 \cdot 10^4$, $\ \dfrac{p_2}{T_2} = \dfrac{5 \cdot 10^6}{290} \approx 1{,}72 \cdot 10^4$
$\Delta m = \dfrac{0{,}04 \cdot 0{,}032}{8{,}31} \cdot 3{,}28 \cdot 10^4 \approx 5{,}05\ \text{კგ}$
SEN: $\Delta m = \dfrac{VM}{R}\left(\dfrac{p_1}{T_1} - \dfrac{p_2}{T_2}\right)$
$\dfrac{p_1}{T_1} = \dfrac{1.5 \times 10^7}{300} = 5 \times 10^4$, $\ \dfrac{p_2}{T_2} = \dfrac{5 \times 10^6}{290} \approx 1.72 \times 10^4$
$\Delta m = \dfrac{0.04 \times 0.032}{8.31} \times 3.28 \times 10^4 \approx 5.05\ \text{kg}$
AKA: $\approx 5\ \text{კგ}$
AEN: $\approx 5\ \text{kg}$

--- hard gaslaw
KA: $2\ \text{ლ}$ ჭურჭელში აირია $3 \cdot 10^5\ \text{პა}$ წნევით, $4\ \text{ლ}$ ჭურჭელში — იგივე აირი $1{,}5 \cdot 10^5\ \text{პა}$ წნევით. ჭურჭლებს აერთებენ (ტემპერატურა იგივეა). იპოვეთ დამყარებული წნევა.
EN: A $2\ \text{L}$ vessel holds gas at $3 \times 10^5\ \text{Pa}$, and a $4\ \text{L}$ vessel holds the same gas at $1.5 \times 10^5\ \text{Pa}$. The vessels are connected (same temperature). Find the final pressure.
HKA: მოლების რიცხვი იკრიბება: $p_1V_1 + p_2V_2 = p(V_1 + V_2)$ (დალტონის კანონი).
HEN: The moles add up: $p_1V_1 + p_2V_2 = p(V_1 + V_2)$ (Dalton's law).
SKA: $p = \dfrac{p_1V_1 + p_2V_2}{V_1 + V_2}$
$p = \dfrac{3 \cdot 10^5 \cdot 2 + 1{,}5 \cdot 10^5 \cdot 4}{6} = 2 \cdot 10^5\ \text{პა}$
SEN: $p = \dfrac{p_1V_1 + p_2V_2}{V_1 + V_2}$
$p = \dfrac{3 \times 10^5 \times 2 + 1.5 \times 10^5 \times 4}{6} = 2 \times 10^5\ \text{Pa}$
AKA: $2 \cdot 10^5\ \text{პა}$
AEN: $2 \times 10^5\ \text{Pa}$

--- hard gaslaw
KA: ჰაერბურთის მოცულობაა $500\ \text{მ}^3$. გარე ჰაერის სიმკვრივეა $1{,}2\ \text{კგ/მ}^3$ $290\ \text{K}$-ზე, შიგნით ჰაერი $360\ \text{K}$-მდეა გამთბარი (წნევა იგივეა). რა მასის ტვირთის (გარსის ჩათვლით) აწევა შეუძლია?
EN: A hot-air balloon has volume $500\ \text{m}^3$. Outside air has density $1.2\ \text{kg/m}^3$ at $290\ \text{K}$; the air inside is heated to $360\ \text{K}$ (same pressure). What mass (including the envelope) can it lift?
HKA: მუდმივი წნევისას $\rho \sim \dfrac{1}{T}$.
HEN: At constant pressure $\rho \sim \dfrac{1}{T}$.
SKA: $\rho_{\text{შ}} = \rho_0\dfrac{T_0}{T} = 1{,}2 \cdot \dfrac{290}{360} \approx 0{,}967\ \text{კგ/მ}^3$
$m = (\rho_0 - \rho_{\text{შ}})V = (1{,}2 - 0{,}967) \cdot 500 \approx 117\ \text{კგ}$
SEN: $\rho_{\text{in}} = \rho_0\dfrac{T_0}{T} = 1.2 \times \dfrac{290}{360} \approx 0.967\ \text{kg/m}^3$
$m = (\rho_0 - \rho_{\text{in}})V = (1.2 - 0.967) \times 500 \approx 117\ \text{kg}$
AKA: $\approx 117\ \text{კგ}$
AEN: $\approx 117\ \text{kg}$

--- hard isoproc
KA: ვიწრო მილში, რომლის ღია ბოლო ზემოთაა მიმართული, $10\ \text{სმ}$ სიგრძის ვერცხლისწყლის სვეტი კეტავს $30\ \text{სმ}$ სიგრძის ჰაერის სვეტს. მილს ღია ბოლოთი ქვემოთ აბრუნებენ. რა სიგრძის გახდება ჰაერის სვეტი? ($p_0 = 76\ \text{სმ ვწყ. სვ.}$, $T = \text{const}$)
EN: In a narrow tube with its open end up, a $10\ \text{cm}$ column of mercury traps a $30\ \text{cm}$ column of air. The tube is turned open end down. How long does the air column become? ($p_0 = 76\ \text{cmHg}$, $T = \text{const}$)
HKA: ღია ბოლო ზემოთ: $p_1 = p_0 + h$; ქვემოთ: $p_2 = p_0 - h$.
HEN: Open end up: $p_1 = p_0 + h$; open end down: $p_2 = p_0 - h$.
SKA: $p_1 = 76 + 10 = 86$, $\ p_2 = 76 - 10 = 66\ \text{სმ ვწყ. სვ.}$
$p_1L_1 = p_2L_2 \Rightarrow L_2 = \dfrac{86 \cdot 30}{66} \approx 39{,}1\ \text{სმ}$
SEN: $p_1 = 76 + 10 = 86$, $\ p_2 = 76 - 10 = 66\ \text{cmHg}$
$p_1L_1 = p_2L_2 \Rightarrow L_2 = \dfrac{86 \times 30}{66} \approx 39.1\ \text{cm}$
AKA: $\approx 39\ \text{სმ}$
AEN: $\approx 39\ \text{cm}$

--- hard isoproc
KA: აირი ($p_1 = 10^5\ \text{პა}$, $V_1 = 1\ \text{ლ}$, $T_1 = 300\ \text{K}$) ჯერ იზოქორულად თბება, სანამ წნევა $3 \cdot 10^5\ \text{პა}$ არ გახდება, შემდეგ იზობარულად ფართოვდება $2\ \text{ლ}$-მდე. იპოვეთ შუალედური და საბოლოო ტემპერატურები და აირის მუშაობა.
EN: A gas ($p_1 = 10^5\ \text{Pa}$, $V_1 = 1\ \text{L}$, $T_1 = 300\ \text{K}$) is first heated isochorically until its pressure is $3 \times 10^5\ \text{Pa}$, then expands isobarically to $2\ \text{L}$. Find the intermediate and final temperatures and the work done by the gas.
HKA: იზოქორულ ნაწილში მუშაობა $0$-ია.
HEN: There is no work in the isochoric part.
SKA: $T_2 = T_1\dfrac{p_2}{p_1} = 300 \cdot 3 = 900\ \text{K}$
$T_3 = T_2\dfrac{V_3}{V_2} = 900 \cdot 2 = 1800\ \text{K}$
$A = p_2(V_3 - V_2) = 3 \cdot 10^5 \cdot 10^{-3} = 300\ \text{ჯ}$
SEN: $T_2 = T_1\dfrac{p_2}{p_1} = 300 \times 3 = 900\ \text{K}$
$T_3 = T_2\dfrac{V_3}{V_2} = 900 \times 2 = 1800\ \text{K}$
$A = p_2(V_3 - V_2) = 3 \times 10^5 \times 10^{-3} = 300\ \text{J}$
AKA: $900\ \text{K}$; $1800\ \text{K}$; $300\ \text{ჯ}$
AEN: $900\ \text{K}$; $1800\ \text{K}$; $300\ \text{J}$

--- hard isoproc
KA: ვერტიკალურ ცილინდრში აირს კეტავს $10\ \text{კგ}$ მასის დგუში, ფართობით $50\ \text{სმ}^2$; $p_0 = 10^5\ \text{პა}$. აირს $300\ \text{K}$-დან $360\ \text{K}$-მდე ათბობენ, დგუშის საწყისი სიმაღლეა $20\ \text{სმ}$. იპოვეთ აირის წნევა, დგუშის აწევა და აირის მუშაობა.
EN: In a vertical cylinder a gas is held by a $10\ \text{kg}$ piston of area $50\ \text{cm}^2$; $p_0 = 10^5\ \text{Pa}$. The gas is heated from $300\ \text{K}$ to $360\ \text{K}$; the piston starts at a height of $20\ \text{cm}$. Find the gas pressure, the rise of the piston and the work done by the gas.
HKA: დგუშის წონასწორობა: $p = p_0 + \dfrac{mg}{S}$ — პროცესი იზობარულია.
HEN: Piston equilibrium: $p = p_0 + \dfrac{mg}{S}$ — the process is isobaric.
SKA: $p = 10^5 + \dfrac{100}{5 \cdot 10^{-3}} = 1{,}2 \cdot 10^5\ \text{პა}$
$h_2 = h_1\dfrac{T_2}{T_1} = 20 \cdot 1{,}2 = 24\ \text{სმ}$, $\ \Delta h = 4\ \text{სმ}$
$A = pS\Delta h = 1{,}2 \cdot 10^5 \cdot 5 \cdot 10^{-3} \cdot 0{,}04 = 24\ \text{ჯ}$
SEN: $p = 10^5 + \dfrac{100}{5 \times 10^{-3}} = 1.2 \times 10^5\ \text{Pa}$
$h_2 = h_1\dfrac{T_2}{T_1} = 20 \times 1.2 = 24\ \text{cm}$, $\ \Delta h = 4\ \text{cm}$
$A = pS\Delta h = 1.2 \times 10^5 \times 5 \times 10^{-3} \times 0.04 = 24\ \text{J}$
AKA: $1{,}2 \cdot 10^5\ \text{პა}$; $4\ \text{სმ}$; $24\ \text{ჯ}$
AEN: $1.2 \times 10^5\ \text{Pa}$; $4\ \text{cm}$; $24\ \text{J}$

--- hard internal
KA: თბოიზოლირებულ ჭურჭელში ერევა $1$ მოლი ჰელიუმი $300\ \text{K}$-ზე და $2$ მოლი ჰელიუმი $600\ \text{K}$-ზე. იპოვეთ ნარევის ტემპერატურა.
EN: In an insulated vessel, $1$ mol of helium at $300\ \text{K}$ mixes with $2$ mol of helium at $600\ \text{K}$. Find the temperature of the mixture.
HKA: შინაგანი ენერგიების ჯამი შენარჩუნდება.
HEN: The total internal energy is conserved.
SKA: $\dfrac{3}{2}R(\nu_1T_1 + \nu_2T_2) = \dfrac{3}{2}R(\nu_1 + \nu_2)T$
$T = \dfrac{\nu_1T_1 + \nu_2T_2}{\nu_1 + \nu_2} = \dfrac{300 + 1200}{3} = 500\ \text{K}$
SEN: $\dfrac{3}{2}R(\nu_1T_1 + \nu_2T_2) = \dfrac{3}{2}R(\nu_1 + \nu_2)T$
$T = \dfrac{\nu_1T_1 + \nu_2T_2}{\nu_1 + \nu_2} = \dfrac{300 + 1200}{3} = 500\ \text{K}$
AKA: $500\ \text{K}$
AEN: $500\ \text{K}$

--- hard internal
KA: იპოვეთ ერთატომიანი იდეალური აირის მოლური სითბოტევადობები მუდმივი მოცულობისა ($C_V$) და მუდმივი წნევისას ($C_p$). დაამტკიცეთ მაიერის თანაფარდობა $C_p - C_V = R$.
EN: Find the molar heat capacities of a monatomic ideal gas at constant volume ($C_V$) and at constant pressure ($C_p$). Prove Mayer's relation $C_p - C_V = R$.
HKA: $C = \dfrac{Q}{\nu\Delta T}$; იზობარულად $Q = \Delta U + \nu R\Delta T$.
HEN: $C = \dfrac{Q}{\nu\Delta T}$; at constant pressure $Q = \Delta U + \nu R\Delta T$.
SKA: $V = \text{const}$: $Q = \Delta U = \dfrac{3}{2}\nu R\Delta T \Rightarrow C_V = \dfrac{3}{2}R \approx 12{,}5\ \text{ჯ/(მოლი}\cdot\text{K)}$
$p = \text{const}$: $Q = \dfrac{3}{2}\nu R\Delta T + \nu R\Delta T \Rightarrow C_p = \dfrac{5}{2}R \approx 20{,}8\ \text{ჯ/(მოლი}\cdot\text{K)}$
$C_p - C_V = R$ — სხვაობა აირის მიერ შესრულებული მუშაობაა ∎
SEN: $V = \text{const}$: $Q = \Delta U = \dfrac{3}{2}\nu R\Delta T \Rightarrow C_V = \dfrac{3}{2}R \approx 12.5\ \text{J/(mol}\cdot\text{K)}$
$p = \text{const}$: $Q = \dfrac{3}{2}\nu R\Delta T + \nu R\Delta T \Rightarrow C_p = \dfrac{5}{2}R \approx 20.8\ \text{J/(mol}\cdot\text{K)}$
$C_p - C_V = R$ — the difference is the work done by the gas ∎
AKA: $12{,}5$ და $20{,}8\ \text{ჯ/(მოლი}\cdot\text{K)}$
AEN: $12.5$ and $20.8\ \text{J/(mol}\cdot\text{K)}$

--- hard gaswork
KA: $1$ მოლი იდეალური აირი $300\ \text{K}$-ზე იზოთერმულად ფართოვდება და მოცულობა ორმაგდება. იპოვეთ მუშაობა, თუ იზოთერმული მუშაობა $A = \nu RT\ln\dfrac{V_2}{V_1}$. რატომ არ შეიძლება აქ $A = p\Delta V$-ის გამოყენება?
EN: $1$ mol of an ideal gas at $300\ \text{K}$ expands isothermally to double its volume. Find the work, given that isothermal work is $A = \nu RT\ln\dfrac{V_2}{V_1}$. Why can't you use $A = p\Delta V$ here?
HKA: $\ln 2 \approx 0{,}693$.
HEN: $\ln 2 \approx 0.693$.
SKA: $A = \nu RT\ln\dfrac{V_2}{V_1} = 8{,}31 \cdot 300 \cdot 0{,}693 \approx 1728\ \text{ჯ}$
$p$ იზოთერმულად მცირდება ($p \sim \dfrac{1}{V}$), ამიტომ $A$ — ჰიპერბოლის ქვეშ მოთავსებული ფართობია და არა მართკუთხედის.
SEN: $A = \nu RT\ln\dfrac{V_2}{V_1} = 8.31 \times 300 \times 0.693 \approx 1728\ \text{J}$
$p$ falls during the isothermal expansion ($p \sim \dfrac{1}{V}$), so $A$ is the area under a hyperbola, not a rectangle.
AKA: $\approx 1{,}73\ \text{კჯ}$
AEN: $\approx 1.73\ \text{kJ}$

--- hard gaswork
KA: ერთატომიანი აირი $p$–$V$ დიაგრამაზე სწორხაზოვნად გადადის $(10^5\ \text{პა};\ 1\ \text{ლ})$ მდგომარეობიდან $(3 \cdot 10^5\ \text{პა};\ 3\ \text{ლ})$ მდგომარეობაში. იპოვეთ $A$, $\Delta U$ და $Q$.
EN: A monatomic gas goes along a straight line on the $p$–$V$ diagram from $(10^5\ \text{Pa},\ 1\ \text{L})$ to $(3 \times 10^5\ \text{Pa},\ 3\ \text{L})$. Find $A$, $\Delta U$ and $Q$.
HKA: $\Delta U = \dfrac{3}{2}(p_2V_2 - p_1V_1)$.
HEN: $\Delta U = \dfrac{3}{2}(p_2V_2 - p_1V_1)$.
SKA: $A = \dfrac{p_1 + p_2}{2}(V_2 - V_1) = 2 \cdot 10^5 \cdot 2 \cdot 10^{-3} = 400\ \text{ჯ}$
$\Delta U = \dfrac{3}{2}(900 - 100) = 1200\ \text{ჯ}$
$Q = \Delta U + A = 1600\ \text{ჯ}$
SEN: $A = \dfrac{p_1 + p_2}{2}(V_2 - V_1) = 2 \times 10^5 \times 2 \times 10^{-3} = 400\ \text{J}$
$\Delta U = \dfrac{3}{2}(900 - 100) = 1200\ \text{J}$
$Q = \Delta U + A = 1600\ \text{J}$
AKA: $400\ \text{ჯ}$; $1200\ \text{ჯ}$; $1600\ \text{ჯ}$
AEN: $400\ \text{J}$; $1200\ \text{J}$; $1600\ \text{J}$

--- hard thermo1
KA: ერთატომიან აირს მუდმივი წნევისას $1000\ \text{ჯ}$ სითბო გადასცეს. იპოვეთ აირის მუშაობა და შინაგანი ენერგიის ცვლილება.
EN: $1000\ \text{J}$ of heat is supplied to a monatomic gas at constant pressure. Find the work done by the gas and the change in internal energy.
HKA: იზობარულად $A : \Delta U : Q = 2 : 3 : 5$.
HEN: At constant pressure $A : \Delta U : Q = 2 : 3 : 5$.
SKA: $Q = \dfrac{5}{2}\nu R\Delta T$, $\ A = \nu R\Delta T = \dfrac{2}{5}Q$
$A = 0{,}4 \cdot 1000 = 400\ \text{ჯ}$, $\ \Delta U = 600\ \text{ჯ}$
SEN: $Q = \dfrac{5}{2}\nu R\Delta T$, $\ A = \nu R\Delta T = \dfrac{2}{5}Q$
$A = 0.4 \times 1000 = 400\ \text{J}$, $\ \Delta U = 600\ \text{J}$
AKA: $400\ \text{ჯ}$; $600\ \text{ჯ}$
AEN: $400\ \text{J}$; $600\ \text{J}$

--- hard thermo1
KA: ერთატომიანი აირის ციკლი $p$–$V$ დიაგრამაზე მართკუთხედია: $p_1 = 10^5$, $p_2 = 2 \cdot 10^5\ \text{პა}$; $V_1 = 1$, $V_2 = 3\ \text{ლ}$ (იზოქორული გათბობა $V_1$-ზე, იზობარული გაფართოება $p_2$-ზე, …). იპოვეთ ციკლის მქკ და შეადარეთ კარნოს ციკლს იმავე უკიდურეს ტემპერატურებს შორის.
EN: A monatomic gas cycle is a rectangle on the $p$–$V$ diagram: $p_1 = 10^5$, $p_2 = 2 \times 10^5\ \text{Pa}$; $V_1 = 1$, $V_2 = 3\ \text{L}$ (isochoric heating at $V_1$, isobaric expansion at $p_2$, …). Find the cycle's efficiency and compare it with a Carnot cycle between the same extreme temperatures.
HKA: სითბოს იღებს მხოლოდ პირველ ორ ეტაპზე. $T \sim pV$.
HEN: Heat is taken in only during the first two stages. $T \sim pV$.
SKA: $A = (p_2 - p_1)(V_2 - V_1) = 10^5 \cdot 2 \cdot 10^{-3} = 200\ \text{ჯ}$
$Q_{12} = \dfrac{3}{2}V_1(p_2 - p_1) = 150\ \text{ჯ}$, $\ Q_{23} = \dfrac{5}{2}p_2(V_2 - V_1) = 1000\ \text{ჯ}$
$\eta = \dfrac{200}{1150} \approx 17\%$
$\dfrac{T_{\max}}{T_{\min}} = \dfrac{p_2V_2}{p_1V_1} = 6 \Rightarrow \eta_{\text{კ}} = 1 - \dfrac{1}{6} \approx 83\%$
SEN: $A = (p_2 - p_1)(V_2 - V_1) = 10^5 \times 2 \times 10^{-3} = 200\ \text{J}$
$Q_{12} = \dfrac{3}{2}V_1(p_2 - p_1) = 150\ \text{J}$, $\ Q_{23} = \dfrac{5}{2}p_2(V_2 - V_1) = 1000\ \text{J}$
$\eta = \dfrac{200}{1150} \approx 17\%$
$\dfrac{T_{\max}}{T_{\min}} = \dfrac{p_2V_2}{p_1V_1} = 6 \Rightarrow \eta_{\text{C}} = 1 - \dfrac{1}{6} \approx 83\%$
AKA: $\approx 17\%$; კარნო — $\approx 83\%$
AEN: $\approx 17\%$; Carnot $\approx 83\%$

--- hard engines
KA: გამომგონებელი აცხადებს, რომ მისი ძრავა $800\ \text{K}$-სა და $300\ \text{K}$-ს შორის მუშაობს და ყოველ $10\ \text{კჯ}$ სითბოზე $7\ \text{კჯ}$ მუშაობას ასრულებს. შესაძლებელია ეს?
EN: An inventor claims his engine works between $800\ \text{K}$ and $300\ \text{K}$ and does $7\ \text{kJ}$ of work for every $10\ \text{kJ}$ of heat. Is this possible?
HKA: არცერთი ძრავის მქკ არ აღემატება კარნოს მქკ-ს.
HEN: No engine is more efficient than a Carnot engine.
SKA: $\eta_{\text{კ}} = 1 - \dfrac{300}{800} = 62{,}5\%$
$\eta_{\text{განც.}} = \dfrac{7}{10} = 70\% > 62{,}5\%$ — შეუძლებელია (ეწინააღმდეგება თერმოდინამიკის II კანონს).
SEN: $\eta_{\text{C}} = 1 - \dfrac{300}{800} = 62.5\%$
$\eta_{\text{claimed}} = \dfrac{7}{10} = 70\% > 62.5\%$ — impossible (it violates the second law of thermodynamics).
AKA: შეუძლებელია
AEN: impossible

--- hard engines
KA: ელექტროსადგურის ელექტრული სიმძლავრეა $1\ \text{გვტ}$, მქკ — $35\%$. ნარჩენ სითბოს მდინარე წაიღებს, რომლის ხარჯია $10^5\ \text{კგ/წმ}$. რამდენი გრადუსით თბება მდინარე?
EN: A power station delivers $1\ \text{GW}$ of electrical power at $35\%$ efficiency. A river carries away the waste heat with a flow of $10^5\ \text{kg/s}$. By how many degrees does the river warm?
HKA: ნარჩენი სიმძლავრე: $P_2 = P\left(\dfrac{1}{\eta} - 1\right)$.
HEN: Waste power: $P_2 = P\left(\dfrac{1}{\eta} - 1\right)$.
SKA: $P_2 = 10^9 \cdot \left(\dfrac{1}{0{,}35} - 1\right) \approx 1{,}86 \cdot 10^9\ \text{ვტ}$
$P_2 = c\,\dfrac{m}{t}\,\Delta T \Rightarrow \Delta T = \dfrac{1{,}86 \cdot 10^9}{4200 \cdot 10^5} \approx 4{,}4\ \text{°C}$
SEN: $P_2 = 10^9 \times \left(\dfrac{1}{0.35} - 1\right) \approx 1.86 \times 10^9\ \text{W}$
$P_2 = c\,\dfrac{m}{t}\,\Delta T \Rightarrow \Delta T = \dfrac{1.86 \times 10^9}{4200 \times 10^5} \approx 4.4\ \text{°C}$
AKA: $\approx 4{,}4\ \text{°C}$
AEN: $\approx 4.4\ \text{°C}$

--- hard engines
KA: იდეალური მაცივრის კამერაში $-3\ \text{°C}$-ია, ოთახში — $27\ \text{°C}$. იპოვეთ მაქსიმალური ეფექტურობის კოეფიციენტი. რამდენ სითბოს ამოიღებს კამერიდან $1\ \text{კვტ}\cdot\text{სთ}$ ელექტროენერგიით?
EN: An ideal refrigerator keeps its compartment at $-3\ \text{°C}$ in a $27\ \text{°C}$ room. Find its maximum coefficient of performance. How much heat can it remove from the compartment using $1\ \text{kW}\cdot\text{h}$ of electricity?
HKA: $\varepsilon_{\max} = \dfrac{T_2}{T_1 - T_2}$.
HEN: $\varepsilon_{\max} = \dfrac{T_2}{T_1 - T_2}$.
SKA: $\varepsilon_{\max} = \dfrac{270}{300 - 270} = 9$
$Q_2 = \varepsilon A = 9 \cdot 3{,}6 \cdot 10^6 \approx 3{,}2 \cdot 10^7\ \text{ჯ}$
SEN: $\varepsilon_{\max} = \dfrac{270}{300 - 270} = 9$
$Q_2 = \varepsilon A = 9 \times 3.6 \times 10^6 \approx 3.2 \times 10^7\ \text{J}$
AKA: $9$; $\approx 3{,}2 \cdot 10^7\ \text{ჯ}$
AEN: $9$; $\approx 3.2 \times 10^7\ \text{J}$

--- hard humidity
KA: დღისით $25\ \text{°C}$-ზე ფარდობითი ტენიანობა $60\%$-ია. ღამით ტემპერატურა $15\ \text{°C}$-მდე ეცემა. იქნება ნამი? თუ კი, რამდენი წყალი გამოიყოფა $1\ \text{მ}^3$-დან? ($\rho_{\text{ნ}}$: $15\ \text{°C}$ — $12{,}8$; $16\ \text{°C}$ — $13{,}6$; $17\ \text{°C}$ — $14{,}5$; $25\ \text{°C}$ — $23{,}0\ \text{გ/მ}^3$)
EN: In the daytime at $25\ \text{°C}$ the relative humidity is $60\%$. At night the temperature falls to $15\ \text{°C}$. Will there be dew? If so, how much water condenses from each $1\ \text{m}^3$? ($\rho_{\text{sat}}$: $15\ \text{°C}$ — $12.8$; $16\ \text{°C}$ — $13.6$; $17\ \text{°C}$ — $14.5$; $25\ \text{°C}$ — $23.0\ \text{g/m}^3$)
HKA: იპოვეთ ორთქლის სიმკვრივე და შეადარეთ ნაჯერს $15\ \text{°C}$-ზე.
HEN: Find the vapour density and compare it with the saturated value at $15\ \text{°C}$.
SKA: $\rho = 0{,}6 \cdot 23{,}0 = 13{,}8\ \text{გ/მ}^3$ — ნამის წერტილი $\approx 16\ \text{°C}$
$15\ \text{°C} < 16\ \text{°C}$ $\Rightarrow$ ნამი იქნება.
$\Delta\rho = 13{,}8 - 12{,}8 = 1{,}0\ \text{გ}$ ყოველი $\text{მ}^3$-დან
SEN: $\rho = 0.6 \times 23.0 = 13.8\ \text{g/m}^3$ — dew point $\approx 16\ \text{°C}$
$15\ \text{°C} < 16\ \text{°C}$ $\Rightarrow$ there will be dew.
$\Delta\rho = 13.8 - 12.8 = 1.0\ \text{g}$ from each $\text{m}^3$
AKA: დიახ; $\approx 1\ \text{გ}$
AEN: yes; $\approx 1\ \text{g}$

--- hard humidity
KA: $40\%$ ფარდობითი ტენიანობის ჰაერს იზოთერმულად $3$-ჯერ კუმშავენ. რა იქნება ფარდობითი ტენიანობა? ორთქლის რა ნაწილი კონდენსირდება?
EN: Air at $40\%$ relative humidity is compressed isothermally to a third of its volume. What is the relative humidity then? What fraction of the vapour condenses?
HKA: ორთქლის სიმკვრივე $3$-ჯერ გაიზრდებოდა, მაგრამ $\varphi$ ვერ გადააჭარბებს $100\%$-ს.
HEN: The vapour density would triple, but $\varphi$ cannot exceed $100\%$.
SKA: „ვირტუალურად“: $\varphi = 3 \cdot 40\% = 120\% > 100\%$ $\Rightarrow$ ორთქლი ნაჯერი ხდება, $\varphi = 100\%$.
დარჩენილი წილი: $\dfrac{100}{120} = \dfrac{5}{6}$, $\ $ კონდენსირდება $\dfrac{1}{6}$
SEN: "Virtually": $\varphi = 3 \times 40\% = 120\% > 100\%$ $\Rightarrow$ the vapour becomes saturated, $\varphi = 100\%$.
Fraction remaining: $\dfrac{100}{120} = \dfrac{5}{6}$, $\ $ so $\dfrac{1}{6}$ condenses
AKA: $100\%$; $\dfrac{1}{6}$
AEN: $100\%$; $\dfrac{1}{6}$

--- hard liquids
KA: იპოვეთ $2\ \text{სმ}$ რადიუსიანი საპნის ბუშტის შიგნით ჭარბი წნევა და ბუშტის გაბერვისთვის საჭირო მინიმალური მუშაობა ($\sigma = 0{,}04\ \text{ნ/მ}$).
EN: Find the excess pressure inside a soap bubble of radius $2\ \text{cm}$ and the minimum work needed to blow it ($\sigma = 0.04\ \text{N/m}$).
HKA: ბუშტს ორი ზედაპირი აქვს: $\Delta p = \dfrac{4\sigma}{r}$, $\ A = \sigma \cdot 2 \cdot 4\pi r^2$.
HEN: A bubble has two surfaces: $\Delta p = \dfrac{4\sigma}{r}$, $\ A = \sigma \times 2 \times 4\pi r^2$.
SKA: $\Delta p = \dfrac{4 \cdot 0{,}04}{0{,}02} = 8\ \text{პა}$
$A = 8\pi r^2\sigma = 8 \cdot 3{,}14 \cdot 4 \cdot 10^{-4} \cdot 0{,}04 \approx 4 \cdot 10^{-4}\ \text{ჯ}$
SEN: $\Delta p = \dfrac{4 \times 0.04}{0.02} = 8\ \text{Pa}$
$A = 8\pi r^2\sigma = 8 \times 3.14 \times 4 \times 10^{-4} \times 0.04 \approx 4 \times 10^{-4}\ \text{J}$
AKA: $8\ \text{პა}$; $\approx 4 \cdot 10^{-4}\ \text{ჯ}$
AEN: $8\ \text{Pa}$; $\approx 4 \times 10^{-4}\ \text{J}$

--- hard liquids
KA: $0{,}2\ \text{მმ}$ რადიუსიანი კაპილარი წყალში ისეა ჩაშვებული, რომ მისი ზედა ბოლო წყლის დონიდან $5\ \text{სმ}$-ზეა. გადმოიღვრება თუ არა წყალი კაპილარიდან (უწყვეტი „შადრევანი“)? ($\sigma = 0{,}073\ \text{ნ/მ}$)
EN: A capillary of radius $0.2\ \text{mm}$ is dipped in water so that its top end is $5\ \text{cm}$ above the water level. Will water overflow from it (a perpetual "fountain")? ($\sigma = 0.073\ \text{N/m}$)
HKA: შეადარეთ თავისუფალი აწევის სიმაღლე $5\ \text{სმ}$-ს და იფიქრეთ მენისკის ფორმაზე.
HEN: Compare the free rise height with $5\ \text{cm}$ and think about the meniscus shape.
SKA: $h = \dfrac{2\sigma}{\rho g r} = \dfrac{2 \cdot 0{,}073}{1000 \cdot 10 \cdot 2 \cdot 10^{-4}} = 7{,}3\ \text{სმ} > 5\ \text{სმ}$
წყალი ზედა ბოლომდე ავა და გაჩერდება: მენისკი უფრო ბრტყელი გახდება (სიმრუდის რადიუსი გაიზრდება) ისე, რომ $\dfrac{2\sigma}{R} = \rho g \cdot 0{,}05$. გადმოღვრა არ მოხდება — სხვაგვარად მუდმივი ძრავა გამოგვივიდოდა.
SEN: $h = \dfrac{2\sigma}{\rho g r} = \dfrac{2 \times 0.073}{1000 \times 10 \times 2 \times 10^{-4}} = 7.3\ \text{cm} > 5\ \text{cm}$
Water rises to the top and stops: the meniscus flattens (its radius of curvature grows) until $\dfrac{2\sigma}{R} = \rho g \times 0.05$. No overflow — otherwise we would have a perpetual-motion machine.
AKA: არა
AEN: no

--- hard quantum
KA: ფოტოეფექტის ცდაში $\nu_1 = 6 \cdot 10^{14}\ \text{ჰც}$ სიხშირისთვის შემაკავებელი ძაბვაა $0{,}5\ \text{ვ}$, $\nu_2 = 10^{15}\ \text{ჰც}$-სთვის — $2{,}16\ \text{ვ}$. ამ მონაცემებით იპოვეთ პლანკის მუდმივა და გამოსვლის მუშაობა.
EN: In a photoelectric experiment the stopping voltage is $0.5\ \text{V}$ at $\nu_1 = 6 \times 10^{14}\ \text{Hz}$ and $2.16\ \text{V}$ at $\nu_2 = 10^{15}\ \text{Hz}$. Use these data to find Planck's constant and the work function.
HKA: $eU = h\nu - A$; გამოაკელით განტოლებები.
HEN: $eU = h\nu - A$; subtract the equations.
SKA: $e(U_2 - U_1) = h(\nu_2 - \nu_1) \Rightarrow h = \dfrac{e(U_2 - U_1)}{\nu_2 - \nu_1}$
$h = \dfrac{1{,}6 \cdot 10^{-19} \cdot 1{,}66}{4 \cdot 10^{14}} \approx 6{,}64 \cdot 10^{-34}\ \text{ჯ}\cdot\text{წმ}$
$A = h\nu_1 - eU_1 \approx 3{,}98 \cdot 10^{-19} - 0{,}8 \cdot 10^{-19} \approx 3{,}2 \cdot 10^{-19}\ \text{ჯ} \approx 2\ \text{ევ}$
SEN: $e(U_2 - U_1) = h(\nu_2 - \nu_1) \Rightarrow h = \dfrac{e(U_2 - U_1)}{\nu_2 - \nu_1}$
$h = \dfrac{1.6 \times 10^{-19} \times 1.66}{4 \times 10^{14}} \approx 6.64 \times 10^{-34}\ \text{J}\cdot\text{s}$
$A = h\nu_1 - eU_1 \approx 3.98 \times 10^{-19} - 0.8 \times 10^{-19} \approx 3.2 \times 10^{-19}\ \text{J} \approx 2\ \text{eV}$
AKA: $\approx 6{,}6 \cdot 10^{-34}\ \text{ჯ}\cdot\text{წმ}$; $\approx 2\ \text{ევ}$
AEN: $\approx 6.6 \times 10^{-34}\ \text{J}\cdot\text{s}$; $\approx 2\ \text{eV}$

--- hard quantum
KA: ლითონს ჯერ $350\ \text{ნმ}$, შემდეგ $540\ \text{ნმ}$ სინათლით ასხივებენ. ფოტოელექტრონების მაქსიმალური სიჩქარე პირველ შემთხვევაში $2$-ჯერ მეტია. იპოვეთ გამოსვლის მუშაობა.
EN: A metal is illuminated first with $350\ \text{nm}$ light and then with $540\ \text{nm}$ light. The maximum photoelectron speed is $2$ times greater in the first case. Find the work function.
HKA: სიჩქარე $2$-ჯერ $\Rightarrow$ კინეტიკური ენერგია $4$-ჯერ: $E_1 - A = 4(E_2 - A)$.
HEN: Speed $\times 2$ $\Rightarrow$ kinetic energy $\times 4$: $E_1 - A = 4(E_2 - A)$.
SKA: $E_1 = \dfrac{hc}{\lambda_1} = \dfrac{1{,}99 \cdot 10^{-25}}{3{,}5 \cdot 10^{-7}} \approx 5{,}68 \cdot 10^{-19}\ \text{ჯ}$, $\ E_2 \approx 3{,}68 \cdot 10^{-19}\ \text{ჯ}$
$A = \dfrac{4E_2 - E_1}{3} = \dfrac{14{,}73 - 5{,}68}{3} \cdot 10^{-19} \approx 3{,}0 \cdot 10^{-19}\ \text{ჯ} \approx 1{,}9\ \text{ევ}$
SEN: $E_1 = \dfrac{hc}{\lambda_1} = \dfrac{1.99 \times 10^{-25}}{3.5 \times 10^{-7}} \approx 5.68 \times 10^{-19}\ \text{J}$, $\ E_2 \approx 3.68 \times 10^{-19}\ \text{J}$
$A = \dfrac{4E_2 - E_1}{3} = \dfrac{14.73 - 5.68}{3} \times 10^{-19} \approx 3.0 \times 10^{-19}\ \text{J} \approx 1.9\ \text{eV}$
AKA: $\approx 1{,}9\ \text{ევ}$
AEN: $\approx 1.9\ \text{eV}$

--- hard quantum
KA: $1\ \text{ვტ}$ სიმძლავრის ლაზერის სხივი სრულად შთაინთქმება ზედაპირზე. რა ძალით აწვება სინათლე ზედაპირს? რა იქნება სრული არეკვლისას?
EN: The beam of a $1\ \text{W}$ laser is completely absorbed by a surface. What force does the light exert? What if it is completely reflected?
HKA: ფოტონის იმპულსი $p = \dfrac{E}{c}$, ამიტომ წამში გადაცემული იმპულსი $\dfrac{P}{c}$.
HEN: A photon's momentum is $p = \dfrac{E}{c}$, so the momentum delivered per second is $\dfrac{P}{c}$.
SKA: შთანთქმა: $F = \dfrac{P}{c} = \dfrac{1}{3 \cdot 10^8} \approx 3{,}3 \cdot 10^{-9}\ \text{ნ}$
არეკვლა (იმპულსი იცვლის ნიშანს): $F = \dfrac{2P}{c} \approx 6{,}7 \cdot 10^{-9}\ \text{ნ}$
SEN: Absorption: $F = \dfrac{P}{c} = \dfrac{1}{3 \times 10^8} \approx 3.3 \times 10^{-9}\ \text{N}$
Reflection (momentum reverses): $F = \dfrac{2P}{c} \approx 6.7 \times 10^{-9}\ \text{N}$
AKA: $3{,}3 \cdot 10^{-9}\ \text{ნ}$; $6{,}7 \cdot 10^{-9}\ \text{ნ}$
AEN: $3.3 \times 10^{-9}\ \text{N}$; $6.7 \times 10^{-9}\ \text{N}$

--- hard atom
KA: ბორის თეორიით $r_n = n^2 r_1$, $v_n = \dfrac{v_1}{n}$, სადაც $r_1 = 0{,}53 \cdot 10^{-10}\ \text{მ}$, $v_1 = 2{,}19 \cdot 10^6\ \text{მ/წმ}$. იპოვეთ ორბიტის რადიუსი და ელექტრონის სიჩქარე $n = 3$-ზე, ასევე ბრუნვის პერიოდი.
EN: In Bohr's theory $r_n = n^2 r_1$ and $v_n = \dfrac{v_1}{n}$, where $r_1 = 0.53 \times 10^{-10}\ \text{m}$ and $v_1 = 2.19 \times 10^6\ \text{m/s}$. Find the orbit radius and electron speed for $n = 3$, and the period of revolution.
HKA: $T = \dfrac{2\pi r}{v}$.
HEN: $T = \dfrac{2\pi r}{v}$.
SKA: $r_3 = 9 \cdot 0{,}53 \cdot 10^{-10} \approx 4{,}8 \cdot 10^{-10}\ \text{მ}$
$v_3 = \dfrac{2{,}19 \cdot 10^6}{3} = 7{,}3 \cdot 10^5\ \text{მ/წმ}$
$T = \dfrac{2\pi r_3}{v_3} = \dfrac{6{,}28 \cdot 4{,}77 \cdot 10^{-10}}{7{,}3 \cdot 10^5} \approx 4{,}1 \cdot 10^{-15}\ \text{წმ}$
SEN: $r_3 = 9 \times 0.53 \times 10^{-10} \approx 4.8 \times 10^{-10}\ \text{m}$
$v_3 = \dfrac{2.19 \times 10^6}{3} = 7.3 \times 10^5\ \text{m/s}$
$T = \dfrac{2\pi r_3}{v_3} = \dfrac{6.28 \times 4.77 \times 10^{-10}}{7.3 \times 10^5} \approx 4.1 \times 10^{-15}\ \text{s}$
AKA: $\approx 4{,}8 \cdot 10^{-10}\ \text{მ}$; $7{,}3 \cdot 10^5\ \text{მ/წმ}$; $\approx 4 \cdot 10^{-15}\ \text{წმ}$
AEN: $\approx 4.8 \times 10^{-10}\ \text{m}$; $7.3 \times 10^5\ \text{m/s}$; $\approx 4 \times 10^{-15}\ \text{s}$

--- hard atom
KA: ძირითად მდგომარეობაში მყოფ წყალბადის ატომებს $12{,}5\ \text{ევ}$ ენერგიის ელექტრონები ეჯახებიან. რომელ დონემდე შეიძლება აღიგზნოს ატომი და რამდენი სპექტრული ხაზი გამოჩნდება?
EN: Electrons of energy $12.5\ \text{eV}$ collide with hydrogen atoms in the ground state. Up to which level can the atoms be excited, and how many spectral lines appear?
HKA: $E_n - E_1 = 13{,}6\left(1 - \dfrac{1}{n^2}\right) \le 12{,}5$.
HEN: $E_n - E_1 = 13.6\left(1 - \dfrac{1}{n^2}\right) \le 12.5$.
SKA: $n = 3$: $13{,}6 \cdot \dfrac{8}{9} \approx 12{,}09\ \text{ევ} \le 12{,}5$ ✓; $\ n = 4$: $13{,}6 \cdot \dfrac{15}{16} = 12{,}75\ \text{ევ} > 12{,}5$ ✗
მაქსიმუმ $n = 3$; ხაზები: $3 \to 2$, $3 \to 1$, $2 \to 1$ — სულ $3$.
SEN: $n = 3$: $13.6 \times \dfrac{8}{9} \approx 12.09\ \text{eV} \le 12.5$ ✓; $\ n = 4$: $13.6 \times \dfrac{15}{16} = 12.75\ \text{eV} > 12.5$ ✗
At most $n = 3$; lines: $3 \to 2$, $3 \to 1$, $2 \to 1$ — $3$ in total.
AKA: $n = 3$; $3$ ხაზი
AEN: $n = 3$; $3$ lines

--- hard nucleus
KA: ურანის ($A = 235$) ბმის ენერგია ერთ ნუკლონზე $\approx 7{,}6\ \text{მევ}$-ია, დაშლის ნამსხვრევებისა ($A \approx 90$–$145$) — $\approx 8{,}5\ \text{მევ}$. შეაფასეთ ერთ დაშლაზე გამოყოფილი ენერგია. რატომ გამოყოფს ენერგიას როგორც მძიმე ბირთვების დაშლა, ისე მსუბუქების სინთეზი?
EN: The binding energy per nucleon of uranium ($A = 235$) is $\approx 7.6\ \text{MeV}$, and of the fission fragments ($A \approx 90$–$145$) $\approx 8.5\ \text{MeV}$. Estimate the energy released per fission. Why do both the fission of heavy nuclei and the fusion of light ones release energy?
HKA: გამოყოფილი ენერგია = ბმის ენერგიის ზრდა.
HEN: Energy released = increase in binding energy.
SKA: $\Delta E \approx 235 \cdot (8{,}5 - 7{,}6) \approx 210\ \text{მევ}$
ერთ ნუკლონზე ბმის ენერგია მაქსიმალურია რკინის მახლობლად ($A \approx 56$). ორივე პროცესი ბირთვებს ამ მაქსიმუმისკენ „უბიძგებს“ — ბმის ენერგია იზრდება, მასა მცირდება და სხვაობა ენერგიად გამოიყოფა.
SEN: $\Delta E \approx 235 \times (8.5 - 7.6) \approx 210\ \text{MeV}$
The binding energy per nucleon peaks near iron ($A \approx 56$). Both processes move nuclei towards this peak — the binding energy grows, the mass drops, and the difference is released as energy.
AKA: $\approx 210\ \text{მევ}$
AEN: $\approx 210\ \text{MeV}$

--- hard nucleus
KA: ატომური ელექტროსადგურის რეაქტორის სითბური სიმძლავრეა $1\ \text{გვტ}$. ერთ დაშლაზე გამოიყოფა $200\ \text{მევ}$. რამდენი ურან-$235$ იხარჯება დღეში?
EN: A nuclear reactor has a thermal power of $1\ \text{GW}$. Each fission releases $200\ \text{MeV}$. How much uranium-$235$ is used per day?
HKA: დაშლების რიცხვი წამში $= \dfrac{P}{E_1}$.
HEN: Fissions per second $= \dfrac{P}{E_1}$.
SKA: $E_1 = 200 \cdot 1{,}6 \cdot 10^{-13} = 3{,}2 \cdot 10^{-11}\ \text{ჯ}$, $\ \dfrac{N}{t} = \dfrac{10^9}{3{,}2 \cdot 10^{-11}} \approx 3{,}1 \cdot 10^{19}\ \text{წმ}^{-1}$
დღეში: $N = 3{,}1 \cdot 10^{19} \cdot 86\,400 \approx 2{,}7 \cdot 10^{24}$
$m = \dfrac{N}{N_A}M = \dfrac{2{,}7 \cdot 10^{24}}{6{,}02 \cdot 10^{23}} \cdot 0{,}235 \approx 1{,}05\ \text{კგ}$
SEN: $E_1 = 200 \times 1.6 \times 10^{-13} = 3.2 \times 10^{-11}\ \text{J}$, $\ \dfrac{N}{t} = \dfrac{10^9}{3.2 \times 10^{-11}} \approx 3.1 \times 10^{19}\ \text{s}^{-1}$
Per day: $N = 3.1 \times 10^{19} \times 86\,400 \approx 2.7 \times 10^{24}$
$m = \dfrac{N}{N_A}M = \dfrac{2.7 \times 10^{24}}{6.02 \times 10^{23}} \times 0.235 \approx 1.05\ \text{kg}$
AKA: $\approx 1\ \text{კგ}$
AEN: $\approx 1\ \text{kg}$

--- hard nucleus
KA: მზის გამოსხივების სიმძლავრეა $3{,}8 \cdot 10^{26}\ \text{ვტ}$. რამდენ მასას კარგავს მზე წამში? რა ნაწილს დაკარგავს $10^{10}$ წელიწადში ($M = 2 \cdot 10^{30}\ \text{კგ}$)?
EN: The Sun radiates $3.8 \times 10^{26}\ \text{W}$. How much mass does it lose per second? What fraction will it lose in $10^{10}$ years ($M = 2 \times 10^{30}\ \text{kg}$)?
HKA: $\dfrac{\Delta m}{\Delta t} = \dfrac{P}{c^2}$.
HEN: $\dfrac{\Delta m}{\Delta t} = \dfrac{P}{c^2}$.
SKA: $\dfrac{\Delta m}{\Delta t} = \dfrac{3{,}8 \cdot 10^{26}}{9 \cdot 10^{16}} \approx 4{,}2 \cdot 10^9\ \text{კგ/წმ}$
$10^{10}$ წელი $\approx 3{,}15 \cdot 10^{17}\ \text{წმ}$: $\ \Delta m \approx 1{,}3 \cdot 10^{27}\ \text{კგ}$
$\dfrac{\Delta m}{M} \approx \dfrac{1{,}3 \cdot 10^{27}}{2 \cdot 10^{30}} \approx 0{,}07\%$
SEN: $\dfrac{\Delta m}{\Delta t} = \dfrac{3.8 \times 10^{26}}{9 \times 10^{16}} \approx 4.2 \times 10^9\ \text{kg/s}$
$10^{10}$ years $\approx 3.15 \times 10^{17}\ \text{s}$: $\ \Delta m \approx 1.3 \times 10^{27}\ \text{kg}$
$\dfrac{\Delta m}{M} \approx \dfrac{1.3 \times 10^{27}}{2 \times 10^{30}} \approx 0.07\%$
AKA: $\approx 4{,}2 \cdot 10^9\ \text{კგ/წმ}$; $\approx 0{,}07\%$
AEN: $\approx 4.2 \times 10^9\ \text{kg/s}$; $\approx 0.07\%$

--- hard radio
KA: ნიმუშში $10^{20}$ რადიოაქტიური ბირთვია, ნახევარდაშლის პერიოდი $1$ დღეა. იპოვეთ აქტივობა $A = \lambda N$, სადაც $\lambda = \dfrac{\ln 2}{T}$.
EN: A sample contains $10^{20}$ radioactive nuclei with a half-life of $1$ day. Find its activity $A = \lambda N$, where $\lambda = \dfrac{\ln 2}{T}$.
HKA: $T = 86\,400\ \text{წმ}$; $1\ \text{ბკ}$ = $1$ დაშლა წამში.
HEN: $T = 86\,400\ \text{s}$; $1\ \text{Bq}$ = $1$ decay per second.
SKA: $\lambda = \dfrac{0{,}693}{86\,400} \approx 8{,}0 \cdot 10^{-6}\ \text{წმ}^{-1}$
$A = \lambda N = 8{,}0 \cdot 10^{-6} \cdot 10^{20} = 8{,}0 \cdot 10^{14}\ \text{ბკ}$
SEN: $\lambda = \dfrac{0.693}{86\,400} \approx 8.0 \times 10^{-6}\ \text{s}^{-1}$
$A = \lambda N = 8.0 \times 10^{-6} \times 10^{20} = 8.0 \times 10^{14}\ \text{Bq}$
AKA: $\approx 8 \cdot 10^{14}\ \text{ბკ}$
AEN: $\approx 8 \times 10^{14}\ \text{Bq}$

--- hard radio
KA: იზოტოპის ნახევარდაშლის პერიოდია $2$ წელი. ბირთვების რა ნაწილი დაიშლება $1$ წელიწადში? რატომ არ არის პასუხი $25\%$?
EN: An isotope has a half-life of $2$ years. What fraction of the nuclei decays in $1$ year? Why isn't the answer $25\%$?
HKA: $\dfrac{N}{N_0} = 2^{-\frac{t}{T}} = 2^{-0{,}5}$.
HEN: $\dfrac{N}{N_0} = 2^{-\frac{t}{T}} = 2^{-0.5}$.
SKA: დარჩება $2^{-0{,}5} = \dfrac{1}{\sqrt{2}} \approx 0{,}707$
დაიშლება $1 - 0{,}707 \approx 29\%$
დაშლა მაჩვენებლიანია და არა წრფივი: პირველ წელს მეტი ბირთვია, ამიტომ მეტიც იშლება.
SEN: Remaining: $2^{-0.5} = \dfrac{1}{\sqrt{2}} \approx 0.707$
Decayed: $1 - 0.707 \approx 29\%$
Decay is exponential, not linear: in the first year there are more nuclei, so more decay.
AKA: $\approx 29\%$
AEN: $\approx 29\%$

--- hard particles
KA: ციკლოტრონის მაგნიტური ინდუქციაა $1\ \text{ტლ}$, დუანტების რადიუსი — $0{,}5\ \text{მ}$. რა მაქსიმალურ სიჩქარესა და ენერგიას (მევ-ში) იძენს პროტონი?
EN: A cyclotron has magnetic field $1\ \text{T}$ and dee radius $0.5\ \text{m}$. What maximum speed and energy (in MeV) does a proton gain?
HKA: $qvB = \dfrac{mv^2}{R} \Rightarrow v = \dfrac{qBR}{m}$.
HEN: $qvB = \dfrac{mv^2}{R} \Rightarrow v = \dfrac{qBR}{m}$.
SKA: $v = \dfrac{qBR}{m} = \dfrac{1{,}6 \cdot 10^{-19} \cdot 1 \cdot 0{,}5}{1{,}67 \cdot 10^{-27}} \approx 4{,}8 \cdot 10^7\ \text{მ/წმ}$
$E = \dfrac{mv^2}{2} = \dfrac{1{,}67 \cdot 10^{-27} \cdot (4{,}8 \cdot 10^7)^2}{2} \approx 1{,}9 \cdot 10^{-12}\ \text{ჯ} \approx 12\ \text{მევ}$
SEN: $v = \dfrac{qBR}{m} = \dfrac{1.6 \times 10^{-19} \times 1 \times 0.5}{1.67 \times 10^{-27}} \approx 4.8 \times 10^7\ \text{m/s}$
$E = \dfrac{mv^2}{2} = \dfrac{1.67 \times 10^{-27} \times (4.8 \times 10^7)^2}{2} \approx 1.9 \times 10^{-12}\ \text{J} \approx 12\ \text{MeV}$
AKA: $\approx 4{,}8 \cdot 10^7\ \text{მ/წმ}$; $\approx 12\ \text{მევ}$
AEN: $\approx 4.8 \times 10^7\ \text{m/s}$; $\approx 12\ \text{MeV}$

--- hard particles
KA: ჩადვიკის ცდაში: $^9_4\text{Be} + {}^4_2\text{He} \to {}^{12}_6\text{C} + X$. რა არის $X$? რატომ იყო ძნელი მისი აღმოჩენა?
EN: In Chadwick's experiment: $^9_4\text{Be} + {}^4_2\text{He} \to {}^{12}_6\text{C} + X$. What is $X$? Why was it hard to detect?
HKA: შეამოწმეთ $A$ და $Z$-ის ბალანსი.
HEN: Check the balance of $A$ and $Z$.
SKA: $A$: $9 + 4 = 12 + 1$; $\ Z$: $4 + 2 = 6 + 0$ $\Rightarrow X = {}^1_0n$ — ნეიტრონი.
მუხტი არ აქვს — არ აიონებს ნივთიერებას და არ გადაიხრება ველებში; მისი აღმოჩენა მხოლოდ მის მიერ ამოგდებული პროტონებით მოხერხდა.
SEN: $A$: $9 + 4 = 12 + 1$; $\ Z$: $4 + 2 = 6 + 0$ $\Rightarrow X = {}^1_0n$ — the neutron.
It has no charge — it does not ionise matter or bend in fields; it was detected only through the protons it knocked out.
AKA: ნეიტრონი
AEN: the neutron

--- hard astro
KA: ვარსკვლავი გალაქტიკის ცენტრიდან $2{,}5 \cdot 10^{20}\ \text{მ}$-ზე $220\ \text{კმ/წმ}$ სიჩქარით ბრუნავს. შეაფასეთ ორბიტის შიგნით მოთავსებული მასა. ხილული მასა ბევრად ნაკლებია — რას ნიშნავს ეს?
EN: A star orbits $2.5 \times 10^{20}\ \text{m}$ from the centre of its galaxy at $220\ \text{km/s}$. Estimate the mass inside its orbit. The visible mass is much smaller — what does this mean?
HKA: $\dfrac{GMm}{r^2} = \dfrac{mv^2}{r} \Rightarrow M = \dfrac{v^2 r}{G}$.
HEN: $\dfrac{GMm}{r^2} = \dfrac{mv^2}{r} \Rightarrow M = \dfrac{v^2 r}{G}$.
SKA: $M = \dfrac{v^2 r}{G} = \dfrac{(2{,}2 \cdot 10^5)^2 \cdot 2{,}5 \cdot 10^{20}}{6{,}67 \cdot 10^{-11}} \approx 1{,}8 \cdot 10^{41}\ \text{კგ}$ ($\approx 9 \cdot 10^{10}$ მზის მასა)
ხილული მატერია ამას ვერ ხსნის $\Rightarrow$ არსებობს უხილავი, გრავიტაციულად მოქმედი ბნელი მატერია.
SEN: $M = \dfrac{v^2 r}{G} = \dfrac{(2.2 \times 10^5)^2 \times 2.5 \times 10^{20}}{6.67 \times 10^{-11}} \approx 1.8 \times 10^{41}\ \text{kg}$ ($\approx 9 \times 10^{10}$ solar masses)
Visible matter cannot account for this $\Rightarrow$ there is invisible, gravitating dark matter.
AKA: $\approx 1{,}8 \cdot 10^{41}\ \text{კგ}$; ბნელი მატერია
AEN: $\approx 1.8 \times 10^{41}\ \text{kg}$; dark matter

--- hard astro
KA: ვინის კანონი: $\lambda_{\max}T = 2{,}9 \cdot 10^{-3}\ \text{მ}\cdot\text{K}$. მზის გამოსხივების მაქსიმუმი $500\ \text{ნმ}$-ზეა, რიგელისა — $290\ \text{ნმ}$-ზე. იპოვეთ მათი ზედაპირის ტემპერატურები. რა ფერისაა რიგელი?
EN: Wien's law: $\lambda_{\max}T = 2.9 \times 10^{-3}\ \text{m}\cdot\text{K}$. The Sun's emission peaks at $500\ \text{nm}$ and Rigel's at $290\ \text{nm}$. Find their surface temperatures. What colour is Rigel?
HKA: $T = \dfrac{b}{\lambda_{\max}}$.
HEN: $T = \dfrac{b}{\lambda_{\max}}$.
SKA: მზე: $T = \dfrac{2{,}9 \cdot 10^{-3}}{5 \cdot 10^{-7}} = 5800\ \text{K}$
რიგელი: $T = \dfrac{2{,}9 \cdot 10^{-3}}{2{,}9 \cdot 10^{-7}} = 10\,000\ \text{K}$ — მოლურჯო-თეთრი (ცხელი).
SEN: Sun: $T = \dfrac{2.9 \times 10^{-3}}{5 \times 10^{-7}} = 5800\ \text{K}$
Rigel: $T = \dfrac{2.9 \times 10^{-3}}{2.9 \times 10^{-7}} = 10\,000\ \text{K}$ — bluish-white (hot).
AKA: $5800\ \text{K}$; $10\,000\ \text{K}$; მოლურჯო
AEN: $5800\ \text{K}$; $10\,000\ \text{K}$; bluish

--- hard mkt olympiad
KA: შეაფასეთ საშუალო მანძილი მოლეკულებს შორის აირში ნორმალურ პირობებში ($n \approx 2{,}7 \cdot 10^{25}\ \text{მ}^{-3}$) და თხევად წყალში. რამდენჯერ განსხვავდება ისინი?
EN: Estimate the average distance between molecules in a gas at standard conditions ($n \approx 2.7 \times 10^{25}\ \text{m}^{-3}$) and in liquid water. By what factor do they differ?
HKA: თითო მოლეკულაზე მოდის მოცულობა $\dfrac{1}{n}$; მანძილი $d \approx \sqrt[3]{\dfrac{1}{n}}$. წყლის მოლეკულის მასა $3 \cdot 10^{-26}\ \text{კგ}$.
HEN: Each molecule has a volume $\dfrac{1}{n}$; the spacing is $d \approx \sqrt[3]{\dfrac{1}{n}}$. A water molecule has mass $3 \times 10^{-26}\ \text{kg}$.
SKA: აირი: $d \approx \sqrt[3]{\dfrac{1}{2{,}7 \cdot 10^{25}}} \approx 3{,}3 \cdot 10^{-9}\ \text{მ}$
წყალი: $V_0 = \dfrac{m_0}{\rho} = \dfrac{3 \cdot 10^{-26}}{1000} = 3 \cdot 10^{-29}\ \text{მ}^3$, $\ d \approx \sqrt[3]{3 \cdot 10^{-29}} \approx 3{,}1 \cdot 10^{-10}\ \text{მ}$
შეფარდება $\approx 10$ — აირში მოლეკულები თავიანთ ზომაზე $\sim 10$-ჯერ უფრო შორს არიან ერთმანეთისგან (ამიტომ იკუმშება აირი ადვილად).
SEN: Gas: $d \approx \sqrt[3]{\dfrac{1}{2.7 \times 10^{25}}} \approx 3.3 \times 10^{-9}\ \text{m}$
Water: $V_0 = \dfrac{m_0}{\rho} = \dfrac{3 \times 10^{-26}}{1000} = 3 \times 10^{-29}\ \text{m}^3$, $\ d \approx \sqrt[3]{3 \times 10^{-29}} \approx 3.1 \times 10^{-10}\ \text{m}$
Ratio $\approx 10$ — in a gas the molecules are $\sim 10$ times their own size apart (which is why gases compress easily).
AKA: $\approx 3 \cdot 10^{-9}$ და $3 \cdot 10^{-10}\ \text{მ}$; $\approx 10$-ჯერ
AEN: $\approx 3 \times 10^{-9}$ and $3 \times 10^{-10}\ \text{m}$; $\approx 10$ times

--- hard gaslaw olympiad
KA: იზოთერმულ ატმოსფეროში ($T = 290\ \text{K}$) ჰაერის წნევა სიმაღლესთან ერთად იცვლება როგორც $p = p_0 e^{-\frac{Mgh}{RT}}$. რა სიმაღლეზე ნახევრდება წნევა? ($M = 0{,}029\ \text{კგ/მოლი}$)
EN: In an isothermal atmosphere ($T = 290\ \text{K}$) the air pressure varies with height as $p = p_0 e^{-\frac{Mgh}{RT}}$. At what height does the pressure halve? ($M = 0.029\ \text{kg/mol}$)
HKA: $e^{-x} = \dfrac{1}{2} \Rightarrow x = \ln 2$.
HEN: $e^{-x} = \dfrac{1}{2} \Rightarrow x = \ln 2$.
SKA: $\dfrac{Mgh}{RT} = \ln 2 \Rightarrow h = \dfrac{RT}{Mg}\ln 2$
$\dfrac{RT}{Mg} = \dfrac{8{,}31 \cdot 290}{0{,}029 \cdot 10} = 8310\ \text{მ}$
$h = 8310 \cdot 0{,}693 \approx 5{,}8\ \text{კმ}$ (რეალურად $\approx 5{,}5\ \text{კმ}$, რადგან ზემოთ ცივა)
SEN: $\dfrac{Mgh}{RT} = \ln 2 \Rightarrow h = \dfrac{RT}{Mg}\ln 2$
$\dfrac{RT}{Mg} = \dfrac{8.31 \times 290}{0.029 \times 10} = 8310\ \text{m}$
$h = 8310 \times 0.693 \approx 5.8\ \text{km}$ (really $\approx 5.5\ \text{km}$, since it is colder higher up)
AKA: $\approx 5{,}8\ \text{კმ}$
AEN: $\approx 5.8\ \text{km}$

--- hard isoproc olympiad
KA: ჰორიზონტალურ თბოგაუმტარ ცილინდრს თავისუფლად მოძრავი დგუში ყოფს ორ ტოლ ნაწილად (თითო $20\ \text{სმ}$), ორივეში აირია $300\ \text{K}$-ზე. ერთ ნაწილს $400\ \text{K}$-მდე ათბობენ, მეორეს $300\ \text{K}$-ზე ინარჩუნებენ. რამდენით გადაადგილდება დგუში?
EN: A horizontal cylinder is divided into two equal parts ($20\ \text{cm}$ each) by a freely moving piston; both parts hold gas at $300\ \text{K}$. One part is heated to $400\ \text{K}$ while the other is kept at $300\ \text{K}$. How far does the piston move?
HKA: წონასწორობაში წნევები ტოლია; მოლების რიცხვები ტოლია $\Rightarrow \dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$.
HEN: At equilibrium the pressures are equal; the mole numbers are equal $\Rightarrow \dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$.
SKA: $\dfrac{x}{400} = \dfrac{40 - x}{300} \Rightarrow 300x = 16\,000 - 400x \Rightarrow x = \dfrac{160}{7} \approx 22{,}86\ \text{სმ}$
გადაადგილება: $22{,}86 - 20 \approx 2{,}9\ \text{სმ}$ (ცივი ნაწილისკენ)
SEN: $\dfrac{x}{400} = \dfrac{40 - x}{300} \Rightarrow 300x = 16\,000 - 400x \Rightarrow x = \dfrac{160}{7} \approx 22.86\ \text{cm}$
Displacement: $22.86 - 20 \approx 2.9\ \text{cm}$ (towards the cold side)
AKA: $\approx 2{,}9\ \text{სმ}$
AEN: $\approx 2.9\ \text{cm}$

--- hard engines olympiad
KA: სითბური ტუმბო ზამთარში სახლს ათბობს: გარეთ $-3\ \text{°C}$-ია, შიგნით — $27\ \text{°C}$. იდეალურ შემთხვევაში რამდენ სითბოს მიაწვდის სახლს $1\ \text{კვტ}$ ელექტრული სიმძლავრით? რატომ არ ეწინააღმდეგება ეს ენერგიის შენახვას?
EN: A heat pump warms a house in winter: $-3\ \text{°C}$ outside, $27\ \text{°C}$ inside. Ideally, how much heating power does it deliver for $1\ \text{kW}$ of electrical power? Why doesn't this violate energy conservation?
HKA: გათბობის კოეფიციენტი: $\dfrac{Q_1}{A} = \dfrac{T_1}{T_1 - T_2}$.
HEN: Heating coefficient: $\dfrac{Q_1}{A} = \dfrac{T_1}{T_1 - T_2}$.
SKA: $\dfrac{Q_1}{A} = \dfrac{300}{300 - 270} = 10$
$P_{\text{სითბო}} = 10 \cdot 1 = 10\ \text{კვტ}$
$Q_1 = A + Q_2$: $1\ \text{კვტ}$ ელექტროენერგიაა, დანარჩენი $9\ \text{კვტ}$ — გარე ცივი ჰაერიდან „ამოტუმბული“ სითბო. ენერგია არ იქმნება, მხოლოდ გადაიტანება.
SEN: $\dfrac{Q_1}{A} = \dfrac{300}{300 - 270} = 10$
$P_{\text{heat}} = 10 \times 1 = 10\ \text{kW}$
$Q_1 = A + Q_2$: $1\ \text{kW}$ is electrical, the other $9\ \text{kW}$ is heat "pumped" from the cold outside air. No energy is created, only moved.
AKA: $10\ \text{კვტ}$-მდე
AEN: up to $10\ \text{kW}$

--- hard gaswork olympiad
KA: ერთატომიანი იდეალური აირი გადის პროცესს, რომელშიც $p = \alpha V$ ($\alpha = \text{const}$). იპოვეთ აირის მოლური სითბოტევადობა ამ პროცესში.
EN: A monatomic ideal gas undergoes a process in which $p = \alpha V$ ($\alpha = \text{const}$). Find the molar heat capacity of the gas in this process.
HKA: $p$–$V$ გრაფიკი სათავეზე გამავალი წრფეა; მუშაობა — სამკუთხედების ფართობების სხვაობა: $A = \dfrac{1}{2}(p_2V_2 - p_1V_1)$.
HEN: The $p$–$V$ graph is a line through the origin; the work is a difference of triangle areas: $A = \dfrac{1}{2}(p_2V_2 - p_1V_1)$.
SKA: $A = \dfrac{1}{2}\Delta(pV) = \dfrac{1}{2}\nu R\Delta T$
$\Delta U = \dfrac{3}{2}\nu R\Delta T$
$Q = \Delta U + A = 2\nu R\Delta T \Rightarrow C = \dfrac{Q}{\nu\Delta T} = 2R \approx 16{,}6\ \text{ჯ/(მოლი}\cdot\text{K)}$
SEN: $A = \dfrac{1}{2}\Delta(pV) = \dfrac{1}{2}\nu R\Delta T$
$\Delta U = \dfrac{3}{2}\nu R\Delta T$
$Q = \Delta U + A = 2\nu R\Delta T \Rightarrow C = \dfrac{Q}{\nu\Delta T} = 2R \approx 16.6\ \text{J/(mol}\cdot\text{K)}$
AKA: $C = 2R$
AEN: $C = 2R$

--- hard liquids olympiad
KA: ორი საპნის ბუშტი, რადიუსებით $1\ \text{სმ}$ და $3\ \text{სმ}$, მილით შეაერთეს. რა მოხდება? ($\sigma = 0{,}04\ \text{ნ/მ}$)
EN: Two soap bubbles, of radii $1\ \text{cm}$ and $3\ \text{cm}$, are connected by a tube. What happens? ($\sigma = 0.04\ \text{N/m}$)
HKA: $\Delta p = \dfrac{4\sigma}{r}$ — რომელ ბუშტშია მეტი წნევა?
HEN: $\Delta p = \dfrac{4\sigma}{r}$ — which bubble has the higher pressure?
SKA: $\Delta p_1 = \dfrac{4 \cdot 0{,}04}{0{,}01} = 16\ \text{პა}$, $\ \Delta p_2 = \dfrac{4 \cdot 0{,}04}{0{,}03} \approx 5{,}3\ \text{პა}$
პატარა ბუშტში წნევა მეტია $\Rightarrow$ ჰაერი დიდში გადადის; პატარა კიდევ უფრო პატარავდება (წნევა კიდევ იზრდება) — პროცესი თავისით ჩქარდება, სანამ პატარა ბუშტი მილის ბოლოზე არ დარჩება ისეთი სიმრუდით, როგორიც დიდისაა.
SEN: $\Delta p_1 = \dfrac{4 \times 0.04}{0.01} = 16\ \text{Pa}$, $\ \Delta p_2 = \dfrac{4 \times 0.04}{0.03} \approx 5.3\ \text{Pa}$
The small bubble has the higher pressure $\Rightarrow$ air flows into the large one; the small one shrinks further (its pressure rises even more) — the process runs away until only a cap with the large bubble's curvature is left on the tube end.
AKA: პატარა ბუშტი იფუშება, დიდი იზრდება
AEN: the small bubble collapses into the large one

--- hard quantum olympiad
KA: მზის იალქნიანი ზონდის იალქნის ფართობია $1000\ \text{მ}^2$, მზის გამოსხივების ინტენსივობა დედამიწის ორბიტაზე — $1360\ \text{ვტ/მ}^2$. იალქანი სრულად ირეკლავს სინათლეს. იპოვეთ ძალა და ზონდის აჩქარება, თუ მისი მასაა $10\ \text{კგ}$.
EN: A solar-sail probe has a sail of area $1000\ \text{m}^2$; sunlight intensity at Earth's orbit is $1360\ \text{W/m}^2$. The sail reflects all the light. Find the force and the probe's acceleration if its mass is $10\ \text{kg}$.
HKA: არეკვლისას $F = \dfrac{2IS}{c}$.
HEN: For reflection $F = \dfrac{2IS}{c}$.
SKA: $F = \dfrac{2IS}{c} = \dfrac{2 \cdot 1360 \cdot 1000}{3 \cdot 10^8} \approx 9{,}1 \cdot 10^{-3}\ \text{ნ}$
$a = \dfrac{F}{m} \approx 9{,}1 \cdot 10^{-4}\ \text{მ/წმ}^2$ — მცირეა, მაგრამ ერთ წელიწადში სიჩქარე $\approx 9{,}1 \cdot 10^{-4} \cdot 3{,}15 \cdot 10^7 \approx 29\ \text{კმ/წმ}$-ით გაიზრდებოდა.
SEN: $F = \dfrac{2IS}{c} = \dfrac{2 \times 1360 \times 1000}{3 \times 10^8} \approx 9.1 \times 10^{-3}\ \text{N}$
$a = \dfrac{F}{m} \approx 9.1 \times 10^{-4}\ \text{m/s}^2$ — small, but over a year the speed would grow by $\approx 9.1 \times 10^{-4} \times 3.15 \times 10^7 \approx 29\ \text{km/s}$.
AKA: $\approx 9 \cdot 10^{-3}\ \text{ნ}$; $\approx 9 \cdot 10^{-4}\ \text{მ/წმ}^2$
AEN: $\approx 9 \times 10^{-3}\ \text{N}$; $\approx 9 \times 10^{-4}\ \text{m/s}^2$

--- hard atom olympiad
KA: უძრავი წყალბადის ატომი $2 \to 1$ გადასვლისას ასხივებს $10{,}2\ \text{ევ}$ ფოტონს. რა სიჩქარეს იძენს ატომი უკუცემით? რა ნაწილია უკუცემის ენერგია ფოტონის ენერგიისა?
EN: A hydrogen atom at rest emits a $10.2\ \text{eV}$ photon in the $2 \to 1$ transition. What recoil speed does the atom gain? What fraction of the photon energy is the recoil energy?
HKA: იმპულსის შენახვა: $m_pv = \dfrac{E}{c}$.
HEN: Momentum conservation: $m_pv = \dfrac{E}{c}$.
SKA: $v = \dfrac{E}{m_pc} = \dfrac{10{,}2 \cdot 1{,}6 \cdot 10^{-19}}{1{,}67 \cdot 10^{-27} \cdot 3 \cdot 10^8} \approx 3{,}3\ \text{მ/წმ}$
$\dfrac{E_{\text{უკ}}}{E} = \dfrac{m_pv^2/2}{E} = \dfrac{E}{2m_pc^2} = \dfrac{10{,}2}{2 \cdot 938 \cdot 10^6} \approx 5 \cdot 10^{-9}$ — უმნიშვნელოა.
SEN: $v = \dfrac{E}{m_pc} = \dfrac{10.2 \times 1.6 \times 10^{-19}}{1.67 \times 10^{-27} \times 3 \times 10^8} \approx 3.3\ \text{m/s}$
$\dfrac{E_{\text{rec}}}{E} = \dfrac{m_pv^2/2}{E} = \dfrac{E}{2m_pc^2} = \dfrac{10.2}{2 \times 938 \times 10^6} \approx 5 \times 10^{-9}$ — negligible.
AKA: $\approx 3{,}3\ \text{მ/წმ}$; $\approx 5 \cdot 10^{-9}$
AEN: $\approx 3.3\ \text{m/s}$; $\approx 5 \times 10^{-9}$

--- hard radio olympiad
KA: დღეს ბუნებრივ ურანში $^{235}\text{U}$-ის წილი $0{,}72\%$-ია ($T_{235} = 0{,}7$ მლრდ წ., $T_{238} = 4{,}5$ მლრდ წ.). რამდენი ხნის წინ იყო ეს წილი $3\%$ — საკმარისი ბუნებრივი ბირთვული რეაქტორისთვის (ოკლო, გაბონი)?
EN: Today $^{235}\text{U}$ makes up $0.72\%$ of natural uranium ($T_{235} = 0.7$ Gyr, $T_{238} = 4.5$ Gyr). How long ago was this share $3\%$ — enough for a natural nuclear reactor (Oklo, Gabon)?
HKA: შეფარდება $r = \dfrac{N_{235}}{N_{238}}$ იცვლება როგორც $r = r_0 \cdot 2^{-t\left(\frac{1}{T_{235}} - \frac{1}{T_{238}}\right)}$.
HEN: The ratio $r = \dfrac{N_{235}}{N_{238}}$ changes as $r = r_0 \times 2^{-t\left(\frac{1}{T_{235}} - \frac{1}{T_{238}}\right)}$.
SKA: $\dfrac{r_0}{r} \approx \dfrac{3}{0{,}72} \approx 4{,}17 = 2^{t\left(\frac{1}{0{,}7} - \frac{1}{4{,}5}\right)}$
$\dfrac{1}{0{,}7} - \dfrac{1}{4{,}5} \approx 1{,}206$ (მლრდ წ.)$^{-1}$; $\ \log_2 4{,}17 \approx 2{,}06$
$t \approx \dfrac{2{,}06}{1{,}206} \approx 1{,}7$ მლრდ წლის წინ (ოკლოს რეაქტორი $\approx 2$ მლრდ წლის წინ მუშაობდა)
SEN: $\dfrac{r_0}{r} \approx \dfrac{3}{0.72} \approx 4.17 = 2^{t\left(\frac{1}{0.7} - \frac{1}{4.5}\right)}$
$\dfrac{1}{0.7} - \dfrac{1}{4.5} \approx 1.206$ Gyr$^{-1}$; $\ \log_2 4.17 \approx 2.06$
$t \approx \dfrac{2.06}{1.206} \approx 1.7$ billion years ago (the Oklo reactor ran $\approx 2$ billion years ago)
AKA: $\approx 1{,}7$ მლრდ წლის წინ
AEN: $\approx 1.7$ billion years ago

--- hard astro olympiad
KA: შავი ხვრელის „საშუალო სიმკვრივე“ $\rho = \dfrac{M}{\frac{4}{3}\pi R^3}$, სადაც $R = \dfrac{2GM}{c^2}$. იპოვეთ ის მზის მასის შავი ხვრელისთვის ($R \approx 3\ \text{კმ}$). დაამტკიცეთ, რომ $\rho \sim \dfrac{1}{M^2}$, და შეაფასეთ რა მასის შავ ხვრელს აქვს წყლის სიმკვრივე.
EN: The "mean density" of a black hole is $\rho = \dfrac{M}{\frac{4}{3}\pi R^3}$, where $R = \dfrac{2GM}{c^2}$. Find it for a solar-mass black hole ($R \approx 3\ \text{km}$). Prove that $\rho \sim \dfrac{1}{M^2}$, and estimate the mass of a black hole with the density of water.
HKA: ჩასვით $R$ სიმკვრივის ფორმულაში.
HEN: Substitute $R$ into the density formula.
SKA: მზე: $\rho = \dfrac{2 \cdot 10^{30}}{4{,}19 \cdot (3 \cdot 10^3)^3} \approx 1{,}8 \cdot 10^{19}\ \text{კგ/მ}^3$
$\rho = \dfrac{3M}{4\pi}\cdot\dfrac{c^6}{8G^3M^3} = \dfrac{3c^6}{32\pi G^3M^2} \sim \dfrac{1}{M^2}$ ∎
$\rho = 1000$: $\ \dfrac{M}{M_\odot} = \sqrt{\dfrac{1{,}8 \cdot 10^{19}}{10^3}} \approx 1{,}3 \cdot 10^8$ — დაახლოებით $10^8$ მზის მასა (ასეთები გალაქტიკების ცენტრებშია!).
SEN: Sun: $\rho = \dfrac{2 \times 10^{30}}{4.19 \times (3 \times 10^3)^3} \approx 1.8 \times 10^{19}\ \text{kg/m}^3$
$\rho = \dfrac{3M}{4\pi}\cdot\dfrac{c^6}{8G^3M^3} = \dfrac{3c^6}{32\pi G^3M^2} \sim \dfrac{1}{M^2}$ ∎
$\rho = 1000$: $\ \dfrac{M}{M_\odot} = \sqrt{\dfrac{1.8 \times 10^{19}}{10^3}} \approx 1.3 \times 10^8$ — about $10^8$ solar masses (such black holes sit at the centres of galaxies!).
AKA: $\approx 1{,}8 \cdot 10^{19}\ \text{კგ/მ}^3$; $\sim 10^8$ მზის მასა
AEN: $\approx 1.8 \times 10^{19}\ \text{kg/m}^3$; $\sim 10^8$ solar masses
