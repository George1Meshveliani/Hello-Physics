AEN: $5\ \text{Hz}$; $0.2\ \text{s}$

--- easy circular
KA: ბავშვი კარუსელზე $3\ \text{მ}$ რადიუსის წრეზე $3\ \text{მ/წმ}$-ით მოძრაობს. იპოვეთ ცენტრისკენული აჩქარება.
EN: A child on a merry-go-round moves on a $3\ \text{m}$ circle at $3\ \text{m/s}$. Find the centripetal acceleration.
HKA: $a = \dfrac{v^2}{R}$.
HEN: $a = \dfrac{v^2}{R}$.
SKA: $a = \dfrac{9}{3} = 3\ \text{მ/წმ}^2$
SEN: $a = \dfrac{9}{3} = 3\ \text{m/s}^2$
AKA: $3\ \text{მ/წმ}^2$
AEN: $3\ \text{m/s}^2$

--- easy circular
KA: საათის წამის ისარი $2\ \text{სმ}$-იანია. იპოვეთ ისრის წვეროს სიჩქარე.
EN: A clock's second hand is $2\ \text{cm}$ long. Find the speed of its tip.
HKA: $v = \dfrac{2\pi R}{T}$, $T = 60\ \text{წმ}$.
HEN: $v = \dfrac{2\pi R}{T}$, $T = 60\ \text{s}$.
SKA: $v = \dfrac{2 \cdot 3{,}14 \cdot 0{,}02}{60} \approx 2{,}1 \times 10^{-3}\ \text{მ/წმ} = 2{,}1\ \text{მმ/წმ}$
SEN: $v = \dfrac{2 \cdot 3.14 \cdot 0.02}{60} \approx 2.1 \times 10^{-3}\ \text{m/s} = 2.1\ \text{mm/s}$
AKA: $\approx 2{,}1\ \text{მმ/წმ}$
AEN: $\approx 2.1\ \text{mm/s}$

--- easy circular
KA: რა ძალა ასრულებს ცენტრისკენული ძალის როლს: ა) მთვარის ბრუნვისას დედამიწის გარშემო; ბ) მანქანის მოხვევისას; გ) ძაფზე დატრიალებული ქვისთვის?
EN: What force provides the centripetal force: a) for the Moon orbiting the Earth; b) for a car turning a corner; c) for a stone whirled on a string?
HKA: ცენტრისკენული ძალა ახალი ძალა არ არის.
HEN: The centripetal force isn't a new kind of force.
SKA: ა) მსოფლიო მიზიდულობის ძალა; ბ) საბურავებსა და გზას შორის უძრაობის ხახუნი; გ) ძაფის დაჭიმულობა.
SEN: a) gravity; b) static friction between tyres and road; c) the string's tension.
AKA: ა) გრავიტაცია; ბ) ხახუნი; გ) დაჭიმულობა
AEN: a) gravity; b) friction; c) tension

--- easy circular
KA: მანქანის ბორბლის რადიუსი $0{,}3\ \text{მ}$-ია, მანქანა $18\ \text{მ/წმ}$-ით მიდის. რამდენ ბრუნს აკეთებს ბორბალი წამში?
EN: A car's wheel has radius $0.3\ \text{m}$ and the car moves at $18\ \text{m/s}$. How many turns per second does the wheel make?
HKA: $\nu = \dfrac{v}{2\pi R}$.
HEN: $f = \dfrac{v}{2\pi R}$.
SKA: $\nu = \dfrac{18}{2 \cdot 3{,}14 \cdot 0{,}3} \approx 9{,}5\ \text{ბრ/წმ}$
SEN: $f = \dfrac{18}{2 \cdot 3.14 \cdot 0.3} \approx 9.5\ \text{rev/s}$
AKA: $\approx 9{,}5$
AEN: $\approx 9.5$

--- easy circular
KA: საით არის მიმართული თანაბრად წრეზე მოძრავი სხეულის სიჩქარე და აჩქარება?
EN: In uniform circular motion, which way do the velocity and the acceleration point?
HKA: სიჩქარე — მხების გასწვრივ.
HEN: The velocity is along the tangent.
SKA: სიჩქარე ტრაექტორიის მხების გასწვრივაა, აჩქარება — წრის ცენტრისკენ, სიჩქარის პერპენდიკულარულად.
SEN: The velocity is along the tangent; the acceleration points towards the centre, perpendicular to the velocity.
AKA: სიჩქარე — მხებით, აჩქარება — ცენტრისკენ
AEN: velocity — along the tangent; acceleration — towards the centre

--- easy circular
KA: $1\ \text{კგ}$ ქვა $0{,}5\ \text{მ}$ ძაფზე ჰორიზონტალურ წრეზე $2\ \text{მ/წმ}$-ით ტრიალებს (უწონადობაში). იპოვეთ ძაფის დაჭიმულობა.
EN: A $1\ \text{kg}$ stone whirls on a $0.5\ \text{m}$ string in a circle at $2\ \text{m/s}$ (ignore gravity). Find the tension.
HKA: $T = \dfrac{m v^2}{R}$.
HEN: $T = \dfrac{m v^2}{R}$.
SKA: $T = \dfrac{1 \cdot 4}{0{,}5} = 8\ \text{ნ}$
SEN: $T = \dfrac{1 \cdot 4}{0.5} = 8\ \text{N}$
AKA: $8\ \text{ნ}$
AEN: $8\ \text{N}$

--- easy circular
KA: დედამიწა მზის გარშემო $1$ წელიწადში ($3{,}15 \times 10^7\ \text{წმ}$) $1{,}5 \times 10^{11}\ \text{მ}$ რადიუსის წრეს შემოწერს. იპოვეთ ორბიტალური სიჩქარე.
EN: The Earth orbits the Sun in $1$ year ($3.15 \times 10^7\ \text{s}$) on a circle of radius $1.5 \times 10^{11}\ \text{m}$. Find its orbital speed.
HKA: $v = \dfrac{2\pi R}{T}$.
HEN: $v = \dfrac{2\pi R}{T}$.
SKA: $v = \dfrac{2 \cdot 3{,}14 \cdot 1{,}5 \times 10^{11}}{3{,}15 \times 10^7} \approx 3 \times 10^4\ \text{მ/წმ} = 30\ \text{კმ/წმ}$
SEN: $v = \dfrac{2 \cdot 3.14 \cdot 1.5 \times 10^{11}}{3.15 \times 10^7} \approx 3 \times 10^4\ \text{m/s} = 30\ \text{km/s}$
AKA: $\approx 30\ \text{კმ/წმ}$
AEN: $\approx 30\ \text{km/s}$

--- medium circular
KA: მანქანა ($1\ \text{ტ}$) $50\ \text{მ}$ რადიუსის ჰორიზონტალურ მოსახვევში $15\ \text{მ/წმ}$-ით მოძრაობს. რა ხახუნის ძალა სჭირდება? რა მინიმალური $\mu$?
EN: A $1\ \text{t}$ car takes a horizontal bend of radius $50\ \text{m}$ at $15\ \text{m/s}$. What friction force is needed? What minimum $\mu$?
HKA: $F = \dfrac{m v^2}{R} \le \mu m g$.
HEN: $F = \dfrac{m v^2}{R} \le \mu m g$.
SKA: $F = \dfrac{1000 \cdot 225}{50} = 4500\ \text{ნ}$
$\mu = \dfrac{v^2}{gR} = \dfrac{225}{500} = 0{,}45$
SEN: $F = \dfrac{1000 \cdot 225}{50} = 4500\ \text{N}$
$\mu = \dfrac{v^2}{gR} = \dfrac{225}{500} = 0.45$
AKA: $4{,}5\ \text{კნ}$; $0{,}45$
AEN: $4.5\ \text{kN}$; $0.45$

--- medium circular
KA: მანქანა ($800\ \text{კგ}$) ამოზნექილ ხიდზე ($R = 50\ \text{მ}$) $36\ \text{კმ/სთ}$-ით მოძრაობს. რა ძალით აწვება ხიდის უმაღლეს წერტილს?
EN: An $800\ \text{kg}$ car crosses a convex bridge ($R = 50\ \text{m}$) at $36\ \text{km/h}$. With what force does it press on the top?
HKA: $N = m\left(g - \dfrac{v^2}{R}\right)$.
HEN: $N = m\left(g - \dfrac{v^2}{R}\right)$.
SKA: $\dfrac{v^2}{R} = \dfrac{100}{50} = 2\ \text{მ/წმ}^2$
$N = 800 \cdot 8 = 6400\ \text{ნ}$
SEN: $\dfrac{v^2}{R} = \dfrac{100}{50} = 2\ \text{m/s}^2$
$N = 800 \cdot 8 = 6400\ \text{N}$
AKA: $6{,}4\ \text{კნ}$
AEN: $6.4\ \text{kN}$

--- medium circular
KA: ქვა ($0{,}5\ \text{კგ}$) $1\ \text{მ}$ ძაფზე ვერტიკალურ წრეზე ტრიალებს. ქვედა წერტილში მისი სიჩქარე $6\ \text{მ/წმ}$-ია. იპოვეთ დაჭიმულობა ამ წერტილში.
EN: A $0.5\ \text{kg}$ stone whirls in a vertical circle on a $1\ \text{m}$ string. At the bottom its speed is $6\ \text{m/s}$. Find the tension there.
HKA: $T - mg = \dfrac{m v^2}{R}$.
HEN: $T - mg = \dfrac{m v^2}{R}$.
SKA: $T = 0{,}5 \cdot 10 + \dfrac{0{,}5 \cdot 36}{1} = 5 + 18 = 23\ \text{ნ}$
SEN: $T = 0.5 \cdot 10 + \dfrac{0.5 \cdot 36}{1} = 5 + 18 = 23\ \text{N}$
AKA: $23\ \text{ნ}$
AEN: $23\ \text{N}$

--- medium circular
KA: რა სიჩქარით მოძრაობს თანამგზავრი დედამიწიდან $3R$ მანძილზე (ცენტრიდან)? $v_1 = 8\ \text{კმ/წმ}$.
EN: How fast does a satellite move at a distance $3R$ from the Earth's centre? $v_1 = 8\ \text{km/s}$.
HKA: $v \sim \dfrac{1}{\sqrt r}$.

SKA: $v = \dfrac{v_1}{\sqrt 3} = \dfrac{8}{1{,}73} \approx 4{,}6\ \text{კმ/წმ}$
SEN: $v = \dfrac{v_1}{\sqrt 3} = \dfrac{8}{1.73} \approx 4.6\ \text{km/s}$
AKA: $\approx 4{,}6\ \text{კმ/წმ}$
AEN: $\approx 4.6\ \text{km/s}$

--- medium circular
KA: ვინჩესტერის დისკი წუთში $7200$ ბრუნს აკეთებს, მისი რადიუსია $4\ \text{სმ}$. იპოვეთ კიდის წერტილის სიჩქარე და ცენტრისკენული აჩქარება.
EN: A hard disk spins at $7200$ rpm and has radius $4\ \text{cm}$. Find the speed and centripetal acceleration of a point on its edge.
HKA: $\nu = 120\ \text{ჰც}$.
HEN: $f = 120\ \text{Hz}$.
SKA: $v = 2\pi \cdot 0{,}04 \cdot 120 \approx 30\ \text{მ/წმ}$
$a = \dfrac{v^2}{R} = \dfrac{900}{0{,}04} \approx 2{,}3 \times 10^4\ \text{მ/წმ}^2$
SEN: $v = 2\pi \cdot 0.04 \cdot 120 \approx 30\ \text{m/s}$
$a = \dfrac{v^2}{R} = \dfrac{900}{0.04} \approx 2.3 \times 10^4\ \text{m/s}^2$
AKA: $\approx 30\ \text{მ/წმ}$; $\approx 2{,}3 \times 10^4\ \text{მ/წმ}^2$
AEN: $\approx 30\ \text{m/s}$; $\approx 2.3 \times 10^4\ \text{m/s}^2$

--- medium circular
KA: ველოსიპედისტი $20\ \text{მ}$ რადიუსის მოსახვევში $10\ \text{მ/წმ}$-ით მიდის. რა კუთხით უნდა დაიხაროს ვერტიკალიდან?
EN: A cyclist takes a $20\ \text{m}$ bend at $10\ \text{m/s}$. At what angle to the vertical must they lean?
HKA: $\tan\alpha = \dfrac{v^2}{gR}$.
HEN: $\tan\alpha = \dfrac{v^2}{gR}$.
SKA: $\tan\alpha = \dfrac{100}{200} = 0{,}5 \Rightarrow \alpha \approx 27°$
SEN: $\tan\alpha = \dfrac{100}{200} = 0.5 \Rightarrow \alpha \approx 27°$
AKA: $\approx 27°$
AEN: $\approx 27°$

--- medium circular
KA: რამდენჯერ ნაკლებია დედამიწის მიზიდულობის აჩქარება მთვარის ორბიტაზე ($r = 60R$), ვიდრე ზედაპირთან? იპოვეთ ის.
EN: How many times smaller is the Earth's gravitational acceleration at the Moon's orbit ($r = 60R$) than at the surface? Find it.
HKA: $g \sim \dfrac{1}{r^2}$.
HEN: $g \sim \dfrac{1}{r^2}$.
SKA: $3600$-ჯერ: $g' = \dfrac{10}{3600} \approx 2{,}8 \times 10^{-3}\ \text{მ/წმ}^2$
SEN: $3600$ times: $g' = \dfrac{10}{3600} \approx 2.8 \times 10^{-3}\ \text{m/s}^2$
AKA: $3600$-ჯერ; $\approx 2{,}8 \times 10^{-3}\ \text{მ/წმ}^2$
AEN: $3600$ times; $\approx 2.8 \times 10^{-3}\ \text{m/s}^2$

--- medium circular
KA: ორი სხეულის ($m_1 = m_2 = 1000\ \text{კგ}$) შორის მანძილი $1\ \text{მ}$-ია. იპოვეთ მიზიდულობის ძალა. ($G = 6{,}67 \times 10^{-11}\ \text{ნ·მ}^2/\text{კგ}^2$)
EN: Two $1000\ \text{kg}$ bodies are $1\ \text{m}$ apart. Find the gravitational force between them. ($G = 6.67 \times 10^{-11}\ \text{N·m}^2/\text{kg}^2$)
HKA: $F = G \dfrac{m_1 m_2}{r^2}$.
HEN: $F = G \dfrac{m_1 m_2}{r^2}$.
SKA: $F = 6{,}67 \times 10^{-11} \cdot 10^6 = 6{,}67 \times 10^{-5}\ \text{ნ}$ — ძალიან სუსტია.
SEN: $F = 6.67 \times 10^{-11} \cdot 10^6 = 6.67 \times 10^{-5}\ \text{N}$ — very weak.
AKA: $\approx 6{,}7 \times 10^{-5}\ \text{ნ}$
AEN: $\approx 6.7 \times 10^{-5}\ \text{N}$

--- medium circular
KA: სხეული $0{,}2\ \text{მ}$ რადიუსის წრეზე მოძრაობს, ცენტრისკენული აჩქარება $5\ \text{მ/წმ}^2$-ია. იპოვეთ სიჩქარე და პერიოდი.
EN: A body moves on a $0.2\ \text{m}$ circle with centripetal acceleration $5\ \text{m/s}^2$. Find the speed and the period.
HKA: $v = \sqrt{a R}$, $T = \dfrac{2\pi R}{v}$.
HEN: $v = \sqrt{a R}$, $T = \dfrac{2\pi R}{v}$.
SKA: $v = \sqrt{1} = 1\ \text{მ/წმ}$, $\ T = 2\pi \cdot 0{,}2 \approx 1{,}26\ \text{წმ}$
SEN: $v = \sqrt{1} = 1\ \text{m/s}$, $\ T = 2\pi \cdot 0.2 \approx 1.26\ \text{s}$
AKA: $1\ \text{მ/წმ}$; $\approx 1{,}26\ \text{წმ}$
AEN: $1\ \text{m/s}$; $\approx 1.26\ \text{s}$

--- medium circular
KA: ჰორიზონტალურად მბრუნავ დისკზე ცენტრიდან $10\ \text{სმ}$-ზე მონეტა დევს, $\mu = 0{,}4$. რა მაქსიმალური ბრუნვის სიხშირისას არ ჩამოვარდება?
EN: A coin lies $10\ \text{cm}$ from the centre of a horizontal turntable; $\mu = 0.4$. What is the maximum rotation frequency before it slides off?
HKA: $4\pi^2 \nu^2 R \le \mu g$.
HEN: $4\pi^2 f^2 R \le \mu g$.
SKA: $\nu = \dfrac{1}{2\pi}\sqrt{\dfrac{\mu g}{R}} = \dfrac{1}{6{,}28}\sqrt{40} \approx 1\ \text{ჰც}$
SEN: $f = \dfrac{1}{2\pi}\sqrt{\dfrac{\mu g}{R}} = \dfrac{1}{6.28}\sqrt{40} \approx 1\ \text{Hz}$
AKA: $\approx 1\ \text{ბრ/წმ}$
AEN: $\approx 1\ \text{rev/s}$

--- medium circular
KA: ორი თანამგზავრი წრიულ ორბიტებზე მოძრაობს, მეორის ორბიტის რადიუსი $4$-ჯერ მეტია. როგორ შეეფარდება მათი სიჩქარეები და პერიოდები?
EN: Two satellites are in circular orbits; the second's radius is $4$ times larger. How do their speeds and periods compare?
HKA: $v \sim r^{-1/2}$, $T \sim r^{3/2}$.
HEN: $v \sim r^{-1/2}$, $T \sim r^{3/2}$.
SKA: $\dfrac{v_1}{v_2} = \sqrt 4 = 2$, $\ \dfrac{T_2}{T_1} = 4^{3/2} = 8$
SEN: $\dfrac{v_1}{v_2} = \sqrt 4 = 2$, $\ \dfrac{T_2}{T_1} = 4^{3/2} = 8$
AKA: პირველი $2$-ჯერ სწრაფია; მეორის პერიოდი $8$-ჯერ მეტია
AEN: the first is $2$ times faster; the second's period is $8$ times longer

--- medium circular
KA: ცენტრიფუგა ($R = 10\ \text{სმ}$) წუთში $3000$ ბრუნს აკეთებს. რამდენჯერ მეტია ცენტრისკენული აჩქარება $g$-ზე?
EN: A centrifuge ($R = 10\ \text{cm}$) spins at $3000$ rpm. How many times $g$ is the centripetal acceleration?
HKA: $a = 4\pi^2 \nu^2 R$.
HEN: $a = 4\pi^2 f^2 R$.
SKA: $\nu = 50\ \text{ჰც}$, $\ a = 4 \cdot 9{,}87 \cdot 2500 \cdot 0{,}1 \approx 9870\ \text{მ/წმ}^2$
$\dfrac{a}{g} \approx 990$
SEN: $f = 50\ \text{Hz}$, $\ a = 4 \cdot 9.87 \cdot 2500 \cdot 0.1 \approx 9870\ \text{m/s}^2$
$\dfrac{a}{g} \approx 990$
AKA: $\approx 1000$-ჯერ
AEN: $\approx 1000$ times

--- hard circular
KA: მთვარის მასა დედამიწისაზე $81$-ჯერ ნაკლებია, რადიუსი — $3{,}7$-ჯერ. იპოვეთ $g$ მთვარის ზედაპირზე და პირველი კოსმოსური სიჩქარე მთვარისთვის ($R_{\text{მ}} = 1700\ \text{კმ}$).
EN: The Moon's mass is $81$ times smaller than the Earth's and its radius $3.7$ times smaller. Find $g$ on the Moon and the Moon's first cosmic velocity ($R_{\text{M}} = 1700\ \text{km}$).
HKA: $g \sim \dfrac{M}{R^2}$; $v_1 = \sqrt{g R}$.
HEN: $g \sim \dfrac{M}{R^2}$; $v_1 = \sqrt{g R}$.
SKA: $g_{\text{მ}} = 10 \cdot \dfrac{3{,}7^2}{81} = 10 \cdot \dfrac{13{,}7}{81} \approx 1{,}7\ \text{მ/წმ}^2$
$v_1 = \sqrt{1{,}7 \cdot 1{,}7 \times 10^6} = 1{,}7 \times 10^3\ \text{მ/წმ} = 1{,}7\ \text{კმ/წმ}$
SEN: $g_{\text{M}} = 10 \cdot \dfrac{3.7^2}{81} = 10 \cdot \dfrac{13.7}{81} \approx 1.7\ \text{m/s}^2$
$v_1 = \sqrt{1.7 \cdot 1.7 \times 10^6} = 1.7 \times 10^3\ \text{m/s} = 1.7\ \text{km/s}$
AKA: $\approx 1{,}7\ \text{მ/წმ}^2$; $\approx 1{,}7\ \text{კმ/წმ}$
AEN: $\approx 1.7\ \text{m/s}^2$; $\approx 1.7\ \text{km/s}$

--- hard circular
KA: ბურთულა $l = 0{,}5\ \text{მ}$ ძაფზე ჰორიზონტალურ წრეს შემოწერს (კონუსური ქანქარა), ძაფი ვერტიკალთან $60°$-ს ქმნის. იპოვეთ სიჩქარე და პერიოდი.
EN: A ball on a $0.5\ \text{m}$ string moves in a horizontal circle (conical pendulum), the string at $60°$ to the vertical. Find the speed and the period.
HKA: $\tan\alpha = \dfrac{v^2}{g r}$, $r = l\sin\alpha$.
HEN: $\tan\alpha = \dfrac{v^2}{g r}$, $r = l\sin\alpha$.
SKA: $r = 0{,}5 \cdot 0{,}866 \approx 0{,}433\ \text{მ}$
$v^2 = g r \tan 60° = 10 \cdot 0{,}433 \cdot 1{,}732 = 7{,}5 \Rightarrow v \approx 2{,}74\ \text{მ/წმ}$
$T = \dfrac{2\pi r}{v} \approx 0{,}99\ \text{წმ}$
SEN: $r = 0.5 \cdot 0.866 \approx 0.433\ \text{m}$
$v^2 = g r \tan 60° = 10 \cdot 0.433 \cdot 1.732 = 7.5 \Rightarrow v \approx 2.74\ \text{m/s}$
$T = \dfrac{2\pi r}{v} \approx 0.99\ \text{s}$
AKA: $\approx 2{,}7\ \text{მ/წმ}$; $\approx 1\ \text{წმ}$
AEN: $\approx 2.7\ \text{m/s}$; $\approx 1\ \text{s}$

--- hard circular
KA: მარყუჟის ზედა წერტილში მფრინავი ($80\ \text{კგ}$) სავარძელს $400\ \text{ნ}$-ით აწვება. მარყუჟის რადიუსია $250\ \text{მ}$. იპოვეთ თვითმფრინავის სიჩქარე.
EN: At the top of a loop a pilot ($80\ \text{kg}$) presses on the seat with $400\ \text{N}$. The loop's radius is $250\ \text{m}$. Find the plane's speed.
HKA: ზედა წერტილში $N + mg = \dfrac{m v^2}{R}$.
HEN: At the top $N + mg = \dfrac{m v^2}{R}$.
SKA: $400 + 800 = \dfrac{80 v^2}{250} \Rightarrow v^2 = 3750$
$v \approx 61\ \text{მ/წმ}$
SEN: $400 + 800 = \dfrac{80 v^2}{250} \Rightarrow v^2 = 3750$
$v \approx 61\ \text{m/s}$
AKA: $\approx 61\ \text{მ/წმ}$
AEN: $\approx 61\ \text{m/s}$

--- hard circular
KA: იპოვეთ დედამიწის მასა, თუ მთვარე $27{,}3$ დღეში ($2{,}36 \times 10^6\ \text{წმ}$) შემოუვლის მას $3{,}84 \times 10^8\ \text{მ}$ რადიუსის ორბიტაზე.
EN: Find the Earth's mass if the Moon orbits it in $27.3$ days ($2.36 \times 10^6\ \text{s}$) on an orbit of radius $3.84 \times 10^8\ \text{m}$.
HKA: $G \dfrac{M}{r^2} = \dfrac{4\pi^2 r}{T^2}$.
HEN: $G \dfrac{M}{r^2} = \dfrac{4\pi^2 r}{T^2}$.
SKA: $M = \dfrac{4\pi^2 r^3}{G T^2} = \dfrac{39{,}5 \cdot 5{,}66 \times 10^{25}}{6{,}67 \times 10^{-11} \cdot 5{,}57 \times 10^{12}} \approx 6 \times 10^{24}\ \text{კგ}$
SEN: $M = \dfrac{4\pi^2 r^3}{G T^2} = \dfrac{39.5 \cdot 5.66 \times 10^{25}}{6.67 \times 10^{-11} \cdot 5.57 \times 10^{12}} \approx 6 \times 10^{24}\ \text{kg}$
AKA: $\approx 6 \times 10^{24}\ \text{კგ}$
AEN: $\approx 6 \times 10^{24}\ \text{kg}$

--- hard circular
KA: მოტოციკლისტი „სიკვდილის კედელზე“ — ვერტიკალურ ცილინდრზე ($R = 5\ \text{მ}$) — ჰორიზონტალურ წრეზე მოძრაობს, $\mu = 0{,}5$. რა მინიმალური სიჩქარე სჭირდება, რომ არ ჩამოსრიალდეს?
EN: A motorcyclist rides round the "wall of death" — a vertical cylinder of radius $5\ \text{m}$ — in a horizontal circle; $\mu = 0.5$. What minimum speed keeps them from sliding down?
HKA: კედლის რეაქცია ცენტრისკენული ძალაა: $N = \dfrac{m v^2}{R}$; ხახუნი $\mu N \ge mg$.
HEN: The wall's push is the centripetal force: $N = \dfrac{m v^2}{R}$; friction $\mu N \ge mg$.
SKA: $\mu \dfrac{v^2}{R} \ge g \Rightarrow v \ge \sqrt{\dfrac{g R}{\mu}} = \sqrt{100} = 10\ \text{მ/წმ}$
SEN: $\mu \dfrac{v^2}{R} \ge g \Rightarrow v \ge \sqrt{\dfrac{g R}{\mu}} = \sqrt{100} = 10\ \text{m/s}$
AKA: $10\ \text{მ/წმ}$
AEN: $10\ \text{m/s}$

--- hard circular
KA: ბურთულა ($0{,}1\ \text{კგ}$) $0{,}4\ \text{მ}$ ძაფზე ვერტიკალურ წრეზე ტრიალებს. ძაფი $11\ \text{ნ}$-ს უძლებს. რა მაქსიმალური სიჩქარე შეიძლება ჰქონდეს ქვედა წერტილში?
EN: A $0.1\ \text{kg}$ ball whirls in a vertical circle on a $0.4\ \text{m}$ string that can take $11\ \text{N}$. What is the maximum speed at the bottom?
HKA: ქვედა წერტილში დაჭიმულობა უდიდესია.
HEN: The tension is greatest at the bottom.
SKA: $11 = 1 + \dfrac{0{,}1 v^2}{0{,}4} \Rightarrow v^2 = 40$
$v \approx 6{,}3\ \text{მ/წმ}$
SEN: $11 = 1 + \dfrac{0.1 v^2}{0.4} \Rightarrow v^2 = 40$
$v \approx 6.3\ \text{m/s}$
AKA: $\approx 6{,}3\ \text{მ/წმ}$
AEN: $\approx 6.3\ \text{m/s}$

--- hard circular
KA: მოსახვევის ($R = 200\ \text{მ}$) გზა $10°$-ით არის დახრილი. რა სიჩქარისას არ სჭირდება მანქანას ხახუნი მოსახვევის გასავლელად?
EN: A bend of radius $200\ \text{m}$ is banked at $10°$. At what speed can a car take it with no friction needed?
HKA: $\tan\alpha = \dfrac{v^2}{gR}$.
HEN: $\tan\alpha = \dfrac{v^2}{gR}$.
SKA: $v = \sqrt{g R \tan 10°} = \sqrt{2000 \cdot 0{,}176} \approx 18{,}8\ \text{მ/წმ} \approx 68\ \text{კმ/სთ}$
SEN: $v = \sqrt{g R \tan 10°} = \sqrt{2000 \cdot 0.176} \approx 18.8\ \text{m/s} \approx 68\ \text{km/h}$
AKA: $\approx 68\ \text{კმ/სთ}$
AEN: $\approx 68\ \text{km/h}$

--- hard circular
KA: თანამგზავრი დედამიწის ზედაპირიდან $h = 600\ \text{კმ}$ სიმაღლეზე მოძრაობს. იპოვეთ სიჩქარე და პერიოდი. ($g R^2 = 4 \times 10^{14}\ \text{მ}^3/\text{წმ}^2$)
EN: A satellite orbits $600\ \text{km}$ above the surface. Find its speed and period. ($g R^2 = 4 \times 10^{14}\ \text{m}^3/\text{s}^2$)
HKA: $v = \sqrt{\dfrac{g R^2}{R + h}}$.
HEN: $v = \sqrt{\dfrac{g R^2}{R + h}}$.
SKA: $r = 7 \times 10^6\ \text{მ}$, $\ v = \sqrt{\dfrac{4 \times 10^{14}}{7 \times 10^6}} \approx 7{,}56\ \text{კმ/წმ}$
$T = \dfrac{2\pi r}{v} \approx \dfrac{4{,}4 \times 10^7}{7560} \approx 5820\ \text{წმ} \approx 97\ \text{წთ}$
SEN: $r = 7 \times 10^6\ \text{m}$, $\ v = \sqrt{\dfrac{4 \times 10^{14}}{7 \times 10^6}} \approx 7.56\ \text{km/s}$
$T = \dfrac{2\pi r}{v} \approx \dfrac{4.4 \times 10^7}{7560} \approx 5820\ \text{s} \approx 97\ \text{min}$
AKA: $\approx 7{,}6\ \text{კმ/წმ}$; $\approx 97\ \text{წთ}$
AEN: $\approx 7.6\ \text{km/s}$; $\approx 97\ \text{min}$

--- hard circular
KA: რა სიმაღლეზე მცირდება სიმძიმის აჩქარება $4$-ჯერ ზედაპირთან შედარებით?
EN: At what height is the gravitational acceleration $4$ times smaller than at the surface?
HKA: $g \sim \dfrac{1}{r^2}$.
HEN: $g \sim \dfrac{1}{r^2}$.
SKA: $\dfrac{(R + h)^2}{R^2} = 4 \Rightarrow R + h = 2R \Rightarrow h = R = 6400\ \text{კმ}$
SEN: $\dfrac{(R + h)^2}{R^2} = 4 \Rightarrow R + h = 2R \Rightarrow h = R = 6400\ \text{km}$
AKA: $6400\ \text{კმ}$
AEN: $6400\ \text{km}$

--- hard circular olympiad
KA: ორმაგი ვარსკვლავი: ორი ერთნაირი ვარსკვლავი ($M$) ერთმანეთისგან $d$ მანძილზე საერთო ცენტრის გარშემო ბრუნავს. იპოვეთ ბრუნვის პერიოდი $M$, $d$, $G$-ს საშუალებით.
EN: A binary star: two identical stars of mass $M$, a distance $d$ apart, orbit their common centre. Find the period in terms of $M$, $d$ and $G$.
HKA: თითოეული ბრუნავს $\dfrac{d}{2}$ რადიუსის წრეზე; მიზიდულობა $G\dfrac{M^2}{d^2}$.
HEN: Each moves on a circle of radius $\dfrac{d}{2}$; the attraction is $G\dfrac{M^2}{d^2}$.
SKA: $G\dfrac{M^2}{d^2} = M \dfrac{4\pi^2}{T^2} \cdot \dfrac{d}{2}$
$T = 2\pi \sqrt{\dfrac{d^3}{2 G M}}$
SEN: $G\dfrac{M^2}{d^2} = M \dfrac{4\pi^2}{T^2} \cdot \dfrac{d}{2}$
$T = 2\pi \sqrt{\dfrac{d^3}{2 G M}}$
AKA: $T = 2\pi\sqrt{\dfrac{d^3}{2GM}}$
AEN: $T = 2\pi\sqrt{\dfrac{d^3}{2GM}}$

--- hard circular olympiad
KA: ბურთულა გლუვი ნახევარსფეროს ($R$) წვეროდან ძალიან მცირე სიჩქარით იწყებს სრიალს. რა სიმაღლეზე (ფუძიდან) მოწყდება ის ზედაპირს?
EN: A small ball starts sliding from rest at the top of a smooth hemisphere of radius $R$. At what height above the base does it leave the surface?
HKA: მოწყვეტისას $N = 0$: $mg\cos\theta = \dfrac{m v^2}{R}$; ენერგია: $v^2 = 2gR(1 - \cos\theta)$.
HEN: At lift-off $N = 0$: $mg\cos\theta = \dfrac{m v^2}{R}$; energy: $v^2 = 2gR(1 - \cos\theta)$.
SKA: $g R\cos\theta = 2 g R (1 - \cos\theta) \Rightarrow \cos\theta = \dfrac{2}{3}$
$h = R\cos\theta = \dfrac{2}{3} R$
SEN: $g R\cos\theta = 2 g R (1 - \cos\theta) \Rightarrow \cos\theta = \dfrac{2}{3}$
$h = R\cos\theta = \dfrac{2}{3} R$
AKA: $\dfrac{2}{3} R$
AEN: $\dfrac{2}{3} R$

--- hard circular olympiad
KA: დედამიწის რომელ განედზე ჩამოკიდებული ძაფი (ტვირთით) ზუსტად დედამიწის ცენტრისკენ არ არის მიმართული? რომელ განედზეა ეს გადახრა უდიდესი? (თვისობრივად)
EN: At which latitudes does a plumb line not point exactly towards the Earth's centre? Where is the deviation largest? (Qualitatively.)
HKA: დედამიწის ბრუნვის გამო ტვირთზე ცენტრისკენული აჩქარება ბრუნვის ღერძისკენაა მიმართული.
HEN: Because the Earth spins, the load needs a centripetal acceleration towards the spin axis, not the centre.
SKA: ბრუნვის ღერძისკენ საჭირო ცენტრისკენული აჩქარება ($\omega^2 R\cos\varphi$) გრავიტაციის ნაწილს „იყენებს“. ძაფი მიმართულია „ეფექტური“ $\vec g$-ის გასწვრივ.
პოლუსებზე და ეკვატორზე გადახრა ნულია (იქ ცენტრისკენული აჩქარება ან ნულია, ან ცენტრისკენ მიმართული). უდიდესია $45°$ განედზე (დაახლ. $0{,}1°$).
SEN: The centripetal acceleration needed towards the spin axis ($\omega^2 R\cos\varphi$) takes part of gravity. The plumb line points along the "effective" $\vec g$.
At the poles and the equator the deviation is zero (the centripetal acceleration is zero or points to the centre). It is largest at $45°$ latitude (about $0.1°$).
AKA: ყველგან, პოლუსებისა და ეკვატორის გარდა; უდიდესი $45°$-ზე
AEN: everywhere except the poles and equator; largest at $45°$

--- hard circular olympiad
KA: წყლიანი ვედრო $1\ \text{მ}$ თოკზე ვერტიკალურ წრეზე ტრიალებს. რა მინიმალური სიჩქარე სჭირდება ქვედა წერტილში, რომ ზედა წერტილში წყალი არ გადმოიღვაროს?
EN: A bucket of water is swung in a vertical circle on a $1\ \text{m}$ rope. What minimum speed at the bottom keeps the water in at the top?
HKA: ზედა წერტილში $v_{\text{ზ}}^2 \ge g R$; ენერგია: $v_{\text{ქ}}^2 = v_{\text{ზ}}^2 + 4 g R$.
HEN: At the top $v_{\text{top}}^2 \ge g R$; energy: $v_{\text{bot}}^2 = v_{\text{top}}^2 + 4 g R$.
SKA: $v_{\text{ქ}}^2 \ge 5 g R = 50 \Rightarrow v \ge 7{,}1\ \text{მ/წმ}$
SEN: $v_{\text{bot}}^2 \ge 5 g R = 50 \Rightarrow v \ge 7.1\ \text{m/s}$
AKA: $\approx 7{,}1\ \text{მ/წმ}$
AEN: $\approx 7.1\ \text{m/s}$

--- easy momentum
KA: $60\ \text{კგ}$ მორბენალი $8\ \text{მ/წმ}$-ით დარბის. იპოვეთ მისი იმპულსი.
EN: A $60\ \text{kg}$ runner runs at $8\ \text{m/s}$. Find their momentum.
HKA: $p = m v$.
HEN: $p = m v$.
SKA: $p = 60 \cdot 8 = 480\ \text{კგ·მ/წმ}$
SEN: $p = 60 \cdot 8 = 480\ \text{kg·m/s}$
AKA: $480\ \text{კგ·მ/წმ}$
AEN: $480\ \text{kg·m/s}$

--- easy momentum
KA: $5\ \text{ნ}$ ძალა $4\ \text{წმ}$-ის განმავლობაში მოქმედებდა. რამდენით შეიცვალა სხეულის იმპულსი?
EN: A $5\ \text{N}$ force acts for $4\ \text{s}$. By how much does the body's momentum change?
HKA: $\Delta p = F t$.
HEN: $\Delta p = F t$.
SKA: $\Delta p = 5 \cdot 4 = 20\ \text{კგ·მ/წმ}$
SEN: $\Delta p = 5 \cdot 4 = 20\ \text{kg·m/s}$
AKA: $20\ \text{კგ·მ/წმ}$
AEN: $20\ \text{kg·m/s}$

--- easy momentum
KA: რომელს აქვს მეტი იმპულსი: $10\ \text{გ}$ ტყვიას $700\ \text{მ/წმ}$-ით თუ $7\ \text{კგ}$ ბოულინგის ბურთს $1\ \text{მ/წმ}$-ით?
EN: Which has more momentum: a $10\ \text{g}$ bullet at $700\ \text{m/s}$ or a $7\ \text{kg}$ bowling ball at $1\ \text{m/s}$?
HKA: გამოთვალეთ ორივე.
HEN: Work out both.
SKA: ტყვია: $0{,}01 \cdot 700 = 7\ \text{კგ·მ/წმ}$; ბურთი: $7 \cdot 1 = 7\ \text{კგ·მ/წმ}$ — ტოლია!
SEN: Bullet: $0.01 \cdot 700 = 7\ \text{kg·m/s}$; ball: $7 \cdot 1 = 7\ \text{kg·m/s}$ — equal!
AKA: ტოლია
AEN: they are equal

--- easy momentum
KA: რატომ მოხრილი მუხლებით ვხტებით სიმაღლიდან და არა სწორი ფეხებით?
EN: Why do we bend our knees when jumping down, rather than landing with straight legs?
HKA: $F = \dfrac{\Delta p}{\Delta t}$.
HEN: $F = \dfrac{\Delta p}{\Delta t}$.
SKA: იმპულსის ცვლილება ორივე შემთხვევაში ერთია, მაგრამ მოხრილი მუხლებით დამუხრუჭების დრო გრძელია — ძალა $F = \dfrac{\Delta p}{\Delta t}$ ბევრად ნაკლებია.
SEN: The change in momentum is the same either way, but bending the knees makes the stopping time longer — so the force $F = \dfrac{\Delta p}{\Delta t}$ is much smaller.
AKA: დამუხრუჭების დრო იზრდება, ძალა მცირდება
AEN: the stopping time grows, so the force shrinks

--- medium momentum
KA: $3\ \text{კგ}$ ურიკა $4\ \text{მ/წმ}$-ით უძრავ $1\ \text{კგ}$ ურიკას ეჯახება და ისინი ერთად მოძრაობენ. იპოვეთ საერთო სიჩქარე.
EN: A $3\ \text{kg}$ cart at $4\ \text{m/s}$ hits a stationary $1\ \text{kg}$ cart and they move off together. Find their common speed.
HKA: $m_1 v_1 = (m_1 + m_2) u$.
HEN: $m_1 v_1 = (m_1 + m_2) u$.
SKA: $u = \dfrac{12}{4} = 3\ \text{მ/წმ}$
SEN: $u = \dfrac{12}{4} = 3\ \text{m/s}$
AKA: $3\ \text{მ/წმ}$
AEN: $3\ \text{m/s}$

--- medium momentum
KA: ზარბაზანი ($500\ \text{კგ}$) ჰორიზონტალურად $10\ \text{კგ}$ ჭურვს $400\ \text{მ/წმ}$-ით ისვრის. რა სიჩქარით გაიწევს უკან?
EN: A $500\ \text{kg}$ cannon fires a $10\ \text{kg}$ shell horizontally at $400\ \text{m/s}$. How fast does it recoil?
HKA: $0 = m v - M u$.
HEN: $0 = m v - M u$.
SKA: $u = \dfrac{10 \cdot 400}{500} = 8\ \text{მ/წმ}$
SEN: $u = \dfrac{10 \cdot 400}{500} = 8\ \text{m/s}$
AKA: $8\ \text{მ/წმ}$
AEN: $8\ \text{m/s}$

--- medium momentum
KA: $0{,}2\ \text{კგ}$ ბურთი $10\ \text{მ/წმ}$-ით კედელს ეჯახება და $8\ \text{მ/წმ}$-ით ბრუნდება. დარტყმა $0{,}01\ \text{წმ}$ გრძელდება. იპოვეთ იმპულსის ცვლილება და კედლის საშუალო ძალა.
EN: A $0.2\ \text{kg}$ ball hits a wall at $10\ \text{m/s}$ and rebounds at $8\ \text{m/s}$. The impact lasts $0.01\ \text{s}$. Find the change in momentum and the wall's average force.
HKA: მიმართულება იცვლება: $\Delta p = m(v_1 + v_2)$.
HEN: The direction reverses: $\Delta p = m(v_1 + v_2)$.
SKA: $\Delta p = 0{,}2 \cdot 18 = 3{,}6\ \text{კგ·მ/წმ}$
$F = \dfrac{3{,}6}{0{,}01} = 360\ \text{ნ}$
SEN: $\Delta p = 0.2 \cdot 18 = 3.6\ \text{kg·m/s}$
$F = \dfrac{3.6}{0.01} = 360\ \text{N}$
AKA: $3{,}6\ \text{კგ·მ/წმ}$; $360\ \text{ნ}$
AEN: $3.6\ \text{kg·m/s}$; $360\ \text{N}$

--- medium momentum
KA: ციგურებზე მდგომი ბიჭი ($50\ \text{კგ}$) $5\ \text{კგ}$ ქვას ჰორიზონტალურად $8\ \text{მ/წმ}$-ით ისვრის. რა სიჩქარით გასრიალდება? რა მანძილს გაივლის, თუ $\mu = 0{,}02$?
EN: A $50\ \text{kg}$ boy on skates throws a $5\ \text{kg}$ stone horizontally at $8\ \text{m/s}$. How fast does he slide back? How far does he go if $\mu = 0.02$?
HKA: იმპულსი, შემდეგ $s = \dfrac{u^2}{2\mu g}$.
HEN: Momentum, then $s = \dfrac{u^2}{2\mu g}$.
SKA: $u = \dfrac{5 \cdot 8}{50} = 0{,}8\ \text{მ/წმ}$
$s = \dfrac{0{,}64}{0{,}4} = 1{,}6\ \text{მ}$
SEN: $u = \dfrac{5 \cdot 8}{50} = 0.8\ \text{m/s}$
$s = \dfrac{0.64}{0.4} = 1.6\ \text{m}$
AKA: $0{,}8\ \text{მ/წმ}$; $1{,}6\ \text{მ}$
AEN: $0.8\ \text{m/s}$; $1.6\ \text{m}$

--- medium momentum
KA: $2\ \text{კგ}$ სხეული $5\ \text{მ/წმ}$-ით მარჯვნივ, $3\ \text{კგ}$ — $2\ \text{მ/წმ}$-ით მარცხნივ მოძრაობს. არადრეკადი დაჯახების შემდეგ რა სიჩქარით და საით იმოძრავებენ?
EN: A $2\ \text{kg}$ body moves right at $5\ \text{m/s}$ and a $3\ \text{kg}$ body moves left at $2\ \text{m/s}$. After a perfectly inelastic collision, how fast and which way do they move?
HKA: მარჯვენა მიმართულება დადებითად.
HEN: Take right as positive.
SKA: $u = \dfrac{2 \cdot 5 - 3 \cdot 2}{5} = 0{,}8\ \text{მ/წმ}$, მარჯვნივ.
SEN: $u = \dfrac{2 \cdot 5 - 3 \cdot 2}{5} = 0.8\ \text{m/s}$, to the right.
AKA: $0{,}8\ \text{მ/წმ}$ მარჯვნივ
AEN: $0.8\ \text{m/s}$ to the right

--- medium momentum
KA: ნავში ($200\ \text{კგ}$, უძრავი) მდგომი ადამიანი ($60\ \text{კგ}$) ნაპირზე $3\ \text{მ/წმ}$-ით ხტება. რა სიჩქარით გაცურავს ნავი?
EN: A $60\ \text{kg}$ man standing in a stationary $200\ \text{kg}$ boat jumps ashore at $3\ \text{m/s}$. How fast does the boat move off?
HKA: $0 = m v - M u$.
HEN: $0 = m v - M u$.
SKA: $u = \dfrac{60 \cdot 3}{200} = 0{,}9\ \text{მ/წმ}$
SEN: $u = \dfrac{60 \cdot 3}{200} = 0.9\ \text{m/s}$
AKA: $0{,}9\ \text{მ/წმ}$
AEN: $0.9\ \text{m/s}$

--- medium momentum
KA: ტყვია ($9\ \text{გ}$) $500\ \text{მ/წმ}$-ით ხის ძელში ($1\ \text{კგ}$, ყინულზე) ჩერდება. იპოვეთ ძელის სიჩქარე და დაკარგული კინეტიკური ენერგია.
EN: A $9\ \text{g}$ bullet at $500\ \text{m/s}$ lodges in a $1\ \text{kg}$ wooden block on ice. Find the block's speed and the kinetic energy lost.
HKA: არადრეკადი დაჯახება.
HEN: A perfectly inelastic collision.
SKA: $u = \dfrac{0{,}009 \cdot 500}{1{,}009} \approx 4{,}46\ \text{მ/წმ}$
$E_1 = \dfrac{0{,}009 \cdot 250\,000}{2} = 1125\ \text{ჯ}$, $\ E_2 = \dfrac{1{,}009 \cdot 19{,}9}{2} \approx 10\ \text{ჯ}$
დაკარგულია $\approx 1115\ \text{ჯ}$ ($\approx 99\%$)
SEN: $u = \dfrac{0.009 \cdot 500}{1.009} \approx 4.46\ \text{m/s}$
$E_1 = \dfrac{0.009 \cdot 250\,000}{2} = 1125\ \text{J}$, $\ E_2 = \dfrac{1.009 \cdot 19.9}{2} \approx 10\ \text{J}$
Lost: $\approx 1115\ \text{J}$ ($\approx 99\%$)
AKA: $\approx 4{,}5\ \text{მ/წმ}$; $\approx 1115\ \text{ჯ}$
AEN: $\approx 4.5\ \text{m/s}$; $\approx 1115\ \text{J}$

--- medium momentum
KA: ჰოკეისტი შაიბას ($0{,}16\ \text{კგ}$) უძრაობიდან $40\ \text{მ/წმ}$-მდე აჩქარებს. ჯოხი შაიბას $0{,}02\ \text{წმ}$-ის განმავლობაში ეხება. იპოვეთ საშუალო ძალა.
EN: A hockey player sends a $0.16\ \text{kg}$ puck from rest to $40\ \text{m/s}$; the stick touches it for $0.02\ \text{s}$. Find the average force.
HKA: $F = \dfrac{\Delta p}{\Delta t}$.
HEN: $F = \dfrac{\Delta p}{\Delta t}$.
SKA: $F = \dfrac{0{,}16 \cdot 40}{0{,}02} = 320\ \text{ნ}$
SEN: $F = \dfrac{0.16 \cdot 40}{0.02} = 320\ \text{N}$
AKA: $320\ \text{ნ}$
AEN: $320\ \text{N}$

--- medium momentum
KA: ორი ბურთი ($1\ \text{კგ}$ და $2\ \text{კგ}$) ერთმანეთის მიმართულებით ერთნაირი $3\ \text{მ/წმ}$-ით მოძრაობს. დაჯახების შემდეგ მსუბუქი ბურთი $5\ \text{მ/წმ}$-ით უკან ბრუნდება. რა სიჩქარე ექნება მძიმეს?
EN: Balls of $1\ \text{kg}$ and $2\ \text{kg}$ approach each other at $3\ \text{m/s}$ each. After colliding the light one bounces back at $5\ \text{m/s}$. What is the heavy ball's velocity?
HKA: მსუბუქის საწყისი მიმართულება დადებითად.
HEN: Take the light ball's initial direction as positive.
SKA: $1 \cdot 3 - 2 \cdot 3 = 1 \cdot (-5) + 2 u \Rightarrow -3 = -5 + 2u \Rightarrow u = 1\ \text{მ/წმ}$
მძიმე ბურთი $1\ \text{მ/წმ}$-ით მოძრაობს მსუბუქის საწყისი მიმართულებით (ე.ი. ისიც უკან გაბრუნდა).
SEN: $1 \cdot 3 - 2 \cdot 3 = 1 \cdot (-5) + 2 u \Rightarrow -3 = -5 + 2u \Rightarrow u = 1\ \text{m/s}$
The heavy ball moves at $1\ \text{m/s}$ in the light ball's original direction (it too bounced back).
AKA: $1\ \text{მ/წმ}$, ისიც უკან გაბრუნდა
AEN: $1\ \text{m/s}$; it bounced back too

--- medium momentum
KA: რაკეტა ($2\ \text{ტ}$) უძრაობიდან ერთბაშად $200\ \text{კგ}$ აირს $1000\ \text{მ/წმ}$-ით გამოაფრქვევს. რა სიჩქარეს იძენს რაკეტა?
EN: A $2\ \text{t}$ rocket at rest suddenly ejects $200\ \text{kg}$ of gas at $1000\ \text{m/s}$. What speed does the rocket gain?
HKA: დარჩენილი რაკეტის მასა $1800\ \text{კგ}$-ია.
HEN: The remaining rocket has $1800\ \text{kg}$.
SKA: $u = \dfrac{200 \cdot 1000}{1800} \approx 111\ \text{მ/წმ}$
SEN: $u = \dfrac{200 \cdot 1000}{1800} \approx 111\ \text{m/s}$
AKA: $\approx 111\ \text{მ/წმ}$
AEN: $\approx 111\ \text{m/s}$

--- hard momentum
KA: $0{,}5\ \text{კგ}$ ბურთი $5\ \text{მ}$ სიმაღლიდან ვარდება და $1{,}8\ \text{მ}$-მდე ახტება. დარტყმა $0{,}02\ \text{წმ}$-ს გრძელდება. იპოვეთ იატაკის საშუალო ძალა.
EN: A $0.5\ \text{kg}$ ball falls from $5\ \text{m}$ and bounces to $1.8\ \text{m}$. The impact lasts $0.02\ \text{s}$. Find the floor's average force.
HKA: $v_1 = \sqrt{2gh_1}$, $v_2 = \sqrt{2gh_2}$; $F - mg = \dfrac{m(v_1 + v_2)}{\Delta t}$.
HEN: $v_1 = \sqrt{2gh_1}$, $v_2 = \sqrt{2gh_2}$; $F - mg = \dfrac{m(v_1 + v_2)}{\Delta t}$.
SKA: $v_1 = 10\ \text{მ/წმ}$, $v_2 = 6\ \text{მ/წმ}$
$F = \dfrac{0{,}5 \cdot 16}{0{,}02} + 5 = 400 + 5 = 405\ \text{ნ}$
SEN: $v_1 = 10\ \text{m/s}$, $v_2 = 6\ \text{m/s}$
$F = \dfrac{0.5 \cdot 16}{0.02} + 5 = 400 + 5 = 405\ \text{N}$
AKA: $405\ \text{ნ}$
AEN: $405\ \text{N}$

--- hard momentum
KA: ბალისტიკური ქანქარა: ტყვია ($10\ \text{გ}$) ქვიშის ტომარაში ($2\ \text{კგ}$, ძაფზე ჩამოკიდებული) ჩერდება და ტომარა $20\ \text{სმ}$-ით აიწევს. იპოვეთ ტყვიის სიჩქარე.
EN: Ballistic pendulum: a $10\ \text{g}$ bullet lodges in a $2\ \text{kg}$ sandbag hanging on a string, which rises $20\ \text{cm}$. Find the bullet's speed.
HKA: ჯერ იმპულსი (დაჯახება), შემდეგ ენერგია (აწევა).
HEN: First momentum (the collision), then energy (the rise).
SKA: $u = \sqrt{2 g h} = \sqrt{4} = 2\ \text{მ/წმ}$
$v = \dfrac{(m + M) u}{m} = \dfrac{2{,}01 \cdot 2}{0{,}01} = 402\ \text{მ/წმ}$
SEN: $u = \sqrt{2 g h} = \sqrt{4} = 2\ \text{m/s}$
$v = \dfrac{(m + M) u}{m} = \dfrac{2.01 \cdot 2}{0.01} = 402\ \text{m/s}$
AKA: $\approx 400\ \text{მ/წმ}$
AEN: $\approx 400\ \text{m/s}$

--- hard momentum
KA: ჭურვი ($20\ \text{კგ}$) ზემოთ $200\ \text{მ/წმ}$-ით მოძრაობისას ორ ნაწილად სკდება: $15\ \text{კგ}$-იანი ნაწილი $300\ \text{მ/წმ}$-ით ზემოთ მიფრინავს. იპოვეთ მეორე ნაწილის სიჩქარე.
EN: A $20\ \text{kg}$ shell moving up at $200\ \text{m/s}$ bursts into two: a $15\ \text{kg}$ piece flies up at $300\ \text{m/s}$. Find the other piece's velocity.
HKA: $M v = m_1 v_1 + m_2 v_2$.
HEN: $M v = m_1 v_1 + m_2 v_2$.
SKA: $4000 = 4500 + 5 v_2 \Rightarrow v_2 = -100\ \text{მ/წმ}$ — ქვემოთ, $100\ \text{მ/წმ}$-ით.
SEN: $4000 = 4500 + 5 v_2 \Rightarrow v_2 = -100\ \text{m/s}$ — downwards at $100\ \text{m/s}$.
AKA: $100\ \text{მ/წმ}$ ქვემოთ
AEN: $100\ \text{m/s}$ downwards

--- hard momentum
KA: ადამიანი ($80\ \text{კგ}$) $2\ \text{მ/წმ}$-ით მირბის და ეხტება უძრავ ურიკას ($120\ \text{კგ}$). რა სიჩქარით იმოძრავებს ურიკა? რა იქნება, თუ ურიკა მის შესახვედრად $1\ \text{მ/წმ}$-ით მოძრაობდა?
EN: An $80\ \text{kg}$ man runs at $2\ \text{m/s}$ and jumps onto a stationary $120\ \text{kg}$ cart. How fast does the cart move? What if the cart was coming towards him at $1\ \text{m/s}$?
HKA: არადრეკადი დაჯახება.
HEN: A perfectly inelastic collision.
SKA: უძრავი: $u = \dfrac{160}{200} = 0{,}8\ \text{მ/წმ}$
შემხვედრი: $u = \dfrac{160 - 120}{200} = 0{,}2\ \text{მ/წმ}$ (ადამიანის მიმართულებით)
SEN: At rest: $u = \dfrac{160}{200} = 0.8\ \text{m/s}$
Approaching: $u = \dfrac{160 - 120}{200} = 0.2\ \text{m/s}$ (in the man's direction)
AKA: $0{,}8\ \text{მ/წმ}$; $0{,}2\ \text{მ/წმ}$
AEN: $0.8\ \text{m/s}$; $0.2\ \text{m/s}$

--- hard momentum
KA: დრეკადი დაჯახება: $1\ \text{კგ}$ ბურთი $4\ \text{მ/წმ}$-ით უძრავ $3\ \text{კგ}$ ბურთს ეჯახება (ცენტრალურად). იპოვეთ ორივეს სიჩქარე დაჯახების შემდეგ.
EN: Elastic head-on collision: a $1\ \text{kg}$ ball at $4\ \text{m/s}$ hits a stationary $3\ \text{kg}$ ball. Find both velocities afterwards.
HKA: $u_1 = \dfrac{m_1 - m_2}{m_1 + m_2} v$, $u_2 = \dfrac{2 m_1}{m_1 + m_2} v$.
HEN: $u_1 = \dfrac{m_1 - m_2}{m_1 + m_2} v$, $u_2 = \dfrac{2 m_1}{m_1 + m_2} v$.
SKA: $u_1 = \dfrac{-2}{4} \cdot 4 = -2\ \text{მ/წმ}$ (უკან), $\ u_2 = \dfrac{2}{4} \cdot 4 = 2\ \text{მ/წმ}$
შემოწმება: $4 = -2 + 6$ ✓; $8 = 2 + 6$ ✓
SEN: $u_1 = \dfrac{-2}{4} \cdot 4 = -2\ \text{m/s}$ (back), $\ u_2 = \dfrac{2}{4} \cdot 4 = 2\ \text{m/s}$
Check: $4 = -2 + 6$ ✓; $8 = 2 + 6$ ✓
AKA: $2\ \text{მ/წმ}$ უკან; $2\ \text{მ/წმ}$ წინ
AEN: $2\ \text{m/s}$ back; $2\ \text{m/s}$ forward

--- hard momentum
KA: სამი ერთნაირი ნავი ($M$) ერთ ხაზზე $v$ სიჩქარით მიცურავს. შუა ნავიდან ორ ტვირთს ($m$ თითო) ერთდროულად ისვრიან წინა და უკანა ნავებში, ნავის მიმართ $u$ სიჩქარით. იპოვეთ ნავების სიჩქარეები (ტვირთების მიღების შემდეგ).
EN: Three identical boats ($M$) move in line at speed $v$. From the middle boat two loads ($m$ each) are thrown at the same moment into the front and back boats, at speed $u$ relative to the middle boat. Find each boat's speed afterwards.
HKA: შუა ნავის სიჩქარე არ იცვლება (სიმეტრია). ტვირთების სიჩქარეებია $v + u$ და $v - u$.
HEN: By symmetry the middle boat's speed is unchanged. The loads move at $v + u$ and $v - u$.
SKA: წინა: $v_1 = \dfrac{M v + m(v + u)}{M + m} = v + \dfrac{m u}{M + m}$
უკანა: $v_3 = v - \dfrac{m u}{M + m}$
შუა: $v_2 = v$
SEN: Front: $v_1 = \dfrac{M v + m(v + u)}{M + m} = v + \dfrac{m u}{M + m}$
Back: $v_3 = v - \dfrac{m u}{M + m}$
Middle: $v_2 = v$
AKA: $v \pm \dfrac{m u}{M + m}$; შუა — $v$
AEN: $v \pm \dfrac{m u}{M + m}$; the middle one — $v$

--- hard momentum
KA: $5\ \text{კგ}$ ძელი გლუვ მაგიდაზე $2\ \text{მ/წმ}$-ით მოძრაობს; მას ზემოდან ვერტიკალურად $1\ \text{კგ}$ თიხის ნაჭერი ეცემა და ეკვრება. იპოვეთ ახალი სიჩქარე. რატომ არ ცვლის ვერტიკალური დაცემა ჰორიზონტალურ იმპულსს?
EN: A $5\ \text{kg}$ block slides on a smooth table at $2\ \text{m/s}$; a $1\ \text{kg}$ lump of clay drops vertically onto it and sticks. Find the new speed. Why doesn't the vertical fall add horizontal momentum?
HKA: შენარჩუნდება ჰორიზონტალური იმპულსი.
HEN: Horizontal momentum is conserved.
SKA: $u = \dfrac{5 \cdot 2}{6} \approx 1{,}67\ \text{მ/წმ}$
თიხას ჰორიზონტალური იმპულსი არ ჰქონდა; ვერტიკალურ იმპულსს მაგიდის რეაქცია „იღებს“.
SEN: $u = \dfrac{5 \cdot 2}{6} \approx 1.67\ \text{m/s}$
The clay had no horizontal momentum; its vertical momentum is absorbed by the table's push.
AKA: $\approx 1{,}67\ \text{მ/წმ}$
AEN: $\approx 1.67\ \text{m/s}$

--- hard momentum
KA: ცეცხლსასროლი იარაღიდან წუთში $600$ ტყვია ($10\ \text{გ}$) $800\ \text{მ/წმ}$-ით გამოდის. რა საშუალო ძალით აწვება იარაღი მსროლელს?
EN: A machine gun fires $600$ bullets ($10\ \text{g}$) per minute at $800\ \text{m/s}$. With what average force does it push back on the gunner?
HKA: $F = \dfrac{N m v}{t}$.
HEN: $F = \dfrac{N m v}{t}$.
SKA: $F = \dfrac{600 \cdot 0{,}01 \cdot 800}{60} = 80\ \text{ნ}$
SEN: $F = \dfrac{600 \cdot 0.01 \cdot 800}{60} = 80\ \text{N}$
AKA: $80\ \text{ნ}$
AEN: $80\ \text{N}$

--- hard momentum olympiad
KA: ადამიანი ($m = 50\ \text{კგ}$) $l = 4\ \text{მ}$ სიგრძის ნავის ($M = 150\ \text{კგ}$) ცხვირიდან კიჩოზე გადადის. რამდენით გადაადგილდება ნავი წყლის მიმართ? (წინაღობა არ არის)
EN: A $50\ \text{kg}$ man walks from bow to stern of a $150\ \text{kg}$ boat $4\ \text{m}$ long. How far does the boat move relative to the water? (No drag.)
HKA: მასათა ცენტრი უძრავია: $m(l - x) = M x$.
HEN: The centre of mass doesn't move: $m(l - x) = M x$.
SKA: $50(4 - x) = 150 x \Rightarrow x = 1\ \text{მ}$
ადამიანი წყლის მიმართ $3\ \text{მ}$-ს გადის, ნავი — $1\ \text{მ}$-ს საპირისპიროდ.
SEN: $50(4 - x) = 150 x \Rightarrow x = 1\ \text{m}$
The man moves $3\ \text{m}$ relative to the water and the boat $1\ \text{m}$ the other way.
AKA: $1\ \text{მ}$
AEN: $1\ \text{m}$

--- hard momentum olympiad
KA: დრეკადი დაჯახებისას მძიმე ბურთი ($M$) $v$ სიჩქარით უძრავ მსუბუქ ბურთს ($m \ll M$) ეჯახება. რა სიჩქარით გაფრინდება მსუბუქი? რა მოხდება, თუ ორი ბურთი (კალათბურთის ბურთი ქვემოთ, ჩოგბურთისა ზემოთ) ერთად $h$ სიმაღლიდან ჩამოვარდება?
EN: In an elastic collision a heavy ball ($M$) at speed $v$ hits a light ball ($m \ll M$) at rest. How fast does the light ball fly off? What happens if a basketball with a tennis ball on top is dropped together from height $h$?
HKA: $u_2 = \dfrac{2M}{M + m} v \approx 2v$. მეორე შემთხვევაში იფიქრეთ კალათბურთის ბურთის სისტემაში.
HEN: $u_2 = \dfrac{2M}{M + m} v \approx 2v$. For the second part think in the basketball's frame.
SKA: $u_2 \approx 2v$.
კალათბურთის ბურთი იატაკიდან $v$-თი ზემოთ ბრუნდება და $v$-თი ქვემოთ მომავალ ჩოგბურთის ბურთს ხვდება; მის სისტემაში ჩოგბურთის ბურთი $2v$-თი მოდის და $2v$-თი ბრუნდება. დედამიწის მიმართ: $2v + v = 3v$.
სიმაღლე $\sim v^2$: ჩოგბურთის ბურთი $9h$ სიმაღლემდე ახტება!
SEN: $u_2 \approx 2v$.
The basketball rebounds from the floor at $v$ upwards and meets the tennis ball coming down at $v$; in its frame the tennis ball arrives at $2v$ and leaves at $2v$. Relative to the ground: $2v + v = 3v$.
Height $\sim v^2$: the tennis ball bounces to $9h$!
AKA: $2v$; ჩოგბურთის ბურთი $\approx 9h$-მდე
AEN: $2v$; the tennis ball rises to $\approx 9h$

--- hard momentum olympiad
KA: მანქანა ($1\ \text{ტ}$) $20\ \text{მ/წმ}$-ით მოძრაობს, წვიმა ვერტიკალურად ვარდება და მის ღია ძარაში წამში $2\ \text{კგ}$ წყალი გროვდება. რა დამატებითი წევის ძალაა საჭირო, რომ სიჩქარე არ შემცირდეს?
EN: A $1\ \text{t}$ truck moves at $20\ \text{m/s}$; vertical rain collects in its open back at $2\ \text{kg}$ per second. What extra driving force keeps its speed constant?
HKA: ყოველ წამში $2\ \text{კგ}$ წყალს უნდა მიენიჭოს $20\ \text{მ/წმ}$ სიჩქარე.
HEN: Each second $2\ \text{kg}$ of water must be brought up to $20\ \text{m/s}$.
SKA: $F = \dfrac{\Delta m}{\Delta t} v = 2 \cdot 20 = 40\ \text{ნ}$
SEN: $F = \dfrac{\Delta m}{\Delta t} v = 2 \cdot 20 = 40\ \text{N}$
AKA: $40\ \text{ნ}$
AEN: $40\ \text{N}$

--- hard momentum olympiad
KA: ორი ერთნაირი ბურთი, ერთი უძრავი, მეორე $v$-თი მოძრაობს, დრეკადად, მაგრამ არაცენტრალურად ეჯახება. აჩვენეთ, რომ დაჯახების შემდეგ ისინი ერთმანეთის პერპენდიკულარულად გაფრინდებიან.
EN: Two identical balls collide elastically but off-centre; one was at rest, the other moving at $v$. Show that they fly apart at right angles.
HKA: იმპულსი: $\vec v = \vec u_1 + \vec u_2$; ენერგია: $v^2 = u_1^2 + u_2^2$.
HEN: Momentum: $\vec v = \vec u_1 + \vec u_2$; energy: $v^2 = u_1^2 + u_2^2$.
SKA: იმპულსის ტოლობის კვადრატი: $v^2 = u_1^2 + u_2^2 + 2\vec u_1 \cdot \vec u_2$.
ენერგიით $v^2 = u_1^2 + u_2^2$, ამიტომ $\vec u_1 \cdot \vec u_2 = 0$ — სიჩქარეები პერპენდიკულარულია (ბილიარდი!).
SEN: Squaring the momentum equation: $v^2 = u_1^2 + u_2^2 + 2\vec u_1 \cdot \vec u_2$.
Energy gives $v^2 = u_1^2 + u_2^2$, so $\vec u_1 \cdot \vec u_2 = 0$ — the velocities are perpendicular (billiards!).
AKA: $\vec u_1 \cdot \vec u_2 = 0$ — $90°$
AEN: $\vec u_1 \cdot \vec u_2 = 0$ — $90°$

--- easy energy
KA: $2\ \text{კგ}$ სხეული $3\ \text{მ/წმ}$-ით მოძრაობს $5\ \text{მ}$ სიმაღლეზე. იპოვეთ სრული მექანიკური ენერგია (მიწის მიმართ).
EN: A $2\ \text{kg}$ body moves at $3\ \text{m/s}$ at a height of $5\ \text{m}$. Find its total mechanical energy (relative to the ground).
HKA: $E = \dfrac{m v^2}{2} + m g h$.
HEN: $E = \dfrac{m v^2}{2} + m g h$.
SKA: $E = 9 + 100 = 109\ \text{ჯ}$
SEN: $E = 9 + 100 = 109\ \text{J}$
AKA: $109\ \text{ჯ}$
AEN: $109\ \text{J}$

--- easy energy
KA: ქვა $20\ \text{მ}$ სიმაღლიდან ვარდება. რა სიჩქარე ექნება $15\ \text{მ}$ სიმაღლეზე?
EN: A stone falls from $20\ \text{m}$. What is its speed at a height of $15\ \text{m}$?
HKA: $v = \sqrt{2 g \Delta h}$.
HEN: $v = \sqrt{2 g \Delta h}$.
SKA: $v = \sqrt{2 \cdot 10 \cdot 5} = 10\ \text{მ/წმ}$
SEN: $v = \sqrt{2 \cdot 10 \cdot 5} = 10\ \text{m/s}$
AKA: $10\ \text{მ/წმ}$
AEN: $10\ \text{m/s}$

--- easy energy
KA: რა მუშაობა უნდა შევასრულოთ $1\ \text{ტ}$ მანქანის $10$-დან $20\ \text{მ/წმ}$-მდე ასაჩქარებლად?
EN: How much work is needed to speed a $1\ \text{t}$ car up from $10$ to $20\ \text{m/s}$?
HKA: $A = \Delta E_k$.
HEN: $W = \Delta E_k$.
SKA: $A = \dfrac{1000}{2}(400 - 100) = 150\ \text{კჯ}$
SEN: $W = \dfrac{1000}{2}(400 - 100) = 150\ \text{kJ}$
AKA: $150\ \text{კჯ}$
AEN: $150\ \text{kJ}$

--- easy energy
KA: როდის ინახება მექანიკური ენერგია?
EN: When is mechanical energy conserved?
HKA: იფიქრეთ ხახუნზე.
HEN: Think about friction.
SKA: ჩაკეტილ სისტემაში, თუ მოქმედებს მხოლოდ კონსერვატიული (სიმძიმის და დრეკადობის) ძალები — ხახუნისა და წინაღობის გარეშე. ხახუნის დროს ენერგიის ნაწილი შინაგან ენერგიად იქცევა.
SEN: In a closed system where only conservative forces (gravity and elastic forces) do work — no friction or drag. With friction some energy turns into internal energy.
AKA: ხახუნისა და წინაღობის გარეშე
AEN: when there's no friction or drag

--- medium energy
KA: $0{,}1\ \text{კგ}$ ბურთი ზემოთ $20\ \text{მ/წმ}$-ით აისროლეს. ჰაერის წინაღობის გამო მან მხოლოდ $16\ \text{მ}$ აიარა. იპოვეთ წინაღობის საშუალო ძალა.
EN: A $0.1\ \text{kg}$ ball is thrown up at $20\ \text{m/s}$; because of air resistance it rises only $16\ \text{m}$. Find the average drag force.
HKA: $\dfrac{m v^2}{2} = m g h + F h$.
HEN: $\dfrac{m v^2}{2} = m g h + F h$.
SKA: $20 = 16 + 16 F \Rightarrow F = 0{,}25\ \text{ნ}$
SEN: $20 = 16 + 16 F \Rightarrow F = 0.25\ \text{N}$
AKA: $0{,}25\ \text{ნ}$
AEN: $0.25\ \text{N}$

--- medium energy
KA: ზამბარიანი თოფი ($k = 800\ \text{ნ/მ}$, $x = 5\ \text{სმ}$) $20\ \text{გ}$ ბურთულას ჰორიზონტალურად ისვრის $1{,}25\ \text{მ}$ სიმაღლიდან. რა მანძილზე დაეცემა?
EN: A spring gun ($k = 800\ \text{N/m}$, $x = 5\ \text{cm}$) fires a $20\ \text{g}$ ball horizontally from a height of $1.25\ \text{m}$. How far does it land?
HKA: ჯერ სიჩქარე ენერგიიდან, შემდეგ ჰორიზონტალური სროლა.
HEN: First the speed from energy, then a horizontal throw.
SKA: $v = x\sqrt{\dfrac{k}{m}} = 0{,}05\sqrt{40\,000} = 10\ \text{მ/წმ}$
$t = 0{,}5\ \text{წმ}$, $\ L = 5\ \text{მ}$
SEN: $v = x\sqrt{\dfrac{k}{m}} = 0.05\sqrt{40\,000} = 10\ \text{m/s}$
$t = 0.5\ \text{s}$, $\ L = 5\ \text{m}$
AKA: $5\ \text{მ}$
AEN: $5\ \text{m}$

--- medium energy
KA: ქანქარა ($l = 1\ \text{მ}$) $60°$-ით გადახარეს და გაუშვეს. იპოვეთ სიჩქარე ქვედა წერტილში.
EN: A pendulum ($l = 1\ \text{m}$) is pulled to $60°$ and released. Find its speed at the bottom.
HKA: $h = l(1 - \cos\alpha)$.
HEN: $h = l(1 - \cos\alpha)$.
SKA: $h = 0{,}5\ \text{მ}$, $\ v = \sqrt{10} \approx 3{,}2\ \text{მ/წმ}$
SEN: $h = 0.5\ \text{m}$, $\ v = \sqrt{10} \approx 3.2\ \text{m/s}$
AKA: $\approx 3{,}2\ \text{მ/წმ}$
AEN: $\approx 3.2\ \text{m/s}$

--- medium energy
KA: მარხილი ($20\ \text{კგ}$) $10\ \text{მ}$ სიმაღლის ბორცვიდან ჩამოსრიალდა და ქვემოთ $12\ \text{მ/წმ}$ ჰქონდა. რა მუშაობა შეასრულა ხახუნმა?
EN: A $20\ \text{kg}$ sled slides down a $10\ \text{m}$ hill and reaches $12\ \text{m/s}$ at the bottom. How much work did friction do?
HKA: $A_{\text{ხ}} = E_k - E_p$.
HEN: $W_{\text{fr}} = E_k - E_p$.
SKA: $E_p = 2000\ \text{ჯ}$, $\ E_k = 1440\ \text{ჯ}$
$A_{\text{ხ}} = -560\ \text{ჯ}$
SEN: $E_p = 2000\ \text{J}$, $\ E_k = 1440\ \text{J}$
$W_{\text{fr}} = -560\ \text{J}$
AKA: $-560\ \text{ჯ}$
AEN: $-560\ \text{J}$

--- medium energy
KA: ძრავის სიმძლავრე $60\ \text{კვტ}$-ია. რამდენ ხანში შეუძლია $1{,}2\ \text{ტ}$ მანქანის ადგილიდან $30\ \text{მ/წმ}$-მდე აჩქარება (დანაკარგების გარეშე)?
EN: An engine has $60\ \text{kW}$. How long does it take to accelerate a $1.2\ \text{t}$ car from rest to $30\ \text{m/s}$ (no losses)?
HKA: $N t = \dfrac{m v^2}{2}$.
HEN: $P t = \dfrac{m v^2}{2}$.
SKA: $E_k = \dfrac{1200 \cdot 900}{2} = 540\ \text{კჯ}$, $\ t = \dfrac{540\,000}{60\,000} = 9\ \text{წმ}$
SEN: $E_k = \dfrac{1200 \cdot 900}{2} = 540\ \text{kJ}$, $\ t = \dfrac{540\,000}{60\,000} = 9\ \text{s}$
AKA: $9\ \text{წმ}$
AEN: $9\ \text{s}$

--- medium energy
KA: მოთხილამურე $5\ \text{მ/წმ}$-ით ადის $1\ \text{მ}$-იან ბორცვზე. რა სიჩქარე ექნება წვეროზე? (ხახუნის გარეშე)
EN: A skier moving at $5\ \text{m/s}$ goes up a $1\ \text{m}$ bump. What is their speed at the top? (No friction.)
HKA: $v^2 = v_0^2 - 2 g h$.
HEN: $v^2 = v_0^2 - 2 g h$.
SKA: $v^2 = 25 - 20 = 5 \Rightarrow v \approx 2{,}2\ \text{მ/წმ}$
SEN: $v^2 = 25 - 20 = 5 \Rightarrow v \approx 2.2\ \text{m/s}$
AKA: $\approx 2{,}2\ \text{მ/წმ}$
AEN: $\approx 2.2\ \text{m/s}$

--- hard energy
KA: ძელი ($2\ \text{კგ}$) $3\ \text{მ}$ სიმაღლის გლუვი მრუდიდან ჩამოსრიალდა, შემდეგ უხეშ ჰორიზონტალურ ზედაპირზე ($\mu = 0{,}2$) $5\ \text{მ}$ გაიარა და ზამბარას ($k = 400\ \text{ნ/მ}$) დაეჯახა. რამდენით შეკუმშავს ზამბარას (ზამბარის ქვეშ ხახუნი არ არის)?
EN: A $2\ \text{kg}$ block slides down a smooth $3\ \text{m}$ high curve, then crosses $5\ \text{m}$ of rough floor ($\mu = 0.2$) and hits a spring ($k = 400\ \text{N/m}$). How far does it compress it (no friction under the spring)?
HKA: $m g h - \mu m g s = \dfrac{k x^2}{2}$.
HEN: $m g h - \mu m g s = \dfrac{k x^2}{2}$.
SKA: $60 - 20 = 200 x^2 \Rightarrow x^2 = 0{,}2$
$x \approx 0{,}45\ \text{მ}$
SEN: $60 - 20 = 200 x^2 \Rightarrow x^2 = 0.2$
$x \approx 0.45\ \text{m}$
AKA: $\approx 45\ \text{სმ}$
AEN: $\approx 45\ \text{cm}$

--- hard energy
KA: ბურთულა ($0{,}1\ \text{კგ}$) $1\ \text{მ}$ ძაფზე ჰორიზონტალური მდებარეობიდან გაუშვეს. იპოვეთ ძაფის დაჭიმულობა ქვედა წერტილში.
EN: A $0.1\ \text{kg}$ ball on a $1\ \text{m}$ string is released from the horizontal. Find the string's tension at the bottom.
HKA: $v^2 = 2 g l$, $T = m g + \dfrac{m v^2}{l}$.
HEN: $v^2 = 2 g l$, $T = m g + \dfrac{m v^2}{l}$.
SKA: $T = m g + 2 m g = 3 m g = 3\ \text{ნ}$
SEN: $T = m g + 2 m g = 3 m g = 3\ \text{N}$
AKA: $3\ \text{ნ}$ ($3mg$)
AEN: $3\ \text{N}$ ($3mg$)

--- hard energy
KA: რა მინიმალური სიმაღლიდან უნდა დაიწყოს სრიალი ბურთულამ, რომ $R = 0{,}4\ \text{მ}$ რადიუსის ვერტიკალური მარყუჟი გაიაროს (ხახუნის გარეშე)?
EN: From what minimum height must a ball start sliding to complete a vertical loop of radius $R = 0.4\ \text{m}$ (no friction)?
HKA: მარყუჟის წვეროზე $v^2 \ge g R$.
HEN: At the top of the loop $v^2 \ge g R$.
SKA: $m g h = m g \cdot 2R + \dfrac{m g R}{2} \Rightarrow h = 2{,}5 R = 1\ \text{მ}$
SEN: $m g h = m g \cdot 2R + \dfrac{m g R}{2} \Rightarrow h = 2.5 R = 1\ \text{m}$
AKA: $1\ \text{მ}$ ($2{,}5R$)
AEN: $1\ \text{m}$ ($2.5R$)

--- hard energy
KA: ზამბარაზე ($k = 100\ \text{ნ/მ}$) დაკიდებულ $0{,}5\ \text{კგ}$ ტვირთს $10\ \text{სმ}$-ით ქვემოთ დაწიეს წონასწორობიდან და გაუშვეს. იპოვეთ მაქსიმალური სიჩქარე.
EN: A $0.5\ \text{kg}$ load on a spring ($k = 100\ \text{N/m}$) is pulled $10\ \text{cm}$ below equilibrium and released. Find its maximum speed.
HKA: წონასწორობის მიმართ: $\dfrac{k A^2}{2} = \dfrac{m v^2}{2}$ (სიმძიმე მხოლოდ წონასწორობას ცვლის).
HEN: Relative to equilibrium: $\dfrac{k A^2}{2} = \dfrac{m v^2}{2}$ (gravity only shifts the equilibrium).
SKA: $v = A\sqrt{\dfrac{k}{m}} = 0{,}1 \cdot \sqrt{200} \approx 1{,}41\ \text{მ/წმ}$
SEN: $v = A\sqrt{\dfrac{k}{m}} = 0.1 \cdot \sqrt{200} \approx 1.41\ \text{m/s}$
AKA: $\approx 1{,}4\ \text{მ/წმ}$
AEN: $\approx 1.4\ \text{m/s}$

--- hard energy
KA: ტყვია ($10\ \text{გ}$) $400\ \text{მ/წმ}$-ით ხვდება ძაფზე ჩამოკიდებულ $1{,}99\ \text{კგ}$ ტომარას და მასში ჩერდება. რა სიმაღლეზე აიწევს ტომარა? ენერგიის რა ნაწილი გადაიქცა სითბოდ?
EN: A $10\ \text{g}$ bullet at $400\ \text{m/s}$ lodges in a $1.99\ \text{kg}$ bag hanging on a string. How high does the bag rise? What fraction of the energy became heat?
HKA: იმპულსი, შემდეგ ენერგია.
HEN: Momentum, then energy.
SKA: $u = \dfrac{0{,}01 \cdot 400}{2} = 2\ \text{მ/წმ}$, $\ h = \dfrac{4}{20} = 0{,}2\ \text{მ}$
$\dfrac{E_2}{E_1} = \dfrac{m}{m + M} = 0{,}005$ — სითბოდ იქცა $99{,}5\%$.
SEN: $u = \dfrac{0.01 \cdot 400}{2} = 2\ \text{m/s}$, $\ h = \dfrac{4}{20} = 0.2\ \text{m}$
$\dfrac{E_2}{E_1} = \dfrac{m}{m + M} = 0.005$ — $99.5\%$ became heat.
AKA: $20\ \text{სმ}$; $99{,}5\%$
AEN: $20\ \text{cm}$; $99.5\%$

--- hard energy
KA: მატარებელი ($500\ \text{ტ}$) ძრავის გამორთვის შემდეგ $15\ \text{მ/წმ}$-ით შედის აღმართზე ($\sin\alpha = 0{,}01$); წინაღობა წონის $0{,}005$-ია. რა მანძილს გაივლის?
EN: A $500\ \text{t}$ train with its engine off enters a slope ($\sin\alpha = 0.01$) at $15\ \text{m/s}$; resistance is $0.005$ of its weight. How far does it go?
HKA: $\dfrac{v^2}{2} = g s (\sin\alpha + 0{,}005)$.
HEN: $\dfrac{v^2}{2} = g s (\sin\alpha + 0.005)$.
SKA: $112{,}5 = 10 s \cdot 0{,}015 \Rightarrow s = 750\ \text{მ}$
SEN: $112.5 = 10 s \cdot 0.015 \Rightarrow s = 750\ \text{m}$
AKA: $750\ \text{მ}$
AEN: $750\ \text{m}$

--- hard energy
KA: სხეული ზემოთ $v_0$-ით ისროლეს. რა სიმაღლეზე იქნება მისი კინეტიკური ენერგია პოტენციურის ნახევარი?
EN: A body is thrown up at $v_0$. At what height is its kinetic energy half its potential energy?
HKA: $\dfrac{m v_0^2}{2} = E_p + \dfrac{E_p}{2}$.
HEN: $\dfrac{m v_0^2}{2} = E_p + \dfrac{E_p}{2}$.
SKA: $\dfrac{3}{2} m g h = \dfrac{m v_0^2}{2} \Rightarrow h = \dfrac{v_0^2}{3 g}$
SEN: $\dfrac{3}{2} m g h = \dfrac{m v_0^2}{2} \Rightarrow h = \dfrac{v_0^2}{3 g}$
AKA: $h = \dfrac{v_0^2}{3g}$ (მაქსიმუმის $\dfrac{2}{3}$)
AEN: $h = \dfrac{v_0^2}{3g}$ ($\dfrac{2}{3}$ of the maximum)

--- hard energy
KA: $1\ \text{კგ}$ ძელი $30°$-იან დახრილ სიბრტყეზე ($\mu = 0{,}2$) ზემოთ $8\ \text{მ/წმ}$-ით გაუშვეს. რა მანძილს გაივლის სიბრტყის გასწვრივ? დაბრუნდება?
EN: A $1\ \text{kg}$ block is sent up a $30°$ incline ($\mu = 0.2$) at $8\ \text{m/s}$. How far up does it go? Will it slide back?
HKA: $\dfrac{v^2}{2} = g s(\sin\alpha + \mu\cos\alpha)$; დაბრუნდება, თუ $\tan\alpha > \mu$.
HEN: $\dfrac{v^2}{2} = g s(\sin\alpha + \mu\cos\alpha)$; it slides back if $\tan\alpha > \mu$.
SKA: $32 = 10 s (0{,}5 + 0{,}173) \Rightarrow s \approx 4{,}75\ \text{მ}$
$\tan 30° = 0{,}577 > 0{,}2$ — დაბრუნდება.
SEN: $32 = 10 s (0.5 + 0.173) \Rightarrow s \approx 4.75\ \text{m}$
$\tan 30° = 0.577 > 0.2$ — it slides back.
AKA: $\approx 4{,}75\ \text{მ}$; კი
AEN: $\approx 4.75\ \text{m}$; yes

--- hard energy olympiad
KA: მძიმე ჯაჭვი ($m$, $l$) ჰორიზონტალურ მაგიდაზე დევს, ნახევარი კიდიდან ჰკიდია. ხახუნის გარეშე რა სიჩქარე ექნება, როცა ბოლო რგოლი მაგიდას დატოვებს?
EN: A heavy chain ($m$, $l$) lies on a frictionless table with half of it hanging over the edge. What is its speed when the last link leaves the table?
HKA: მასათა ცენტრის დაწევა: თავიდან $-\dfrac{l}{8}$, ბოლოს $-\dfrac{l}{2}$.
HEN: Centre of mass: initially at $-\dfrac{l}{8}$, finally at $-\dfrac{l}{2}$.
SKA: $\Delta h = \dfrac{l}{2} - \dfrac{l}{8} = \dfrac{3l}{8}$
$\dfrac{v^2}{2} = \dfrac{3 g l}{8} \Rightarrow v = \sqrt{\dfrac{3 g l}{4}}$
SEN: $\Delta h = \dfrac{l}{2} - \dfrac{l}{8} = \dfrac{3l}{8}$
$\dfrac{v^2}{2} = \dfrac{3 g l}{8} \Rightarrow v = \sqrt{\dfrac{3 g l}{4}}$
AKA: $v = \sqrt{\dfrac{3gl}{4}}$
AEN: $v = \sqrt{\dfrac{3gl}{4}}$

--- hard energy olympiad
KA: ორი ძელი ($m$ და $2m$) შეკუმშულ ზამბარასთან ერთად ძაფითაა შეკრული და გლუვ მაგიდაზე დევს. ზამბარის ენერგიაა $E$. ძაფს წვავენ. იპოვეთ ძელების სიჩქარეები.
EN: Blocks $m$ and $2m$ are tied together with a compressed spring between them on a smooth table; the spring stores $E$. The thread is burned. Find the blocks' speeds.
HKA: იმპულსი: $m v_1 = 2m v_2$; ენერგია: $E = \dfrac{m v_1^2}{2} + \dfrac{2m v_2^2}{2}$.
HEN: Momentum: $m v_1 = 2m v_2$; energy: $E = \dfrac{m v_1^2}{2} + \dfrac{2m v_2^2}{2}$.
SKA: $v_1 = 2 v_2$: $E = 2m v_2^2 + m v_2^2 = 3 m v_2^2$
$v_2 = \sqrt{\dfrac{E}{3m}}$, $\ v_1 = 2\sqrt{\dfrac{E}{3m}}$ — მსუბუქი ძელი ენერგიის $\dfrac{2}{3}$-ს იღებს.
SEN: $v_1 = 2 v_2$: $E = 2m v_2^2 + m v_2^2 = 3 m v_2^2$
$v_2 = \sqrt{\dfrac{E}{3m}}$, $\ v_1 = 2\sqrt{\dfrac{E}{3m}}$ — the light block gets $\dfrac{2}{3}$ of the energy.
AKA: $v_1 = 2\sqrt{\dfrac{E}{3m}}$, $v_2 = \sqrt{\dfrac{E}{3m}}$
AEN: $v_1 = 2\sqrt{\dfrac{E}{3m}}$, $v_2 = \sqrt{\dfrac{E}{3m}}$

--- easy statics
KA: გასაღებს $200\ \text{ნ}$-ით ატრიალებენ, ძალის მხარი $0{,}25\ \text{მ}$-ია. იპოვეთ ძალის მომენტი.
EN: A spanner is turned with $200\ \text{N}$ at an arm of $0.25\ \text{m}$. Find the moment.
HKA: $M = F d$.
HEN: $M = F d$.
SKA: $M = 200 \cdot 0{,}25 = 50\ \text{ნ·მ}$
SEN: $M = 200 \cdot 0.25 = 50\ \text{N·m}$
AKA: $50\ \text{ნ·მ}$
AEN: $50\ \text{N·m}$

--- easy statics
KA: ჩამოაყალიბეთ მყარი სხეულის წონასწორობის ორი პირობა.
EN: State the two conditions of equilibrium of a rigid body.
HKA: ძალები და მომენტები.
HEN: Forces and moments.
SKA: 1) ყველა ძალის ჯამი ნულია: $\sum \vec F = 0$.
2) ყველა ძალის მომენტების ჯამი ნებისმიერი ღერძის მიმართ ნულია: $\sum M = 0$.
SEN: 1) The sum of all forces is zero: $\sum \vec F = 0$.
2) The sum of the moments about any axis is zero: $\sum M = 0$.
AKA: $\sum \vec F = 0$ და $\sum M = 0$
AEN: $\sum \vec F = 0$ and $\sum M = 0$

--- easy statics
KA: ბერკეტის ერთ ბოლოზე, საყრდენიდან $0{,}4\ \text{მ}$-ზე, $30\ \text{ნ}$ მოქმედებს. რა ძალა უნდა მოქმედებდეს მეორე მხარეს $1{,}2\ \text{მ}$-ზე წონასწორობისთვის?
EN: A $30\ \text{N}$ force acts $0.4\ \text{m}$ from a lever's pivot. What force at $1.2\ \text{m}$ on the other side balances it?
HKA: $F_1 d_1 = F_2 d_2$.
HEN: $F_1 d_1 = F_2 d_2$.
SKA: $F_2 = \dfrac{30 \cdot 0{,}4}{1{,}2} = 10\ \text{ნ}$
SEN: $F_2 = \dfrac{30 \cdot 0.4}{1.2} = 10\ \text{N}$
AKA: $10\ \text{ნ}$
AEN: $10\ \text{N}$

--- easy statics
KA: რატომ არის სტაბილური დაბალი და განიერი ფუძის მქონე სხეული? როდის გადაბრუნდება სხეული?
EN: Why is a body with a low, wide base stable? When does a body tip over?
HKA: სიმძიმის ცენტრი და საყრდენი ფართობი.
HEN: Centre of gravity and the area of support.
SKA: სხეული წონასწორობაშია, სანამ სიმძიმის ცენტრიდან გავლებული ვერტიკალი საყრდენ ფართობს კვეთს. დაბალი ცენტრი და განიერი ფუძე ამ ვერტიკალს ფუძის შიგნით დიდხანს ინარჩუნებს. სხეული გადაბრუნდება, როცა ვერტიკალი ფუძის საზღვრებს გასცდება.
SEN: A body is in equilibrium as long as the vertical through its centre of gravity passes through its base. A low centre and a wide base keep that vertical inside the base over a large tilt. It tips over once the vertical passes outside the base.
AKA: სიმძიმის ცენტრის ვერტიკალი საყრდენის შიგნით რჩება
AEN: the vertical through the centre of gravity stays within the base

--- medium statics
KA: $2\ \text{მ}$ სიგრძის ერთგვაროვანი ძელი ($10\ \text{კგ}$) ბოლოებით ორ საყრდენზე დევს. მარცხენა ბოლოდან $0{,}5\ \text{მ}$-ზე $40\ \text{კგ}$ ტვირთია. იპოვეთ რეაქციები.
EN: A uniform $2\ \text{m}$ beam ($10\ \text{kg}$) rests on supports at its ends. A $40\ \text{kg}$ load sits $0.5\ \text{m}$ from the left end. Find the support forces.
HKA: მომენტები მარცხენა საყრდენის მიმართ.
HEN: Moments about the left support.
SKA: $N_2 \cdot 2 = 100 \cdot 1 + 400 \cdot 0{,}5 = 300 \Rightarrow N_2 = 150\ \text{ნ}$
$N_1 = 500 - 150 = 350\ \text{ნ}$
SEN: $N_2 \cdot 2 = 100 \cdot 1 + 400 \cdot 0.5 = 300 \Rightarrow N_2 = 150\ \text{N}$
$N_1 = 500 - 150 = 350\ \text{N}$
AKA: $350\ \text{ნ}$ და $150\ \text{ნ}$
AEN: $350\ \text{N}$ and $150\ \text{N}$

--- medium statics
KA: ფარანი ($5\ \text{კგ}$) ორ ტოლ თოკზე ჰკიდია, რომლებიც ჰორიზონტთან $30°$-ს ქმნის. იპოვეთ დაჭიმულობა.
EN: A $5\ \text{kg}$ lamp hangs from two equal cables each at $30°$ to the horizontal. Find the tension.
HKA: $2T\sin 30° = mg$.
HEN: $2T\sin 30° = mg$.
SKA: $T = \dfrac{50}{2 \cdot 0{,}5} = 50\ \text{ნ}$
SEN: $T = \dfrac{50}{2 \cdot 0.5} = 50\ \text{N}$
AKA: $50\ \text{ნ}$
AEN: $50\ \text{N}$

--- medium statics
KA: ყუთი ($20\ \text{კგ}$) $37°$-იან დახრილ სიბრტყეზე დევს და არ სრიალებს. იპოვეთ ხახუნის ძალა და წნევის ძალა. ($\sin 37° = 0{,}6$, $\cos 37° = 0{,}8$)
EN: A $20\ \text{kg}$ box rests on a $37°$ incline without sliding. Find the friction and normal forces. ($\sin 37° = 0.6$, $\cos 37° = 0.8$)
HKA: $F = mg\sin\alpha$, $N = mg\cos\alpha$.
HEN: $F = mg\sin\alpha$, $N = mg\cos\alpha$.
SKA: $F = 200 \cdot 0{,}6 = 120\ \text{ნ}$, $\ N = 200 \cdot 0{,}8 = 160\ \text{ნ}$
SEN: $F = 200 \cdot 0.6 = 120\ \text{N}$, $\ N = 200 \cdot 0.8 = 160\ \text{N}$
AKA: $120\ \text{ნ}$; $160\ \text{ნ}$
AEN: $120\ \text{N}$; $160\ \text{N}$

--- medium statics
KA: ჰორიზონტალური ძელი ($3\ \text{მ}$, $15\ \text{კგ}$) კედელზე საკინძითაა დამაგრებული, თავისუფალი ბოლო კი ვერტიკალურ თოკზე ჰკიდია. ბოლოზე $30\ \text{კგ}$ ტვირთია. იპოვეთ თოკის დაჭიმულობა და საკინძის რეაქცია.
EN: A horizontal $3\ \text{m}$ beam ($15\ \text{kg}$) is hinged to a wall and its free end hangs on a vertical rope. A $30\ \text{kg}$ load hangs at the end. Find the rope tension and the hinge force.
HKA: მომენტები საკინძის მიმართ.
HEN: Moments about the hinge.
SKA: $T \cdot 3 = 150 \cdot 1{,}5 + 300 \cdot 3 \Rightarrow T = 375\ \text{ნ}$
$N = 450 - 375 = 75\ \text{ნ}$ (ზემოთ)
SEN: $T \cdot 3 = 150 \cdot 1.5 + 300 \cdot 3 \Rightarrow T = 375\ \text{N}$
$N = 450 - 375 = 75\ \text{N}$ (up)
AKA: $375\ \text{ნ}$; $75\ \text{ნ}$
AEN: $375\ \text{N}$; $75\ \text{N}$

--- hard statics
KA: კიბე ($4\ \text{მ}$, $20\ \text{კგ}$) გლუვ კედელს ეყრდნობა იატაკთან $60°$-ით. რა მინიმალური $\mu$ სჭირდება იატაკთან, რომ არ გასრიალდეს?
EN: A ladder ($4\ \text{m}$, $20\ \text{kg}$) leans against a smooth wall at $60°$ to the floor. What minimum $\mu$ at the floor keeps it from slipping?
HKA: $\mu = \dfrac{1}{2\tan\alpha}$ (ერთგვაროვანი კიბისთვის).
HEN: $\mu = \dfrac{1}{2\tan\alpha}$ (for a uniform ladder).
SKA: ქვედა ბოლოს მიმართ: $N_{\text{კ}} \cdot l\sin 60° = mg \cdot \dfrac{l}{2}\cos 60°$
$N_{\text{კ}} = \dfrac{mg}{2\tan 60°}$, $\ \mu = \dfrac{N_{\text{კ}}}{mg} = \dfrac{1}{2 \cdot 1{,}732} \approx 0{,}29$
SEN: About the foot: $N_{\text{w}} \cdot l\sin 60° = mg \cdot \dfrac{l}{2}\cos 60°$
$N_{\text{w}} = \dfrac{mg}{2\tan 60°}$, $\ \mu = \dfrac{N_{\text{w}}}{mg} = \dfrac{1}{2 \cdot 1.732} \approx 0.29$
AKA: $\approx 0{,}29$
AEN: $\approx 0.29$

--- hard statics
KA: ტვირთი ($10\ \text{კგ}$) ორ თოკზე ჰკიდია: ერთი ჰორიზონტალურია, მეორე ჭერთან $45°$-ს ქმნის. იპოვეთ დაჭიმულობები.
EN: A $10\ \text{kg}$ load hangs from two ropes: one horizontal, the other at $45°$ to the ceiling. Find the tensions.
HKA: დახრილი თოკის ვერტიკალური მდგენელი $mg$-ს აწონასწორებს.
HEN: The slanted rope's vertical component balances $mg$.
SKA: $T_2\sin 45° = 100 \Rightarrow T_2 \approx 141\ \text{ნ}$
$T_1 = T_2\cos 45° = 100\ \text{ნ}$
SEN: $T_2\sin 45° = 100 \Rightarrow T_2 \approx 141\ \text{N}$
$T_1 = T_2\cos 45° = 100\ \text{N}$
AKA: $100\ \text{ნ}$; $\approx 141\ \text{ნ}$
AEN: $100\ \text{N}$; $\approx 141\ \text{N}$

--- hard statics
KA: მძიმე ბორბალი ($R = 0{,}5\ \text{მ}$, $50\ \text{კგ}$) $0{,}2\ \text{მ}$ სიმაღლის საფეხურს უნდა გადაეხვიოს. რა მინიმალური ჰორიზონტალური ძალაა საჭირო (ღერძზე მოდებული)?
EN: A heavy wheel ($R = 0.5\ \text{m}$, $50\ \text{kg}$) must be pushed up a $0.2\ \text{m}$ step. What minimum horizontal force applied at the axle is needed?
HKA: მომენტები საფეხურის კუთხის მიმართ.
HEN: Take moments about the step's corner.
SKA: ვერტიკალური მხარი: $R - h = 0{,}3\ \text{მ}$; ჰორიზონტალური: $\sqrt{0{,}25 - 0{,}09} = 0{,}4\ \text{მ}$
$F \cdot 0{,}3 = 500 \cdot 0{,}4 \Rightarrow F \approx 667\ \text{ნ}$
SEN: Vertical arm: $R - h = 0.3\ \text{m}$; horizontal: $\sqrt{0.25 - 0.09} = 0.4\ \text{m}$
$F \cdot 0.3 = 500 \cdot 0.4 \Rightarrow F \approx 667\ \text{N}$
AKA: $\approx 667\ \text{ნ}$
AEN: $\approx 667\ \text{N}$

--- hard statics
KA: მართკუთხა კარადა ($h = 2\ \text{მ}$, სიგანე $0{,}8\ \text{მ}$, $80\ \text{კგ}$) იატაკზე დგას ($\mu = 0{,}5$). მას ჰორიზონტალურად $1{,}5\ \text{მ}$ სიმაღლეზე უბიძგებენ. გადაბრუნდება თუ გასრიალდება?
EN: A wardrobe ($2\ \text{m}$ tall, $0.8\ \text{m}$ wide, $80\ \text{kg}$) stands on a floor ($\mu = 0.5$). It is pushed horizontally at a height of $1.5\ \text{m}$. Does it tip or slide?
HKA: შეადარეთ სრიალის ძალა და გადაბრუნების ძალა.
HEN: Compare the force needed to slide with the force needed to tip.
SKA: სრიალი: $F_1 = \mu mg = 400\ \text{ნ}$.
გადაბრუნება (კიდის მიმართ): $F_2 \cdot 1{,}5 = 800 \cdot 0{,}4 \Rightarrow F_2 \approx 213\ \text{ნ}$
$F_2 < F_1$ — ჯერ გადაბრუნდება.
SEN: Sliding: $F_1 = \mu mg = 400\ \text{N}$.
Tipping (about the edge): $F_2 \cdot 1.5 = 800 \cdot 0.4 \Rightarrow F_2 \approx 213\ \text{N}$
$F_2 < F_1$ — it tips first.
AKA: გადაბრუნდება ($\approx 213\ \text{ნ}$-ზე)
AEN: it tips (at $\approx 213\ \text{N}$)

--- hard statics olympiad
KA: ერთგვაროვანი ძელი ერთი ბოლოთი უხეშ იატაკზე დგას, მეორით — გლუვ კედელს ეყრდნობა. აჩვენეთ, რომ ძელის წონასწორობისას იატაკის რეაქციის სრული ძალა (ნორმალური + ხახუნი) გადის ძელის სიმძიმის ცენტრის ვერტიკალისა და კედლის რეაქციის ხაზის გადაკვეთის წერტილში.
EN: A uniform rod stands with one end on a rough floor and the other against a smooth wall. Show that in equilibrium the total floor force (normal + friction) passes through the intersection of the line of the wall's force and the vertical through the centre of gravity.
HKA: სამი არაპარალელური ძალის წონასწორობისას მათი მოქმედების ხაზები ერთ წერტილში იკვეთება.
HEN: When three non-parallel forces balance, their lines of action meet at one point.
SKA: ძელზე სამი ძალა მოქმედებს: სიმძიმე, კედლის (ჰორიზონტალური) რეაქცია და იატაკის სრული რეაქცია.
პირველი ორის ხაზები იკვეთება $O$ წერტილში. მომენტები $O$-ს მიმართ: ორივე ძალის მომენტი ნულია, ამიტომ მესამის მომენტიც ნული უნდა იყოს — მისი ხაზი $O$-ზე გადის.
SEN: Three forces act on the rod: gravity, the wall's (horizontal) push and the total floor force.
The lines of the first two meet at a point $O$. Taking moments about $O$, both have zero moment, so the third must too — its line passes through $O$.
AKA: სამი ძალის თეორემით
AEN: by the three-force theorem

--- hard statics olympiad
KA: მაგიდის კიდეზე ერთნაირი სიგრძის ($L$) $n$ ფიცარი ერთმანეთზე ისე აწყვია, რომ თითოეული მაქსიმალურადაა გადმოწეული. რამდენი ფიცარია საჭირო, რომ ზედა ფიცარი მთლიანად მაგიდის კიდის მიღმა აღმოჩნდეს?
EN: Identical planks of length $L$ are stacked at a table's edge, each pushed out as far as possible. How many planks are needed for the top plank to be entirely beyond the table edge?
HKA: გადმოწევები: $\dfrac{L}{2}, \dfrac{L}{4}, \dfrac{L}{6}, \dots$; ჯამი უნდა გადააჭარბოს $L$-ს.
HEN: The overhangs are $\dfrac{L}{2}, \dfrac{L}{4}, \dfrac{L}{6}, \dots$; their sum must exceed $L$.
SKA: $\dfrac{L}{2}\left(1 + \dfrac{1}{2} + \dfrac{1}{3} + \dots + \dfrac{1}{n}\right) \ge L \Rightarrow 1 + \dfrac{1}{2} + \dots + \dfrac{1}{n} \ge 2$
$1 + 0{,}5 + 0{,}333 = 1{,}83$; $+ 0{,}25 = 2{,}08$ — $n = 4$.
SEN: $\dfrac{L}{2}\left(1 + \dfrac{1}{2} + \dfrac{1}{3} + \dots + \dfrac{1}{n}\right) \ge L \Rightarrow 1 + \dfrac{1}{2} + \dots + \dfrac{1}{n} \ge 2$
$1 + 0.5 + 0.333 = 1.83$; $+ 0.25 = 2.08$ — $n = 4$.
AKA: $4$ ფიცარი
AEN: $4$ planks
