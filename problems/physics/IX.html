KA: სიჩქარე ვექტორია თუ სკალარი? მანქანა მოსახვევში მუდმივი $50\ \text{კმ/სთ}$-ით მიდის. იცვლება თუ არა მისი სიჩქარე?
EN: Is velocity a vector or a scalar? A car takes a bend at a steady $50\ \text{km/h}$. Does its velocity change?
HKA: ვექტორს აქვს მიმართულებაც.
HEN: A vector has a direction too.
SKA: სიჩქარე ვექტორია. მოსახვევში მისი მოდული ($50\ \text{კმ/სთ}$) მუდმივია, მაგრამ მიმართულება იცვლება — ე.ი. სიჩქარის ვექტორი იცვლება (მანქანას აჩქარება აქვს).
SEN: Velocity is a vector. On the bend its magnitude ($50\ \text{km/h}$) is constant but its direction changes — so the velocity vector changes (the car is accelerating).
AKA: ვექტორი; კი, იცვლება მიმართულება
AEN: a vector; yes, its direction changes

--- easy vectors
KA: სხეულის საწყისი სიჩქარე $5\ \text{მ/წმ}$-ია აღმოსავლეთით, საბოლოო — $5\ \text{მ/წმ}$ დასავლეთით. რას უდრის სიჩქარის ცვლილების მოდული?
EN: A body's velocity changes from $5\ \text{m/s}$ east to $5\ \text{m/s}$ west. What is the magnitude of the change in velocity?
HKA: $\Delta \vec v = \vec v_2 - \vec v_1$.
HEN: $\Delta \vec v = \vec v_2 - \vec v_1$.
SKA: აღმოსავლეთი დადებითად: $\Delta v = -5 - 5 = -10\ \text{მ/წმ}$, $|\Delta v| = 10\ \text{მ/წმ}$ (არა ნული!).
SEN: Taking east as positive: $\Delta v = -5 - 5 = -10\ \text{m/s}$, $|\Delta v| = 10\ \text{m/s}$ (not zero!).
AKA: $10\ \text{მ/წმ}$
AEN: $10\ \text{m/s}$

--- medium vectors
KA: ნავი წყლის მიმართ $3\ \text{მ/წმ}$-ით ცურავს ნაპირის პერპენდიკულარულად, დინება $4\ \text{მ/წმ}$-ია. მდინარის სიგანეა $60\ \text{მ}$. იპოვეთ ნავის სიჩქარე ნაპირის მიმართ, გადაცურვის დრო და დინებით წაღების მანძილი.
EN: A boat moves at $3\ \text{m/s}$ relative to the water, heading straight across; the current is $4\ \text{m/s}$. The river is $60\ \text{m}$ wide. Find the boat's speed relative to the bank, the crossing time and how far downstream it drifts.
HKA: სიჩქარეები ურთიერთპერპენდიკულარულია.
HEN: The velocities are perpendicular.
SKA: $v = \sqrt{9 + 16} = 5\ \text{მ/წმ}$
$t = \dfrac{60}{3} = 20\ \text{წმ}$, $\ x = 4 \cdot 20 = 80\ \text{მ}$
SEN: $v = \sqrt{9 + 16} = 5\ \text{m/s}$
$t = \dfrac{60}{3} = 20\ \text{s}$, $\ x = 4 \cdot 20 = 80\ \text{m}$
AKA: $5\ \text{მ/წმ}$; $20\ \text{წმ}$; $80\ \text{მ}$
AEN: $5\ \text{m/s}$; $20\ \text{s}$; $80\ \text{m}$

--- medium vectors
KA: ორი ტოლი ძალა ($10\ \text{ნ}$ თითო) $120°$ კუთხით მოქმედებს. იპოვეთ ტოლქმედი.
EN: Two equal forces of $10\ \text{N}$ act at $120°$ to each other. Find the resultant.
HKA: $R^2 = F_1^2 + F_2^2 + 2F_1 F_2 \cos\alpha$.
HEN: $R^2 = F_1^2 + F_2^2 + 2F_1 F_2 \cos\alpha$.
SKA: $R^2 = 100 + 100 + 2 \cdot 100 \cdot (-0{,}5) = 100 \Rightarrow R = 10\ \text{ნ}$
(რომბი ორ ტოლგვერდა სამკუთხედად იყოფა.)
SEN: $R^2 = 100 + 100 + 2 \cdot 100 \cdot (-0.5) = 100 \Rightarrow R = 10\ \text{N}$
(The rhombus splits into two equilateral triangles.)
AKA: $10\ \text{ნ}$
AEN: $10\ \text{N}$

--- medium vectors
KA: ვერტმფრენი ჯერ $40\ \text{კმ}$-ით ჩრდილოეთით, შემდეგ $30\ \text{კმ}$-ით აღმოსავლეთით, ბოლოს $10\ \text{კმ}$-ით სამხრეთით გაფრინდა. იპოვეთ გადაადგილება.
EN: A helicopter flies $40\ \text{km}$ north, then $30\ \text{km}$ east, then $10\ \text{km}$ south. Find the displacement.
HKA: შეკრიბეთ პროექციები ცალ-ცალკე.
HEN: Add the components separately.
SKA: $s_x = 30\ \text{კმ}$, $s_y = 40 - 10 = 30\ \text{კმ}$
$s = \sqrt{900 + 900} \approx 42{,}4\ \text{კმ}$, ჩრდილო-აღმოსავლეთით ($45°$)
SEN: $s_x = 30\ \text{km}$, $s_y = 40 - 10 = 30\ \text{km}$
$s = \sqrt{900 + 900} \approx 42.4\ \text{km}$, to the north-east ($45°$)
AKA: $\approx 42{,}4\ \text{კმ}$ ჩრდ.-აღმ.
AEN: $\approx 42.4\ \text{km}$ north-east

--- medium vectors
KA: წვიმის წვეთები ვერტიკალურად $10\ \text{მ/წმ}$-ით ვარდება. მანქანის გვერდით მინაზე კვალი ვერტიკალთან $30°$-იან კუთხეს ქმნის. რა სიჩქარით მოძრაობს მანქანა?
EN: Raindrops fall vertically at $10\ \text{m/s}$. On a car's side window the streaks make $30°$ with the vertical. How fast is the car going?
HKA: მანქანის მიმართ წვეთების სიჩქარის ჰორიზონტალური მდგენელი მანქანის სიჩქარეა.
HEN: The horizontal component of the drops' velocity relative to the car is the car's speed.
SKA: $\tan 30° = \dfrac{v}{10} \Rightarrow v = 10 \cdot 0{,}577 \approx 5{,}8\ \text{მ/წმ}$
SEN: $\tan 30° = \dfrac{v}{10} \Rightarrow v = 10 \cdot 0.577 \approx 5.8\ \text{m/s}$
AKA: $\approx 5{,}8\ \text{მ/წმ}$
AEN: $\approx 5.8\ \text{m/s}$

--- hard vectors
KA: მდინარის სიგანეა $100\ \text{მ}$, დინება $1\ \text{მ/წმ}$. მოცურავე წყლის მიმართ $2\ \text{მ/წმ}$-ით ცურავს. რა კუთხით უნდა იცუროს ნაპირის მიმართ, რომ ზუსტად მოპირდაპირე წერტილში გავიდეს? რა დრო დასჭირდება?
EN: A river is $100\ \text{m}$ wide with a $1\ \text{m/s}$ current. A swimmer swims at $2\ \text{m/s}$ relative to the water. At what angle to the bank must they swim to land directly opposite? How long does it take?
HKA: სიჩქარის მდგენელი დინების საწინააღმდეგოდ $1\ \text{მ/წმ}$ უნდა იყოს.
HEN: The component against the current must be $1\ \text{m/s}$.
SKA: $2\cos\alpha = 1 \Rightarrow \alpha = 60°$ ნაპირთან (დინების საწინააღმდეგოდ)
$v_{\perp} = 2\sin 60° = \sqrt 3 \approx 1{,}73\ \text{მ/წმ}$, $\ t = \dfrac{100}{1{,}73} \approx 58\ \text{წმ}$
SEN: $2\cos\alpha = 1 \Rightarrow \alpha = 60°$ to the bank (pointing upstream)
$v_{\perp} = 2\sin 60° = \sqrt 3 \approx 1.73\ \text{m/s}$, $\ t = \dfrac{100}{1.73} \approx 58\ \text{s}$
AKA: $60°$ ნაპირთან, დინების საწინააღმდეგოდ; $\approx 58\ \text{წმ}$
AEN: $60°$ to the bank, upstream; $\approx 58\ \text{s}$

--- hard vectors
KA: ორი მანქანა გზაჯვარედინიდან ერთდროულად გავიდა: ერთი ჩრდილოეთით $60\ \text{კმ/სთ}$-ით, მეორე აღმოსავლეთით $80\ \text{კმ/სთ}$-ით. რა სიჩქარით შორდებიან ერთმანეთს? რა მანძილი იქნება მათ შორის $30$ წუთის შემდეგ?
EN: Two cars leave a crossroads together: one north at $60\ \text{km/h}$, the other east at $80\ \text{km/h}$. How fast do they separate? How far apart are they after $30$ minutes?
HKA: ფარდობითი სიჩქარე $\vec v_1 - \vec v_2$.
HEN: Relative velocity $\vec v_1 - \vec v_2$.
SKA: $v_{\text{ფ}} = \sqrt{60^2 + 80^2} = 100\ \text{კმ/სთ}$
$d = 100 \cdot 0{,}5 = 50\ \text{კმ}$
SEN: $v_{\text{rel}} = \sqrt{60^2 + 80^2} = 100\ \text{km/h}$
$d = 100 \cdot 0.5 = 50\ \text{km}$
AKA: $100\ \text{კმ/სთ}$; $50\ \text{კმ}$
AEN: $100\ \text{km/h}$; $50\ \text{km}$

--- hard vectors
KA: ტვირთი ($10\ \text{კგ}$) ორ თოკზე ჰკიდია, თითოეული ვერტიკალთან $30°$-ს ქმნის. იპოვეთ თოკების დაჭიმულობა.
EN: A $10\ \text{kg}$ load hangs from two ropes, each at $30°$ to the vertical. Find the tension in each rope.
HKA: ვერტიკალური მდგენელების ჯამი $mg$-ის ტოლია.
HEN: The vertical components add up to $mg$.
SKA: $2T\cos 30° = mg \Rightarrow T = \dfrac{100}{2 \cdot 0{,}866} \approx 57{,}7\ \text{ნ}$
SEN: $2T\cos 30° = mg \Rightarrow T = \dfrac{100}{2 \cdot 0.866} \approx 57.7\ \text{N}$
AKA: $\approx 58\ \text{ნ}$
AEN: $\approx 58\ \text{N}$

--- hard vectors
KA: გემი $10\ \text{კმ/სთ}$-ით ჩრდილოეთით მიცურავს, ქარი $10\ \text{კმ/სთ}$-ით დასავლეთიდან (აღმოსავლეთისკენ) უბერავს. საით გაიშლება გემზე დროშა და რა სიჩქარით უბერავს ქარი გემის მიმართ?
EN: A ship sails north at $10\ \text{km/h}$; the wind blows from the west (towards the east) at $10\ \text{km/h}$. Which way does the flag on the ship point, and what is the wind speed relative to the ship?
HKA: $\vec v_{\text{ფ}} = \vec v_{\text{ქ}} - \vec v_{\text{გ}}$.
HEN: $\vec v_{\text{rel}} = \vec v_{\text{wind}} - \vec v_{\text{ship}}$.
SKA: გემის მიმართ ქარს აქვს აღმოსავლეთის მდგენელი $10$ და სამხრეთის $10\ \text{კმ/სთ}$.
$v = \sqrt{200} \approx 14{,}1\ \text{კმ/სთ}$; დროშა სამხრეთ-აღმოსავლეთისკენ გაიშლება.
SEN: Relative to the ship the wind has $10\ \text{km/h}$ eastward and $10\ \text{km/h}$ southward.
$v = \sqrt{200} \approx 14.1\ \text{km/h}$; the flag points south-east.
AKA: სამხრ.-აღმ.; $\approx 14{,}1\ \text{კმ/სთ}$
AEN: south-east; $\approx 14.1\ \text{km/h}$

--- easy accel
KA: მოტოციკლი უძრავი მდგომარეობიდან $5\ \text{წმ}$-ში $15\ \text{მ/წმ}$-ს აღწევს. იპოვეთ აჩქარება.
EN: A motorbike reaches $15\ \text{m/s}$ from rest in $5\ \text{s}$. Find its acceleration.
HKA: $a = \dfrac{v - v_0}{t}$.
HEN: $a = \dfrac{v - v_0}{t}$.
SKA: $a = \dfrac{15}{5} = 3\ \text{მ/წმ}^2$
SEN: $a = \dfrac{15}{5} = 3\ \text{m/s}^2$
AKA: $3\ \text{მ/წმ}^2$
AEN: $3\ \text{m/s}^2$

--- easy accel
KA: ავტობუსი $10\ \text{მ/წმ}$-იდან $0{,}5\ \text{მ/წმ}^2$ აჩქარებით $10\ \text{წმ}$-ის განმავლობაში აჩქარდა. რა სიჩქარე ექნება?
EN: A bus at $10\ \text{m/s}$ accelerates at $0.5\ \text{m/s}^2$ for $10\ \text{s}$. What is its final speed?
HKA: $v = v_0 + a t$.
HEN: $v = v_0 + a t$.
SKA: $v = 10 + 0{,}5 \cdot 10 = 15\ \text{მ/წმ}$
SEN: $v = 10 + 0.5 \cdot 10 = 15\ \text{m/s}$
AKA: $15\ \text{მ/წმ}$
AEN: $15\ \text{m/s}$

--- easy accel
KA: სხეული უძრაობიდან $4\ \text{მ/წმ}^2$ აჩქარებით $5\ \text{წმ}$ მოძრაობს. რა მანძილს გაივლის?
EN: A body starts from rest and accelerates at $4\ \text{m/s}^2$ for $5\ \text{s}$. How far does it go?
HKA: $s = \dfrac{a t^2}{2}$.
HEN: $s = \dfrac{a t^2}{2}$.
SKA: $s = \dfrac{4 \cdot 25}{2} = 50\ \text{მ}$
SEN: $s = \dfrac{4 \cdot 25}{2} = 50\ \text{m}$
AKA: $50\ \text{მ}$
AEN: $50\ \text{m}$

--- easy accel
KA: მანქანა $15\ \text{მ/წმ}$-იდან $3\ \text{წმ}$-ში ჩერდება. იპოვეთ აჩქარება. რას ნიშნავს მისი ნიშანი?
EN: A car at $15\ \text{m/s}$ stops in $3\ \text{s}$. Find its acceleration. What does its sign mean?
HKA: $a = \dfrac{0 - v_0}{t}$.
HEN: $a = \dfrac{0 - v_0}{t}$.
SKA: $a = \dfrac{0 - 15}{3} = -5\ \text{მ/წმ}^2$ — უარყოფითი ნიშანი ნიშნავს, რომ აჩქარება სიჩქარის საწინააღმდეგოდაა (შენელება).
SEN: $a = \dfrac{0 - 15}{3} = -5\ \text{m/s}^2$ — the minus sign means the acceleration opposes the velocity (slowing down).
AKA: $-5\ \text{მ/წმ}^2$
AEN: $-5\ \text{m/s}^2$

--- easy accel
KA: თვითმფრინავს ასაფრენად $60\ \text{მ/წმ}$ სჭირდება და $2\ \text{მ/წმ}^2$ აჩქარებით მოძრაობს. რამდენ ხანს გრძელდება გაქანება?
EN: A plane needs $60\ \text{m/s}$ to take off and accelerates at $2\ \text{m/s}^2$. How long is the take-off run?
HKA: $t = \dfrac{v}{a}$.
HEN: $t = \dfrac{v}{a}$.
SKA: $t = \dfrac{60}{2} = 30\ \text{წმ}$
SEN: $t = \dfrac{60}{2} = 30\ \text{s}$
AKA: $30\ \text{წმ}$
AEN: $30\ \text{s}$

--- easy accel
KA: წინა ამოცანის თვითმფრინავისთვის იპოვეთ ასაფრენი ზოლის მინიმალური სიგრძე ($v = 60\ \text{მ/წმ}$, $a = 2\ \text{მ/წმ}^2$).
EN: For a plane taking off ($v = 60\ \text{m/s}$, $a = 2\ \text{m/s}^2$ from rest), find the minimum runway length.
HKA: $s = \dfrac{v^2}{2a}$.
HEN: $s = \dfrac{v^2}{2a}$.
SKA: $s = \dfrac{3600}{4} = 900\ \text{მ}$
SEN: $s = \dfrac{3600}{4} = 900\ \text{m}$
AKA: $900\ \text{მ}$
AEN: $900\ \text{m}$

--- easy accel
KA: სხეულის სიჩქარე იცვლება კანონით $v = 10 - 2t$ (სი). იპოვეთ საწყისი სიჩქარე და აჩქარება. როდის გაჩერდება?
EN: A body's velocity is $v = 10 - 2t$ (SI). Find the initial velocity and the acceleration. When does it stop?
HKA: შეადარეთ $v = v_0 + a t$-ს.
HEN: Compare with $v = v_0 + a t$.
SKA: $v_0 = 10\ \text{მ/წმ}$, $a = -2\ \text{მ/წმ}^2$
$0 = 10 - 2t \Rightarrow t = 5\ \text{წმ}$
SEN: $v_0 = 10\ \text{m/s}$, $a = -2\ \text{m/s}^2$
$0 = 10 - 2t \Rightarrow t = 5\ \text{s}$
AKA: $10\ \text{მ/წმ}$; $-2\ \text{მ/წმ}^2$; $5\ \text{წმ}$-ზე
AEN: $10\ \text{m/s}$; $-2\ \text{m/s}^2$; at $5\ \text{s}$

--- easy accel
KA: რა მანძილს გაივლის სხეული $2$ წამში, თუ საწყისი სიჩქარეა $3\ \text{მ/წმ}$, აჩქარება $1\ \text{მ/წმ}^2$?
EN: How far does a body go in $2\ \text{s}$ with initial speed $3\ \text{m/s}$ and acceleration $1\ \text{m/s}^2$?
HKA: $s = v_0 t + \dfrac{a t^2}{2}$.
HEN: $s = v_0 t + \dfrac{a t^2}{2}$.
SKA: $s = 3 \cdot 2 + \dfrac{1 \cdot 4}{2} = 6 + 2 = 8\ \text{მ}$
SEN: $s = 3 \cdot 2 + \dfrac{1 \cdot 4}{2} = 6 + 2 = 8\ \text{m}$
AKA: $8\ \text{მ}$
AEN: $8\ \text{m}$

--- easy accel
KA: რომელ მოძრაობას ეწოდება თანაბარაჩქარებული? მოიყვანეთ მაგალითი.
EN: What is uniformly accelerated motion? Give an example.
HKA: რა რჩება მუდმივი?
HEN: What stays constant?
SKA: მოძრაობა, რომლის დროსაც სიჩქარე ნებისმიერ ტოლ დროის შუალედებში ერთნაირად იცვლება, ე.ი. აჩქარება მუდმივია.
მაგალითი: სხეულის თავისუფალი ვარდნა; მანქანის თანაბარი გაქანება.
SEN: Motion in which the velocity changes by equal amounts in equal time intervals, i.e. the acceleration is constant.
Example: free fall; a car speeding up steadily.
AKA: მუდმივი აჩქარებით მოძრაობა (მაგ., თავისუფალი ვარდნა)
AEN: motion with constant acceleration (e.g. free fall)

--- easy accel
KA: მატარებლის სიჩქარე $54\ \text{კმ/სთ}$-დან $36\ \text{კმ/სთ}$-მდე $20\ \text{წმ}$-ში შემცირდა. იპოვეთ აჩქარება.
EN: A train slows from $54\ \text{km/h}$ to $36\ \text{km/h}$ in $20\ \text{s}$. Find its acceleration.
HKA: ჯერ სიჩქარეები მ/წმ-ში.
HEN: Convert the speeds to m/s first.
SKA: $v_0 = 15\ \text{მ/წმ}$, $v = 10\ \text{მ/წმ}$
$a = \dfrac{10 - 15}{20} = -0{,}25\ \text{მ/წმ}^2$
SEN: $v_0 = 15\ \text{m/s}$, $v = 10\ \text{m/s}$
$a = \dfrac{10 - 15}{20} = -0.25\ \text{m/s}^2$
AKA: $-0{,}25\ \text{მ/წმ}^2$
AEN: $-0.25\ \text{m/s}^2$

--- easy accel
KA: სხეული უძრაობიდან $2\ \text{მ/წმ}^2$-ით მოძრაობს. რა სიჩქარე ექნება $25\ \text{მ}$-ის გავლის შემდეგ?
EN: A body starts from rest at $2\ \text{m/s}^2$. What is its speed after $25\ \text{m}$?
HKA: $v^2 = 2 a s$.
HEN: $v^2 = 2 a s$.
SKA: $v = \sqrt{2 \cdot 2 \cdot 25} = 10\ \text{მ/წმ}$
SEN: $v = \sqrt{2 \cdot 2 \cdot 25} = 10\ \text{m/s}$
AKA: $10\ \text{მ/წმ}$
AEN: $10\ \text{m/s}$

--- easy accel
KA: თანაბარაჩქარებულად მოძრავი სხეულის საწყისი სიჩქარეა $2\ \text{მ/წმ}$, საბოლოო — $8\ \text{მ/წმ}$. იპოვეთ საშუალო სიჩქარე.
EN: A uniformly accelerating body goes from $2\ \text{m/s}$ to $8\ \text{m/s}$. Find its average speed.
HKA: თანაბარაჩქარებული მოძრაობისას $v_{\text{საშ}} = \dfrac{v_0 + v}{2}$.
HEN: For uniform acceleration $v_{\text{avg}} = \dfrac{v_0 + v}{2}$.
SKA: $v_{\text{საშ}} = \dfrac{2 + 8}{2} = 5\ \text{მ/წმ}$
SEN: $v_{\text{avg}} = \dfrac{2 + 8}{2} = 5\ \text{m/s}$
AKA: $5\ \text{მ/წმ}$
AEN: $5\ \text{m/s}$

--- easy accel
KA: სპრინტერი სტარტიდან $1{,}5\ \text{წმ}$-ში $9\ \text{მ/წმ}$-ს აღწევს. იპოვეთ აჩქარება და ამ დროში გარბენილი მანძილი.
EN: A sprinter reaches $9\ \text{m/s}$ in $1.5\ \text{s}$ from the start. Find the acceleration and the distance covered in that time.
HKA: $a = \dfrac{v}{t}$, $s = \dfrac{v t}{2}$.
HEN: $a = \dfrac{v}{t}$, $s = \dfrac{v t}{2}$.
SKA: $a = \dfrac{9}{1{,}5} = 6\ \text{მ/წმ}^2$
$s = \dfrac{9 \cdot 1{,}5}{2} = 6{,}75\ \text{მ}$
SEN: $a = \dfrac{9}{1.5} = 6\ \text{m/s}^2$
$s = \dfrac{9 \cdot 1.5}{2} = 6.75\ \text{m}$
AKA: $6\ \text{მ/წმ}^2$; $6{,}75\ \text{მ}$
AEN: $6\ \text{m/s}^2$; $6.75\ \text{m}$

--- easy accel
KA: მანქანის სიჩქარის გრაფიკი $v(t)$ სწორი ხაზია $(0;\ 0)$-დან $(10\ \text{წმ};\ 20\ \text{მ/წმ})$-მდე. იპოვეთ აჩქარება და $10\ \text{წმ}$-ში გავლილი მანძილი (გრაფიკის ქვეშ მოთავსებული ფართობი).
EN: A car's $v(t)$ graph is a straight line from $(0;\ 0)$ to $(10\ \text{s};\ 20\ \text{m/s})$. Find the acceleration and the distance in $10\ \text{s}$ (the area under the graph).
HKA: დახრა — აჩქარება; ფართობი — გზა.
HEN: The slope is the acceleration; the area is the distance.
SKA: $a = \dfrac{20}{10} = 2\ \text{მ/წმ}^2$
$s = \dfrac{1}{2} \cdot 10 \cdot 20 = 100\ \text{მ}$
SEN: $a = \dfrac{20}{10} = 2\ \text{m/s}^2$
$s = \dfrac{1}{2} \cdot 10 \cdot 20 = 100\ \text{m}$
AKA: $2\ \text{მ/წმ}^2$; $100\ \text{მ}$
AEN: $2\ \text{m/s}^2$; $100\ \text{m}$

--- medium accel
KA: მანქანა $25\ \text{მ/წმ}$-იდან $5\ \text{მ/წმ}^2$-ით ამუხრუჭებს. რა მანძილზე გაჩერდება? რამდენ ხანში?
EN: A car brakes from $25\ \text{m/s}$ at $5\ \text{m/s}^2$. How far and how long does it take to stop?
HKA: $s = \dfrac{v_0^2}{2a}$, $t = \dfrac{v_0}{a}$.
HEN: $s = \dfrac{v_0^2}{2a}$, $t = \dfrac{v_0}{a}$.
SKA: $s = \dfrac{625}{10} = 62{,}5\ \text{მ}$, $\ t = 5\ \text{წმ}$
SEN: $s = \dfrac{625}{10} = 62.5\ \text{m}$, $\ t = 5\ \text{s}$
AKA: $62{,}5\ \text{მ}$; $5\ \text{წმ}$
AEN: $62.5\ \text{m}$; $5\ \text{s}$

--- medium accel
KA: სხეული უძრაობიდან თანაბარაჩქარებულად მოძრაობს და მესამე წამში $10\ \text{მ}$-ს გადის. იპოვეთ აჩქარება.
EN: A body starts from rest with constant acceleration and covers $10\ \text{m}$ during the third second. Find the acceleration.
HKA: მე-$n$ წამში გავლილი გზა: $s_n = \dfrac{a(2n - 1)}{2}$.
HEN: Distance in the $n$-th second: $s_n = \dfrac{a(2n - 1)}{2}$.
SKA: $s_3 = \dfrac{a \cdot 5}{2} = 10 \Rightarrow a = 4\ \text{მ/წმ}^2$
SEN: $s_3 = \dfrac{a \cdot 5}{2} = 10 \Rightarrow a = 4\ \text{m/s}^2$
AKA: $4\ \text{მ/წმ}^2$
AEN: $4\ \text{m/s}^2$

--- medium accel
KA: სხეულის კოორდინატი $x = 5 + 4t - t^2$ (სი). იპოვეთ $x_0$, $v_0$ და $a$. როდის გაჩერდება და სად?
EN: A body's coordinate is $x = 5 + 4t - t^2$ (SI). Find $x_0$, $v_0$ and $a$. When and where does it stop?
HKA: $x = x_0 + v_0 t + \dfrac{a t^2}{2}$.
HEN: $x = x_0 + v_0 t + \dfrac{a t^2}{2}$.
SKA: $x_0 = 5\ \text{მ}$, $v_0 = 4\ \text{მ/წმ}$, $a = -2\ \text{მ/წმ}^2$
$v = 4 - 2t = 0 \Rightarrow t = 2\ \text{წმ}$, $\ x = 5 + 8 - 4 = 9\ \text{მ}$
SEN: $x_0 = 5\ \text{m}$, $v_0 = 4\ \text{m/s}$, $a = -2\ \text{m/s}^2$
$v = 4 - 2t = 0 \Rightarrow t = 2\ \text{s}$, $\ x = 5 + 8 - 4 = 9\ \text{m}$
AKA: $5\ \text{მ}$; $4\ \text{მ/წმ}$; $-2\ \text{მ/წმ}^2$; $t = 2\ \text{წმ}$, $x = 9\ \text{მ}$
AEN: $5\ \text{m}$; $4\ \text{m/s}$; $-2\ \text{m/s}^2$; $t = 2\ \text{s}$, $x = 9\ \text{m}$

--- medium accel
KA: მანქანამ $100\ \text{მ}$ გაიარა და სიჩქარე $10$-დან $20\ \text{მ/წმ}$-მდე გაზარდა. იპოვეთ აჩქარება და დრო.
EN: Over $100\ \text{m}$ a car speeds up from $10$ to $20\ \text{m/s}$. Find the acceleration and the time.
HKA: $v^2 - v_0^2 = 2 a s$.
HEN: $v^2 - v_0^2 = 2 a s$.
SKA: $a = \dfrac{400 - 100}{200} = 1{,}5\ \text{მ/წმ}^2$
$t = \dfrac{20 - 10}{1{,}5} \approx 6{,}7\ \text{წმ}$
SEN: $a = \dfrac{400 - 100}{200} = 1.5\ \text{m/s}^2$
$t = \dfrac{20 - 10}{1.5} \approx 6.7\ \text{s}$
AKA: $1{,}5\ \text{მ/წმ}^2$; $\approx 6{,}7\ \text{წმ}$
AEN: $1.5\ \text{m/s}^2$; $\approx 6.7\ \text{s}$

--- medium accel
KA: ტყვია $600\ \text{მ/წმ}$-ით ხვდება მიწაყრილს და $30\ \text{სმ}$-ზე ჩერდება. იპოვეთ შენელება და მოძრაობის დრო მიწაში.
EN: A bullet hits an earth bank at $600\ \text{m/s}$ and stops in $30\ \text{cm}$. Find the deceleration and the time it takes.
HKA: $a = \dfrac{v^2}{2s}$, $t = \dfrac{2s}{v}$.
HEN: $a = \dfrac{v^2}{2s}$, $t = \dfrac{2s}{v}$.
SKA: $a = \dfrac{360\,000}{0{,}6} = 6 \times 10^5\ \text{მ/წმ}^2$
$t = \dfrac{0{,}6}{600} = 10^{-3}\ \text{წმ}$
SEN: $a = \dfrac{360\,000}{0.6} = 6 \times 10^5\ \text{m/s}^2$
$t = \dfrac{0.6}{600} = 10^{-3}\ \text{s}$
AKA: $6 \times 10^5\ \text{მ/წმ}^2$; $1\ \text{მწმ}$
AEN: $6 \times 10^5\ \text{m/s}^2$; $1\ \text{ms}$

--- medium accel
KA: სხეული უძრაობიდან $10\ \text{წმ}$-ში $100\ \text{მ}$-ს გადის. რა მანძილს გაივლის ის პირველ $5$ წამში?
EN: A body starts from rest and covers $100\ \text{m}$ in $10\ \text{s}$. How far does it go in the first $5\ \text{s}$?
HKA: $s \sim t^2$.
HEN: $s \sim t^2$.
SKA: $s_5 = 100 \cdot \left(\dfrac{5}{10}\right)^2 = 25\ \text{მ}$
SEN: $s_5 = 100 \cdot \left(\dfrac{5}{10}\right)^2 = 25\ \text{m}$
AKA: $25\ \text{მ}$
AEN: $25\ \text{m}$

--- medium accel
KA: ორი მანქანა ერთ წერტილიდან ერთდროულად გავიდა: ერთი $10\ \text{მ/წმ}$ მუდმივი სიჩქარით, მეორე უძრაობიდან $1\ \text{მ/წმ}^2$ აჩქარებით. როდის და სად დაეწევა მეორე პირველს?
EN: Two cars leave one point together: one at a steady $10\ \text{m/s}$, the other from rest at $1\ \text{m/s}^2$. When and where does the second catch the first?
HKA: $10t = \dfrac{t^2}{2}$.
HEN: $10t = \dfrac{t^2}{2}$.
SKA: $t = 20\ \text{წმ}$, $\ s = 200\ \text{მ}$ (მაშინ მეორის სიჩქარე $20\ \text{მ/წმ}$-ია)
SEN: $t = 20\ \text{s}$, $\ s = 200\ \text{m}$ (the second car is then at $20\ \text{m/s}$)
AKA: $20\ \text{წმ}$; $200\ \text{მ}$
AEN: $20\ \text{s}$; $200\ \text{m}$

--- medium accel
KA: მატარებელი სადგურთან მიახლოებისას $20\ \text{მ/წმ}$-იდან $0{,}4\ \text{მ/წმ}^2$-ით ამუხრუჭებს. სადგურიდან რა მანძილზე უნდა დაიწყოს დამუხრუჭება? რა სიჩქარე ექნება $375\ \text{მ}$-ის შემდეგ?
EN: A train at $20\ \text{m/s}$ approaching a station brakes at $0.4\ \text{m/s}^2$. How far from the station must it start braking? What is its speed after $375\ \text{m}$?
HKA: $s = \dfrac{v_0^2}{2a}$; $v^2 = v_0^2 - 2 a s$.
HEN: $s = \dfrac{v_0^2}{2a}$; $v^2 = v_0^2 - 2 a s$.
SKA: $s = \dfrac{400}{0{,}8} = 500\ \text{მ}$
$v^2 = 400 - 0{,}8 \cdot 375 = 100 \Rightarrow v = 10\ \text{მ/წმ}$
SEN: $s = \dfrac{400}{0.8} = 500\ \text{m}$
$v^2 = 400 - 0.8 \cdot 375 = 100 \Rightarrow v = 10\ \text{m/s}$
AKA: $500\ \text{მ}$; $10\ \text{მ/წმ}$
AEN: $500\ \text{m}$; $10\ \text{m/s}$

--- medium accel
KA: სხეული უძრაობიდან თანაბარაჩქარებულად მოძრაობს. როგორ შეეფარდება ერთმანეთს პირველ, მეორე და მესამე წამში გავლილი გზები?
EN: A body starts from rest with constant acceleration. What is the ratio of the distances covered in the 1st, 2nd and 3rd seconds?
HKA: $s_n \sim (2n - 1)$.
HEN: $s_n \sim (2n - 1)$.
SKA: $s_1 : s_2 : s_3 = 1 : 3 : 5$ (კენტი რიცხვების კანონი, გალილეი).
SEN: $s_1 : s_2 : s_3 = 1 : 3 : 5$ (Galileo's odd-number rule).
AKA: $1 : 3 : 5$
AEN: $1 : 3 : 5$

--- medium accel
KA: მანქანა $72\ \text{კმ/სთ}$-ით მოძრაობს. მძღოლის რეაქციის დროა $0{,}8\ \text{წმ}$, დამუხრუჭების შენელება — $8\ \text{მ/წმ}^2$. იპოვეთ გაჩერების სრული მანძილი.
EN: A car moves at $72\ \text{km/h}$. The driver's reaction time is $0.8\ \text{s}$ and the braking deceleration is $8\ \text{m/s}^2$. Find the total stopping distance.
HKA: რეაქციის მანძილი + სამუხრუჭე მანძილი.
HEN: Reaction distance + braking distance.
SKA: $s_1 = 20 \cdot 0{,}8 = 16\ \text{მ}$
$s_2 = \dfrac{400}{16} = 25\ \text{მ}$
$s = 41\ \text{მ}$
SEN: $s_1 = 20 \cdot 0.8 = 16\ \text{m}$
$s_2 = \dfrac{400}{16} = 25\ \text{m}$
$s = 41\ \text{m}$
AKA: $41\ \text{მ}$
AEN: $41\ \text{m}$

--- medium accel
KA: $v(t)$ გრაფიკზე: $0$-დან $4\ \text{წმ}$-მდე სიჩქარე $0$-დან $8\ \text{მ/წმ}$-მდე იზრდება, $4$-დან $10\ \text{წმ}$-მდე მუდმივია, $10$-დან $12\ \text{წმ}$-მდე ნულამდე ეცემა. იპოვეთ სრული გზა და საშუალო სიჩქარე.
EN: On a $v(t)$ graph the speed rises from $0$ to $8\ \text{m/s}$ over $0$–$4\ \text{s}$, is constant from $4$ to $10\ \text{s}$, and falls to zero from $10$ to $12\ \text{s}$. Find the total distance and the average speed.
HKA: გზა — ტრაპეციის ფართობი.
HEN: The distance is the area of the trapezium.
SKA: $s = \dfrac{1}{2} \cdot 4 \cdot 8 + 6 \cdot 8 + \dfrac{1}{2} \cdot 2 \cdot 8 = 16 + 48 + 8 = 72\ \text{მ}$
$v_{\text{საშ}} = \dfrac{72}{12} = 6\ \text{მ/წმ}$
SEN: $s = \dfrac{1}{2} \cdot 4 \cdot 8 + 6 \cdot 8 + \dfrac{1}{2} \cdot 2 \cdot 8 = 16 + 48 + 8 = 72\ \text{m}$
$v_{\text{avg}} = \dfrac{72}{12} = 6\ \text{m/s}$
AKA: $72\ \text{მ}$; $6\ \text{მ/წმ}$
AEN: $72\ \text{m}$; $6\ \text{m/s}$

--- medium accel
KA: სხეულმა $5\ \text{წმ}$-ში $40\ \text{მ}$ გაიარა, საბოლოო სიჩქარე $12\ \text{მ/წმ}$-ია. იპოვეთ საწყისი სიჩქარე და აჩქარება.
EN: A body covers $40\ \text{m}$ in $5\ \text{s}$, ending at $12\ \text{m/s}$. Find the initial speed and the acceleration.
HKA: $s = \dfrac{v_0 + v}{2} t$.
HEN: $s = \dfrac{v_0 + v}{2} t$.
SKA: $40 = \dfrac{v_0 + 12}{2} \cdot 5 \Rightarrow v_0 = 4\ \text{მ/წმ}$
$a = \dfrac{12 - 4}{5} = 1{,}6\ \text{მ/წმ}^2$
SEN: $40 = \dfrac{v_0 + 12}{2} \cdot 5 \Rightarrow v_0 = 4\ \text{m/s}$
$a = \dfrac{12 - 4}{5} = 1.6\ \text{m/s}^2$
AKA: $4\ \text{მ/წმ}$; $1{,}6\ \text{მ/წმ}^2$
AEN: $4\ \text{m/s}$; $1.6\ \text{m/s}^2$

--- medium accel
KA: სამუხრუჭე მანძილი $v$ სიჩქარისას $20\ \text{მ}$-ია. რა იქნება ის $2v$ სიჩქარისას (შენელება იგივეა)?
EN: The braking distance at speed $v$ is $20\ \text{m}$. What is it at $2v$ (same deceleration)?
HKA: $s \sim v^2$.
HEN: $s \sim v^2$.
SKA: $s_2 = 20 \cdot 2^2 = 80\ \text{მ}$
SEN: $s_2 = 20 \cdot 2^2 = 80\ \text{m}$
AKA: $80\ \text{მ}$
AEN: $80\ \text{m}$

--- medium accel
KA: სასრიალოდან უძრაობიდან დაწყებული მარხილი პირველ $2$ წამში $3\ \text{მ}$-ს გადის. რა მანძილს გაივლის $6$ წამში? რა სიჩქარე ექნება?
EN: A sled starting from rest covers $3\ \text{m}$ in the first $2\ \text{s}$ down a hill. How far does it go in $6\ \text{s}$? What is its speed then?
HKA: იპოვეთ $a$.
HEN: Find $a$.
SKA: $a = \dfrac{2 \cdot 3}{4} = 1{,}5\ \text{მ/წმ}^2$
$s = \dfrac{1{,}5 \cdot 36}{2} = 27\ \text{მ}$, $\ v = 1{,}5 \cdot 6 = 9\ \text{მ/წმ}$
SEN: $a = \dfrac{2 \cdot 3}{4} = 1.5\ \text{m/s}^2$
$s = \dfrac{1.5 \cdot 36}{2} = 27\ \text{m}$, $\ v = 1.5 \cdot 6 = 9\ \text{m/s}$
AKA: $27\ \text{მ}$; $9\ \text{მ/წმ}$
AEN: $27\ \text{m}$; $9\ \text{m/s}$

--- medium accel
KA: მოტოციკლისტი შუქნიშანთან უძრავადაა. მწვანე ანთებისთანავე $3\ \text{მ/წმ}^2$-ით აჩქარდება. ამ დროს მის გვერდით $12\ \text{მ/წმ}$-ით ჩაუვლის სატვირთო. რამდენ წამში დაეწევა მოტოციკლისტი სატვირთოს? რა იქნება უდიდესი მანძილი მათ შორის?
EN: A motorcyclist waits at a light. When it turns green they accelerate at $3\ \text{m/s}^2$, just as a lorry passes at $12\ \text{m/s}$. When does the motorcyclist catch the lorry? What is the largest gap between them?
HKA: უდიდესი მანძილი, როცა სიჩქარეები ტოლდება.
HEN: The gap is largest when the speeds are equal.
SKA: $12t = 1{,}5 t^2 \Rightarrow t = 8\ \text{წმ}$
$v_{\text{მ}} = 12$ როცა $t = 4\ \text{წმ}$: $d = 48 - 24 = 24\ \text{მ}$
SEN: $12t = 1.5 t^2 \Rightarrow t = 8\ \text{s}$
$v_{\text{m}} = 12$ at $t = 4\ \text{s}$: $d = 48 - 24 = 24\ \text{m}$
AKA: $8\ \text{წმ}$; $24\ \text{მ}$
AEN: $8\ \text{s}$; $24\ \text{m}$

--- medium accel
KA: მატარებელი $1\ \text{მ/წმ}^2$-ით აჩქარდა $20\ \text{მ/წმ}$-მდე, შემდეგ თანაბრად იარა $1\ \text{წთ}$, შემდეგ $2\ \text{მ/წმ}^2$-ით გაჩერდა. იპოვეთ გავლილი მანძილი.
EN: A train accelerates at $1\ \text{m/s}^2$ to $20\ \text{m/s}$, runs steadily for $1\ \text{min}$, then stops at $2\ \text{m/s}^2$. Find the total distance.
HKA: სამი ეტაპი.
HEN: Three stages.
SKA: $s_1 = \dfrac{400}{2} = 200\ \text{მ}$, $\ s_2 = 20 \cdot 60 = 1200\ \text{მ}$, $\ s_3 = \dfrac{400}{4} = 100\ \text{მ}$
$s = 1500\ \text{მ}$
SEN: $s_1 = \dfrac{400}{2} = 200\ \text{m}$, $\ s_2 = 20 \cdot 60 = 1200\ \text{m}$, $\ s_3 = \dfrac{400}{4} = 100\ \text{m}$
$s = 1500\ \text{m}$
AKA: $1{,}5\ \text{კმ}$
AEN: $1.5\ \text{km}$

--- hard accel
KA: სხეული თანაბარაჩქარებულად მოძრაობს. ორი თანმიმდევრული $4$-წამიანი შუალედის განმავლობაში $24\ \text{მ}$ და $64\ \text{მ}$ გაიარა. იპოვეთ საწყისი სიჩქარე და აჩქარება.
EN: A uniformly accelerating body covers $24\ \text{m}$ and $64\ \text{m}$ in two successive $4\ \text{s}$ intervals. Find the initial speed and the acceleration.
HKA: $s_2 - s_1 = a T^2$.
HEN: $s_2 - s_1 = a T^2$.
SKA: $a = \dfrac{64 - 24}{16} = 2{,}5\ \text{მ/წმ}^2$
$24 = 4 v_0 + \dfrac{2{,}5 \cdot 16}{2} \Rightarrow v_0 = 1\ \text{მ/წმ}$
SEN: $a = \dfrac{64 - 24}{16} = 2.5\ \text{m/s}^2$
$24 = 4 v_0 + \dfrac{2.5 \cdot 16}{2} \Rightarrow v_0 = 1\ \text{m/s}$
AKA: $1\ \text{მ/წმ}$; $2{,}5\ \text{მ/წმ}^2$
AEN: $1\ \text{m/s}$; $2.5\ \text{m/s}^2$

--- hard accel
KA: ორი მატარებელი ერთ ლიანდაგზე ერთმანეთისკენ მოძრაობს $20\ \text{მ/წმ}$ და $10\ \text{მ/წმ}$-ით. მათ შორის $500\ \text{მ}$-ის მანძილზე მემანქანეები ერთდროულად ამუხრუჭებენ ერთნაირი შენელებით. რა მინიმალური შენელება სჭირდებათ შეჯახების ასაცილებლად?
EN: Two trains on one track approach each other at $20\ \text{m/s}$ and $10\ \text{m/s}$. When $500\ \text{m}$ apart, both drivers brake with the same deceleration. What minimum deceleration avoids a collision?
HKA: სამუხრუჭე მანძილების ჯამი $\le 500\ \text{მ}$.
HEN: The sum of the braking distances must be $\le 500\ \text{m}$.
SKA: $\dfrac{400}{2a} + \dfrac{100}{2a} = 500 \Rightarrow \dfrac{250}{a} = 500$
$a = 0{,}5\ \text{მ/წმ}^2$
SEN: $\dfrac{400}{2a} + \dfrac{100}{2a} = 500 \Rightarrow \dfrac{250}{a} = 500$
$a = 0.5\ \text{m/s}^2$
AKA: $0{,}5\ \text{მ/წმ}^2$
AEN: $0.5\ \text{m/s}^2$

--- hard accel
KA: ლიფტი ჯერ $1\ \text{მ/წმ}^2$-ით აჩქარდება $2\ \text{მ/წმ}$-მდე, მოძრაობს თანაბრად და ბოლოს იმავე შენელებით ჩერდება. მთელი ასვლა $40\ \text{მ}$-ია. რამდენ ხანს გრძელდება?
EN: A lift accelerates at $1\ \text{m/s}^2$ to $2\ \text{m/s}$, runs steadily, then stops with the same deceleration. The whole climb is $40\ \text{m}$. How long does it take?
HKA: აჩქარება და შენელება $2$ წამიანია, თითოეულზე $2\ \text{მ}$.
HEN: Speeding up and slowing down each take $2\ \text{s}$ and $2\ \text{m}$.
SKA: $t_1 = t_3 = 2\ \text{წმ}$, $s_1 = s_3 = 2\ \text{მ}$
$s_2 = 36\ \text{მ}$, $t_2 = 18\ \text{წმ}$
$t = 22\ \text{წმ}$
SEN: $t_1 = t_3 = 2\ \text{s}$, $s_1 = s_3 = 2\ \text{m}$
$s_2 = 36\ \text{m}$, $t_2 = 18\ \text{s}$
$t = 22\ \text{s}$
AKA: $22\ \text{წმ}$
AEN: $22\ \text{s}$

--- hard accel
KA: სხეული უძრაობიდან თანაბარაჩქარებულად მოძრაობს. ბოლო წამში მან მთელი გზის $\dfrac{19}{100}$ გაიარა. რამდენ ხანს მოძრაობდა?
EN: A body starts from rest with constant acceleration. In the last second it covers $\dfrac{19}{100}$ of the total distance. How long did it move?
HKA: $\dfrac{t^2 - (t - 1)^2}{t^2} = 0{,}19$.
HEN: $\dfrac{t^2 - (t - 1)^2}{t^2} = 0.19$.
SKA: $2t - 1 = 0{,}19 t^2 \Rightarrow 0{,}19 t^2 - 2t + 1 = 0$
$t = \dfrac{2 \pm \sqrt{4 - 0{,}76}}{0{,}38} = \dfrac{2 \pm 1{,}8}{0{,}38}$ — $t = 10\ \text{წმ}$ (მეორე ფესვი $< 1$, არ გამოდგება)
SEN: $2t - 1 = 0.19 t^2 \Rightarrow 0.19 t^2 - 2t + 1 = 0$
$t = \dfrac{2 \pm \sqrt{4 - 0.76}}{0.38} = \dfrac{2 \pm 1.8}{0.38}$ — $t = 10\ \text{s}$ (the other root is $< 1$, rejected)
AKA: $10\ \text{წმ}$
AEN: $10\ \text{s}$

--- easy freefall
KA: ქვა ჭაში ჩააგდეს და $3\ \text{წმ}$-ში წყალს დაეცა. რა სიღრმეზეა წყალი? (ხმის დრო უგულებელყავით)
EN: A stone dropped down a well hits the water after $3\ \text{s}$. How deep is the water? (Ignore the sound's travel time.)
HKA: $h = \dfrac{g t^2}{2}$.
HEN: $h = \dfrac{g t^2}{2}$.
SKA: $h = \dfrac{10 \cdot 9}{2} = 45\ \text{მ}$
SEN: $h = \dfrac{10 \cdot 9}{2} = 45\ \text{m}$
AKA: $45\ \text{მ}$
AEN: $45\ \text{m}$

--- easy freefall
KA: სხეული $20\ \text{მ}$ სიმაღლიდან ვარდება. რა სიჩქარით დაეცემა მიწას?
EN: A body falls from $20\ \text{m}$. At what speed does it hit the ground?
HKA: $v = \sqrt{2 g h}$.
HEN: $v = \sqrt{2 g h}$.
SKA: $v = \sqrt{400} = 20\ \text{მ/წმ}$
SEN: $v = \sqrt{400} = 20\ \text{m/s}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- easy freefall
KA: ბურთი ზემოთ $10\ \text{მ/წმ}$-ით აისროლეს. რა სიმაღლეზე ავა და რამდენ ხანში?
EN: A ball is thrown up at $10\ \text{m/s}$. How high does it rise and how long does it take?
HKA: $h = \dfrac{v_0^2}{2g}$, $t = \dfrac{v_0}{g}$.
HEN: $h = \dfrac{v_0^2}{2g}$, $t = \dfrac{v_0}{g}$.
SKA: $h = 5\ \text{მ}$, $\ t = 1\ \text{წმ}$
SEN: $h = 5\ \text{m}$, $\ t = 1\ \text{s}$
AKA: $5\ \text{მ}$; $1\ \text{წმ}$
AEN: $5\ \text{m}$; $1\ \text{s}$

--- easy freefall
KA: ვაკუუმიან მილში ბუმბული და მონეტა ერთდროულად ჩამოაგდეს. რომელი დაეცემა პირველი? ჰაერში?
EN: A feather and a coin are dropped together in a tube with the air pumped out. Which lands first? And in air?
HKA: ვაკუუმში ყველა სხეული ერთი აჩქარებით ვარდება.
HEN: In a vacuum all bodies fall with the same acceleration.
SKA: ვაკუუმში — ერთდროულად ($a = g$ ორივესთვის).
ჰაერში მონეტა პირველი დაეცემა — ბუმბულზე ჰაერის წინაღობა მის წონასთან შედარებით დიდია.
SEN: In a vacuum — together ($a = g$ for both).
In air the coin lands first — air resistance is large compared with the feather's weight.
AKA: ვაკუუმში ერთად; ჰაერში მონეტა
AEN: together in a vacuum; the coin first in air

--- easy freefall
KA: თავისუფლად ვარდნილი სხეული რა მანძილს გადის პირველ წამში? მეორე წამში?
EN: How far does a freely falling body fall in the first second? In the second second?
HKA: $s_n = \dfrac{g(2n - 1)}{2}$.
HEN: $s_n = \dfrac{g(2n - 1)}{2}$.
SKA: $s_1 = 5\ \text{მ}$, $\ s_2 = 15\ \text{მ}$
SEN: $s_1 = 5\ \text{m}$, $\ s_2 = 15\ \text{m}$
AKA: $5\ \text{მ}$; $15\ \text{მ}$
AEN: $5\ \text{m}$; $15\ \text{m}$

--- easy freefall
KA: ქვა $5\ \text{მ}$ სიმაღლიდან ჰორიზონტალურად $6\ \text{მ/წმ}$-ით ისროლეს. რამდენ ხანს იფრენს და რა მანძილზე დაეცემა?
EN: A stone is thrown horizontally at $6\ \text{m/s}$ from a height of $5\ \text{m}$. How long does it fly and how far does it land?
HKA: ვარდნის დრო სიმაღლით განისაზღვრება.
HEN: The fall time is set by the height.
SKA: $t = \sqrt{\dfrac{2h}{g}} = 1\ \text{წმ}$, $\ L = 6 \cdot 1 = 6\ \text{მ}$
SEN: $t = \sqrt{\dfrac{2h}{g}} = 1\ \text{s}$, $\ L = 6 \cdot 1 = 6\ \text{m}$
AKA: $1\ \text{წმ}$; $6\ \text{მ}$
AEN: $1\ \text{s}$; $6\ \text{m}$

--- easy freefall
KA: ზემოთ ნასროლი სხეული $4\ \text{წმ}$-ის შემდეგ დაბრუნდა. რა საწყისი სიჩქარით ისროლეს?
EN: A body thrown up returns after $4\ \text{s}$. What was its launch speed?
HKA: ასვლის დრო ნახევარია: $2\ \text{წმ}$.
HEN: The time up is half: $2\ \text{s}$.
SKA: $v_0 = g \cdot 2 = 20\ \text{მ/წმ}$
SEN: $v_0 = g \cdot 2 = 20\ \text{m/s}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- easy freefall
KA: რა სიჩქარე აქვს ზემოთ ნასროლ სხეულს ტრაექტორიის უმაღლეს წერტილში? რას უდრის მისი აჩქარება ამ წერტილში?
EN: What is the speed of a body thrown straight up at the top of its path? What is its acceleration there?
HKA: აჩქარება ყოველთვის $g$-ია.
HEN: The acceleration is always $g$.
SKA: უმაღლეს წერტილში $v = 0$, მაგრამ აჩქარება $g = 10\ \text{მ/წმ}^2$-ია (ქვემოთ) — სხეული მაშინვე ვარდნას იწყებს.
SEN: At the top $v = 0$, but the acceleration is still $g = 10\ \text{m/s}^2$ (down) — the body starts falling at once.
AKA: $v = 0$; $a = g$ ქვემოთ
AEN: $v = 0$; $a = g$ downwards

--- easy freefall
KA: ვაშლი ხიდან $0{,}8\ \text{წმ}$-ში ჩამოვარდა. რა სიმაღლიდან?
EN: An apple falls from a tree in $0.8\ \text{s}$. From what height?
HKA: $h = \dfrac{g t^2}{2}$.
HEN: $h = \dfrac{g t^2}{2}$.
SKA: $h = \dfrac{10 \cdot 0{,}64}{2} = 3{,}2\ \text{მ}$
SEN: $h = \dfrac{10 \cdot 0.64}{2} = 3.2\ \text{m}$
AKA: $3{,}2\ \text{მ}$
AEN: $3.2\ \text{m}$

--- easy freefall
KA: ორი ბურთი ერთი სიმაღლიდან ერთდროულად გაუშვეს: ერთი უბრალოდ ჩამოაგდეს, მეორე ჰორიზონტალურად ისროლეს. რომელი დაეცემა პირველი?
EN: Two balls leave the same height at the same moment: one is dropped, the other thrown horizontally. Which lands first?
HKA: ვერტიკალური მოძრაობა ორივესთვის ერთნაირია.
HEN: The vertical motion is the same for both.
SKA: ერთდროულად — ორივეს ვერტიკალური საწყისი სიჩქარე ნულია და ერთნაირად ვარდებიან; ჰორიზონტალური სიჩქარე ვარდნის დროზე გავლენას არ ახდენს.
SEN: At the same time — both start with zero vertical speed and fall alike; horizontal speed doesn't affect the fall time.
AKA: ერთდროულად
AEN: at the same time

--- medium freefall
KA: ბურთი ზემოთ $25\ \text{მ/წმ}$-ით აისროლეს. რა სიჩქარე და სიმაღლე ექნება $2\ \text{წმ}$-ის შემდეგ? $4\ \text{წმ}$-ის შემდეგ?
EN: A ball is thrown up at $25\ \text{m/s}$. What are its velocity and height after $2\ \text{s}$? After $4\ \text{s}$?
HKA: $v = v_0 - g t$, $h = v_0 t - \dfrac{g t^2}{2}$.
HEN: $v = v_0 - g t$, $h = v_0 t - \dfrac{g t^2}{2}$.
SKA: $t = 2$: $v = 5\ \text{მ/წმ}$ (ზემოთ), $h = 50 - 20 = 30\ \text{მ}$
$t = 4$: $v = -15\ \text{მ/წმ}$ (ქვემოთ), $h = 100 - 80 = 20\ \text{მ}$
SEN: $t = 2$: $v = 5\ \text{m/s}$ (up), $h = 50 - 20 = 30\ \text{m}$
$t = 4$: $v = -15\ \text{m/s}$ (down), $h = 100 - 80 = 20\ \text{m}$
AKA: $5\ \text{მ/წმ}$, $30\ \text{მ}$; $15\ \text{მ/წმ}$ ქვემოთ, $20\ \text{მ}$
AEN: $5\ \text{m/s}$, $30\ \text{m}$; $15\ \text{m/s}$ down, $20\ \text{m}$

--- medium freefall
KA: სხეული $125\ \text{მ}$ სიმაღლიდან ვარდება. რა მანძილს გაივლის ბოლო წამში?
EN: A body falls from $125\ \text{m}$. How far does it fall in the last second?
HKA: ვარდნის სრული დრო $t = \sqrt{2h/g}$.
HEN: Total fall time $t = \sqrt{2h/g}$.
SKA: $t = \sqrt{25} = 5\ \text{წმ}$
$h_4 = \dfrac{10 \cdot 16}{2} = 80\ \text{მ}$, $\ \Delta h = 125 - 80 = 45\ \text{მ}$
SEN: $t = \sqrt{25} = 5\ \text{s}$
$h_4 = \dfrac{10 \cdot 16}{2} = 80\ \text{m}$, $\ \Delta h = 125 - 80 = 45\ \text{m}$
AKA: $45\ \text{მ}$
AEN: $45\ \text{m}$

--- medium freefall
KA: $45\ \text{მ}$ სიმაღლის კოშკიდან ქვა ჰორიზონტალურად ისროლეს და კოშკიდან $45\ \text{მ}$-ზე დაეცა. იპოვეთ საწყისი სიჩქარე და დაცემის სიჩქარე.
EN: A stone thrown horizontally from a $45\ \text{m}$ tower lands $45\ \text{m}$ from its base. Find the launch speed and the landing speed.
HKA: $t = 3\ \text{წმ}$; $v = \sqrt{v_0^2 + (g t)^2}$.
HEN: $t = 3\ \text{s}$; $v = \sqrt{v_0^2 + (g t)^2}$.
SKA: $t = \sqrt{9} = 3\ \text{წმ}$, $\ v_0 = \dfrac{45}{3} = 15\ \text{მ/წმ}$
$v_y = 30\ \text{მ/წმ}$, $\ v = \sqrt{225 + 900} \approx 33{,}5\ \text{მ/წმ}$
SEN: $t = \sqrt{9} = 3\ \text{s}$, $\ v_0 = \dfrac{45}{3} = 15\ \text{m/s}$
$v_y = 30\ \text{m/s}$, $\ v = \sqrt{225 + 900} \approx 33.5\ \text{m/s}$
AKA: $15\ \text{მ/წმ}$; $\approx 33{,}5\ \text{მ/წმ}$
AEN: $15\ \text{m/s}$; $\approx 33.5\ \text{m/s}$

--- medium freefall
KA: ქვა ქვემოთ $10\ \text{მ/წმ}$-ით ისროლეს $40\ \text{მ}$ სიმაღლიდან. რამდენ ხანში დაეცემა?
EN: A stone is thrown down at $10\ \text{m/s}$ from $40\ \text{m}$. When does it land?
HKA: $40 = 10 t + 5 t^2$.
HEN: $40 = 10 t + 5 t^2$.
SKA: $t^2 + 2t - 8 = 0 \Rightarrow t = 2\ \text{წმ}$
SEN: $t^2 + 2t - 8 = 0 \Rightarrow t = 2\ \text{s}$
AKA: $2\ \text{წმ}$
AEN: $2\ \text{s}$

--- medium freefall
KA: სხეული ჰორიზონტთან $30°$ კუთხით $20\ \text{მ/წმ}$-ით ისროლეს. იპოვეთ ფრენის დრო, მაქსიმალური სიმაღლე და სიშორე.
EN: A body is launched at $20\ \text{m/s}$ at $30°$ to the horizontal. Find the flight time, maximum height and range.
HKA: $v_x = v_0\cos\alpha$, $v_y = v_0\sin\alpha$.
HEN: $v_x = v_0\cos\alpha$, $v_y = v_0\sin\alpha$.
SKA: $v_y = 10\ \text{მ/წმ}$, $v_x \approx 17{,}3\ \text{მ/წმ}$
$T = \dfrac{2 v_y}{g} = 2\ \text{წმ}$, $\ H = \dfrac{v_y^2}{2g} = 5\ \text{მ}$, $\ L = 17{,}3 \cdot 2 \approx 34{,}6\ \text{მ}$
SEN: $v_y = 10\ \text{m/s}$, $v_x \approx 17.3\ \text{m/s}$
$T = \dfrac{2 v_y}{g} = 2\ \text{s}$, $\ H = \dfrac{v_y^2}{2g} = 5\ \text{m}$, $\ L = 17.3 \cdot 2 \approx 34.6\ \text{m}$
AKA: $2\ \text{წმ}$; $5\ \text{მ}$; $\approx 34{,}6\ \text{მ}$
AEN: $2\ \text{s}$; $5\ \text{m}$; $\approx 34.6\ \text{m}$

--- medium freefall
KA: ფეხბურთელი ბურთს $45°$-ზე ურტყამს და ის $40\ \text{მ}$-ზე ეცემა. რა სიჩქარით ურტყა?
EN: A footballer kicks a ball at $45°$ and it lands $40\ \text{m}$ away. With what speed was it kicked?
HKA: $L = \dfrac{v_0^2 \sin 2\alpha}{g}$.
HEN: $L = \dfrac{v_0^2 \sin 2\alpha}{g}$.
SKA: $v_0 = \sqrt{L g} = \sqrt{400} = 20\ \text{მ/წმ}$
SEN: $v_0 = \sqrt{L g} = \sqrt{400} = 20\ \text{m/s}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- medium freefall
KA: ჰელიკოპტერიდან ($h = 80\ \text{მ}$), რომელიც ჰორიზონტალურად $30\ \text{მ/წმ}$-ით მიფრინავს, ტვირთი ჩამოაგდეს. სამიზნიდან რა ჰორიზონტალურ მანძილზე უნდა ჩამოაგდონ?
EN: A helicopter at $80\ \text{m}$ flying horizontally at $30\ \text{m/s}$ drops a parcel. How far before the target (horizontally) must it be released?
HKA: ტვირთს ჰელიკოპტერის ჰორიზონტალური სიჩქარე აქვს.
HEN: The parcel keeps the helicopter's horizontal speed.
SKA: $t = \sqrt{16} = 4\ \text{წმ}$, $\ L = 30 \cdot 4 = 120\ \text{მ}$
SEN: $t = \sqrt{16} = 4\ \text{s}$, $\ L = 30 \cdot 4 = 120\ \text{m}$
AKA: $120\ \text{მ}$
AEN: $120\ \text{m}$

--- medium freefall
KA: ჭაში ქვა ჩააგდეს და დაცემის ხმა $2{,}2\ \text{წმ}$-ის შემდეგ გაიგეს. ხმის სიჩქარეა $330\ \text{მ/წმ}$. შეაფასეთ ჭის სიღრმე (ჯერ ხმის დრო უგულებელყავით, შემდეგ დააზუსტეთ).
EN: A stone is dropped down a well and the splash is heard $2.2\ \text{s}$ later. Sound travels at $330\ \text{m/s}$. Estimate the depth (first ignore the sound time, then correct for it).
HKA: $t = \sqrt{2h/g} + h/330$.
HEN: $t = \sqrt{2h/g} + h/330$.
SKA: ხმის გარეშე: $h \approx 5 \cdot 2{,}2^2 \approx 24\ \text{მ}$; ხმას $\approx 0{,}07\ \text{წმ}$ სჭირდება.
დაზუსტება: $t_{\text{ვ}} \approx 2{,}13\ \text{წმ}$, $\ h \approx 5 \cdot 2{,}13^2 \approx 22{,}7\ \text{მ}$
SEN: Ignoring sound: $h \approx 5 \cdot 2.2^2 \approx 24\ \text{m}$; the sound takes $\approx 0.07\ \text{s}$.
Corrected: $t_{\text{fall}} \approx 2.13\ \text{s}$, $\ h \approx 5 \cdot 2.13^2 \approx 22.7\ \text{m}$
AKA: $\approx 23\ \text{მ}$
AEN: $\approx 23\ \text{m}$

--- medium freefall
KA: სხეული ზემოთ ისროლეს. $1\ \text{წმ}$-ის შემდეგ მისი სიჩქარე $15\ \text{მ/წმ}$-ია (ზემოთ). რა საწყისი სიჩქარით ისროლეს და რა სიმაღლეზე ავა?
EN: A body is thrown up. After $1\ \text{s}$ its velocity is $15\ \text{m/s}$ upwards. What was its launch speed and how high will it go?
HKA: $v_0 = v + g t$.
HEN: $v_0 = v + g t$.
SKA: $v_0 = 15 + 10 = 25\ \text{მ/წმ}$
$H = \dfrac{625}{20} = 31{,}25\ \text{მ}$
SEN: $v_0 = 15 + 10 = 25\ \text{m/s}$
$H = \dfrac{625}{20} = 31.25\ \text{m}$
AKA: $25\ \text{მ/წმ}$; $31{,}25\ \text{მ}$
AEN: $25\ \text{m/s}$; $31.25\ \text{m}$

--- medium freefall
KA: ონკანიდან წვეთები ყოველ $0{,}2\ \text{წმ}$-ში ვარდება. რა მანძილი იქნება პირველ და მეორე წვეთს შორის, როცა პირველი $1\ \text{წმ}$-ის განმავლობაში ვარდება?
EN: Drops fall from a tap every $0.2\ \text{s}$. How far apart are the first and second drops when the first has been falling for $1\ \text{s}$?
HKA: მეორე წვეთი ამ დროს $0{,}8\ \text{წმ}$ ვარდება.
HEN: The second drop has then been falling $0.8\ \text{s}$.
SKA: $h_1 = 5 \cdot 1 = 5\ \text{მ}$, $\ h_2 = 5 \cdot 0{,}64 = 3{,}2\ \text{მ}$
$d = 1{,}8\ \text{მ}$
SEN: $h_1 = 5 \cdot 1 = 5\ \text{m}$, $\ h_2 = 5 \cdot 0.64 = 3.2\ \text{m}$
$d = 1.8\ \text{m}$
AKA: $1{,}8\ \text{მ}$
AEN: $1.8\ \text{m}$

--- hard freefall
KA: სხეული თავისუფლად ვარდება და ბოლო $2$ წამში $80\ \text{მ}$-ს გადის. იპოვეთ სიმაღლე და ვარდნის დრო.
EN: A freely falling body covers $80\ \text{m}$ in its last $2\ \text{s}$. Find the height and the fall time.
HKA: $\dfrac{g t^2}{2} - \dfrac{g (t - 2)^2}{2} = 80$.
HEN: $\dfrac{g t^2}{2} - \dfrac{g (t - 2)^2}{2} = 80$.
SKA: $5(4t - 4) = 80 \Rightarrow t = 5\ \text{წმ}$
$h = 5 \cdot 25 = 125\ \text{მ}$
SEN: $5(4t - 4) = 80 \Rightarrow t = 5\ \text{s}$
$h = 5 \cdot 25 = 125\ \text{m}$
AKA: $125\ \text{მ}$; $5\ \text{წმ}$
AEN: $125\ \text{m}$; $5\ \text{s}$

--- hard freefall
KA: ქვა $20\ \text{მ}$ სიმაღლის კლდიდან ჰორიზონტთან $30°$-ით ზემოთ $20\ \text{მ/წმ}$-ით ისროლეს. რამდენ ხანში დაეცემა ძირში?
EN: A stone is thrown from a $20\ \text{m}$ cliff at $20\ \text{m/s}$, $30°$ above the horizontal. When does it hit the ground below?
HKA: $y = 20 + 10 t - 5 t^2 = 0$.
HEN: $y = 20 + 10 t - 5 t^2 = 0$.
SKA: $t^2 - 2t - 4 = 0 \Rightarrow t = 1 + \sqrt 5 \approx 3{,}24\ \text{წმ}$
SEN: $t^2 - 2t - 4 = 0 \Rightarrow t = 1 + \sqrt 5 \approx 3.24\ \text{s}$
AKA: $\approx 3{,}24\ \text{წმ}$
AEN: $\approx 3.24\ \text{s}$

--- hard freefall
KA: რა კუთხით უნდა ისროლონ სხეული, რომ ფრენის სიშორე მაქსიმალური სიმაღლის ოთხჯერადი იყოს?
EN: At what launch angle is the range four times the maximum height?
HKA: $\dfrac{L}{H} = \dfrac{4}{\tan\alpha}$.
HEN: $\dfrac{L}{H} = \dfrac{4}{\tan\alpha}$.
SKA: $L = \dfrac{2 v_0^2 \sin\alpha\cos\alpha}{g}$, $H = \dfrac{v_0^2 \sin^2\alpha}{2g}$ $\Rightarrow \dfrac{L}{H} = \dfrac{4}{\tan\alpha} = 4$
$\tan\alpha = 1 \Rightarrow \alpha = 45°$
SEN: $L = \dfrac{2 v_0^2 \sin\alpha\cos\alpha}{g}$, $H = \dfrac{v_0^2 \sin^2\alpha}{2g}$ $\Rightarrow \dfrac{L}{H} = \dfrac{4}{\tan\alpha} = 4$
$\tan\alpha = 1 \Rightarrow \alpha = 45°$
AKA: $45°$
AEN: $45°$

--- hard freefall
KA: მიწიდან ერთი წერტილიდან ორი ბურთი ზემოთ ისროლეს $30\ \text{მ/წმ}$-ით, ერთი $2\ \text{წმ}$-ით გვიან. როდის და რა სიმაღლეზე შეხვდებიან?
EN: Two balls are thrown up from the same point at $30\ \text{m/s}$, the second $2\ \text{s}$ after the first. When and at what height do they meet?
HKA: $30t - 5t^2 = 30(t - 2) - 5(t - 2)^2$.
HEN: $30t - 5t^2 = 30(t - 2) - 5(t - 2)^2$.
SKA: $0 = -60 - 5(t^2 - 4t + 4 - t^2) = -60 + 20t - 20 \Rightarrow t = 4\ \text{წმ}$
$h = 120 - 80 = 40\ \text{მ}$
SEN: $0 = -60 - 5(t^2 - 4t + 4 - t^2) = -60 + 20t - 20 \Rightarrow t = 4\ \text{s}$
$h = 120 - 80 = 40\ \text{m}$
AKA: $4\ \text{წმ}$-ზე (პირველის სროლიდან), $40\ \text{მ}$
AEN: at $4\ \text{s}$ (after the first throw), $40\ \text{m}$

--- hard freefall
KA: ჰორიზონტალურად ნასროლი ქვის სიჩქარე დაცემისას ჰორიზონტთან $60°$-ს ქმნის. ფრენის დროა $2\ \text{წმ}$. იპოვეთ საწყისი სიჩქარე და სიმაღლე.
EN: A stone thrown horizontally lands with its velocity at $60°$ to the horizontal. The flight lasts $2\ \text{s}$. Find the launch speed and the height.
HKA: $\tan 60° = \dfrac{g t}{v_0}$.
HEN: $\tan 60° = \dfrac{g t}{v_0}$.
SKA: $v_y = 20\ \text{მ/წმ}$, $\ v_0 = \dfrac{20}{\sqrt 3} \approx 11{,}5\ \text{მ/წმ}$
$h = 5 \cdot 4 = 20\ \text{მ}$
SEN: $v_y = 20\ \text{m/s}$, $\ v_0 = \dfrac{20}{\sqrt 3} \approx 11.5\ \text{m/s}$
$h = 5 \cdot 4 = 20\ \text{m}$
AKA: $\approx 11{,}5\ \text{მ/წმ}$; $20\ \text{მ}$
AEN: $\approx 11.5\ \text{m/s}$; $20\ \text{m}$

--- hard freefall
KA: კალათბურთელი ბურთს $2\ \text{მ}$ სიმაღლიდან $45°$-ით ისვრის; კალათი $3{,}05\ \text{მ}$ სიმაღლეზეა და ჰორიზონტალურად $6\ \text{მ}$-შია. რა სიჩქარით უნდა ისროლოს?
EN: A basketball player shoots from $2\ \text{m}$ at $45°$; the hoop is $3.05\ \text{m}$ high and $6\ \text{m}$ away horizontally. What launch speed is needed?
HKA: $y = x\tan\alpha - \dfrac{g x^2}{2 v_0^2 \cos^2\alpha}$.
HEN: $y = x\tan\alpha - \dfrac{g x^2}{2 v_0^2 \cos^2\alpha}$.
SKA: $1{,}05 = 6 - \dfrac{10 \cdot 36}{v_0^2} \Rightarrow \dfrac{360}{v_0^2} = 4{,}95$
$v_0 = \sqrt{72{,}7} \approx 8{,}5\ \text{მ/წმ}$
SEN: $1.05 = 6 - \dfrac{10 \cdot 36}{v_0^2} \Rightarrow \dfrac{360}{v_0^2} = 4.95$
$v_0 = \sqrt{72.7} \approx 8.5\ \text{m/s}$
AKA: $\approx 8{,}5\ \text{მ/წმ}$
AEN: $\approx 8.5\ \text{m/s}$

--- hard freefall
KA: ჰაერბურთი $10\ \text{მ/წმ}$-ით თანაბრად ადის. $75\ \text{მ}$ სიმაღლეზე მისგან ქვიშის ტომარა ჩამოვარდა. რამდენ ხანში დაეცემა მიწას?
EN: A balloon rises steadily at $10\ \text{m/s}$. At $75\ \text{m}$ a sandbag drops off it. When does the bag hit the ground?
HKA: ტომარას საწყისი სიჩქარე $10\ \text{მ/წმ}$ ზემოთ აქვს.
HEN: The bag starts with $10\ \text{m/s}$ upwards.
SKA: $0 = 75 + 10t - 5t^2 \Rightarrow t^2 - 2t - 15 = 0$
$t = 5\ \text{წმ}$
SEN: $0 = 75 + 10t - 5t^2 \Rightarrow t^2 - 2t - 15 = 0$
$t = 5\ \text{s}$
AKA: $5\ \text{წმ}$
AEN: $5\ \text{s}$

--- hard freefall
KA: ორი სხეული ერთი სიმაღლიდან ერთი სიჩქარით ($10\ \text{მ/წმ}$) ისროლეს: ერთი ზემოთ, მეორე ქვემოთ. რამდენით გვიან დაეცემა ზემოთ ნასროლი?
EN: Two bodies are thrown from the same height at the same speed ($10\ \text{m/s}$): one up, one down. How much later does the one thrown up land?
HKA: ზემოთ ნასროლი სროლის წერტილში $10\ \text{მ/წმ}$-ით ქვემოთ დაბრუნდება.
HEN: The one thrown up comes back past the start at $10\ \text{m/s}$ downwards.
SKA: სხვაობა — ზემოთ ასვლისა და უკან დაბრუნების დრო: $\Delta t = \dfrac{2 v_0}{g} = 2\ \text{წმ}$ (სიმაღლეზე არ არის დამოკიდებული).
SEN: The difference is the time to go up and come back: $\Delta t = \dfrac{2 v_0}{g} = 2\ \text{s}$ (independent of the height).
AKA: $2\ \text{წმ}$-ით
AEN: $2\ \text{s}$ later

--- hard freefall
KA: ქვა $h = 20\ \text{მ}$ სიმაღლიდან ჰორიზონტალურად ისროლეს. რა საწყისი სიჩქარე სჭირდება, რომ $10\ \text{მ}$-ის მოშორებით მდგარ $15\ \text{მ}$ სიმაღლის კედელს გადაევლოს?
EN: A stone is thrown horizontally from a height of $20\ \text{m}$. What minimum speed lets it clear a $15\ \text{m}$ wall standing $10\ \text{m}$ away?
HKA: კედლამდე მისვლისას ქვა $5\ \text{მ}$-ზე მეტით არ უნდა დაეშვას.
HEN: By the time it reaches the wall the stone must have dropped no more than $5\ \text{m}$.
SKA: $5 = 5t^2 \Rightarrow t = 1\ \text{წმ}$
$v_0 = \dfrac{10}{1} = 10\ \text{მ/წმ}$
SEN: $5 = 5t^2 \Rightarrow t = 1\ \text{s}$
$v_0 = \dfrac{10}{1} = 10\ \text{m/s}$
AKA: $10\ \text{მ/წმ}$
AEN: $10\ \text{m/s}$

--- hard freefall
KA: მიწიდან ბურთი $20\ \text{მ/წმ}$-ით ზემოთ ისროლეს, ამავე დროს $40\ \text{მ}$ სიმაღლიდან მეორე ბურთი უბრალოდ გაუშვეს (იმავე ვერტიკალზე). როდის და სად შეხვდებიან?
EN: A ball is thrown up from the ground at $20\ \text{m/s}$; at the same moment another is dropped from $40\ \text{m}$ directly above. When and where do they meet?
HKA: ფარდობითი სიჩქარე მუდმივია — $20\ \text{მ/წმ}$.
HEN: Their relative speed is constant — $20\ \text{m/s}$.
SKA: $t = \dfrac{40}{20} = 2\ \text{წმ}$
$h = 20 \cdot 2 - 5 \cdot 4 = 20\ \text{მ}$
SEN: $t = \dfrac{40}{20} = 2\ \text{s}$
$h = 20 \cdot 2 - 5 \cdot 4 = 20\ \text{m}$
AKA: $2\ \text{წმ}$; $20\ \text{მ}$ სიმაღლეზე
AEN: $2\ \text{s}$; at $20\ \text{m}$

--- hard freefall olympiad
KA: მოთამაშე ბურთს ერთი და იმავე სიჩქარით ისვრის. აჩვენეთ, რომ $30°$-ით და $60°$-ით სროლისას ბურთი ერთსა და იმავე მანძილზე ეცემა. რომელ შემთხვევაში იფრენს უფრო დიდხანს და რამდენჯერ?
EN: A player throws a ball at the same speed each time. Show that at $30°$ and $60°$ the ball lands at the same distance. In which case does it fly longer, and by what factor?
HKA: $L \sim \sin 2\alpha$, $T \sim \sin\alpha$.
HEN: $L \sim \sin 2\alpha$, $T \sim \sin\alpha$.
SKA: $\sin 60° = \sin 120°$ — სიშორეები ტოლია.
$\dfrac{T_{60}}{T_{30}} = \dfrac{\sin 60°}{\sin 30°} = \sqrt 3 \approx 1{,}73$
SEN: $\sin 60° = \sin 120°$ — the ranges are equal.
$\dfrac{T_{60}}{T_{30}} = \dfrac{\sin 60°}{\sin 30°} = \sqrt 3 \approx 1.73$
AKA: $60°$-ით; $\sqrt 3$-ჯერ
AEN: at $60°$; $\sqrt 3$ times

--- hard freefall olympiad
KA: მონადირე ხეზე მჯდომ მაიმუნს უმიზნებს. გასროლის მომენტში მაიმუნი ხიდან ხტება (უძრაობიდან ვარდება). მოხვდება თუ არა ტყვია მაიმუნს? (ტყვიის სიჩქარე საკმარისია)
EN: A hunter aims straight at a monkey in a tree. At the instant of the shot the monkey lets go and falls from rest. Does the bullet hit the monkey? (The bullet is fast enough.)
HKA: განიხილეთ მოძრაობა თავისუფლად ვარდნილ სისტემაში.
HEN: Consider the motion in a freely falling frame.
SKA: ტყვიაც და მაიმუნიც ერთნაირი აჩქარებით $g$ ვარდებიან. ვარდნილ სისტემაში ორივე სწორხაზოვნად მოძრაობს: მაიმუნი უძრავია, ტყვია კი სწორად მიზნის ხაზით მიფრინავს — **მოხვდება**.
SEN: The bullet and the monkey both fall with the same acceleration $g$. In the falling frame both move in straight lines: the monkey is at rest and the bullet flies straight along the aiming line — it **hits**.
AKA: მოხვდება
AEN: it hits

--- hard freefall olympiad
KA: ქვა $h$ სიმაღლის ბორცვის წვეროდან, რომლის ფერდი ჰორიზონტთან $45°$-ს ქმნის, ჰორიზონტალურად $10\ \text{მ/წმ}$-ით ისროლეს. ფერდზე რა მანძილზე დაეცემა (ფერდის გასწვრივ)?
EN: A stone is thrown horizontally at $10\ \text{m/s}$ from the top of a slope inclined at $45°$. How far down the slope (along it) does it land?
HKA: დაცემის წერტილში $y = x$ (ფერდი $45°$-იანია).
HEN: Where it lands, $y = x$ (the slope is $45°$).
SKA: $5t^2 = 10t \Rightarrow t = 2\ \text{წმ}$, $\ x = y = 20\ \text{მ}$
ფერდის გასწვრივ: $\sqrt{2} \cdot 20 \approx 28{,}3\ \text{მ}$
SEN: $5t^2 = 10t \Rightarrow t = 2\ \text{s}$, $\ x = y = 20\ \text{m}$
Along the slope: $\sqrt{2} \cdot 20 \approx 28.3\ \text{m}$
AKA: $\approx 28{,}3\ \text{მ}$
AEN: $\approx 28.3\ \text{m}$

--- hard freefall olympiad
KA: სხეული თავისუფლად ვარდება $h$ სიმაღლიდან. სიმაღლის რა ნაწილს გადის ის ვარდნის დროის მეორე ნახევარში?
EN: A body falls freely from height $h$. What fraction of $h$ does it cover in the second half of the fall time?
HKA: დროის პირველ ნახევარში $\dfrac{1}{4}h$-ს გადის.
HEN: In the first half of the time it covers $\dfrac{1}{4}h$.
SKA: $s \sim t^2$: პირველ ნახევარში $\left(\dfrac{1}{2}\right)^2 h = \dfrac{h}{4}$.
მეორე ნახევარში: $\dfrac{3}{4}h$.
SEN: $s \sim t^2$: in the first half $\left(\dfrac{1}{2}\right)^2 h = \dfrac{h}{4}$.
In the second half: $\dfrac{3}{4}h$.
AKA: $\dfrac{3}{4}$
AEN: $\dfrac{3}{4}$

KA: რატომ არის საშიში ავტობუსში ხელმოუკიდებლად დგომა?
EN: Why is it dangerous to stand in a bus without holding on?

SEN: When the bus suddenly brakes or starts, your body keeps its velocity by inertia — you fall forwards or backwards.
AKA: ინერციის გამო
AEN: because of inertia

--- easy newton1
KA: ჩამოაყალიბეთ ნიუტონის I კანონი. როდის მოძრაობს სხეული თანაბრად და სწორხაზოვნად?
EN: State Newton's first law. When does a body move uniformly in a straight line?
HKA: ტოლქმედი ძალა.
HEN: The resultant force.
SKA: არსებობს ათვლის სისტემები (ინერციული), რომლებშიც სხეული ინარჩუნებს უძრაობას ან თანაბარ სწორხაზოვან მოძრაობას, თუ მასზე ძალები არ მოქმედებს ან მათი ტოლქმედი ნულია.
SEN: There exist (inertial) frames in which a body stays at rest or keeps moving uniformly in a straight line if no forces act on it or their resultant is zero.
AKA: როცა ტოლქმედი ნულია
AEN: when the resultant force is zero

--- easy newton1
KA: ჩაქუჩის ტარს მიწაზე არტყამენ, რომ თავი უკეთ ჩამოჯდეს. რატომ მუშაობს ეს?
EN: People tap the end of a hammer's handle on the ground to tighten the head. Why does this work?

SEN: On impact the handle stops suddenly while the head keeps moving down by inertia and slides further onto the handle.
AKA: თავი ინერციით ქვემოთ განაგრძობს მოძრაობას

--- easy newton1
KA: თანაბრად მოძრავ ვაგონში ბურთი ზემოთ ააგდეს. სად დაეცემა — უკან, წინ თუ იმავე ადგილზე?
EN: A ball is thrown straight up in a carriage moving uniformly. Where does it land — behind, ahead or in the same place?
HKA: ბურთს ვაგონის ჰორიზონტალური სიჩქარე აქვს.

SKA: იმავე ადგილზე — ბურთი ინერციით ვაგონთან ერთად ჰორიზონტალურად მოძრაობს. ვაგონი ინერციული სისტემაა, მასში ყველაფერი ისე ხდება, როგორც უძრავში.
SEN: In the same place — by inertia the ball moves horizontally with the carriage. The carriage is an inertial frame; everything happens as if it were at rest.
AKA: იმავე ადგილზე
AEN: in the same place

--- hard newton1
KA: თანაბრად მოძრავი მატარებლის ფანჯრიდან მგზავრმა ქვა გაუშვა. როგორი იქნება ქვის ტრაექტორია: ა) მგზავრის მიმართ; ბ) დედამიწის მიმართ? რატომ განსხვავდება?
EN: A passenger in a uniformly moving train drops a stone out of the window. What is its path: a) relative to the passenger; b) relative to the ground? Why are they different?
HKA: ქვას მატარებლის სიჩქარე აქვს.
HEN: The stone has the train's velocity.
SKA: ა) მგზავრის მიმართ ქვა უძრაობიდან ვარდება — ვერტიკალური წრფე.
ბ) დედამიწის მიმართ ქვას ჰორიზონტალური სიჩქარე აქვს — პარაბოლა (ჰორიზონტალური სროლა).
ტრაექტორია ათვლის სისტემაზეა დამოკიდებული; ორივე სისტემა ინერციულია.
SEN: a) Relative to the passenger the stone falls from rest — a vertical line.
b) Relative to the ground it has a horizontal velocity — a parabola (a horizontal throw).
The path depends on the frame; both frames are inertial.
AKA: ა) ვერტიკალური წრფე; ბ) პარაბოლა
AEN: a) a vertical line; b) a parabola

--- hard newton1
KA: ძაფზე ჩამოკიდებული მძიმე ბურთის ქვემოთ იგივე ძაფია მიბმული. ქვედა ძაფს თუ ნელა ვქაჩავთ, ზედა წყდება, თუ უცებ ვქაჩავთ — ქვედა. ახსენით.
EN: A heavy ball hangs on a thread, with an identical thread tied below it. Pulling the lower thread slowly breaks the upper one; jerking it breaks the lower one. Explain.
HKA: ბურთის ინერცია უცაბედ ცვლილებას „ეწინააღმდეგება“.
HEN: The ball's inertia resists a sudden change.
SKA: ნელა ქაჩვისას ბურთი თითქმის უძრავია და ზედა ძაფზე მოქმედებს ქაჩვის ძალა + ბურთის წონა — ზედა წყდება.
უცებ ქაჩვისას მძიმე ბურთი ინერციის გამო ვერ ასწრებს დაძვრას, ზედა ძაფი თითქმის არ იჭიმება და ქვედა ძაფი წყდება.
SEN: Pulled slowly, the ball barely moves and the upper thread carries the pull plus the ball's weight — it breaks.
Jerked, the heavy ball can't start moving in time because of its inertia; the upper thread hardly stretches and the lower one breaks.
AKA: ნელა — ზედა (მეტი დატვირთვა); უცებ — ქვედა (ინერცია)
AEN: slowly — the upper (more load); suddenly — the lower (inertia)

--- hard newton2 olympiad
KA: ყუთს ($m$) ჰორიზონტალურ იატაკზე ($\mu$) ჰორიზონტთან $\alpha$ კუთხით ეწევიან. რა კუთხისას იქნება საჭირო ძალა მინიმალური თანაბარი მოძრაობისთვის? იპოვეთ $\mu = 0{,}75$-ისთვის.
EN: A box ($m$) on a floor ($\mu$) is pulled at angle $\alpha$ above the horizontal. At what angle is the force needed for uniform motion smallest? Find it for $\mu = 0.75$.
HKA: $F = \dfrac{\mu m g}{\cos\alpha + \mu\sin\alpha}$ — მნიშვნელი მაქსიმალური უნდა იყოს.
HEN: $F = \dfrac{\mu m g}{\cos\alpha + \mu\sin\alpha}$ — make the denominator as large as possible.
SKA: $F\cos\alpha = \mu(mg - F\sin\alpha) \Rightarrow F = \dfrac{\mu m g}{\cos\alpha + \mu\sin\alpha}$
მინიმუმი, როცა $\tan\alpha = \mu = 0{,}75 \Rightarrow \alpha \approx 37°$
$F_{\min} = \dfrac{\mu m g}{\sqrt{1 + \mu^2}} = 0{,}6\, m g$
SEN: $F\cos\alpha = \mu(mg - F\sin\alpha) \Rightarrow F = \dfrac{\mu m g}{\cos\alpha + \mu\sin\alpha}$
Minimum when $\tan\alpha = \mu = 0.75 \Rightarrow \alpha \approx 37°$
$F_{\min} = \dfrac{\mu m g}{\sqrt{1 + \mu^2}} = 0.6\, m g$
AKA: $\tan\alpha = \mu$, $\alpha \approx 37°$
AEN: $\tan\alpha = \mu$, $\alpha \approx 37°$

--- hard newton2 olympiad
KA: დახრილი სიბრტყის რა კუთხისას ჩამოსრიალდება ძელი ზედა წერტილიდან ყველაზე სწრაფად, თუ სიბრტყის ჰორიზონტალური გეგმილი ($L$) ფიქსირებულია (ხახუნი არ არის)?
EN: For a frictionless incline whose horizontal base length $L$ is fixed, at what angle does a block slide from top to bottom in the least time?
HKA: სიგრძე $\dfrac{L}{\cos\alpha}$, აჩქარება $g\sin\alpha$.
HEN: Length $\dfrac{L}{\cos\alpha}$, acceleration $g\sin\alpha$.
SKA: $\dfrac{L}{\cos\alpha} = \dfrac{g\sin\alpha\, t^2}{2} \Rightarrow t^2 = \dfrac{2L}{g\sin\alpha\cos\alpha} = \dfrac{4L}{g\sin 2\alpha}$
$t$ მინიმალურია, როცა $\sin 2\alpha = 1 \Rightarrow \alpha = 45°$
SEN: $\dfrac{L}{\cos\alpha} = \dfrac{g\sin\alpha\, t^2}{2} \Rightarrow t^2 = \dfrac{2L}{g\sin\alpha\cos\alpha} = \dfrac{4L}{g\sin 2\alpha}$
$t$ is least when $\sin 2\alpha = 1 \Rightarrow \alpha = 45°$
AKA: $45°$
AEN: $45°$

KA: ჩამოაყალიბეთ ნიუტონის III კანონი. რატომ არ აბათილებს ერთმანეთს ქმედებისა და უკუქმედების ძალები?

HEN: They act on different bodies.

ისინი სხვადასხვა სხეულზეა მოდებული, ამიტომ ერთი სხეულის მოძრაობაში არ იკვეცება.

They act on different bodies, so they don't cancel in either body's motion.
AKA: ძალები სხვადასხვა სხეულზე მოქმედებს
AEN: the forces act on different bodies

HEN: $a = \dfrac{F}{m}$ — the Earth's mass is enormous.
SKA: ვაშლიც $2\ \text{ნ}$-ით იზიდავს დედამიწას.
დედამიწის აჩქარება $\dfrac{2}{6 \times 10^{24}} \approx 3 \times 10^{-25}\ \text{მ/წმ}^2$ — შეუმჩნეველია.
SEN: The apple also pulls the Earth with $2\ \text{N}$.
The Earth's acceleration is $\dfrac{2}{6 \times 10^{24}} \approx 3 \times 10^{-25}\ \text{m/s}^2$ — unnoticeable.
AKA: $2\ \text{ნ}$; აჩქარება უმცირესია
AEN: $2\ \text{N}$; the acceleration is tiny

KA: ცურვისას მოცურავე წყალს უკან უბიძგებს. რატომ მოძრაობს ის წინ?

--- medium newton3
KA: ორი ბიჭი ($40\ \text{კგ}$ და $60\ \text{კგ}$) ციგურებზე ერთმანეთს ხელებით უბიძგებს $120\ \text{ნ}$-ით. იპოვეთ თითოეულის აჩქარება.
EN: Two boys ($40\ \text{kg}$ and $60\ \text{kg}$) on skates push each other apart with $120\ \text{N}$. Find each one's acceleration.

SEN: $a_1 = \dfrac{120}{40} = 3\ \text{m/s}^2$, $\ a_2 = \dfrac{120}{60} = 2\ \text{m/s}^2$

KA: მანქანა ($1\ \text{ტ}$) და მსუბუქი ველოსიპედისტი ($80\ \text{კგ}$) ეჯახებიან. რომელზე მოქმედებს მეტი ძალა? რომელი იღებს მეტ აჩქარებას და რამდენჯერ?
EN: A $1\ \text{t}$ car and an $80\ \text{kg}$ cyclist collide. Which feels the larger force? Which gets the larger acceleration, and by what factor?

HEN: Third law + second law.
SKA: ძალები ტოლია (III კანონი).
$\dfrac{a_{\text{ვ}}}{a_{\text{მ}}} = \dfrac{1000}{80} = 12{,}5$ — ველოსიპედისტი $12{,}5$-ჯერ მეტ აჩქარებას იღებს.
SEN: The forces are equal (third law).
$\dfrac{a_{\text{c}}}{a_{\text{car}}} = \dfrac{1000}{80} = 12.5$ — the cyclist gets $12.5$ times the acceleration.
AKA: ძალები ტოლია; ველოსიპედისტი, $12{,}5$-ჯერ
AEN: equal forces; the cyclist, $12.5$ times

KA: მაგიდაზე დევს წიგნი, რომელზეც ვაშლი დევს. ჩამოთვალეთ ყველა ძალა, რომელიც წიგნზე მოქმედებს, და თითოეულის „წყვილი“ III კანონით.
EN: A book lies on a table with an apple on top of it. List every force acting on the book and give the third-law partner of each.

ბ) მაგიდის რეაქცია ზემოთ (წყვილი — წიგნი აწვება მაგიდას).
გ) ვაშლის დაწოლა ქვემოთ (წყვილი — წიგნი ვაშლს ზემოთ უბიძგებს).

--- medium newton3
KA: ადამიანი ($70\ \text{კგ}$) ნავში ($140\ \text{კგ}$) დგას და ნაპირზე მიბმულ თოკს $70\ \text{ნ}$-ით ქაჩავს. იპოვეთ ნავის აჩქარება (წინაღობის გარეშე). რა იქნება, თუ თოკი მეორე, იგივე მასის ნავზეა მიბმული?
EN: A $70\ \text{kg}$ man stands in a $140\ \text{kg}$ boat and pulls with $70\ \text{N}$ on a rope tied to the shore. Find the boat's acceleration (no drag). What if the rope is tied to a second identical boat instead?
HKA: ადამიანი და ნავი ერთად მოძრაობს.
HEN: The man and the boat move together.
SKA: ნაპირთან: $a = \dfrac{70}{210} \approx 0{,}33\ \text{მ/წმ}^2$
მეორე ნავთან (მისი მასა $140\ \text{კგ}$): ორივე ნავი ერთმანეთისკენ მოძრაობს, $a_1 \approx 0{,}33$ და $a_2 = 0{,}5\ \text{მ/წმ}^2$.
SEN: Tied to the shore: $a = \dfrac{70}{210} \approx 0.33\ \text{m/s}^2$
Tied to the second boat ($140\ \text{kg}$): both move towards each other, $a_1 \approx 0.33$ and $a_2 = 0.5\ \text{m/s}^2$.

AEN: $\approx 0.33\ \text{m/s}^2$; the second boat moves too at $0.5\ \text{m/s}^2$

--- easy weight
KA: რით განსხვავდება წონა სიმძიმის ძალისგან?
EN: How does weight differ from the force of gravity?
HKA: რაზე მოქმედებს თითოეული?
HEN: What does each act on?
SKA: სიმძიმის ძალა დედამიწის მიზიდულობაა, რომელიც სხეულზე მოქმედებს.
წონა — ძალა, რომლითაც სხეული საყრდენს აწვება ან საკიდს ჭიმავს; ის საყრდენზე მოქმედებს. უძრაობისას $P = mg$, მაგრამ აჩქარებისას განსხვავდება.
SEN: Gravity is the Earth's pull acting on the body.

EN: A lift accelerates upwards at $2\ \text{m/s}^2$. What do the scales under a $50\ \text{kg}$ person read?

--- easy weight
KA: როდის ხდება უწონადობა? მოიყვანეთ მაგალითი დედამიწაზე.
EN: When does weightlessness occur? Give an example on Earth.
HKA: სხეული მხოლოდ სიმძიმის ძალის მოქმედებით მოძრაობს.
HEN: The body moves under gravity alone.
SKA: უწონადობა: სხეული და საყრდენი ერთნაირი აჩქარებით $g$ ვარდებიან, ამიტომ სხეული საყრდენს არ აწვება ($P = 0$).
მაგალითი: ნახტომისას ჰაერში ყოფნა; ბატუტზე ფრენა; თვითმფრინავი, რომელიც პარაბოლაზე მიფრინავს.
SEN: Weightlessness: the body and its support fall with the same acceleration $g$, so the body doesn't press on the support ($W = 0$).
Example: being in the air during a jump; on a trampoline; a plane flying a parabolic arc.
AKA: როცა $a = g$ (თავისუფალი ვარდნა)

SEN: $\dfrac{10}{1.6} = 6.25$ — $6.25$ times smaller. The mass doesn't change.

KA: ლიფტში სასწორი $55\ \text{კგ}$ ადამიანის ქვეშ $440\ \text{ნ}$-ს აჩვენებს. საით არის მიმართული ლიფტის აჩქარება და რას უდრის?

SEN: $mg = 550\ \text{N}$, $\ a = \dfrac{550 - 440}{55} = 2\ \text{m/s}^2$, downwards.

AEN: $2\ \text{m/s}^2$ downwards

--- medium weight
KA: მფრინავი ($70\ \text{კგ}$) მარყუჟის ქვედა წერტილში ($R = 400\ \text{მ}$) $200\ \text{მ/წმ}$-ით მიფრინავს. რამდენჯერ მეტია მისი წონა ჩვეულებრივზე (გადატვირთვა)?

$\dfrac{P}{mg} = \dfrac{10 + 100}{10} = 11$
SEN: $\dfrac{v^2}{R} = \dfrac{40\,000}{400} = 100\ \text{m/s}^2$
$\dfrac{W}{mg} = \dfrac{10 + 100}{10} = 11$
AKA: $11$-ჯერ
AEN: $11$ times

--- medium weight
KA: ლიფტი ზემოთ $4\ \text{მ/წმ}$-ით მოძრაობს და $2\ \text{წმ}$-ში თანაბრად ჩერდება. რას აჩვენებს სასწორი $60\ \text{კგ}$ ადამიანის ქვეშ დამუხრუჭებისას?

SEN: $W = 60(10 - 2) = 480\ \text{N}$

--- medium weight
KA: მანქანა ($1\ \text{ტ}$) ჩაზნექილ ხიდზე ($R = 50\ \text{მ}$) $15\ \text{მ/წმ}$-ით მოძრაობს. რა ძალით აწვება ხიდის უდაბლეს წერტილს?
EN: A $1\ \text{t}$ car crosses a concave (dipping) bridge of radius $50\ \text{m}$ at $15\ \text{m/s}$. With what force does it press on the lowest point?

SEN: $\dfrac{v^2}{R} = \dfrac{225}{50} = 4.5\ \text{m/s}^2$
$W = 1000 \cdot 14.5 = 14.5\ \text{kN}$
AKA: $14{,}5\ \text{კნ}$

--- medium weight
KA: რა სიჩქარით უნდა გადაიაროს მანქანამ ამოზნექილი ხიდის ($R = 40\ \text{მ}$) უმაღლესი წერტილი, რომ იქ უწონადობაში აღმოჩნდეს?
EN: At what speed must a car pass over the top of a convex bridge ($R = 40\ \text{m}$) to be weightless there?
HKA: $mg = \dfrac{m v^2}{R}$.
HEN: $mg = \dfrac{m v^2}{R}$.
SKA: $v = \sqrt{g R} = \sqrt{400} = 20\ \text{მ/წმ} = 72\ \text{კმ/სთ}$
SEN: $v = \sqrt{g R} = \sqrt{400} = 20\ \text{m/s} = 72\ \text{km/h}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- hard weight
KA: რაკეტა ვერტიკალურად $30\ \text{მ/წმ}^2$ აჩქარებით ადის. რამდენჯერ მეტია ასტრონავტის წონა ჩვეულებრივზე? რა მაქსიმალური აჩქარება შეიძლება, თუ ადამიანი $8g$ გადატვირთვას უძლებს?

HEN: $\dfrac{W}{mg} = \dfrac{g + a}{g}$.

$8 = \dfrac{10 + a}{10} \Rightarrow a_{\max} = 70\ \text{მ/წმ}^2$
SEN: $\dfrac{10 + 30}{10} = 4$
$8 = \dfrac{10 + a}{10} \Rightarrow a_{\max} = 70\ \text{m/s}^2$

AEN: $4$ times; $70\ \text{m/s}^2$

--- hard weight
KA: ლიფტის ჭერზე ზამბარიანი დინამომეტრით $2\ \text{კგ}$ ტვირთი ჰკიდია. დინამომეტრი $16\ \text{ნ}$-ს აჩვენებს. რა იცით ლიფტის მოძრაობის შესახებ? რამდენ ხანში გაივლის ლიფტი $9\ \text{მ}$-ს, თუ უძრაობიდან იწყებს?
EN: A $2\ \text{kg}$ load hangs from a spring balance on a lift's ceiling. The balance reads $16\ \text{N}$. What can you say about the lift's motion? How long does it take to cover $9\ \text{m}$ starting from rest?
HKA: $T < mg$ — აჩქარება ქვემოთ.
HEN: $T < mg$ — acceleration downwards.
SKA: $a = \dfrac{20 - 16}{2} = 2\ \text{მ/წმ}^2$, ქვემოთ — ლიფტი ქვემოთ აჩქარდება (ან ზემოთ ამუხრუჭებს).
უძრაობიდან: $t = \sqrt{\dfrac{2 \cdot 9}{2}} = 3\ \text{წმ}$
SEN: $a = \dfrac{20 - 16}{2} = 2\ \text{m/s}^2$, downwards — the lift speeds up going down (or slows going up).
From rest: $t = \sqrt{\dfrac{2 \cdot 9}{2}} = 3\ \text{s}$
AKA: $a = 2\ \text{მ/წმ}^2$ ქვემოთ; $3\ \text{წმ}$
AEN: $a = 2\ \text{m/s}^2$ down; $3\ \text{s}$

--- hard weight
KA: ბატუტზე მხტუნავი ($50\ \text{კგ}$) $3{,}2\ \text{მ}$ სიმაღლიდან ეცემა ბატუტს, რომელიც $0{,}5\ \text{მ}$-ით იზნიქება. იპოვეთ ბატუტის საშუალო ძალა და საშუალო გადატვირთვა.
EN: A $50\ \text{kg}$ trampolinist falls $3.2\ \text{m}$ onto a trampoline that sags $0.5\ \text{m}$. Find the trampoline's average force and the average g-force.
HKA: $F \cdot 0{,}5 = m g (3{,}2 + 0{,}5)$.
HEN: $F \cdot 0.5 = m g (3.2 + 0.5)$.
SKA: $F = \dfrac{500 \cdot 3{,}7}{0{,}5} = 3700\ \text{ნ}$
$\dfrac{F}{mg} = 7{,}4$
SEN: $F = \dfrac{500 \cdot 3.7}{0.5} = 3700\ \text{N}$
$\dfrac{F}{mg} = 7.4$
AKA: $3{,}7\ \text{კნ}$; $\approx 7{,}4g$
AEN: $3.7\ \text{kN}$; $\approx 7.4g$

--- hard weight
KA: ლიფტში ($a = 2\ \text{მ/წმ}^2$ ზემოთ) ჭერიდან ჭანჭიკი მოწყდა. ჭერიდან იატაკამდე $2{,}4\ \text{მ}$-ია. რამდენ ხანში დაეცემა იატაკს?
EN: In a lift accelerating up at $2\ \text{m/s}^2$ a bolt comes loose from the ceiling, $2.4\ \text{m}$ above the floor. How long until it hits the floor?
HKA: ლიფტის სისტემაში ჭანჭიკის აჩქარება $g + a$-ა.
HEN: In the lift's frame the bolt's acceleration is $g + a$.
SKA: $t = \sqrt{\dfrac{2h}{g + a}} = \sqrt{\dfrac{4{,}8}{12}} = \sqrt{0{,}4} \approx 0{,}63\ \text{წმ}$
SEN: $t = \sqrt{\dfrac{2h}{g + a}} = \sqrt{\dfrac{4.8}{12}} = \sqrt{0.4} \approx 0.63\ \text{s}$
AKA: $\approx 0{,}63\ \text{წმ}$
AEN: $\approx 0.63\ \text{s}$

--- hard weight
KA: ორბიტალურ სადგურზე „ხელოვნური სიმძიმის“ შესაქმნელად $100\ \text{მ}$ რადიუსის რგოლს აბრუნებენ. რა პერიოდით უნდა ბრუნავდეს, რომ კიდეზე $g$-ის ტოლი „სიმძიმე“ იყოს?
EN: To create "artificial gravity" on a space station, a ring of radius $100\ \text{m}$ is spun. What period gives a "gravity" of $g$ at the rim?
HKA: $\dfrac{4\pi^2 R}{T^2} = g$.
HEN: $\dfrac{4\pi^2 R}{T^2} = g$.
SKA: $T = 2\pi\sqrt{\dfrac{R}{g}} = 2\pi\sqrt{10} \approx 19{,}9\ \text{წმ}$
SEN: $T = 2\pi\sqrt{\dfrac{R}{g}} = 2\pi\sqrt{10} \approx 19.9\ \text{s}$
AKA: $\approx 20\ \text{წმ}$
AEN: $\approx 20\ \text{s}$

--- hard weight
KA: მძიმე ტვირთს ($100\ \text{კგ}$) ამწე თოკით ($T_{\max} = 1500\ \text{ნ}$) სწევს. რა მინიმალურ დროში შეიძლება უძრაობიდან $15\ \text{მ}$-ზე აწევა, თუ ბოლოს ტვირთი ისევ უძრავია, შენელება კი $g$-ზე მეტი ვერ იქნება?
EN: A crane lifts a $100\ \text{kg}$ load with a cable that holds at most $1500\ \text{N}$. What is the least time to lift it $15\ \text{m}$ from rest to rest, if the deceleration can't exceed $g$ (slack cable)?
HKA: მაქსიმალური აჩქარება $5\ \text{მ/წმ}^2$, მაქსიმალური შენელება $10\ \text{მ/წმ}^2$.
HEN: Max acceleration $5\ \text{m/s}^2$, max deceleration $10\ \text{m/s}^2$.
SKA: $a_1 = \dfrac{1500 - 1000}{100} = 5\ \text{მ/წმ}^2$, $a_2 = 10\ \text{მ/წმ}^2$
$\dfrac{v^2}{10} + \dfrac{v^2}{20} = 15 \Rightarrow v^2 = 100 \Rightarrow v = 10\ \text{მ/წმ}$
$t = \dfrac{10}{5} + \dfrac{10}{10} = 3\ \text{წმ}$
SEN: $a_1 = \dfrac{1500 - 1000}{100} = 5\ \text{m/s}^2$, $a_2 = 10\ \text{m/s}^2$
$\dfrac{v^2}{10} + \dfrac{v^2}{20} = 15 \Rightarrow v^2 = 100 \Rightarrow v = 10\ \text{m/s}$
$t = \dfrac{10}{5} + \dfrac{10}{10} = 3\ \text{s}$
AKA: $3\ \text{წმ}$
AEN: $3\ \text{s}$

--- easy forces
KA: ზამბარა ($k = 200\ \text{ნ/მ}$) $3\ \text{სმ}$-ითაა გაჭიმული. იპოვეთ დრეკადობის ძალა.
EN: A spring ($k = 200\ \text{N/m}$) is stretched $3\ \text{cm}$. Find the elastic force.
HKA: $F = k x$.
HEN: $F = k x$.
SKA: $F = 200 \cdot 0{,}03 = 6\ \text{ნ}$
SEN: $F = 200 \cdot 0.03 = 6\ \text{N}$
AKA: $6\ \text{ნ}$
AEN: $6\ \text{N}$

--- easy forces
KA: $5\ \text{კგ}$ ყუთზე ჰორიზონტალურ იატაკზე ($\mu = 0{,}3$) რა სრიალის ხახუნის ძალა მოქმედებს?
EN: What sliding friction acts on a $5\ \text{kg}$ box on a horizontal floor ($\mu = 0.3$)?
HKA: $F = \mu m g$.
HEN: $F = \mu m g$.
SKA: $F = 0{,}3 \cdot 50 = 15\ \text{ნ}$
SEN: $F = 0.3 \cdot 50 = 15\ \text{N}$
AKA: $15\ \text{ნ}$
AEN: $15\ \text{N}$

--- easy forces
KA: ზამბარაზე $0{,}5\ \text{კგ}$ ტვირთი ჩამოკიდეს და ის $2\ \text{სმ}$-ით გაიჭიმა. იპოვეთ სიხისტე.
EN: A $0.5\ \text{kg}$ load stretches a spring by $2\ \text{cm}$. Find the stiffness.
HKA: $k = \dfrac{mg}{x}$.
HEN: $k = \dfrac{mg}{x}$.
SKA: $k = \dfrac{5}{0{,}02} = 250\ \text{ნ/მ}$
SEN: $k = \dfrac{5}{0.02} = 250\ \text{N/m}$

--- easy forces
KA: სამი სახის ხახუნი არსებობს: უძრაობის, სრიალისა და გორვის. რომელია ჩვეულებრივ ყველაზე მცირე? მოიყვანეთ მაგალითები.
EN: There are three kinds of friction: static, sliding and rolling. Which is usually smallest? Give examples.
HKA: რატომ აქვს ჩემოდანს თვლები?
HEN: Why do suitcases have wheels?
SKA: ყველაზე მცირეა გორვის ხახუნი (თვლები, საკისრები).
უძრაობის — მაგიდაზე მდებარე წიგნი, რომელსაც ოდნავ ვუბიძგებთ; სრიალის — თოვლზე მარხილი; გორვის — ველოსიპედის ბორბალი.
SEN: Rolling friction is usually the smallest (wheels, bearings).
Static — a book on a table that you push gently; sliding — a sledge on snow; rolling — a bicycle wheel.
AKA: გორვის ხახუნი
AEN: rolling friction

--- easy forces
KA: ძელი ჰორიზონტალურ მაგიდაზე თანაბრად მოძრაობს $8\ \text{ნ}$ ძალით; მისი წონაა $40\ \text{ნ}$. იპოვეთ ხახუნის კოეფიციენტი.
EN: A block weighing $40\ \text{N}$ is pulled uniformly across a table with $8\ \text{N}$. Find the coefficient of friction.
HKA: $\mu = \dfrac{F}{N}$.
HEN: $\mu = \dfrac{F}{N}$.
SKA: $\mu = \dfrac{8}{40} = 0{,}2$
SEN: $\mu = \dfrac{8}{40} = 0.2$
AKA: $0{,}2$
AEN: $0.2$

--- easy forces
KA: ორი ერთნაირი ზამბარა ($k = 100\ \text{ნ/მ}$) პარალელურადაა შეერთებული. რას უდრის სისტემის სიხისტე? მიმდევრობით?
EN: Two identical springs ($k = 100\ \text{N/m}$) are connected in parallel. What is the combined stiffness? In series?
HKA: პარალელური: $k_1 + k_2$; მიმდევრობითი: $\dfrac{k_1 k_2}{k_1 + k_2}$.
HEN: Parallel: $k_1 + k_2$; series: $\dfrac{k_1 k_2}{k_1 + k_2}$.
SKA: პარალელური: $200\ \text{ნ/მ}$; მიმდევრობითი: $50\ \text{ნ/მ}$.
SEN: Parallel: $200\ \text{N/m}$; series: $50\ \text{N/m}$.
AKA: $200\ \text{ნ/მ}$; $50\ \text{ნ/მ}$
AEN: $200\ \text{N/m}$; $50\ \text{N/m}$

--- medium forces
KA: მანქანა $72\ \text{კმ/სთ}$-ით მოძრაობს; ბორბლები ჩაიკეტა ($\mu = 0{,}5$). რა მანძილზე გაჩერდება?
EN: A car at $72\ \text{km/h}$ locks its wheels ($\mu = 0.5$). How far does it skid before stopping?
HKA: $a = \mu g$.
HEN: $a = \mu g$.
SKA: $a = 5\ \text{მ/წმ}^2$, $\ s = \dfrac{400}{10} = 40\ \text{მ}$
SEN: $a = 5\ \text{m/s}^2$, $\ s = \dfrac{400}{10} = 40\ \text{m}$
AKA: $40\ \text{მ}$
AEN: $40\ \text{m}$

--- medium forces
KA: დახრილი სიბრტყის რა კუთხისას დაიწყებს ძელი სრიალს, თუ $\mu = 0{,}577$?
EN: At what incline angle does a block begin to slide if $\mu = 0.577$?
HKA: $\tan\alpha = \mu$.
HEN: $\tan\alpha = \mu$.
SKA: $\tan\alpha = 0{,}577 \Rightarrow \alpha = 30°$
SEN: $\tan\alpha = 0.577 \Rightarrow \alpha = 30°$
AKA: $30°$
AEN: $30°$

--- medium forces
KA: ზამბარით ($k = 400\ \text{ნ/მ}$) $5\ \text{კგ}$ ძელს მაგიდაზე ($\mu = 0{,}2$) $1\ \text{მ/წმ}^2$-ით აჩქარებით ეწევიან. რამდენით არის ზამბარა გაჭიმული?
EN: A spring ($k = 400\ \text{N/m}$) pulls a $5\ \text{kg}$ block across a table ($\mu = 0.2$) with an acceleration of $1\ \text{m/s}^2$. How much is the spring stretched?
HKA: $k x = m a + \mu m g$.
HEN: $k x = m a + \mu m g$.
SKA: $k x = 5 + 10 = 15\ \text{ნ} \Rightarrow x = \dfrac{15}{400} = 3{,}75\ \text{სმ}$
SEN: $k x = 5 + 10 = 15\ \text{N} \Rightarrow x = \dfrac{15}{400} = 3.75\ \text{cm}$
AKA: $3{,}75\ \text{სმ}$
AEN: $3.75\ \text{cm}$

--- medium forces
KA: მანქანას მხოლოდ წინა (წამყვანი) ბორბლები აჩქარებს, რომლებზეც წონის ნახევარი მოდის. $\mu = 0{,}6$. რა მაქსიმალური აჩქარება შეუძლია?
EN: A car is driven by its front wheels only, which carry half its weight. $\mu = 0.6$. What is its maximum acceleration?
HKA: მაქსიმალური წევა $\mu \cdot \dfrac{mg}{2}$.
HEN: Maximum traction $\mu \cdot \dfrac{mg}{2}$.
SKA: $m a = 0{,}6 \cdot \dfrac{m g}{2} \Rightarrow a = 3\ \text{მ/წმ}^2$
SEN: $m a = 0.6 \cdot \dfrac{m g}{2} \Rightarrow a = 3\ \text{m/s}^2$
AKA: $3\ \text{მ/წმ}^2$
AEN: $3\ \text{m/s}^2$

--- medium forces
KA: ზამბარა $2\ \text{ნ}$-ით $14\ \text{სმ}$-ია, $5\ \text{ნ}$-ით — $20\ \text{სმ}$. რა სიგრძე ექნება $8\ \text{ნ}$-ით?
EN: A spring is $14\ \text{cm}$ long under $2\ \text{N}$ and $20\ \text{cm}$ under $5\ \text{N}$. How long is it under $8\ \text{N}$?
HKA: $k = \dfrac{\Delta F}{\Delta l}$.
HEN: $k = \dfrac{\Delta F}{\Delta l}$.
SKA: $k = \dfrac{3}{0{,}06} = 50\ \text{ნ/მ}$, $\ l_0 = 14 - 4 = 10\ \text{სმ}$
$l = 10 + \dfrac{8}{50} \cdot 100 = 26\ \text{სმ}$
SEN: $k = \dfrac{3}{0.06} = 50\ \text{N/m}$, $\ l_0 = 14 - 4 = 10\ \text{cm}$
$l = 10 + \dfrac{8}{50} \cdot 100 = 26\ \text{cm}$
AKA: $26\ \text{სმ}$
AEN: $26\ \text{cm}$

--- medium forces
KA: მაგნიტი ($0{,}1\ \text{კგ}$) მაცივრის ვერტიკალურ კარს ეკვრის, $\mu = 0{,}4$. რა მინიმალური ძალით უნდა იზიდავდეს მაგნიტი კარს, რომ არ ჩამოსრიალდეს?
EN: A $0.1\ \text{kg}$ magnet sticks to a vertical fridge door, $\mu = 0.4$. What minimum attraction keeps it from sliding down?
HKA: $\mu F \ge m g$.
HEN: $\mu F \ge m g$.
SKA: $F = \dfrac{1}{0{,}4} = 2{,}5\ \text{ნ}$
SEN: $F = \dfrac{1}{0.4} = 2.5\ \text{N}$
AKA: $2{,}5\ \text{ნ}$
AEN: $2.5\ \text{N}$

--- hard forces
KA: დახრილ სიბრტყეზე ($30°$, $\mu = 0{,}3$) ძელი ქვემოთ სრიალებს. იპოვეთ აჩქარება და სიჩქარე $5\ \text{მ}$-ის შემდეგ (უძრაობიდან).
EN: A block slides down a $30°$ incline ($\mu = 0.3$) from rest. Find its acceleration and its speed after $5\ \text{m}$.
HKA: $a = g(\sin\alpha - \mu\cos\alpha)$.
HEN: $a = g(\sin\alpha - \mu\cos\alpha)$.
SKA: $a = 10(0{,}5 - 0{,}3 \cdot 0{,}866) \approx 2{,}4\ \text{მ/წმ}^2$
$v = \sqrt{2 \cdot 2{,}4 \cdot 5} \approx 4{,}9\ \text{მ/წმ}$
SEN: $a = 10(0.5 - 0.3 \cdot 0.866) \approx 2.4\ \text{m/s}^2$
$v = \sqrt{2 \cdot 2.4 \cdot 5} \approx 4.9\ \text{m/s}$
AKA: $\approx 2{,}4\ \text{მ/წმ}^2$; $\approx 4{,}9\ \text{მ/წმ}$
AEN: $\approx 2.4\ \text{m/s}^2$; $\approx 4.9\ \text{m/s}$

--- hard forces
KA: ძელზე ($3\ \text{კგ}$) $2\ \text{კგ}$ ძელი დევს; ძელებს შორის $\mu_1 = 0{,}4$, ქვედასა და მაგიდას შორის ხახუნი არ არის. ქვედა ძელს რა მაქსიმალური ჰორიზონტალური ძალით შეიძლება ვქაჩოთ, რომ ზედა არ ჩამოსრიალდეს?
EN: A $2\ \text{kg}$ block sits on a $3\ \text{kg}$ block; between them $\mu = 0.4$, and the table is frictionless. What maximum horizontal force on the lower block keeps the top one from slipping?
HKA: ზედა ძელს აჩქარებს მხოლოდ ხახუნი: $a_{\max} = \mu g$.
HEN: Only friction accelerates the top block: $a_{\max} = \mu g$.
SKA: $a_{\max} = 4\ \text{მ/წმ}^2$
$F = (2 + 3) \cdot 4 = 20\ \text{ნ}$
SEN: $a_{\max} = 4\ \text{m/s}^2$
$F = (2 + 3) \cdot 4 = 20\ \text{N}$
AKA: $20\ \text{ნ}$
AEN: $20\ \text{N}$

--- hard forces
KA: ვერტიკალურ კედელს $2\ \text{კგ}$ ძელი ჰორიზონტალური $F$ ძალით აქვს მიჭერილი, $\mu = 0{,}5$. რა ძალით უნდა მივაჭიროთ, რომ ის $2\ \text{მ/წმ}^2$-ით სრიალებდეს ქვემოთ?
EN: A $2\ \text{kg}$ block is pressed against a vertical wall by a horizontal force $F$; $\mu = 0.5$. What $F$ makes it slide down with an acceleration of $2\ \text{m/s}^2$?
HKA: $m a = m g - \mu F$.
HEN: $m a = m g - \mu F$.
SKA: $4 = 20 - 0{,}5 F \Rightarrow F = 32\ \text{ნ}$
SEN: $4 = 20 - 0.5 F \Rightarrow F = 32\ \text{N}$
AKA: $32\ \text{ნ}$
AEN: $32\ \text{N}$

--- hard forces
KA: ზამბარაზე ($k = 500\ \text{ნ/მ}$) ჩამოკიდებული $1\ \text{კგ}$ ტვირთი ლიფტში $2\ \text{სმ}$-ით მეტად არის გაჭიმული, ვიდრე უძრავ ლიფტში. საით და რა აჩქარებით მოძრაობს ლიფტი?
EN: A $1\ \text{kg}$ load on a spring ($k = 500\ \text{N/m}$) in a lift stretches it $2\ \text{cm}$ more than in a lift at rest. Which way and how much is the lift accelerating?
HKA: დამატებითი ძალა $k \Delta x = m a$.
HEN: The extra force $k \Delta x = m a$.
SKA: $m a = 500 \cdot 0{,}02 = 10\ \text{ნ} \Rightarrow a = 10\ \text{მ/წმ}^2$, ზემოთ.
SEN: $m a = 500 \cdot 0.02 = 10\ \text{N} \Rightarrow a = 10\ \text{m/s}^2$, upwards.
AKA: $10\ \text{მ/წმ}^2$ ზემოთ
AEN: $10\ \text{m/s}^2$ upwards

--- hard forces olympiad
KA: გრძელ ფიცარზე ($M = 4\ \text{კგ}$, გლუვ იატაკზე) $1\ \text{კგ}$ ძელი დევს, $\mu = 0{,}3$. ძელს $5\ \text{ნ}$ ჰორიზონტალური ძალით ეწევიან. იპოვეთ ძელისა და ფიცრის აჩქარებები.
EN: A $1\ \text{kg}$ block lies on a long $4\ \text{kg}$ board on a smooth floor; $\mu = 0.3$. The block is pulled horizontally with $5\ \text{N}$. Find the accelerations of the block and the board.
HKA: ჯერ შეამოწმეთ, სრიალებს თუ არა ძელი ფიცარზე.
HEN: First check whether the block slips on the board.
SKA: ერთად რომ მოძრაობდნენ: $a = \dfrac{5}{5} = 1\ \text{მ/წმ}^2$; ფიცარს ხახუნი უნდა აძლევდეს $4\ \text{ნ} > \mu m g = 3\ \text{ნ}$ — შეუძლებელია, ძელი სრიალებს.
ძელი: $a_1 = \dfrac{5 - 3}{1} = 2\ \text{მ/წმ}^2$; ფიცარი: $a_2 = \dfrac{3}{4} = 0{,}75\ \text{მ/წმ}^2$
SEN: If they moved together: $a = \dfrac{5}{5} = 1\ \text{m/s}^2$; friction would have to give the board $4\ \text{N} > \mu m g = 3\ \text{N}$ — impossible, so the block slips.
Block: $a_1 = \dfrac{5 - 3}{1} = 2\ \text{m/s}^2$; board: $a_2 = \dfrac{3}{4} = 0.75\ \text{m/s}^2$
AKA: $2\ \text{მ/წმ}^2$ და $0{,}75\ \text{მ/წმ}^2$
AEN: $2\ \text{m/s}^2$ and $0.75\ \text{m/s}^2$

--- hard forces olympiad
KA: თოკი ბოძზე $n$-ჯერ არის შემოხვეული. ერთ ბოლოს ტვირთი აქვს, მეორეს ადამიანი მცირე ძალით იჭერს. რატომ შეუძლია ადამიანს ძალიან მძიმე ტვირთის დაჭერა? (თვისობრივად; ფორმულა: $T_2 = T_1 e^{-2\pi n \mu}$)
EN: A rope is wound $n$ times round a post. One end holds a load; a person holds the other with a small force. Why can they hold a very heavy load? (Qualitatively; the formula is $T_2 = T_1 e^{-2\pi n \mu}$.)
HKA: თოკის ყოველ მონაკვეთზე ხახუნი დაჭიმულობის პროპორციულია.
HEN: On each bit of rope the friction is proportional to the tension.
SKA: ბოძზე თოკის თითოეული ნაწილი ბოძს აწვება დაჭიმულობის პროპორციული ძალით და ხახუნი დაჭიმულობას თანდათან, ექსპონენციალურად ამცირებს.
მაგ., $\mu = 0{,}3$, $n = 3$: $e^{-2\pi \cdot 3 \cdot 0{,}3} = e^{-5{,}65} \approx \dfrac{1}{280}$ — $280$-ჯერ ნაკლები ძალა ჰყოფნის!
SEN: Each bit of rope on the post presses on it with a force proportional to the tension, and friction reduces the tension step by step — exponentially.
E.g. $\mu = 0.3$, $n = 3$: $e^{-2\pi \cdot 3 \cdot 0.3} = e^{-5.65} \approx \dfrac{1}{280}$ — a force $280$ times smaller is enough!
AKA: ხახუნი დაჭიმულობას ექსპონენციალურად ამცირებს
AEN: friction reduces the tension exponentially

--- easy circular
KA: ბორბალი წამში $5$ ბრუნს აკეთებს. იპოვეთ სიხშირე და პერიოდი.
EN: A wheel makes $5$ turns per second. Find the frequency and the period.
HKA: $T = \dfrac{1}{\nu}$.
HEN: $T = \dfrac{1}{f}$.
SKA: $\nu = 5\ \text{ჰც}$, $\ T = 0{,}2\ \text{წმ}$
SEN: $f = 5\ \text{Hz}$, $\ T = 0.2\ \text{s}$
