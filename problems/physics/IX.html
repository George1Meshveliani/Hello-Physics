HKA: $F = k x$.
HEN: $F = k x$.
SKA: **ფორმულა:** $F = k x$
**რიცხვები:** $F = 300 \cdot 0{,}05 = 15\ \text{ნ}$
SEN: **Formula:** $F = k x$
**Numbers:** $F = 300 \cdot 0.05 = 15\ \text{N}$
AKA: $15\ \text{ნ}$
AEN: $15\ \text{N}$

--- easy circular
KA: $0{,}5\ \text{მ}$ რადიუსიანი ბორბლის თვლის წერტილი $10\ \text{მ/წმ}$ სიჩქარით მოძრაობს (ღერძის მიმართ). იპოვეთ მისი ცენტრისკენული აჩქარება.
EN: A point on the rim of a wheel of radius $0.5\ \text{m}$ moves at $10\ \text{m/s}$ (relative to the axle). Find its centripetal acceleration.
HKA: $a = \dfrac{v^2}{r}$.
HEN: $a = \dfrac{v^2}{r}$.
SKA: **ფორმულა:** $a_{\text{ც}} = \dfrac{v^2}{r}$
**რიცხვები:** $a_{\text{ც}} = \dfrac{100}{0{,}5} = 200\ \text{მ/წმ}^2$ — $g$-ზე $20$-ჯერ მეტი!
SEN: **Formula:** $a_{\text{c}} = \dfrac{v^2}{r}$
**Numbers:** $a_{\text{c}} = \dfrac{100}{0.5} = 200\ \text{m/s}^2$ — $20$ times $g$!
AKA: $200\ \text{მ/წმ}^2$
AEN: $200\ \text{m/s}^2$

--- easy circular
KA: კარუსელი $10\ \text{წმ}$-ში ერთ სრულ ბრუნს აკეთებს. ცენტრიდან $5\ \text{მ}$-ზე მჯდომი ბავშვის სიჩქარე რას უდრის?
EN: A merry-go-round makes one full turn in $10\ \text{s}$. What is the speed of a child sitting $5\ \text{m}$ from the centre?
HKA: $v = \dfrac{2\pi r}{T}$.
HEN: $v = \dfrac{2\pi r}{T}$.
SKA: **ფორმულა:** $v = \dfrac{2\pi r}{T}$
**რიცხვები:** $v = \dfrac{2 \cdot 3{,}14 \cdot 5}{10} \approx 3{,}14\ \text{მ/წმ}$
SEN: **Formula:** $v = \dfrac{2\pi r}{T}$
**Numbers:** $v = \dfrac{2 \cdot 3.14 \cdot 5}{10} \approx 3.14\ \text{m/s}$
AKA: $\approx 3{,}14\ \text{მ/წმ}$
AEN: $\approx 3.14\ \text{m/s}$

--- easy momentum
KA: რას უდრის $72\ \text{კმ/სთ}$ სიჩქარით მოძრავი $1000\ \text{კგ}$ მასის ავტომობილის იმპულსი?
EN: What is the momentum of a $1000\ \text{kg}$ car moving at $72\ \text{km/h}$?
HKA: სიჩქარე $\text{მ/წმ}$-ში გადაიყვანეთ.
HEN: Convert the speed to $\text{m/s}$.
SKA: **ფორმულა:** $p = m v$
**რიცხვები:** $v = 20\ \text{მ/წმ}$, $\ p = 1000 \cdot 20 = 2 \cdot 10^4\ \text{კგ}\cdot\text{მ/წმ}$
SEN: **Formula:** $p = m v$
**Numbers:** $v = 20\ \text{m/s}$, $\ p = 1000 \cdot 20 = 2 \times 10^4\ \text{kg}\cdot\text{m/s}$
AKA: $2 \cdot 10^4\ \text{კგ}\cdot\text{მ/წმ}$
AEN: $2 \times 10^4\ \text{kg}\cdot\text{m/s}$

--- easy energy
KA: $0{,}1\ \text{კგ}$ მასის ბურთი $20\ \text{მ/წმ}$ სიჩქარით მიფრინავს. რას უდრის მისი კინეტიკური ენერგია?
EN: A $0.1\ \text{kg}$ ball flies at $20\ \text{m/s}$. What is its kinetic energy?
HKA: $E_k = \dfrac{m v^2}{2}$.
HEN: $E_k = \dfrac{m v^2}{2}$.
SKA: **ფორმულა:** $E_k = \dfrac{m v^2}{2}$
**რიცხვები:** $E_k = \dfrac{0{,}1 \cdot 400}{2} = 20\ \text{ჯ}$
SEN: **Formula:** $E_k = \dfrac{m v^2}{2}$
**Numbers:** $E_k = \dfrac{0.1 \cdot 400}{2} = 20\ \text{J}$
AKA: $20\ \text{ჯ}$
AEN: $20\ \text{J}$

--- easy statics
KA: ქანჩის გასაღების ტარზე, ღერძიდან $0{,}3\ \text{მ}$-ზე, $50\ \text{ნ}$ ძალა მოქმედებს მართობულად. რას უდრის ძალის მომენტი? რატომ არის გრძელი გასაღებით მუშაობა ადვილი?
EN: A force of $50\ \text{N}$ acts at right angles on a spanner handle $0.3\ \text{m}$ from the nut. What is the moment of the force? Why is a long spanner easier to use?
HKA: $M = F d$.
HEN: $M = F d$.
SKA: **ფორმულა:** $M = F\,d$
**რიცხვები:** $M = 50 \cdot 0{,}3 = 15\ \text{ნ}\cdot\text{მ}$
გრძელი ტარით ერთსა და იმავე მომენტს ნაკლები ძალით ვიღებთ.
SEN: **Formula:** $M = F\,d$
**Numbers:** $M = 50 \cdot 0.3 = 15\ \text{N}\cdot\text{m}$
A longer handle gives the same moment with less force.
AKA: $15\ \text{ნ}\cdot\text{მ}$
AEN: $15\ \text{N}\cdot\text{m}$

--- medium vectors
KA: წვიმა ვერტიკალურად $8\ \text{მ/წმ}$ სიჩქარით მოდის. ავტომობილი $6\ \text{მ/წმ}$ სიჩქარით მიდის. რა სიჩქარით და ვერტიკალთან რა კუთხით ეცემა წვიმის წვეთები ავტომობილის გვერდით მინას (ავტომობილის მიმართ)?
EN: Rain falls vertically at $8\ \text{m/s}$. A car drives at $6\ \text{m/s}$. At what speed and angle to the vertical do the drops hit the side window (relative to the car)?
HKA: ავტომობილის მიმართ წვიმას ემატება ჰორიზონტალური სიჩქარე $6\ \text{მ/წმ}$ უკან.
HEN: Relative to the car the rain gains a horizontal velocity of $6\ \text{m/s}$ backwards.
SKA: **ფორმულა:** $v_{\text{ფ}} = \sqrt{v_{\text{წ}}^2 + v_{\text{ა}}^2}$, $\ \tan\alpha = \dfrac{v_{\text{ა}}}{v_{\text{წ}}}$
**რიცხვები:** $v_{\text{ფ}} = \sqrt{64 + 36} = 10\ \text{მ/წმ}$, $\ \tan\alpha = 0{,}75 \Rightarrow \alpha \approx 37^\circ$
SEN: **Formula:** $v_{\text{rel}} = \sqrt{v_{\text{rain}}^2 + v_{\text{car}}^2}$, $\ \tan\alpha = \dfrac{v_{\text{car}}}{v_{\text{rain}}}$
**Numbers:** $v_{\text{rel}} = \sqrt{64 + 36} = 10\ \text{m/s}$, $\ \tan\alpha = 0.75 \Rightarrow \alpha \approx 37^\circ$
AKA: $10\ \text{მ/წმ}$; $\approx 37^\circ$
AEN: $10\ \text{m/s}$; $\approx 37^\circ$

--- medium accel
KA: ავტომობილის სიჩქარე $100\ \text{მ}$ მონაკვეთზე $30\ \text{მ/წმ}$-დან $10\ \text{მ/წმ}$-მდე შემცირდა. იპოვეთ აჩქარება და დამუხრუჭების დრო.
EN: A car slows from $30\ \text{m/s}$ to $10\ \text{m/s}$ over $100\ \text{m}$. Find the acceleration and the braking time.
HKA: $v^2 - v_0^2 = 2 a s$.
HEN: $v^2 - v_0^2 = 2 a s$.
SKA: **ფორმულა:** $a = \dfrac{v^2 - v_0^2}{2s}$, $\ t = \dfrac{v - v_0}{a}$
**რიცხვები:** $a = \dfrac{100 - 900}{200} = -4\ \text{მ/წმ}^2$, $\ t = \dfrac{10 - 30}{-4} = 5\ \text{წმ}$
SEN: **Formula:** $a = \dfrac{v^2 - v_0^2}{2s}$, $\ t = \dfrac{v - v_0}{a}$
**Numbers:** $a = \dfrac{100 - 900}{200} = -4\ \text{m/s}^2$, $\ t = \dfrac{10 - 30}{-4} = 5\ \text{s}$
AKA: $-4\ \text{მ/წმ}^2$; $5\ \text{წმ}$
AEN: $-4\ \text{m/s}^2$; $5\ \text{s}$

--- medium accel
KA: მძღოლი საფრთხეს $20\ \text{მ/წმ}$ სიჩქარით მოძრაობისას ამჩნევს. მისი რეაქციის დრო $1\ \text{წმ}$-ია, შემდეგ ავტომობილი $5\ \text{მ/წმ}^2$ აჩქარებით მუხრუჭებს. იპოვეთ გაჩერების სრული მანძილი.
EN: A driver moving at $20\ \text{m/s}$ sees a hazard. Their reaction time is $1\ \text{s}$, then the car brakes at $5\ \text{m/s}^2$. Find the total stopping distance.
HKA: რეაქციის დროს ავტომობილი თანაბრად მოძრაობს.
HEN: During the reaction time the car moves at constant speed.
SKA: **ფორმულა:** $s = v t_{\text{რ}} + \dfrac{v^2}{2a}$
**რიცხვები:** $s = 20 \cdot 1 + \dfrac{400}{10} = 20 + 40 = 60\ \text{მ}$
SEN: **Formula:** $s = v t_{\text{r}} + \dfrac{v^2}{2a}$
**Numbers:** $s = 20 \cdot 1 + \dfrac{400}{10} = 20 + 40 = 60\ \text{m}$
AKA: $60\ \text{მ}$
AEN: $60\ \text{m}$

--- medium accel
KA: სხეულის სიჩქარე იცვლება კანონით $v = 4 + 2t$ (SI). იპოვეთ საწყისი სიჩქარე, აჩქარება და პირველ $5\ \text{წმ}$-ში გავლილი გზა.
EN: A body's velocity changes as $v = 4 + 2t$ (SI). Find the initial velocity, the acceleration and the distance covered in the first $5\ \text{s}$.
HKA: შეადარეთ ფორმულას $v = v_0 + a t$.
HEN: Compare with $v = v_0 + a t$.
SKA: **ფორმულა:** $v_0 = 4\ \text{მ/წმ}$, $a = 2\ \text{მ/წმ}^2$; $\ s = v_0 t + \dfrac{a t^2}{2}$
**რიცხვები:** $s = 4 \cdot 5 + \dfrac{2 \cdot 25}{2} = 20 + 25 = 45\ \text{მ}$
SEN: **Formula:** $v_0 = 4\ \text{m/s}$, $a = 2\ \text{m/s}^2$; $\ s = v_0 t + \dfrac{a t^2}{2}$
**Numbers:** $s = 4 \cdot 5 + \dfrac{2 \cdot 25}{2} = 20 + 25 = 45\ \text{m}$
AKA: $4\ \text{მ/წმ}$; $2\ \text{მ/წმ}^2$; $45\ \text{მ}$
AEN: $4\ \text{m/s}$; $2\ \text{m/s}^2$; $45\ \text{m}$

--- medium accel
KA: თანაბარაჩქარებული მოძრაობისას სიჩქარე $5\ \text{წმ}$-ში $10\ \text{მ/წმ}$-დან $30\ \text{მ/წმ}$-მდე გაიზარდა. იპოვეთ საშუალო სიჩქარე და გავლილი გზა.
EN: In uniformly accelerated motion the speed rose from $10\ \text{m/s}$ to $30\ \text{m/s}$ in $5\ \text{s}$. Find the average speed and the distance.
HKA: თანაბარაჩქარებული მოძრაობისას $v_{\text{საშ}} = \dfrac{v_0 + v}{2}$.
HEN: In uniform acceleration $v_{\text{avg}} = \dfrac{v_0 + v}{2}$.
SKA: **ფორმულა:** $v_{\text{საშ}} = \dfrac{v_0 + v}{2}$, $\ s = v_{\text{საშ}}\,t$
**რიცხვები:** $v_{\text{საშ}} = 20\ \text{მ/წმ}$, $\ s = 20 \cdot 5 = 100\ \text{მ}$
SEN: **Formula:** $v_{\text{avg}} = \dfrac{v_0 + v}{2}$, $\ s = v_{\text{avg}}\,t$
**Numbers:** $v_{\text{avg}} = 20\ \text{m/s}$, $\ s = 20 \cdot 5 = 100\ \text{m}$
AKA: $20\ \text{მ/წმ}$; $100\ \text{მ}$
AEN: $20\ \text{m/s}$; $100\ \text{m}$

--- medium freefall
KA: $30\ \text{მ}$ სიმაღლიდან ბურთი ვერტიკალურად ქვემოთ $5\ \text{მ/წმ}$ სიჩქარით ისროლეს. რა დროში და რა სიჩქარით დაეცემა ის მიწას?
EN: A ball is thrown straight down at $5\ \text{m/s}$ from $30\ \text{m}$. When and at what speed does it hit the ground?
HKA: $h = v_0 t + \dfrac{g t^2}{2}$ — კვადრატული განტოლება $t$-ის მიმართ.
HEN: $h = v_0 t + \dfrac{g t^2}{2}$ — a quadratic in $t$.
SKA: **ფორმულა:** $h = v_0 t + \dfrac{g t^2}{2}$, $\ v = v_0 + g t$
**რიცხვები:** $30 = 5t + 5t^2 \Rightarrow t^2 + t - 6 = 0 \Rightarrow t = 2\ \text{წმ}$
$v = 5 + 20 = 25\ \text{მ/წმ}$
SEN: **Formula:** $h = v_0 t + \dfrac{g t^2}{2}$, $\ v = v_0 + g t$
**Numbers:** $30 = 5t + 5t^2 \Rightarrow t^2 + t - 6 = 0 \Rightarrow t = 2\ \text{s}$
$v = 5 + 20 = 25\ \text{m/s}$
AKA: $2\ \text{წმ}$; $25\ \text{მ/წმ}$
AEN: $2\ \text{s}$; $25\ \text{m/s}$

--- medium freefall
KA: $500\ \text{მ}$ სიმაღლეზე ჰორიზონტალურად $100\ \text{მ/წმ}$ სიჩქარით მფრინავი თვითმფრინავიდან ტვირთი ჩამოაგდეს. რამდენ ხანს ივარდნის ის და მიზნამდე რა ჰორიზონტალურ მანძილზე უნდა ჩამოაგდონ?
EN: A plane flying horizontally at $100\ \text{m/s}$ at a height of $500\ \text{m}$ drops a package. How long does it fall, and how far before the target must it be released?
HKA: ტვირთს თვითმფრინავის ჰორიზონტალური სიჩქარე აქვს.
HEN: The package keeps the plane's horizontal speed.
SKA: **ფორმულა:** $t = \sqrt{\dfrac{2h}{g}}$, $\ L = v t$
**რიცხვები:** $t = \sqrt{100} = 10\ \text{წმ}$, $\ L = 100 \cdot 10 = 1000\ \text{მ}$
SEN: **Formula:** $t = \sqrt{\dfrac{2h}{g}}$, $\ L = v t$
**Numbers:** $t = \sqrt{100} = 10\ \text{s}$, $\ L = 100 \cdot 10 = 1000\ \text{m}$
AKA: $10\ \text{წმ}$; $1\ \text{კმ}$
AEN: $10\ \text{s}$; $1\ \text{km}$

--- medium newton2
KA: $500\ \text{კგ}$ ტვირთს ამწე ბაგირით $1\ \text{მ/წმ}^2$ აჩქარებით ზემოთ სწევს. რას უდრის ბაგირის დაჭიმულობა?
EN: A crane lifts a $500\ \text{kg}$ load on a cable with an upward acceleration of $1\ \text{m/s}^2$. What is the tension in the cable?
HKA: $T - m g = m a$.
HEN: $T - m g = m a$.
SKA: **ფორმულა:** $T = m (g + a)$
**რიცხვები:** $T = 500 \cdot 11 = 5500\ \text{ნ}$
SEN: **Formula:** $T = m (g + a)$
**Numbers:** $T = 500 \cdot 11 = 5500\ \text{N}$
AKA: $5500\ \text{ნ}$
AEN: $5500\ \text{N}$

--- medium newton2
KA: $1200\ \text{კგ}$ ავტომობილი $25\ \text{მ/წმ}$ სიჩქარიდან $5\ \text{წმ}$-ში გაჩერდა. რას უდრის დამამუხრუჭებელი ძალა?
EN: A $1200\ \text{kg}$ car stops from $25\ \text{m/s}$ in $5\ \text{s}$. What is the braking force?
HKA: ჯერ აჩქარება, შემდეგ $F = m a$.
HEN: First the acceleration, then $F = m a$.
SKA: **ფორმულა:** $F = m\dfrac{v_0}{t}$
**რიცხვები:** $a = \dfrac{25}{5} = 5\ \text{მ/წმ}^2$, $\ F = 1200 \cdot 5 = 6000\ \text{ნ}$
SEN: **Formula:** $F = m\dfrac{v_0}{t}$
**Numbers:** $a = \dfrac{25}{5} = 5\ \text{m/s}^2$, $\ F = 1200 \cdot 5 = 6000\ \text{N}$
AKA: $6000\ \text{ნ}$
AEN: $6000\ \text{N}$

--- medium newton2
KA: გლუვ მაგიდაზე ერთმანეთთან მიდგმულია $4\ \text{კგ}$ და $2\ \text{კგ}$ ძელაკები. $4\ \text{კგ}$-იანს ჰორიზონტალურად $30\ \text{ნ}$ ძალით აწვებიან. იპოვეთ აჩქარება და ძელაკებს შორის მოქმედი ძალა.
EN: Blocks of $4\ \text{kg}$ and $2\ \text{kg}$ touch each other on a smooth table. The $4\ \text{kg}$ block is pushed horizontally with $30\ \text{N}$. Find the acceleration and the force between the blocks.
HKA: $2\ \text{კგ}$-იან ძელაკს მხოლოდ კონტაქტის ძალა აჩქარებს.
HEN: Only the contact force accelerates the $2\ \text{kg}$ block.
SKA: **ფორმულა:** $a = \dfrac{F}{m_1 + m_2}$, $\ N = m_2 a$
**რიცხვები:** $a = \dfrac{30}{6} = 5\ \text{მ/წმ}^2$, $\ N = 2 \cdot 5 = 10\ \text{ნ}$
SEN: **Formula:** $a = \dfrac{F}{m_1 + m_2}$, $\ N = m_2 a$
**Numbers:** $a = \dfrac{30}{6} = 5\ \text{m/s}^2$, $\ N = 2 \cdot 5 = 10\ \text{N}$
AKA: $5\ \text{მ/წმ}^2$; $10\ \text{ნ}$
AEN: $5\ \text{m/s}^2$; $10\ \text{N}$

--- medium newton3
KA: „ცხენის პარადოქსი“: ნიუტონის III კანონით ცხენი ურემს და ურემი ცხენს ტოლი ძალებით ექაჩებიან. მაშ, როგორ იძვრება სისტემა?
EN: The "horse and cart paradox": by Newton's third law the horse pulls the cart and the cart pulls the horse with equal forces. So how does the system move?
HKA: III კანონის წყვილი ძალები სხვადასხვა სხეულზეა მოდებული. ცხენის მოძრაობას ის ძალები განსაზღვრავს, რომლებიც **ცხენზე** მოქმედებს.
HEN: Third-law pairs act on different bodies. The horse's motion depends on the forces acting **on the horse**.
SKA: ცხენზე მოქმედებს: ურმის ძალა (უკან) და მიწის უძრაობის ხახუნი (წინ) — ცხენი ფლოქვებით მიწას უკან აწვება, მიწა მას წინ უბიძგებს.
თუ მიწის ძალა მეტია ურმის ძალაზე, ცხენი წინ აჩქარდება.
ურემზე მოქმედებს ცხენის ძალა (წინ) და ხახუნი (უკან); თუ ცხენის ძალა მეტია ხახუნზე, ურემიც აჩქარდება.
ტოლი ძალები სხვადასხვა სხეულზეა მოდებული და ერთმანეთს არ აბათილებს.
SEN: On the horse: the cart's pull (backwards) and static friction from the ground (forwards) — the hooves push the ground back, the ground pushes the horse forward.
If the ground's push exceeds the cart's pull, the horse accelerates.
On the cart: the horse's pull (forwards) and friction (backwards); if the pull exceeds friction, the cart accelerates too.
The equal forces act on different bodies, so they don't cancel.
AKA: წყვილი ძალები სხვადასხვა სხეულზეა; მოძრაობას მიწის ხახუნი იწვევს
AEN: the pair acts on different bodies; the ground's friction drives the motion

--- medium weight
KA: ზემოთ მოძრავი ლიფტი სართულთან გაჩერებისას $2\ \text{მ/წმ}^2$ აჩქარებით ანელებს. რას აჩვენებს მასში მდგომი $60\ \text{კგ}$ მასის ადამიანის სასწორი?
EN: A lift moving up slows down at $2\ \text{m/s}^2$ as it stops at a floor. What do the scales under a $60\ \text{kg}$ person read?
HKA: ზემოთ მოძრაობისას დამუხრუჭება ნიშნავს ქვემოთ მიმართულ აჩქარებას.
HEN: Slowing down while going up means the acceleration points down.
SKA: **ფორმულა:** $P = m (g - a)$
**რიცხვები:** $P = 60 \cdot (10 - 2) = 480\ \text{ნ}$ — ადამიანი „მსუბუქად“ გრძნობს თავს.
SEN: **Formula:** $P = m (g - a)$
**Numbers:** $P = 60 \cdot (10 - 2) = 480\ \text{N}$ — the person feels "lighter".
AKA: $480\ \text{ნ}$
AEN: $480\ \text{N}$

--- medium forces
KA: $5\ \text{კგ}$ ყუთი უძრავად დევს $30^\circ$ დახრილობის დახრილ სიბრტყეზე. იპოვეთ უძრაობის ხახუნის ძალა და საყრდენის რეაქცია.
EN: A $5\ \text{kg}$ box rests on a $30^\circ$ incline. Find the static friction force and the normal force.
HKA: უძრაობისას ხახუნი აწონასწორებს სიმძიმის ძალის სიბრტყის გასწვრივ შემდგენს.
HEN: At rest, friction balances the component of gravity along the slope.
SKA: **ფორმულა:** $F_{\text{ხ}} = m g \sin\alpha$, $\ N = m g \cos\alpha$
**რიცხვები:** $F_{\text{ხ}} = 50 \cdot 0{,}5 = 25\ \text{ნ}$, $\ N = 50 \cdot 0{,}866 \approx 43\ \text{ნ}$
SEN: **Formula:** $F_{\text{fr}} = m g \sin\alpha$, $\ N = m g \cos\alpha$
**Numbers:** $F_{\text{fr}} = 50 \cdot 0.5 = 25\ \text{N}$, $\ N = 50 \cdot 0.866 \approx 43\ \text{N}$
AKA: $25\ \text{ნ}$; $\approx 43\ \text{ნ}$
AEN: $25\ \text{N}$; $\approx 43\ \text{N}$

--- medium forces
KA: ავტომობილს წამყვანი ბორბლებით მიწის ხახუნი აჩქარებს. ხახუნის კოეფიციენტის რა მინიმალური მნიშვნელობისას შეუძლია ავტომობილს $4\ \text{მ/წმ}^2$ აჩქარებით დაძვრა ბორბლების გასრიალების გარეშე (ჩათვალეთ, რომ წონა მთლიანად წამყვან ბორბლებზე მოდის)?
EN: A car is accelerated by ground friction on its driving wheels. What is the minimum coefficient of friction for it to accelerate at $4\ \text{m/s}^2$ without wheelspin (assume all the weight is on the driving wheels)?
HKA: $m a \le \mu m g$.
HEN: $m a \le \mu m g$.
SKA: **ფორმულა:** $\mu_{\min} = \dfrac{a}{g}$
**რიცხვები:** $\mu_{\min} = \dfrac{4}{10} = 0{,}4$ — ყინულზე ($\mu \approx 0{,}1$) ეს შეუძლებელია.
SEN: **Formula:** $\mu_{\min} = \dfrac{a}{g}$
**Numbers:** $\mu_{\min} = \dfrac{4}{10} = 0.4$ — impossible on ice ($\mu \approx 0.1$).
AKA: $0{,}4$
AEN: $0.4$

--- medium circular
KA: $1000\ \text{კგ}$ ავტომობილი $80\ \text{მ}$ რადიუსის ჰორიზონტალურ მოსახვევს $20\ \text{მ/წმ}$ სიჩქარით გადის. რა ხახუნის ძალაა საჭირო და ხახუნის კოეფიციენტის რა მინიმალური მნიშვნელობა?
EN: A $1000\ \text{kg}$ car takes a horizontal bend of radius $80\ \text{m}$ at $20\ \text{m/s}$. What friction force is needed and what minimum coefficient of friction?
HKA: ცენტრისკენულ ძალას ხახუნი ქმნის.
HEN: Friction provides the centripetal force.
SKA: **ფორმულა:** $F = \dfrac{m v^2}{r}$, $\ \mu_{\min} = \dfrac{v^2}{g r}$
**რიცხვები:** $F = \dfrac{1000 \cdot 400}{80} = 5000\ \text{ნ}$, $\ \mu_{\min} = \dfrac{400}{800} = 0{,}5$
SEN: **Formula:** $F = \dfrac{m v^2}{r}$, $\ \mu_{\min} = \dfrac{v^2}{g r}$
**Numbers:** $F = \dfrac{1000 \cdot 400}{80} = 5000\ \text{N}$, $\ \mu_{\min} = \dfrac{400}{800} = 0.5$
AKA: $5000\ \text{ნ}$; $0{,}5$
AEN: $5000\ \text{N}$; $0.5$

--- medium circular
KA: წყლიან ვედროს ვერტიკალურ წრეწირზე ატრიალებენ ($r = 1\ \text{მ}$). რა მინიმალური სიჩქარე უნდა ჰქონდეს ვედროს ზედა წერტილში, რომ წყალი არ გადმოიღვაროს?
EN: A bucket of water is swung in a vertical circle ($r = 1\ \text{m}$). What minimum speed at the top keeps the water in?
HKA: ზედა წერტილში ცენტრისკენული ძალა არ უნდა იყოს $m g$-ზე ნაკლები.
HEN: At the top the centripetal force must be at least $m g$.
SKA: **ფორმულა:** $\dfrac{m v^2}{r} \ge m g \Rightarrow v_{\min} = \sqrt{g r}$
**რიცხვები:** $v_{\min} = \sqrt{10 \cdot 1} \approx 3{,}2\ \text{მ/წმ}$
SEN: **Formula:** $\dfrac{m v^2}{r} \ge m g \Rightarrow v_{\min} = \sqrt{g r}$
**Numbers:** $v_{\min} = \sqrt{10 \cdot 1} \approx 3.2\ \text{m/s}$
AKA: $\approx 3{,}2\ \text{მ/წმ}$
AEN: $\approx 3.2\ \text{m/s}$

--- medium circular
KA: იპოვეთ დედამიწის ზედაპირთან ახლოს მოძრავი თანამგზავრის ბრუნვის პერიოდი ($v_1 = 8\ \text{კმ/წმ}$).
EN: Find the orbital period of a satellite just above the Earth's surface ($v_1 = 8\ \text{km/s}$).
HKA: $T = \dfrac{2\pi R}{v}$.
HEN: $T = \dfrac{2\pi R}{v}$.
SKA: **ფორმულა:** $T = \dfrac{2\pi R}{v_1}$
**რიცხვები:** $T = \dfrac{2 \cdot 3{,}14 \cdot 6{,}4 \cdot 10^6}{8000} \approx 5000\ \text{წმ} \approx 84\ \text{წთ}$
SEN: **Formula:** $T = \dfrac{2\pi R}{v_1}$
**Numbers:** $T = \dfrac{2 \cdot 3.14 \cdot 6.4 \times 10^6}{8000} \approx 5000\ \text{s} \approx 84\ \text{min}$
AKA: $\approx 84\ \text{წთ}$
AEN: $\approx 84\ \text{min}$

--- medium momentum
KA: $2\ \text{კგ}$ ურიკა $3\ \text{მ/წმ}$ სიჩქარით მარჯვნივ მოძრაობს, $1\ \text{კგ}$ ურიკა — $3\ \text{მ/წმ}$-ით მარცხნივ. დაჯახების შემდეგ ისინი ერთად მოძრაობენ. იპოვეთ მათი სიჩქარე და მიმართულება.
EN: A $2\ \text{kg}$ cart moves right at $3\ \text{m/s}$ and a $1\ \text{kg}$ cart moves left at $3\ \text{m/s}$. After colliding they move together. Find their velocity.
HKA: მარცხნივ მოძრავის სიჩქარე უარყოფითად აიღეთ.
HEN: Take the leftward velocity as negative.
SKA: **ფორმულა:** $m_1 v_1 + m_2 v_2 = (m_1 + m_2) u$
**რიცხვები:** $u = \dfrac{2 \cdot 3 + 1 \cdot (-3)}{3} = 1\ \text{მ/წმ}$, მარჯვნივ
SEN: **Formula:** $m_1 v_1 + m_2 v_2 = (m_1 + m_2) u$
**Numbers:** $u = \dfrac{2 \cdot 3 + 1 \cdot (-3)}{3} = 1\ \text{m/s}$, to the right
AKA: $1\ \text{მ/წმ}$ მარჯვნივ
AEN: $1\ \text{m/s}$ to the right

--- medium momentum
KA: ღია კოსმოსში უძრავად მყოფმა $80\ \text{კგ}$ ასტრონავტმა $0{,}5\ \text{კგ}$ გასაღები $8\ \text{მ/წმ}$ სიჩქარით გადააგდო. რა სიჩქარით იმოძრავებს ასტრონავტი?
EN: An $80\ \text{kg}$ astronaut at rest in space throws a $0.5\ \text{kg}$ spanner at $8\ \text{m/s}$. How fast does the astronaut move?
HKA: სისტემის საწყისი იმპულსი ნულია.
HEN: The system's initial momentum is zero.
SKA: **ფორმულა:** $0 = m v + M u \Rightarrow u = -\dfrac{m v}{M}$
**რიცხვები:** $u = -\dfrac{0{,}5 \cdot 8}{80} = -0{,}05\ \text{მ/წმ}$ — საწინააღმდეგოდ, $5\ \text{სმ/წმ}$
SEN: **Formula:** $0 = m v + M u \Rightarrow u = -\dfrac{m v}{M}$
**Numbers:** $u = -\dfrac{0.5 \cdot 8}{80} = -0.05\ \text{m/s}$ — the opposite way, $5\ \text{cm/s}$
AKA: $0{,}05\ \text{მ/წმ}$
AEN: $0.05\ \text{m/s}$

--- medium energy
KA: $1000\ \text{ნ/მ}$ სიხისტის ზამბარა $10\ \text{სმ}$-ით შეკუმშეს და $0{,}2\ \text{კგ}$ ბურთულა ვერტიკალურად ზემოთ ისროლეს. რა სიმაღლეზე ავა ბურთულა?
EN: A spring of stiffness $1000\ \text{N/m}$ is compressed $10\ \text{cm}$ and fires a $0.2\ \text{kg}$ ball straight up. How high does the ball go?
HKA: $\dfrac{k x^2}{2} = m g h$.
HEN: $\dfrac{k x^2}{2} = m g h$.
SKA: **ფორმულა:** $h = \dfrac{k x^2}{2 m g}$
**რიცხვები:** $\dfrac{k x^2}{2} = \dfrac{1000 \cdot 0{,}01}{2} = 5\ \text{ჯ}$, $\ h = \dfrac{5}{0{,}2 \cdot 10} = 2{,}5\ \text{მ}$
SEN: **Formula:** $h = \dfrac{k x^2}{2 m g}$
**Numbers:** $\dfrac{k x^2}{2} = \dfrac{1000 \cdot 0.01}{2} = 5\ \text{J}$, $\ h = \dfrac{5}{0.2 \cdot 10} = 2.5\ \text{m}$
AKA: $2{,}5\ \text{მ}$
AEN: $2.5\ \text{m}$

--- medium statics
KA: $6\ \text{მ}$ სიგრძისა და $30\ \text{კგ}$ მასის ერთგვაროვანი ძელი ბოლოებით ეყრდნობა საყრდენებს. მარცხენა ბოლოდან $2\ \text{მ}$-ზე $50\ \text{კგ}$ ტვირთი დევს. იპოვეთ საყრდენების რეაქციები.
EN: A uniform beam $6\ \text{m}$ long with mass $30\ \text{kg}$ rests on supports at its ends. A $50\ \text{kg}$ load lies $2\ \text{m}$ from the left end. Find the support reactions.
HKA: მომენტები აიღეთ მარცხენა საყრდენის მიმართ.
HEN: Take moments about the left support.
SKA: **ფორმულა:** $N_B L = M g \dfrac{L}{2} + m g d$, $\ N_A = (M + m) g - N_B$
**რიცხვები:** $6 N_B = 300 \cdot 3 + 500 \cdot 2 = 1900 \Rightarrow N_B \approx 317\ \text{ნ}$
$N_A = 800 - 317 \approx 483\ \text{ნ}$
SEN: **Formula:** $N_B L = M g \dfrac{L}{2} + m g d$, $\ N_A = (M + m) g - N_B$
**Numbers:** $6 N_B = 300 \cdot 3 + 500 \cdot 2 = 1900 \Rightarrow N_B \approx 317\ \text{N}$
$N_A = 800 - 317 \approx 483\ \text{N}$
AKA: $\approx 483\ \text{ნ}$ და $\approx 317\ \text{ნ}$
AEN: $\approx 483\ \text{N}$ and $\approx 317\ \text{N}$

--- hard vectors
KA: მოცურავეს სურს მდინარე ზუსტად მოპირდაპირე წერტილში გადაცუროს. დინების სიჩქარეა $1{,}5\ \text{მ/წმ}$, მოცურავისა წყლის მიმართ — $2{,}5\ \text{მ/წმ}$, მდინარის სიგანე — $100\ \text{მ}$. რა კუთხით (ნაპირის მართობიდან) უნდა იცუროს მან დინების საწინააღმდეგოდ და რა დრო დასჭირდება?
EN: A swimmer wants to cross a river to the point directly opposite. The current is $1.5\ \text{m/s}$, the swimmer's speed relative to the water $2.5\ \text{m/s}$, the river $100\ \text{m}$ wide. At what angle (from straight across) must they head upstream, and how long does it take?
HKA: სიჩქარის დინების საწინააღმდეგო შემდგენმა დინება უნდა გააბათილოს.
HEN: The upstream component of the velocity must cancel the current.
SKA: **ფორმულა:** $\sin\alpha = \dfrac{u}{v}$, $\ v_\perp = \sqrt{v^2 - u^2}$, $\ t = \dfrac{d}{v_\perp}$
**რიცხვები:** $\sin\alpha = \dfrac{1{,}5}{2{,}5} = 0{,}6 \Rightarrow \alpha \approx 37^\circ$
$v_\perp = \sqrt{6{,}25 - 2{,}25} = 2\ \text{მ/წმ}$, $\ t = \dfrac{100}{2} = 50\ \text{წმ}$
SEN: **Formula:** $\sin\alpha = \dfrac{u}{v}$, $\ v_\perp = \sqrt{v^2 - u^2}$, $\ t = \dfrac{d}{v_\perp}$
**Numbers:** $\sin\alpha = \dfrac{1.5}{2.5} = 0.6 \Rightarrow \alpha \approx 37^\circ$
$v_\perp = \sqrt{6.25 - 2.25} = 2\ \text{m/s}$, $\ t = \dfrac{100}{2} = 50\ \text{s}$
AKA: $\approx 37^\circ$; $50\ \text{წმ}$
AEN: $\approx 37^\circ$; $50\ \text{s}$

--- hard accel
KA: სადგურებს შორის მანძილი $2\ \text{კმ}$-ია. მატარებელი $0{,}5\ \text{მ/წმ}^2$ აჩქარებით $20\ \text{მ/წმ}$-მდე აჩქარდება, შემდეგ თანაბრად მოძრაობს და ბოლოს იმავე აჩქარებით მუხრუჭებს. იპოვეთ მოძრაობის სრული დრო.
EN: Two stations are $2\ \text{km}$ apart. A train accelerates at $0.5\ \text{m/s}^2$ up to $20\ \text{m/s}$, cruises, then brakes at the same rate. Find the total travel time.
HKA: გაქანება და დამუხრუჭება სიმეტრიულია.
HEN: Speeding up and braking are symmetric.
SKA: **ფორმულა:** $t_1 = \dfrac{v}{a}$, $\ s_1 = \dfrac{v^2}{2a}$, $\ t_2 = \dfrac{L - 2s_1}{v}$, $\ t = 2t_1 + t_2$
**რიცხვები:** $t_1 = 40\ \text{წმ}$, $\ s_1 = \dfrac{400}{1} = 400\ \text{მ}$
$t_2 = \dfrac{2000 - 800}{20} = 60\ \text{წმ}$, $\ t = 80 + 60 = 140\ \text{წმ}$
SEN: **Formula:** $t_1 = \dfrac{v}{a}$, $\ s_1 = \dfrac{v^2}{2a}$, $\ t_2 = \dfrac{L - 2s_1}{v}$, $\ t = 2t_1 + t_2$
**Numbers:** $t_1 = 40\ \text{s}$, $\ s_1 = \dfrac{400}{1} = 400\ \text{m}$
$t_2 = \dfrac{2000 - 800}{20} = 60\ \text{s}$, $\ t = 80 + 60 = 140\ \text{s}$
AKA: $140\ \text{წმ}$
AEN: $140\ \text{s}$

--- hard freefall
KA: თავისუფლად ვარდნილმა სხეულმა ბოლო წამში $35\ \text{მ}$ გაიარა. რა სიმაღლიდან ვარდებოდა ის?
EN: A freely falling body covers $35\ \text{m}$ in its last second. From what height did it fall?
HKA: ბოლო წამის გზა $= \dfrac{g t^2}{2} - \dfrac{g (t - 1)^2}{2} = g t - \dfrac{g}{2}$.
HEN: Last-second distance $= \dfrac{g t^2}{2} - \dfrac{g (t - 1)^2}{2} = g t - \dfrac{g}{2}$.
SKA: **ფორმულა:** $\Delta h = g t - \dfrac{g}{2} \Rightarrow t = \dfrac{\Delta h}{g} + \dfrac{1}{2}$, $\ h = \dfrac{g t^2}{2}$
**რიცხვები:** $t = 3{,}5 + 0{,}5 = 4\ \text{წმ}$, $\ h = 5 \cdot 16 = 80\ \text{მ}$
SEN: **Formula:** $\Delta h = g t - \dfrac{g}{2} \Rightarrow t = \dfrac{\Delta h}{g} + \dfrac{1}{2}$, $\ h = \dfrac{g t^2}{2}$
**Numbers:** $t = 3.5 + 0.5 = 4\ \text{s}$, $\ h = 5 \cdot 16 = 80\ \text{m}$
AKA: $80\ \text{მ}$
AEN: $80\ \text{m}$

--- hard freefall
KA: ბურთი ვერტიკალურად ზემოთ $20\ \text{მ/წმ}$ სიჩქარით აისროლეს. რა დროის შემდეგ იქნება ის $15\ \text{მ}$ სიმაღლეზე? რატომ არის ორი პასუხი?
EN: A ball is thrown straight up at $20\ \text{m/s}$. When is it at a height of $15\ \text{m}$? Why are there two answers?
HKA: $h = v_0 t - \dfrac{g t^2}{2}$.
HEN: $h = v_0 t - \dfrac{g t^2}{2}$.
SKA: **ფორმულა:** $h = v_0 t - \dfrac{g t^2}{2}$
**რიცხვები:** $15 = 20t - 5t^2 \Rightarrow t^2 - 4t + 3 = 0 \Rightarrow t = 1\ \text{წმ}$ ან $t = 3\ \text{წმ}$
ბურთი ამ სიმაღლეზე ორჯერ არის: ასვლისას ($1\ \text{წმ}$) და დაშვებისას ($3\ \text{წმ}$).
SEN: **Formula:** $h = v_0 t - \dfrac{g t^2}{2}$
**Numbers:** $15 = 20t - 5t^2 \Rightarrow t^2 - 4t + 3 = 0 \Rightarrow t = 1\ \text{s}$ or $t = 3\ \text{s}$
The ball passes this height twice: going up ($1\ \text{s}$) and coming down ($3\ \text{s}$).
AKA: $1\ \text{წმ}$ და $3\ \text{წმ}$
AEN: $1\ \text{s}$ and $3\ \text{s}$

--- hard freefall
KA: ბურთი ჰორიზონტთან $45^\circ$ კუთხით $20\ \text{მ/წმ}$ სიჩქარით ისროლეს. იპოვეთ ფრენის დრო, მაქსიმალური სიმაღლე და ფრენის სიშორე. ($\sin 45^\circ = \cos 45^\circ \approx 0{,}707$)
EN: A ball is kicked at $45^\circ$ to the horizontal at $20\ \text{m/s}$. Find the flight time, the maximum height and the range. ($\sin 45^\circ = \cos 45^\circ \approx 0.707$)
HKA: დაშალეთ სიჩქარე: $v_x = v_0\cos\alpha$, $v_y = v_0\sin\alpha$.
HEN: Split the velocity: $v_x = v_0\cos\alpha$, $v_y = v_0\sin\alpha$.
SKA: **ფორმულა:** $t = \dfrac{2 v_y}{g}$, $\ H = \dfrac{v_y^2}{2g}$, $\ L = v_x t$
**რიცხვები:** $v_x = v_y \approx 14{,}1\ \text{მ/წმ}$
$t = \dfrac{2 \cdot 14{,}1}{10} \approx 2{,}83\ \text{წმ}$, $\ H = \dfrac{200}{20} = 10\ \text{მ}$, $\ L = 14{,}1 \cdot 2{,}83 \approx 40\ \text{მ}$
SEN: **Formula:** $t = \dfrac{2 v_y}{g}$, $\ H = \dfrac{v_y^2}{2g}$, $\ L = v_x t$
**Numbers:** $v_x = v_y \approx 14.1\ \text{m/s}$
$t = \dfrac{2 \cdot 14.1}{10} \approx 2.83\ \text{s}$, $\ H = \dfrac{200}{20} = 10\ \text{m}$, $\ L = 14.1 \cdot 2.83 \approx 40\ \text{m}$
AKA: $\approx 2{,}8\ \text{წმ}$; $10\ \text{მ}$; $40\ \text{მ}$
AEN: $\approx 2.8\ \text{s}$; $10\ \text{m}$; $40\ \text{m}$

--- hard newton2
KA: $4\ \text{კგ}$ ძელაკს $30^\circ$ დახრილობის გლუვ დახრილ სიბრტყეზე სიბრტყის პარალელური თოკით ზემოთ ექაჩებიან $1\ \text{მ/წმ}^2$ აჩქარებით. იპოვეთ თოკის დაჭიმულობა.
EN: A $4\ \text{kg}$ block is pulled up a smooth $30^\circ$ incline by a rope parallel to the slope, with acceleration $1\ \text{m/s}^2$. Find the tension.
HKA: სიბრტყის გასწვრივ: $T - m g \sin\alpha = m a$.
HEN: Along the slope: $T - m g \sin\alpha = m a$.
SKA: **ფორმულა:** $T = m (g\sin\alpha + a)$
**რიცხვები:** $T = 4 \cdot (5 + 1) = 24\ \text{ნ}$
SEN: **Formula:** $T = m (g\sin\alpha + a)$
**Numbers:** $T = 4 \cdot (5 + 1) = 24\ \text{N}$
AKA: $24\ \text{ნ}$
AEN: $24\ \text{N}$

--- hard newton2
KA: ლოკომოტივი $9000\ \text{ნ}$ წევის ძალით ექაჩება სამ ვაგონს, თითოეულის მასაა $2000\ \text{კგ}$ (ხახუნი უგულებელყავით, ლოკომოტივის მასა არ გაითვალისწინოთ). იპოვეთ აჩქარება და გადაბმების დაჭიმულობები.
EN: A locomotive pulls three carriages of $2000\ \text{kg}$ each with a force of $9000\ \text{N}$ (ignore friction and the locomotive's mass). Find the acceleration and the tensions in the couplings.
HKA: ყოველი გადაბმა აჩქარებს მის უკან მყოფ ვაგონებს.
HEN: Each coupling accelerates the carriages behind it.
SKA: **ფორმულა:** $a = \dfrac{F}{3m}$, $\ T_k = (\text{ვაგონების რიცხვი უკან}) \cdot m a$
**რიცხვები:** $a = \dfrac{9000}{6000} = 1{,}5\ \text{მ/წმ}^2$
$T_1 = 9000\ \text{ნ}$ (ლოკომოტივი–I), $\ T_2 = 2 \cdot 2000 \cdot 1{,}5 = 6000\ \text{ნ}$, $\ T_3 = 3000\ \text{ნ}$
SEN: **Formula:** $a = \dfrac{F}{3m}$, $\ T_k = (\text{number of carriages behind}) \cdot m a$
**Numbers:** $a = \dfrac{9000}{6000} = 1.5\ \text{m/s}^2$
$T_1 = 9000\ \text{N}$ (loco–1st), $\ T_2 = 2 \cdot 2000 \cdot 1.5 = 6000\ \text{N}$, $\ T_3 = 3000\ \text{N}$
AKA: $1{,}5\ \text{მ/წმ}^2$; $9000$, $6000$, $3000\ \text{ნ}$
AEN: $1.5\ \text{m/s}^2$; $9000$, $6000$, $3000\ \text{N}$

--- hard weight
KA: დედამიწის ბრუნვის გამო ეკვატორზე სხეულის წონა ოდნავ ნაკლებია, ვიდრე პოლუსზე. შეაფასეთ, რამდენი პროცენტით. ($R = 6{,}4 \cdot 10^6\ \text{მ}$, $T = 24\ \text{სთ}$)
EN: Because the Earth rotates, a body weighs slightly less at the equator than at the pole. Estimate by what percentage. ($R = 6.4 \times 10^6\ \text{m}$, $T = 24\ \text{h}$)
HKA: ეკვატორზე სიმძიმის ძალის ნაწილი ცენტრისკენული აჩქარების შესაქმნელად იხარჯება: $P = m(g - \omega^2 R)$.
HEN: At the equator part of gravity provides the centripetal acceleration: $P = m(g - \omega^2 R)$.
SKA: **ფორმულა:** $a_{\text{ც}} = \dfrac{4\pi^2 R}{T^2}$, $\ \dfrac{\Delta P}{P} = \dfrac{a_{\text{ც}}}{g}$
**რიცხვები:** $a_{\text{ც}} = \dfrac{39{,}5 \cdot 6{,}4 \cdot 10^6}{86\,400^2} \approx 0{,}034\ \text{მ/წმ}^2$
$\dfrac{\Delta P}{P} \approx \dfrac{0{,}034}{10} \approx 0{,}34\%$
SEN: **Formula:** $a_{\text{c}} = \dfrac{4\pi^2 R}{T^2}$, $\ \dfrac{\Delta P}{P} = \dfrac{a_{\text{c}}}{g}$
**Numbers:** $a_{\text{c}} = \dfrac{39.5 \cdot 6.4 \times 10^6}{86\,400^2} \approx 0.034\ \text{m/s}^2$
$\dfrac{\Delta P}{P} \approx \dfrac{0.034}{10} \approx 0.34\%$
AKA: $\approx 0{,}34\%$-ით
AEN: by $\approx 0.34\%$

--- hard forces
KA: $2\ \text{კგ}$ წიგნს ვერტიკალურ კედელზე ხელით, ჰორიზონტალური ძალით აჭერენ. ხახუნის კოეფიციენტი $0{,}4$-ია. რა მინიმალური ძალაა საჭირო, რომ წიგნი არ ჩამოსრიალდეს?
EN: A $2\ \text{kg}$ book is held against a vertical wall by a horizontal push of the hand. The coefficient of friction is $0.4$. What minimum force keeps it from sliding down?
HKA: ხახუნი (ზემოთ) სიმძიმის ძალას უნდა აწონასწორებდეს; დაწოლის ძალა $N = F$.
HEN: Friction (upwards) must balance gravity; the normal force is $N = F$.
SKA: **ფორმულა:** $\mu F \ge m g \Rightarrow F_{\min} = \dfrac{m g}{\mu}$
**რიცხვები:** $F_{\min} = \dfrac{20}{0{,}4} = 50\ \text{ნ}$
SEN: **Formula:** $\mu F \ge m g \Rightarrow F_{\min} = \dfrac{m g}{\mu}$
**Numbers:** $F_{\min} = \dfrac{20}{0.4} = 50\ \text{N}$
AKA: $50\ \text{ნ}$
AEN: $50\ \text{N}$

--- hard circular
KA: გზის მოსახვევს ($r = 100\ \text{მ}$) ისეთი დახრა აქვს, რომ ავტომობილს $20\ \text{მ/წმ}$ სიჩქარით ხახუნის გარეშეც შეუძლია მისი გავლა. იპოვეთ გზის დახრის კუთხე.
EN: A bend of radius $100\ \text{m}$ is banked so that a car can take it at $20\ \text{m/s}$ even without friction. Find the banking angle.
HKA: საყრდენის რეაქციის ჰორიზონტალური შემდგენი ქმნის ცენტრისკენულ ძალას: $\tan\alpha = \dfrac{v^2}{g r}$.
HEN: The horizontal component of the normal force provides the centripetal force: $\tan\alpha = \dfrac{v^2}{g r}$.
SKA: **ფორმულა:** $N\cos\alpha = m g$, $\ N\sin\alpha = \dfrac{m v^2}{r} \Rightarrow \tan\alpha = \dfrac{v^2}{g r}$
**რიცხვები:** $\tan\alpha = \dfrac{400}{1000} = 0{,}4 \Rightarrow \alpha \approx 22^\circ$
SEN: **Formula:** $N\cos\alpha = m g$, $\ N\sin\alpha = \dfrac{m v^2}{r} \Rightarrow \tan\alpha = \dfrac{v^2}{g r}$
**Numbers:** $\tan\alpha = \dfrac{400}{1000} = 0.4 \Rightarrow \alpha \approx 22^\circ$
AKA: $\approx 22^\circ$
AEN: $\approx 22^\circ$

--- hard circular
KA: გეოსტაციონარული თანამგზავრი დედამიწის გარშემო $24$ საათში ბრუნავს. იპოვეთ მისი ორბიტის რადიუსი. ($g R^2 = G M \approx 4{,}1 \cdot 10^{14}\ \text{მ}^3\text{/წმ}^2$)
EN: A geostationary satellite orbits the Earth in $24$ hours. Find the radius of its orbit. ($g R^2 = G M \approx 4.1 \times 10^{14}\ \text{m}^3\text{/s}^2$)
HKA: $\dfrac{G M m}{r^2} = m\dfrac{4\pi^2 r}{T^2}$.
HEN: $\dfrac{G M m}{r^2} = m\dfrac{4\pi^2 r}{T^2}$.
SKA: **ფორმულა:** $r^3 = \dfrac{G M T^2}{4\pi^2}$
**რიცხვები:** $r^3 = \dfrac{4{,}1 \cdot 10^{14} \cdot (8{,}64 \cdot 10^4)^2}{39{,}5} \approx 7{,}7 \cdot 10^{22}\ \text{მ}^3$
$r \approx 4{,}3 \cdot 10^7\ \text{მ} \approx 42\,000\ \text{კმ}$ (ზედაპირიდან $\approx 36\,000\ \text{კმ}$)
SEN: **Formula:** $r^3 = \dfrac{G M T^2}{4\pi^2}$
**Numbers:** $r^3 = \dfrac{4.1 \times 10^{14} \cdot (8.64 \times 10^4)^2}{39.5} \approx 7.7 \times 10^{22}\ \text{m}^3$
$r \approx 4.3 \times 10^7\ \text{m} \approx 42\,000\ \text{km}$ ($\approx 36\,000\ \text{km}$ above the surface)
AKA: $\approx 42\,000\ \text{კმ}$
AEN: $\approx 42\,000\ \text{km}$

--- hard momentum
KA: $10\ \text{ტ}$ მასის უძრავმა რაკეტამ მყისიერად გამოისროლა $100\ \text{კგ}$ აირი $2000\ \text{მ/წმ}$ სიჩქარით. რა სიჩქარეს მიიღებს რაკეტა?
EN: A $10\ \text{t}$ rocket at rest instantly ejects $100\ \text{kg}$ of gas at $2000\ \text{m/s}$. What speed does the rocket get?
HKA: აირის გამოსროლის შემდეგ რაკეტის მასაა $M - m$.
HEN: After ejecting the gas the rocket's mass is $M - m$.
SKA: **ფორმულა:** $0 = m u - (M - m) v \Rightarrow v = \dfrac{m u}{M - m}$
**რიცხვები:** $v = \dfrac{100 \cdot 2000}{9900} \approx 20\ \text{მ/წმ}$
SEN: **Formula:** $0 = m u - (M - m) v \Rightarrow v = \dfrac{m u}{M - m}$
**Numbers:** $v = \dfrac{100 \cdot 2000}{9900} \approx 20\ \text{m/s}$
AKA: $\approx 20\ \text{მ/წმ}$
AEN: $\approx 20\ \text{m/s}$

--- hard momentum
KA: $2\ \text{კგ}$ ბურთი $6\ \text{მ/წმ}$ სიჩქარით ეჯახება უძრავ $4\ \text{კგ}$ ბურთს და ისინი ერთად აგრძელებენ მოძრაობას. იპოვეთ საერთო სიჩქარე და კინეტიკური ენერგიის რა ნაწილი გადავიდა სითბოში.
EN: A $2\ \text{kg}$ ball at $6\ \text{m/s}$ hits a $4\ \text{kg}$ ball at rest and they move off together. Find their common speed and what fraction of the kinetic energy became heat.
HKA: იმპულსი ინახება, ენერგია — არა.
HEN: Momentum is conserved, kinetic energy isn't.
SKA: **ფორმულა:** $u = \dfrac{m_1 v}{m_1 + m_2}$, $\ \dfrac{\Delta E}{E} = 1 - \dfrac{E_2}{E_1}$
**რიცხვები:** $u = \dfrac{12}{6} = 2\ \text{მ/წმ}$
$E_1 = \dfrac{2 \cdot 36}{2} = 36\ \text{ჯ}$, $\ E_2 = \dfrac{6 \cdot 4}{2} = 12\ \text{ჯ}$, $\ \Delta E = 24\ \text{ჯ}$ — ანუ $\dfrac{2}{3}$
SEN: **Formula:** $u = \dfrac{m_1 v}{m_1 + m_2}$, $\ \dfrac{\Delta E}{E} = 1 - \dfrac{E_2}{E_1}$
**Numbers:** $u = \dfrac{12}{6} = 2\ \text{m/s}$
$E_1 = \dfrac{2 \cdot 36}{2} = 36\ \text{J}$, $\ E_2 = \dfrac{6 \cdot 4}{2} = 12\ \text{J}$, $\ \Delta E = 24\ \text{J}$ — that is $\dfrac{2}{3}$
AKA: $2\ \text{მ/წმ}$; $\dfrac{2}{3}$
AEN: $2\ \text{m/s}$; $\dfrac{2}{3}$

--- hard energy
KA: ძელაკი $2\ \text{მ}$ სიმაღლიდან გლუვ მრუდ ღარზე ჩამოსრიალდა, შემდეგ კი ხორკლიან ჰორიზონტალურ ზედაპირზე ($\mu = 0{,}25$) გააგრძელა. რა მანძილის შემდეგ გაჩერდება?
EN: A block slides from a height of $2\ \text{m}$ down a smooth curved ramp and then along a rough horizontal surface ($\mu = 0.25$). How far does it go before stopping?
HKA: მთელი პოტენციური ენერგია ხახუნზე იხარჯება: $m g h = \mu m g s$.
HEN: All the potential energy goes to friction: $m g h = \mu m g s$.
SKA: **ფორმულა:** $s = \dfrac{h}{\mu}$ (მასა და $g$ შეიკვეცა)
**რიცხვები:** $s = \dfrac{2}{0{,}25} = 8\ \text{მ}$
SEN: **Formula:** $s = \dfrac{h}{\mu}$ (mass and $g$ cancel)
**Numbers:** $s = \dfrac{2}{0.25} = 8\ \text{m}$
AKA: $8\ \text{მ}$
AEN: $8\ \text{m}$

--- hard energy
KA: $0{,}2\ \text{კგ}$ ბურთულა ძაფზე ჰორიზონტალურ მდგომარეობამდე გადახარეს და გაუშვეს. რას უდრის ძაფის დაჭიმულობა ყველაზე დაბალ წერტილში? დაამტკიცეთ, რომ ის ძაფის სიგრძეზე არ არის დამოკიდებული.
EN: A $0.2\ \text{kg}$ ball on a string is pulled out to the horizontal and released. What is the tension at the lowest point? Prove it doesn't depend on the string's length.
HKA: ენერგიიდან $v^2 = 2 g l$; შემდეგ ქვედა წერტილში $T - m g = \dfrac{m v^2}{l}$.
HEN: From energy $v^2 = 2 g l$; then at the bottom $T - m g = \dfrac{m v^2}{l}$.
SKA: **ფორმულა:** $v^2 = 2 g l$, $\ T = m g + \dfrac{m v^2}{l} = m g + 2 m g = 3 m g$ — $l$ შეიკვეცა ∎
**რიცხვები:** $T = 3 \cdot 0{,}2 \cdot 10 = 6\ \text{ნ}$
SEN: **Formula:** $v^2 = 2 g l$, $\ T = m g + \dfrac{m v^2}{l} = m g + 2 m g = 3 m g$ — $l$ cancels ∎
**Numbers:** $T = 3 \cdot 0.2 \cdot 10 = 6\ \text{N}$
AKA: $6\ \text{ნ}$ ($= 3mg$)
AEN: $6\ \text{N}$ ($= 3mg$)

--- hard statics
KA: $20\ \text{კგ}$ აბრა ჩამოკიდებულია კედელზე ჰორიზონტალურად დამაგრებული უწონო ძელის ბოლოზე; ძელის სიგრძეა $2\ \text{მ}$. ძელის ბოლოს კედელზე დამაგრებული ტროსი იჭერს, რომელიც ძელთან $30^\circ$ კუთხეს ადგენს. იპოვეთ ტროსის დაჭიმულობა.
EN: A $20\ \text{kg}$ sign hangs from the end of a light horizontal beam $2\ \text{m}$ long, hinged to a wall. A cable from the beam's end to the wall makes $30^\circ$ with the beam. Find the tension in the cable.
HKA: მომენტები აიღეთ სახსრის (კედელთან) მიმართ; ტროსის მომენტი $T\sin 30^\circ \cdot l$.
HEN: Take moments about the hinge at the wall; the cable's moment is $T\sin 30^\circ \cdot l$.
SKA: **ფორმულა:** $T\sin\alpha \cdot l = m g\,l \Rightarrow T = \dfrac{m g}{\sin\alpha}$
**რიცხვები:** $T = \dfrac{200}{0{,}5} = 400\ \text{ნ}$ — ტვირთის წონაზე ორჯერ მეტი!
SEN: **Formula:** $T\sin\alpha \cdot l = m g\,l \Rightarrow T = \dfrac{m g}{\sin\alpha}$
**Numbers:** $T = \dfrac{200}{0.5} = 400\ \text{N}$ — twice the sign's weight!
AKA: $400\ \text{ნ}$
AEN: $400\ \text{N}$

--- hard freefall olympiad
KA: $5\ \text{მ/წმ}$ სიჩქარით ზემოთ მიმავალი აეროსტატიდან $100\ \text{მ}$ სიმაღლეზე ქვიშის ტომარა გაუშვეს. რა დროში დაეცემა ტომარა მიწაზე?
EN: A sandbag is released from a balloon rising at $5\ \text{m/s}$ at a height of $100\ \text{m}$. How long until the bag hits the ground?
HKA: გაშვების მომენტში ტომარას აეროსტატის სიჩქარე აქვს — ზემოთ $5\ \text{მ/წმ}$!
HEN: When released, the bag has the balloon's velocity — $5\ \text{m/s}$ upwards!
SKA: **ფორმულა:** $-h = v_0 t - \dfrac{g t^2}{2}$
**რიცხვები:** $-100 = 5t - 5t^2 \Rightarrow t^2 - t - 20 = 0 \Rightarrow t = 5\ \text{წმ}$ (უარყოფითი ფესვი არ გამოდგება)
(თავდაპირველად ტომარა ჯერ კიდევ $0{,}5\ \text{წმ}$ ადის და $1{,}25\ \text{მ}$-ით მაღლა მიდის.)
SEN: **Formula:** $-h = v_0 t - \dfrac{g t^2}{2}$
**Numbers:** $-100 = 5t - 5t^2 \Rightarrow t^2 - t - 20 = 0 \Rightarrow t = 5\ \text{s}$ (the negative root is rejected)
(At first the bag keeps rising for $0.5\ \text{s}$, going $1.25\ \text{m}$ higher.)
AKA: $5\ \text{წმ}$
AEN: $5\ \text{s}$

--- hard newton2 olympiad
KA: უძრავ ჭოჭონაქზე გადადებული თოკის ერთ ბოლოზე ტვირთი ჰკიდია, მეორეზე — ზუსტად ისეთივე მასის მაიმუნი; სისტემა წონასწორობაშია. მაიმუნი თოკზე ზემოთ ცოცვას იწყებს. რა მოუვა ტვირთს? (თოკი და ჭოჭონაქი უწონოა, ხახუნი არ არის.)
EN: A rope over a fixed pulley has a weight on one end and a monkey of exactly the same mass on the other; the system is balanced. The monkey starts climbing the rope. What happens to the weight? (Light rope and pulley, no friction.)
HKA: თოკის დაჭიმულობა ორივე მხარეს ერთნაირია. დაწერეთ II კანონი მაიმუნისა და ტვირთისთვის.
HEN: The tension is the same on both sides. Write the second law for the monkey and the weight.
SKA: მაიმუნი თოკს ქვემოთ ექაჩება, თოკი კი მას ზემოთ — დაჭიმულობა $T > m g$ ხდება.
მაიმუნი: $T - m g = m a_1$; ტვირთი: $T - m g = m a_2$ $\Rightarrow a_1 = a_2$.
ტვირთიც ზემოთ ადის ზუსტად ისეთივე აჩქარებით და სიჩქარით, როგორც მაიმუნი — ისინი ყოველთვის ერთ სიმაღლეზე რჩებიან! (მაიმუნი თოკს ჩამოიწევს, მაგრამ თავად თითქოს ტვირთთან ერთად „ადის“.)
SEN: The monkey pulls down on the rope and the rope pulls it up — the tension becomes $T > m g$.
Monkey: $T - m g = m a_1$; weight: $T - m g = m a_2$ $\Rightarrow a_1 = a_2$.
The weight rises with exactly the same acceleration and speed as the monkey — they always stay level! (The monkey hauls rope down, but both rise together.)
AKA: ტვირთი მაიმუნთან ერთად ადის
AEN: the weight rises together with the monkey

--- hard circular olympiad
KA: რა პერიოდით უნდა ბრუნავდეს დედამიწა თავისი ღერძის გარშემო, რომ ეკვატორზე ადამიანები უწონონი გახდნენ? შეადარეთ თანამგზავრის პერიოდს.
EN: How fast would the Earth have to spin (what period) for people at the equator to become weightless? Compare with a satellite's period.
HKA: უწონადობისას მთელი სიმძიმის ძალა ცენტრისკენულ აჩქარებას ხმარდება: $g = \dfrac{v^2}{R}$.
HEN: In weightlessness all of gravity provides the centripetal acceleration: $g = \dfrac{v^2}{R}$.
SKA: **ფორმულა:** $g = \dfrac{4\pi^2 R}{T^2} \Rightarrow T = 2\pi\sqrt{\dfrac{R}{g}}$
**რიცხვები:** $T = 6{,}28\sqrt{\dfrac{6{,}4 \cdot 10^6}{10}} = 6{,}28 \cdot 800 \approx 5000\ \text{წმ} \approx 84\ \text{წთ}$
ეს ზუსტად დაბალი ორბიტის თანამგზავრის პერიოდია — ეკვატორზე მდგომი ადამიანი „ორბიტაზე“ იქნებოდა! (ახლა $T = 24\ \text{სთ}$ — $17$-ჯერ მეტი.)
SEN: **Formula:** $g = \dfrac{4\pi^2 R}{T^2} \Rightarrow T = 2\pi\sqrt{\dfrac{R}{g}}$
**Numbers:** $T = 6.28\sqrt{\dfrac{6.4 \times 10^6}{10}} = 6.28 \cdot 800 \approx 5000\ \text{s} \approx 84\ \text{min}$
This is exactly a low-orbit satellite's period — a person at the equator would be "in orbit"! (Now $T = 24\ \text{h}$ — $17$ times longer.)
AKA: $\approx 84\ \text{წთ}$
AEN: $\approx 84\ \text{min}$

--- hard momentum olympiad
KA: $10\ \text{გ}$ ტყვია $500\ \text{მ/წმ}$ სიჩქარით გაივლის ყინულზე მდებარე უძრავ $1\ \text{კგ}$ ძელში და $300\ \text{მ/წმ}$ სიჩქარით გამოდის. იპოვეთ ძელის სიჩქარე და გამოყოფილი სითბო.
EN: A $10\ \text{g}$ bullet at $500\ \text{m/s}$ passes through a $1\ \text{kg}$ block at rest on ice and comes out at $300\ \text{m/s}$. Find the block's speed and the heat released.
HKA: იმპულსი ინახება; სითბო = კინეტიკური ენერგიის დანაკარგი.
HEN: Momentum is conserved; heat = loss of kinetic energy.
SKA: **ფორმულა:** $m v_1 = m v_2 + M u$, $\ Q = \dfrac{m v_1^2}{2} - \dfrac{m v_2^2}{2} - \dfrac{M u^2}{2}$
**რიცხვები:** $u = \dfrac{0{,}01 \cdot (500 - 300)}{1} = 2\ \text{მ/წმ}$
$Q = \dfrac{0{,}01 \cdot (250\,000 - 90\,000)}{2} - \dfrac{1 \cdot 4}{2} = 800 - 2 = 798\ \text{ჯ}$
SEN: **Formula:** $m v_1 = m v_2 + M u$, $\ Q = \dfrac{m v_1^2}{2} - \dfrac{m v_2^2}{2} - \dfrac{M u^2}{2}$
**Numbers:** $u = \dfrac{0.01 \cdot (500 - 300)}{1} = 2\ \text{m/s}$
$Q = \dfrac{0.01 \cdot (250\,000 - 90\,000)}{2} - \dfrac{1 \cdot 4}{2} = 800 - 2 = 798\ \text{J}$
AKA: $2\ \text{მ/წმ}$; $798\ \text{ჯ}$
AEN: $2\ \text{m/s}$; $798\ \text{J}$

--- hard statics olympiad
KA: მაგიდის კიდეზე ერთმანეთზე სამ ერთნაირ წიგნს (სიგრძე $L$) აწყობენ ისე, რომ თითოეული ქვედაზე გარეთ იყოს გამოწეული. რა მაქსიმალურ მანძილზე შეიძლება გამოვიდეს ზედა წიგნის ბოლო მაგიდის კიდიდან ისე, რომ წყობა არ ჩამოიშალოს?
EN: Three identical books (length $L$) are stacked at a table's edge, each sticking out beyond the one below. How far can the top book's end reach beyond the table edge without the stack toppling?
HKA: დაიწყეთ ზემოდან: ზედა წიგნის მასათა ცენტრი შუა წიგნის კიდეზე უნდა იყოს; ორი ზედას საერთო მასათა ცენტრი — ქვედას კიდეზე და ა.შ.
HEN: Start from the top: the top book's centre of mass must be at the edge of the middle book; the centre of mass of the top two must be at the edge of the bottom one, and so on.
SKA: ზედა წიგნი შუაზე გამოიწევა $\dfrac{L}{2}$-ით.
ორი ზედა (მასათა ცენტრი შუა წიგნის კიდიდან $\dfrac{L}{4}$-ით შიგნით) ქვედაზე გამოიწევა $\dfrac{L}{4}$-ით.
სამივე (მასათა ცენტრი ქვედა წიგნის კიდიდან $\dfrac{L}{6}$-ით შიგნით) მაგიდაზე გამოიწევა $\dfrac{L}{6}$-ით.
**ფორმულა:** $d = \dfrac{L}{2} + \dfrac{L}{4} + \dfrac{L}{6} = \dfrac{11}{12} L$
**რიცხვები:** $L = 24\ \text{სმ}$-ისთვის $d = 22\ \text{სმ}$ — ზედა წიგნი თითქმის მთლიანად მაგიდის გარეთაა! (მეტი წიგნით გამოწევა შეუზღუდავად შეიძლება გაიზარდოს.)
SEN: The top book overhangs the middle one by $\dfrac{L}{2}$.
The top two (centre of mass $\dfrac{L}{4}$ inside the middle book's edge) overhang the bottom book by $\dfrac{L}{4}$.
All three (centre of mass $\dfrac{L}{6}$ inside the bottom book's edge) overhang the table by $\dfrac{L}{6}$.
**Formula:** $d = \dfrac{L}{2} + \dfrac{L}{4} + \dfrac{L}{6} = \dfrac{11}{12} L$
**Numbers:** for $L = 24\ \text{cm}$, $d = 22\ \text{cm}$ — the top book is almost entirely past the table! (With more books the overhang grows without limit.)
AKA: $\dfrac{11}{12}L$
AEN: $\dfrac{11}{12}L$
