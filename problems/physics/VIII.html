--- easy energy
KA: $500\ \text{კგ}$ მასის ლიფტი $20\ \text{მ}$ სიმაღლეზეა. რას უდრის მისი პოტენციური ენერგია მიწის დონის მიმართ?
EN: A $500\ \text{kg}$ lift is at a height of $20\ \text{m}$. What is its potential energy relative to the ground?
HKA: $E_p = m g h$.
HEN: $E_p = m g h$.
SKA: **ფორმულა:** $E_p = m g h$
**რიცხვები:** $E_p = 500 \cdot 10 \cdot 20 = 100\,000\ \text{ჯ} = 100\ \text{კჯ}$
SEN: **Formula:** $E_p = m g h$
**Numbers:** $E_p = 500 \cdot 10 \cdot 20 = 100\,000\ \text{J} = 100\ \text{kJ}$
AKA: $100\ \text{კჯ}$
AEN: $100\ \text{kJ}$

--- easy energy
KA: $2\ \text{კგ}$ მასის ბურთის კინეტიკური ენერგია $100\ \text{ჯ}$-ია. რა სიჩქარით მოძრაობს ის?
EN: A $2\ \text{kg}$ ball has $100\ \text{J}$ of kinetic energy. How fast is it moving?
HKA: $E_k = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{\dfrac{2E_k}{m}}$.
HEN: $E_k = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{\dfrac{2E_k}{m}}$.
SKA: **ფორმულა:** $v = \sqrt{\dfrac{2 E_k}{m}}$
**რიცხვები:** $v = \sqrt{\dfrac{2 \cdot 100}{2}} = 10\ \text{მ/წმ}$
SEN: **Formula:** $v = \sqrt{\dfrac{2 E_k}{m}}$
**Numbers:** $v = \sqrt{\dfrac{2 \cdot 100}{2}} = 10\ \text{m/s}$
AKA: $10\ \text{მ/წმ}$
AEN: $10\ \text{m/s}$

--- easy energy
KA: რა ენერგიის გარდაქმნა ხდება: ა) ქვის ვარდნისას; ბ) შეკუმშული ზამბარის მიერ ბურთულას სროლისას; გ) ავტომობილის დამუხრუჭებისას?
EN: What energy transformation happens: a) when a stone falls; b) when a compressed spring launches a ball; c) when a car brakes?
HKA: ენერგია არ ქრება — ერთი სახიდან მეორეში გადადის.
HEN: Energy is not lost — it changes from one form to another.
SKA: ა) პოტენციური $\to$ კინეტიკური.
ბ) ზამბარის (დრეკადობის) პოტენციური $\to$ ბურთულას კინეტიკური.
გ) კინეტიკური $\to$ შინაგანი (მუხრუჭები და საბურავები თბება).
SEN: a) potential $\to$ kinetic.
b) the spring's elastic potential $\to$ the ball's kinetic.
c) kinetic $\to$ internal (the brakes and tyres heat up).
AKA: ა) $E_p \to E_k$; ბ) დრეკადი $\to E_k$; გ) $E_k \to$ შინაგანი
AEN: a) $E_p \to E_k$; b) elastic $\to E_k$; c) $E_k \to$ internal

--- easy machines
KA: $20\ \text{კგ}$ ვედროს ჭიდან უძრავი ჭოჭონაქით სწევენ. რა ძალაა საჭირო? რა სარგებელს იძლევა უძრავი ჭოჭონაქი?
EN: A $20\ \text{kg}$ bucket is pulled up a well with a fixed pulley. What force is needed? What is the benefit of a fixed pulley?
HKA: უძრავი ჭოჭონაქი ძალაში არ იგებს.
HEN: A fixed pulley gives no gain in force.
SKA: **ფორმულა:** $F = m g$
**რიცხვები:** $F = 20 \cdot 10 = 200\ \text{ნ}$
სარგებელი — ძალის მიმართულების შეცვლა: თოკს ქვემოთ ექაჩებიან, რაც უფრო მოსახერხებელია (საკუთარი წონაც ეხმარება).
SEN: **Formula:** $F = m g$
**Numbers:** $F = 20 \cdot 10 = 200\ \text{N}$
Benefit — changing the direction of the force: you pull down, which is easier (your own weight helps).
AKA: $200\ \text{ნ}$; მიმართულების შეცვლა
AEN: $200\ \text{N}$; changes the direction

--- easy machines
KA: $800\ \text{ნ}$ წონის ყუთი $1\ \text{მ}$ სიმაღლეზე $4\ \text{მ}$ სიგრძის დახრილი სიბრტყით აქვთ ასატანი. რა ძალაა საჭირო ხახუნის გარეშე?
EN: An $800\ \text{N}$ box is raised $1\ \text{m}$ along a $4\ \text{m}$ incline. What force is needed without friction?
HKA: ოქროს წესი: $F l = P h$.
HEN: Golden rule: $F l = P h$.
SKA: **ფორმულა:** $F = P\dfrac{h}{l}$
**რიცხვები:** $F = 800 \cdot \dfrac{1}{4} = 200\ \text{ნ}$
SEN: **Formula:** $F = P\dfrac{h}{l}$
**Numbers:** $F = 800 \cdot \dfrac{1}{4} = 200\ \text{N}$
AKA: $200\ \text{ნ}$
AEN: $200\ \text{N}$

--- easy machines
KA: ბერკეტის რომელ კლასს ეკუთვნის: ა) მაკრატელი; ბ) კაკლის სამტვრევი; გ) პინცეტი? რომელი იგებს ძალაში და რომელი — მანძილში?
EN: Which class of lever is: a) scissors; b) a nutcracker; c) tweezers? Which gains in force and which in distance?
HKA: I კლასი — საყრდენი შუაშია; II — ტვირთი შუაშია; III — ძალა შუაშია.
HEN: Class I — pivot in the middle; class II — load in the middle; class III — effort in the middle.
SKA: ა) მაკრატელი — **I კლასი** (საყრდენი — ხრახნი შუაში).
ბ) კაკლის სამტვრევი — **II კლასი** (კაკალი საყრდენსა და ხელს შორისაა) — იგებს ძალაში.
გ) პინცეტი — **III კლასი** (თითები შუაშია) — იგებს მანძილში (და სიზუსტეში), აგებს ძალაში.
SEN: a) scissors — **class I** (the pivot screw is in the middle).
b) nutcracker — **class II** (the nut is between the pivot and the hand) — gains force.
c) tweezers — **class III** (the fingers are in the middle) — gains distance (and precision), loses force.
AKA: ა) I; ბ) II; გ) III
AEN: a) I; b) II; c) III

--- easy heat
KA: ჩამოთვალეთ სხეულის შინაგანი ენერგიის შეცვლის ორი ხერხი და მოიყვანეთ მაგალითები.
EN: Name two ways to change a body's internal energy and give examples.
HKA: მუშაობის შესრულება და თბოგადაცემა.
HEN: Doing work and heat transfer.
SKA: **მუშაობის შესრულებით:** ხელისგულების გახეხვა, ტუმბოთი ჰაერის ჩატუმბვისას ტუმბოს გათბობა, ლითონის ჭედვა.
**თბოგადაცემით:** ჩაიდნის გაცხელება ქურაზე, ხელის გათბობა რადიატორთან, ცხელი ჩაის გაციება.
SEN: **By doing work:** rubbing your palms, a bicycle pump warming as you pump, hammering metal.
**By heat transfer:** heating a kettle on the stove, warming hands at a radiator, hot tea cooling down.
AKA: მუშაობა და თბოგადაცემა
AEN: work and heat transfer

--- easy heat
KA: რატომ ათავსებენ გათბობის რადიატორს ფანჯრის ქვეშ, იატაკთან ახლოს, და არა ჭერთან?
EN: Why is a heating radiator placed under the window, near the floor, rather than near the ceiling?
HKA: თბილი ჰაერი ადის, ცივი — ეშვება.
HEN: Warm air rises, cold air sinks.
SKA: რადიატორთან გამთბარი ჰაერი მსუბუქდება და ადის, მის ადგილს ცივი ჰაერი იკავებს — წარმოიქმნება **კონვექციის** ნაკადი, რომელიც მთელ ოთახს ათბობს.
ფანჯარასთან გაციებული ჰაერი ქვემოთ ეშვება და პირდაპირ რადიატორზე ხვდება.
ჭერთან რადიატორი მხოლოდ ზედა ფენას გაათბობდა — თბილი ჰაერი ზემოთ დარჩებოდა.
SEN: Air warmed at the radiator becomes lighter and rises; cold air takes its place — a **convection** current forms and heats the whole room.
Air cooled at the window sinks and meets the radiator directly.
Near the ceiling the radiator would only heat the top layer — warm air would stay up there.
AKA: კონვექციისთვის
AEN: for convection

--- easy heatcap
KA: რამდენი სითბოა საჭირო $5\ \text{კგ}$ წყლის $10\ \text{°C}$-ით გასათბობად?
EN: How much heat is needed to warm $5\ \text{kg}$ of water by $10\ \text{°C}$?
HKA: $Q = c m \Delta t$.
HEN: $Q = c m \Delta t$.
SKA: **ფორმულა:** $Q = c\,m\,\Delta t$
**რიცხვები:** $Q = 4200 \cdot 5 \cdot 10 = 210\,000\ \text{ჯ} = 210\ \text{კჯ}$
SEN: **Formula:** $Q = c\,m\,\Delta t$
**Numbers:** $Q = 4200 \cdot 5 \cdot 10 = 210\,000\ \text{J} = 210\ \text{kJ}$
AKA: $210\ \text{კჯ}$
AEN: $210\ \text{kJ}$

--- easy heatcap
KA: $2\ \text{კგ}$ რკინის დეტალმა გაცივებისას $92\ \text{კჯ}$ სითბო გასცა. რამდენი გრადუსით გაცივდა ის? ($c = 460\ \text{ჯ/(კგ}\cdot\text{°C)}$)
EN: A $2\ \text{kg}$ iron part gives off $92\ \text{kJ}$ of heat while cooling. By how many degrees did it cool? ($c = 460\ \text{J/(kg}\cdot\text{°C)}$)
HKA: $\Delta t = \dfrac{Q}{c m}$.
HEN: $\Delta t = \dfrac{Q}{c m}$.
SKA: **ფორმულა:** $\Delta t = \dfrac{Q}{c\,m}$
**რიცხვები:** $\Delta t = \dfrac{92\,000}{460 \cdot 2} = 100\ \text{°C}$
SEN: **Formula:** $\Delta t = \dfrac{Q}{c\,m}$
**Numbers:** $\Delta t = \dfrac{92\,000}{460 \cdot 2} = 100\ \text{°C}$
AKA: $100\ \text{°C}$-ით
AEN: by $100\ \text{°C}$

--- easy heatcap
KA: $1\ \text{კგ}$ წყალს და $1\ \text{კგ}$ ქვიშას ($c = 840\ \text{ჯ/(კგ}\cdot\text{°C)}$) ერთნაირი რაოდენობის სითბო გადასცეს. რომელი გათბება მეტად და რამდენჯერ? რატომ ცხელდება ზღვის ნაპირზე ქვიშა დღისით უფრო მეტად, ვიდრე წყალი?
EN: $1\ \text{kg}$ of water and $1\ \text{kg}$ of sand ($c = 840\ \text{J/(kg}\cdot\text{°C)}$) receive the same amount of heat. Which warms more, and by how many times? Why is beach sand hotter than the sea in the daytime?
HKA: ერთნაირი $Q$ და $m$-ისას $\Delta t \sim \dfrac{1}{c}$.
HEN: For equal $Q$ and $m$, $\Delta t \propto \dfrac{1}{c}$.
SKA: **ფორმულა:** $\dfrac{\Delta t_{\text{ქ}}}{\Delta t_{\text{წ}}} = \dfrac{c_{\text{წ}}}{c_{\text{ქ}}}$
**რიცხვები:** $\dfrac{4200}{840} = 5$ — ქვიშა $5$-ჯერ მეტად გათბება.
წყლის ხვედრითი სითბოტევადობა დიდია, ამიტომ მზე მას ნელა ათბობს; ქვიშა კი სწრაფად ცხელდება.
SEN: **Formula:** $\dfrac{\Delta t_{\text{sand}}}{\Delta t_{\text{w}}} = \dfrac{c_{\text{w}}}{c_{\text{sand}}}$
**Numbers:** $\dfrac{4200}{840} = 5$ — the sand warms $5$ times more.
Water has a large specific heat capacity, so the sun warms it slowly; sand heats up quickly.
AKA: ქვიშა, $5$-ჯერ
AEN: the sand, $5$ times

--- easy melting
KA: რამდენი სითბოა საჭირო $0\ \text{°C}$ ტემპერატურის $500\ \text{გ}$ ყინულის გასალღობად?
EN: How much heat is needed to melt $500\ \text{g}$ of ice at $0\ \text{°C}$?
HKA: $Q = \lambda m$.
HEN: $Q = \lambda m$.
SKA: **ფორმულა:** $Q = \lambda\,m$
**რიცხვები:** $Q = 3{,}4 \cdot 10^5 \cdot 0{,}5 = 1{,}7 \cdot 10^5\ \text{ჯ} = 170\ \text{კჯ}$
SEN: **Formula:** $Q = \lambda\,m$
**Numbers:** $Q = 3.4 \times 10^5 \cdot 0.5 = 1.7 \times 10^5\ \text{J} = 170\ \text{kJ}$
AKA: $170\ \text{კჯ}$
AEN: $170\ \text{kJ}$

--- easy melting
KA: რამდენი სითბო გამოიყოფა $0\ \text{°C}$ ტემპერატურის $3\ \text{კგ}$ წყლის გაყინვისას? რატომ დებენ ზოგჯერ სარდაფში წყლიან ვედროს, რომ ბოსტნეული არ გაიყინოს?
EN: How much heat is released when $3\ \text{kg}$ of water at $0\ \text{°C}$ freezes? Why do people sometimes put a bucket of water in a cellar to keep vegetables from freezing?
HKA: გაყინვისას იმდენივე სითბო გამოიყოფა, რამდენიც დნობას სჭირდება.
HEN: Freezing releases as much heat as melting absorbs.
SKA: **ფორმულა:** $Q = \lambda\,m$
**რიცხვები:** $Q = 3{,}4 \cdot 10^5 \cdot 3 = 1{,}02 \cdot 10^6\ \text{ჯ} \approx 1\ \text{მჯ}$
წყალი იყინება ბოსტნეულზე ადრე და გამოყოფილი სითბო სარდაფის ტემპერატურას $0\ \text{°C}$-ის მახლობლად ინარჩუნებს.
SEN: **Formula:** $Q = \lambda\,m$
**Numbers:** $Q = 3.4 \times 10^5 \cdot 3 = 1.02 \times 10^6\ \text{J} \approx 1\ \text{MJ}$
The water freezes first, and the heat it releases keeps the cellar close to $0\ \text{°C}$.
AKA: $\approx 1\ \text{მჯ}$
AEN: $\approx 1\ \text{MJ}$

--- easy vapor
KA: რამდენი სითბო გამოიყოფა $100\ \text{°C}$ ტემპერატურის $200\ \text{გ}$ ორთქლის კონდენსაციისას?
EN: How much heat is released when $200\ \text{g}$ of steam at $100\ \text{°C}$ condenses?
HKA: კონდენსაციისას $Q = L m$ გამოიყოფა.
HEN: On condensing, $Q = L m$ is released.
SKA: **ფორმულა:** $Q = L\,m$
**რიცხვები:** $Q = 2{,}3 \cdot 10^6 \cdot 0{,}2 = 4{,}6 \cdot 10^5\ \text{ჯ} = 460\ \text{კჯ}$
SEN: **Formula:** $Q = L\,m$
**Numbers:** $Q = 2.3 \times 10^6 \cdot 0.2 = 4.6 \times 10^5\ \text{J} = 460\ \text{kJ}$
AKA: $460\ \text{კჯ}$
AEN: $460\ \text{kJ}$

--- easy fuel
KA: რამდენი სითბო გამოიყოფა $0{,}5\ \text{კგ}$ ქვანახშირის სრული წვისას? ($q = 2{,}7 \cdot 10^7\ \text{ჯ/კგ}$)
EN: How much heat is released when $0.5\ \text{kg}$ of coal burns completely? ($q = 2.7 \times 10^7\ \text{J/kg}$)
HKA: $Q = q m$.
HEN: $Q = q m$.
SKA: **ფორმულა:** $Q = q\,m$
**რიცხვები:** $Q = 2{,}7 \cdot 10^7 \cdot 0{,}5 = 1{,}35 \cdot 10^7\ \text{ჯ}$
SEN: **Formula:** $Q = q\,m$
**Numbers:** $Q = 2.7 \times 10^7 \cdot 0.5 = 1.35 \times 10^7\ \text{J}$
AKA: $1{,}35 \cdot 10^7\ \text{ჯ}$
AEN: $1.35 \times 10^7\ \text{J}$

--- easy expansion
KA: $50\ \text{მ}$ სიგრძის ალუმინის სადენი $30\ \text{°C}$-ით გათბა. რამდენით დაგრძელდა ის? ($\alpha = 2{,}4 \cdot 10^{-5}\ \text{1/°C}$) რატომ ეკიდება სადენები ზაფხულში უფრო მეტად?
EN: A $50\ \text{m}$ aluminium wire warms by $30\ \text{°C}$. By how much does it lengthen? ($\alpha = 2.4 \times 10^{-5}\ \text{1/°C}$) Why do power lines sag more in summer?
HKA: $\Delta l = \alpha l_0 \Delta t$.
HEN: $\Delta l = \alpha l_0 \Delta t$.
SKA: **ფორმულა:** $\Delta l = \alpha\,l_0\,\Delta t$
**რიცხვები:** $\Delta l = 2{,}4 \cdot 10^{-5} \cdot 50 \cdot 30 = 0{,}036\ \text{მ} = 3{,}6\ \text{სმ}$
ზაფხულში სადენები გრძელდება, ბოძებს შორის მანძილი კი იგივეა — ამიტომ უფრო მეტად ეკიდება.
SEN: **Formula:** $\Delta l = \alpha\,l_0\,\Delta t$
**Numbers:** $\Delta l = 2.4 \times 10^{-5} \cdot 50 \cdot 30 = 0.036\ \text{m} = 3.6\ \text{cm}$
In summer the wires get longer while the distance between poles stays the same — so they sag more.
AKA: $3{,}6\ \text{სმ}$
AEN: $3.6\ \text{cm}$

--- easy engines
KA: თბოძრავის სმკ $40\%$-ია, მან $800\ \text{ჯ}$ სასარგებლო მუშაობა შეასრულა. რამდენი სითბო მიიღო მან გამათბობლისგან?
EN: A heat engine with $40\%$ efficiency does $800\ \text{J}$ of useful work. How much heat did it take from the hot source?
HKA: $\eta = \dfrac{A}{Q_1} \Rightarrow Q_1 = \dfrac{A}{\eta}$.
HEN: $\eta = \dfrac{A}{Q_1} \Rightarrow Q_1 = \dfrac{A}{\eta}$.
SKA: **ფორმულა:** $Q_1 = \dfrac{A}{\eta}$
**რიცხვები:** $Q_1 = \dfrac{800}{0{,}4} = 2000\ \text{ჯ}$
SEN: **Formula:** $Q_1 = \dfrac{A}{\eta}$
**Numbers:** $Q_1 = \dfrac{800}{0.4} = 2000\ \text{J}$
AKA: $2000\ \text{ჯ}$
AEN: $2000\ \text{J}$

--- medium work
KA: ამწემ $2\ \text{ტ}$ მასის ფილა $15\ \text{მ}$ სიმაღლეზე $1$ წუთში თანაბრად აიტანა. იპოვეთ შესრულებული მუშაობა და სიმძლავრე.
EN: A crane lifts a $2\ \text{t}$ slab uniformly to $15\ \text{m}$ in $1$ minute. Find the work done and the power.
HKA: $A = m g h$, $N = A/t$.
HEN: $A = m g h$, $N = A/t$.
SKA: **ფორმულა:** $A = m g h$, $\ N = \dfrac{A}{t}$
**რიცხვები:** $A = 2000 \cdot 10 \cdot 15 = 3 \cdot 10^5\ \text{ჯ}$
$N = \dfrac{3 \cdot 10^5}{60} = 5000\ \text{ვტ} = 5\ \text{კვტ}$
SEN: **Formula:** $A = m g h$, $\ N = \dfrac{A}{t}$
**Numbers:** $A = 2000 \cdot 10 \cdot 15 = 3 \times 10^5\ \text{J}$
$N = \dfrac{3 \times 10^5}{60} = 5000\ \text{W} = 5\ \text{kW}$
AKA: $300\ \text{კჯ}$; $5\ \text{კვტ}$
AEN: $300\ \text{kJ}$; $5\ \text{kW}$

--- medium work
KA: რა დროში აავსებს $3\ \text{კვტ}$ სიმძლავრის ტუმბო $5\ \text{მ}$ სიმაღლეზე მდებარე $18\ \text{მ}^3$ მოცულობის ავზს?
EN: How long does a $3\ \text{kW}$ pump take to fill an $18\ \text{m}^3$ tank located $5\ \text{m}$ up?
HKA: ჯერ მუშაობა $m g h$, შემდეგ $t = A/N$.
HEN: First the work $m g h$, then $t = A/N$.
SKA: **ფორმულა:** $t = \dfrac{\rho V g h}{N}$
**რიცხვები:** $A = 1000 \cdot 18 \cdot 10 \cdot 5 = 9 \cdot 10^5\ \text{ჯ}$
$t = \dfrac{9 \cdot 10^5}{3000} = 300\ \text{წმ} = 5\ \text{წთ}$
SEN: **Formula:** $t = \dfrac{\rho V g h}{N}$
**Numbers:** $A = 1000 \cdot 18 \cdot 10 \cdot 5 = 9 \times 10^5\ \text{J}$
$t = \dfrac{9 \times 10^5}{3000} = 300\ \text{s} = 5\ \text{min}$
AKA: $5\ \text{წთ}$
AEN: $5\ \text{min}$

--- medium work
KA: $60\ \text{კვტ}$ სიმძლავრის ავტომობილი $30\ \text{მ/წმ}$ მუდმივი სიჩქარით მოძრაობს. რას უდრის წევის ძალა? რატომ გადართავენ მძღოლები დაბალ სიჩქარეზე აღმართზე?
EN: A car with $60\ \text{kW}$ power moves at a constant $30\ \text{m/s}$. What is the driving force? Why do drivers shift to a low gear on a hill?
HKA: $N = F v$.
HEN: $N = F v$.
SKA: **ფორმულა:** $N = F v \Rightarrow F = \dfrac{N}{v}$
**რიცხვები:** $F = \dfrac{60\,000}{30} = 2000\ \text{ნ}$
მუდმივი სიმძლავრისას სიჩქარის შემცირება წევის ძალას ზრდის — აღმართზე დიდი ძალაა საჭირო.
SEN: **Formula:** $N = F v \Rightarrow F = \dfrac{N}{v}$
**Numbers:** $F = \dfrac{60\,000}{30} = 2000\ \text{N}$
At constant power, lower speed means a larger driving force — and climbing needs a large force.
AKA: $2000\ \text{ნ}$
AEN: $2000\ \text{N}$

--- medium energy
KA: $10\ \text{მ}$ სიმაღლის აივნიდან ქვა $15\ \text{მ/წმ}$ სიჩქარით ისროლეს (რა მიმართულებითაც არ უნდა). ენერგიის შენახვით იპოვეთ, რა სიჩქარით დაეცემა ის მიწას.
EN: A stone is thrown at $15\ \text{m/s}$ from a balcony $10\ \text{m}$ high (in any direction). Use energy conservation to find its speed at the ground.
HKA: სიჩქარის მიმართულება ენერგიაში არ შედის — მხოლოდ სიდიდე.
HEN: Energy doesn't depend on the direction of the velocity — only its size.
SKA: **ფორმულა:** $\dfrac{m v_0^2}{2} + m g h = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{v_0^2 + 2 g h}$
**რიცხვები:** $v = \sqrt{225 + 200} = \sqrt{425} \approx 20{,}6\ \text{მ/წმ}$
SEN: **Formula:** $\dfrac{m v_0^2}{2} + m g h = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{v_0^2 + 2 g h}$
**Numbers:** $v = \sqrt{225 + 200} = \sqrt{425} \approx 20.6\ \text{m/s}$
AKA: $\approx 20{,}6\ \text{მ/წმ}$
AEN: $\approx 20.6\ \text{m/s}$

--- medium energy
KA: $2000\ \text{ნ/მ}$ სიხისტის ზამბარა $3\ \text{სმ}$-ით შეკუმშეს და მისით $50\ \text{გ}$ ბურთულა ჰორიზონტალურად ისროლეს. რა სიჩქარეს მიიღებს ბურთულა?
EN: A spring of stiffness $2000\ \text{N/m}$ is compressed $3\ \text{cm}$ and launches a $50\ \text{g}$ ball horizontally. What speed does the ball get?
HKA: $\dfrac{k x^2}{2} = \dfrac{m v^2}{2}$.
HEN: $\dfrac{k x^2}{2} = \dfrac{m v^2}{2}$.
SKA: **ფორმულა:** $\dfrac{k x^2}{2} = \dfrac{m v^2}{2} \Rightarrow v = x\sqrt{\dfrac{k}{m}}$
**რიცხვები:** $v = 0{,}03 \cdot \sqrt{\dfrac{2000}{0{,}05}} = 0{,}03 \cdot 200 = 6\ \text{მ/წმ}$
SEN: **Formula:** $\dfrac{k x^2}{2} = \dfrac{m v^2}{2} \Rightarrow v = x\sqrt{\dfrac{k}{m}}$
**Numbers:** $v = 0.03 \cdot \sqrt{\dfrac{2000}{0.05}} = 0.03 \cdot 200 = 6\ \text{m/s}$
AKA: $6\ \text{მ/წმ}$
AEN: $6\ \text{m/s}$

--- medium energy
KA: ატრაქციონის ვაგონი უსაწყისო სიჩქარით იწყებს მოძრაობას $20\ \text{მ}$ სიმაღლიდან. რა სიჩქარე ექნება მას $5\ \text{მ}$ სიმაღლის წერტილში (ხახუნის გარეშე)?
EN: A roller-coaster car starts from rest at a height of $20\ \text{m}$. What is its speed at a point $5\ \text{m}$ high (no friction)?
HKA: სიჩქარე დამოკიდებულია მხოლოდ სიმაღლეების სხვაობაზე.
HEN: The speed depends only on the drop in height.
SKA: **ფორმულა:** $m g (h_1 - h_2) = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{2 g (h_1 - h_2)}$
**რიცხვები:** $v = \sqrt{2 \cdot 10 \cdot 15} = \sqrt{300} \approx 17{,}3\ \text{მ/წმ}$
SEN: **Formula:** $m g (h_1 - h_2) = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{2 g (h_1 - h_2)}$
**Numbers:** $v = \sqrt{2 \cdot 10 \cdot 15} = \sqrt{300} \approx 17.3\ \text{m/s}$
AKA: $\approx 17{,}3\ \text{მ/წმ}$
AEN: $\approx 17.3\ \text{m/s}$

--- medium energy
KA: $1000\ \text{კგ}$ მასის ავტომობილი $20\ \text{მ/წმ}$ სიჩქარიდან დამუხრუჭებით გაჩერდა. რა მუშაობა შეასრულა ხახუნის ძალამ? სად წავიდა ენერგია?
EN: A $1000\ \text{kg}$ car braked from $20\ \text{m/s}$ to a stop. How much work did friction do? Where did the energy go?
HKA: ხახუნის მუშაობა = კინეტიკური ენერგიის ცვლილება.
HEN: Work of friction = change in kinetic energy.
SKA: **ფორმულა:** $A_{\text{ხ}} = 0 - \dfrac{m v^2}{2}$
**რიცხვები:** $A_{\text{ხ}} = -\dfrac{1000 \cdot 400}{2} = -200\,000\ \text{ჯ} = -200\ \text{კჯ}$ (უარყოფითი — ძალა მოძრაობის საწინააღმდეგოა)
ენერგია მუხრუჭების, საბურავებისა და გზის შინაგან ენერგიად (სითბოდ) იქცა.
SEN: **Formula:** $A_{\text{fr}} = 0 - \dfrac{m v^2}{2}$
**Numbers:** $A_{\text{fr}} = -\dfrac{1000 \cdot 400}{2} = -200\,000\ \text{J} = -200\ \text{kJ}$ (negative — the force opposes the motion)
The energy became internal energy (heat) of the brakes, tyres and road.
AKA: $-200\ \text{კჯ}$
AEN: $-200\ \text{kJ}$

--- medium machines
KA: ბერკეტით $900\ \text{ნ}$ ტვირთი $0{,}1\ \text{მ}$-ით აწიეს; ამისთვის ბერკეტის მეორე ბოლოს $250\ \text{ნ}$ ძალით აწვებოდნენ და ის $0{,}4\ \text{მ}$-ით ჩავიდა. იპოვეთ ბერკეტის სმკ.
EN: A lever lifts a $900\ \text{N}$ load by $0.1\ \text{m}$; the other end is pushed down $0.4\ \text{m}$ with $250\ \text{N}$. Find the lever's efficiency.
HKA: $\eta = \dfrac{P h}{F s}$.
HEN: $\eta = \dfrac{P h}{F s}$.
SKA: **ფორმულა:** $\eta = \dfrac{P h}{F s} \cdot 100\%$
**რიცხვები:** $\eta = \dfrac{900 \cdot 0{,}1}{250 \cdot 0{,}4} = \dfrac{90}{100} = 90\%$
SEN: **Formula:** $\eta = \dfrac{P h}{F s} \cdot 100\%$
**Numbers:** $\eta = \dfrac{900 \cdot 0.1}{250 \cdot 0.4} = \dfrac{90}{100} = 90\%$
AKA: $90\%$
AEN: $90\%$

--- medium machines
KA: პოლისპასტის (ჭოჭონაქების სისტემის) მოძრავ ბლოკს $4$ თოკის ნაწილი იჭერს. $1200\ \text{ნ}$ ტვირთის ასაწევად რა ძალაა საჭირო: ა) იდეალურ შემთხვევაში; ბ) თუ სმკ $80\%$-ია?
EN: In a block and tackle the moving block hangs on $4$ rope segments. What force lifts a $1200\ \text{N}$ load: a) ideally; b) if the efficiency is $80\%$?
HKA: იდეალურად $F = P/4$. სმკ-ის გათვალისწინებით $F = \dfrac{P}{4\eta}$.
HEN: Ideally $F = P/4$. With efficiency, $F = \dfrac{P}{4\eta}$.
SKA: **ფორმულა:** ა) $F = \dfrac{P}{n}$; ბ) $F = \dfrac{P}{n\eta}$
**რიცხვები:** ა) $F = \dfrac{1200}{4} = 300\ \text{ნ}$; ბ) $F = \dfrac{1200}{4 \cdot 0{,}8} = 375\ \text{ნ}$
SEN: **Formula:** a) $F = \dfrac{P}{n}$; b) $F = \dfrac{P}{n\eta}$
**Numbers:** a) $F = \dfrac{1200}{4} = 300\ \text{N}$; b) $F = \dfrac{1200}{4 \cdot 0.8} = 375\ \text{N}$
AKA: ა) $300\ \text{ნ}$; ბ) $375\ \text{ნ}$
AEN: a) $300\ \text{N}$; b) $375\ \text{N}$

--- medium machines
KA: $140\ \text{კგ}$ კასრი $1\ \text{მ}$ სიმაღლის მანქანის ძარაზე $4\ \text{მ}$ სიგრძის ფიცრით აგორეს. ფიცრის სმკ $70\%$-ია. რა ძალით უწევდნენ კასრს ფიცრის გასწვრივ?
EN: A $140\ \text{kg}$ barrel is rolled up a $4\ \text{m}$ plank onto a truck bed $1\ \text{m}$ high. The plank's efficiency is $70\%$. What force along the plank was needed?
HKA: $\eta = \dfrac{m g h}{F l} \Rightarrow F = \dfrac{m g h}{\eta l}$.
HEN: $\eta = \dfrac{m g h}{F l} \Rightarrow F = \dfrac{m g h}{\eta l}$.
SKA: **ფორმულა:** $F = \dfrac{m g h}{\eta\,l}$
**რიცხვები:** $F = \dfrac{1400 \cdot 1}{0{,}7 \cdot 4} = 500\ \text{ნ}$
SEN: **Formula:** $F = \dfrac{m g h}{\eta\,l}$
**Numbers:** $F = \dfrac{1400 \cdot 1}{0.7 \cdot 4} = 500\ \text{N}$
AKA: $500\ \text{ნ}$
AEN: $500\ \text{N}$

--- medium heat
KA: რატომ ღებავენ ცხელი ქვეყნების სახლებს თეთრად? რომელი ჩაიდანი გაცივდება უფრო სწრაფად: მქრქალი შავი თუ ბზინვარე ლითონის (ერთნაირი სხვა პირობებისას)?
EN: Why are houses in hot countries painted white? Which kettle cools faster: a matt black one or a shiny metal one (all else equal)?
HKA: შავი ზედაპირი კარგად შთანთქავს და კარგადვე ასხივებს; თეთრი და ბზინვარე — აირეკლავს.
HEN: A black surface absorbs and emits radiation well; white and shiny surfaces reflect it.
SKA: თეთრი ზედაპირი მზის გამოსხივების დიდ ნაწილს აირეკლავს — სახლი ნაკლებად თბება.
მქრქალი შავი ზედაპირი თბურ გამოსხივებას უკეთ **გამოასხივებს**, ამიტომ შავი ჩაიდანი უფრო სწრაფად გაცივდება; ბზინვარე ზედაპირი სითბოს უკეთ ინარჩუნებს.
SEN: A white surface reflects most of the sun's radiation — the house heats less.
A matt black surface **emits** thermal radiation better, so the black kettle cools faster; a shiny surface keeps heat in better.
AKA: თეთრი აირეკლავს; შავი ჩაიდანი
AEN: white reflects; the black kettle

--- medium heatcap
KA: რამდენი $10\ \text{°C}$ ტემპერატურის წყალი უნდა დავამატოთ $90\ \text{°C}$ ტემპერატურის $3\ \text{კგ}$ წყალს, რომ ნარევის ტემპერატურა $40\ \text{°C}$ გახდეს?
EN: How much water at $10\ \text{°C}$ must be added to $3\ \text{kg}$ of water at $90\ \text{°C}$ to get a mixture at $40\ \text{°C}$?
HKA: სითბური ბალანსი: $m_1 (t_1 - t) = m_2 (t - t_2)$.
HEN: Heat balance: $m_1 (t_1 - t) = m_2 (t - t_2)$.
SKA: **ფორმულა:** $m_2 = m_1 \dfrac{t_1 - t}{t - t_2}$
**რიცხვები:** $m_2 = 3 \cdot \dfrac{90 - 40}{40 - 10} = 3 \cdot \dfrac{50}{30} = 5\ \text{კგ}$
SEN: **Formula:** $m_2 = m_1 \dfrac{t_1 - t}{t - t_2}$
**Numbers:** $m_2 = 3 \cdot \dfrac{90 - 40}{40 - 10} = 3 \cdot \dfrac{50}{30} = 5\ \text{kg}$
AKA: $5\ \text{კგ}$
AEN: $5\ \text{kg}$

--- medium heatcap
KA: $1{,}5\ \text{კვტ}$ სიმძლავრის ჩაიდანმა $1\ \text{კგ}$ წყალი $20\ \text{°C}$-დან $100\ \text{°C}$-მდე $5$ წუთში გაათბო. იპოვეთ ჩაიდნის სმკ.
EN: A $1.5\ \text{kW}$ kettle heats $1\ \text{kg}$ of water from $20\ \text{°C}$ to $100\ \text{°C}$ in $5$ minutes. Find its efficiency.
HKA: $\eta = \dfrac{c m \Delta t}{N t}$.
HEN: $\eta = \dfrac{c m \Delta t}{N t}$.
SKA: **ფორმულა:** $\eta = \dfrac{c\,m\,\Delta t}{N\,t}$
**რიცხვები:** $Q = 4200 \cdot 1 \cdot 80 = 336\,000\ \text{ჯ}$, $\ N t = 1500 \cdot 300 = 450\,000\ \text{ჯ}$
$\eta = \dfrac{336\,000}{450\,000} \approx 0{,}75 = 75\%$
SEN: **Formula:** $\eta = \dfrac{c\,m\,\Delta t}{N\,t}$
**Numbers:** $Q = 4200 \cdot 1 \cdot 80 = 336\,000\ \text{J}$, $\ N t = 1500 \cdot 300 = 450\,000\ \text{J}$
$\eta = \dfrac{336\,000}{450\,000} \approx 0.75 = 75\%$
AKA: $\approx 75\%$
AEN: $\approx 75\%$

--- medium heatcap
KA: $0{,}5\ \text{კგ}$ სპილენძის ქვაბში ($c = 400\ \text{ჯ/(კგ}\cdot\text{°C)}$) $2\ \text{კგ}$ წყალია $20\ \text{°C}$-ზე. რამდენი სითბოა საჭირო წყლის ასადუღებლად? რა ნაწილი ხმარდება ქვაბს?
EN: A $0.5\ \text{kg}$ copper pot ($c = 400\ \text{J/(kg}\cdot\text{°C)}$) holds $2\ \text{kg}$ of water at $20\ \text{°C}$. How much heat brings the water to the boil? What fraction goes into the pot?
HKA: ქვაბიც და წყალიც $80\ \text{°C}$-ით თბება.
HEN: Both the pot and the water warm by $80\ \text{°C}$.
SKA: **ფორმულა:** $Q = (c_{\text{ს}} m_{\text{ს}} + c_{\text{წ}} m_{\text{წ}})\,\Delta t$
**რიცხვები:** $Q_{\text{ქ}} = 400 \cdot 0{,}5 \cdot 80 = 16\,000\ \text{ჯ}$, $\ Q_{\text{წ}} = 4200 \cdot 2 \cdot 80 = 672\,000\ \text{ჯ}$
$Q = 688\,000\ \text{ჯ} \approx 688\ \text{კჯ}$; ქვაბს ხმარდება $\dfrac{16}{688} \approx 2{,}3\%$.
SEN: **Formula:** $Q = (c_{\text{Cu}} m_{\text{Cu}} + c_{\text{w}} m_{\text{w}})\,\Delta t$
**Numbers:** $Q_{\text{pot}} = 400 \cdot 0.5 \cdot 80 = 16\,000\ \text{J}$, $\ Q_{\text{w}} = 4200 \cdot 2 \cdot 80 = 672\,000\ \text{J}$
$Q = 688\,000\ \text{J} \approx 688\ \text{kJ}$; the pot takes $\dfrac{16}{688} \approx 2.3\%$.
AKA: $688\ \text{კჯ}$; $\approx 2{,}3\%$
AEN: $688\ \text{kJ}$; $\approx 2.3\%$

--- medium melting
KA: $-20\ \text{°C}$ ტემპერატურის $2\ \text{კგ}$ ყინული უნდა გადავაქციოთ $+20\ \text{°C}$ ტემპერატურის წყლად. რამდენი სითბოა საჭირო? რომელი ეტაპი მოითხოვს ყველაზე მეტ სითბოს?
EN: $2\ \text{kg}$ of ice at $-20\ \text{°C}$ must be turned into water at $+20\ \text{°C}$. How much heat is needed? Which stage takes the most?
HKA: სამი ეტაპი: ყინულის გათბობა, დნობა, წყლის გათბობა.
HEN: Three stages: warming the ice, melting, warming the water.
SKA: **ფორმულა:** $Q = c_{\text{ყ}} m \cdot 20 + \lambda m + c_{\text{წ}} m \cdot 20$
**რიცხვები:** $Q_1 = 2100 \cdot 2 \cdot 20 = 84\,000\ \text{ჯ}$, $\ Q_2 = 3{,}4 \cdot 10^5 \cdot 2 = 680\,000\ \text{ჯ}$, $\ Q_3 = 4200 \cdot 2 \cdot 20 = 168\,000\ \text{ჯ}$
$Q = 932\,000\ \text{ჯ} \approx 932\ \text{კჯ}$; ყველაზე მეტი — დნობას.
SEN: **Formula:** $Q = c_{\text{ice}} m \cdot 20 + \lambda m + c_{\text{w}} m \cdot 20$
**Numbers:** $Q_1 = 2100 \cdot 2 \cdot 20 = 84\,000\ \text{J}$, $\ Q_2 = 3.4 \times 10^5 \cdot 2 = 680\,000\ \text{J}$, $\ Q_3 = 4200 \cdot 2 \cdot 20 = 168\,000\ \text{J}$
$Q = 932\,000\ \text{J} \approx 932\ \text{kJ}$; melting takes the most.
AKA: $932\ \text{კჯ}$; დნობა
AEN: $932\ \text{kJ}$; melting

--- medium melting
KA: $80\ \text{°C}$ ტემპერატურის $1\ \text{კგ}$ წყალი $0\ \text{°C}$-მდე გაცივებისას რამდენ $0\ \text{°C}$ ტემპერატურის ყინულს გაალღობს?
EN: How much ice at $0\ \text{°C}$ can $1\ \text{kg}$ of water at $80\ \text{°C}$ melt while cooling to $0\ \text{°C}$?
HKA: წყლის მიერ გაცემული სითბო = ყინულის დნობის სითბოს.
HEN: Heat given by the water = heat to melt the ice.
SKA: **ფორმულა:** $c\,m_{\text{წ}}\,\Delta t = \lambda\,m_{\text{ყ}} \Rightarrow m_{\text{ყ}} = \dfrac{c m_{\text{წ}} \Delta t}{\lambda}$
**რიცხვები:** $m_{\text{ყ}} = \dfrac{4200 \cdot 1 \cdot 80}{3{,}4 \cdot 10^5} = \dfrac{336\,000}{340\,000} \approx 0{,}99\ \text{კგ}$ — თითქმის თავისივე მასის!
SEN: **Formula:** $c\,m_{\text{w}}\,\Delta t = \lambda\,m_{\text{ice}} \Rightarrow m_{\text{ice}} = \dfrac{c m_{\text{w}} \Delta t}{\lambda}$
**Numbers:** $m_{\text{ice}} = \dfrac{4200 \cdot 1 \cdot 80}{3.4 \times 10^5} = \dfrac{336\,000}{340\,000} \approx 0.99\ \text{kg}$ — almost its own mass!
AKA: $\approx 0{,}99\ \text{კგ}$
AEN: $\approx 0.99\ \text{kg}$

--- medium vapor
KA: რა ფაქტორებზეა დამოკიდებული აორთქლების სიჩქარე? ახსენით, რატომ შრება სარეცხი უფრო სწრაფად თბილ, ქარიან დღეს და გაშლილი, ვიდრე დაკეცილი.
EN: What does the rate of evaporation depend on? Explain why laundry dries faster on a warm, windy day, and spread out rather than folded.
HKA: იფიქრეთ, რომელი მოლეკულები ტოვებს სითხეს და რა უშლის მათ უკან დაბრუნებას.
HEN: Think about which molecules leave the liquid and what stops them coming back.
SKA: აორთქლება ჩქარდება: **ტემპერატურის** ზრდით (მეტი სწრაფი მოლეკულა), **ზედაპირის ფართობის** ზრდით (მეტ მოლეკულას შეუძლია გასვლა) და **ქარით** (ორთქლს წაიღებს, მოლეკულები უკან ვერ ბრუნდება).
ასევე დამოკიდებულია სითხის გვარობასა და ჰაერის ტენიანობაზე.
გაშლილი სარეცხის ზედაპირი დიდია, თბილ ქარიან ამინდში კი სამივე ფაქტორი ხელს უწყობს.
SEN: Evaporation speeds up with higher **temperature** (more fast molecules), larger **surface area** (more molecules can escape) and **wind** (it carries the vapour away so molecules can't return).
It also depends on the kind of liquid and on the humidity of the air.
Spread-out laundry has a large surface, and on a warm windy day all three factors help.
AKA: ტემპერატურა, ზედაპირი, ქარი (და ტენიანობა)
AEN: temperature, surface area, wind (and humidity)

--- medium vapor
KA: $2\ \text{კვტ}$ ჩაიდანში წყალი უკვე დუღს. რამდენი წყალი ამოორთქლდება მომდევნო $5$ წუთში, თუ მთელი ენერგია წყალს ხმარდება?
EN: Water is already boiling in a $2\ \text{kW}$ kettle. How much water boils away in the next $5$ minutes if all the energy goes into the water?
HKA: $N t = L m$.
HEN: $N t = L m$.
SKA: **ფორმულა:** $m = \dfrac{N t}{L}$
**რიცხვები:** $m = \dfrac{2000 \cdot 300}{2{,}3 \cdot 10^6} \approx 0{,}26\ \text{კგ}$
SEN: **Formula:** $m = \dfrac{N t}{L}$
**Numbers:** $m = \dfrac{2000 \cdot 300}{2.3 \times 10^6} \approx 0.26\ \text{kg}$
AKA: $\approx 260\ \text{გ}$
AEN: $\approx 260\ \text{g}$

--- medium fuel
KA: $50\ \text{გ}$ ბუნებრივი აირის ($q = 4{,}4 \cdot 10^7\ \text{ჯ/კგ}$) დაწვით $4\ \text{კგ}$ წყალი $20\ \text{°C}$-დან $80\ \text{°C}$-მდე გაათბეს. იპოვეთ ქურის სმკ.
EN: Burning $50\ \text{g}$ of natural gas ($q = 4.4 \times 10^7\ \text{J/kg}$) heats $4\ \text{kg}$ of water from $20\ \text{°C}$ to $80\ \text{°C}$. Find the stove's efficiency.
HKA: $\eta = \dfrac{c m \Delta t}{q m_{\text{ა}}}$.
HEN: $\eta = \dfrac{c m \Delta t}{q m_{\text{g}}}$.
SKA: **ფორმულა:** $\eta = \dfrac{c\,m\,\Delta t}{q\,m_{\text{ა}}}$
**რიცხვები:** $Q_{\text{სას}} = 4200 \cdot 4 \cdot 60 = 1{,}008 \cdot 10^6\ \text{ჯ}$, $\ Q_{\text{სრ}} = 4{,}4 \cdot 10^7 \cdot 0{,}05 = 2{,}2 \cdot 10^6\ \text{ჯ}$
$\eta = \dfrac{1{,}008}{2{,}2} \approx 0{,}46 = 46\%$
SEN: **Formula:** $\eta = \dfrac{c\,m\,\Delta t}{q\,m_{\text{g}}}$
**Numbers:** $Q_{\text{useful}} = 4200 \cdot 4 \cdot 60 = 1.008 \times 10^6\ \text{J}$, $\ Q_{\text{total}} = 4.4 \times 10^7 \cdot 0.05 = 2.2 \times 10^6\ \text{J}$
$\eta = \dfrac{1.008}{2.2} \approx 0.46 = 46\%$
AKA: $\approx 46\%$
AEN: $\approx 46\%$

--- medium expansion
KA: $12{,}5\ \text{მ}$ სიგრძის რელსებს $10\ \text{°C}$-ზე აწყობენ. ზაფხულში რელსი $50\ \text{°C}$-მდე თბება. რა მინიმალური ღრიჭო უნდა დატოვონ რელსებს შორის? ($\alpha = 1{,}2 \cdot 10^{-5}\ \text{1/°C}$)
EN: Rails $12.5\ \text{m}$ long are laid at $10\ \text{°C}$. In summer they heat up to $50\ \text{°C}$. What minimum gap must be left between rails? ($\alpha = 1.2 \times 10^{-5}\ \text{1/°C}$)
HKA: ღრიჭო რელსის დაგრძელებას უნდა უტოლდებოდეს.
HEN: The gap must equal the rail's expansion.
SKA: **ფორმულა:** $\Delta l = \alpha\,l_0\,\Delta t$
**რიცხვები:** $\Delta l = 1{,}2 \cdot 10^{-5} \cdot 12{,}5 \cdot 40 = 6 \cdot 10^{-3}\ \text{მ} = 6\ \text{მმ}$
SEN: **Formula:** $\Delta l = \alpha\,l_0\,\Delta t$
**Numbers:** $\Delta l = 1.2 \times 10^{-5} \cdot 12.5 \cdot 40 = 6 \times 10^{-3}\ \text{m} = 6\ \text{mm}$
AKA: $6\ \text{მმ}$
AEN: $6\ \text{mm}$

--- medium engines
KA: ავტომობილი $100\ \text{კმ}$-ზე $6\ \text{კგ}$ ბენზინს ($q = 4{,}6 \cdot 10^7\ \text{ჯ/კგ}$) წვავს, ძრავის სმკ $25\%$-ია. იპოვეთ ძრავის სასარგებლო მუშაობა და მოძრაობის საშუალო წინააღმდეგობის ძალა.
EN: A car burns $6\ \text{kg}$ of petrol ($q = 4.6 \times 10^7\ \text{J/kg}$) per $100\ \text{km}$ with an engine efficiency of $25\%$. Find the useful work and the average resistance force.
HKA: $A = \eta q m$; თანაბარი მოძრაობისას $A = F s$.
HEN: $A = \eta q m$; for uniform motion $A = F s$.
SKA: **ფორმულა:** $A = \eta\,q\,m$, $\ F = \dfrac{A}{s}$
**რიცხვები:** $A = 0{,}25 \cdot 4{,}6 \cdot 10^7 \cdot 6 = 6{,}9 \cdot 10^7\ \text{ჯ}$
$F = \dfrac{6{,}9 \cdot 10^7}{10^5} = 690\ \text{ნ}$
SEN: **Formula:** $A = \eta\,q\,m$, $\ F = \dfrac{A}{s}$
**Numbers:** $A = 0.25 \cdot 4.6 \times 10^7 \cdot 6 = 6.9 \times 10^7\ \text{J}$
$F = \dfrac{6.9 \times 10^7}{10^5} = 690\ \text{N}$
AKA: $6{,}9 \cdot 10^7\ \text{ჯ}$; $690\ \text{ნ}$
AEN: $6.9 \times 10^7\ \text{J}$; $690\ \text{N}$

--- hard work
KA: $10\ \text{მ}$ სიღრმის ჭიდან ამოაქვთ $10\ \text{კგ}$ წყლიანი ვედრო $2\ \text{კგ}$ მასის ერთგვაროვანი ჯაჭვით. რა მუშაობაა საჭირო?
EN: A bucket holding $10\ \text{kg}$ of water is pulled up a $10\ \text{m}$ well on a uniform chain of mass $2\ \text{kg}$. How much work is needed?
HKA: ჯაჭვის მასათა ცენტრი მხოლოდ $5\ \text{მ}$-ით ადის.
HEN: The chain's centre of mass rises only $5\ \text{m}$.
SKA: **ფორმულა:** $A = m_{\text{ვ}} g h + m_{\text{ჯ}} g \dfrac{h}{2}$
**რიცხვები:** $A = 10 \cdot 10 \cdot 10 + 2 \cdot 10 \cdot 5 = 1000 + 100 = 1100\ \text{ჯ}$
SEN: **Formula:** $A = m_{\text{b}} g h + m_{\text{ch}} g \dfrac{h}{2}$
**Numbers:** $A = 10 \cdot 10 \cdot 10 + 2 \cdot 10 \cdot 5 = 1000 + 100 = 1100\ \text{J}$
AKA: $1100\ \text{ჯ}$
AEN: $1100\ \text{J}$

--- hard work
KA: ველოსიპედისტი $18\ \text{კმ/სთ}$ სიჩქარით $150\ \text{ვტ}$ სიმძლავრეს ავითარებს. იპოვეთ წინააღმდეგობის ძალა. რა სიმძლავრე დასჭირდება $36\ \text{კმ/სთ}$-ზე, თუ ჰაერის წინააღმდეგობა სიჩქარის კვადრატის პროპორციულია?
EN: A cyclist at $18\ \text{km/h}$ develops $150\ \text{W}$. Find the resistance force. What power is needed at $36\ \text{km/h}$ if air resistance is proportional to the square of the speed?
HKA: $N = F v$; სიჩქარე ორმაგდება $\Rightarrow$ ძალა $4$-ჯერ, სიმძლავრე $8$-ჯერ.
HEN: $N = F v$; doubling the speed $\Rightarrow$ force $\times 4$, power $\times 8$.
SKA: **ფორმულა:** $F = \dfrac{N}{v}$, $\ F \sim v^2 \Rightarrow N = F v \sim v^3$
**რიცხვები:** $v_1 = 5\ \text{მ/წმ}$, $\ F_1 = \dfrac{150}{5} = 30\ \text{ნ}$
$v_2 = 10\ \text{მ/წმ}$: $F_2 = 4 \cdot 30 = 120\ \text{ნ}$, $\ N_2 = 120 \cdot 10 = 1200\ \text{ვტ}$ — $8$-ჯერ მეტი!
SEN: **Formula:** $F = \dfrac{N}{v}$, $\ F \propto v^2 \Rightarrow N = F v \propto v^3$
**Numbers:** $v_1 = 5\ \text{m/s}$, $\ F_1 = \dfrac{150}{5} = 30\ \text{N}$
$v_2 = 10\ \text{m/s}$: $F_2 = 4 \cdot 30 = 120\ \text{N}$, $\ N_2 = 120 \cdot 10 = 1200\ \text{W}$ — $8$ times more!
AKA: $30\ \text{ნ}$; $1200\ \text{ვტ}$
AEN: $30\ \text{N}$; $1200\ \text{W}$

--- hard energy
KA: ბურთი $5\ \text{მ}$ სიმაღლიდან ჩამოვარდა და $3{,}2\ \text{მ}$ სიმაღლეზე აიწია. იპოვეთ სიჩქარე დარტყმამდე და დარტყმის შემდეგ და ენერგიის რა ნაწილი დაიკარგა.
EN: A ball dropped from $5\ \text{m}$ bounces back to $3.2\ \text{m}$. Find its speed just before and just after the bounce, and what fraction of the energy was lost.
HKA: $v = \sqrt{2 g h}$ ორივე სიმაღლისთვის; ენერგია სიმაღლის პროპორციულია.
HEN: $v = \sqrt{2 g h}$ for both heights; the energy is proportional to the height.
SKA: **ფორმულა:** $v = \sqrt{2 g h}$, $\ \dfrac{\Delta E}{E} = 1 - \dfrac{h_2}{h_1}$
**რიცხვები:** $v_1 = \sqrt{100} = 10\ \text{მ/წმ}$, $\ v_2 = \sqrt{64} = 8\ \text{მ/წმ}$
$\dfrac{\Delta E}{E} = 1 - \dfrac{3{,}2}{5} = 0{,}36 = 36\%$
SEN: **Formula:** $v = \sqrt{2 g h}$, $\ \dfrac{\Delta E}{E} = 1 - \dfrac{h_2}{h_1}$
**Numbers:** $v_1 = \sqrt{100} = 10\ \text{m/s}$, $\ v_2 = \sqrt{64} = 8\ \text{m/s}$
$\dfrac{\Delta E}{E} = 1 - \dfrac{3.2}{5} = 0.36 = 36\%$
AKA: $10$ და $8\ \text{მ/წმ}$; $36\%$
AEN: $10$ and $8\ \text{m/s}$; $36\%$

--- hard energy
KA: $1\ \text{მ}$ სიგრძის ძაფზე დაკიდებული ბურთულა ჰორიზონტალურ მდგომარეობამდე გადახარეს და გაუშვეს. რა სიჩქარით გაივლის ის ყველაზე დაბალ წერტილს?
EN: A ball on a $1\ \text{m}$ string is pulled out to the horizontal and released. How fast does it pass the lowest point?
HKA: ბურთულა $l$ სიმაღლით ჩადის.
HEN: The ball drops by a height $l$.
SKA: **ფორმულა:** $m g l = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{2 g l}$
**რიცხვები:** $v = \sqrt{2 \cdot 10 \cdot 1} = \sqrt{20} \approx 4{,}5\ \text{მ/წმ}$
SEN: **Formula:** $m g l = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{2 g l}$
**Numbers:** $v = \sqrt{2 \cdot 10 \cdot 1} = \sqrt{20} \approx 4.5\ \text{m/s}$
AKA: $\approx 4{,}5\ \text{მ/წმ}$
AEN: $\approx 4.5\ \text{m/s}$

--- hard energy
KA: $50\ \text{კგ}$ მარხილი $30\ \text{მ}$ სიგრძის ფერდობზე, $6\ \text{მ}$ სიმაღლეზე თანაბრად აიტანეს, ფერდობის გასწვრივ $150\ \text{ნ}$ ძალით. იპოვეთ შესრულებული მუშაობა, პოტენციური ენერგიის ზრდა და ხახუნზე დახარჯული ენერგია.
EN: A $50\ \text{kg}$ sled is pulled uniformly up a $30\ \text{m}$ slope to a height of $6\ \text{m}$ with a force of $150\ \text{N}$ along the slope. Find the work done, the gain in potential energy and the energy lost to friction.
HKA: სრული მუშაობა = $E_p$-ს ზრდა + ხახუნის დანაკარგი.
HEN: Total work = gain in $E_p$ + friction loss.
SKA: **ფორმულა:** $A = F l$, $\ \Delta E_p = m g h$, $\ Q = A - \Delta E_p$
**რიცხვები:** $A = 150 \cdot 30 = 4500\ \text{ჯ}$, $\ \Delta E_p = 50 \cdot 10 \cdot 6 = 3000\ \text{ჯ}$
$Q = 4500 - 3000 = 1500\ \text{ჯ}$ (სმკ $\approx 67\%$)
SEN: **Formula:** $A = F l$, $\ \Delta E_p = m g h$, $\ Q = A - \Delta E_p$
**Numbers:** $A = 150 \cdot 30 = 4500\ \text{J}$, $\ \Delta E_p = 50 \cdot 10 \cdot 6 = 3000\ \text{J}$
$Q = 4500 - 3000 = 1500\ \text{J}$ (efficiency $\approx 67\%$)
AKA: $4500\ \text{ჯ}$; $3000\ \text{ჯ}$; $1500\ \text{ჯ}$
AEN: $4500\ \text{J}$; $3000\ \text{J}$; $1500\ \text{J}$

--- hard machines
KA: ბერკეტის ($1 : 4$ მხრების შეფარდებით) მოკლე მხარი მოძრავ ჭოჭონაქზე გადადებულ თოკს ექაჩება, რომელზეც ტვირთია. რა ძალით უნდა დავაწვეთ ბერკეტის გრძელ მხარს $640\ \text{ნ}$ ტვირთის ასაწევად (ხახუნის გარეშე)?
EN: A lever (arm ratio $1 : 4$) has its short arm pulling the rope of a movable pulley carrying a load. What force on the long arm lifts a $640\ \text{N}$ load (no friction)?
HKA: მექანიზმები მიმდევრობით არის — ძალაში მოგებები მრავლდება.
HEN: The machines are in series — their force gains multiply.
SKA: **ფორმულა:** მოგება $= 4 \cdot 2 = 8$, $\ F = \dfrac{P}{8}$
**რიცხვები:** $F = \dfrac{640}{8} = 80\ \text{ნ}$
SEN: **Formula:** gain $= 4 \cdot 2 = 8$, $\ F = \dfrac{P}{8}$
**Numbers:** $F = \dfrac{640}{8} = 80\ \text{N}$
AKA: $80\ \text{ნ}$
AEN: $80\ \text{N}$

--- hard machines
KA: $100\ \text{კგ}$ ყუთი $1\ \text{მ}$ სიმაღლეზე $5\ \text{მ}$ სიგრძის ფიცრით აიტანეს; ფიცრის სმკ $80\%$-ია. იპოვეთ საჭირო ძალა და ხახუნის ძალა.
EN: A $100\ \text{kg}$ box is raised $1\ \text{m}$ on a $5\ \text{m}$ plank with $80\%$ efficiency. Find the force needed and the friction force.
HKA: ხახუნის ძალა = საჭირო ძალა − ხახუნის გარეშე საჭირო ძალა.
HEN: Friction = force needed − force needed without friction.
SKA: **ფორმულა:** $F = \dfrac{m g h}{\eta l}$, $\ F_0 = \dfrac{m g h}{l}$, $\ F_{\text{ხ}} = F - F_0$
**რიცხვები:** $F = \dfrac{1000}{0{,}8 \cdot 5} = 250\ \text{ნ}$, $\ F_0 = \dfrac{1000}{5} = 200\ \text{ნ}$, $\ F_{\text{ხ}} = 50\ \text{ნ}$
SEN: **Formula:** $F = \dfrac{m g h}{\eta l}$, $\ F_0 = \dfrac{m g h}{l}$, $\ F_{\text{fr}} = F - F_0$
**Numbers:** $F = \dfrac{1000}{0.8 \cdot 5} = 250\ \text{N}$, $\ F_0 = \dfrac{1000}{5} = 200\ \text{N}$, $\ F_{\text{fr}} = 50\ \text{N}$
AKA: $250\ \text{ნ}$; $50\ \text{ნ}$
AEN: $250\ \text{N}$; $50\ \text{N}$

--- hard heatcap
KA: $20\ \text{°C}$ ტემპერატურის $1\ \text{კგ}$ წყალი შეურიეს $80\ \text{°C}$ ტემპერატურის $2\ \text{კგ}$ ზეთს ($c = 2000\ \text{ჯ/(კგ}\cdot\text{°C)}$; სითხეები არ ერევა, მაგრამ სითბოს ცვლიან). იპოვეთ საბოლოო ტემპერატურა.
EN: $1\ \text{kg}$ of water at $20\ \text{°C}$ is put together with $2\ \text{kg}$ of oil at $80\ \text{°C}$ ($c = 2000\ \text{J/(kg}\cdot\text{°C)}$; they don't mix but exchange heat). Find the final temperature.
HKA: სითბური ბალანსი სხვადასხვა $c$-ით.
HEN: Heat balance with different $c$.
SKA: **ფორმულა:** $c_{\text{წ}} m_{\text{წ}} (t - 20) = c_{\text{ზ}} m_{\text{ზ}} (80 - t)$
**რიცხვები:** $4200 (t - 20) = 4000 (80 - t) \Rightarrow 8200\,t = 404\,000 \Rightarrow t \approx 49\ \text{°C}$
SEN: **Formula:** $c_{\text{w}} m_{\text{w}} (t - 20) = c_{\text{oil}} m_{\text{oil}} (80 - t)$
**Numbers:** $4200 (t - 20) = 4000 (80 - t) \Rightarrow 8200\,t = 404\,000 \Rightarrow t \approx 49\ \text{°C}$
AKA: $\approx 49\ \text{°C}$
AEN: $\approx 49\ \text{°C}$

--- hard heatcap
KA: $300\ \text{მ/წმ}$ სიჩქარით მფრინავი ტყვიის ტყვია კედელში ჩაერჭო. მისი კინეტიკური ენერგიის ნახევარი ტყვიის გათბობას მოხმარდა. რამდენი გრადუსით გათბა ტყვია? ($c = 130\ \text{ჯ/(კგ}\cdot\text{°C)}$)
EN: A lead bullet flying at $300\ \text{m/s}$ hits a wall and stops. Half its kinetic energy heats the bullet. By how many degrees does it warm? ($c = 130\ \text{J/(kg}\cdot\text{°C)}$)
HKA: $\dfrac{1}{2} \cdot \dfrac{m v^2}{2} = c m \Delta t$ — მასა შეიკვეცება.
HEN: $\dfrac{1}{2} \cdot \dfrac{m v^2}{2} = c m \Delta t$ — the mass cancels.
SKA: **ფორმულა:** $\Delta t = \dfrac{v^2}{4c}$
**რიცხვები:** $\Delta t = \dfrac{300^2}{4 \cdot 130} = \dfrac{90\,000}{520} \approx 173\ \text{°C}$
SEN: **Formula:** $\Delta t = \dfrac{v^2}{4c}$
**Numbers:** $\Delta t = \dfrac{300^2}{4 \cdot 130} = \dfrac{90\,000}{520} \approx 173\ \text{°C}$
AKA: $\approx 173\ \text{°C}$-ით
AEN: by $\approx 173\ \text{°C}$

--- hard heatcap
KA: $50\ \text{მ}$ სიმაღლის ჩანჩქერიდან წყალი ვარდება. რამდენით მეტი იქნება წყლის ტემპერატურა ძირში, თუ მთელი პოტენციური ენერგია წყლის გათბობას ხმარდება?
EN: Water falls over a $50\ \text{m}$ waterfall. How much warmer is it at the bottom if all its potential energy heats the water?
HKA: $m g h = c m \Delta t$.
HEN: $m g h = c m \Delta t$.
SKA: **ფორმულა:** $\Delta t = \dfrac{g h}{c}$
**რიცხვები:** $\Delta t = \dfrac{10 \cdot 50}{4200} \approx 0{,}12\ \text{°C}$ — ჯოულმა ასეთი გაზომვებით დაადგინა სითბოს მექანიკური ეკვივალენტი.
SEN: **Formula:** $\Delta t = \dfrac{g h}{c}$
**Numbers:** $\Delta t = \dfrac{10 \cdot 50}{4200} \approx 0.12\ \text{°C}$ — Joule used measurements like this to find the mechanical equivalent of heat.
AKA: $\approx 0{,}12\ \text{°C}$
AEN: $\approx 0.12\ \text{°C}$

--- hard melting
KA: $-10\ \text{°C}$ ტემპერატურის $0{,}5\ \text{კგ}$ ყინული ჩადეს $50\ \text{°C}$ ტემპერატურის $1\ \text{კგ}$ წყალში. იპოვეთ საბოლოო ტემპერატურა.
EN: $0.5\ \text{kg}$ of ice at $-10\ \text{°C}$ is placed in $1\ \text{kg}$ of water at $50\ \text{°C}$. Find the final temperature.
HKA: ჯერ შეამოწმეთ, გადნება თუ არა მთელი ყინული.
HEN: First check whether all the ice melts.
SKA: ყინულს სჭირდება: $2100 \cdot 0{,}5 \cdot 10 + 3{,}4 \cdot 10^5 \cdot 0{,}5 = 10\,500 + 170\,000 = 180\,500\ \text{ჯ}$; წყალი $0\ \text{°C}$-მდე გასცემს $210\,000\ \text{ჯ}$ — ყველაფერი დნება.
**ფორმულა:** $c m_{\text{წ}} (50 - t) = 180\,500 + c\,m_{\text{ყ}}\,t$
**რიცხვები:** $210\,000 - 4200\,t = 180\,500 + 2100\,t \Rightarrow 6300\,t = 29\,500 \Rightarrow t \approx 4{,}7\ \text{°C}$
SEN: The ice needs: $2100 \cdot 0.5 \cdot 10 + 3.4 \times 10^5 \cdot 0.5 = 10\,500 + 170\,000 = 180\,500\ \text{J}$; the water gives $210\,000\ \text{J}$ cooling to $0\ \text{°C}$ — everything melts.
**Formula:** $c m_{\text{w}} (50 - t) = 180\,500 + c\,m_{\text{ice}}\,t$
**Numbers:** $210\,000 - 4200\,t = 180\,500 + 2100\,t \Rightarrow 6300\,t = 29\,500 \Rightarrow t \approx 4.7\ \text{°C}$
AKA: $\approx 4{,}7\ \text{°C}$
AEN: $\approx 4.7\ \text{°C}$

--- hard melting
KA: $500\ \text{ვტ}$ სიმძლავრის ღუმელში $27\ \text{°C}$ ტემპერატურის $1\ \text{კგ}$ ტყვია ჩადეს. რა დროში გადნება ის მთლიანად, თუ მთელი ენერგია ტყვიას ხმარდება? (ტყვია: $c = 130\ \text{ჯ/(კგ}\cdot\text{°C)}$, $t_{\text{დნ}} = 327\ \text{°C}$, $\lambda = 2{,}5 \cdot 10^4\ \text{ჯ/კგ}$)
EN: $1\ \text{kg}$ of lead at $27\ \text{°C}$ is put in a $500\ \text{W}$ furnace. How long until it has completely melted, if all the energy goes into the lead? (Lead: $c = 130\ \text{J/(kg}\cdot\text{°C)}$, $t_{\text{melt}} = 327\ \text{°C}$, $\lambda = 2.5 \times 10^4\ \text{J/kg}$)
HKA: $N t = c m \Delta t + \lambda m$.
HEN: $N t = c m \Delta t + \lambda m$.
SKA: **ფორმულა:** $t = \dfrac{c m (t_{\text{დნ}} - t_1) + \lambda m}{N}$
**რიცხვები:** $Q = 130 \cdot 300 + 25\,000 = 39\,000 + 25\,000 = 64\,000\ \text{ჯ}$
$t = \dfrac{64\,000}{500} = 128\ \text{წმ}$
SEN: **Formula:** $t = \dfrac{c m (t_{\text{melt}} - t_1) + \lambda m}{N}$
**Numbers:** $Q = 130 \cdot 300 + 25\,000 = 39\,000 + 25\,000 = 64\,000\ \text{J}$
$t = \dfrac{64\,000}{500} = 128\ \text{s}$
AKA: $128\ \text{წმ}$
AEN: $128\ \text{s}$

--- hard vapor
KA: რატომ არის ორთქლით დამწვრობა უფრო საშიში, ვიდრე იმავე ტემპერატურის მდუღარე წყლით? შეადარეთ სითბო, რომელსაც კანზე გასცემს $10\ \text{გ}$ ორთქლი და $10\ \text{გ}$ მდუღარე წყალი ($100\ \text{°C}$), $37\ \text{°C}$-მდე გაცივებისას.
EN: Why is a steam burn more dangerous than a burn from boiling water at the same temperature? Compare the heat given to the skin by $10\ \text{g}$ of steam and $10\ \text{g}$ of boiling water ($100\ \text{°C}$) cooling to $37\ \text{°C}$.
HKA: ორთქლი ჯერ კონდენსირდება და გასცემს $L m$-ს.
HEN: The steam first condenses, releasing $L m$.
SKA: **ფორმულა:** $Q_{\text{წ}} = c m \Delta t$, $\ Q_{\text{ო}} = L m + c m \Delta t$
**რიცხვები:** $Q_{\text{წ}} = 4200 \cdot 0{,}01 \cdot 63 \approx 2650\ \text{ჯ}$
$Q_{\text{ო}} = 2{,}3 \cdot 10^6 \cdot 0{,}01 + 2650 = 23\,000 + 2650 \approx 25\,650\ \text{ჯ}$ — თითქმის $10$-ჯერ მეტი!
SEN: **Formula:** $Q_{\text{w}} = c m \Delta t$, $\ Q_{\text{s}} = L m + c m \Delta t$
**Numbers:** $Q_{\text{w}} = 4200 \cdot 0.01 \cdot 63 \approx 2650\ \text{J}$
$Q_{\text{s}} = 2.3 \times 10^6 \cdot 0.01 + 2650 = 23\,000 + 2650 \approx 25\,650\ \text{J}$ — almost $10$ times more!
AKA: $\approx 2{,}65\ \text{კჯ}$ და $\approx 25{,}7\ \text{კჯ}$
AEN: $\approx 2.65\ \text{kJ}$ and $\approx 25.7\ \text{kJ}$

--- hard fuel
KA: რამდენი ქვანახშირი ($q = 3 \cdot 10^7\ \text{ჯ/კგ}$) დასჭირდება $20\ \text{°C}$ ტემპერატურის $1\ \text{ტ}$ რკინის ჯართის გადასადნობად, თუ ღუმელის სმკ $30\%$-ია? (რკინა: $c = 460\ \text{ჯ/(კგ}\cdot\text{°C)}$, $t_{\text{დნ}} = 1539\ \text{°C}$, $\lambda = 2{,}7 \cdot 10^5\ \text{ჯ/კგ}$)
EN: How much coal ($q = 3 \times 10^7\ \text{J/kg}$) is needed to melt $1\ \text{t}$ of iron scrap at $20\ \text{°C}$ in a furnace with $30\%$ efficiency? (Iron: $c = 460\ \text{J/(kg}\cdot\text{°C)}$, $t_{\text{melt}} = 1539\ \text{°C}$, $\lambda = 2.7 \times 10^5\ \text{J/kg}$)
HKA: $\eta q m_{\text{ქ}} = c m \Delta t + \lambda m$.
HEN: $\eta q m_{\text{c}} = c m \Delta t + \lambda m$.
SKA: **ფორმულა:** $m_{\text{ქ}} = \dfrac{m(c\,\Delta t + \lambda)}{\eta\,q}$
**რიცხვები:** $Q = 1000 \cdot (460 \cdot 1519 + 2{,}7 \cdot 10^5) \approx 1000 \cdot (6{,}99 + 2{,}7) \cdot 10^5 \approx 9{,}7 \cdot 10^8\ \text{ჯ}$
$m_{\text{ქ}} = \dfrac{9{,}7 \cdot 10^8}{0{,}3 \cdot 3 \cdot 10^7} \approx 108\ \text{კგ}$
SEN: **Formula:** $m_{\text{c}} = \dfrac{m(c\,\Delta t + \lambda)}{\eta\,q}$
**Numbers:** $Q = 1000 \cdot (460 \cdot 1519 + 2.7 \times 10^5) \approx 1000 \cdot (6.99 + 2.7) \times 10^5 \approx 9.7 \times 10^8\ \text{J}$
$m_{\text{c}} = \dfrac{9.7 \times 10^8}{0.3 \cdot 3 \times 10^7} \approx 108\ \text{kg}$
AKA: $\approx 108\ \text{კგ}$
AEN: $\approx 108\ \text{kg}$

--- hard expansion
KA: $50\ \text{ლ}$ ავზი პირამდე შეავსეს ბენზინით $10\ \text{°C}$-ზე და მზეზე დატოვეს, სადაც ბენზინი $30\ \text{°C}$-მდე გათბა. რამდენი ბენზინი გადმოიღვრება? (ბენზინის მოცულობითი გაფართოების კოეფიციენტი $\beta = 10^{-3}\ \text{1/°C}$; ავზის გაფართოება უგულებელყავით.)
EN: A $50\ \text{L}$ tank is filled to the brim with petrol at $10\ \text{°C}$ and left in the sun, where the petrol warms to $30\ \text{°C}$. How much spills? (Petrol's volume expansion coefficient $\beta = 10^{-3}\ \text{1/°C}$; ignore the tank's expansion.)
HKA: მოცულობითი გაფართოება: $\Delta V = \beta V_0 \Delta t$.
HEN: Volume expansion: $\Delta V = \beta V_0 \Delta t$.
SKA: **ფორმულა:** $\Delta V = \beta\,V_0\,\Delta t$
**რიცხვები:** $\Delta V = 10^{-3} \cdot 50 \cdot 20 = 1\ \text{ლ}$ — ამიტომ ავზს ბოლომდე არ ავსებენ.
SEN: **Formula:** $\Delta V = \beta\,V_0\,\Delta t$
**Numbers:** $\Delta V = 10^{-3} \cdot 50 \cdot 20 = 1\ \text{L}$ — that's why tanks aren't filled to the brim.
AKA: $1\ \text{ლ}$
AEN: $1\ \text{L}$

--- hard engines
KA: იდეალური თბოძრავის სმკ დამოკიდებულია მხოლოდ გამათბობლისა და მაცივრის აბსოლუტურ ტემპერატურებზე: $\eta_{\max} = 1 - \dfrac{T_2}{T_1}$. იპოვეთ მაქსიმალური სმკ, თუ გამათბობლის ტემპერატურაა $527\ \text{°C}$, მაცივრისა — $27\ \text{°C}$.
EN: The efficiency of an ideal heat engine depends only on the absolute temperatures of the hot source and cold sink: $\eta_{\max} = 1 - \dfrac{T_2}{T_1}$. Find the maximum efficiency for a hot source at $527\ \text{°C}$ and a cold sink at $27\ \text{°C}$.
HKA: $T = t + 273$.
HEN: $T = t + 273$.
SKA: **ფორმულა:** $\eta_{\max} = 1 - \dfrac{T_2}{T_1}$
**რიცხვები:** $T_1 = 800\ \text{კ}$, $\ T_2 = 300\ \text{კ}$, $\ \eta_{\max} = 1 - \dfrac{300}{800} = 0{,}625 = 62{,}5\%$
რეალური ძრავები ამაზე ბევრად ნაკლებს იძლევა (ხახუნი, დანაკარგები).
SEN: **Formula:** $\eta_{\max} = 1 - \dfrac{T_2}{T_1}$
**Numbers:** $T_1 = 800\ \text{K}$, $\ T_2 = 300\ \text{K}$, $\ \eta_{\max} = 1 - \dfrac{300}{800} = 0.625 = 62.5\%$
Real engines give much less (friction, losses).
AKA: $62{,}5\%$
AEN: $62.5\%$

--- hard energy olympiad
KA: შეაფასეთ, რა სიმაღლეზე შეუძლია ახტეს ჭოკით მხტომელს, თუ ის ჭოკთან $10\ \text{მ/წმ}$ სიჩქარით მირბის, ხოლო მისი მასათა ცენტრი სირბილისას $1\ \text{მ}$ სიმაღლეზეა. (ჩათვალეთ, რომ კინეტიკური ენერგია მთლიანად პოტენციურში გადადის.) შეადარეთ მსოფლიო რეკორდს ($\approx 6{,}2\ \text{მ}$).
EN: Estimate how high a pole-vaulter can jump if they run at the pole at $10\ \text{m/s}$ with their centre of mass $1\ \text{m}$ above the ground. (Assume all the kinetic energy becomes potential energy.) Compare with the world record ($\approx 6.2\ \text{m}$).
HKA: ჭოკი მხოლოდ „გარდამქმნელია“: $\dfrac{m v^2}{2} \to m g \Delta h$.
HEN: The pole is only a "converter": $\dfrac{m v^2}{2} \to m g \Delta h$.
SKA: **ფორმულა:** $\Delta h = \dfrac{v^2}{2 g}$, $\ H = h_0 + \Delta h$
**რიცხვები:** $\Delta h = \dfrac{100}{20} = 5\ \text{მ}$, $\ H \approx 1 + 5 = 6\ \text{მ}$
შეფასება კარგად ემთხვევა რეკორდს — დამატებით სპორტსმენი ჭოკს ხელებით „ეწევა“.
SEN: **Formula:** $\Delta h = \dfrac{v^2}{2 g}$, $\ H = h_0 + \Delta h$
**Numbers:** $\Delta h = \dfrac{100}{20} = 5\ \text{m}$, $\ H \approx 1 + 5 = 6\ \text{m}$
The estimate matches the record well — the athlete also pushes up on the pole with their arms.
AKA: $\approx 6\ \text{მ}$
AEN: $\approx 6\ \text{m}$

--- hard machines olympiad
KA: არქიმედე ამბობდა: „მომეცით საყრდენი წერტილი და დედამიწას გადავაბრუნებ“. დავუშვათ, მას შეუძლია $600\ \text{ნ}$ ძალით აწვეს ბერკეტს. რა შეფარდება უნდა ჰქონდეს ბერკეტის მხრებს $6 \cdot 10^{24}\ \text{კგ}$ მასის „ტვირთის“ ასაწევად ($g = 10\ \text{ნ/კგ}$, თითქოს დედამიწა სხვა პლანეტაზე იწონება)? რა მანძილზე უნდა ჩაწიოს მან ბერკეტის ბოლო, რომ დედამიწა $1\ \text{სმ}$-ით აწიოს?
EN: Archimedes said: "Give me a place to stand and I will move the Earth." Suppose he can push a lever with $600\ \text{N}$. What arm ratio is needed to lift a "load" of $6 \times 10^{24}\ \text{kg}$ ($g = 10\ \text{N/kg}$, as if weighing the Earth on another planet)? How far must he push the end down to lift the Earth by $1\ \text{cm}$?
HKA: ოქროს წესი: მანძილში იმდენჯერ ვაგებთ, რამდენჯერაც ძალაში ვიგებთ.
HEN: Golden rule: you lose in distance exactly what you gain in force.
SKA: **ფორმულა:** $\dfrac{l_2}{l_1} = \dfrac{M g}{F}$, $\ s = h\dfrac{l_2}{l_1}$
**რიცხვები:** $\dfrac{l_2}{l_1} = \dfrac{6 \cdot 10^{25}}{600} = 10^{23}$
$s = 0{,}01 \cdot 10^{23} = 10^{21}\ \text{მ}$ — ეს $\approx 100\,000$ სინათლის წელია, ჩვენი გალაქტიკის ზომა! $1\ \text{მ/წმ}$ სიჩქარით ამას ტრილიონობით წელი დასჭირდებოდა.
SEN: **Formula:** $\dfrac{l_2}{l_1} = \dfrac{M g}{F}$, $\ s = h\dfrac{l_2}{l_1}$
**Numbers:** $\dfrac{l_2}{l_1} = \dfrac{6 \times 10^{25}}{600} = 10^{23}$
$s = 0.01 \cdot 10^{23} = 10^{21}\ \text{m}$ — that's $\approx 100\,000$ light-years, the size of our galaxy! At $1\ \text{m/s}$ it would take trillions of years.
AKA: $10^{23} : 1$; $10^{21}\ \text{მ}$
AEN: $10^{23} : 1$; $10^{21}\ \text{m}$

--- hard heatcap olympiad
KA: ორი ერთნაირი გამაცხელებელი ერთნაირ მასის წყალსა და უცნობ სითხეს ათბობს. წყალი $4$ წუთში $10\ \text{°C}$-ით გათბა, სითხე კი $3$ წუთში — $20\ \text{°C}$-ით. იპოვეთ სითხის ხვედრითი სითბოტევადობა.
EN: Two identical heaters warm equal masses of water and an unknown liquid. The water warms by $10\ \text{°C}$ in $4$ minutes, the liquid by $20\ \text{°C}$ in $3$ minutes. Find the liquid's specific heat capacity.
HKA: მიღებული სითბო დროის პროპორციულია: $Q \sim t$.
HEN: The heat received is proportional to the time: $Q \propto t$.
SKA: **ფორმულა:** $c_{\text{წ}} m\,\Delta t_{\text{წ}} = P\,\tau_{\text{წ}}$, $\ c_{\text{x}} m\,\Delta t_{\text{x}} = P\,\tau_{\text{x}}$ $\Rightarrow c_{\text{x}} = c_{\text{წ}} \dfrac{\Delta t_{\text{წ}}}{\Delta t_{\text{x}}} \cdot \dfrac{\tau_{\text{x}}}{\tau_{\text{წ}}}$
**რიცხვები:** $c_{\text{x}} = 4200 \cdot \dfrac{10}{20} \cdot \dfrac{3}{4} = 1575\ \text{ჯ/(კგ}\cdot\text{°C)}$
SEN: **Formula:** $c_{\text{w}} m\,\Delta t_{\text{w}} = P\,\tau_{\text{w}}$, $\ c_{\text{x}} m\,\Delta t_{\text{x}} = P\,\tau_{\text{x}}$ $\Rightarrow c_{\text{x}} = c_{\text{w}} \dfrac{\Delta t_{\text{w}}}{\Delta t_{\text{x}}} \cdot \dfrac{\tau_{\text{x}}}{\tau_{\text{w}}}$
**Numbers:** $c_{\text{x}} = 4200 \cdot \dfrac{10}{20} \cdot \dfrac{3}{4} = 1575\ \text{J/(kg}\cdot\text{°C)}$
AKA: $1575\ \text{ჯ/(კგ}\cdot\text{°C)}$
AEN: $1575\ \text{J/(kg}\cdot\text{°C)}$

--- hard melting olympiad
KA: $80\ \text{°C}$ ტემპერატურის $200\ \text{გ}$ ჩაიში $0\ \text{°C}$ ტემპერატურის $20\ \text{გ}$ ყინულის კუბი ჩააგდეს. იპოვეთ საბოლოო ტემპერატურა. ჩაის მიერ გაცემული სითბოს რა ნაწილი მოხმარდა თვით დნობას და რა ნაწილი — ნადნობი წყლის გათბობას?
EN: A $20\ \text{g}$ ice cube at $0\ \text{°C}$ is dropped into $200\ \text{g}$ of tea at $80\ \text{°C}$. Find the final temperature. What share of the heat given by the tea went into melting itself, and what share into warming the meltwater?
HKA: ჩაი = წყალი. სითბური ბალანსი: $c M (80 - t) = \lambda m + c m t$.
HEN: Tea = water. Heat balance: $c M (80 - t) = \lambda m + c m t$.
SKA: **ფორმულა:** $c M (80 - t) = \lambda m + c m t \Rightarrow t = \dfrac{80 c M - \lambda m}{c (M + m)}$
**რიცხვები:** $t = \dfrac{67\,200 - 6800}{4200 \cdot 0{,}22} = \dfrac{60\,400}{924} \approx 65{,}4\ \text{°C}$
დნობა: $6800\ \text{ჯ}$; ნადნობის გათბობა: $84 \cdot 65{,}4 \approx 5490\ \text{ჯ}$ — დნობას ოდნავ მეტი მოხმარდა ($\approx 55\%$), თუმცა ყინულის მასა ჩაისაზე $10$-ჯერ ნაკლებია.
SEN: **Formula:** $c M (80 - t) = \lambda m + c m t \Rightarrow t = \dfrac{80 c M - \lambda m}{c (M + m)}$
**Numbers:** $t = \dfrac{67\,200 - 6800}{4200 \cdot 0.22} = \dfrac{60\,400}{924} \approx 65.4\ \text{°C}$
Melting: $6800\ \text{J}$; warming the meltwater: $84 \cdot 65.4 \approx 5490\ \text{J}$ — melting took slightly more ($\approx 55\%$), even though the ice has a tenth of the tea's mass.
AKA: $\approx 65\ \text{°C}$; $\approx 55\%$ დნობას
AEN: $\approx 65\ \text{°C}$; $\approx 55\%$ to melting

--- hard engines olympiad
KA: მაცივარი წამში $300\ \text{ჯ}$ სითბოს იღებს შიგნიდან და ამისთვის $100\ \text{ვტ}$ ელექტროსიმძლავრეს მოიხმარს. გაცივდება თუ გათბება სამზარეულო, თუ მაცივრის კარს ღიად დავტოვებთ? რა სიმძლავრით?
EN: A fridge removes $300\ \text{J}$ of heat per second from inside and uses $100\ \text{W}$ of electrical power to do it. Will the kitchen cool down or warm up if we leave the fridge door open? At what rate?
HKA: მაცივარი სითბოს გარეთ, ოთახში „გადასტუმბავს“ — და დამატებით ოთახს აძლევს მოხმარებულ ელექტროენერგიასაც.
HEN: The fridge "pumps" heat out into the room — and also gives the room the electrical energy it uses.
SKA: **ფორმულა:** ოთახს ეძლევა $Q_1 = Q_2 + A$, ოთახიდან იღება $Q_2$ (ღია კარიდან).
**რიცხვები:** $Q_1 = 300 + 100 = 400\ \text{ვტ}$ გამოიყოფა უკნიდან, $300\ \text{ვტ}$ იღება ოთახიდან.
ბალანსი: $400 - 300 = +100\ \text{ვტ}$ — სამზარეულო **გათბება**, $100\ \text{ვტ}$ სიმძლავრით (ენერგიის შენახვის კანონი).
SEN: **Formula:** the room receives $Q_1 = Q_2 + A$ and loses $Q_2$ (through the open door).
**Numbers:** $Q_1 = 300 + 100 = 400\ \text{W}$ is released at the back, $300\ \text{W}$ is drawn from the room.
Balance: $400 - 300 = +100\ \text{W}$ — the kitchen **warms up**, at $100\ \text{W}$ (conservation of energy).
AKA: გათბება, $100\ \text{ვტ}$
AEN: it warms up, at $100\ \text{W}$

--- easy work
KA: ასრულებს თუ არა მუშაობას: ა) ადამიანი, რომელიც კედელს აწვება; ბ) ამწე, რომელიც ტვირთს წევს; გ) სიმძიმის ძალა, როცა ვაშლი ხიდან ვარდება?
EN: Is work done: a) by a person pushing on a wall; b) by a crane lifting a load; c) by gravity when an apple falls from a tree?
HKA: მუშაობა სრულდება, როცა სხეული ძალის მიმართულებით გადაადგილდება.
HEN: Work is done when the body moves in the direction of the force.
SKA: ა) არა — კედელი არ გადაადგილდება.
ბ) კი — ტვირთი ძალის მიმართულებით (ზემოთ) მოძრაობს.
გ) კი — ვაშლი სიმძიმის ძალის მიმართულებით (ქვემოთ) მოძრაობს.
SEN: a) no — the wall doesn't move.
b) yes — the load moves in the direction of the force (up).
c) yes — the apple moves in the direction of gravity (down).
AKA: ა) არა; ბ) კი; გ) კი
AEN: a) no; b) yes; c) yes
