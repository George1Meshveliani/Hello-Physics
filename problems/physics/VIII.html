AEN: $100\ \text{J}$

--- easy work
KA: გამოსახეთ $1\ \text{კვტ·სთ}$ მეგაჯოულებში. რამდენი კვტ·სთ დაიხარჯება, თუ $2\ \text{კვტ}$ ღუმელი $3$ საათს იმუშავებს?
EN: Express $1\ \text{kWh}$ in megajoules. How many kWh does a $2\ \text{kW}$ heater use in $3$ hours?
HKA: $1\ \text{კვტ·სთ} = 1000\ \text{ვტ} \cdot 3600\ \text{წმ}$.
HEN: $1\ \text{kWh} = 1000\ \text{W} \cdot 3600\ \text{s}$.
SKA: $1\ \text{კვტ·სთ} = 3{,}6 \times 10^6\ \text{ჯ} = 3{,}6\ \text{მჯ}$
$A = 2 \cdot 3 = 6\ \text{კვტ·სთ}$
SEN: $1\ \text{kWh} = 3.6 \times 10^6\ \text{J} = 3.6\ \text{MJ}$
$W = 2 \cdot 3 = 6\ \text{kWh}$
AKA: $3{,}6\ \text{მჯ}$; $6\ \text{კვტ·სთ}$
AEN: $3.6\ \text{MJ}$; $6\ \text{kWh}$

--- easy work
KA: ამწე $300\ \text{კგ}$ ტვირთს $10\ \text{მ}$-ზე $20\ \text{წმ}$-ში თანაბრად სწევს. იპოვეთ ამწის სიმძლავრე.
EN: A crane lifts a $300\ \text{kg}$ load $10\ \text{m}$ uniformly in $20\ \text{s}$. Find the crane's power.
HKA: ჯერ მუშაობა, შემდეგ სიმძლავრე.
HEN: First the work, then the power.
SKA: $A = 3000 \cdot 10 = 30\,000\ \text{ჯ}$
$N = \dfrac{30\,000}{20} = 1500\ \text{ვტ}$
SEN: $W = 3000 \cdot 10 = 30\,000\ \text{J}$
$P = \dfrac{30\,000}{20} = 1500\ \text{W}$
AKA: $1{,}5\ \text{კვტ}$
AEN: $1.5\ \text{kW}$

--- easy work
KA: რატომ არ ასრულებს მუშაობას სიმძიმის ძალა, როცა მანქანა ჰორიზონტალურ გზაზე მოძრაობს?
EN: Why does gravity do no work on a car driving along a horizontal road?
HKA: შეადარეთ ძალისა და გადაადგილების მიმართულებები.
HEN: Compare the directions of the force and the displacement.
SKA: სიმძიმის ძალა ვერტიკალურია, გადაადგილება კი ჰორიზონტალური — ისინი ერთმანეთის პერპენდიკულარულია, ამიტომ $A = 0$.
SEN: Gravity is vertical while the displacement is horizontal — they are perpendicular, so $W = 0$.
AKA: ძალა გადაადგილების პერპენდიკულარულია
AEN: the force is perpendicular to the displacement

--- easy work
KA: რა მუშაობას ასრულებს ხახუნის ძალა ($20\ \text{ნ}$), როცა ყუთი $3\ \text{მ}$-ზე სრიალებს?
EN: How much work does a $20\ \text{N}$ friction force do while a box slides $3\ \text{m}$?
HKA: ხახუნი მოძრაობის საწინააღმდეგოდაა მიმართული — მუშაობა უარყოფითია.
HEN: Friction opposes motion — its work is negative.
SKA: $A = -F s = -20 \cdot 3 = -60\ \text{ჯ}$
SEN: $W = -F s = -20 \cdot 3 = -60\ \text{J}$
AKA: $-60\ \text{ჯ}$
AEN: $-60\ \text{J}$

--- easy work
KA: ადამიანის გული ყოველ დარტყმაზე დაახლოებით $1\ \text{ჯ}$ მუშაობას ასრულებს და წუთში $72$-ჯერ სცემს. შეაფასეთ გულის სიმძლავრე.
EN: The human heart does about $1\ \text{J}$ of work per beat and beats $72$ times a minute. Estimate the heart's power.
HKA: $N = \dfrac{A}{t}$, $t = 60\ \text{წმ}$.
HEN: $P = \dfrac{W}{t}$, $t = 60\ \text{s}$.
SKA: $N = \dfrac{72 \cdot 1}{60} = 1{,}2\ \text{ვტ}$
SEN: $P = \dfrac{72 \cdot 1}{60} = 1.2\ \text{W}$
AKA: $\approx 1{,}2\ \text{ვტ}$
AEN: $\approx 1.2\ \text{W}$

--- medium work
KA: $8\ \text{მ}^3$ წყალი $6\ \text{მ}$ სიღრმის ჭიდან ამოიტუმბა. რა მუშაობა შეასრულა ტუმბომ?
EN: $8\ \text{m}^3$ of water is pumped out of a well $6\ \text{m}$ deep. How much work does the pump do?
HKA: $m = \rho V$, $A = m g h$.
HEN: $m = \rho V$, $W = m g h$.
SKA: $m = 1000 \cdot 8 = 8000\ \text{კგ}$
$A = 8000 \cdot 10 \cdot 6 = 480\,000\ \text{ჯ} = 480\ \text{კჯ}$
SEN: $m = 1000 \cdot 8 = 8000\ \text{kg}$
$W = 8000 \cdot 10 \cdot 6 = 480\,000\ \text{J} = 480\ \text{kJ}$
AKA: $480\ \text{კჯ}$
AEN: $480\ \text{kJ}$

--- medium work
KA: მანქანა $90\ \text{კმ/სთ}$-ით თანაბრად მოძრაობს, წინაღობის ძალაა $1{,}2\ \text{კნ}$. რა სიმძლავრეს ავითარებს ძრავა? რა მუშაობას შეასრულებს $10$ წუთში?
EN: A car moves uniformly at $90\ \text{km/h}$ against a resistance of $1.2\ \text{kN}$. What power does the engine develop? How much work does it do in $10$ minutes?
HKA: $N = F v$, $v = 25\ \text{მ/წმ}$.
HEN: $P = F v$, $v = 25\ \text{m/s}$.
SKA: $N = 1200 \cdot 25 = 30\,000\ \text{ვტ} = 30\ \text{კვტ}$
$A = 30\,000 \cdot 600 = 1{,}8 \times 10^7\ \text{ჯ} = 18\ \text{მჯ}$
SEN: $P = 1200 \cdot 25 = 30\,000\ \text{W} = 30\ \text{kW}$
$W = 30\,000 \cdot 600 = 1.8 \times 10^7\ \text{J} = 18\ \text{MJ}$
AKA: $30\ \text{კვტ}$; $18\ \text{მჯ}$
AEN: $30\ \text{kW}$; $18\ \text{MJ}$

--- medium work
KA: მოტორიან ნავს $5\ \text{კვტ}$ სიმძლავრე აქვს და $10\ \text{მ/წმ}$-ით მოძრაობს. რას უდრის წყლის წინაღობის ძალა?
EN: A motorboat has $5\ \text{kW}$ of power and moves at $10\ \text{m/s}$. What is the water's resistance force?
HKA: თანაბარი მოძრაობისას წევის ძალა წინაღობის ტოლია: $F = \dfrac{N}{v}$.
HEN: At constant speed the thrust equals the resistance: $F = \dfrac{P}{v}$.
SKA: $F = \dfrac{5000}{10} = 500\ \text{ნ}$
SEN: $F = \dfrac{5000}{10} = 500\ \text{N}$
AKA: $500\ \text{ნ}$
AEN: $500\ \text{N}$

--- medium work
KA: ადამიანი ($70\ \text{კგ}$) $15$-სართულიანი სახლის ($3\ \text{მ}$ სართული) ბოლო სართულზე $5$ წუთში ავიდა. რა საშუალო სიმძლავრე განავითარა?
EN: A $70\ \text{kg}$ person climbs to the top of a 15-storey building ($3\ \text{m}$ per storey, from the ground floor up $14$ storeys) in $5$ minutes. What average power do they develop?
HKA: ასვლის სიმაღლე: $14 \cdot 3\ \text{მ}$.
HEN: Height climbed: $14 \cdot 3\ \text{m}$.
SKA: $h = 42\ \text{მ}$, $\ A = 700 \cdot 42 = 29\,400\ \text{ჯ}$
$N = \dfrac{29\,400}{300} = 98\ \text{ვტ}$
SEN: $h = 42\ \text{m}$, $\ W = 700 \cdot 42 = 29\,400\ \text{J}$
$P = \dfrac{29\,400}{300} = 98\ \text{W}$
AKA: $\approx 98\ \text{ვტ}$
AEN: $\approx 98\ \text{W}$

--- medium work
KA: ესკალატორი $60$ ადამიანს ($70\ \text{კგ}$ თითო) წუთში $8\ \text{მ}$ სიმაღლეზე ასწევს. რა სიმძლავრეა საჭირო მხოლოდ ადამიანების ასაწევად?
EN: An escalator lifts $60$ people ($70\ \text{kg}$ each) per minute to a height of $8\ \text{m}$. What power is needed just to lift the people?
HKA: $N = \dfrac{n m g h}{t}$.
HEN: $P = \dfrac{n m g h}{t}$.
SKA: $A = 60 \cdot 700 \cdot 8 = 336\,000\ \text{ჯ}$
$N = \dfrac{336\,000}{60} = 5600\ \text{ვტ} = 5{,}6\ \text{კვტ}$
SEN: $W = 60 \cdot 700 \cdot 8 = 336\,000\ \text{J}$
$P = \dfrac{336\,000}{60} = 5600\ \text{W} = 5.6\ \text{kW}$
AKA: $5{,}6\ \text{კვტ}$
AEN: $5.6\ \text{kW}$

--- medium work
KA: $2\ \text{კგ}$ წიგნი იატაკიდან $1\ \text{მ}$ სიმაღლის თაროზე აიღეს, შემდეგ კი ჰორიზონტალურად $3\ \text{მ}$-ით თანაბრად გადაიტანეს და სხვა იმავე სიმაღლის თაროზე დადეს. რა მუშაობა შესრულდა სიმძიმის ძალის საწინააღმდეგოდ?
EN: A $2\ \text{kg}$ book is lifted from the floor onto a $1\ \text{m}$ shelf, then carried uniformly $3\ \text{m}$ horizontally to another shelf at the same height. How much work was done against gravity?
HKA: სიმძიმის ძალის საწინააღმდეგო მუშაობა მხოლოდ სიმაღლის ცვლილებაზეა დამოკიდებული.
HEN: Work against gravity depends only on the change in height.
SKA: $A = m g h = 2 \cdot 10 \cdot 1 = 20\ \text{ჯ}$ — ჰორიზონტალურ გადატანაზე სიმძიმის ძალის საწინააღმდეგო მუშაობა არ სრულდება.
SEN: $W = m g h = 2 \cdot 10 \cdot 1 = 20\ \text{J}$ — no work against gravity is done on the horizontal part.
AKA: $20\ \text{ჯ}$
AEN: $20\ \text{J}$

--- medium work
KA: ტრაქტორი $15\ \text{კვტ}$ სიმძლავრით გუთანს $3{,}6\ \text{კმ/სთ}$-ით ეწევა. რა ძალით ეწევა?
EN: A $15\ \text{kW}$ tractor pulls a plough at $3.6\ \text{km/h}$. What is the pulling force?
HKA: $F = \dfrac{N}{v}$, $v = 1\ \text{მ/წმ}$.
HEN: $F = \dfrac{P}{v}$, $v = 1\ \text{m/s}$.
SKA: $F = \dfrac{15\,000}{1} = 15\,000\ \text{ნ} = 15\ \text{კნ}$
SEN: $F = \dfrac{15\,000}{1} = 15\,000\ \text{N} = 15\ \text{kN}$
AKA: $15\ \text{კნ}$
AEN: $15\ \text{kN}$

--- medium work
KA: ზამბარას ($k = 500\ \text{ნ/მ}$) $4\ \text{სმ}$-ით ჭიმავენ. რა მუშაობაა საჭირო? (დრეკადობის ძალა იზრდება $0$-დან $kx$-მდე)
EN: A spring ($k = 500\ \text{N/m}$) is stretched by $4\ \text{cm}$. How much work is needed? (The elastic force grows from $0$ to $kx$.)
HKA: საშუალო ძალა $\dfrac{kx}{2}$-ია, ე.ი. $A = \dfrac{k x^2}{2}$.
HEN: The average force is $\dfrac{kx}{2}$, so $W = \dfrac{k x^2}{2}$.
SKA: $A = \dfrac{500 \cdot 0{,}04^2}{2} = \dfrac{500 \cdot 0{,}0016}{2} = 0{,}4\ \text{ჯ}$
SEN: $W = \dfrac{500 \cdot 0.04^2}{2} = \dfrac{500 \cdot 0.0016}{2} = 0.4\ \text{J}$
AKA: $0{,}4\ \text{ჯ}$
AEN: $0.4\ \text{J}$

--- medium work
KA: ელექტრომატარებლის ძრავების სიმძლავრეა $3\ \text{მვტ}$, წევის ძალა — $150\ \text{კნ}$. რა სიჩქარით მოძრაობს მატარებელი?
EN: An electric train's motors have $3\ \text{MW}$ of power and a pulling force of $150\ \text{kN}$. How fast does it move?
HKA: $v = \dfrac{N}{F}$.
HEN: $v = \dfrac{P}{F}$.
SKA: $v = \dfrac{3 \times 10^6}{1{,}5 \times 10^5} = 20\ \text{მ/წმ} = 72\ \text{კმ/სთ}$
SEN: $v = \dfrac{3 \times 10^6}{1.5 \times 10^5} = 20\ \text{m/s} = 72\ \text{km/h}$
AKA: $72\ \text{კმ/სთ}$
AEN: $72\ \text{km/h}$

--- medium work
KA: ორ ქალაქს შორის $120\ \text{კმ}$-ია. მანქანის წევის ძალაა $800\ \text{ნ}$. რა მუშაობას ასრულებს ძრავა ამ გზაზე? რას უდრის სიმძლავრე, თუ გზას $1{,}5\ \text{სთ}$-ში გადის?
EN: Two towns are $120\ \text{km}$ apart. A car's driving force is $800\ \text{N}$. How much work does the engine do over the trip? What is its power if the trip takes $1.5\ \text{h}$?
HKA: $A = F s$, $N = \dfrac{A}{t}$.
HEN: $W = F s$, $P = \dfrac{W}{t}$.
SKA: $A = 800 \cdot 120\,000 = 9{,}6 \times 10^7\ \text{ჯ}$
$N = \dfrac{9{,}6 \times 10^7}{5400} \approx 17{,}8\ \text{კვტ}$
SEN: $W = 800 \cdot 120\,000 = 9.6 \times 10^7\ \text{J}$
$P = \dfrac{9.6 \times 10^7}{5400} \approx 17.8\ \text{kW}$
AKA: $96\ \text{მჯ}$; $\approx 17{,}8\ \text{კვტ}$
AEN: $96\ \text{MJ}$; $\approx 17.8\ \text{kW}$

--- medium work
KA: შენობის მშენებლობისას $20\ \text{მ}^3$ ბეტონი ($2400\ \text{კგ/მ}^3$) $15\ \text{მ}$ სიმაღლეზე აიტანეს. რამდენ ხანს მოანდომებს ამას $6\ \text{კვტ}$ სიმძლავრის ამწე?
EN: During construction $20\ \text{m}^3$ of concrete ($2400\ \text{kg/m}^3$) must be raised $15\ \text{m}$. How long does a $6\ \text{kW}$ crane need?
HKA: $t = \dfrac{\rho V g h}{N}$.
HEN: $t = \dfrac{\rho V g h}{P}$.
SKA: $A = 2400 \cdot 20 \cdot 10 \cdot 15 = 7{,}2 \times 10^6\ \text{ჯ}$
$t = \dfrac{7{,}2 \times 10^6}{6000} = 1200\ \text{წმ} = 20\ \text{წთ}$
SEN: $W = 2400 \cdot 20 \cdot 10 \cdot 15 = 7.2 \times 10^6\ \text{J}$
$t = \dfrac{7.2 \times 10^6}{6000} = 1200\ \text{s} = 20\ \text{min}$
AKA: $20\ \text{წთ}$
AEN: $20\ \text{min}$

--- medium work
KA: ორი მანქანა ერთნაირი სიმძლავრით მოძრაობს. პირველის სიჩქარე $2$-ჯერ მეტია. როგორ შეეფარდება ერთმანეთს მათი წევის ძალები?
EN: Two cars develop the same power. The first moves twice as fast. How do their driving forces compare?
HKA: $N = F v$ — მუდმივი $N$-ისას $F \sim \dfrac{1}{v}$.
HEN: $P = F v$ — at constant $P$, $F \sim \dfrac{1}{v}$.
SKA: $F_1 v_1 = F_2 v_2$, $v_1 = 2v_2 \Rightarrow F_1 = \dfrac{F_2}{2}$
პირველის წევის ძალა $2$-ჯერ ნაკლებია.
SEN: $F_1 v_1 = F_2 v_2$, $v_1 = 2v_2 \Rightarrow F_1 = \dfrac{F_2}{2}$
The first car's driving force is half as big.
AKA: პირველისა $2$-ჯერ ნაკლებია
AEN: the first one's is half as big

--- hard work
KA: $10\ \text{მ}$ სიგრძისა და $20\ \text{კგ}$ მასის ერთგვაროვანი ჯაჭვი მიწაზე დევს. რა მინიმალური მუშაობაა საჭირო მის ვერტიკალურად ასაყენებლად (ერთი ბოლოთი ასაწევად)?
EN: A uniform chain $10\ \text{m}$ long with mass $20\ \text{kg}$ lies on the ground. What minimum work is needed to lift it by one end until it hangs vertically?
HKA: ჯაჭვის მასათა ცენტრი $\dfrac{l}{2}$ სიმაღლეზე აიწევს.
HEN: The chain's centre of mass rises to $\dfrac{l}{2}$.
SKA: $A = m g \dfrac{l}{2} = 20 \cdot 10 \cdot 5 = 1000\ \text{ჯ}$
SEN: $W = m g \dfrac{l}{2} = 20 \cdot 10 \cdot 5 = 1000\ \text{J}$
AKA: $1\ \text{კჯ}$
AEN: $1\ \text{kJ}$

--- hard work
KA: ავზი ($2 \times 1 \times 1\ \text{მ}$) წყლითაა სავსე და მიწაზე დგას. რა მუშაობაა საჭირო მთელი წყლის ამოსატუმბად ავზის ზედა კიდემდე?
EN: A tank ($2 \times 1 \times 1\ \text{m}$, $1\ \text{m}$ high) full of water stands on the ground. How much work is needed to pump all the water out over the top edge?
HKA: წყლის მასათა ცენტრი $0{,}5\ \text{მ}$-ით უნდა აიწიოს.
HEN: The water's centre of mass must be raised by $0.5\ \text{m}$.
SKA: $m = 1000 \cdot 2 = 2000\ \text{კგ}$
$A = 2000 \cdot 10 \cdot 0{,}5 = 10\,000\ \text{ჯ}$
SEN: $m = 1000 \cdot 2 = 2000\ \text{kg}$
$W = 2000 \cdot 10 \cdot 0.5 = 10\,000\ \text{J}$
AKA: $10\ \text{კჯ}$
AEN: $10\ \text{kJ}$

--- hard work
KA: მანქანა ($1\ \text{ტ}$) თანაბრად ადის $1$ კმ სიგრძის აღმართზე, რომელიც $50\ \text{მ}$-ით მაღლდება. ხახუნის ძალა $500\ \text{ნ}$-ია. იპოვეთ ძრავის მუშაობა და სიმძლავრე $36\ \text{კმ/სთ}$ სიჩქარისას.
EN: A $1\ \text{t}$ car drives uniformly up a $1\ \text{km}$ slope that rises $50\ \text{m}$. Friction is $500\ \text{N}$. Find the engine's work and power at $36\ \text{km/h}$.
HKA: მუშაობა = სიმაღლეზე აწევა + ხახუნის დაძლევა.
HEN: Work = raising the car + overcoming friction.
SKA: $A = m g h + F_{\text{ხ}} s = 10\,000 \cdot 50 + 500 \cdot 1000 = 10^6\ \text{ჯ}$
$t = \dfrac{1000}{10} = 100\ \text{წმ}$, $\ N = \dfrac{10^6}{100} = 10\ \text{კვტ}$
SEN: $W = m g h + F_{\text{fr}} s = 10\,000 \cdot 50 + 500 \cdot 1000 = 10^6\ \text{J}$
$t = \dfrac{1000}{10} = 100\ \text{s}$, $\ P = \dfrac{10^6}{100} = 10\ \text{kW}$
AKA: $1\ \text{მჯ}$; $10\ \text{კვტ}$
AEN: $1\ \text{MJ}$; $10\ \text{kW}$

--- hard work
KA: ჭაში ($h = 20\ \text{მ}$) $10\ \text{კგ}$ ვედრო უწონო თოკით ამოაქვთ. ვედროს ძირში ნახვრეტია და ზემოთ ამოსვლისას წყალი თანაბრად იღვრება: ფსკერზე $10\ \text{კგ}$ წყალია, ზემოთ — $6\ \text{კგ}$. იპოვეთ შესრულებული მუშაობა.
EN: A $10\ \text{kg}$ bucket is pulled up a $20\ \text{m}$ well on a weightless rope. It leaks uniformly: it starts with $10\ \text{kg}$ of water and arrives with $6\ \text{kg}$. Find the work done.
HKA: წყლის მასა სიმაღლესთან ერთად წრფივად მცირდება — აიღეთ საშუალო მასა.
HEN: The water's mass decreases linearly with height — use the average mass.
SKA: წყლის საშუალო მასა: $\dfrac{10 + 6}{2} = 8\ \text{კგ}$
$A = (10 + 8) \cdot 10 \cdot 20 = 3600\ \text{ჯ}$
SEN: Average water mass: $\dfrac{10 + 6}{2} = 8\ \text{kg}$
$W = (10 + 8) \cdot 10 \cdot 20 = 3600\ \text{J}$
AKA: $3{,}6\ \text{კჯ}$
AEN: $3.6\ \text{kJ}$

--- hard work
KA: ველოსიპედისტი ($80\ \text{კგ}$ ველოსიპედით) $5\ \text{მ/წმ}$-ით ადის აღმართზე, რომელიც ყოველ $100\ \text{მ}$-ზე $4\ \text{მ}$-ით მაღლდება. წინაღობის ძალა $20\ \text{ნ}$-ია. რა სიმძლავრეს ავითარებს?
EN: A cyclist ($80\ \text{kg}$ with the bike) rides up a slope at $5\ \text{m/s}$; the slope rises $4\ \text{m}$ for every $100\ \text{m}$ travelled. Resistance is $20\ \text{N}$. What power does the cyclist develop?
HKA: ყოველ წამში სიმაღლე $5 \cdot 0{,}04\ \text{მ}$-ით იზრდება.
HEN: Each second the height increases by $5 \cdot 0.04\ \text{m}$.
SKA: აწევის სიჩქარე: $5 \cdot 0{,}04 = 0{,}2\ \text{მ/წმ}$
$N = m g \cdot 0{,}2 + 20 \cdot 5 = 800 \cdot 0{,}2 + 100 = 260\ \text{ვტ}$
SEN: Rate of climb: $5 \cdot 0.04 = 0.2\ \text{m/s}$
$P = m g \cdot 0.2 + 20 \cdot 5 = 800 \cdot 0.2 + 100 = 260\ \text{W}$
AKA: $260\ \text{ვტ}$
AEN: $260\ \text{W}$

--- hard work
KA: ჰიდროელექტროსადგურის კაშხლიდან ყოველ წამში $500\ \text{მ}^3$ წყალი $40\ \text{მ}$-ზე ვარდება. სადგურის სმკ $85\%$-ია. იპოვეთ სადგურის სასარგებლო სიმძლავრე. რამდენ კვტ·სთ-ს გამოიმუშავებს დღეში?
EN: At a hydroelectric dam $500\ \text{m}^3$ of water falls $40\ \text{m}$ every second. The plant's efficiency is $85\%$. Find its useful power. How many kWh does it produce per day?
HKA: $N = \eta \dfrac{m g h}{t}$.
HEN: $P = \eta \dfrac{m g h}{t}$.
SKA: $N_{\text{სრ}} = 500\,000 \cdot 10 \cdot 40 = 2 \times 10^8\ \text{ვტ}$
$N = 0{,}85 \cdot 2 \times 10^8 = 1{,}7 \times 10^8\ \text{ვტ} = 170\ \text{მვტ}$
დღეში: $170\,000\ \text{კვტ} \cdot 24\ \text{სთ} \approx 4{,}1 \times 10^6\ \text{კვტ·სთ}$
SEN: $P_{\text{total}} = 500\,000 \cdot 10 \cdot 40 = 2 \times 10^8\ \text{W}$
$P = 0.85 \cdot 2 \times 10^8 = 1.7 \times 10^8\ \text{W} = 170\ \text{MW}$
Per day: $170\,000\ \text{kW} \cdot 24\ \text{h} \approx 4.1 \times 10^6\ \text{kWh}$
AKA: $170\ \text{მვტ}$; $\approx 4{,}1$ მლნ კვტ·სთ
AEN: $170\ \text{MW}$; $\approx 4.1$ million kWh

--- easy energy
KA: რას უდრის $3\ \text{კგ}$ სხეულის პოტენციური ენერგია $5\ \text{მ}$ სიმაღლეზე?
EN: What is the potential energy of a $3\ \text{kg}$ body at a height of $5\ \text{m}$?
HKA: $E_p = m g h$.
HEN: $E_p = m g h$.
SKA: $E_p = 3 \cdot 10 \cdot 5 = 150\ \text{ჯ}$
SEN: $E_p = 3 \cdot 10 \cdot 5 = 150\ \text{J}$
AKA: $150\ \text{ჯ}$
AEN: $150\ \text{J}$

--- easy energy
KA: $1500\ \text{კგ}$ მანქანა $20\ \text{მ/წმ}$-ით მოძრაობს. იპოვეთ კინეტიკური ენერგია.
EN: A $1500\ \text{kg}$ car moves at $20\ \text{m/s}$. Find its kinetic energy.
HKA: $E_k = \dfrac{m v^2}{2}$.
HEN: $E_k = \dfrac{m v^2}{2}$.
SKA: $E_k = \dfrac{1500 \cdot 400}{2} = 300\,000\ \text{ჯ} = 300\ \text{კჯ}$
SEN: $E_k = \dfrac{1500 \cdot 400}{2} = 300\,000\ \text{J} = 300\ \text{kJ}$
AKA: $300\ \text{კჯ}$
AEN: $300\ \text{kJ}$

--- easy energy
KA: როგორ შეიცვლება სხეულის კინეტიკური ენერგია, თუ მისი სიჩქარე $3$-ჯერ გაიზრდება?
EN: How does a body's kinetic energy change if its speed triples?
HKA: $E_k \sim v^2$.
HEN: $E_k \sim v^2$.
SKA: $\dfrac{E_2}{E_1} = \left(\dfrac{v_2}{v_1}\right)^2 = 3^2 = 9$
SEN: $\dfrac{E_2}{E_1} = \left(\dfrac{v_2}{v_1}\right)^2 = 3^2 = 9$
AKA: $9$-ჯერ გაიზრდება
AEN: it increases $9$ times

--- easy energy
KA: რა სიმაღლეზე აქვს $2\ \text{კგ}$ სხეულს $400\ \text{ჯ}$ პოტენციური ენერგია?
EN: At what height does a $2\ \text{kg}$ body have $400\ \text{J}$ of potential energy?
HKA: $h = \dfrac{E_p}{m g}$.
HEN: $h = \dfrac{E_p}{m g}$.
SKA: $h = \dfrac{400}{20} = 20\ \text{მ}$
SEN: $h = \dfrac{400}{20} = 20\ \text{m}$
AKA: $20\ \text{მ}$
AEN: $20\ \text{m}$

--- easy energy
KA: ზამბარა ($k = 1000\ \text{ნ/მ}$) $2\ \text{სმ}$-ითაა შეკუმშული. იპოვეთ მისი პოტენციური ენერგია.
EN: A spring ($k = 1000\ \text{N/m}$) is compressed by $2\ \text{cm}$. Find its potential energy.
HKA: $E_p = \dfrac{k x^2}{2}$.
HEN: $E_p = \dfrac{k x^2}{2}$.
SKA: $E_p = \dfrac{1000 \cdot 0{,}0004}{2} = 0{,}2\ \text{ჯ}$
SEN: $E_p = \dfrac{1000 \cdot 0.0004}{2} = 0.2\ \text{J}$
AKA: $0{,}2\ \text{ჯ}$
AEN: $0.2\ \text{J}$

--- easy energy
KA: რა სიჩქარით მოძრაობს $4\ \text{კგ}$ სხეული, რომლის კინეტიკური ენერგიაა $50\ \text{ჯ}$?
EN: How fast does a $4\ \text{kg}$ body with $50\ \text{J}$ of kinetic energy move?
HKA: $v = \sqrt{\dfrac{2 E_k}{m}}$.
HEN: $v = \sqrt{\dfrac{2 E_k}{m}}$.
SKA: $v = \sqrt{\dfrac{100}{4}} = 5\ \text{მ/წმ}$
SEN: $v = \sqrt{\dfrac{100}{4}} = 5\ \text{m/s}$
AKA: $5\ \text{მ/წმ}$
AEN: $5\ \text{m/s}$

--- easy energy
KA: ქვა $45\ \text{მ}$ სიმაღლიდან ვარდება. რა სიჩქარით დაეცემა მიწას? (ჰაერის წინაღობა უგულებელყავით)
EN: A stone falls from $45\ \text{m}$. With what speed does it hit the ground? (Ignore air resistance.)
HKA: $m g h = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{2 g h}$.
HEN: $m g h = \dfrac{m v^2}{2} \Rightarrow v = \sqrt{2 g h}$.
SKA: $v = \sqrt{2 \cdot 10 \cdot 45} = \sqrt{900} = 30\ \text{მ/წმ}$
SEN: $v = \sqrt{2 \cdot 10 \cdot 45} = \sqrt{900} = 30\ \text{m/s}$
AKA: $30\ \text{მ/წმ}$
AEN: $30\ \text{m/s}$

--- easy energy
KA: ბურთი ვერტიკალურად ზემოთ $20\ \text{მ/წმ}$-ით აისროლეს. რა სიმაღლეზე ავა?
EN: A ball is thrown straight up at $20\ \text{m/s}$. How high does it go?
HKA: $h = \dfrac{v^2}{2 g}$.
HEN: $h = \dfrac{v^2}{2 g}$.
SKA: $h = \dfrac{400}{20} = 20\ \text{მ}$
SEN: $h = \dfrac{400}{20} = 20\ \text{m}$
AKA: $20\ \text{მ}$
AEN: $20\ \text{m}$

--- easy energy
KA: რომელ სხეულს აქვს მეტი კინეტიკური ენერგია: $10\ \text{გ}$ ტყვიას $600\ \text{მ/წმ}$-ით თუ $60\ \text{კგ}$ მორბენალს $10\ \text{მ/წმ}$-ით?
EN: Which has more kinetic energy: a $10\ \text{g}$ bullet at $600\ \text{m/s}$ or a $60\ \text{kg}$ runner at $10\ \text{m/s}$?
HKA: გამოთვალეთ ორივე.
HEN: Work out both.
SKA: ტყვია: $\dfrac{0{,}01 \cdot 360\,000}{2} = 1800\ \text{ჯ}$
მორბენალი: $\dfrac{60 \cdot 100}{2} = 3000\ \text{ჯ}$
მორბენალს მეტი აქვს.
SEN: Bullet: $\dfrac{0.01 \cdot 360\,000}{2} = 1800\ \text{J}$
Runner: $\dfrac{60 \cdot 100}{2} = 3000\ \text{J}$
The runner has more.
AKA: მორბენალს ($3000\ \text{ჯ}$ vs $1800\ \text{ჯ}$)
AEN: the runner ($3000\ \text{J}$ vs $1800\ \text{J}$)

--- easy energy
KA: რა ენერგიის გარდაქმნა ხდება: ა) ქანქარის უმაღლესი წერტილიდან უდაბლესისკენ მოძრაობისას; ბ) მშვილდიდან ისრის გასროლისას; გ) მანქანის დამუხრუჭებისას?
EN: What energy change happens: a) when a pendulum swings from its highest point to its lowest; b) when an arrow is shot from a bow; c) when a car brakes?
HKA: იფიქრეთ პოტენციურზე, კინეტიკურზე და შინაგან ენერგიაზე.
HEN: Think about potential, kinetic and internal energy.
SKA: ა) პოტენციური $\to$ კინეტიკური.
ბ) მოხრილი მშვილდის დრეკადი პოტენციური $\to$ ისრის კინეტიკური.
გ) კინეტიკური $\to$ შინაგანი (მუხრუჭები და საბურავები თბება).
SEN: a) potential $\to$ kinetic.
b) elastic potential of the bent bow $\to$ kinetic of the arrow.
c) kinetic $\to$ internal (brakes and tyres heat up).
AKA: ა) $E_p \to E_k$; ბ) დრეკადი $\to E_k$; გ) $E_k \to$ შინაგანი
AEN: a) $E_p \to E_k$; b) elastic $\to E_k$; c) $E_k \to$ internal

--- easy energy
KA: როგორ შეიცვლება სხეულის პოტენციური ენერგია, თუ ის $2$ მ-დან $8$ მ სიმაღლეზე აიწევს? სხეულის მასაა $5\ \text{კგ}$.
EN: How does a $5\ \text{kg}$ body's potential energy change when it rises from $2\ \text{m}$ to $8\ \text{m}$?
HKA: $\Delta E_p = m g \Delta h$.
HEN: $\Delta E_p = m g \Delta h$.
SKA: $\Delta E_p = 5 \cdot 10 \cdot 6 = 300\ \text{ჯ}$ (იზრდება)
SEN: $\Delta E_p = 5 \cdot 10 \cdot 6 = 300\ \text{J}$ (it increases)
AKA: $300\ \text{ჯ}$-ით გაიზრდება
AEN: it increases by $300\ \text{J}$

--- easy energy
KA: მატარებლის ($400\ \text{ტ}$) კინეტიკური ენერგიაა $80\ \text{მჯ}$. რა სიჩქარით მოძრაობს?
EN: A $400\ \text{t}$ train has $80\ \text{MJ}$ of kinetic energy. How fast is it going?
HKA: $v = \sqrt{\dfrac{2E}{m}}$.
HEN: $v = \sqrt{\dfrac{2E}{m}}$.
SKA: $v = \sqrt{\dfrac{2 \cdot 8 \times 10^7}{4 \times 10^5}} = \sqrt{400} = 20\ \text{მ/წმ}$
SEN: $v = \sqrt{\dfrac{2 \cdot 8 \times 10^7}{4 \times 10^5}} = \sqrt{400} = 20\ \text{m/s}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- easy energy
KA: მაგიდაზე ($h = 0{,}8\ \text{მ}$) $0{,}5\ \text{კგ}$ წიგნი დევს. რას უდრის მისი პოტენციური ენერგია: ა) იატაკის მიმართ; ბ) მაგიდის ზედაპირის მიმართ?
EN: A $0.5\ \text{kg}$ book lies on a $0.8\ \text{m}$ table. What is its potential energy: a) relative to the floor; b) relative to the table top?
HKA: პოტენციური ენერგია ნულოვანი დონის არჩევანზეა დამოკიდებული.
HEN: Potential energy depends on where you choose the zero level.
SKA: ა) $E_p = 0{,}5 \cdot 10 \cdot 0{,}8 = 4\ \text{ჯ}$
ბ) $h = 0 \Rightarrow E_p = 0$
SEN: a) $E_p = 0.5 \cdot 10 \cdot 0.8 = 4\ \text{J}$
b) $h = 0 \Rightarrow E_p = 0$
AKA: ა) $4\ \text{ჯ}$; ბ) $0$
AEN: a) $4\ \text{J}$; b) $0$

--- easy energy
KA: რამდენჯერ მეტი კინეტიკური ენერგია აქვს $72\ \text{კმ/სთ}$-ით მოძრავ მანქანას, ვიდრე $36\ \text{კმ/სთ}$-ით მოძრავს? რატომ იზრდება სამუხრუჭე მანძილი ამდენად სწრაფად?
EN: How many times more kinetic energy does a car have at $72\ \text{km/h}$ than at $36\ \text{km/h}$? Why does the braking distance grow so quickly?
HKA: $E_k \sim v^2$; დამუხრუჭებისას ხახუნი მთელ ამ ენერგიას „ჭამს“.
HEN: $E_k \sim v^2$; when braking, friction must absorb all of it.
SKA: $\left(\dfrac{72}{36}\right)^2 = 4$
ხახუნის ძალა თითქმის მუდმივია, ამიტომ $F s = E_k$ — სამუხრუჭე მანძილიც $4$-ჯერ იზრდება.
SEN: $\left(\dfrac{72}{36}\right)^2 = 4$
The friction force is roughly constant, so $F s = E_k$ — the braking distance also grows $4$ times.
AKA: $4$-ჯერ
AEN: $4$ times

--- medium energy
KA: სხეული $20\ \text{მ}$ სიმაღლიდან ვარდება. რა სიმაღლეზე ექნება მას კინეტიკური ენერგია პოტენციურის ტოლი? რა სიჩქარე ექნება ამ დროს?
EN: A body falls from $20\ \text{m}$. At what height are its kinetic and potential energies equal? What is its speed then?
HKA: სრული ენერგია $m g H$ ორ ტოლ ნაწილად იყოფა.
HEN: The total energy $m g H$ splits into two equal parts.
SKA: $m g h = \dfrac{m g H}{2} \Rightarrow h = 10\ \text{მ}$
$\dfrac{v^2}{2} = g \cdot 10 \Rightarrow v = \sqrt{200} \approx 14{,}1\ \text{მ/წმ}$
SEN: $m g h = \dfrac{m g H}{2} \Rightarrow h = 10\ \text{m}$
$\dfrac{v^2}{2} = g \cdot 10 \Rightarrow v = \sqrt{200} \approx 14.1\ \text{m/s}$
AKA: $10\ \text{მ}$; $\approx 14{,}1\ \text{მ/წმ}$
AEN: $10\ \text{m}$; $\approx 14.1\ \text{m/s}$

--- medium energy
KA: სასრიალოდან ($h = 5\ \text{მ}$) ბავშვი უძრავი მდგომარეობიდან ჩამოსრიალდა და ქვემოთ $8\ \text{მ/წმ}$ სიჩქარე ჰქონდა. მასა $30\ \text{კგ}$-ია. რამდენი ენერგია გადაიქცა სითბოდ?
EN: A $30\ \text{kg}$ child slides from rest down a $5\ \text{m}$ slide and reaches the bottom at $8\ \text{m/s}$. How much energy turned into heat?
HKA: $Q = m g h - \dfrac{m v^2}{2}$.
HEN: $Q = m g h - \dfrac{m v^2}{2}$.
SKA: $m g h = 1500\ \text{ჯ}$, $\ \dfrac{m v^2}{2} = \dfrac{30 \cdot 64}{2} = 960\ \text{ჯ}$
$Q = 1500 - 960 = 540\ \text{ჯ}$
SEN: $m g h = 1500\ \text{J}$, $\ \dfrac{m v^2}{2} = \dfrac{30 \cdot 64}{2} = 960\ \text{J}$
$Q = 1500 - 960 = 540\ \text{J}$
AKA: $540\ \text{ჯ}$
AEN: $540\ \text{J}$

--- medium energy
KA: ქვა $10\ \text{მ/წმ}$ სიჩქარით ჰორიზონტალურად ისროლეს $15\ \text{მ}$ სიმაღლის კლდიდან. რა სიჩქარით დაეცემა ის მიწას?
EN: A stone is thrown horizontally at $10\ \text{m/s}$ from a $15\ \text{m}$ cliff. With what speed does it hit the ground?
HKA: ენერგიის შენახვა სიჩქარის მიმართულებაზე არ არის დამოკიდებული.
HEN: Energy conservation doesn't depend on the direction of the velocity.
SKA: $\dfrac{v^2}{2} = \dfrac{v_0^2}{2} + g h \Rightarrow v^2 = 100 + 300 = 400$
$v = 20\ \text{მ/წმ}$
SEN: $\dfrac{v^2}{2} = \dfrac{v_0^2}{2} + g h \Rightarrow v^2 = 100 + 300 = 400$
$v = 20\ \text{m/s}$
AKA: $20\ \text{მ/წმ}$
AEN: $20\ \text{m/s}$

--- medium energy
KA: ზამბარიანი პისტოლეტის ზამბარა ($k = 500\ \text{ნ/მ}$) $4\ \text{სმ}$-ითაა შეკუმშული. რა სიმაღლეზე აისვრის ის ვერტიკალურად $20\ \text{გ}$ ბურთულას?
EN: A toy gun's spring ($k = 500\ \text{N/m}$) is compressed $4\ \text{cm}$. How high does it shoot a $20\ \text{g}$ ball straight up?
HKA: $\dfrac{k x^2}{2} = m g h$.
HEN: $\dfrac{k x^2}{2} = m g h$.
SKA: $E = \dfrac{500 \cdot 0{,}0016}{2} = 0{,}4\ \text{ჯ}$
$h = \dfrac{0{,}4}{0{,}02 \cdot 10} = 2\ \text{მ}$
SEN: $E = \dfrac{500 \cdot 0.0016}{2} = 0.4\ \text{J}$
$h = \dfrac{0.4}{0.02 \cdot 10} = 2\ \text{m}$
AKA: $2\ \text{მ}$
AEN: $2\ \text{m}$
