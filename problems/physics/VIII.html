KA: ქანქარის ბურთულა ქვედა წერტილში $3\ \text{მ/წმ}$-ით მოძრაობს. რა სიმაღლეზე ავა ის ქვედა წერტილიდან?
EN: A pendulum bob moves at $3\ \text{m/s}$ at its lowest point. How high above that point does it rise?
HKA: $h = \dfrac{v^2}{2g}$.
HEN: $h = \dfrac{v^2}{2g}$.
SKA: $h = \dfrac{9}{20} = 0{,}45\ \text{მ} = 45\ \text{სმ}$
SEN: $h = \dfrac{9}{20} = 0.45\ \text{m} = 45\ \text{cm}$
AKA: $45\ \text{სმ}$
AEN: $45\ \text{cm}$

--- medium energy
KA: $0{,}5\ \text{კგ}$ ბურთი $10\ \text{მ}$ სიმაღლიდან ჩამოვარდა და მიწას $12\ \text{მ/წმ}$-ით დაეჯახა. იპოვეთ ჰაერის წინაღობის საშუალო ძალა.
EN: A $0.5\ \text{kg}$ ball falls from $10\ \text{m}$ and hits the ground at $12\ \text{m/s}$. Find the average air resistance force.
HKA: ენერგიის დანაკარგი $= F h$.
HEN: The energy lost $= F h$.
SKA: $m g h = 50\ \text{ჯ}$, $\ \dfrac{m v^2}{2} = 36\ \text{ჯ}$
$F = \dfrac{50 - 36}{10} = 1{,}4\ \text{ნ}$
SEN: $m g h = 50\ \text{J}$, $\ \dfrac{m v^2}{2} = 36\ \text{J}$
$F = \dfrac{50 - 36}{10} = 1.4\ \text{N}$
AKA: $1{,}4\ \text{ნ}$
AEN: $1.4\ \text{N}$

--- medium energy
KA: მანქანა ($1200\ \text{კგ}$) $54\ \text{კმ/სთ}$-დან $90\ \text{კმ/სთ}$-მდე აჩქარდა. რა მუშაობა შეასრულა ძრავამ (დანაკარგების გარეშე)?
EN: A $1200\ \text{kg}$ car speeds up from $54\ \text{km/h}$ to $90\ \text{km/h}$. How much work did the engine do (ignoring losses)?
HKA: მუშაობა კინეტიკური ენერგიის ცვლილების ტოლია.
HEN: The work equals the change in kinetic energy.
SKA: $v_1 = 15\ \text{მ/წმ}$, $v_2 = 25\ \text{მ/წმ}$
$A = \dfrac{1200}{2}(625 - 225) = 600 \cdot 400 = 240\ \text{კჯ}$
SEN: $v_1 = 15\ \text{m/s}$, $v_2 = 25\ \text{m/s}$
$W = \dfrac{1200}{2}(625 - 225) = 600 \cdot 400 = 240\ \text{kJ}$
AKA: $240\ \text{კჯ}$
AEN: $240\ \text{kJ}$

--- medium energy
KA: ტყვია ($9\ \text{გ}$) $500\ \text{მ/წმ}$-ით ფიცარში შედის და $200\ \text{მ/წმ}$-ით გამოდის. ფიცრის სისქეა $5\ \text{სმ}$. იპოვეთ წინაღობის საშუალო ძალა.
EN: A $9\ \text{g}$ bullet enters a plank at $500\ \text{m/s}$ and leaves at $200\ \text{m/s}$. The plank is $5\ \text{cm}$ thick. Find the average resistance force.
HKA: $F d = \Delta E_k$.
HEN: $F d = \Delta E_k$.
SKA: $\Delta E_k = \dfrac{0{,}009}{2}(250\,000 - 40\,000) = 945\ \text{ჯ}$
$F = \dfrac{945}{0{,}05} = 18\,900\ \text{ნ}$
SEN: $\Delta E_k = \dfrac{0.009}{2}(250\,000 - 40\,000) = 945\ \text{J}$
$F = \dfrac{945}{0.05} = 18\,900\ \text{N}$
AKA: $\approx 19\ \text{კნ}$
AEN: $\approx 19\ \text{kN}$

--- medium energy
KA: სხეული ვერტიკალურად ზემოთ $15\ \text{მ/წმ}$-ით აისროლეს. რა სიჩქარე ექნება მას $10\ \text{მ}$ სიმაღლეზე?
EN: A body is thrown straight up at $15\ \text{m/s}$. What is its speed at a height of $10\ \text{m}$?
HKA: $v^2 = v_0^2 - 2 g h$.
HEN: $v^2 = v_0^2 - 2 g h$.
SKA: $v^2 = 225 - 200 = 25 \Rightarrow v = 5\ \text{მ/წმ}$
SEN: $v^2 = 225 - 200 = 25 \Rightarrow v = 5\ \text{m/s}$
AKA: $5\ \text{მ/წმ}$
AEN: $5\ \text{m/s}$

--- medium energy
KA: ზამბარაზე ($k = 200\ \text{ნ/მ}$) მიმაგრებული $0{,}5\ \text{კგ}$ ძელი ჰორიზონტალურ უხახუნო ზედაპირზე $10\ \text{სმ}$-ით გაწიეს და გაუშვეს. რა უდიდესი სიჩქარე ექნება ძელს?
EN: A $0.5\ \text{kg}$ block on a frictionless horizontal surface is attached to a spring ($k = 200\ \text{N/m}$), pulled $10\ \text{cm}$ aside and released. What is its maximum speed?
HKA: $\dfrac{k x^2}{2} = \dfrac{m v^2}{2}$.
HEN: $\dfrac{k x^2}{2} = \dfrac{m v^2}{2}$.
SKA: $v = x\sqrt{\dfrac{k}{m}} = 0{,}1 \cdot \sqrt{400} = 2\ \text{მ/წმ}$
SEN: $v = x\sqrt{\dfrac{k}{m}} = 0.1 \cdot \sqrt{400} = 2\ \text{m/s}$
AKA: $2\ \text{მ/წმ}$
AEN: $2\ \text{m/s}$

--- medium energy
KA: ამერიკული მთების ვაგონი $25\ \text{მ}$ სიმაღლიდან უძრავად იწყებს მოძრაობას. შეძლებს თუ არა $30\ \text{მ}$ სიმაღლის „ბორცვის“ გადალახვას? რა სიჩქარე ექნება მას $5\ \text{მ}$ სიმაღლეზე? (ხახუნის გარეშე)
EN: A roller-coaster car starts from rest $25\ \text{m}$ up. Can it get over a $30\ \text{m}$ hump? What is its speed at $5\ \text{m}$? (No friction.)
HKA: სრული ენერგია $m g \cdot 25$-ზე მეტი ვერ იქნება.
HEN: The total energy can't exceed $m g \cdot 25$.
SKA: $30\ \text{მ} > 25\ \text{მ}$ — ვერ გადალახავს.
$v = \sqrt{2 g (25 - 5)} = \sqrt{400} = 20\ \text{მ/წმ}$
SEN: $30\ \text{m} > 25\ \text{m}$ — it can't get over.
$v = \sqrt{2 g (25 - 5)} = \sqrt{400} = 20\ \text{m/s}$
AKA: ვერა; $20\ \text{მ/წმ}$
AEN: no; $20\ \text{m/s}$

--- medium energy
KA: მოთამაშე ბურთს ვერტიკალურად ზემოთ ისვრის $2\ \text{მ}$ სიმაღლიდან. რა სიჩქარეა საჭირო, რომ ბურთმა მიწიდან $5\ \text{მ}$ სიმაღლეს მიაღწიოს?
EN: A player throws a ball straight up from a height of $2\ \text{m}$. What speed is needed for it to reach $5\ \text{m}$ above the ground?
HKA: ბურთმა $3\ \text{მ}$-ით უნდა აიწიოს.
HEN: The ball must rise $3\ \text{m}$.
SKA: $v_0 = \sqrt{2 g \Delta h} = \sqrt{2 \cdot 10 \cdot 3} = \sqrt{60} \approx 7{,}7\ \text{მ/წმ}$
SEN: $v_0 = \sqrt{2 g \Delta h} = \sqrt{2 \cdot 10 \cdot 3} = \sqrt{60} \approx 7.7\ \text{m/s}$
AKA: $\approx 7{,}7\ \text{მ/წმ}$
AEN: $\approx 7.7\ \text{m/s}$

--- medium energy
KA: მანქანამ ($1\ \text{ტ}$) $20\ \text{მ/წმ}$-დან დამუხრუჭებით $40\ \text{მ}$-ზე გაჩერდა. იპოვეთ სამუხრუჭე ძალა.
EN: A $1\ \text{t}$ car braking from $20\ \text{m/s}$ stops in $40\ \text{m}$. Find the braking force.
HKA: $F s = \dfrac{m v^2}{2}$.
HEN: $F s = \dfrac{m v^2}{2}$.
SKA: $E_k = \dfrac{1000 \cdot 400}{2} = 200\,000\ \text{ჯ}$
$F = \dfrac{200\,000}{40} = 5000\ \text{ნ}$
SEN: $E_k = \dfrac{1000 \cdot 400}{2} = 200\,000\ \text{J}$
$F = \dfrac{200\,000}{40} = 5000\ \text{N}$
AKA: $5\ \text{კნ}$
AEN: $5\ \text{kN}$

--- medium energy
KA: ორ სხეულს ერთნაირი კინეტიკური ენერგია აქვს. პირველის მასა $4$-ჯერ მეტია. რამდენჯერ განსხვავდება მათი სიჩქარეები?
EN: Two bodies have the same kinetic energy. The first has $4$ times the mass. How do their speeds compare?
HKA: $m_1 v_1^2 = m_2 v_2^2$.
HEN: $m_1 v_1^2 = m_2 v_2^2$.
SKA: $\dfrac{v_2}{v_1} = \sqrt{\dfrac{m_1}{m_2}} = \sqrt{4} = 2$
SEN: $\dfrac{v_2}{v_1} = \sqrt{\dfrac{m_1}{m_2}} = \sqrt{4} = 2$
AKA: მეორე $2$-ჯერ სწრაფია
AEN: the second is $2$ times faster

--- medium energy
KA: მძიმე ჩაქუჩი ($5\ \text{კგ}$) $1{,}25\ \text{მ}$ სიმაღლიდან ვარდება ლურსმანზე და ის $2\ \text{სმ}$-ით შედის ხეში. იპოვეთ ხის წინაღობის საშუალო ძალა.
EN: A $5\ \text{kg}$ drop hammer falls $1.25\ \text{m}$ onto a nail, driving it $2\ \text{cm}$ into wood. Find the average resistance force of the wood.
HKA: ჩაქუჩის ენერგია $m g (h + d)$ წინაღობამ გააქრო $d$ მანძილზე.
HEN: The hammer's energy $m g (h + d)$ is absorbed by the resistance over $d$.
SKA: $F d = m g (h + d) \Rightarrow F = \dfrac{50 \cdot 1{,}27}{0{,}02} = 3175\ \text{ნ}$
SEN: $F d = m g (h + d) \Rightarrow F = \dfrac{50 \cdot 1.27}{0.02} = 3175\ \text{N}$
AKA: $\approx 3{,}2\ \text{კნ}$
AEN: $\approx 3.2\ \text{kN}$

--- medium energy
KA: მოთხილამურე ($60\ \text{კგ}$) $50\ \text{მ}$ სიმაღლის მთიდან ჩამოსრიალდა და ქვემოთ $20\ \text{მ/წმ}$ ჰქონდა. ენერგიის რა ნაწილი დაიკარგა?
EN: A $60\ \text{kg}$ skier slides down from a $50\ \text{m}$ hill and has $20\ \text{m/s}$ at the bottom. What fraction of the energy was lost?
HKA: შეადარეთ $m g h$ და $\dfrac{m v^2}{2}$.
HEN: Compare $m g h$ and $\dfrac{m v^2}{2}$.
SKA: $E_p = 30\,000\ \text{ჯ}$, $\ E_k = \dfrac{60 \cdot 400}{2} = 12\,000\ \text{ჯ}$
დაკარგული: $\dfrac{18\,000}{30\,000} = 0{,}6 = 60\%$
SEN: $E_p = 30\,000\ \text{J}$, $\ E_k = \dfrac{60 \cdot 400}{2} = 12\,000\ \text{J}$
Lost: $\dfrac{18\,000}{30\,000} = 0.6 = 60\%$
AKA: $60\%$
AEN: $60\%$

--- medium energy
KA: ბურთი $1{,}25\ \text{მ}$ სიმაღლიდან ჩამოვარდა და $0{,}8\ \text{მ}$-მდე ახტა. რა სიჩქარით დაეჯახა იატაკს და რა სიჩქარით აიჭრა?
EN: A ball dropped from $1.25\ \text{m}$ bounces to $0.8\ \text{m}$. At what speed does it hit the floor and at what speed does it leave it?
HKA: $v = \sqrt{2 g h}$ ორივე შემთხვევაში.
HEN: $v = \sqrt{2 g h}$ in both cases.
SKA: $v_1 = \sqrt{25} = 5\ \text{მ/წმ}$, $\ v_2 = \sqrt{16} = 4\ \text{მ/წმ}$
SEN: $v_1 = \sqrt{25} = 5\ \text{m/s}$, $\ v_2 = \sqrt{16} = 4\ \text{m/s}$
AKA: $5\ \text{მ/წმ}$; $4\ \text{მ/წმ}$
AEN: $5\ \text{m/s}$; $4\ \text{m/s}$

--- medium energy
KA: ისარი ($50\ \text{გ}$) მშვილდიდან ვერტიკალურად ზემოთ $40\ \text{მ/წმ}$-ით გაისროლეს. ჰაერის წინაღობის გამო ის მხოლოდ $60\ \text{მ}$-ზე ავიდა. რამდენი ენერგია დაიკარგა?
EN: A $50\ \text{g}$ arrow is shot straight up at $40\ \text{m/s}$. Because of air resistance it rises only $60\ \text{m}$. How much energy was lost?
HKA: შეადარეთ საწყისი კინეტიკური და საბოლოო პოტენციური ენერგია.
HEN: Compare the initial kinetic and the final potential energy.
SKA: $E_k = \dfrac{0{,}05 \cdot 1600}{2} = 40\ \text{ჯ}$, $\ E_p = 0{,}05 \cdot 10 \cdot 60 = 30\ \text{ჯ}$
დაკარგული: $10\ \text{ჯ}$ (წინაღობის გარეშე $80\ \text{მ}$-ზე ავიდოდა)
SEN: $E_k = \dfrac{0.05 \cdot 1600}{2} = 40\ \text{J}$, $\ E_p = 0.05 \cdot 10 \cdot 60 = 30\ \text{J}$
Lost: $10\ \text{J}$ (without resistance it would reach $80\ \text{m}$)
AKA: $10\ \text{ჯ}$
AEN: $10\ \text{J}$

--- hard energy
KA: $2\ \text{კგ}$ ძელი $0{,}45\ \text{მ}$ სიმაღლიდან ეცემა ვერტიკალურ ზამბარაზე ($k = 2000\ \text{ნ/მ}$). რამდენით შეიკუმშება ზამბარა მაქსიმალურად?
EN: A $2\ \text{kg}$ block falls $0.45\ \text{m}$ onto a vertical spring ($k = 2000\ \text{N/m}$). What is the maximum compression?
HKA: $m g (h + x) = \dfrac{k x^2}{2}$ — კვადრატული განტოლება $x$-ის მიმართ.
HEN: $m g (h + x) = \dfrac{k x^2}{2}$ — a quadratic in $x$.
SKA: $20(0{,}45 + x) = 1000 x^2 \Rightarrow 1000 x^2 - 20x - 9 = 0$
$x = \dfrac{20 + \sqrt{400 + 36\,000}}{2000} = \dfrac{20 + 190{,}8}{2000} \approx 0{,}105\ \text{მ}$
SEN: $20(0.45 + x) = 1000 x^2 \Rightarrow 1000 x^2 - 20x - 9 = 0$
$x = \dfrac{20 + \sqrt{400 + 36\,000}}{2000} = \dfrac{20 + 190.8}{2000} \approx 0.105\ \text{m}$
AKA: $\approx 10{,}5\ \text{სმ}$
AEN: $\approx 10.5\ \text{cm}$

--- hard energy
KA: სასრიალოს სიმაღლეა $h$, შემდეგ ჰორიზონტალური ნაწილია, სადაც ხახუნის კოეფიციენტია $0{,}2$. მარხილი $4\ \text{მ}$ სიმაღლიდან (უხახუნოდ) ჩამოსრიალდა. რა მანძილს გაივლის ჰორიზონტალურ ნაწილზე გაჩერებამდე?
EN: A sled slides without friction down a $4\ \text{m}$ high slope onto a horizontal stretch where $\mu = 0.2$. How far does it go on the horizontal stretch before stopping?
HKA: $m g h = \mu m g s$.
HEN: $m g h = \mu m g s$.
SKA: $s = \dfrac{h}{\mu} = \dfrac{4}{0{,}2} = 20\ \text{მ}$
SEN: $s = \dfrac{h}{\mu} = \dfrac{4}{0.2} = 20\ \text{m}$
AKA: $20\ \text{მ}$
AEN: $20\ \text{m}$

--- hard energy
KA: $1\ \text{მ}$ სიგრძის ძაფზე დაკიდებულ ბურთულას ქვედა წერტილში $5\ \text{მ/წმ}$ სიჩქარე მიანიჭეს. მიაღწევს თუ არა ბურთულა ჰორიზონტალურ დონეს? რა სიჩქარე ექნება იქ?
EN: A ball on a $1\ \text{m}$ string is given $5\ \text{m/s}$ at the lowest point. Does it reach the horizontal level of the pivot? What is its speed there?
HKA: ჰორიზონტალურ დონეზე ბურთულა $1\ \text{მ}$-ით მაღლაა.
HEN: At the horizontal level the ball is $1\ \text{m}$ higher.
SKA: $v^2 = v_0^2 - 2 g l = 25 - 20 = 5 > 0$ — მიაღწევს.
$v = \sqrt{5} \approx 2{,}2\ \text{მ/წმ}$
SEN: $v^2 = v_0^2 - 2 g l = 25 - 20 = 5 > 0$ — yes, it gets there.
$v = \sqrt{5} \approx 2.2\ \text{m/s}$
AKA: კი; $\approx 2{,}2\ \text{მ/წმ}$
AEN: yes; $\approx 2.2\ \text{m/s}$

--- hard energy
KA: ბურთი $5\ \text{მ}$ სიმაღლიდან ვარდება და ყოველ დაჯახებაზე ენერგიის $36\%$-ს კარგავს. რა სიმაღლეზე ავა მესამე დაჯახების შემდეგ? რა იქნება სიჩქარე მესამე დაჯახების შემდეგ?
EN: A ball is dropped from $5\ \text{m}$ and loses $36\%$ of its energy at each bounce. How high does it rise after the third bounce? What is its speed just after the third bounce?
HKA: ყოველი დაჯახების შემდეგ რჩება $0{,}64$ ენერგიისა.
HEN: After each bounce $0.64$ of the energy remains.
SKA: $h_3 = 5 \cdot 0{,}64^3 = 5 \cdot 0{,}262 \approx 1{,}31\ \text{მ}$
$v_3 = \sqrt{2 g h_3} \approx \sqrt{26{,}2} \approx 5{,}1\ \text{მ/წმ}$
SEN: $h_3 = 5 \cdot 0.64^3 = 5 \cdot 0.262 \approx 1.31\ \text{m}$
$v_3 = \sqrt{2 g h_3} \approx \sqrt{26.2} \approx 5.1\ \text{m/s}$
AKA: $\approx 1{,}31\ \text{მ}$; $\approx 5{,}1\ \text{მ/წმ}$
AEN: $\approx 1.31\ \text{m}$; $\approx 5.1\ \text{m/s}$

--- hard energy
KA: მატარებელი ($500\ \text{ტ}$) $72\ \text{კმ/სთ}$-ით მოძრაობს და ძრავის გამორთვის შემდეგ $2\ \text{კმ}$-ში ჩერდება. იპოვეთ წინაღობის ძალა. რამდენჯერ ნაკლებია ის მატარებლის წონაზე?
EN: A $500\ \text{t}$ train moving at $72\ \text{km/h}$ coasts to a stop in $2\ \text{km}$ after the engine is switched off. Find the resistance force. How many times smaller than the train's weight is it?
HKA: $F s = \dfrac{m v^2}{2}$.
HEN: $F s = \dfrac{m v^2}{2}$.
SKA: $E_k = \dfrac{5 \times 10^5 \cdot 400}{2} = 10^8\ \text{ჯ}$
$F = \dfrac{10^8}{2000} = 5 \times 10^4\ \text{ნ}$
$\dfrac{m g}{F} = \dfrac{5 \times 10^6}{5 \times 10^4} = 100$
SEN: $E_k = \dfrac{5 \times 10^5 \cdot 400}{2} = 10^8\ \text{J}$
$F = \dfrac{10^8}{2000} = 5 \times 10^4\ \text{N}$
$\dfrac{m g}{F} = \dfrac{5 \times 10^6}{5 \times 10^4} = 100$
AKA: $50\ \text{კნ}$; $100$-ჯერ
AEN: $50\ \text{kN}$; $100$ times

--- hard energy
KA: ორი ბურთი ერთდროულად $20\ \text{მ}$ სიმაღლიდან ერთნაირი $10\ \text{მ/წმ}$ სიჩქარით ისროლეს: ერთი ზემოთ, მეორე ქვემოთ. შეადარეთ მათი სიჩქარეები მიწასთან. რომელი მივა ადრე?
EN: Two balls are thrown from $20\ \text{m}$ with the same speed $10\ \text{m/s}$: one up, one down. Compare their speeds on reaching the ground. Which arrives first?
HKA: ენერგია მიმართულებაზე არ არის დამოკიდებული; დრო — კი.
HEN: Energy doesn't depend on direction; the time does.
SKA: ორივეს: $v = \sqrt{v_0^2 + 2 g h} = \sqrt{100 + 400} \approx 22{,}4\ \text{მ/წმ}$ — ტოლია.
ქვემოთ ნასროლი ადრე მივა — ზემოთ ნასროლი ჯერ ადის, შემდეგ ბრუნდება იმავე სიჩქარით ($10\ \text{მ/წმ}$ ქვემოთ) და ზუსტად მეორის გზას იმეორებს.
SEN: For both: $v = \sqrt{v_0^2 + 2 g h} = \sqrt{100 + 400} \approx 22.4\ \text{m/s}$ — equal.
The one thrown down arrives first — the other goes up, comes back down past the start at $10\ \text{m/s}$, and then repeats the first ball's path.
AKA: სიჩქარეები ტოლია ($\approx 22{,}4\ \text{მ/წმ}$); ქვემოთ ნასროლი ადრე
AEN: equal speeds ($\approx 22.4\ \text{m/s}$); the one thrown down arrives first

--- hard energy
KA: სხეული ($m = 1\ \text{კგ}$) $10\ \text{მ}$ სიგრძისა და $6\ \text{მ}$ სიმაღლის დახრილი სიბრტყიდან ჩამოსრიალდა. ხახუნის ძალა $2\ \text{ნ}$-ია. რა სიჩქარე ექნება ქვემოთ?
EN: A $1\ \text{kg}$ body slides from rest down an incline $10\ \text{m}$ long and $6\ \text{m}$ high. The friction force is $2\ \text{N}$. What is its speed at the bottom?
HKA: $\dfrac{m v^2}{2} = m g h - F_{\text{ხ}} l$.
HEN: $\dfrac{m v^2}{2} = m g h - F_{\text{fr}} l$.
SKA: $\dfrac{v^2}{2} = 60 - 20 = 40 \Rightarrow v = \sqrt{80} \approx 8{,}9\ \text{მ/წმ}$
SEN: $\dfrac{v^2}{2} = 60 - 20 = 40 \Rightarrow v = \sqrt{80} \approx 8.9\ \text{m/s}$
AKA: $\approx 8{,}9\ \text{მ/წმ}$
AEN: $\approx 8.9\ \text{m/s}$

--- hard energy
KA: ზამბარიანი თოფის ზამბარა ($k = 1000\ \text{ნ/მ}$) $5\ \text{სმ}$-ითაა შეკუმშული. ის $10\ \text{გ}$ ტყვიას ვერტიკალურად ზემოთ ისვრის; ჰაერის წინაღობა ენერგიის $20\%$-ს „ჭამს“. რა სიმაღლეზე ავა ტყვია?
EN: A spring gun ($k = 1000\ \text{N/m}$, compressed $5\ \text{cm}$) shoots a $10\ \text{g}$ pellet straight up; air resistance takes $20\%$ of the energy. How high does the pellet rise?
HKA: $0{,}8 \cdot \dfrac{k x^2}{2} = m g h$.
HEN: $0.8 \cdot \dfrac{k x^2}{2} = m g h$.
SKA: $E = \dfrac{1000 \cdot 0{,}0025}{2} = 1{,}25\ \text{ჯ}$
$h = \dfrac{0{,}8 \cdot 1{,}25}{0{,}01 \cdot 10} = 10\ \text{მ}$
SEN: $E = \dfrac{1000 \cdot 0.0025}{2} = 1.25\ \text{J}$
$h = \dfrac{0.8 \cdot 1.25}{0.01 \cdot 10} = 10\ \text{m}$
AKA: $10\ \text{მ}$
AEN: $10\ \text{m}$

--- hard energy
KA: მოთხილამურე $20\ \text{მ}$ სიმაღლიდან ეშვება, შემდეგ ადის $15\ \text{მ}$ სიმაღლის ბორცვზე. საწყისი სიჩქარე ნულია, დანაკარგები მთელ გზაზე $1500\ \text{ჯ}$-ია, მასა $60\ \text{კგ}$. რა სიჩქარე აქვს ბორცვის მწვერვალზე?
EN: A $60\ \text{kg}$ skier starts from rest at $20\ \text{m}$, goes down and then up a $15\ \text{m}$ hill. Losses along the way are $1500\ \text{J}$. What is the speed on top of the hill?
HKA: $m g H = m g h + \dfrac{m v^2}{2} + Q$.
HEN: $m g H = m g h + \dfrac{m v^2}{2} + Q$.
SKA: $12\,000 = 9000 + 30 v^2 + 1500 \Rightarrow 30 v^2 = 1500$
$v = \sqrt{50} \approx 7{,}1\ \text{მ/წმ}$
SEN: $12\,000 = 9000 + 30 v^2 + 1500 \Rightarrow 30 v^2 = 1500$
$v = \sqrt{50} \approx 7.1\ \text{m/s}$
AKA: $\approx 7{,}1\ \text{მ/წმ}$
AEN: $\approx 7.1\ \text{m/s}$

--- hard energy
KA: ზამბარაზე ($k = 100\ \text{ნ/მ}$) $1\ \text{კგ}$ ტვირთი ჩამოკიდეს და ნელა დაუშვეს წონასწორობამდე. შემდეგ იგივე ტვირთი დაუტვირთავი ზამბარიდან უცებ გაუშვეს. რამდენჯერ მეტი იქნება მაქსიმალური წაგრძელება მეორე შემთხვევაში?
EN: A $1\ \text{kg}$ load is hung on a spring ($k = 100\ \text{N/m}$) and lowered gently to equilibrium. Then the same load is released suddenly from the unstretched spring. How many times greater is the maximum extension in the second case?
HKA: მეორე შემთხვევაში: $m g x = \dfrac{k x^2}{2}$.
HEN: In the second case: $m g x = \dfrac{k x^2}{2}$.
SKA: ნელა: $x_1 = \dfrac{m g}{k} = 0{,}1\ \text{მ}$
უცებ: $x_2 = \dfrac{2 m g}{k} = 0{,}2\ \text{მ}$
$2$-ჯერ მეტი.
SEN: Gently: $x_1 = \dfrac{m g}{k} = 0.1\ \text{m}$
Suddenly: $x_2 = \dfrac{2 m g}{k} = 0.2\ \text{m}$
Twice as large.
AKA: $2$-ჯერ ($10$ და $20\ \text{სმ}$)
AEN: $2$ times ($10$ and $20\ \text{cm}$)

--- hard energy
KA: მძიმე ქანქარა ($l = 2\ \text{მ}$) ვერტიკალიდან ისეა გადახრილი, რომ ბურთულა $20\ \text{სმ}$-ით აიწია, და გაუშვეს. ვერტიკალურ მდებარეობაში ძაფი ლურსმანს ედება, რომელიც საკიდი წერტილიდან $1{,}5\ \text{მ}$-ითაა ქვემოთ. რა სიმაღლეზე ავა ბურთულა ახლა?
EN: A pendulum ($l = 2\ \text{m}$) is pulled aside so the bob rises $20\ \text{cm}$, then released. At the vertical the string catches on a nail $1.5\ \text{m}$ below the pivot. How high does the bob rise now?
HKA: ლურსმანი ენერგიას არ ცვლის — ბურთულა იმავე სიმაღლეზე ავა.
HEN: The nail does no work — the bob rises to the same height.
SKA: ენერგიის შენახვა: $m g h_1 = m g h_2 \Rightarrow h_2 = 20\ \text{სმ}$ (მოკლე, $0{,}5\ \text{მ}$ ქანქარაზე ეს $h < l$ — შესაძლებელია).
SEN: Energy conservation: $m g h_1 = m g h_2 \Rightarrow h_2 = 20\ \text{cm}$ (on the short $0.5\ \text{m}$ pendulum $h < l$ — possible).
AKA: ისევ $20\ \text{სმ}$
AEN: again $20\ \text{cm}$

--- hard energy
KA: $50\ \text{გ}$ ბურთულა უხახუნო „მარყუჟზე“ მოძრაობს. მარყუჟის ქვედა წერტილში მისი სიჩქარე $6\ \text{მ/წმ}$-ია. რა სიჩქარე ექნება ზედა წერტილში, თუ მარყუჟის დიამეტრია $1\ \text{მ}$? რას უდრის ზედა წერტილში კინეტიკური ენერგია?
EN: A $50\ \text{g}$ ball runs round a frictionless vertical loop. At the bottom its speed is $6\ \text{m/s}$. What is its speed at the top if the loop's diameter is $1\ \text{m}$? What is its kinetic energy there?
HKA: ზედა წერტილი $1\ \text{მ}$-ით მაღლაა.
HEN: The top is $1\ \text{m}$ higher.
SKA: $v^2 = 36 - 2 \cdot 10 \cdot 1 = 16 \Rightarrow v = 4\ \text{მ/წმ}$
$E_k = \dfrac{0{,}05 \cdot 16}{2} = 0{,}4\ \text{ჯ}$
SEN: $v^2 = 36 - 2 \cdot 10 \cdot 1 = 16 \Rightarrow v = 4\ \text{m/s}$
$E_k = \dfrac{0.05 \cdot 16}{2} = 0.4\ \text{J}$
AKA: $4\ \text{მ/წმ}$; $0{,}4\ \text{ჯ}$
AEN: $4\ \text{m/s}$; $0.4\ \text{J}$

--- hard energy
KA: მანქანა ($1\ \text{ტ}$) ძრავის გამორთვის შემდეგ $10\ \text{მ/წმ}$-ით შედის აღმართზე, რომელიც ყოველ $100\ \text{მ}$-ზე $5\ \text{მ}$-ით მაღლდება. წინაღობის ძალაა $500\ \text{ნ}$. რა მანძილს გაივლის აღმართზე?
EN: With the engine off, a $1\ \text{t}$ car enters a slope at $10\ \text{m/s}$; the slope rises $5\ \text{m}$ per $100\ \text{m}$. Resistance is $500\ \text{N}$. How far up the slope does it go?
HKA: $\dfrac{m v^2}{2} = m g \cdot 0{,}05 s + F s$.
HEN: $\dfrac{m v^2}{2} = m g \cdot 0.05 s + F s$.
SKA: $50\,000 = (500 + 500) s$
$s = 50\ \text{მ}$
SEN: $50\,000 = (500 + 500) s$
$s = 50\ \text{m}$
AKA: $50\ \text{მ}$
AEN: $50\ \text{m}$

--- hard energy
KA: ძელი ($1\ \text{კგ}$) $3\ \text{მ/წმ}$-ით სრიალებს ჰორიზონტალურ ზედაპირზე ($\mu = 0{,}2$) და $1\ \text{მ}$-ის გავლის შემდეგ ზამბარას ($k = 100\ \text{ნ/მ}$) ეჯახება. რამდენით შეკუმშავს ზამბარას? (ზამბარის ქვეშაც ხახუნია)
EN: A $1\ \text{kg}$ block slides at $3\ \text{m/s}$ on a horizontal surface ($\mu = 0.2$) and after $1\ \text{m}$ hits a spring ($k = 100\ \text{N/m}$). How much does it compress the spring? (Friction acts under the spring too.)
HKA: $\dfrac{m v^2}{2} = \mu m g (1 + x) + \dfrac{k x^2}{2}$.
HEN: $\dfrac{m v^2}{2} = \mu m g (1 + x) + \dfrac{k x^2}{2}$.
SKA: $4{,}5 = 2(1 + x) + 50 x^2 \Rightarrow 50 x^2 + 2x - 2{,}5 = 0$
$x = \dfrac{-2 + \sqrt{4 + 500}}{100} = \dfrac{-2 + 22{,}45}{100} \approx 0{,}20\ \text{მ}$
SEN: $4.5 = 2(1 + x) + 50 x^2 \Rightarrow 50 x^2 + 2x - 2.5 = 0$
$x = \dfrac{-2 + \sqrt{4 + 500}}{100} = \dfrac{-2 + 22.45}{100} \approx 0.20\ \text{m}$
AKA: $\approx 20\ \text{სმ}$
AEN: $\approx 20\ \text{cm}$

--- hard energy olympiad
KA: ბიჭი სკამიდან ($h = 0{,}5\ \text{მ}$) ხტება და მოხრილი მუხლებით ($s = 0{,}25\ \text{მ}$) ეშვება. რამდენჯერ მეტია იატაკის მხრიდან მოქმედი საშუალო ძალა მის წონაზე? რა იქნებოდა, მუხლები სწორი რომ ჰქონოდა ($s = 2\ \text{სმ}$)?
EN: A boy jumps off a $0.5\ \text{m}$ bench and lands bending his knees, stopping over $0.25\ \text{m}$. How many times his weight is the average force from the floor? What if he kept his legs straight ($s = 2\ \text{cm}$)?
HKA: $(F - m g) s = m g h$ — დამუხრუჭებისას სიმძიმის ძალაც მუშაობს.
HEN: $(F - m g) s = m g h$ — gravity also acts during the stop.
SKA: $\dfrac{F}{m g} = 1 + \dfrac{h}{s}$
მოხრილი: $1 + \dfrac{0{,}5}{0{,}25} = 3$; სწორი: $1 + \dfrac{0{,}5}{0{,}02} = 26$
SEN: $\dfrac{F}{m g} = 1 + \dfrac{h}{s}$
Bent knees: $1 + \dfrac{0.5}{0.25} = 3$; straight: $1 + \dfrac{0.5}{0.02} = 26$
AKA: $3$-ჯერ; $26$-ჯერ
AEN: $3$ times; $26$ times

--- hard energy olympiad
KA: მაგიდაზე დევს $1\ \text{მ}$ სიგრძის ერთგვაროვანი ჯაჭვი, რომლის მეოთხედი მაგიდის კიდიდან ჰკიდია. ხახუნი არ არის. ჯაჭვს უშვებენ. რა სიჩქარე ექნება მას, როცა მთლიანად ჩამოსრიალდება?
EN: A uniform $1\ \text{m}$ chain lies on a frictionless table with a quarter of it hanging over the edge. It is released. What is its speed when the last link leaves the table?
HKA: იპოვეთ მასათა ცენტრის დაწევა: ჩამოკიდებული ნაწილის ცენტრი $\dfrac{l}{8}$-ზეა, ბოლოს მთელი ჯაჭვის — $\dfrac{l}{2}$-ზე.
HEN: Find how far the centre of mass drops: initially the hanging part's centre is at $\dfrac{l}{8}$; finally the whole chain's is at $\dfrac{l}{2}$.
SKA: საწყისი $E_p = -\dfrac{m}{4} g \dfrac{l}{8} = -\dfrac{m g l}{32}$ (მაგიდის დონის მიმართ)
საბოლოო $E_p = -m g \dfrac{l}{2}$
$\dfrac{m v^2}{2} = m g l\left(\dfrac{1}{2} - \dfrac{1}{32}\right) = \dfrac{15}{32} m g l$
$v = \sqrt{\dfrac{15}{16} g l} = \sqrt{9{,}375} \approx 3{,}06\ \text{მ/წმ}$
SEN: Initial $E_p = -\dfrac{m}{4} g \dfrac{l}{8} = -\dfrac{m g l}{32}$ (relative to the table top)
Final $E_p = -m g \dfrac{l}{2}$
$\dfrac{m v^2}{2} = m g l\left(\dfrac{1}{2} - \dfrac{1}{32}\right) = \dfrac{15}{32} m g l$
$v = \sqrt{\dfrac{15}{16} g l} = \sqrt{9.375} \approx 3.06\ \text{m/s}$
AKA: $\approx 3{,}1\ \text{მ/წმ}$
AEN: $\approx 3.1\ \text{m/s}$

--- hard energy olympiad
KA: სამი ერთნაირი ბურთი ერთი სიმაღლიდან ერთნაირი სიჩქარით ისროლეს: ზემოთ, ჰორიზონტალურად და ქვემოთ. რომელს ექნება უდიდესი სიჩქარე მიწასთან? რომელი მივა უფრო გვიან? (ჰაერის წინაღობა არ არის)
EN: Three identical balls are thrown from the same height with the same speed: up, horizontally and down. Which has the greatest speed on reaching the ground? Which arrives last? (No air resistance.)
HKA: მიწასთან სიჩქარე ენერგიით განისაზღვრება.
HEN: The speed at the ground is fixed by energy.
SKA: სამივეს ერთნაირი კინეტიკური და პოტენციური ენერგია აქვს თავიდან, ამიტომ მიწასთან სიჩქარეები **ტოლია**: $v = \sqrt{v_0^2 + 2 g h}$.
ყველაზე გვიან ზემოთ ნასროლი მივა, ყველაზე ადრე — ქვემოთ ნასროლი.
SEN: All three start with the same kinetic and potential energy, so their speeds at the ground are **equal**: $v = \sqrt{v_0^2 + 2 g h}$.
The one thrown up lands last; the one thrown down lands first.
AKA: სიჩქარეები ტოლია; ზემოთ ნასროლი — ბოლოს
AEN: the speeds are equal; the one thrown up lands last

--- hard energy olympiad
KA: მოცურავე $10\ \text{მ}$ სიმაღლის კოშკიდან ხტება წყალში და $3\ \text{მ}$ სიღრმეზე ჩერდება. მისი მასაა $60\ \text{კგ}$. იპოვეთ წყლის წინაღობის საშუალო ძალა (ამომგდები ძალის ჩათვლით).
EN: A $60\ \text{kg}$ diver jumps from a $10\ \text{m}$ tower and stops $3\ \text{m}$ under water. Find the average resisting force of the water (including buoyancy).
HKA: მთელ გზაზე ($13\ \text{მ}$) სიმძიმის ძალის მუშაობა წყლის ძალის მუშაობით ($3\ \text{მ}$) ბათილდება.
HEN: Gravity's work over the whole $13\ \text{m}$ is cancelled by the water's work over $3\ \text{m}$.
SKA: $m g (h + d) = F d$
$F = \dfrac{600 \cdot 13}{3} = 2600\ \text{ნ}$
SEN: $m g (h + d) = F d$
$F = \dfrac{600 \cdot 13}{3} = 2600\ \text{N}$
AKA: $2600\ \text{ნ}$
AEN: $2600\ \text{N}$

--- easy machines
KA: ბერკეტის მოკლე მხარი $20\ \text{სმ}$-ია, გრძელი — $80\ \text{სმ}$. მოკლე მხარზე $400\ \text{ნ}$ ტვირთია. რა ძალით უნდა დავაწვეთ გრძელ მხარს?
EN: A lever's short arm is $20\ \text{cm}$ and its long arm $80\ \text{cm}$. A $400\ \text{N}$ load is on the short arm. What force on the long arm balances it?
HKA: $F_1 l_1 = F_2 l_2$.
HEN: $F_1 l_1 = F_2 l_2$.
SKA: $F = \dfrac{400 \cdot 20}{80} = 100\ \text{ნ}$
SEN: $F = \dfrac{400 \cdot 20}{80} = 100\ \text{N}$
AKA: $100\ \text{ნ}$
AEN: $100\ \text{N}$

--- easy machines
KA: მექანიზმმა $600\ \text{ჯ}$ სასარგებლო მუშაობა შეასრულა, დახარჯული მუშაობა კი $800\ \text{ჯ}$ იყო. იპოვეთ სმკ.
EN: A machine does $600\ \text{J}$ of useful work for $800\ \text{J}$ of input. Find its efficiency.
HKA: $\eta = \dfrac{A_{\text{ს}}}{A_{\text{დ}}}$.
HEN: $\eta = \dfrac{W_{\text{useful}}}{W_{\text{input}}}$.
SKA: $\eta = \dfrac{600}{800} = 0{,}75 = 75\%$
SEN: $\eta = \dfrac{600}{800} = 0.75 = 75\%$
AKA: $75\%$
AEN: $75\%$

--- easy machines
KA: რატომ ვერ იქნება მექანიზმის სმკ $100\%$-ზე მეტი? რატომ არის ის ყოველთვის $100\%$-ზე ნაკლები?
EN: Why can't a machine's efficiency exceed $100\%$? Why is it always below $100\%$?
HKA: იფიქრეთ ენერგიის შენახვაზე და ხახუნზე.
HEN: Think about energy conservation and friction.
SKA: მექანიზმი ენერგიას არ ქმნის — სასარგებლო მუშაობა დახარჯულზე მეტი ვერ იქნება.
ნაწილი ყოველთვის იხარჯება ხახუნზე და თავად მექანიზმის ნაწილების (თოკის, ჭოჭონაქის) აწევაზე.
SEN: A machine creates no energy — useful work can't exceed the work put in.
Some is always lost to friction and to lifting the machine's own parts (rope, pulley).
AKA: ენერგიის შენახვა; ხახუნი და მექანიზმის წონა
AEN: energy conservation; friction and the machine's own weight

--- easy machines
KA: მოძრავი ჭოჭონაქით $30\ \text{კგ}$ ტვირთს წევენ. რა ძალაა საჭირო? (ხახუნი და ჭოჭონაქის მასა უგულებელყავით)
EN: A $30\ \text{kg}$ load is lifted with a movable pulley. What force is needed? (Ignore friction and the pulley's mass.)
HKA: მოძრავი ჭოჭონაქი ძალაში $2$-ჯერ იგებს.
HEN: A movable pulley halves the force.
SKA: $F = \dfrac{300}{2} = 150\ \text{ნ}$
SEN: $F = \dfrac{300}{2} = 150\ \text{N}$
AKA: $150\ \text{ნ}$
AEN: $150\ \text{N}$

--- easy machines
KA: დახრილ სიბრტყეზე ($l = 2\ \text{მ}$, $h = 0{,}5\ \text{მ}$) $40\ \text{კგ}$ ყუთი აიტანეს. რა ძალაა საჭირო ხახუნის გარეშე?
EN: A $40\ \text{kg}$ box is pushed up an incline ($l = 2\ \text{m}$, $h = 0.5\ \text{m}$). What force is needed without friction?
HKA: $F l = m g h$.
HEN: $F l = m g h$.
SKA: $F = \dfrac{400 \cdot 0{,}5}{2} = 100\ \text{ნ}$
SEN: $F = \dfrac{400 \cdot 0.5}{2} = 100\ \text{N}$
AKA: $100\ \text{ნ}$
AEN: $100\ \text{N}$

--- easy machines
KA: ჩამოაყალიბეთ მექანიკის „ოქროს წესი“ და აჩვენეთ ის ბერკეტის მაგალითზე.
EN: State the "golden rule" of mechanics and show it with a lever.
HKA: რამდენჯერაც ვიგებთ ძალაში, იმდენჯერვე ვკარგავთ მანძილში.
HEN: Whatever you gain in force, you lose in distance.
SKA: არც ერთი მარტივი მექანიზმი მუშაობაში მოგებას არ იძლევა.
ბერკეტი $l_2 : l_1 = 4 : 1$: ძალა $4$-ჯერ ნაკლებია, მაგრამ გრძელი მხრის ბოლო $4$-ჯერ მეტ მანძილს გადის, ასე რომ $F_1 s_1 = F_2 s_2$.
SEN: No simple machine gives a gain in work.
A lever with $l_2 : l_1 = 4 : 1$: the force is $4$ times smaller, but the long end moves $4$ times as far, so $F_1 s_1 = F_2 s_2$.
AKA: მუშაობაში მოგება არ არის
AEN: there is no gain in work

--- easy machines
KA: რომელი მარტივი მექანიზმია: ა) კიბე ნაგებობაზე ასასვლელად; ბ) ცალი ნიჩბით ნავის მართვა; გ) ჭის ჯალამბარი; დ) ცული?
EN: Which simple machine is: a) a ramp up to a building; b) an oar; c) a well winch; d) an axe?
HKA: ბერკეტი, დახრილი სიბრტყე, ჯალამბარი (ჭოჭონაქის ნაირსახეობა), სოლი.
HEN: Lever, inclined plane, wheel and axle, wedge.
SKA: ა) დახრილი სიბრტყე; ბ) ბერკეტი; გ) ჯალამბარი (ბორბალი და ღერძი — ბერკეტის სახე); დ) სოლი (ორმხრივი დახრილი სიბრტყე).
SEN: a) inclined plane; b) lever; c) wheel and axle (a kind of lever); d) wedge (a double inclined plane).
AKA: ა) დახრილი სიბრტყე; ბ) ბერკეტი; გ) ჯალამბარი; დ) სოლი
AEN: a) inclined plane; b) lever; c) wheel and axle; d) wedge

--- easy machines
KA: ჯალამბარის სახელურის მხარი $50\ \text{სმ}$-ია, ლილვის რადიუსი — $10\ \text{სმ}$. რა ძალით უნდა დავატრიალოთ სახელური, რომ $250\ \text{ნ}$ ვედრო ავწიოთ?
EN: A winch handle has an arm of $50\ \text{cm}$ and the drum's radius is $10\ \text{cm}$. What force on the handle lifts a $250\ \text{N}$ bucket?
HKA: ჯალამბარი ბერკეტივით მუშაობს: $F R = P r$.
HEN: A winch works like a lever: $F R = W r$.
SKA: $F = \dfrac{250 \cdot 10}{50} = 50\ \text{ნ}$
SEN: $F = \dfrac{250 \cdot 10}{50} = 50\ \text{N}$
AKA: $50\ \text{ნ}$
AEN: $50\ \text{N}$

--- easy machines
KA: მექანიზმის სმკ $80\%$-ია. რა მუშაობა უნდა დავხარჯოთ $400\ \text{ჯ}$ სასარგებლო მუშაობის შესასრულებლად?
EN: A machine is $80\%$ efficient. How much work must be put in to get $400\ \text{J}$ of useful work?
HKA: $A_{\text{დ}} = \dfrac{A_{\text{ს}}}{\eta}$.
HEN: $W_{\text{in}} = \dfrac{W_{\text{useful}}}{\eta}$.
SKA: $A_{\text{დ}} = \dfrac{400}{0{,}8} = 500\ \text{ჯ}$
SEN: $W_{\text{in}} = \dfrac{400}{0.8} = 500\ \text{J}$
AKA: $500\ \text{ჯ}$
AEN: $500\ \text{J}$

--- easy machines
KA: ბერკეტზე ტვირთი $10\ \text{სმ}$-ით აიწია, როცა მეორე ბოლო $50\ \text{სმ}$-ით დავწიეთ. რამდენჯერ იგებს ბერკეტი ძალაში?
EN: A lever raises a load $10\ \text{cm}$ while the other end is pushed down $50\ \text{cm}$. What is the lever's force gain?
HKA: ოქროს წესი: $F_1 s_1 = F_2 s_2$.
HEN: Golden rule: $F_1 s_1 = F_2 s_2$.
SKA: $\dfrac{F_2}{F_1} = \dfrac{s_1}{s_2} = \dfrac{50}{10} = 5$
SEN: $\dfrac{F_2}{F_1} = \dfrac{s_1}{s_2} = \dfrac{50}{10} = 5$
AKA: $5$-ჯერ
AEN: $5$ times

--- easy machines
KA: ძალის მომენტი რას უდრის, თუ $20\ \text{ნ}$ ძალა მოქმედებს $0{,}3\ \text{მ}$ მხარზე?
EN: What is the moment of a $20\ \text{N}$ force acting with an arm of $0.3\ \text{m}$?
HKA: $M = F l$.
HEN: $M = F l$.
SKA: $M = 20 \cdot 0{,}3 = 6\ \text{ნ·მ}$
SEN: $M = 20 \cdot 0.3 = 6\ \text{N·m}$
AKA: $6\ \text{ნ·მ}$
AEN: $6\ \text{N·m}$

--- easy machines
KA: რატომ არის კარის სახელური საკინძებიდან შორს დამაგრებული?
EN: Why is a door handle placed far from the hinges?
HKA: იფიქრეთ ძალის მომენტზე.
HEN: Think about the moment of the force.
SKA: კარის გასაღებად საჭიროა გარკვეული მომენტი $M = F l$. რაც მეტია მხარი $l$, მით ნაკლები ძალა $F$ გვჭირდება.
SEN: Opening the door needs a certain moment $M = F l$. The bigger the arm $l$, the smaller the force $F$ needed.
AKA: დიდი მხარი — ნაკლები ძალა
AEN: a longer arm needs less force

--- medium machines
KA: ჭოჭონაქთა სისტემით (მოძრავი ბლოკი $6$ თოკის მონაკვეთზე ჰკიდია) $900\ \text{ნ}$ ტვირთს წევენ $180\ \text{ნ}$ ძალით. იპოვეთ სმკ.
EN: A block and tackle whose moving block hangs on $6$ rope segments lifts a $900\ \text{N}$ load with a $180\ \text{N}$ pull. Find the efficiency.
HKA: თოკის ბოლო $6$-ჯერ მეტ მანძილს გადის.
HEN: The free end of the rope moves $6$ times as far.
SKA: $\eta = \dfrac{P h}{F \cdot 6h} = \dfrac{900}{180 \cdot 6} = \dfrac{900}{1080} \approx 0{,}83 = 83\%$
SEN: $\eta = \dfrac{W h}{F \cdot 6h} = \dfrac{900}{180 \cdot 6} = \dfrac{900}{1080} \approx 0.83 = 83\%$
AKA: $\approx 83\%$
AEN: $\approx 83\%$

--- medium machines
KA: $3\ \text{მ}$ სიგრძის ერთგვაროვანი ძელი ($60\ \text{კგ}$) საყრდენზე დევს, რომელიც მარცხენა ბოლოდან $1\ \text{მ}$-შია. რა ძალით უნდა დავაწვეთ ქვემოთ მარცხენა ბოლოს, რომ ძელი ჰორიზონტალური იყოს?
EN: A uniform $3\ \text{m}$ beam ($60\ \text{kg}$) rests on a pivot $1\ \text{m}$ from its left end. What downward force on the left end keeps it horizontal?
HKA: ძელის წონის მხარი საყრდენიდან $0{,}5\ \text{მ}$-ია.
HEN: The beam's weight acts $0.5\ \text{m}$ from the pivot.
SKA: $F \cdot 1 = 600 \cdot 0{,}5 \Rightarrow F = 300\ \text{ნ}$
SEN: $F \cdot 1 = 600 \cdot 0.5 \Rightarrow F = 300\ \text{N}$
AKA: $300\ \text{ნ}$
AEN: $300\ \text{N}$

--- medium machines
KA: დახრილ სიბრტყეზე ($l = 6\ \text{მ}$, $h = 1{,}5\ \text{მ}$) $120\ \text{კგ}$ კასრი ააგორეს. სმკ $75\%$-ია. რა ძალა იყო საჭირო?
EN: A $120\ \text{kg}$ barrel is rolled up an incline ($l = 6\ \text{m}$, $h = 1.5\ \text{m}$) with $75\%$ efficiency. What force was needed?
HKA: $F = \dfrac{m g h}{\eta l}$.
HEN: $F = \dfrac{m g h}{\eta l}$.
SKA: $F = \dfrac{1200 \cdot 1{,}5}{0{,}75 \cdot 6} = \dfrac{1800}{4{,}5} = 400\ \text{ნ}$
SEN: $F = \dfrac{1200 \cdot 1.5}{0.75 \cdot 6} = \dfrac{1800}{4.5} = 400\ \text{N}$
AKA: $400\ \text{ნ}$
AEN: $400\ \text{N}$

--- medium machines
KA: ამწე, რომლის სიმძლავრეა $10\ \text{კვტ}$ და სმკ $80\%$, $2\ \text{ტ}$ ტვირთს წევს. რა სიჩქარით აიწევს ტვირთი?
EN: A crane of power $10\ \text{kW}$ and efficiency $80\%$ lifts a $2\ \text{t}$ load. How fast does the load rise?
HKA: სასარგებლო სიმძლავრე $\eta N = m g v$.
HEN: Useful power $\eta P = m g v$.
SKA: $v = \dfrac{0{,}8 \cdot 10\,000}{20\,000} = 0{,}4\ \text{მ/წმ}$
SEN: $v = \dfrac{0.8 \cdot 10\,000}{20\,000} = 0.4\ \text{m/s}$
AKA: $0{,}4\ \text{მ/წმ}$
AEN: $0.4\ \text{m/s}$

--- medium machines
KA: ორ მუშას $2\ \text{მ}$ სიგრძის ჯოხზე $90\ \text{კგ}$ ტვირთი მიაქვთ. ტვირთი პირველი მუშიდან $0{,}8\ \text{მ}$-ზე ჰკიდია. რა ძალით აწვება ჯოხი თითოეულს? (ჯოხის მასა უგულებელყავით)
EN: Two workers carry a $90\ \text{kg}$ load on a $2\ \text{m}$ pole. The load hangs $0.8\ \text{m}$ from the first worker. What force does each worker bear? (Ignore the pole's mass.)
HKA: მომენტები ერთი მუშის მიმართ.
HEN: Take moments about one worker.
SKA: $F_2 \cdot 2 = 900 \cdot 0{,}8 \Rightarrow F_2 = 360\ \text{ნ}$
$F_1 = 900 - 360 = 540\ \text{ნ}$
SEN: $F_2 \cdot 2 = 900 \cdot 0.8 \Rightarrow F_2 = 360\ \text{N}$
$F_1 = 900 - 360 = 540\ \text{N}$
AKA: პირველს $540\ \text{ნ}$, მეორეს $360\ \text{ნ}$
AEN: first $540\ \text{N}$, second $360\ \text{N}$

--- medium machines
KA: მოძრავი ჭოჭონაქით $45\ \text{კგ}$ ტვირთი $4\ \text{მ}$-ზე აიწიეს $250\ \text{ნ}$ ძალით. იპოვეთ სასარგებლო და დახარჯული მუშაობა და სმკ.
EN: A movable pulley lifts a $45\ \text{kg}$ load $4\ \text{m}$ with a $250\ \text{N}$ pull. Find the useful work, the input work and the efficiency.
HKA: თოკის ბოლო $8\ \text{მ}$-ს გადის.
HEN: The rope's end moves $8\ \text{m}$.
SKA: $A_{\text{ს}} = 450 \cdot 4 = 1800\ \text{ჯ}$, $\ A_{\text{დ}} = 250 \cdot 8 = 2000\ \text{ჯ}$
$\eta = 0{,}9 = 90\%$
SEN: $W_{\text{u}} = 450 \cdot 4 = 1800\ \text{J}$, $\ W_{\text{in}} = 250 \cdot 8 = 2000\ \text{J}$
$\eta = 0.9 = 90\%$
AKA: $1800\ \text{ჯ}$; $2000\ \text{ჯ}$; $90\%$
AEN: $1800\ \text{J}$; $2000\ \text{J}$; $90\%$

--- medium machines
KA: ნიჩაბი $1{,}5\ \text{მ}$ სიგრძისაა, ხელები ერთმანეთისგან $0{,}5\ \text{მ}$-ზეა: ზედა ხელი ბოლოზე (საყრდენი), ქვედა ხელი ზედადან $0{,}5\ \text{მ}$-ზე. ნიჩბის ბოლოზე $30\ \text{ნ}$ მიწაა. რა ძალით აწევს ქვედა ხელი?
EN: A $1.5\ \text{m}$ shovel is held with the top hand at the end (pivot) and the lower hand $0.5\ \text{m}$ below it. There is $30\ \text{N}$ of soil on the blade at the far end. What force does the lower hand lift with?
HKA: ზედა ხელი საყრდენია, მიწის წონის მხარი — $1{,}5\ \text{მ}$.
HEN: The top hand is the pivot; the soil's arm is $1.5\ \text{m}$.
SKA: $F \cdot 0{,}5 = 30 \cdot 1{,}5 \Rightarrow F = 90\ \text{ნ}$ — ასეთი ბერკეტი ძალაში აგებს, მაგრამ მანძილში იგებს.
SEN: $F \cdot 0.5 = 30 \cdot 1.5 \Rightarrow F = 90\ \text{N}$ — this lever loses in force but gains in distance.
AKA: $90\ \text{ნ}$
AEN: $90\ \text{N}$

--- medium machines
KA: დახრილი სიბრტყის სიმაღლეა $1\ \text{მ}$. ხახუნის გარეშე $500\ \text{ნ}$ ტვირთის ასატანად $125\ \text{ნ}$ ძალაა საჭირო. რა სიგრძისაა სიბრტყე? რამდენ მუშაობას დაიხარჯავს, თუ სმკ $80\%$-ია?
EN: An incline is $1\ \text{m}$ high. Without friction a $500\ \text{N}$ load needs $125\ \text{N}$ to push it up. How long is the incline? How much work is needed if the efficiency is $80\%$?
HKA: $F l = P h$; $A = \dfrac{P h}{\eta}$.
HEN: $F l = W h$; $W_{\text{in}} = \dfrac{W h}{\eta}$.
SKA: $l = \dfrac{500 \cdot 1}{125} = 4\ \text{მ}$
$A = \dfrac{500}{0{,}8} = 625\ \text{ჯ}$
SEN: $l = \dfrac{500 \cdot 1}{125} = 4\ \text{m}$
$W_{\text{in}} = \dfrac{500}{0.8} = 625\ \text{J}$
AKA: $4\ \text{მ}$; $625\ \text{ჯ}$
AEN: $4\ \text{m}$; $625\ \text{J}$

--- medium machines
KA: ტუმბოს ძრავის სიმძლავრეა $2\ \text{კვტ}$, სმკ — $70\%$. რამდენ წყალს ამოტუმბავს ის $10\ \text{მ}$ სიღრმიდან $1$ საათში?
EN: A pump's motor has $2\ \text{kW}$ power and $70\%$ efficiency. How much water does it raise from $10\ \text{m}$ in $1$ hour?
HKA: $\eta N t = m g h$.
HEN: $\eta P t = m g h$.
SKA: $m = \dfrac{0{,}7 \cdot 2000 \cdot 3600}{10 \cdot 10} = 50\,400\ \text{კგ} \approx 50\ \text{მ}^3$
SEN: $m = \dfrac{0.7 \cdot 2000 \cdot 3600}{10 \cdot 10} = 50\,400\ \text{kg} \approx 50\ \text{m}^3$
AKA: $\approx 50\ \text{ტ}$
AEN: $\approx 50\ \text{t}$

--- medium machines
KA: ბერკეტიანი მაკრატლის პირი მაკრატლის ღერძიდან $2\ \text{სმ}$-ზე ჭრის მავთულს, ხელი კი ღერძიდან $10\ \text{სმ}$-ზე $40\ \text{ნ}$-ით აწვება. რა ძალით მოქმედებს პირი მავთულზე?
EN: Wire cutters grip the wire $2\ \text{cm}$ from the pivot, and the hand squeezes with $40\ \text{N}$ at $10\ \text{cm}$ from the pivot. What force acts on the wire?
HKA: $F_1 l_1 = F_2 l_2$.
HEN: $F_1 l_1 = F_2 l_2$.
SKA: $F = \dfrac{40 \cdot 10}{2} = 200\ \text{ნ}$
SEN: $F = \dfrac{40 \cdot 10}{2} = 200\ \text{N}$
AKA: $200\ \text{ნ}$
AEN: $200\ \text{N}$

--- medium machines
KA: ბერკეტის ერთ მხარზე, საყრდენიდან $40\ \text{სმ}$-ზე, $5\ \text{კგ}$ ტვირთი ჰკიდია, იმავე მხარზე $20\ \text{სმ}$-ზე — $2\ \text{კგ}$. მეორე მხარზე სად უნდა ჩამოვკიდოთ $6\ \text{კგ}$, რომ წონასწორობა იყოს?
EN: On one side of a lever hang $5\ \text{kg}$ at $40\ \text{cm}$ and $2\ \text{kg}$ at $20\ \text{cm}$ from the pivot. Where on the other side must $6\ \text{kg}$ hang for balance?
HKA: ერთი მხარის მომენტები იკრიბება.
HEN: The moments on one side add up.
SKA: $5 \cdot 40 + 2 \cdot 20 = 240 = 6 x \Rightarrow x = 40\ \text{სმ}$
SEN: $5 \cdot 40 + 2 \cdot 20 = 240 = 6 x \Rightarrow x = 40\ \text{cm}$
AKA: $40\ \text{სმ}$-ზე
AEN: at $40\ \text{cm}$

--- hard machines
KA: ერთგვაროვანი ძელი ($4\ \text{მ}$, $40\ \text{კგ}$) მაგიდაზე ისე დევს, რომ $1{,}5\ \text{მ}$ გამოშვერილია. გამოშვერილ ბოლოზე რა უდიდესი მასის ტვირთი შეიძლება ჩამოვკიდოთ ისე, რომ ძელი არ გადაბრუნდეს?
EN: A uniform beam ($4\ \text{m}$, $40\ \text{kg}$) lies on a table with $1.5\ \text{m}$ overhanging. What is the heaviest load that can hang from the overhanging end without tipping it?
HKA: საყრდენი — მაგიდის კიდე; ძელის ცენტრი კიდიდან $0{,}5\ \text{მ}$-ზეა მაგიდის მხარეს.
HEN: The pivot is the table edge; the beam's centre is $0.5\ \text{m}$ in from the edge.
SKA: $m g \cdot 1{,}5 = 400 \cdot 0{,}5 \Rightarrow m = \dfrac{200}{15} \approx 13{,}3\ \text{კგ}$
SEN: $m g \cdot 1.5 = 400 \cdot 0.5 \Rightarrow m = \dfrac{200}{15} \approx 13.3\ \text{kg}$
AKA: $\approx 13{,}3\ \text{კგ}$
AEN: $\approx 13.3\ \text{kg}$

--- hard machines
KA: დახრილ სიბრტყეზე ($l = 5\ \text{მ}$, $h = 3\ \text{მ}$) $20\ \text{კგ}$ ყუთი თანაბრად აჰყავთ; ხახუნის ძალაა $40\ \text{ნ}$. იპოვეთ წევის ძალა და სმკ.
EN: A $20\ \text{kg}$ box is pulled uniformly up an incline ($l = 5\ \text{m}$, $h = 3\ \text{m}$); friction is $40\ \text{N}$. Find the pulling force and the efficiency.
HKA: $F l = m g h + F_{\text{ხ}} l$.
HEN: $F l = m g h + F_{\text{fr}} l$.
SKA: $F = \dfrac{200 \cdot 3}{5} + 40 = 120 + 40 = 160\ \text{ნ}$
$\eta = \dfrac{600}{160 \cdot 5} = 0{,}75 = 75\%$
SEN: $F = \dfrac{200 \cdot 3}{5} + 40 = 120 + 40 = 160\ \text{N}$
$\eta = \dfrac{600}{160 \cdot 5} = 0.75 = 75\%$
AKA: $160\ \text{ნ}$; $75\%$
AEN: $160\ \text{N}$; $75\%$

--- hard machines
KA: ჭოჭონაქთა სისტემის სმკ $80\%$-ია, მოძრავი ბლოკი $4$ თოკის მონაკვეთზე ჰკიდია. რა ძალით უნდა ვქაჩოთ $200\ \text{კგ}$ ტვირთის ასაწევად? რამდენი მუშაობა დაიხარჯება ტვირთის $5\ \text{მ}$-ით აწევისას?
EN: A block and tackle with $4$ rope segments on the moving block is $80\%$ efficient. What pull lifts a $200\ \text{kg}$ load? How much work is put in to raise it $5\ \text{m}$?
HKA: $\eta = \dfrac{P}{4F}$.
HEN: $\eta = \dfrac{W}{4F}$.
SKA: $F = \dfrac{2000}{4 \cdot 0{,}8} = 625\ \text{ნ}$
$A = 625 \cdot 20 = 12\,500\ \text{ჯ}$
SEN: $F = \dfrac{2000}{4 \cdot 0.8} = 625\ \text{N}$
$W = 625 \cdot 20 = 12\,500\ \text{J}$
AKA: $625\ \text{ნ}$; $12{,}5\ \text{კჯ}$
AEN: $625\ \text{N}$; $12.5\ \text{kJ}$

--- hard machines
KA: ძელი ($l = 2\ \text{მ}$, $m = 10\ \text{კგ}$) ერთი ბოლოთი საკინძზეა კედელზე დამაგრებული, მეორე ბოლოთი ჰორიზონტალურად თოკით უჭირავს ვერტიკალურად ზემოთ. ძელის შუაში $20\ \text{კგ}$ ტვირთია ჩამოკიდებული. იპოვეთ თოკის დაჭიმულობა.
EN: A beam ($l = 2\ \text{m}$, $m = 10\ \text{kg}$) is hinged to a wall at one end and held horizontal by a vertical rope at the other. A $20\ \text{kg}$ load hangs from its middle. Find the rope tension.
HKA: მომენტები საკინძის მიმართ.
HEN: Take moments about the hinge.
SKA: $T \cdot 2 = (100 + 200) \cdot 1 \Rightarrow T = 150\ \text{ნ}$
SEN: $T \cdot 2 = (100 + 200) \cdot 1 \Rightarrow T = 150\ \text{N}$
AKA: $150\ \text{ნ}$
AEN: $150\ \text{N}$

--- hard machines
KA: ხახუნისა და ჭოჭონაქების მასის გამო სისტემის სმკ $75\%$-ია. ტვირთი ($60\ \text{კგ}$) $2$ წუთში $12\ \text{მ}$-ზე აიწია. რა სიმძლავრე განავითარა მუშამ?
EN: Because of friction and the pulleys' mass a lifting system is $75\%$ efficient. A $60\ \text{kg}$ load is raised $12\ \text{m}$ in $2$ minutes. What power does the worker develop?
HKA: $N = \dfrac{m g h}{\eta t}$.
HEN: $P = \dfrac{m g h}{\eta t}$.
SKA: $A_{\text{ს}} = 600 \cdot 12 = 7200\ \text{ჯ}$, $\ A_{\text{დ}} = \dfrac{7200}{0{,}75} = 9600\ \text{ჯ}$
$N = \dfrac{9600}{120} = 80\ \text{ვტ}$
SEN: $W_{\text{u}} = 600 \cdot 12 = 7200\ \text{J}$, $\ W_{\text{in}} = \dfrac{7200}{0.75} = 9600\ \text{J}$
$P = \dfrac{9600}{120} = 80\ \text{W}$
AKA: $80\ \text{ვტ}$
AEN: $80\ \text{W}$

--- hard machines
KA: კიბე ($3\ \text{მ}$, $15\ \text{კგ}$) გლუვ კედელს ეყრდნობა. კიბის ქვედა ბოლო კედლიდან $1{,}8\ \text{მ}$-შია. რა ძალით აწვება კიბე კედელს? (კედელზე ხახუნი არ არის)
EN: A ladder ($3\ \text{m}$, $15\ \text{kg}$) leans against a smooth wall with its foot $1.8\ \text{m}$ from the wall. With what force does it push on the wall? (No friction at the wall.)
HKA: კიბის ზედა ბოლოს სიმაღლე $\sqrt{3^2 - 1{,}8^2} = 2{,}4\ \text{მ}$. მომენტები ქვედა ბოლოს მიმართ.
HEN: The top is at height $\sqrt{3^2 - 1.8^2} = 2.4\ \text{m}$. Take moments about the foot.
SKA: კედლის ძალა $N$ ჰორიზონტალურია, მისი მხარი $2{,}4\ \text{მ}$; წონის მხარი $0{,}9\ \text{მ}$.
$N \cdot 2{,}4 = 150 \cdot 0{,}9 \Rightarrow N = 56{,}25\ \text{ნ}$
SEN: The wall's force $N$ is horizontal with arm $2.4\ \text{m}$; the weight's arm is $0.9\ \text{m}$.
$N \cdot 2.4 = 150 \cdot 0.9 \Rightarrow N = 56.25\ \text{N}$
AKA: $\approx 56\ \text{ნ}$
AEN: $\approx 56\ \text{N}$

--- hard machines
KA: დიფერენციალური ჯალამბარის ლილვს ორი ნაწილი აქვს, $R = 12\ \text{სმ}$ და $r = 10\ \text{სმ}$; თოკი ერთზე იხვევა, მეორიდან იხსნება, ტვირთი მოძრავ ჭოჭონაქზეა. სახელურის მხარი $50\ \text{სმ}$-ია. რა ძალით ავწევთ $1000\ \text{ნ}$ ტვირთს (ხახუნის გარეშე)?
EN: A differential windlass has a drum with radii $R = 12\ \text{cm}$ and $r = 10\ \text{cm}$; the rope winds onto one and off the other, with the load on a movable pulley. The handle's arm is $50\ \text{cm}$. What force lifts a $1000\ \text{N}$ load (no friction)?
HKA: სახელურის ერთ ბრუნზე ტვირთი $\dfrac{2\pi(R - r)}{2}$-ით აიწევს. გამოიყენეთ ოქროს წესი.
HEN: In one turn of the handle the load rises $\dfrac{2\pi(R - r)}{2}$. Use the golden rule.
SKA: $F \cdot 2\pi \cdot 0{,}5 = 1000 \cdot \pi (0{,}12 - 0{,}10)$
$F = \dfrac{1000 \cdot 0{,}02}{1} = 20\ \text{ნ}$
SEN: $F \cdot 2\pi \cdot 0.5 = 1000 \cdot \pi (0.12 - 0.10)$
$F = \dfrac{1000 \cdot 0.02}{1} = 20\ \text{N}$
AKA: $20\ \text{ნ}$
AEN: $20\ \text{N}$

--- hard machines
KA: სამი მოძრავი ჭოჭონაქი მიმდევრობითაა შეერთებული (თითოეული ძალას $2$-ჯერ ამცირებს), თითოეულის მასაა $1\ \text{კგ}$. რა ძალით ავწევთ $80\ \text{კგ}$ ტვირთს?
EN: Three movable pulleys are connected in series (each halves the force); each pulley has mass $1\ \text{kg}$. What force lifts an $80\ \text{kg}$ load?
HKA: ყოველი ჭოჭონაქის წონა მის თოკს ემატება.
HEN: Each pulley's weight adds to the load on its rope.
SKA: I: $T_1 = \dfrac{800 + 10}{2} = 405\ \text{ნ}$
II: $T_2 = \dfrac{405 + 10}{2} = 207{,}5\ \text{ნ}$
III: $F = \dfrac{207{,}5 + 10}{2} = 108{,}75\ \text{ნ}$
SEN: I: $T_1 = \dfrac{800 + 10}{2} = 405\ \text{N}$
II: $T_2 = \dfrac{405 + 10}{2} = 207.5\ \text{N}$
III: $F = \dfrac{207.5 + 10}{2} = 108.75\ \text{N}$
AKA: $\approx 109\ \text{ნ}$
AEN: $\approx 109\ \text{N}$

--- hard machines
KA: ძელი ($2\ \text{მ}$) ორ სასწორზე დევს ბოლოებით. მარცხენა $300\ \text{ნ}$-ს აჩვენებს, მარჯვენა — $200\ \text{ნ}$-ს. იპოვეთ ძელის წონა და მისი სიმძიმის ცენტრის მდებარეობა.
EN: A $2\ \text{m}$ log rests with its ends on two scales. The left reads $300\ \text{N}$, the right $200\ \text{N}$. Find the log's weight and where its centre of gravity is.
HKA: წონა — ჩვენებების ჯამი; ცენტრი — მომენტების ტოლობიდან.
HEN: Weight — the sum of the readings; centre — from the moments.
SKA: $P = 500\ \text{ნ}$
მარცხენა ბოლოს მიმართ: $500 x = 200 \cdot 2 \Rightarrow x = 0{,}8\ \text{მ}$
SEN: $W = 500\ \text{N}$
About the left end: $500 x = 200 \cdot 2 \Rightarrow x = 0.8\ \text{m}$
AKA: $500\ \text{ნ}$; მარცხენა ბოლოდან $0{,}8\ \text{მ}$-ზე
AEN: $500\ \text{N}$; $0.8\ \text{m}$ from the left end

--- hard machines olympiad
KA: ერთგვაროვანი ჯოხი შუაში მოხარეს $90°$-ით და ერთი ბოლოთი ჩამოკიდეს. რა კუთხეს ქმნის ზედა ნახევარი ვერტიკალთან?
EN: A uniform rod is bent at its middle into a right angle and hung from one end. What angle does the upper half make with the vertical?
HKA: წონასწორობისას სიმძიმის ცენტრი საკიდი წერტილის ქვეშაა. ორი ნახევრის ცენტრები მათ შუა წერტილებშია.
HEN: In equilibrium the centre of gravity lies below the suspension point. Each half's centre is at its midpoint.
SKA: ნახევრის სიგრძე $a$. საკიდი წერტილი $O$, მოხრის წერტილი $B$, ზედა ნახევარი ვერტიკალთან $\alpha$ კუთხეს ქმნის.
ჰორიზონტალური გადახრები: ზედა ნახევრის ცენტრი — $\dfrac{a}{2}\sin\alpha$; ქვედა ნახევრის ცენტრი — $a \sin\alpha - \dfrac{a}{2}\cos\alpha$.
ჯამი ნულია: $\dfrac{1}{2}\sin\alpha + \sin\alpha - \dfrac{1}{2}\cos\alpha = 0 \Rightarrow \tan\alpha = \dfrac{1}{3}$
$\alpha \approx 18{,}4°$
SEN: Let each half have length $a$; suspension point $O$, bend $B$, upper half at angle $\alpha$ to the vertical.
Horizontal offsets: upper half's centre — $\dfrac{a}{2}\sin\alpha$; lower half's centre — $a \sin\alpha - \dfrac{a}{2}\cos\alpha$.
Their sum is zero: $\dfrac{1}{2}\sin\alpha + \sin\alpha - \dfrac{1}{2}\cos\alpha = 0 \Rightarrow \tan\alpha = \dfrac{1}{3}$
$\alpha \approx 18.4°$
AKA: $\tan\alpha = \dfrac{1}{3}$, $\alpha \approx 18{,}4°$
AEN: $\tan\alpha = \dfrac{1}{3}$, $\alpha \approx 18.4°$

--- hard machines olympiad
KA: ერთნაირი აგურები ($l = 24\ \text{სმ}$) მაგიდის კიდეზე ერთმანეთზე ისე აწყვია, რომ თითოეული ქვედაზე მაქსიმალურადაა გადმოწეული. რამდენით შეიძლება გადმოიწიოს ზედა აგური მაგიდის კიდიდან, თუ სულ $3$ აგურია?
EN: Identical bricks ($l = 24\ \text{cm}$) are stacked at the edge of a table, each pushed out as far as possible over the one below. With $3$ bricks, how far can the top brick stick out beyond the table edge?
HKA: ზედა აგური ქვედაზე $\dfrac{l}{2}$-ით, ორი ზედა — მესამეზე $\dfrac{l}{4}$-ით, სამი — მაგიდაზე $\dfrac{l}{6}$-ით.
HEN: The top brick overhangs the next by $\dfrac{l}{2}$, the top two overhang the third by $\dfrac{l}{4}$, all three overhang the table by $\dfrac{l}{6}$.
SKA: $d = \dfrac{l}{2} + \dfrac{l}{4} + \dfrac{l}{6} = \dfrac{11}{12} l = \dfrac{11}{12} \cdot 24 = 22\ \text{სმ}$
SEN: $d = \dfrac{l}{2} + \dfrac{l}{4} + \dfrac{l}{6} = \dfrac{11}{12} l = \dfrac{11}{12} \cdot 24 = 22\ \text{cm}$
AKA: $22\ \text{სმ}$
AEN: $22\ \text{cm}$

--- hard machines olympiad
KA: რომელიმე მექანიზმი ტვირთს $90\%$-იანი სმკ-ით სწევს. ის თავად $3$ ნაწილისგან შედგება, რომელთა სმკ-ებია $\eta_1 = 0{,}98$, $\eta_2 = 0{,}95$ და $\eta_3$. იპოვეთ $\eta_3$. რა ზოგადი წესი გამოდის?
EN: A machine lifts loads with $90\%$ efficiency. It consists of $3$ stages in series with efficiencies $\eta_1 = 0.98$, $\eta_2 = 0.95$ and $\eta_3$. Find $\eta_3$. What general rule follows?
HKA: მიმდევრობით შეერთებული მექანიზმების სმკ-ები მრავლდება.
HEN: Efficiencies of stages in series multiply.
SKA: $\eta = \eta_1 \eta_2 \eta_3 \Rightarrow \eta_3 = \dfrac{0{,}9}{0{,}98 \cdot 0{,}95} = \dfrac{0{,}9}{0{,}931} \approx 0{,}967$
საერთო სმკ ყოველთვის ნაკლებია თითოეული ნაწილის სმკ-ზე.
SEN: $\eta = \eta_1 \eta_2 \eta_3 \Rightarrow \eta_3 = \dfrac{0.9}{0.98 \cdot 0.95} = \dfrac{0.9}{0.931} \approx 0.967$
The overall efficiency is always lower than that of any single stage.
AKA: $\eta_3 \approx 96{,}7\%$
AEN: $\eta_3 \approx 96.7\%$

--- hard machines olympiad
KA: როგორ ავწონოთ სხეული ზუსტად დაზიანებულ სასწორზე (უტოლო მხრები ან უტოლო თეფშები), თუ მხოლოდ საწონები გვაქვს? (ბორდას ჩანაცვლების მეთოდი)
EN: How can you weigh a body accurately on a faulty balance (unequal arms or unequal pans) using only a set of weights? (Borda's substitution method.)
HKA: სხეული ჯერ რაიმე ტვირთით (ქვიშით) გააწონასწორეთ, შემდეგ სხეული საწონებით შეცვალეთ.
HEN: First balance the body with some tare (sand), then replace the body with weights.
SKA: სხეული დადეთ ერთ თეფშზე და მეორეზე ქვიშით გააწონასწორეთ.
სხეული მოხსენით და მის ადგილას საწონები დადეთ, სანამ ისევ ქვიშას არ გააწონასწორებს.
საწონებს და სხეულს ერთნაირი თეფში და ერთნაირი მხარი აქვს, ამიტომ მათი მასები ზუსტად ტოლია — სასწორის დეფექტი გავლენას ვერ ახდენს.
SEN: Put the body on one pan and balance it with sand on the other.
Remove the body and put weights in its place until the sand is balanced again.
The weights sit on the same pan with the same arm as the body did, so their masses are exactly equal — the balance's fault cancels out.
AKA: ჩანაცვლების მეთოდი: სხეული — ქვიშა, შემდეგ სხეულის ნაცვლად საწონები
AEN: substitution: balance the body with tare, then replace the body with weights

--- medium machines
KA: მანქანის დომკრატი ხრახნიანია: სახელურის მხარი $30\ \text{სმ}$-ია, ხრახნის ბიჯი (ერთ ბრუნზე აწევა) — $5\ \text{მმ}$. რა ძალაა საჭირო $6\ \text{კნ}$ დატვირთვის ასაწევად, თუ სმკ $40\%$-ია?
EN: A screw jack has a $30\ \text{cm}$ handle and a pitch of $5\ \text{mm}$ (rise per turn). What force lifts a $6\ \text{kN}$ load if the efficiency is $40\%$?
HKA: ერთ ბრუნზე: დახარჯული $F \cdot 2\pi R$, სასარგებლო $P \cdot h$.
HEN: Per turn: input $F \cdot 2\pi R$, useful $W \cdot h$.
SKA: $F = \dfrac{P h}{\eta \cdot 2\pi R} = \dfrac{6000 \cdot 0{,}005}{0{,}4 \cdot 2 \cdot 3{,}14 \cdot 0{,}3} = \dfrac{30}{0{,}754} \approx 40\ \text{ნ}$
SEN: $F = \dfrac{W h}{\eta \cdot 2\pi R} = \dfrac{6000 \cdot 0.005}{0.4 \cdot 2 \cdot 3.14 \cdot 0.3} = \dfrac{30}{0.754} \approx 40\ \text{N}$
AKA: $\approx 40\ \text{ნ}$
AEN: $\approx 40\ \text{N}$

--- hard machines
KA: ბავშვები საქანელაზე ($l = 4\ \text{მ}$, საყრდენი შუაში, ფიცრის მასა $20\ \text{კგ}$) სხედან: $25\ \text{კგ}$ ბავშვი ერთ ბოლოში, $35\ \text{კგ}$ — მეორე მხარეს. საქანელა გაწონასწორებულია, როცა საყრდენი ცენტრიდან $x$-ით გადაიწევს მძიმე ბავშვისკენ და ორივე ბოლოებში სხედან. იპოვეთ $x$.
EN: A see-saw plank ($4\ \text{m}$, $20\ \text{kg}$) has children of $25\ \text{kg}$ and $35\ \text{kg}$ sitting at the two ends. How far from the centre, towards the heavier child, must the pivot be for balance?
HKA: ფიცრის წონა ცენტრში მოდის — პივოტიდან $x$-ზე, მსუბუქი ბავშვის მხარეს.
HEN: The plank's weight acts at the centre, $x$ from the pivot on the lighter child's side.
SKA: $25(2 + x) + 20 x = 35(2 - x)$
$50 + 25x + 20x = 70 - 35x \Rightarrow 80x = 20 \Rightarrow x = 0{,}25\ \text{მ}$
SEN: $25(2 + x) + 20 x = 35(2 - x)$
$50 + 25x + 20x = 70 - 35x \Rightarrow 80x = 20 \Rightarrow x = 0.25\ \text{m}$
AKA: $25\ \text{სმ}$
AEN: $25\ \text{cm}$

--- easy heat
KA: რატომ ატარებენ ზამთარში ფუმფულა, თბილ ტანსაცმელს? თბილი თავად არის ტანსაცმელი?
EN: Why do we wear fluffy clothes in winter? Is the clothing itself warm?
HKA: ჰაერი ცუდი თბოგამტარია.
HEN: Air is a poor conductor of heat.
SKA: ტანსაცმელი სითბოს არ გამოყოფს — ის სხეულის სითბოს ინარჩუნებს. ფუმფულა ქსოვილში ბევრი ჰაერია, რომელიც ცუდად ატარებს სითბოს, ამიტომ სითბო სხეულიდან ნელა გადის.
SEN: Clothes produce no heat — they keep in the body's heat. Fluffy fabric traps a lot of air, which conducts heat poorly, so heat leaves the body slowly.
AKA: ჩარჩენილი ჰაერი ცუდი თბოგამტარია; ტანსაცმელი თავად არ ათბობს
AEN: trapped air is a poor conductor; the clothes don't make heat

--- easy heat
KA: რატომ ათავსებენ მაცივარში გამაცივებელ ელემენტს ზემოთ?
EN: Why is the cooling element of a fridge placed at the top?
HKA: ცივი ჰაერი მძიმეა და ქვემოთ ეშვება.
HEN: Cold air is denser and sinks.
SKA: ზემოთ გაცივებული ჰაერი მძიმდება და ქვემოთ ეშვება, თბილი კი ზემოთ ადის — კონვექცია მთელ მაცივარს აცივებს.
SEN: Air cooled at the top becomes denser and sinks, while warmer air rises — convection cools the whole fridge.
AKA: კონვექციის გამო
AEN: because of convection

--- easy heat
KA: რა შემთხვევაშია შინაგანი ენერგია მეტი: $1\ \text{კგ}$ წყალი $20\ \text{°C}$-ზე თუ $1\ \text{კგ}$ წყალი $80\ \text{°C}$-ზე? რატომ?
EN: Which has more internal energy: $1\ \text{kg}$ of water at $20\ \text{°C}$ or $1\ \text{kg}$ at $80\ \text{°C}$? Why?
HKA: შინაგანი ენერგია მოლეკულების მოძრაობის ენერგიას მოიცავს.
HEN: Internal energy includes the energy of molecular motion.
SKA: $80\ \text{°C}$-ზე მოლეკულები უფრო სწრაფად მოძრაობენ, მათი კინეტიკური ენერგია მეტია — შინაგანი ენერგიაც მეტია.
SEN: At $80\ \text{°C}$ the molecules move faster and have more kinetic energy — so the internal energy is greater.
AKA: $80\ \text{°C}$-ზე
AEN: at $80\ \text{°C}$

--- easy heat
KA: ტუმბოთი ველოსიპედის საბურავის ჩატუმბვისას ტუმბო თბება. რატომ? შინაგანი ენერგიის შეცვლის რომელი ხერხია ეს?
EN: A bicycle pump gets warm while pumping up a tyre. Why? Which way of changing internal energy is this?
HKA: დგუში ჰაერს კუმშავს.
HEN: The piston compresses the air.
SKA: ჰაერის შეკუმშვისას დგუში მასზე მუშაობას ასრულებს — ჰაერის შინაგანი ენერგია და ტემპერატურა იზრდება, თბება ტუმბოც (ხახუნიც ემატება).
ეს არის **მუშაობის შესრულება**.
SEN: Compressing the air, the piston does work on it — the air's internal energy and temperature rise, warming the pump (friction adds too).
This is **doing work**.
AKA: მუშაობის შესრულებით
AEN: by doing work

--- easy heat
KA: თერმოსის მინის კედლებს შორის ვაკუუმია, ზედაპირები კი მოვერცხლილია. სითბოგადაცემის რომელ სახეს ებრძვის თითოეული?
EN: A thermos has a vacuum between its glass walls and silvered surfaces. Which kind of heat transfer does each feature fight?
HKA: ვაკუუმში ნივთიერება არ არის; სარკე ასხივებს უკან.
HEN: A vacuum contains no matter; a mirror reflects radiation back.
SKA: ვაკუუმი — თბოგამტარებლობას და კონვექციას (მათ ნივთიერება სჭირდება).
მოვერცხლილი ზედაპირი — გამოსხივებას (ირეკლავს მას).
SEN: The vacuum stops conduction and convection (they need matter).
The silvering stops radiation (it reflects it).
AKA: ვაკუუმი — გამტარებლობა და კონვექცია; სარკე — გამოსხივება
AEN: vacuum — conduction and convection; silvering — radiation

--- easy heat
KA: რატომ ათბობს მზე შავ მანქანას უფრო მეტად, ვიდრე თეთრს?
EN: Why does the Sun heat a black car more than a white one?
HKA: იფიქრეთ გამოსხივების შთანთქმაზე.
HEN: Think about how radiation is absorbed.
SKA: შავი ზედაპირი მზის გამოსხივებას თითქმის მთლიანად შთანთქავს, თეთრი — უმეტესად ირეკლავს. ამიტომ შავი მანქანა მეტ ენერგიას იღებს.
SEN: A black surface absorbs almost all the Sun's radiation, while a white one reflects most of it. So the black car takes in more energy.
AKA: შავი ზედაპირი უკეთ შთანთქავს გამოსხივებას
AEN: black surfaces absorb radiation better

--- easy heat
KA: რატომ ქრება ბუხრის კვამლი ზემოთ? რატომ საჭიროა მაღალი საკვამური?
EN: Why does chimney smoke rise? Why does a tall chimney help?
HKA: ცხელი აირი ნაკლებად მკვრივია.
HEN: Hot gas is less dense.
SKA: ცხელი აირები ცივ ჰაერზე მსუბუქია და ზემოთ ადის (კონვექცია). მაღალ საკვამურში თბილი აირის სვეტი მაღალია, წნევათა სხვაობა მეტია და წევა უკეთესი.
SEN: Hot gases are lighter than cold air and rise (convection). In a tall chimney the column of warm gas is taller, the pressure difference larger and the draught stronger.
AKA: კონვექცია; მაღალი საკვამური ზრდის წევას
AEN: convection; a tall chimney gives a stronger draught

--- easy heat
KA: ყინულის ნატეხი ცხელ ჩაიში ჩავაგდეთ. საით გადადის სითბო? როდის შეწყდება სითბოგადაცემა?
EN: An ice cube is dropped into hot tea. Which way does heat flow? When does the transfer stop?
HKA: სითბო თავისით ყოველთვის ცხელიდან ცივისკენ გადადის.
HEN: Heat always flows by itself from hot to cold.
SKA: სითბო ჩაიდან ყინულისკენ გადადის. გადაცემა შეწყდება, როცა ტემპერატურები გათანაბრდება (თბური წონასწორობა).
SEN: Heat flows from the tea to the ice. It stops when the temperatures become equal (thermal equilibrium).
AKA: ჩაიდან ყინულისკენ; ტემპერატურების გათანაბრებისას
AEN: from the tea to the ice; when the temperatures are equal

--- medium heat
KA: რატომ არის ზღვის სანაპიროზე დღისით ქარი ზღვიდან ხმელეთისკენ, ღამით კი — პირიქით (ბრიზი)?
EN: Why does the breeze at the seaside blow from sea to land by day and from land to sea at night?
HKA: ხმელეთი სწრაფად თბება და სწრაფად ცივდება, წყალი — ნელა.
HEN: Land heats and cools quickly; water does so slowly.
SKA: დღისით ხმელეთი უფრო თბება, მის თავზე თბილი ჰაერი ადის, ზღვიდან კი ცივი ჰაერი მის ადგილს იკავებს.
ღამით ხმელეთი უფრო სწრაფად ცივდება, ზღვა თბილია — ჰაერი ზღვის თავზე ადის და ქარი ხმელეთიდან ზღვისკენ უბერავს.
SEN: By day the land gets warmer; warm air rises over it and cooler air from the sea moves in.
At night the land cools faster and the sea is warmer — air rises over the sea and the wind blows from land to sea.
AKA: კონვექცია და წყლის დიდი სითბოტევადობა
AEN: convection and water's large heat capacity

--- medium heat
KA: რატომ ეკვრება ზამთარში ენა რკინის ძელს, მაგრამ ხეს — არა?
EN: Why does a tongue stick to an iron bar in winter, but not to wood?
HKA: შეადარეთ თბოგამტარებლობები.
HEN: Compare the thermal conductivities.
SKA: რკინა კარგი თბოგამტარია — ენიდან სითბოს ისე სწრაფად წაიღებს, რომ ენაზე არსებული სინესტე იყინება და ენას ეწებება.
ხე ცუდი თბოგამტარია — შეხების ადგილი სწრაფად თბება და სინესტე არ იყინება.
SEN: Iron is a good conductor — it draws heat from the tongue so fast that the moisture on it freezes and sticks.
Wood is a poor conductor — the contact spot warms quickly and the moisture doesn't freeze.
AKA: რკინა სწრაფად წაიღებს სითბოს და სინესტე იყინება
AEN: iron draws heat away quickly and the moisture freezes

--- medium heat
KA: ორი ერთნაირი ჭიქა ცხელი ჩაით: ერთში ლითონის კოვზია, მეორეში — არა. რომელი გაცივდება უფრო სწრაფად? რატომ უბერავენ ცხელ ჩაის?
EN: Two identical cups of hot tea: one has a metal spoon in it, the other doesn't. Which cools faster? Why do people blow on hot tea?
HKA: კოვზი სითბოს გარეთ „გაზიდავს“; ბერვა აორთქლებას და კონვექციას აძლიერებს.
HEN: The spoon conducts heat out; blowing speeds up evaporation and convection.
SKA: კოვზიანი გაცივდება ადრე — კოვზი სითბოს ჰაერში გამოაქვს (კარგი თბოგამტარია და დიდი ზედაპირი აქვს ჰაერში).
ბერვა ორთქლს და თბილ ჰაერს აშორებს ზედაპირიდან, რაც აორთქლებას და სითბოს გაცემას აჩქარებს.
SEN: The one with the spoon cools first — the spoon conducts heat out into the air.
Blowing removes vapour and warm air from the surface, speeding up evaporation and heat loss.
AKA: კოვზიანი; ბერვა აჩქარებს აორთქლებას
AEN: the one with the spoon; blowing speeds up evaporation

--- medium heat
KA: ორი ერთნაირი ბურთი — ერთი $20\ \text{მ}$ სიმაღლიდან ჩამოვარდა და გაჩერდა (არადრეკადად), მეორე მაგიდაზე დევს. რისი ხარჯზე გაიზარდა პირველის შინაგანი ენერგია? რამდენით, თუ მასა $0{,}2\ \text{კგ}$-ია?
EN: Two identical balls: one falls $20\ \text{m}$ and stops dead (inelastically), the other lies on a table. What increased the first ball's internal energy? By how much, if its mass is $0.2\ \text{kg}$ (assume all the energy goes into the ball)?
HKA: ენერგიის შენახვა: პოტენციური $\to$ კინეტიკური $\to$ შინაგანი.
HEN: Energy conservation: potential $\to$ kinetic $\to$ internal.
SKA: დაცემისას პოტენციური ენერგია კინეტიკურად იქცა, დაჯახებისას — შინაგანად.
$\Delta U = m g h = 0{,}2 \cdot 10 \cdot 20 = 40\ \text{ჯ}$
SEN: On falling, potential energy became kinetic, and on impact it became internal.
$\Delta U = m g h = 0.2 \cdot 10 \cdot 20 = 40\ \text{J}$
AKA: მექანიკური ენერგიის ხარჯზე; $40\ \text{ჯ}$
AEN: from mechanical energy; $40\ \text{J}$

--- easy heatcap
KA: რა რაოდენობის სითბოა საჭირო $3\ \text{კგ}$ წყლის $10\ \text{°C}$-დან $40\ \text{°C}$-მდე გასათბობად?
EN: How much heat is needed to warm $3\ \text{kg}$ of water from $10\ \text{°C}$ to $40\ \text{°C}$?
HKA: $Q = c m \Delta t$.
HEN: $Q = c m \Delta t$.
SKA: $Q = 4200 \cdot 3 \cdot 30 = 378\,000\ \text{ჯ} = 378\ \text{კჯ}$
SEN: $Q = 4200 \cdot 3 \cdot 30 = 378\,000\ \text{J} = 378\ \text{kJ}$
AKA: $378\ \text{კჯ}$
AEN: $378\ \text{kJ}$

--- easy heatcap
KA: რას ნიშნავს, რომ სპილენძის ხვედრითი სითბოტევადობაა $400\ \text{ჯ/(კგ}\cdot\text{°C)}$?
EN: What does it mean that copper's specific heat capacity is $400\ \text{J/(kg}\cdot\text{°C)}$?
HKA: ხვედრითი სითბოტევადობის განმარტება.
HEN: The definition of specific heat capacity.
SKA: $1\ \text{კგ}$ სპილენძის $1\ \text{°C}$-ით გასათბობად საჭიროა $400\ \text{ჯ}$ სითბო (და გაციებისას ამდენივე გამოიყოფა).
SEN: Warming $1\ \text{kg}$ of copper by $1\ \text{°C}$ takes $400\ \text{J}$ of heat (and the same is released when it cools by $1\ \text{°C}$).
AKA: $1\ \text{კგ}$-ის $1\ \text{°C}$-ით გათბობას $400\ \text{ჯ}$ სჭირდება
AEN: warming $1\ \text{kg}$ by $1\ \text{°C}$ takes $400\ \text{J}$

--- easy heatcap
KA: $2\ \text{კგ}$ რკინის ნაჭერი ($c = 460\ \text{ჯ/(კგ}\cdot\text{°C)}$) $50\ \text{°C}$-ით გაცივდა. რამდენი სითბო გამოიყო?
EN: A $2\ \text{kg}$ piece of iron ($c = 460\ \text{J/(kg}\cdot\text{°C)}$) cools by $50\ \text{°C}$. How much heat is released?
HKA: $Q = c m \Delta t$.
HEN: $Q = c m \Delta t$.
SKA: $Q = 460 \cdot 2 \cdot 50 = 46\,000\ \text{ჯ} = 46\ \text{კჯ}$
SEN: $Q = 460 \cdot 2 \cdot 50 = 46\,000\ \text{J} = 46\ \text{kJ}$
AKA: $46\ \text{კჯ}$
AEN: $46\ \text{kJ}$

--- easy heatcap
KA: $0{,}5\ \text{კგ}$ წყალს $21\ \text{კჯ}$ სითბო გადასცეს. რამდენი გრადუსით გათბა?
EN: $0.5\ \text{kg}$ of water receives $21\ \text{kJ}$ of heat. By how many degrees does it warm?
HKA: $\Delta t = \dfrac{Q}{c m}$.
HEN: $\Delta t = \dfrac{Q}{c m}$.

SEN: $920 \cdot 0.2 (95 - t) = (4200 \cdot 0.25 + 400 \cdot 0.1)(t - 15)$
$184(95 - t) = 1090(t - 15)$
$17\,480 + 16\,350 = 1274 t \Rightarrow t \approx 26.6\ \text{°C}$
AKA: $\approx 26{,}6\ \text{°C}$
AEN: $\approx 26.6\ \text{°C}$

--- hard heatcap
KA: ჩანჩქერიდან ($h = 84\ \text{მ}$) წყალი ვარდება. რამდენით მაღალი იქნება ტემპერატურა ქვემოთ, თუ პოტენციური ენერგიის ნახევარი წყლის გათბობაზე მიდის?
EN: Water falls over an $84\ \text{m}$ waterfall. How much warmer is it at the bottom if half its potential energy heats the water?
HKA: $0{,}5 m g h = c m \Delta t$.
HEN: $0.5 m g h = c m \Delta t$.
SKA: $\Delta t = \dfrac{0{,}5 \cdot 10 \cdot 84}{4200} = 0{,}1\ \text{°C}$
SEN: $\Delta t = \dfrac{0.5 \cdot 10 \cdot 84}{4200} = 0.1\ \text{°C}$

--- hard heatcap
KA: ცხელი წყლის ($t_1$) და ცივი წყლის ($t_2 = 10\ \text{°C}$) შერევით $t = 30\ \text{°C}$ მივიღეთ. ცხელი წყალი სამჯერ ნაკლებია, ვიდრე ცივი. იპოვეთ $t_1$.
EN: Mixing hot water at $t_1$ with cold water at $t_2 = 10\ \text{°C}$ gives $t = 30\ \text{°C}$. There is three times less hot water than cold. Find $t_1$.
HKA: $m(t_1 - 30) = 3m(30 - 10)$.
HEN: $m(t_1 - 30) = 3m(30 - 10)$.
SKA: $t_1 - 30 = 60 \Rightarrow t_1 = 90\ \text{°C}$

AEN: $90\ \text{°C}$

--- hard heatcap
KA: ელექტროჩაიდანი ($1{,}5\ \text{კვტ}$) $1\ \text{ლ}$ წყალს $20\ \text{°C}$-დან $100\ \text{°C}$-მდე $5$ წუთში ათბობს. რა დროში გაათბობს $2\ \text{ლ}$-ს, თუ სითბოს დანაკარგების სიმძლავრე ორივე შემთხვევაში ერთნაირია?
EN: A $1.5\ \text{kW}$ kettle heats $1\ \text{L}$ of water from $20\ \text{°C}$ to $100\ \text{°C}$ in $5$ minutes. How long will $2\ \text{L}$ take, if the rate of heat loss is the same in both cases?
HKA: იპოვეთ დანაკარგების სიმძლავრე პირველი შემთხვევიდან.
HEN: Find the power lost from the first case.
SKA: $Q_1 = 4200 \cdot 1 \cdot 80 = 336\ \text{კჯ}$; $\ N_{\text{ს}} = \dfrac{336\,000}{300} = 1120\ \text{ვტ}$, დანაკარგი $380\ \text{ვტ}$.
$Q_2 = 672\ \text{კჯ}$, $\ t_2 = \dfrac{672\,000}{1120} = 600\ \text{წმ} = 10\ \text{წთ}$
SEN: $Q_1 = 4200 \cdot 1 \cdot 80 = 336\ \text{kJ}$; $\ P_{\text{u}} = \dfrac{336\,000}{300} = 1120\ \text{W}$, losses $380\ \text{W}$.
$Q_2 = 672\ \text{kJ}$, $\ t_2 = \dfrac{672\,000}{1120} = 600\ \text{s} = 10\ \text{min}$
AKA: $10\ \text{წთ}$
AEN: $10\ \text{min}$

--- hard heatcap
KA: $50\ \text{კგ}$ მასის ადამიანი სხეულის $37\ \text{°C}$ ტემპერატურას ინარჩუნებს. ორგანიზმი $100\ \text{ვტ}$ სითბოს გამოყოფს. რამდენით გაიზრდებოდა ტემპერატურა $1$ საათში, თუ სითბო გარეთ არ გავიდოდა? ($c \approx 3500\ \text{ჯ/(კგ}\cdot\text{°C)}$)
EN: A $50\ \text{kg}$ person produces $100\ \text{W}$ of heat. By how much would their body temperature rise in $1$ hour if no heat escaped? ($c \approx 3500\ \text{J/(kg}\cdot\text{°C)}$)
HKA: $\Delta t = \dfrac{N t}{c m}$.
HEN: $\Delta t = \dfrac{P t}{c m}$.
SKA: $\Delta t = \dfrac{100 \cdot 3600}{3500 \cdot 50} = \dfrac{360\,000}{175\,000} \approx 2{,}1\ \text{°C}$ — ეს უკვე სიცხეა!
SEN: $\Delta t = \dfrac{100 \cdot 3600}{3500 \cdot 50} = \dfrac{360\,000}{175\,000} \approx 2.1\ \text{°C}$ — that's already a fever!
AKA: $\approx 2{,}1\ \text{°C}$-ით
AEN: by $\approx 2.1\ \text{°C}$

--- hard heatcap
KA: ერთნაირი მასის სპილენძის ($c = 400$) და ალუმინის ($c = 920$) ბურთულები $100\ \text{°C}$-მდე გააცხელეს და ერთად ჩააგდეს $500\ \text{გ}$ წყალში ($20\ \text{°C}$). საბოლოო ტემპერატურაა $30\ \text{°C}$. იპოვეთ თითოეული ბურთულის მასა.
EN: Equal-mass copper ($c = 400$) and aluminium ($c = 920$) balls heated to $100\ \text{°C}$ are dropped together into $500\ \text{g}$ of water at $20\ \text{°C}$. The final temperature is $30\ \text{°C}$. Find the mass of each ball.
HKA: $(400 + 920) m \cdot 70 = 4200 \cdot 0{,}5 \cdot 10$.
HEN: $(400 + 920) m \cdot 70 = 4200 \cdot 0.5 \cdot 10$.
SKA: $1320 \cdot 70 \cdot m = 21\,000 \Rightarrow m = \dfrac{21\,000}{92\,400} \approx 0{,}227\ \text{კგ}$
SEN: $1320 \cdot 70 \cdot m = 21\,000 \Rightarrow m = \dfrac{21\,000}{92\,400} \approx 0.227\ \text{kg}$
AKA: $\approx 227\ \text{გ}$
AEN: $\approx 227\ \text{g}$

--- hard heatcap
KA: მანქანა ($1\ \text{ტ}$) $72\ \text{კმ/სთ}$-დან ამუხრუჭებს. მუხრუჭის ოთხი დისკის საერთო მასაა $8\ \text{კგ}$, $c = 460$. კინეტიკური ენერგიის $80\%$ დისკებს ათბობს. რამდენით გათბება ისინი?
EN: A $1\ \text{t}$ car brakes from $72\ \text{km/h}$ to rest. Its four brake discs have a total mass of $8\ \text{kg}$, $c = 460$. $80\%$ of the kinetic energy heats them. By how much do they warm?
HKA: $0{,}8 \dfrac{M v^2}{2} = c m \Delta t$.
HEN: $0.8 \dfrac{M v^2}{2} = c m \Delta t$.
SKA: $E_k = \dfrac{1000 \cdot 400}{2} = 200\ \text{კჯ}$
$\Delta t = \dfrac{0{,}8 \cdot 200\,000}{460 \cdot 8} \approx 43\ \text{°C}$
SEN: $E_k = \dfrac{1000 \cdot 400}{2} = 200\ \text{kJ}$
$\Delta t = \dfrac{0.8 \cdot 200\,000}{460 \cdot 8} \approx 43\ \text{°C}$
AKA: $\approx 43\ \text{°C}$-ით
AEN: by $\approx 43\ \text{°C}$

--- hard heatcap
KA: ცხელ წყალს ($80\ \text{°C}$) ცივს ($20\ \text{°C}$) ურევენ ისე, რომ მიიღონ $50\ \text{ლ}$ წყალი $35\ \text{°C}$-ზე. ჭურჭლის გათბობასა და გარემოში სითბოს $10\%$ იკარგება ცხელი წყლისგან. რამდენი ლიტრი ცხელი წყალია საჭირო?
EN: Hot water at $80\ \text{°C}$ is mixed with cold at $20\ \text{°C}$ to get $50\ \text{L}$ at $35\ \text{°C}$. $10\%$ of the heat given off by the hot water is lost. How many litres of hot water are needed?
HKA: $0{,}9 m_1 (80 - 35) = m_2 (35 - 20)$, $m_1 + m_2 = 50$.
HEN: $0.9 m_1 (80 - 35) = m_2 (35 - 20)$, $m_1 + m_2 = 50$.
SKA: $40{,}5 m_1 = 15(50 - m_1) \Rightarrow 55{,}5 m_1 = 750$
$m_1 \approx 13{,}5\ \text{ლ}$
SEN: $40.5 m_1 = 15(50 - m_1) \Rightarrow 55.5 m_1 = 750$
$m_1 \approx 13.5\ \text{L}$
AKA: $\approx 13{,}5\ \text{ლ}$
AEN: $\approx 13.5\ \text{L}$

--- hard heatcap
KA: ცილინდრულ ჭურჭელში თბილი ($60\ \text{°C}$) და ცივი ($20\ \text{°C}$) წყალი ფენებად დევს და ჯერ არ შერეულა: ცივის სიმაღლე $30\ \text{სმ}$, თბილისა — $10\ \text{სმ}$. საბოლოოდ რა ტემპერატურა დამყარდება? რომელი ფენა იქნება ზემოთ შერევამდე?
EN: A cylinder holds layers of warm water at $60\ \text{°C}$ ($10\ \text{cm}$) and cold water at $20\ \text{°C}$ ($30\ \text{cm}$), not yet mixed. What final temperature is reached? Which layer is on top before mixing?
HKA: ფენების მასები სიმაღლეების პროპორციულია; თბილი წყალი მსუბუქია.
HEN: The layers' masses are proportional to their heights; warm water is less dense.
SKA: თბილი წყალი ნაკლებად მკვრივია — ის ზემოთაა.
$t = \dfrac{10 \cdot 60 + 30 \cdot 20}{40} = \dfrac{1200}{40} = 30\ \text{°C}$
SEN: Warm water is less dense — it is on top.
$t = \dfrac{10 \cdot 60 + 30 \cdot 20}{40} = \dfrac{1200}{40} = 30\ \text{°C}$
AKA: $30\ \text{°C}$; თბილი — ზემოთ
AEN: $30\ \text{°C}$; the warm layer is on top

--- hard heatcap olympiad
KA: თერმომეტრი ($c m = 2\ \text{ჯ/°C}$) ოთახის ტემპერატურაზეა ($20\ \text{°C}$). მას $10\ \text{გ}$ წყალში ($50\ \text{°C}$) ჩაუშვებენ. რა ტემპერატურას აჩვენებს? რამდენით შეცდება ის? როგორ უნდა იყოს თერმომეტრი, რომ შეცდომა მცირე იყოს?
EN: A thermometer (heat capacity $2\ \text{J/°C}$) at room temperature ($20\ \text{°C}$) is put into $10\ \text{g}$ of water at $50\ \text{°C}$. What does it read? How large is the error? What kind of thermometer keeps the error small?
HKA: თერმომეტრი თავად ართმევს წყალს სითბოს.
HEN: The thermometer itself takes heat from the water.
SKA: $4200 \cdot 0{,}01 (50 - t) = 2(t - 20)$
$42(50 - t) = 2(t - 20) \Rightarrow 2100 + 40 = 44 t \Rightarrow t \approx 48{,}6\ \text{°C}$
შეცდომა $\approx 1{,}4\ \text{°C}$. თერმომეტრის სითბოტევადობა გაზომილი სხეულისაზე ბევრად მცირე უნდა იყოს.
SEN: $4200 \cdot 0.01 (50 - t) = 2(t - 20)$
$42(50 - t) = 2(t - 20) \Rightarrow 2100 + 40 = 44 t \Rightarrow t \approx 48.6\ \text{°C}$
Error $\approx 1.4\ \text{°C}$. The thermometer's heat capacity must be much smaller than that of what it measures.
AKA: $\approx 48{,}6\ \text{°C}$; შეცდომა $\approx 1{,}4\ \text{°C}$
AEN: $\approx 48.6\ \text{°C}$; error $\approx 1.4\ \text{°C}$

--- hard heatcap olympiad
KA: ჭურჭელში $1\ \text{კგ}$ წყალია $0\ \text{°C}$-ზე. მას თანაბრად ასხამენ $100\ \text{°C}$-იან წყალს $1\ \text{კგ}$ ულუფებით და ყოველ ჯერზე ურევენ. რამდენი ულუფის შემდეგ გადააჭარბებს ტემპერატურა $80\ \text{°C}$-ს? (დანაკარგები არ არის)
EN: A vessel holds $1\ \text{kg}$ of water at $0\ \text{°C}$. Portions of $1\ \text{kg}$ of water at $100\ \text{°C}$ are added one by one and stirred. After how many portions does the temperature exceed $80\ \text{°C}$? (No losses.)
HKA: $n$ ულუფის შემდეგ $t_n = \dfrac{100 n}{n + 1}$.
HEN: After $n$ portions $t_n = \dfrac{100 n}{n + 1}$.
SKA: $\dfrac{100 n}{n + 1} > 80 \Rightarrow 100 n > 80 n + 80 \Rightarrow n > 4$
$n = 4$: $t = 80\ \text{°C}$ (ზუსტად); $n = 5$: $t \approx 83{,}3\ \text{°C}$ — საჭიროა $5$ ულუფა.
SEN: $\dfrac{100 n}{n + 1} > 80 \Rightarrow 100 n > 80 n + 80 \Rightarrow n > 4$
$n = 4$: $t = 80\ \text{°C}$ (exactly); $n = 5$: $t \approx 83.3\ \text{°C}$ — $5$ portions are needed.
AKA: $5$ ულუფის შემდეგ
AEN: after $5$ portions

--- hard heatcap
KA: ნაკადიან წყალგამაცხელებელში წყალი $10\ \text{°C}$-დან $50\ \text{°C}$-მდე თბება. გამაცხელებლის სიმძლავრეა $8\ \text{კვტ}$, სმკ — $95\%$. რამდენი ლიტრი ცხელი წყალი გამოდის წუთში?
EN: In an instant water heater water warms from $10\ \text{°C}$ to $50\ \text{°C}$. The heater is $8\ \text{kW}$ and $95\%$ efficient. How many litres of hot water flow out per minute?
HKA: $\eta N t = c m \Delta t$, $t = 60\ \text{წმ}$.
HEN: $\eta P t = c m \Delta t$, $t = 60\ \text{s}$.
SKA: $m = \dfrac{0{,}95 \cdot 8000 \cdot 60}{4200 \cdot 40} = \dfrac{456\,000}{168\,000} \approx 2{,}7\ \text{კგ}$
SEN: $m = \dfrac{0.95 \cdot 8000 \cdot 60}{4200 \cdot 40} = \dfrac{456\,000}{168\,000} \approx 2.7\ \text{kg}$
AKA: $\approx 2{,}7\ \text{ლ/წთ}$
AEN: $\approx 2.7\ \text{L/min}$

--- easy melting
KA: რამდენი სითბოა საჭირო $3\ \text{კგ}$ ყინულის $0\ \text{°C}$-ზე გასალღობად?
EN: How much heat melts $3\ \text{kg}$ of ice at $0\ \text{°C}$?
HKA: $Q = \lambda m$.
HEN: $Q = \lambda m$.
SKA: $Q = 3{,}4 \times 10^5 \cdot 3 = 1{,}02 \times 10^6\ \text{ჯ} \approx 1\ \text{მჯ}$
SEN: $Q = 3.4 \times 10^5 \cdot 3 = 1.02 \times 10^6\ \text{J} \approx 1\ \text{MJ}$

--- easy melting
KA: რამდენი სითბო გამოიყოფა $500\ \text{გ}$ წყლის $0\ \text{°C}$-ზე გაყინვისას?
EN: How much heat is released when $500\ \text{g}$ of water freezes at $0\ \text{°C}$?
HKA: გამყარებისას იმდენივე სითბო გამოიყოფა, რამდენიც დნობისას შთაინთქმება.
HEN: Freezing releases as much heat as melting absorbs.
SKA: $Q = 3{,}4 \times 10^5 \cdot 0{,}5 = 170\ \text{კჯ}$
SEN: $Q = 3.4 \times 10^5 \cdot 0.5 = 170\ \text{kJ}$
AKA: $170\ \text{კჯ}$
AEN: $170\ \text{kJ}$

--- easy melting
KA: რატომ არ იზრდება ყინულის ტემპერატურა დნობის დროს, თუმცა მას სითბოს ვაწვდით?
EN: Why doesn't the temperature of melting ice rise even though heat is being supplied?
HKA: სითბო კრისტალური მესრის დაშლაზე იხარჯება.
HEN: The heat goes into breaking up the crystal lattice.
SKA: დნობისას მიწოდებული სითბო მოლეკულების კინეტიკური ენერგიის გაზრდაზე კი არა, კრისტალური მესრის კავშირების დარღვევაზე (პოტენციური ენერგიის გაზრდაზე) იხარჯება, ამიტომ ტემპერატურა $0\ \text{°C}$-ზე რჩება.
SEN: During melting the heat doesn't increase the molecules' kinetic energy; it breaks the bonds of the crystal lattice (raising potential energy), so the temperature stays at $0\ \text{°C}$.
AKA: სითბო მესრის დაშლაზე იხარჯება
AEN: the heat breaks up the lattice

--- easy melting
KA: რამდენი სითბოა საჭირო $2\ \text{კგ}$ ტყვიის გასალღობად დნობის ტემპერატურაზე? ($\lambda = 2{,}5 \times 10^4\ \text{ჯ/კგ}$)
EN: How much heat melts $2\ \text{kg}$ of lead at its melting point? ($\lambda = 2.5 \times 10^4\ \text{J/kg}$)
HKA: $Q = \lambda m$.
HEN: $Q = \lambda m$.
SKA: $Q = 2{,}5 \times 10^4 \cdot 2 = 50\ \text{კჯ}$
SEN: $Q = 2.5 \times 10^4 \cdot 2 = 50\ \text{kJ}$
AKA: $50\ \text{კჯ}$
AEN: $50\ \text{kJ}$

--- easy melting
KA: $680\ \text{კჯ}$ სითბოთი რამდენი ყინული გადნება $0\ \text{°C}$-ზე?
EN: How much ice at $0\ \text{°C}$ can $680\ \text{kJ}$ of heat melt?
