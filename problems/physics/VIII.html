HEN: $m = \dfrac{Q}{\lambda}$.
SKA: $m = \dfrac{680\,000}{340\,000} = 2\ \text{კგ}$
SEN: $m = \dfrac{680\,000}{340\,000} = 2\ \text{kg}$
AKA: $2\ \text{კგ}$
AEN: $2\ \text{kg}$

--- easy melting
KA: რატომ ათავსებენ ბოსტნეულის სარდაფში წყლით სავსე ვედროებს, რომ ყინვისგან დაიცვან?
EN: Why are buckets of water placed in a vegetable cellar to protect it from frost?
HKA: წყალი გაყინვისას სითბოს გამოყოფს.
HEN: Water releases heat as it freezes.
SKA: ყინვისას წყალი იყინება და გამოყოფს სითბოს ($\lambda m$), რომელიც სარდაფის ჰაერს ათბობს და ტემპერატურას $0\ \text{°C}$-ის ახლოს ინარჩუნებს, სანამ მთელი წყალი არ გაიყინება.
SEN: In a frost the water freezes and releases heat ($\lambda m$), which warms the cellar air and holds the temperature near $0\ \text{°C}$ until all the water has frozen.
AKA: გაყინვისას გამოყოფილი სითბო ათბობს სარდაფს
AEN: the heat released on freezing warms the cellar

--- medium melting
KA: რამდენი სითბოა საჭირო $2\ \text{კგ}$ ყინულის $-15\ \text{°C}$-დან $0\ \text{°C}$-იან წყლად გადასაქცევად?
EN: How much heat turns $2\ \text{kg}$ of ice at $-15\ \text{°C}$ into water at $0\ \text{°C}$?
HKA: ჯერ გათბობა $0\ \text{°C}$-მდე, შემდეგ დნობა.
HEN: First warm it to $0\ \text{°C}$, then melt it.
SKA: $Q_1 = 2100 \cdot 2 \cdot 15 = 63\ \text{კჯ}$
$Q_2 = 340\,000 \cdot 2 = 680\ \text{კჯ}$
$Q = 743\ \text{კჯ}$
SEN: $Q_1 = 2100 \cdot 2 \cdot 15 = 63\ \text{kJ}$
$Q_2 = 340\,000 \cdot 2 = 680\ \text{kJ}$
$Q = 743\ \text{kJ}$
AKA: $743\ \text{კჯ}$
AEN: $743\ \text{kJ}$

--- medium melting
KA: რამდენი სითბოა საჭირო $1\ \text{კგ}$ ყინულის $0\ \text{°C}$-დან $50\ \text{°C}$-იან წყლად გადასაქცევად?
EN: How much heat turns $1\ \text{kg}$ of ice at $0\ \text{°C}$ into water at $50\ \text{°C}$?
HKA: დნობა + წყლის გათბობა.
HEN: Melting + warming the water.
SKA: $Q = 340\,000 + 4200 \cdot 50 = 340\,000 + 210\,000 = 550\ \text{კჯ}$
SEN: $Q = 340\,000 + 4200 \cdot 50 = 340\,000 + 210\,000 = 550\ \text{kJ}$
AKA: $550\ \text{კჯ}$
AEN: $550\ \text{kJ}$

--- medium melting
KA: $200\ \text{გ}$ კალის ($c = 230$, $t_{\text{დ}} = 232\ \text{°C}$, $\lambda = 5{,}9 \times 10^4$) ნაჭერი $32\ \text{°C}$-დან სრულად უნდა გადნეს. რამდენი სითბოა საჭირო?
EN: A $200\ \text{g}$ piece of tin ($c = 230$, $t_{\text{m}} = 232\ \text{°C}$, $\lambda = 5.9 \times 10^4$) at $32\ \text{°C}$ must be completely melted. How much heat is needed?
HKA: გათბობა $232\ \text{°C}$-მდე + დნობა.
HEN: Warm to $232\ \text{°C}$ + melt.
SKA: $Q_1 = 230 \cdot 0{,}2 \cdot 200 = 9200\ \text{ჯ}$
$Q_2 = 5{,}9 \times 10^4 \cdot 0{,}2 = 11\,800\ \text{ჯ}$
$Q = 21\ \text{კჯ}$
SEN: $Q_1 = 230 \cdot 0.2 \cdot 200 = 9200\ \text{J}$
$Q_2 = 5.9 \times 10^4 \cdot 0.2 = 11\,800\ \text{J}$
$Q = 21\ \text{kJ}$
AKA: $21\ \text{კჯ}$
AEN: $21\ \text{kJ}$

--- medium melting
KA: $500\ \text{ვტ}$ გამაცხელებელი $0\ \text{°C}$-იან ყინულს ადნობს. რამდენ ხანში გადნება $1\ \text{კგ}$ ყინული, თუ სითბოს $80\%$ ყინულს გადაეცემა?
EN: A $500\ \text{W}$ heater melts ice at $0\ \text{°C}$. How long does it take to melt $1\ \text{kg}$ if $80\%$ of the heat reaches the ice?
HKA: $\eta N t = \lambda m$.
HEN: $\eta P t = \lambda m$.
SKA: $t = \dfrac{340\,000}{0{,}8 \cdot 500} = 850\ \text{წმ} \approx 14\ \text{წთ}$
SEN: $t = \dfrac{340\,000}{0.8 \cdot 500} = 850\ \text{s} \approx 14\ \text{min}$
AKA: $\approx 14\ \text{წთ}$
AEN: $\approx 14\ \text{min}$

--- medium melting
KA: $50\ \text{გ}$ ყინული ($0\ \text{°C}$) $500\ \text{გ}$ წყალში ($40\ \text{°C}$) ჩააგდეს. იპოვეთ საბოლოო ტემპერატურა.
EN: $50\ \text{g}$ of ice at $0\ \text{°C}$ is dropped into $500\ \text{g}$ of water at $40\ \text{°C}$. Find the final temperature.
HKA: ჯერ შეამოწმეთ, საკმარისია თუ არა სითბო ყინულის გასადნობად.
HEN: First check that there's enough heat to melt all the ice.
SKA: დნობისთვის: $340\,000 \cdot 0{,}05 = 17\ \text{კჯ}$; წყალს $0\ \text{°C}$-მდე შეუძლია $84\ \text{კჯ}$ — საკმარისია.
$4200 \cdot 0{,}5(40 - t) = 17\,000 + 4200 \cdot 0{,}05\, t$
$84\,000 - 2100 t = 17\,000 + 210 t \Rightarrow t = \dfrac{67\,000}{2310} \approx 29\ \text{°C}$
SEN: To melt: $340\,000 \cdot 0.05 = 17\ \text{kJ}$; the water can give $84\ \text{kJ}$ down to $0\ \text{°C}$ — enough.
$4200 \cdot 0.5(40 - t) = 17\,000 + 4200 \cdot 0.05\, t$
$84\,000 - 2100 t = 17\,000 + 210 t \Rightarrow t = \dfrac{67\,000}{2310} \approx 29\ \text{°C}$
AKA: $\approx 29\ \text{°C}$
AEN: $\approx 29\ \text{°C}$

--- medium melting
KA: რატომ ადნობენ თოვლს გზაზე მარილით? რას აკეთებს მარილი?
EN: Why is salt spread on snowy roads? What does the salt do?
HKA: მარილიანი წყალი $0\ \text{°C}$-ზე დაბალ ტემპერატურაზე იყინება.
HEN: Salty water freezes below $0\ \text{°C}$.
SKA: მარილის ხსნარის გაყინვის ტემპერატურა $0\ \text{°C}$-ზე დაბალია (მაგ., $-10\ \text{°C}$-მდე). ამიტომ $-5\ \text{°C}$-ზე მარილიანი თოვლი დნება — ყინულის ფენა აღარ წარმოიქმნება.
SEN: A salt solution freezes below $0\ \text{°C}$ (down to about $-10\ \text{°C}$). So at $-5\ \text{°C}$ salted snow melts and no ice layer forms.
AKA: ამცირებს გაყინვის ტემპერატურას
AEN: it lowers the freezing point

--- medium melting
KA: გაყინვის შემდეგ $1\ \text{ლ}$ წყალი $1{,}1\ \text{ლ}$ ყინულად იქცევა. იპოვეთ ყინულის სიმკვრივე. რატომ ცურავს ყინული?
EN: On freezing, $1\ \text{L}$ of water becomes $1.1\ \text{L}$ of ice. Find the density of ice. Why does ice float?
HKA: მასა არ იცვლება.
HEN: The mass doesn't change.
SKA: $\rho_{\text{ყ}} = \dfrac{1\ \text{კგ}}{1{,}1\ \text{ლ}} \approx 0{,}91\ \text{კგ/ლ} = 910\ \text{კგ/მ}^3$
$\rho_{\text{ყ}} < \rho_{\text{წყ}}$ — ყინული ცურავს.
SEN: $\rho_{\text{ice}} = \dfrac{1\ \text{kg}}{1.1\ \text{L}} \approx 0.91\ \text{kg/L} = 910\ \text{kg/m}^3$
$\rho_{\text{ice}} < \rho_{\text{w}}$ — ice floats.
AKA: $\approx 910\ \text{კგ/მ}^3$
AEN: $\approx 910\ \text{kg/m}^3$

--- medium melting
KA: სპილენძის ($c = 400$, $t_{\text{დ}} = 1085\ \text{°C}$, $\lambda = 2{,}1 \times 10^5$) $5\ \text{კგ}$ ნაჭერი $85\ \text{°C}$-დან უნდა გადნეს. რამდენი სითბოა საჭირო?
EN: A $5\ \text{kg}$ piece of copper ($c = 400$, $t_{\text{m}} = 1085\ \text{°C}$, $\lambda = 2.1 \times 10^5$) at $85\ \text{°C}$ is to be melted. How much heat is needed?
HKA: $Q = c m \Delta t + \lambda m$.
HEN: $Q = c m \Delta t + \lambda m$.
SKA: $Q = 400 \cdot 5 \cdot 1000 + 2{,}1 \times 10^5 \cdot 5 = 2 \times 10^6 + 1{,}05 \times 10^6 = 3{,}05\ \text{მჯ}$
SEN: $Q = 400 \cdot 5 \cdot 1000 + 2.1 \times 10^5 \cdot 5 = 2 \times 10^6 + 1.05 \times 10^6 = 3.05\ \text{MJ}$
AKA: $3{,}05\ \text{მჯ}$
AEN: $3.05\ \text{MJ}$

--- hard melting
KA: $1\ \text{კგ}$ ყინული ($0\ \text{°C}$) $2\ \text{კგ}$ წყალში ($30\ \text{°C}$) ჩააგდეს. გადნება მთელი ყინული? იპოვეთ საბოლოო მდგომარეობა.
EN: $1\ \text{kg}$ of ice at $0\ \text{°C}$ is put into $2\ \text{kg}$ of water at $30\ \text{°C}$. Does all the ice melt? Find the final state.
HKA: შეადარეთ $0\ \text{°C}$-მდე გაციებისას გაცემული სითბო და დნობისთვის საჭირო სითბო.
HEN: Compare the heat the water gives up cooling to $0\ \text{°C}$ with the heat needed to melt the ice.
SKA: წყალი $0\ \text{°C}$-მდე: $4200 \cdot 2 \cdot 30 = 252\ \text{კჯ}$; დნობას სჭირდება $340\ \text{კჯ}$ — არ კმარა.
გადნება $m = \dfrac{252\,000}{340\,000} \approx 0{,}74\ \text{კგ}$; დარჩება $\approx 0{,}26\ \text{კგ}$ ყინული, $t = 0\ \text{°C}$.
SEN: Water cooling to $0\ \text{°C}$: $4200 \cdot 2 \cdot 30 = 252\ \text{kJ}$; melting needs $340\ \text{kJ}$ — not enough.
Melted: $m = \dfrac{252\,000}{340\,000} \approx 0.74\ \text{kg}$; $\approx 0.26\ \text{kg}$ of ice remains, $t = 0\ \text{°C}$.
AKA: არა; $0\ \text{°C}$, $\approx 0{,}26\ \text{კგ}$ ყინული რჩება
AEN: no; $0\ \text{°C}$ with $\approx 0.26\ \text{kg}$ of ice left

--- hard melting
KA: რამდენი $100\ \text{°C}$-იანი წყალი უნდა დავასხათ $2\ \text{კგ}$ ყინულს ($-10\ \text{°C}$), რომ მივიღოთ $20\ \text{°C}$-იანი წყალი?
EN: How much water at $100\ \text{°C}$ must be poured onto $2\ \text{kg}$ of ice at $-10\ \text{°C}$ to get water at $20\ \text{°C}$?
HKA: ყინული: გათბობა + დნობა + გათბობა $20\ \text{°C}$-მდე.
HEN: Ice: warm + melt + warm to $20\ \text{°C}$.
SKA: $Q_{\text{ყ}} = 2100 \cdot 2 \cdot 10 + 340\,000 \cdot 2 + 4200 \cdot 2 \cdot 20 = 42\,000 + 680\,000 + 168\,000 = 890\ \text{კჯ}$
$m = \dfrac{890\,000}{4200 \cdot 80} \approx 2{,}65\ \text{კგ}$
SEN: $Q_{\text{ice}} = 2100 \cdot 2 \cdot 10 + 340\,000 \cdot 2 + 4200 \cdot 2 \cdot 20 = 42\,000 + 680\,000 + 168\,000 = 890\ \text{kJ}$
$m = \dfrac{890\,000}{4200 \cdot 80} \approx 2.65\ \text{kg}$
AKA: $\approx 2{,}65\ \text{კგ}$
AEN: $\approx 2.65\ \text{kg}$

--- hard melting
KA: ელექტროღუმელში ($2\ \text{კვტ}$, სმკ $60\%$) $10\ \text{კგ}$ ალუმინის ჯართი ($c = 920$, $t_{\text{დ}} = 660\ \text{°C}$, $\lambda = 3{,}9 \times 10^5$) $20\ \text{°C}$-დან დნება. რამდენი ხანი სჭირდება?
EN: An electric furnace ($2\ \text{kW}$, $60\%$ efficient) melts $10\ \text{kg}$ of aluminium scrap ($c = 920$, $t_{\text{m}} = 660\ \text{°C}$, $\lambda = 3.9 \times 10^5$) starting at $20\ \text{°C}$. How long does it take?
HKA: $\eta N t = c m \Delta t + \lambda m$.
HEN: $\eta P t = c m \Delta t + \lambda m$.
SKA: $Q = 920 \cdot 10 \cdot 640 + 3{,}9 \times 10^5 \cdot 10 = 5{,}89 \times 10^6 + 3{,}9 \times 10^6 \approx 9{,}79 \times 10^6\ \text{ჯ}$
$t = \dfrac{9{,}79 \times 10^6}{1200} \approx 8160\ \text{წმ} \approx 2{,}3\ \text{სთ}$
SEN: $Q = 920 \cdot 10 \cdot 640 + 3.9 \times 10^5 \cdot 10 = 5.89 \times 10^6 + 3.9 \times 10^6 \approx 9.79 \times 10^6\ \text{J}$
$t = \dfrac{9.79 \times 10^6}{1200} \approx 8160\ \text{s} \approx 2.3\ \text{h}$
AKA: $\approx 2{,}3\ \text{სთ}$
AEN: $\approx 2.3\ \text{h}$

--- hard melting
KA: $500\ \text{გ}$ ყინულში ($-20\ \text{°C}$) $100\ \text{გ}$ წყალი ($20\ \text{°C}$) დაასხეს. რა დამყარდება?
EN: $100\ \text{g}$ of water at $20\ \text{°C}$ is poured onto $500\ \text{g}$ of ice at $-20\ \text{°C}$. What is the final state?
HKA: შეამოწმეთ: საკმარისია თუ არა ყინულის „სიცივე“ მთელი წყლის გასაყინად.
HEN: Check whether the ice is "cold enough" to freeze all the water.
SKA: წყალი $0\ \text{°C}$-მდე: $4200 \cdot 0{,}1 \cdot 20 = 8400\ \text{ჯ}$; ყინული $0\ \text{°C}$-მდე იღებს მაქს. $2100 \cdot 0{,}5 \cdot 20 = 21\,000\ \text{ჯ}$.
წყლის მთლიანი გაყინვა გამოყოფს კიდევ $34\,000\ \text{ჯ}$-ს: $8400 + 34\,000 = 42\,400 > 21\,000$ — მთელი არ გაიყინება.
გაიყინება $m = \dfrac{21\,000 - 8400}{340\,000} \approx 0{,}037\ \text{კგ}$; $t = 0\ \text{°C}$, $\approx 537\ \text{გ}$ ყინული და $\approx 63\ \text{გ}$ წყალი.
SEN: Water to $0\ \text{°C}$: $4200 \cdot 0.1 \cdot 20 = 8400\ \text{J}$; the ice can absorb at most $2100 \cdot 0.5 \cdot 20 = 21\,000\ \text{J}$ warming to $0\ \text{°C}$.
Freezing all the water would release another $34\,000\ \text{J}$: $8400 + 34\,000 = 42\,400 > 21\,000$ — not all freezes.
Frozen: $m = \dfrac{21\,000 - 8400}{340\,000} \approx 0.037\ \text{kg}$; $t = 0\ \text{°C}$ with $\approx 537\ \text{g}$ ice and $\approx 63\ \text{g}$ water.
AKA: $0\ \text{°C}$; $\approx 537\ \text{გ}$ ყინული, $\approx 63\ \text{გ}$ წყალი
AEN: $0\ \text{°C}$; $\approx 537\ \text{g}$ ice, $\approx 63\ \text{g}$ water

--- hard melting
KA: მაცივარი წყალს $20\ \text{°C}$-დან ყინულად ($0\ \text{°C}$) $1$ საათში აქცევს; წყლის მასაა $1\ \text{კგ}$. რა სიმძლავრით ართმევს მაცივარი სითბოს წყალს?
EN: A freezer turns $1\ \text{kg}$ of water at $20\ \text{°C}$ into ice at $0\ \text{°C}$ in $1$ hour. At what rate does it remove heat from the water?
HKA: გაციება + გაყინვა.
HEN: Cooling + freezing.
SKA: $Q = 4200 \cdot 20 + 340\,000 = 424\ \text{კჯ}$
$N = \dfrac{424\,000}{3600} \approx 118\ \text{ვტ}$
SEN: $Q = 4200 \cdot 20 + 340\,000 = 424\ \text{kJ}$
$P = \dfrac{424\,000}{3600} \approx 118\ \text{W}$
AKA: $\approx 118\ \text{ვტ}$
AEN: $\approx 118\ \text{W}$

--- hard melting
KA: ტყვიის ტყვია ($t = 27\ \text{°C}$) კედელს ეჯახება. რა მინიმალური სიჩქარე უნდა ჰქონდეს, რომ სრულად გადნეს, თუ მთელი ენერგია მის გაცხელებაზე მიდის? ($c = 130$, $t_{\text{დ}} = 327\ \text{°C}$, $\lambda = 2{,}5 \times 10^4$)
EN: A lead bullet at $27\ \text{°C}$ hits a wall. What minimum speed would melt it completely if all its energy heated it? ($c = 130$, $t_{\text{m}} = 327\ \text{°C}$, $\lambda = 2.5 \times 10^4$)
HKA: $\dfrac{v^2}{2} = c \Delta t + \lambda$.
HEN: $\dfrac{v^2}{2} = c \Delta t + \lambda$.
SKA: $\dfrac{v^2}{2} = 130 \cdot 300 + 25\,000 = 39\,000 + 25\,000 = 64\,000$
$v = \sqrt{128\,000} \approx 358\ \text{მ/წმ}$
SEN: $\dfrac{v^2}{2} = 130 \cdot 300 + 25\,000 = 39\,000 + 25\,000 = 64\,000$
$v = \sqrt{128\,000} \approx 358\ \text{m/s}$
AKA: $\approx 358\ \text{მ/წმ}$
AEN: $\approx 358\ \text{m/s}$

--- hard melting
KA: $10\ \text{°C}$-იან $1\ \text{კგ}$ წყალში $-10\ \text{°C}$-იანი ყინული ჩადეს. რა მასისა უნდა იყოს ყინული, რომ საბოლოოდ მთელი ნარევი $0\ \text{°C}$-იანი წყალი იყოს?
EN: Ice at $-10\ \text{°C}$ is put into $1\ \text{kg}$ of water at $10\ \text{°C}$. What mass of ice gives exactly water at $0\ \text{°C}$ at the end (all ice just melted)?
HKA: $c_{\text{წყ}} M \cdot 10 = c_{\text{ყ}} m \cdot 10 + \lambda m$.
HEN: $c_{\text{w}} M \cdot 10 = c_{\text{ice}} m \cdot 10 + \lambda m$.
SKA: $42\,000 = m(21\,000 + 340\,000) \Rightarrow m = \dfrac{42\,000}{361\,000} \approx 0{,}116\ \text{კგ}$
SEN: $42\,000 = m(21\,000 + 340\,000) \Rightarrow m = \dfrac{42\,000}{361\,000} \approx 0.116\ \text{kg}$
AKA: $\approx 116\ \text{გ}$
AEN: $\approx 116\ \text{g}$

--- hard melting
KA: კალორიმეტრში $300\ \text{გ}$ წყალია $15\ \text{°C}$-ზე. მასში $50\ \text{გ}$ სველი თოვლი (წყლისა და ყინულის ნარევი, $0\ \text{°C}$) ჩაყარეს და ტემპერატურა $5\ \text{°C}$ გახდა. რამდენი წყალი იყო თოვლში?
EN: A calorimeter holds $300\ \text{g}$ of water at $15\ \text{°C}$. $50\ \text{g}$ of wet snow (ice + water at $0\ \text{°C}$) is added and the temperature becomes $5\ \text{°C}$. How much water was in the snow?
HKA: მხოლოდ ყინული დნება, მთელი $50\ \text{გ}$ კი $0$-დან $5\ \text{°C}$-მდე თბება.
HEN: Only the ice melts, but all $50\ \text{g}$ warms from $0$ to $5\ \text{°C}$.
SKA: გაცემული: $4200 \cdot 0{,}3 \cdot 10 = 12\,600\ \text{ჯ}$
მიღებული: $340\,000\, m_{\text{ყ}} + 4200 \cdot 0{,}05 \cdot 5 = 340\,000\, m_{\text{ყ}} + 1050$
$m_{\text{ყ}} = \dfrac{11\,550}{340\,000} \approx 0{,}034\ \text{კგ}$ — წყალი თოვლში $\approx 16\ \text{გ}$.
SEN: Given off: $4200 \cdot 0.3 \cdot 10 = 12\,600\ \text{J}$
Taken in: $340\,000\, m_{\text{ice}} + 4200 \cdot 0.05 \cdot 5 = 340\,000\, m_{\text{ice}} + 1050$
$m_{\text{ice}} = \dfrac{11\,550}{340\,000} \approx 0.034\ \text{kg}$ — water in the snow $\approx 16\ \text{g}$.
AKA: $\approx 16\ \text{გ}$
AEN: $\approx 16\ \text{g}$

--- hard melting olympiad
KA: ზედმეტად გაცივებული წყალი ($-8\ \text{°C}$, თხევადი) შეანჯღრიეს და ნაწილი უცებ გაიყინა; ტემპერატურა $0\ \text{°C}$ გახდა. წყლის რა ნაწილი გაიყინა?
EN: Supercooled water at $-8\ \text{°C}$ (still liquid) is shaken, and part of it suddenly freezes; the temperature jumps to $0\ \text{°C}$. What fraction froze?
HKA: გაყინვისას გამოყოფილი სითბო მთელ მასას $-8$-დან $0\ \text{°C}$-მდე ათბობს.
HEN: The heat released by freezing warms the whole mass from $-8$ to $0\ \text{°C}$.
SKA: $\lambda x m = c m \cdot 8$ (დაახლოებით $c = c_{\text{წყ}}$)
$x = \dfrac{4200 \cdot 8}{340\,000} \approx 0{,}1$ — დაახლოებით $10\%$.
SEN: $\lambda x m = c m \cdot 8$ (taking $c \approx c_{\text{w}}$)
$x = \dfrac{4200 \cdot 8}{340\,000} \approx 0.1$ — about $10\%$.
AKA: $\approx 10\%$
AEN: $\approx 10\%$

--- hard melting olympiad
KA: ტბაზე $20\ \text{სმ}$ ყინულია. ჰაერი $-10\ \text{°C}$-ია. რატომ იზრდება ყინულის სისქე სულ უფრო ნელა? შეაფასეთ, რამდენი სითბო უნდა გავიდეს $1\ \text{მ}^2$-ზე, რომ ყინული კიდევ $1\ \text{სმ}$-ით გასქელდეს ($\rho = 900\ \text{კგ/მ}^3$).
EN: A lake has $20\ \text{cm}$ of ice; the air is $-10\ \text{°C}$. Why does the ice thicken ever more slowly? Estimate how much heat must leave each $1\ \text{m}^2$ for the ice to thicken by $1\ \text{cm}$ ($\rho = 900\ \text{kg/m}^3$).
HKA: ყინული თავად თბოიზოლატორია; ახალი ფენის გაყინვისას გამოყოფილი სითბო ყინულის სისქეში უნდა გაიაროს.
HEN: Ice itself insulates; the heat from freezing the new layer must pass through the whole ice sheet.
SKA: რაც უფრო სქელია ყინული, მით ნელა გადის მასში სითბო წყლიდან ჰაერისკენ — ზრდა ნელდება.
$m = 900 \cdot 1 \cdot 0{,}01 = 9\ \text{კგ}$, $\ Q = 340\,000 \cdot 9 \approx 3{,}1\ \text{მჯ}$
SEN: The thicker the ice, the more slowly heat passes through it from the water to the air — growth slows down.
$m = 900 \cdot 1 \cdot 0.01 = 9\ \text{kg}$, $\ Q = 340\,000 \cdot 9 \approx 3.1\ \text{MJ}$
AKA: ყინული იზოლატორია; $\approx 3{,}1\ \text{მჯ}$
AEN: the ice insulates; $\approx 3.1\ \text{MJ}$

--- hard melting olympiad
KA: ერთნაირ ჭიქებში $0\ \text{°C}$-იანი ყინული და იმავე მასის $0\ \text{°C}$-იანი წყალია. თითოეულში $80\ \text{°C}$-იანი ტოლი მასის წყალი დაასხეს. იპოვეთ საბოლოო ტემპერატურები.
EN: Identical glasses contain ice at $0\ \text{°C}$ and the same mass of water at $0\ \text{°C}$. Into each an equal mass of water at $80\ \text{°C}$ is poured. Find the final temperatures.
HKA: ყინულის დნობას $\lambda m$ სჭირდება, ცხელ წყალს კი $0\ \text{°C}$-მდე მხოლოდ $c m \cdot 80$ შეუძლია.
HEN: Melting the ice needs $\lambda m$, while the hot water can give only $c m \cdot 80$ down to $0\ \text{°C}$.
SKA: წყალი: $t = \dfrac{0 + 80}{2} = 40\ \text{°C}$.
ყინული: $c m \cdot 80 = 4200 \cdot 80\, m = 336\,000\, m < 340\,000\, m$ — ყინული თითქმის მთლიანად დნება, მაგრამ $t = 0\ \text{°C}$ (დარჩება $\approx 1\%$ ყინული).
SEN: Water: $t = \dfrac{0 + 80}{2} = 40\ \text{°C}$.
Ice: $c m \cdot 80 = 4200 \cdot 80\, m = 336\,000\, m < 340\,000\, m$ — the ice almost all melts, but $t = 0\ \text{°C}$ (about $1\%$ ice remains).
AKA: $40\ \text{°C}$ და $0\ \text{°C}$
AEN: $40\ \text{°C}$ and $0\ \text{°C}$

--- hard melting olympiad
KA: ჭურჭელში $0\ \text{°C}$-იანი წყალია. მის ზემოთ ჰაერის ამოტუმბვისას წყალი ინტენსიურად ორთქლდება და იყინება. წყლის რა ნაწილი გაიყინება, თუ ორთქლდება მხოლოდ ის, რაც გაყინვას სითბოს „ართმევს“? ($L_{0\ \text{°C}} \approx 2{,}5 \times 10^6\ \text{ჯ/კგ}$)
EN: Air is pumped out above water at $0\ \text{°C}$; the water evaporates fast and freezes. What fraction of the water freezes, if the evaporating part takes away exactly the heat released by freezing? ($L$ at $0\ \text{°C} \approx 2.5 \times 10^6\ \text{J/kg}$)
HKA: $\lambda m_{\text{ყ}} = L m_{\text{ორთ}}$, $m_{\text{ყ}} + m_{\text{ორთ}} = m$.
HEN: $\lambda m_{\text{ice}} = L m_{\text{vap}}$, $m_{\text{ice}} + m_{\text{vap}} = m$.
SKA: $\dfrac{m_{\text{ყ}}}{m_{\text{ორთ}}} = \dfrac{L}{\lambda} = \dfrac{2{,}5 \times 10^6}{3{,}4 \times 10^5} \approx 7{,}35$
$\dfrac{m_{\text{ყ}}}{m} = \dfrac{7{,}35}{8{,}35} \approx 0{,}88$
SEN: $\dfrac{m_{\text{ice}}}{m_{\text{vap}}} = \dfrac{L}{\lambda} = \dfrac{2.5 \times 10^6}{3.4 \times 10^5} \approx 7.35$
$\dfrac{m_{\text{ice}}}{m} = \dfrac{7.35}{8.35} \approx 0.88$
AKA: $\approx 88\%$
AEN: $\approx 88\%$

--- easy vapor
KA: რამდენი სითბოა საჭირო $2\ \text{კგ}$ წყლის $100\ \text{°C}$-ზე ორთქლად გადასაქცევად?
EN: How much heat turns $2\ \text{kg}$ of water at $100\ \text{°C}$ into steam?
HKA: $Q = L m$.
HEN: $Q = L m$.
SKA: $Q = 2{,}3 \times 10^6 \cdot 2 = 4{,}6\ \text{მჯ}$
SEN: $Q = 2.3 \times 10^6 \cdot 2 = 4.6\ \text{MJ}$
AKA: $4{,}6\ \text{მჯ}$
AEN: $4.6\ \text{MJ}$

--- easy vapor
KA: რით განსხვავდება აორთქლება დუღილისგან?
EN: How does evaporation differ from boiling?
HKA: სად და რა ტემპერატურაზე ხდება თითოეული.
HEN: Where and at what temperature each happens.
SKA: აორთქლება ხდება ნებისმიერ ტემპერატურაზე და მხოლოდ სითხის ზედაპირიდან.
დუღილი ხდება განსაზღვრულ ტემპერატურაზე (მოცემული წნევისას) და მთელ მოცულობაში — სითხეში ორთქლის ბუშტები წარმოიქმნება.
SEN: Evaporation happens at any temperature and only from the liquid's surface.
Boiling happens at a definite temperature (for a given pressure) and throughout the liquid — vapour bubbles form inside it.
AKA: აორთქლება — ზედაპირიდან, ნებისმიერ $t$-ზე; დუღილი — მთელ მოცულობაში, განსაზღვრულ $t$-ზე
AEN: evaporation — from the surface at any $t$; boiling — throughout the liquid at a set $t$

--- easy vapor
KA: რამდენი სითბო გამოიყოფა $300\ \text{გ}$ ორთქლის ($100\ \text{°C}$) კონდენსაციისას?
EN: How much heat is released when $300\ \text{g}$ of steam at $100\ \text{°C}$ condenses?
HKA: კონდენსაციისას $L m$ სითბო გამოიყოფა.
HEN: Condensation releases $L m$ of heat.
SKA: $Q = 2{,}3 \times 10^6 \cdot 0{,}3 = 690\ \text{კჯ}$
SEN: $Q = 2.3 \times 10^6 \cdot 0.3 = 690\ \text{kJ}$
AKA: $690\ \text{კჯ}$
AEN: $690\ \text{kJ}$

--- easy vapor
KA: რატომ შრება სველი ტანსაცმელი ქარიან ამინდში უფრო სწრაფად?
EN: Why do wet clothes dry faster on a windy day?
HKA: ქარი ზედაპირიდან ორთქლს აშორებს.
HEN: The wind carries the vapour away from the surface.
SKA: ქარი ქსოვილის თავზე დაგროვილ წყლის ორთქლს აშორებს, ამიტომ წყლის ახალი მოლეკულები უფრო ადვილად გამოდიან — აორთქლება ჩქარდება.
SEN: The wind removes the water vapour gathered over the fabric, so new water molecules escape more easily — evaporation speeds up.
AKA: ქარი ორთქლს აშორებს — აორთქლება ჩქარდება
AEN: the wind removes the vapour — evaporation speeds up

--- easy vapor
KA: $4{,}6\ \text{მჯ}$ სითბოთი რამდენი $100\ \text{°C}$-იანი წყალი აორთქლდება?
EN: How much water at $100\ \text{°C}$ can $4.6\ \text{MJ}$ of heat boil away?
HKA: $m = \dfrac{Q}{L}$.
HEN: $m = \dfrac{Q}{L}$.
SKA: $m = \dfrac{4{,}6 \times 10^6}{2{,}3 \times 10^6} = 2\ \text{კგ}$
SEN: $m = \dfrac{4.6 \times 10^6}{2.3 \times 10^6} = 2\ \text{kg}$
AKA: $2\ \text{კგ}$
AEN: $2\ \text{kg}$

--- easy vapor
KA: რატომ გვცივა, როცა ფეხზე სპირტს ვისვამთ?
EN: Why does rubbing alcohol on your skin feel cold?
HKA: აორთქლებას სითბო სჭირდება.
HEN: Evaporation needs heat.
SKA: სპირტი სწრაფად ორთქლდება და ამისთვის სითბოს კანიდან იღებს — კანი ცივდება.
SEN: Alcohol evaporates quickly and takes the heat it needs from the skin — the skin cools.
AKA: აორთქლება კანიდან სითბოს იღებს
AEN: evaporation draws heat from the skin

--- medium vapor
KA: რამდენი სითბოა საჭირო $1\ \text{კგ}$ წყლის $40\ \text{°C}$-დან სრულად აორთქლებისთვის?
EN: How much heat completely boils away $1\ \text{kg}$ of water starting at $40\ \text{°C}$?
HKA: გათბობა $100\ \text{°C}$-მდე + აორთქლება.
HEN: Warm to $100\ \text{°C}$ + vaporise.
SKA: $Q = 4200 \cdot 60 + 2{,}3 \times 10^6 = 252\,000 + 2\,300\,000 = 2{,}552\ \text{მჯ}$
SEN: $Q = 4200 \cdot 60 + 2.3 \times 10^6 = 252\,000 + 2\,300\,000 = 2.552\ \text{MJ}$
AKA: $\approx 2{,}55\ \text{მჯ}$
AEN: $\approx 2.55\ \text{MJ}$

--- medium vapor
KA: $100\ \text{°C}$-იანი $50\ \text{გ}$ ორთქლი კონდენსირდება და $30\ \text{°C}$-მდე ცივდება. რამდენი სითბო გამოიყოფა?
EN: $50\ \text{g}$ of steam at $100\ \text{°C}$ condenses and cools to $30\ \text{°C}$. How much heat is released?
HKA: კონდენსაცია + გაციება.
HEN: Condensation + cooling.
SKA: $Q = 2{,}3 \times 10^6 \cdot 0{,}05 + 4200 \cdot 0{,}05 \cdot 70 = 115\,000 + 14\,700 = 129{,}7\ \text{კჯ}$
SEN: $Q = 2.3 \times 10^6 \cdot 0.05 + 4200 \cdot 0.05 \cdot 70 = 115\,000 + 14\,700 = 129.7\ \text{kJ}$
AKA: $\approx 130\ \text{კჯ}$
AEN: $\approx 130\ \text{kJ}$

--- medium vapor
KA: მდუღარე წყლით სავსე ჩაიდანი ($2\ \text{კვტ}$) დაგვავიწყდა. რამდენი წყალი აორთქლდება $10$ წუთში, თუ სითბოს $80\%$ წყალს ხვდება?
EN: A $2\ \text{kW}$ kettle full of boiling water is left on. How much water boils away in $10$ minutes if $80\%$ of the heat reaches the water?
HKA: $\eta N t = L m$.
HEN: $\eta P t = L m$.
SKA: $m = \dfrac{0{,}8 \cdot 2000 \cdot 600}{2{,}3 \times 10^6} = \dfrac{960\,000}{2{,}3 \times 10^6} \approx 0{,}42\ \text{კგ}$
SEN: $m = \dfrac{0.8 \cdot 2000 \cdot 600}{2.3 \times 10^6} = \dfrac{960\,000}{2.3 \times 10^6} \approx 0.42\ \text{kg}$
AKA: $\approx 0{,}42\ \text{კგ}$
AEN: $\approx 0.42\ \text{kg}$

--- medium vapor
KA: რატომ დუღს წყალი მთაზე ($3000\ \text{მ}$) დაახლოებით $90\ \text{°C}$-ზე? შეიძლება თუ არა იქ კვერცხის მოხარშვა ჩვეულებრივ დროში?
EN: Why does water boil at about $90\ \text{°C}$ on a $3000\ \text{m}$ mountain? Can an egg be boiled there in the usual time?
HKA: დუღილის ტემპერატურა გარე წნევაზეა დამოკიდებული.
HEN: The boiling point depends on the outside pressure.
SKA: მაღლა ატმოსფერული წნევა ნაკლებია, ამიტომ ორთქლის ბუშტების წარმოქმნა ადრე, უფრო დაბალ ტემპერატურაზე იწყება.
$90\ \text{°C}$-იან წყალში ცილა ნელა იხარშება — კვერცხს მეტი დრო სჭირდება.
SEN: Higher up the air pressure is lower, so vapour bubbles can form at a lower temperature.
In water at $90\ \text{°C}$ the protein cooks slowly — the egg needs longer.
AKA: დაბალი წნევის გამო; ხარშვა უფრო დიდხანს გრძელდება
AEN: because of the lower pressure; cooking takes longer

--- medium vapor
KA: რამდენი $100\ \text{°C}$-იანი ორთქლი უნდა გავატაროთ $2\ \text{კგ}$ $20\ \text{°C}$-იან წყალში, რომ ის $50\ \text{°C}$-მდე გათბეს?
EN: How much steam at $100\ \text{°C}$ must be passed into $2\ \text{kg}$ of water at $20\ \text{°C}$ to warm it to $50\ \text{°C}$?
HKA: $L m + c m (100 - 50) = c M (50 - 20)$.
HEN: $L m + c m (100 - 50) = c M (50 - 20)$.
SKA: $m (2{,}3 \times 10^6 + 210\,000) = 4200 \cdot 2 \cdot 30 = 252\,000$
$m = \dfrac{252\,000}{2{,}51 \times 10^6} \approx 0{,}1\ \text{კგ}$
SEN: $m (2.3 \times 10^6 + 210\,000) = 4200 \cdot 2 \cdot 30 = 252\,000$
$m = \dfrac{252\,000}{2.51 \times 10^6} \approx 0.1\ \text{kg}$
AKA: $\approx 100\ \text{გ}$
AEN: $\approx 100\ \text{g}$

--- medium vapor
KA: რატომ უფრო საშიშია $100\ \text{°C}$-იანი ორთქლით დაწვა, ვიდრე $100\ \text{°C}$-იანი წყლით? შეადარეთ სითბო, რომელსაც $10\ \text{გ}$ ორთქლი და $10\ \text{გ}$ წყალი გასცემს $37\ \text{°C}$-მდე გაციებისას.
EN: Why is a burn from steam at $100\ \text{°C}$ worse than from water at $100\ \text{°C}$? Compare the heat given off by $10\ \text{g}$ of each cooling to $37\ \text{°C}$.
HKA: ორთქლი ჯერ კონდენსირდება.
HEN: The steam condenses first.
SKA: წყალი: $4200 \cdot 0{,}01 \cdot 63 \approx 2650\ \text{ჯ}$
ორთქლი: $2{,}3 \times 10^6 \cdot 0{,}01 + 2650 = 23\,000 + 2650 = 25\,650\ \text{ჯ}$ — თითქმის $10$-ჯერ მეტი.
SEN: Water: $4200 \cdot 0.01 \cdot 63 \approx 2650\ \text{J}$
Steam: $2.3 \times 10^6 \cdot 0.01 + 2650 = 23\,000 + 2650 = 25\,650\ \text{J}$ — almost $10$ times more.
AKA: ორთქლი $\approx 10$-ჯერ მეტ სითბოს გასცემს
AEN: steam gives off $\approx 10$ times more heat

--- medium vapor
KA: ღია ჭურჭელში წყლის აორთქლება $20\ \text{°C}$-ზეც ხდება. რატომ ცივდება წყალი აორთქლებისას?
EN: Water in an open dish evaporates even at $20\ \text{°C}$. Why does the water cool as it evaporates?
HKA: რომელი მოლეკულები ტოვებენ სითხეს?
HEN: Which molecules leave the liquid?
SKA: სითხეს ტოვებს უფრო სწრაფი მოლეკულები (მათ საკმარისი ენერგია აქვთ მიზიდვის დასაძლევად). დარჩენილი მოლეკულების საშუალო კინეტიკური ენერგია მცირდება — ტემპერატურა ეცემა.
SEN: The fastest molecules leave (they have enough energy to escape the attraction). The average kinetic energy of those left drops — the temperature falls.
AKA: სწრაფი მოლეკულები გადიან, საშუალო ენერგია მცირდება
AEN: the fastest molecules leave, lowering the average energy

--- medium vapor
KA: გაზქურაზე წყალი $10$ წუთში $20\ \text{°C}$-დან დუღილამდე თბება. კიდევ რამდენ ხანში აორთქლდება მთლიანად, თუ სითბოს მიწოდება მუდმივია?
EN: On a gas stove water warms from $20\ \text{°C}$ to the boil in $10$ minutes. How much longer until it all boils away, if the heat supply is constant?
HKA: დრო სითბოს პროპორციულია: $\dfrac{t_2}{t_1} = \dfrac{L}{c \cdot 80}$.
HEN: Time is proportional to heat: $\dfrac{t_2}{t_1} = \dfrac{L}{c \cdot 80}$.
SKA: $\dfrac{t_2}{t_1} = \dfrac{2{,}3 \times 10^6}{4200 \cdot 80} = \dfrac{2{,}3 \times 10^6}{336\,000} \approx 6{,}85$
$t_2 \approx 68\ \text{წთ}$
SEN: $\dfrac{t_2}{t_1} = \dfrac{2.3 \times 10^6}{4200 \cdot 80} = \dfrac{2.3 \times 10^6}{336\,000} \approx 6.85$
$t_2 \approx 68\ \text{min}$
AKA: $\approx 68\ \text{წთ}$
AEN: $\approx 68\ \text{min}$

--- hard vapor
KA: $5\ \text{კგ}$ ყინულის ($-20\ \text{°C}$) $100\ \text{°C}$-იან ორთქლად გადაქცევისთვის რამდენი სითბოა საჭირო? რომელ ეტაპზე იხარჯება ყველაზე მეტი?
EN: How much heat turns $5\ \text{kg}$ of ice at $-20\ \text{°C}$ into steam at $100\ \text{°C}$? Which stage takes the most?
HKA: ოთხი ეტაპი: ყინულის გათბობა, დნობა, წყლის გათბობა, აორთქლება.
HEN: Four stages: warm the ice, melt, warm the water, boil.
SKA: $Q_1 = 2100 \cdot 5 \cdot 20 = 210\ \text{კჯ}$
$Q_2 = 340\,000 \cdot 5 = 1700\ \text{კჯ}$
$Q_3 = 4200 \cdot 5 \cdot 100 = 2100\ \text{კჯ}$
$Q_4 = 2{,}3 \times 10^6 \cdot 5 = 11\,500\ \text{კჯ}$
$Q = 15{,}51\ \text{მჯ}$; ყველაზე მეტი — აორთქლებაზე.
SEN: $Q_1 = 2100 \cdot 5 \cdot 20 = 210\ \text{kJ}$
$Q_2 = 340\,000 \cdot 5 = 1700\ \text{kJ}$
$Q_3 = 4200 \cdot 5 \cdot 100 = 2100\ \text{kJ}$
$Q_4 = 2.3 \times 10^6 \cdot 5 = 11\,500\ \text{kJ}$
$Q = 15.51\ \text{MJ}$; boiling takes the most.
AKA: $\approx 15{,}5\ \text{მჯ}$; აორთქლება
AEN: $\approx 15.5\ \text{MJ}$; boiling

--- hard vapor
KA: $1\ \text{კგ}$ ყინულში ($0\ \text{°C}$) $100\ \text{°C}$-იანი ორთქლი გაატარეს. რამდენი ორთქლია საჭირო, რომ მივიღოთ $40\ \text{°C}$-იანი წყალი?
EN: Steam at $100\ \text{°C}$ is passed into $1\ \text{kg}$ of ice at $0\ \text{°C}$. How much steam gives water at $40\ \text{°C}$?
HKA: $m(L + c \cdot 60) = \lambda M + c M \cdot 40$.
HEN: $m(L + c \cdot 60) = \lambda M + c M \cdot 40$.
SKA: $m(2{,}3 \times 10^6 + 252\,000) = 340\,000 + 168\,000 = 508\,000$
$m = \dfrac{508\,000}{2{,}552 \times 10^6} \approx 0{,}2\ \text{კგ}$
SEN: $m(2.3 \times 10^6 + 252\,000) = 340\,000 + 168\,000 = 508\,000$
$m = \dfrac{508\,000}{2.552 \times 10^6} \approx 0.2\ \text{kg}$
AKA: $\approx 200\ \text{გ}$
AEN: $\approx 200\ \text{g}$

--- hard vapor
KA: ადამიანი ($70\ \text{კგ}$) ვარჯიშისას $500\ \text{ვტ}$ ზედმეტ სითბოს გამოყოფს. რამდენი ოფლი უნდა აორთქლდეს საათში, რომ ტემპერატურა არ გაიზარდოს? ($L_{37\ \text{°C}} \approx 2{,}4 \times 10^6\ \text{ჯ/კგ}$)
EN: During exercise a $70\ \text{kg}$ person produces $500\ \text{W}$ of extra heat. How much sweat must evaporate per hour to keep the temperature steady? ($L$ at $37\ \text{°C} \approx 2.4 \times 10^6\ \text{J/kg}$)
HKA: $N t = L m$.
HEN: $P t = L m$.
SKA: $m = \dfrac{500 \cdot 3600}{2{,}4 \times 10^6} = 0{,}75\ \text{კგ}$
SEN: $m = \dfrac{500 \cdot 3600}{2.4 \times 10^6} = 0.75\ \text{kg}$
AKA: $\approx 0{,}75\ \text{ლ}$
AEN: $\approx 0.75\ \text{L}$

--- hard vapor
KA: კალორიმეტრში $400\ \text{გ}$ წყალია $10\ \text{°C}$-ზე. მასში $20\ \text{გ}$ ორთქლი ($100\ \text{°C}$) და $50\ \text{გ}$ ყინული ($0\ \text{°C}$) შეიყვანეს. იპოვეთ საბოლოო ტემპერატურა.
EN: A calorimeter holds $400\ \text{g}$ of water at $10\ \text{°C}$. $20\ \text{g}$ of steam at $100\ \text{°C}$ and $50\ \text{g}$ of ice at $0\ \text{°C}$ are added. Find the final temperature.
HKA: დაწერეთ ჯამური სითბური ბალანსი $t$-სთვის (ვივარაუდოთ, რომ ყინული დნება და ორთქლი კონდენსირდება).
HEN: Write the total heat balance in $t$ (assume the ice melts and the steam condenses).
SKA: ორთქლი: $0{,}02(2{,}3 \times 10^6 + 4200(100 - t))$; ყინული: $0{,}05(340\,000 + 4200 t)$; წყალი: $0{,}4 \cdot 4200 (t - 10)$
$46\,000 + 8400 - 84 t = 17\,000 + 210 t + 1680 t - 16\,800$
$54\,400 - 200 = 1974 t \Rightarrow t \approx 27{,}5\ \text{°C}$
SEN: Steam: $0.02(2.3 \times 10^6 + 4200(100 - t))$; ice: $0.05(340\,000 + 4200 t)$; water: $0.4 \cdot 4200 (t - 10)$
$46\,000 + 8400 - 84 t = 17\,000 + 210 t + 1680 t - 16\,800$
$54\,400 - 200 = 1974 t \Rightarrow t \approx 27.5\ \text{°C}$
AKA: $\approx 27{,}5\ \text{°C}$
AEN: $\approx 27.5\ \text{°C}$

--- hard vapor olympiad
KA: ქვაბში წყალი დუღს. რატომ ხდება ქვაბის თავზე თეთრი „ორთქლის“ ღრუბელი უფრო სქელი ქურის ჩაქრობისთანავე, ვიდრე დუღილისას?
EN: Why does the white "steam" cloud above a boiling pot get thicker right after the burner is switched off?
HKA: თეთრი ღრუბელი — ეს არის წვრილი წვეთები, არა ორთქლი. მათი წარმოქმნა ჰაერის ტემპერატურაზეა დამოკიდებული.
HEN: The white cloud is tiny droplets, not vapour. Whether they form depends on the air temperature above the pot.
SKA: წყლის ორთქლი უხილავია; ჩვენ ვხედავთ კონდენსაციით წარმოქმნილ წვეთებს.
დუღილისას ქურის ალი ქვაბის ირგვლივ ჰაერს აცხელებს და ორთქლი ნაკლებად კონდენსირდება.
ჩაქრობის შემდეგ ცხელი ჰაერის ნაკადი ქრება, ორთქლი ცივ ჰაერში ხვდება და უფრო მეტი წვეთი წარმოიქმნება.
SEN: Water vapour is invisible; what we see are droplets formed by condensation.
While the burner is on, its flame heats the air around the pot and less vapour condenses.
Once it's off, the hot air flow stops, the vapour meets cooler air and more droplets form.
AKA: ცივ ჰაერში მეტი ორთქლი კონდენსირდება წვეთებად
AEN: in cooler air more vapour condenses into droplets

--- hard vapor olympiad
KA: ქოთანში $0{,}5\ \text{კგ}$ წყალი $100\ \text{°C}$-ზე დუღს. ქოთანს თავსახური ახურავს; ზედაპირიდან სითბოს დანაკარგი არ არის. ქოთანში $10\ \text{გ}$ ყინულს ($0\ \text{°C}$) ჩააგდებენ. რამდენი ხნით შეწყდება დუღილი, თუ ქურა $600\ \text{ვტ}$ სასარგებლო სიმძლავრით ათბობს?
EN: In a covered pot $0.5\ \text{kg}$ of water is boiling at $100\ \text{°C}$. $10\ \text{g}$ of ice at $0\ \text{°C}$ is dropped in. For how long does boiling stop if the stove delivers $600\ \text{W}$ of useful power?
HKA: ყინულის დნობისა და $100\ \text{°C}$-მდე გათბობის სითბო ქურამ უნდა „აანაზღაუროს“.
HEN: The stove must make up the heat for melting the ice and warming it to $100\ \text{°C}$.
SKA: $Q = 0{,}01(340\,000 + 4200 \cdot 100) = 0{,}01 \cdot 760\,000 = 7600\ \text{ჯ}$
$t = \dfrac{7600}{600} \approx 12{,}7\ \text{წმ}$
SEN: $Q = 0.01(340\,000 + 4200 \cdot 100) = 0.01 \cdot 760\,000 = 7600\ \text{J}$
$t = \dfrac{7600}{600} \approx 12.7\ \text{s}$
AKA: $\approx 13\ \text{წმ}$
AEN: $\approx 13\ \text{s}$

--- easy fuel
KA: რამდენი სითბო გამოიყოფა $5\ \text{კგ}$ ბენზინის სრული წვისას? ($q = 4{,}6 \times 10^7\ \text{ჯ/კგ}$)
EN: How much heat is released when $5\ \text{kg}$ of petrol burns completely? ($q = 4.6 \times 10^7\ \text{J/kg}$)
HKA: $Q = q m$.
HEN: $Q = q m$.
SKA: $Q = 4{,}6 \times 10^7 \cdot 5 = 2{,}3 \times 10^8\ \text{ჯ} = 230\ \text{მჯ}$

--- easy fuel
KA: რამდენი შეშა ($q = 10^7\ \text{ჯ/კგ}$) უნდა დაიწვას, რომ $50\ \text{მჯ}$ სითბო მივიღოთ?
EN: How much firewood ($q = 10^7\ \text{J/kg}$) must be burned to get $50\ \text{MJ}$ of heat?
HKA: $m = \dfrac{Q}{q}$.

--- easy fuel
KA: რას ნიშნავს, რომ ბუნებრივი აირის წვის ხვედრითი სითბოა $4{,}4 \times 10^7\ \text{ჯ/კგ}$?
EN: What does it mean that natural gas has a specific heat of combustion of $4.4 \times 10^7\ \text{J/kg}$?
HKA: წვის ხვედრითი სითბოს განმარტება.

SKA: $1\ \text{კგ}$ აირის სრული წვისას $4{,}4 \times 10^7\ \text{ჯ}$ სითბო გამოიყოფა.

--- easy fuel
KA: რომელი გამოყოფს მეტ სითბოს: $2\ \text{კგ}$ ქვანახშირი ($q = 2{,}7 \times 10^7$) თუ $1\ \text{კგ}$ ბენზინი ($q = 4{,}6 \times 10^7$)?
EN: Which releases more heat: $2\ \text{kg}$ of coal ($q = 2.7 \times 10^7$) or $1\ \text{kg}$ of petrol ($q = 4.6 \times 10^7$)?
HKA: გამოთვალეთ ორივე.
HEN: Work out both.
SKA: ქვანახშირი: $5{,}4 \times 10^7\ \text{ჯ}$; ბენზინი: $4{,}6 \times 10^7\ \text{ჯ}$.
ქვანახშირი მეტს გამოყოფს.
SEN: Coal: $5.4 \times 10^7\ \text{J}$; petrol: $4.6 \times 10^7\ \text{J}$.
The coal releases more.
AKA: $2\ \text{კგ}$ ქვანახშირი
AEN: the $2\ \text{kg}$ of coal

--- medium fuel
KA: რამდენი ბუნებრივი აირი ($q = 4{,}4 \times 10^7$) უნდა დაიწვას $5\ \text{კგ}$ წყლის $20\ \text{°C}$-დან დუღილამდე გასათბობად, თუ სითბოს $40\%$ წყალს ხვდება?
EN: How much natural gas ($q = 4.4 \times 10^7$) must burn to heat $5\ \text{kg}$ of water from $20\ \text{°C}$ to the boil, if $40\%$ of the heat reaches the water?
HKA: $\eta q m_{\text{ა}} = c m \Delta t$.
HEN: $\eta q m_{\text{g}} = c m \Delta t$.
SKA: $Q = 4200 \cdot 5 \cdot 80 = 1{,}68\ \text{მჯ}$
$m_{\text{ა}} = \dfrac{1{,}68 \times 10^6}{0{,}4 \cdot 4{,}4 \times 10^7} \approx 0{,}095\ \text{კგ}$
SEN: $Q = 4200 \cdot 5 \cdot 80 = 1.68\ \text{MJ}$
$m_{\text{g}} = \dfrac{1.68 \times 10^6}{0.4 \cdot 4.4 \times 10^7} \approx 0.095\ \text{kg}$
AKA: $\approx 95\ \text{გ}$
AEN: $\approx 95\ \text{g}$

--- medium fuel
KA: $20\ \text{გ}$ სპირტის ($q = 2{,}7 \times 10^7$) წვით $1\ \text{კგ}$ წყალი $20\ \text{°C}$-დან $80\ \text{°C}$-მდე გათბა. იპოვეთ სპირტქურის სმკ.
EN: Burning $20\ \text{g}$ of alcohol ($q = 2.7 \times 10^7$) heats $1\ \text{kg}$ of water from $20\ \text{°C}$ to $80\ \text{°C}$. Find the burner's efficiency.
HKA: $\eta = \dfrac{c m \Delta t}{q m_{\text{ს}}}$.
HEN: $\eta = \dfrac{c m \Delta t}{q m_{\text{a}}}$.
SKA: $Q_{\text{ს}} = 4200 \cdot 60 = 252\ \text{კჯ}$, $\ Q = 2{,}7 \times 10^7 \cdot 0{,}02 = 540\ \text{კჯ}$
$\eta \approx 0{,}47 = 47\%$
SEN: $Q_{\text{u}} = 4200 \cdot 60 = 252\ \text{kJ}$, $\ Q = 2.7 \times 10^7 \cdot 0.02 = 540\ \text{kJ}$
$\eta \approx 0.47 = 47\%$
AKA: $\approx 47\%$
AEN: $\approx 47\%$

--- medium fuel
KA: ზამთარში სახლის გასათბობად დღეში $500\ \text{მჯ}$ სითბოა საჭირო. ღუმელის სმკ $60\%$-ია. რამდენი შეშა ($q = 10^7$) დასჭირდება $90$ დღეს?
EN: Heating a house in winter takes $500\ \text{MJ}$ a day. The stove is $60\%$ efficient. How much firewood ($q = 10^7$) is needed for $90$ days?
HKA: $m = \dfrac{Q_{\text{ს}}}{\eta q}$.
HEN: $m = \dfrac{Q_{\text{u}}}{\eta q}$.
SKA: $m_{\text{დღე}} = \dfrac{5 \times 10^8}{0{,}6 \cdot 10^7} \approx 83\ \text{კგ}$
$m = 83 \cdot 90 \approx 7500\ \text{კგ} = 7{,}5\ \text{ტ}$
SEN: $m_{\text{day}} = \dfrac{5 \times 10^8}{0.6 \cdot 10^7} \approx 83\ \text{kg}$
$m = 83 \cdot 90 \approx 7500\ \text{kg} = 7.5\ \text{t}$
AKA: $\approx 7{,}5\ \text{ტ}$
AEN: $\approx 7.5\ \text{t}$

--- medium fuel
KA: რამდენი ქვანახშირის ($q = 2{,}7 \times 10^7$) სითბო უდრის $1\ \text{ლ}$ ბენზინის ($\rho = 710\ \text{კგ/მ}^3$, $q = 4{,}6 \times 10^7$) წვის სითბოს?
EN: What mass of coal ($q = 2.7 \times 10^7$) gives the same heat as $1\ \text{L}$ of petrol ($\rho = 710\ \text{kg/m}^3$, $q = 4.6 \times 10^7$)?
HKA: $q_1 m_1 = q_2 m_2$.
HEN: $q_1 m_1 = q_2 m_2$.
SKA: $m_{\text{ბ}} = 0{,}71\ \text{კგ}$
$m_{\text{ქ}} = \dfrac{4{,}6 \cdot 0{,}71}{2{,}7} \approx 1{,}21\ \text{კგ}$
SEN: $m_{\text{p}} = 0.71\ \text{kg}$
$m_{\text{c}} = \dfrac{4.6 \cdot 0.71}{2.7} \approx 1.21\ \text{kg}$
AKA: $\approx 1{,}2\ \text{კგ}$
AEN: $\approx 1.2\ \text{kg}$

--- hard fuel
KA: რამდენი ბუნებრივი აირი ($q = 4{,}4 \times 10^7$) უნდა დაიწვას, რომ $2\ \text{კგ}$ ყინული ($-10\ \text{°C}$) $100\ \text{°C}$-იან წყლად გადავაქციოთ, თუ სმკ $50\%$-ია?
EN: How much natural gas ($q = 4.4 \times 10^7$) must burn to turn $2\ \text{kg}$ of ice at $-10\ \text{°C}$ into water at $100\ \text{°C}$, at $50\%$ efficiency?
HKA: ყინულის გათბობა + დნობა + წყლის გათბობა.
HEN: Warm the ice + melt + warm the water.
SKA: $Q = 2100 \cdot 2 \cdot 10 + 340\,000 \cdot 2 + 4200 \cdot 2 \cdot 100 = 42\,000 + 680\,000 + 840\,000 = 1{,}562\ \text{მჯ}$
$m = \dfrac{1{,}562 \times 10^6}{0{,}5 \cdot 4{,}4 \times 10^7} \approx 0{,}071\ \text{კგ}$
SEN: $Q = 2100 \cdot 2 \cdot 10 + 340\,000 \cdot 2 + 4200 \cdot 2 \cdot 100 = 42\,000 + 680\,000 + 840\,000 = 1.562\ \text{MJ}$
$m = \dfrac{1.562 \times 10^6}{0.5 \cdot 4.4 \times 10^7} \approx 0.071\ \text{kg}$
AKA: $\approx 71\ \text{გ}$
AEN: $\approx 71\ \text{g}$

--- hard fuel
KA: ტურისტულ ქურაზე ($\eta = 30\%$) $3\ \text{ლ}$ წყალი $10\ \text{°C}$-დან დუღილამდე უნდა გათბეს და შემდეგ $10\%$ აორთქლდეს. რამდენი ბენზინია ($q = 4{,}6 \times 10^7$) საჭირო?
EN: On a camping stove ($\eta = 30\%$) $3\ \text{L}$ of water must be brought from $10\ \text{°C}$ to the boil, and then $10\%$ of it boiled away. How much petrol ($q = 4.6 \times 10^7$) is needed?
HKA: $Q = c m \cdot 90 + L \cdot 0{,}1 m$.
HEN: $Q = c m \cdot 90 + L \cdot 0.1 m$.
SKA: $Q = 4200 \cdot 3 \cdot 90 + 2{,}3 \times 10^6 \cdot 0{,}3 = 1{,}134 \times 10^6 + 0{,}69 \times 10^6 = 1{,}824\ \text{მჯ}$
$m = \dfrac{1{,}824 \times 10^6}{0{,}3 \cdot 4{,}6 \times 10^7} \approx 0{,}13\ \text{კგ}$
SEN: $Q = 4200 \cdot 3 \cdot 90 + 2.3 \times 10^6 \cdot 0.3 = 1.134 \times 10^6 + 0.69 \times 10^6 = 1.824\ \text{MJ}$
$m = \dfrac{1.824 \times 10^6}{0.3 \cdot 4.6 \times 10^7} \approx 0.13\ \text{kg}$
AKA: $\approx 130\ \text{გ}$
AEN: $\approx 130\ \text{g}$

--- hard fuel
KA: ადამიანი დღეში $10\ \text{მჯ}$ ენერგიას იღებს საკვებიდან. რამდენი გრამი შაქრის ($q = 1{,}7 \times 10^7$) „წვის“ ექვივალენტურია ეს? რა სიმაღლეზე უნდა ავიდეს $70\ \text{კგ}$ ადამიანი, რომ ეს ენერგია მუშაობად აქციოს, თუ კუნთების სმკ $25\%$-ია?
EN: A person takes in $10\ \text{MJ}$ a day from food. How many grams of sugar ($q = 1.7 \times 10^7$) is that equivalent to? How high would a $70\ \text{kg}$ person have to climb to turn it into work, with $25\%$ muscle efficiency?
HKA: $m = \dfrac{E}{q}$; $\eta E = M g h$.
HEN: $m = \dfrac{E}{q}$; $\eta E = M g h$.
SKA: $m = \dfrac{10^7}{1{,}7 \times 10^7} \approx 0{,}59\ \text{კგ}$
$h = \dfrac{0{,}25 \cdot 10^7}{700} \approx 3570\ \text{მ}$
SEN: $m = \dfrac{10^7}{1.7 \times 10^7} \approx 0.59\ \text{kg}$
$h = \dfrac{0.25 \cdot 10^7}{700} \approx 3570\ \text{m}$
AKA: $\approx 590\ \text{გ}$; $\approx 3{,}6\ \text{კმ}$
AEN: $\approx 590\ \text{g}$; $\approx 3.6\ \text{km}$

--- hard fuel
KA: ქალაქის თბოელექტროსადგური ($\eta = 35\%$) $500\ \text{მვტ}$ ელექტროენერგიას აწარმოებს. რამდენ ქვანახშირს ($q = 2{,}9 \times 10^7$) წვავს დღეში?
EN: A city power station ($\eta = 35\%$) produces $500\ \text{MW}$ of electricity. How much coal ($q = 2.9 \times 10^7$) does it burn per day?
HKA: $m = \dfrac{N t}{\eta q}$.
HEN: $m = \dfrac{P t}{\eta q}$.
SKA: $m = \dfrac{5 \times 10^8 \cdot 86\,400}{0{,}35 \cdot 2{,}9 \times 10^7} = \dfrac{4{,}32 \times 10^{13}}{1{,}015 \times 10^7} \approx 4{,}3 \times 10^6\ \text{კგ}$
SEN: $m = \dfrac{5 \times 10^8 \cdot 86\,400}{0.35 \cdot 2.9 \times 10^7} = \dfrac{4.32 \times 10^{13}}{1.015 \times 10^7} \approx 4.3 \times 10^6\ \text{kg}$
AKA: $\approx 4300\ \text{ტ}$
AEN: $\approx 4300\ \text{t}$

--- easy expansion
KA: რატომ ტოვებენ სარკინიგზო რელსებს შორის მცირე ღრეჩოებს?
EN: Why are small gaps left between railway rails?
HKA: სხეულები გათბობისას ფართოვდება.
HEN: Bodies expand when heated.
SKA: ზაფხულში რელსები თბება და გრძელდება. ღრეჩოების გარეშე ისინი ერთმანეთს მიაწვებოდნენ და მოიღუნებოდნენ.
SEN: In summer the rails heat up and lengthen. Without gaps they would push against each other and buckle.
AKA: გათბობისას გაფართოებისთვის
AEN: to allow for expansion when hot

--- easy expansion
KA: $5\ \text{მ}$ სპილენძის მავთული ($\alpha = 1{,}7 \times 10^{-5}\ \text{°C}^{-1}$) $50\ \text{°C}$-ით გათბა. რამდენით დაგრძელდა?
EN: A $5\ \text{m}$ copper wire ($\alpha = 1.7 \times 10^{-5}\ \text{°C}^{-1}$) warms by $50\ \text{°C}$. By how much does it lengthen?
HKA: $\Delta l = \alpha l_0 \Delta t$.
HEN: $\Delta l = \alpha l_0 \Delta t$.
SKA: $\Delta l = 1{,}7 \times 10^{-5} \cdot 5 \cdot 50 = 4{,}25 \times 10^{-3}\ \text{მ} \approx 4{,}3\ \text{მმ}$
SEN: $\Delta l = 1.7 \times 10^{-5} \cdot 5 \cdot 50 = 4.25 \times 10^{-3}\ \text{m} \approx 4.3\ \text{mm}$
AKA: $\approx 4{,}3\ \text{მმ}$-ით
AEN: by $\approx 4.3\ \text{mm}$

--- easy expansion
KA: როგორ მუშაობს თხევადი თერმომეტრი?
EN: How does a liquid thermometer work?
HKA: სითხე გათბობისას ფართოვდება.
HEN: A liquid expands when heated.
SKA: გათბობისას სითხე (ვერცხლისწყალი ან სპირტი) ფართოვდება და ვიწრო მილში ადის; სვეტის სიმაღლე სკალაზე ტემპერატურას აჩვენებს.
SEN: When heated, the liquid (mercury or alcohol) expands and rises up a narrow tube; the height of the column on the scale shows the temperature.
AKA: სითხის თბური გაფართოებით
AEN: by the thermal expansion of a liquid

--- easy expansion
KA: რატომ ეკიდება ზაფხულში ელექტროგადამცემი ხაზების მავთულები უფრო დაბლა, ვიდრე ზამთარში?
EN: Why do power lines sag lower in summer than in winter?
HKA: მავთული სიცხეში გრძელდება.
HEN: The wire is longer when hot.
SKA: ზაფხულში მავთული თბება და გრძელდება — ბოძებს შორის მეტი სიგრძე ეტევა და ის უფრო ჩამოკიდებულია. ზამთარში მოკლდება და იჭიმება.
SEN: In summer the wire warms and lengthens — there's more wire between the poles so it sags. In winter it shortens and tightens.
AKA: სიცხეში მავთული გრძელდება
AEN: the wire lengthens in the heat

--- medium expansion
KA: ფოლადის ხიდის ($\alpha = 1{,}2 \times 10^{-5}$) სიგრძეა $500\ \text{მ}$. ტემპერატურა იცვლება $-25\ \text{°C}$-დან $+35\ \text{°C}$-მდე. რა სიგრძის უნდა იყოს ტემპერატურული ნაკერი?
EN: A steel bridge ($\alpha = 1.2 \times 10^{-5}$) is $500\ \text{m}$ long. The temperature ranges from $-25\ \text{°C}$ to $+35\ \text{°C}$. How wide must the expansion joint be?
HKA: $\Delta t = 60\ \text{°C}$.
HEN: $\Delta t = 60\ \text{°C}$.
SKA: $\Delta l = 1{,}2 \times 10^{-5} \cdot 500 \cdot 60 = 0{,}36\ \text{მ} = 36\ \text{სმ}$
SEN: $\Delta l = 1.2 \times 10^{-5} \cdot 500 \cdot 60 = 0.36\ \text{m} = 36\ \text{cm}$
AKA: არანაკლებ $36\ \text{სმ}$
AEN: at least $36\ \text{cm}$

--- medium expansion
KA: შუშის ქილის ლითონის თავსახური ძნელად იხსნება. რატომ ეხმარება ცხელ წყალში მისი ჩადება?
EN: A metal lid on a glass jar is hard to open. Why does running it under hot water help?
HKA: შეადარეთ ლითონისა და მინის გაფართოების კოეფიციენტები.
HEN: Compare the expansion coefficients of metal and glass.
SKA: ლითონის გაფართოების კოეფიციენტი მინისაზე მეტია. ცხელ წყალში თავსახური უფრო მეტად ფართოვდება, ვიდრე ქილის ყელი — ის ფხვიერდება და ადვილად იხსნება.
SEN: Metal expands more than glass. In hot water the lid expands more than the jar's neck — it loosens and comes off easily.
AKA: ლითონი მინაზე მეტად ფართოვდება
AEN: metal expands more than glass

--- medium expansion
KA: ალუმინის მავთული ($\alpha = 2{,}4 \times 10^{-5}$) $0\ \text{°C}$-ზე $100\ \text{მ}$-ია. რა სიგრძე ექნება $40\ \text{°C}$-ზე? რამდენით დამოკლდება $-30\ \text{°C}$-ზე?
EN: An aluminium wire ($\alpha = 2.4 \times 10^{-5}$) is $100\ \text{m}$ long at $0\ \text{°C}$. How long is it at $40\ \text{°C}$? How much shorter at $-30\ \text{°C}$?
HKA: $l = l_0 (1 + \alpha \Delta t)$.
HEN: $l = l_0 (1 + \alpha \Delta t)$.
SKA: $40\ \text{°C}$: $\Delta l = 2{,}4 \times 10^{-5} \cdot 100 \cdot 40 = 0{,}096\ \text{მ}$, $\ l = 100{,}096\ \text{მ}$
$-30\ \text{°C}$: $\Delta l = 2{,}4 \times 10^{-5} \cdot 100 \cdot 30 = 0{,}072\ \text{მ} = 7{,}2\ \text{სმ}$
SEN: $40\ \text{°C}$: $\Delta l = 2.4 \times 10^{-5} \cdot 100 \cdot 40 = 0.096\ \text{m}$, $\ l = 100.096\ \text{m}$
$-30\ \text{°C}$: $\Delta l = 2.4 \times 10^{-5} \cdot 100 \cdot 30 = 0.072\ \text{m} = 7.2\ \text{cm}$
AKA: $100{,}096\ \text{მ}$; $7{,}2\ \text{სმ}$-ით
AEN: $100.096\ \text{m}$; by $7.2\ \text{cm}$

--- medium expansion
KA: როგორ მუშაობს ბიმეტალური ფირფიტა (თერმოსტატში)? რატომ იღუნება გათბობისას?
EN: How does a bimetallic strip (in a thermostat) work? Why does it bend when heated?
HKA: ორი სხვადასხვა ლითონი სხვადასხვანაირად ფართოვდება.
HEN: Two different metals expand by different amounts.
SKA: ფირფიტა ორი შეწებებული ლითონისგანაა (მაგ., სპილენძი და ფოლადი). გათბობისას სპილენძი უფრო გრძელდება, ფირფიტა ფოლადის მხარეს იღუნება და ელექტრულ კონტაქტს წყვეტს ან კრავს.
SEN: The strip is two metals bonded together (e.g. brass and steel). When heated the brass lengthens more, the strip curls towards the steel and opens or closes an electrical contact.
AKA: ლითონები სხვადასხვანაირად ფართოვდება
AEN: the metals expand by different amounts

--- hard expansion
KA: ფოლადის რგოლის შიდა დიამეტრი $20\ \text{°C}$-ზე $49{,}95\ \text{მმ}$-ია, ბორბლის ღერძისა — $50{,}00\ \text{მმ}$. რამდენ გრადუსამდე უნდა გავაცხელოთ რგოლი, რომ ღერძზე ჩამოეცვას? ($\alpha = 1{,}2 \times 10^{-5}$)
EN: A steel ring has an inner diameter of $49.95\ \text{mm}$ at $20\ \text{°C}$; the axle is $50.00\ \text{mm}$. To what temperature must the ring be heated to slip onto the axle? ($\alpha = 1.2 \times 10^{-5}$)
HKA: $\Delta d = \alpha d_0 \Delta t$.
HEN: $\Delta d = \alpha d_0 \Delta t$.
SKA: $\Delta t = \dfrac{0{,}05}{1{,}2 \times 10^{-5} \cdot 49{,}95} \approx 83\ \text{°C}$
$t \approx 20 + 83 = 103\ \text{°C}$
SEN: $\Delta t = \dfrac{0.05}{1.2 \times 10^{-5} \cdot 49.95} \approx 83\ \text{°C}$
$t \approx 20 + 83 = 103\ \text{°C}$
AKA: $\approx 103\ \text{°C}$-მდე
AEN: to $\approx 103\ \text{°C}$

--- hard expansion
KA: $1\ \text{ლ}$ წყალი ($\beta = 2 \times 10^{-4}\ \text{°C}^{-1}$) $20\ \text{°C}$-დან $80\ \text{°C}$-მდე გათბა. რამდენით გაიზარდა მოცულობა? რამდენით შემცირდა სიმკვრივე?
EN: $1\ \text{L}$ of water ($\beta = 2 \times 10^{-4}\ \text{°C}^{-1}$) is heated from $20\ \text{°C}$ to $80\ \text{°C}$. By how much does its volume increase? By how much does its density drop?
HKA: $\Delta V = \beta V_0 \Delta t$; მასა არ იცვლება.
HEN: $\Delta V = \beta V_0 \Delta t$; the mass doesn't change.
SKA: $\Delta V = 2 \times 10^{-4} \cdot 1000 \cdot 60 = 12\ \text{მლ}$
$\rho = \dfrac{1000\ \text{გ}}{1012\ \text{სმ}^3} \approx 0{,}988\ \text{გ/სმ}^3$ — დაახლოებით $1{,}2\%$-ით ნაკლები.
SEN: $\Delta V = 2 \times 10^{-4} \cdot 1000 \cdot 60 = 12\ \text{mL}$
$\rho = \dfrac{1000\ \text{g}}{1012\ \text{cm}^3} \approx 0.988\ \text{g/cm}^3$ — about $1.2\%$ less.
AKA: $12\ \text{მლ}$-ით; $\approx 1{,}2\%$-ით
AEN: by $12\ \text{mL}$; by $\approx 1.2\%$

--- hard expansion
KA: ფოლადის საზომი ლენტი ($\alpha = 1{,}2 \times 10^{-5}$) $20\ \text{°C}$-ზეა დაკალიბრებული. მისით $-10\ \text{°C}$-ზე $200\ \text{მ}$ გაზომეს. რა არის ნამდვილი სიგრძე?
EN: A steel tape measure ($\alpha = 1.2 \times 10^{-5}$) is calibrated at $20\ \text{°C}$. At $-10\ \text{°C}$ it measures a distance as $200\ \text{m}$. What is the true length?
HKA: სიცივეში ლენტი მოკლდება — მისი „მეტრი“ ნამდვილზე მოკლეა.
HEN: In the cold the tape shrinks — its "metre" is shorter than a real one.
SKA: ლენტის დანაყოფები $\alpha \cdot 30 = 3{,}6 \times 10^{-4}$ ნაწილით მოკლეა.
$l = 200 (1 - 3{,}6 \times 10^{-4}) \approx 199{,}93\ \text{მ}$ — ლენტი $7\ \text{სმ}$-ით მეტს აჩვენებს.
SEN: The tape's markings are short by a fraction $\alpha \cdot 30 = 3.6 \times 10^{-4}$.
$l = 200 (1 - 3.6 \times 10^{-4}) \approx 199.93\ \text{m}$ — the tape over-reads by $7\ \text{cm}$.
AKA: $\approx 199{,}93\ \text{მ}$
AEN: $\approx 199.93\ \text{m}$

--- hard expansion
KA: $50\ \text{ლ}$ ავზი სავსეა ბენზინით ($\beta = 10^{-3}\ \text{°C}^{-1}$) $5\ \text{°C}$-ზე. მზეზე ის $35\ \text{°C}$-მდე თბება. რამდენი ბენზინი გადმოიღვრება? (ავზის გაფართოება უგულებელყავით)
EN: A $50\ \text{L}$ tank is filled with petrol ($\beta = 10^{-3}\ \text{°C}^{-1}$) at $5\ \text{°C}$. In the sun it warms to $35\ \text{°C}$. How much petrol overflows? (Ignore the tank's expansion.)
HKA: $\Delta V = \beta V_0 \Delta t$.
HEN: $\Delta V = \beta V_0 \Delta t$.
SKA: $\Delta V = 10^{-3} \cdot 50 \cdot 30 = 1{,}5\ \text{ლ}$
SEN: $\Delta V = 10^{-3} \cdot 50 \cdot 30 = 1.5\ \text{L}$
AKA: $1{,}5\ \text{ლ}$
AEN: $1.5\ \text{L}$

--- easy engines
KA: თბოძრავამ გამაცხელებლისგან $2000\ \text{ჯ}$ სითბო მიიღო და $500\ \text{ჯ}$ მუშაობა შეასრულა. იპოვეთ სმკ. რამდენი სითბო გადაეცა მაცივარს?
EN: A heat engine takes $2000\ \text{J}$ from the hot source and does $500\ \text{J}$ of work. Find its efficiency. How much heat goes to the cold sink?
HKA: $\eta = \dfrac{A}{Q_1}$, $Q_2 = Q_1 - A$.
HEN: $\eta = \dfrac{W}{Q_1}$, $Q_2 = Q_1 - W$.
SKA: $\eta = \dfrac{500}{2000} = 25\%$
$Q_2 = 1500\ \text{ჯ}$
SEN: $\eta = \dfrac{500}{2000} = 25\%$
$Q_2 = 1500\ \text{J}$
AKA: $25\%$; $1500\ \text{ჯ}$
AEN: $25\%$; $1500\ \text{J}$

--- easy engines
KA: ჩამოთვალეთ შიგაწვის ძრავის ოთხი ტაქტი.
EN: Name the four strokes of an internal combustion engine.
HKA: შეწოვა, ...
HEN: Intake, ...
SKA: 1) შეწოვა (საწვავის ნარევი ცილინდრში შედის); 2) შეკუმშვა; 3) სამუშაო სვლა (ნარევი იწვის და აირი დგუშს უბიძგებს); 4) გამოშვება (ნამწვი აირები გადის).
SEN: 1) Intake (the fuel mixture enters); 2) compression; 3) power stroke (the mixture burns and the gas pushes the piston); 4) exhaust (burnt gases leave).
AKA: შეწოვა, შეკუმშვა, სამუშაო სვლა, გამოშვება
AEN: intake, compression, power, exhaust

--- easy engines
KA: რატომ ვერ იქნება თბოძრავის სმკ $100\%$?
EN: Why can't a heat engine be $100\%$ efficient?
HKA: ძრავას სჭირდება მაცივარი.
HEN: An engine needs a cold sink.
SKA: ციკლის გასამეორებლად სამუშაო სხეული (აირი) უნდა გაცივდეს — სითბოს ნაწილი აუცილებლად გადაეცემა მაცივარს (გარემოს) და მუშაობად ვერ იქცევა.
SEN: To repeat the cycle the working gas must be cooled — part of the heat must always go to the cold sink (the surroundings) and can't become work.
AKA: სითბოს ნაწილი აუცილებლად მაცივარს გადაეცემა
AEN: some heat must always go to the cold sink

--- easy engines
KA: ძრავის სმკ $30\%$-ია. რა მუშაობას შეასრულებს, თუ $1\ \text{კგ}$ დიზელს ($q = 4{,}2 \times 10^7$) დაწვავს?
EN: An engine is $30\%$ efficient. How much work does it do burning $1\ \text{kg}$ of diesel ($q = 4.2 \times 10^7$)?
HKA: $A = \eta q m$.
HEN: $W = \eta q m$.
SKA: $A = 0{,}3 \cdot 4{,}2 \times 10^7 = 1{,}26 \times 10^7\ \text{ჯ}$
SEN: $W = 0.3 \cdot 4.2 \times 10^7 = 1.26 \times 10^7\ \text{J}$
AKA: $12{,}6\ \text{მჯ}$
AEN: $12.6\ \text{MJ}$

--- medium engines
KA: მანქანის ძრავა ($\eta = 25\%$) $20\ \text{კვტ}$ სასარგებლო სიმძლავრით $2$ საათს მუშაობს. რამდენი ბენზინი დაიხარჯება? ($q = 4{,}6 \times 10^7$)
EN: A car engine ($\eta = 25\%$) runs for $2$ hours at $20\ \text{kW}$ useful power. How much petrol does it burn? ($q = 4.6 \times 10^7$)
HKA: $m = \dfrac{N t}{\eta q}$.
HEN: $m = \dfrac{P t}{\eta q}$.
SKA: $m = \dfrac{20\,000 \cdot 7200}{0{,}25 \cdot 4{,}6 \times 10^7} = \dfrac{1{,}44 \times 10^8}{1{,}15 \times 10^7} \approx 12{,}5\ \text{კგ}$
SEN: $m = \dfrac{20\,000 \cdot 7200}{0.25 \cdot 4.6 \times 10^7} = \dfrac{1.44 \times 10^8}{1.15 \times 10^7} \approx 12.5\ \text{kg}$
AKA: $\approx 12{,}5\ \text{კგ}$
AEN: $\approx 12.5\ \text{kg}$

--- medium engines
KA: იდეალური თბოძრავის გამაცხელებლის ტემპერატურაა $527\ \text{°C}$, მაცივრისა — $27\ \text{°C}$. იპოვეთ მაქსიმალური სმკ.
EN: An ideal heat engine has its hot source at $527\ \text{°C}$ and its cold sink at $27\ \text{°C}$. Find the maximum efficiency.
HKA: $\eta = 1 - \dfrac{T_2}{T_1}$, $T = t + 273$.
HEN: $\eta = 1 - \dfrac{T_2}{T_1}$, $T = t + 273$.
SKA: $T_1 = 800\ \text{კ}$, $T_2 = 300\ \text{კ}$
$\eta = 1 - \dfrac{300}{800} = 0{,}625 = 62{,}5\%$
SEN: $T_1 = 800\ \text{K}$, $T_2 = 300\ \text{K}$
$\eta = 1 - \dfrac{300}{800} = 0.625 = 62.5\%$
AKA: $62{,}5\%$
AEN: $62.5\%$

--- medium engines
KA: მოპედი $100\ \text{კმ}$-ზე $2\ \text{ლ}$ ბენზინს ($\rho = 710$, $q = 4{,}6 \times 10^7$) ხარჯავს $36\ \text{კმ/სთ}$ სიჩქარით; ძრავის სმკ $20\%$-ია. იპოვეთ ძრავის სასარგებლო სიმძლავრე.
EN: A moped uses $2\ \text{L}$ of petrol ($\rho = 710$, $q = 4.6 \times 10^7$) per $100\ \text{km}$ at $36\ \text{km/h}$; the engine is $20\%$ efficient. Find its useful power.
HKA: $N = \dfrac{\eta q m}{t}$, $t = \dfrac{100}{36}\ \text{სთ}$.
HEN: $P = \dfrac{\eta q m}{t}$, $t = \dfrac{100}{36}\ \text{h}$.
SKA: $m = 1{,}42\ \text{კგ}$, $\ A = 0{,}2 \cdot 4{,}6 \times 10^7 \cdot 1{,}42 \approx 1{,}31 \times 10^7\ \text{ჯ}$
$t = 10\,000\ \text{წმ}$, $\ N \approx 1{,}3\ \text{კვტ}$
SEN: $m = 1.42\ \text{kg}$, $\ W = 0.2 \cdot 4.6 \times 10^7 \cdot 1.42 \approx 1.31 \times 10^7\ \text{J}$
$t = 10\,000\ \text{s}$, $\ P \approx 1.3\ \text{kW}$
AKA: $\approx 1{,}3\ \text{კვტ}$
AEN: $\approx 1.3\ \text{kW}$

--- medium engines
KA: თბოძრავა ყოველ ციკლში $600\ \text{ჯ}$-ს გამაცხელებლისგან იღებს და $450\ \text{ჯ}$-ს მაცივარს გადასცემს. ის წამში $10$ ციკლს ასრულებს. იპოვეთ სმკ და სიმძლავრე.
EN: In each cycle an engine takes $600\ \text{J}$ from the hot source and gives $450\ \text{J}$ to the sink. It runs $10$ cycles per second. Find the efficiency and power.
HKA: $A = Q_1 - Q_2$.
HEN: $W = Q_1 - Q_2$.
SKA: $A = 150\ \text{ჯ}$, $\ \eta = \dfrac{150}{600} = 25\%$
$N = 150 \cdot 10 = 1500\ \text{ვტ}$
SEN: $W = 150\ \text{J}$, $\ \eta = \dfrac{150}{600} = 25\%$
$P = 150 \cdot 10 = 1500\ \text{W}$
AKA: $25\%$; $1{,}5\ \text{კვტ}$
AEN: $25\%$; $1.5\ \text{kW}$

--- hard engines
KA: თვითმფრინავის ძრავები $8\ \text{მვტ}$ სასარგებლო სიმძლავრეს ავითარებს $\eta = 30\%$-ით. $1500\ \text{კმ}$-ის გაფრენას $2$ საათი სჭირდება. რამდენი ნავთია ($q = 4{,}3 \times 10^7$) საჭირო? რა არის წევის ძალა?
EN: A plane's engines give $8\ \text{MW}$ useful power at $\eta = 30\%$. A $1500\ \text{km}$ flight takes $2$ hours. How much kerosene ($q = 4.3 \times 10^7$) is needed? What is the thrust?
HKA: $m = \dfrac{N t}{\eta q}$, $F = \dfrac{N}{v}$.
HEN: $m = \dfrac{P t}{\eta q}$, $F = \dfrac{P}{v}$.
SKA: $m = \dfrac{8 \times 10^6 \cdot 7200}{0{,}3 \cdot 4{,}3 \times 10^7} \approx 4470\ \text{კგ}$
$v = \dfrac{1{,}5 \times 10^6}{7200} \approx 208\ \text{მ/წმ}$, $\ F = \dfrac{8 \times 10^6}{208} \approx 38\ \text{კნ}$
SEN: $m = \dfrac{8 \times 10^6 \cdot 7200}{0.3 \cdot 4.3 \times 10^7} \approx 4470\ \text{kg}$
$v = \dfrac{1.5 \times 10^6}{7200} \approx 208\ \text{m/s}$, $\ F = \dfrac{8 \times 10^6}{208} \approx 38\ \text{kN}$
AKA: $\approx 4{,}5\ \text{ტ}$; $\approx 38\ \text{კნ}$
AEN: $\approx 4.5\ \text{t}$; $\approx 38\ \text{kN}$

--- hard engines
KA: იდეალური ძრავის მაცივრის ტემპერატურაა $27\ \text{°C}$. რამდენ გრადუსამდე უნდა გავაცხელოთ გამაცხელებელი, რომ სმკ $40\%$-დან $50\%$-მდე გაიზარდოს?
EN: An ideal engine's cold sink is at $27\ \text{°C}$. To what temperature must the hot source be raised to increase the efficiency from $40\%$ to $50\%$?
HKA: $T_1 = \dfrac{T_2}{1 - \eta}$.
HEN: $T_1 = \dfrac{T_2}{1 - \eta}$.
SKA: $40\%$: $T_1 = \dfrac{300}{0{,}6} = 500\ \text{კ}$ ($227\ \text{°C}$)
$50\%$: $T_1 = \dfrac{300}{0{,}5} = 600\ \text{კ}$ ($327\ \text{°C}$) — $100\ \text{°C}$-ით მეტი.
SEN: $40\%$: $T_1 = \dfrac{300}{0.6} = 500\ \text{K}$ ($227\ \text{°C}$)
$50\%$: $T_1 = \dfrac{300}{0.5} = 600\ \text{K}$ ($327\ \text{°C}$) — $100\ \text{°C}$ hotter.
AKA: $327\ \text{°C}$-მდე
AEN: to $327\ \text{°C}$

--- hard engines
KA: ორთქლის ტურბინა $540\ \text{°C}$-იან ორთქლზე მუშაობს, კონდენსატორი $30\ \text{°C}$-ია. რეალური სმკ $40\%$-ია. რა ნაწილს შეადგენს ის იდეალურის?
EN: A steam turbine runs on steam at $540\ \text{°C}$ with a condenser at $30\ \text{°C}$. Its real efficiency is $40\%$. What fraction of the ideal efficiency is that?
HKA: $\eta_{\text{იდ}} = 1 - \dfrac{T_2}{T_1}$.
HEN: $\eta_{\text{ideal}} = 1 - \dfrac{T_2}{T_1}$.
SKA: $\eta_{\text{იდ}} = 1 - \dfrac{303}{813} \approx 0{,}627$
$\dfrac{0{,}40}{0{,}627} \approx 0{,}64$
SEN: $\eta_{\text{ideal}} = 1 - \dfrac{303}{813} \approx 0.627$
$\dfrac{0.40}{0.627} \approx 0.64$
AKA: $\approx 64\%$
AEN: $\approx 64\%$

--- hard engines
KA: მანქანა ($1{,}2\ \text{ტ}$) $72\ \text{კმ/სთ}$-ით მოძრაობს, წინაღობის ძალა $600\ \text{ნ}$-ია, ძრავის სმკ $28\%$. იპოვეთ ბენზინის ($\rho = 710$, $q = 4{,}6 \times 10^7$) ხარჯი $100\ \text{კმ}$-ზე ლიტრებში.
EN: A $1.2\ \text{t}$ car moves at $72\ \text{km/h}$ against $600\ \text{N}$ of resistance; the engine is $28\%$ efficient. Find the petrol use ($\rho = 710$, $q = 4.6 \times 10^7$) in litres per $100\ \text{km}$.
HKA: სასარგებლო მუშაობა $F s$; საწვავის სითბო $\dfrac{F s}{\eta}$.
HEN: Useful work $F s$; fuel heat $\dfrac{F s}{\eta}$.
SKA: $A = 600 \cdot 10^5 = 6 \times 10^7\ \text{ჯ}$
$m = \dfrac{6 \times 10^7}{0{,}28 \cdot 4{,}6 \times 10^7} \approx 4{,}66\ \text{კგ}$, $\ V = \dfrac{4{,}66}{0{,}71} \approx 6{,}6\ \text{ლ}$
SEN: $W = 600 \cdot 10^5 = 6 \times 10^7\ \text{J}$
$m = \dfrac{6 \times 10^7}{0.28 \cdot 4.6 \times 10^7} \approx 4.66\ \text{kg}$, $\ V = \dfrac{4.66}{0.71} \approx 6.6\ \text{L}$
AKA: $\approx 6{,}6\ \text{ლ}$
AEN: $\approx 6.6\ \text{L}$

--- hard engines olympiad
KA: მაცივარი წამში $200\ \text{ჯ}$ სითბოს ართმევს მაცივრის შიგთავსს და $80\ \text{ვტ}$ ელექტროენერგიას ხარჯავს. რამდენ სითბოს გასცემს ის ოთახს წამში? რა მოხდება ოთახის ტემპერატურას, თუ მაცივრის კარს ღიად დავტოვებთ?
EN: A fridge removes $200\ \text{J}$ of heat per second from inside and uses $80\ \text{W}$ of electricity. How much heat per second does it give to the room? What happens to the room's temperature if the fridge door is left open?
HKA: ენერგიის შენახვა: ოთახს გადაეცემა $Q_2 + A$.
HEN: Energy conservation: the room receives $Q_2 + W$.
SKA: $Q = 200 + 80 = 280\ \text{ჯ}$ წამში ($280\ \text{ვტ}$).
ღია კარისას მაცივარი ოთახის ჰაერს „აცივებს“ და იმავე ჰაერს ათბობს, მაგრამ ზედმეტად $80\ \text{ვტ}$-ს ამატებს — ოთახი **თბება**.
SEN: $Q = 200 + 80 = 280\ \text{J}$ per second ($280\ \text{W}$).
With the door open it cools and heats the same room air, but adds an extra $80\ \text{W}$ — the room **warms up**.
AKA: $280\ \text{ჯ/წმ}$; ოთახი გათბება
AEN: $280\ \text{J/s}$; the room warms up

--- hard engines olympiad
KA: ორი იდეალური ძრავა მიმდევრობითაა: პირველის მაცივარი მეორის გამაცხელებელია. ტემპერატურებია $T_1 = 900\ \text{კ}$, $T = 600\ \text{კ}$, $T_2 = 300\ \text{კ}$. იპოვეთ თითოეულის და მთლიანი სისტემის სმკ.
EN: Two ideal engines run in series: the first's cold sink is the second's hot source. Temperatures are $T_1 = 900\ \text{K}$, $T = 600\ \text{K}$, $T_2 = 300\ \text{K}$. Find each engine's efficiency and the overall efficiency.
HKA: მეორე ძრავა პირველის „ნარჩენ“ სითბოზე მუშაობს: $\eta = 1 - (1 - \eta_1)(1 - \eta_2)$.
HEN: The second engine runs on the first's waste heat: $\eta = 1 - (1 - \eta_1)(1 - \eta_2)$.
SKA: $\eta_1 = 1 - \dfrac{600}{900} = \dfrac{1}{3}$, $\ \eta_2 = 1 - \dfrac{300}{600} = \dfrac{1}{2}$
$\eta = 1 - \dfrac{2}{3} \cdot \dfrac{1}{2} = \dfrac{2}{3}$ — ზუსტად ისეთი, როგორიც ერთი ძრავისა $900$ და $300\ \text{კ}$-ს შორის.
SEN: $\eta_1 = 1 - \dfrac{600}{900} = \dfrac{1}{3}$, $\ \eta_2 = 1 - \dfrac{300}{600} = \dfrac{1}{2}$
$\eta = 1 - \dfrac{2}{3} \cdot \dfrac{1}{2} = \dfrac{2}{3}$ — exactly that of one engine between $900$ and $300\ \text{K}$.
AKA: $33\%$; $50\%$; $67\%$
AEN: $33\%$; $50\%$; $67\%$

--- hard engines olympiad
KA: თბური ტუმბო ოთახს ათბობს: ის გარედან ($-3\ \text{°C}$) იღებს სითბოს და ოთახს ($27\ \text{°C}$) გადასცემს. იდეალურ შემთხვევაში რამდენჯერ მეტ სითბოს მიიღებს ოთახი, ვიდრე დახარჯული ელექტროენერგიაა?
EN: A heat pump warms a room: it takes heat from outside ($-3\ \text{°C}$) and delivers it to the room ($27\ \text{°C}$). Ideally, how many times more heat does the room get than the electrical energy used?
HKA: იდეალური ტუმბოსთვის $\dfrac{Q_1}{A} = \dfrac{T_1}{T_1 - T_2}$.
HEN: For an ideal pump $\dfrac{Q_1}{W} = \dfrac{T_1}{T_1 - T_2}$.
SKA: $T_1 = 300\ \text{კ}$, $T_2 = 270\ \text{კ}$
$\dfrac{Q_1}{A} = \dfrac{300}{30} = 10$ — $10$-ჯერ მეტი (რეალურად $3$–$4$-ჯერ).
SEN: $T_1 = 300\ \text{K}$, $T_2 = 270\ \text{K}$
$\dfrac{Q_1}{W} = \dfrac{300}{30} = 10$ — $10$ times more (in practice $3$–$4$ times).
AKA: $10$-ჯერ
AEN: $10$ times

--- hard engines olympiad
KA: ტესლას ლეგენდის მიხედვით, მან შექმნა ძრავა, რომელიც ოკეანის წყლის სითბოს ($15\ \text{°C}$) იყენებდა და სხვა არაფერს. რატომ შეუძლებელია ასეთი ძრავა? რა სჭირდება, რომ ოკეანის სითბოზე იმუშაოს?
EN: A legend says someone built an engine that ran only on the heat of ocean water at $15\ \text{°C}$. Why is such an engine impossible? What would it need in order to run on ocean heat?
HKA: თბოძრავას ორი ტემპერატურა სჭირდება.
HEN: A heat engine needs two temperatures.
SKA: ერთი ტემპერატურის წყაროდან სითბოს უბრალოდ მუშაობად გადაქცევა შეუძლებელია (თერმოდინამიკის მეორე კანონი) — $T_1 = T_2$-ისას $\eta = 0$.
საჭიროა უფრო ცივი რეზერვუარი: მაგალითად, ღრმა ოკეანის წყალი ($\approx 5\ \text{°C}$). მაშინ $\eta_{\max} = 1 - \dfrac{278}{288} \approx 3{,}5\%$.
SEN: Heat from a single-temperature source can't simply be turned into work (the second law of thermodynamics) — with $T_1 = T_2$, $\eta = 0$.
You need a colder reservoir, e.g. deep ocean water ($\approx 5\ \text{°C}$). Then $\eta_{\max} = 1 - \dfrac{278}{288} \approx 3.5\%$.
AKA: საჭიროა ცივი რეზერვუარი; $\eta_{\max} \approx 3{,}5\%$
AEN: a cold reservoir is needed; $\eta_{\max} \approx 3.5\%$
