OKA: $0$
$10$ მ
$20$ მ

$40$ მ

$10$ m
$20$ m

გადაადგილება საწყისი და საბოლოო წერტილების შემაერთებელი მონაკვეთია: $2R = 40$ მ (გავლილი მანძილი კი $\pi R \approx 62{,}8$ მ).

KA: სხეული უსაწყისო სიჩქარით ვარდება თავისუფლად. რამდენჯერ მეტ მანძილს გადის ის მესამე წამში, ვიდრე პირველ წამში?
EN: A body falls freely from rest. How many times farther does it fall during the third second than during the first second?
O: $2$
$3$
$4$
$5$
$9$
C: 4
SKA: $s = \dfrac{gt^2}{2}$: 1 წმ-ში — $5$ მ, 2 წმ-ში — $20$ მ, 3 წმ-ში — $45$ მ.
მესამე წამში: $45 - 20 = 25$ მ; პირველ წამში: $5$ მ. $25 : 5 = 5$.
(უძრაობიდან თანაბარაჩქარებულ მოძრაობაში თანმიმდევრულ წამებში გავლილი მანძილები ისე შეეფარდება, როგორც $1 : 3 : 5 : \ldots$)
SEN: $s = \dfrac{gt^2}{2}$: after 1 s — $5$ m, after 2 s — $20$ m, after 3 s — $45$ m.
Third second: $45 - 20 = 25$ m; first second: $5$ m. $25 : 5 = 5$.
(From rest, the distances in successive equal time intervals are in the ratio $1 : 3 : 5 : \ldots$)

KA: ერთი და იმავე სიმაღლიდან ერთდროულად ჰორიზონტალურად ისროლეს ორი ბურთი სხვადასხვა სიჩქარით. ჰაერის წინააღმდეგობა უგულებელყავით. ჩამოთვლილთაგან რომელია მართებული?
I. ბურთები მიწას ერთდროულად დაეცემა;
II. ბურთები ასროლის წერტილიდან ტოლ მანძილზე დაეცემა;
III. ფრენისას ბურთებს ტოლი აჩქარებები აქვთ.
EN: Two balls are thrown horizontally at the same moment from the same height with different speeds. Ignore air resistance. Which statements are correct?
I. the balls hit the ground at the same time;
II. the balls land at equal distances from the launch point;
III. during the flight the balls have equal accelerations.
OKA: მხოლოდ I
მხოლოდ II
მხოლოდ II და III
სამივე
მხოლოდ I და III
OEN: only I
only II
only II and III
all three
only I and III
C: 5
SKA: ვერტიკალური მოძრაობა ორივესთვის ერთნაირია ($v_{0y} = 0$, აჩქარება $g$), ამიტომ ფრენის დრო $t = \sqrt{2h/g}$ ტოლია — I და III სწორია.
ფრენის სიშორე $L = v_0 t$ სხვადასხვაა — II მცდარია.
SEN: The vertical motion is the same for both ($v_{0y} = 0$, acceleration $g$), so the flight time $t = \sqrt{2h/g}$ is the same — I and III are true.
The range $L = v_0 t$ differs — II is false.

4) დაცემისას სიჩქარის ვექტორსა და ჰორიზონტს შორის კუთხის ტანგენსი;
5) ქვის კინეტიკური ენერგია მიწაზე დაცემისას.
EN: A stone of mass 0.2 kg is thrown horizontally at 40 m/s from a tower 45 m high. Ignore air resistance. Find:
1) the time of flight;
2) the range (horizontal distance from the tower to the landing point);
3) the stone's speed when it hits the ground;
4) the tangent of the angle between the velocity and the horizontal at landing;
5) the stone's kinetic energy when it hits the ground.

KA: −10°C ტემპერატურის 0,5 კგ ყინულისგან უნდა მივიღოთ 20°C ტემპერატურის წყალი. ყინულის კუთრი სითბოტევადობაა 2100 ჯ/(კგ·°C), წყლისა — 4200 ჯ/(კგ·°C), ყინულის დნობის კუთრი სითბო — 330 კჯ/კგ. სითბოს დანაკარგები უგულებელყავით. განსაზღვრეთ:
1) ყინულის 0°C-მდე გასათბობად საჭირო სითბოს რაოდენობა;
2) ყინულის გასადნობად საჭირო სითბოს რაოდენობა;
3) მიღებული წყლის 20°C-მდე გასათბობად საჭირო სითბოს რაოდენობა;
4) სულ საჭირო სითბოს რაოდენობა;
5) რა დრო დასჭირდება ამ პროცესს 500 ვტ სიმძლავრის გამათბობელს.
EN: We want to turn 0.5 kg of ice at −10°C into water at 20°C. The specific heat of ice is 2100 J/(kg·°C), of water 4200 J/(kg·°C), and the specific latent heat of fusion of ice is 330 kJ/kg. Ignore heat losses. Find:
1) the heat needed to warm the ice to 0°C;
2) the heat needed to melt the ice;
3) the heat needed to warm the water to 20°C;
4) the total heat needed;
5) how long a 500 W heater needs for this.
SKA: 1) $Q_1 = c_{\text{ყ}}m\Delta t = 2100 \cdot 0{,}5 \cdot 10 = 10\,500$ ჯ.
2) $Q_2 = \lambda m = 330\,000 \cdot 0{,}5 = 165\,000$ ჯ.
3) $Q_3 = c_{\text{წ}}m\Delta t = 4200 \cdot 0{,}5 \cdot 20 = 42\,000$ ჯ.
4) $Q = 10\,500 + 165\,000 + 42\,000 = 217\,500$ ჯ.
5) $t = \dfrac QP = \dfrac{217\,500}{500} = 435$ წმ ($7{,}25$ წთ).
SEN: 1) $Q_1 = c_{ice}m\Delta t = 2100 \cdot 0.5 \cdot 10 = 10\,500$ J.
2) $Q_2 = \lambda m = 330\,000 \cdot 0.5 = 165\,000$ J.
3) $Q_3 = c_{water}m\Delta t = 4200 \cdot 0.5 \cdot 20 = 42\,000$ J.
4) $Q = 10\,500 + 165\,000 + 42\,000 = 217\,500$ J.
5) $t = \dfrac QP = \dfrac{217\,500}{500} = 435$ s ($7.25$ min).
AKA: 1) $10{,}5$ კჯ; 2) $165$ კჯ; 3) $42$ კჯ; 4) $217{,}5$ კჯ; 5) $435$ წმ
AEN: 1) $10.5$ kJ; 2) $165$ kJ; 3) $42$ kJ; 4) $217.5$ kJ; 5) $435$ s

KA: ნახატზე გამოსახულ წრედში წყაროს ემ ძალაა $\mathcal E = 12$ ვ, შიგა წინაღობა $r = 1$ ომი, $R_1 = 6$ ომი, $R_2 = 3$ ომი, $R_3 = 3$ ომი. განსაზღვრეთ:
1) გარე წრედის წინაღობა;
2) დენის ძალა წყაროში;
3) ძაბვა წყაროს მომჭერებზე;
4) დენის ძალა $R_1$ რეზისტორში;
5) $R_3$ რეზისტორზე გამოყოფილი სიმძლავრე.
EN: In the circuit shown, the source has EMF $\mathcal E = 12$ V and internal resistance $r = 1$ Ω; $R_1 = 6$ Ω, $R_2 = 3$ Ω, $R_3 = 3$ Ω. Find:
1) the resistance of the external circuit;
2) the current through the source;
3) the voltage across the source's terminals;
4) the current in $R_1$;
5) the power dissipated in $R_3$.

SKA: 1) $R_1 \parallel R_2 = \dfrac{6 \cdot 3}{9} = 2$ ომი; $R = 2 + 3 = 5$ ომი.
2) $I = \dfrac{\mathcal E}{R + r} = \dfrac{12}{6} = 2$ ა.
3) $U = IR = 10$ ვ.
4) პარალელურ უბანზე ძაბვა $U_{12} = I \cdot 2 = 4$ ვ; $I_1 = \dfrac{4}{6} = \dfrac23$ ა.
5) $P_3 = I^2R_3 = 4 \cdot 3 = 12$ ვტ.
SEN: 1) $R_1 \parallel R_2 = \dfrac{6 \cdot 3}{9} = 2$ Ω; $R = 2 + 3 = 5$ Ω.
2) $I = \dfrac{\mathcal E}{R + r} = \dfrac{12}{6} = 2$ A.
3) $U = IR = 10$ V.
4) The voltage across the parallel part is $U_{12} = I \cdot 2 = 4$ V; $I_1 = \dfrac{4}{6} = \dfrac23$ A.
5) $P_3 = I^2R_3 = 4 \cdot 3 = 12$ W.
AKA: 1) $5$ ომი; 2) $2$ ა; 3) $10$ ვ; 4) $2/3$ ა; 5) $12$ ვტ
AEN: 1) $5$ Ω; 2) $2$ A; 3) $10$ V; 4) $2/3$ A; 5) $12$ W
