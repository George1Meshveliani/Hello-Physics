--- easy speed
KA: მორბენალმა $100\ \text{მ}$ $12{,}5\ \text{წმ}$-ში გაირბინა. იპოვეთ მისი საშუალო სიჩქარე.
EN: A runner covers $100\ \text{m}$ in $12.5\ \text{s}$. Find the average speed.
HKA: $v = \dfrac{s}{t}$.
HEN: $v = \dfrac{s}{t}$.
SKA: **ფორმულა:** $v = \dfrac{s}{t}$
**რიცხვები:** $v = \dfrac{100}{12{,}5} = 8\ \text{მ/წმ}$ ($= 28{,}8\ \text{კმ/სთ}$)
SEN: **Formula:** $v = \dfrac{s}{t}$
**Numbers:** $v = \dfrac{100}{12.5} = 8\ \text{m/s}$ ($= 28.8\ \text{km/h}$)
AKA: $8\ \text{მ/წმ}$
AEN: $8\ \text{m/s}$

--- easy speed
KA: თვითმფრინავი $900\ \text{კმ/სთ}$ სიჩქარით მიფრინავს. რა მანძილს გაიფრენს ის $2{,}5$ საათში?
EN: A plane flies at $900\ \text{km/h}$. How far does it fly in $2.5$ hours?
HKA: $s = v t$.
HEN: $s = v t$.
SKA: **ფორმულა:** $s = v\,t$
**რიცხვები:** $s = 900 \cdot 2{,}5 = 2250\ \text{კმ}$
SEN: **Formula:** $s = v\,t$
**Numbers:** $s = 900 \cdot 2.5 = 2250\ \text{km}$
AKA: $2250\ \text{კმ}$
AEN: $2250\ \text{km}$

--- easy speed
KA: ლოკოკინა $1{,}2\ \text{მმ/წმ}$ სიჩქარით მოძრაობს. რა დრო დასჭირდება მას $36\ \text{სმ}$-ის გასავლელად?
EN: A snail moves at $1.2\ \text{mm/s}$. How long does it take to crawl $36\ \text{cm}$?
HKA: ჯერ ერთი ერთეული აირჩიეთ: $36\ \text{სმ} = 360\ \text{მმ}$.
HEN: Use one unit first: $36\ \text{cm} = 360\ \text{mm}$.
SKA: **ფორმულა:** $t = \dfrac{s}{v}$
**რიცხვები:** $t = \dfrac{360\ \text{მმ}}{1{,}2\ \text{მმ/წმ}} = 300\ \text{წმ} = 5\ \text{წთ}$
SEN: **Formula:** $t = \dfrac{s}{v}$
**Numbers:** $t = \dfrac{360\ \text{mm}}{1.2\ \text{mm/s}} = 300\ \text{s} = 5\ \text{min}$
AKA: $5\ \text{წთ}$
AEN: $5\ \text{min}$

--- easy speed
KA: რომელი უფრო სწრაფად მოძრაობს: ავტომობილი $20\ \text{მ/წმ}$ სიჩქარით თუ მოტოციკლი $54\ \text{კმ/სთ}$ სიჩქარით?
EN: Which is faster: a car at $20\ \text{m/s}$ or a motorbike at $54\ \text{km/h}$?
HKA: შესადარებლად სიჩქარეები ერთ ერთეულში გამოსახეთ.
HEN: To compare, express both speeds in the same unit.
SKA: **ფორმულა:** $v\,[\text{მ/წმ}] = \dfrac{v\,[\text{კმ/სთ}]}{3{,}6}$
**რიცხვები:** $54\ \text{კმ/სთ} = \dfrac{54}{3{,}6} = 15\ \text{მ/წმ} < 20\ \text{მ/წმ}$ — ავტომობილი უფრო სწრაფია.
SEN: **Formula:** $v\,[\text{m/s}] = \dfrac{v\,[\text{km/h}]}{3.6}$
**Numbers:** $54\ \text{km/h} = \dfrac{54}{3.6} = 15\ \text{m/s} < 20\ \text{m/s}$ — the car is faster.
AKA: ავტომობილი
AEN: the car

--- easy force
KA: რა ძალით იზიდავს დედამიწა $250\ \text{გ}$ მასის ვაშლს?
EN: With what force does the Earth pull a $250\ \text{g}$ apple?
HKA: მასა კილოგრამებში გადაიყვანეთ.
HEN: Convert the mass to kilograms.
SKA: **ფორმულა:** $F = m g$
**რიცხვები:** $F = 0{,}25 \cdot 10 = 2{,}5\ \text{ნ}$
SEN: **Formula:** $F = m g$
**Numbers:** $F = 0.25 \cdot 10 = 2.5\ \text{N}$
AKA: $2{,}5\ \text{ნ}$
AEN: $2.5\ \text{N}$

--- easy force
KA: სხეულზე მოქმედი სიმძიმის ძალა $30\ \text{ნ}$-ია. რას უდრის სხეულის მასა?
EN: The force of gravity on a body is $30\ \text{N}$. What is its mass?
HKA: $F = m g \Rightarrow m = F/g$.
HEN: $F = m g \Rightarrow m = F/g$.
SKA: **ფორმულა:** $m = \dfrac{F}{g}$
**რიცხვები:** $m = \dfrac{30}{10} = 3\ \text{კგ}$
SEN: **Formula:** $m = \dfrac{F}{g}$
**Numbers:** $m = \dfrac{30}{10} = 3\ \text{kg}$
AKA: $3\ \text{კგ}$
AEN: $3\ \text{kg}$

--- easy force
KA: სხეულზე ერთი წრფის გასწვრივ მოქმედებს ძალები: $10\ \text{ნ}$ მარჯვნივ, $4\ \text{ნ}$ მარცხნივ და $6\ \text{ნ}$ მარცხნივ. იპოვეთ ტოლქმედი. როგორ იმოძრავებს სხეული, თუ თავიდან უძრავი იყო?
EN: Along one line a body feels $10\ \text{N}$ to the right, $4\ \text{N}$ to the left and $6\ \text{N}$ to the left. Find the resultant. How does the body move if it was at rest?
HKA: მარჯვნივ მიმართული ძალები აიღეთ „$+$“-ით, მარცხნივ — „$-$“-ით.
HEN: Take forces to the right as "$+$" and to the left as "$-$".
SKA: **ფორმულა:** $R = F_1 - F_2 - F_3$
**რიცხვები:** $R = 10 - 4 - 6 = 0$ — ძალები ურთიერთგაწონასწორებულია, სხეული უძრავი დარჩება.
SEN: **Formula:** $R = F_1 - F_2 - F_3$
**Numbers:** $R = 10 - 4 - 6 = 0$ — the forces balance, the body stays at rest.
AKA: $0$; უძრავი დარჩება
AEN: $0$; it stays at rest

--- easy elastic
KA: ზამბარის სიხისტეა $50\ \text{ნ/მ}$. რამდენით წაგრძელდება ის $2\ \text{ნ}$ ძალის მოქმედებით?
EN: A spring has stiffness $50\ \text{N/m}$. How far does it stretch under a force of $2\ \text{N}$?
HKA: ჰუკის კანონიდან გამოსახეთ $\Delta l$.
HEN: Solve Hooke's law for $\Delta l$.
SKA: **ფორმულა:** $F = k\,\Delta l \Rightarrow \Delta l = \dfrac{F}{k}$
**რიცხვები:** $\Delta l = \dfrac{2}{50} = 0{,}04\ \text{მ} = 4\ \text{სმ}$
SEN: **Formula:** $F = k\,\Delta l \Rightarrow \Delta l = \dfrac{F}{k}$
**Numbers:** $\Delta l = \dfrac{2}{50} = 0.04\ \text{m} = 4\ \text{cm}$
AKA: $4\ \text{სმ}$
AEN: $4\ \text{cm}$

--- easy elastic
KA: რატომ აყრიან ზამთარში მოყინულ ტროტუარს ქვიშას? რატომ უკეთებენ ფეხსაცმელს დაკბილულ ძირს?
EN: Why is sand spread on icy pavements in winter? Why do shoes have ridged soles?
HKA: იფიქრეთ, როგორ მოქმედებს ზედაპირის უსწორმასწორობა ხახუნის ძალაზე.
HEN: Think about how surface roughness affects friction.
SKA: ყინული ძალიან გლუვია — ხახუნის ძალა მცირეა, ფეხი სრიალებს.
ქვიშა ზედაპირს უხეშს ხდის და **ზრდის ხახუნს** — სიარული უსაფრთხო ხდება.
დაკბილული ძირი „ებღაუჭება“ ზედაპირის უსწორმასწორობებს და ასევე ზრდის ხახუნს. აქ ხახუნი სასარგებლოა.
SEN: Ice is very smooth — friction is small and feet slip.
Sand makes the surface rough and **increases friction** — walking becomes safe.
Ridged soles grip the bumps of the surface and also increase friction. Here friction is useful.
AKA: ხახუნის გასაზრდელად
AEN: to increase friction

--- easy density
KA: ყინულის ლოდის მოცულობაა $0{,}5\ \text{მ}^3$. იპოვეთ მისი მასა. ($\rho_{\text{ყ}} = 900\ \text{კგ/მ}^3$)
EN: A block of ice has a volume of $0.5\ \text{m}^3$. Find its mass. ($\rho_{\text{ice}} = 900\ \text{kg/m}^3$)
HKA: $m = \rho V$.
HEN: $m = \rho V$.
SKA: **ფორმულა:** $m = \rho\,V$
**რიცხვები:** $m = 900 \cdot 0{,}5 = 450\ \text{კგ}$
SEN: **Formula:** $m = \rho\,V$
**Numbers:** $m = 900 \cdot 0.5 = 450\ \text{kg}$
AKA: $450\ \text{კგ}$
AEN: $450\ \text{kg}$

--- easy density
KA: რას უდრის $7{,}8\ \text{კგ}$ მასის ფოლადის დეტალის მოცულობა? ($\rho = 7800\ \text{კგ/მ}^3$)
EN: What is the volume of a $7.8\ \text{kg}$ steel part? ($\rho = 7800\ \text{kg/m}^3$)
HKA: $V = \dfrac{m}{\rho}$.
HEN: $V = \dfrac{m}{\rho}$.
SKA: **ფორმულა:** $V = \dfrac{m}{\rho}$
**რიცხვები:** $V = \dfrac{7{,}8}{7800} = 0{,}001\ \text{მ}^3 = 1\ \text{დმ}^3$
SEN: **Formula:** $V = \dfrac{m}{\rho}$
**Numbers:** $V = \dfrac{7.8}{7800} = 0.001\ \text{m}^3 = 1\ \text{dm}^3$
AKA: $0{,}001\ \text{მ}^3$
AEN: $0.001\ \text{m}^3$

--- easy matter
KA: რატომ ავსებს აირი მთელ ჭურჭელს, რომელშიც მოათავსეს? რატომ იკუმშება აირი ადვილად, სითხე და მყარი სხეული კი — თითქმის არა?
EN: Why does a gas fill the whole container it is put in? Why is a gas easy to compress while liquids and solids hardly compress at all?
HKA: შეადარეთ მოლეკულებს შორის მანძილები სამ მდგომარეობაში.
HEN: Compare the distances between molecules in the three states.
SKA: აირში მოლეკულებს შორის მანძილი მათ ზომაზე ბევრად დიდია და მიზიდულობა თითქმის არ არის — ისინი თავისუფლად დაფრინავენ და მთელ ჭურჭელს ავსებენ.
დიდი მანძილების გამო აირი ადვილად იკუმშება.
სითხესა და მყარ სხეულში მოლეკულები ერთმანეთთან მჭიდროდაა — შეკუმშვას განზიდვის ძალები ეწინააღმდეგება.
SEN: In a gas the distances between molecules are much larger than the molecules and there is almost no attraction — they fly freely and fill the whole container.
Because of the large gaps a gas is easy to compress.
In liquids and solids the molecules are packed close — repulsive forces resist compression.
AKA: აირში მოლეკულები შორს არიან და თავისუფლად მოძრაობენ
AEN: gas molecules are far apart and move freely

--- easy pressure
KA: $50\ \text{კგ}$ მასის გოგონა ორ ფეხზე დგას; ორივე ფეხსაცმლის ძირის ფართობი ჯამში $0{,}025\ \text{მ}^2$-ია. რა წნევას ახდენს ის იატაკზე?
EN: A $50\ \text{kg}$ girl stands on both feet; the total area of her soles is $0.025\ \text{m}^2$. What pressure does she exert on the floor?
HKA: $p = \dfrac{mg}{S}$.
HEN: $p = \dfrac{mg}{S}$.
SKA: **ფორმულა:** $p = \dfrac{m g}{S}$
**რიცხვები:** $p = \dfrac{500}{0{,}025} = 20\,000\ \text{პა} = 20\ \text{კპა}$
SEN: **Formula:** $p = \dfrac{m g}{S}$
**Numbers:** $p = \dfrac{500}{0.025} = 20\,000\ \text{Pa} = 20\ \text{kPa}$
AKA: $20\ \text{კპა}$
AEN: $20\ \text{kPa}$

--- easy fluids
KA: რამდენით მეტია წყლის წნევა ტბაში $7\ \text{მ}$ სიღრმეზე, ვიდრე $2\ \text{მ}$ სიღრმეზე?
EN: By how much is the water pressure in a lake greater at $7\ \text{m}$ depth than at $2\ \text{m}$?
HKA: $\Delta p = \rho g\,\Delta h$.
HEN: $\Delta p = \rho g\,\Delta h$.
SKA: **ფორმულა:** $\Delta p = \rho\,g\,(h_2 - h_1)$
**რიცხვები:** $\Delta p = 1000 \cdot 10 \cdot 5 = 50\,000\ \text{პა} = 50\ \text{კპა}$
SEN: **Formula:** $\Delta p = \rho\,g\,(h_2 - h_1)$
**Numbers:** $\Delta p = 1000 \cdot 10 \cdot 5 = 50\,000\ \text{Pa} = 50\ \text{kPa}$
AKA: $50\ \text{კპა}$-ით
AEN: by $50\ \text{kPa}$

--- easy archimedes
KA: $0{,}5\ \text{ლ}$ მოცულობის სხეული მთლიანად ნავთშია ჩაძირული. იპოვეთ არქიმედეს ძალა. ($\rho_{\text{ნ}} = 800\ \text{კგ/მ}^3$)
EN: A body of volume $0.5\ \text{L}$ is fully submerged in kerosene. Find the buoyant force. ($\rho_{\text{k}} = 800\ \text{kg/m}^3$)
HKA: $0{,}5\ \text{ლ} = 5 \cdot 10^{-4}\ \text{მ}^3$.
HEN: $0.5\ \text{L} = 5 \times 10^{-4}\ \text{m}^3$.
SKA: **ფორმულა:** $F_A = \rho_{\text{სითხ}}\,g\,V$
**რიცხვები:** $F_A = 800 \cdot 10 \cdot 5 \cdot 10^{-4} = 4\ \text{ნ}$
SEN: **Formula:** $F_A = \rho_{\text{liquid}}\,g\,V$
**Numbers:** $F_A = 800 \cdot 10 \cdot 5 \times 10^{-4} = 4\ \text{N}$
AKA: $4\ \text{ნ}$
AEN: $4\ \text{N}$

--- easy machines
KA: ბერკეტზე საყრდენიდან $0{,}6\ \text{მ}$-ზე $2\ \text{კგ}$ ტვირთი კიდია. საყრდენის მეორე მხარეს რა მანძილზე უნდა ჩამოიკიდოს $3\ \text{კგ}$ ტვირთი წონასწორობისთვის?
EN: A $2\ \text{kg}$ load hangs $0.6\ \text{m}$ from a lever's pivot. How far on the other side must a $3\ \text{kg}$ load hang for balance?
HKA: $m_1 l_1 = m_2 l_2$.
HEN: $m_1 l_1 = m_2 l_2$.
SKA: **ფორმულა:** $m_1 g\,l_1 = m_2 g\,l_2 \Rightarrow l_2 = \dfrac{m_1 l_1}{m_2}$
**რიცხვები:** $l_2 = \dfrac{2 \cdot 0{,}6}{3} = 0{,}4\ \text{მ}$
SEN: **Formula:** $m_1 g\,l_1 = m_2 g\,l_2 \Rightarrow l_2 = \dfrac{m_1 l_1}{m_2}$
**Numbers:** $l_2 = \dfrac{2 \cdot 0.6}{3} = 0.4\ \text{m}$
AKA: $0{,}4\ \text{მ}$
AEN: $0.4\ \text{m}$

--- medium measure
KA: ფანქარზე მჭიდროდ, ხვია ხვიასთან, დაახვიეს მავთული. $30$ ხვიამ ფანქარზე $2{,}4\ \text{სმ}$ სიგრძე დაიკავა. იპოვეთ მავთულის დიამეტრი.
EN: Wire is wound tightly on a pencil, turn against turn. $30$ turns take up $2.4\ \text{cm}$. Find the diameter of the wire.
HKA: მწკრივების მეთოდი: მთლიანი სიგრძე გაყავით ხვიების რიცხვზე.
HEN: Series method: divide the total length by the number of turns.
SKA: **ფორმულა:** $d = \dfrac{L}{N}$
**რიცხვები:** $d = \dfrac{24\ \text{მმ}}{30} = 0{,}8\ \text{მმ}$
SEN: **Formula:** $d = \dfrac{L}{N}$
**Numbers:** $d = \dfrac{24\ \text{mm}}{30} = 0.8\ \text{mm}$
AKA: $0{,}8\ \text{მმ}$
AEN: $0.8\ \text{mm}$

--- medium measure
KA: ფოთლის ფართობის გასაზომად ის დადეს უჯრედებიან ქაღალდზე ($1\ \text{სმ}^2$ უჯრები). ფოთოლი მთლიანად ფარავს $46$ უჯრას და ნაწილობრივ — $20$-ს. შეაფასეთ ფოთლის ფართობი.
EN: To measure a leaf's area it is placed on squared paper ($1\ \text{cm}^2$ squares). It fully covers $46$ squares and partly covers $20$. Estimate its area.
HKA: ნაწილობრივ დაფარული უჯრები საშუალოდ ნახევრად ითვლება.
HEN: Partly covered squares count as half on average.
SKA: **ფორმულა:** $S \approx N_{\text{სრ}} + \dfrac{N_{\text{ნაწ}}}{2}$
**რიცხვები:** $S \approx 46 + \dfrac{20}{2} = 56\ \text{სმ}^2$
SEN: **Formula:** $S \approx N_{\text{full}} + \dfrac{N_{\text{part}}}{2}$
**Numbers:** $S \approx 46 + \dfrac{20}{2} = 56\ \text{cm}^2$
AKA: $\approx 56\ \text{სმ}^2$
AEN: $\approx 56\ \text{cm}^2$

--- medium motion
KA: ნავი წყლის მიმართ $3\ \text{მ/წმ}$ სიჩქარით მოძრაობს, დინების სიჩქარე $1\ \text{მ/წმ}$-ია. იპოვეთ ნავის სიჩქარე ნაპირის მიმართ, როცა ის მიცურავს: ა) დინების მიმართულებით; ბ) დინების საწინააღმდეგოდ.
EN: A boat moves at $3\ \text{m/s}$ relative to the water; the current is $1\ \text{m/s}$. Find the boat's speed relative to the bank when it goes: a) downstream; b) upstream.
HKA: სიჩქარეები იკრიბება ან აკლდება — მიმართულების მიხედვით.
HEN: The speeds add or subtract depending on direction.
SKA: **ფორმულა:** ა) $v = v_{\text{ნ}} + u$; ბ) $v = v_{\text{ნ}} - u$
**რიცხვები:** ა) $3 + 1 = 4\ \text{მ/წმ}$; ბ) $3 - 1 = 2\ \text{მ/წმ}$
SEN: **Formula:** a) $v = v_{\text{b}} + u$; b) $v = v_{\text{b}} - u$
**Numbers:** a) $3 + 1 = 4\ \text{m/s}$; b) $3 - 1 = 2\ \text{m/s}$
AKA: ა) $4\ \text{მ/წმ}$; ბ) $2\ \text{მ/წმ}$
AEN: a) $4\ \text{m/s}$; b) $2\ \text{m/s}$

--- medium motion
KA: მატარებელი $72\ \text{კმ/სთ}$ სიჩქარით მოძრაობს. მგზავრი ვაგონში მოძრაობის მიმართულებით $1\ \text{მ/წმ}$ სიჩქარით მიდის. რას უდრის მგზავრის სიჩქარე დედამიწის მიმართ? რას უდრის ის, თუ მგზავრი საწინააღმდეგოდ მიდის?
EN: A train moves at $72\ \text{km/h}$. A passenger walks forward in the carriage at $1\ \text{m/s}$. What is the passenger's speed relative to the ground? What if they walk backwards?
HKA: გადაიყვანეთ $72\ \text{კმ/სთ}$ $\text{მ/წმ}$-ში.
HEN: Convert $72\ \text{km/h}$ to $\text{m/s}$.
SKA: **ფორმულა:** $v = v_{\text{მ}} \pm v_{\text{მგ}}$
**რიცხვები:** $v_{\text{მ}} = 20\ \text{მ/წმ}$; წინ: $20 + 1 = 21\ \text{მ/წმ}$; უკან: $20 - 1 = 19\ \text{მ/წმ}$
SEN: **Formula:** $v = v_{\text{train}} \pm v_{\text{pass}}$
**Numbers:** $v_{\text{train}} = 20\ \text{m/s}$; forwards: $20 + 1 = 21\ \text{m/s}$; backwards: $20 - 1 = 19\ \text{m/s}$
AKA: $21\ \text{მ/წმ}$; $19\ \text{მ/წმ}$
AEN: $21\ \text{m/s}$; $19\ \text{m/s}$

--- medium speed
KA: ავტომობილმა პირველ საათში $60\ \text{კმ}$ გაიარა, შემდეგ $2$ საათი $45\ \text{კმ/სთ}$ სიჩქარით იმოძრავა. იპოვეთ საშუალო სიჩქარე.
EN: A car covers $60\ \text{km}$ in the first hour, then drives $2$ hours at $45\ \text{km/h}$. Find the average speed.
HKA: ჯერ იპოვეთ მეორე მონაკვეთის სიგრძე.
HEN: First find the length of the second part.
SKA: **ფორმულა:** $v_{\text{საშ}} = \dfrac{s_1 + v_2 t_2}{t_1 + t_2}$
**რიცხვები:** $s_2 = 45 \cdot 2 = 90\ \text{კმ}$, $\ v_{\text{საშ}} = \dfrac{60 + 90}{1 + 2} = 50\ \text{კმ/სთ}$
SEN: **Formula:** $v_{\text{avg}} = \dfrac{s_1 + v_2 t_2}{t_1 + t_2}$
**Numbers:** $s_2 = 45 \cdot 2 = 90\ \text{km}$, $\ v_{\text{avg}} = \dfrac{60 + 90}{1 + 2} = 50\ \text{km/h}$
AKA: $50\ \text{კმ/სთ}$
AEN: $50\ \text{km/h}$

--- medium speed
KA: ავტომობილი A $90\ \text{კმ/სთ}$ სიჩქარით მისდევს ავტომობილ B-ს, რომელიც მასზე $30\ \text{კმ}$-ით წინაა და $60\ \text{კმ/სთ}$ სიჩქარით მოძრაობს. რა დროში დაეწევა A ავტომობილს B?
EN: Car A at $90\ \text{km/h}$ chases car B, which is $30\ \text{km}$ ahead and moving at $60\ \text{km/h}$. How long until A catches B?
HKA: დაწევის სიჩქარე სიჩქარეების სხვაობაა.
HEN: The closing speed is the difference of the speeds.
SKA: **ფორმულა:** $t = \dfrac{L}{v_A - v_B}$
**რიცხვები:** $t = \dfrac{30}{90 - 60} = 1\ \text{სთ}$
SEN: **Formula:** $t = \dfrac{L}{v_A - v_B}$
**Numbers:** $t = \dfrac{30}{90 - 60} = 1\ \text{h}$
AKA: $1\ \text{სთ}$
AEN: $1\ \text{h}$

--- medium speed
KA: $20\ \text{მ/წმ}$ სიჩქარით მოძრავმა მატარებელმა რკინიგზის ბოძს $15\ \text{წმ}$-ში ჩაუარა. რა სიგრძისაა მატარებელი?
EN: A train moving at $20\ \text{m/s}$ takes $15\ \text{s}$ to pass a pole. How long is the train?
HKA: ბოძთან ჩავლისას მატარებელი თავის სიგრძეს გადის.
HEN: Passing a pole, the train travels its own length.
SKA: **ფორმულა:** $L = v\,t$
**რიცხვები:** $L = 20 \cdot 15 = 300\ \text{მ}$
SEN: **Formula:** $L = v\,t$
**Numbers:** $L = 20 \cdot 15 = 300\ \text{m}$
AKA: $300\ \text{მ}$
AEN: $300\ \text{m}$

--- medium speed
KA: ორი სხეული ერთი წერტილიდან ერთი მიმართულებით ერთდროულად დაიძრა. გრაფიკების მიხედვით პირველმა $4\ \text{წმ}$-ში $20\ \text{მ}$ გაიარა, მეორემ $10\ \text{წმ}$-ში — $30\ \text{მ}$ (ორივე თანაბრად). იპოვეთ მათი სიჩქარეები და მანძილი მათ შორის $10\ \text{წმ}$-ის შემდეგ.
EN: Two bodies start together from one point in the same direction. From their graphs, the first covers $20\ \text{m}$ in $4\ \text{s}$ and the second $30\ \text{m}$ in $10\ \text{s}$ (both uniform). Find their speeds and the distance between them after $10\ \text{s}$.
HKA: $v = s/t$ თითოეულისთვის; მანძილი = გავლილი გზების სხვაობა.
HEN: $v = s/t$ for each; distance = difference of paths.
SKA: **ფორმულა:** $v = \dfrac{s}{t}$, $\ \Delta s = (v_1 - v_2)\,t$
**რიცხვები:** $v_1 = \dfrac{20}{4} = 5\ \text{მ/წმ}$, $\ v_2 = \dfrac{30}{10} = 3\ \text{მ/წმ}$
$\Delta s = (5 - 3) \cdot 10 = 20\ \text{მ}$
SEN: **Formula:** $v = \dfrac{s}{t}$, $\ \Delta s = (v_1 - v_2)\,t$
**Numbers:** $v_1 = \dfrac{20}{4} = 5\ \text{m/s}$, $\ v_2 = \dfrac{30}{10} = 3\ \text{m/s}$
$\Delta s = (5 - 3) \cdot 10 = 20\ \text{m}$
AKA: $5$ და $3\ \text{მ/წმ}$; $20\ \text{მ}$
AEN: $5$ and $3\ \text{m/s}$; $20\ \text{m}$

--- medium force
KA: მთვარეზე სხეულზე $32\ \text{ნ}$ სიმძიმის ძალა მოქმედებს ($g_{\text{მთ}} = 1{,}6\ \text{ნ/კგ}$). რას უდრის მისი მასა და რა ძალით მიიზიდავდა მას დედამიწა?
EN: On the Moon a body feels a gravitational force of $32\ \text{N}$ ($g_{\text{Moon}} = 1.6\ \text{N/kg}$). What is its mass, and with what force would the Earth pull it?
HKA: მასა ყველგან ერთნაირია.
HEN: The mass is the same everywhere.
SKA: **ფორმულა:** $m = \dfrac{F_{\text{მთ}}}{g_{\text{მთ}}}$, $\ F_{\text{დ}} = m g$
**რიცხვები:** $m = \dfrac{32}{1{,}6} = 20\ \text{კგ}$, $\ F_{\text{დ}} = 20 \cdot 10 = 200\ \text{ნ}$
SEN: **Formula:** $m = \dfrac{F_{\text{Moon}}}{g_{\text{Moon}}}$, $\ F_{\text{E}} = m g$
**Numbers:** $m = \dfrac{32}{1.6} = 20\ \text{kg}$, $\ F_{\text{E}} = 20 \cdot 10 = 200\ \text{N}$
AKA: $20\ \text{კგ}$; $200\ \text{ნ}$
AEN: $20\ \text{kg}$; $200\ \text{N}$

--- medium force
KA: თოკის გადაჭიმვისას A გუნდი $1200\ \text{ნ}$ ძალით ექაჩება, B გუნდი — $1000\ \text{ნ}$-ით, საწინააღმდეგოდ. იპოვეთ თოკზე მოქმედი ტოლქმედი და მისი მიმართულება. რომელი გუნდი იგებს?
EN: In a tug of war team A pulls with $1200\ \text{N}$ and team B with $1000\ \text{N}$ the other way. Find the resultant on the rope and its direction. Which team wins?
HKA: საწინააღმდეგო ძალები აკლდება.
HEN: Opposite forces subtract.
SKA: **ფორმულა:** $R = F_A - F_B$
**რიცხვები:** $R = 1200 - 1000 = 200\ \text{ნ}$, A გუნდის მიმართულებით — იგებს A.
SEN: **Formula:** $R = F_A - F_B$
**Numbers:** $R = 1200 - 1000 = 200\ \text{N}$ towards team A — A wins.
AKA: $200\ \text{ნ}$, A-სკენ
AEN: $200\ \text{N}$ towards A

--- medium elastic
KA: ერთი და იგივე $4\ \text{ნ}$ ტვირთით პირველი ზამბარა $2\ \text{სმ}$-ით წაგრძელდა, მეორე — $5\ \text{სმ}$-ით. იპოვეთ ზამბარების სიხისტეები. რომელია უფრო ხისტი?
EN: Under the same $4\ \text{N}$ load the first spring stretches $2\ \text{cm}$ and the second $5\ \text{cm}$. Find their stiffnesses. Which is stiffer?
HKA: $k = F/\Delta l$; რაც უფრო ნაკლებად იჭიმება, მით უფრო ხისტია.
HEN: $k = F/\Delta l$; the less it stretches, the stiffer it is.
SKA: **ფორმულა:** $k = \dfrac{F}{\Delta l}$
**რიცხვები:** $k_1 = \dfrac{4}{0{,}02} = 200\ \text{ნ/მ}$, $\ k_2 = \dfrac{4}{0{,}05} = 80\ \text{ნ/მ}$ — პირველი უფრო ხისტია.
SEN: **Formula:** $k = \dfrac{F}{\Delta l}$
**Numbers:** $k_1 = \dfrac{4}{0.02} = 200\ \text{N/m}$, $\ k_2 = \dfrac{4}{0.05} = 80\ \text{N/m}$ — the first is stiffer.
AKA: $200\ \text{ნ/მ}$ და $80\ \text{ნ/მ}$; პირველი
AEN: $200\ \text{N/m}$ and $80\ \text{N/m}$; the first

--- medium elastic
KA: ზამბარის სიგრძე $4\ \text{ნ}$ ძალით გაჭიმვისას $20\ \text{სმ}$-ია, $6\ \text{ნ}$-ით — $24\ \text{სმ}$. იპოვეთ ზამბარის სიხისტე და დაუტვირთავი სიგრძე.
EN: A spring is $20\ \text{cm}$ long under $4\ \text{N}$ and $24\ \text{cm}$ long under $6\ \text{N}$. Find its stiffness and unloaded length.
HKA: ძალის დამატებითი $2\ \text{ნ}$ იწვევს დამატებით $4\ \text{სმ}$ წაგრძელებას.
HEN: The extra $2\ \text{N}$ causes an extra $4\ \text{cm}$ of stretch.
SKA: **ფორმულა:** $k = \dfrac{F_2 - F_1}{l_2 - l_1}$, $\ l_0 = l_1 - \dfrac{F_1}{k}$
**რიცხვები:** $k = \dfrac{6 - 4}{0{,}24 - 0{,}20} = \dfrac{2}{0{,}04} = 50\ \text{ნ/მ}$
$l_0 = 0{,}20 - \dfrac{4}{50} = 0{,}20 - 0{,}08 = 0{,}12\ \text{მ} = 12\ \text{სმ}$
SEN: **Formula:** $k = \dfrac{F_2 - F_1}{l_2 - l_1}$, $\ l_0 = l_1 - \dfrac{F_1}{k}$
**Numbers:** $k = \dfrac{6 - 4}{0.24 - 0.20} = \dfrac{2}{0.04} = 50\ \text{N/m}$
$l_0 = 0.20 - \dfrac{4}{50} = 0.20 - 0.08 = 0.12\ \text{m} = 12\ \text{cm}$
AKA: $50\ \text{ნ/მ}$; $12\ \text{სმ}$
AEN: $50\ \text{N/m}$; $12\ \text{cm}$

--- medium elastic
KA: $5\ \text{კგ}$ ყუთის თანაბრად მისათრევად იატაკზე $15\ \text{ნ}$ ძალაა საჭირო. რა ძალა დასჭირდება იმავე იატაკზე $8\ \text{კგ}$ ყუთს (იმავე მასალისგან)?
EN: Dragging a $5\ \text{kg}$ box uniformly across a floor takes $15\ \text{N}$. What force does an $8\ \text{kg}$ box of the same material need on the same floor?
HKA: სრიალის ხახუნი დაწოლის ძალის (აქ — წონის) პროპორციულია.
HEN: Sliding friction is proportional to the pressing force (here the weight).
SKA: **ფორმულა:** $\dfrac{F_2}{F_1} = \dfrac{m_2}{m_1} \Rightarrow F_2 = F_1 \dfrac{m_2}{m_1}$
**რიცხვები:** $F_2 = 15 \cdot \dfrac{8}{5} = 24\ \text{ნ}$
SEN: **Formula:** $\dfrac{F_2}{F_1} = \dfrac{m_2}{m_1} \Rightarrow F_2 = F_1 \dfrac{m_2}{m_1}$
**Numbers:** $F_2 = 15 \cdot \dfrac{8}{5} = 24\ \text{N}$
AKA: $24\ \text{ნ}$
AEN: $24\ \text{N}$

--- medium density
KA: შეურიეს $1\ \text{კგ}$ წყალი და $1\ \text{კგ}$ ზეთი ($\rho_{\text{ზ}} = 800\ \text{კგ/მ}^3$). იპოვეთ ნარევის საშუალო სიმკვრივე (მოცულობები იკრიბება).
EN: $1\ \text{kg}$ of water is mixed with $1\ \text{kg}$ of oil ($\rho_{\text{oil}} = 800\ \text{kg/m}^3$). Find the average density of the mixture (volumes add).
HKA: იპოვეთ თითოეულის მოცულობა: $V = m/\rho$.
HEN: Find each volume: $V = m/\rho$.
SKA: **ფორმულა:** $\rho = \dfrac{m_1 + m_2}{\frac{m_1}{\rho_1} + \frac{m_2}{\rho_2}}$
**რიცხვები:** $V_1 = 1\ \text{ლ}$, $\ V_2 = \dfrac{1}{800}\ \text{მ}^3 = 1{,}25\ \text{ლ}$
$\rho = \dfrac{2\ \text{კგ}}{0{,}00225\ \text{მ}^3} \approx 889\ \text{კგ/მ}^3$
SEN: **Formula:** $\rho = \dfrac{m_1 + m_2}{\frac{m_1}{\rho_1} + \frac{m_2}{\rho_2}}$
**Numbers:** $V_1 = 1\ \text{L}$, $\ V_2 = \dfrac{1}{800}\ \text{m}^3 = 1.25\ \text{L}$
$\rho = \dfrac{2\ \text{kg}}{0.00225\ \text{m}^3} \approx 889\ \text{kg/m}^3$
AKA: $\approx 889\ \text{კგ/მ}^3$
AEN: $\approx 889\ \text{kg/m}^3$

--- medium density
KA: კანისტრაში $20\ \text{ლ}$ ბენზინი ეტევა. რას უდრის ბენზინის მასა? ($\rho = 710\ \text{კგ/მ}^3$)
EN: A canister holds $20\ \text{L}$ of petrol. What is the mass of the petrol? ($\rho = 710\ \text{kg/m}^3$)
HKA: $20\ \text{ლ} = 0{,}02\ \text{მ}^3$.
HEN: $20\ \text{L} = 0.02\ \text{m}^3$.
SKA: **ფორმულა:** $m = \rho\,V$
**რიცხვები:** $m = 710 \cdot 0{,}02 = 14{,}2\ \text{კგ}$
SEN: **Formula:** $m = \rho\,V$
**Numbers:** $m = 710 \cdot 0.02 = 14.2\ \text{kg}$
AKA: $14{,}2\ \text{კგ}$
AEN: $14.2\ \text{kg}$

--- medium density
KA: (ლაბორატორიული) ქვის მასა სასწორით გაზომეს — $156\ \text{გ}$. მენზურაში წყლის დონე ქვის ჩაძირვამდე $40\ \text{მლ}$ იყო, ჩაძირვის შემდეგ — $100\ \text{მლ}$. იპოვეთ ქვის სიმკვრივე.
EN: (Lab) A stone's mass is measured as $156\ \text{g}$. In a measuring cylinder the water level was $40\ \text{mL}$ before the stone went in and $100\ \text{mL}$ after. Find the stone's density.
HKA: მოცულობა = დონეების სხვაობა.
HEN: Volume = difference of the levels.
SKA: **ფორმულა:** $\rho = \dfrac{m}{V_2 - V_1}$
**რიცხვები:** $V = 100 - 40 = 60\ \text{სმ}^3$, $\ \rho = \dfrac{156}{60} = 2{,}6\ \text{გ/სმ}^3 = 2600\ \text{კგ/მ}^3$
SEN: **Formula:** $\rho = \dfrac{m}{V_2 - V_1}$
**Numbers:** $V = 100 - 40 = 60\ \text{cm}^3$, $\ \rho = \dfrac{156}{60} = 2.6\ \text{g/cm}^3 = 2600\ \text{kg/m}^3$
AKA: $2600\ \text{კგ/მ}^3$
AEN: $2600\ \text{kg/m}^3$

--- medium matter
KA: სუნამოს მოლეკულების სიჩქარე ასობით მეტრია წამში, მაგრამ ოთახის მეორე ბოლოში სუნი მხოლოდ რამდენიმე წუთში აღწევს. რატომ?
EN: Perfume molecules move at hundreds of metres per second, yet the smell takes several minutes to cross a room. Why?
HKA: მოლეკულა ჰაერის მოლეკულებს უწყვეტლად ეჯახება.
HEN: A molecule keeps colliding with air molecules.
SKA: სუნამოს მოლეკულა ჰაერის მოლეკულებს წამში მილიარდჯერ ეჯახება და ყოველ ჯერზე მიმართულებას იცვლის.
მისი გზა ტეხილია (ქაოსური „ხეტიალი“), ამიტომ სწორი ხაზით გადაადგილება ძალიან ნელა ხდება — დიფუზია ნელი პროცესია.
(ოთახში სუნს უფრო ჰაერის ნაკადები — კონვექცია — ავრცელებს.)
SEN: A perfume molecule collides with air molecules billions of times a second, changing direction each time.
Its path is a zigzag (a random "walk"), so its net progress in a straight line is very slow — diffusion is slow.
(In a room air currents — convection — spread the smell more.)
AKA: მუდმივი შეჯახებების გამო მოლეკულის გზა ტეხილია
AEN: constant collisions make the molecule's path a zigzag

--- medium pressure
KA: ლურსმანზე ჩაქუჩი $20\ \text{ნ}$ ძალით მოქმედებს, ლურსმნის წვეროს ფართობია $0{,}1\ \text{მმ}^2$. რა წნევას ახდენს წვერო?
EN: A hammer pushes a nail with $20\ \text{N}$; the area of the nail's point is $0.1\ \text{mm}^2$. What pressure does the point exert?
HKA: $1\ \text{მმ}^2 = 10^{-6}\ \text{მ}^2$.
HEN: $1\ \text{mm}^2 = 10^{-6}\ \text{m}^2$.
SKA: **ფორმულა:** $p = \dfrac{F}{S}$
**რიცხვები:** $S = 10^{-7}\ \text{მ}^2$, $\ p = \dfrac{20}{10^{-7}} = 2 \cdot 10^8\ \text{პა}$ — ორიათასჯერ მეტი ატმოსფერულზე!
SEN: **Formula:** $p = \dfrac{F}{S}$
**Numbers:** $S = 10^{-7}\ \text{m}^2$, $\ p = \dfrac{20}{10^{-7}} = 2 \times 10^8\ \text{Pa}$ — two thousand times atmospheric pressure!
AKA: $2 \cdot 10^8\ \text{პა}$
AEN: $2 \times 10^8\ \text{Pa}$

--- medium pressure
KA: $70\ \text{კგ}$ მასის მოთხილამურე თხილამურებზე დგას (ორივეს ფართობი $0{,}35\ \text{მ}^2$). რა წნევას ახდენს ის თოვლზე? რამდენჯერ ნაკლებია ეს ჩექმებში დგომისას წნევაზე, თუ ჩექმების ფართობი $0{,}035\ \text{მ}^2$-ია?
EN: A $70\ \text{kg}$ skier stands on skis (total area $0.35\ \text{m}^2$). What pressure does he exert on the snow? How many times less is it than standing in boots of area $0.035\ \text{m}^2$?
HKA: ძალა ერთი და იგივეა, ამიტომ წნევები ფართობების უკუპროპორციულია.
HEN: The force is the same, so the pressures are inversely proportional to the areas.
SKA: **ფორმულა:** $p = \dfrac{m g}{S}$
**რიცხვები:** $p_1 = \dfrac{700}{0{,}35} = 2000\ \text{პა}$, $\ p_2 = \dfrac{700}{0{,}035} = 20\,000\ \text{პა}$ — $10$-ჯერ ნაკლები.
SEN: **Formula:** $p = \dfrac{m g}{S}$
**Numbers:** $p_1 = \dfrac{700}{0.35} = 2000\ \text{Pa}$, $\ p_2 = \dfrac{700}{0.035} = 20\,000\ \text{Pa}$ — $10$ times less.
AKA: $2\ \text{კპა}$; $10$-ჯერ
AEN: $2\ \text{kPa}$; $10$ times

--- medium fluids
KA: მყვინთავი ზღვაში $30\ \text{მ}$ სიღრმეზეა ($\rho = 1030\ \text{კგ/მ}^3$). იპოვეთ წყლის წნევა და სრული წნევა ატმოსფერულის ($100\ \text{კპა}$) გათვალისწინებით.
EN: A diver is $30\ \text{m}$ deep in the sea ($\rho = 1030\ \text{kg/m}^3$). Find the water pressure and the total pressure including the atmosphere ($100\ \text{kPa}$).
HKA: სრული წნევა $= p_0 + \rho g h$.
HEN: Total pressure $= p_0 + \rho g h$.
SKA: **ფორმულა:** $p = p_0 + \rho g h$
**რიცხვები:** $\rho g h = 1030 \cdot 10 \cdot 30 = 309\,000\ \text{პა} = 309\ \text{კპა}$
$p = 100 + 309 = 409\ \text{კპა}$ — თითქმის $4$ ატმოსფერო.
SEN: **Formula:** $p = p_0 + \rho g h$
**Numbers:** $\rho g h = 1030 \cdot 10 \cdot 30 = 309\,000\ \text{Pa} = 309\ \text{kPa}$
$p = 100 + 309 = 409\ \text{kPa}$ — about $4$ atmospheres.
AKA: $309\ \text{კპა}$; $409\ \text{კპა}$
AEN: $309\ \text{kPa}$; $409\ \text{kPa}$

--- medium fluids
KA: მთის ძირში ბარომეტრი $760\ \text{მმ}$ ვწყ. სვ.-ს აჩვენებს, მწვერვალზე — $700\ \text{მმ}$-ს. დედამიწის ზედაპირთან ახლოს ყოველ $12\ \text{მ}$ ასვლაზე წნევა დაახლოებით $1\ \text{მმ}$ ვწყ. სვ.-ით მცირდება. შეაფასეთ მთის სიმაღლე.
EN: At the foot of a mountain a barometer reads $760\ \text{mmHg}$, at the top $700\ \text{mmHg}$. Near the surface the pressure drops about $1\ \text{mmHg}$ for every $12\ \text{m}$ of height. Estimate the mountain's height.
HKA: წნევის ცვლილება გაამრავლეთ $12\ \text{მ}$-ზე.
HEN: Multiply the pressure drop by $12\ \text{m}$.
SKA: **ფორმულა:** $h \approx \Delta p\ [\text{მმ}] \cdot 12\ \text{მ}$
**რიცხვები:** $\Delta p = 760 - 700 = 60\ \text{მმ}$, $\ h \approx 60 \cdot 12 = 720\ \text{მ}$
SEN: **Formula:** $h \approx \Delta p\ [\text{mm}] \cdot 12\ \text{m}$
**Numbers:** $\Delta p = 760 - 700 = 60\ \text{mm}$, $\ h \approx 60 \cdot 12 = 720\ \text{m}$
AKA: $\approx 720\ \text{მ}$
AEN: $\approx 720\ \text{m}$

--- medium archimedes
KA: $3\ \text{კგ}$ მასისა და $4\ \text{ლ}$ მოცულობის სხეული წყალში ჩააგდეს. იცურავებს თუ ჩაიძირება? თუ ცურავს, მისი რა მოცულობა იქნება წყლის ქვეშ?
EN: A body of mass $3\ \text{kg}$ and volume $4\ \text{L}$ is thrown into water. Does it float or sink? If it floats, what volume is under water?
HKA: შეადარეთ მაქსიმალური არქიმედეს ძალა (სრული ჩაძირვისას) სიმძიმის ძალას.
HEN: Compare the largest buoyant force (fully submerged) with the weight.
SKA: **ფორმულა:** $F_{A\max} = \rho_{\text{წყ}} g V$; ცურვისას $\rho_{\text{წყ}} g V_{\text{ჩ}} = m g \Rightarrow V_{\text{ჩ}} = \dfrac{m}{\rho_{\text{წყ}}}$
**რიცხვები:** $F_{A\max} = 1000 \cdot 10 \cdot 0{,}004 = 40\ \text{ნ} > m g = 30\ \text{ნ}$ — ცურავს.
$V_{\text{ჩ}} = \dfrac{3}{1000} = 0{,}003\ \text{მ}^3 = 3\ \text{ლ}$
SEN: **Formula:** $F_{A\max} = \rho_{\text{w}} g V$; when floating $\rho_{\text{w}} g V_{\text{sub}} = m g \Rightarrow V_{\text{sub}} = \dfrac{m}{\rho_{\text{w}}}$
**Numbers:** $F_{A\max} = 1000 \cdot 10 \cdot 0.004 = 40\ \text{N} > m g = 30\ \text{N}$ — it floats.
$V_{\text{sub}} = \dfrac{3}{1000} = 0.003\ \text{m}^3 = 3\ \text{L}$
AKA: ცურავს; $3\ \text{ლ}$
AEN: it floats; $3\ \text{L}$

--- medium machines
KA: $30\ \text{კგ}$ ტვირთი მოძრავი ჭოჭონაქით აიტანეს, თოკს $160\ \text{ნ}$ ძალით ექაჩებოდნენ. იპოვეთ მექანიზმის სმკ.
EN: A $30\ \text{kg}$ load is lifted with a movable pulley by pulling the rope with $160\ \text{N}$. Find the efficiency.
HKA: მოძრავი ჭოჭონაქისას თოკს ორჯერ მეტ მანძილზე ექაჩებიან, ვიდრე ტვირთი ადის.
HEN: With a movable pulley the rope moves twice as far as the load rises.
SKA: **ფორმულა:** $\eta = \dfrac{m g h}{F \cdot 2h} = \dfrac{m g}{2F}$
**რიცხვები:** $\eta = \dfrac{300}{2 \cdot 160} \approx 0{,}94 = 94\%$
SEN: **Formula:** $\eta = \dfrac{m g h}{F \cdot 2h} = \dfrac{m g}{2F}$
**Numbers:** $\eta = \dfrac{300}{2 \cdot 160} \approx 0.94 = 94\%$
AKA: $\approx 94\%$
AEN: $\approx 94\%$

--- hard speed
KA: ავტომობილმა მოძრაობის **დროის** პირველი ნახევარი $60\ \text{კმ/სთ}$, მეორე ნახევარი კი $40\ \text{კმ/სთ}$ სიჩქარით იმოძრავა. იპოვეთ საშუალო სიჩქარე და შეადარეთ შემთხვევას, როცა იგივე სიჩქარეებით გავლილია **გზის** ნახევრები.
EN: A car drives the first half of the **time** at $60\ \text{km/h}$ and the second half at $40\ \text{km/h}$. Find the average speed and compare it with the case where the same speeds are used for halves of the **distance**.
HKA: დროის ნახევრების შემთხვევაში აღნიშნეთ ნახევარი დრო $t$-თი.
HEN: For halves of the time, call each half $t$.
SKA: **ფორმულა:** დროის ნახევრები: $v_{\text{საშ}} = \dfrac{v_1 t + v_2 t}{2t} = \dfrac{v_1 + v_2}{2}$; გზის ნახევრები: $v_{\text{საშ}} = \dfrac{2 v_1 v_2}{v_1 + v_2}$
**რიცხვები:** დროის ნახევრები: $\dfrac{60 + 40}{2} = 50\ \text{კმ/სთ}$
გზის ნახევრები: $\dfrac{2 \cdot 60 \cdot 40}{100} = 48\ \text{კმ/სთ}$ — ნაკლებია, რადგან ნელ სიჩქარეზე მეტი დრო იხარჯება.
SEN: **Formula:** halves of time: $v_{\text{avg}} = \dfrac{v_1 t + v_2 t}{2t} = \dfrac{v_1 + v_2}{2}$; halves of distance: $v_{\text{avg}} = \dfrac{2 v_1 v_2}{v_1 + v_2}$
**Numbers:** halves of time: $\dfrac{60 + 40}{2} = 50\ \text{km/h}$
halves of distance: $\dfrac{2 \cdot 60 \cdot 40}{100} = 48\ \text{km/h}$ — less, because more time is spent at the lower speed.
AKA: $50\ \text{კმ/სთ}$; $48\ \text{კმ/სთ}$
AEN: $50\ \text{km/h}$; $48\ \text{km/h}$

--- hard speed
KA: ორი მატარებელი ერთმანეთის შემხვედრად მოძრაობს $54\ \text{კმ/სთ}$ და $36\ \text{კმ/სთ}$ სიჩქარეებით. პირველი მატარებლის მგზავრი ამჩნევს, რომ მეორე მატარებელი ($150\ \text{მ}$ სიგრძის) მის ფანჯარასთან ჩაივლის. რა დროში?
EN: Two trains approach each other at $54\ \text{km/h}$ and $36\ \text{km/h}$. A passenger in the first train watches the second train ($150\ \text{m}$ long) go past the window. How long does it take?
HKA: მგზავრის მიმართ მეორე მატარებელი სიჩქარეების ჯამით მოძრაობს.
HEN: Relative to the passenger the second train moves at the sum of the speeds.
SKA: **ფორმულა:** $t = \dfrac{L}{v_1 + v_2}$
**რიცხვები:** $v_1 + v_2 = 15 + 10 = 25\ \text{მ/წმ}$, $\ t = \dfrac{150}{25} = 6\ \text{წმ}$
SEN: **Formula:** $t = \dfrac{L}{v_1 + v_2}$
**Numbers:** $v_1 + v_2 = 15 + 10 = 25\ \text{m/s}$, $\ t = \dfrac{150}{25} = 6\ \text{s}$
AKA: $6\ \text{წმ}$
AEN: $6\ \text{s}$

--- hard speed
KA: მოტოციკლისტი A ქალაქიდან $9{:}00$-ზე გავიდა $60\ \text{კმ/სთ}$ სიჩქარით. იმავე მიმართულებით $10{:}00$-ზე გავიდა ავტომობილი $90\ \text{კმ/სთ}$ სიჩქარით. როდის და A-დან რა მანძილზე დაეწევა ავტომობილი მოტოციკლისტს?
EN: A motorcyclist leaves town A at $9{:}00$ at $60\ \text{km/h}$. A car leaves A in the same direction at $10{:}00$ at $90\ \text{km/h}$. When and how far from A does the car catch up?
HKA: დაწევისას ორივეს ერთნაირი მანძილი აქვს გავლილი; მოტოციკლისტი $1$ საათით მეტ ხანს მოძრაობს.
HEN: At catch-up both have covered the same distance; the motorcyclist has been riding $1$ hour longer.
SKA: **ფორმულა:** $v_1 t = v_2 (t - \tau) \Rightarrow t = \dfrac{v_2 \tau}{v_2 - v_1}$
**რიცხვები:** $t = \dfrac{90 \cdot 1}{30} = 3\ \text{სთ}$ — ე.ი. $12{:}00$-ზე; $\ s = 60 \cdot 3 = 180\ \text{კმ}$
SEN: **Formula:** $v_1 t = v_2 (t - \tau) \Rightarrow t = \dfrac{v_2 \tau}{v_2 - v_1}$
**Numbers:** $t = \dfrac{90 \cdot 1}{30} = 3\ \text{h}$ — i.e. at $12{:}00$; $\ s = 60 \cdot 3 = 180\ \text{km}$
AKA: $12{:}00$-ზე, $180\ \text{კმ}$-ზე
AEN: at $12{:}00$, $180\ \text{km}$ from A

--- hard speed
KA: $100\ \text{მ}$-იან რბენაზე ფინიშთან მდგომი მსაჯი წამზომს რთავს არა სტარტის პისტოლეტის კვამლის დანახვისას, არამედ გასროლის ხმის გაგონებისას. რამდენით ნაკლებ დროს აჩვენებს წამზომი? ($v_{\text{ბგ}} = 340\ \text{მ/წმ}$)
EN: In a $100\ \text{m}$ race the timekeeper at the finish starts the watch on hearing the starting pistol rather than on seeing its smoke. How much too short is the measured time? ($v_{\text{sound}} = 340\ \text{m/s}$)
HKA: სინათლე თითქმის მყისიერად მოდის, ბგერას კი $100\ \text{მ}$-ის გავლა სჭირდება.
HEN: Light arrives almost instantly, but sound needs time to cover $100\ \text{m}$.
SKA: **ფორმულა:** $\Delta t = \dfrac{L}{v_{\text{ბგ}}}$
**რიცხვები:** $\Delta t = \dfrac{100}{340} \approx 0{,}29\ \text{წმ}$ — სპორტში ეს ძალიან დიდი ცდომილებაა!
SEN: **Formula:** $\Delta t = \dfrac{L}{v_{\text{sound}}}$
**Numbers:** $\Delta t = \dfrac{100}{340} \approx 0.29\ \text{s}$ — a huge error in sport!
AKA: $\approx 0{,}29\ \text{წმ}$-ით
AEN: by $\approx 0.29\ \text{s}$

--- hard elastic
KA: $100\ \text{ნ/მ}$ სიხისტის ზამბარა შუაზე გაჭრეს. რას უდრის თითოეული ნახევრის სიხისტე? რამდენით წაგრძელდება ნახევარი $4\ \text{ნ}$ ტვირთით (მთელი ზამბარა წაგრძელდებოდა $4\ \text{სმ}$-ით)?
EN: A spring of stiffness $100\ \text{N/m}$ is cut in half. What is the stiffness of each half? How far does a half stretch under $4\ \text{N}$ (the whole spring would stretch $4\ \text{cm}$)?
HKA: მთელ ზამბარაზე წაგრძელება ორ ნახევარზე თანაბრად ნაწილდება — ნახევრის წაგრძელება ერთი და იმავე ძალისას ორჯერ ნაკლებია.
HEN: The whole spring's stretch is shared equally by its two halves — a half stretches half as much under the same force.
SKA: **ფორმულა:** $\Delta l_{1/2} = \dfrac{\Delta l}{2} \Rightarrow k_{1/2} = \dfrac{F}{\Delta l/2} = 2k$
**რიცხვები:** $k_{1/2} = 200\ \text{ნ/მ}$, $\ \Delta l = \dfrac{4}{200} = 0{,}02\ \text{მ} = 2\ \text{სმ}$
SEN: **Formula:** $\Delta l_{1/2} = \dfrac{\Delta l}{2} \Rightarrow k_{1/2} = \dfrac{F}{\Delta l/2} = 2k$
**Numbers:** $k_{1/2} = 200\ \text{N/m}$, $\ \Delta l = \dfrac{4}{200} = 0.02\ \text{m} = 2\ \text{cm}$
AKA: $200\ \text{ნ/მ}$; $2\ \text{სმ}$
AEN: $200\ \text{N/m}$; $2\ \text{cm}$

--- hard elastic
KA: მძიმე კარადას $30\ \text{ნ}$ ძალით აწვებიან, მაგრამ ის ადგილიდან არ იძვრის. რას უდრის ამ დროს ხახუნის ძალა? ძალას თანდათან ზრდიან და კარადა $120\ \text{ნ}$-ზე იძვრება. ახსენით, რატომ არის უძრაობის ხახუნის ძალა „ცვლადი“.
EN: A heavy wardrobe is pushed with $30\ \text{N}$ but doesn't move. What is the friction force then? The push is slowly increased and the wardrobe starts moving at $120\ \text{N}$. Explain why static friction is "variable".
HKA: სანამ სხეული უძრავია, ძალები ერთმანეთს აწონასწორებს.
HEN: While the body is at rest, the forces balance.
SKA: უძრაობისას ტოლქმედი ნულია, ამიტომ უძრაობის ხახუნი ზუსტად უდრის მოდებულ ძალას: $F_{\text{ხახ}} = 30\ \text{ნ}$.
უძრაობის ხახუნი „ერგება“ გარე ძალას — იზრდება მასთან ერთად, მაგრამ არა უსასრულოდ: მაქსიმალური მნიშვნელობაა $\approx 120\ \text{ნ}$.
როცა გარე ძალა ამ მაქსიმუმს გადააჭარბებს, სხეული იძვრება და მოქმედებას იწყებს სრიალის ხახუნი (როგორც წესი, ცოტა ნაკლები).
SEN: At rest the resultant is zero, so static friction exactly equals the applied force: $F_{\text{fr}} = 30\ \text{N}$.
Static friction "adjusts" to the applied force — it grows with it, but not without limit: its maximum is $\approx 120\ \text{N}$.
Once the push exceeds this maximum, the body moves and sliding friction takes over (usually a little smaller).
AKA: $30\ \text{ნ}$; მაქსიმუმი $\approx 120\ \text{ნ}$
AEN: $30\ \text{N}$; maximum $\approx 120\ \text{N}$

--- hard density
KA: სპილენძის ღრუ ბურთულას გარე მოცულობაა $100\ \text{სმ}^3$. რა მინიმალური უნდა იყოს სიღრუის მოცულობა, რომ ბურთულა წყალში არ ჩაიძიროს? ($\rho_{\text{სპ}} = 8{,}9\ \text{გ/სმ}^3$)
EN: A hollow copper ball has an outer volume of $100\ \text{cm}^3$. What is the smallest cavity volume for the ball not to sink in water? ($\rho_{\text{Cu}} = 8.9\ \text{g/cm}^3$)
HKA: არ ჩაიძირება, თუ ბურთულას მასა $\le$ მისი მოცულობის წყლის მასაზე ($100\ \text{გ}$).
HEN: It won't sink if its mass is $\le$ the mass of water of the same volume ($100\ \text{g}$).
SKA: **ფორმულა:** $\rho_{\text{სპ}} V_{\text{სპ}} \le \rho_{\text{წყ}} V \Rightarrow V_{\text{სპ}} \le \dfrac{\rho_{\text{წყ}} V}{\rho_{\text{სპ}}}$, $\ V_{\text{სიღ}} = V - V_{\text{სპ}}$
**რიცხვები:** $V_{\text{სპ}} \le \dfrac{100}{8{,}9} \approx 11{,}2\ \text{სმ}^3$
$V_{\text{სიღ}} \ge 100 - 11{,}2 = 88{,}8\ \text{სმ}^3$
SEN: **Formula:** $\rho_{\text{Cu}} V_{\text{Cu}} \le \rho_{\text{w}} V \Rightarrow V_{\text{Cu}} \le \dfrac{\rho_{\text{w}} V}{\rho_{\text{Cu}}}$, $\ V_{\text{cav}} = V - V_{\text{Cu}}$
**Numbers:** $V_{\text{Cu}} \le \dfrac{100}{8.9} \approx 11.2\ \text{cm}^3$
$V_{\text{cav}} \ge 100 - 11.2 = 88.8\ \text{cm}^3$
AKA: $\approx 88{,}8\ \text{სმ}^3$
AEN: $\approx 88.8\ \text{cm}^3$

--- hard density
KA: $500\ \text{სმ}^3$ სპირტს ($0{,}8\ \text{გ/სმ}^3$) რამდენი წყალი უნდა დავამატოთ, რომ ნარევის სიმკვრივე $0{,}9\ \text{გ/სმ}^3$ გახდეს? (მოცულობები იკრიბება.)
EN: How much water must be added to $500\ \text{cm}^3$ of alcohol ($0.8\ \text{g/cm}^3$) to get a mixture of density $0.9\ \text{g/cm}^3$? (Volumes add.)
HKA: აღნიშნეთ წყლის მოცულობა $V$-თი და დაწერეთ $\rho = \dfrac{m_1 + m_2}{V_1 + V_2}$.
HEN: Call the water volume $V$ and write $\rho = \dfrac{m_1 + m_2}{V_1 + V_2}$.
SKA: **ფორმულა:** $\dfrac{\rho_1 V_1 + \rho_{\text{წყ}} V}{V_1 + V} = \rho \Rightarrow V = \dfrac{V_1 (\rho - \rho_1)}{\rho_{\text{წყ}} - \rho}$
**რიცხვები:** $V = \dfrac{500 \cdot (0{,}9 - 0{,}8)}{1 - 0{,}9} = 500\ \text{სმ}^3$
შემოწმება: $\dfrac{400 + 500}{1000} = 0{,}9$ ✓
SEN: **Formula:** $\dfrac{\rho_1 V_1 + \rho_{\text{w}} V}{V_1 + V} = \rho \Rightarrow V = \dfrac{V_1 (\rho - \rho_1)}{\rho_{\text{w}} - \rho}$
**Numbers:** $V = \dfrac{500 \cdot (0.9 - 0.8)}{1 - 0.9} = 500\ \text{cm}^3$
Check: $\dfrac{400 + 500}{1000} = 0.9$ ✓
AKA: $500\ \text{სმ}^3$
AEN: $500\ \text{cm}^3$

--- hard matter
KA: წყლის მოლეკულის ზომა დაახლოებით $3 \cdot 10^{-10}\ \text{მ}$-ია. ჩათვალეთ, რომ თითოეულს $3 \cdot 10^{-10}\ \text{მ}$ წიბოიანი კუბი „უკავია“, და შეაფასეთ მოლეკულების რიცხვი $1\ \text{სმ}^3$ წყალში.
EN: A water molecule is about $3 \times 10^{-10}\ \text{m}$ across. Assume each occupies a cube of edge $3 \times 10^{-10}\ \text{m}$ and estimate the number of molecules in $1\ \text{cm}^3$ of water.
HKA: მოლეკულების რიცხვი = მთლიანი მოცულობა : ერთი მოლეკულის მოცულობაზე.
HEN: Number of molecules = total volume ÷ volume per molecule.
SKA: **ფორმულა:** $N = \dfrac{V}{d^3}$
**რიცხვები:** $d^3 = (3 \cdot 10^{-10})^3 = 2{,}7 \cdot 10^{-29}\ \text{მ}^3$, $\ V = 10^{-6}\ \text{მ}^3$
$N = \dfrac{10^{-6}}{2{,}7 \cdot 10^{-29}} \approx 3{,}7 \cdot 10^{22}$
SEN: **Formula:** $N = \dfrac{V}{d^3}$
**Numbers:** $d^3 = (3 \times 10^{-10})^3 = 2.7 \times 10^{-29}\ \text{m}^3$, $\ V = 10^{-6}\ \text{m}^3$
$N = \dfrac{10^{-6}}{2.7 \times 10^{-29}} \approx 3.7 \times 10^{22}$
AKA: $\approx 3{,}7 \cdot 10^{22}$
AEN: $\approx 3.7 \times 10^{22}$

--- hard pressure
KA: რკინის კუბის წიბოა $10\ \text{სმ}$. რა წნევას ახდენს ის მაგიდაზე? დაამტკიცეთ, რომ ერთგვაროვანი სვეტის (კუბი, ცილინდრი, პრიზმა) წნევა საყრდენზე მხოლოდ სიმკვრივესა და სიმაღლეზეა დამოკიდებული. ($\rho = 7800\ \text{კგ/მ}^3$)
EN: An iron cube has edge $10\ \text{cm}$. What pressure does it exert on a table? Prove that the pressure of any uniform column (cube, cylinder, prism) on its base depends only on its density and height. ($\rho = 7800\ \text{kg/m}^3$)
HKA: $m = \rho V = \rho S h$.
HEN: $m = \rho V = \rho S h$.
SKA: **ფორმულა:** $p = \dfrac{m g}{S} = \dfrac{\rho S h g}{S} = \rho g h$ — $S$ შეიკვეცა ∎
**რიცხვები:** $p = 7800 \cdot 10 \cdot 0{,}1 = 7800\ \text{პა}$
SEN: **Formula:** $p = \dfrac{m g}{S} = \dfrac{\rho S h g}{S} = \rho g h$ — $S$ cancels ∎
**Numbers:** $p = 7800 \cdot 10 \cdot 0.1 = 7800\ \text{Pa}$
AKA: $7800\ \text{პა}$
AEN: $7800\ \text{Pa}$

--- hard pressure
KA: ერთმანეთზე დაალაგეს $5$ აგური, თითოეულის მასაა $2\ \text{კგ}$, ქვედა აგურის საყრდენი ფართობი — $0{,}02\ \text{მ}^2$. რა წნევას ახდენს წყობა მიწაზე? რას უდრის ზედა აგურის წნევა მის ქვეშ მდებარე აგურზე?
EN: $5$ bricks of $2\ \text{kg}$ each are stacked; the bottom face area is $0.02\ \text{m}^2$. What pressure does the stack exert on the ground? What pressure does the top brick exert on the one below it?
HKA: მიწას ხუთივე აგურის წონა აწვება, ზედა აგური — მხოლოდ საკუთარი წონით.
HEN: The ground carries all five bricks; the top brick presses with only its own weight.
SKA: **ფორმულა:** $p = \dfrac{n m g}{S}$
**რიცხვები:** მიწაზე: $p = \dfrac{5 \cdot 2 \cdot 10}{0{,}02} = 5000\ \text{პა}$
ზედა აგური: $p = \dfrac{20}{0{,}02} = 1000\ \text{პა}$
SEN: **Formula:** $p = \dfrac{n m g}{S}$
**Numbers:** on the ground: $p = \dfrac{5 \cdot 2 \cdot 10}{0.02} = 5000\ \text{Pa}$
top brick: $p = \dfrac{20}{0.02} = 1000\ \text{Pa}$
AKA: $5000\ \text{პა}$; $1000\ \text{პა}$
AEN: $5000\ \text{Pa}$; $1000\ \text{Pa}$

--- hard fluids
KA: კაშხლის წინ წყლის სიღრმე $10\ \text{მ}$-ია, კაშხლის სიგანე — $50\ \text{მ}$. იპოვეთ წყლის დაწოლის ძალა კაშხალზე. (წნევა სიღრმესთან ერთად თანაბრად იზრდება, ამიტომ გამოიყენეთ საშუალო წნევა.)
EN: The water in front of a dam is $10\ \text{m}$ deep and the dam is $50\ \text{m}$ wide. Find the force of the water on the dam. (Pressure grows evenly with depth, so use the average pressure.)
HKA: საშუალო წნევა = წნევა სიღრმის ნახევარზე.
HEN: Average pressure = pressure at half the depth.
SKA: **ფორმულა:** $p_{\text{საშ}} = \dfrac{\rho g h}{2}$, $\ F = p_{\text{საშ}} \cdot h b$
**რიცხვები:** $p_{\text{საშ}} = \dfrac{1000 \cdot 10 \cdot 10}{2} = 50\,000\ \text{პა}$
$F = 50\,000 \cdot 10 \cdot 50 = 2{,}5 \cdot 10^7\ \text{ნ}$ — ამიტომ კაშხალს ძირში უფრო სქელს აშენებენ.
SEN: **Formula:** $p_{\text{avg}} = \dfrac{\rho g h}{2}$, $\ F = p_{\text{avg}} \cdot h b$
**Numbers:** $p_{\text{avg}} = \dfrac{1000 \cdot 10 \cdot 10}{2} = 50\,000\ \text{Pa}$
$F = 50\,000 \cdot 10 \cdot 50 = 2.5 \times 10^7\ \text{N}$ — that's why dams are built thicker at the bottom.
AKA: $2{,}5 \cdot 10^7\ \text{ნ}$
AEN: $2.5 \times 10^7\ \text{N}$

--- hard fluids
KA: U-ს მაგვარ მილში ვერცხლისწყალია. ერთ მუხლში $27{,}2\ \text{სმ}$ სიმაღლის წყლის სვეტი ჩაასხეს. რამდენით იქნება ვერცხლისწყლის დონე მეორე მუხლში პირველზე მაღლა? ($\rho_{\text{ვწ}} = 13\,600\ \text{კგ/მ}^3$)
EN: A U-tube contains mercury. A $27.2\ \text{cm}$ column of water is poured into one arm. How much higher is the mercury level in the other arm? ($\rho_{\text{Hg}} = 13\,600\ \text{kg/m}^3$)
HKA: წყლისა და ვერცხლისწყლის გამყოფი ზედაპირის დონეზე წნევები ტოლია.
HEN: At the level of the water–mercury boundary the pressures are equal.
SKA: **ფორმულა:** $\rho_{\text{წყ}} g h_{\text{წყ}} = \rho_{\text{ვწ}} g\,\Delta h \Rightarrow \Delta h = h_{\text{წყ}} \dfrac{\rho_{\text{წყ}}}{\rho_{\text{ვწ}}}$
**რიცხვები:** $\Delta h = 27{,}2 \cdot \dfrac{1000}{13\,600} = 2\ \text{სმ}$
SEN: **Formula:** $\rho_{\text{w}} g h_{\text{w}} = \rho_{\text{Hg}} g\,\Delta h \Rightarrow \Delta h = h_{\text{w}} \dfrac{\rho_{\text{w}}}{\rho_{\text{Hg}}}$
**Numbers:** $\Delta h = 27.2 \cdot \dfrac{1000}{13\,600} = 2\ \text{cm}$
AKA: $2\ \text{სმ}$-ით
AEN: by $2\ \text{cm}$

--- hard fluids
KA: ჰიდრავლიკური დომკრატის დიდი დგუშის ფართობი $50$-ჯერ აღემატება მცირისას. ყოველი დაწოლისას მცირე დგუში $20\ \text{სმ}$-ით ეშვება. რამდენით ადის დიდი დგუში ერთ დაწოლაზე და რამდენი დაწოლაა საჭირო ავტომობილის $10\ \text{სმ}$-ით ასაწევად?
EN: The large piston of a hydraulic jack has $50$ times the area of the small one. Each stroke pushes the small piston down $20\ \text{cm}$. How far does the large piston rise per stroke, and how many strokes lift a car by $10\ \text{cm}$?
HKA: სითხე არ იკუმშება: მცირე დგუშით გამოდევნილი მოცულობა დიდ დგუშს სწევს.
HEN: The liquid is incompressible: the volume pushed out by the small piston lifts the large one.
SKA: **ფორმულა:** $S_1 h_1 = S_2 h_2 \Rightarrow h_2 = h_1 \dfrac{S_1}{S_2}$, $\ n = \dfrac{H}{h_2}$
**რიცხვები:** $h_2 = \dfrac{20}{50} = 0{,}4\ \text{სმ} = 4\ \text{მმ}$, $\ n = \dfrac{10}{0{,}4} = 25$ დაწოლა
(ძალაში $50$-ჯერ ვიგებთ, მანძილში — ვაგებთ: ოქროს წესი.)
SEN: **Formula:** $S_1 h_1 = S_2 h_2 \Rightarrow h_2 = h_1 \dfrac{S_1}{S_2}$, $\ n = \dfrac{H}{h_2}$
**Numbers:** $h_2 = \dfrac{20}{50} = 0.4\ \text{cm} = 4\ \text{mm}$, $\ n = \dfrac{10}{0.4} = 25$ strokes
(We gain $50$ times in force and lose in distance: the golden rule.)
AKA: $4\ \text{მმ}$; $25$
AEN: $4\ \text{mm}$; $25$

--- hard archimedes
KA: ხის ძელაკი ($20 \times 10 \times 5\ \text{სმ}$, $\rho = 600\ \text{კგ/მ}^3$) წყალში ცურავს ყველაზე დიდ წახნაგზე. რა სიღრმეზეა ის ჩაძირული? რა მასის ტვირთი უნდა დავდოთ მასზე, რომ მთლიანად ჩაიძიროს (ზედა წახნაგი წყლის დონეზე)?
EN: A wooden block ($20 \times 10 \times 5\ \text{cm}$, $\rho = 600\ \text{kg/m}^3$) floats in water on its largest face. How deep does it sink? What mass placed on top makes it sink until its top is level with the water?
HKA: ცურვისას ჩაძირული სიღრმე $h = \dfrac{\rho}{\rho_{\text{წყ}}} H$.
HEN: When floating the immersed depth is $h = \dfrac{\rho}{\rho_{\text{w}}} H$.
SKA: **ფორმულა:** $h = H\dfrac{\rho}{\rho_{\text{წყ}}}$; დამატებითი ტვირთი $M = \rho_{\text{წყ}} S (H - h)$
**რიცხვები:** $h = 5 \cdot 0{,}6 = 3\ \text{სმ}$
$M = 1\ \text{გ/სმ}^3 \cdot 200\ \text{სმ}^2 \cdot 2\ \text{სმ} = 400\ \text{გ}$
SEN: **Formula:** $h = H\dfrac{\rho}{\rho_{\text{w}}}$; extra load $M = \rho_{\text{w}} S (H - h)$
**Numbers:** $h = 5 \cdot 0.6 = 3\ \text{cm}$
$M = 1\ \text{g/cm}^3 \cdot 200\ \text{cm}^2 \cdot 2\ \text{cm} = 400\ \text{g}$
AKA: $3\ \text{სმ}$; $400\ \text{გ}$
AEN: $3\ \text{cm}$; $400\ \text{g}$

--- hard archimedes
KA: ჰელიუმიანი ბუშტის მოცულობაა $0{,}01\ \text{მ}^3$, გარსის მასა — $3\ \text{გ}$. რა მასის ტვირთის აწევა შეუძლია ბუშტს? ($\rho_{\text{ჰაერი}} = 1{,}29\ \text{კგ/მ}^3$, $\rho_{\text{He}} = 0{,}18\ \text{კგ/მ}^3$)
EN: A helium balloon has volume $0.01\ \text{m}^3$ and its skin has mass $3\ \text{g}$. What mass can it lift? ($\rho_{\text{air}} = 1.29\ \text{kg/m}^3$, $\rho_{\text{He}} = 0.18\ \text{kg/m}^3$)
HKA: არქიმედეს კანონი აირებშიც მოქმედებს: ამწევი ძალა = გამოდევნილი ჰაერის წონა.
HEN: Archimedes' law works in gases too: the lift = the weight of displaced air.
SKA: **ფორმულა:** $M = (\rho_{\text{ჰ}} - \rho_{\text{He}}) V - m_{\text{გ}}$
**რიცხვები:** $(1{,}29 - 0{,}18) \cdot 0{,}01 = 0{,}0111\ \text{კგ} = 11{,}1\ \text{გ}$
$M = 11{,}1 - 3 = 8{,}1\ \text{გ}$
SEN: **Formula:** $M = (\rho_{\text{air}} - \rho_{\text{He}}) V - m_{\text{skin}}$
**Numbers:** $(1.29 - 0.18) \cdot 0.01 = 0.0111\ \text{kg} = 11.1\ \text{g}$
$M = 11.1 - 3 = 8.1\ \text{g}$
AKA: $\approx 8\ \text{გ}$
AEN: $\approx 8\ \text{g}$

--- hard speed olympiad
KA: ავტომობილი A-დან B-ში მიდის. თუ ის $10\ \text{კმ/სთ}$-ით უფრო სწრაფად იმოძრავებდა, $1$ საათით ადრე ჩავიდოდა; თუ $10\ \text{კმ/სთ}$-ით უფრო ნელა — $1{,}5$ საათით გვიან. იპოვეთ ავტომობილის სიჩქარე და მანძილი A-სა და B-ს შორის.
EN: A car drives from A to B. If it went $10\ \text{km/h}$ faster it would arrive $1$ hour earlier; if $10\ \text{km/h}$ slower, $1.5$ hours later. Find its speed and the distance from A to B.
HKA: აღნიშნეთ სიჩქარე $v$, დრო $t$; მანძილი სამივე შემთხვევაში ერთია: $vt = (v + 10)(t - 1) = (v - 10)(t + 1{,}5)$.
HEN: Let the speed be $v$ and the time $t$; the distance is the same in all three cases: $vt = (v + 10)(t - 1) = (v - 10)(t + 1.5)$.
SKA: **ფორმულა:** $vt = (v + 10)(t - 1) \Rightarrow v = 10t - 10$
$vt = (v - 10)(t + 1{,}5) \Rightarrow 1{,}5v = 10t + 15$
**რიცხვები:** $1{,}5(10t - 10) = 10t + 15 \Rightarrow 5t = 30 \Rightarrow t = 6\ \text{სთ}$
$v = 50\ \text{კმ/სთ}$, $\ s = 50 \cdot 6 = 300\ \text{კმ}$
შემოწმება: $60 \cdot 5 = 300$ ✓, $40 \cdot 7{,}5 = 300$ ✓
SEN: **Formula:** $vt = (v + 10)(t - 1) \Rightarrow v = 10t - 10$
$vt = (v - 10)(t + 1.5) \Rightarrow 1.5v = 10t + 15$
**Numbers:** $1.5(10t - 10) = 10t + 15 \Rightarrow 5t = 30 \Rightarrow t = 6\ \text{h}$
$v = 50\ \text{km/h}$, $\ s = 50 \cdot 6 = 300\ \text{km}$
Check: $60 \cdot 5 = 300$ ✓, $40 \cdot 7.5 = 300$ ✓
AKA: $50\ \text{კმ/სთ}$; $300\ \text{კმ}$
AEN: $50\ \text{km/h}$; $300\ \text{km}$

--- hard density olympiad
KA: (არქიმედეს ამოცანა) მეფის გვირგვინის მასაა $1\ \text{კგ}$, წყალში ჩაძირვისას მისი წონა ისე მცირდება, თითქოს მასა $60\ \text{გ}$-ით შემცირდა. სუფთა ოქროსია გვირგვინი? თუ არა და ის ოქროსა და ვერცხლის შენადნობია, რამდენი ოქროა მასში? ($\rho_{\text{ოქ}} = 19{,}3\ \text{გ/სმ}^3$, $\rho_{\text{ვ}} = 10{,}5\ \text{გ/სმ}^3$)
EN: (Archimedes' problem) A king's crown has mass $1\ \text{kg}$; in water its weight drops as if its mass were $60\ \text{g}$ less. Is it pure gold? If not, and it is an alloy of gold and silver, how much gold does it contain? ($\rho_{\text{Au}} = 19.3\ \text{g/cm}^3$, $\rho_{\text{Ag}} = 10.5\ \text{g/cm}^3$)
HKA: წონის დანაკლისი $60\ \text{გ}$ წყლის წონაა $\Rightarrow$ $V = 60\ \text{სმ}^3$. შემდეგ — ორი განტოლება (მასები და მოცულობები).
HEN: The weight loss equals $60\ \text{g}$ of water $\Rightarrow$ $V = 60\ \text{cm}^3$. Then two equations (masses and volumes).
SKA: **ფორმულა:** $V = \dfrac{\Delta m}{\rho_{\text{წყ}}}$, $\ \rho = \dfrac{m}{V}$; $\ \dfrac{m_1}{\rho_1} + \dfrac{m - m_1}{\rho_2} = V \Rightarrow m_1 = \dfrac{\rho_1(m - \rho_2 V)}{\rho_1 - \rho_2}$
**რიცხვები:** $V = 60\ \text{სმ}^3$, $\ \rho = \dfrac{1000}{60} \approx 16{,}7\ \text{გ/სმ}^3 < 19{,}3$ — სუფთა ოქრო არ არის!
$m_1 = \dfrac{19{,}3 \cdot (1000 - 630)}{8{,}8} = \dfrac{19{,}3 \cdot 370}{8{,}8} \approx 811\ \text{გ}$ ოქრო, $\approx 189\ \text{გ}$ ვერცხლი.
SEN: **Formula:** $V = \dfrac{\Delta m}{\rho_{\text{w}}}$, $\ \rho = \dfrac{m}{V}$; $\ \dfrac{m_1}{\rho_1} + \dfrac{m - m_1}{\rho_2} = V \Rightarrow m_1 = \dfrac{\rho_1(m - \rho_2 V)}{\rho_1 - \rho_2}$
**Numbers:** $V = 60\ \text{cm}^3$, $\ \rho = \dfrac{1000}{60} \approx 16.7\ \text{g/cm}^3 < 19.3$ — not pure gold!
$m_1 = \dfrac{19.3 \cdot (1000 - 630)}{8.8} = \dfrac{19.3 \cdot 370}{8.8} \approx 811\ \text{g}$ of gold, $\approx 189\ \text{g}$ of silver.
AKA: არა; $\approx 811\ \text{გ}$ ოქრო
AEN: no; $\approx 811\ \text{g}$ of gold

--- hard archimedes olympiad
KA: პატარა ტბაში ნავი ცურავს, რომელშიც დიდი ქვაა. მენავემ ქვა წყალში გადააგდო (ქვა ფსკერზე ჩავიდა). აიწევს თუ დაიწევს წყლის დონე ტბაში? დაასაბუთეთ.
EN: A boat with a large stone in it floats on a small pond. The boater throws the stone into the water (it sinks to the bottom). Does the water level in the pond rise or fall? Justify.
HKA: შეადარეთ ქვის მიერ გამოდევნილი წყლის მოცულობა ნავში ყოფნისას (ცურავს ნავთან ერთად) და ფსკერზე ყოფნისას.
HEN: Compare the water displaced on account of the stone while it is in the boat (floating) and when it lies on the bottom.
SKA: ნავში ყოფნისას ქვა წყალს გამოდევნის თავისი **მასის** ტოლი რაოდენობით: $V_1 = \dfrac{m}{\rho_{\text{წყ}}}$.
ფსკერზე ის გამოდევნის მხოლოდ თავისი **მოცულობის** ტოლს: $V_2 = \dfrac{m}{\rho_{\text{ქ}}}$.
$\rho_{\text{ქ}} > \rho_{\text{წყ}} \Rightarrow V_2 < V_1$ — გამოდევნილი წყალი შემცირდა, დონე **დაიწევს**.
მაგალითად, $10\ \text{კგ}$ ქვა ($2500\ \text{კგ/მ}^3$): $V_1 = 10\ \text{ლ}$, $V_2 = 4\ \text{ლ}$.
SEN: In the boat the stone displaces water equal to its **mass**: $V_1 = \dfrac{m}{\rho_{\text{w}}}$.
On the bottom it displaces only its own **volume**: $V_2 = \dfrac{m}{\rho_{\text{s}}}$.
$\rho_{\text{s}} > \rho_{\text{w}} \Rightarrow V_2 < V_1$ — less water is displaced, so the level **falls**.
For example a $10\ \text{kg}$ stone ($2500\ \text{kg/m}^3$): $V_1 = 10\ \text{L}$, $V_2 = 4\ \text{L}$.
AKA: დაიწევს
AEN: it falls

--- hard machines olympiad
KA: $4\ \text{მ}$ სიგრძისა და $20\ \text{კგ}$ მასის ერთგვაროვანი ფიცარი მაგიდაზე დევს ისე, რომ $1\ \text{მ}$ მაგიდის კიდიდან გარეთ არის გამოშვერილი. $40\ \text{კგ}$ მასის ბავშვი ფიცრის გამოშვერილ ნაწილზე გადადის. რა მანძილზე შეუძლია მას კიდიდან გასვლა ისე, რომ ფიცარი არ გადაბრუნდეს? მიაღწევს ბოლომდე?
EN: A uniform plank $4\ \text{m}$ long with mass $20\ \text{kg}$ lies on a table with $1\ \text{m}$ sticking out past the edge. A $40\ \text{kg}$ child walks out onto the overhanging part. How far beyond the edge can the child go before the plank tips? Can they reach the end?
HKA: გადაბრუნების მომენტში საყრდენი მაგიდის კიდეა. ფიცრის მასათა ცენტრი კიდიდან $1\ \text{მ}$-ით მაგიდის მხარესაა.
HEN: At the tipping point the pivot is the table edge. The plank's centre of mass is $1\ \text{m}$ from the edge on the table side.
SKA: ფიცრის შუა მის ბოლოდან $2\ \text{მ}$-ზეა, კიდე — $3\ \text{მ}$-ზე, ამიტომ ფიცრის წონის მხარი კიდის მიმართ $1\ \text{მ}$-ია.
**ფორმულა:** ზღვრული წონასწორობა: $m g\,x = M g \cdot d \Rightarrow x = \dfrac{M d}{m}$
**რიცხვები:** $x = \dfrac{20 \cdot 1}{40} = 0{,}5\ \text{მ}$ — ბავშვი მხოლოდ $0{,}5\ \text{მ}$-ზე გავა; ბოლომდე ($1\ \text{მ}$) ვერ მიაღწევს.
SEN: The plank's middle is $2\ \text{m}$ from its end and the edge is at $3\ \text{m}$, so the plank's weight has a $1\ \text{m}$ arm about the edge.
**Formula:** limiting balance: $m g\,x = M g \cdot d \Rightarrow x = \dfrac{M d}{m}$
**Numbers:** $x = \dfrac{20 \cdot 1}{40} = 0.5\ \text{m}$ — the child can go only $0.5\ \text{m}$ out; they can't reach the end ($1\ \text{m}$).
AKA: $0{,}5\ \text{მ}$; ვერა
AEN: $0.5\ \text{m}$; no

--- hard fluids olympiad
KA: ჭურჭელში წყალია, მის ზემოთ კი ზეთის ფენა ($\rho_{\text{ზ}} = 800\ \text{კგ/მ}^3$). $\rho = 900\ \text{კგ/მ}^3$ სიმკვრივის კუბი ისე ცურავს, რომ ზეთი მას მთლიანად ფარავს. კუბის მოცულობის რა ნაწილია წყალში?
EN: A vessel holds water with a layer of oil on top ($\rho_{\text{oil}} = 800\ \text{kg/m}^3$). A cube of density $\rho = 900\ \text{kg/m}^3$ floats so that the oil covers it completely. What fraction of the cube is in the water?
HKA: არქიმედეს ძალა ორივე სითხიდან იკრიბება: $\rho V = \rho_{\text{წყ}} x V + \rho_{\text{ზ}} (1 - x) V$.
HEN: The buoyant forces from both liquids add: $\rho V = \rho_{\text{w}} x V + \rho_{\text{oil}} (1 - x) V$.
SKA: **ფორმულა:** $\rho = \rho_{\text{წყ}} x + \rho_{\text{ზ}}(1 - x) \Rightarrow x = \dfrac{\rho - \rho_{\text{ზ}}}{\rho_{\text{წყ}} - \rho_{\text{ზ}}}$
**რიცხვები:** $x = \dfrac{900 - 800}{1000 - 800} = 0{,}5$ — კუბის ნახევარი წყალშია, ნახევარი ზეთში.
SEN: **Formula:** $\rho = \rho_{\text{w}} x + \rho_{\text{oil}}(1 - x) \Rightarrow x = \dfrac{\rho - \rho_{\text{oil}}}{\rho_{\text{w}} - \rho_{\text{oil}}}$
**Numbers:** $x = \dfrac{900 - 800}{1000 - 800} = 0.5$ — half the cube is in water, half in oil.
AKA: $\dfrac{1}{2}$
AEN: $\dfrac{1}{2}$

KA: ოთახის იატაკის სიგრძეა $5\ \text{მ}$, სიგანე — $4\ \text{მ}$, ჭერის სიმაღლე — $3\ \text{მ}$. იპოვეთ იატაკის ფართობი და ოთახის მოცულობა.
EN: A room's floor is $5\ \text{m}$ long and $4\ \text{m}$ wide, and the ceiling is $3\ \text{m}$ high. Find the floor area and the volume of the room.
HKA: მართკუთხედის ფართობი $S = a b$, მართკუთხა პარალელეპიპედის მოცულობა $V = a b c$.
HEN: Area of a rectangle $S = a b$; volume of a box $V = a b c$.
SKA: **ფორმულა:** $S = a b$, $\ V = a b c$

**Numbers:** $S = 5 \cdot 4 = 20\ \text{m}^2$, $\ V = 5 \cdot 4 \cdot 3 = 60\ \text{m}^3$

AEN: $20\ \text{m}^2$; $60\ \text{m}^3$

--- easy measure
KA: გადაიყვანეთ: $1\ \text{ლ}$ — $\text{სმ}^3$-ში და $\text{მ}^3$-ში; $1\ \text{მ}^2$ — $\text{სმ}^2$-ში.
EN: Convert: $1\ \text{L}$ into $\text{cm}^3$ and $\text{m}^3$; $1\ \text{m}^2$ into $\text{cm}^2$.
HKA: $1\ \text{ლ} = 1\ \text{დმ}^3$, $1\ \text{დმ} = 10\ \text{სმ}$. ფართობის ერთეულის გადაყვანისას კოეფიციენტი კვადრატში აიყვანება.
HEN: $1\ \text{L} = 1\ \text{dm}^3$, $1\ \text{dm} = 10\ \text{cm}$. For area units the factor is squared.
SKA: $1\ \text{ლ} = 1\ \text{დმ}^3 = (10\ \text{სმ})^3 = 1000\ \text{სმ}^3$
$1\ \text{ლ} = (0{,}1\ \text{მ})^3 = 0{,}001\ \text{მ}^3$
$1\ \text{მ}^2 = (100\ \text{სმ})^2 = 10\,000\ \text{სმ}^2$
SEN: $1\ \text{L} = 1\ \text{dm}^3 = (10\ \text{cm})^3 = 1000\ \text{cm}^3$
$1\ \text{L} = (0.1\ \text{m})^3 = 0.001\ \text{m}^3$
$1\ \text{m}^2 = (100\ \text{cm})^2 = 10\,000\ \text{cm}^2$
AKA: $1000\ \text{სმ}^3$; $0{,}001\ \text{მ}^3$; $10\,000\ \text{სმ}^2$
AEN: $1000\ \text{cm}^3$; $0.001\ \text{m}^3$; $10\,000\ \text{cm}^2$

--- easy measure
KA: ქვემოთ ჩამოთვლილთაგან რომელია ფიზიკური სიდიდე და რომელი — მისი ერთეული: სიგრძე, კილოგრამი, დრო, წამი, მასა, მეტრი?
EN: Which of these are physical quantities and which are units: length, kilogram, time, second, mass, metre?
HKA: ფიზიკური სიდიდე არის სხეულის ან მოვლენის თვისება, რომელიც შეიძლება გაიზომოს; ერთეული — ის, რითაც ვზომავთ.
HEN: A physical quantity is a property of a body or phenomenon that can be measured; a unit is what we measure it in.
SKA: სიდიდეები: სიგრძე, დრო, მასა.
ერთეულები: მეტრი (სიგრძის), წამი (დროის), კილოგრამი (მასის).
SEN: Quantities: length, time, mass.
Units: metre (of length), second (of time), kilogram (of mass).
AKA: სიდიდეები — სიგრძე, დრო, მასა; ერთეულები — მეტრი, წამი, კილოგრამი
AEN: quantities — length, time, mass; units — metre, second, kilogram

--- easy measure
KA: მენზურის $20\ \text{მლ}$-სა და $40\ \text{მლ}$-ის ნიშნულებს შორის $10$ დანაყოფია. რას უდრის დანაყოფის ფასი?
EN: A measuring cylinder has $10$ divisions between the $20\ \text{mL}$ and $40\ \text{mL}$ marks. What is the division value?
HKA: ნიშნულების სხვაობა გაყავით მათ შორის დანაყოფების რაოდენობაზე.
HEN: Divide the difference between the marks by the number of divisions between them.
SKA: **ფორმულა:** $c = \dfrac{a_2 - a_1}{N}$
**რიცხვები:** $c = \dfrac{40 - 20}{10} = 2\ \text{მლ}$
SEN: **Formula:** $c = \dfrac{a_2 - a_1}{N}$
**Numbers:** $c = \dfrac{40 - 20}{10} = 2\ \text{mL}$
AKA: $2\ \text{მლ}$
AEN: $2\ \text{mL}$

--- easy measure
KA: საათის წამზომი ისარი $1$ წუთში სრულ წრეს შემოწერს. რამდენ სრულ წრეს შემოწერს ის $1$ საათში? $1$ დღე-ღამეში?
EN: The second hand of a clock goes round once every minute. How many full turns does it make in $1$ hour? In $1$ day?
HKA: $1\ \text{სთ} = 60\ \text{წთ}$, $1$ დღე-ღამე $= 24\ \text{სთ}$.
HEN: $1\ \text{h} = 60\ \text{min}$, $1\ \text{day} = 24\ \text{h}$.
SKA: $1$ საათში: $60$ წრე.
$1$ დღე-ღამეში: $24 \cdot 60 = 1440$ წრე.
SEN: In $1$ hour: $60$ turns.
In $1$ day: $24 \cdot 60 = 1440$ turns.
AKA: $60$; $1440$
AEN: $60$; $1440$

--- easy measure
KA: კუბის წიბოს სიგრძეა $3\ \text{სმ}$. იპოვეთ მისი მოცულობა $\text{სმ}^3$-ში და $\text{მ}^3$-ში.
EN: A cube has edge $3\ \text{cm}$. Find its volume in $\text{cm}^3$ and in $\text{m}^3$.
HKA: $V = a^3$; $1\ \text{სმ}^3 = 10^{-6}\ \text{მ}^3$.
HEN: $V = a^3$; $1\ \text{cm}^3 = 10^{-6}\ \text{m}^3$.
SKA: **ფორმულა:** $V = a^3$
**რიცხვები:** $V = 3^3 = 27\ \text{სმ}^3 = 27 \cdot 10^{-6}\ \text{მ}^3 = 2{,}7 \cdot 10^{-5}\ \text{მ}^3$
SEN: **Formula:** $V = a^3$
**Numbers:** $V = 3^3 = 27\ \text{cm}^3 = 27 \cdot 10^{-6}\ \text{m}^3 = 2.7 \cdot 10^{-5}\ \text{m}^3$
AKA: $27\ \text{სმ}^3 = 2{,}7 \cdot 10^{-5}\ \text{მ}^3$
AEN: $27\ \text{cm}^3 = 2.7 \cdot 10^{-5}\ \text{m}^3$

--- easy measure
KA: მოსწავლემ ფანქრის სიგრძე გაზომა სახაზავით, რომლის დანაყოფის ფასია $1\ \text{მმ}$, და მიიღო $14{,}3\ \text{სმ}$. ჩაწერეთ შედეგი ცდომილების გათვალისწინებით, თუ ცდომილება დანაყოფის ფასის ნახევარია.
EN: A student measured a pencil with a ruler whose division value is $1\ \text{mm}$ and got $14.3\ \text{cm}$. Write the result with its error, if the error is half the division value.
HKA: ცდომილება $\Delta = 0{,}5\ \text{მმ} = 0{,}05\ \text{სმ}$. შედეგი ასე იწერება: $l = l_0 \pm \Delta$.
HEN: Error $\Delta = 0.5\ \text{mm} = 0.05\ \text{cm}$. The result is written as $l = l_0 \pm \Delta$.
SKA: $\Delta = \dfrac{1\ \text{მმ}}{2} = 0{,}5\ \text{მმ} = 0{,}05\ \text{სმ}$
$l = (14{,}30 \pm 0{,}05)\ \text{სმ}$ — ნამდვილი სიგრძე $14{,}25$-სა და $14{,}35\ \text{სმ}$-ს შორისაა.
SEN: $\Delta = \dfrac{1\ \text{mm}}{2} = 0.5\ \text{mm} = 0.05\ \text{cm}$
$l = (14.30 \pm 0.05)\ \text{cm}$ — the true length lies between $14.25$ and $14.35\ \text{cm}$.
AKA: $l = (14{,}30 \pm 0{,}05)\ \text{სმ}$
AEN: $l = (14.30 \pm 0.05)\ \text{cm}$

--- easy measure
KA: დაალაგეთ ზრდის მიხედვით: $0{,}5\ \text{მ}$; $45\ \text{სმ}$; $520\ \text{მმ}$; $4{,}8\ \text{დმ}$.
EN: Put in increasing order: $0.5\ \text{m}$; $45\ \text{cm}$; $520\ \text{mm}$; $4.8\ \text{dm}$.
HKA: ყველა სიდიდე ერთ ერთეულში — მაგალითად, სანტიმეტრებში — გადაიყვანეთ.
HEN: Convert everything to one unit, e.g. centimetres.
SKA: $0{,}5\ \text{მ} = 50\ \text{სმ}$; $45\ \text{სმ}$; $520\ \text{მმ} = 52\ \text{სმ}$; $4{,}8\ \text{დმ} = 48\ \text{სმ}$.
$45 < 48 < 50 < 52$
SEN: $0.5\ \text{m} = 50\ \text{cm}$; $45\ \text{cm}$; $520\ \text{mm} = 52\ \text{cm}$; $4.8\ \text{dm} = 48\ \text{cm}$.
$45 < 48 < 50 < 52$
AKA: $45\ \text{სმ} < 4{,}8\ \text{დმ} < 0{,}5\ \text{მ} < 520\ \text{მმ}$
AEN: $45\ \text{cm} < 4.8\ \text{dm} < 0.5\ \text{m} < 520\ \text{mm}$

--- easy measure
KA: გაკვეთილი $45$ წუთს გრძელდება. რამდენი წამია ეს? რა ნაწილია ის საათის?
EN: A lesson lasts $45$ minutes. How many seconds is that? What fraction of an hour is it?
HKA: $1\ \text{წთ} = 60\ \text{წმ}$, $1\ \text{სთ} = 60\ \text{წთ}$.
HEN: $1\ \text{min} = 60\ \text{s}$, $1\ \text{h} = 60\ \text{min}$.
SKA: $45 \cdot 60 = 2700\ \text{წმ}$
$\dfrac{45}{60} = \dfrac{3}{4} = 0{,}75\ \text{სთ}$
SEN: $45 \cdot 60 = 2700\ \text{s}$
$\dfrac{45}{60} = \dfrac{3}{4} = 0.75\ \text{h}$
AKA: $2700\ \text{წმ}$; $\dfrac{3}{4}$ საათი
AEN: $2700\ \text{s}$; $\dfrac{3}{4}$ of an hour

--- easy measure
KA: $100$ ერთნაირი სასტვენი ლურსმნის მასაა $250\ \text{გ}$. რას უდრის ერთი ლურსმნის მასა? რატომ ჯობია მასის ასე გაზომვა?
EN: $100$ identical nails have a mass of $250\ \text{g}$. What is the mass of one nail? Why is it better to measure it this way?
HKA: მთლიანი მასა გაყავით ლურსმნების რაოდენობაზე. იფიქრეთ სასწორის სიზუსტეზე.
HEN: Divide the total mass by the number of nails. Think about the balance's precision.
SKA: $m_1 = \dfrac{250\ \text{გ}}{100} = 2{,}5\ \text{გ}$
ერთი ლურსმანი ძალიან მსუბუქია და სასწორის ცდომილება შედარებით დიდი იქნებოდა; $100$ ლურსმნის აწონვისას ცდომილება $100$-ზე იყოფა.
SEN: $m_1 = \dfrac{250\ \text{g}}{100} = 2.5\ \text{g}$
One nail is so light that the balance's error would be relatively large; weighing $100$ nails divides that error by $100$.
AKA: $2{,}5\ \text{გ}$
AEN: $2.5\ \text{g}$

--- easy measure
KA: თერმომეტრი ჯერ $18\ \text{°C}$-ს აჩვენებდა, შემდეგ კი $25\ \text{°C}$-ს. რამდენი გრადუსით გაიზარდა ტემპერატურა? ჩაწერეთ ეს სხვაობა კელვინებში.
EN: A thermometer first read $18\ \text{°C}$, then $25\ \text{°C}$. By how many degrees did the temperature rise? Write this change in kelvins.
HKA: ტემპერატურის ცვლილება კელვინებში და ცელსიუსის გრადუსებში ერთნაირია.
HEN: A temperature change is the same in kelvins and in degrees Celsius.
SKA: $\Delta t = 25 - 18 = 7\ \text{°C}$
$\Delta T = 7\ \text{კ}$ (ერთი კელვინი ერთი ცელსიუსის გრადუსის ტოლია).
SEN: $\Delta t = 25 - 18 = 7\ \text{°C}$
$\Delta T = 7\ \text{K}$ (one kelvin equals one degree Celsius).
AKA: $7\ \text{°C} = 7\ \text{კ}$
AEN: $7\ \text{°C} = 7\ \text{K}$

--- medium measure
KA: სახაზავის დანაყოფის ფასია $1\ \text{მმ}$. მოსწავლემ ჩაწერა, რომ წიგნის სისქე $2{,}347\ \text{სმ}$-ია. რა შეცდომა დაუშვა? როგორ უნდა ჩაეწერა?
EN: A ruler's division value is $1\ \text{mm}$. A student wrote that a book is $2.347\ \text{cm}$ thick. What is wrong? How should it be written?
HKA: შედეგში იმაზე მეტი ციფრი არ უნდა ეწეროს, რასაც ხელსაწყოს სიზუსტე იძლევა. ცდომილებაა $0{,}5\ \text{მმ}$.
HEN: A result must not show more digits than the instrument's precision allows. The error is $0.5\ \text{mm}$.
SKA: $1\ \text{მმ}$-იანი სახაზავით მეათასედი სანტიმეტრი ($0{,}01\ \text{მმ}$) ვერ გაიზომება — ბოლო ციფრები უაზროა.
ცდომილება $0{,}05\ \text{სმ}$, ამიტომ შედეგი ასე ჩაიწერება: $d = (2{,}35 \pm 0{,}05)\ \text{სმ}$.
SEN: A $1\ \text{mm}$ ruler cannot measure thousandths of a centimetre ($0.01\ \text{mm}$) — the last digits are meaningless.
The error is $0.05\ \text{cm}$, so the result is $d = (2.35 \pm 0.05)\ \text{cm}$.
AKA: $d = (2{,}35 \pm 0{,}05)\ \text{სმ}$
AEN: $d = (2.35 \pm 0.05)\ \text{cm}$

--- medium measure
KA: $50$ ერთნაირი წვეთი მენზურაში $2{,}5\ \text{მლ}$-ს იკავებს. რას უდრის ერთი წვეთის მოცულობა $\text{სმ}^3$-ში და $\text{მმ}^3$-ში?
EN: $50$ identical drops fill $2.5\ \text{mL}$ in a measuring cylinder. What is the volume of one drop in $\text{cm}^3$ and in $\text{mm}^3$?
HKA: $1\ \text{მლ} = 1\ \text{სმ}^3 = 1000\ \text{მმ}^3$.
HEN: $1\ \text{mL} = 1\ \text{cm}^3 = 1000\ \text{mm}^3$.
SKA: $V_1 = \dfrac{2{,}5\ \text{სმ}^3}{50} = 0{,}05\ \text{სმ}^3$
$0{,}05\ \text{სმ}^3 = 0{,}05 \cdot 1000\ \text{მმ}^3 = 50\ \text{მმ}^3$
SEN: $V_1 = \dfrac{2.5\ \text{cm}^3}{50} = 0.05\ \text{cm}^3$
$0.05\ \text{cm}^3 = 0.05 \cdot 1000\ \text{mm}^3 = 50\ \text{mm}^3$
AKA: $0{,}05\ \text{სმ}^3 = 50\ \text{მმ}^3$
AEN: $0.05\ \text{cm}^3 = 50\ \text{mm}^3$

--- medium measure
KA: გულის $30$ დარტყმას $24\ \text{წმ}$ დასჭირდა. რამდენჯერ სცემს გული წუთში? რას უდრის ერთი დარტყმის ხანგრძლივობა?
EN: $30$ heartbeats took $24\ \text{s}$. How many beats per minute is that? How long does one beat last?
HKA: ჯერ იპოვეთ ერთი დარტყმის დრო, შემდეგ — რამდენი ეტევა $60\ \text{წმ}$-ში.
HEN: First find the time of one beat, then how many fit into $60\ \text{s}$.
SKA: $T = \dfrac{24\ \text{წმ}}{30} = 0{,}8\ \text{წმ}$
$n = \dfrac{60}{0{,}8} = 75$ დარტყმა წუთში
SEN: $T = \dfrac{24\ \text{s}}{30} = 0.8\ \text{s}$
$n = \dfrac{60}{0.8} = 75$ beats per minute
AKA: $75$ დარტყმა/წთ; $0{,}8\ \text{წმ}$
AEN: $75$ beats/min; $0.8\ \text{s}$

--- medium measure
KA: ფურცლის სიგრძე გაზომეს ოთხჯერ: $29{,}6$; $29{,}8$; $29{,}7$; $29{,}7\ \text{სმ}$. იპოვეთ საშუალო მნიშვნელობა და უდიდესი გადახრა საშუალოდან.
EN: The length of a sheet was measured four times: $29.6$; $29.8$; $29.7$; $29.7\ \text{cm}$. Find the mean and the largest deviation from it.
HKA: საშუალო = ჯამი : რაოდენობა. გადახრა = |გაზომილი − საშუალო|.
HEN: Mean = sum ÷ count. Deviation = |measured − mean|.
SKA: $\bar l = \dfrac{29{,}6 + 29{,}8 + 29{,}7 + 29{,}7}{4} = \dfrac{118{,}8}{4} = 29{,}7\ \text{სმ}$
გადახრები: $0{,}1$; $0{,}1$; $0$; $0$ — უდიდესია $0{,}1\ \text{სმ}$.
$l = (29{,}7 \pm 0{,}1)\ \text{სმ}$
SEN: $\bar l = \dfrac{29.6 + 29.8 + 29.7 + 29.7}{4} = \dfrac{118.8}{4} = 29.7\ \text{cm}$
Deviations: $0.1$; $0.1$; $0$; $0$ — the largest is $0.1\ \text{cm}$.
$l = (29.7 \pm 0.1)\ \text{cm}$
AKA: $29{,}7\ \text{სმ}$; $0{,}1\ \text{სმ}$
AEN: $29.7\ \text{cm}$; $0.1\ \text{cm}$

--- medium measure
KA: მართკუთხა ავზის ზომებია $80\ \text{სმ} \times 50\ \text{სმ} \times 60\ \text{სმ}$. რამდენი ლიტრი წყალი ჩაეტევა მასში? რამდენი $10$-ლიტრიანი ვედრო დასჭირდება მის გავსებას?
EN: A rectangular tank measures $80\ \text{cm} \times 50\ \text{cm} \times 60\ \text{cm}$. How many litres of water does it hold? How many $10$-litre buckets are needed to fill it?
HKA: მოცულობა დეციმეტრებში გამოთვალეთ: $1\ \text{დმ}^3 = 1\ \text{ლ}$.
HEN: Work in decimetres: $1\ \text{dm}^3 = 1\ \text{L}$.
SKA: $V = 8\ \text{დმ} \cdot 5\ \text{დმ} \cdot 6\ \text{დმ} = 240\ \text{დმ}^3 = 240\ \text{ლ}$
$n = \dfrac{240}{10} = 24$ ვედრო
SEN: $V = 8\ \text{dm} \cdot 5\ \text{dm} \cdot 6\ \text{dm} = 240\ \text{dm}^3 = 240\ \text{L}$
$n = \dfrac{240}{10} = 24$ buckets
AKA: $240\ \text{ლ}$; $24$ ვედრო
AEN: $240\ \text{L}$; $24$ buckets

--- medium measure
KA: ქანქარა $20$ რხევას $36\ \text{წმ}$-ში ასრულებს. რას უდრის ერთი რხევის დრო (პერიოდი)? რამდენ რხევას შეასრულებს ის $1\ \text{წთ}$-ში?
EN: A pendulum makes $20$ swings in $36\ \text{s}$. What is the time of one swing (the period)? How many swings does it make in $1\ \text{min}$?
HKA: $T = \dfrac{t}{N}$, $\ N' = \dfrac{t'}{T}$.
HEN: $T = \dfrac{t}{N}$, $\ N' = \dfrac{t'}{T}$.
SKA: **ფორმულა:** $T = \dfrac{t}{N}$
**რიცხვები:** $T = \dfrac{36}{20} = 1{,}8\ \text{წმ}$, $\ N' = \dfrac{60}{1{,}8} \approx 33$ რხევა
SEN: **Formula:** $T = \dfrac{t}{N}$
**Numbers:** $T = \dfrac{36}{20} = 1.8\ \text{s}$, $\ N' = \dfrac{60}{1.8} \approx 33$ swings
AKA: $1{,}8\ \text{წმ}$; $\approx 33$
AEN: $1.8\ \text{s}$; $\approx 33$

--- easy motion
KA: ავტობუსში მჯდომი მგზავრი ამბობს: „ხეები უკან გარბიან“. რა ათვლის სხეულთან მიმართებით აღწერს ის მოძრაობას? მოძრაობენ ხეები სინამდვილეში?
EN: A passenger on a bus says: "The trees are running backwards." Relative to what reference body is the passenger describing motion? Do the trees really move?
HKA: მოძრაობა ყოველთვის რაიმე ათვლის სხეულის მიმართ განიხილება.
HEN: Motion is always described relative to some reference body.
SKA: მგზავრი ათვლის სხეულად ავტობუსს (საკუთარ თავს) იღებს — მის მიმართ ხეები უკან მოძრაობენ.
დედამიწის მიმართ ხეები უძრავია. მოძრაობა ფარდობითია.
SEN: The passenger takes the bus (themselves) as the reference body — relative to it the trees move backwards.
Relative to the Earth the trees are at rest. Motion is relative.
AKA: ავტობუსის მიმართ — მოძრაობენ, დედამიწის მიმართ — არა
AEN: relative to the bus they move; relative to the Earth they don't

--- easy motion
KA: ბურთი $5\ \text{მ}$ სიმაღლიდან ჩამოვარდა, იატაკს დაეჯახა და $2\ \text{მ}$ სიმაღლეზე ავიდა. რას უდრის გავლილი გზა და გადაადგილების მოდული?
EN: A ball fell from a height of $5\ \text{m}$, bounced off the floor and rose to $2\ \text{m}$. What are the path length and the magnitude of the displacement?
HKA: გზა — ყველა მონაკვეთის ჯამი; გადაადგილება — საწყისი წერტილიდან საბოლოომდე მიმართული მონაკვეთი.
HEN: Path — sum of all segments; displacement — the straight segment from start to finish.
SKA: გზა: $l = 5 + 2 = 7\ \text{მ}$
გადაადგილება: ბურთი $5\ \text{მ}$-დან $2\ \text{მ}$-ზე აღმოჩნდა, $s = 5 - 2 = 3\ \text{მ}$ (ქვემოთ).
SEN: Path: $l = 5 + 2 = 7\ \text{m}$
Displacement: the ball went from $5\ \text{m}$ to $2\ \text{m}$, $s = 5 - 2 = 3\ \text{m}$ (downwards).
AKA: გზა $7\ \text{მ}$, გადაადგილება $3\ \text{მ}$
AEN: path $7\ \text{m}$, displacement $3\ \text{m}$

--- easy motion
KA: რომელ შემთხვევაში შეიძლება სხეული ნივთიერ წერტილად ჩავთვალოთ: ა) დედამიწის მოძრაობა მზის გარშემო; ბ) დედამიწის ბრუნვა საკუთარი ღერძის გარშემო; გ) თვითმფრინავის ფრენა თბილისიდან ლონდონამდე; დ) თვითმფრინავის შეყვანა ანგარში?
EN: In which cases can the body be treated as a point: a) the Earth orbiting the Sun; b) the Earth spinning on its axis; c) a plane flying from Tbilisi to London; d) a plane being moved into a hangar?
HKA: სხეული ნივთიერ წერტილად ითვლება, თუ მისი ზომები მცირეა განხილულ მანძილებთან შედარებით და მისი ფორმა არ გვაინტერესებს.
HEN: A body can be treated as a point if its size is small compared with the distances involved and its shape doesn't matter.
SKA: ა) კი — დედამიწის ზომა ბევრად ნაკლებია ორბიტაზე.
ბ) არა — ბრუნვისას სხეულის ზომა და ფორმაა მნიშვნელოვანი.
გ) კი — თვითმფრინავის სიგრძე ათასობით კილომეტრთან უმნიშვნელოა.
დ) არა — ანგარის კარში გასატარებლად თვითმფრინავის ზომები გვჭირდება.
SEN: a) yes — the Earth is tiny compared with its orbit.
b) no — for rotation the body's size and shape matter.
c) yes — the plane's length is negligible next to thousands of kilometres.
d) no — the plane's dimensions matter for getting through the hangar door.
AKA: ა) და გ)
AEN: a) and c)

--- easy motion
KA: სპორტსმენმა $50\ \text{მ}$-იან აუზში $100\ \text{მ}$ გაცურა (წავიდა და დაბრუნდა). რას უდრის გავლილი გზა და გადაადგილება?
EN: A swimmer swam $100\ \text{m}$ in a $50\ \text{m}$ pool (there and back). What are the path and the displacement?
HKA: საწყისი და საბოლოო წერტილები ემთხვევა.
HEN: The start and finish points coincide.
SKA: გზა: $l = 50 + 50 = 100\ \text{მ}$
გადაადგილება: სპორტსმენი იქვე დაბრუნდა, საიდანაც დაიწყო, $s = 0$.
SEN: Path: $l = 50 + 50 = 100\ \text{m}$
Displacement: the swimmer ended where they started, $s = 0$.
AKA: გზა $100\ \text{მ}$, გადაადგილება $0$
AEN: path $100\ \text{m}$, displacement $0$

--- easy motion
KA: რა ფორმისაა ტრაექტორია: ა) თოვლის ფიფქის, რომელიც უქარო ამინდში ვარდება; ბ) ჩარხის ბრუნვისას ბორბლის წერტილის ბორბლის ღერძის მიმართ; გ) ჰორიზონტალურად ნასროლი ქვის?
EN: What shape is the trajectory of: a) a snowflake falling in calm weather; b) a point on a spinning wheel relative to the axle; c) a stone thrown horizontally?
HKA: ტრაექტორია — წირი, რომელსაც სხეული მოძრაობისას შემოწერს.
HEN: A trajectory is the line a body traces out as it moves.
SKA: ა) წრფე (ვერტიკალური) — სწორხაზოვანი მოძრაობა.
ბ) წრეწირი — მრუდწირული მოძრაობა.
გ) მრუდი წირი (პარაბოლა).
SEN: a) a straight (vertical) line — rectilinear motion.
b) a circle — curvilinear motion.
c) a curve (a parabola).
AKA: ა) წრფე; ბ) წრეწირი; გ) მრუდი (პარაბოლა)
AEN: a) straight line; b) circle; c) curve (parabola)

--- easy motion
KA: მატარებელში მგზავრი მაგიდაზე ბურთს დებს. მატარებელი უცებ მუხრუჭს ამუხრუჭებს და ბურთი წინ გორდება. მოძრაობდა ბურთი მატარებლის მიმართ დამუხრუჭებამდე? დედამიწის მიმართ?
EN: A passenger puts a ball on a table in a train. The train brakes suddenly and the ball rolls forward. Was the ball moving relative to the train before braking? Relative to the Earth?
HKA: შეადარეთ ბურთის მდებარეობის ცვლილება ვაგონის მიმართ და გზის მიმართ.
HEN: Compare how the ball's position changed relative to the carriage and relative to the track.
SKA: დამუხრუჭებამდე ბურთი ვაგონის მიმართ უძრავი იყო — მისი მდებარეობა მაგიდაზე არ იცვლებოდა.
დედამიწის მიმართ ის მატარებელთან ერთად მოძრაობდა.
SEN: Before braking the ball was at rest relative to the carriage — its place on the table didn't change.
Relative to the Earth it was moving together with the train.
AKA: მატარებლის მიმართ — არა; დედამიწის მიმართ — კი
AEN: relative to the train — no; relative to the Earth — yes

--- easy motion
KA: სტადიონზე ბიჭმა $400\ \text{მ}$-იანი წრის ნახევარი გაირბინა. წრის დიამეტრი დაახლოებით $127\ \text{მ}$-ია. რას უდრის გზა და გადაადგილება?
EN: A boy ran half of a $400\ \text{m}$ circular track. The circle's diameter is about $127\ \text{m}$. What are the path and the displacement?
HKA: ნახევარი წრის შემდეგ ბიჭი დიამეტრის საპირისპირო ბოლოშია.
HEN: After half a lap the boy is at the opposite end of a diameter.
SKA: გზა: $l = \dfrac{400}{2} = 200\ \text{მ}$
გადაადგილება დიამეტრის ტოლია: $s \approx 127\ \text{მ}$.
SEN: Path: $l = \dfrac{400}{2} = 200\ \text{m}$
The displacement equals the diameter: $s \approx 127\ \text{m}$.
AKA: გზა $200\ \text{მ}$, გადაადგილება $\approx 127\ \text{მ}$
AEN: path $200\ \text{m}$, displacement $\approx 127\ \text{m}$

--- easy motion
KA: ესკალატორზე მდგარი ადამიანი მაღლა ადის. უძრავია ის თუ მოძრაობს: ა) ესკალატორის საფეხურის მიმართ; ბ) მეტროს კედლის მიმართ; გ) გვერდით ესკალატორზე მის მსგავსად ჩამოსული ადამიანის მიმართ?
EN: A person standing on an escalator is going up. Are they at rest or moving: a) relative to the step; b) relative to the station wall; c) relative to someone standing on the next escalator going down?
HKA: შეამოწმეთ, იცვლება თუ არა ადამიანის მდებარეობა თითოეული სხეულის მიმართ.
HEN: Check whether the person's position changes relative to each body.
SKA: ა) უძრავია — საფეხურის მიმართ მდებარეობა არ იცვლება.
ბ) მოძრაობს (ზემოთ).
გ) მოძრაობს — თანაც კედელთან შედარებით უფრო სწრაფად, რადგან ისინი ერთმანეთს საწინააღმდეგოდ ხვდებიან.
SEN: a) at rest — the position relative to the step does not change.
b) moving (upwards).
c) moving — even faster than relative to the wall, since they move in opposite directions.
AKA: ა) უძრავია; ბ) მოძრაობს; გ) მოძრაობს
AEN: a) at rest; b) moving; c) moving

--- medium motion
KA: ტურისტი ჯერ $3\ \text{კმ}$-ით ჩრდილოეთით წავიდა, შემდეგ $4\ \text{კმ}$-ით აღმოსავლეთით. იპოვეთ გავლილი გზა და გადაადგილების მოდული.
EN: A hiker walked $3\ \text{km}$ north, then $4\ \text{km}$ east. Find the path and the magnitude of the displacement.
HKA: გადაადგილება მართკუთხა სამკუთხედის ჰიპოტენუზაა.
HEN: The displacement is the hypotenuse of a right triangle.
SKA: გზა: $l = 3 + 4 = 7\ \text{კმ}$
გადაადგილება: $s = \sqrt{3^2 + 4^2} = \sqrt{25} = 5\ \text{კმ}$
SEN: Path: $l = 3 + 4 = 7\ \text{km}$
Displacement: $s = \sqrt{3^2 + 4^2} = \sqrt{25} = 5\ \text{km}$
AKA: გზა $7\ \text{კმ}$, გადაადგილება $5\ \text{კმ}$
AEN: path $7\ \text{km}$, displacement $5\ \text{km}$

--- medium motion
KA: საათის წუთის ისრის სიგრძეა $10\ \text{სმ}$. რა გზას გაივლის ისრის ბოლო $30$ წუთში? რას უდრის მისი გადაადგილება? ($\pi \approx 3{,}14$)
EN: A clock's minute hand is $10\ \text{cm}$ long. What path does its tip cover in $30$ minutes? What is its displacement? ($\pi \approx 3.14$)
HKA: $30$ წუთში წუთის ისარი ნახევარ წრეს შემოწერს. წრეწირის სიგრძე $2\pi r$.
HEN: In $30$ minutes the minute hand turns through half a circle. Circumference $2\pi r$.
SKA: **ფორმულა:** $l = \pi r$ (ნახევარი წრეწირი), $\ s = 2r$
**რიცხვები:** $l = 3{,}14 \cdot 10 \approx 31{,}4\ \text{სმ}$, $\ s = 20\ \text{სმ}$
SEN: **Formula:** $l = \pi r$ (half a circle), $\ s = 2r$
**Numbers:** $l = 3.14 \cdot 10 \approx 31.4\ \text{cm}$, $\ s = 20\ \text{cm}$
AKA: გზა $\approx 31{,}4\ \text{სმ}$, გადაადგილება $20\ \text{სმ}$
AEN: path $\approx 31.4\ \text{cm}$, displacement $20\ \text{cm}$

--- medium motion
KA: ორი მანქანა ერთ გზაზე ერთი მიმართულებით $70\ \text{კმ/სთ}$ სიჩქარით მიდის. რისი ტოლია ერთის სიჩქარე მეორის მიმართ? რას დაინახავს მძღოლი, თუ მეზობელ მანქანას უყურებს?
EN: Two cars drive on the same road in the same direction at $70\ \text{km/h}$ each. What is the speed of one relative to the other? What does a driver see when looking at the other car?
HKA: ერთი მიმართულებით მოძრაობისას ფარდობითი სიჩქარე სიჩქარეთა სხვაობაა.
HEN: For motion in the same direction the relative speed is the difference of the speeds.
SKA: $v_{\text{ფარდ}} = 70 - 70 = 0$
მძღოლისთვის მეზობელი მანქანა უძრავად ჩანს, თუმცა ორივე გზის მიმართ $70\ \text{კმ/სთ}$-ით მოძრაობს.
SEN: $v_{\text{rel}} = 70 - 70 = 0$
To the driver the other car appears to stand still, although both move at $70\ \text{km/h}$ relative to the road.
AKA: $0$; მანქანა უძრავად ჩანს
AEN: $0$; the car appears to be at rest

--- medium motion
KA: ბიჭი $12\ \text{მ}$ სიგრძის მოედნის ერთი კუთხიდან მეორე, დიაგონალურად მოპირდაპირე კუთხისკენ წავიდა მოედნის ორი გვერდის გავლით. მოედნის სიგანეა $5\ \text{მ}$. რამდენით მეტია გზა გადაადგილებაზე?
EN: A boy went from one corner of a $12\ \text{m}$ by $5\ \text{m}$ yard to the diagonally opposite corner by walking along two sides. By how much does his path exceed his displacement?
HKA: გზა — ორი გვერდის ჯამი, გადაადგილება — დიაგონალი.
HEN: Path — the sum of two sides; displacement — the diagonal.
SKA: გზა: $l = 12 + 5 = 17\ \text{მ}$
გადაადგილება: $s = \sqrt{12^2 + 5^2} = \sqrt{169} = 13\ \text{მ}$
$l - s = 4\ \text{მ}$
SEN: Path: $l = 12 + 5 = 17\ \text{m}$
Displacement: $s = \sqrt{12^2 + 5^2} = \sqrt{169} = 13\ \text{m}$
$l - s = 4\ \text{m}$
AKA: $4\ \text{მ}$-ით ($17\ \text{მ}$ და $13\ \text{მ}$)
AEN: by $4\ \text{m}$ ($17\ \text{m}$ and $13\ \text{m}$)

--- medium motion
KA: ვერტმფრენი ვერტიკალურად მაღლა ადის. როგორია მისი პროპელერის ფრთის ბოლოს ტრაექტორია: ა) ვერტმფრენის მიმართ; ბ) დედამიწის მიმართ?
EN: A helicopter rises vertically. What is the trajectory of the tip of a rotor blade: a) relative to the helicopter; b) relative to the Earth?
HKA: დედამიწის მიმართ ფრთის ბოლო ერთდროულად ბრუნავს და მაღლა ადის.
HEN: Relative to the Earth the tip both turns and moves up at the same time.
