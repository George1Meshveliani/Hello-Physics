EN: A wooden cube ($a = 10\ \text{cm}$, $\rho = 800\ \text{kg/m}^3$) floats in water. How deep is it submerged? What force pushes it fully under?
HKA: $h = a \dfrac{\rho}{\rho_{\text{წყ}}}$; $F = (\rho_{\text{წყ}} - \rho) g V$.
HEN: $h = a \dfrac{\rho}{\rho_{\text{w}}}$; $F = (\rho_{\text{w}} - \rho) g V$.
SKA: $h = 10 \cdot 0{,}8 = 8\ \text{სმ}$
$F = (1000 - 800) \cdot 10 \cdot 0{,}001 = 2\ \text{ნ}$
SEN: $h = 10 \cdot 0.8 = 8\ \text{cm}$
$F = (1000 - 800) \cdot 10 \cdot 0.001 = 2\ \text{N}$
AKA: $8\ \text{სმ}$; $2\ \text{ნ}$
AEN: $8\ \text{cm}$; $2\ \text{N}$

--- hard archimedes
KA: გემი მდინარიდან ($1000\ \text{კგ/მ}^3$) ზღვაში ($1030\ \text{კგ/მ}^3$) გავიდა. აიწევს თუ ჩაიწევს ის? რა მოცულობით შემცირდება ჩაძირული ნაწილი, თუ გემის მასაა $10\,300\ \text{ტ}$?
EN: A ship sails from a river ($1000\ \text{kg/m}^3$) into the sea ($1030\ \text{kg/m}^3$). Does it rise or sink lower? By how much does the submerged volume change if the ship's mass is $10\,300\ \text{t}$?
HKA: ამომგდები ძალა ორივეგან გემის წონის ტოლია.
HEN: In both cases the buoyant force equals the ship's weight.
SKA: მდინარეში: $V_1 = \dfrac{10\,300\,000}{1000} = 10\,300\ \text{მ}^3$
ზღვაში: $V_2 = \dfrac{10\,300\,000}{1030} = 10\,000\ \text{მ}^3$
გემი აიწევს, ჩაძირული მოცულობა $300\ \text{მ}^3$-ით შემცირდება.
SEN: In the river: $V_1 = \dfrac{10\,300\,000}{1000} = 10\,300\ \text{m}^3$
In the sea: $V_2 = \dfrac{10\,300\,000}{1030} = 10\,000\ \text{m}^3$
The ship rises; the submerged volume shrinks by $300\ \text{m}^3$.
AKA: აიწევს; $300\ \text{მ}^3$-ით
AEN: it rises; by $300\ \text{m}^3$

--- hard archimedes
KA: კორპის რგოლის ($\rho = 250\ \text{კგ/მ}^3$) რა მინიმალური მოცულობაა საჭირო, რომ $70\ \text{კგ}$ ადამიანმა თავი წყლის ზემოთ შეინარჩუნოს? ადამიანის სხეულის საშუალო სიმკვრივე $1060\ \text{კგ/მ}^3$-ია, ხოლო თავი მოცულობის $\dfrac{1}{15}$-ია.
EN: What minimum volume of cork ($\rho = 250\ \text{kg/m}^3$) is needed for a $70\ \text{kg}$ person to keep their head above water? The body's average density is $1060\ \text{kg/m}^3$ and the head is $\dfrac{1}{15}$ of its volume.
HKA: ადამიანის ჩაძირული მოცულობა: $\dfrac{14}{15} V_{\text{ად}}$; კორპი მთლიანად წყალშია.
HEN: The person's submerged volume is $\dfrac{14}{15} V_{\text{p}}$; the cork is fully submerged.
SKA: $V_{\text{ად}} = \dfrac{70}{1060} \approx 0{,}066\ \text{მ}^3$, ჩაძირული $\approx 0{,}0616\ \text{მ}^3$
$\rho_{\text{წყ}}(0{,}0616 + V) = 70 + 250 V \Rightarrow 750 V = 70 - 61{,}6 = 8{,}4$
$V \approx 0{,}0112\ \text{მ}^3 \approx 11\ \text{ლ}$
SEN: $V_{\text{p}} = \dfrac{70}{1060} \approx 0.066\ \text{m}^3$, submerged $\approx 0.0616\ \text{m}^3$
$\rho_{\text{w}}(0.0616 + V) = 70 + 250 V \Rightarrow 750 V = 70 - 61.6 = 8.4$
$V \approx 0.0112\ \text{m}^3 \approx 11\ \text{L}$
AKA: $\approx 11\ \text{ლ}$
AEN: $\approx 11\ \text{L}$

--- hard archimedes
KA: სხეულის წონა წყალში $3$-ჯერ ნაკლებია, ვიდრე ჰაერში. იპოვეთ სხეულის სიმკვრივე.
EN: A body weighs $3$ times less in water than in air. Find its density.
HKA: $P - F_A = \dfrac{P}{3} \Rightarrow F_A = \dfrac{2}{3} P$.
HEN: $W - F_A = \dfrac{W}{3} \Rightarrow F_A = \dfrac{2}{3} W$.
SKA: $\rho_{\text{წყ}} g V = \dfrac{2}{3} \rho g V$
$\rho = \dfrac{3}{2} \cdot 1000 = 1500\ \text{კგ/მ}^3$
SEN: $\rho_{\text{w}} g V = \dfrac{2}{3} \rho g V$
$\rho = \dfrac{3}{2} \cdot 1000 = 1500\ \text{kg/m}^3$
AKA: $1500\ \text{კგ/მ}^3$
AEN: $1500\ \text{kg/m}^3$

--- hard archimedes olympiad
KA: ჭიქაში წყალზე ყინულის ნატეხი ცურავს, რომელშიც ჰაერის ბუშტია ჩაყინული. დნობის შემდეგ შეიცვლება თუ არა წყლის დონე?
EN: An ice cube with an air bubble frozen inside floats in a glass of water. Does the water level change when it melts?
HKA: ჰაერის მასა უმნიშვნელოა; ცურვისას ყინული თავისი მასის ტოლ წყალს გამოდევნის.
HEN: The air's mass is negligible; a floating body displaces its own mass of water.
SKA: ყინული გამოდევნის $\dfrac{m}{\rho_{\text{წყ}}}$ მოცულობის წყალს, სადაც $m$ — ყინულის მასა (ჰაერისა ნულია).
დნობისას ყინული ზუსტად $\dfrac{m}{\rho_{\text{წყ}}}$ მოცულობის წყლად იქცევა, ჰაერი კი გაიფანტება — დონე **არ შეიცვლება**.
SEN: The ice displaces a volume $\dfrac{m}{\rho_{\text{w}}}$ of water, where $m$ is the ice's mass (the air's is zero).
On melting the ice becomes exactly $\dfrac{m}{\rho_{\text{w}}}$ of water and the air escapes — the level **does not change**.
AKA: არ შეიცვლება
AEN: it doesn't change

--- hard archimedes olympiad
KA: ჭიქაში წყალზე ყინულის ნატეხი ცურავს, რომელშიც პატარა ხის ნაჭერია ($\rho < \rho_{\text{წყ}}$) ჩაყინული. იცვლება თუ არა დონე დნობისას? რა იქნება, თუ ყინულში რკინის ბურთულაა?
EN: An ice cube with a small piece of wood ($\rho < \rho_{\text{w}}$) frozen inside floats in a glass of water. Does the level change when it melts? What if it held an iron ball instead?
HKA: დნობის შემდეგ ხე კვლავ ცურავს, ბურთულა კი ფსკერზე ჩადის.
HEN: After melting the wood still floats, while the iron ball sinks to the bottom.
SKA: ხე: დნობამდეც და შემდეგაც ყველაფერი ცურავს და თავისი მასის ტოლ წყალს გამოდევნის — დონე **არ იცვლება**.
რკინა: ყინულში ის $\dfrac{m}{\rho_{\text{წყ}}}$-ს გამოდევნის, ფსკერზე კი მხოლოდ $\dfrac{m}{\rho_{\text{რკ}}} < \dfrac{m}{\rho_{\text{წყ}}}$-ს — დონე **დაიწევს**.
SEN: Wood: before and after melting everything floats and displaces its own mass of water — the level **does not change**.
Iron: in the ice it displaces $\dfrac{m}{\rho_{\text{w}}}$, on the bottom only $\dfrac{m}{\rho_{\text{Fe}}} < \dfrac{m}{\rho_{\text{w}}}$ — the level **falls**.
AKA: ხე — არ იცვლება; რკინა — დაიწევს
AEN: wood — no change; iron — it falls

--- hard archimedes olympiad
KA: სასწორის ერთ თეფშზე წყლიანი ჭიქაა, მეორეზე — საწონები; სასწორი გაწონასწორებულია. ჭიქაში ძაფზე დაკიდებული ქვა ($V = 50\ \text{სმ}^3$) ჩაუშვეს ისე, რომ ფსკერს არ ეხება (ძაფს ხელით ვიჭერთ). რა მასის საწონი უნდა დავამატოთ მეორე თეფშზე?
EN: A glass of water on one pan of a balance is balanced by weights on the other. A stone ($V = 50\ \text{cm}^3$) hanging on a thread held by hand is lowered into the water without touching the bottom. What mass must be added to the other pan to restore balance?
HKA: წყალი ქვას ზემოთ უბიძგებს $F_A$-ით, ქვა კი წყალს (და ჭიქას) ქვემოთ იმავე ძალით (ნიუტონის III კანონი).
HEN: The water pushes the stone up with $F_A$; the stone pushes the water (and glass) down with the same force (Newton's third law).
SKA: $F_A = \rho_{\text{წყ}} g V = 1000 \cdot 10 \cdot 50 \cdot 10^{-6} = 0{,}5\ \text{ნ}$
ჭიქის თეფშზე ძალა $0{,}5\ \text{ნ}$-ით გაიზრდება — საჭიროა $50\ \text{გ}$ საწონი.
SEN: $F_A = \rho_{\text{w}} g V = 1000 \cdot 10 \cdot 50 \cdot 10^{-6} = 0.5\ \text{N}$
The force on the glass's pan increases by $0.5\ \text{N}$ — add $50\ \text{g}$.
AKA: $50\ \text{გ}$
AEN: $50\ \text{g}$

--- hard archimedes olympiad
KA: ცილინდრულ ჭურჭელში ($S = 100\ \text{სმ}^2$) წყალზე ხის ნავი ცურავს, მასში $200\ \text{გ}$ ალუმინის ნაჭერია ($2{,}7\ \text{გ/სმ}^3$). ალუმინი წყალში გადააგდეს. რამდენით შეიცვლება წყლის დონე ჭურჭელში?
EN: In a cylindrical vessel ($S = 100\ \text{cm}^2$) a toy boat floats on water carrying a $200\ \text{g}$ piece of aluminium ($2.7\ \text{g/cm}^3$). The aluminium is dropped into the water. By how much does the water level change?
HKA: ნავში: გამოდევნილია $200\ \text{სმ}^3$; ფსკერზე: $\dfrac{200}{2{,}7}\ \text{სმ}^3$.
HEN: In the boat: $200\ \text{cm}^3$ displaced; on the bottom: $\dfrac{200}{2.7}\ \text{cm}^3$.
SKA: $\Delta V = 200 - \dfrac{200}{2{,}7} \approx 200 - 74 = 126\ \text{სმ}^3$
$\Delta h = \dfrac{126}{100} \approx 1{,}26\ \text{სმ}$ — დონე დაიწევს.
SEN: $\Delta V = 200 - \dfrac{200}{2.7} \approx 200 - 74 = 126\ \text{cm}^3$
$\Delta h = \dfrac{126}{100} \approx 1.26\ \text{cm}$ — the level falls.
AKA: დაიწევს $\approx 1{,}26\ \text{სმ}$-ით
AEN: it falls by $\approx 1.26\ \text{cm}$

--- hard archimedes olympiad
KA: ერთგვაროვანი ჯოხი, რომლის ერთ ბოლოზე ძაფია მიბმული, ნაწილობრივ წყალში ჩაშვებულია: ძაფი ვერტიკალურია, ჯოხი დახრილია და მისი ნახევარი წყალშია. იპოვეთ ჯოხის სიმკვრივე.
EN: A uniform rod hangs by a thread tied to its upper end, with its lower part in water: the thread is vertical, the rod is tilted and exactly half of it is submerged. Find the rod's density.
HKA: დაწერეთ მომენტების ტოლობა ძაფის მიმაგრების წერტილის მიმართ. სიმძიმის ძალა ჯოხის შუაზე მოდის, ამომგდები ძალა — ჩაძირული ნაწილის შუაზე.
HEN: Take moments about the thread's attachment point. Gravity acts at the rod's middle; the buoyant force acts at the middle of the submerged part.
SKA: ჯოხის სიგრძე $L$. სიმძიმის ძალის მხარი $\sim \dfrac{L}{2}$, ამომგდების — $\sim \dfrac{3L}{4}$ (ორივე ერთნაირი კოსინუსით).
$\rho g S L \cdot \dfrac{L}{2} = \rho_{\text{წყ}} g S \dfrac{L}{2} \cdot \dfrac{3L}{4}$
$\rho = \dfrac{3}{4} \rho_{\text{წყ}} = 750\ \text{კგ/მ}^3$
SEN: Let the rod have length $L$. Gravity's arm is $\sim \dfrac{L}{2}$, buoyancy's $\sim \dfrac{3L}{4}$ (with the same cosine factor).
$\rho g S L \cdot \dfrac{L}{2} = \rho_{\text{w}} g S \dfrac{L}{2} \cdot \dfrac{3L}{4}$
$\rho = \dfrac{3}{4} \rho_{\text{w}} = 750\ \text{kg/m}^3$
AKA: $750\ \text{კგ/მ}^3$
AEN: $750\ \text{kg/m}^3$

--- hard archimedes olympiad
KA: წყლიან ჭურჭელში ორი ერთნაირი მოცულობის ბურთი ერთმანეთზე ძაფით გადაბმული ცურავს: ზედა ($\rho_1 = 300\ \text{კგ/მ}^3$) ნახევრად წყალშია, ქვედა მთლიანად. იპოვეთ ქვედა ბურთის სიმკვრივე და ძაფის დაჭიმულობა, თუ $V = 1\ \text{ლ}$.
EN: Two balls of equal volume, tied together by a thread, float in water: the upper one ($\rho_1 = 300\ \text{kg/m}^3$) is half submerged, the lower one fully submerged. Find the lower ball's density and the thread tension if $V = 1\ \text{L}$.
HKA: მთელ სისტემაზე: ჯამური წონა = ჯამურ ამომგდებ ძალას. დაჭიმულობისთვის განიხილეთ მხოლოდ ზედა ბურთი.
HEN: For the whole system: total weight = total buoyant force. For the tension consider the upper ball alone.
SKA: $\rho_1 V + \rho_2 V = \rho_{\text{წყ}}\left(\dfrac{V}{2} + V\right)$
$\rho_2 = 1{,}5 \cdot 1000 - 300 = 1200\ \text{კგ/მ}^3$
ზედა ბურთი: $T = \rho_{\text{წყ}} g \dfrac{V}{2} - \rho_1 g V = 5 - 3 = 2\ \text{ნ}$
SEN: $\rho_1 V + \rho_2 V = \rho_{\text{w}}\left(\dfrac{V}{2} + V\right)$
$\rho_2 = 1.5 \cdot 1000 - 300 = 1200\ \text{kg/m}^3$
Upper ball: $T = \rho_{\text{w}} g \dfrac{V}{2} - \rho_1 g V = 5 - 3 = 2\ \text{N}$
AKA: $1200\ \text{კგ/მ}^3$; $2\ \text{ნ}$
AEN: $1200\ \text{kg/m}^3$; $2\ \text{N}$

--- easy machines
KA: ბერკეტის მხრებია $0{,}5\ \text{მ}$ და $1{,}5\ \text{მ}$. გრძელ მხარზე $40\ \text{ნ}$ ძალა მოქმედებს. რა ძალის გაწონასწორება შეუძლია მოკლე მხარზე?
EN: A lever has arms of $0.5\ \text{m}$ and $1.5\ \text{m}$. A force of $40\ \text{N}$ acts on the long arm. What force can it balance on the short arm?
HKA: $F_1 l_1 = F_2 l_2$.
HEN: $F_1 l_1 = F_2 l_2$.
SKA: $F_2 = \dfrac{40 \cdot 1{,}5}{0{,}5} = 120\ \text{ნ}$
SEN: $F_2 = \dfrac{40 \cdot 1.5}{0.5} = 120\ \text{N}$
AKA: $120\ \text{ნ}$
AEN: $120\ \text{N}$

--- easy machines
KA: უძრავი ჭოჭონაქით $20\ \text{კგ}$ ტვირთს წევენ. რა ძალაა საჭირო? რა სარგებელი აქვს უძრავ ჭოჭონაქს?
EN: A $20\ \text{kg}$ load is lifted with a fixed pulley. What force is needed? What is a fixed pulley good for?
HKA: უძრავი ჭოჭონაქი ძალაში მოგებას არ იძლევა.
HEN: A fixed pulley gives no gain in force.
SKA: $F = mg = 200\ \text{ნ}$
უძრავი ჭოჭონაქი მხოლოდ ძალის მიმართულებას ცვლის — ტვირთის აწევა ქვემოთ ქაჩვით შეიძლება.
SEN: $F = mg = 200\ \text{N}$
A fixed pulley only changes the direction of the force — you can lift by pulling down.
AKA: $200\ \text{ნ}$; ცვლის ძალის მიმართულებას
AEN: $200\ \text{N}$; it changes the direction of the force

--- easy machines
KA: ჩამოთვალეთ ბერკეტის სამი მაგალითი ყოველდღიური ცხოვრებიდან.
EN: Give three examples of levers from everyday life.
HKA: იფიქრეთ ხელსაწყოებზე, რომლებსაც საყრდენი წერტილი აქვს.
HEN: Think of tools that turn about a pivot.
SKA: მაკრატელი, ქანქარა (საქანელა), ურიკა, ფრჩხილის საძრობი, ნიჩაბი, კარის სახელური.
SEN: Scissors, a see-saw, a wheelbarrow, a claw hammer pulling a nail, an oar, a door handle.
AKA: მაკრატელი, საქანელა, ურიკა
AEN: scissors, a see-saw, a wheelbarrow

--- easy machines
KA: მოძრავი ჭოჭონაქით $600\ \text{ნ}$ წონის ტვირთს წევენ $2\ \text{მ}$ სიმაღლეზე. რა ძალაა საჭირო და რა სიგრძის თოკი უნდა გამოიწიონ? (ხახუნი და ჭოჭონაქის მასა უგულებელყავით)
EN: A $600\ \text{N}$ load is raised $2\ \text{m}$ with a movable pulley. What force is needed and how much rope must be pulled? (Ignore friction and the pulley's mass.)
HKA: მოძრავი ჭოჭონაქი ძალაში $2$-ჯერ იგებს, მანძილში — $2$-ჯერ კარგავს.
HEN: A movable pulley halves the force and doubles the distance.
SKA: $F = \dfrac{600}{2} = 300\ \text{ნ}$
$l = 2 \cdot 2 = 4\ \text{მ}$
SEN: $F = \dfrac{600}{2} = 300\ \text{N}$
$l = 2 \cdot 2 = 4\ \text{m}$
AKA: $300\ \text{ნ}$; $4\ \text{მ}$
AEN: $300\ \text{N}$; $4\ \text{m}$

--- medium machines
KA: $1{,}2\ \text{მ}$ სიგრძის ბერკეტის ბოლოებზე $4\ \text{კგ}$ და $2\ \text{კგ}$ ტვირთებია. სად უნდა იყოს საყრდენი, რომ ბერკეტი წონასწორობაში იყოს? (ბერკეტის მასა უგულებელყავით)
EN: Loads of $4\ \text{kg}$ and $2\ \text{kg}$ hang at the ends of a $1.2\ \text{m}$ lever. Where must the pivot be for balance? (Ignore the lever's mass.)
HKA: $m_1 x = m_2 (1{,}2 - x)$.
HEN: $m_1 x = m_2 (1.2 - x)$.
SKA: $4x = 2(1{,}2 - x) \Rightarrow 6x = 2{,}4 \Rightarrow x = 0{,}4\ \text{მ}$
საყრდენი $4\ \text{კგ}$-იანი ტვირთიდან $0{,}4\ \text{მ}$-ზეა.
SEN: $4x = 2(1.2 - x) \Rightarrow 6x = 2.4 \Rightarrow x = 0.4\ \text{m}$
The pivot is $0.4\ \text{m}$ from the $4\ \text{kg}$ load.
AKA: $4\ \text{კგ}$-იანიდან $0{,}4\ \text{მ}$-ზე
AEN: $0.4\ \text{m}$ from the $4\ \text{kg}$ load

--- medium machines
KA: დახრილი სიბრტყის სიგრძეა $3\ \text{მ}$, სიმაღლე — $0{,}6\ \text{მ}$. ხახუნის გარეშე რა ძალით უნდა ავწიოთ $50\ \text{კგ}$ ყუთი?
EN: An inclined plane is $3\ \text{m}$ long and $0.6\ \text{m}$ high. Without friction, what force pushes a $50\ \text{kg}$ box up it?
HKA: მუშაობის ოქროს წესი: $F l = m g h$.
HEN: Golden rule of mechanics: $F l = m g h$.
SKA: $F = \dfrac{500 \cdot 0{,}6}{3} = 100\ \text{ნ}$
SEN: $F = \dfrac{500 \cdot 0.6}{3} = 100\ \text{N}$
AKA: $100\ \text{ნ}$
AEN: $100\ \text{N}$

--- medium machines
KA: დახრილ სიბრტყეზე ($l = 4\ \text{მ}$, $h = 1\ \text{მ}$) $80\ \text{კგ}$ ტვირთი $250\ \text{ნ}$ ძალით აიტანეს. იპოვეთ მქკ.
EN: An $80\ \text{kg}$ load is pushed up an incline ($l = 4\ \text{m}$, $h = 1\ \text{m}$) with $250\ \text{N}$. Find the efficiency.
HKA: $\eta = \dfrac{m g h}{F l}$.
HEN: $\eta = \dfrac{m g h}{F l}$.
SKA: სასარგებლო: $800 \cdot 1 = 800\ \text{ჯ}$; სრული: $250 \cdot 4 = 1000\ \text{ჯ}$
$\eta = 0{,}8 = 80\%$
SEN: Useful: $800 \cdot 1 = 800\ \text{J}$; total: $250 \cdot 4 = 1000\ \text{J}$
$\eta = 0.8 = 80\%$
AKA: $80\%$
AEN: $80\%$

--- medium machines
KA: ფოლადის ძელი ($2\ \text{მ}$, $10\ \text{კგ}$) ერთი ბოლოთი მიწაზე დევს. რა ვერტიკალური ძალაა საჭირო მეორე ბოლოს ასაწევად?
EN: A uniform $2\ \text{m}$ steel bar of mass $10\ \text{kg}$ lies on the ground. What vertical force is needed to lift one end?
HKA: საყრდენი — მიწაზე დარჩენილი ბოლო; სიმძიმის ძალა შუაზე მოდის.
HEN: The pivot is the end still on the ground; gravity acts at the middle.
SKA: $F \cdot 2 = 100 \cdot 1 \Rightarrow F = 50\ \text{ნ}$
SEN: $F \cdot 2 = 100 \cdot 1 \Rightarrow F = 50\ \text{N}$
AKA: $50\ \text{ნ}$
AEN: $50\ \text{N}$

--- medium machines
KA: საქანელაზე ($4\ \text{მ}$, საყრდენი შუაში) ერთ ბოლოში $30\ \text{კგ}$ ბავშვი ზის. სად უნდა დაჯდეს $40\ \text{კგ}$ ბავშვი?
EN: On a $4\ \text{m}$ see-saw pivoted in the middle, a $30\ \text{kg}$ child sits at one end. Where must a $40\ \text{kg}$ child sit?
HKA: $m_1 l_1 = m_2 l_2$, $l_1 = 2\ \text{მ}$.
HEN: $m_1 l_1 = m_2 l_2$, $l_1 = 2\ \text{m}$.
SKA: $l_2 = \dfrac{30 \cdot 2}{40} = 1{,}5\ \text{მ}$ საყრდენიდან (მეორე მხარეს)
SEN: $l_2 = \dfrac{30 \cdot 2}{40} = 1.5\ \text{m}$ from the pivot (on the other side)
AKA: საყრდენიდან $1{,}5\ \text{მ}$-ზე
AEN: $1.5\ \text{m}$ from the pivot

--- medium machines
KA: ჭოჭონაქთა სისტემა ერთი უძრავი და ორი მოძრავი ჭოჭონაქისგან შედგება — ძალაში მოგება $4$-ჯერადია. რა ძალით უნდა გამოვწიოთ თოკი $1\ \text{ტ}$ ტვირთის ასაწევად? რამდენი მეტრი თოკი უნდა გამოვწიოთ ტვირთის $1\ \text{მ}$-ით ასაწევად?
EN: A pulley system with one fixed and two movable pulleys gives a $4$-fold force gain. What pull lifts a $1\ \text{t}$ load? How much rope must be pulled to raise it $1\ \text{m}$?
HKA: ძალაში რამდენჯერაც ვიგებთ, მანძილში იმდენჯერვე ვკარგავთ.
HEN: Whatever you gain in force you lose in distance.
SKA: $F = \dfrac{10\,000}{4} = 2500\ \text{ნ}$
$l = 4 \cdot 1 = 4\ \text{მ}$
SEN: $F = \dfrac{10\,000}{4} = 2500\ \text{N}$
$l = 4 \cdot 1 = 4\ \text{m}$
AKA: $2500\ \text{ნ}$; $4\ \text{მ}$
AEN: $2500\ \text{N}$; $4\ \text{m}$

--- hard machines
KA: ერთგვაროვანი ძელი ($3\ \text{მ}$, $30\ \text{კგ}$) ორ საყრდენზე დევს — ბოლოებში. ძელზე, მარცხენა ბოლოდან $1\ \text{მ}$-ზე, $60\ \text{კგ}$ ადამიანი დგას. იპოვეთ საყრდენების რეაქციის ძალები.
EN: A uniform beam ($3\ \text{m}$, $30\ \text{kg}$) rests on supports at its ends. A $60\ \text{kg}$ person stands $1\ \text{m}$ from the left end. Find the support forces.
HKA: მომენტები მარცხენა საყრდენის მიმართ, შემდეგ ძალათა ჯამი.
HEN: Take moments about the left support, then use the sum of forces.
SKA: $N_2 \cdot 3 = 300 \cdot 1{,}5 + 600 \cdot 1 = 1050 \Rightarrow N_2 = 350\ \text{ნ}$
$N_1 = 900 - 350 = 550\ \text{ნ}$
SEN: $N_2 \cdot 3 = 300 \cdot 1.5 + 600 \cdot 1 = 1050 \Rightarrow N_2 = 350\ \text{N}$
$N_1 = 900 - 350 = 550\ \text{N}$
AKA: მარცხენა $550\ \text{ნ}$, მარჯვენა $350\ \text{ნ}$
AEN: left $550\ \text{N}$, right $350\ \text{N}$

--- hard machines
KA: მოძრავი ჭოჭონაქის მასაა $2\ \text{კგ}$. მისით $48\ \text{კგ}$ ტვირთი $3\ \text{მ}$-ზე აიწიეს. იპოვეთ საჭირო ძალა (ხახუნის გარეშე) და მქკ.
EN: A movable pulley has mass $2\ \text{kg}$. It is used to raise a $48\ \text{kg}$ load by $3\ \text{m}$. Find the force needed (no friction) and the efficiency.
HKA: ჭოჭონაქიც აიწევა — მისი წონაც თოკზე ნაწილდება.
HEN: The pulley is lifted too — its weight is shared by the rope.
SKA: $F = \dfrac{(48 + 2) \cdot 10}{2} = 250\ \text{ნ}$
$\eta = \dfrac{480 \cdot 3}{250 \cdot 6} = \dfrac{1440}{1500} = 0{,}96 = 96\%$
SEN: $F = \dfrac{(48 + 2) \cdot 10}{2} = 250\ \text{N}$
$\eta = \dfrac{480 \cdot 3}{250 \cdot 6} = \dfrac{1440}{1500} = 0.96 = 96\%$
AKA: $250\ \text{ნ}$; $96\%$
AEN: $250\ \text{N}$; $96\%$

--- hard machines olympiad
KA: ერთგვაროვანი ფიცარი ($6\ \text{მ}$, $40\ \text{კგ}$) ორ საყრდენზე დევს, რომლებიც ბოლოებიდან $1\ \text{მ}$-ზეა. რა უდიდესი მასის ადამიანს შეუძლია ფიცრის ბოლომდე მისვლა ისე, რომ ფიცარი არ გადაბრუნდეს?
EN: A uniform plank ($6\ \text{m}$, $40\ \text{kg}$) rests on two supports, each $1\ \text{m}$ from an end. What is the heaviest person who can walk to the very end without the plank tipping?
HKA: ბოლოში დგომისას ფიცარი ახლო საყრდენის გარშემო გადაბრუნდება; ზღვრულ შემთხვევაში შორი საყრდენის რეაქცია ნულია.
HEN: With the person at the end, the plank tips about the near support; at the limit the far support's force is zero.
SKA: ფიცრის შუა საყრდენიდან $2\ \text{მ}$-ზეა, ბოლო — $1\ \text{მ}$-ზე.
$m g \cdot 1 = M g \cdot 2 \Rightarrow m = 2M = 80\ \text{კგ}$
SEN: The plank's middle is $2\ \text{m}$ from the support, the end $1\ \text{m}$.
$m g \cdot 1 = M g \cdot 2 \Rightarrow m = 2M = 80\ \text{kg}$
AKA: $80\ \text{კგ}$
AEN: $80\ \text{kg}$

--- hard machines olympiad
KA: ბერკეტიანი სასწორის მხრები ტოლი არ არის. სხეული მარცხენა თეფშზე $m_1 = 0{,}9\ \text{კგ}$-ით, მარჯვენაზე $m_2 = 1{,}6\ \text{კგ}$-ით წონასწორდება. იპოვეთ სხეულის ნამდვილი მასა და მხრების შეფარდება.
EN: A balance has unequal arms. A body is balanced by $m_1 = 0.9\ \text{kg}$ when on the left pan and by $m_2 = 1.6\ \text{kg}$ when on the right. Find its true mass and the ratio of the arms.
HKA: $m l_1 = m_1 l_2$, $\ m_2 l_1 = m l_2$ — გადაამრავლეთ.
HEN: $m l_1 = m_1 l_2$, $\ m_2 l_1 = m l_2$ — multiply them.
SKA: $m^2 = m_1 m_2 \Rightarrow m = \sqrt{0{,}9 \cdot 1{,}6} = \sqrt{1{,}44} = 1{,}2\ \text{კგ}$
$\dfrac{l_1}{l_2} = \dfrac{m_1}{m} = \dfrac{0{,}9}{1{,}2} = 0{,}75$
SEN: $m^2 = m_1 m_2 \Rightarrow m = \sqrt{0.9 \cdot 1.6} = \sqrt{1.44} = 1.2\ \text{kg}$
$\dfrac{l_1}{l_2} = \dfrac{m_1}{m} = \dfrac{0.9}{1.2} = 0.75$
AKA: $1{,}2\ \text{კგ}$; $l_1 : l_2 = 3 : 4$
AEN: $1.2\ \text{kg}$; $l_1 : l_2 = 3 : 4$

--- hard machines olympiad
KA: ადამიანი ($70\ \text{კგ}$) დგას პლატფორმაზე ($30\ \text{კგ}$), რომელიც უძრავ ჭოჭონაქზე გადადებულ თოკზეა ჩამოკიდებული; თოკის მეორე ბოლოს თავად ადამიანი ქაჩავს. რა ძალით უნდა ქაჩოს, რომ თავის თავი პლატფორმასთან ერთად თანაბრად აიწიოს?
EN: A $70\ \text{kg}$ person stands on a $30\ \text{kg}$ platform hanging from a rope over a fixed pulley; the person pulls the other end of the rope. With what force must they pull to raise themselves and the platform uniformly?
HKA: სისტემას „ადამიანი + პლატფორმა“ ზემოთ ორი თოკის მონაკვეთი უჭირავს.
HEN: The system "person + platform" is held up by two rope segments.
SKA: თოკის ორივე მონაკვეთი $T$ ძალით ზემოთ ეწევა სისტემას: $2T = (70 + 30) \cdot 10$
$T = 500\ \text{ნ}$
SEN: Both rope segments pull the system up with $T$: $2T = (70 + 30) \cdot 10$
$T = 500\ \text{N}$
AKA: $500\ \text{ნ}$
AEN: $500\ \text{N}$

--- hard machines olympiad
KA: ჯოხის ($1\ \text{მ}$) ერთ ბოლოზე $1\ \text{კგ}$ ტვირთია. ჯოხი საყრდენზე წონასწორობაშია, როცა საყრდენი ამ ბოლოდან $20\ \text{სმ}$-შია. იპოვეთ ჯოხის მასა (ჯოხი ერთგვაროვანია).
EN: A uniform $1\ \text{m}$ rod has a $1\ \text{kg}$ load on one end. It balances on a pivot $20\ \text{cm}$ from that end. Find the rod's mass.
HKA: ჯოხის სიმძიმის ძალა შუაზე მოდის — საყრდენიდან $30\ \text{სმ}$-ზე.
HEN: The rod's weight acts at its middle — $30\ \text{cm}$ from the pivot.
SKA: $1 \cdot 20 = M \cdot 30 \Rightarrow M = \dfrac{2}{3}\ \text{კგ} \approx 0{,}67\ \text{კგ}$
SEN: $1 \cdot 20 = M \cdot 30 \Rightarrow M = \dfrac{2}{3}\ \text{kg} \approx 0.67\ \text{kg}$
AKA: $\approx 0{,}67\ \text{კგ}$
AEN: $\approx 0.67\ \text{kg}$

--- hard pressure
KA: მართკუთხა ძელი $a \times b \times c$ ზომისაა ($a > b > c$). ერთ წახნაგზე დადებისას ის $1\ \text{კპა}$ წნევას ახდენს, მეორეზე — $2\ \text{კპა}$-ს, მესამეზე — $4\ \text{კპა}$-ს. ძელის სიმკვრივეა $2000\ \text{კგ/მ}^3$. იპოვეთ მისი ზომები.
EN: A rectangular block measures $a \times b \times c$ ($a > b > c$). Resting on its three different faces it exerts $1\ \text{kPa}$, $2\ \text{kPa}$ and $4\ \text{kPa}$. Its density is $2000\ \text{kg/m}^3$. Find its dimensions.
HKA: ყოველ შემთხვევაში $p = \rho g h$, სადაც $h$ — ვერტიკალური ზომა.
HEN: In each case $p = \rho g h$, where $h$ is the vertical dimension.
SKA: $\rho g = 20\,000\ \text{პა/მ}$
$c = \dfrac{1000}{20\,000} = 0{,}05\ \text{მ}$, $\ b = \dfrac{2000}{20\,000} = 0{,}1\ \text{მ}$, $\ a = \dfrac{4000}{20\,000} = 0{,}2\ \text{მ}$
SEN: $\rho g = 20\,000\ \text{Pa/m}$
$c = \dfrac{1000}{20\,000} = 0.05\ \text{m}$, $\ b = \dfrac{2000}{20\,000} = 0.1\ \text{m}$, $\ a = \dfrac{4000}{20\,000} = 0.2\ \text{m}$
AKA: $20 \times 10 \times 5\ \text{სმ}$
AEN: $20 \times 10 \times 5\ \text{cm}$
