KA: გადაიყვანეთ $\text{კგ/მ}^3$-ში: $1\ \text{გ/სმ}^3$; $7{,}8\ \text{გ/სმ}^3$; $0{,}8\ \text{გ/სმ}^3$.
EN: Convert to $\text{kg/m}^3$: $1\ \text{g/cm}^3$; $7.8\ \text{g/cm}^3$; $0.8\ \text{g/cm}^3$.
HKA: $1\ \text{გ/სმ}^3 = 1000\ \text{კგ/მ}^3$.
HEN: $1\ \text{g/cm}^3 = 1000\ \text{kg/m}^3$.
SKA: $1\ \text{გ/სმ}^3 = \dfrac{0{,}001\ \text{კგ}}{10^{-6}\ \text{მ}^3} = 1000\ \text{კგ/მ}^3$
$7{,}8 \to 7800\ \text{კგ/მ}^3$; $\ 0{,}8 \to 800\ \text{კგ/მ}^3$
SEN: $1\ \text{g/cm}^3 = \dfrac{0.001\ \text{kg}}{10^{-6}\ \text{m}^3} = 1000\ \text{kg/m}^3$
$7.8 \to 7800\ \text{kg/m}^3$; $\ 0.8 \to 800\ \text{kg/m}^3$
AKA: $1000$; $7800$; $800\ \text{კგ/მ}^3$
AEN: $1000$; $7800$; $800\ \text{kg/m}^3$

--- easy density
KA: რა მასისაა $0{,}5\ \text{მ}^3$ ბეტონის ფილა? ($\rho = 2200\ \text{კგ/მ}^3$)
EN: What is the mass of a $0.5\ \text{m}^3$ concrete slab? ($\rho = 2200\ \text{kg/m}^3$)
HKA: $m = \rho V$.
HEN: $m = \rho V$.
SKA: $m = 2200 \cdot 0{,}5 = 1100\ \text{კგ}$
SEN: $m = 2200 \cdot 0.5 = 1100\ \text{kg}$
AKA: $1100\ \text{კგ}$
AEN: $1100\ \text{kg}$

--- easy density
KA: რა მოცულობას იკავებს $400\ \text{გ}$ ნავთი? ($\rho = 0{,}8\ \text{გ/სმ}^3$)
EN: What volume does $400\ \text{g}$ of kerosene occupy? ($\rho = 0.8\ \text{g/cm}^3$)
HKA: $V = \dfrac{m}{\rho}$.
HEN: $V = \dfrac{m}{\rho}$.
SKA: $V = \dfrac{400}{0{,}8} = 500\ \text{სმ}^3 = 0{,}5\ \text{ლ}$
SEN: $V = \dfrac{400}{0.8} = 500\ \text{cm}^3 = 0.5\ \text{L}$
AKA: $500\ \text{სმ}^3$
AEN: $500\ \text{cm}^3$

--- easy density
KA: ერთნაირი მოცულობის ორი კუბიდან — ხის და რკინის — რომლის მასაა მეტი და რამდენჯერ? ($\rho_{\text{ხე}} = 600$, $\rho_{\text{რკ}} = 7800\ \text{კგ/მ}^3$)
EN: Of two cubes of equal volume, one wooden and one iron, which has the larger mass, and how many times larger? ($\rho_{\text{wood}} = 600$, $\rho_{\text{iron}} = 7800\ \text{kg/m}^3$)
HKA: ტოლი მოცულობისას მასები სიმკვრივეების პროპორციულია.
HEN: For equal volumes the masses are in the ratio of the densities.
SKA: $\dfrac{m_{\text{რკ}}}{m_{\text{ხე}}} = \dfrac{7800}{600} = 13$
SEN: $\dfrac{m_{\text{iron}}}{m_{\text{wood}}} = \dfrac{7800}{600} = 13$
AKA: რკინის, $13$-ჯერ
AEN: the iron one, $13$ times

--- easy density
KA: ოთახის ზომებია $6\ \text{მ} \times 5\ \text{მ} \times 3\ \text{მ}$. რას უდრის ჰაერის მასა ოთახში? ($\rho_{\text{ჰ}} = 1{,}29\ \text{კგ/მ}^3$)
EN: A room measures $6\ \text{m} \times 5\ \text{m} \times 3\ \text{m}$. What is the mass of the air in it? ($\rho_{\text{air}} = 1.29\ \text{kg/m}^3$)
HKA: ჯერ იპოვეთ ოთახის მოცულობა.
HEN: Find the room's volume first.
SKA: $V = 6 \cdot 5 \cdot 3 = 90\ \text{მ}^3$
$m = 1{,}29 \cdot 90 \approx 116\ \text{კგ}$
SEN: $V = 6 \cdot 5 \cdot 3 = 90\ \text{m}^3$
$m = 1.29 \cdot 90 \approx 116\ \text{kg}$
AKA: $\approx 116\ \text{კგ}$
AEN: $\approx 116\ \text{kg}$

--- easy density
KA: ბოთლში $0{,}5\ \text{ლ}$ ზეთი ჩადის. რამდენი გრამია ის? ($\rho_{\text{ზ}} = 900\ \text{კგ/მ}^3$)
EN: A bottle holds $0.5\ \text{L}$ of oil. How many grams is that? ($\rho_{\text{oil}} = 900\ \text{kg/m}^3$)
HKA: $900\ \text{კგ/მ}^3 = 0{,}9\ \text{გ/სმ}^3$, $0{,}5\ \text{ლ} = 500\ \text{სმ}^3$.
HEN: $900\ \text{kg/m}^3 = 0.9\ \text{g/cm}^3$, $0.5\ \text{L} = 500\ \text{cm}^3$.
SKA: $m = 0{,}9 \cdot 500 = 450\ \text{გ}$
SEN: $m = 0.9 \cdot 500 = 450\ \text{g}$
AKA: $450\ \text{გ}$
AEN: $450\ \text{g}$

--- easy density
KA: $1\ \text{კგ}$ ტყვია და $1\ \text{კგ}$ ბამბა. რომელი უფრო მძიმეა? რომელს უკავია მეტი მოცულობა?
EN: $1\ \text{kg}$ of lead and $1\ \text{kg}$ of cotton wool. Which is heavier? Which takes up more volume?
HKA: მასები ტოლია; მოცულობა სიმკვრივის უკუპროპორციულია.
HEN: The masses are equal; volume is inversely proportional to density.
SKA: ორივე ერთნაირად მძიმეა — მასა ერთია, $1\ \text{კგ}$.
ბამბის სიმკვრივე ბევრად ნაკლებია, ამიტომ $V = \dfrac{m}{\rho}$ მისთვის ბევრად მეტია.
SEN: They are equally heavy — both are $1\ \text{kg}$.
Cotton wool is much less dense, so $V = \dfrac{m}{\rho}$ is much larger for it.
AKA: ტოლი წონა; ბამბას — მეტი მოცულობა
AEN: equal weight; the cotton takes more volume

--- medium density
KA: ჭიქის მასა $120\ \text{გ}$-ია, წყლით სავსე ჭიქისა — $370\ \text{გ}$. რა მასის იქნება ჭიქა რძით სავსე? ($\rho_{\text{რძე}} = 1030\ \text{კგ/მ}^3$)
EN: An empty glass has mass $120\ \text{g}$; filled with water it is $370\ \text{g}$. What will it weigh filled with milk? ($\rho_{\text{milk}} = 1030\ \text{kg/m}^3$)
HKA: წყლის მასიდან იპოვეთ ჭიქის მოცულობა.
HEN: Find the glass's volume from the mass of the water.
SKA: $V = \dfrac{370 - 120}{1} = 250\ \text{სმ}^3$
$m_{\text{რძე}} = 1{,}03 \cdot 250 = 257{,}5\ \text{გ}$
$M = 120 + 257{,}5 = 377{,}5\ \text{გ}$
SEN: $V = \dfrac{370 - 120}{1} = 250\ \text{cm}^3$
$m_{\text{milk}} = 1.03 \cdot 250 = 257.5\ \text{g}$
$M = 120 + 257.5 = 377.5\ \text{g}$
AKA: $377{,}5\ \text{გ}$
AEN: $377.5\ \text{g}$

--- medium density
KA: სპილენძის მავთულის მასა $890\ \text{გ}$-ია, განივკვეთის ფართობი — $1\ \text{მმ}^2$. იპოვეთ მავთულის სიგრძე. ($\rho = 8900\ \text{კგ/მ}^3$)
EN: A copper wire has mass $890\ \text{g}$ and cross-section $1\ \text{mm}^2$. Find its length. ($\rho = 8900\ \text{kg/m}^3$)
HKA: $V = \dfrac{m}{\rho}$, $\ l = \dfrac{V}{S}$.
HEN: $V = \dfrac{m}{\rho}$, $\ l = \dfrac{V}{S}$.
SKA: $V = \dfrac{0{,}89}{8900} = 10^{-4}\ \text{მ}^3$
$l = \dfrac{10^{-4}}{10^{-6}} = 100\ \text{მ}$
SEN: $V = \dfrac{0.89}{8900} = 10^{-4}\ \text{m}^3$
$l = \dfrac{10^{-4}}{10^{-6}} = 100\ \text{m}$
AKA: $100\ \text{მ}$
AEN: $100\ \text{m}$

--- medium density
KA: რკინის ფურცლის ზომებია $1\ \text{მ} \times 0{,}5\ \text{მ}$, მასა — $19{,}5\ \text{კგ}$. იპოვეთ მისი სისქე. ($\rho = 7800\ \text{კგ/მ}^3$)
EN: An iron sheet measures $1\ \text{m} \times 0.5\ \text{m}$ and has mass $19.5\ \text{kg}$. Find its thickness. ($\rho = 7800\ \text{kg/m}^3$)
HKA: $V = \dfrac{m}{\rho} = a b d$.
HEN: $V = \dfrac{m}{\rho} = a b d$.
SKA: $V = \dfrac{19{,}5}{7800} = 0{,}0025\ \text{მ}^3$
$d = \dfrac{0{,}0025}{0{,}5} = 0{,}005\ \text{მ} = 5\ \text{მმ}$
SEN: $V = \dfrac{19.5}{7800} = 0.0025\ \text{m}^3$
$d = \dfrac{0.0025}{0.5} = 0.005\ \text{m} = 5\ \text{mm}$
AKA: $5\ \text{მმ}$
AEN: $5\ \text{mm}$

--- medium density
KA: სატვირთო ცისტერნაში $40\ \text{მ}^3$ ბენზინი ჩადის. რამდენი ცისტერნაა საჭირო $800\ \text{ტ}$ ბენზინის გადასატანად? ($\rho = 710\ \text{კგ/მ}^3$)
EN: A tank car holds $40\ \text{m}^3$ of petrol. How many tank cars are needed to carry $800\ \text{t}$ of petrol? ($\rho = 710\ \text{kg/m}^3$)
HKA: იპოვეთ ერთ ცისტერნაში მოთავსებული ბენზინის მასა.
HEN: Find the mass of petrol in one tank car.
SKA: $m_1 = 710 \cdot 40 = 28\,400\ \text{კგ} = 28{,}4\ \text{ტ}$
$n = \dfrac{800}{28{,}4} \approx 28{,}2$ — საჭიროა $29$ ცისტერნა.
SEN: $m_1 = 710 \cdot 40 = 28\,400\ \text{kg} = 28.4\ \text{t}$
$n = \dfrac{800}{28.4} \approx 28.2$ — $29$ tank cars are needed.
AKA: $29$
AEN: $29$

--- medium density
KA: ყინულის ნაჭერი ($900\ \text{სმ}^3$) დადნა. რამდენი სმ$^3$ წყალი მივიღეთ? ($\rho_{\text{ყ}} = 0{,}9\ \text{გ/სმ}^3$)
EN: A $900\ \text{cm}^3$ piece of ice melts. How many cm$^3$ of water does it give? ($\rho_{\text{ice}} = 0.9\ \text{g/cm}^3$)
HKA: დნობისას მასა არ იცვლება.
HEN: Mass does not change on melting.
SKA: $m = 0{,}9 \cdot 900 = 810\ \text{გ}$
$V_{\text{წყ}} = \dfrac{810}{1} = 810\ \text{სმ}^3$
SEN: $m = 0.9 \cdot 900 = 810\ \text{g}$
$V_{\text{w}} = \dfrac{810}{1} = 810\ \text{cm}^3$
AKA: $810\ \text{სმ}^3$
AEN: $810\ \text{cm}^3$

--- medium density
KA: მოცულობის რა ნაწილით იცვლება წყალი გაყინვისას? რატომ სკდება ზამთარში წყლით სავსე მილები?
EN: By what fraction does the volume change when water freezes? Why do water pipes burst in winter?
HKA: შეადარეთ $1\ \text{გ}$ წყლისა და $1\ \text{გ}$ ყინულის მოცულობა ($\rho_{\text{ყ}} = 0{,}9\ \text{გ/სმ}^3$).
HEN: Compare the volume of $1\ \text{g}$ of water and $1\ \text{g}$ of ice ($\rho_{\text{ice}} = 0.9\ \text{g/cm}^3$).
SKA: $1\ \text{გ}$ წყალი: $1\ \text{სმ}^3$; $1\ \text{გ}$ ყინული: $\dfrac{1}{0{,}9} \approx 1{,}11\ \text{სმ}^3$.
გაყინვისას მოცულობა არ მცირდება, არამედ **იზრდება** დაახლოებით $11\%$-ით — ყინული მილს შიგნიდან აწვება და ხეთქავს.
SEN: $1\ \text{g}$ of water: $1\ \text{cm}^3$; $1\ \text{g}$ of ice: $\dfrac{1}{0.9} \approx 1.11\ \text{cm}^3$.
On freezing the volume doesn't shrink — it **grows** by about $11\%$; the ice pushes on the pipe from inside and bursts it.
AKA: იზრდება $\approx 11\%$-ით
AEN: it increases by $\approx 11\%$

--- medium density
KA: შენადნობი შეიცავს $200\ \text{გ}$ სპილენძს ($8{,}9\ \text{გ/სმ}^3$) და $73\ \text{გ}$ კალას ($7{,}3\ \text{გ/სმ}^3$). იპოვეთ შენადნობის სიმკვრივე (მოცულობა არ იცვლება).
EN: An alloy contains $200\ \text{g}$ of copper ($8.9\ \text{g/cm}^3$) and $73\ \text{g}$ of tin ($7.3\ \text{g/cm}^3$). Find the alloy's density (volumes simply add).
HKA: $\rho = \dfrac{m_1 + m_2}{V_1 + V_2}$.
HEN: $\rho = \dfrac{m_1 + m_2}{V_1 + V_2}$.
SKA: $V_1 = \dfrac{200}{8{,}9} \approx 22{,}5\ \text{სმ}^3$, $\ V_2 = \dfrac{73}{7{,}3} = 10\ \text{სმ}^3$
$\rho = \dfrac{273}{32{,}5} \approx 8{,}4\ \text{გ/სმ}^3$
SEN: $V_1 = \dfrac{200}{8.9} \approx 22.5\ \text{cm}^3$, $\ V_2 = \dfrac{73}{7.3} = 10\ \text{cm}^3$
$\rho = \dfrac{273}{32.5} \approx 8.4\ \text{g/cm}^3$
AKA: $\approx 8{,}4\ \text{გ/სმ}^3$
AEN: $\approx 8.4\ \text{g/cm}^3$

--- medium density
KA: მართკუთხა ფიცრის ზომებია $2\ \text{მ} \times 0{,}2\ \text{მ} \times 0{,}05\ \text{მ}$, მასა — $10\ \text{კგ}$. რა ხისგან შეიძლება იყოს? (ფიჭვი $500$, მუხა $700$, ნაძვი $450\ \text{კგ/მ}^3$)
EN: A plank measures $2\ \text{m} \times 0.2\ \text{m} \times 0.05\ \text{m}$ and has mass $10\ \text{kg}$. What wood could it be? (pine $500$, oak $700$, spruce $450\ \text{kg/m}^3$)
HKA: $\rho = \dfrac{m}{abc}$.
HEN: $\rho = \dfrac{m}{abc}$.
SKA: $V = 2 \cdot 0{,}2 \cdot 0{,}05 = 0{,}02\ \text{მ}^3$
$\rho = \dfrac{10}{0{,}02} = 500\ \text{კგ/მ}^3$ — ფიჭვი.
SEN: $V = 2 \cdot 0.2 \cdot 0.05 = 0.02\ \text{m}^3$
$\rho = \dfrac{10}{0.02} = 500\ \text{kg/m}^3$ — pine.
AKA: ფიჭვი ($500\ \text{კგ/მ}^3$)
AEN: pine ($500\ \text{kg/m}^3$)

--- medium density
KA: მენზურაში $60\ \text{მლ}$ წყალია. მასში $10$ ერთნაირი ფოლადის ბურთულა ჩაყარეს და დონე $76\ \text{მლ}$-მდე ავიდა. ბურთულების მასაა $124{,}8\ \text{გ}$. იპოვეთ ფოლადის სიმკვრივე და ერთი ბურთულის მასა.
EN: A measuring cylinder holds $60\ \text{mL}$ of water. $10$ identical steel balls are dropped in and the level rises to $76\ \text{mL}$. The balls have a total mass of $124.8\ \text{g}$. Find the density of steel and the mass of one ball.
HKA: დონის აწევა ბურთულების ჯამური მოცულობაა.
HEN: The rise in level is the total volume of the balls.
SKA: $V = 76 - 60 = 16\ \text{სმ}^3$
$\rho = \dfrac{124{,}8}{16} = 7{,}8\ \text{გ/სმ}^3$
$m_1 = \dfrac{124{,}8}{10} \approx 12{,}5\ \text{გ}$
SEN: $V = 76 - 60 = 16\ \text{cm}^3$
$\rho = \dfrac{124.8}{16} = 7.8\ \text{g/cm}^3$
$m_1 = \dfrac{124.8}{10} \approx 12.5\ \text{g}$
AKA: $7{,}8\ \text{გ/სმ}^3$; $\approx 12{,}5\ \text{გ}$
AEN: $7.8\ \text{g/cm}^3$; $\approx 12.5\ \text{g}$

--- medium density
KA: ორი ბურთი ერთნაირი მასისაა: ერთი ალუმინის ($2{,}7\ \text{გ/სმ}^3$), მეორე — ტყვიის ($11{,}3\ \text{გ/სმ}^3$). რომლის მოცულობაა მეტი და რამდენჯერ?
EN: Two balls have the same mass: one aluminium ($2.7\ \text{g/cm}^3$), the other lead ($11.3\ \text{g/cm}^3$). Which has the larger volume and by how many times?
HKA: ტოლი მასისას მოცულობები სიმკვრივეების უკუპროპორციულია.
HEN: For equal masses the volumes are inversely proportional to the densities.
SKA: $\dfrac{V_{\text{ალ}}}{V_{\text{ტყ}}} = \dfrac{11{,}3}{2{,}7} \approx 4{,}2$
SEN: $\dfrac{V_{\text{Al}}}{V_{\text{Pb}}} = \dfrac{11.3}{2.7} \approx 4.2$
AKA: ალუმინისას, $\approx 4{,}2$-ჯერ
AEN: the aluminium one, $\approx 4.2$ times

--- medium density
KA: აგურის ზომებია $25\ \text{სმ} \times 12\ \text{სმ} \times 6{,}5\ \text{სმ}$, სიმკვრივე $1800\ \text{კგ/მ}^3$. რამდენი აგური შეიძლება ჩაიტვირთოს $3\ \text{ტ}$ ტვირთამწეობის მანქანაში?
EN: A brick measures $25\ \text{cm} \times 12\ \text{cm} \times 6.5\ \text{cm}$ with density $1800\ \text{kg/m}^3$. How many bricks can a $3\ \text{t}$ truck carry?
HKA: იპოვეთ ერთი აგურის მასა.
HEN: Find the mass of one brick.
SKA: $V = 0{,}25 \cdot 0{,}12 \cdot 0{,}065 = 0{,}00195\ \text{მ}^3$
$m_1 = 1800 \cdot 0{,}00195 \approx 3{,}51\ \text{კგ}$
$n = \dfrac{3000}{3{,}51} \approx 854$ აგური
SEN: $V = 0.25 \cdot 0.12 \cdot 0.065 = 0.00195\ \text{m}^3$
$m_1 = 1800 \cdot 0.00195 \approx 3.51\ \text{kg}$
$n = \dfrac{3000}{3.51} \approx 854$ bricks
AKA: $854$ აგური
AEN: $854$ bricks

--- medium density
KA: ცარიელი ქილის მასა $0{,}5\ \text{კგ}$-ია. თაფლით სავსე ქილა $3{,}5\ \text{კგ}$-ია, წყლით სავსე — $2{,}5\ \text{კგ}$. იპოვეთ თაფლის სიმკვრივე.
EN: An empty jar has mass $0.5\ \text{kg}$. Filled with honey it is $3.5\ \text{kg}$; filled with water, $2.5\ \text{kg}$. Find the density of honey.
HKA: ორივე სითხის მოცულობა ქილის მოცულობის ტოლია.
HEN: Both liquids fill the same volume of the jar.
SKA: $V = \dfrac{2{,}5 - 0{,}5}{1000} = 0{,}002\ \text{მ}^3$
$\rho_{\text{თ}} = \dfrac{3{,}5 - 0{,}5}{0{,}002} = 1500\ \text{კგ/მ}^3$
SEN: $V = \dfrac{2.5 - 0.5}{1000} = 0.002\ \text{m}^3$
$\rho_{\text{h}} = \dfrac{3.5 - 0.5}{0.002} = 1500\ \text{kg/m}^3$
AKA: $1500\ \text{კგ/მ}^3$
AEN: $1500\ \text{kg/m}^3$

--- hard density
KA: თუჯის ბურთის გარე მოცულობაა $500\ \text{სმ}^3$, მასა — $2{,}8\ \text{კგ}$. ცარიელია თუ მთლიანი? თუ ცარიელია, იპოვეთ ღრუს მოცულობა. ($\rho = 7\ \text{გ/სმ}^3$)
EN: A cast-iron ball has an outer volume of $500\ \text{cm}^3$ and mass $2.8\ \text{kg}$. Is it solid or hollow? If hollow, find the cavity's volume. ($\rho = 7\ \text{g/cm}^3$)
HKA: იპოვეთ თუჯის მოცულობა $V = \dfrac{m}{\rho}$ და შეადარეთ გარე მოცულობას.
HEN: Find the volume of the iron $V = \dfrac{m}{\rho}$ and compare it with the outer volume.
SKA: $V_{\text{თ}} = \dfrac{2800}{7} = 400\ \text{სმ}^3 < 500\ \text{სმ}^3$ — ბურთი ცარიელია.
$V_{\text{ღრ}} = 500 - 400 = 100\ \text{სმ}^3$
SEN: $V_{\text{iron}} = \dfrac{2800}{7} = 400\ \text{cm}^3 < 500\ \text{cm}^3$ — the ball is hollow.
$V_{\text{cav}} = 500 - 400 = 100\ \text{cm}^3$
AKA: ცარიელია; $100\ \text{სმ}^3$
AEN: hollow; $100\ \text{cm}^3$

--- hard density
KA: ოქროსა და სპილენძის შენადნობის მასაა $400\ \text{გ}$, სიმკვრივე — $14\ \text{გ/სმ}^3$. რამდენი გრამი ოქროა მასში? ($\rho_{\text{ოქ}} = 19{,}3$, $\rho_{\text{სპ}} = 8{,}9\ \text{გ/სმ}^3$)
EN: A gold–copper alloy has mass $400\ \text{g}$ and density $14\ \text{g/cm}^3$. How many grams of gold does it contain? ($\rho_{\text{Au}} = 19.3$, $\rho_{\text{Cu}} = 8.9\ \text{g/cm}^3$)
HKA: $V = \dfrac{400}{14}$ და $\dfrac{m_1}{19{,}3} + \dfrac{400 - m_1}{8{,}9} = V$.
HEN: $V = \dfrac{400}{14}$ and $\dfrac{m_1}{19.3} + \dfrac{400 - m_1}{8.9} = V$.
SKA: $V = \dfrac{400}{14} \approx 28{,}57\ \text{სმ}^3$
$m_1 = \dfrac{\rho_1 (m - \rho_2 V)}{\rho_1 - \rho_2} = \dfrac{19{,}3\,(400 - 8{,}9 \cdot 28{,}57)}{10{,}4} = \dfrac{19{,}3 \cdot 145{,}7}{10{,}4} \approx 270\ \text{გ}$
SEN: $V = \dfrac{400}{14} \approx 28.57\ \text{cm}^3$
$m_1 = \dfrac{\rho_1 (m - \rho_2 V)}{\rho_1 - \rho_2} = \dfrac{19.3\,(400 - 8.9 \cdot 28.57)}{10.4} = \dfrac{19.3 \cdot 145.7}{10.4} \approx 270\ \text{g}$
AKA: $\approx 270\ \text{გ}$
AEN: $\approx 270\ \text{g}$

--- hard density
KA: ერთნაირი მოცულობის წყალი და სპირტი ($0{,}8\ \text{გ/სმ}^3$) შეურიეს. იპოვეთ ნარევის სიმკვრივე. შემდეგ ერთნაირი მასის წყალი და სპირტი შეურიეს — რა სიმკვრივე იქნება ახლა? (მოცულობები იკრიბება)
EN: Equal volumes of water and alcohol ($0.8\ \text{g/cm}^3$) are mixed. Find the mixture's density. Then equal masses are mixed — what is the density now? (Volumes add.)
HKA: ტოლი მოცულობისას — საშუალო არითმეტიკული; ტოლი მასისას — $\rho = \dfrac{2\rho_1 \rho_2}{\rho_1 + \rho_2}$.
HEN: Equal volumes — the arithmetic mean; equal masses — $\rho = \dfrac{2\rho_1 \rho_2}{\rho_1 + \rho_2}$.
SKA: ტოლი მოცულობები: $\rho = \dfrac{\rho_1 V + \rho_2 V}{2V} = \dfrac{1 + 0{,}8}{2} = 0{,}9\ \text{გ/სმ}^3$
ტოლი მასები: $\rho = \dfrac{2m}{m/\rho_1 + m/\rho_2} = \dfrac{2 \cdot 1 \cdot 0{,}8}{1{,}8} \approx 0{,}89\ \text{გ/სმ}^3$
SEN: Equal volumes: $\rho = \dfrac{\rho_1 V + \rho_2 V}{2V} = \dfrac{1 + 0.8}{2} = 0.9\ \text{g/cm}^3$
Equal masses: $\rho = \dfrac{2m}{m/\rho_1 + m/\rho_2} = \dfrac{2 \cdot 1 \cdot 0.8}{1.8} \approx 0.89\ \text{g/cm}^3$
AKA: $0{,}9$ და $\approx 0{,}89\ \text{გ/სმ}^3$
AEN: $0.9$ and $\approx 0.89\ \text{g/cm}^3$

--- hard density
KA: ჭურჭელი წყლით სავსეა და მისი მასაა $500\ \text{გ}$. მასში $300\ \text{გ}$ ლითონის ნაჭერი ჩადეს — წყლის ნაწილი გადმოიღვარა და ჭურჭლის მასა $760\ \text{გ}$ გახდა. იპოვეთ ლითონის სიმკვრივე.
EN: A vessel full of water has mass $500\ \text{g}$. A $300\ \text{g}$ piece of metal is put in; some water spills and the vessel's mass becomes $760\ \text{g}$. Find the metal's density.
HKA: გადმოღვრილი წყლის მასა: $500 + 300 - 760$.
HEN: Mass of spilled water: $500 + 300 - 760$.
SKA: $m_{\text{წყ}} = 500 + 300 - 760 = 40\ \text{გ}$ $\Rightarrow V = 40\ \text{სმ}^3$
$\rho = \dfrac{300}{40} = 7{,}5\ \text{გ/სმ}^3$
SEN: $m_{\text{w}} = 500 + 300 - 760 = 40\ \text{g}$ $\Rightarrow V = 40\ \text{cm}^3$
$\rho = \dfrac{300}{40} = 7.5\ \text{g/cm}^3$
AKA: $7{,}5\ \text{გ/სმ}^3$
AEN: $7.5\ \text{g/cm}^3$

--- hard density
KA: $1\ \text{მ}^3$ მშრალი ქვიშის მასაა $1500\ \text{კგ}$, ქვიშის მარცვლების სიმკვრივე — $2500\ \text{კგ/მ}^3$. მოცულობის რა ნაწილს იკავებს ჰაერი მარცვლებს შორის? რამდენი ლიტრი წყალი ჩაეტევა $1\ \text{მ}^3$ ქვიშაში?
EN: $1\ \text{m}^3$ of dry sand has mass $1500\ \text{kg}$; the grains themselves have density $2500\ \text{kg/m}^3$. What fraction of the volume is air between the grains? How many litres of water can $1\ \text{m}^3$ of sand soak up?
HKA: მარცვლების საკუთარი მოცულობა $V = \dfrac{m}{\rho_{\text{მ}}}$.
HEN: The grains' own volume is $V = \dfrac{m}{\rho_{\text{g}}}$.
SKA: $V_{\text{მ}} = \dfrac{1500}{2500} = 0{,}6\ \text{მ}^3$
ჰაერი: $1 - 0{,}6 = 0{,}4\ \text{მ}^3$, ანუ $40\%$.
წყალი: $0{,}4\ \text{მ}^3 = 400\ \text{ლ}$.
SEN: $V_{\text{g}} = \dfrac{1500}{2500} = 0.6\ \text{m}^3$
Air: $1 - 0.6 = 0.4\ \text{m}^3$, i.e. $40\%$.
Water: $0.4\ \text{m}^3 = 400\ \text{L}$.
AKA: $40\%$; $400\ \text{ლ}$
AEN: $40\%$; $400\ \text{L}$

--- hard density
KA: ორი ლითონის თანაბარი **მასების** შენადნობის სიმკვრივე $\rho_{\text{შ}}$-ია. პირველი ლითონის სიმკვრივე $\rho_1 = 10\ \text{გ/სმ}^3$, შენადნობისა $\rho_{\text{შ}} = 8\ \text{გ/სმ}^3$. იპოვეთ $\rho_2$.
EN: An alloy of equal **masses** of two metals has density $\rho_{\text{a}} = 8\ \text{g/cm}^3$. The first metal has $\rho_1 = 10\ \text{g/cm}^3$. Find $\rho_2$.
HKA: $\dfrac{2}{\rho_{\text{შ}}} = \dfrac{1}{\rho_1} + \dfrac{1}{\rho_2}$.
HEN: $\dfrac{2}{\rho_{\text{a}}} = \dfrac{1}{\rho_1} + \dfrac{1}{\rho_2}$.
SKA: $\dfrac{1}{\rho_2} = \dfrac{2}{8} - \dfrac{1}{10} = 0{,}25 - 0{,}1 = 0{,}15$
$\rho_2 = \dfrac{1}{0{,}15} \approx 6{,}7\ \text{გ/სმ}^3$
SEN: $\dfrac{1}{\rho_2} = \dfrac{2}{8} - \dfrac{1}{10} = 0.25 - 0.1 = 0.15$
$\rho_2 = \dfrac{1}{0.15} \approx 6.7\ \text{g/cm}^3$
AKA: $\approx 6{,}7\ \text{გ/სმ}^3$
AEN: $\approx 6.7\ \text{g/cm}^3$

--- hard density
KA: სპილენძის მავთულის კოჭის მასა $8{,}9\ \text{კგ}$-ია, მავთულის დიამეტრი — $2\ \text{მმ}$. დაახლოებით რამდენი მეტრია მავთული? ($\rho = 8900\ \text{კგ/მ}^3$, $\pi \approx 3{,}14$)
EN: A coil of copper wire has mass $8.9\ \text{kg}$ and the wire's diameter is $2\ \text{mm}$. Roughly how many metres of wire are there? ($\rho = 8900\ \text{kg/m}^3$, $\pi \approx 3.14$)
HKA: განივკვეთი $S = \pi r^2$, მოცულობა $V = \dfrac{m}{\rho} = S l$.
HEN: Cross-section $S = \pi r^2$; volume $V = \dfrac{m}{\rho} = S l$.
SKA: $V = \dfrac{8{,}9}{8900} = 10^{-3}\ \text{მ}^3$
$S = 3{,}14 \cdot (10^{-3})^2 = 3{,}14 \cdot 10^{-6}\ \text{მ}^2$
$l = \dfrac{10^{-3}}{3{,}14 \cdot 10^{-6}} \approx 318\ \text{მ}$
SEN: $V = \dfrac{8.9}{8900} = 10^{-3}\ \text{m}^3$
$S = 3.14 \cdot (10^{-3})^2 = 3.14 \cdot 10^{-6}\ \text{m}^2$
$l = \dfrac{10^{-3}}{3.14 \cdot 10^{-6}} \approx 318\ \text{m}$
AKA: $\approx 318\ \text{მ}$
AEN: $\approx 318\ \text{m}$

--- hard density
KA: ბოთლში ჯერ $200\ \text{გ}$ წყალი ჩაასხეს და ის ნახევრამდე აივსო. შემდეგ დარჩენილი ნაწილი ზეთით შეავსეს ($0{,}9\ \text{გ/სმ}^3$). იპოვეთ ბოთლის შიგთავსის საშუალო სიმკვრივე და მასა.
EN: $200\ \text{g}$ of water fills a bottle halfway. The rest is then filled with oil ($0.9\ \text{g/cm}^3$). Find the average density and the mass of the contents.
HKA: ბოთლის ტევადობაა $400\ \text{სმ}^3$; ზეთი $200\ \text{სმ}^3$-ს იკავებს.
HEN: The bottle holds $400\ \text{cm}^3$; the oil takes $200\ \text{cm}^3$.
SKA: $m_{\text{ზ}} = 0{,}9 \cdot 200 = 180\ \text{გ}$, $\ m = 200 + 180 = 380\ \text{გ}$
$\rho = \dfrac{380}{400} = 0{,}95\ \text{გ/სმ}^3$
SEN: $m_{\text{oil}} = 0.9 \cdot 200 = 180\ \text{g}$, $\ m = 200 + 180 = 380\ \text{g}$
$\rho = \dfrac{380}{400} = 0.95\ \text{g/cm}^3$
AKA: $0{,}95\ \text{გ/სმ}^3$; $380\ \text{გ}$
AEN: $0.95\ \text{g/cm}^3$; $380\ \text{g}$

--- hard density olympiad
KA: ჭურჭელში ჩაასხეს $\rho_1$ და $\rho_2$ სიმკვრივის ორი სითხე, რომლებიც კარგად ერევა. ნარევის სიმკვრივე $\rho$ აღმოჩნდა. იპოვეთ ნარევში სითხეთა მასების შეფარდება $\dfrac{m_1}{m_2}$, თუ $\rho_1 = 1{,}2$, $\rho_2 = 0{,}8$, $\rho = 1\ \text{გ/სმ}^3$.
EN: Two liquids of densities $\rho_1$ and $\rho_2$ that mix well are poured into a vessel; the mixture has density $\rho$. Find the mass ratio $\dfrac{m_1}{m_2}$ if $\rho_1 = 1.2$, $\rho_2 = 0.8$, $\rho = 1\ \text{g/cm}^3$.
HKA: $\dfrac{m_1 + m_2}{m_1/\rho_1 + m_2/\rho_2} = \rho$.
HEN: $\dfrac{m_1 + m_2}{m_1/\rho_1 + m_2/\rho_2} = \rho$.
SKA: $m_1 + m_2 = \rho\left(\dfrac{m_1}{\rho_1} + \dfrac{m_2}{\rho_2}\right) \Rightarrow m_1\left(1 - \dfrac{\rho}{\rho_1}\right) = m_2\left(\dfrac{\rho}{\rho_2} - 1\right)$
$\dfrac{m_1}{m_2} = \dfrac{\rho/\rho_2 - 1}{1 - \rho/\rho_1} = \dfrac{1{,}25 - 1}{1 - 0{,}833} = \dfrac{0{,}25}{0{,}1667} = 1{,}5$
SEN: $m_1 + m_2 = \rho\left(\dfrac{m_1}{\rho_1} + \dfrac{m_2}{\rho_2}\right) \Rightarrow m_1\left(1 - \dfrac{\rho}{\rho_1}\right) = m_2\left(\dfrac{\rho}{\rho_2} - 1\right)$
$\dfrac{m_1}{m_2} = \dfrac{\rho/\rho_2 - 1}{1 - \rho/\rho_1} = \dfrac{1.25 - 1}{1 - 0.833} = \dfrac{0.25}{0.1667} = 1.5$
AKA: $1{,}5$
AEN: $1.5$

--- hard density olympiad
KA: მოსწავლეს აქვს სასწორი საწონებით, ცარიელი ბოთლი და წყალი. როგორ გაიგოს ქვიშის მარცვლების სიმკვრივე (არა ქვიშის საშუალო სიმკვრივე)? ააგეთ ფორმულა გაზომილი სიდიდეების საშუალებით.
EN: A student has a balance with weights, an empty bottle and water. How can they find the density of the sand **grains** (not the bulk density of sand)? Derive a formula in terms of the measured quantities.
HKA: აწონეთ: ქვიშა ($m$); წყლით სავსე ბოთლი ($m_1$); ქვიშა ბოთლში, შემდეგ წყლით შევსებული ($m_2$).
HEN: Weigh: the sand ($m$); the bottle full of water ($m_1$); the sand in the bottle topped up with water ($m_2$).
SKA: ქვიშა ბოთლში ზუსტად თავისი მარცვლების მოცულობის წყალს გამოდევნის.
გამოდევნილი წყლის მასა: $m_{\text{წყ}} = m_1 + m - m_2$, მოცულობა $V = \dfrac{m_1 + m - m_2}{\rho_{\text{წყ}}}$.
$\rho_{\text{მ}} = \dfrac{m}{V} = \dfrac{m\,\rho_{\text{წყ}}}{m_1 + m - m_2}$
SEN: In the bottle the sand displaces exactly the volume of its grains.
Mass of displaced water: $m_{\text{w}} = m_1 + m - m_2$, volume $V = \dfrac{m_1 + m - m_2}{\rho_{\text{w}}}$.
$\rho_{\text{g}} = \dfrac{m}{V} = \dfrac{m\,\rho_{\text{w}}}{m_1 + m - m_2}$
AKA: $\rho = \dfrac{m\,\rho_{\text{წყ}}}{m_1 + m - m_2}$
AEN: $\rho = \dfrac{m\,\rho_{\text{w}}}{m_1 + m - m_2}$

--- easy matter
KA: რატომ ვგრძნობთ სურნელს, როცა სამზარეულოში საჭმელს ამზადებენ, თუნდაც სხვა ოთახში ვიყოთ?
EN: Why can we smell food being cooked in the kitchen even from another room?
HKA: იფიქრეთ მოლეკულების უწყვეტ მოძრაობაზე.
HEN: Think about the constant motion of molecules.
SKA: სურნელოვანი ნივთიერების მოლეკულები განუწყვეტლად და ქაოსურად მოძრაობენ და ჰაერის მოლეკულებს შორის ვრცელდებიან — ეს დიფუზიაა.
SEN: The molecules of the smelly substance move constantly and randomly and spread out among the air molecules — this is diffusion.
AKA: დიფუზიის გამო
AEN: because of diffusion

--- easy matter
KA: ჩამოთვალეთ ნივთიერების სამი აგრეგატული მდგომარეობა და მოიყვანეთ თითო მაგალითი წყლისთვის.
EN: Name the three states of matter and give an example of each for water.
HKA: წყალი ბუნებაში სამივე მდგომარეობაში გვხვდება.
HEN: Water occurs in nature in all three states.
SKA: მყარი — ყინული, თოვლი.
თხევადი — წყალი მდინარეში.
აირადი — წყლის ორთქლი ჰაერში.
SEN: Solid — ice, snow.
Liquid — water in a river.
Gas — water vapour in the air.
AKA: მყარი (ყინული), თხევადი (წყალი), აირადი (ორთქლი)
AEN: solid (ice), liquid (water), gas (vapour)

--- easy matter
KA: რომელ მდგომარეობაში აქვს ნივთიერებას საკუთარი ფორმა და მოცულობა? მხოლოდ მოცულობა? არც ერთი?
EN: In which state does a substance have its own shape and volume? Only its own volume? Neither?
HKA: შეადარეთ, რა ხდება, როცა ნივთიერებას ახალ ჭურჭელში გადავიტანთ.
HEN: Compare what happens when the substance is moved to a new container.
SKA: მყარ სხეულს — ფორმაც და მოცულობაც.
სითხეს — მხოლოდ მოცულობა (ჭურჭლის ფორმას იღებს).
აირს — არც ერთი (მთელ ჭურჭელს ავსებს).
SEN: A solid has both shape and volume.
A liquid has only volume (it takes the container's shape).
A gas has neither (it fills the whole container).
AKA: მყარი; სითხე; აირი
AEN: solid; liquid; gas

--- easy matter
KA: ფანჯრის ცივ მინაზე ზამთარში წვეთები ჩნდება. რა ხდება აქ ნივთიერების მდგომარეობასთან?
EN: In winter droplets appear on a cold window pane. What change of state is taking place?
HKA: ოთახის ჰაერი წყლის ორთქლს შეიცავს.
HEN: The air in the room contains water vapour.
SKA: ჰაერში არსებული წყლის ორთქლი ცივ მინასთან გაცივდება და სითხედ გადაიქცევა — ეს კონდენსაციაა (აირი $\to$ სითხე).
SEN: Water vapour in the air cools against the cold glass and turns into liquid — this is condensation (gas $\to$ liquid).
AKA: კონდენსაცია: ორთქლი $\to$ წყალი
AEN: condensation: vapour $\to$ water

--- medium matter
KA: რატომ ერევა სითხეები ერთმანეთს დიფუზიით უფრო ნელა, ვიდრე აირები, ხოლო მყარი სხეულები — ყველაზე ნელა?
EN: Why does diffusion happen more slowly in liquids than in gases, and slowest of all in solids?
HKA: შეადარეთ მოლეკულებს შორის მანძილები და ურთიერთქმედება.
HEN: Compare the distances between molecules and the forces between them.
SKA: აირში მოლეკულები შორს არიან ერთმანეთისგან და თითქმის თავისუფლად მოძრაობენ — დიფუზია სწრაფია.
სითხეში ისინი მჭიდროდ არიან და ხშირად ეჯახებიან — უფრო ნელა.
მყარ სხეულში მოლეკულები თავიანთ ადგილს ირგვლივ მხოლოდ რხევიან — დიფუზია ძალიან ნელია (წლები).
SEN: In a gas molecules are far apart and move almost freely — diffusion is fast.
In a liquid they are packed closely and collide constantly — slower.
In a solid molecules only vibrate about fixed positions — diffusion is very slow (years).
AKA: მოლეკულების მოძრაობის თავისუფლების გამო: აირი > სითხე > მყარი
AEN: because of how freely molecules move: gas > liquid > solid

--- medium matter
KA: $50\ \text{მლ}$ წყალს $50\ \text{მლ}$ სპირტი შეურიეს და ნარევის მოცულობა $97\ \text{მლ}$ აღმოჩნდა. რას გვიჩვენებს ეს ცდა ნივთიერების აგებულების შესახებ?
EN: $50\ \text{mL}$ of water is mixed with $50\ \text{mL}$ of alcohol and the mixture is only $97\ \text{mL}$. What does this tell us about the structure of matter?
HKA: იფიქრეთ, სად „გაქრა“ $3\ \text{მლ}$.
HEN: Think about where the missing $3\ \text{mL}$ went.
SKA: მოლეკულებს შორის შუალედებია. ერთი სითხის მოლეკულები მეორის მოლეკულებს შორის შუალედებში თავსდება, ამიტომ ჯამური მოცულობა მცირდება.
SEN: There are gaps between molecules. The molecules of one liquid fit into the gaps between the other's molecules, so the total volume shrinks.
AKA: მოლეკულებს შორის შუალედებია
AEN: there are gaps between molecules

--- medium matter
KA: რატომ არ იშლება მყარი სხეული ცალკეულ მოლეკულებად? რატომ ვერ ვაწებებთ ორ გატეხილ ნაჭერს უბრალოდ ერთმანეთზე მიჭერით?
EN: Why doesn't a solid fall apart into separate molecules? Why can't two broken pieces be joined just by pressing them together?
HKA: მოლეკულური მიზიდვა მხოლოდ ძალიან მცირე მანძილებზე მოქმედებს.
HEN: Molecular attraction acts only over very small distances.
SKA: მოლეკულები ერთმანეთს იზიდავენ — ეს ინარჩუნებს სხეულს მთლიანად.
გატეხილი ნაჭრების ზედაპირები უსწორმასწოროა, მოლეკულების მხოლოდ ძალიან მცირე ნაწილი მიუახლოვდება ერთმანეთს საკმარის მანძილზე, ამიტომ მიზიდვა სუსტია. (ძალიან გაპრიალებული ზედაპირები კი ეწებება ერთმანეთს!)
SEN: Molecules attract each other — this holds the body together.
The broken surfaces are rough, so only a tiny fraction of molecules get close enough, and the attraction is weak. (Very smooth polished surfaces do stick together!)
AKA: მიზიდვა მოქმედებს მხოლოდ ძალიან მცირე მანძილებზე
AEN: the attraction only acts over very small distances

--- medium matter
KA: ორ ჭიქაში ერთნაირი წყალია: ერთში ცივი, მეორეში ცხელი. თითოეულში ჩაის პაკეტი ჩადეს. სად შეიფერება წყალი უფრო სწრაფად და რატომ?
EN: Two glasses hold the same water, one cold and one hot. A tea bag is put in each. Where does the water colour faster, and why?
HKA: ტემპერატურა მოლეკულების მოძრაობის სიჩქარესთან არის დაკავშირებული.
HEN: Temperature is linked to how fast molecules move.
SKA: ცხელ წყალში მოლეკულები უფრო სწრაფად მოძრაობენ, ამიტომ დიფუზია სწრაფად მიმდინარეობს — წყალი ადრე შეიფერება.
SEN: In hot water molecules move faster, so diffusion is faster — the water colours sooner.
AKA: ცხელში — დიფუზია სწრაფია
AEN: in the hot one — diffusion is faster

--- hard matter
KA: $1\ \text{სმ}^3$ წყალში დაახლოებით $3{,}3 \cdot 10^{22}$ მოლეკულაა. თუ ყველა მათგანს ჯაჭვად დავალაგებთ, ერთმანეთის გვერდით ($d \approx 3 \cdot 10^{-10}\ \text{მ}$), რა სიგრძის იქნება ჯაჭვი? შეადარეთ მანძილს დედამიწიდან მზემდე ($1{,}5 \cdot 10^{11}\ \text{მ}$).
EN: $1\ \text{cm}^3$ of water holds about $3.3 \cdot 10^{22}$ molecules. If they were all lined up side by side ($d \approx 3 \cdot 10^{-10}\ \text{m}$), how long would the chain be? Compare it with the Earth–Sun distance ($1.5 \cdot 10^{11}\ \text{m}$).
HKA: $L = N d$.
HEN: $L = N d$.
SKA: $L = 3{,}3 \cdot 10^{22} \cdot 3 \cdot 10^{-10} \approx 10^{13}\ \text{მ}$
$\dfrac{10^{13}}{1{,}5 \cdot 10^{11}} \approx 66$ — დაახლოებით $66$-ჯერ მეტი მანძილზე მზემდე!
SEN: $L = 3.3 \cdot 10^{22} \cdot 3 \cdot 10^{-10} \approx 10^{13}\ \text{m}$
$\dfrac{10^{13}}{1.5 \cdot 10^{11}} \approx 66$ — about $66$ times the Earth–Sun distance!
AKA: $\approx 10^{13}\ \text{მ}$, $\approx 66$-ჯერ მეტი
AEN: $\approx 10^{13}\ \text{m}$, $\approx 66$ times greater

--- hard matter
KA: ზეთის წვეთი ($0{,}02\ \text{მმ}^3$) წყლის ზედაპირზე $100\ \text{სმ}^2$ ფართობის აპკად გაიშალა. შეაფასეთ ზეთის მოლეკულის ზომა, თუ აპკი ერთი მოლეკულის სისქისაა.
EN: An oil drop of $0.02\ \text{mm}^3$ spreads on water into a film of area $100\ \text{cm}^2$. Estimate the size of an oil molecule if the film is one molecule thick.
HKA: $d = \dfrac{V}{S}$; ერთეულები სი-ში გადაიყვანეთ.
HEN: $d = \dfrac{V}{S}$; convert to SI.
SKA: $V = 0{,}02 \cdot 10^{-9} = 2 \cdot 10^{-11}\ \text{მ}^3$, $\ S = 10^{-2}\ \text{მ}^2$
$d = \dfrac{2 \cdot 10^{-11}}{10^{-2}} = 2 \cdot 10^{-9}\ \text{მ}$
SEN: $V = 0.02 \cdot 10^{-9} = 2 \cdot 10^{-11}\ \text{m}^3$, $\ S = 10^{-2}\ \text{m}^2$
$d = \dfrac{2 \cdot 10^{-11}}{10^{-2}} = 2 \cdot 10^{-9}\ \text{m}$
AKA: $\approx 2 \cdot 10^{-9}\ \text{მ}$
AEN: $\approx 2 \cdot 10^{-9}\ \text{m}$

--- hard matter
KA: $1$ ლიტრი წყლის ორთქლი ($100\ \text{°C}$, ნორმალური წნევა) დაახლოებით $0{,}6\ \text{გ}$ მასისაა. რამდენჯერ მეტ მოცულობას იკავებს ორთქლი, ვიდრე იგივე მასის წყალი? რამდენჯერ მეტია საშუალო მანძილი მოლეკულებს შორის?
EN: $1$ litre of steam ($100\ \text{°C}$, normal pressure) has a mass of about $0.6\ \text{g}$. How many times more volume does steam take than the same mass of water? How many times greater is the mean distance between molecules?
HKA: მანძილი მოცულობის კუბური ფესვის პროპორციულია.
HEN: The distance scales as the cube root of the volume.
SKA: $0{,}6\ \text{გ}$ წყალი $0{,}6\ \text{სმ}^3$-ს იკავებს, ორთქლი — $1000\ \text{სმ}^3$-ს.
$\dfrac{V_{\text{ორთ}}}{V_{\text{წყ}}} = \dfrac{1000}{0{,}6} \approx 1700$
$\sqrt[3]{1700} \approx 12$ — მოლეკულებს შორის მანძილი $\approx 12$-ჯერ მეტია.
SEN: $0.6\ \text{g}$ of water takes $0.6\ \text{cm}^3$; the steam takes $1000\ \text{cm}^3$.
$\dfrac{V_{\text{steam}}}{V_{\text{w}}} = \dfrac{1000}{0.6} \approx 1700$
$\sqrt[3]{1700} \approx 12$ — the distance between molecules is $\approx 12$ times larger.
AKA: $\approx 1700$-ჯერ; $\approx 12$-ჯერ
AEN: $\approx 1700$ times; $\approx 12$ times

--- hard matter
KA: სტუდენტმა ოთახის ერთ კუთხეში სუნამოს ბოთლი გახსნა. ოთახის სიგრძე $6\ \text{მ}$-ია და სუნი მეორე კუთხეში $3$ წუთში მივიდა. მოლეკულების სიჩქარე დაახლოებით $400\ \text{მ/წმ}$-ია. რამდენჯერ მეტ მანძილს გადის მოლეკულა სინამდვილეში, ვიდრე $6\ \text{მ}$? რატომ?
EN: A student opens a perfume bottle in one corner of a $6\ \text{m}$ room and the smell reaches the far corner in $3$ minutes. The molecules move at about $400\ \text{m/s}$. How many times longer is the path a molecule actually travels than $6\ \text{m}$? Why?
HKA: მოლეკულის გზა $= v t$; ის ჰაერის მოლეკულებს უწყვეტად ეჯახება.
HEN: The molecule's path $= v t$; it keeps colliding with air molecules.
SKA: $s = 400 \cdot 180 = 72\,000\ \text{მ} = 72\ \text{კმ}$
$\dfrac{72\,000}{6} = 12\,000$
მოლეკულა ჰაერის მოლეკულებს უამრავჯერ ეჯახება და მიმართულებას იცვლის — მისი გზა ტეხილია, ამიტომ წინ ძალიან ნელა მიიწევს.
SEN: $s = 400 \cdot 180 = 72\,000\ \text{m} = 72\ \text{km}$
$\dfrac{72\,000}{6} = 12\,000$
The molecule collides with air molecules countless times and changes direction — its path is a zigzag, so it advances very slowly.
AKA: $\approx 12\,000$-ჯერ — შეჯახებების გამო
AEN: $\approx 12\,000$ times — because of collisions

--- easy pressure
KA: $400\ \text{ნ}$ ძალა $0{,}05\ \text{მ}^2$ ფართობზე მოქმედებს. იპოვეთ წნევა.
EN: A force of $400\ \text{N}$ acts on an area of $0.05\ \text{m}^2$. Find the pressure.
HKA: $p = \dfrac{F}{S}$.
HEN: $p = \dfrac{F}{S}$.
SKA: $p = \dfrac{400}{0{,}05} = 8000\ \text{პა} = 8\ \text{კპა}$
SEN: $p = \dfrac{400}{0.05} = 8000\ \text{Pa} = 8\ \text{kPa}$
AKA: $8\ \text{კპა}$
AEN: $8\ \text{kPa}$

--- easy pressure
KA: რატომ არის დანა ბლაგვთან შედარებით უფრო ადვილად მჭრელი? რატომ აქვს სატვირთო მანქანას ბევრი და განიერი საბურავი?
EN: Why does a sharp knife cut more easily than a blunt one? Why do lorries have many wide tyres?
HKA: წნევა ფართობის უკუპროპორციულია.
HEN: Pressure is inversely proportional to area.
SKA: ბასრი დანის პირს მცირე ფართობი აქვს — იმავე ძალით დიდი წნევა იქმნება.
სატვირთოს ბევრი განიერი საბურავი შეხების ფართობს ზრდის და წნევას გზაზე ამცირებს.
SEN: A sharp blade has a small area — the same force gives a large pressure.
Many wide tyres increase the contact area and reduce the pressure on the road.
AKA: მცირე ფართობი — დიდი წნევა; დიდი ფართობი — მცირე წნევა
AEN: small area — large pressure; large area — small pressure

--- easy pressure
KA: $3\ \text{კპა}$ წნევა რამდენი პასკალია? $0{,}5\ \text{მპა}$? $250\ \text{ჰპა}$?
EN: How many pascals is $3\ \text{kPa}$? $0.5\ \text{MPa}$? $250\ \text{hPa}$?
HKA: $1\ \text{კპა} = 10^3\ \text{პა}$, $1\ \text{მპა} = 10^6\ \text{პა}$, $1\ \text{ჰპა} = 100\ \text{პა}$.
HEN: $1\ \text{kPa} = 10^3\ \text{Pa}$, $1\ \text{MPa} = 10^6\ \text{Pa}$, $1\ \text{hPa} = 100\ \text{Pa}$.
SKA: $3\ \text{კპა} = 3000\ \text{პა}$; $\ 0{,}5\ \text{მპა} = 500\,000\ \text{პა}$; $\ 250\ \text{ჰპა} = 25\,000\ \text{პა}$
SEN: $3\ \text{kPa} = 3000\ \text{Pa}$; $\ 0.5\ \text{MPa} = 500\,000\ \text{Pa}$; $\ 250\ \text{hPa} = 25\,000\ \text{Pa}$
AKA: $3000$; $500\,000$; $25\,000\ \text{პა}$
AEN: $3000$; $500\,000$; $25\,000\ \text{Pa}$

--- easy pressure
KA: კუბი ($80\ \text{ნ}$) მაგიდაზე დევს, მისი წახნაგის ფართობია $0{,}04\ \text{მ}^2$. რა წნევას ახდენს კუბი მაგიდაზე?
EN: An $80\ \text{N}$ cube rests on a table; each face has area $0.04\ \text{m}^2$. What pressure does it exert on the table?
HKA: მაგიდაზე დაწოლის ძალა კუბის წონაა.
HEN: The force on the table is the cube's weight.
SKA: $p = \dfrac{80}{0{,}04} = 2000\ \text{პა}$
SEN: $p = \dfrac{80}{0.04} = 2000\ \text{Pa}$
AKA: $2000\ \text{პა}$
AEN: $2000\ \text{Pa}$

--- medium pressure
KA: ჭიკარტის წვერის ფართობია $0{,}1\ \text{მმ}^2$. რა ძალით უნდა დავაწვეთ, რომ წნევა $100\ \text{მპა}$ იყოს?
EN: A drawing pin's point has area $0.1\ \text{mm}^2$. What force gives a pressure of $100\ \text{MPa}$?
HKA: $F = p S$; $1\ \text{მმ}^2 = 10^{-6}\ \text{მ}^2$.
HEN: $F = p S$; $1\ \text{mm}^2 = 10^{-6}\ \text{m}^2$.
SKA: $S = 0{,}1 \cdot 10^{-6} = 10^{-7}\ \text{მ}^2$
$F = 10^8 \cdot 10^{-7} = 10\ \text{ნ}$
SEN: $S = 0.1 \cdot 10^{-6} = 10^{-7}\ \text{m}^2$
$F = 10^8 \cdot 10^{-7} = 10\ \text{N}$
AKA: $10\ \text{ნ}$
AEN: $10\ \text{N}$

--- medium pressure
KA: ყინულს შეუძლია გაუძლოს $70\ \text{კპა}$ წნევას. გაივლის თუ არა ყინულზე $5{,}4\ \text{ტ}$ მასის ტრაქტორი, რომლის თითოეული მუხლუხოს ფართობია $0{,}75\ \text{მ}^2$?
EN: Ice can withstand a pressure of $70\ \text{kPa}$. Can a $5.4\ \text{t}$ tractor cross it if each of its two tracks has an area of $0.75\ \text{m}^2$?
HKA: ტრაქტორი ორ მუხლუხოზე დგას.
HEN: The tractor stands on two tracks.
SKA: $p = \dfrac{54\,000}{2 \cdot 0{,}75} = 36\,000\ \text{პა} = 36\ \text{კპა} < 70\ \text{კპა}$
გაივლის.
SEN: $p = \dfrac{54\,000}{2 \cdot 0.75} = 36\,000\ \text{Pa} = 36\ \text{kPa} < 70\ \text{kPa}$
It can cross.
AKA: კი ($36\ \text{კპა}$)
AEN: yes ($36\ \text{kPa}$)

--- medium pressure
KA: $1{,}2\ \text{ტ}$ მასის მანქანა ოთხ საბურავზე დგას. თითოეულის შეხების ფართობია $150\ \text{სმ}^2$. იპოვეთ წნევა გზაზე.
EN: A $1.2\ \text{t}$ car stands on four tyres, each touching the road over $150\ \text{cm}^2$. Find the pressure on the road.
HKA: $S = 4 \cdot 150\ \text{სმ}^2 = 0{,}06\ \text{მ}^2$.
HEN: $S = 4 \cdot 150\ \text{cm}^2 = 0.06\ \text{m}^2$.
SKA: $p = \dfrac{12\,000}{0{,}06} = 200\,000\ \text{პა} = 200\ \text{კპა}$
SEN: $p = \dfrac{12\,000}{0.06} = 200\,000\ \text{Pa} = 200\ \text{kPa}$
AKA: $200\ \text{კპა}$
AEN: $200\ \text{kPa}$

--- medium pressure
KA: სვეტი ($2\ \text{ტ}$) $200\ \text{კპა}$-ზე მეტ წნევას ნიადაგზე არ უნდა ახდენდეს. რა ფართობის ფუძე უნდა ჰქონდეს?
EN: A $2\ \text{t}$ column must not exert more than $200\ \text{kPa}$ on the ground. What base area must it have?
HKA: $S = \dfrac{F}{p}$.
HEN: $S = \dfrac{F}{p}$.
SKA: $S = \dfrac{20\,000}{200\,000} = 0{,}1\ \text{მ}^2$ (არანაკლებ)
SEN: $S = \dfrac{20\,000}{200\,000} = 0.1\ \text{m}^2$ (at least)
AKA: არანაკლებ $0{,}1\ \text{მ}^2$
AEN: at least $0.1\ \text{m}^2$

--- medium pressure
KA: ბავშვი ($30\ \text{კგ}$) თოვლზე დგას. ჩექმის ძირის ფართობია $120\ \text{სმ}^2$. რამდენად შემცირდება წნევა, თუ ის თხილამურებზე დადგება ($1{,}5\ \text{მ} \times 0{,}1\ \text{მ}$ თითო)?
EN: A $30\ \text{kg}$ child stands on snow; each boot sole has area $120\ \text{cm}^2$. How many times smaller is the pressure on skis ($1.5\ \text{m} \times 0.1\ \text{m}$ each)?
HKA: ორივე შემთხვევაში ბავშვი ორ საყრდენზე დგას.
HEN: In both cases the child stands on two supports.
SKA: ჩექმებით: $p_1 = \dfrac{300}{2 \cdot 0{,}012} = 12\,500\ \text{პა}$
თხილამურებით: $p_2 = \dfrac{300}{2 \cdot 0{,}15} = 1000\ \text{პა}$
$\dfrac{p_1}{p_2} = 12{,}5$
SEN: In boots: $p_1 = \dfrac{300}{2 \cdot 0.012} = 12\,500\ \text{Pa}$
On skis: $p_2 = \dfrac{300}{2 \cdot 0.15} = 1000\ \text{Pa}$
$\dfrac{p_1}{p_2} = 12.5$
AKA: $12{,}5$-ჯერ
AEN: $12.5$ times

--- medium pressure
KA: ბეტონის ფილის ($2\ \text{მ} \times 1\ \text{მ} \times 0{,}2\ \text{მ}$, $\rho = 2400\ \text{კგ/მ}^3$) რა წნევას ახდენს მიწაზე, როცა უდიდეს წახნაგზე დევს?
EN: What pressure does a concrete slab ($2\ \text{m} \times 1\ \text{m} \times 0.2\ \text{m}$, $\rho = 2400\ \text{kg/m}^3$) exert on the ground when lying on its largest face?
HKA: მართკუთხა სხეულისთვის $p = \rho g h$, სადაც $h$ — სიმაღლე ქვედა წახნაგის ზემოთ.
HEN: For a box-shaped body $p = \rho g h$, where $h$ is its height above the base.
SKA: $h = 0{,}2\ \text{მ}$
$p = 2400 \cdot 10 \cdot 0{,}2 = 4800\ \text{პა}$
SEN: $h = 0.2\ \text{m}$
$p = 2400 \cdot 10 \cdot 0.2 = 4800\ \text{Pa}$
AKA: $4800\ \text{პა}$
AEN: $4800\ \text{Pa}$

--- medium pressure
KA: ადამიანი ($70\ \text{კგ}$) ზურგზე $10\ \text{კგ}$ ჩანთით ერთ ფეხზე დგას. ძირის ფართობია $175\ \text{სმ}^2$. იპოვეთ წნევა.
EN: A $70\ \text{kg}$ person carrying a $10\ \text{kg}$ backpack stands on one foot; the sole has area $175\ \text{cm}^2$. Find the pressure.
HKA: დაწოლის ძალა ადამიანისა და ჩანთის ჯამური წონაა.
HEN: The force is the combined weight of the person and the backpack.
SKA: $F = (70 + 10) \cdot 10 = 800\ \text{ნ}$
$p = \dfrac{800}{0{,}0175} \approx 45\,700\ \text{პა} \approx 46\ \text{კპა}$
SEN: $F = (70 + 10) \cdot 10 = 800\ \text{N}$
$p = \dfrac{800}{0.0175} \approx 45\,700\ \text{Pa} \approx 46\ \text{kPa}$
AKA: $\approx 46\ \text{კპა}$
AEN: $\approx 46\ \text{kPa}$

--- medium pressure
KA: ძელი ($10\ \text{სმ} \times 5\ \text{სმ} \times 2\ \text{სმ}$, $\rho = 8000\ \text{კგ/მ}^3$) მაგიდაზე სხვადასხვა წახნაგით შეიძლება დადოთ. იპოვეთ უდიდესი და უმცირესი წნევა.
EN: A block ($10\ \text{cm} \times 5\ \text{cm} \times 2\ \text{cm}$, $\rho = 8000\ \text{kg/m}^3$) can be placed on a table on different faces. Find the largest and smallest pressure.
HKA: $p = \rho g h$; უდიდესი — როცა ძელი „დგას“ ($h = 10\ \text{სმ}$).
HEN: $p = \rho g h$; the largest is when it stands upright ($h = 10\ \text{cm}$).
SKA: $p_{\max} = 8000 \cdot 10 \cdot 0{,}1 = 8000\ \text{პა}$
$p_{\min} = 8000 \cdot 10 \cdot 0{,}02 = 1600\ \text{პა}$
SEN: $p_{\max} = 8000 \cdot 10 \cdot 0.1 = 8000\ \text{Pa}$
$p_{\min} = 8000 \cdot 10 \cdot 0.02 = 1600\ \text{Pa}$
AKA: $8000\ \text{პა}$ და $1600\ \text{პა}$
AEN: $8000\ \text{Pa}$ and $1600\ \text{Pa}$

--- hard pressure
KA: გრანიტის სვეტი ($\rho = 2600\ \text{კგ/მ}^3$) ფუძეზე $650\ \text{კპა}$ წნევას ახდენს. იპოვეთ სვეტის სიმაღლე. დამოკიდებულია თუ არა პასუხი ფუძის ფართობზე?
EN: A granite column ($\rho = 2600\ \text{kg/m}^3$) exerts $650\ \text{kPa}$ on its base. Find its height. Does the answer depend on the base area?
HKA: ერთგვაროვანი სვეტისთვის $p = \rho g h$.
HEN: For a uniform column $p = \rho g h$.
SKA: $h = \dfrac{p}{\rho g} = \dfrac{650\,000}{26\,000} = 25\ \text{მ}$
არ არის დამოკიდებული — $F$ და $S$ ერთნაირად იზრდება.
SEN: $h = \dfrac{p}{\rho g} = \dfrac{650\,000}{26\,000} = 25\ \text{m}$
It doesn't depend on it — $F$ and $S$ grow together.
AKA: $25\ \text{მ}$; არა
AEN: $25\ \text{m}$; no

--- hard pressure
KA: ორი კუბი ერთი მასალისაა, პირველის წიბო ორჯერ მეტია. რამდენჯერ მეტია პირველის მასა და რა წნევას ახდენს ის მაგიდაზე მეორესთან შედარებით?
EN: Two cubes are made of the same material; the first has twice the edge. How many times larger is its mass, and how does its pressure on a table compare with the second's?
HKA: მასა $\sim a^3$, ფართობი $\sim a^2$.
HEN: Mass $\sim a^3$, area $\sim a^2$.
SKA: $\dfrac{m_1}{m_2} = 2^3 = 8$
$\dfrac{p_1}{p_2} = \dfrac{8}{2^2} = 2$ (ან $p = \rho g a$).
SEN: $\dfrac{m_1}{m_2} = 2^3 = 8$
$\dfrac{p_1}{p_2} = \dfrac{8}{2^2} = 2$ (or $p = \rho g a$).
AKA: მასა $8$-ჯერ, წნევა $2$-ჯერ მეტი
AEN: mass $8$ times, pressure $2$ times greater

--- hard pressure
KA: კუბი ($a = 10\ \text{სმ}$, $\rho = 2700\ \text{კგ/მ}^3$) დგას მეორე კუბზე ($a = 20\ \text{სმ}$, იგივე მასალა). იპოვეთ წნევა ზედა კუბიდან ქვედაზე და ქვედა კუბიდან იატაკზე.
EN: A cube ($a = 10\ \text{cm}$, $\rho = 2700\ \text{kg/m}^3$) stands on a larger cube ($a = 20\ \text{cm}$, same material). Find the pressure of the top cube on the bottom one and of the bottom cube on the floor.
HKA: ზედა კუბი მხოლოდ თავისი ფუძის ფართობით ეხება.
HEN: The top cube touches only over its own base area.
SKA: $m_1 = 2700 \cdot 0{,}001 = 2{,}7\ \text{კგ}$, $\ m_2 = 2700 \cdot 0{,}008 = 21{,}6\ \text{კგ}$
$p_1 = \dfrac{27}{0{,}01} = 2700\ \text{პა}$
$p_2 = \dfrac{27 + 216}{0{,}04} = 6075\ \text{პა}$
SEN: $m_1 = 2700 \cdot 0.001 = 2.7\ \text{kg}$, $\ m_2 = 2700 \cdot 0.008 = 21.6\ \text{kg}$
$p_1 = \dfrac{27}{0.01} = 2700\ \text{Pa}$
$p_2 = \dfrac{27 + 216}{0.04} = 6075\ \text{Pa}$
AKA: $2700\ \text{პა}$; $6075\ \text{პა}$
AEN: $2700\ \text{Pa}$; $6075\ \text{Pa}$

--- hard pressure
KA: მაგიდის ($20\ \text{კგ}$) ოთხი ფეხიდან თითოეულის ფართობია $4\ \text{სმ}^2$. მაგიდაზე $30\ \text{კგ}$ ტელევიზორი დგას. რა წნევას ახდენს მაგიდა იატაკზე? რამდენად შემცირდება წნევა, თუ ფეხებს $25\ \text{სმ}^2$-იან დამცავ ფირფიტებს გავუკეთებთ?
EN: Each of a $20\ \text{kg}$ table's four legs has area $4\ \text{cm}^2$. A $30\ \text{kg}$ TV stands on it. What pressure does the table exert on the floor? By what factor does it drop if pads of $25\ \text{cm}^2$ are put under the legs?
HKA: დაწოლის ძალა $= (m_1 + m_2) g$, ფართობი $= 4 S$.
HEN: Force $= (m_1 + m_2) g$, area $= 4 S$.
SKA: $F = 500\ \text{ნ}$, $\ S_1 = 16\ \text{სმ}^2 = 0{,}0016\ \text{მ}^2$
$p_1 = \dfrac{500}{0{,}0016} \approx 312\ \text{კპა}$
$S_2 = 100\ \text{სმ}^2$: $p_2 = 50\ \text{კპა}$; $\ \dfrac{p_1}{p_2} = 6{,}25$
SEN: $F = 500\ \text{N}$, $\ S_1 = 16\ \text{cm}^2 = 0.0016\ \text{m}^2$
$p_1 = \dfrac{500}{0.0016} \approx 312\ \text{kPa}$
$S_2 = 100\ \text{cm}^2$: $p_2 = 50\ \text{kPa}$; $\ \dfrac{p_1}{p_2} = 6.25$
AKA: $\approx 312\ \text{კპა}$; $6{,}25$-ჯერ
AEN: $\approx 312\ \text{kPa}$; $6.25$ times

--- hard pressure
KA: ფოლადის ცილინდრი ($\rho = 7800\ \text{კგ/მ}^3$) ფუძით ქვიშაზე დგას და $39\ \text{კპა}$ წნევას ახდენს. მის ზემოთ იგივე ფუძის, მაგრამ $2$-ჯერ დაბალი ალუმინის ცილინდრი ($2700\ \text{კგ/მ}^3$) დადეს. რა იქნება წნევა?
EN: A steel cylinder ($\rho = 7800\ \text{kg/m}^3$) stands on sand and exerts $39\ \text{kPa}$. An aluminium cylinder ($2700\ \text{kg/m}^3$) with the same base but half the height is put on top. What is the pressure now?
HKA: ჯერ იპოვეთ ფოლადის ცილინდრის სიმაღლე: $h = \dfrac{p}{\rho g}$.
HEN: First find the steel cylinder's height: $h = \dfrac{p}{\rho g}$.
SKA: $h_1 = \dfrac{39\,000}{78\,000} = 0{,}5\ \text{მ}$, $\ h_2 = 0{,}25\ \text{მ}$
$p = \rho_1 g h_1 + \rho_2 g h_2 = 39\,000 + 2700 \cdot 10 \cdot 0{,}25 = 39\,000 + 6750 = 45\,750\ \text{პა}$
SEN: $h_1 = \dfrac{39\,000}{78\,000} = 0.5\ \text{m}$, $\ h_2 = 0.25\ \text{m}$
$p = \rho_1 g h_1 + \rho_2 g h_2 = 39\,000 + 2700 \cdot 10 \cdot 0.25 = 39\,000 + 6750 = 45\,750\ \text{Pa}$
AKA: $\approx 45{,}8\ \text{კპა}$
AEN: $\approx 45.8\ \text{kPa}$

--- hard pressure
KA: ოთახის იატაკს შეუძლია გაუძლოს $5\ \text{მპა}$ წნევას. ქალი ($60\ \text{კგ}$) ქუსლიან ფეხსაცმელზე ($1\ \text{სმ}^2$ ქუსლი) მთელ წონას ერთ ქუსლზე გადაიტანს. დააზიანებს იატაკს? შეადარეთ სპილოს ($4\ \text{ტ}$) ფეხის წნევას ($S = 0{,}1\ \text{მ}^2$, ერთ ფეხზე).
EN: A floor can withstand $5\ \text{MPa}$. A $60\ \text{kg}$ woman in high heels ($1\ \text{cm}^2$ heel) puts all her weight on one heel. Will she damage the floor? Compare with an elephant ($4\ \text{t}$) standing on one foot ($S = 0.1\ \text{m}^2$).
HKA: $p = \dfrac{mg}{S}$ ორივესთვის.
HEN: $p = \dfrac{mg}{S}$ for both.
SKA: ქალი: $p = \dfrac{600}{10^{-4}} = 6 \cdot 10^6\ \text{პა} = 6\ \text{მპა} > 5\ \text{მპა}$ — დააზიანებს!
სპილო: $p = \dfrac{40\,000}{0{,}1} = 0{,}4\ \text{მპა}$ — $15$-ჯერ ნაკლები.
SEN: Woman: $p = \dfrac{600}{10^{-4}} = 6 \cdot 10^6\ \text{Pa} = 6\ \text{MPa} > 5\ \text{MPa}$ — she will damage it!
Elephant: $p = \dfrac{40\,000}{0.1} = 0.4\ \text{MPa}$ — $15$ times less.
AKA: კი ($6\ \text{მპა}$); სპილოსი $0{,}4\ \text{მპა}$-ია
AEN: yes ($6\ \text{MPa}$); the elephant's is $0.4\ \text{MPa}$

--- hard pressure
KA: ორი აგური ($25 \times 12 \times 6\ \text{სმ}$, $3{,}6\ \text{კგ}$ თითო) ერთმანეთზე დევს. როგორ უნდა დავაწყოთ, რომ იატაკზე წნევა უდიდესი იყოს? იპოვეთ ეს წნევა.
EN: Two bricks ($25 \times 12 \times 6\ \text{cm}$, $3.6\ \text{kg}$ each) are stacked. How should they be arranged for the greatest pressure on the floor? Find that pressure.
HKA: დაწოლის ძალა ყოველთვის ერთია; ფართობი უმცირესი უნდა იყოს.
HEN: The force is always the same; the area must be as small as possible.
SKA: ორივე აგური ვერტიკალურად, ერთმანეთზე უმცირესი ($12 \times 6$) წახნაგით.
$S = 0{,}12 \cdot 0{,}06 = 0{,}0072\ \text{მ}^2$
$p = \dfrac{72}{0{,}0072} = 10\,000\ \text{პა}$
SEN: Both bricks upright, one on the other, resting on the smallest ($12 \times 6$) face.
$S = 0.12 \cdot 0.06 = 0.0072\ \text{m}^2$
$p = \dfrac{72}{0.0072} = 10\,000\ \text{Pa}$
AKA: უმცირესი წახნაგით; $10\ \text{კპა}$
AEN: on the smallest face; $10\ \text{kPa}$

--- easy fluids
KA: იპოვეთ წყლის წნევა $3\ \text{მ}$ სიღრმეზე.
EN: Find the water pressure at a depth of $3\ \text{m}$.
HKA: $p = \rho g h$.
HEN: $p = \rho g h$.
SKA: $p = 1000 \cdot 10 \cdot 3 = 30\,000\ \text{პა} = 30\ \text{კპა}$
SEN: $p = 1000 \cdot 10 \cdot 3 = 30\,000\ \text{Pa} = 30\ \text{kPa}$
AKA: $30\ \text{კპა}$
AEN: $30\ \text{kPa}$

--- easy fluids
KA: რატომ აშენებენ კაშხალს ქვემოთ უფრო სქელს, ვიდრე ზემოთ?
EN: Why are dams built thicker at the bottom than at the top?
HKA: სითხის წნევა სიღრმესთან ერთად იზრდება.
HEN: Liquid pressure grows with depth.
SKA: წყლის წნევა $p = \rho g h$ სიღრმის პროპორციულია — ფსკერთან ის ყველაზე დიდია, ამიტომ კაშხალი ქვემოთ ყველაზე ძლიერი უნდა იყოს.
SEN: Water pressure $p = \rho g h$ is proportional to depth — it is greatest at the bottom, so the dam must be strongest there.
AKA: ქვემოთ წნევა უდიდესია
AEN: pressure is greatest at the bottom

--- easy fluids
KA: ნორმალური ატმოსფერული წნევა $760\ \text{მმ.ვწყ.სვ.}$-ია. გამოსახეთ ის პასკალებში. ($\rho_{\text{ვწყ}} = 13\,600\ \text{კგ/მ}^3$)
EN: Normal atmospheric pressure is $760\ \text{mmHg}$. Express it in pascals. ($\rho_{\text{Hg}} = 13\,600\ \text{kg/m}^3$)
HKA: $p = \rho g h$, $h = 0{,}76\ \text{მ}$; აქ აიღეთ $g = 9{,}8\ \text{ნ/კგ}$.
HEN: $p = \rho g h$, $h = 0.76\ \text{m}$; take $g = 9.8\ \text{N/kg}$ here.
SKA: $p = 13\,600 \cdot 9{,}8 \cdot 0{,}76 \approx 101\,300\ \text{პა}$
SEN: $p = 13\,600 \cdot 9.8 \cdot 0.76 \approx 101\,300\ \text{Pa}$
AKA: $\approx 101{,}3\ \text{კპა}$
AEN: $\approx 101.3\ \text{kPa}$

--- easy fluids
KA: რატომ ამოდის წყალი შპრიცში, როცა დგუშს ზემოთ ვწევთ?
EN: Why does water rise into a syringe when the plunger is pulled up?
HKA: დგუშის ქვეშ ჰაერი აღარ არის.
HEN: There is no air under the plunger.
SKA: დგუშის აწევისას მის ქვეშ წნევა მცირდება. გარეთ ატმოსფერული წნევა წყალს შპრიცში შეაწვება.
SEN: Pulling the plunger lowers the pressure beneath it. Atmospheric pressure outside pushes the water into the syringe.
AKA: ატმოსფერული წნევა შეაწვება წყალს
AEN: atmospheric pressure pushes the water in

--- medium fluids
KA: ზღვაში ($\rho = 1030\ \text{კგ/მ}^3$) წყალქვეშა ნავის ილუმინატორის ფართობია $0{,}03\ \text{მ}^2$. რა ძალით აწვება მას წყალი $200\ \text{მ}$ სიღრმეზე?
EN: A submarine's porthole in the sea ($\rho = 1030\ \text{kg/m}^3$) has area $0.03\ \text{m}^2$. What force does the water exert on it at a depth of $200\ \text{m}$?
HKA: $F = \rho g h S$.
HEN: $F = \rho g h S$.
SKA: $p = 1030 \cdot 10 \cdot 200 = 2{,}06 \cdot 10^6\ \text{პა}$
$F = 2{,}06 \cdot 10^6 \cdot 0{,}03 \approx 62\ \text{კნ}$
SEN: $p = 1030 \cdot 10 \cdot 200 = 2.06 \cdot 10^6\ \text{Pa}$
$F = 2.06 \cdot 10^6 \cdot 0.03 \approx 62\ \text{kN}$
AKA: $\approx 62\ \text{კნ}$
AEN: $\approx 62\ \text{kN}$

--- medium fluids
KA: ჰიდრავლიკური წნეხის დგუშების ფართობებია $2\ \text{სმ}^2$ და $200\ \text{სმ}^2$. რა მასის ტვირთის აწევა შეიძლება, თუ მცირე დგუშს $150\ \text{ნ}$-ით ვაწვებით?
EN: A hydraulic press has pistons of $2\ \text{cm}^2$ and $200\ \text{cm}^2$. What mass can be lifted if the small piston is pushed with $150\ \text{N}$?
HKA: $\dfrac{F_2}{F_1} = \dfrac{S_2}{S_1}$.
HEN: $\dfrac{F_2}{F_1} = \dfrac{S_2}{S_1}$.
SKA: $F_2 = 150 \cdot 100 = 15\,000\ \text{ნ}$
$m = 1500\ \text{კგ}$
SEN: $F_2 = 150 \cdot 100 = 15\,000\ \text{N}$
$m = 1500\ \text{kg}$
AKA: $1{,}5\ \text{ტ}$
AEN: $1.5\ \text{t}$

--- medium fluids
KA: ჭიქაში $10\ \text{სმ}$ სიმაღლით ზეთია ($800\ \text{კგ/მ}^3$), ქვემოთ $5\ \text{სმ}$ წყალი. იპოვეთ წნევა ჭიქის ფსკერზე (ატმოსფეროს გარეშე).
EN: A glass has $5\ \text{cm}$ of water at the bottom and $10\ \text{cm}$ of oil ($800\ \text{kg/m}^3$) on top. Find the pressure on the bottom (ignoring the atmosphere).
HKA: ფენების წნევები იკრიბება.
HEN: The pressures of the layers add.
SKA: $p = 800 \cdot 10 \cdot 0{,}1 + 1000 \cdot 10 \cdot 0{,}05 = 800 + 500 = 1300\ \text{პა}$
SEN: $p = 800 \cdot 10 \cdot 0.1 + 1000 \cdot 10 \cdot 0.05 = 800 + 500 = 1300\ \text{Pa}$
AKA: $1300\ \text{პა}$
AEN: $1300\ \text{Pa}$

--- medium fluids
KA: რა სიღრმეზეა ზღვაში ($1030\ \text{კგ/მ}^3$) წყლის წნევა ატმოსფერულის ($100\ \text{კპა}$) ტოლი?
EN: At what depth in the sea ($1030\ \text{kg/m}^3$) does the water pressure equal atmospheric pressure ($100\ \text{kPa}$)?
HKA: $h = \dfrac{p}{\rho g}$.
HEN: $h = \dfrac{p}{\rho g}$.
SKA: $h = \dfrac{100\,000}{1030 \cdot 10} \approx 9{,}7\ \text{მ}$
SEN: $h = \dfrac{100\,000}{1030 \cdot 10} \approx 9.7\ \text{m}$
AKA: $\approx 9{,}7\ \text{მ}$
AEN: $\approx 9.7\ \text{m}$

--- medium fluids
KA: მთის ძირში ბარომეტრი $750\ \text{მმ.ვწყ.სვ.}$-ს აჩვენებს. რამდენს აჩვენებს მწვერვალზე, თუ მთის სიმაღლე $360\ \text{მ}$-ია? (ყოველ $12\ \text{მ}$-ზე წნევა $\approx 1\ \text{მმ}$-ით მცირდება)
EN: At the foot of a hill a barometer reads $750\ \text{mmHg}$. What does it read at the top, $360\ \text{m}$ higher? (The pressure drops by $\approx 1\ \text{mm}$ every $12\ \text{m}$.)
HKA: $\Delta p = \dfrac{360}{12}\ \text{მმ}$.
HEN: $\Delta p = \dfrac{360}{12}\ \text{mm}$.
SKA: $\Delta p = 30\ \text{მმ}$
$p = 750 - 30 = 720\ \text{მმ.ვწყ.სვ.}$
SEN: $\Delta p = 30\ \text{mm}$
$p = 750 - 30 = 720\ \text{mmHg}$
AKA: $720\ \text{მმ.ვწყ.სვ.}$
AEN: $720\ \text{mmHg}$

--- medium fluids
KA: შეერთებულ ჭურჭლებში წყალია. ერთ მილში $20\ \text{სმ}$ სიმაღლის ნავთის ($800\ \text{კგ/მ}^3$) სვეტი დაასხეს. რამდენით მაღლა იქნება ნავთის ზედაპირი წყლის ზედაპირზე მეორე მილში?
EN: Connected tubes contain water. A $20\ \text{cm}$ column of kerosene ($800\ \text{kg/m}^3$) is poured into one tube. How much higher is the kerosene surface than the water surface in the other tube?
HKA: გამყოფი ზედაპირის დონეზე წნევები ტოლია: $\rho_{\text{ნ}} h_{\text{ნ}} = \rho_{\text{წყ}} h_{\text{წყ}}$.
HEN: At the level of the interface the pressures are equal: $\rho_{\text{k}} h_{\text{k}} = \rho_{\text{w}} h_{\text{w}}$.
SKA: $h_{\text{წყ}} = \dfrac{800 \cdot 20}{1000} = 16\ \text{სმ}$
$\Delta h = 20 - 16 = 4\ \text{სმ}$
SEN: $h_{\text{w}} = \dfrac{800 \cdot 20}{1000} = 16\ \text{cm}$
$\Delta h = 20 - 16 = 4\ \text{cm}$
AKA: $4\ \text{სმ}$-ით
AEN: by $4\ \text{cm}$

--- medium fluids
KA: რა ძალით აწვება ატმოსფერო $20\ \text{სმ} \times 30\ \text{სმ}$ ზომის წიგნის ყდას? რატომ არ ვგრძნობთ ამ ძალას, როცა წიგნს ვწევთ?
EN: With what force does the atmosphere press on a book cover measuring $20\ \text{cm} \times 30\ \text{cm}$? Why don't we feel this force when lifting the book?
HKA: $F = p_0 S$. ჰაერი წიგნს ყველა მხრიდან აწვება.
HEN: $F = p_0 S$. Air presses on the book from all sides.
SKA: $F = 100\,000 \cdot 0{,}06 = 6000\ \text{ნ}$
ჰაერი წიგნს ქვემოდანაც იმავე წნევით აწვება — ძალები ერთმანეთს აბათილებს.
SEN: $F = 100\,000 \cdot 0.06 = 6000\ \text{N}$
Air presses equally on the underside — the forces cancel.
AKA: $6\ \text{კნ}$; ქვემოდანაც იგივე ძალა მოქმედებს
AEN: $6\ \text{kN}$; the same force acts from below

--- medium fluids
KA: მართკუთხა აკვარიუმის ($40 \times 25\ \text{სმ}$ ფსკერი) წყლის დონე $30\ \text{სმ}$-ია. იპოვეთ წნევა და წნევის ძალა ფსკერზე.
EN: A rectangular aquarium with a $40 \times 25\ \text{cm}$ base has water $30\ \text{cm}$ deep. Find the pressure and the force on the bottom.
HKA: $p = \rho g h$, $F = p S$.
HEN: $p = \rho g h$, $F = p S$.
SKA: $p = 1000 \cdot 10 \cdot 0{,}3 = 3000\ \text{პა}$
$F = 3000 \cdot 0{,}1 = 300\ \text{ნ}$ (წყლის წონის ტოლი — $30\ \text{კგ}$)
SEN: $p = 1000 \cdot 10 \cdot 0.3 = 3000\ \text{Pa}$
$F = 3000 \cdot 0.1 = 300\ \text{N}$ (equal to the weight of the water — $30\ \text{kg}$)
AKA: $3000\ \text{პა}$; $300\ \text{ნ}$
AEN: $3000\ \text{Pa}$; $300\ \text{N}$

--- hard fluids
KA: U-მილში ვერცხლისწყალია. ერთ მუხლში $68\ \text{სმ}$ წყალი, მეორეში $x$ სმ ნავთი ($800\ \text{კგ/მ}^3$) ჩაასხეს და ვერცხლისწყლის დონეები გათანაბრდა. იპოვეთ $x$.
EN: A U-tube contains mercury. $68\ \text{cm}$ of water is poured into one arm and $x$ cm of kerosene ($800\ \text{kg/m}^3$) into the other, and the mercury levels end up equal. Find $x$.
HKA: ვერცხლისწყალზე ორივე მხრიდან ტოლი წნევაა.
HEN: The pressures on the mercury from both sides are equal.
SKA: $\rho_{\text{წყ}} h_{\text{წყ}} = \rho_{\text{ნ}} x$
$x = \dfrac{1000 \cdot 68}{800} = 85\ \text{სმ}$
SEN: $\rho_{\text{w}} h_{\text{w}} = \rho_{\text{k}} x$
$x = \dfrac{1000 \cdot 68}{800} = 85\ \text{cm}$
AKA: $85\ \text{სმ}$
AEN: $85\ \text{cm}$

--- hard fluids
KA: U-მილში წყალია. ერთ მუხლში $25\ \text{სმ}$ ზეთი ($900\ \text{კგ/მ}^3$) ჩაასხეს. რამდენით აიწევს წყალი მეორე მუხლში, თუ მუხლები ერთნაირი განივკვეთისაა?
EN: A U-tube with arms of equal cross-section contains water. $25\ \text{cm}$ of oil ($900\ \text{kg/m}^3$) is poured into one arm. By how much does the water rise in the other arm?
HKA: ზეთის ქვეშ წყალი $y$-ით დაიწევს, მეორე მუხლში $y$-ით აიწევს; სხვაობა $2y$.
HEN: Under the oil the water drops by $y$ and rises by $y$ in the other arm; the difference is $2y$.
SKA: $\rho_{\text{წყ}} \cdot 2y = \rho_{\text{ზ}} h$
$2y = \dfrac{900 \cdot 25}{1000} = 22{,}5\ \text{სმ} \Rightarrow y = 11{,}25\ \text{სმ}$
SEN: $\rho_{\text{w}} \cdot 2y = \rho_{\text{oil}} h$
$2y = \dfrac{900 \cdot 25}{1000} = 22.5\ \text{cm} \Rightarrow y = 11.25\ \text{cm}$
AKA: $11{,}25\ \text{სმ}$-ით
AEN: by $11.25\ \text{cm}$

--- hard fluids
KA: ჰიდრავლიკური ამწის მცირე დგუში $25\ \text{სმ}$-ით ჩაიწია, დიდი $1\ \text{სმ}$-ით აიწია. მცირე დგუშზე ძალაა $400\ \text{ნ}$. რა ძალით მოქმედებს დიდი დგუში? რას უდრის შესრულებული მუშაობები?
EN: The small piston of a hydraulic lift moves down $25\ \text{cm}$ while the large one rises $1\ \text{cm}$. The force on the small piston is $400\ \text{N}$. What force does the large piston exert? Compare the work done on each side.
HKA: სითხის მოცულობა არ იცვლება: $S_1 h_1 = S_2 h_2$.
HEN: The liquid's volume is constant: $S_1 h_1 = S_2 h_2$.
SKA: $\dfrac{S_2}{S_1} = \dfrac{25}{1} = 25 \Rightarrow F_2 = 25 \cdot 400 = 10\,000\ \text{ნ}$
$A_1 = 400 \cdot 0{,}25 = 100\ \text{ჯ}$, $\ A_2 = 10\,000 \cdot 0{,}01 = 100\ \text{ჯ}$ — მუშაობაში მოგება არ არის.
SEN: $\dfrac{S_2}{S_1} = \dfrac{25}{1} = 25 \Rightarrow F_2 = 25 \cdot 400 = 10\,000\ \text{N}$
$W_1 = 400 \cdot 0.25 = 100\ \text{J}$, $\ W_2 = 10\,000 \cdot 0.01 = 100\ \text{J}$ — no gain in work.
AKA: $10\ \text{კნ}$; მუშაობები ტოლია ($100\ \text{ჯ}$)
AEN: $10\ \text{kN}$; the works are equal ($100\ \text{J}$)

--- hard fluids
KA: კუბური ავზი ($a = 1\ \text{მ}$) წყლითაა სავსე. იპოვეთ წნევის ძალა ფსკერზე და ერთ გვერდით კედელზე. (კედელზე საშუალო წნევა ნახევარ სიღრმეზე არსებული წნევის ტოლია.)
EN: A cubic tank ($a = 1\ \text{m}$) is full of water. Find the force on the bottom and on one side wall. (The average pressure on a wall equals the pressure at half depth.)
HKA: ფსკერი: $p = \rho g a$; კედელი: $p_{\text{საშ}} = \rho g \dfrac{a}{2}$.
HEN: Bottom: $p = \rho g a$; wall: $p_{\text{avg}} = \rho g \dfrac{a}{2}$.
SKA: ფსკერი: $F = 1000 \cdot 10 \cdot 1 \cdot 1 = 10\,000\ \text{ნ}$
კედელი: $F = 1000 \cdot 10 \cdot 0{,}5 \cdot 1 = 5000\ \text{ნ}$
SEN: Bottom: $F = 1000 \cdot 10 \cdot 1 \cdot 1 = 10\,000\ \text{N}$
Wall: $F = 1000 \cdot 10 \cdot 0.5 \cdot 1 = 5000\ \text{N}$
AKA: $10\ \text{კნ}$; $5\ \text{კნ}$
AEN: $10\ \text{kN}$; $5\ \text{kN}$

--- hard fluids
KA: ჭურჭელს ფსკერზე $2\ \text{სმ}^2$ ფართობის ხვრელი აქვს, რომელიც საცობითაა დახურული. საცობი გამოვარდება, თუ მასზე ძალა $5\ \text{ნ}$-ს გადააჭარბებს. რა სიმაღლემდე შეიძლება ჭურჭლის წყლით ავსება?
EN: A vessel has a $2\ \text{cm}^2$ hole in its bottom, closed with a stopper that pops out if the force on it exceeds $5\ \text{N}$. To what height can the vessel be filled with water?
HKA: $\rho g h S \le F_{\max}$.
HEN: $\rho g h S \le F_{\max}$.
SKA: $h = \dfrac{F}{\rho g S} = \dfrac{5}{1000 \cdot 10 \cdot 2 \cdot 10^{-4}} = 2{,}5\ \text{მ}$
SEN: $h = \dfrac{F}{\rho g S} = \dfrac{5}{1000 \cdot 10 \cdot 2 \cdot 10^{-4}} = 2.5\ \text{m}$
AKA: $2{,}5\ \text{მ}$-მდე
AEN: up to $2.5\ \text{m}$

--- hard fluids
KA: რა სიმაღლეზე შეიძლება ამოიტანოს წყალი შემწოვმა ტუმბომ ($p_0 = 100\ \text{კპა}$)? რატომ არ მუშაობს შემწოვი ტუმბო ღრმა ჭაში?
EN: To what height can a suction pump raise water ($p_0 = 100\ \text{kPa}$)? Why doesn't a suction pump work in a deep well?
HKA: წყალს ზემოთ ატმოსფერული წნევა უბიძგებს.
HEN: Atmospheric pressure is what pushes the water up.
SKA: $h_{\max} = \dfrac{p_0}{\rho g} = \dfrac{100\,000}{10\,000} = 10\ \text{მ}$
ატმოსფერული წნევა წყლის სვეტს $10\ \text{მ}$-ზე მეტად ვერ აიყვანს, ამიტომ ღრმა ჭიდან წყალს ჭაში ჩაშვებული ტუმბოები ზემოთ აწვება.
SEN: $h_{\max} = \dfrac{p_0}{\rho g} = \dfrac{100\,000}{10\,000} = 10\ \text{m}$
The atmosphere cannot hold up a water column higher than $10\ \text{m}$, so deep wells use pumps placed down in the well that push the water up.
AKA: $\approx 10\ \text{მ}$
AEN: $\approx 10\ \text{m}$

--- hard fluids
KA: ჰიდრავლიკურ წნეხს მცირე დგუშზე ბერკეტით ამოძრავებენ: ბერკეტის მხრები $5$:$1$-ია, ადამიანი $200\ \text{ნ}$-ით აწვება. დგუშების ფართობების შეფარდებაა $50$. რა ძალით აწვება დიდი დგუში?
EN: A hydraulic press's small piston is driven by a lever with arms in the ratio $5$:$1$; a person pushes with $200\ \text{N}$. The piston areas are in the ratio $50$. What force does the large piston exert?
HKA: ბერკეტი ძალას $5$-ჯერ ზრდის, წნეხი — კიდევ $50$-ჯერ.
HEN: The lever multiplies the force by $5$, the press by another $50$.
SKA: $F_1 = 200 \cdot 5 = 1000\ \text{ნ}$
$F_2 = 1000 \cdot 50 = 50\,000\ \text{ნ} = 50\ \text{კნ}$
SEN: $F_1 = 200 \cdot 5 = 1000\ \text{N}$
$F_2 = 1000 \cdot 50 = 50\,000\ \text{N} = 50\ \text{kN}$
AKA: $50\ \text{კნ}$
AEN: $50\ \text{kN}$

--- hard fluids
KA: მილის ($S = 1\ \text{სმ}^2$) ბოლოში დახურული ჭურჭელი ($S = 100\ \text{სმ}^2$, სიმაღლე $10\ \text{სმ}$) წყლითაა სავსე, მილშიც წყალი $1\ \text{მ}$ სიმაღლემდეა. იპოვეთ წყლის წნევის ძალა ჭურჭლის ფსკერზე და წყლის წონა. რატომ განსხვავდება? (ჰიდროსტატიკური პარადოქსი)
EN: A closed vessel ($S = 100\ \text{cm}^2$, height $10\ \text{cm}$) is full of water, with a thin tube ($S = 1\ \text{cm}^2$) above it filled to $1\ \text{m}$ above the vessel's top. Find the water force on the vessel's bottom and the weight of the water. Why do they differ? (Hydrostatic paradox)
HKA: ფსკერზე წნევა მხოლოდ სრულ სიმაღლეზეა დამოკიდებული: $h = 1{,}1\ \text{მ}$.
HEN: The pressure on the bottom depends only on the total height: $h = 1.1\ \text{m}$.
SKA: $F = \rho g h S = 1000 \cdot 10 \cdot 1{,}1 \cdot 0{,}01 = 110\ \text{ნ}$
წყლის მოცულობა: $1000 + 100 = 1100\ \text{სმ}^3$, წონა $11\ \text{ნ}$.
ძალა $10$-ჯერ მეტია წონაზე: წყალი ჭურჭლის თავსახურსაც ქვემოდან ზემოთ აწვება, და ეს ძალა ჭურჭლის კედლებით ფსკერზე გადაეცემა.
SEN: $F = \rho g h S = 1000 \cdot 10 \cdot 1.1 \cdot 0.01 = 110\ \text{N}$
Water volume: $1000 + 100 = 1100\ \text{cm}^3$, weight $11\ \text{N}$.
The force is $10$ times the weight: the water also pushes up on the lid, and the vessel's walls carry that force back to the bottom.
AKA: $110\ \text{ნ}$; $11\ \text{ნ}$
AEN: $110\ \text{N}$; $11\ \text{N}$

--- hard fluids
KA: ტყვიის ცილინდრი ($S = 20\ \text{სმ}^2$) მთლიანად წყალშია ჩაძირული: მისი ზედა ფუძე $40\ \text{სმ}$ სიღრმეზეა, ქვედა — $60\ \text{სმ}$-ზე (ქვემოდანაც წყალია). იპოვეთ წყლის წნევის ძალები ზედა და ქვედა ფუძეებზე და მათი სხვაობა.
EN: A cylindrical lead weight ($S = 20\ \text{cm}^2$) is fully submerged; its top is at $40\ \text{cm}$ depth and its bottom at $60\ \text{cm}$ (water gets underneath). Find the water forces on the top and bottom faces and their difference.
HKA: სხვაობა ამომგდები (არქიმედეს) ძალაა.
HEN: The difference is the buoyant (Archimedes') force.
SKA: $F_{\text{ზ}} = 1000 \cdot 10 \cdot 0{,}4 \cdot 0{,}002 = 8\ \text{ნ}$ (ქვემოთ)
$F_{\text{ქ}} = 1000 \cdot 10 \cdot 0{,}6 \cdot 0{,}002 = 12\ \text{ნ}$ (ზემოთ)
$\Delta F = 4\ \text{ნ} = \rho g V$, $V = 0{,}002 \cdot 0{,}2 = 4 \cdot 10^{-4}\ \text{მ}^3$
SEN: $F_{\text{top}} = 1000 \cdot 10 \cdot 0.4 \cdot 0.002 = 8\ \text{N}$ (down)
$F_{\text{bot}} = 1000 \cdot 10 \cdot 0.6 \cdot 0.002 = 12\ \text{N}$ (up)
$\Delta F = 4\ \text{N} = \rho g V$, $V = 0.002 \cdot 0.2 = 4 \cdot 10^{-4}\ \text{m}^3$
AKA: $8\ \text{ნ}$; $12\ \text{ნ}$; სხვაობა $4\ \text{ნ}$
AEN: $8\ \text{N}$; $12\ \text{N}$; difference $4\ \text{N}$

--- hard fluids
KA: თვითმფრინავის სალონში წნევა $80\ \text{კპა}$-ია, გარეთ $10\ \text{კმ}$ სიმაღლეზე — $26\ \text{კპა}$. რა ძალით აწვება ჰაერი შიგნიდან $0{,}8\ \text{მ}^2$ ფართობის კარს?
EN: In a plane's cabin the pressure is $80\ \text{kPa}$; outside at $10\ \text{km}$ it is $26\ \text{kPa}$. What net force does the air push outwards on a $0.8\ \text{m}^2$ door?
HKA: ძალა წნევათა სხვაობით განისაზღვრება.
HEN: The force is set by the pressure difference.
SKA: $\Delta p = 80 - 26 = 54\ \text{კპა}$
$F = 54\,000 \cdot 0{,}8 = 43\,200\ \text{ნ} \approx 43\ \text{კნ}$ — ეს $4{,}3$ ტონის წონაა!
SEN: $\Delta p = 80 - 26 = 54\ \text{kPa}$
$F = 54\,000 \cdot 0.8 = 43\,200\ \text{N} \approx 43\ \text{kN}$ — the weight of $4.3$ tonnes!
AKA: $\approx 43\ \text{კნ}$
AEN: $\approx 43\ \text{kN}$

--- hard fluids
KA: ჭურჭელში $15\ \text{სმ}$ ვერცხლისწყალია ($13{,}6\ \text{გ/სმ}^3$), მის ზემოთ — $20\ \text{სმ}$ წყალი. რა სიმაღლის წყლის სვეტი შექმნიდა იმავე წნევას ფსკერზე?
EN: A vessel holds $15\ \text{cm}$ of mercury ($13.6\ \text{g/cm}^3$) with $20\ \text{cm}$ of water above it. What height of water alone would give the same pressure on the bottom?
HKA: ვერცხლისწყლის სვეტი წყლის $13{,}6$-ჯერ მაღალი სვეტის ექვივალენტურია.
HEN: A mercury column is equivalent to a water column $13.6$ times taller.
SKA: $h = 20 + 13{,}6 \cdot 15 = 20 + 204 = 224\ \text{სმ} = 2{,}24\ \text{მ}$
SEN: $h = 20 + 13.6 \cdot 15 = 20 + 204 = 224\ \text{cm} = 2.24\ \text{m}$
AKA: $2{,}24\ \text{მ}$
AEN: $2.24\ \text{m}$

--- hard fluids
KA: რა სიმაღლის იქნებოდა ატმოსფერო, მისი სიმკვრივე რომ ყველგან $1{,}29\ \text{კგ/მ}^3$ ყოფილიყო, ხოლო წნევა დედამიწის ზედაპირთან $100\ \text{კპა}$?
EN: How high would the atmosphere be if its density were $1.29\ \text{kg/m}^3$ everywhere and the pressure at the Earth's surface were $100\ \text{kPa}$?
HKA: ასეთი „ერთგვაროვანი“ ატმოსფეროსთვის $p_0 = \rho g H$.
HEN: For such a "uniform" atmosphere $p_0 = \rho g H$.
SKA: $H = \dfrac{p_0}{\rho g} = \dfrac{100\,000}{1{,}29 \cdot 10} \approx 7750\ \text{მ} \approx 7{,}8\ \text{კმ}$
(სინამდვილეში ჰაერი სიმაღლესთან ერთად თხელდება და ატმოსფერო ბევრად მაღლა ვრცელდება.)
SEN: $H = \dfrac{p_0}{\rho g} = \dfrac{100\,000}{1.29 \cdot 10} \approx 7750\ \text{m} \approx 7.8\ \text{km}$
(In reality air thins with height and the atmosphere extends much higher.)
AKA: $\approx 7{,}8\ \text{კმ}$
AEN: $\approx 7.8\ \text{km}$

--- hard fluids olympiad
KA: U-მილის მუხლების განივკვეთებია $S$ და $2S$. მილში წყალია. ვიწრო მუხლში $30\ \text{სმ}$ ნავთი ($800\ \text{კგ/მ}^3$) ჩაასხეს. რამდენით აიწევს წყალი ფართო მუხლში?
EN: A U-tube has arms of cross-section $S$ and $2S$ and contains water. $30\ \text{cm}$ of kerosene ($800\ \text{kg/m}^3$) is poured into the narrow arm. By how much does the water rise in the wide arm?
HKA: ვიწრო მუხლში წყალი $x$-ით ჩაიწევს, ფართოში $\dfrac{x}{2}$-ით აიწევს.
HEN: In the narrow arm the water drops by $x$; in the wide arm it rises by $\dfrac{x}{2}$.
SKA: დონეთა სხვაობა: $x + \dfrac{x}{2} = \dfrac{3x}{2}$
$\rho_{\text{წყ}} \cdot \dfrac{3x}{2} = \rho_{\text{ნ}} \cdot 30 \Rightarrow \dfrac{3x}{2} = 24\ \text{სმ} \Rightarrow x = 16\ \text{სმ}$
ფართო მუხლში აწევა: $\dfrac{x}{2} = 8\ \text{სმ}$
SEN: Level difference: $x + \dfrac{x}{2} = \dfrac{3x}{2}$
$\rho_{\text{w}} \cdot \dfrac{3x}{2} = \rho_{\text{k}} \cdot 30 \Rightarrow \dfrac{3x}{2} = 24\ \text{cm} \Rightarrow x = 16\ \text{cm}$
Rise in the wide arm: $\dfrac{x}{2} = 8\ \text{cm}$
AKA: $8\ \text{სმ}$-ით
AEN: by $8\ \text{cm}$

--- hard fluids olympiad
KA: ცილინდრული ჭიქა წყლით სავსეა, ქაღალდის ფურცლით დახურეს და გადმოაბრუნეს — წყალი არ იღვრება. ჭიქის სიმაღლეა $10\ \text{სმ}$. რა უდიდესი სიმაღლის მილის შემთხვევაშიც კი შეიკავებდა ატმოსფერო წყალს? რატომ იღვრება წყალი, თუ ჭიქა მხოლოდ ნახევრადაა სავსე და ფურცელი მოიღუნება?
EN: A cylindrical glass full of water is covered with a sheet of paper and turned upside down — the water doesn't spill. The glass is $10\ \text{cm}$ tall. How tall a tube could the atmosphere still hold up? Why may the water pour out if the glass is half-full and the paper bulges?
HKA: ფურცელზე ქვემოდან $p_0$ მოქმედებს, ზემოდან — წყლისა და ჭიქაში მოხვედრილი ჰაერის წნევა.
HEN: The paper has $p_0$ below it and the water plus any trapped air above it.
SKA: სავსე ჭიქისთვის ზემოდან მხოლოდ წყლის წნევაა: $\rho g h \le p_0 \Rightarrow h \le 10\ \text{მ}$ — $10\ \text{სმ}$ ბევრად ნაკლებია.
ნახევრად სავსე ჭიქაში ჰაერია. ფურცელი თუ მოიღუნება, ჰაერის მოცულობა იზრდება და მისი წნევა ცოტათი ეცემა — წონასწორობა მყიფეა და ფურცლის მცირე გადახრა წყალს გადმოღვრის.
SEN: For a full glass only the water presses from above: $\rho g h \le p_0 \Rightarrow h \le 10\ \text{m}$ — far more than $10\ \text{cm}$.
A half-full glass contains air. If the paper bulges, the air expands and its pressure drops a little — the balance is delicate, and a small sag lets the water pour out.
AKA: $\approx 10\ \text{მ}$-მდე
AEN: up to $\approx 10\ \text{m}$

--- hard fluids olympiad
KA: ცილინდრულ ჭურჭელში წყალი და ვერცხლისწყალი ტოლი მასებითაა ჩასხმული, სითხეების საერთო სიმაღლეა $29{,}2\ \text{სმ}$. იპოვეთ წნევა ფსკერზე ($\rho_{\text{ვწ}} = 13{,}6\ \text{გ/სმ}^3$).
EN: A cylindrical vessel holds equal masses of water and mercury; the total height of the liquids is $29.2\ \text{cm}$. Find the pressure on the bottom ($\rho_{\text{Hg}} = 13.6\ \text{g/cm}^3$).
HKA: ტოლი მასისას სიმაღლეები სიმკვრივეების უკუპროპორციულია. ფსკერზე წნევა $= \dfrac{2 m g}{S}$.
HEN: For equal masses the heights are inversely proportional to the densities. Pressure on the bottom $= \dfrac{2 m g}{S}$.
SKA: $h_{\text{წყ}} = 13{,}6\,h_{\text{ვწ}}$, $\ 14{,}6\,h_{\text{ვწ}} = 29{,}2 \Rightarrow h_{\text{ვწ}} = 2\ \text{სმ}$, $h_{\text{წყ}} = 27{,}2\ \text{სმ}$
$p = 2 \rho_{\text{წყ}} g h_{\text{წყ}} = 2 \cdot 1000 \cdot 10 \cdot 0{,}272 = 5440\ \text{პა}$
SEN: $h_{\text{w}} = 13.6\,h_{\text{Hg}}$, $\ 14.6\,h_{\text{Hg}} = 29.2 \Rightarrow h_{\text{Hg}} = 2\ \text{cm}$, $h_{\text{w}} = 27.2\ \text{cm}$
$p = 2 \rho_{\text{w}} g h_{\text{w}} = 2 \cdot 1000 \cdot 10 \cdot 0.272 = 5440\ \text{Pa}$
AKA: $5440\ \text{პა}$
AEN: $5440\ \text{Pa}$

--- hard fluids olympiad
KA: ჰიდრავლიკური წნეხის ორივე დგუში ერთ დონეზეა. მცირე დგუშზე ($S_1 = 10\ \text{სმ}^2$) $1\ \text{კგ}$ საწონი დადეს, დიდზე ($S_2 = 100\ \text{სმ}^2$) — $5\ \text{კგ}$. რამდენით აიწევს რომელიმე დგუში წონასწორობის დამყარებისას? (წყალი, დგუშები უწონოა)
EN: Both pistons of a hydraulic press are at the same level. A $1\ \text{kg}$ weight is put on the small piston ($S_1 = 10\ \text{cm}^2$) and $5\ \text{kg}$ on the large one ($S_2 = 100\ \text{cm}^2$). After equilibrium, what is the height difference between the pistons? (Water; pistons weightless.)
HKA: შეადარეთ წნევები დგუშების ქვეშ; სხვაობა წყლის სვეტით უნდა გაწონასწორდეს.
HEN: Compare the pressures under the pistons; the difference must be balanced by a water column.
SKA: $p_1 = \dfrac{10}{0{,}001} = 10\,000\ \text{პა}$, $\ p_2 = \dfrac{50}{0{,}01} = 5000\ \text{პა}$
მცირე დგუში ჩაიწევს, დიდი აიწევს, სანამ $p_1 = p_2 + \rho g \Delta h$:
$\Delta h = \dfrac{10\,000 - 5000}{10\,000} = 0{,}5\ \text{მ}$ — დიდი დგუში $50\ \text{სმ}$-ით მაღლა იქნება.
SEN: $p_1 = \dfrac{10}{0.001} = 10\,000\ \text{Pa}$, $\ p_2 = \dfrac{50}{0.01} = 5000\ \text{Pa}$
The small piston goes down and the large one up until $p_1 = p_2 + \rho g \Delta h$:
$\Delta h = \dfrac{10\,000 - 5000}{10\,000} = 0.5\ \text{m}$ — the large piston ends up $50\ \text{cm}$ higher.
AKA: დიდი დგუში $50\ \text{სმ}$-ით მაღლა
AEN: the large piston is $50\ \text{cm}$ higher

--- easy archimedes
KA: სხეული მოცულობით $0{,}003\ \text{მ}^3$ მთლიანად წყალშია ჩაძირული. იპოვეთ არქიმედეს ძალა.
EN: A body of volume $0.003\ \text{m}^3$ is fully under water. Find the buoyant force.
HKA: $F_A = \rho_{\text{წყ}} g V$.
HEN: $F_A = \rho_{\text{w}} g V$.
SKA: $F_A = 1000 \cdot 10 \cdot 0{,}003 = 30\ \text{ნ}$
SEN: $F_A = 1000 \cdot 10 \cdot 0.003 = 30\ \text{N}$
AKA: $30\ \text{ნ}$
AEN: $30\ \text{N}$

--- easy archimedes
KA: რატომ ცურავს ხე წყალში, რკინა კი იძირება? რატომ ცურავს რკინის გემი?
EN: Why does wood float in water while iron sinks? Why does an iron ship float?
HKA: შეადარეთ სიმკვრივეები; გემის საშუალო სიმკვრივე ჰაერის ჩათვლით ითვლება.
HEN: Compare densities; a ship's average density includes the air inside.
SKA: ხე ($\rho < 1000\ \text{კგ/მ}^3$) წყალზე მსუბუქია — ცურავს; რკინა ($7800$) მძიმეა — იძირება.
გემი ღრუა, შიგნით ჰაერია, მისი საშუალო სიმკვრივე წყლისაზე ნაკლებია და ის საკმარის წყალს გამოდევნის.
SEN: Wood ($\rho < 1000\ \text{kg/m}^3$) is less dense than water — it floats; iron ($7800$) is denser — it sinks.
A ship is hollow and full of air; its average density is below water's and it displaces enough water.
AKA: სიმკვრივეების შედარება; გემის საშუალო სიმკვრივე მცირეა
AEN: compare densities; the ship's average density is small

--- easy archimedes
KA: სხეული ჰაერში $5\ \text{ნ}$-ს იწონის, წყალში — $3\ \text{ნ}$-ს. რას უდრის არქიმედეს ძალა?
EN: A body weighs $5\ \text{N}$ in air and $3\ \text{N}$ in water. What is the buoyant force?
HKA: წონის დანაკლისი არქიმედეს ძალის ტოლია.
HEN: The loss of weight equals the buoyant force.
SKA: $F_A = 5 - 3 = 2\ \text{ნ}$
SEN: $F_A = 5 - 3 = 2\ \text{N}$
AKA: $2\ \text{ნ}$
AEN: $2\ \text{N}$

--- easy archimedes
KA: ერთნაირი მოცულობის ალუმინისა და რკინის ბურთები წყალშია ჩაძირული. რომელზე მოქმედებს მეტი ამომგდები ძალა?
EN: Aluminium and iron balls of the same volume are fully submerged in water. Which experiences the greater buoyant force?
HKA: არქიმედეს ძალა სითხის სიმკვრივეზე და ჩაძირულ მოცულობაზეა დამოკიდებული, არა სხეულის მასალაზე.
HEN: The buoyant force depends on the liquid's density and the submerged volume, not on the body's material.
SKA: $F_A = \rho_{\text{წყ}} g V$ — მოცულობები ტოლია, ამიტომ ძალებიც ტოლია.
SEN: $F_A = \rho_{\text{w}} g V$ — the volumes are equal, so the forces are equal.
AKA: ტოლია
AEN: they are equal

--- medium archimedes
KA: $2\ \text{დმ}^3$ მოცულობის ქვა წყლის ფსკერზე დევს, მასა $5\ \text{კგ}$. რა ძალაა საჭირო მის წყალში ასაწევად?
EN: A stone of volume $2\ \text{dm}^3$ and mass $5\ \text{kg}$ lies on the bottom of a pond. What force is needed to lift it in the water?
HKA: $F = mg - F_A$.
HEN: $F = mg - F_A$.
SKA: $F_A = 1000 \cdot 10 \cdot 0{,}002 = 20\ \text{ნ}$
$F = 50 - 20 = 30\ \text{ნ}$
SEN: $F_A = 1000 \cdot 10 \cdot 0.002 = 20\ \text{N}$
$F = 50 - 20 = 30\ \text{N}$
AKA: $30\ \text{ნ}$
AEN: $30\ \text{N}$

--- medium archimedes
KA: ყინულის ნატეხი ($\rho = 900\ \text{კგ/მ}^3$) ზღვაში ცურავს ($\rho = 1030\ \text{კგ/მ}^3$). მოცულობის რა ნაწილია წყლის ზემოთ?
EN: An iceberg ($\rho = 900\ \text{kg/m}^3$) floats in sea water ($\rho = 1030\ \text{kg/m}^3$). What fraction of its volume is above water?
HKA: ცურვისას $\dfrac{V_{\text{ჩაძ}}}{V} = \dfrac{\rho}{\rho_{\text{ს}}}$.
HEN: When floating $\dfrac{V_{\text{sub}}}{V} = \dfrac{\rho}{\rho_{\text{liq}}}$.
SKA: $\dfrac{V_{\text{ჩაძ}}}{V} = \dfrac{900}{1030} \approx 0{,}874$
ზემოთ: $1 - 0{,}874 \approx 0{,}126$ — დაახლოებით $\dfrac{1}{8}$.
SEN: $\dfrac{V_{\text{sub}}}{V} = \dfrac{900}{1030} \approx 0.874$
Above: $1 - 0.874 \approx 0.126$ — about $\dfrac{1}{8}$.
AKA: $\approx 12{,}6\%$
AEN: $\approx 12.6\%$

--- medium archimedes
KA: სხეული ჰაერში $10\ \text{ნ}$-ს, წყალში $6\ \text{ნ}$-ს, უცნობ სითხეში $6{,}8\ \text{ნ}$-ს იწონის. იპოვეთ სითხის სიმკვრივე.
EN: A body weighs $10\ \text{N}$ in air, $6\ \text{N}$ in water and $6.8\ \text{N}$ in an unknown liquid. Find the liquid's density.
HKA: არქიმედეს ძალები სითხეების სიმკვრივეების პროპორციულია.
HEN: The buoyant forces are proportional to the liquids' densities.
SKA: $F_{\text{წყ}} = 4\ \text{ნ}$, $\ F_{\text{ს}} = 3{,}2\ \text{ნ}$
$\rho_{\text{ს}} = 1000 \cdot \dfrac{3{,}2}{4} = 800\ \text{კგ/მ}^3$
SEN: $F_{\text{w}} = 4\ \text{N}$, $\ F_{\text{l}} = 3.2\ \text{N}$
$\rho_{\text{l}} = 1000 \cdot \dfrac{3.2}{4} = 800\ \text{kg/m}^3$
AKA: $800\ \text{კგ/მ}^3$
AEN: $800\ \text{kg/m}^3$

--- medium archimedes
KA: მაშველი რგოლი ($2\ \text{კგ}$, $V = 0{,}03\ \text{მ}^3$) მთლიანად წყალშია ჩაძირული. შეუძლია თუ არა მას $30\ \text{კგ}$ ბავშვის შეკავება წყალზე, თუ ბავშვის სხეულის მოცულობაა $0{,}028\ \text{მ}^3$?
EN: A $2\ \text{kg}$ life ring of volume $0.03\ \text{m}^3$ is fully submerged. Can it keep a $30\ \text{kg}$ child afloat if the child's body volume is $0.028\ \text{m}^3$?
HKA: შეადარეთ ჯამური წონა და ჯამური ამომგდები ძალა.
HEN: Compare the total weight with the total buoyant force.
SKA: წონა: $(30 + 2) \cdot 10 = 320\ \text{ნ}$
ამომგდები ძალა: $1000 \cdot 10 \cdot (0{,}03 + 0{,}028) = 580\ \text{ნ} > 320\ \text{ნ}$ — შეუძლია.
SEN: Weight: $(30 + 2) \cdot 10 = 320\ \text{N}$
Buoyancy: $1000 \cdot 10 \cdot (0.03 + 0.028) = 580\ \text{N} > 320\ \text{N}$ — yes, it can.
AKA: კი
AEN: yes

--- medium archimedes
KA: ხის ძელი ($0{,}2\ \text{მ}^3$, $\rho = 500\ \text{კგ/მ}^3$) წყალში ცურავს. რა მასის ტვირთი შეიძლება დაიდოს, რომ ძელი მთლიანად ჩაიძიროს, მაგრამ არ ჩაიძიროს ფსკერზე?
EN: A wooden beam ($0.2\ \text{m}^3$, $\rho = 500\ \text{kg/m}^3$) floats in water. What load placed on it will submerge it fully (just level with the surface)?
HKA: $F_A = \rho_{\text{წყ}} g V = (m_{\text{ძ}} + m) g$.
HEN: $F_A = \rho_{\text{w}} g V = (m_{\text{b}} + m) g$.
SKA: $m_{\text{ძ}} = 500 \cdot 0{,}2 = 100\ \text{კგ}$
$m = 1000 \cdot 0{,}2 - 100 = 100\ \text{კგ}$
SEN: $m_{\text{b}} = 500 \cdot 0.2 = 100\ \text{kg}$
$m = 1000 \cdot 0.2 - 100 = 100\ \text{kg}$
AKA: $100\ \text{კგ}$
AEN: $100\ \text{kg}$

--- medium archimedes
KA: წყალბადით სავსე ბურთის მოცულობაა $5\ \text{მ}^3$. იპოვეთ არქიმედეს ძალა ჰაერში ($1{,}29\ \text{კგ/მ}^3$) და წყალბადის წონა ($0{,}09\ \text{კგ/მ}^3$).
EN: A hydrogen balloon has volume $5\ \text{m}^3$. Find the buoyant force in air ($1.29\ \text{kg/m}^3$) and the weight of the hydrogen ($0.09\ \text{kg/m}^3$).
HKA: აირშიც არქიმედეს კანონი მოქმედებს.
HEN: Archimedes' law applies in gases too.
SKA: $F_A = 1{,}29 \cdot 10 \cdot 5 = 64{,}5\ \text{ნ}$
$P_{\text{H}} = 0{,}09 \cdot 10 \cdot 5 = 4{,}5\ \text{ნ}$
(ბურთს შეუძლია $60\ \text{ნ}$-მდე ტვირთის აწევა, გარსის ჩათვლით.)
SEN: $F_A = 1.29 \cdot 10 \cdot 5 = 64.5\ \text{N}$
$W_{\text{H}} = 0.09 \cdot 10 \cdot 5 = 4.5\ \text{N}$
(The balloon could lift up to $60\ \text{N}$, including its skin.)
AKA: $64{,}5\ \text{ნ}$; $4{,}5\ \text{ნ}$
AEN: $64.5\ \text{N}$; $4.5\ \text{N}$

--- hard archimedes
KA: ალუმინის ბურთი ($\rho = 2700\ \text{კგ/მ}^3$) ჰაერში $5{,}4\ \text{ნ}$-ს იწონის, წყალში — $2{,}4\ \text{ნ}$-ს. მთლიანია თუ ღრუ? თუ ღრუა, იპოვეთ ღრუს მოცულობა.
EN: An aluminium ball ($\rho = 2700\ \text{kg/m}^3$) weighs $5.4\ \text{N}$ in air and $2.4\ \text{N}$ in water. Is it solid or hollow? If hollow, find the cavity's volume.
HKA: არქიმედეს ძალიდან — მთლიანი მოცულობა, წონიდან — ალუმინის მოცულობა.
HEN: The buoyant force gives the total volume; the weight gives the aluminium's volume.
SKA: $F_A = 3\ \text{ნ} \Rightarrow V = \dfrac{3}{10\,000} = 3 \cdot 10^{-4}\ \text{მ}^3 = 300\ \text{სმ}^3$
$V_{\text{ალ}} = \dfrac{0{,}54}{2700} = 2 \cdot 10^{-4}\ \text{მ}^3 = 200\ \text{სმ}^3$
ღრუა: $V_{\text{ღრ}} = 100\ \text{სმ}^3$
SEN: $F_A = 3\ \text{N} \Rightarrow V = \dfrac{3}{10\,000} = 3 \cdot 10^{-4}\ \text{m}^3 = 300\ \text{cm}^3$
$V_{\text{Al}} = \dfrac{0.54}{2700} = 2 \cdot 10^{-4}\ \text{m}^3 = 200\ \text{cm}^3$
Hollow: $V_{\text{cav}} = 100\ \text{cm}^3$
AKA: ღრუა; $100\ \text{სმ}^3$
AEN: hollow; $100\ \text{cm}^3$

--- hard archimedes
KA: ტივი შედგება $10$ მორისგან, თითოეული $0{,}4\ \text{მ}^3$, $\rho = 600\ \text{კგ/მ}^3$. რა უდიდესი მასის ტვირთის გადატანა შეუძლია ტივს?
EN: A raft is made of $10$ logs, each $0.4\ \text{m}^3$ with $\rho = 600\ \text{kg/m}^3$. What is the largest load it can carry?
HKA: ზღვრულ შემთხვევაში მორები მთლიანად წყალშია.
HEN: At the limit the logs are completely submerged.
SKA: $V = 4\ \text{მ}^3$, $\ m_{\text{ტ}} = 600 \cdot 4 = 2400\ \text{კგ}$
$m = \rho_{\text{წყ}} V - m_{\text{ტ}} = 4000 - 2400 = 1600\ \text{კგ}$
SEN: $V = 4\ \text{m}^3$, $\ m_{\text{raft}} = 600 \cdot 4 = 2400\ \text{kg}$
$m = \rho_{\text{w}} V - m_{\text{raft}} = 4000 - 2400 = 1600\ \text{kg}$
AKA: $1600\ \text{კგ}$
AEN: $1600\ \text{kg}$

--- hard archimedes
KA: ხის კუბი ($a = 10\ \text{სმ}$, $\rho = 800\ \text{კგ/მ}^3$) წყალში ცურავს. რა სიღრმეზეა ჩაძირული? რა ძალით უნდა დავაწვეთ, რომ მთლიანად ჩავძიროთ?
