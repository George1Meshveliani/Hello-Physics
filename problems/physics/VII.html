SKA: ა) ვერტმფრენის მიმართ — წრეწირი.
ბ) დედამიწის მიმართ წრიულ მოძრაობას ემატება ვერტიკალური აწევა — ტრაექტორია ხრახნული ხაზია (სპირალი, როგორც ზამბარის ხვია).
SEN: a) relative to the helicopter — a circle.
b) relative to the Earth the circular motion combines with the vertical rise — the trajectory is a helix (like the coils of a spring).
AKA: ა) წრეწირი; ბ) ხრახნული ხაზი (ჰელიქსი)
AEN: a) a circle; b) a helix

--- medium motion
KA: მდინარეზე ტივი ცურავს. ტივზე მდგომი ბიჭი უძრავია ტივის მიმართ. ნაპირიდან ხედავენ, რომ ტივი $1\ \text{სთ}$-ში $2\ \text{კმ}$ გაცურა. რა სიჩქარით მოძრაობს ბიჭი ნაპირის მიმართ? წყლის მიმართ?
EN: A raft floats down a river. A boy on the raft is at rest relative to it. From the bank, the raft is seen to drift $2\ \text{km}$ in $1\ \text{h}$. How fast is the boy moving relative to the bank? Relative to the water?
HKA: ტივს წყალი მიაქვს — ის წყლის მიმართ უძრავია.
HEN: The raft is carried by the water — it is at rest relative to the water.
SKA: ნაპირის მიმართ: $v = \dfrac{2\ \text{კმ}}{1\ \text{სთ}} = 2\ \text{კმ/სთ}$ (დინების სიჩქარე).
წყლის მიმართ ტივიც და ბიჭიც უძრავია: $v = 0$.
SEN: Relative to the bank: $v = \dfrac{2\ \text{km}}{1\ \text{h}} = 2\ \text{km/h}$ (the current's speed).
Relative to the water both the raft and the boy are at rest: $v = 0$.
AKA: ნაპირის მიმართ $2\ \text{კმ/სთ}$, წყლის მიმართ $0$
AEN: $2\ \text{km/h}$ relative to the bank, $0$ relative to the water

--- easy speed
KA: მატარებელმა $240\ \text{კმ}$ $3\ \text{სთ}$-ში გაიარა. რას უდრის მისი საშუალო სიჩქარე?
EN: A train covered $240\ \text{km}$ in $3\ \text{h}$. What is its average speed?
HKA: $v = \dfrac{s}{t}$.
HEN: $v = \dfrac{s}{t}$.
SKA: **ფორმულა:** $v = \dfrac{s}{t}$
**რიცხვები:** $v = \dfrac{240}{3} = 80\ \text{კმ/სთ}$
SEN: **Formula:** $v = \dfrac{s}{t}$
**Numbers:** $v = \dfrac{240}{3} = 80\ \text{km/h}$
AKA: $80\ \text{კმ/სთ}$
AEN: $80\ \text{km/h}$

--- easy speed
KA: გადაიყვანეთ $\text{მ/წმ}$-ში: $36\ \text{კმ/სთ}$; $108\ \text{კმ/სთ}$; $18\ \text{კმ/სთ}$.
EN: Convert to $\text{m/s}$: $36\ \text{km/h}$; $108\ \text{km/h}$; $18\ \text{km/h}$.
HKA: $1\ \text{კმ/სთ} = \dfrac{1000\ \text{მ}}{3600\ \text{წმ}} = \dfrac{1}{3{,}6}\ \text{მ/წმ}$ — გაყავით $3{,}6$-ზე.
HEN: $1\ \text{km/h} = \dfrac{1000\ \text{m}}{3600\ \text{s}} = \dfrac{1}{3.6}\ \text{m/s}$ — divide by $3.6$.
SKA: $36 : 3{,}6 = 10\ \text{მ/წმ}$
$108 : 3{,}6 = 30\ \text{მ/წმ}$
$18 : 3{,}6 = 5\ \text{მ/წმ}$
SEN: $36 : 3.6 = 10\ \text{m/s}$
$108 : 3.6 = 30\ \text{m/s}$
$18 : 3.6 = 5\ \text{m/s}$
AKA: $10$; $30$; $5\ \text{მ/წმ}$
AEN: $10$; $30$; $5\ \text{m/s}$

--- easy speed
KA: ხმის სიჩქარე ჰაერში $340\ \text{მ/წმ}$-ია. რა დრო დასჭირდება ხმას $1{,}7\ \text{კმ}$-ის გავლას?
EN: The speed of sound in air is $340\ \text{m/s}$. How long does sound take to travel $1.7\ \text{km}$?
HKA: $t = \dfrac{s}{v}$; გადაიყვანეთ კილომეტრები მეტრებში.
HEN: $t = \dfrac{s}{v}$; convert kilometres to metres.
SKA: **ფორმულა:** $t = \dfrac{s}{v}$
**რიცხვები:** $t = \dfrac{1700}{340} = 5\ \text{წმ}$
SEN: **Formula:** $t = \dfrac{s}{v}$
**Numbers:** $t = \dfrac{1700}{340} = 5\ \text{s}$
AKA: $5\ \text{წმ}$
AEN: $5\ \text{s}$

--- easy speed
KA: გადაიყვანეთ $\text{კმ/სთ}$-ში: $15\ \text{მ/წმ}$; $25\ \text{მ/წმ}$; $2\ \text{მ/წმ}$.
EN: Convert to $\text{km/h}$: $15\ \text{m/s}$; $25\ \text{m/s}$; $2\ \text{m/s}$.
HKA: $\text{მ/წმ}$-დან $\text{კმ/სთ}$-ში გადასაყვანად გაამრავლეთ $3{,}6$-ზე.
HEN: To go from $\text{m/s}$ to $\text{km/h}$, multiply by $3.6$.
SKA: $15 \cdot 3{,}6 = 54\ \text{კმ/სთ}$
$25 \cdot 3{,}6 = 90\ \text{კმ/სთ}$
$2 \cdot 3{,}6 = 7{,}2\ \text{კმ/სთ}$
SEN: $15 \cdot 3.6 = 54\ \text{km/h}$
$25 \cdot 3.6 = 90\ \text{km/h}$
$2 \cdot 3.6 = 7.2\ \text{km/h}$
AKA: $54$; $90$; $7{,}2\ \text{კმ/სთ}$
AEN: $54$; $90$; $7.2\ \text{km/h}$

--- easy speed
KA: ველოსიპედისტი $18\ \text{კმ/სთ}$ სიჩქარით მოძრაობს. რა მანძილს გაივლის ის $20\ \text{წთ}$-ში?
EN: A cyclist rides at $18\ \text{km/h}$. How far does the cyclist go in $20\ \text{min}$?
HKA: $20\ \text{წთ} = \dfrac{1}{3}\ \text{სთ}$; $s = v t$.
HEN: $20\ \text{min} = \dfrac{1}{3}\ \text{h}$; $s = v t$.
SKA: **ფორმულა:** $s = v t$
**რიცხვები:** $s = 18 \cdot \dfrac{1}{3} = 6\ \text{კმ}$
SEN: **Formula:** $s = v t$
**Numbers:** $s = 18 \cdot \dfrac{1}{3} = 6\ \text{km}$
AKA: $6\ \text{კმ}$
AEN: $6\ \text{km}$

--- easy speed
KA: სინათლე მზიდან დედამიწამდე დაახლოებით $500\ \text{წმ}$-ში აღწევს. სინათლის სიჩქარეა $3 \cdot 10^8\ \text{მ/წმ}$. იპოვეთ მანძილი მზემდე.
EN: Light takes about $500\ \text{s}$ to reach the Earth from the Sun. The speed of light is $3 \cdot 10^8\ \text{m/s}$. Find the distance to the Sun.
HKA: $s = v t$.
HEN: $s = v t$.
SKA: **ფორმულა:** $s = v t$
**რიცხვები:** $s = 3 \cdot 10^8 \cdot 500 = 1{,}5 \cdot 10^{11}\ \text{მ} = 150$ მილიონი კმ
SEN: **Formula:** $s = v t$
**Numbers:** $s = 3 \cdot 10^8 \cdot 500 = 1.5 \cdot 10^{11}\ \text{m} = 150$ million km
AKA: $1{,}5 \cdot 10^{11}\ \text{მ}$
AEN: $1.5 \cdot 10^{11}\ \text{m}$

--- easy speed
KA: გეპარდი $30\ \text{მ/წმ}$-ით დარბის, ანტილოპა — $72\ \text{კმ/სთ}$-ით. ვინ უფრო სწრაფია?
EN: A cheetah runs at $30\ \text{m/s}$, an antelope at $72\ \text{km/h}$. Which is faster?
HKA: ორივე სიჩქარე ერთ ერთეულში გადაიყვანეთ.
HEN: Express both speeds in the same unit.
SKA: $72\ \text{კმ/სთ} = 72 : 3{,}6 = 20\ \text{მ/წმ}$
$30\ \text{მ/წმ} > 20\ \text{მ/წმ}$ — გეპარდი უფრო სწრაფია.
SEN: $72\ \text{km/h} = 72 : 3.6 = 20\ \text{m/s}$
$30\ \text{m/s} > 20\ \text{m/s}$ — the cheetah is faster.
AKA: გეპარდი
AEN: the cheetah

--- easy speed
KA: მანქანა $90\ \text{კმ/სთ}$-ით მოძრაობს. რა დროში გაივლის ის $315\ \text{კმ}$-ს?
EN: A car moves at $90\ \text{km/h}$. How long does it take to cover $315\ \text{km}$?
HKA: $t = \dfrac{s}{v}$.
HEN: $t = \dfrac{s}{v}$.
SKA: **ფორმულა:** $t = \dfrac{s}{v}$
**რიცხვები:** $t = \dfrac{315}{90} = 3{,}5\ \text{სთ} = 3\ \text{სთ}\ 30\ \text{წთ}$
SEN: **Formula:** $t = \dfrac{s}{v}$
**Numbers:** $t = \dfrac{315}{90} = 3.5\ \text{h} = 3\ \text{h}\ 30\ \text{min}$
AKA: $3{,}5\ \text{სთ}$
AEN: $3.5\ \text{h}$

--- easy speed
KA: თანაბრად მოძრავი სხეული $5\ \text{წმ}$-ში $40\ \text{მ}$-ს გადის. რა მანძილს გაივლის ის $12\ \text{წმ}$-ში?
EN: A body moving uniformly covers $40\ \text{m}$ in $5\ \text{s}$. How far does it go in $12\ \text{s}$?
HKA: ჯერ იპოვეთ სიჩქარე.
HEN: Find the speed first.
SKA: $v = \dfrac{40}{5} = 8\ \text{მ/წმ}$
$s = 8 \cdot 12 = 96\ \text{მ}$
SEN: $v = \dfrac{40}{5} = 8\ \text{m/s}$
$s = 8 \cdot 12 = 96\ \text{m}$
AKA: $96\ \text{მ}$
AEN: $96\ \text{m}$

--- easy speed
KA: ქვეითი $5\ \text{კმ/სთ}$-ით მიდის. რამდენ მეტრს გადის ის ერთ წუთში?
EN: A pedestrian walks at $5\ \text{km/h}$. How many metres does the pedestrian cover per minute?
HKA: $5\ \text{კმ} = 5000\ \text{მ}$, $1\ \text{სთ} = 60\ \text{წთ}$.
HEN: $5\ \text{km} = 5000\ \text{m}$, $1\ \text{h} = 60\ \text{min}$.
SKA: $\dfrac{5000\ \text{მ}}{60\ \text{წთ}} \approx 83\ \text{მ/წთ}$
SEN: $\dfrac{5000\ \text{m}}{60\ \text{min}} \approx 83\ \text{m/min}$
AKA: $\approx 83\ \text{მ}$
AEN: $\approx 83\ \text{m}$

--- easy speed
KA: ექოლოტმა ზღვის ფსკერისკენ ხმა გაგზავნა და არეკლილი სიგნალი $2\ \text{წმ}$-ის შემდეგ მიიღო. ხმის სიჩქარე წყალში $1500\ \text{მ/წმ}$-ია. რას უდრის ზღვის სიღრმე?
EN: An echo sounder sends sound to the sea floor and receives the echo $2\ \text{s}$ later. The speed of sound in water is $1500\ \text{m/s}$. How deep is the sea?
HKA: ხმა სიღრმეს ორჯერ გადის — ქვემოთ და უკან.
HEN: The sound travels the depth twice — down and back.
SKA: **ფორმულა:** $2h = v t \Rightarrow h = \dfrac{v t}{2}$
**რიცხვები:** $h = \dfrac{1500 \cdot 2}{2} = 1500\ \text{მ}$
SEN: **Formula:** $2h = v t \Rightarrow h = \dfrac{v t}{2}$
**Numbers:** $h = \dfrac{1500 \cdot 2}{2} = 1500\ \text{m}$
AKA: $1500\ \text{მ}$
AEN: $1500\ \text{m}$

--- easy speed
KA: ორი მატარებელი ერთმანეთის შესახვედრად მოძრაობს $50\ \text{კმ/სთ}$ და $70\ \text{კმ/სთ}$ სიჩქარით. მათ შორის მანძილია $360\ \text{კმ}$. რა დროში შეხვდებიან?
EN: Two trains move towards each other at $50\ \text{km/h}$ and $70\ \text{km/h}$. They are $360\ \text{km}$ apart. When will they meet?
HKA: შემხვედრი მოძრაობისას მანძილი მცირდება სიჩქარეთა ჯამით.
HEN: When moving towards each other, the gap closes at the sum of the speeds.
SKA: **ფორმულა:** $t = \dfrac{s}{v_1 + v_2}$
**რიცხვები:** $t = \dfrac{360}{50 + 70} = 3\ \text{სთ}$
SEN: **Formula:** $t = \dfrac{s}{v_1 + v_2}$
**Numbers:** $t = \dfrac{360}{50 + 70} = 3\ \text{h}$
AKA: $3\ \text{სთ}$
AEN: $3\ \text{h}$

--- easy speed
KA: გრაფიკზე ნაჩვენებია, რომ სხეული პირველ $2\ \text{წმ}$-ში $6\ \text{მ}$-ს გადის, შემდეგ $3\ \text{წმ}$ დგას. რას უდრის სიჩქარე მოძრაობის პირველ ეტაპზე და მეორეზე?
EN: A graph shows a body covers $6\ \text{m}$ in the first $2\ \text{s}$ and then stands still for $3\ \text{s}$. What is its speed in the first stage and in the second?
HKA: დგომისას გზა არ იზრდება — $s(t)$ გრაფიკი ჰორიზონტალურია.
HEN: While standing still the path does not grow — the $s(t)$ graph is horizontal.
SKA: პირველ ეტაპზე: $v_1 = \dfrac{6}{2} = 3\ \text{მ/წმ}$
მეორეზე: $v_2 = \dfrac{0}{3} = 0$
SEN: First stage: $v_1 = \dfrac{6}{2} = 3\ \text{m/s}$
Second: $v_2 = \dfrac{0}{3} = 0$
AKA: $3\ \text{მ/წმ}$ და $0$
AEN: $3\ \text{m/s}$ and $0$

--- easy speed
KA: ტყვია $800\ \text{მ/წმ}$-ით მოძრაობს. რა დროში გაივლის ის $200\ \text{მ}$-ს?
EN: A bullet moves at $800\ \text{m/s}$. How long does it take to cover $200\ \text{m}$?
HKA: $t = \dfrac{s}{v}$.
HEN: $t = \dfrac{s}{v}$.
SKA: $t = \dfrac{200}{800} = 0{,}25\ \text{წმ}$
SEN: $t = \dfrac{200}{800} = 0.25\ \text{s}$
AKA: $0{,}25\ \text{წმ}$
AEN: $0.25\ \text{s}$

--- easy speed
KA: ველოსიპედისტმა $3\ \text{სთ}$-ში $45\ \text{კმ}$ გაიარა, ხოლო ქვეითმა $2\ \text{სთ}$-ში $10\ \text{კმ}$. რამდენჯერ სწრაფად მოძრაობს ველოსიპედისტი?
EN: A cyclist rode $45\ \text{km}$ in $3\ \text{h}$; a pedestrian walked $10\ \text{km}$ in $2\ \text{h}$. How many times faster is the cyclist?
HKA: იპოვეთ ორივე სიჩქარე და შეადარეთ.
HEN: Find both speeds and compare them.
SKA: $v_1 = \dfrac{45}{3} = 15\ \text{კმ/სთ}$, $\ v_2 = \dfrac{10}{2} = 5\ \text{კმ/სთ}$
$\dfrac{v_1}{v_2} = 3$
SEN: $v_1 = \dfrac{45}{3} = 15\ \text{km/h}$, $\ v_2 = \dfrac{10}{2} = 5\ \text{km/h}$
$\dfrac{v_1}{v_2} = 3$
AKA: $3$-ჯერ
AEN: $3$ times

--- easy speed
KA: ავტობუსი $60\ \text{კმ/სთ}$-ით მოძრაობს. ააგეთ მისი $s(t)$ გრაფიკის ცხრილი $t = 0;\ 1;\ 2;\ 3\ \text{სთ}$-თვის. როგორი წირია გრაფიკი?
EN: A bus moves at $60\ \text{km/h}$. Make a table for its $s(t)$ graph at $t = 0;\ 1;\ 2;\ 3\ \text{h}$. What kind of line is the graph?
HKA: $s = v t$ — გზა დროის პროპორციულია.
HEN: $s = v t$ — the path is proportional to time.
SKA: $t = 0 \to s = 0$; $\ t = 1 \to 60\ \text{კმ}$; $\ t = 2 \to 120\ \text{კმ}$; $\ t = 3 \to 180\ \text{კმ}$.
გრაფიკი სათავეზე გამავალი წრფეა.
SEN: $t = 0 \to s = 0$; $\ t = 1 \to 60\ \text{km}$; $\ t = 2 \to 120\ \text{km}$; $\ t = 3 \to 180\ \text{km}$.
The graph is a straight line through the origin.
AKA: $0;\ 60;\ 120;\ 180\ \text{კმ}$; სათავეზე გამავალი წრფე
AEN: $0;\ 60;\ 120;\ 180\ \text{km}$; a straight line through the origin

--- medium speed
KA: მანქანამ $2\ \text{სთ}$ $80\ \text{კმ/სთ}$-ით იმოძრავა, შემდეგ $1\ \text{სთ}$ — $50\ \text{კმ/სთ}$-ით. იპოვეთ საშუალო სიჩქარე.
EN: A car drove for $2\ \text{h}$ at $80\ \text{km/h}$, then for $1\ \text{h}$ at $50\ \text{km/h}$. Find the average speed.
HKA: $v_{\text{საშ}} = \dfrac{\text{მთელი გზა}}{\text{მთელი დრო}}$.
HEN: $v_{\text{avg}} = \dfrac{\text{total path}}{\text{total time}}$.
SKA: $s = 2 \cdot 80 + 1 \cdot 50 = 210\ \text{კმ}$, $\ t = 3\ \text{სთ}$
$v_{\text{საშ}} = \dfrac{210}{3} = 70\ \text{კმ/სთ}$
SEN: $s = 2 \cdot 80 + 1 \cdot 50 = 210\ \text{km}$, $\ t = 3\ \text{h}$
$v_{\text{avg}} = \dfrac{210}{3} = 70\ \text{km/h}$
AKA: $70\ \text{კმ/სთ}$
AEN: $70\ \text{km/h}$

--- medium speed
KA: სტუდენტი სახლიდან სადგურამდე $1{,}2\ \text{კმ}$-ს $4\ \text{კმ/სთ}$-ით გადის. მატარებელი $8{:}00$-ზე გადის. როდის უნდა გამოვიდეს სახლიდან, რომ $2$ წუთით ადრე მივიდეს?
EN: A student walks $1.2\ \text{km}$ from home to the station at $4\ \text{km/h}$. The train leaves at $8{:}00$. When must the student leave home to arrive $2$ minutes early?
HKA: გამოთვალეთ სიარულის დრო წუთებში.
HEN: Work out the walking time in minutes.
SKA: $t = \dfrac{1{,}2}{4} = 0{,}3\ \text{სთ} = 18\ \text{წთ}$
სადგურში $7{:}58$-ზე უნდა იყოს, ე.ი. გამოვიდეს $7{:}58 - 18\ \text{წთ} = 7{:}40$-ზე.
SEN: $t = \dfrac{1.2}{4} = 0.3\ \text{h} = 18\ \text{min}$
The student must be there at $7{:}58$, so leave at $7{:}58 - 18\ \text{min} = 7{:}40$.
AKA: $7{:}40$-ზე
AEN: at $7{:}40$

--- medium speed
KA: ნავი დინების მიმართულებით $12\ \text{კმ/სთ}$-ით მოძრაობს, დინების საწინააღმდეგოდ — $8\ \text{კმ/სთ}$-ით. იპოვეთ ნავის სიჩქარე წყლის მიმართ და დინების სიჩქარე.
EN: A boat moves downstream at $12\ \text{km/h}$ and upstream at $8\ \text{km/h}$. Find the boat's speed relative to the water and the speed of the current.
HKA: $v + u = 12$, $v - u = 8$.
HEN: $v + u = 12$, $v - u = 8$.
SKA: **ფორმულა:** $v = \dfrac{v_1 + v_2}{2}$, $\ u = \dfrac{v_1 - v_2}{2}$
**რიცხვები:** $v = \dfrac{12 + 8}{2} = 10\ \text{კმ/სთ}$, $\ u = \dfrac{12 - 8}{2} = 2\ \text{კმ/სთ}$
SEN: **Formula:** $v = \dfrac{v_1 + v_2}{2}$, $\ u = \dfrac{v_1 - v_2}{2}$
**Numbers:** $v = \dfrac{12 + 8}{2} = 10\ \text{km/h}$, $\ u = \dfrac{12 - 8}{2} = 2\ \text{km/h}$
AKA: $10\ \text{კმ/სთ}$; $2\ \text{კმ/სთ}$
AEN: $10\ \text{km/h}$; $2\ \text{km/h}$

--- medium speed
KA: მოტოციკლისტი მანქანას მისდევს. მათ შორის მანძილია $2\ \text{კმ}$, მოტოციკლისტის სიჩქარეა $25\ \text{მ/წმ}$, მანქანის — $15\ \text{მ/წმ}$. რა დროში დაეწევა?
EN: A motorcyclist chases a car $2\ \text{km}$ ahead. The motorcyclist moves at $25\ \text{m/s}$, the car at $15\ \text{m/s}$. How long until the motorcyclist catches up?
HKA: დაწევისას მანძილი მცირდება სიჩქარეთა სხვაობით.
HEN: When chasing, the gap closes at the difference of the speeds.
SKA: **ფორმულა:** $t = \dfrac{s}{v_1 - v_2}$
**რიცხვები:** $t = \dfrac{2000}{25 - 15} = 200\ \text{წმ} \approx 3{,}3\ \text{წთ}$
SEN: **Formula:** $t = \dfrac{s}{v_1 - v_2}$
**Numbers:** $t = \dfrac{2000}{25 - 15} = 200\ \text{s} \approx 3.3\ \text{min}$
AKA: $200\ \text{წმ}$
AEN: $200\ \text{s}$

--- medium speed
KA: ელვის გაელვებიდან ქუხილის გაგონებამდე $6\ \text{წმ}$ გავიდა, $1$ წუთის შემდეგ კი — $3\ \text{წმ}$. უახლოვდება თუ შორდება ჭექა-ქუხილი და რა საშუალო სიჩქარით? ($v_{\text{ხმ}} = 340\ \text{მ/წმ}$)
EN: The gap between lightning and thunder was $6\ \text{s}$, and a minute later it was $3\ \text{s}$. Is the storm approaching or receding, and at what average speed? ($v_{\text{sound}} = 340\ \text{m/s}$)
HKA: ორივე შემთხვევაში იპოვეთ მანძილი $s = v t$.
HEN: Find the distance $s = v t$ in both cases.
SKA: $s_1 = 340 \cdot 6 = 2040\ \text{მ}$, $\ s_2 = 340 \cdot 3 = 1020\ \text{მ}$ — ქარიშხალი უახლოვდება.
$v = \dfrac{2040 - 1020}{60} = 17\ \text{მ/წმ}$
SEN: $s_1 = 340 \cdot 6 = 2040\ \text{m}$, $\ s_2 = 340 \cdot 3 = 1020\ \text{m}$ — the storm is approaching.
$v = \dfrac{2040 - 1020}{60} = 17\ \text{m/s}$
AKA: უახლოვდება, $17\ \text{მ/წმ}$
AEN: approaching, at $17\ \text{m/s}$

--- medium speed
KA: ორი სხეულის კოორდინატი დროზე ასე დამოკიდებული: $x_1 = 5t$, $\ x_2 = 100 - 15t$ (მეტრი, წამი). როდის და სად შეხვდებიან?
EN: The coordinates of two bodies are $x_1 = 5t$ and $x_2 = 100 - 15t$ (metres, seconds). When and where do they meet?
HKA: შეხვედრისას $x_1 = x_2$.
HEN: At the meeting $x_1 = x_2$.
SKA: $5t = 100 - 15t \Rightarrow 20t = 100 \Rightarrow t = 5\ \text{წმ}$
$x = 5 \cdot 5 = 25\ \text{მ}$
SEN: $5t = 100 - 15t \Rightarrow 20t = 100 \Rightarrow t = 5\ \text{s}$
$x = 5 \cdot 5 = 25\ \text{m}$
AKA: $t = 5\ \text{წმ}$, $x = 25\ \text{მ}$
AEN: $t = 5\ \text{s}$, $x = 25\ \text{m}$

--- medium speed
KA: მატარებელი $54\ \text{კმ/სთ}$-ით მოძრაობს და $300\ \text{მ}$ სიგრძის გვირაბს $30\ \text{წმ}$-ში მთლიანად გადის. რას უდრის მატარებლის სიგრძე?
EN: A train moving at $54\ \text{km/h}$ passes completely through a $300\ \text{m}$ tunnel in $30\ \text{s}$. How long is the train?
HKA: მთლიანად გასვლისას მატარებელი გადის გვირაბის და საკუთარი სიგრძის ჯამს.
HEN: To pass through completely the train covers the tunnel length plus its own length.
SKA: $v = 54 : 3{,}6 = 15\ \text{მ/წმ}$
$L + l = v t = 15 \cdot 30 = 450\ \text{მ} \Rightarrow l = 450 - 300 = 150\ \text{მ}$
SEN: $v = 54 : 3.6 = 15\ \text{m/s}$
$L + l = v t = 15 \cdot 30 = 450\ \text{m} \Rightarrow l = 450 - 300 = 150\ \text{m}$
AKA: $150\ \text{მ}$
AEN: $150\ \text{m}$

--- medium speed
KA: ქვეითმა გზის პირველი $3\ \text{კმ}$ $1\ \text{სთ}$-ში გაიარა, შემდეგ $30\ \text{წთ}$ ისვენა, ბოლოს $4\ \text{კმ}$ $1{,}5\ \text{სთ}$-ში. იპოვეთ საშუალო სიჩქარე მთელ გზაზე (დასვენების ჩათვლით).
EN: A walker covered the first $3\ \text{km}$ in $1\ \text{h}$, rested for $30\ \text{min}$, then walked $4\ \text{km}$ in $1.5\ \text{h}$. Find the average speed for the whole trip (including the rest).
HKA: დასვენების დროც მთლიან დროში შედის.
HEN: The rest time counts in the total time.
SKA: $s = 3 + 4 = 7\ \text{კმ}$, $\ t = 1 + 0{,}5 + 1{,}5 = 3\ \text{სთ}$
$v_{\text{საშ}} = \dfrac{7}{3} \approx 2{,}3\ \text{კმ/სთ}$
SEN: $s = 3 + 4 = 7\ \text{km}$, $\ t = 1 + 0.5 + 1.5 = 3\ \text{h}$
$v_{\text{avg}} = \dfrac{7}{3} \approx 2.3\ \text{km/h}$
AKA: $\approx 2{,}3\ \text{კმ/სთ}$
AEN: $\approx 2.3\ \text{km/h}$

--- medium speed
KA: ორი ქალაქიდან, რომელთა შორის $150\ \text{კმ}$-ია, ერთდროულად ერთმანეთის შესახვედრად გამოვიდა მანქანა ($60\ \text{კმ/სთ}$) და ავტობუსი ($40\ \text{კმ/სთ}$). რა დროში და პირველი ქალაქიდან რა მანძილზე შეხვდებიან?
EN: A car ($60\ \text{km/h}$) and a bus ($40\ \text{km/h}$) set off at the same time towards each other from two towns $150\ \text{km}$ apart. When and how far from the car's town do they meet?
HKA: $t = \dfrac{s}{v_1 + v_2}$, მანძილი $x = v_1 t$.
HEN: $t = \dfrac{s}{v_1 + v_2}$, distance $x = v_1 t$.
SKA: $t = \dfrac{150}{60 + 40} = 1{,}5\ \text{სთ}$
$x = 60 \cdot 1{,}5 = 90\ \text{კმ}$
SEN: $t = \dfrac{150}{60 + 40} = 1.5\ \text{h}$
$x = 60 \cdot 1.5 = 90\ \text{km}$
AKA: $1{,}5\ \text{სთ}$-ში, $90\ \text{კმ}$-ზე
AEN: after $1.5\ \text{h}$, $90\ \text{km}$ away

--- medium speed
KA: ესკალატორი $0{,}8\ \text{მ/წმ}$-ით მოძრაობს, მისი სიგრძეა $48\ \text{მ}$. ადამიანი ესკალატორზე მაღლა $0{,}4\ \text{მ/წმ}$-ით მიდის (ესკალატორის მიმართ). რა დროში ავა ზემოთ?
EN: An escalator moves at $0.8\ \text{m/s}$ and is $48\ \text{m}$ long. A person walks up it at $0.4\ \text{m/s}$ relative to the steps. How long does it take to reach the top?
HKA: მიწის მიმართ სიჩქარეები იკრიბება.
HEN: Relative to the ground the speeds add.
SKA: $v = 0{,}8 + 0{,}4 = 1{,}2\ \text{მ/წმ}$
$t = \dfrac{48}{1{,}2} = 40\ \text{წმ}$
SEN: $v = 0.8 + 0.4 = 1.2\ \text{m/s}$
$t = \dfrac{48}{1.2} = 40\ \text{s}$
AKA: $40\ \text{წმ}$
AEN: $40\ \text{s}$

--- medium speed
KA: სხეულის კოორდინატი $x = 20 - 4t$ (მ, წმ) კანონით იცვლება. იპოვეთ საწყისი კოორდინატი, სიჩქარე და მისი მიმართულება. როდის გაივლის სხეული სათავეზე?
EN: A body's coordinate changes as $x = 20 - 4t$ (m, s). Find the initial coordinate, the speed and its direction. When does the body pass the origin?
HKA: თანაბარი მოძრაობის განტოლებაა $x = x_0 + v t$.
HEN: The equation of uniform motion is $x = x_0 + v t$.
SKA: $x_0 = 20\ \text{მ}$, $\ v = -4\ \text{მ/წმ}$ — სხეული $x$ ღერძის საწინააღმდეგოდ მოძრაობს, სიჩქარის მოდულია $4\ \text{მ/წმ}$.
$0 = 20 - 4t \Rightarrow t = 5\ \text{წმ}$
SEN: $x_0 = 20\ \text{m}$, $\ v = -4\ \text{m/s}$ — the body moves against the $x$ axis with speed $4\ \text{m/s}$.
$0 = 20 - 4t \Rightarrow t = 5\ \text{s}$
AKA: $20\ \text{მ}$; $4\ \text{მ/წმ}$ ღერძის საწინააღმდეგოდ; $5\ \text{წმ}$-ში
AEN: $20\ \text{m}$; $4\ \text{m/s}$ against the axis; at $5\ \text{s}$

--- medium speed
KA: ორ ქალაქს შორის მანძილი $240\ \text{კმ}$-ია. ავტობუსი $60\ \text{კმ/სთ}$-ით მიდის, მანქანა $80\ \text{კმ/სთ}$-ით. რამდენი ხნით ადრე უნდა გავიდეს ავტობუსი, რომ ორივე ერთად ჩავიდნენ?
EN: Two towns are $240\ \text{km}$ apart. A bus goes at $60\ \text{km/h}$, a car at $80\ \text{km/h}$. How much earlier must the bus leave so that both arrive together?
HKA: გამოთვალეთ თითოეულის მგზავრობის დრო.
HEN: Work out each journey time.
SKA: $t_1 = \dfrac{240}{60} = 4\ \text{სთ}$, $\ t_2 = \dfrac{240}{80} = 3\ \text{სთ}$
$\Delta t = 1\ \text{სთ}$
SEN: $t_1 = \dfrac{240}{60} = 4\ \text{h}$, $\ t_2 = \dfrac{240}{80} = 3\ \text{h}$
$\Delta t = 1\ \text{h}$
AKA: $1$ საათით ადრე
AEN: $1$ hour earlier

--- medium speed
KA: ქვეითი სადგურიდან $5\ \text{კმ/სთ}$-ით გავიდა. $1{,}2\ \text{სთ}$-ის შემდეგ იმავე გზით $20\ \text{კმ/სთ}$-ით გაჰყვა ველოსიპედისტი. რა დროში დაეწევა ველოსიპედისტი ქვეითს?
EN: A walker leaves a station at $5\ \text{km/h}$. $1.2\ \text{h}$ later a cyclist follows on the same road at $20\ \text{km/h}$. How long after setting off does the cyclist catch the walker?
HKA: ველოსიპედისტის გასვლის მომენტში ქვეითი უკვე $5 \cdot 1{,}2$ კმ-ზეა.
HEN: When the cyclist sets off the walker is already $5 \cdot 1.2$ km ahead.
SKA: $s_0 = 5 \cdot 1{,}2 = 6\ \text{კმ}$
$t = \dfrac{6}{20 - 5} = 0{,}4\ \text{სთ} = 24\ \text{წთ}$
SEN: $s_0 = 5 \cdot 1.2 = 6\ \text{km}$
$t = \dfrac{6}{20 - 5} = 0.4\ \text{h} = 24\ \text{min}$
AKA: $24\ \text{წთ}$
AEN: $24\ \text{min}$

--- medium speed
KA: მანქანის სპიდომეტრი $72\ \text{კმ/სთ}$-ს აჩვენებს. რამდენ მეტრს გადის მანქანა იმ $1{,}5\ \text{წმ}$-ში, სანამ მძღოლი საფრთხეს დაინახავს და მუხრუჭს დააჭერს?
EN: A car's speedometer shows $72\ \text{km/h}$. How many metres does it travel during the $1.5\ \text{s}$ between the driver seeing a hazard and pressing the brake?
HKA: რეაქციის დროს მანქანა უცვლელი სიჩქარით მოძრაობს.
HEN: During the reaction time the car keeps its speed.
SKA: $v = 72 : 3{,}6 = 20\ \text{მ/წმ}$
$s = 20 \cdot 1{,}5 = 30\ \text{მ}$
SEN: $v = 72 : 3.6 = 20\ \text{m/s}$
$s = 20 \cdot 1.5 = 30\ \text{m}$
AKA: $30\ \text{მ}$
AEN: $30\ \text{m}$

--- medium speed
KA: ქარის გარეშე თვითმფრინავი $800\ \text{კმ/სთ}$-ით მიფრინავს. რა დრო დასჭირდება $1200\ \text{კმ}$-ის გაფრენას, თუ ქარი $100\ \text{კმ/სთ}$-ით უბერავს: ა) ზურგიდან; ბ) წინიდან?
EN: In still air a plane flies at $800\ \text{km/h}$. How long does it take to fly $1200\ \text{km}$ if a $100\ \text{km/h}$ wind blows: a) from behind; b) head-on?
HKA: ზურგის ქარი სიჩქარეს ემატება, შემხვედრი — აკლდება.
HEN: A tailwind adds to the speed, a headwind subtracts.
SKA: ა) $t = \dfrac{1200}{800 + 100} = \dfrac{4}{3}\ \text{სთ} = 1\ \text{სთ}\ 20\ \text{წთ}$
ბ) $t = \dfrac{1200}{800 - 100} = \dfrac{12}{7}\ \text{სთ} \approx 1{,}71\ \text{სთ} \approx 1\ \text{სთ}\ 43\ \text{წთ}$
SEN: a) $t = \dfrac{1200}{800 + 100} = \dfrac{4}{3}\ \text{h} = 1\ \text{h}\ 20\ \text{min}$
b) $t = \dfrac{1200}{800 - 100} = \dfrac{12}{7}\ \text{h} \approx 1.71\ \text{h} \approx 1\ \text{h}\ 43\ \text{min}$
AKA: ა) $1\ \text{სთ}\ 20\ \text{წთ}$; ბ) $\approx 1\ \text{სთ}\ 43\ \text{წთ}$
AEN: a) $1\ \text{h}\ 20\ \text{min}$; b) $\approx 1\ \text{h}\ 43\ \text{min}$

--- medium speed
KA: სხეული $x$ ღერძზე მოძრაობს. $t = 2\ \text{წმ}$-ზე მისი კოორდინატია $6\ \text{მ}$, $t = 6\ \text{წმ}$-ზე — $18\ \text{მ}$. მოძრაობა თანაბარია. დაწერეთ მოძრაობის განტოლება.
EN: A body moves along the $x$ axis. At $t = 2\ \text{s}$ its coordinate is $6\ \text{m}$, at $t = 6\ \text{s}$ it is $18\ \text{m}$. The motion is uniform. Write the equation of motion.
HKA: $v = \dfrac{\Delta x}{\Delta t}$, შემდეგ $x_0 = x - v t$.
HEN: $v = \dfrac{\Delta x}{\Delta t}$, then $x_0 = x - v t$.
SKA: $v = \dfrac{18 - 6}{6 - 2} = 3\ \text{მ/წმ}$
$x_0 = 6 - 3 \cdot 2 = 0$
$x = 3t$
SEN: $v = \dfrac{18 - 6}{6 - 2} = 3\ \text{m/s}$
$x_0 = 6 - 3 \cdot 2 = 0$
$x = 3t$
AKA: $x = 3t$
AEN: $x = 3t$

--- medium speed
KA: ტურისტმა გზის $\dfrac{2}{3}$ $6\ \text{კმ/სთ}$-ით გაიარა, დარჩენილი $\dfrac{1}{3}$ — $3\ \text{კმ/სთ}$-ით. მთელი გზა $12\ \text{კმ}$-ია. იპოვეთ საშუალო სიჩქარე.
EN: A hiker covered $\dfrac{2}{3}$ of the route at $6\ \text{km/h}$ and the remaining $\dfrac{1}{3}$ at $3\ \text{km/h}$. The route is $12\ \text{km}$. Find the average speed.
HKA: ცალ-ცალკე იპოვეთ ორი მონაკვეთის დრო.
HEN: Find the time of each part separately.
SKA: $t_1 = \dfrac{8}{6} = \dfrac{4}{3}\ \text{სთ}$, $\ t_2 = \dfrac{4}{3}\ \text{სთ}$
$v_{\text{საშ}} = \dfrac{12}{8/3} = 4{,}5\ \text{კმ/სთ}$
SEN: $t_1 = \dfrac{8}{6} = \dfrac{4}{3}\ \text{h}$, $\ t_2 = \dfrac{4}{3}\ \text{h}$
$v_{\text{avg}} = \dfrac{12}{8/3} = 4.5\ \text{km/h}$
AKA: $4{,}5\ \text{კმ/სთ}$
AEN: $4.5\ \text{km/h}$

--- medium speed
KA: სარბენ ბილიკზე ($400\ \text{მ}$) ორი მორბენალი ერთი წერტილიდან ერთი მიმართულებით გაიქცა $5\ \text{მ/წმ}$ და $4\ \text{მ/წმ}$ სიჩქარით. რა დროის შემდეგ გაუსწრებს პირველი მეორეს ერთი წრით?
EN: Two runners start together from one point on a $400\ \text{m}$ track in the same direction at $5\ \text{m/s}$ and $4\ \text{m/s}$. After what time does the first lap the second?
HKA: გასწრებისთვის პირველმა მეორეზე $400\ \text{მ}$-ით მეტი უნდა გაირბინოს.
HEN: To lap the other, the first runner must cover $400\ \text{m}$ more.
SKA: $t = \dfrac{400}{5 - 4} = 400\ \text{წმ} \approx 6{,}7\ \text{წთ}$
SEN: $t = \dfrac{400}{5 - 4} = 400\ \text{s} \approx 6.7\ \text{min}$
AKA: $400\ \text{წმ}$
AEN: $400\ \text{s}$

--- hard speed
KA: მანქანამ გზის პირველი ნახევარი $v_1$ სიჩქარით გაიარა, მეორე — $v_2 = 2v_1$-ით. მთელ გზაზე საშუალო სიჩქარე $48\ \text{კმ/სთ}$ აღმოჩნდა. იპოვეთ $v_1$ და $v_2$.
EN: A car drove the first half of the distance at $v_1$ and the second at $v_2 = 2v_1$. The average speed for the whole trip was $48\ \text{km/h}$. Find $v_1$ and $v_2$.
HKA: ნახევარ-ნახევარ გზაზე $v_{\text{საშ}} = \dfrac{2v_1 v_2}{v_1 + v_2}$.
HEN: For equal halves of the distance $v_{\text{avg}} = \dfrac{2v_1 v_2}{v_1 + v_2}$.
SKA: **ფორმულა:** $v_{\text{საშ}} = \dfrac{2 v_1 \cdot 2v_1}{3 v_1} = \dfrac{4}{3} v_1$
**რიცხვები:** $v_1 = \dfrac{3 \cdot 48}{4} = 36\ \text{კმ/სთ}$, $\ v_2 = 72\ \text{კმ/სთ}$
SEN: **Formula:** $v_{\text{avg}} = \dfrac{2 v_1 \cdot 2v_1}{3 v_1} = \dfrac{4}{3} v_1$
**Numbers:** $v_1 = \dfrac{3 \cdot 48}{4} = 36\ \text{km/h}$, $\ v_2 = 72\ \text{km/h}$
AKA: $36\ \text{კმ/სთ}$ და $72\ \text{კმ/სთ}$
AEN: $36\ \text{km/h}$ and $72\ \text{km/h}$

--- hard speed
KA: ნავი A-დან B-მდე დინების მიმართულებით $3\ \text{სთ}$-ში მიდის, უკან — $6\ \text{სთ}$-ში. რა დროში ჩაცურავს A-დან B-მდე ტივი?
EN: A boat goes downstream from A to B in $3\ \text{h}$ and returns in $6\ \text{h}$. How long would a raft take to drift from A to B?
HKA: $s = 3(v + u) = 6(v - u)$; ტივი $u$ სიჩქარით მოძრაობს.
HEN: $s = 3(v + u) = 6(v - u)$; the raft moves at speed $u$.
SKA: $3v + 3u = 6v - 6u \Rightarrow v = 3u$
$s = 3(3u + u) = 12u$
$t_{\text{ტივი}} = \dfrac{s}{u} = 12\ \text{სთ}$
SEN: $3v + 3u = 6v - 6u \Rightarrow v = 3u$
$s = 3(3u + u) = 12u$
$t_{\text{raft}} = \dfrac{s}{u} = 12\ \text{h}$
AKA: $12\ \text{სთ}$
AEN: $12\ \text{h}$

--- hard speed
KA: მატარებლის მგზავრი ამჩნევს, რომ შემხვედრი მატარებელი, რომლის სიგრძეა $210\ \text{მ}$, მის ფანჯარასთან $6\ \text{წმ}$-ში ჩაიარა. პირველი მატარებლის სიჩქარეა $54\ \text{კმ/სთ}$. იპოვეთ მეორის სიჩქარე.
EN: A passenger notices that an oncoming train $210\ \text{m}$ long passes their window in $6\ \text{s}$. The passenger's train moves at $54\ \text{km/h}$. Find the other train's speed.
HKA: მგზავრის მიმართ შემხვედრი მატარებლის სიჩქარეა $v_1 + v_2$.
HEN: Relative to the passenger the oncoming train moves at $v_1 + v_2$.
SKA: $v_1 + v_2 = \dfrac{210}{6} = 35\ \text{მ/წმ}$
$v_1 = 15\ \text{მ/წმ} \Rightarrow v_2 = 20\ \text{მ/წმ} = 72\ \text{კმ/სთ}$
SEN: $v_1 + v_2 = \dfrac{210}{6} = 35\ \text{m/s}$
$v_1 = 15\ \text{m/s} \Rightarrow v_2 = 20\ \text{m/s} = 72\ \text{km/h}$
AKA: $72\ \text{კმ/სთ}$
AEN: $72\ \text{km/h}$

--- hard speed
KA: ორი ქალაქიდან, რომელთა შორის $100\ \text{კმ}$-ია, ერთმანეთის შესახვედრად გამოვიდნენ ველოსიპედისტი ($20\ \text{კმ/სთ}$) $9{:}00$-ზე და მოტოციკლისტი ($60\ \text{კმ/სთ}$) $10{:}00$-ზე. როდის და ველოსიპედისტის ქალაქიდან რა მანძილზე შეხვდებიან?
EN: Two towns are $100\ \text{km}$ apart. A cyclist ($20\ \text{km/h}$) leaves one at $9{:}00$ and a motorcyclist ($60\ \text{km/h}$) leaves the other at $10{:}00$, heading towards each other. When and how far from the cyclist's town do they meet?
HKA: $10{:}00$-მდე ველოსიპედისტი $20\ \text{კმ}$-ს გადის. შემდეგ — შემხვედრი მოძრაობა.
HEN: By $10{:}00$ the cyclist has covered $20\ \text{km}$. After that it's motion towards each other.
SKA: $10{:}00$-ზე მათ შორის $100 - 20 = 80\ \text{კმ}$-ია.
$t = \dfrac{80}{20 + 60} = 1\ \text{სთ}$ — შეხვდებიან $11{:}00$-ზე.
ველოსიპედისტი გაივლის $20 \cdot 2 = 40\ \text{კმ}$-ს.
SEN: At $10{:}00$ they are $100 - 20 = 80\ \text{km}$ apart.
$t = \dfrac{80}{20 + 60} = 1\ \text{h}$ — they meet at $11{:}00$.
The cyclist has covered $20 \cdot 2 = 40\ \text{km}$.
AKA: $11{:}00$-ზე, $40\ \text{კმ}$-ზე
AEN: at $11{:}00$, $40\ \text{km}$ away

--- hard speed
KA: მანქანამ დროის პირველი $\dfrac{1}{4}$ $80\ \text{კმ/სთ}$-ით იმოძრავა, დანარჩენი დრო — $40\ \text{კმ/სთ}$-ით. იპოვეთ საშუალო სიჩქარე.
EN: A car moved for the first $\dfrac{1}{4}$ of the time at $80\ \text{km/h}$ and for the rest of the time at $40\ \text{km/h}$. Find the average speed.
HKA: მთელი დრო აღნიშნეთ $t$-თი და გზა მასით გამოსახეთ.
HEN: Call the total time $t$ and express the path through it.
SKA: $s = 80 \cdot \dfrac{t}{4} + 40 \cdot \dfrac{3t}{4} = 20t + 30t = 50t$
$v_{\text{საშ}} = \dfrac{s}{t} = 50\ \text{კმ/სთ}$
SEN: $s = 80 \cdot \dfrac{t}{4} + 40 \cdot \dfrac{3t}{4} = 20t + 30t = 50t$
$v_{\text{avg}} = \dfrac{s}{t} = 50\ \text{km/h}$
AKA: $50\ \text{კმ/სთ}$
AEN: $50\ \text{km/h}$

--- hard speed
KA: მანქანამ გზის პირველი ნახევარი $60\ \text{კმ/სთ}$-ით გაიარა. რა სიჩქარით უნდა გაიაროს მეორე ნახევარი, რომ საშუალო სიჩქარე $40\ \text{კმ/სთ}$ იყოს?
EN: A car covered the first half of the distance at $60\ \text{km/h}$. At what speed must it cover the second half for the average speed to be $40\ \text{km/h}$?
HKA: $\dfrac{1}{v_{\text{საშ}}} = \dfrac{1}{2}\left(\dfrac{1}{v_1} + \dfrac{1}{v_2}\right)$.
HEN: $\dfrac{1}{v_{\text{avg}}} = \dfrac{1}{2}\left(\dfrac{1}{v_1} + \dfrac{1}{v_2}\right)$.
SKA: $\dfrac{1}{v_2} = \dfrac{2}{40} - \dfrac{1}{60} = \dfrac{3 - 1}{60} = \dfrac{1}{30}$
$v_2 = 30\ \text{კმ/სთ}$
SEN: $\dfrac{1}{v_2} = \dfrac{2}{40} - \dfrac{1}{60} = \dfrac{3 - 1}{60} = \dfrac{1}{30}$
$v_2 = 30\ \text{km/h}$
AKA: $30\ \text{კმ/სთ}$
AEN: $30\ \text{km/h}$

--- hard speed
KA: მგზავრი უძრავ ესკალატორზე $90\ \text{წმ}$-ში ადის, მოძრავ ესკალატორზე, თუ ფეხით მიდის, — $30\ \text{წმ}$-ში. რა დროში აიყვანს ესკალატორი უძრავად მდგომ მგზავრს?
EN: A passenger walks up a stationary escalator in $90\ \text{s}$, and walks up the moving escalator in $30\ \text{s}$. How long does the moving escalator take to carry them up if they stand still?
HKA: სიჩქარეები იკრიბება: $\dfrac{L}{30} = \dfrac{L}{90} + \dfrac{L}{t}$.
HEN: The speeds add: $\dfrac{L}{30} = \dfrac{L}{90} + \dfrac{L}{t}$.
SKA: $\dfrac{1}{t} = \dfrac{1}{30} - \dfrac{1}{90} = \dfrac{3 - 1}{90} = \dfrac{1}{45}$
$t = 45\ \text{წმ}$
SEN: $\dfrac{1}{t} = \dfrac{1}{30} - \dfrac{1}{90} = \dfrac{3 - 1}{90} = \dfrac{1}{45}$
$t = 45\ \text{s}$
AKA: $45\ \text{წმ}$
AEN: $45\ \text{s}$

--- hard speed
KA: სვეტი, რომლის სიგრძეა $400\ \text{მ}$, $1\ \text{მ/წმ}$-ით მოძრაობს. ბოლოდან მესინჯერი $3\ \text{მ/წმ}$-ით სვეტის თავში მირბის, შეტყობინებას გადასცემს და იმავე სიჩქარით უკან ბრუნდება. რა დრო დასჭირდება მთელ გზას?
EN: A column $400\ \text{m}$ long marches at $1\ \text{m/s}$. A messenger runs from the back to the front at $3\ \text{m/s}$, delivers a message and runs back at the same speed. How long does the round trip take?
HKA: სვეტის მიმართ წინ სიჩქარეა $3 - 1$, უკან — $3 + 1$.
HEN: Relative to the column the speed forwards is $3 - 1$, backwards $3 + 1$.
SKA: $t_1 = \dfrac{400}{3 - 1} = 200\ \text{წმ}$, $\ t_2 = \dfrac{400}{3 + 1} = 100\ \text{წმ}$
$t = 300\ \text{წმ} = 5\ \text{წთ}$
SEN: $t_1 = \dfrac{400}{3 - 1} = 200\ \text{s}$, $\ t_2 = \dfrac{400}{3 + 1} = 100\ \text{s}$
$t = 300\ \text{s} = 5\ \text{min}$
AKA: $300\ \text{წმ}$
AEN: $300\ \text{s}$

--- hard speed
KA: მანძილი A-დან B-მდე $60\ \text{კმ}$-ია. მანქანა A-დან B-მდე $60\ \text{კმ/სთ}$-ით მიდის, B-ში $30\ \text{წთ}$ ჩერდება და უკან $40\ \text{კმ/სთ}$-ით ბრუნდება. იპოვეთ საშუალო სიჩქარე მთელ მგზავრობაზე და გადაადგილება.
EN: A to B is $60\ \text{km}$. A car drives from A to B at $60\ \text{km/h}$, stops at B for $30\ \text{min}$, and returns at $40\ \text{km/h}$. Find the average speed for the whole trip and the displacement.
HKA: გზა — $120\ \text{კმ}$; დრო — სამი ნაწილის ჯამი.
HEN: The path is $120\ \text{km}$; the time is the sum of three parts.
SKA: $t = 1 + 0{,}5 + 1{,}5 = 3\ \text{სთ}$
$v_{\text{საშ}} = \dfrac{120}{3} = 40\ \text{კმ/სთ}$
მანქანა საწყის წერტილში დაბრუნდა — გადაადგილება $0$.
SEN: $t = 1 + 0.5 + 1.5 = 3\ \text{h}$
$v_{\text{avg}} = \dfrac{120}{3} = 40\ \text{km/h}$
The car returned to the start — the displacement is $0$.
AKA: $40\ \text{კმ/სთ}$; გადაადგილება $0$
AEN: $40\ \text{km/h}$; displacement $0$

--- hard speed
KA: ორი სხეულის მოძრაობა მოცემულია: $x_1 = -20 + 6t$, $\ x_2 = 40 - 4t$ (მ, წმ). იპოვეთ შეხვედრის დრო და ადგილი, აგრეთვე მანძილი მათ შორის $t = 10\ \text{წმ}$-ზე.
EN: Two bodies move as $x_1 = -20 + 6t$ and $x_2 = 40 - 4t$ (m, s). Find the time and place of meeting, and the distance between them at $t = 10\ \text{s}$.
HKA: შეხვედრისას $x_1 = x_2$; მანძილი — $|x_1 - x_2|$.
HEN: At the meeting $x_1 = x_2$; distance — $|x_1 - x_2|$.
SKA: $-20 + 6t = 40 - 4t \Rightarrow t = 6\ \text{წმ}$, $\ x = -20 + 36 = 16\ \text{მ}$
$t = 10$: $x_1 = 40\ \text{მ}$, $x_2 = 0$; $\ d = 40\ \text{მ}$
SEN: $-20 + 6t = 40 - 4t \Rightarrow t = 6\ \text{s}$, $\ x = -20 + 36 = 16\ \text{m}$
$t = 10$: $x_1 = 40\ \text{m}$, $x_2 = 0$; $\ d = 40\ \text{m}$
AKA: $t = 6\ \text{წმ}$, $x = 16\ \text{მ}$; $40\ \text{მ}$
AEN: $t = 6\ \text{s}$, $x = 16\ \text{m}$; $40\ \text{m}$

--- hard speed
KA: მძღოლმა გამოთვალა, რომ თუ $50\ \text{კმ/სთ}$-ით იმოძრავებს, დანიშნულ დროზე $1$ საათით გვიან ჩავა, ხოლო $75\ \text{კმ/სთ}$-ით — $1$ საათით ადრე. იპოვეთ მანძილი და დანიშნული დრო.
EN: A driver works out that at $50\ \text{km/h}$ they would arrive $1$ hour late, and at $75\ \text{km/h}$, $1$ hour early. Find the distance and the scheduled travel time.
HKA: $s = 50(t + 1) = 75(t - 1)$.
HEN: $s = 50(t + 1) = 75(t - 1)$.
SKA: $50t + 50 = 75t - 75 \Rightarrow 25t = 125 \Rightarrow t = 5\ \text{სთ}$
$s = 50 \cdot 6 = 300\ \text{კმ}$
SEN: $50t + 50 = 75t - 75 \Rightarrow 25t = 125 \Rightarrow t = 5\ \text{h}$
$s = 50 \cdot 6 = 300\ \text{km}$
AKA: $300\ \text{კმ}$; $5\ \text{სთ}$
AEN: $300\ \text{km}$; $5\ \text{h}$

--- hard speed
KA: მდინარის სიგანეა $120\ \text{მ}$, დინების სიჩქარე — $1\ \text{მ/წმ}$. მოცურავე წყლის მიმართ $1{,}5\ \text{მ/წმ}$-ით ნაპირის პერპენდიკულარულად ცურავს. რა დროში გადაცურავს და რამდენ მეტრზე წაიღებს დინება?
EN: A river is $120\ \text{m}$ wide and flows at $1\ \text{m/s}$. A swimmer swims at $1.5\ \text{m/s}$ relative to the water, heading perpendicular to the bank. How long does the crossing take, and how far downstream is the swimmer carried?
HKA: გადაცურვის დროს მხოლოდ პერპენდიკულარული სიჩქარე განსაზღვრავს; ამავე დროს დინება წაიღებს.
HEN: Only the perpendicular speed sets the crossing time; meanwhile the current carries the swimmer.
SKA: $t = \dfrac{120}{1{,}5} = 80\ \text{წმ}$
$x = 1 \cdot 80 = 80\ \text{მ}$
SEN: $t = \dfrac{120}{1.5} = 80\ \text{s}$
$x = 1 \cdot 80 = 80\ \text{m}$
AKA: $80\ \text{წმ}$; $80\ \text{მ}$
AEN: $80\ \text{s}$; $80\ \text{m}$

--- hard speed
KA: ველოსიპედისტმა გზის პირველი მესამედი $12\ \text{კმ/სთ}$-ით გაიარა, მეორე მესამედი $18\ \text{კმ/სთ}$-ით, ბოლო — $36\ \text{კმ/სთ}$-ით. იპოვეთ საშუალო სიჩქარე.
EN: A cyclist rode the first third of the distance at $12\ \text{km/h}$, the second third at $18\ \text{km/h}$ and the last third at $36\ \text{km/h}$. Find the average speed.
HKA: მესამედი აღნიშნეთ $s$-ით: $t = \dfrac{s}{12} + \dfrac{s}{18} + \dfrac{s}{36}$.
HEN: Call each third $s$: $t = \dfrac{s}{12} + \dfrac{s}{18} + \dfrac{s}{36}$.
SKA: $t = s\left(\dfrac{3 + 2 + 1}{36}\right) = \dfrac{s}{6}$
$v_{\text{საშ}} = \dfrac{3s}{s/6} = 18\ \text{კმ/სთ}$
SEN: $t = s\left(\dfrac{3 + 2 + 1}{36}\right) = \dfrac{s}{6}$
$v_{\text{avg}} = \dfrac{3s}{s/6} = 18\ \text{km/h}$
AKA: $18\ \text{კმ/სთ}$
AEN: $18\ \text{km/h}$

--- hard speed
KA: ტრამვაი ყოველ $6$ წუთში გადის, $20\ \text{კმ/სთ}$-ით. ქვეითი ტრამვაის ხაზის გასწვრივ ტრამვაების საწინააღმდეგოდ $4\ \text{კმ/სთ}$-ით მიდის. რამდენ წუთში ერთხელ შეხვდება მას შემხვედრი ტრამვაი?
EN: Trams run every $6$ minutes at $20\ \text{km/h}$. A walker walks along the line against the trams at $4\ \text{km/h}$. How often does the walker meet an oncoming tram?
HKA: ტრამვაებს შორის მანძილი $20 \cdot 0{,}1\ \text{კმ}$-ია. ფარდობითი სიჩქარე — $20 + 4$.
HEN: The trams are $20 \cdot 0.1\ \text{km}$ apart. The relative speed is $20 + 4$.
SKA: $d = 20 \cdot \dfrac{6}{60} = 2\ \text{კმ}$
$t = \dfrac{2}{20 + 4} = \dfrac{1}{12}\ \text{სთ} = 5\ \text{წთ}$
SEN: $d = 20 \cdot \dfrac{6}{60} = 2\ \text{km}$
$t = \dfrac{2}{20 + 4} = \dfrac{1}{12}\ \text{h} = 5\ \text{min}$
AKA: ყოველ $5$ წუთში
AEN: every $5$ minutes

--- hard speed
KA: ორი მატარებელი ($180\ \text{მ}$ და $120\ \text{მ}$) ერთმანეთის მიმართულებით მოძრაობს $36\ \text{კმ/სთ}$ და $72\ \text{კმ/სთ}$ სიჩქარით. რა დროში ჩაუვლიან ერთმანეთს მთლიანად (ლოკომოტივების შეხვედრიდან ბოლო ვაგონების დაშორებამდე)?
EN: Two trains, $180\ \text{m}$ and $120\ \text{m}$ long, move towards each other at $36\ \text{km/h}$ and $72\ \text{km/h}$. How long does it take for them to pass each other completely (from the fronts meeting to the ends separating)?
HKA: ფარდობითი სიჩქარე $v_1 + v_2$, გასავლელი მანძილი $l_1 + l_2$.
HEN: Relative speed $v_1 + v_2$; distance to cover $l_1 + l_2$.
SKA: $v_1 + v_2 = 10 + 20 = 30\ \text{მ/წმ}$
$t = \dfrac{180 + 120}{30} = 10\ \text{წმ}$
SEN: $v_1 + v_2 = 10 + 20 = 30\ \text{m/s}$
$t = \dfrac{180 + 120}{30} = 10\ \text{s}$
AKA: $10\ \text{წმ}$
AEN: $10\ \text{s}$

--- hard speed
KA: ნავმა დინების საწინააღმდეგოდ ცურვისას ხიდის ქვეშ ბურთი დაკარგა. $15$ წუთის შემდეგ დანაკარგი შეამჩნიეს, მობრუნდნენ და ბურთს ხიდიდან $1\ \text{კმ}$-ზე დაეწივნენ. იპოვეთ დინების სიჩქარე. (ნავის სიჩქარე წყლის მიმართ მუდმივია.)
EN: A boat going upstream drops a ball under a bridge. $15$ minutes later the loss is noticed; the boat turns round and catches the ball $1\ \text{km}$ below the bridge. Find the speed of the current. (The boat's speed relative to the water is constant.)
HKA: წყალთან დაკავშირებულ სისტემაში ბურთი უძრავია — ნავი $15$ წთ შორდება და $15$ წთ ბრუნდება.
HEN: In the frame of the water the ball is at rest — the boat moves away for $15$ min and comes back in $15$ min.
SKA: წყლის მიმართ ნავი ბურთს ერთნაირი სიჩქარით შორდება და უახლოვდება, ამიტომ დაბრუნებასაც $15\ \text{წთ}$ სჭირდება.
ბურთი სულ $30\ \text{წთ} = 0{,}5\ \text{სთ}$ მიცურავდა და $1\ \text{კმ}$ გაიარა.
$u = \dfrac{1}{0{,}5} = 2\ \text{კმ/სთ}$
SEN: Relative to the water the boat leaves and approaches the ball at the same speed, so returning also takes $15\ \text{min}$.
The ball drifted for $30\ \text{min} = 0.5\ \text{h}$ and travelled $1\ \text{km}$.
$u = \dfrac{1}{0.5} = 2\ \text{km/h}$
AKA: $2\ \text{კმ/სთ}$
AEN: $2\ \text{km/h}$

--- hard speed
KA: სპორტსმენები $10\ \text{მ}$-იანი ინტერვალით, სვეტად, $3\ \text{მ/წმ}$-ით დარბიან. მწვრთნელი მათ შესახვედრად $1\ \text{მ/წმ}$-ით მიდის. ყოველი სპორტსმენი მწვრთნელს რომ გაუსწორდება, ბრუნდება და იმავე სიჩქარით უკან მირბის. რა ინტერვალი იქნება სპორტსმენებს შორის ყველას მობრუნების შემდეგ?
EN: Athletes run in a column at $3\ \text{m/s}$, $10\ \text{m}$ apart. A coach walks towards them at $1\ \text{m/s}$. Each athlete turns round on reaching the coach and runs back at the same speed. What is the spacing between the athletes after all have turned?
HKA: იპოვეთ დრო ორი მეზობელი სპორტსმენის მობრუნებას შორის; ამ დროში პირველი უკვე უკან მირბის.
HEN: Find the time between two neighbours turning; during it the first one is already running back.
SKA: მეზობელი სპორტსმენი მწვრთნელს $\Delta t = \dfrac{10}{3 + 1} = 2{,}5\ \text{წმ}$-ის შემდეგ ხვდება.
ამ დროში უკვე მობრუნებული სპორტსმენი გაირბენს $3 \cdot 2{,}5 = 7{,}5\ \text{მ}$-ს, მწვრთნელი კი მისი მიმართულებით $1 \cdot 2{,}5 = 2{,}5\ \text{მ}$-ს გაივლის.
ინტერვალი: $d = 3 \cdot 2{,}5 - 1 \cdot 2{,}5 = 5\ \text{მ}$.
SEN: The next athlete reaches the coach after $\Delta t = \dfrac{10}{3 + 1} = 2.5\ \text{s}$.
Meanwhile the athlete who has already turned runs $3 \cdot 2.5 = 7.5\ \text{m}$ back, while the coach moves $1 \cdot 2.5 = 2.5\ \text{m}$ in the same direction.
Spacing: $d = 3 \cdot 2.5 - 1 \cdot 2.5 = 5\ \text{m}$.
AKA: $5\ \text{მ}$
AEN: $5\ \text{m}$

--- hard speed olympiad
KA: კატერი პუნქტიდან A ნაკადის საწინააღმდეგოდ გავიდა. იმავე მომენტში A-დან დინებას მიყვა ტივი. $1\ \text{სთ}$-ის შემდეგ კატერი მობრუნდა და ტივს A-დან $6\ \text{კმ}$-ზე დაეწია. იპოვეთ დინების სიჩქარე.
EN: A motorboat leaves point A going upstream; at the same moment a raft starts drifting downstream from A. After $1\ \text{h}$ the boat turns back and catches the raft $6\ \text{km}$ from A. Find the speed of the current.
HKA: წყლის სისტემაში ტივი უძრავია, კატერი $1\ \text{სთ}$ შორდება და $1\ \text{სთ}$ ბრუნდება.
HEN: In the water's frame the raft is at rest; the boat moves away for $1\ \text{h}$ and returns in $1\ \text{h}$.
SKA: წყლის მიმართ კატერის სიჩქარე ორივე მიმართულებით ერთნაირია, ამიტომ ტივამდე დაბრუნებას კიდევ $1\ \text{სთ}$ სჭირდება.
ტივი $2\ \text{სთ}$ მიცურავდა და $6\ \text{კმ}$ გაიარა: $u = \dfrac{6}{2} = 3\ \text{კმ/სთ}$.
SEN: Relative to the water the boat's speed is the same both ways, so returning to the raft takes another $1\ \text{h}$.
The raft drifted for $2\ \text{h}$ and covered $6\ \text{km}$: $u = \dfrac{6}{2} = 3\ \text{km/h}$.
AKA: $3\ \text{კმ/სთ}$
AEN: $3\ \text{km/h}$

--- hard speed olympiad
KA: ძაღლი და პატრონი ერთდროულად გამოდიან სახლიდან პარკისკენ, რომელიც $1\ \text{კმ}$-შია. პატრონი $5\ \text{კმ/სთ}$-ით მიდის, ძაღლი $15\ \text{კმ/სთ}$-ით პარკამდე მირბის, უკან პატრონისკენ ბრუნდება, ისევ პარკისკენ და ა.შ., სანამ ორივე პარკამდე მივა. რა მანძილს გაირბენს ძაღლი?
EN: A dog and its owner leave home together for a park $1\ \text{km}$ away. The owner walks at $5\ \text{km/h}$; the dog runs to the park at $15\ \text{km/h}$, back to the owner, to the park again, and so on until both are at the park. How far does the dog run?
HKA: არ შეკრიბოთ უსასრულო მონაკვეთები — იპოვეთ, რამდენ ხანს დარბის ძაღლი.
HEN: Don't sum infinitely many legs — find how long the dog runs.
SKA: ძაღლი დარბის მანამ, სანამ პატრონი პარკამდე მივა: $t = \dfrac{1}{5} = 0{,}2\ \text{სთ}$.
$s = 15 \cdot 0{,}2 = 3\ \text{კმ}$
SEN: The dog runs as long as the owner walks to the park: $t = \dfrac{1}{5} = 0.2\ \text{h}$.
$s = 15 \cdot 0.2 = 3\ \text{km}$
AKA: $3\ \text{კმ}$
AEN: $3\ \text{km}$

--- hard speed olympiad
KA: ავტობუსის გაჩერებაზე მისული ბიჭი ხედავს, რომ ავტობუსი $50\ \text{მ}$-ითაა მოშორებული და $10\ \text{მ/წმ}$-ით შორდება. ბიჭს შეუძლია მაქსიმუმ $6\ \text{მ/წმ}$-ით სირბილი. ავტობუსი შემდეგ გაჩერებაზე $20\ \text{წმ}$ დგას, რომელიც პირველიდან $400\ \text{მ}$-შია. მიუსწრებს ბიჭი ავტობუსს?
EN: A boy arrives at a bus stop and sees the bus $50\ \text{m}$ away, moving off at $10\ \text{m/s}$. He can run at most $6\ \text{m/s}$. The bus stops for $20\ \text{s}$ at the next stop, $400\ \text{m}$ from the first. Will the boy catch the bus?
HKA: შეადარეთ, როდის მიდის ავტობუსი მეორე გაჩერებაზე და როდის ტოვებს მას, და როდის მიირბენს ბიჭი იქამდე.
HEN: Compare when the bus arrives at and leaves the next stop with when the boy gets there.
SKA: ავტობუსს დარჩენილი აქვს $400 - 50 = 350\ \text{მ}$: $t_1 = \dfrac{350}{10} = 35\ \text{წმ}$, გაჩერებას ტოვებს $35 + 20 = 55\ \text{წმ}$-ზე.
ბიჭი: $t_2 = \dfrac{400}{6} \approx 66{,}7\ \text{წმ} > 55\ \text{წმ}$.
ვერ მიუსწრებს (დააგვიანებს $\approx 12\ \text{წმ}$-ით).
SEN: The bus has $400 - 50 = 350\ \text{m}$ to go: $t_1 = \dfrac{350}{10} = 35\ \text{s}$, and leaves the stop at $35 + 20 = 55\ \text{s}$.
The boy: $t_2 = \dfrac{400}{6} \approx 66.7\ \text{s} > 55\ \text{s}$.
He misses it (by $\approx 12\ \text{s}$).
AKA: ვერ მიუსწრებს
AEN: no, he misses it

--- hard speed olympiad
KA: ორი ველოსიპედისტი ერთდროულად გავიდა A-დან B-სკენ. პირველმა მთელი დროის ნახევარი $10\ \text{კმ/სთ}$-ით იარა, ნახევარი — $20\ \text{კმ/სთ}$-ით. მეორემ გზის ნახევარი $10\ \text{კმ/სთ}$-ით, ნახევარი — $20\ \text{კმ/სთ}$-ით. ვინ ჩავა პირველი?
EN: Two cyclists leave A for B together. The first rides half the **time** at $10\ \text{km/h}$ and half at $20\ \text{km/h}$. The second rides half the **distance** at $10\ \text{km/h}$ and half at $20\ \text{km/h}$. Who arrives first?
HKA: გამოთვალეთ ორივეს საშუალო სიჩქარე.
HEN: Work out both average speeds.
SKA: პირველი: $v_1 = \dfrac{10 + 20}{2} = 15\ \text{კმ/სთ}$.
მეორე: $v_2 = \dfrac{2 \cdot 10 \cdot 20}{10 + 20} \approx 13{,}3\ \text{კმ/სთ}$.
$v_1 > v_2$ — პირველი ჩავა ადრე (ნელი სიჩქარით მეორე უფრო დიდხანს მოძრაობს).
SEN: First: $v_1 = \dfrac{10 + 20}{2} = 15\ \text{km/h}$.
Second: $v_2 = \dfrac{2 \cdot 10 \cdot 20}{10 + 20} \approx 13.3\ \text{km/h}$.
$v_1 > v_2$ — the first arrives earlier (the second spends more time at the slow speed).
AKA: პირველი
AEN: the first

--- easy force
KA: რა ძალით იზიდავს დედამიწა $60\ \text{კგ}$ მასის მოსწავლეს?
EN: With what force does the Earth pull a $60\ \text{kg}$ student?
HKA: $F = m g$.
HEN: $F = m g$.
SKA: $F = 60 \cdot 10 = 600\ \text{ნ}$
SEN: $F = 60 \cdot 10 = 600\ \text{N}$
AKA: $600\ \text{ნ}$
AEN: $600\ \text{N}$

--- easy force
KA: სხეულზე ერთი მიმართულებით $15\ \text{ნ}$ და $25\ \text{ნ}$ ძალები მოქმედებს. იპოვეთ ტოლქმედი.
EN: Forces of $15\ \text{N}$ and $25\ \text{N}$ act on a body in the same direction. Find the resultant.
HKA: ერთი მიმართულებისას ძალები იკრიბება.
HEN: In the same direction the forces add.
SKA: $R = 15 + 25 = 40\ \text{ნ}$, იმავე მიმართულებით.
SEN: $R = 15 + 25 = 40\ \text{N}$, in the same direction.
AKA: $40\ \text{ნ}$
AEN: $40\ \text{N}$

--- easy force
KA: რა მასისაა სხეული, რომელზეც სიმძიმის ძალა $4{,}5\ \text{ნ}$-ია?
EN: What is the mass of a body on which gravity is $4.5\ \text{N}$?
HKA: $m = \dfrac{F}{g}$.
HEN: $m = \dfrac{F}{g}$.
SKA: $m = \dfrac{4{,}5}{10} = 0{,}45\ \text{კგ} = 450\ \text{გ}$
SEN: $m = \dfrac{4.5}{10} = 0.45\ \text{kg} = 450\ \text{g}$
AKA: $0{,}45\ \text{კგ}$
AEN: $0.45\ \text{kg}$

--- easy force
KA: წიგნი მაგიდაზე დევს. რომელი ძალები მოქმედებს მასზე? რას უდრის მათი ტოლქმედი?
EN: A book lies on a table. Which forces act on it? What is their resultant?
HKA: წიგნი უძრავია — ძალები ერთმანეთს აწონასწორებს.
HEN: The book is at rest — the forces balance each other.
SKA: ქვემოთ — სიმძიმის ძალა $mg$, ზემოთ — მაგიდის რეაქციის (დრეკადობის) ძალა $N$.
ისინი ტოლია და საპირისპიროდ მიმართული: $R = N - mg = 0$.
SEN: Down — gravity $mg$; up — the table's reaction (elastic) force $N$.
They are equal and opposite: $R = N - mg = 0$.
AKA: სიმძიმის და რეაქციის ძალები; $R = 0$
AEN: gravity and the normal force; $R = 0$

--- easy force
KA: ბიჭი კარადას $80\ \text{ნ}$-ით უბიძგებს მარჯვნივ, გოგო კი $50\ \text{ნ}$-ით მარცხნივ. იპოვეთ ტოლქმედი და მისი მიმართულება.
EN: A boy pushes a wardrobe right with $80\ \text{N}$, and a girl pushes it left with $50\ \text{N}$. Find the resultant and its direction.
HKA: საპირისპირო ძალების ტოლქმედი მათი სხვაობაა და მიმართულია დიდი ძალისკენ.
HEN: The resultant of opposite forces is their difference, pointing like the larger one.
SKA: $R = 80 - 50 = 30\ \text{ნ}$, მარჯვნივ.
SEN: $R = 80 - 50 = 30\ \text{N}$, to the right.
AKA: $30\ \text{ნ}$ მარჯვნივ
AEN: $30\ \text{N}$ to the right

--- easy force
KA: მთვარეზე $g_{\text{მ}} = 1{,}6\ \text{ნ/კგ}$. რას უდრის სიმძიმის ძალა $5\ \text{კგ}$ მასის სხეულზე მთვარეზე? შეიცვლება თუ არა მისი მასა?
EN: On the Moon $g_{\text{M}} = 1.6\ \text{N/kg}$. What is the force of gravity on a $5\ \text{kg}$ body on the Moon? Does its mass change?
HKA: მასა სხეულის თვისებაა და ადგილზე არ არის დამოკიდებული.
HEN: Mass is a property of the body and doesn't depend on where it is.
SKA: $F = 5 \cdot 1{,}6 = 8\ \text{ნ}$
მასა იგივე რჩება — $5\ \text{კგ}$.
SEN: $F = 5 \cdot 1.6 = 8\ \text{N}$
The mass stays the same — $5\ \text{kg}$.
AKA: $8\ \text{ნ}$; მასა არ იცვლება
AEN: $8\ \text{N}$; the mass doesn't change

--- easy force
KA: დინამომეტრის დანაყოფის ფასია $0{,}1\ \text{ნ}$. ისარი $0$-დან $23$-ე დანაყოფზე დგას. რა ძალას აჩვენებს დინამომეტრი და რა მასის ტვირთი ჰკიდია?
EN: A dynamometer's division value is $0.1\ \text{N}$. The pointer is on the $23$rd division from $0$. What force does it show, and what mass hangs from it?
HKA: $F = n c$, $m = \dfrac{F}{g}$.
HEN: $F = n c$, $m = \dfrac{F}{g}$.
SKA: $F = 23 \cdot 0{,}1 = 2{,}3\ \text{ნ}$
$m = \dfrac{2{,}3}{10} = 0{,}23\ \text{კგ} = 230\ \text{გ}$
SEN: $F = 23 \cdot 0.1 = 2.3\ \text{N}$
$m = \dfrac{2.3}{10} = 0.23\ \text{kg} = 230\ \text{g}$
AKA: $2{,}3\ \text{ნ}$; $230\ \text{გ}$
AEN: $2.3\ \text{N}$; $230\ \text{g}$

--- easy force
KA: ერთ წრფეზე მოქმედი სამი ძალიდან ორი ($20\ \text{ნ}$ და $30\ \text{ნ}$) მარჯვნივაა მიმართული. როგორი უნდა იყოს მესამე ძალა, რომ სხეული წონასწორობაში იყოს?
EN: Of three forces acting along one line, two ($20\ \text{N}$ and $30\ \text{N}$) point to the right. What must the third force be for the body to be in equilibrium?
HKA: წონასწორობისას ტოლქმედი ნულია.
HEN: In equilibrium the resultant is zero.
SKA: მარჯვნივ: $20 + 30 = 50\ \text{ნ}$.
მესამე ძალა: $50\ \text{ნ}$, მიმართული მარცხნივ.
SEN: To the right: $20 + 30 = 50\ \text{N}$.
Third force: $50\ \text{N}$, pointing left.
AKA: $50\ \text{ნ}$ მარცხნივ
AEN: $50\ \text{N}$ to the left

--- easy force
KA: ჩაწერეთ სიმძიმის ძალა ნიუტონებში სხეულებისთვის: ა) $200\ \text{გ}$ ვაშლი; ბ) $1{,}5\ \text{ტ}$ მანქანა; გ) $3\ \text{მგ}$ ბუზი.
EN: Find the force of gravity in newtons on: a) a $200\ \text{g}$ apple; b) a $1.5\ \text{t}$ car; c) a $3\ \text{mg}$ fly.
HKA: ჯერ მასა კილოგრამებში გადაიყვანეთ.
HEN: Convert the mass to kilograms first.
SKA: ა) $0{,}2 \cdot 10 = 2\ \text{ნ}$
ბ) $1500 \cdot 10 = 15\,000\ \text{ნ} = 15\ \text{კნ}$
გ) $3 \cdot 10^{-6} \cdot 10 = 3 \cdot 10^{-5}\ \text{ნ}$
SEN: a) $0.2 \cdot 10 = 2\ \text{N}$
b) $1500 \cdot 10 = 15\,000\ \text{N} = 15\ \text{kN}$
c) $3 \cdot 10^{-6} \cdot 10 = 3 \cdot 10^{-5}\ \text{N}$
AKA: ა) $2\ \text{ნ}$; ბ) $15\ \text{კნ}$; გ) $3 \cdot 10^{-5}\ \text{ნ}$
AEN: a) $2\ \text{N}$; b) $15\ \text{kN}$; c) $3 \cdot 10^{-5}\ \text{N}$

--- easy force
KA: სხეულს ძაფზე ჰკიდია და უძრავია. ძაფის დაჭიმულობის ძალაა $7\ \text{ნ}$. იპოვეთ სხეულის მასა.
EN: A body hangs at rest on a thread. The tension in the thread is $7\ \text{N}$. Find the body's mass.
HKA: წონასწორობისას დაჭიმულობა სიმძიმის ძალის ტოლია.
HEN: In equilibrium the tension equals the force of gravity.
SKA: $T = mg \Rightarrow m = \dfrac{7}{10} = 0{,}7\ \text{კგ}$
SEN: $T = mg \Rightarrow m = \dfrac{7}{10} = 0.7\ \text{kg}$
AKA: $0{,}7\ \text{კგ}$
AEN: $0.7\ \text{kg}$

--- medium force
KA: ლიფტში $50\ \text{კგ}$ მასის ადამიანი დგას. თანაბრად აწევისას რა ძალით აწვება ის იატაკს? რომელი ძალები მოქმედებს მასზე?
EN: A $50\ \text{kg}$ person stands in a lift. With what force do they press on the floor while the lift rises at constant speed? Which forces act on them?
HKA: თანაბარი მოძრაობისას ძალების ტოლქმედი ნულია.
HEN: In uniform motion the resultant force is zero.
SKA: ადამიანზე მოქმედებს $mg = 500\ \text{ნ}$ (ქვემოთ) და იატაკის რეაქცია $N$ (ზემოთ).
თანაბარი მოძრაობისას $N = mg = 500\ \text{ნ}$; ადამიანი იატაკს იმავე $500\ \text{ნ}$-ით აწვება.
SEN: Gravity $mg = 500\ \text{N}$ (down) and the floor's reaction $N$ (up) act on the person.
At constant speed $N = mg = 500\ \text{N}$; the person presses on the floor with the same $500\ \text{N}$.
AKA: $500\ \text{ნ}$
AEN: $500\ \text{N}$

--- medium force
KA: სხეულზე მოქმედებს $40\ \text{ნ}$ ჩრდილოეთით და $30\ \text{ნ}$ აღმოსავლეთით მიმართული ძალები. იპოვეთ ტოლქმედის მოდული.
EN: Forces of $40\ \text{N}$ north and $30\ \text{N}$ east act on a body. Find the magnitude of the resultant.
HKA: ურთიერთპერპენდიკულარული ძალების ტოლქმედი პითაგორას თეორემით გამოითვლება.
HEN: For perpendicular forces use Pythagoras' theorem.
SKA: $R = \sqrt{40^2 + 30^2} = \sqrt{2500} = 50\ \text{ნ}$
SEN: $R = \sqrt{40^2 + 30^2} = \sqrt{2500} = 50\ \text{N}$
AKA: $50\ \text{ნ}$
AEN: $50\ \text{N}$

--- medium force
KA: ორი ძალის ($F_1$ და $F_2$) ტოლქმედი ერთი მიმართულებისას $70\ \text{ნ}$-ია, საპირისპიროსას — $10\ \text{ნ}$. იპოვეთ ძალები.
EN: The resultant of two forces $F_1$ and $F_2$ is $70\ \text{N}$ when they act in the same direction and $10\ \text{N}$ when opposite. Find the forces.
HKA: $F_1 + F_2 = 70$, $F_1 - F_2 = 10$.
HEN: $F_1 + F_2 = 70$, $F_1 - F_2 = 10$.
SKA: $2F_1 = 80 \Rightarrow F_1 = 40\ \text{ნ}$, $\ F_2 = 30\ \text{ნ}$
SEN: $2F_1 = 80 \Rightarrow F_1 = 40\ \text{N}$, $\ F_2 = 30\ \text{N}$
AKA: $40\ \text{ნ}$ და $30\ \text{ნ}$
AEN: $40\ \text{N}$ and $30\ \text{N}$

--- medium force
KA: ტვირთი ($3\ \text{კგ}$) ძაფზე ჰკიდია, ხოლო ტვირთის ქვემოთ, მეორე ძაფზე, $2\ \text{კგ}$ ტვირთი. იპოვეთ ზედა და ქვედა ძაფის დაჭიმულობა.
EN: A $3\ \text{kg}$ load hangs on a thread, and a $2\ \text{kg}$ load hangs below it on a second thread. Find the tensions in the upper and lower threads.
HKA: ქვედა ძაფი მხოლოდ ქვედა ტვირთს იჭერს, ზედა — ორივეს.
HEN: The lower thread holds only the lower load; the upper one holds both.
SKA: $T_{\text{ქვ}} = 2 \cdot 10 = 20\ \text{ნ}$
$T_{\text{ზ}} = (3 + 2) \cdot 10 = 50\ \text{ნ}$
SEN: $T_{\text{lower}} = 2 \cdot 10 = 20\ \text{N}$
$T_{\text{upper}} = (3 + 2) \cdot 10 = 50\ \text{N}$
AKA: ზედა $50\ \text{ნ}$, ქვედა $20\ \text{ნ}$
AEN: upper $50\ \text{N}$, lower $20\ \text{N}$

--- medium force
KA: ავტომობილის ძრავა $2\ \text{კნ}$ წევის ძალას ქმნის, ჰაერის წინაღობა და ხახუნი ერთად $1{,}5\ \text{კნ}$-ია. იპოვეთ ტოლქმედი. როგორ მოძრაობს მანქანა?
EN: A car's engine gives a driving force of $2\ \text{kN}$; air resistance and friction together are $1.5\ \text{kN}$. Find the resultant. How does the car move?
HKA: ტოლქმედი ნული არ არის — სიჩქარე იცვლება.
HEN: The resultant isn't zero — the speed changes.
SKA: $R = 2 - 1{,}5 = 0{,}5\ \text{კნ} = 500\ \text{ნ}$, მოძრაობის მიმართულებით.
მანქანა აჩქარდება (სიჩქარე იზრდება).
SEN: $R = 2 - 1.5 = 0.5\ \text{kN} = 500\ \text{N}$, in the direction of motion.
The car speeds up.
AKA: $500\ \text{ნ}$; აჩქარდება
AEN: $500\ \text{N}$; it speeds up

--- medium force
KA: პარაშუტისტი ($80\ \text{კგ}$, პარაშუტით) თანაბრად ეშვება. რას უდრის ჰაერის წინაღობის ძალა? რა იქნება, თუ წინაღობა სიმძიმის ძალაზე მცირეა?
EN: A parachutist ($80\ \text{kg}$ with the parachute) descends at constant speed. What is the air resistance? What happens if the resistance is less than gravity?
HKA: თანაბარი მოძრაობისას ძალები გაწონასწორებულია.
HEN: In uniform motion the forces balance.
SKA: $F_{\text{წ}} = mg = 80 \cdot 10 = 800\ \text{ნ}$
თუ $F_{\text{წ}} < mg$, ტოლქმედი ქვემოთაა მიმართული და დაშვების სიჩქარე იზრდება.
SEN: $F_{\text{res}} = mg = 80 \cdot 10 = 800\ \text{N}$
If $F_{\text{res}} < mg$, the resultant points down and the descent speeds up.
AKA: $800\ \text{ნ}$; სიჩქარე გაიზრდება
AEN: $800\ \text{N}$; it speeds up

--- medium force
KA: $1\ \text{კგ}$ მასის სხეული დედამიწაზე დინამომეტრზე $10\ \text{ნ}$-ს აჩვენებს. რას აჩვენებს იგივე დინამომეტრი მარსზე ($g = 3{,}7\ \text{ნ/კგ}$) და იუპიტერზე ($g = 25\ \text{ნ/კგ}$)? რას აჩვენებს თეფშიანი სასწორი?
EN: A $1\ \text{kg}$ body reads $10\ \text{N}$ on a spring balance on Earth. What does the same spring balance read on Mars ($g = 3.7\ \text{N/kg}$) and on Jupiter ($g = 25\ \text{N/kg}$)? What does a pan balance show?
HKA: დინამომეტრი ძალას ზომავს, თეფშიანი სასწორი — მასას (ადარებს მასებს).
HEN: A spring balance measures force; a pan balance measures mass (it compares masses).
SKA: მარსზე: $F = 1 \cdot 3{,}7 = 3{,}7\ \text{ნ}$; იუპიტერზე: $F = 25\ \text{ნ}$.
თეფშიანი სასწორი ყველგან $1\ \text{კგ}$-ს აჩვენებს — საწონებზეც $g$ იცვლება იმავე რაოდენობით.
SEN: On Mars: $F = 1 \cdot 3.7 = 3.7\ \text{N}$; on Jupiter: $F = 25\ \text{N}$.
The pan balance shows $1\ \text{kg}$ everywhere — $g$ changes equally for the weights.
AKA: $3{,}7\ \text{ნ}$; $25\ \text{ნ}$; სასწორი — ყველგან $1\ \text{კგ}$
AEN: $3.7\ \text{N}$; $25\ \text{N}$; the pan balance shows $1\ \text{kg}$ everywhere

--- medium force
KA: ორი ძალა — $6\ \text{ნ}$ და $8\ \text{ნ}$ — ერთ წერტილზე მოქმედებს. რა ფარგლებში შეიძლება იყოს მათი ტოლქმედი? შეიძლება თუ არა ის იყოს $1\ \text{ნ}$? $10\ \text{ნ}$?
EN: Two forces, $6\ \text{N}$ and $8\ \text{N}$, act on one point. Within what range can their resultant lie? Can it be $1\ \text{N}$? $10\ \text{N}$?
HKA: უმცირესი — საპირისპირო მიმართულებისას, უდიდესი — ერთი მიმართულებისას.
HEN: Smallest when opposite, largest when in the same direction.
SKA: $8 - 6 = 2\ \text{ნ} \le R \le 8 + 6 = 14\ \text{ნ}$
$1\ \text{ნ}$ — არა (ნაკლებია $2$-ზე); $10\ \text{ნ}$ — კი (როცა ძალები მართი კუთხითაა: $\sqrt{36 + 64} = 10$).
SEN: $8 - 6 = 2\ \text{N} \le R \le 8 + 6 = 14\ \text{N}$
$1\ \text{N}$ — no (less than $2$); $10\ \text{N}$ — yes (when the forces are at right angles: $\sqrt{36 + 64} = 10$).
AKA: $2\ \text{ნ}$-დან $14\ \text{ნ}$-მდე; $1\ \text{ნ}$ — არა, $10\ \text{ნ}$ — კი
AEN: from $2\ \text{N}$ to $14\ \text{N}$; $1\ \text{N}$ — no, $10\ \text{N}$ — yes

--- easy elastic
KA: ზამბარის სიხისტეა $400\ \text{ნ/მ}$. რამდენით გაიჭიმება ის $20\ \text{ნ}$ ძალის მოქმედებით?
EN: A spring has stiffness $400\ \text{N/m}$. How much does it stretch under a force of $20\ \text{N}$?
HKA: ჰუკის კანონი: $F = k x$.
HEN: Hooke's law: $F = k x$.
SKA: $x = \dfrac{F}{k} = \dfrac{20}{400} = 0{,}05\ \text{მ} = 5\ \text{სმ}$
SEN: $x = \dfrac{F}{k} = \dfrac{20}{400} = 0.05\ \text{m} = 5\ \text{cm}$
AKA: $5\ \text{სმ}$
AEN: $5\ \text{cm}$

--- easy elastic
KA: $10\ \text{ნ}$ ძალით ზამბარა $2\ \text{სმ}$-ით გაიჭიმა. იპოვეთ სიხისტე.
EN: A force of $10\ \text{N}$ stretches a spring by $2\ \text{cm}$. Find its stiffness.
HKA: $k = \dfrac{F}{x}$; სანტიმეტრები მეტრებში გადაიყვანეთ.
HEN: $k = \dfrac{F}{x}$; convert centimetres to metres.
SKA: $k = \dfrac{10}{0{,}02} = 500\ \text{ნ/მ}$
SEN: $k = \dfrac{10}{0.02} = 500\ \text{N/m}$
AKA: $500\ \text{ნ/მ}$
AEN: $500\ \text{N/m}$

--- easy elastic
KA: ზამბარაზე $200\ \text{გ}$ ტვირთი ჩამოკიდეს და ის $4\ \text{სმ}$-ით გაიჭიმა. რას უდრის სიხისტე?
EN: A $200\ \text{g}$ load is hung on a spring and it stretches by $4\ \text{cm}$. What is its stiffness?
HKA: ზამბარაზე მოქმედი ძალა ტვირთის წონაა: $F = mg$.
HEN: The force on the spring is the load's weight: $F = mg$.
SKA: $F = 0{,}2 \cdot 10 = 2\ \text{ნ}$
$k = \dfrac{2}{0{,}04} = 50\ \text{ნ/მ}$
SEN: $F = 0.2 \cdot 10 = 2\ \text{N}$
$k = \dfrac{2}{0.04} = 50\ \text{N/m}$
AKA: $50\ \text{ნ/მ}$
AEN: $50\ \text{N/m}$

--- easy elastic
KA: მძიმე ყუთს იატაკზე თანაბრად $60\ \text{ნ}$-ით ეწევიან. რას უდრის ხახუნის ძალა და საით არის მიმართული?
EN: A heavy box is pulled across the floor at constant speed with $60\ \text{N}$. What is the friction force and in which direction does it act?
HKA: თანაბარი მოძრაობისას წევის ძალა და ხახუნი ტოლია.
HEN: In uniform motion the pull and friction are equal.
SKA: $F_{\text{ხ}} = 60\ \text{ნ}$, მიმართულია მოძრაობის საწინააღმდეგოდ.
SEN: $F_{\text{fr}} = 60\ \text{N}$, directed against the motion.
AKA: $60\ \text{ნ}$, მოძრაობის საწინააღმდეგოდ
AEN: $60\ \text{N}$, against the motion

--- easy elastic
KA: ჩამოთვალეთ ორი შემთხვევა, როცა ხახუნი სასარგებლოა, და ორი, როცა მავნე. როგორ ამცირებენ ხახუნს?
EN: Give two cases where friction is useful and two where it is harmful. How is friction reduced?
HKA: იფიქრეთ სიარულზე, მუხრუჭებზე, ძრავების ნაწილებზე.
HEN: Think about walking, brakes and engine parts.
SKA: სასარგებლო: სიარული (ფეხი არ სრიალებს), მანქანის მუხრუჭები, ხელში საგნის დაჭერა.
მავნე: ძრავისა და მანქანის ნაწილების ცვეთა, ენერგიის დაკარგვა.
შემცირება: ზეთით შეზეთვა, საკისრები (სრიალის ნაცვლად გორვა), ზედაპირების გაპრიალება.
SEN: Useful: walking (feet don't slip), car brakes, holding objects in your hand.
Harmful: wear of engine and machine parts, wasted energy.
Reduced by: lubricating with oil, bearings (rolling instead of sliding), polishing surfaces.
AKA: სასარგებლო — სიარული, მუხრუჭები; მავნე — ცვეთა; ამცირებს შეზეთვა, საკისრები
AEN: useful — walking, brakes; harmful — wear; reduced by lubrication and bearings

--- easy elastic
KA: ზამბარის სიხისტეა $80\ \text{ნ/მ}$. რა ძალა უნდა მოვდოთ, რომ ის $5\ \text{სმ}$-ით შევკუმშოთ?
EN: A spring has stiffness $80\ \text{N/m}$. What force compresses it by $5\ \text{cm}$?
HKA: ჰუკის კანონი შეკუმშვისთვისაც მოქმედებს.
HEN: Hooke's law also holds for compression.
SKA: $F = k x = 80 \cdot 0{,}05 = 4\ \text{ნ}$
SEN: $F = k x = 80 \cdot 0.05 = 4\ \text{N}$
AKA: $4\ \text{ნ}$
AEN: $4\ \text{N}$

--- easy elastic
KA: ზამბარაზე $1\ \text{ნ}$ ძალა მას $0{,}5\ \text{სმ}$-ით ჭიმავს. რამდენით გაჭიმავს მას $3\ \text{ნ}$?
EN: A force of $1\ \text{N}$ stretches a spring by $0.5\ \text{cm}$. How much will $3\ \text{N}$ stretch it?
HKA: წაგრძელება ძალის პროპორციულია.
HEN: The extension is proportional to the force.
SKA: $x_2 = x_1 \cdot \dfrac{F_2}{F_1} = 0{,}5 \cdot 3 = 1{,}5\ \text{სმ}$
SEN: $x_2 = x_1 \cdot \dfrac{F_2}{F_1} = 0.5 \cdot 3 = 1.5\ \text{cm}$
AKA: $1{,}5\ \text{სმ}$
AEN: $1.5\ \text{cm}$

--- easy elastic
KA: რატომ არის მანქანისთვის სახიფათო ყინულიან გზაზე მოძრაობა? რატომ აყენებენ ზამთარში საბურავებს ღრმა პროტექტორით?
EN: Why is driving on an icy road dangerous? Why are winter tyres given deep treads?
HKA: ყინულზე ხახუნის ძალა ძალიან მცირეა.
HEN: On ice the friction force is very small.
SKA: ყინულზე საბურავსა და გზას შორის ხახუნი მცირეა — მანქანა სრიალებს, ძნელია დამუხრუჭება და მოხვევა, სამუხრუჭე მანძილი დიდია.
ღრმა პროტექტორი გზის უსწორმასწორობებს „ებღაუჭება“ და ხახუნს ზრდის.
SEN: On ice the friction between tyre and road is small — the car skids, braking and turning are hard and the stopping distance is long.
Deep treads grip the road's roughness and increase friction.
AKA: მცირე ხახუნის გამო; პროტექტორი ზრდის ხახუნს
AEN: because friction is small; treads increase friction

--- easy elastic
KA: ზამბარიანი დინამომეტრი $0$-დან $4\ \text{ნ}$-მდე ზომავს, სკალის სიგრძეა $8\ \text{სმ}$. რას უდრის ზამბარის სიხისტე?
EN: A spring balance measures from $0$ to $4\ \text{N}$ and its scale is $8\ \text{cm}$ long. What is the spring's stiffness?
HKA: $4\ \text{ნ}$-ზე ზამბარა მთელი სკალის სიგრძით იჭიმება.
HEN: At $4\ \text{N}$ the spring stretches the full scale length.
SKA: $k = \dfrac{4}{0{,}08} = 50\ \text{ნ/მ}$
SEN: $k = \dfrac{4}{0.08} = 50\ \text{N/m}$
AKA: $50\ \text{ნ/მ}$
AEN: $50\ \text{N/m}$

--- easy elastic
KA: ყუთი ჰორიზონტალურ იატაკზე დევს და მას არავინ ეხება. მოქმედებს თუ არა მასზე ხახუნის ძალა?
EN: A box lies on a horizontal floor and nobody touches it. Does a friction force act on it?
HKA: უძრაობის ხახუნი ჩნდება მხოლოდ მაშინ, როცა რაღაც ცდილობს სხეულის დაძვრას.
HEN: Static friction appears only when something tries to move the body.
SKA: არა. ყუთზე მოქმედებს მხოლოდ სიმძიმის ძალა და იატაკის რეაქცია. ჰორიზონტალური ძალა არ არის, ამიტომ ხახუნი ნულია.
SEN: No. Only gravity and the floor's reaction act on the box. There's no horizontal force, so friction is zero.
AKA: არა
AEN: no

--- medium elastic
KA: ზამბარის სიგრძე დაუტვირთავად $10\ \text{სმ}$-ია, სიხისტე — $200\ \text{ნ/მ}$. რა სიგრძის იქნება ის, თუ მასზე $500\ \text{გ}$ ტვირთს ჩამოვკიდებთ?
EN: An unloaded spring is $10\ \text{cm}$ long with stiffness $200\ \text{N/m}$. How long will it be with a $500\ \text{g}$ load hanging on it?
HKA: $x = \dfrac{mg}{k}$, $\ l = l_0 + x$.
HEN: $x = \dfrac{mg}{k}$, $\ l = l_0 + x$.
SKA: $x = \dfrac{0{,}5 \cdot 10}{200} = 0{,}025\ \text{მ} = 2{,}5\ \text{სმ}$
$l = 10 + 2{,}5 = 12{,}5\ \text{სმ}$
SEN: $x = \dfrac{0.5 \cdot 10}{200} = 0.025\ \text{m} = 2.5\ \text{cm}$
$l = 10 + 2.5 = 12.5\ \text{cm}$
AKA: $12{,}5\ \text{სმ}$
AEN: $12.5\ \text{cm}$

--- medium elastic
KA: ცდაში ზამბარაზე ტვირთები ჩამოკიდეს: $1\ \text{ნ} \to 2\ \text{სმ}$, $2\ \text{ნ} \to 4\ \text{სმ}$, $3\ \text{ნ} \to 6\ \text{სმ}$. სრულდება თუ არა ჰუკის კანონი? იპოვეთ სიხისტე და წაგრძელება $2{,}5\ \text{ნ}$-ზე.
EN: In an experiment loads were hung on a spring: $1\ \text{N} \to 2\ \text{cm}$, $2\ \text{N} \to 4\ \text{cm}$, $3\ \text{N} \to 6\ \text{cm}$. Is Hooke's law obeyed? Find the stiffness and the extension at $2.5\ \text{N}$.
HKA: შეამოწმეთ, მუდმივია თუ არა შეფარდება $\dfrac{F}{x}$.
HEN: Check whether the ratio $\dfrac{F}{x}$ is constant.
SKA: $\dfrac{F}{x} = \dfrac{1}{0{,}02} = \dfrac{2}{0{,}04} = \dfrac{3}{0{,}06} = 50\ \text{ნ/მ}$ — მუდმივია, კანონი სრულდება.
$x = \dfrac{2{,}5}{50} = 0{,}05\ \text{მ} = 5\ \text{სმ}$
SEN: $\dfrac{F}{x} = \dfrac{1}{0.02} = \dfrac{2}{0.04} = \dfrac{3}{0.06} = 50\ \text{N/m}$ — constant, so the law holds.
$x = \dfrac{2.5}{50} = 0.05\ \text{m} = 5\ \text{cm}$
AKA: კი; $50\ \text{ნ/მ}$; $5\ \text{სმ}$
AEN: yes; $50\ \text{N/m}$; $5\ \text{cm}$

--- medium elastic
KA: $4\ \text{კგ}$ ყუთის თანაბრად გადასაადგილებლად იატაკზე $12\ \text{ნ}$ ძალაა საჭირო. იპოვეთ ხახუნის კოეფიციენტი.
EN: Moving a $4\ \text{kg}$ box uniformly across the floor takes $12\ \text{N}$. Find the coefficient of friction.
HKA: $F_{\text{ხ}} = \mu N$, ჰორიზონტალურ ზედაპირზე $N = mg$.
HEN: $F_{\text{fr}} = \mu N$; on a horizontal surface $N = mg$.
SKA: $\mu = \dfrac{F}{mg} = \dfrac{12}{40} = 0{,}3$
SEN: $\mu = \dfrac{F}{mg} = \dfrac{12}{40} = 0.3$
AKA: $0{,}3$
AEN: $0.3$

--- medium elastic
KA: ხის ძელი ($2\ \text{კგ}$) მაგიდაზე დევს, ხახუნის კოეფიციენტია $0{,}25$. ძელს ჰორიზონტალურად ზამბარით ($k = 100\ \text{ნ/მ}$) ეწევიან თანაბრად. რამდენით არის ზამბარა გაჭიმული?
EN: A $2\ \text{kg}$ wooden block lies on a table; the coefficient of friction is $0.25$. It is pulled uniformly with a horizontal spring ($k = 100\ \text{N/m}$). How much is the spring stretched?
HKA: ზამბარის დრეკადობის ძალა ხახუნის ძალის ტოლია.
HEN: The spring's elastic force equals the friction force.
SKA: $F_{\text{ხ}} = \mu m g = 0{,}25 \cdot 20 = 5\ \text{ნ}$
$x = \dfrac{5}{100} = 0{,}05\ \text{მ} = 5\ \text{სმ}$
SEN: $F_{\text{fr}} = \mu m g = 0.25 \cdot 20 = 5\ \text{N}$
$x = \dfrac{5}{100} = 0.05\ \text{m} = 5\ \text{cm}$
AKA: $5\ \text{სმ}$
AEN: $5\ \text{cm}$

--- medium elastic
KA: ორი ზამბარიდან პირველი $6\ \text{ნ}$-ით $3\ \text{სმ}$-ით იჭიმება, მეორე $4\ \text{ნ}$-ით $4\ \text{სმ}$-ით. რომელია უფრო ხისტი და რამდენჯერ?
EN: The first of two springs stretches $3\ \text{cm}$ under $6\ \text{N}$, the second $4\ \text{cm}$ under $4\ \text{N}$. Which is stiffer and by how many times?
HKA: შეადარეთ $k = \dfrac{F}{x}$.
HEN: Compare $k = \dfrac{F}{x}$.
SKA: $k_1 = \dfrac{6}{0{,}03} = 200\ \text{ნ/მ}$, $\ k_2 = \dfrac{4}{0{,}04} = 100\ \text{ნ/მ}$
პირველი $2$-ჯერ უფრო ხისტია.
SEN: $k_1 = \dfrac{6}{0.03} = 200\ \text{N/m}$, $\ k_2 = \dfrac{4}{0.04} = 100\ \text{N/m}$
The first is $2$ times stiffer.
AKA: პირველი, $2$-ჯერ
AEN: the first, $2$ times

--- medium elastic
KA: მარხილს ($30\ \text{კგ}$) თოვლზე თანაბრად ეწევიან $15\ \text{ნ}$-ით. რა ძალა იქნება საჭირო, თუ მარხილზე $20\ \text{კგ}$ ბავშვი დაჯდება?
EN: A $30\ \text{kg}$ sledge is pulled uniformly over snow with $15\ \text{N}$. What force will be needed if a $20\ \text{kg}$ child sits on it?
HKA: ხახუნი წნევის ძალის (ანუ მასის) პროპორციულია.
HEN: Friction is proportional to the normal force (i.e. to the mass).
SKA: $\mu = \dfrac{15}{300} = 0{,}05$
$F = 0{,}05 \cdot (30 + 20) \cdot 10 = 25\ \text{ნ}$
SEN: $\mu = \dfrac{15}{300} = 0.05$
$F = 0.05 \cdot (30 + 20) \cdot 10 = 25\ \text{N}$
AKA: $25\ \text{ნ}$
AEN: $25\ \text{N}$

--- medium elastic
KA: ზამბარის სიგრძე $3\ \text{ნ}$ ძალით $14\ \text{სმ}$-ია, $5\ \text{ნ}$-ით — $18\ \text{სმ}$. იპოვეთ დაუტვირთავი სიგრძე და სიხისტე.
EN: A spring is $14\ \text{cm}$ long under $3\ \text{N}$ and $18\ \text{cm}$ under $5\ \text{N}$. Find its unloaded length and stiffness.
HKA: ძალის ნაზრდი $2\ \text{ნ}$ სიგრძეს $4\ \text{სმ}$-ით ზრდის.
HEN: An extra $2\ \text{N}$ adds $4\ \text{cm}$ of length.
SKA: $k = \dfrac{5 - 3}{0{,}18 - 0{,}14} = \dfrac{2}{0{,}04} = 50\ \text{ნ/მ}$
$3\ \text{ნ}$-ზე $x = \dfrac{3}{50} = 0{,}06\ \text{მ} = 6\ \text{სმ}$, $\ l_0 = 14 - 6 = 8\ \text{სმ}$
SEN: $k = \dfrac{5 - 3}{0.18 - 0.14} = \dfrac{2}{0.04} = 50\ \text{N/m}$
At $3\ \text{N}$: $x = \dfrac{3}{50} = 0.06\ \text{m} = 6\ \text{cm}$, $\ l_0 = 14 - 6 = 8\ \text{cm}$
AKA: $8\ \text{სმ}$; $50\ \text{ნ/მ}$
AEN: $8\ \text{cm}$; $50\ \text{N/m}$

--- medium elastic
KA: მძიმე ყუთზე ($50\ \text{კგ}$) $\mu = 0{,}4$. ბიჭი ჰორიზონტალურად $150\ \text{ნ}$-ით უბიძგებს. დაიძვრება ყუთი? რას უდრის ამ დროს ხახუნის ძალა?
EN: A heavy $50\ \text{kg}$ box has $\mu = 0.4$. A boy pushes it horizontally with $150\ \text{N}$. Will it move? What is the friction force then?
HKA: სრიალის ხახუნის მაქსიმალური ძალა $\mu mg$-ია. თუ ბიძგი ნაკლებია, მოქმედებს უძრაობის ხახუნი, რომელიც ბიძგის ტოლია.
HEN: The maximum friction is $\mu mg$. If the push is smaller, static friction equals the push.
SKA: $F_{\max} = 0{,}4 \cdot 500 = 200\ \text{ნ} > 150\ \text{ნ}$ — ყუთი არ დაიძვრება.
უძრაობის ხახუნი $= 150\ \text{ნ}$.
SEN: $F_{\max} = 0.4 \cdot 500 = 200\ \text{N} > 150\ \text{N}$ — the box won't move.
Static friction $= 150\ \text{N}$.
AKA: არ დაიძვრება; $150\ \text{ნ}$
AEN: it won't move; $150\ \text{N}$

--- medium elastic
KA: რატომ არის ურიკის თვლებიანი გადატანა უფრო ადვილი, ვიდრე ტვირთის იატაკზე თრევა? $200\ \text{კგ}$ ტვირთის თრევისას $\mu = 0{,}5$, გორვისას $\mu = 0{,}02$. რამდენჯერ ნაკლები ძალაა საჭირო?
EN: Why is moving a load on wheels easier than dragging it? Dragging a $200\ \text{kg}$ load gives $\mu = 0.5$, rolling gives $\mu = 0.02$. How many times less force is needed?
HKA: გორვის ხახუნი გაცილებით ნაკლებია სრიალის ხახუნზე.
HEN: Rolling friction is much smaller than sliding friction.
SKA: $F_1 = 0{,}5 \cdot 2000 = 1000\ \text{ნ}$, $\ F_2 = 0{,}02 \cdot 2000 = 40\ \text{ნ}$
$\dfrac{F_1}{F_2} = 25$
SEN: $F_1 = 0.5 \cdot 2000 = 1000\ \text{N}$, $\ F_2 = 0.02 \cdot 2000 = 40\ \text{N}$
$\dfrac{F_1}{F_2} = 25$
AKA: $25$-ჯერ
AEN: $25$ times

--- medium elastic
KA: ზამბარიდან, რომლის სიხისტეა $60\ \text{ნ/მ}$, $3$ სმ-იანი გაჭიმვით ტვირთი უძრავად ჰკიდია. რა მასისაა ტვირთი? რა იქნება გაჭიმვა, თუ ტვირთს ორჯერ გავზრდით?
EN: A load hangs at rest from a spring of stiffness $60\ \text{N/m}$, stretching it $3\ \text{cm}$. What is the load's mass? What is the extension if the load is doubled?
HKA: $mg = kx$; წაგრძელება ძალის პროპორციულია.
HEN: $mg = kx$; extension is proportional to force.
SKA: $m = \dfrac{k x}{g} = \dfrac{60 \cdot 0{,}03}{10} = 0{,}18\ \text{კგ} = 180\ \text{გ}$
გაორმაგებისას $x = 6\ \text{სმ}$.
SEN: $m = \dfrac{k x}{g} = \dfrac{60 \cdot 0.03}{10} = 0.18\ \text{kg} = 180\ \text{g}$
When doubled $x = 6\ \text{cm}$.
AKA: $180\ \text{გ}$; $6\ \text{სმ}$
AEN: $180\ \text{g}$; $6\ \text{cm}$

--- medium elastic
KA: მანქანის ($1\ \text{ტ}$) საბურავებსა და მშრალ ასფალტს შორის $\mu = 0{,}7$, სველზე — $0{,}4$, ყინულზე — $0{,}1$. იპოვეთ ხახუნის მაქსიმალური ძალა სამივე შემთხვევაში.
EN: For a $1\ \text{t}$ car, $\mu = 0.7$ on dry asphalt, $0.4$ on wet asphalt and $0.1$ on ice. Find the maximum friction force in each case.
HKA: $F = \mu m g$.
HEN: $F = \mu m g$.
SKA: $mg = 10\,000\ \text{ნ}$
მშრალი: $7000\ \text{ნ}$; სველი: $4000\ \text{ნ}$; ყინული: $1000\ \text{ნ}$.
SEN: $mg = 10\,000\ \text{N}$
Dry: $7000\ \text{N}$; wet: $4000\ \text{N}$; ice: $1000\ \text{N}$.
AKA: $7$; $4$; $1\ \text{კნ}$
AEN: $7$; $4$; $1\ \text{kN}$

--- medium elastic
KA: რეზინის ბაწარი $2\ \text{ნ}$-ით $4\ \text{სმ}$-ით იჭიმება. მას ორად ვკეცავთ (ორი ნახევარი გვერდიგვერდ) და ისევ $2\ \text{ნ}$-ით ვჭიმავთ. რამდენით გაიჭიმება?
EN: A rubber cord stretches $4\ \text{cm}$ under $2\ \text{N}$. It is folded in two (the halves side by side) and pulled again with $2\ \text{N}$. How much does it stretch?
HKA: ნახევარი სიგრძის ბაწარი ორჯერ ხისტია; ორი პარალელური ნახევარი — ოთხჯერ.
HEN: A half-length cord is twice as stiff; two halves side by side are four times as stiff.
SKA: $k = \dfrac{2}{0{,}04} = 50\ \text{ნ/მ}$; ნახევარი: $100\ \text{ნ/მ}$; ორი ერთად: $200\ \text{ნ/მ}$.
$x = \dfrac{2}{200} = 0{,}01\ \text{მ} = 1\ \text{სმ}$
SEN: $k = \dfrac{2}{0.04} = 50\ \text{N/m}$; one half: $100\ \text{N/m}$; two together: $200\ \text{N/m}$.
$x = \dfrac{2}{200} = 0.01\ \text{m} = 1\ \text{cm}$
AKA: $1\ \text{სმ}$
AEN: $1\ \text{cm}$

--- hard elastic
KA: ძელი ($m = 3\ \text{კგ}$, $\mu = 0{,}2$) მაგიდაზე დევს. მას ზემოდან $20\ \text{ნ}$ ძალით აწვებიან და ჰორიზონტალურად თანაბრად ეწევიან. იპოვეთ წევის ძალა.
EN: A $3\ \text{kg}$ block ($\mu = 0.2$) lies on a table. It is pressed down from above with $20\ \text{N}$ and pulled horizontally at constant speed. Find the pulling force.
HKA: წნევის ძალა — სიმძიმის ძალისა და დაწოლის ჯამი.
HEN: The normal force is gravity plus the downward push.
SKA: $N = mg + F_{\text{ზ}} = 30 + 20 = 50\ \text{ნ}$
$F = \mu N = 0{,}2 \cdot 50 = 10\ \text{ნ}$
SEN: $N = mg + F_{\text{down}} = 30 + 20 = 50\ \text{N}$
$F = \mu N = 0.2 \cdot 50 = 10\ \text{N}$
AKA: $10\ \text{ნ}$
AEN: $10\ \text{N}$

--- hard elastic
KA: მაგნიტი ($0{,}2\ \text{კგ}$) ვერტიკალურ რკინის კედელს $10\ \text{ნ}$-ით მიეკრა, $\mu = 0{,}3$. გაჩერდება თუ ჩამოსრიალდება? რა ძალით უნდა ვეზიდოთ ქვემოთ, რომ თანაბრად ჩამოსრიალდეს?
EN: A $0.2\ \text{kg}$ magnet is attracted to a vertical iron wall with $10\ \text{N}$; $\mu = 0.3$. Does it stay or slide down? What downward pull makes it slide down uniformly?
HKA: კედელზე წნევის ძალა მაგნიტური მიზიდვაა; ხახუნი ვერტიკალურად მოქმედებს.
HEN: The normal force on the wall is the magnetic attraction; friction acts vertically.
SKA: $F_{\max} = \mu N = 0{,}3 \cdot 10 = 3\ \text{ნ} > mg = 2\ \text{ნ}$ — მაგნიტი გაჩერდება.
თანაბარი სრიალისთვის: $mg + F = 3\ \text{ნ} \Rightarrow F = 1\ \text{ნ}$.
SEN: $F_{\max} = \mu N = 0.3 \cdot 10 = 3\ \text{N} > mg = 2\ \text{N}$ — the magnet stays.
For uniform sliding: $mg + F = 3\ \text{N} \Rightarrow F = 1\ \text{N}$.
AKA: გაჩერდება; $1\ \text{ნ}$
AEN: it stays; $1\ \text{N}$

--- hard elastic
KA: ორი ზამბარა ($k_1 = 300\ \text{ნ/მ}$, $k_2 = 600\ \text{ნ/მ}$) მიმდევრობით არის შეერთებული. მათზე $6\ \text{ნ}$ ტვირთი ჰკიდია. იპოვეთ თითოეულის წაგრძელება და სისტემის სიხისტე.
EN: Two springs ($k_1 = 300\ \text{N/m}$, $k_2 = 600\ \text{N/m}$) are joined in series and a $6\ \text{N}$ load hangs on them. Find each extension and the stiffness of the pair.
HKA: მიმდევრობით შეერთებისას ორივე ზამბარაზე ერთნაირი ძალა მოქმედებს.
HEN: In series both springs carry the same force.
SKA: $x_1 = \dfrac{6}{300} = 2\ \text{სმ}$, $\ x_2 = \dfrac{6}{600} = 1\ \text{სმ}$
$k = \dfrac{6}{0{,}03} = 200\ \text{ნ/მ}$ $\left(\dfrac{1}{k} = \dfrac{1}{k_1} + \dfrac{1}{k_2}\right)$
SEN: $x_1 = \dfrac{6}{300} = 2\ \text{cm}$, $\ x_2 = \dfrac{6}{600} = 1\ \text{cm}$
$k = \dfrac{6}{0.03} = 200\ \text{N/m}$ $\left(\dfrac{1}{k} = \dfrac{1}{k_1} + \dfrac{1}{k_2}\right)$
AKA: $2\ \text{სმ}$; $1\ \text{სმ}$; $200\ \text{ნ/მ}$
AEN: $2\ \text{cm}$; $1\ \text{cm}$; $200\ \text{N/m}$

--- hard elastic
KA: ორი ძელი ($m_1 = 2\ \text{კგ}$ ზედა, $m_2 = 3\ \text{კგ}$ ქვედა) ერთმანეთზე დევს. ქვედა ძელსა და მაგიდას შორის $\mu = 0{,}2$. ზედა ძელი თოკით კედელზეა მიბმული, ქვედას კი ეწევიან. ძელებს შორის $\mu = 0{,}3$. რა ძალაა საჭირო ქვედა ძელის თანაბრად გამოსაწევად?
EN: Two blocks lie one on another: $m_1 = 2\ \text{kg}$ on top, $m_2 = 3\ \text{kg}$ below. The top block is tied to a wall; the bottom one is pulled out. Between the blocks $\mu = 0.3$, between the bottom block and the table $\mu = 0.2$. What force pulls the bottom block out uniformly?
HKA: ქვედა ძელზე ორი ხახუნი მოქმედებს: ზედა ძელის მხრიდან და მაგიდის მხრიდან.
HEN: Two friction forces act on the bottom block: from the top block and from the table.
SKA: ზემოდან: $F_1 = 0{,}3 \cdot 2 \cdot 10 = 6\ \text{ნ}$
მაგიდიდან: $F_2 = 0{,}2 \cdot (2 + 3) \cdot 10 = 10\ \text{ნ}$
$F = 6 + 10 = 16\ \text{ნ}$
SEN: From above: $F_1 = 0.3 \cdot 2 \cdot 10 = 6\ \text{N}$
From the table: $F_2 = 0.2 \cdot (2 + 3) \cdot 10 = 10\ \text{N}$
$F = 6 + 10 = 16\ \text{N}$
AKA: $16\ \text{ნ}$
AEN: $16\ \text{N}$

--- hard elastic
KA: ზამბარიანი დინამომეტრით ძელს ($1{,}5\ \text{კგ}$) ჯერ მაგიდაზე თანაბრად ათრევენ — ზამბარა $3\ \text{სმ}$-ით იჭიმება, შემდეგ ძელს ვერტიკალურად აკიდებენ — $10\ \text{სმ}$-ით. იპოვეთ ხახუნის კოეფიციენტი და ზამბარის სიხისტე.
EN: With a spring balance a $1.5\ \text{kg}$ block is first dragged uniformly across a table — the spring stretches $3\ \text{cm}$; then the block is hung vertically — it stretches $10\ \text{cm}$. Find the coefficient of friction and the spring's stiffness.
HKA: შეფარდება $\dfrac{x_1}{x_2} = \dfrac{\mu mg}{mg}$.
HEN: The ratio $\dfrac{x_1}{x_2} = \dfrac{\mu mg}{mg}$.
SKA: $k = \dfrac{mg}{x_2} = \dfrac{15}{0{,}1} = 150\ \text{ნ/მ}$
$\mu = \dfrac{x_1}{x_2} = \dfrac{3}{10} = 0{,}3$
SEN: $k = \dfrac{mg}{x_2} = \dfrac{15}{0.1} = 150\ \text{N/m}$
$\mu = \dfrac{x_1}{x_2} = \dfrac{3}{10} = 0.3$
AKA: $\mu = 0{,}3$; $k = 150\ \text{ნ/მ}$
AEN: $\mu = 0.3$; $k = 150\ \text{N/m}$

--- hard elastic
KA: $10\ \text{სმ}$ სიგრძის ზამბარა ($k = 400\ \text{ნ/მ}$) ორ ნაწილად — $4\ \text{სმ}$ და $6\ \text{სმ}$ — გაჭრეს. იპოვეთ თითოეული ნაწილის სიხისტე.
EN: A $10\ \text{cm}$ spring ($k = 400\ \text{N/m}$) is cut into pieces of $4\ \text{cm}$ and $6\ \text{cm}$. Find the stiffness of each piece.
HKA: ერთი და იგივე ძალით თითოეული ნაწილი თავისი სიგრძის პროპორციულად იჭიმება: $k \sim \dfrac{1}{l}$.
HEN: Under the same force each piece stretches in proportion to its length: $k \sim \dfrac{1}{l}$.
SKA: $k_1 = 400 \cdot \dfrac{10}{4} = 1000\ \text{ნ/მ}$
$k_2 = 400 \cdot \dfrac{10}{6} \approx 667\ \text{ნ/მ}$
SEN: $k_1 = 400 \cdot \dfrac{10}{4} = 1000\ \text{N/m}$
$k_2 = 400 \cdot \dfrac{10}{6} \approx 667\ \text{N/m}$
AKA: $1000\ \text{ნ/მ}$; $\approx 667\ \text{ნ/მ}$
AEN: $1000\ \text{N/m}$; $\approx 667\ \text{N/m}$

--- hard elastic
KA: მატარებელი შედგება ლოკომოტივისა და $20$ ერთნაირი ვაგონისგან ($40\ \text{ტ}$ თითო). თითოეულზე წინაღობის ძალა წონის $0{,}005$-ია. რა ძალით არის დაჭიმული ლოკომოტივის ჩანკაბი და მე-$10$ და მე-$11$ ვაგონებს შორის ჩანკაბი თანაბარი მოძრაობისას?
EN: A train has a locomotive and $20$ identical carriages of $40\ \text{t}$ each. The resistance on each is $0.005$ of its weight. At constant speed, what is the tension in the locomotive's coupling and in the coupling between carriages $10$ and $11$?
HKA: ჩანკაბი იმ ვაგონების წინაღობას აწონასწორებს, რომლებიც მის უკანაა.
HEN: A coupling balances the resistance of all the carriages behind it.
SKA: ერთ ვაგონზე: $f = 0{,}005 \cdot 40\,000 \cdot 10 = 2000\ \text{ნ}$
ლოკომოტივის ჩანკაბი: $20 f = 40\ \text{კნ}$
მე-$10$-სა და მე-$11$-ს შორის (უკან $10$ ვაგონი): $10 f = 20\ \text{კნ}$
SEN: On one carriage: $f = 0.005 \cdot 40\,000 \cdot 10 = 2000\ \text{N}$
Locomotive coupling: $20 f = 40\ \text{kN}$
Between $10$ and $11$ ($10$ carriages behind): $10 f = 20\ \text{kN}$
AKA: $40\ \text{კნ}$; $20\ \text{კნ}$
AEN: $40\ \text{kN}$; $20\ \text{kN}$

--- hard elastic
KA: მაგიდაზე ძელი დევს ($m = 4\ \text{კგ}$, $\mu = 0{,}25$). მას ჰორიზონტალურად ზამბარით ($k = 200\ \text{ნ/მ}$) ნელ-ნელა ვეწევით. რა წაგრძელებისას დაიძვრება ძელი? რას უდრის ხახუნის ძალა, როცა ზამბარა $3\ \text{სმ}$-ითაა გაჭიმული?
EN: A $4\ \text{kg}$ block ($\mu = 0.25$) lies on a table and is pulled slowly with a horizontal spring ($k = 200\ \text{N/m}$). At what extension does the block start moving? What is the friction force when the spring is stretched $3\ \text{cm}$?
HKA: სანამ $kx < \mu mg$, ძელი უძრავია და ხახუნი $kx$-ის ტოლია.
HEN: While $kx < \mu mg$ the block stays put and friction equals $kx$.
SKA: $\mu m g = 0{,}25 \cdot 40 = 10\ \text{ნ}$ $\Rightarrow x = \dfrac{10}{200} = 0{,}05\ \text{მ} = 5\ \text{სმ}$
$3\ \text{სმ}$-ზე: $F = 200 \cdot 0{,}03 = 6\ \text{ნ} < 10\ \text{ნ}$ — ძელი უძრავია, ხახუნი $6\ \text{ნ}$-ია.
SEN: $\mu m g = 0.25 \cdot 40 = 10\ \text{N}$ $\Rightarrow x = \dfrac{10}{200} = 0.05\ \text{m} = 5\ \text{cm}$
At $3\ \text{cm}$: $F = 200 \cdot 0.03 = 6\ \text{N} < 10\ \text{N}$ — the block stays and friction is $6\ \text{N}$.
AKA: $5\ \text{სმ}$; $6\ \text{ნ}$
AEN: $5\ \text{cm}$; $6\ \text{N}$

--- easy density
KA: ალუმინის ძელის მოცულობაა $50\ \text{სმ}^3$, მასა — $135\ \text{გ}$. იპოვეთ ალუმინის სიმკვრივე.
EN: An aluminium bar has volume $50\ \text{cm}^3$ and mass $135\ \text{g}$. Find the density of aluminium.
HKA: $\rho = \dfrac{m}{V}$.
HEN: $\rho = \dfrac{m}{V}$.
SKA: $\rho = \dfrac{135}{50} = 2{,}7\ \text{გ/სმ}^3 = 2700\ \text{კგ/მ}^3$
SEN: $\rho = \dfrac{135}{50} = 2.7\ \text{g/cm}^3 = 2700\ \text{kg/m}^3$
AKA: $2700\ \text{კგ/მ}^3$
AEN: $2700\ \text{kg/m}^3$

--- easy density
