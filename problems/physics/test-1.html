KA: ბავშვმა 40 მ გაიარა დასავლეთის მიმართულებით, შემდეგ კი 30 მ ჩრდილოეთის მიმართულებით. ბავშვის მიერ გავლილი მანძილის შეფარდება გადაადგილების მოდულთან არის:
EN: A child walked 40 m west and then 30 m north. The ratio of the distance travelled to the magnitude of the displacement is:
OKA: $1{,}25$
$1{,}3$
$1{,}4$
$1{,}5$
$1{,}75$
OEN: $1.25$
$1.3$
$1.4$
$1.5$
$1.75$
C: 3
SKA: გავლილი მანძილი: $40 + 30 = 70$ მ.
გადაადგილება მართკუთხა სამკუთხედის ჰიპოტენუზაა: $\sqrt{40^2 + 30^2} = 50$ მ.
$70 : 50 = 1{,}4$
SEN: Distance travelled: $40 + 30 = 70$ m.
The displacement is the hypotenuse: $\sqrt{40^2 + 30^2} = 50$ m.
$70 : 50 = 1.4$

EN: A proton and an $\alpha$ particle with equal kinetic energies enter identical uniform magnetic fields perpendicular to the field lines. The Lorentz force on the proton is $F$. What is the Lorentz force on the $\alpha$ particle? The $\alpha$ particle has 4 times the proton's mass and twice its charge.

$F_\alpha = q_\alpha v_\alpha B = 2q \cdot \dfrac v2 \cdot B = qvB = F$

EN: How does the absolute temperature of a given mass of ideal gas change when its volume grows 16 times, if the product of the volume and the square of the pressure stays constant, $VP^2 = \mathrm{const}$?

SKA: ავღნიშნოთ $F_0 = \dfrac{kq^2}{d^2}$. შუა მუხტზე: კიდურა $q$ უბიძგებს $F_0$-ით, $2q$ — საწინააღმდეგოდ $2F_0$-ით; ჯამი $F_0 = 8$ ნ.
კიდურა $q$-ზე ორივე ძალა ერთი მიმართულებისაა: $F_0 + \dfrac{k \cdot q \cdot 2q}{(2d)^2} = F_0 + \dfrac{F_0}{2} = 12$ ნ.
SEN: Let $F_0 = \dfrac{kq^2}{d^2}$. On the middle charge the end $q$ pushes with $F_0$ and $2q$ pushes the other way with $2F_0$; the net force is $F_0 = 8$ N.
On the end $q$ both forces point the same way: $F_0 + \dfrac{k \cdot q \cdot 2q}{(2d)^2} = F_0 + \dfrac{F_0}{2} = 12$ N.

KA: რხევით კონტურში მაქსიმალური დენის ძალაა $I_0$. რისი ტოლი იქნება დენის ძალა მაშინ, როდესაც კონდენსატორის ენერგია 2-ჯერ მეტი იქნება კოჭას ენერგიაზე?
EN: The maximum current in an oscillating LC circuit is $I_0$. What is the current when the capacitor's energy is twice the coil's energy?
O: $I_0/3$
$I_0/2$
$I_0/\sqrt3$
$I_0/\sqrt2$
$I_0\sqrt{\tfrac23}$
C: 3
SKA: სრული ენერგია $W = \dfrac{LI_0^2}{2}$. თუ $W_C = 2W_L$, მაშინ $W_L = \dfrac W3$.
$\dfrac{LI^2}{2} = \dfrac13 \cdot \dfrac{LI_0^2}{2} \Rightarrow I = \dfrac{I_0}{\sqrt3}$

EN: A charged particle initially at rest is accelerated through a voltage $U$ and then enters a uniform magnetic field perpendicular to the field lines, where it moves on a circle of radius $R$. The second time the same particle is accelerated through $4U$ and enters the same field the same way. What is the radius of its circle now?

OEN: radius $R/4$
radius $R/2$
radius $R$
radius $2R$

C: 4
SKA: $qU = \dfrac{mv^2}{2} \Rightarrow v \sim \sqrt U$, ხოლო $R = \dfrac{mv}{qB} \sim v$.

SEN: $qU = \dfrac{mv^2}{2} \Rightarrow v \sim \sqrt U$, and $R = \dfrac{mv}{qB} \sim v$.
The voltage grew 4 times $\Rightarrow v$ and $R$ double: $2R$.

EN: An ideal gas of constant mass goes through the cycle 1-2-3-1 shown. In state 1 its absolute temperature is $T_0$; $p_0$ and $V_0$ are given. The internal energy of the gas is $U = \dfrac32\nu RT$, where $\nu$ is the amount of substance, $R$ the universal gas constant and $T$ the absolute temperature. Find:
1) the absolute temperature in state 2;
2) the amount of substance of the gas;
3) the work done by the gas over the cycle;
4) the heat received by the gas in process 1-2;
5) the heat given off by the gas in process 3-1.

2) $p_0 V_0 = \nu R T_0 \Rightarrow \nu = \dfrac{p_0 V_0}{RT_0}$.
3) ციკლის მუშაობა სამკუთხედის ფართობია (საათის ისრის მიმართულებით — დადებითი): $A = \dfrac12 \cdot 3V_0 \cdot 3p_0 = 4{,}5p_0V_0$.
4) 1-2 იზოქორაა: $Q_{12} = \Delta U = \dfrac32\nu R(4T_0 - T_0) = \dfrac92 p_0V_0 = 4{,}5p_0V_0$.
5) 3-1 იზობარული შეკუმშვაა ($T_3 = 4T_0$-დან $T_0$-მდე): $|Q_{31}| = \dfrac52\nu R \cdot 3T_0 = \dfrac52 p_0 \cdot 3V_0 = 7{,}5p_0V_0$.
SEN: 1) $\dfrac{pV}{T} = \mathrm{const}$: $T_2 = T_0 \cdot \dfrac{4p_0 V_0}{p_0 V_0} = 4T_0$.
2) $p_0 V_0 = \nu R T_0 \Rightarrow \nu = \dfrac{p_0 V_0}{RT_0}$.
3) The work of the cycle is the area of the triangle (clockwise, so positive): $A = \dfrac12 \cdot 3V_0 \cdot 3p_0 = 4.5p_0V_0$.
4) 1-2 is isochoric: $Q_{12} = \Delta U = \dfrac32\nu R(4T_0 - T_0) = \dfrac92 p_0V_0 = 4.5p_0V_0$.
5) 3-1 is an isobaric compression (from $T_3 = 4T_0$ to $T_0$): $|Q_{31}| = \dfrac52\nu R \cdot 3T_0 = \dfrac52 p_0 \cdot 3V_0 = 7.5p_0V_0$.

KA: საწყის მომენტში ერთი პროტონი უძრავია, ხოლო მეორე მოძრაობს პირველისკენ $v_0$ სიჩქარით. ამ მომენტში პროტონებს შორის მანძილია $r$, ხოლო მათი ურთიერთქმედების ძალაა $F$. განსაზღვრეთ პროტონებს შორის მინიმალური მანძილი შემდგომი მოძრაობისას. პროტონის მასაა $m$. (გაითვალისწინეთ მხოლოდ ელექტრული ურთიერთქმედება.)
EN: At the start one proton is at rest and the other moves toward it with speed $v_0$. At this moment the distance between them is $r$ and the force between them is $F$. Find the minimum distance between the protons in the subsequent motion. The proton mass is $m$. (Take only the electric interaction into account.)
SKA: მინიმალურ მანძილზე პროტონების სიჩქარეები ტოლია. იმპულსის შენახვა: $mv_0 = 2mu \Rightarrow u = \dfrac{v_0}{2}$.
კინეტიკური ენერგიის შემცირება: $\dfrac{mv_0^2}{2} - 2 \cdot \dfrac{m u^2}{2} = \dfrac{mv_0^2}{4}$.
კულონის კანონიდან $ke^2 = Fr^2$, ამიტომ ურთიერთქმედების ენერგია $W = \dfrac{ke^2}{x} = \dfrac{Fr^2}{x}$.
ენერგიის შენახვა: $\dfrac{Fr^2}{r_{min}} = Fr + \dfrac{mv_0^2}{4}$.
$r_{min} = \dfrac{4Fr^2}{4Fr + mv_0^2}$
SEN: At the minimum distance the protons have equal velocities. Momentum: $mv_0 = 2mu \Rightarrow u = \dfrac{v_0}{2}$.
Loss of kinetic energy: $\dfrac{mv_0^2}{2} - 2 \cdot \dfrac{m u^2}{2} = \dfrac{mv_0^2}{4}$.
Coulomb's law gives $ke^2 = Fr^2$, so the interaction energy is $W = \dfrac{ke^2}{x} = \dfrac{Fr^2}{x}$.
Energy conservation: $\dfrac{Fr^2}{r_{min}} = Fr + \dfrac{mv_0^2}{4}$.
$r_{min} = \dfrac{4Fr^2}{4Fr + mv_0^2}$
AKA: $r_{min} = \dfrac{4Fr^2}{4Fr + mv_0^2}$
AEN: $r_{min} = \dfrac{4Fr^2}{4Fr + mv_0^2}$

KA: გლუვ ზედაპირზე მოთავსებული $m$ მასის ძელაკი $k$ სიხისტის ჰორიზონტალური ზამბარით მიმაგრებულია კედელთან (იხ. ნახ.). თავდაპირველად ძელაკი უძრავია, ხოლო ზამბარა არაა დეფორმირებული. ამ ძელაკს დრეკადად ეჯახება ზამბარის გასწვრივ $v$ სიჩქარით მოძრავი $m$ მასის ძელაკი. დაჯახების დრო ძალზე მცირეა, ამიტომ დაჯახების პროცესში ზამბარა ვერ ასწრებს შეკუმშვას. ხახუნი უგულებელყავით. განსაზღვრეთ:
1) ძელაკების სიჩქარე დაჯახების ბოლოს;
2) ზამბარის მაქსიმალური შეკუმშვა;
3) კედელზე მოქმედი მაქსიმალური ძალა;
4) პირველი დაჯახების მომენტიდან რა დროში დაეჯახებიან ძელაკები ერთმანეთს ხელმეორედ.
EN: A block of mass $m$ on a smooth surface is attached to a wall by a horizontal spring of stiffness $k$ (see the figure). At first the block is at rest and the spring is undeformed. A block of mass $m$ moving along the spring with speed $v$ hits it elastically. The collision is very short, so the spring has no time to compress during it. Ignore friction. Find:
1) the speeds of the blocks right after the collision;
2) the maximum compression of the spring;
3) the maximum force on the wall;
4) how long after the first collision the blocks collide again.
