KA: შეურიეს ტოლი მასის ორი სითხე, რომელთა სიმკვრივეებია 800 კგ/მ³ და 1200 კგ/მ³. რისი ტოლია ნარევის სიმკვრივე? ჩათვალეთ, რომ ნარევის მოცულობა სითხეების მოცულობების ჯამის ტოლია.
EN: Equal masses of two liquids with densities 800 kg/m³ and 1200 kg/m³ are mixed. What is the density of the mixture? Assume the volume of the mixture equals the sum of the volumes.
OKA: $900$ კგ/მ³
$960$ კგ/მ³
$1000$ კგ/მ³
$1040$ კგ/მ³
$2000$ კგ/მ³
OEN: $900$ kg/m³
$960$ kg/m³
$1000$ kg/m³
$1040$ kg/m³
$2000$ kg/m³
C: 2
SKA: ვთქვათ, თითოეულის მასაა $m$. მოცულობები: $\dfrac{m}{800}$ და $\dfrac{m}{1200}$.
$\rho = \dfrac{2m}{\frac{m}{800} + \frac{m}{1200}} = \dfrac{2}{\frac{3 + 2}{2400}} = \dfrac{4800}{5} = 960$ კგ/მ³
SEN: Let each mass be $m$. The volumes are $\dfrac{m}{800}$ and $\dfrac{m}{1200}$.
$\rho = \dfrac{2m}{\frac{m}{800} + \frac{m}{1200}} = \dfrac{2}{\frac{3 + 2}{2400}} = \dfrac{4800}{5} = 960$ kg/m³

KA: ლიფტი ზევით მოძრაობს 2 მ/წმ² აჩქარებით. რისი ტოლია ლიფტში მდგარი 60 კგ მასის ადამიანის წონა?
EN: A lift accelerates upward at 2 m/s². What is the weight of a 60 kg person standing in it?
OKA: $480$ ნ
$600$ ნ
$620$ ნ
$720$ ნ
$1200$ ნ
OEN: $480$ N
$600$ N
$620$ N
$720$ N
$1200$ N
C: 4
SKA: $N - mg = ma \Rightarrow N = m(g + a) = 60 \cdot 12 = 720$ ნ.
ნიუტონის III კანონით ადამიანი იატაკს ამავე ძალით აწვება — ეს მისი წონაა.
SEN: $N - mg = ma \Rightarrow N = m(g + a) = 60 \cdot 12 = 720$ N.
By Newton's third law the person presses on the floor with the same force — that is the weight.

EN: A ball moving at speed $v$ makes an elastic head-on collision with an identical ball at rest. What are the speeds of the balls (first, second) after the collision?
O: $v/2$ და $v/2$
$v$ და $0$
$v$ და $v$
$0$ და $v/2$
$0$ და $v$

SKA: იმპულსი: $v = v_1 + v_2$; ენერგია: $v^2 = v_1^2 + v_2^2$.

KA: ლითონისთვის ფოტოეფექტის წითელი საზღვარია 500 ნმ. ლითონს ანათებენ 400 ნმ ტალღის სიგრძის სინათლით. განსაზღვრეთ ფოტოელექტრონების მაქსიმალური კინეტიკური ენერგია და შემაკავებელი ძაბვა. $h = 6{,}6 \cdot 10^{-34}$ ჯ·წმ, $c = 3 \cdot 10^8$ მ/წმ, $e = 1{,}6 \cdot 10^{-19}$ კ.
EN: The red limit of the photoelectric effect for a metal is 500 nm. The metal is lit with light of wavelength 400 nm. Find the maximum kinetic energy of the photoelectrons and the stopping voltage. $h = 6.6 \cdot 10^{-34}$ J·s, $c = 3 \cdot 10^8$ m/s, $e = 1.6 \cdot 10^{-19}$ C.
SKA: გამოსვლის მუშაობა: $A = \dfrac{hc}{\lambda_0}$. აინშტაინის განტოლება: $E_{\text{კ}} = hc\left(\dfrac1\lambda - \dfrac1{\lambda_0}\right)$.
$E_{\text{კ}} = 6{,}6 \cdot 10^{-34} \cdot 3 \cdot 10^8 \cdot (2{,}5 - 2) \cdot 10^6 = 9{,}9 \cdot 10^{-20}$ ჯ.
$eU_{\text{შ}} = E_{\text{კ}} \Rightarrow U_{\text{შ}} = \dfrac{9{,}9 \cdot 10^{-20}}{1{,}6 \cdot 10^{-19}} \approx 0{,}62$ ვ.
SEN: Work function: $A = \dfrac{hc}{\lambda_0}$. Einstein's equation: $E_k = hc\left(\dfrac1\lambda - \dfrac1{\lambda_0}\right)$.
$E_k = 6.6 \cdot 10^{-34} \cdot 3 \cdot 10^8 \cdot (2.5 - 2) \cdot 10^6 = 9.9 \cdot 10^{-20}$ J.
$eU_s = E_k \Rightarrow U_s = \dfrac{9.9 \cdot 10^{-20}}{1.6 \cdot 10^{-19}} \approx 0.62$ V.
AKA: $E_{\text{კ}} \approx 9{,}9 \cdot 10^{-20}$ ჯ, $U \approx 0{,}62$ ვ
AEN: $E_k \approx 9.9 \cdot 10^{-20}$ J, $U \approx 0.62$ V

4) $Q_{\text{მიღ}} = 1{,}5p_0V_0 + 10p_0V_0 = 11{,}5p_0V_0$ (3-4 და 4-1 უბნებზე აირი სითბოს გასცემს).
5) $\eta = \dfrac{A}{Q_{\text{მიღ}}} = \dfrac{2}{11{,}5} \approx 0{,}174 = 17{,}4\%$.
SEN: 1) The work of the cycle is the area of the rectangle: $A = (2p_0 - p_0)(3V_0 - V_0) = 2p_0V_0$.
2) 1-2 is isochoric: $Q_{12} = \Delta U = \dfrac32(2p_0V_0 - p_0V_0) = 1.5p_0V_0$.
3) 2-3 is isobaric: $Q_{23} = \dfrac52p\Delta V = \dfrac52 \cdot 2p_0 \cdot 2V_0 = 10p_0V_0$.
4) $Q_{in} = 1.5p_0V_0 + 10p_0V_0 = 11.5p_0V_0$ (in 3-4 and 4-1 the gas gives off heat).
5) $\eta = \dfrac{A}{Q_{in}} = \dfrac{2}{11.5} \approx 0.174 = 17.4\%$.
AKA: 1) $2p_0V_0$; 2) $1{,}5p_0V_0$; 3) $10p_0V_0$; 4) $11{,}5p_0V_0$; 5) $\approx 17{,}4\%$

KA: 50 მკფ ტევადობის კონდენსატორი დამუხტეს 100 ვ ძაბვამდე და მიუერთეს 0,5 ჰნ ინდუქციურობის კოჭას. წინაღობა უგულებელყავით. განსაზღვრეთ:
1) კონტურის სრული ენერგია;
2) კონდენსატორის მაქსიმალური მუხტი;
3) დენის ძალის მაქსიმალური მნიშვნელობა;
4) თავისუფალი რხევების პერიოდი;
5) დენის ძალა იმ მომენტში, როცა კონდენსატორზე ძაბვა 60 ვ-ია.
EN: A 50 μF capacitor is charged to 100 V and connected to a 0.5 H coil. Ignore resistance. Find:
1) the total energy of the circuit;
2) the maximum charge on the capacitor;
3) the maximum current;
4) the period of the free oscillations;
5) the current at the moment when the voltage on the capacitor is 60 V.
SKA: 1) $W = \dfrac{CU_0^2}{2} = \dfrac{50 \cdot 10^{-6} \cdot 10^4}{2} = 0{,}25$ ჯ.
2) $q_0 = CU_0 = 50 \cdot 10^{-6} \cdot 100 = 5 \cdot 10^{-3}$ კ.
3) $\dfrac{LI_0^2}{2} = W \Rightarrow I_0 = \sqrt{\dfrac{2W}{L}} = \sqrt{\dfrac{0{,}5}{0{,}5}} = 1$ ა.
4) $T = 2\pi\sqrt{LC} = 2\pi\sqrt{0{,}5 \cdot 5 \cdot 10^{-5}} = 2\pi \cdot 5 \cdot 10^{-3} \approx 0{,}031$ წმ.
5) $\dfrac{LI^2}{2} = \dfrac{C(U_0^2 - U^2)}{2} \Rightarrow I = \sqrt{\dfrac CL}\sqrt{U_0^2 - U^2} = 0{,}01 \cdot 80 = 0{,}8$ ა.
SEN: 1) $W = \dfrac{CU_0^2}{2} = \dfrac{50 \cdot 10^{-6} \cdot 10^4}{2} = 0.25$ J.
2) $q_0 = CU_0 = 50 \cdot 10^{-6} \cdot 100 = 5 \cdot 10^{-3}$ C.
3) $\dfrac{LI_0^2}{2} = W \Rightarrow I_0 = \sqrt{\dfrac{2W}{L}} = \sqrt{\dfrac{0.5}{0.5}} = 1$ A.
4) $T = 2\pi\sqrt{LC} = 2\pi\sqrt{0.5 \cdot 5 \cdot 10^{-5}} = 2\pi \cdot 5 \cdot 10^{-3} \approx 0.031$ s.
5) $\dfrac{LI^2}{2} = \dfrac{C(U_0^2 - U^2)}{2} \Rightarrow I = \sqrt{\dfrac CL}\sqrt{U_0^2 - U^2} = 0.01 \cdot 80 = 0.8$ A.
AKA: 1) $0{,}25$ ჯ; 2) $5 \cdot 10^{-3}$ კ; 3) $1$ ა; 4) $\approx 0{,}031$ წმ; 5) $0{,}8$ ა
AEN: 1) $0.25$ J; 2) $5 \cdot 10^{-3}$ C; 3) $1$ A; 4) $\approx 0.031$ s; 5) $0.8$ A
